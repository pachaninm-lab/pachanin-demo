name: Apply public assistant attachment route repair

on:
  push:
    branches:
      - fix/public-assistant-attachments-public-route-20260802
    paths:
      - scripts/apply-public-assistant-attachments-public-route.py
      - .github/workflows/apply-public-assistant-attachments-public-route.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-public-assistant-attachments-public-route
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/public-assistant-attachments-public-route-20260802
          fetch-depth: 0

      - name: Rebase onto exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main fix/public-assistant-attachments-public-route-20260802
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rebase origin/main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"

      - name: Apply and verify bounded source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-public-assistant-attachments-public-route.py
          grep -Fq "'/api/public-platform-assistant/attachments'" apps/web/middleware.ts
          grep -Fq "public assistant attachment middleware boundary" apps/web/tests/unit/platformV7PublicAssistantAttachmentMiddleware.test.ts
          git diff --check

      - name: Publish reviewed source result only
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main fix/public-assistant-attachments-public-route-20260802
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/fix/public-assistant-attachments-public-route-20260802)" = "$EXPECTED_HEAD"

          git rm -f --ignore-unmatch \
            scripts/apply-public-assistant-attachments-public-route.py \
            .github/workflows/apply-public-assistant-attachments-public-route.yml \
            docs/platform-v7/autopilot/scopes/public-assistant-attachments-public-route-20260802.json
          git add -A
          git diff --cached --name-only | sort | tee /tmp/changed.txt

          grep -Fxq 'apps/web/middleware.ts' /tmp/changed.txt
          grep -Fxq 'apps/web/tests/unit/platformV7PublicAssistantAttachmentMiddleware.test.ts' /tmp/changed.txt
          if grep -Ev '^([.]github/workflows/apply-public-assistant-attachments-public-route[.]yml|apps/web/middleware[.]ts|apps/web/tests/unit/platformV7PublicAssistantAttachmentMiddleware[.]test[.]ts|docs/platform-v7/autopilot/scopes/public-assistant-attachments-public-route-20260802[.]json|scripts/apply-public-assistant-attachments-public-route[.]py)$' /tmp/changed.txt; then
            echo 'Final diff exceeds the registered bounded repair scope.' >&2
            exit 31
          fi

          git commit -m 'fix(tai): expose bounded attachment endpoint publicly'
          git push --force-with-lease="refs/heads/fix/public-assistant-attachments-public-route-20260802:${EXPECTED_HEAD}" \
            origin HEAD:refs/heads/fix/public-assistant-attachments-public-route-20260802
