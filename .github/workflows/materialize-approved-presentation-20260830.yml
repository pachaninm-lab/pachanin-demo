name: Materialize approved presentation binary

on:
  push:
    branches:
      - fix/static-presentation-download-buildtime-20260830
    paths:
      - .github/workflows/materialize-approved-presentation-20260830.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/static-presentation-download-buildtime-20260830
          fetch-depth: 1

      - name: Fetch and validate approved PDF
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.usercontent.google.com/download?id=11qCiCF_svPoqsh4ZczBxFi1CehQnDAiZ&export=download&confirm=t'
          path='apps/web/public/downloads/prozrachnaya-tsena-presentation.pdf'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          curl -fL --retry 4 --retry-all-errors --connect-timeout 15 --max-time 90 -o "$tmp" "$url"
          bytes="$(wc -c < "$tmp" | tr -d '[:space:]')"
          sha="$(sha256sum "$tmp" | awk '{print $1}')"
          signature="$(head -c 5 "$tmp")"
          pages="$(node -e "const fs=require('fs');const s=fs.readFileSync(process.argv[1]).toString('latin1');console.log((s.match(/\\/Type\\s*\\/Page\\b/g)||[]).length)" "$tmp")"

          test "$bytes" -gt 100000
          test "$bytes" -lt 5000000
          test "$signature" = '%PDF-'
          test "$pages" = '14'
          tail -c 256 "$tmp" | grep -q '%%EOF'

          mkdir -p "$(dirname "$path")"
          cp "$tmp" "$path"

          echo "APPROVED_PDF_BYTES=$bytes"
          echo "APPROVED_PDF_PAGES=$pages"
          echo "APPROVED_PDF_SHA256=$sha"

      - name: Commit approved PDF to PR branch
        shell: bash
        run: |
          set -euo pipefail
          path='apps/web/public/downloads/prozrachnaya-tsena-presentation.pdf'
          git add "$path"
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): commit approved presentation PDF'
          git push origin HEAD:fix/static-presentation-download-buildtime-20260830
