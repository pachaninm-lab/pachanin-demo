name: Role Eligibility FNS RSMP Production Shadow Import

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  DEFAULT_HOST: 195.19.12.120
  EVIDENCE_DIR: artifacts/role-eligibility-fns-rsmp-production-import
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

concurrency:
  group: role-eligibility-fns-rsmp-production-import
  cancel-in-progress: false

jobs:
  import:
    name: Import FNS RSMP positive shadow evidence
    if: >-
      github.event.issue.number == 4922 &&
      github.event.comment.body == '/role-eligibility fns-rsmp import current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind importer to exact current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          api_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$api_main" ]]
          [[ "$target" == "$GITHUB_SHA" ]] || { echo FNS_RSMP_IMPORT_MAIN_DRIFT >&2; exit 14; }
          printf '%s\n' "$target" > "$EVIDENCE_DIR/target-sha.txt"
          node scripts/production-role-eligibility-fns-rsmp-import.cjs --self-test | tee "$EVIDENCE_DIR/self-test.txt"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo FNS_RSMP_CANONICAL_VPS_MISMATCH >&2; exit 20; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo FNS_RSMP_PRODUCTION_PRINCIPAL_INVALID >&2; exit 21; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 22
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo FNS_RSMP_PINNED_HOST_FINGERPRINT_REQUIRED >&2; exit 23; }
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"; ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c; [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || { echo FNS_RSMP_NO_VALID_PRIVATE_KEY >&2; exit 24; }
          scan="$(mktemp)"; match="$(mktemp)"; pinned=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned" == 1 ]] || { rm -f "$scan" "$match"; echo FNS_RSMP_PINNED_HOST_KEY_MISMATCH >&2; exit 25; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Import positive-only FNS RSMP evidence inside exact-SHA API namespace
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat "$EVIDENCE_DIR/target-sha.txt")"
          remote='set -euo pipefail;
            test "$(id -u)" -eq 0;
            mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.service=api");
            (( ${#api_ids[@]} == 1 )) || { echo FNS_RSMP_API_AUTHORITY_AMBIGUOUS >&2; exit 30; };
            api_id="${api_ids[0]}";
            api_image="$(docker inspect --format "{{.Image}}" "$api_id")";
            api_revision="$(docker image inspect --format "{{index .Config.Labels \"org.opencontainers.image.revision\"}}" "$api_image")";
            [[ "$api_revision" == "$TARGET_SHA" ]] || { echo FNS_RSMP_API_REVISION_MISMATCH >&2; exit 31; };
            worker_id="$(docker inspect --format "{{.Id}}" pc-role-eligibility-worker 2>/dev/null || true)";
            [[ "$worker_id" =~ ^[0-9a-f]{64}$ ]] || { echo FNS_RSMP_WORKER_NOT_FOUND >&2; exit 32; };
            worker_image="$(docker inspect --format "{{.Image}}" "$worker_id")";
            worker_revision="$(docker image inspect --format "{{index .Config.Labels \"org.opencontainers.image.revision\"}}" "$worker_image")";
            [[ "$worker_revision" == "$TARGET_SHA" ]] || { echo FNS_RSMP_WORKER_REVISION_MISMATCH >&2; exit 33; };
            shadow="$(docker inspect "$worker_id" | python3 -c "import json,sys; e=dict(x.split(\"=\",1) for x in json.load(sys.stdin)[0].get(\"Config\",{}).get(\"Env\",[]) if \"=\" in x); print(e.get(\"ROLE_ELIGIBILITY_SHADOW_MODE\",\"\"))")";
            enforcement="$(docker inspect "$worker_id" | python3 -c "import json,sys; e=dict(x.split(\"=\",1) for x in json.load(sys.stdin)[0].get(\"Config\",{}).get(\"Env\",[]) if \"=\" in x); print(e.get(\"ROLE_ELIGIBILITY_ENFORCEMENT\",\"\"))")";
            [[ "$shadow" == true && "$enforcement" == false ]] || { echo FNS_RSMP_WORKER_MODE_INVALID >&2; exit 34; };
            docker exec -i "$api_id" /nodejs/bin/node -'
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER_SECRET@$HOST" "TARGET_SHA='$target' bash -c '$remote'" \
            < scripts/production-role-eligibility-fns-rsmp-import.cjs \
            > "$EVIDENCE_DIR/import.json"

      - name: Validate aggregate import evidence
        shell: bash
        run: |
          set -euo pipefail
          node - "$EVIDENCE_DIR/import.json" <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.schemaVersion !== 'role-eligibility-fns-rsmp-shadow-import.v1' || p.source !== 'FNS_RSMP') throw new Error('FNS_RSMP_IMPORT_REPORT_INVALID');
          if (p.shadowMode !== true || p.enforcement !== false || p.admissionAuthority !== false || p.automaticNegativeAuthority !== false) throw new Error('FNS_RSMP_IMPORT_AUTHORITY_BOUNDARY_INVALID');
          if (p.registrationTouched !== false || p.absenceSemantics !== 'ABSENCE_IS_NOT_NEGATIVE_LEGAL_ENTITY_EVIDENCE') throw new Error('FNS_RSMP_IMPORT_SEMANTICS_INVALID');
          for (const k of ['candidates','uniqueSubjects','entriesScanned','matchedSubjects','evidenceInserted']) if (!Number.isInteger(p[k]) || p[k] < 0) throw new Error(`FNS_RSMP_IMPORT_COUNT_INVALID:${k}`);
          const forbidden = /(?:^|_)(?:inn|ogrn|kpp|legal_name|tenant_id|organization_id|application_id|email|phone|password|secret|token)(?:$|_)/i;
          const walk = (v) => { if (!v || typeof v !== 'object') return; for (const [k,c] of Object.entries(v)) { if (forbidden.test(k)) throw new Error('FNS_RSMP_REPORT_PII_KEY_FORBIDDEN'); walk(c); } };
          walk(p);
          console.log(`FNS_RSMP_SHADOW_IMPORT=PASS candidates=${p.candidates} matched=${p.matchedSubjects} evidence_inserted=${p.evidenceInserted}`);
          NODE

      - name: Publish aggregate checkpoint to authority issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat "$EVIDENCE_DIR/target-sha.txt")"
          read -r candidates matched inserted < <(node -e "const p=require('./$EVIDENCE_DIR/import.json'); console.log(p.candidates,p.matchedSubjects,p.evidenceInserted)")
          gh issue comment 4922 --repo "$GITHUB_REPOSITORY" --body "## FNS RSMP production shadow import $GITHUB_RUN_ID

- target SHA: \`$target\`
- candidate checks: \`$candidates\`
- matched subjects: \`$matched\`
- new evidence rows: \`$inserted\`
- source: official FNS RSMP snapshot
- semantics: supplementary positive-only
- absence is not negative evidence
- registration touched: \`0\`
- enforcement: \`false\`
- automatic final rejection: \`0\`

This import does not authorize cutover."

      - name: Upload immutable aggregate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-eligibility-fns-rsmp-production-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Cleanup bounded credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
