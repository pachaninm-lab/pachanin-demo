name: TAI Public Agro Semantic Live Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tai-public-agro-semantic-live-acceptance.yml'
      - 'apps/web/next.config.js'
      - 'docs/platform-v7/autopilot/scopes/fix-qwen-broad-agro-semantic-acceptance.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tai-public-agro-semantic-live-acceptance.yml'
      - 'apps/web/next.config.js'
      - 'apps/web/components/platform-v7/PublicPlatformAssistant.tsx'
      - 'apps/web/app/api/restricted-public-platform-assistant/route.ts'
      - 'apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter VERIFY-PUBLIC-AGRO-SEMANTICS
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: tai-public-agro-semantic-live-acceptance
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai

jobs:
  live-semantic-acceptance:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'VERIFY-PUBLIC-AGRO-SEMANTICS'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve governed production target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            manifest="$RUNNER_TEMP/live-manifest.json"
            curl -fsS --connect-timeout 10 --max-time 30 \
              "$LIVE_BASE/manifest-pc-deploy.json?semantic_pr=${{ github.event.pull_request.head.sha }}&ts=$(date +%s%N)" \
              -o "$manifest"
            target="$(python3 - "$manifest" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('commitSha', ''))
          PY
            )"
            [[ "$target" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$target" origin/main
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            target='${{ inputs.target_sha }}'
            [[ "$target" =~ ^[0-9a-f]{40}$ ]]
            [[ "$target" == "$(git rev-parse origin/main)" ]]
          else
            target='${{ github.sha }}'
            [[ "$target" =~ ^[0-9a-f]{40}$ ]]
            [[ "$target" == "$(git rev-parse origin/main)" ]]
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Wait for exact REG.RU deployment manifest
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          mkdir -p "$RUNNER_TEMP/tai-public-agro-semantic"
          for attempt in $(seq 1 540); do
            manifest="$RUNNER_TEMP/tai-public-agro-semantic/manifest.json"
            if curl -fsS --connect-timeout 10 --max-time 30 \
              "$LIVE_BASE/manifest-pc-deploy.json?semantic=$TARGET_SHA&attempt=$attempt&ts=$(date +%s%N)" \
              -o "$manifest"; then
              deployed="$(python3 - "$manifest" <<'PY'
          import json, pathlib, sys
          try:
              payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
              print(payload.get('commitSha', ''))
          except Exception:
              print('')
          PY
              )"
              if [[ "$deployed" == "$TARGET_SHA" ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo "Exact production manifest did not reach $TARGET_SHA." >&2; exit 2; }
          echo "LIVE_MANIFEST_EXACT_SHA=$TARGET_SHA"

      - name: Verify substantive broad-agro response in live Chromium
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/tai-public-agro-semantic/evidence
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tai-public-agro-semantic/playwright"
          rm -rf "$work"
          mkdir -p "$work" "$EVIDENCE_DIR"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts playwright@1.59.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { chromium } = require('playwright');

          const liveBase = process.env.LIVE_BASE;
          const targetSha = process.env.TARGET_SHA;
          const evidenceDir = process.env.EVIDENCE_DIR;
          if (!liveBase || !/^[0-9a-f]{40}$/.test(targetSha || '') || !evidenceDir) process.exit(2);

          const refusalPatterns = [
            /нет подтвержд[её]нного основания/iu,
            /^(?:извините[,!. ]*)?(?:я )?не могу\b/iu,
            /произошла (?:техническая )?ошибка/iu,
            /не удалось (?:получить|сформировать|обработать|ответить)/iu,
            /(?:сервис|модель|помощник) (?:временно )?недоступ/iu,
            /попробуйте (?:ещ[её] раз )?позже/iu,
            /вне (?:моей|сферы) компетенции/iu,
            /не располагаю (?:достаточной )?(?:информацией|данными)/iu,
          ];
          const factorFamilies = [
            ['quality', /(качест|клейковин|протеин|белок|влажност|натур)/iu],
            ['supplyDemand', /(спрос|предложен|баланс рынк|потреблен)/iu],
            ['harvestStocks', /(урожа|валов|запас|остатк|посевн)/iu],
            ['exportWorld', /(экспорт|импорт|миров|бирж|черномор|внешн.*рын)/iu],
            ['currency', /(курс|рубл|валют)/iu],
            ['logisticsStorage', /(логист|транспорт|фрахт|достав|элеватор|хранен)/iu],
            ['seasonWeather', /(сезон|погод|засух|осадк|температур|климат)/iu],
            ['policy', /(пошлин|квот|субсид|регулирован|господдерж|налог)/iu],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, locale: 'ru-RU' });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            try {
              const response = await page.goto(`${liveBase}/platform-v7?lang=ru&semantic=${targetSha}`, {
                waitUntil: 'domcontentloaded',
                timeout: 120000,
              });
              if (!response || !response.ok()) throw new Error(`live_page_http_${response?.status()}`);

              const manifest = await page.evaluate(async (sha) => {
                const response = await fetch(`/manifest-pc-deploy.json?semantic=${sha}&ts=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`manifest_http_${response.status}`);
                return response.json();
              }, targetSha);
              if (manifest.commitSha !== targetSha) throw new Error(`manifest_sha_mismatch:${manifest.commitSha}`);

              const dialog = page.locator('#pc-public-assistant-panel');
              const hiddenTrigger = page.locator('.pc-public-assistant-shortcut');
              await hiddenTrigger.waitFor({ state: 'attached', timeout: 30000 });
              await page.waitForTimeout(750);

              let opened = false;
              const dockTrigger = page.locator('.pc-public-contact-dock-assistant');
              if (await dockTrigger.count()) {
                await page.evaluate(() => window.scrollTo(0, 260));
                await page.waitForTimeout(250);
                await page.evaluate(() => window.scrollTo(0, 160));
                try {
                  await dockTrigger.waitFor({ state: 'visible', timeout: 10000 });
                  if (await dockTrigger.isEnabled()) {
                    await dockTrigger.click();
                    await dialog.waitFor({ state: 'visible', timeout: 5000 });
                    opened = true;
                  }
                } catch {}
              }
              if (!opened) await hiddenTrigger.evaluate((node) => node.click());
              await dialog.waitFor({ state: 'visible', timeout: 30000 });

              if (((await page.locator('#pc-public-assistant-title').textContent()) || '').trim() !== 'ИИ Прозрачной Цены') {
                throw new Error('semantic_title_missing');
              }
              if (((await page.locator('#pc-public-assistant-empty-title').textContent()) || '').trim() !== 'Чем помочь?') {
                throw new Error('semantic_empty_state_missing');
              }
              const identity = ((await dialog.locator('.pc-public-assistant-identity div > span').textContent()) || '').trim();
              if (!identity.includes('агробизнесу')) throw new Error('semantic_agro_identity_missing');

              const composer = dialog.getByRole('textbox', { name: 'Задай вопрос об агробизнесе или платформе' });
              await composer.fill('Что влияет на цену зерна?');
              await dialog.getByRole('button', { name: 'Отправить' }).click();
              await dialog.locator('.pc-public-assistant-message[data-role="user"]').last().waitFor({ state: 'visible', timeout: 30000 });

              const answered = dialog.locator('.pc-public-assistant-message[data-role="assistant"][data-stream-status="answered"]').last();
              await answered.waitFor({ state: 'visible', timeout: 240000 });
              const answerText = ((await answered.locator('.pc-public-assistant-bubble').textContent()) || '').trim();
              const normalized = answerText.toLocaleLowerCase('ru-RU').replace(/\s+/g, ' ');
              if (answerText.length < 120) throw new Error(`semantic_answer_too_short:${answerText.length}`);
              const refusal = refusalPatterns.find((pattern) => pattern.test(normalized));
              if (refusal) throw new Error(`semantic_refusal_or_error:${refusal.source}`);
              const factorHits = factorFamilies.filter(([, pattern]) => pattern.test(normalized)).map(([name]) => name);
              if (factorHits.length < 3) throw new Error(`semantic_factor_coverage_too_low:${factorHits.join(',')}`);
              if (await answered.locator('.pc-public-assistant-source-list a').count()) {
                throw new Error('semantic_general_agro_fake_platform_citation');
              }
              if (await dialog.locator('[role="alert"]').count()) throw new Error('semantic_ui_alert_present');

              const overflow = await dialog.evaluate((node) => ({
                horizontal: node.scrollWidth - node.clientWidth,
                viewportRight: node.getBoundingClientRect().right - window.innerWidth,
              }));
              if (overflow.horizontal > 1 || overflow.viewportRight > 1) {
                throw new Error(`semantic_ui_overflow:${JSON.stringify(overflow)}`);
              }
              if (pageErrors.length) throw new Error(`semantic_page_errors:${pageErrors.join('|')}`);

              fs.mkdirSync(evidenceDir, { recursive: true });
              await page.screenshot({ path: path.join(evidenceDir, 'public-agro-semantic-390x844.png'), fullPage: true });
              fs.writeFileSync(path.join(evidenceDir, 'public-agro-semantic.json'), JSON.stringify({
                targetSha,
                manifestSha: manifest.commitSha,
                question: 'Что влияет на цену зерна?',
                answerCharacters: answerText.length,
                answerSha256: crypto.createHash('sha256').update(answerText, 'utf8').digest('hex'),
                factorHits,
                refusalPatternsMatched: 0,
                fakePlatformCitationLinks: 0,
                viewport: '390x844',
                status: 'PASS',
              }, null, 2));
              console.log(`LIVE_PUBLIC_AGRO_SEMANTIC=PASS factors=${factorHits.join(',')} chars=${answerText.length}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload semantic live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-public-agro-semantic-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-public-agro-semantic/evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Record semantic acceptance failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue reopen 3372 --repo "$GITHUB_REPOSITORY" || true
          gh issue comment 3372 --repo "$GITHUB_REPOSITORY" --body "Exact-main public agro semantic acceptance failed closed for \`$TARGET_SHA\` in workflow \`$GITHUB_RUN_ID\`. The prior activation success must not be treated as complete broad-agro semantic evidence until this gate passes."

      - name: Record semantic acceptance success
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- tai-public-agro-semantic-live:$TARGET_SHA:success -->"
          if ! gh api "repos/$GITHUB_REPOSITORY/issues/3372/comments" --paginate --jq '.[].body' | grep -Fq "$marker"; then
            body="$marker
          Exact-main public agro semantic acceptance **PASS** for \`$TARGET_SHA\`: live Chromium received a substantive answer to \`Что влияет на цену зерна?\`, rejected refusal/error patterns, proved at least three independent market-factor families, found no fake platform citation, no alert, no page error and no mobile overflow. Evidence workflow: \`$GITHUB_RUN_ID\`."
            gh issue comment 3372 --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue comment 3368 --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
