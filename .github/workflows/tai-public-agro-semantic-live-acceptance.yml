name: TAI Public Agro Semantic Live Acceptance

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tai-public-agro-semantic-live-acceptance.yml'
      - 'docs/platform-v7/autopilot/scopes/fix-qwen-broad-agro-semantic-acceptance.json'
  push:
    branches: [main]
    paths:
      - 'apps/web/components/platform-v7/PublicPlatformAssistant.tsx'
      - 'apps/web/components/platform-v7/UnifiedModalSheetFullscreenController.tsx'
      - 'apps/web/styles/platform-v7-public-assistant.css'
  workflow_run:
    workflows: ['TAI Restricted Qwen REG.RU Activation']
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter VERIFY-PUBLIC-AGRO-SEMANTICS
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  statuses: read

# This group is deliberately identical to the activation workflow group.
# A later activation therefore queues behind a running semantic probe instead
# of contending for the single private Qwen runtime.
concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request' &&
      format('tai-public-agro-semantic-pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'issue_comment' &&
      !(
        github.event.issue.number == 3365 &&
        github.event.issue.pull_request == null &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.body == '/tai recover-live-semantic 31481267058 c391425e9ad5d9afb0b5991079bc90caf1b9f660'
      ) &&
      format('tai-public-agro-semantic-ignored-{0}', github.run_id) ||
      'tai-restricted-qwen-reg-ru-activation-production'
    }}
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai

jobs:
  live-semantic-acceptance:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'VERIFY-PUBLIC-AGRO-SEMANTICS'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3365 &&
        github.event.issue.pull_request == null &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.body == '/tai recover-live-semantic 31481267058 c391425e9ad5d9afb0b5991079bc90caf1b9f660'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine live execution mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          live=1
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            live=0
          elif [[ '${{ github.event_name }}' == 'push' ]]; then
            changed="$RUNNER_TEMP/semantic-changed-paths.txt"
            git diff-tree --no-commit-id --name-only -r HEAD^ HEAD > "$changed"
            # When the same commit also triggers Qwen activation, this direct
            # push run releases the shared lock quickly. The workflow_run event
            # performs the real semantic probe after activation succeeds.
            if grep -Eq '^(.github/workflows/tai-restricted-qwen-reg-ru-activation[.]yml|apps/api/src/modules/ai-insights/(ai-assistant[.]service[.]ts|ai-insights[.]module[.]ts|restricted-public-qwen[.]controller[.]ts|restricted-public-qwen[.]service[.]ts)|apps/web/app/api/restricted-public-platform-assistant/route[.]ts|apps/web/components/platform-v7/(PublicPlatformAssistant|UnifiedModalSheetFullscreenController)[.]tsx|apps/web/next[.]config[.]js)$' "$changed"; then
              live=0
            fi
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"

      - name: Validate serialized acceptance contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/tai-public-agro-semantic-live-acceptance.yml'
          activation_workflow='.github/workflows/tai-restricted-qwen-reg-ru-activation.yml'
          grep -Fq "workflow_run:" "$workflow"
          grep -Fq "workflows: ['TAI Restricted Qwen REG.RU Activation']" "$workflow"
          grep -Fq "github.event.workflow_run.conclusion == 'success'" "$workflow"
          grep -Fq "'tai-restricted-qwen-reg-ru-activation-production'" "$workflow"
          grep -Fq "group: tai-restricted-qwen-reg-ru-activation-" "$activation_workflow"
          grep -Fq "github.event.pull_request.number || 'production'" "$activation_workflow"
          grep -Fq "format('tai-public-agro-semantic-pr-{0}', github.event.pull_request.number)" "$workflow"
          grep -Fq "format('tai-public-agro-semantic-ignored-{0}', github.run_id)" "$workflow"
          grep -Fq "github.event.comment.body == '/tai recover-live-semantic 31481267058 c391425e9ad5d9afb0b5991079bc90caf1b9f660'" "$workflow"
          grep -Fq "activation_target='10b6cc03ea7a142e4d6baf5bf87ddc02a6b44a2d'" "$workflow"
          grep -Fq "target='c391425e9ad5d9afb0b5991079bc90caf1b9f660'" "$workflow"
          grep -Fq "release_run='31494796603'" "$workflow"
          grep -Fq 'jq -r --arg run "$release_run" --arg target "$target"' "$workflow"
          grep -Fq 'contains("- API revision: `" + $target + "`")' "$workflow"
          grep -Fq 'diff -u "$expected_changed" "$actual_changed"' "$workflow"
          grep -Fq 'cp "$manifest" "$RUNNER_TEMP/tai-public-agro-semantic/evidence/manifest.json"' "$workflow"
          grep -Fq 'TAI Restricted Qwen REG.RU Activation' "$workflow"
          grep -Fq "git merge-base --is-ancestor" "$workflow"
          grep -Fq "apps/web/components/platform-v7/PublicPlatformAssistant.tsx" "$workflow"
          grep -Fq "apps/web/components/platform-v7/UnifiedModalSheetFullscreenController.tsx" "$workflow"
          echo 'SEMANTIC_ACCEPTANCE_SERIALIZATION=PASS'

      - name: Resolve exact production target
        if: steps.mode.outputs.live == '1'
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ '${{ github.event_name }}' == 'workflow_run' ]]; then
            target='${{ github.event.workflow_run.head_sha }}'
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            target='${{ inputs.target_sha }}'
          elif [[ '${{ github.event_name }}' == 'issue_comment' ]]; then
            target='c391425e9ad5d9afb0b5991079bc90caf1b9f660'
          else
            target='${{ github.sha }}'
          fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(git rev-parse origin/main)"
          if [[ '${{ github.event_name }}' == 'issue_comment' ]]; then
            activation_target='10b6cc03ea7a142e4d6baf5bf87ddc02a6b44a2d'
            [[ "$target" == 'c391425e9ad5d9afb0b5991079bc90caf1b9f660' ]]
            git merge-base --is-ancestor "$activation_target" "$target"
            git merge-base --is-ancestor "$target" "$current_main"
            activation_state="$(
              gh api "repos/$GITHUB_REPOSITORY/commits/$activation_target/status" \
                --jq '[.statuses[] | select(.context == "TAI Restricted Qwen REG.RU Activation")][0].state // ""'
            )"
            [[ "$activation_state" == 'success' ]]
            accepted_marker="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues/3365/comments" \
                --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("Restricted Qwen accepted on REG.RU for exact target `10b6cc03ea7a142e4d6baf5bf87ddc02a6b44a2d` after activation run `31481267058`"))) | .id' \
                | tail -n 1
            )"
            [[ "$accepted_marker" =~ ^[0-9]+$ ]]
            release_run='31494796603'
            release_marker="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues/3072/comments" \
                | jq -r --arg run "$release_run" --arg target "$target" '
                    .[]
                    | select(
                        .user.login == "github-actions[bot]"
                        and (.body | contains("## Full-stack release run `" + $run + "`"))
                        and (.body | contains("- target SHA: `" + $target + "`"))
                        and (.body | contains("- deployment complete: `1`"))
                        and (.body | contains("- API revision: `" + $target + "`"))
                        and (.body | contains("- web revision: `" + $target + "`"))
                        and (.body | contains("- live acceptance: `PASS`"))
                      )
                    | .id
                  ' \
                | tail -n 1
            )"
            [[ "$release_marker" =~ ^[0-9]+$ ]]
            actual_changed="$RUNNER_TEMP/semantic-recovery-actual-paths.txt"
            expected_changed="$RUNNER_TEMP/semantic-recovery-expected-paths.txt"
            git diff --name-only "$activation_target..$target" | LC_ALL=C sort -u > "$actual_changed"
            cat > "$expected_changed" <<'PATHS'
          .github/workflows/production-p0-all-role-registration.yml
          .github/workflows/production-p0-first-customer-acceptance.yml
          .github/workflows/tai-owner-finalization-recovery-command.yml
          apps/web/app/api/staff/[...path]/route.ts
          apps/web/components/platform-v7/staff/RegistrationReviewQueue.tsx
          apps/web/tests/unit/p0HumanReviewerCeremony.test.ts
          docs/ops/production-p0-all-role-registration.md
          docs/ops/production-p0-first-customer-acceptance.md
          docs/platform-v7/autopilot/autopilot-state.json
          docs/platform-v7/autopilot/scopes/production-p0-all-role-registration-3785.json
          docs/platform-v7/autopilot/scopes/production-p0-first-customer-acceptance-3749.json
          docs/platform-v7/autopilot/scopes/tai-finalization-main-drift-recovery-2-20260811.json
          docs/platform-v7/autopilot/scopes/tai-finalization-main-drift-recovery-20260811.json
          scripts/check-production-p0-all-role-registration.mjs
          scripts/check-production-p0-first-customer-acceptance.mjs
          scripts/check-tai-finalization-main-drift-recovery.mjs
          scripts/production-p0-all-role-registration.sh
          scripts/production-p0-first-customer-acceptance.sh
          PATHS
            LC_ALL=C sort -u -o "$expected_changed" "$expected_changed"
            diff -u "$expected_changed" "$actual_changed"
            evidence_dir="$RUNNER_TEMP/tai-public-agro-semantic/evidence"
            mkdir -p "$evidence_dir"
            python3 - "$activation_target" "$target" "$current_main" "$actual_changed" "$evidence_dir/recovery-authority.json" <<'PY'
          import json, pathlib, sys
          activation, live, current, paths_file, output = sys.argv[1:]
          paths = pathlib.Path(paths_file).read_text(encoding='utf-8').splitlines()
          pathlib.Path(output).write_text(json.dumps({
              'acceptedActivationRun': 31481267058,
              'acceptedActivationSha': activation,
              'fullStackReleaseRun': 31494796603,
              'liveTargetSha': live,
              'currentMainSha': current,
              'changedPathsSinceActivation': paths,
              'status': 'PASS',
          }, indent=2) + '\n', encoding='utf-8')
          PY
            echo 'SEMANTIC_RECOVERY_AUTHORITY=PASS activation_run=31481267058 activation_target=10b6cc03ea7a142e4d6baf5bf87ddc02a6b44a2d live_target=c391425e9ad5d9afb0b5991079bc90caf1b9f660 release_run=31494796603'
          else
            [[ "$target" == "$current_main" ]]
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Wait for exact REG.RU deployment manifest
        if: steps.mode.outputs.live == '1'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          mkdir -p "$RUNNER_TEMP/tai-public-agro-semantic/evidence"
          for attempt in $(seq 1 90); do
            manifest="$RUNNER_TEMP/tai-public-agro-semantic/manifest.json"
            if curl -fsS --connect-timeout 10 --max-time 30 \
              "$LIVE_BASE/manifest-pc-deploy.json?semantic=$TARGET_SHA&attempt=$attempt&ts=$(date +%s%N)" \
              -o "$manifest"; then
              deployed="$(python3 - "$manifest" <<'PY'
          import json, pathlib, sys
          try:
              payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
              print(payload.get('commitSha', ''))
          except Exception:
              print('')
          PY
              )"
              if [[ "$deployed" == "$TARGET_SHA" ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo "Exact production manifest did not reach $TARGET_SHA." >&2; exit 2; }
          cp "$manifest" "$RUNNER_TEMP/tai-public-agro-semantic/evidence/manifest.json"
          echo "LIVE_MANIFEST_EXACT_SHA=$TARGET_SHA"

      - name: Verify substantive broad-agro response in live Chromium
        if: steps.mode.outputs.live == '1'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/tai-public-agro-semantic/evidence
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tai-public-agro-semantic/playwright"
          rm -rf "$work"
          mkdir -p "$work" "$EVIDENCE_DIR"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts playwright@1.59.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { chromium } = require('playwright');

          const liveBase = process.env.LIVE_BASE;
          const targetSha = process.env.TARGET_SHA;
          const evidenceDir = process.env.EVIDENCE_DIR;
          if (!liveBase || !/^[0-9a-f]{40}$/.test(targetSha || '') || !evidenceDir) process.exit(2);

          const refusalPatterns = [
            /нет подтвержд[её]нного основания/iu,
            /^(?:извините[,!. ]*)?(?:я )?не могу\b/iu,
            /произошла (?:техническая )?ошибка/iu,
            /не удалось (?:получить|сформировать|обработать|ответить)/iu,
            /(?:сервис|модель|помощник) (?:временно )?недоступ/iu,
            /попробуйте (?:ещ[её] раз )?позже/iu,
            /вне (?:моей|сферы) компетенции/iu,
            /не располагаю (?:достаточной )?(?:информацией|данными)/iu,
          ];
          const factorFamilies = [
            ['quality', /(качест|клейковин|протеин|белок|влажност|натур)/iu],
            ['supplyDemand', /(спрос|предложен|баланс рынк|потреблен)/iu],
            ['harvestStocks', /(урожа|валов|запас|остатк|посевн)/iu],
            ['exportWorld', /(экспорт|импорт|миров|бирж|черномор|внешн.*рын)/iu],
            ['currency', /(курс|рубл|валют)/iu],
            ['logisticsStorage', /(логист|транспорт|фрахт|достав|элеватор|хранен)/iu],
            ['seasonWeather', /(сезон|погод|засух|осадк|температур|климат)/iu],
            ['policy', /(пошлин|квот|субсид|регулирован|господдерж|налог)/iu],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, locale: 'ru-RU' });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            try {
              const response = await page.goto(`${liveBase}/platform-v7?lang=ru&semantic=${targetSha}`, {
                waitUntil: 'domcontentloaded',
                timeout: 120000,
              });
              if (!response || !response.ok()) throw new Error(`live_page_http_${response?.status()}`);

              const manifest = await page.evaluate(async (sha) => {
                const response = await fetch(`/manifest-pc-deploy.json?semantic=${sha}&ts=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`manifest_http_${response.status}`);
                return response.json();
              }, targetSha);
              if (manifest.commitSha !== targetSha) throw new Error(`manifest_sha_mismatch:${manifest.commitSha}`);

              const dialog = page.locator('#pc-public-assistant-panel');
              const trigger = page.locator('.pc-public-assistant-shortcut');
              await trigger.waitFor({ state: 'attached', timeout: 30000 });
              await trigger.evaluate((node) => node.click());
              await dialog.waitFor({ state: 'visible', timeout: 30000 });

              if (((await page.locator('#pc-public-assistant-title').textContent()) || '').trim() !== 'Гекта') {
                throw new Error('semantic_title_missing');
              }
              const semanticSubtitle = dialog.locator('[data-pc-public-assistant-subtitle="true"]:visible');
              await semanticSubtitle.waitFor({ state: 'visible', timeout: 30000 });
              if (((await semanticSubtitle.textContent()) || '').trim() !== 'Аграрный интеллект для земли, урожая и решений.') {
                throw new Error('semantic_subtitle_missing');
              }
              const aiMark = dialog.locator('[data-pc-public-assistant-ai-mark="true"]:visible');
              if (await aiMark.count() !== 1 || await aiMark.locator('svg').count() !== 1) {
                throw new Error('semantic_ai_mark_missing');
              }
              const composer = dialog.getByRole('textbox', { name: 'Спроси Гекту о земле, урожае или агробизнесе' });
              await composer.fill('Что влияет на цену зерна?');
              await dialog.getByRole('button', { name: 'Отправить' }).click();
              await dialog.locator('.pc-public-assistant-message[data-role="user"]').last().waitFor({ state: 'visible', timeout: 30000 });

              const terminal = dialog.locator('.pc-public-assistant-message[data-role="assistant"][data-stream-status="answered"], .pc-public-assistant-message[data-role="assistant"][data-stream-status="refused"]').last();
              await terminal.waitFor({ state: 'visible', timeout: 150000 });
              const streamStatus = await terminal.getAttribute('data-stream-status');
              const refusal = await terminal.getAttribute('data-stream-refusal');
              if (streamStatus !== 'answered') throw new Error(`semantic_terminal_${streamStatus}:${refusal || 'unknown'}`);

              const answerText = ((await terminal.locator('.pc-public-assistant-bubble').textContent()) || '').trim();
              const normalized = answerText.toLocaleLowerCase('ru-RU').replace(/\s+/g, ' ');
              if (answerText.length < 120) throw new Error(`semantic_answer_too_short:${answerText.length}`);
              const refusalPattern = refusalPatterns.find((pattern) => pattern.test(normalized));
              if (refusalPattern) throw new Error(`semantic_refusal_or_error:${refusalPattern.source}`);
              const factorHits = factorFamilies.filter(([, pattern]) => pattern.test(normalized)).map(([name]) => name);
              if (factorHits.length < 3) throw new Error(`semantic_factor_coverage_too_low:${factorHits.join(',')}`);
              if (await terminal.locator('.pc-public-assistant-source-list a').count()) throw new Error('semantic_general_agro_fake_platform_citation');
              if (await dialog.locator('[role="alert"]').count()) throw new Error('semantic_ui_alert_present');

              const overflow = await dialog.evaluate((node) => ({
                horizontal: node.scrollWidth - node.clientWidth,
                viewportRight: node.getBoundingClientRect().right - window.innerWidth,
              }));
              if (overflow.horizontal > 1 || overflow.viewportRight > 1) throw new Error(`semantic_ui_overflow:${JSON.stringify(overflow)}`);
              if (pageErrors.length) throw new Error(`semantic_page_errors:${pageErrors.join('|')}`);

              await page.screenshot({ path: path.join(evidenceDir, 'public-agro-semantic-390x844.png'), fullPage: true });
              fs.writeFileSync(path.join(evidenceDir, 'public-agro-semantic.json'), JSON.stringify({
                targetSha,
                manifestSha: manifest.commitSha,
                question: 'Что влияет на цену зерна?',
                answerCharacters: answerText.length,
                answerSha256: crypto.createHash('sha256').update(answerText, 'utf8').digest('hex'),
                factorHits,
                viewport: '390x844',
                status: 'PASS',
              }, null, 2));
              console.log(`LIVE_PUBLIC_AGRO_SEMANTIC=PASS factors=${factorHits.join(',')} chars=${answerText.length}`);
            } catch (error) {
              await page.screenshot({ path: path.join(evidenceDir, 'public-agro-semantic-failure.png'), fullPage: true }).catch(() => undefined);
              fs.writeFileSync(path.join(evidenceDir, 'public-agro-semantic-failure.json'), JSON.stringify({
                targetSha,
                error: String(error),
                pageErrors,
                status: 'FAIL',
              }, null, 2));
              throw error;
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload semantic live evidence
        if: always() && steps.mode.outputs.live == '1'
        uses: actions/upload-artifact@v4
        with:
          name: tai-public-agro-semantic-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-public-agro-semantic/evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Record semantic acceptance failure
        if: failure() && steps.mode.outputs.live == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue reopen 3372 --repo "$GITHUB_REPOSITORY" || true
          if [[ '${{ github.event_name }}' == 'issue_comment' ]]; then
            gh issue comment 3372 --repo "$GITHUB_REPOSITORY" --body "Accepted-activation public agro semantic recovery failed closed for live descendant \`$TARGET_SHA\` after accepted activation \`10b6cc03ea7a142e4d6baf5bf87ddc02a6b44a2d\` run \`31481267058\` and full-stack release \`31494796603\` in workflow \`$GITHUB_RUN_ID\`. No complete production-success claim is allowed."
          else
            gh issue comment 3372 --repo "$GITHUB_REPOSITORY" --body "Exact-main public agro semantic acceptance failed closed for \`$TARGET_SHA\` in workflow \`$GITHUB_RUN_ID\`. No complete production-success claim is allowed."
          fi

      - name: Record semantic acceptance success
        if: success() && steps.mode.outputs.live == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'issue_comment' ]]; then
