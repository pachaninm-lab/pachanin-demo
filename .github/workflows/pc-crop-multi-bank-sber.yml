name: PC-CROP Multi-Bank Reference Adapter Acceptance

on:
  pull_request:
    paths:
      - 'packages/domain-core/src/bank-capability.ts'
      - 'packages/domain-core/src/bank-capability.test.ts'
      - 'apps/api/src/modules/bank-adapters/**'
      - 'apps/api/test/industrial/multi-bank-reference-adapter.e2e-spec.ts'
      - 'docs/security/CRYPTOGRAPHIC_INVENTORY.md'
      - 'docs/security/cryptographic-inventory.json'
      - 'scripts/verify-pc-crop-multi-bank-sber-scope.test.mjs'
      - '.github/workflows/pc-crop-multi-bank-sber.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain-core/src/bank-capability.ts'
      - 'packages/domain-core/src/bank-capability.test.ts'
      - 'apps/api/src/modules/bank-adapters/**'
      - 'apps/api/test/industrial/multi-bank-reference-adapter.e2e-spec.ts'
      - 'docs/security/CRYPTOGRAPHIC_INVENTORY.md'
      - 'docs/security/cryptographic-inventory.json'
      - 'scripts/verify-pc-crop-multi-bank-sber-scope.test.mjs'
      - '.github/workflows/pc-crop-multi-bank-sber.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-crop-multi-bank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  reference-adapters:
    name: Provider-neutral contracts · reference mappings · no live activation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.2.1'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source truth boundaries
        run: node scripts/verify-pc-crop-multi-bank-sber-scope.test.mjs

      - name: Typecheck changed bank contracts
        shell: bash
        run: |
          set -o pipefail
          # The repository's legacy domain-core tsconfig still uses removed
          # TypeScript baseUrl/node10 options. Compile the new provider-neutral
          # domain source with current NodeNext semantics instead of weakening
          # or editing that unrelated baseline configuration.
          pnpm exec tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck             packages/domain-core/src/bank-capability.ts
          pnpm --filter @pc/api typecheck

      - name: Run provider-neutral domain contract
        run: pnpm exec vitest run packages/domain-core/src/bank-capability.test.ts

      - name: Run adapter and receipt contract tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/api exec jest --runInBand --runTestsByPath             src/modules/bank-adapters/bank-capability.router.spec.ts             src/modules/bank-adapters/bank-receipt.contract.spec.ts             src/modules/bank-adapters/sber-reference.adapter.spec.ts             src/modules/bank-adapters/alfa-reference.adapter.spec.ts             src/modules/bank-adapters/tbank-reference.adapter.spec.ts

      - name: Run multi-bank industrial conformance contract
        run: >-
          pnpm --filter @pc/api exec jest
          --config test/industrial/jest.config.json
          test/industrial/multi-bank-reference-adapter.e2e-spec.ts
          --runInBand
