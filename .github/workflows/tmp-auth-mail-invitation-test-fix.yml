name: Temporary auth-mail invitation matcher fix

on:
  push:
    branches:
      - p0/industrial-auth-mail-outbox-3785
    paths:
      - .github/workflows/tmp-auth-mail-invitation-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/industrial-auth-mail-outbox-3785
          fetch-depth: 0
      - name: Replace only the two over-broad matchers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/modules/auth/organization-invitation.service.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = "expect(JSON.stringify(result)).not.toContain('iv_');"
          new = r"expect(JSON.stringify(result)).not.toMatch(/iv_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/);"
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 legacy matchers, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- apps/api/src/modules/auth/organization-invitation.service.spec.ts
      - name: Commit exact test correction
        shell: bash
        run: |
          git config user.name 'pc-crop-auth-mail-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/api/src/modules/auth/organization-invitation.service.spec.ts
          git commit -m 'test(auth-mail): distinguish invitation ids from bearer credentials'
          git push origin HEAD:p0/industrial-auth-mail-outbox-3785
