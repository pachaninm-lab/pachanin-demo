name: Company OS F3 Foundation Merge Controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-os-f3-foundation-merge-controller.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  issues: write

concurrency:
  group: company-os-f3-foundation-merge-controller
  cancel-in-progress: false

jobs:
  merge:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout trusted review gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Validate, stabilize and merge F3 policy foundation
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headRef = 'company-os/f3-staff-lifecycle-foundation';
            const expected = [
              'apps/api/src/staff-access/staff-lifecycle.policy.spec.ts',
              'apps/api/src/staff-access/staff-lifecycle.policy.ts',
              'apps/api/src/staff-access/staff-lifecycle.types.ts',
            ];
            const terminalSuccess = new Set(['success', 'neutral', 'skipped']);
            const terminalFailure = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale']);

            const findPull = async () => {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${headRef}`,
                base: 'main',
                per_page: 100,
              });
              if (pulls.length !== 1) throw new Error(`Expected one open F3 PR, found ${pulls.length}`);
              return pulls[0];
            };

            const validateFiles = async (number) => {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: number,
                per_page: 100,
              });
              const names = files.map((file) => file.filename).sort();
              if (JSON.stringify(names) !== JSON.stringify(expected)) {
                throw new Error(`F3 allowlist mismatch: ${names.join(', ')}`);
              }
              for (const file of files) {
                if (file.status !== 'added') throw new Error(`F3 file is not added: ${file.filename}:${file.status}`);
                if (file.changes < 20 || file.changes > 900) throw new Error(`Unexpected F3 file size: ${file.filename}:${file.changes}`);
              }
            };

            let pr = await findPull();
            await validateFiles(pr.number);

            // Wait for both bounded one-shot autofix workflows to remove themselves and stabilize the branch.
            let stableHead = '';
            let stableObservations = 0;
            for (let attempt = 1; attempt <= 80; attempt += 1) {
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const names = files.map((file) => file.filename).sort();
              const clean = JSON.stringify(names) === JSON.stringify(expected);
              if (clean && pr.head.sha === stableHead) stableObservations += 1;
              else {
                stableHead = pr.head.sha;
                stableObservations = clean ? 1 : 0;
              }
              if (stableObservations >= 3) break;
              if (attempt === 80) throw new Error(`F3 branch did not stabilize; files=${names.join(', ')}`);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            await validateFiles(pr.number);

            try {
              await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number });
              await new Promise((resolve) => setTimeout(resolve, 15000));
            } catch (error) {
              if (![202, 422].includes(error.status)) throw error;
            }

            pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
            stableHead = pr.head.sha;
            await validateFiles(pr.number);

            if (pr.draft) {
              await github.graphql(
                `mutation($pullRequestId: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $pullRequestId}) { pullRequest { isDraft } } }`,
                { pullRequestId: pr.node_id },
              );
            }

            let accepted = false;
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
              if (pr.state !== 'open') throw new Error(`F3 PR left open state: ${pr.state}`);
              if (pr.head.sha !== stableHead) {
                stableHead = pr.head.sha;
                await validateFiles(pr.number);
              }

              const [checkResponse, statusResponse, reviews] = await Promise.all([
                github.rest.checks.listForRef({ owner, repo, ref: stableHead, per_page: 100 }),
                github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: stableHead }),
                github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 }),
              ]);
              const checks = checkResponse.data.check_runs.filter((run) => run.name !== 'Validate, stabilize and merge F3 policy foundation');
              const failedChecks = checks.filter((run) => terminalFailure.has(run.conclusion));
              const pendingChecks = checks.filter((run) => run.status !== 'completed');
              const successfulChecks = checks.filter((run) => run.status === 'completed' && terminalSuccess.has(run.conclusion));
              const failedStatuses = statusResponse.data.statuses.filter((status) => ['failure', 'error'].includes(status.state));
              const pendingStatuses = statusResponse.data.statuses.filter((status) => status.state === 'pending');
              const latestReviews = new Map();
              for (const review of reviews) if (review.user?.login) latestReviews.set(review.user.login, review.state);
              const requestedChanges = [...latestReviews.entries()].filter(([, state]) => state === 'CHANGES_REQUESTED');

              if (requestedChanges.length) throw new Error(`Changes requested by ${requestedChanges.map(([login]) => login).join(', ')}`);
              if (failedChecks.length || failedStatuses.length) {
                throw new Error(`F3 checks failed: ${[
                  ...failedChecks.map((run) => `${run.name}:${run.conclusion}`),
                  ...failedStatuses.map((status) => `${status.context}:${status.state}`),
                ].join(', ')}`);
              }
              if (pendingChecks.length === 0 && pendingStatuses.length === 0 && successfulChecks.length >= 5) {
                accepted = true;
                break;
              }
              if (attempt === 120) break;
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            if (!accepted) throw new Error('F3 exact-head checks did not settle within 30 minutes');

            await validateFiles(pr.number);
            pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
            if (pr.head.sha !== stableHead || pr.mergeable === false || pr.mergeable_state === 'dirty') {
              throw new Error(`F3 PR is not mergeable at accepted head: ${pr.mergeable_state}`);
            }

            execFileSync('node', ['docs/platform-v7/autopilot/verify-pr-review-gate.mjs'], {
              stdio: 'inherit',
              env: {
                ...process.env,
                GH_TOKEN: process.env.GH_TOKEN,
                REPO: `${owner}/${repo}`,
                PR_NUMBER: String(pr.number),
                HEAD_SHA: stableHead,
                REQUIRE_GREEN_CI: '1',
              },
            });

            const merged = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              sha: stableHead,
              commit_title: 'Company OS F3: staff lifecycle policy foundation',
              commit_message: 'Merge exact-head fail-closed staff lifecycle and privileged-access policy after CI/security acceptance. No production mutation.',
            });
            if (!merged.data.merged) throw new Error(`F3 merge rejected: ${merged.data.message}`);

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title \"Company OS F3\"`,
              per_page: 20,
            });
            const issue = search.data.items.find((item) => item.title.startsWith('Company OS F3 —'));
            const body = [
              '## F3 policy foundation merged',
              '',
              `- PR: #${pr.number}`,
              `- Accepted head: \`${stableHead}\``,
              `- Merge commit: \`${merged.data.sha}\``,
              '- Scope: lifecycle contract, grant ceilings, MFA/tenant/version/idempotency boundaries and negative matrix.',
              '- Production mutation: **NONE**',
              '- F3 status: **FOUNDATION ONLY — NOT PRODUCTION ACCEPTED**',
            ].join('\n');
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: 4152, body });
