name: Production Full-Stack Exact-SHA Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/production-full-stack-exact-sha.yml'
      - 'scripts/pc-full-stack-controller.sh'
      - 'scripts/tai-runtime-role-repair.sh'
      - 'scripts/production-full-stack-exact-sha.sh'
      - 'scripts/production-full-stack-live-acceptance.sh'
      - 'scripts/check-production-full-stack-release.mjs'
      - 'docs/platform-v7/autopilot/scopes/production-full-stack-release-v1.json'
  workflow_run:
    workflows: ['Build & Publish Canonical Docker Images']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY-FULL-STACK-EXACT-SHA
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-full-stack-exact-sha
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  EVIDENCE_DIR: artifacts/production-full-stack-release
  RELEASE_ISSUE_NUMBER: 3072

jobs:
  contract:
    name: Validate full-stack release contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'DEPLOY-FULL-STACK-EXACT-SHA'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production full-stack current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate outbound-only release authority
        run: node scripts/check-production-full-stack-release.mjs

  image_authority:
    name: Exact-main API, web and migration image authority
    needs: contract
    if: github.event_name != 'pull_request' && needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
      api_digest: ${{ steps.images.outputs.api_digest }}
      web_digest: ${{ steps.images.outputs.web_digest }}
      migration_digest: ${{ steps.images.outputs.migration_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact current main
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          if [[ "$EVENT_NAME" == workflow_run ]]; then target="$UPSTREAM_SHA"; fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then target="$INPUT_SHA"; fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse origin/main)" ]]
          [[ "$(git rev-parse HEAD)" == "$target" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "short=${target:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify immutable exact-SHA images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_SHORT: ${{ steps.target.outputs.short }}
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          for component in api web migration; do
            reference="ghcr.io/pachaninm-lab/grainflow-${component}:sha-${TARGET_SHORT}"
            ready=0
            for attempt in $(seq 1 90); do
              if docker pull "$reference" >/dev/null 2>&1; then
                revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$reference")"
                digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$reference")"
                if [[ "$revision" == "$TARGET_SHA" && "$digest" =~ ^ghcr[.]io/pachaninm-lab/grainflow-${component}@sha256:[0-9a-f]{64}$ ]]; then
                  ready=1
                  break
                fi
              fi
              sleep 10
            done
            (( ready == 1 ))
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Remove hosted registry session
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  deploy:
    name: Migrate and deploy API/web through protected pc-prod controller
    needs: image_authority
    if: needs.image_authority.result == 'success'
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    outputs:
      evidence_json: ${{ steps.evidence.outputs.json }}
    env:
      TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
      API_DIGEST: ${{ needs.image_authority.outputs.api_digest }}
      WEB_DIGEST: ${{ needs.image_authority.outputs.web_digest }}
      MIGRATION_DIGEST: ${{ needs.image_authority.outputs.migration_digest }}
      REGISTRY_TOKEN: ${{ github.token }}
      REGISTRY_USER: ${{ github.actor }}
      BACKUP_EVIDENCE_PATH: ${{ secrets.PC_PROD_BACKUP_EVIDENCE_FILE }}
    steps:
      - name: Verify least-privilege runner authority
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == pc-prod-* ]]
          [[ "$(id -u)" -ne 0 ]]
          ! id -nG | tr ' ' '\n' | grep -Fxq docker
          if docker version >/dev/null 2>&1; then exit 21; fi
          sudo -n -l | grep -Fq '/usr/local/sbin/pc-tai-release-controller'
      - name: Execute exact deployment through compatibility dispatch
        id: execute
        run: |
          set -Eeuo pipefail
          controller_id="${GITHUB_RUN_ID}1"
          release_id="$GITHUB_RUN_ID"
          [[ "$controller_id" =~ ^[0-9]{1,20}$ && "$release_id" =~ ^[0-9]{1,20}$ ]]
          input="/var/lib/pc-release-authority/runner-input/${controller_id}"
          rm -rf "$input"
          install -d -m 0700 "$input"
          CONTROLLER_ID="$controller_id" RELEASE_ID="$release_id" python3 - "$input/full-stack-release.json" <<'PY'
          import json, os, sys
          payload = {
              'schemaVersion': 'pc.full-stack.controller-input.v1',
              'mode': 'deploy',
              'controllerTargetSha': os.environ['TARGET_SHA'],
              'controllerRunId': os.environ['CONTROLLER_ID'],
              'releaseTargetSha': os.environ['TARGET_SHA'],
              'releaseStateId': os.environ['RELEASE_ID'],
              'apiDigest': os.environ['API_DIGEST'],
              'webDigest': os.environ['WEB_DIGEST'],
              'migrationDigest': os.environ['MIGRATION_DIGEST'],
              'registryUser': os.environ['REGISTRY_USER'],
              'registryToken': os.environ['REGISTRY_TOKEN'],
              'backupEvidencePath': os.environ.get('BACKUP_EVIDENCE_PATH', ''),
          }
          raw = json.dumps(payload, ensure_ascii=True, sort_keys=True, separators=(',', ':'))
          with open(sys.argv[1], 'x', encoding='utf-8') as handle:
              handle.write(raw); handle.write('\n'); handle.flush(); os.fsync(handle.fileno())
          os.chmod(sys.argv[1], 0o600)
          PY
          sudo -n /usr/local/sbin/pc-tai-release-controller repair-runtime-role "$TARGET_SHA" "$controller_id"
      - name: Export bounded redacted deployment evidence
        id: evidence
        if: always()
        run: |
          set -Eeuo pipefail
          controller_id="${GITHUB_RUN_ID}1"
          report="/var/lib/pc-release-authority/runner-output/${controller_id}/runtime-role-repair.json"
          [[ -s "$report" ]]
          python3 - "$report" "$GITHUB_OUTPUT" "$TARGET_SHA" "$controller_id" "$GITHUB_RUN_ID" <<'PY'
          import json, sys
          path, output, sha, controller_id, release_id = sys.argv[1:]
          raw = open(path, 'rb').read()
          if not raw or len(raw) > 65536: raise SystemExit('evidence size invalid')
          value = json.loads(raw.decode('utf-8'))
          if value.get('schemaVersion') != 'pc.full-stack.controller-evidence.v1' or value.get('mode') != 'deploy': raise SystemExit('evidence schema invalid')
          if value.get('controllerTargetSha') != sha or value.get('releaseTargetSha') != sha: raise SystemExit('evidence target invalid')
          if value.get('controllerRunId') != controller_id or value.get('releaseStateId') != release_id: raise SystemExit('evidence run invalid')
          canonical = json.dumps(value, ensure_ascii=True, sort_keys=True, separators=(',', ':'))
          with open(output, 'a', encoding='utf-8') as handle: handle.write(f'json={canonical}\n')
          PY

  live_acceptance:
    name: Hosted live RU/EN/ZH and intake acceptance
    needs: [image_authority, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      request_number: ${{ steps.evidence.outputs.request_number }}
      correlation_id: ${{ steps.evidence.outputs.correlation_id }}
      evidence_json: ${{ steps.evidence.outputs.json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Execute live acceptance
        id: execute
        env:
          PC_LIVE_BASE: ${{ env.LIVE_BASE }}
          PC_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/live
          PC_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
        run: |
          set +e
          mkdir -p "$PC_LIVE_EVIDENCE_DIR"
          bash scripts/production-full-stack-live-acceptance.sh "$TARGET_SHA" > "$RUNNER_TEMP/live.log" 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Build bounded live evidence
        id: evidence
        if: always()
        env:
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
          LIVE_RC: ${{ steps.execute.outputs.rc }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/live.log" "$GITHUB_OUTPUT" "$TARGET_SHA" "${LIVE_RC:-1}" <<'PY'
          import json, re, sys
          path, output, sha, rc = sys.argv[1:]
          text = open(path, encoding='utf-8', errors='replace').read() if __import__('os').path.exists(path) else ''
          def field(name):
              values = re.findall(rf'^{re.escape(name)}=(.*)$', text, re.M)
              return values[-1].strip() if values else ''
          request, correlation = field('LIVE_REQUEST_NUMBER'), field('LIVE_CORRELATION_ID')
          passed = rc == '0' and field('LIVE_ACCEPTANCE') == 'PASS' and re.fullmatch(r'PC-[0-9]{8}-[0-9A-F]{12}', request or '') is not None and re.fullmatch(r'[A-Za-z0-9._:-]{8,128}', correlation or '') is not None
          value = {'schemaVersion':'pc.full-stack.live-evidence.v1','targetSha':sha,'passed':passed,'requestNumber':request or None,'correlationId':correlation or None}
          canonical = json.dumps(value, ensure_ascii=True, sort_keys=True, separators=(',', ':'))
          with open(output, 'a', encoding='utf-8') as handle:
              handle.write(f'request_number={request}\n'); handle.write(f'correlation_id={correlation}\n'); handle.write(f'json={canonical}\n')
          PY
      - name: Enforce live acceptance
        env:
          LIVE_EVIDENCE: ${{ steps.evidence.outputs.json }}
        run: |
          python3 - "$LIVE_EVIDENCE" <<'PY'
          import json, sys
          value=json.loads(sys.argv[1])
          if value.get('passed') is not True: raise SystemExit('live acceptance failed')
          PY

  verify_database:
    name: Verify PostgreSQL, audit and outbox through protected pc-prod controller
    needs: [image_authority, deploy, live_acceptance]
    if: needs.deploy.result == 'success' && needs.live_acceptance.result == 'success'
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      evidence_json: ${{ steps.evidence.outputs.json }}
    env:
      RELEASE_TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
      REQUEST_NUMBER: ${{ needs.live_acceptance.outputs.request_number }}
      CORRELATION_ID: ${{ needs.live_acceptance.outputs.correlation_id }}
    steps:
      - name: Execute durable intake verification
        id: execute
        run: |
          set -Eeuo pipefail
          [[ "$(id -u)" -ne 0 ]]
          ! id -nG | tr ' ' '\n' | grep -Fxq docker
          if docker version >/dev/null 2>&1; then exit 21; fi
          controller_target="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk 'NR==1{print $1}')"
          [[ "$controller_target" =~ ^[0-9a-f]{40}$ ]]
          controller_id="${GITHUB_RUN_ID}2"
          input="/var/lib/pc-release-authority/runner-input/${controller_id}"
          rm -rf "$input"; install -d -m 0700 "$input"
          CONTROLLER_TARGET="$controller_target" CONTROLLER_ID="$controller_id" RELEASE_ID="$GITHUB_RUN_ID" python3 - "$input/full-stack-release.json" <<'PY'
          import json, os, sys
          value={'schemaVersion':'pc.full-stack.controller-input.v1','mode':'verify-intake','controllerTargetSha':os.environ['CONTROLLER_TARGET'],'controllerRunId':os.environ['CONTROLLER_ID'],'releaseTargetSha':os.environ['RELEASE_TARGET_SHA'],'releaseStateId':os.environ['RELEASE_ID'],'requestNumber':os.environ['REQUEST_NUMBER'],'correlationId':os.environ['CORRELATION_ID']}
          with open(sys.argv[1],'x',encoding='utf-8') as handle: json.dump(value,handle,ensure_ascii=True,sort_keys=True,separators=(',',':')); handle.write('\n'); handle.flush(); os.fsync(handle.fileno())
          os.chmod(sys.argv[1],0o600)
          PY
          sudo -n /usr/local/sbin/pc-tai-release-controller repair-runtime-role "$controller_target" "$controller_id"
      - name: Export bounded redacted database evidence
        id: evidence
        if: always()
        run: |
          set -Eeuo pipefail
          controller_id="${GITHUB_RUN_ID}2"
          report="/var/lib/pc-release-authority/runner-output/${controller_id}/runtime-role-repair.json"
          [[ -s "$report" ]]
          python3 - "$report" "$GITHUB_OUTPUT" "$controller_id" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          path,output,controller_id,release_id=sys.argv[1:]
          raw=open(path,'rb').read()
          if not raw or len(raw)>65536: raise SystemExit('evidence size invalid')
          value=json.loads(raw.decode())
          if value.get('schemaVersion')!='pc.full-stack.controller-evidence.v1' or value.get('mode')!='verify-intake': raise SystemExit('evidence schema invalid')
          if value.get('controllerRunId')!=controller_id or value.get('releaseStateId')!=release_id: raise SystemExit('evidence run invalid')
          canonical=json.dumps(value,ensure_ascii=True,sort_keys=True,separators=(',',':'))
          with open(output,'a',encoding='utf-8') as handle: handle.write(f'json={canonical}\n')
          PY

  rollback:
    name: Restore baseline API/web after post-deploy failure
    needs: [image_authority, deploy, live_acceptance, verify_database]
    if: >-
      always() &&
      needs.deploy.result == 'success' &&
      (needs.live_acceptance.result != 'success' || needs.verify_database.result != 'success')
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      evidence_json: ${{ steps.evidence.outputs.json }}
    env:
      RELEASE_TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
    steps:
      - name: Execute protected exact-image rollback
        run: |
          set -Eeuo pipefail
          [[ "$(id -u)" -ne 0 ]]
          ! id -nG | tr ' ' '\n' | grep -Fxq docker
          if docker version >/dev/null 2>&1; then exit 21; fi
          controller_target="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk 'NR==1{print $1}')"
          [[ "$controller_target" =~ ^[0-9a-f]{40}$ ]]
          controller_id="${GITHUB_RUN_ID}3"
          input="/var/lib/pc-release-authority/runner-input/${controller_id}"
          rm -rf "$input"; install -d -m 0700 "$input"
          CONTROLLER_TARGET="$controller_target" CONTROLLER_ID="$controller_id" RELEASE_ID="$GITHUB_RUN_ID" python3 - "$input/full-stack-release.json" <<'PY'
          import json,os,sys
          value={'schemaVersion':'pc.full-stack.controller-input.v1','mode':'rollback','controllerTargetSha':os.environ['CONTROLLER_TARGET'],'controllerRunId':os.environ['CONTROLLER_ID'],'releaseTargetSha':os.environ['RELEASE_TARGET_SHA'],'releaseStateId':os.environ['RELEASE_ID']}
          with open(sys.argv[1],'x',encoding='utf-8') as handle: json.dump(value,handle,ensure_ascii=True,sort_keys=True,separators=(',',':')); handle.write('\n'); handle.flush(); os.fsync(handle.fileno())
          os.chmod(sys.argv[1],0o600)
          PY
          sudo -n /usr/local/sbin/pc-tai-release-controller repair-runtime-role "$controller_target" "$controller_id"
      - name: Export bounded redacted rollback evidence
        id: evidence
        if: always()
        run: |
          set -Eeuo pipefail
          controller_id="${GITHUB_RUN_ID}3"
          report="/var/lib/pc-release-authority/runner-output/${controller_id}/runtime-role-repair.json"
          [[ -s "$report" ]]
          python3 - "$report" "$GITHUB_OUTPUT" "$controller_id" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          path,output,controller_id,release_id=sys.argv[1:]
          raw=open(path,'rb').read()
          if not raw or len(raw)>65536: raise SystemExit('evidence size invalid')
          value=json.loads(raw.decode())
          if value.get('schemaVersion')!='pc.full-stack.controller-evidence.v1' or value.get('mode')!='rollback' or value.get('passed') is not True: raise SystemExit('rollback evidence invalid')
          if value.get('controllerRunId')!=controller_id or value.get('releaseStateId')!=release_id: raise SystemExit('evidence run invalid')
          canonical=json.dumps(value,ensure_ascii=True,sort_keys=True,separators=(',',':'))
          with open(output,'a',encoding='utf-8') as handle: handle.write(f'json={canonical}\n')
          PY

  publish:
    name: Publish exact-main release evidence
    needs: [contract, image_authority, deploy, live_acceptance, verify_database, rollback]
    if: always() && needs.image_authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - name: Materialize bounded evidence and publish status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.live_acceptance.result }}
          DATABASE_RESULT: ${{ needs.verify_database.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          DEPLOY_JSON: ${{ needs.deploy.outputs.evidence_json }}
          LIVE_JSON: ${{ needs.live_acceptance.outputs.evidence_json }}
          DATABASE_JSON: ${{ needs.verify_database.outputs.evidence_json }}
          ROLLBACK_JSON: ${{ needs.rollback.outputs.evidence_json }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import json,os,sys
          root=sys.argv[1]
          for name,key in [('deploy','DEPLOY_JSON'),('live','LIVE_JSON'),('database','DATABASE_JSON'),('rollback','ROLLBACK_JSON')]:
              raw=os.environ.get(key,'')
              if not raw: continue
              value=json.loads(raw)
              canonical=json.dumps(value,ensure_ascii=True,sort_keys=True,separators=(',',':'))
              if canonical!=raw or len(raw.encode())>65536: raise SystemExit(f'{name} evidence invalid')
              open(f'{root}/{name}.json','w',encoding='utf-8').write(canonical+'\n')
          PY
          state=failure
          description='Full-stack release failed or was rolled back'
          if [[ "$DEPLOY_RESULT" == success && "$LIVE_RESULT" == success && "$DATABASE_RESULT" == success && "$ROLLBACK_RESULT" == skipped ]]; then
            state=success
            description='Full-stack exact-SHA release PASS'
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" -f context='Production Full-Stack Exact-SHA Release' -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          record="$EVIDENCE_DIR/issue-record.md"
          {
            echo "## Full-stack pc-prod controller run \`$GITHUB_RUN_ID\`"
            echo
            echo "- target SHA: \`$TARGET_SHA\`"
            echo "- deploy: \`$DEPLOY_RESULT\`"
            echo "- live RU/EN/ZH and intake: \`$LIVE_RESULT\`"
            echo "- PostgreSQL/audit/outbox: \`$DATABASE_RESULT\`"
            echo "- rollback: \`$ROLLBACK_RESULT\`"
            echo "- production inbound SSH used: \`false\`"
            echo "- pcactions direct Docker authority: \`false\`"
            echo "- terminal result: \`$state\`"
          } > "$record"
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"
          [[ "$state" == success ]] && gh issue close "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
      - name: Upload hosted redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-full-stack-release-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  result_gate:
    name: Confirm full-stack production chain result
    needs: [contract, image_authority, deploy, live_acceptance, verify_database, rollback, publish]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject failed, skipped or rolled-back production chain
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          IMAGE_RESULT: ${{ needs.image_authority.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.live_acceptance.result }}
          DATABASE_RESULT: ${{ needs.verify_database.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -Eeuo pipefail
          [[ "$CONTRACT_RESULT" == success ]]
          [[ "$IMAGE_RESULT" == success ]]
          [[ "$DEPLOY_RESULT" == success ]]
          [[ "$LIVE_RESULT" == success ]]
          [[ "$DATABASE_RESULT" == success ]]
          [[ "$ROLLBACK_RESULT" == skipped ]]
          [[ "$PUBLISH_RESULT" == success ]]
