name: Production Full-Stack Exact-SHA Release

on:
  workflow_call:
    inputs:
      owner_release_authorized:
        description: 'Set only by the owner-authorized production release controller.'
        required: true
        type: boolean
      target_sha:
        description: 'Immutable release candidate captured by the owner controller.'
        required: false
        default: ''
        type: string
      controller_issue_number:
        description: 'Exact owner-validated release issue propagated by the controller.'
        required: false
        default: 0
        type: number
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/production-full-stack-exact-sha.yml'
      - 'scripts/production-full-stack-exact-sha.sh'
      - 'scripts/release/verify-production-image-binding.py'
      - 'scripts/release/test-production-image-binding.py'
      - 'scripts/production-full-stack-live-acceptance.sh'
      - 'scripts/check-production-full-stack-release.mjs'
      - 'scripts/test-production-release-target-isolation.py'
      - 'scripts/test-production-full-stack-ssh-fingerprint.py'
      - 'docs/platform-v7/autopilot/scopes/production-full-stack-release-v1.json'
      - 'docs/ops/production-full-stack-release.md'
      - 'docs/ops/virtual-server-production-runbook.md'
      - 'docs/ops/vps-post-deploy-checklist.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/production-full-stack-exact-sha.yml'
      - 'scripts/production-full-stack-exact-sha.sh'
      - 'scripts/release/verify-production-image-binding.py'
      - 'scripts/release/test-production-image-binding.py'
      - 'scripts/production-full-stack-live-acceptance.sh'
      - 'scripts/check-production-full-stack-release.mjs'
      - 'scripts/test-production-release-target-isolation.py'
      - 'scripts/test-production-full-stack-ssh-fingerprint.py'
      - 'docs/platform-v7/autopilot/scopes/production-full-stack-release-v1.json'
permissions:
  contents: read
  packages: read
  issues: write

concurrency:
  group: production-full-stack-exact-sha
  cancel-in-progress: false
  queue: max

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  EVIDENCE_DIR: artifacts/production-full-stack-release
  RELEASE_ISSUE_NUMBER: 3072
  CONTINUATION_ISSUE_NUMBER: 4637
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  PROD_DIR_SECRET: ${{ secrets.PC_PROD_DIR }}
  PROD_COMPOSE_SECRET: ${{ secrets.PC_PROD_COMPOSE }}
  PROD_PROJECT_SECRET: ${{ secrets.PC_PROD_PROJECT }}
  BACKUP_EVIDENCE_FILE_SECRET: ${{ secrets.PC_PROD_BACKUP_EVIDENCE_FILE }}

jobs:
  contract:
    name: Validate full-stack release contract
    if: >-
      inputs.owner_release_authorized == true ||
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject every non-controller reusable release authority
        if: inputs.owner_release_authorized == true
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTROLLER_ISSUE_NUMBER: ${{ inputs.controller_issue_number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMAND: ${{ github.event.comment.body }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_SHA" == "$EVENT_SHA" ]]
          [[ "$CONTROLLER_ISSUE_NUMBER" == 3072 || "$CONTROLLER_ISSUE_NUMBER" == 4637 ]]
          [[ "$CONTROLLER_ISSUE_NUMBER" == "$EVENT_ISSUE_NUMBER" ]]
          [[ "$COMMENTER" == "$REPOSITORY_OWNER" && "$ASSOCIATION" == OWNER ]]
          [[ "$COMMAND" == '/production release current-main' ]]
          [[ "$GITHUB_ACTOR" == "$REPOSITORY_OWNER" ]]
          [[ "$GITHUB_TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" ]]
      - run: node scripts/check-production-full-stack-release.mjs
      - name: Exercise release target isolation
        run: python3 -B scripts/test-production-release-target-isolation.py
      - name: Exercise protected SSH fingerprint handling
        run: python3 -B scripts/test-production-full-stack-ssh-fingerprint.py
      - run: python3 -B scripts/release/test-production-image-binding.py

  deploy:
    name: Migrate, deploy API/web and canonical outbox, verify live delivery
    needs: contract
    if: >-
      (inputs.owner_release_authorized == true &&
       (inputs.controller_issue_number == 3072 || inputs.controller_issue_number == 4637) &&
         inputs.controller_issue_number == github.event.issue.number &&
         github.event.comment.user.login == github.repository_owner &&
         github.event.comment.author_association == 'OWNER' &&
         github.event.comment.body == '/production release current-main' &&
         github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: pc-crop-production-release-candidate
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Resolve immutable owner-authorized release candidate
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          target='${{ inputs.target_sha }}'
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          git cat-file -e "${target}^{commit}"
          current_main="$(git rev-parse origin/main)"
          [[ "$current_main" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          git merge-base --is-ancestor "$target" "$current_main" \
            || { echo RELEASE_CANDIDATE_NO_LONGER_ANCESTOR >&2; exit 14; }
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "short=${target:0:7}" >> "$GITHUB_OUTPUT"

      - name: Wait for and verify exact GHCR images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          for component in api web migration outbox-worker; do
            image="ghcr.io/pachaninm-lab/grainflow-${component}:sha-${SHORT_SHA}"
            ready=0
            for attempt in $(seq 1 90); do
              if docker pull "$image" >/dev/null 2>&1; then
                if exact_image="$(python3 scripts/release/verify-production-image-binding.py resolve "$component" "$TARGET_SHA" "$image" 2>/dev/null)"; then ready=1; break; fi
              fi
              sleep 10
            done
            (( ready == 1 )) || { echo "Exact $component image unavailable." >&2; exit 2; }
            python3 scripts/release/verify-production-image-binding.py verify "$component" "$TARGET_SHA" "$exact_image" > "$EVIDENCE_DIR/${component}-image.json" 2>/dev/null || { echo 'Exact image identity verification failed.' >&2; exit 2; }
            output_key="${component//-/_}_image"
            echo "${output_key}=$exact_image" >> "$GITHUB_OUTPUT"
          done
          printf '%s\n' "$TARGET_SHA" > "$EVIDENCE_DIR/target-sha.txt"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'Canonical VPS mismatch.' >&2; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo 'Protected production principal is missing or invalid.' >&2; exit 11; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Pinned host fingerprint is required.' >&2; exit 13; }
          domain_ips="$(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u || true)"
          grep -Fxq "$DEFAULT_HOST" <<< "$domain_ips"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" fingerprint
            tr -d '\r' 2>/dev/null < "$source" > "$target" || return 1
            chmod 600 "$target" 2>/dev/null || return 1
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            fingerprint="$(
              ssh-keygen -y -P '' -f "$target" </dev/null 2>/dev/null |
                ssh-keygen -lf /dev/stdin -E sha256 2>/dev/null |
                awk '{print $2}'
            )" || return 1
            [[ "$fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || return 1
            printf '%s\n' "$fingerprint" 2>/dev/null > "$EVIDENCE_DIR/ssh-key-fingerprint.txt" || return 1
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            printf '%s\n' no-valid-protected-private-key > "$EVIDENCE_DIR/ssh-credential-status.txt"
            echo 'No valid protected SSH private key is configured.' >&2
            exit 14
          }
          printf '%s\n' valid-private-key > "$EVIDENCE_DIR/ssh-credential-status.txt"

          scan="$(mktemp)"; match="$(mktemp)"
          pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"
            : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then
                pinned_ready=1
                break
              fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo 'Pinned host key mismatch after bounded retries.' >&2; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; docker compose version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Copy bounded release assets
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes)
          scp "${scp_common[@]}" scripts/production-full-stack-exact-sha.sh "$SSH_USER_SECRET@$HOST:/tmp/pc-full-stack-${GITHUB_RUN_ID}.sh"
          scp "${scp_common[@]}" scripts/release/verify-production-image-binding.py "$SSH_USER_SECRET@$HOST:/tmp/pc-full-stack-image-binding-${GITHUB_RUN_ID}.py" >/dev/null 2>&1 || { echo 'Release image verifier transfer failed.' >&2; exit 2; }
          scp "${scp_common[@]}" infra/sql/postgresql-outbox-worker-policies.sql "$SSH_USER_SECRET@$HOST:/tmp/pc-ir20-outbox-policy-${GITHUB_RUN_ID}.sql" >/dev/null 2>&1 || { echo 'Outbox policy transfer failed.' >&2; exit 2; }

      - name: Authenticate production host to exact private registry
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]]
          registry_config="/tmp/pc-registry-${GITHUB_RUN_ID}"
          printf '%s' "$GH_TOKEN" | ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$HOST" \
            "set -euo pipefail; rm -rf '$registry_config'; install -d -m 0700 '$registry_config'; DOCKER_CONFIG='$registry_config' docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null"
          printf '%s\n' HOSTED_REGISTRY_LOGIN=PASS > "$EVIDENCE_DIR/registry-login.txt"

      - name: Repair confirmed stale Redis network attachment
        id: redis_network
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main >/dev/null
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$(git rev-parse origin/main)" == "$current_main" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git merge-base --is-ancestor "$TARGET_SHA" "$current_main" \
            || { echo RELEASE_CANDIDATE_NO_LONGER_ANCESTOR >&2; exit 14; }
          raw="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$HOST" 'bash -se' > "$raw" 2>&1 <<'REMOTE'
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          stale_network(){
            local id="$1" mode network_id
            mode="$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$id")"
            case "$mode" in
              default|host|none|container:*) ;;
              *) docker network inspect "$mode" >/dev/null 2>&1 || return 0 ;;
            esac
            while IFS= read -r network_id; do
              [[ -n "$network_id" ]] || continue
              docker network inspect "$network_id" >/dev/null 2>&1 || return 0
            done < <(docker inspect --format '{{range .NetworkSettings.Networks}}{{.NetworkID}}{{println}}{{end}}' "$id")
            return 1
          }

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || { echo 'REDIS_NETWORK_REPAIR=AMBIGUOUS_WEB_AUTHORITY'; exit 81; }
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          working_dir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$web_id")"
          config_files="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$web_id")"
          [[ -n "$project" && -d "$working_dir" && -n "$config_files" ]] || { echo 'REDIS_NETWORK_REPAIR=COMPOSE_AUTHORITY_INVALID'; exit 82; }

          mapfile -t redis_ids < <(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=redis')
          (( ${#redis_ids[@]} == 1 )) || { echo 'REDIS_NETWORK_REPAIR=AMBIGUOUS_REDIS_AUTHORITY'; exit 83; }
          redis_id="${redis_ids[0]}"
          if ! stale_network "$redis_id"; then
            echo 'REDIS_NETWORK_REPAIR=NOT_REQUIRED'
            exit 0
          fi

          state="$(docker inspect --format '{{.State.Status}}' "$redis_id")"
          [[ "$state" != running ]] || { echo 'REDIS_NETWORK_REPAIR=REFUSED_RUNNING_REDIS'; exit 84; }
          before_image="$(docker inspect --format '{{.Image}}' "$redis_id")"
          full_override="$working_dir/compose.production-full-stack-image.override.yml"
          IFS=',' read -r -a raw_files <<< "$config_files"
          dc=(docker compose --project-directory "$working_dir" --project-name "$project")
          file_count=0
          for raw_file in "${raw_files[@]}"; do
            file="$(trim "$raw_file")"
            [[ -n "$file" ]] || continue
            [[ "$file" == /* ]] || file="$working_dir/$file"
            [[ -f "$file" ]] || { echo 'REDIS_NETWORK_REPAIR=COMPOSE_FILE_MISSING'; exit 85; }
            [[ "$file" == "$full_override" ]] && continue
            dc+=(-f "$file")
            file_count=$((file_count + 1))
          done
          (( file_count >= 1 )) || { echo 'REDIS_NETWORK_REPAIR=COMPOSE_AUTHORITY_EMPTY'; exit 86; }
          "${dc[@]}" config --quiet
          "${dc[@]}" up -d --no-deps --pull never --force-recreate redis
          new_redis_id="$("${dc[@]}" ps -q redis | head -1)"
          [[ -n "$new_redis_id" ]] || { echo 'REDIS_NETWORK_REPAIR=RECREATE_MISSING'; exit 87; }
          [[ "$(docker inspect --format '{{.Image}}' "$new_redis_id")" == "$before_image" ]] || { echo 'REDIS_NETWORK_REPAIR=IMAGE_CHANGED'; exit 88; }
          ready=0
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$new_redis_id" 2>/dev/null || true)"
            if [[ "$status" == healthy || "$status" == running ]]; then ready=1; break; fi
            sleep 2
          done
          (( ready == 1 )) || { echo 'REDIS_NETWORK_REPAIR=NOT_READY'; exit 89; }
          stale_network "$new_redis_id" && { echo 'REDIS_NETWORK_REPAIR=STALE_AFTER_RECREATE'; exit 90; }
          echo 'REDIS_NETWORK_REPAIR=PASS'
          REMOTE
          rc=$?
          set -e
          cat "$raw" | tee "$EVIDENCE_DIR/redis-network-repair.log"
          rm -f "$raw"
          (( rc == 0 )) || exit "$rc"
          status="$(sed -n 's/^REDIS_NETWORK_REPAIR=//p' "$EVIDENCE_DIR/redis-network-repair.log" | tail -1)"
          [[ "$status" == PASS || "$status" == NOT_REQUIRED ]]
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Execute migration and exact API/web rollout
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          MIGRATION_IMAGE: ${{ steps.images.outputs.migration_image }}
          OUTBOX_WORKER_IMAGE: ${{ steps.images.outputs.outbox_worker_image }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main >/dev/null
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$(git rev-parse origin/main)" == "$current_main" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git merge-base --is-ancestor "$TARGET_SHA" "$current_main" \
            || { echo RELEASE_CANDIDATE_NO_LONGER_ANCESTOR >&2; exit 14; }
          enc(){ printf '%s' "$1" | base64 -w0; }
          raw="$(mktemp)"; clean="$EVIDENCE_DIR/production-action.log"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$HOST" \
            "chmod 0700 /tmp/pc-full-stack-${GITHUB_RUN_ID}.sh && DOCKER_CONFIG='/tmp/pc-registry-${GITHUB_RUN_ID}' PC_RELEASE_IMAGE_BINDING_VERIFIER='/tmp/pc-full-stack-image-binding-${GITHUB_RUN_ID}.py' PC_OUTBOX_POLICY_FILE='/tmp/pc-ir20-outbox-policy-${GITHUB_RUN_ID}.sql' PC_API_IMAGE='$API_IMAGE' PC_WEB_IMAGE='$WEB_IMAGE' PC_MIGRATION_IMAGE='$MIGRATION_IMAGE' PC_OUTBOX_WORKER_IMAGE='$OUTBOX_WORKER_IMAGE' PC_PROD_DIR_B64='$(enc "${PROD_DIR_SECRET:-}")' PC_PROD_COMPOSE_B64='$(enc "${PROD_COMPOSE_SECRET:-}")' PC_PROD_PROJECT_B64='$(enc "${PROD_PROJECT_SECRET:-}")' PC_PROD_BACKUP_EVIDENCE_FILE_B64='$(enc "${BACKUP_EVIDENCE_FILE_SECRET:-}")' /tmp/pc-full-stack-${GITHUB_RUN_ID}.sh deploy '$TARGET_SHA' '$GITHUB_RUN_ID'" > "$raw" 2>&1
          rc=$?
          set -e
          sed -E 's#postgres(ql)?://[^[:space:]@]+@#postgresql://[REDACTED]@#g; /(_PATH|_DIR|COMPOSE|CONFIG_FILES)=/ s#=.*#=[REDACTED]#' "$raw" > "$clean"
          rm -f "$raw"
          cat "$clean"
          for field in DEPLOYMENT_COMPLETE MIGRATION_COMPLETE DEPLOYED_API_REVISION DEPLOYED_WEB_REVISION DEPLOYED_OUTBOX_WORKER_REVISION IR20_KAFKA_READY IR20_OUTBOX_WORKER_READY IR20_BROKER_RECOVERY BASELINE_API_REVISION BASELINE_WEB_REVISION WATCHTOWER_RETIRED BACKUP_MODE ROLLBACK_ATTEMPTED ROLLBACK_API_WEB_COMPLETE ROLLBACK_IR20_COMPLETE ROLLBACK_COMPLETE ROLLBACK_FAILED; do
            value="$(sed -n "s/^${field}=//p" "$clean" | tail -1)"
            echo "$(printf '%s' "$field" | tr '[:upper:]' '[:lower:]')=${value:-unknown}" >> "$GITHUB_OUTPUT"
          done
          ((rc==0)) || exit "$rc"

      - name: Verify public routes and durable intake
        id: live
        if: steps.production.outputs.deployment_complete == '1'
        continue-on-error: true
        env:
          PC_LIVE_BASE: ${{ env.LIVE_BASE }}
          PC_LIVE_EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}/live
          PC_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: bash scripts/production-full-stack-live-acceptance.sh '${{ steps.target.outputs.sha }}' | tee "$EVIDENCE_DIR/live.log"

      - name: Verify PostgreSQL, audit and outbox evidence
        id: database
        if: steps.live.outcome == 'success'
        continue-on-error: true
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          request="$(sed -n 's/^LIVE_REQUEST_NUMBER=//p' "$EVIDENCE_DIR/live.log" | tail -1)"
          correlation="$(sed -n 's/^LIVE_CORRELATION_ID=//p' "$EVIDENCE_DIR/live.log" | tail -1)"
          [[ "$request" =~ ^PC-[0-9]{8}-[0-9A-F]{12}$ ]]
          [[ "$correlation" =~ ^[A-Za-z0-9._:-]{8,128}$ ]]
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$HOST" \
            "PC_RELEASE_IMAGE_BINDING_VERIFIER='/tmp/pc-full-stack-image-binding-${GITHUB_RUN_ID}.py' PC_OUTBOX_WORKER_IMAGE='${{ steps.images.outputs.outbox_worker_image }}' /tmp/pc-full-stack-${GITHUB_RUN_ID}.sh verify-intake '$TARGET_SHA' '$GITHUB_RUN_ID' '$request' '$correlation'" \
            | tee "$EVIDENCE_DIR/durable-intake-db.log"
          grep -Fxq DURABLE_INTAKE_DB=PASS "$EVIDENCE_DIR/durable-intake-db.log"
          grep -Fxq IR20_LIVE_OUTBOX_DELIVERY=PASS "$EVIDENCE_DIR/durable-intake-db.log"

      - name: Observe exact IR-20 runtime for 30 minutes
        id: ir20_observation
        if: steps.database.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$HOST" \
            "PC_RELEASE_IMAGE_BINDING_VERIFIER='/tmp/pc-full-stack-image-binding-${GITHUB_RUN_ID}.py' PC_OUTBOX_WORKER_IMAGE='${{ steps.images.outputs.outbox_worker_image }}' /tmp/pc-full-stack-${GITHUB_RUN_ID}.sh observe-ir20 '$TARGET_SHA' '$GITHUB_RUN_ID'" \
            | tee "$EVIDENCE_DIR/ir20-observation.log"
          grep -Fxq IR20_RUNTIME_OBSERVATION=PASS "$EVIDENCE_DIR/ir20-observation.log"
          observation_seconds="$(sed -n 's/^IR20_OBSERVATION_SECONDS=//p' "$EVIDENCE_DIR/ir20-observation.log" | tail -1)"
          [[ "$observation_seconds" =~ ^[0-9]+$ ]] && (( observation_seconds >= 1800 ))

      - name: Restore exact API/web/outbox images after acceptance failure
        if: steps.live.outcome == 'failure' || steps.database.outcome == 'failure' || steps.ir20_observation.outcome == 'failure'
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$HOST" \
            "PC_RELEASE_IMAGE_BINDING_VERIFIER='/tmp/pc-full-stack-image-binding-${GITHUB_RUN_ID}.py' PC_OUTBOX_WORKER_IMAGE='${{ steps.images.outputs.outbox_worker_image }}' /tmp/pc-full-stack-${GITHUB_RUN_ID}.sh rollback '$TARGET_SHA' '$GITHUB_RUN_ID'" \
            | tee "$EVIDENCE_DIR/live-failure-rollback.log"

      - name: Remove production registry session and bounded assets
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOST:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$HOST" \
              "set -euo pipefail; DOCKER_CONFIG='/tmp/pc-registry-${GITHUB_RUN_ID}' docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf '/tmp/pc-registry-${GITHUB_RUN_ID}'; rm -f '/tmp/pc-full-stack-${GITHUB_RUN_ID}.sh' '/tmp/pc-full-stack-image-binding-${GITHUB_RUN_ID}.py' '/tmp/pc-ir20-outbox-policy-${GITHUB_RUN_ID}.sql'" \
              || true
          fi
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Publish release evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REDIS_NETWORK_REPAIR: ${{ steps.redis_network.outputs.status }}
          DEPLOYMENT_COMPLETE: ${{ steps.production.outputs.deployment_complete }}
          MIGRATION_COMPLETE: ${{ steps.production.outputs.migration_complete }}
          DEPLOYED_API_REVISION: ${{ steps.production.outputs.deployed_api_revision }}
          DEPLOYED_WEB_REVISION: ${{ steps.production.outputs.deployed_web_revision }}
          DEPLOYED_OUTBOX_WORKER_REVISION: ${{ steps.production.outputs.deployed_outbox_worker_revision }}
          IR20_KAFKA_READY: ${{ steps.production.outputs.ir20_kafka_ready }}
          IR20_OUTBOX_WORKER_READY: ${{ steps.production.outputs.ir20_outbox_worker_ready }}
          IR20_BROKER_RECOVERY: ${{ steps.production.outputs.ir20_broker_recovery }}
          ROLLBACK_ATTEMPTED: ${{ steps.production.outputs.rollback_attempted }}
          ROLLBACK_API_WEB_COMPLETE: ${{ steps.production.outputs.rollback_api_web_complete }}
          ROLLBACK_IR20_COMPLETE: ${{ steps.production.outputs.rollback_ir20_complete }}
          ROLLBACK_COMPLETE: ${{ steps.production.outputs.rollback_complete }}
          ROLLBACK_FAILED: ${{ steps.production.outputs.rollback_failed }}
          BASELINE_API_REVISION: ${{ steps.production.outputs.baseline_api_revision }}
          BASELINE_WEB_REVISION: ${{ steps.production.outputs.baseline_web_revision }}
          WATCHTOWER_RETIRED: ${{ steps.production.outputs.watchtower_retired }}
          BACKUP_MODE: ${{ steps.production.outputs.backup_mode }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
          IR20_OBSERVATION_OUTCOME: ${{ steps.ir20_observation.outcome }}
          EVIDENCE_ISSUE_NUMBER: ${{ inputs.owner_release_authorized == true && inputs.controller_issue_number || 3072 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_ISSUE_NUMBER" == "$RELEASE_ISSUE_NUMBER" || "$EVIDENCE_ISSUE_NUMBER" == "$CONTINUATION_ISSUE_NUMBER" ]]
          live="$(sed -n 's/^LIVE_ACCEPTANCE=//p' "$EVIDENCE_DIR/live.log" 2>/dev/null | tail -1 || true)"
          request="$(sed -n 's/^LIVE_REQUEST_NUMBER=//p' "$EVIDENCE_DIR/live.log" 2>/dev/null | tail -1 || true)"
          durable="$(sed -n 's/^DURABLE_INTAKE_DB=//p' "$EVIDENCE_DIR/durable-intake-db.log" 2>/dev/null | tail -1 || true)"
          outbox_delivery="$(sed -n 's/^IR20_LIVE_OUTBOX_DELIVERY=//p' "$EVIDENCE_DIR/durable-intake-db.log" 2>/dev/null | tail -1 || true)"
          observation="$(sed -n 's/^IR20_RUNTIME_OBSERVATION=//p' "$EVIDENCE_DIR/ir20-observation.log" 2>/dev/null | tail -1 || true)"
          audit_id="$(sed -n 's/^DURABLE_INTAKE_AUDIT_ID=//p' "$EVIDENCE_DIR/durable-intake-db.log" 2>/dev/null | tail -1 || true)"
          outbox_id="$(sed -n 's/^DURABLE_INTAKE_OUTBOX_ID=//p' "$EVIDENCE_DIR/durable-intake-db.log" 2>/dev/null | tail -1 || true)"
          rollback=not-required
          [[ "${ROLLBACK_ATTEMPTED:-0}" != 1 ]] || rollback=deploy-failure-attempted
          [[ ! -f "$EVIDENCE_DIR/live-failure-rollback.log" ]] || rollback=acceptance-failure-attempted
          record="$EVIDENCE_DIR/issue-record.md"
          {
            echo "## Full-stack release run \`$GITHUB_RUN_ID\`"
            echo
            echo "- target SHA: \`${TARGET_SHA:-unknown}\`"
            echo "- Redis network repair: \`${REDIS_NETWORK_REPAIR:-unknown}\`"
            echo "- backup: \`${BACKUP_MODE:-unknown}\`"
            echo "- migration complete: \`${MIGRATION_COMPLETE:-0}\`"
            echo "- deployment complete: \`${DEPLOYMENT_COMPLETE:-0}\`"
            echo "- API revision: \`${DEPLOYED_API_REVISION:-unknown}\`"
            echo "- web revision: \`${DEPLOYED_WEB_REVISION:-unknown}\`"
            echo "- outbox worker revision: \`${DEPLOYED_OUTBOX_WORKER_REVISION:-unknown}\`"
            echo "- Kafka ready: \`${IR20_KAFKA_READY:-0}\`"
            echo "- Kafka bounded recovery: \`${IR20_BROKER_RECOVERY:-unknown}\`"
            echo "- outbox worker ready: \`${IR20_OUTBOX_WORKER_READY:-0}\`"
            echo "- rollback API/Web restored: \`${ROLLBACK_API_WEB_COMPLETE:-unknown}\`"
            echo "- rollback IR-20 restored: \`${ROLLBACK_IR20_COMPLETE:-unknown}\`"
            echo "- rollback complete/failed: \`${ROLLBACK_COMPLETE:-unknown}/${ROLLBACK_FAILED:-unknown}\`"
            echo "- live acceptance: \`${live:-${LIVE_OUTCOME:-skipped}}\`"
            echo "- durable intake DB/audit/outbox: \`${durable:-${DATABASE_OUTCOME:-skipped}}\`"
            echo "- canonical outbox delivery: \`${outbox_delivery:-skipped}\`"
            echo "- IR-20 30-minute observation: \`${observation:-${IR20_OBSERVATION_OUTCOME:-skipped}}\`"
            echo "- live request number: \`${request:-none}\`"
            echo "- audit event: \`${audit_id:-none}\`"
            echo "- outbox entry: \`${outbox_id:-none}\`"
            echo "- baseline API: \`${BASELINE_API_REVISION:-unknown}\`"
            echo "- baseline web: \`${BASELINE_WEB_REVISION:-unknown}\`"
            echo "- rollback: \`$rollback\`"
            echo "- Watchtower retired: \`${WATCHTOWER_RETIRED:-0}\`"
          } > "$record"
          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"
          gh issue comment "$EVIDENCE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          if [[ "$EVIDENCE_ISSUE_NUMBER" == "$RELEASE_ISSUE_NUMBER" && "${DEPLOYMENT_COMPLETE:-0}" == 1 && "${MIGRATION_COMPLETE:-0}" == 1 && "$live" == PASS && "$durable" == PASS && "$outbox_delivery" == PASS && "$observation" == PASS && "${DEPLOYED_API_REVISION:-}" == "$TARGET_SHA" && "${DEPLOYED_WEB_REVISION:-}" == "$TARGET_SHA" && "${DEPLOYED_OUTBOX_WORKER_REVISION:-}" == "$TARGET_SHA" ]]; then
            gh issue close "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Enforce production result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.production.outputs.deployment_complete }}' == 1 ]]
          [[ '${{ steps.production.outputs.migration_complete }}' == 1 ]]
          [[ '${{ steps.live.outcome }}' == success ]]
          [[ '${{ steps.database.outcome }}' == success ]]
          [[ '${{ steps.ir20_observation.outcome }}' == success ]]
          [[ '${{ steps.production.outputs.deployed_outbox_worker_revision }}' == '${{ steps.target.outputs.sha }}' ]]
          [[ '${{ steps.production.outputs.ir20_kafka_ready }}' == 1 ]]
          [[ '${{ steps.production.outputs.ir20_outbox_worker_ready }}' == 1 ]]

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-full-stack-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
