name: Identity RLS hotfix dispatcher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: identity-rls-hotfix-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.pull_request.head.ref == 'identity-rls-3670'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: identity-rls-3670
          fetch-depth: 0

      - name: Execute prepared patch and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^      - name: Apply bounded authority integration$/ { found=1; next }
            found && /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Commit exact hotfix$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/identity-rls-hotfix-once.yml > /tmp/apply-identity-hotfix.sh
          test -s /tmp/apply-identity-hotfix.sh
          bash /tmp/apply-identity-hotfix.sh
          rm -f .github/workflows/identity-rls-hotfix-dispatch.yml
          rm -f .github/identity-rls-hotfix.trigger
          git diff --check
          git status --short

      - name: Commit final source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(identity-rls): route staff targets and industrial fixtures through authority"
          git push origin HEAD:identity-rls-3670
