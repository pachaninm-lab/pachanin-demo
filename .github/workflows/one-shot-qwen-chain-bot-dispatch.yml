name: One-shot exact-chain bot dispatch correction

on:
  push:
    branches: [fix/qwen-chain-bot-dispatch-3483]
    paths:
      - '.github/workflows/one-shot-qwen-chain-bot-dispatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qwen-chain-bot-dispatch-3483
          fetch-depth: 0
      - name: Permit repository-owner-triggered chain dispatch and publish exact images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python <<'PY'
          from pathlib import Path
          import json

          activation = Path('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml')
          text = activation.read_text()
          old = """          github.event_name == 'workflow_dispatch' &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          inputs.confirmation == 'ACTIVATE-RESTRICTED-QWEN-REG-RU'
"""
          new = """          github.event_name == 'workflow_dispatch' &&
          (
            (
              github.actor == github.repository_owner &&
              github.triggering_actor == github.repository_owner
            ) ||
            (
              github.actor == 'github-actions[bot]' &&
              github.triggering_actor == github.repository_owner
            )
          ) &&
          inputs.confirmation == 'ACTIVATE-RESTRICTED-QWEN-REG-RU'
"""
          if text.count(old) != 1:
              raise SystemExit('activation authorization anchor mismatch')
          activation.write_text(text.replace(old, new))

          docker = Path('.github/workflows/docker-publish.yml')
          text = docker.read_text()
          anchor = '# Operational no-op: force canonical API/web/migration image publication for the current main SHA.'
          replacement = '# Operational no-op: publish exact images for the repository-owner-triggered Qwen activation correction.'
          if text.count(anchor) != 1:
              raise SystemExit('docker trigger anchor mismatch')
          docker.write_text(text.replace(anchor, replacement))

          scope = {
              'schemaVersion': 'platform-v7.concurrent-scope.v1',
              'branch': 'fix/qwen-chain-bot-dispatch-3483',
              'status': 'active',
              'issue': 3483,
              'baseCommit': '79390feeaa918f79bd805b166affcc2efd5304b9',
              'operationalStatus': 'CHAIN_BOT_DISPATCH_AUTHORIZATION_CORRECTION',
              'allowedPaths': [
                  '.github/workflows/tai-restricted-qwen-reg-ru-activation.yml',
                  '.github/workflows/docker-publish.yml',
                  'docs/platform-v7/autopilot/scopes/fix-qwen-chain-bot-dispatch-3483.json',
              ],
              'boundaries': {
                  'runtimeBusinessBehaviorChange': False,
                  'securityGateDisabled': False,
                  'acceptanceGateWeakened': False,
                  'blanketContinueOnError': False,
                  'productionDeployment': True,
              },
              'acceptance': [
                  'owner-direct workflow dispatch remains accepted',
                  'github-actions bot dispatch is accepted only when the triggering actor is the repository owner',
                  'the exact confirmation phrase remains mandatory',
                  'exact current-main and exact image revision checks remain fail closed',
                  'canonical API web migration images publish for the correction SHA',
                  'REG.RU activation executes rather than skipping',
                  'authenticated Qwen inference RU EN ZH SSE Chromium UI and rollback gates remain mandatory',
                  'production remains REG.RU VPS only',
              ],
              'productionHosting': 'REG_RU_VPS_ONLY',
          }
          path = Path('docs/platform-v7/autopilot/scopes/fix-qwen-chain-bot-dispatch-3483.json')
          path.write_text(json.dumps(scope, ensure_ascii=False, indent=2) + '\n')
          PY

          rm .github/workflows/one-shot-qwen-chain-bot-dispatch.yml
          grep -Fq "github.actor == 'github-actions[bot]'" .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq 'github.triggering_actor == github.repository_owner' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          git diff --check
          git add .github/workflows/tai-restricted-qwen-reg-ru-activation.yml \
            .github/workflows/docker-publish.yml \
            docs/platform-v7/autopilot/scopes/fix-qwen-chain-bot-dispatch-3483.json \
            .github/workflows/one-shot-qwen-chain-bot-dispatch.yml
          git commit -m 'FIX: allow owner-triggered Qwen chain activation'
          git push origin HEAD:fix/qwen-chain-bot-dispatch-3483

# trigger after workflow registration
