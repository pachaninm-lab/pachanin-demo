name: Gekta P0 SPEED-2 Controller

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-p0-speed2-controller.yml'
      - 'scripts/gekta-speed2-model-diagnose.py'
      - 'scripts/gekta-speed2-real-canary.mjs'
      - 'docs/platform-v7/autopilot/scopes/gekta-p0-speed2-*.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gekta-p0-speed2-controller
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  SPEED_ISSUE_NUMBER: '4251'
  TRUSTED_CONNECTOR_APP_ID: '1144995'

jobs:
  contract:
    name: Validate SPEED-2 bounded controller
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compile bounded diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gekta-speed2-model-diagnose.py
          node --check scripts/gekta-speed2-real-canary.mjs

      - name: Validate controller contract and branch scope
        shell: bash
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          workflow = Path('.github/workflows/gekta-p0-speed2-controller.yml').read_text(encoding='utf-8')
          model_diag = Path('scripts/gekta-speed2-model-diagnose.py').read_text(encoding='utf-8')
          canary = Path('scripts/gekta-speed2-real-canary.mjs').read_text(encoding='utf-8')
          branch = os.environ['GITHUB_HEAD_REF']

          def fail(code: str, detail: str = '') -> None:
              safe = detail.replace('\n', ' ')[:500]
              print(f'::error title=SPEED2_CONTRACT_{code}::{safe or code}')
              raise SystemExit(1)

          parts = workflow.split('\n  control:\n', 1)
          if len(parts) != 2:
              fail('CONTROL_SECTION_MISSING')
          runtime_workflow = '\n  control:\n' + parts[1]

          required_workflow = [
              "/gekta speed2 status current-main",
              "/gekta speed2 diagnose current-main",
              "/gekta speed2 baseline current-main",
              "github.event.issue.number == 4251",
              "github.event.comment.author_association == 'OWNER'",
              "performed_via_github_app.id == 1144995",
              "StrictHostKeyChecking=yes",
              "manifest-pc-deploy.json",
              "journalctl -u tai-qwen3-8b.service",
              "actions/upload-artifact@v4",
              "gekta.speed2.s2-0.controller-evidence.v1",
          ]
          missing = [item for item in required_workflow if item not in runtime_workflow]
          if missing:
              fail('MISSING_WORKFLOW_INVARIANT', ' | '.join(missing))

          forbidden_workflow = [
              'sudo ',
              'systemctl restart',
              'systemctl stop',
              'systemctl start',
              'kill ',
              'pkill ',
              'docker ',
              'TAI_MODEL_ROOT_SSH_KEY',
              'PC_PROD_SSH_KEY',
              'VPS_SSH_KEY',
          ]
          bad = [item for item in forbidden_workflow if item in runtime_workflow]
          if bad:
              fail('FORBIDDEN_WORKFLOW_PRIMITIVE', ' | '.join(bad))

          required_model_diag = [
              'tai-qwen3-8b.service',
              'cmdline_sha256',
              'environment_sha256',
              'cache_prompt_effective',
              'accepted_speed3896_baseline_matches',
              'global_swap_used',
              'vm_swap',
              'prompt_tokens_total',
              'prompt_seconds_total',
              'prompt_content_published',
              'credentials_published',
          ]
          missing = [item for item in required_model_diag if item not in model_diag]
          if missing:
              fail('MISSING_MODEL_DIAG_INVARIANT', ' | '.join(missing))

          required_canary = [
              "'ru-cold'", "'ru-repeat'", "'en'", "'zh'", "'follow-up'",
              "prepareAnonymousPage", "measurePreparedPage", "qualityPass",
              "promptContentPublished: false", "answerContentPublished: false",
          ]
          missing = [item for item in required_canary if item not in canary]
          if missing:
              fail('MISSING_CANARY_INVARIANT', ' | '.join(missing))

          matching = []
          for path in Path('docs/platform-v7/autopilot/scopes').glob('gekta-p0-speed2-*.json'):
              try:
                  row = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if row.get('branch') == branch and row.get('status') == 'active':
                  matching.append((path, row))
          if len(matching) != 1:
              fail('BRANCH_SCOPE_COUNT', str(len(matching)))
          scope_path, scope = matching[0]
          if scope.get('schemaVersion') != 'platform-v7.concurrent-scope.v1':
              fail('SCOPE_SCHEMA')
          if scope.get('issue') != 4251 or scope.get('newRecurringCostRub') != 0:
              fail('SCOPE_AUTHORITY')
          allowed = set(scope.get('allowedPaths', []))
          required_allowed = {
              '.github/workflows/gekta-p0-speed2-controller.yml',
              'scripts/gekta-speed2-real-canary.mjs',
              str(scope_path),
          }
          if not required_allowed.issubset(allowed):
              fail('SCOPE_PATHS', ' | '.join(sorted(required_allowed - allowed)))
          PY

      - name: Prove scope guard
        shell: bash
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          BASE_REF: origin/main
        run: |
          set -euo pipefail
          bash scripts/p7-autopilot-guard.sh

  control:
    name: Run SPEED-2 status, diagnosis, or real prefill baseline
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4251 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (
        (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
        (github.actor == 'chatgpt-codex-connector[bot]' &&
         github.triggering_actor == 'chatgpt-codex-connector[bot]' &&
         github.event.comment.performed_via_github_app.id == 1144995)
      ) &&
      (
        github.event.comment.body == '/gekta speed2 status current-main' ||
        github.event.comment.body == '/gekta speed2 diagnose current-main' ||
        github.event.comment.body == '/gekta speed2 baseline current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
      MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
      MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
      MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
      MODEL_HOST_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prove owner provenance and resolve exact current main
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$main_sha" == "$(git rev-parse HEAD)" ]]
          [[ "$main_sha" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]

          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$COMMENT_BODY" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            provenance=OWNER_DIRECT
          else
            [[ "$GITHUB_ACTOR" == 'chatgpt-codex-connector[bot]' ]]
            [[ "${{ github.triggering_actor }}" == 'chatgpt-codex-connector[bot]' ]]
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            provenance=OWNER_CONNECTOR_APP
          fi

          case "$COMMENT_BODY" in
            '/gekta speed2 status current-main') op=status ;;
            '/gekta speed2 diagnose current-main') op=diagnose ;;
            '/gekta speed2 baseline current-main') op=baseline ;;
            *) exit 12 ;;
          esac

          script_sha="$(sha256sum scripts/gekta-speed2-model-diagnose.py | awk '{print $1}')"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "operation=$op" >> "$GITHUB_OUTPUT"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"
          echo "script_sha=$script_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve actual deployed application SHA
        id: deployed
        shell: bash
        env:
          MAIN_SHA: ${{ steps.authority.outputs.main_sha }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/manifest.json"
          status="$(curl --silent --show-error --location --compressed \
            --connect-timeout 10 --max-time 30 \
            --output "$manifest" --write-out '%{http_code}' \
            "$LIVE_BASE/manifest-pc-deploy.json?gekta-speed2=$GITHUB_RUN_ID-$(date +%s)")"
          deployed_sha="$(jq -r '.commitSha // empty' "$manifest" 2>/dev/null || true)"
          rm -f "$manifest"
          [[ "$status" == 200 && "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || exit 20
          git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$deployed_sha"
          git cat-file -e "${deployed_sha}^{commit}"
          git merge-base --is-ancestor "$deployed_sha" "$MAIN_SHA" || exit 21
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"

      - name: Refuse application-surface drift for real baseline
        if: steps.authority.outputs.operation == 'baseline'
        shell: bash
        env:
          MAIN_SHA: ${{ steps.authority.outputs.main_sha }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          paths=(
            apps/web/app/api/agro-chat/route.ts
            apps/web/lib/platform-v7/tai-internal-stream.ts
            apps/web/lib/platform-v7/tai-conversation-state.ts
            apps/web/lib/platform-v7/tai-conversation-session.ts
            apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts
            apps/api/src/modules/ai-insights/restricted-public-qwen.stream-gate.ts
            apps/api/src/modules/ai-insights/restricted-public-qwen.controller.ts
          )
          git diff --quiet "$DEPLOYED_SHA..$MAIN_SHA" -- "${paths[@]}" || {
            echo GEKTA_SPEED2_APPLICATION_SURFACE_DRIFT >&2
            exit 22
          }

      - name: Resolve pinned model-host transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }

          host="$(trim "${MODEL_HOST_SECRET:-}")"
          user="$(trim "${MODEL_USER_SECRET:-}")"
          port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && ((port >= 1 && port <= 65535))

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          write_key "$(trim "${MODEL_KEY_SECRET:-}")" "$HOME/.ssh/id_tai_model" || exit 23

          pin="$(trim "${MODEL_HOST_KEY_SECRET:-}")"
          [[ -n "$pin" ]] || exit 24
          pin_type="$(printf '%s' "$pin" | awk '{print $(NF-1)}')"
          pin_material="$(printf '%s' "$pin" | awk '{print $NF}')"
          scanned="$(ssh-keyscan -T 30 -p "$port" -t "$pin_type" "$host" 2>/dev/null || true)"
          printf '%s\n' "$scanned" | awk -v pinned="$pin_material" '$3 == pinned {ok=1} END{exit ok?0:1}' || exit 25

          printf '%s %s %s\n' "$host" "$pin_type" "$pin_material" > "$HOME/.ssh/model_known_hosts"
          chmod 600 "$HOME/.ssh/model_known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Execute bounded model-host status or diagnosis
        id: diagnostic
        if: steps.authority.outputs.operation != 'baseline'
        shell: bash
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_SSH_PORT: ${{ steps.ssh.outputs.port }}
          OPERATION: ${{ steps.authority.outputs.operation }}
        run: |
          set -uo pipefail
          raw="$RUNNER_TEMP/speed2-model-diagnostic.json"
          set +e
          ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$MODEL_USER@$MODEL_HOST" python3 - "$OPERATION" \
            < scripts/gekta-speed2-model-diagnose.py > "$raw" 2>/dev/null
          rc=$?
          set -e
          if [[ ! -s "$raw" ]]; then
            printf '%s\n' '{"schema":"gekta.speed2.s2-0.model-diagnostic.v1","result":"FAIL_CLOSED","error_code":"REMOTE_TRANSPORT_FAILED","privacy":{"prompt_content_published":false,"credentials_published":false,"raw_environment_published":false,"raw_argv_published":false}}' > "$raw"
            rc=40
          fi
          jq -e '.schema == "gekta.speed2.s2-0.model-diagnostic.v1" and .privacy.prompt_content_published == false and .privacy.credentials_published == false and .privacy.raw_environment_published == false and .privacy.raw_argv_published == false' "$raw" >/dev/null || rc=40
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "path=$raw" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.authority.outputs.operation == 'baseline'
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        if: steps.authority.outputs.operation == 'baseline'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install exact canary dependencies
        if: steps.authority.outputs.operation == 'baseline'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium runtime for real canary
        if: steps.authority.outputs.operation == 'baseline'
        run: pnpm --filter @pc/web exec playwright install --with-deps chromium

      - name: Execute real-path prefill rejection canary
        id: baseline_diag
        if: steps.authority.outputs.operation == 'baseline'
        shell: bash
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          ssh_base=(ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" -o StrictHostKeyChecking=yes)
          status_json="$RUNNER_TEMP/speed2-baseline-status.json"
          "${ssh_base[@]}" "$MODEL_USER@$MODEL_HOST" python3 - status \
            < scripts/gekta-speed2-model-diagnose.py > "$status_json" 2>/dev/null
          jq -e '.result == "PASS" and .runtime.accepted_speed3896_baseline_matches == true and .memory_kb.vm_swap == 0' "$status_json" >/dev/null

          rows="$RUNNER_TEMP/speed2-real-canary.ndjson"
          : > "$rows"
          for case_id in ru-cold ru-repeat en zh follow-up; do
            accepted=0
            for attempt in 1 2 3; do
              cursor="$(${ssh_base[@]} "$MODEL_USER@$MODEL_HOST" "journalctl -u tai-qwen3-8b.service -n 0 --show-cursor --no-pager 2>/dev/null | sed -n 's/^-- cursor: //p' | tail -n 1" || true)"
              [[ "$cursor" =~ ^[A-Za-z0-9_=\;:._-]{16,512}$ ]] || {
                echo SPEED2_JOURNAL_CURSOR_UNAVAILABLE >&2
                exit 31
              }

              sample="$RUNNER_TEMP/speed2-sample-${case_id}-${attempt}.json"
              set +e
              node scripts/gekta-speed2-real-canary.mjs --base-url "$LIVE_BASE" --case-id "$case_id" --timeout-ms 60000 > "$sample"
              sample_rc=$?
              set -e

              cursor_q="$(printf '%q' "$cursor")"
              raw_log="$RUNNER_TEMP/speed2-journal-${case_id}-${attempt}.log"
              "${ssh_base[@]}" "$MODEL_USER@$MODEL_HOST" "journalctl -u tai-qwen3-8b.service --after-cursor=$cursor_q --no-pager -o cat 2>/dev/null" > "$raw_log" || true

              timing="$RUNNER_TEMP/speed2-timing-${case_id}-${attempt}.json"
              python3 - "$raw_log" "$timing" <<'PY'
          import json, re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          pp = re.findall(r'prompt eval time =\s*([0-9.]+) ms /\s*(\d+) tokens', text)
          tg = re.findall(r'(?<!prompt )eval time =\s*([0-9.]+) ms /\s*(\d+) tokens', text)
          total = re.findall(r'total time =\s*([0-9.]+) ms /\s*(\d+) tokens', text)
          row = {
              'completionCount': len(pp),
              'uncontaminated': len(pp) == 1 and len(tg) == 1 and len(total) == 1,
              'promptEvalMs': float(pp[0][0]) if len(pp) == 1 else None,
              'newPromptTokens': int(pp[0][1]) if len(pp) == 1 else None,
              'generationMs': float(tg[0][0]) if len(tg) == 1 else None,
              'generatedTokens': int(tg[0][1]) if len(tg) == 1 else None,
              'modelTotalMs': float(total[0][0]) if len(total) == 1 else None,
              'rawJournalPublished': False,
          }
          Path(sys.argv[2]).write_text(json.dumps(row, separators=(',', ':')), encoding='utf-8')
          PY
              rm -f "$raw_log"

              if [[ "$sample_rc" == 0 ]] && jq -e '.uncontaminated == true' "$timing" >/dev/null; then
                jq -n --arg caseId "$case_id" --argjson sample "$(cat "$sample")" --argjson timing "$(cat "$timing")" '
                  {
                    caseId: $caseId,
                    sample: $sample,
                    model: $timing,
                    decomposition: {
                      headersToFirstTokenMs: ((($sample.firstTokenMs - $sample.headersMs) * 10) | round | . / 10),
                      nonPrefillBeforeFirstTokenMs: (((($sample.firstTokenMs - $sample.headersMs) - $timing.promptEvalMs) | if . < 0 then 0 else . end) * 10 | round | . / 10)
                    }
                  }' >> "$rows"
                accepted=1
                break
              fi
              rm -f "$sample" "$timing"
              sleep 1
            done
            [[ "$accepted" == 1 ]] || {
              echo "SPEED2_REAL_CANARY_UNCONTAMINATED_WINDOW_UNAVAILABLE case=$case_id" >&2
              exit 32
            }
          done

          canary="$RUNNER_TEMP/speed2-real-canary.json"
          jq -s '
            def med(xs): (xs | sort) as $s | ($s|length) as $n | if $n == 0 then null elif ($n % 2)==1 then $s[($n/2|floor)] else (($s[(($n/2)-1)]+$s[($n/2)])/2) end;
            . as $rows |
            ($rows | map(.sample.firstMeaningfulTextMs)) as $fm |
            ($rows | map(.model.promptEvalMs)) as $pp |
            ($rows | map(.model.newPromptTokens)) as $pt |
            ($rows | map(.decomposition.nonPrefillBeforeFirstTokenMs)) as $np |
            {
              schema: "gekta.speed2.real-prefill-canary.v1",
              result: (if (all($rows[]; .sample.ok == true and .sample.qualityPass == true and .sample.modelBacked == true and .sample.source == "local_qwen" and .model.uncontaminated == true)) then "PASS" else "FAIL" end),
              cases: $rows,
              summary: {
                caseCount: ($rows|length),
                firstMeaningfulP50Ms: med($fm),
                promptEvalP50Ms: med($pp),
                newPromptTokensP50: med($pt),
                nonPrefillBeforeFirstTokenP50Ms: med($np),
                ruColdPromptEvalMs: (($rows[] | select(.caseId=="ru-cold") | .model.promptEvalMs) // null),
                ruColdNewPromptTokens: (($rows[] | select(.caseId=="ru-cold") | .model.newPromptTokens) // null),
                ruRepeatPromptEvalMs: (($rows[] | select(.caseId=="ru-repeat") | .model.promptEvalMs) // null),
                ruRepeatNewPromptTokens: (($rows[] | select(.caseId=="ru-repeat") | .model.newPromptTokens) // null)
              },
              privacy: {
                promptContentPublished: false,
                answerContentPublished: false,
                userDataUsed: false,
                rawJournalPublished: false
              },
              productionConfigurationMutation: "NONE"
            }' "$rows" > "$canary"
          jq -e '.result == "PASS" and .summary.caseCount == 5' "$canary" >/dev/null

          raw="$RUNNER_TEMP/speed2-model-diagnostic.json"
          jq --argjson canary "$(cat "$canary")" '.operation="baseline" | .real_path_prefill_canary=$canary' "$status_json" > "$raw"
          rm -f "$RUNNER_TEMP"/speed2-sample-*.json "$RUNNER_TEMP"/speed2-timing-*.json "$rows" "$canary" "$status_json"
          echo "rc=0" >> "$GITHUB_OUTPUT"
          echo "path=$raw" >> "$GITHUB_OUTPUT"

      - name: Select diagnostic output
        id: selected
        if: always()
        shell: bash
        env:
          NORMAL_PATH: ${{ steps.diagnostic.outputs.path }}
          NORMAL_RC: ${{ steps.diagnostic.outputs.rc }}
          BASELINE_PATH: ${{ steps.baseline_diag.outputs.path }}
          BASELINE_RC: ${{ steps.baseline_diag.outputs.rc }}
          OPERATION: ${{ steps.authority.outputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == baseline ]]; then
            echo "path=$BASELINE_PATH" >> "$GITHUB_OUTPUT"
            echo "rc=${BASELINE_RC:-40}" >> "$GITHUB_OUTPUT"
          else
            echo "path=$NORMAL_PATH" >> "$GITHUB_OUTPUT"
            echo "rc=${NORMAL_RC:-40}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build machine-readable SPEED-2 evidence
        id: evidence
        if: always()
        shell: bash
        env:
          MAIN_SHA: ${{ steps.authority.outputs.main_sha }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.deployed_sha }}
          OPERATION: ${{ steps.authority.outputs.operation }}
          PROVENANCE: ${{ steps.authority.outputs.provenance }}
          SCRIPT_SHA: ${{ steps.authority.outputs.script_sha }}
          DIAG_PATH: ${{ steps.selected.outputs.path }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gekta-speed2-evidence.json"
          diag='{"schema":"gekta.speed2.s2-0.model-diagnostic.v1","result":"FAIL_CLOSED","error_code":"DIAGNOSTIC_OUTPUT_MISSING","privacy":{"prompt_content_published":false,"credentials_published":false,"raw_environment_published":false,"raw_argv_published":false}}'
          if [[ -n "${DIAG_PATH:-}" && -s "$DIAG_PATH" ]]; then diag="$(cat "$DIAG_PATH")"; fi
          jq -n \
            --arg schema 'gekta.speed2.s2-0.controller-evidence.v1' \
            --arg main "$MAIN_SHA" \
            --arg deployed "$DEPLOYED_SHA" \
            --arg operation "$OPERATION" \
            --arg provenance "$PROVENANCE" \
            --arg scriptSha "$SCRIPT_SHA" \
            --argjson diagnostic "$diag" \
            '{schema:$schema,authority:{issue:4251,exact_current_main:$main,deployed_application_sha:$deployed,provenance:$provenance},operation:$operation,diagnostic_script_sha256:$scriptSha,production_configuration_mutation:"NONE",recurring_cost_rub:0,diagnostic:$diagnostic}' > "$out"
          jq -e '.diagnostic.privacy.credentials_published == false' "$out" >/dev/null
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload SPEED-2 evidence artifact
        if: always() && steps.evidence.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: gekta-speed2-${{ steps.authority.outputs.operation }}-${{ github.run_id }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish bounded SPEED-2 evidence
        if: always() && steps.evidence.outputs.path != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_PATH: ${{ steps.evidence.outputs.path }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/speed2-comment.md"
          {
            echo '## Gekta SPEED-2 production evidence'
            echo
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo "- operation: \`$(jq -r '.operation' "$EVIDENCE_PATH")\`"
            echo "- exact current main: \`$(jq -r '.authority.exact_current_main' "$EVIDENCE_PATH")\`"
            echo "- deployed application SHA: \`$(jq -r '.authority.deployed_application_sha' "$EVIDENCE_PATH")\`"
            echo "- provenance: \`$(jq -r '.authority.provenance' "$EVIDENCE_PATH")\`"
            echo "- result: \`$(jq -r '.diagnostic.result // "FAIL_CLOSED"' "$EVIDENCE_PATH")\`"
            echo '- production configuration mutation: `NONE`'
            echo '- new recurring cost: `0 RUB`'
            if jq -e '.diagnostic.real_path_prefill_canary' "$EVIDENCE_PATH" >/dev/null 2>&1; then
              echo
              echo 'Real-path prefill summary:'
              echo '```json'
              jq -c '.diagnostic.real_path_prefill_canary.summary' "$EVIDENCE_PATH"
              echo '```'
            fi
          } > "$body"
          gh issue comment "$SPEED_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Cleanup transport and enforce fail-closed result
        if: always()
        shell: bash
        env:
          SELECTED_RC: ${{ steps.selected.outputs.rc }}
        run: |
          rm -f "$HOME/.ssh/id_tai_model" "$HOME/.ssh/model_known_hosts" "$RUNNER_TEMP"/speed2-journal-*.log
          [[ "${SELECTED_RC:-40}" == "0" ]]
