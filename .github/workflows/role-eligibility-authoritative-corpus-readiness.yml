name: Role Eligibility Authoritative Corpus Readiness

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/role-eligibility-authoritative-corpus-readiness.yml'
      - 'scripts/production-role-eligibility-authoritative-readiness.sh'
      - 'scripts/check-role-eligibility-authoritative-corpus-contract.mjs'
      - 'docs/platform-v7/role-eligibility/authoritative-corpus-readiness.md'

permissions:
  contents: read
  issues: write

env:
  DEFAULT_HOST: 195.19.12.120
  ISSUE_NUMBER: 4922
  COMMAND: /role-eligibility authoritative-corpus deployed
  EVIDENCE_DIR: artifacts/role-eligibility-authoritative-corpus
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

concurrency:
  group: role-eligibility-authoritative-corpus-readiness
  cancel-in-progress: false

jobs:
  contract:
    name: Validate authoritative corpus contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.number == 4922 &&
       github.event.comment.body == '/role-eligibility authoritative-corpus deployed' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate bounded read-only reporter
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-role-eligibility-authoritative-readiness.sh
          node scripts/check-role-eligibility-authoritative-corpus-contract.mjs

  report:
    name: Measure deployed authoritative shadow corpus
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4922 &&
      github.event.comment.body == '/role-eligibility authoritative-corpus deployed' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve current main for drift classification
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git fetch --no-tags origin main
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse origin/main)" == "$main_sha" ]]
          printf '%s\n' "$main_sha" > "$EVIDENCE_DIR/current-main-sha.txt"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo ROLE_ELIGIBILITY_CANONICAL_VPS_MISMATCH >&2; exit 20; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo ROLE_ELIGIBILITY_PRODUCTION_PRINCIPAL_INVALID >&2; exit 21; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 22
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo ROLE_ELIGIBILITY_PINNED_HOST_FINGERPRINT_REQUIRED >&2; exit 23; }
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"; ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || { echo ROLE_ELIGIBILITY_NO_VALID_PROTECTED_PRIVATE_KEY >&2; exit 24; }
          scan="$(mktemp)"; match="$(mktemp)"; pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo ROLE_ELIGIBILITY_PINNED_HOST_KEY_MISMATCH >&2; exit 25; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo ROLE_ELIGIBILITY_AUTHORITATIVE_SSH_AUTH=PASS' \
            | tee "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROLE_ELIGIBILITY_AUTHORITATIVE_SSH_AUTH=PASS "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Resolve deployed API and worker revision
        id: runtime
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_sha="$(ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" 'set -euo pipefail; mapfile -t ids < <(docker ps -q --filter "label=com.docker.compose.service=api"); (( ${#ids[@]} == 1 )); api="${ids[0]}"; api_image="$(docker inspect --format "{{.Image}}" "$api")"; api_rev="$(docker image inspect --format "{{index .Config.Labels \"org.opencontainers.image.revision\"}}" "$api_image")"; worker_image="$(docker inspect --format "{{.Image}}" pc-role-eligibility-worker)"; worker_rev="$(docker image inspect --format "{{index .Config.Labels \"org.opencontainers.image.revision\"}}" "$worker_image")"; [[ "$api_rev" == "$worker_rev" && "$api_rev" =~ ^[0-9a-f]{40}$ ]]; printf "%s" "$api_rev"')"
          [[ "$runtime_sha" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$runtime_sha" > "$EVIDENCE_DIR/deployed-runtime-sha.txt"
          echo "sha=$runtime_sha" >> "$GITHUB_OUTPUT"

      - name: Run read-only authoritative corpus report
        id: corpus
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$RUNTIME_SHA'" \
            < scripts/production-role-eligibility-authoritative-readiness.sh \
            > "$EVIDENCE_DIR/authoritative-corpus.json" \
            2> "$EVIDENCE_DIR/runtime.log"
          cat "$EVIDENCE_DIR/runtime.log"
          grep -Fxq ROLE_ELIGIBILITY_READINESS_REPORT=PASS "$EVIDENCE_DIR/runtime.log"
          grep -Fxq ROLE_ELIGIBILITY_SHADOW_MODE=true "$EVIDENCE_DIR/runtime.log"
          grep -Fxq ROLE_ELIGIBILITY_ENFORCEMENT=false "$EVIDENCE_DIR/runtime.log"
          grep -Fxq PRODUCTION_DATABASE_MUTATION=0 "$EVIDENCE_DIR/runtime.log"
          grep -Fxq REGISTRATION_RUNTIME_UNCHANGED=PASS "$EVIDENCE_DIR/runtime.log"

          node - "$EVIDENCE_DIR/authoritative-corpus.json" "$GITHUB_OUTPUT" "$RUNTIME_SHA" "$MAIN_SHA" <<'NODE'
          const fs = require('node:fs');
          const [reportPath, outputPath, runtimeSha, mainSha] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          if (report?.schemaVersion !== 'role-eligibility-authoritative-corpus.v1') throw new Error('REPORT_SCHEMA_INVALID');
          if (report?.transactionMode !== 'READ_ONLY' || report?.shadowMode !== true || report?.enforcement !== false) throw new Error('REPORT_MODE_INVALID');
          const a = report.authoritativeEvidenceReadiness;
          if (!a || !Number.isInteger(a.currentVerdicts) || !Number.isInteger(a.excludedCurrentVerdicts) || !Number.isInteger(a.authoritativeEvidenceRecords)) throw new Error('AUTHORITATIVE_COUNTS_INVALID');
          fs.appendFileSync(outputPath, [
            `decision=${report.readinessDecision}`,
            `current_verdicts=${report.totals.currentVerdicts}`,
            `authoritative_current=${a.currentVerdicts}`,
            `excluded_invalid_identifier=${a.excludedCurrentVerdicts}`,
            `authoritative_evidence=${a.authoritativeEvidenceRecords}`,
            `runtime_sha=${runtimeSha}`,
            `main_sha=${mainSha}`,
            `runtime_matches_main=${runtimeSha === mainSha}`,
          ].join('\n') + '\n');
          NODE

      - name: Publish bounded authoritative readiness evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.corpus.outputs.decision }}
          CURRENT: ${{ steps.corpus.outputs.current_verdicts }}
          AUTHORITATIVE: ${{ steps.corpus.outputs.authoritative_current }}
          EXCLUDED: ${{ steps.corpus.outputs.excluded_invalid_identifier }}
          EVIDENCE: ${{ steps.corpus.outputs.authoritative_evidence }}
          RUNTIME_SHA: ${{ steps.corpus.outputs.runtime_sha }}
          MAIN_SHA: ${{ steps.corpus.outputs.main_sha }}
          RUNTIME_MATCHES_MAIN: ${{ steps.corpus.outputs.runtime_matches_main }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/result.md" <<EOF
          ## Role Eligibility authoritative corpus observation \`$GITHUB_RUN_ID\`

          - production runtime SHA: \`$RUNTIME_SHA\`
          - current main SHA: \`$MAIN_SHA\`
          - runtime matches current main: \`$RUNTIME_MATCHES_MAIN\`
          - production DB transaction: \`READ ONLY\`
          - production DB mutation: \`0\`
          - registration runtime unchanged: \`PASS\`
          - enforcement: \`false\`
          - historical current verdicts: \`$CURRENT\`
          - authoritative-identifier current verdicts: \`$AUTHORITATIVE\`
          - excluded invalid-identifier current verdicts: \`$EXCLUDED\`
          - authoritative evidence records: \`$EVIDENCE\`
          - corpus decision: \`$DECISION\`

          Invalid-checksum rows remain durable history; exclusion is not negative legal-entity evidence.

          \`ROLE_ELIGIBILITY_AUTHORITATIVE_CORPUS=PENDING\`
          \`ROLE_ELIGIBILITY_ENFORCEMENT=false\`
          \`PRODUCTION_DATABASE_MUTATION=0\`
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/result.md"

      - name: Upload immutable observation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-eligibility-authoritative-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Preserve fail-closed terminal state
        if: always() && steps.corpus.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo ROLE_ELIGIBILITY_AUTHORITATIVE_CORPUS=PENDING
          echo ROLE_ELIGIBILITY_ENFORCEMENT=false
          echo PRODUCTION_DATABASE_MUTATION=0

      - name: Cleanup bounded credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
