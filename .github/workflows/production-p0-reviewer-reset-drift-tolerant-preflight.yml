name: Production P0 Reviewer Reset Drift-Tolerant Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-drift-tolerant-preflight.yml'
      - 'scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-reset-drift-tolerant-preflight-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate drift-tolerant reset preflight contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-reviewer-reset-preflight current-runtime'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce fail-closed read-only dynamic runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          script='scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh'
          bash -n "$script"
          expected_sha256='d1e463df928b4a5cb9ea960b96ba16dad80685d7d964abc9ddba487e7f7ff22d'
          actual_sha256="$(sha256sum "$script" | awk '{print $1}')"
          [[ "$actual_sha256" == "$expected_sha256" ]]
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh').read_text(encoding='utf-8')
          required = [
              "SAFE_BASELINE_SHA='440e40753e2cac13c93f8e007d9fe17c2b66caba'",
              "REVIEWED_RESET_SHA='a9c16814960520b20e8ae0c722570d9a3b4147f9'",
              "COMMAND='/production p0-reviewer-reset-preflight current-runtime'",
              "IMAP_RUN_ID='31923014818'",
              "SMTP_RUN_ID='31923847459'",
              'RESET_CRITICAL_PATHS=(',
              'apps/api/src/modules/auth/auth.controller.ts',
              '20260816161500_p0_password_reset_challenge_runtime_grant/migration.sql',
              'SET TRANSACTION READ ONLY',
              'has_sequence_privilege',
              'emit RESET_CREATE PASS',
              'emit RESET_CONSUME PASS',
              'emit USERS_EFFECTIVE_AUTHORITY PASS',
              'emit OUTBOX_EFFECTIVE_AUTHORITY PASS',
              'StrictHostKeyChecking=yes',
              'RESET_AUTHORIZED=YES',
              'PRODUCTION_MUTATION=NONE',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('missing invariant: ' + ' | '.join(missing))
          forbidden = [
              '--request POST', '-X POST', '--data', '--data-binary',
              'send_message(', 'sendmail(', 'MAIL FROM', 'RCPT TO',
              'INSERT INTO', 'UPDATE auth.', 'DELETE FROM', 'TRUNCATE ', 'ALTER ROLE',
              'docker restart', 'docker compose', 'docker service',
              'PC_RECONCILE_ACTIVE_RUNTIME', 'StrictHostKeyChecking=no', 'UserKnownHostsFile=/dev/null',
              'apps/api/src apps/api/prisma infra/docker',
              'apps/api/src/modules/auth/password-reset.controller.ts',
          ]
          bad = [x for x in forbidden if x in text]
          if bad:
              raise SystemExit('production mutation/bypass/broad-drift surface forbidden: ' + ' | '.join(bad))
          manifest_entries = [line for line in text.splitlines() if line.startswith("  'apps/")]
          if len(manifest_entries) != 21 or len(set(manifest_entries)) != 21:
              raise SystemExit('reset-critical manifest must contain exactly 21 unique fixed paths')
          PY

      - name: Verify exact owner-issued provenance
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EXPECTED_BODY: /production p0-reviewer-reset-preflight current-runtime
          TRUSTED_CONNECTOR_APP_ID: '1144995'
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$EXPECTED_BODY" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  preflight:
    name: Inspect live runtime and authorize at most one reset
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact current-main checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Run drift-tolerant read-only production preflight
        shell: bash
        run: bash scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh
