name: Production P0 Reviewer Reset Drift-Tolerant Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-drift-tolerant-preflight.yml'
      - 'docs/platform-v7/autopilot/scopes/p0-reviewer-reset-runtime-manifest-4637.json'
      - 'scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh'
      - 'scripts/production-p0-reviewer-reset-continuation-patch.py'
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  CONTINUATION_REVIEWED_RESET_SHA: 9310d7ae231b4d3b4904fe04712af05fbbea7a9c
  CONTINUATION_DEPLOYED_RUNTIME_SHA_AT_REVIEW: 8f380b5d2a3dba14d279679ddaf873ee6c522f85
  CONTINUATION_MANIFEST_SIZE: '23'

concurrency:
  group: ${{ github.event_name == 'issue_comment' && (github.event.issue.number == 3072 || github.event.issue.number == 4637) && github.event.comment.user.login == github.repository_owner && github.event.comment.author_association == 'OWNER' && ((github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) || github.event.comment.performed_via_github_app.id == 1144995) && github.event.comment.body == '/production p0-reviewer-reset-preflight current-runtime' && 'pc-crop-registration-lifecycle' || format('production-p0-reviewer-reset-drift-tolerant-preflight-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  contract:
    name: Validate drift-tolerant reset preflight contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        (github.event.issue.number == 3072 || github.event.issue.number == 4637) &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-reviewer-reset-preflight current-runtime'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce fail-closed read-only dynamic runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          script='scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh'
          patcher='scripts/production-p0-reviewer-reset-continuation-patch.py'
          bash -n "$script"
          expected_sha256='d1e463df928b4a5cb9ea960b96ba16dad80685d7d964abc9ddba487e7f7ff22d'
          actual_sha256="$(sha256sum "$script" | awk '{print $1}')"
          [[ "$actual_sha256" == "$expected_sha256" ]]
          expected_patcher_sha256='19af93117854f81638be983816a309fe731bb38c6630df26226c688047da8ed7'
          actual_patcher_sha256="$(sha256sum "$patcher" | awk '{print $1}')"
          [[ "$actual_patcher_sha256" == "$expected_patcher_sha256" ]]
          python3 "$patcher" self-test --source "$script"
          continuation_fixture="$RUNNER_TEMP/production-p0-reviewer-reset-preflight-4637-contract.sh"
          python3 "$patcher" patch --source "$script" --target "$continuation_fixture"
          bash -n "$continuation_fixture"
          grep -Fqx "RELEASE_ISSUE_NUMBER='4637'" "$continuation_fixture"
          grep -Fqx "REVIEWED_RESET_SHA='${CONTINUATION_REVIEWED_RESET_SHA}'" "$continuation_fixture"
          grep -Fqx "  'apps/api/src/modules/auth/password-hashing.ts'" "$continuation_fixture"
          grep -Fqx "  'apps/api/src/common/validators/strong-password.validator.ts'" "$continuation_fixture"
          grep -Fqx '(( ${#RESET_CRITICAL_PATHS[@]} == 23 ))' "$continuation_fixture"
          git cat-file -e "${CONTINUATION_REVIEWED_RESET_SHA}^{commit}"
          git cat-file -e "${CONTINUATION_DEPLOYED_RUNTIME_SHA_AT_REVIEW}^{commit}"
          git merge-base --is-ancestor "$CONTINUATION_REVIEWED_RESET_SHA" "$CONTINUATION_DEPLOYED_RUNTIME_SHA_AT_REVIEW"
          git merge-base --is-ancestor "$CONTINUATION_DEPLOYED_RUNTIME_SHA_AT_REVIEW" HEAD
          mapfile -t manifest_paths < <(
            sed -n '/^RESET_CRITICAL_PATHS=($/,/^)$/{
              s/^  '\''\(apps\/[^'\'']*\)'\''$/\1/p
            }' "$continuation_fixture"
          )
          [[ "${#manifest_paths[@]}" == "$CONTINUATION_MANIFEST_SIZE" ]]
          for path in "${manifest_paths[@]}"; do
            reviewed_blob="$(git rev-parse "$CONTINUATION_REVIEWED_RESET_SHA:$path")"
            deployed_blob="$(git rev-parse "$CONTINUATION_DEPLOYED_RUNTIME_SHA_AT_REVIEW:$path")"
            head_blob="$(git rev-parse "HEAD:$path")"
            [[ "$reviewed_blob" == "$deployed_blob" && "$deployed_blob" == "$head_blob" ]]
          done
          rm -f -- "$continuation_fixture"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/production-p0-reviewer-reset-drift-tolerant-preflight.yml').read_text(encoding='utf-8')
          required = [
              "SAFE_BASELINE_SHA='440e40753e2cac13c93f8e007d9fe17c2b66caba'",
              "REVIEWED_RESET_SHA='a9c16814960520b20e8ae0c722570d9a3b4147f9'",
              "COMMAND='/production p0-reviewer-reset-preflight current-runtime'",
              "IMAP_RUN_ID='31923014818'",
              "SMTP_RUN_ID='31923847459'",
              'RESET_CRITICAL_PATHS=(',
              'apps/api/src/modules/auth/auth.controller.ts',
              '20260816161500_p0_password_reset_challenge_runtime_grant/migration.sql',
              'SET TRANSACTION READ ONLY',
              'has_sequence_privilege',
              'emit RESET_CREATE PASS',
              'emit RESET_CONSUME PASS',
              'emit USERS_EFFECTIVE_AUTHORITY PASS',
              'emit OUTBOX_EFFECTIVE_AUTHORITY PASS',
              'StrictHostKeyChecking=yes',
              'RESET_AUTHORIZED=YES',
              'PRODUCTION_MUTATION=NONE',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('missing invariant: ' + ' | '.join(missing))
          workflow_required = [
              'pc-crop-registration-lifecycle',
              'queue: max',
              '(github.event.issue.number == 3072 || github.event.issue.number == 4637)',
              'CONTINUATION_ISSUE_NUMBER: $' + '{{ github.event.issue.number }}',
              'EXPECTED_EVENT_SHA: $' + '{{ github.sha }}',
              'CONTINUATION_REVIEWED_RESET_SHA: 9310d7ae231b4d3b4904fe04712af05fbbea7a9c',
              'CONTINUATION_DEPLOYED_RUNTIME_SHA_AT_REVIEW: 8f380b5d2a3dba14d279679ddaf873ee6c522f85',
              "CONTINUATION_MANIFEST_SIZE: '23'",
          ]
          workflow_missing = [x for x in workflow_required if x not in workflow]
          if workflow_missing:
              raise SystemExit('missing continuation workflow invariant: ' + ' | '.join(workflow_missing))
          preflight_job_marker = '\n  preflight:\n'
          runtime_step_marker = '      - name: Run drift-tolerant read-only production preflight'
          preflight_job_start = workflow.rfind(preflight_job_marker)
          runtime_step_start = workflow.rfind(runtime_step_marker)
          if preflight_job_start < 0 or runtime_step_start <= preflight_job_start:
              raise SystemExit('continuation runtime step boundary invalid')
          runtime_step = workflow[runtime_step_start:]
          continuation_start_marker = "          source='scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh'"
          continuation_end_marker = '            *) exit 64 ;;'
          if runtime_step.count(continuation_start_marker) != 1 or runtime_step.count(continuation_end_marker) != 1:
              raise SystemExit('continuation runtime boundary invalid')
          continuation_start = runtime_step.index(continuation_start_marker)
          continuation_end = runtime_step.index(continuation_end_marker, continuation_start)
          continuation_runtime = runtime_step[continuation_start:continuation_end]
          runtime_required = [
              "patcher='scripts/production-p0-reviewer-reset-continuation-patch.py'",
              'python3 "$patcher" patch --source "$source" --target "$script"',
              'bash -n "$script"',
              "grep -Fqx \"RELEASE_ISSUE_NUMBER='4637'\" \"$script\"",
              'grep -Fqx "REVIEWED_RESET_SHA=\'${CONTINUATION_REVIEWED_RESET_SHA}\'" "$script"',
              'apps/api/src/modules/auth/password-hashing.ts',
              'apps/api/src/common/validators/strong-password.validator.ts',
              '(( ${#RESET_CRITICAL_PATHS[@]} == 23 ))',
          ]
          runtime_missing = [x for x in runtime_required if x not in continuation_runtime]
          if runtime_missing:
              raise SystemExit('missing continuation runtime invariant: ' + ' | '.join(runtime_missing))
          authorization_required = [
              'if [[ "$CONTINUATION_ISSUE_NUMBER" == \'3072\' ]]',
              '[[ "${GITHUB_RUN_ATTEMPT:-0}" == \'1\' ]]',
              'pc.p0-reviewer-reset-preflight-authorization.v1',
              "payload['issue'] != 4637 or payload['runAttempt'] != 1",
              'actions/upload-artifact@v4',
              "github.event.issue.number == 4637",
              'production-p0-reviewer-reset-preflight-$' + '{{ github.run_id }}-$' + '{{ github.run_attempt }}',
              'retention-days: 1',
          ]
          authorization_missing = [x for x in authorization_required if x not in runtime_step]
          if authorization_missing:
              raise SystemExit('missing authorization evidence invariant: ' + ' | '.join(authorization_missing))
          forbidden = [
              '--request POST', '-X POST', '--data', '--data-binary',
              'send_message(', 'sendmail(', 'MAIL FROM', 'RCPT TO',
              'INSERT INTO', 'UPDATE auth.', 'DELETE FROM', 'TRUNCATE ', 'ALTER ROLE',
              'docker restart', 'docker compose', 'docker service',
              'PC_RECONCILE_ACTIVE_RUNTIME', 'StrictHostKeyChecking=no', 'UserKnownHostsFile=/dev/null',
              'apps/api/src apps/api/prisma infra/docker',
              'apps/api/src/modules/auth/password-reset.controller.ts',
          ]
          bad = [x for x in forbidden if x in text]
          if bad:
              raise SystemExit('production mutation/bypass/broad-drift surface forbidden: ' + ' | '.join(bad))
          manifest_entries = [line for line in text.splitlines() if line.startswith("  'apps/")]
          if len(manifest_entries) != 21 or len(set(manifest_entries)) != 21:
              raise SystemExit('reset-critical manifest must contain exactly 21 unique fixed paths')
          PY

      - name: Verify exact owner-issued provenance
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EXPECTED_BODY: /production p0-reviewer-reset-preflight current-runtime
          TRUSTED_CONNECTOR_APP_ID: '1144995'
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$EXPECTED_BODY" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          case "$CONTINUATION_ISSUE_NUMBER" in
            3072) ;;
            4637) [[ "$target" == "$EXPECTED_EVENT_SHA" ]] ;;
            *) exit 64 ;;
          esac
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  preflight:
    name: Inspect live runtime and authorize at most one reset
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact current-main checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Run drift-tolerant read-only production preflight
        id: authorization
        shell: bash
        env:
          CONTINUATION_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -Eeuo pipefail
          source='scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh'
          patcher='scripts/production-p0-reviewer-reset-continuation-patch.py'
          script="$source"
          case "$CONTINUATION_ISSUE_NUMBER" in
            3072) ;;
            4637)
              script="$RUNNER_TEMP/production-p0-reviewer-reset-preflight-4637.sh"
              python3 "$patcher" patch --source "$source" --target "$script"
              chmod 0700 "$script"
              bash -n "$script"
              grep -Fqx "RELEASE_ISSUE_NUMBER='4637'" "$script"
              grep -Fqx "REVIEWED_RESET_SHA='${CONTINUATION_REVIEWED_RESET_SHA}'" "$script"
              grep -Fqx "  'apps/api/src/modules/auth/password-hashing.ts'" "$script"
              grep -Fqx "  'apps/api/src/common/validators/strong-password.validator.ts'" "$script"
              grep -Fqx '(( ${#RESET_CRITICAL_PATHS[@]} == 23 ))' "$script"
              ;;
            *) exit 64 ;;
          esac
          if [[ "$CONTINUATION_ISSUE_NUMBER" == '3072' ]]; then
            bash "$script"
            exit 0
          fi
          [[ "${GITHUB_RUN_ATTEMPT:-0}" == '1' ]]
          out="$RUNNER_TEMP/production-p0-reviewer-reset-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.out"
          set +e
          bash "$script" 2>&1 | tee "$out"
          rc="${PIPESTATUS[0]}"
          set -e
          (( rc == 0 ))
          grep -Fxq 'RESET_AUTHORIZED=YES' "$out"
          grep -Fxq 'PRODUCTION_MUTATION=NONE' "$out"
          runtime_sha="$(grep -E '^RUNTIME_DEPLOYED_SHA=[0-9a-f]{40}$' "$out" | tail -n1 | cut -d= -f2-)"
          [[ "$runtime_sha" =~ ^[0-9a-f]{40}$ ]]

          evidence="$RUNNER_TEMP/production-p0-reviewer-reset-preflight-authorization.json"
          EVIDENCE_PATH="$evidence" RUNTIME_SHA="$runtime_sha" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def decimal(name: str) -> int:
              value = os.environ[name]
              if not re.fullmatch(r'[1-9][0-9]{0,23}', value):
                  raise SystemExit(f'{name}_INVALID')
              return int(value)

          def sha(name: str) -> str:
              value = os.environ[name]
              if not re.fullmatch(r'[0-9a-f]{40}', value):
                  raise SystemExit(f'{name}_INVALID')
              return value

          payload = {
              'schemaVersion': 'pc.p0-reviewer-reset-preflight-authorization.v1',
              'runId': decimal('GITHUB_RUN_ID'),
              'runAttempt': decimal('GITHUB_RUN_ATTEMPT'),
              'issue': decimal('CONTINUATION_ISSUE_NUMBER'),
              'commentId': decimal('COMMENT_ID'),
              'sourceSha': sha('TARGET_SHA'),
              'runtimeSha': sha('RUNTIME_SHA'),
              'reviewedResetSha': sha('CONTINUATION_REVIEWED_RESET_SHA'),
              'manifestSize': int(os.environ['CONTINUATION_MANIFEST_SIZE']),
              'authorized': 'YES',
              'productionMutation': 'NONE',
          }
          if payload['issue'] != 4637 or payload['runAttempt'] != 1 or payload['manifestSize'] != 23:
              raise SystemExit('AUTHORIZATION_SCOPE_INVALID')
          Path(os.environ['EVIDENCE_PATH']).write_text(
              json.dumps(payload, separators=(',', ':'), sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          echo "evidence_path=$evidence" >> "$GITHUB_OUTPUT"

      - name: Upload bounded reset authorization evidence
        if: github.event.issue.number == 4637
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-reviewer-reset-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.authorization.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
