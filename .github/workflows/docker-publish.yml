name: Build & Publish Canonical Docker Images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/tai/**"
      - "infra/docker/Dockerfile.api"
      - "infra/docker/Dockerfile.web"
      - "infra/docker/Dockerfile.migrations"
      - "infra/docker/Dockerfile.tai"
      - "infra/compose/production-web-hardening.override.yml"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/role-eligibility-enforcement-migration.yml"
      - ".github/workflows/production-web-exact-sha.yml"
      - ".github/workflows/production-web-owner-exact-command.yml"
      - ".github/workflows/production-full-stack-exact-sha.yml"
      - ".github/workflows/production-p0-reviewer-password-reset-request.yml"
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - ".github/workflows/tai-reg-ru-preflight-owner-command.yml"
      - ".github/workflows/tai-automatic-reg-ru-preflight.yml"
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-owner-reg-ru-deployment-command.yml"
      - ".github/workflows/tai-owner-controller-sync-command.yml"
      - "scripts/production-role-eligibility-enforcement-migration.sh"
      - "scripts/check-role-eligibility-enforcement-migration-contract.mjs"
      - "config/eligibility/registration-protected-manifest.json"
      - "scripts/production-web-exact-sha.sh"
      - "scripts/production-web-live-acceptance.sh"
      - "scripts/production-web-remote-entrypoint.sh"
      - "scripts/production-full-stack-exact-sha.sh"
      - "scripts/production-full-stack-live-acceptance.sh"
      - "scripts/check-production-full-stack-release.mjs"
      - "scripts/production-p0-reviewer-password-reset-request.sh"
      - "scripts/check-production-p0-reviewer-password-reset-request.mjs"
      - "scripts/tai-reg-ru-preflight.sh"
      - "scripts/check-tai-reg-ru-preflight.mjs"
      - "scripts/verify-tai-preflight-report.mjs"
      - "scripts/check-tai-bootstrap-preflight.mjs"
      - "scripts/check-tai-automatic-release-chain.mjs"
      - "scripts/tai-restricted-qwen-reg-ru-activate.sh"
      - "scripts/tai-reg-ru-deploy.sh"
      - "scripts/pc-tai-release-controller.sh"
      - "scripts/pc-tai-release-controller-core.sh"
      - "scripts/pc-tai-controller-sync.sh"
      - "scripts/check-tai-controller-sync.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "scripts/resume-pc-prod-actions-runner.sh"
      - "scripts/check-pc-tai-release-controller.mjs"
      - "scripts/check-pc-release-authority-boundary.mjs"
      # The hosted acceptance scripts and the contract they read decide whether
      # a release is confirmed. A change to them that never rebuilds an image
      # leaves the release chain judging production by a reader the images were
      # never built with — which is how a stale assessment schema survived.
      - "scripts/tai-live-public-ai-acceptance.mjs"
      - "scripts/tai-potato-mobile-live-acceptance.mjs"
      - "scripts/tai-public-assessment-contract.mjs"
      - "scripts/tai-conversation-subject-contract.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "scripts/resume-pc-prod-actions-runner.sh"
      - "scripts/check-resume-pc-prod-actions-runner.mjs"
      - "apps/tai/TAI_REG_RU_PREFLIGHT.md"
      - "docs/platform-v7/autopilot/scopes/*reg-ru-preflight*.json"
      - "docs/platform-v7/autopilot/scopes/*bootstrap-preflight*.json"
      - "docs/platform-v7/autopilot/scopes/*bootstrap-canonical-images*.json"
      - "docs/platform-v7/autopilot/scopes/*automatic-exact-release-chain*.json"
      - "docs/platform-v7/autopilot/scopes/*tai-runner*.json"
      - "docs/platform-v7/autopilot/scopes/*least-privilege-controller*.json"
      - "docs/platform-v7/autopilot/scopes/*controller-canonical-trigger*.json"
      - "docs/platform-v7/autopilot/scopes/*controller-sync*.json"
  workflow_dispatch:
    inputs:
      services:
        description: "Canonical services to build: api, web, tai, migration or all"
        default: "all"
        required: false
  workflow_call:
    inputs:
      services:
        description: "Canonical services to build: api, web, tai, migration or all"
        type: string
        default: "all"
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/grainflow
  TAI_IMAGE: ghcr.io/${{ github.repository_owner }}/grainflow-tai

jobs:
  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    if: >-
      contains(inputs.services, 'api') ||
      inputs.services == 'all' ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,format=short

      - name: Build and push API authority
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api,ignore-error=true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    if: >-
      contains(inputs.services, 'web') ||
      inputs.services == 'all' ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=sha,format=short

      - name: Build and push web authority
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

  build-tai:
    name: Build TAI image
    runs-on: ubuntu-latest
    if: >-
      contains(inputs.services, 'tai') ||
      inputs.services == 'all' ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-tai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TAI_IMAGE }}
          tags: |
            type=sha,format=short

      - name: Build and push TAI authority
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.tai
          push: true
          tags: ${{ steps.meta-tai.outputs.tags }}
          labels: ${{ steps.meta-tai.outputs.labels }}
          cache-from: type=gha,scope=tai
          cache-to: type=gha,mode=max,scope=tai,ignore-error=true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}

  build-migration:
    name: Build migration image
    runs-on: ubuntu-latest
    if: >-
      contains(inputs.services, 'migration') ||
      inputs.services == 'all' ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-migration
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-migration
          tags: |
            type=sha,format=short

      - name: Build and push migration authority
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.migrations
          push: true
          tags: ${{ steps.meta-migration.outputs.tags }}
          labels: ${{ steps.meta-migration.outputs.labels }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration,ignore-error=true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}

  helm-validate:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Lint Helm chart
        run: helm lint infra/helm/grainflow

      - name: Render Helm chart
        run: helm template grainflow infra/helm/grainflow --namespace grainflow-prod > /tmp/grainflow-rendered.yaml

# Canonical API, web, TAI and migration images are published for the exact main SHA.
