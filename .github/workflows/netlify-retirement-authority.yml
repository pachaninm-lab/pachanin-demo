name: Netlify Retirement Authority

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove structural retirement detector contract
        run: node scripts/check-netlify-retirement.contract.mjs
      - name: Prove Netlify is absent from active project surfaces
        run: node scripts/check-netlify-retirement.mjs
