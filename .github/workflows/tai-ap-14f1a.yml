name: TAI AP-14F1A Authority Schema Patch

on:
  push:
    branches:
      - agent/tai-ap-14f1a-public-corpus-authority-3346
    paths:
      - '.github/workflows/tai-ap-14f1a.yml'

permissions:
  contents: write

concurrency:
  group: tai-ap-14f1a-authority-schema-patch
  cancel-in-progress: false

jobs:
  patch-postgresql-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Point table-shape assertion at database-managed schema
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/tai-ap-14f1a/postgresql-acceptance.sql')
          text = path.read_text(encoding='utf-8')
          old = "  WHERE n.nspname = 'public'\n    AND c.relkind = 'r'\n"
          new = "  WHERE n.nspname = 'tai_knowledge'\n    AND c.relkind = 'r'\n"
          matches = text.count(old)
          if matches == 1:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif matches != 0:
              raise SystemExit(f'expected zero or one schema target, found {matches}')
          PY

          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'p7-authority-bot'
          git config user.email 'p7-authority-bot@users.noreply.github.com'
          git add scripts/tai-ap-14f1a/postgresql-acceptance.sql
          git commit -m 'TAI AP-14F1A: validate database-managed authority schema'
          git push origin "HEAD:${GITHUB_REF_NAME}"
