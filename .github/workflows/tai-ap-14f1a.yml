name: TAI AP-14F1A Public Official Corpus Authority

on:
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f1a.yml'
      - 'apps/tai/tai/migrations/0019_public_official_corpus.sql'
      - 'apps/tai/tai/migrations/0020_public_official_corpus_audit_authority.sql'
      - 'apps/tai/tai/migrations/manifest.json'
      - 'apps/tai/tai/postgres_public_official_corpus.py'
      - 'apps/tai/tai/public_official_corpus.py'
      - 'apps/tai/tests/test_migration_manifest.py'
      - 'apps/tai/tests/test_postgres_public_official_corpus.py'
      - 'apps/tai/tests/test_public_official_corpus.py'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1a-3345.json'
      - 'scripts/tai-ap-14f1a/verify.mjs'
  push:
    branches:
      - main
      - agent/tai-ap-14f1a-public-corpus-authority-3345
    paths:
      - '.github/workflows/tai-ap-14f1a.yml'
      - 'apps/tai/tai/migrations/0019_public_official_corpus.sql'
      - 'apps/tai/tai/migrations/0020_public_official_corpus_audit_authority.sql'
      - 'apps/tai/tai/migrations/manifest.json'
      - 'apps/tai/tai/postgres_public_official_corpus.py'
      - 'apps/tai/tai/public_official_corpus.py'
      - 'apps/tai/tests/test_migration_manifest.py'
      - 'apps/tai/tests/test_postgres_public_official_corpus.py'
      - 'apps/tai/tests/test_public_official_corpus.py'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1a-3345.json'
      - 'scripts/tai-ap-14f1a/verify.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tai-ap-14f1a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: artifacts/tai-ap-14f1a
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tai_ap14f1a

jobs:
  public-corpus-authority:
    name: Admission · PostgreSQL · snapshot · withdrawal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: ghcr.io/pachaninm-lab/ci-postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tai_ap14f1a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tai_ap14f1a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - name: Resolve governed comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            base_ref="HEAD^"
          else
            base_ref="914b2be00cebfe9b3c24e75dc9a6aa4df5b21dbf"
          fi
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/tai/pyproject.toml

      - name: Verify source-controlled scope
        if: github.ref_name != 'main'
        shell: bash
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: |
          set -euo pipefail
          export GITHUB_HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          bash scripts/p7-autopilot-guard.sh

      - name: Install TAI test toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e 'apps/tai[dev]'

      - name: Static and unit acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ruff check \
            apps/tai/tai/public_official_corpus.py \
            apps/tai/tai/postgres_public_official_corpus.py \
            apps/tai/tests/test_public_official_corpus.py \
            apps/tai/tests/test_postgres_public_official_corpus.py \
            apps/tai/tests/test_migration_manifest.py \
            | tee "$EVIDENCE_DIR/ruff.txt"
          mypy \
            apps/tai/tai/public_official_corpus.py \
            apps/tai/tai/postgres_public_official_corpus.py \
            | tee "$EVIDENCE_DIR/mypy.txt"
          pytest \
            apps/tai/tests/test_public_official_corpus.py \
            apps/tai/tests/test_postgres_public_official_corpus.py \
            apps/tai/tests/test_migration_manifest.py \
            | tee "$EVIDENCE_DIR/pytest.txt"

      - name: PostgreSQL 16 authority acceptance
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          from pathlib import Path
          import psycopg

          migration_root = Path('apps/tai/tai/migrations')
          migrations = [
              migration_root / '0019_public_official_corpus.sql',
              migration_root / '0020_public_official_corpus_audit_authority.sql',
          ]
          with psycopg.connect(os.environ['TEST_DATABASE_URL'], autocommit=True) as connection:
              for migration in migrations:
                  connection.execute(migration.read_text(encoding='utf-8'))
              required = {
                  'tai_public_corpus_source_admissions',
                  'tai_public_corpus_artifacts',
                  'tai_public_corpus_quarantine',
                  'tai_public_corpus_snapshots',
                  'tai_public_corpus_chunks',
                  'tai_public_corpus_audit',
              }
              rows = connection.execute(
                  "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename LIKE 'tai_public_corpus_%'"
              ).fetchall()
              actual = {row[0] for row in rows}
              if not required.issubset(actual):
                  raise SystemExit(f'missing tables: {sorted(required - actual)}')
              functions = connection.execute(
                  "SELECT proname FROM pg_proc WHERE proname IN ('tai_activate_public_corpus_snapshot','tai_withdraw_public_corpus_source','tai_public_corpus_audit_immutable_guard')"
              ).fetchall()
              if {row[0] for row in functions} != {
                  'tai_activate_public_corpus_snapshot',
                  'tai_withdraw_public_corpus_source',
                  'tai_public_corpus_audit_immutable_guard',
              }:
                  raise SystemExit('governed functions missing')
              views = connection.execute(
                  "SELECT viewname FROM pg_views WHERE schemaname = 'public' AND viewname = 'tai_active_public_corpus_chunks_v1'"
              ).fetchall()
              if views != [('tai_active_public_corpus_chunks_v1',)]:
                  raise SystemExit('active corpus view missing')
              triggers = connection.execute(
                  "SELECT tgname FROM pg_trigger WHERE tgrelid = 'tai_public_corpus_audit'::regclass AND NOT tgisinternal"
              ).fetchall()
              if triggers != [('tai_public_corpus_audit_immutable',)]:
                  raise SystemExit('immutable audit trigger missing')
          PY

      - name: Verify fail-closed slice contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$EXACT_HEAD" > "$EVIDENCE_DIR/exact-head.txt"
          printf '%s\n' "${{ steps.base.outputs.base_ref }}" > "$EVIDENCE_DIR/base-ref.txt"
          set +e
          node scripts/tai-ap-14f1a/verify.mjs \
            --scope-guard "${{ steps.base.outputs.base_ref }}" \
            > "$EVIDENCE_DIR/acceptance.json" \
            2> "$EVIDENCE_DIR/verifier-error.txt"
          verifier_status=$?
          set -e
          cat "$EVIDENCE_DIR/acceptance.json"
          cat "$EVIDENCE_DIR/verifier-error.txt" >&2
          test "$verifier_status" -eq 0
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/acceptance.json`, 'utf8'));
          if (report.status !== 'PASS') process.exit(1);
          if (report.operationalStatus !== 'NOT_ATTESTED') process.exit(1);
          if (report.productionHosting !== 'REG_RU_VPS_ONLY') process.exit(1);
          if (report.counts.changedPaths !== 11) process.exit(1);
          if (report.counts.migrationVersion !== 21) process.exit(1);
          if (Object.values(report.boundaries).some(Boolean)) process.exit(1);
          NODE

      - name: Upload AP-14F1A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-ap-14f1a-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
