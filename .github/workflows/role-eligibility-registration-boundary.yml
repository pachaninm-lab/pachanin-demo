name: Role Eligibility Registration Boundary

on:
  pull_request:
    paths:
      - 'apps/api/prisma/migrations/*role_eligibility*/migration.sql'
      - 'apps/api/src/modules/role-eligibility/**'
      - 'apps/api/src/app.module.ts'
      - 'config/eligibility/registration-protected-manifest.json'
      - 'scripts/role-eligibility-registration-principal-smoke.sh'
      - 'scripts/check-role-eligibility-registration-*.mjs'
      - '.github/workflows/role-eligibility-registration-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: role-eligibility-registration-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  registration-principal:
    name: Registration principal unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: role_eligibility_registration_guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d role_eligibility_registration_guard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Protected registration manifest
        run: node scripts/check-role-eligibility-registration-protected-manifest.mjs
      - name: Preserve pre-existing registration authority grants
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/role_eligibility_registration_guard
        run: bash scripts/role-eligibility-registration-principal-smoke.sh
