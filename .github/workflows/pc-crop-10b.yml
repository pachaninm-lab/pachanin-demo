name: PC-CROP-10B Government-System Truth Synchronization

on:
  pull_request:
    paths:
      - '.github/workflows/pc-crop-10b.yml'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-10b-truth-sync-3390.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.authority-bindings.schema.v1.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.authority-bindings.v1.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.readiness.v1.json'
      - 'scripts/pc-crop-10b/verify.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pc-crop-10b.yml'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-10b-truth-sync-3390.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.authority-bindings.schema.v1.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.authority-bindings.v1.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.readiness.v1.json'
      - 'scripts/pc-crop-10b/verify.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pc-crop-10b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: artifacts/pc-crop-10b

jobs:
  truth-synchronization:
    name: Exact authorities · declaration truth · next-adapter readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision and full ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce source-controlled PC-CROP scope
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            export BASE_REF="origin/${{ github.base_ref }}"
          else
            export BASE_REF="2ec85d97a0c63e5965df52029ece9f262763a486"
          fi
          export GITHUB_HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          bash scripts/p7-autopilot-guard.sh

      - name: Parse every PC-CROP-10B JSON authority
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            docs/platform-v7/autopilot/project-locks/pc-crop-remainder.json \
            docs/platform-v7/autopilot/scopes/pc-crop-10b-truth-sync-3390.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.registry.v1.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.authority-bindings.schema.v1.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.authority-bindings.v1.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.readiness.v1.json; do
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done

      - name: Verify exact predecessor authorities and fail-closed mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node --check scripts/pc-crop-10b/verify.mjs
          node scripts/pc-crop-10b/verify.mjs --self-test | tee "$EVIDENCE_DIR/verification.log"

      - name: Enforce machine-readable acceptance
        shell: bash
        run: |
          set -euo pipefail
          node - "$EVIDENCE_DIR/acceptance.json" "$EXACT_HEAD" <<'NODE'
          const fs = require('node:fs');
          const [path, head] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.status !== 'PASS') process.exit(1);
          if (report.exactHead !== head) process.exit(2);
          if (report.issue !== 3390 || report.slice !== 'PC-CROP-10B') process.exit(3);
          if (report.operationalStatus !== 'NOT_ATTESTED') process.exit(4);
          if (report.productionHosting !== 'REG_RU_VPS_ONLY') process.exit(5);
          if (report.counts.runtimeAuthorities !== 9) process.exit(6);
          if (report.counts.declarationBindings !== 23) process.exit(7);
          if (report.counts.liveDeclarations !== 0) process.exit(8);
          if (Object.values(report.boundaries).some(Boolean)) process.exit(9);
          NODE

      - name: Upload exact-head PC-CROP-10B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-crop-10b-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

  exact-main-status:
    name: Publish PC-CROP-10B exact-main status
    if: always() && github.ref_name == 'main'
    needs: [truth-synchronization]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish exact-main result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          RESULT: ${{ needs.truth-synchronization.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='PC-CROP-10B exact-main acceptance failed'
          if [[ "$RESULT" == success ]]; then
            state=success
            description='PC-CROP-10B exact-main acceptance passed'
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" \
            -f context='PC-CROP-10B exact-main' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          [[ "$state" == success ]]
