name: Platform V7 Production i18n Acceptance

on:
  workflow_run:
    workflows:
      - 'Production Web Exact-SHA Release'
      - 'Production Web Owner Exact-SHA Command'
      - 'Production Full-Stack Exact-SHA Release'
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full deployed main SHA; blank uses the selected ref SHA'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: platform-v7-production-i18n-acceptance
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  I18N_ISSUE_NUMBER: 2198

jobs:
  accepted:
    name: Resolve accepted protected Web release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/production-release-accepted-sha.yml
    with:
      release_run_id: ${{ github.event.workflow_run.id }}
      manual_sha: ''

  i18n-acceptance:
    name: EN/ZH exact production localization acceptance
    needs: accepted
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'Production Full-Stack Exact-SHA Release') ||
       needs.accepted.outputs.deployment_accepted == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Resolve exact deployed SHA
        id: target
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          ACCEPTED_SHA: ${{ needs.accepted.outputs.accepted_sha }}
          RELEASE_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && -n "${ACCEPTED_SHA:-}" ]]; then
            target_sha="$ACCEPTED_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            target_sha="$RELEASE_TARGET_SHA"
          elif [[ -n "${INPUT_TARGET_SHA:-}" ]]; then
            target_sha="$INPUT_TARGET_SHA"
          else
            target_sha="$GITHUB_SHA"
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 1

      - name: Verify exact public revision before i18n acceptance
        id: revision
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='artifacts/platform-v7-production-i18n/live-revision'
          summary="$evidence_dir/attempts.tsv"
          mkdir -p "$evidence_dir"
          printf 'attempt\tmanifest_http\tmanifest_rc\tmanifest_sha\tpage_http\tpage_rc\n' > "$summary"

          accepted=0
          last_manifest_sha='missing'
          for attempt in $(seq 1 12); do
            cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            manifest_file="$evidence_dir/manifest-${attempt}.json"
            manifest_headers="$evidence_dir/manifest-${attempt}.headers"
            page_file="$evidence_dir/platform-en-${attempt}.html"
            page_headers="$evidence_dir/platform-en-${attempt}.headers"

            set +e
            manifest_http="$(curl --silent --show-error --location --compressed \
              --connect-timeout 10 --max-time 30 \
              -D "$manifest_headers" -o "$manifest_file" -w '%{http_code}' \
              "$LIVE_BASE/manifest-pc-deploy.json?production-i18n=$cache_bust")"
            manifest_rc=$?
            page_http="$(curl --silent --show-error --location --compressed \
              --connect-timeout 10 --max-time 30 \
              -D "$page_headers" -o "$page_file" -w '%{http_code}' \
              "$LIVE_BASE/platform-v7?lang=en&production-i18n=$cache_bust")"
            page_rc=$?
            set -e

            manifest_sha="$(jq -r '.commitSha // empty' "$manifest_file" 2>/dev/null || true)"
            last_manifest_sha="${manifest_sha:-missing}"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$attempt" "${manifest_http:-000}" "$manifest_rc" "$last_manifest_sha" \
              "${page_http:-000}" "$page_rc" >> "$summary"

            if [[ "$manifest_rc" == 0 && "$page_rc" == 0 \
              && "$manifest_http" == 200 && "$page_http" == 200 \
              && "$manifest_sha" == "$TARGET_SHA" ]] \
              && grep -Fq 'data-testid="platform-v7-root-execution-cockpit"' "$page_file"; then
              cp "$manifest_file" "$evidence_dir/accepted-manifest.json"
              cp "$manifest_headers" "$evidence_dir/accepted-manifest.headers"
              cp "$page_file" "$evidence_dir/accepted-platform-en.html"
              cp "$page_headers" "$evidence_dir/accepted-platform-en.headers"
              printf 'PASS\n' > "$evidence_dir/result.txt"
              accepted=1
              break
            fi

            [[ "$attempt" == 12 ]] || sleep 5
          done

          echo "manifest_sha=$last_manifest_sha" >> "$GITHUB_OUTPUT"
          if (( accepted != 1 )); then
            printf 'FAIL\n' > "$evidence_dir/result.txt"
            echo "Exact public revision mismatch: expected=$TARGET_SHA manifest=$last_manifest_sha" >&2
            cat "$summary" >&2
            exit 3
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify EN/ZH dictionary source contract
        id: dictionary
        continue-on-error: true
        run: pnpm i18n:platform-v7

      - name: Verify translation runtime fallback contract
        id: runtime
        continue-on-error: true
        run: pnpm --filter @pc/web exec vitest run tests/unit/platformV7TranslationRuntime.test.ts

      - name: Install Chromium and WebKit runtimes
        run: pnpm --filter @pc/web exec playwright install --with-deps chromium webkit

      - name: Run exact production EN/ZH browser matrix
        id: browser
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.LIVE_BASE }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/platform-v7-production-i18n
          pnpm --filter @pc/web exec playwright test --config=playwright.production-i18n.config.ts \
            2>&1 | tee artifacts/platform-v7-production-i18n/browser-matrix.log

      - name: Publish i18n acceptance record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          REVISION_OUTCOME: ${{ steps.revision.outcome }}
          MANIFEST_SHA: ${{ steps.revision.outputs.manifest_sha }}
          DICTIONARY_OUTCOME: ${{ steps.dictionary.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/platform-v7-production-i18n
          as_result() {
            case "$1" in success) printf PASS ;; failure) printf FAIL ;; *) printf NOT_RUN ;; esac
          }
          revision_result="$(as_result "$REVISION_OUTCOME")"
          dictionary_result="$(as_result "$DICTIONARY_OUTCOME")"
          runtime_result="$(as_result "$RUNTIME_OUTCOME")"
          browser_result="$(as_result "$BROWSER_OUTCOME")"

          # The Playwright step is aggregate. A failure proves only that the browser
          # matrix failed somewhere. It does NOT, by itself, prove that every child
          # UX gate failed. Child gates may be claimed PASS only when the complete
          # matrix passes; otherwise they remain NOT_ATTESTED until independent
          # evidence identifies the exact failing assertion(s).
          if [[ "$browser_result" == PASS ]]; then
            browser_child_result=PASS
            browser_child_note=''
          elif [[ "$browser_result" == FAIL ]]; then
            browser_child_result=NOT_ATTESTED
            browser_child_note=' (aggregate browser matrix failed; inspect artifact for the exact failing assertion)'
          else
            browser_child_result=NOT_RUN
            browser_child_note=''
          fi

          record=artifacts/platform-v7-production-i18n/issue-comment.md
          {
            echo "## Platform V7 production i18n acceptance \`$GITHUB_RUN_ID\`"
            echo
            echo "- target SHA: \`$TARGET_SHA\`"
            echo "- exact public revision gate: \`$revision_result\`"
            echo "- manifest revision: \`${MANIFEST_SHA:-missing}\`"
            echo "- EN/ZH dictionary parity / no residual source Cyrillic contract: \`$dictionary_result\`"
            echo "- dynamic DOM + embedded dictionary fallback unit contract: \`$runtime_result\`"
            echo "- public EN/ZH browser matrix: \`$browser_result\`"
            echo "- Chromium 320/375/390/430 + desktop: \`$browser_child_result\`$browser_child_note"
            echo "- WebKit 320/375/390/430 + desktop: \`$browser_child_result\`$browser_child_note"
            echo "- visible Cyrillic outside allowed brand/ФГИС/СДИЗ/ЭДО: \`$browser_child_result\`$browser_child_note"
            echo "- horizontal overflow after localization: \`$browser_child_result\`$browser_child_note"
            echo "- Chinese computed typography on public home: \`$browser_child_result\`$browser_child_note"
            echo "- locale persistence after query selection and clean reload: \`$browser_child_result\`$browser_child_note"
            echo "- protected role-cockpit production matrix: \`NOT_ATTESTED\` (requires valid production identities; this workflow does not bypass auth)"
            echo "- browser diagnostic log: workflow artifact \`browser-matrix.log\`"
            echo "- screenshots and traces: workflow artifact"
            echo "- workflow run ID: \`$GITHUB_RUN_ID\`"
          } > "$record"
          gh issue comment "$I18N_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"

      - name: Build i18n evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='artifacts/platform-v7-production-i18n'
          mkdir -p "$evidence_dir"
          roots=("$evidence_dir")
          for candidate in apps/web/test-results/production-i18n apps/web/playwright-report-production-i18n; do
            [[ ! -e "$candidate" ]] || roots+=("$candidate")
          done
          find "${roots[@]}" -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > "$evidence_dir/sha256.txt"
          printf '%s\n' '${{ steps.target.outputs.target_sha }}' > "$evidence_dir/target-sha.txt"
          printf '%s\n' '${{ steps.revision.outcome }}' > "$evidence_dir/revision-outcome.txt"
          printf '%s\n' '${{ steps.dictionary.outcome }}' > "$evidence_dir/dictionary-outcome.txt"
          printf '%s\n' '${{ steps.runtime.outcome }}' > "$evidence_dir/runtime-outcome.txt"
          printf '%s\n' '${{ steps.browser.outcome }}' > "$evidence_dir/browser-outcome.txt"

      - name: Upload production i18n evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v7-production-i18n-${{ github.run_id }}
          path: |
            apps/web/test-results/production-i18n
            apps/web/playwright-report-production-i18n
            artifacts/platform-v7-production-i18n
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Enforce i18n acceptance result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.revision.outcome }}' == success ]] || exit 41
          [[ '${{ steps.dictionary.outcome }}' == success ]] || exit 42
          [[ '${{ steps.runtime.outcome }}' == success ]] || exit 43
          [[ '${{ steps.browser.outcome }}' == success ]] || exit 44
