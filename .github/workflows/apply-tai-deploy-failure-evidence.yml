name: Apply TAI deploy failure evidence repair

on:
  push:
    branches:
      - fix/tai-deploy-failure-evidence-20260801
    paths:
      - scripts/apply-tai-deploy-failure-evidence.py
      - .github/workflows/apply-tai-deploy-failure-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tai-deploy-failure-evidence
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/tai-deploy-failure-evidence-20260801
          fetch-depth: 0

      - name: Capture exact authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main fix/tai-deploy-failure-evidence-20260801
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"

      - name: Apply and verify bounded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-tai-deploy-failure-evidence.py
          bash -n scripts/pc-tai-release-controller-core.sh
          node scripts/check-pc-tai-release-controller.mjs
          git diff --check
          grep -Fq "grep -hE '^[A-Z][A-Z0-9]*_[A-Z0-9_]+$'" scripts/pc-tai-release-controller-core.sh
          ! grep -Eq 'publish_file .*deploy[.]log|runner-output/.+deploy[.]log' scripts/pc-tai-release-controller-core.sh

      - name: Publish reviewed source changes only
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main fix/tai-deploy-failure-evidence-20260801
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/fix/tai-deploy-failure-evidence-20260801)" = "$EXPECTED_HEAD"
          rm -f scripts/apply-tai-deploy-failure-evidence.py
          rm -f .github/workflows/apply-tai-deploy-failure-evidence.yml
          git add -A
          git diff --cached --name-only | sort | tee /tmp/tai-deploy-evidence-files.txt
          if grep -Ev '^(docs/platform-v7/autopilot/scopes/tai-deploy-failure-evidence-20260801[.]json|scripts/check-pc-tai-release-controller[.]mjs|scripts/pc-tai-release-controller-core[.]sh)$' /tmp/tai-deploy-evidence-files.txt; then
            echo 'Final diff exceeds registered failure-evidence scope.' >&2
            exit 31
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(tai): publish deterministic deploy failure code'
          git push --force-with-lease="refs/heads/fix/tai-deploy-failure-evidence-20260801:${EXPECTED_HEAD}" \
            origin HEAD:refs/heads/fix/tai-deploy-failure-evidence-20260801
