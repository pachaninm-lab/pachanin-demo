name: Production Auth Hash-Key Provision

on:
  pull_request:
    paths:
      - '.github/workflows/production-auth-opaque-token-key.yml'
      - 'scripts/production-full-stack-exact-sha.sh'
      - 'scripts/provision-production-auth-opaque-token-key.sh'
      - 'scripts/check-production-auth-opaque-token-provision.mjs'
      - 'docs/platform-v7/autopilot/scopes/production-auth-key-provision-3723.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-auth-opaque-token-key
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3072
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  EVIDENCE_DIR: artifacts/production-auth-opaque-token-key

jobs:
  authority:
    name: Validate owner authority and auth hash-key contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3072 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/production provision-auth-opaque-token-key current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate static safety contract
        if: github.event_name == 'pull_request'
        run: |
          set -Eeuo pipefail
          node scripts/check-production-auth-opaque-token-provision.mjs
          node scripts/check-production-full-stack-release.mjs
      - name: Resolve exact owner authority
        id: target
        if: github.event_name == 'issue_comment'
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENTER" == "$OWNER" && "$ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]]
          git fetch --no-tags origin main
          target_sha="$(git rev-parse origin/main)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$target_sha" ]]
          node scripts/check-production-auth-opaque-token-provision.mjs
          node scripts/check-production-full-stack-release.mjs
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

  provision:
    name: Provision protected auth hash keys on REG.RU
    needs: authority
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success' &&
      needs.authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ needs.authority.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact current-main checkout
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          node scripts/check-production-auth-opaque-token-provision.mjs
      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            ssh-keygen -lf "$public_key" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; echo ROOT_SSH_AUTH_OK' > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Provision or validate auth hash keys without disclosure
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          assert_bounded_worktree(){
            git diff --no-ext-diff --quiet --
            git diff --cached --no-ext-diff --quiet --
            while IFS= read -r -d '' untracked; do
              [[ "$untracked" == "$EVIDENCE_DIR/"* ]]
            done < <(git ls-files --others --exclude-standard -z)
          }
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          assert_bounded_worktree
          remote_script="/tmp/pc-auth-opaque-token-key-${GITHUB_RUN_ID}.sh"
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${scp_common[@]}" scripts/provision-production-auth-opaque-token-key.sh "$USER@$HOST:$remote_script"
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          assert_bounded_worktree
          ssh "${ssh_common[@]}" "$USER@$HOST" \
            "chmod 0700 '$remote_script' && '$remote_script' provision" \
            | tee "$EVIDENCE_DIR/provision.log"
          [[ "$(wc -l < "$EVIDENCE_DIR/provision.log" | tr -d '[:space:]')" == 7 ]]
          active_revision="$(sed -n 's/^ACTIVE_PRODUCTION_REVISION=//p' "$EVIDENCE_DIR/provision.log")"
          [[ "$active_revision" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$active_revision" "$TARGET_SHA"
          grep -Eq '^AUTH_HASH_IMPACT_PREFLIGHT=(SAFE_EMPTY_PERSISTED_GENERIC_HASH_STATE|NO_MUTATION_CURRENT_AUTHORITY)$' "$EVIDENCE_DIR/provision.log"
          grep -Fxq AUTH_OPAQUE_TOKEN_KEY_PROVISION=EXISTING "$EVIDENCE_DIR/provision.log"
          grep -Eq '^AUTH_GENERIC_HASH_PEPPER_PROVISION=(EXISTING|MIGRATED)$' "$EVIDENCE_DIR/provision.log"
          grep -Fxq AUTH_OPAQUE_TOKEN_KEY_VALID=1 "$EVIDENCE_DIR/provision.log"
          grep -Fxq AUTH_GENERIC_HASH_PEPPER_VALID=1 "$EVIDENCE_DIR/provision.log"
          grep -Fxq AUTH_KEY_MATERIAL_DISCLOSURE=NONE "$EVIDENCE_DIR/provision.log"
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          assert_bounded_worktree
      - name: Remove bounded remote asset and local credentials
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${HOST:-}" && -n "${USER:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "rm -f '/tmp/pc-auth-opaque-token-key-${GITHUB_RUN_ID}.sh'" || true
          fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
