name: Gekta P0 SPEED Model Host Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-p0-speed-model-host-diagnostic.yml'
      - 'docs/platform-v7/autopilot/scopes/gekta-p0-speed-g3b-capacity-3896.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gekta-p0-speed-model-host-diagnostic
  cancel-in-progress: false

env:
  MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
  MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
  MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
  MODEL_HOST_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_HOST_KEY }}

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove read-only contract
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/gekta-p0-speed-model-host-diagnostic.yml
          node - "$file" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const begin = text.indexOf("<<'REMOTE'\n");
          const end = begin < 0 ? -1 : text.indexOf('\n          REMOTE', begin);
          if (begin < 0 || end < 0) throw new Error('remote diagnostic heredoc not found');
          const remote = text.slice(begin, end);
          for (const forbidden of [
            'systemctl restart', 'systemctl start', 'systemctl stop',
            'systemctl enable', 'systemctl disable', 'systemctl daemon-reload',
            'apt ', 'apt-get ', 'dnf ', 'yum ', 'chmod ', 'chown ',
            'kill ', 'pkill ', 'rm -', 'tee /'
          ]) {
            if (remote.includes(forbidden)) throw new Error(`forbidden remote mutation token: ${forbidden}`);
          }

          for (const credential of ['PC_PROD_SSH_KEY', 'PC_PROD_SSH_PRIVATE_KEY', 'VPS_SSH_KEY']) {
            if (text.includes(`secrets.${credential}`)) {
              throw new Error(`production credential in the model-host chain: ${credential}`);
            }
          }

          for (const required of [
            'secrets.TAI_MODEL_SSH_KEY',
            'secrets.TAI_MODEL_SSH_HOST_KEY',
            'TAI_MODEL_SSH_HOST_KEY is required',
            'does not match the pinned TAI_MODEL_SSH_HOST_KEY',
            'StrictHostKeyChecking=yes',
          ]) {
            if (!text.includes(required)) throw new Error(`missing model-host identity control: ${required}`);
          }
          if (/ssh-keyscan[^\n]*>\s*"?\$HOME\/\.ssh\/model_known_hosts/u.test(text)) {
            throw new Error('trust-on-first-use: ssh-keyscan output written straight into known_hosts');
          }

          const readStepStart = text.lastIndexOf('      - name: Read whitelisted active service facts', begin);
          if (readStepStart < 0 || readStepStart >= begin) throw new Error('diagnostic step not found before remote heredoc');
          const readStepPreamble = text.slice(readStepStart, begin);
          for (const forbidden of ['sudo ', 'su ', 'doas ']) {
            if (readStepPreamble.includes(forbidden)) {
              throw new Error(`privilege escalation is forbidden: ${forbidden.trim()}`);
            }
          }
          NODE
          GITHUB_HEAD_REF=fix/gekta-p0-speed-g3b-capacity-3896 BASE_REF=origin/main bash scripts/p7-autopilot-guard.sh

      - name: Prove bounded baseline HTTP observations
        shell: bash
        run: |
          set -euo pipefail
          python3 - .github/workflows/gekta-p0-speed-model-host-diagnostic.yml <<'HTTP_CONTRACT'
          import ast
          import contextlib
          import hashlib
          import http.client
          import io
          import json
          import os
          import pathlib
          import re
          import socket
          import subprocess
          import sys
          import time

          workflow = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          remote = workflow.split("<<'REMOTE'\n", 1)[1].split('\n          REMOTE', 1)[0]
          source = remote.split("<<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in source.splitlines())
          tree = ast.parse(source)
          selected = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.ClassDef)) and (node.name.startswith('model_diag_') or node.name == 'ModelDiagProbeError')]
          assert len(selected) == 5
          namespace = dict(globals())
          exec(compile(ast.Module(body=selected, type_ignores=[]), '<actual-workflow-http-functions>', 'exec'), namespace)
          probe = namespace['model_diag_http_facts']
          target = namespace['model_diag_target']
          ProbeError = namespace['ModelDiagProbeError']
          fixture_key = 'fixture-only-key-' * 3
          checks = []

          def check(name, condition):
              assert condition, name
              checks.append(name)

          def argv(**change):
              flags = {'--host': '192.168.0.206', '--port': '18080', '--alias': 'tai-qwen3-8b-q4km',
                       '--ctx-size': '8192', '--threads': '16', '--threads-batch': '16',
                       '--parallel': '1', '--batch-size': '512', '--ubatch-size': '128', '--api-key': fixture_key}
              flags.update(change)
              return b'\0'.join(str(value).encode() for pair in [('fixture-runtime',)] + [(key, value) for key, value in flags.items() if value is not None] for value in pair) + b'\0'

          def tcp(host='192.168.0.206', port=18080, inode='1234'):
              local = socket.inet_aton(host)[::-1].hex().upper() + ':' + format(port, '04X')
              return 'header\n 0: ' + local + ' 00000000:0000 0A 00000000:00000000 00:00000000 00000000 1001 0 ' + inode + '\n'

          base = {'cmdline': argv(), 'environ': b'OTHER=fixture\0', 'uid': 1001, 'process_uid': 1001,
                  'same_netns': True, 'owned_inodes': {'1234'}, 'tcp': tcp()}
          check('owned_accepted_private_target', target(**base) == ('192.168.0.206', fixture_key))
          loopback = dict(base, cmdline=argv(**{'--host':'127.0.0.1'}), tcp=tcp('127.0.0.1'))
          check('owned_explicit_loopback_target', target(**loopback) == ('127.0.0.1', fixture_key))
          env_only = dict(base, cmdline=argv(**{'--api-key': None}), environ=('LLAMA_API_KEY=' + fixture_key + '\0').encode())
          check('single_inmemory_environment_key', target(**env_only)[1] == fixture_key)
          bad = [
              ('wrong_private_host', {'cmdline':argv(**{'--host':'192.168.0.207'})}, 'TARGET_REJECTED'),
              ('arbitrary_hostname', {'cmdline':argv(**{'--host':'fixture.invalid'})}, 'TARGET_REJECTED'),
              ('wildcard_bind', {'cmdline':argv(**{'--host':'0.0.0.0'})}, 'TARGET_REJECTED'),
              ('candidate_port', {'cmdline':argv(**{'--port':'18081'})}, 'TARGET_REJECTED'),
              ('wrong_alias_flag', {'cmdline':argv(**{'--alias':'other'})}, 'TARGET_REJECTED'),
              ('wrong_baseline_profile', {'cmdline':argv(**{'--ubatch-size':'64'})}, 'TARGET_REJECTED'),
              ('duplicate_host_flags', {'cmdline':argv()+b'--host=192.168.0.206\0'}, 'TARGET_REJECTED'),
              ('duplicate_key_flags', {'cmdline':argv()+b'--api-key='+fixture_key.encode()+b'\0'}, 'KEY_REJECTED'),
              ('key_file_forbidden', {'cmdline':argv()+b'--api-key-file=fixture\0'}, 'KEY_REJECTED'),
              ('key_multi_value', {'cmdline':argv(**{'--api-key':fixture_key+','+fixture_key})}, 'KEY_REJECTED'),
              ('key_header_injection', {'cmdline':argv(**{'--api-key':fixture_key+'\r\nX: fixture'})}, 'KEY_REJECTED'),
              ('key_too_short', {'cmdline':argv(**{'--api-key':'short'})}, 'KEY_REJECTED'),
              ('cli_environment_key_duplicate', {'environ':('LLAMA_API_KEY='+fixture_key+'\0').encode()}, 'KEY_REJECTED'),
              ('environment_key_duplicate', {'cmdline':env_only['cmdline'],'environ':env_only['environ']*2}, 'KEY_REJECTED'),
              ('root_principal', {'uid':0,'process_uid':0}, 'OWNER_REJECTED'),
              ('foreign_owner', {'process_uid':1002}, 'OWNER_REJECTED'),
              ('foreign_network_namespace', {'same_netns':False}, 'OWNER_REJECTED'),
              ('unowned_listener', {'owned_inodes':{'9999'}}, 'TARGET_REJECTED'),
              ('wrong_listener_port', {'tcp':tcp(port=18081)}, 'TARGET_REJECTED'),
          ]
          for name, change, expected in bad:
              try:
                  target(**dict(base, **change))
              except ProbeError as error:
                  check(name, error.args == (expected,))
              else:
                  raise AssertionError(name)

          class FakeSocket:
              def __init__(self, wire, receive_error=None, chunk=4096, tick=None):
                  self.wire=wire; self.receive_error=receive_error; self.chunk=chunk; self.tick=tick
                  self.request=b''; self.endpoint=None; self.closed=False; self.timeouts=[]
              def settimeout(self, value):
                  assert 0 < value <= 3.0
                  self.timeouts.append(value)
              def connect(self, endpoint):
                  self.endpoint=endpoint
              def sendall(self, value):
                  self.request+=value
              def recv_into(self, buffer):
                  if self.tick is not None:self.tick()
                  if self.receive_error is not None:raise self.receive_error
                  count=min(len(buffer), len(self.wire), self.chunk)
                  buffer[:count]=self.wire[:count];self.wire=self.wire[count:]
                  return count
              def close(self):self.closed=True

          def wire(body=None, status=200, headers=None):
              body=json.dumps({'object':'list','data':[{'id':'tai-qwen3-8b-q4km'}]}).encode() if body is None else body
              headers=[('Content-Type','application/json'),('Content-Length',str(len(body)))] if headers is None else headers
              return ('HTTP/1.1 '+str(status)+' Fixture\r\n'+''.join(k+': '+v+'\r\n' for k,v in headers)+'\r\n').encode()+body

          def run_case(name, packet=None, swap='0', expected=None, snapshot=None, runtime_commit='aedb2a5', **fake_options):
              sock=FakeSocket(wire() if packet is None else packet, **fake_options)
              calls=[]
              def factory(*args):calls.append(args);return sock
              snapshot=snapshot or (lambda *_: ('192.168.0.206',fixture_key,('same-identity',)))
              output=io.StringIO()
              with contextlib.redirect_stdout(output), contextlib.redirect_stderr(output):
                  facts=probe(123, b'fixture\0', 'VmSwap: '+swap+' kB\n', runtime_commit,
                              snapshot=snapshot, socket_factory=factory, clock=(lambda:0.0))
              check(name, facts==expected)
              check(name+'_no_raw_output', output.getvalue()=='' and fixture_key not in json.dumps(facts))
              if calls:
                  check(name+'_connection_closed', sock.closed and sock.endpoint==('192.168.0.206',18080))
                  check(name+'_one_fixed_get', len(calls)==1 and sock.request.startswith(b'GET /v1/models HTTP/1.1\r\n') and b'POST ' not in sock.request)
              return facts, sock, calls

          def result(http='200', alias='MATCH', outcome='JSON_VALID', swap='YES'):
              return {'HTTP_STATUS':http,'MODEL_ALIAS':alias,'HTTP_RESULT':outcome,'SWAP_ZERO':swap}

          run_case('healthy_json_zero_swap', expected=result())
          run_case('healthy_http_with_nonzero_swap', swap='357936', expected=result(swap='NO'))
          run_case('alias_mismatch_independent', packet=wire(b'{"data":[{"id":"other"}]}'), expected=result(alias='MISMATCH'))
          run_case('empty_alias_list', packet=wire(b'{"data":[]}'), expected=result(alias='MISMATCH'))
          for status in [401,403,500]:
              run_case('http_'+str(status), packet=wire(status=status), swap='357936', expected=result(str(status),'NOT_CHECKED','HTTP_ERROR','NO'))
          run_case('redirect_not_followed', packet=wire(status=302,headers=[('Location','http://fixture.invalid/')]), expected=result('302','NOT_CHECKED','REDIRECT_REJECTED'))
          for name,body in [('bad_json',b'private-fixture-response'),('invalid_utf8',b'\xff'),('duplicate_json_key',b'{"data":[],"data":[]}'),('wrong_json_shape',b'[]'),('bad_alias_type',b'{"data":[{"id":7}]}'),('duplicate_alias',b'{"data":[{"id":"x"},{"id":"x"}]}')]:
              run_case(name,packet=wire(body),expected=result('200','NOT_CHECKED','BODY_INVALID'))
          run_case('oversize_content_length',packet=wire(b'x',headers=[('Content-Type','application/json'),('Content-Length','16385')]),expected=result('200','NOT_CHECKED','BODY_OVERSIZE'))
          run_case('oversize_eof_body',packet=wire(b'x'*16385,headers=[('Content-Type','application/json')]),expected=result('200','NOT_CHECKED','BODY_OVERSIZE'))
          run_case('duplicate_content_type',packet=wire(headers=[('Content-Type','application/json'),('Content-Type','application/json')]),expected=result('200','NOT_CHECKED','HEADERS_INVALID'))
          run_case('encoded_body_rejected',packet=wire(headers=[('Content-Type','application/json'),('Content-Encoding','gzip')]),expected=result('200','NOT_CHECKED','HEADERS_INVALID'))
          run_case('transfer_length_conflict',packet=wire(headers=[('Content-Type','application/json'),('Transfer-Encoding','chunked'),('Content-Length','1')]),expected=result('200','NOT_CHECKED','HEADERS_INVALID'))
          run_case('socket_timeout',receive_error=TimeoutError('private-fixture-error'),expected=result('NO_RESPONSE','NOT_CHECKED','TIMEOUT'))
          run_case('transport_error_no_leak',receive_error=OSError('private-fixture-error'),expected=result('NO_RESPONSE','NOT_CHECKED','TRANSPORT_ERROR'))
          run_case('wrong_runtime_before_socket',runtime_commit='unknown',expected=result('NOT_PROBED','NOT_CHECKED','TARGET_REJECTED'))
          def rejected(*_):raise ProbeError('KEY_REJECTED')
          run_case('key_rejected_before_socket',snapshot=rejected,expected=result('NOT_PROBED','NOT_CHECKED','KEY_REJECTED'))
          identities=iter([('first',),('second',)])
          run_case('identity_changed_after_response',snapshot=lambda *_:('192.168.0.206',fixture_key,next(identities)),expected=result('200','NOT_CHECKED','IDENTITY_CHANGED'))
          run_case('unknown_swap_independent',swap='unknown',expected=result(swap='UNKNOWN'))

          now=[0.0]
          def advance():now[0]+=0.6
          slow=FakeSocket(wire(),chunk=1,tick=advance)
          facts=probe(123,b'fixture\0','VmSwap: 0 kB\n','aedb2a5',snapshot=lambda *_:('192.168.0.206',fixture_key,('same',)),socket_factory=lambda *_:slow,clock=lambda:now[0])
          check('hard_total_deadline_for_trickle',facts==result('NO_RESPONSE','NOT_CHECKED','TIMEOUT') and slow.closed and now[0]<=3.6)
          check('hard_deadline_timeout_decreases',slow.timeouts[-1]<slow.timeouts[0])
          print('MODEL_DIAG_HTTP_CONTRACT=' + json.dumps({'checks':len(checks),'status':'PASS','hostCalls':0,'socketFixtures':True,'checkedNames':checks},sort_keys=True,separators=(',',':')))
          HTTP_CONTRACT

  diagnose:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3896 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/gekta speed-model-diagnose current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact current main
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse origin/main)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$(git rev-parse HEAD)" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve existing protected model-host transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }
          host="$(trim "${MODEL_HOST_SECRET:-}")"
          user="$(trim "${MODEL_USER_SECRET:-root}")"
          port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535))
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          key="$(trim "${MODEL_KEY_SECRET:-}")"
          if [[ -z "$key" ]]; then
            echo "TAI_MODEL_SSH_KEY is required for the model host diagnostic." >&2
            exit 20
          fi
          write_key "$key" "$HOME/.ssh/id_tai_model"

          pin="$(trim "${MODEL_HOST_KEY_SECRET:-}")"
          if [[ -z "$pin" ]]; then
            echo "TAI_MODEL_SSH_HOST_KEY is required: the model host identity must be pinned, not discovered." >&2
            exit 21
          fi
          pin_type="$(printf '%s' "$pin" | awk '{ print $(NF-1) }')"
          pin_material="$(printf '%s' "$pin" | awk '{ print $NF }')"
          if [[ -z "$pin_type" || -z "$pin_material" ]]; then
            echo "TAI_MODEL_SSH_HOST_KEY is malformed; expected a host key line." >&2
            exit 21
          fi
          scanned="$(ssh-keyscan -T 30 -p "$port" -t "$pin_type" "$host" 2>/dev/null || true)"
          if ! printf '%s\n' "$scanned" \
            | awk -v pinned="$pin_material" '$3 == pinned { matched = 1 } END { exit matched ? 0 : 1 }'; then
            echo "model host key does not match the pinned TAI_MODEL_SSH_HOST_KEY" >&2
            exit 21
          fi
          printf '%s %s %s\n' "$host" "$pin_type" "$pin_material" > "$HOME/.ssh/model_known_hosts"
          chmod 600 "$HOME/.ssh/model_known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Read whitelisted active service facts
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$MODEL_USER@$MODEL_HOST" /bin/bash -s > "$RUNNER_TEMP/raw-diag" <<'REMOTE'
          set -Eeuo pipefail
          service=tai-qwen3-8b.service
          systemctl is-active --quiet "$service"
          pid="$(systemctl show "$service" --property=MainPID --value)"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          python3 - "$pid" <<'PY'
          import hashlib
          import http.client
          import io
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import socket
          import time

          # Bounded baseline HTTP facts. No inference, service action or raw diagnostics.
          class ModelDiagProbeError(Exception):
              pass


          def model_diag_read(path, limit):
              with path.open('rb') as handle:
                  value = handle.read(limit + 1)
              if len(value) > limit:
                  raise ModelDiagProbeError('OWNER_REJECTED')
              return value


          def model_diag_target(cmdline, environ, uid, process_uid, same_netns, owned_inodes, tcp):
              if uid == 0 or uid != process_uid or not same_netns:
                  raise ModelDiagProbeError('OWNER_REJECTED')
              try:
                  argv = [part.decode('utf-8', 'strict') for part in cmdline.split(b'\0') if part]
              except UnicodeError:
                  raise ModelDiagProbeError('TARGET_REJECTED') from None
              names = {
                  'host': ('--host',), 'port': ('--port', '--listen-port'),
                  'alias': ('--alias',), 'key': ('--api-key',),
                  'ctx': ('--ctx-size', '-c'), 'threads': ('--threads', '-t'),
                  'threads_batch': ('--threads-batch', '-tb'), 'parallel': ('--parallel', '-np'),
                  'batch': ('--batch-size', '-b'), 'ubatch': ('--ubatch-size', '-ub'),
              }
              def one(name, optional=False):
                  hits = []
                  for index, token in enumerate(argv):
                      for flag in names[name]:
                          if token == flag:
                              hits.append(argv[index + 1] if index + 1 < len(argv) else '')
                          elif token.startswith(flag + '='):
                              hits.append(token[len(flag) + 1:])
                  if optional and not hits:
                      return None
                  if len(hits) != 1 or not hits[0] or hits[0].startswith('-'):
                      raise ModelDiagProbeError('KEY_REJECTED' if name == 'key' else 'TARGET_REJECTED')
                  return hits[0]
              host = one('host')
              # Accepted baseline repair/controller source fixes the private bind and port.
              # Loopback is allowed only when the owned process actually binds loopback.
              if host not in {'127.0.0.1', '192.168.0.206'} or one('port') != '18080':
                  raise ModelDiagProbeError('TARGET_REJECTED')
              expected = {'alias': 'tai-qwen3-8b-q4km', 'ctx': '8192', 'threads': '16',
                          'threads_batch': '16', 'parallel': '1', 'batch': '512', 'ubatch': '128'}
              if any(one(name) != value for name, value in expected.items()):
                  raise ModelDiagProbeError('TARGET_REJECTED')
              expected_local = socket.inet_aton(host)[::-1].hex().upper() + ':46A0'
              owned = []
              for line in tcp.splitlines()[1:]:
                  columns = line.split()
                  if len(columns) >= 10 and columns[1] == expected_local and columns[3] == '0A' and columns[9] in owned_inodes:
                      owned.append(columns[9])
              if len(owned) != 1:
                  raise ModelDiagProbeError('TARGET_REJECTED')
              if any(token == '--api-key-file' or token.startswith('--api-key-file=') for token in argv):
                  raise ModelDiagProbeError('KEY_REJECTED')
              cli_key = one('key', optional=True)
              env_keys = [part.split(b'=', 1)[1] for part in environ.split(b'\0') if part.startswith(b'LLAMA_API_KEY=')]
              if len(env_keys) > 1 or (cli_key is not None and env_keys):
                  raise ModelDiagProbeError('KEY_REJECTED')
              try:
                  key = cli_key if cli_key is not None else env_keys[0].decode('ascii') if env_keys else ''
              except UnicodeError:
                  raise ModelDiagProbeError('KEY_REJECTED') from None
              if not re.fullmatch(r'[A-Za-z0-9._~+/-]{32,256}={0,2}', key):
                  raise ModelDiagProbeError('KEY_REJECTED')
              return host, key


          def model_diag_snapshot(pid, expected_cmdline):
              proc = pathlib.Path(f'/proc/{pid}')
              current = subprocess.run(
                  ['systemctl', 'show', 'tai-qwen3-8b.service', '--property=MainPID', '--value'],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=1, check=False,
              )
              if current.returncode != 0 or current.stdout.strip() != str(pid).encode('ascii'):
                  raise ModelDiagProbeError('IDENTITY_CHANGED')
              uid = os.geteuid()
              process_uid = proc.stat().st_uid
              same_netns = os.readlink(proc / 'ns/net') == os.readlink('/proc/self/ns/net')
              if uid == 0 or uid != process_uid or not same_netns:
                  raise ModelDiagProbeError('OWNER_REJECTED')
              cmdline = model_diag_read(proc / 'cmdline', 65536)
              if cmdline != expected_cmdline:
                  raise ModelDiagProbeError('IDENTITY_CHANGED')
              process_stat = model_diag_read(proc / 'stat', 4096)
              tail = process_stat.rsplit(b') ', 1)[-1].split()
              if len(tail) < 20 or not tail[19].isdigit():
                  raise ModelDiagProbeError('OWNER_REJECTED')
              inodes = set()
              for index, fd in enumerate((proc / 'fd').iterdir()):
                  if index >= 4096:
                      raise ModelDiagProbeError('OWNER_REJECTED')
                  try:
                      target = os.readlink(fd)
                  except FileNotFoundError:
                      continue
                  match = re.fullmatch(r'socket:\[([0-9]+)\]', target)
                  if match:
                      inodes.add(match.group(1))
              tcp = model_diag_read(proc / 'net/tcp', 1048576).decode('ascii', 'strict')
              environ = model_diag_read(proc / 'environ', 65536)
              host, key = model_diag_target(cmdline, environ, uid, process_uid, same_netns, inodes, tcp)
              fingerprint = (uid, tail[19], hashlib.sha256(cmdline).digest(), hashlib.sha256(environ).digest(), host)
              return host, key, fingerprint


          def model_diag_http_facts(pid, cmdline, status, runtime_commit, snapshot=model_diag_snapshot, socket_factory=socket.socket, clock=time.monotonic):
              swap = re.findall(r'^VmSwap:\s+([0-9]+)\s+kB$', status, re.M)
              facts = {'HTTP_STATUS': 'NOT_PROBED', 'MODEL_ALIAS': 'NOT_CHECKED',
                       'HTTP_RESULT': 'OWNER_REJECTED',
                       'SWAP_ZERO': 'YES' if len(swap) == 1 and int(swap[0]) == 0 else 'NO' if len(swap) == 1 else 'UNKNOWN'}
              connection = None
              response = None
              try:
                  if runtime_commit != 'aedb2a5':
                      raise ModelDiagProbeError('TARGET_REJECTED')
                  host, key, identity = snapshot(pid, cmdline)
                  deadline = clock() + 3.0
                  def remaining():
                      value = deadline - clock()
                      if value <= 0:
                          raise TimeoutError
                      return value
                  connection = socket_factory(socket.AF_INET, socket.SOCK_STREAM)
                  connection.settimeout(remaining())
                  facts['HTTP_STATUS'] = 'NO_RESPONSE'
                  connection.connect((host, 18080))
                  request = ('GET /v1/models HTTP/1.1\r\nHost: ' + host + ':18080\r\n'
                             'Authorization: Bearer ' + key + '\r\nAccept: application/json\r\n'
                             'Connection: close\r\n\r\n').encode('ascii')
                  connection.settimeout(remaining())
                  connection.sendall(request)
                  del request, key
                  class BoundedReader(io.RawIOBase):
                      def __init__(self):
                          super().__init__()
                          self.total = 0
                      def readable(self):
                          return True
                      def readinto(self, buffer):
                          connection.settimeout(remaining())
                          count = connection.recv_into(memoryview(buffer)[:min(len(buffer), 32769 - self.total)])
                          self.total += count
                          if self.total > 32768:
                              raise ModelDiagProbeError('WIRE_OVERSIZE')
                          return count
                  class ResponseSocket:
                      def makefile(self, *_args, **_kwargs):
                          return io.BufferedReader(BoundedReader())
                  response = http.client.HTTPResponse(ResponseSocket())
                  response.begin()
                  if not 100 <= response.status <= 599:
                      raise ModelDiagProbeError('HEADERS_INVALID')
                  facts['HTTP_STATUS'] = str(response.status)
                  if 300 <= response.status < 400:
                      facts['HTTP_RESULT'] = 'REDIRECT_REJECTED'
                  elif response.status != 200:
                      facts['HTTP_RESULT'] = 'HTTP_ERROR'
                  else:
                      for header in ['Content-Length', 'Content-Type', 'Transfer-Encoding', 'Content-Encoding']:
                          if len(response.headers.get_all(header, [])) > 1:
                              raise ModelDiagProbeError('HEADERS_INVALID')
                      length = response.getheader('Content-Length')
                      encoding = response.getheader('Transfer-Encoding')
                      if length is not None and (not re.fullmatch(r'[0-9]{1,9}', length) or int(length) > 16384):
                          raise ModelDiagProbeError('BODY_OVERSIZE')
                      if encoding is not None and (encoding.lower() != 'chunked' or length is not None):
                          raise ModelDiagProbeError('HEADERS_INVALID')
                      if response.getheader('Content-Encoding', 'identity').lower() != 'identity':
                          raise ModelDiagProbeError('HEADERS_INVALID')
                      if response.getheader('Content-Type', '').split(';', 1)[0].strip().lower() != 'application/json':
                          raise ModelDiagProbeError('HEADERS_INVALID')
                      body = response.read(16385)
                      if len(body) > 16384:
                          raise ModelDiagProbeError('BODY_OVERSIZE')
                      if length is not None and len(body) != int(length):
                          raise ModelDiagProbeError('BODY_INVALID')
                      def unique_object(pairs):
                          value = {}
                          for name, item in pairs:
                              if name in value:
                                  raise ValueError
                              value[name] = item
                          return value
                      def invalid_constant(_value):
                          raise ValueError
                      try:
                          payload = json.loads(body.decode('utf-8', 'strict'), object_pairs_hook=unique_object, parse_constant=invalid_constant)
                          data = payload['data'] if isinstance(payload, dict) else None
                          if not isinstance(data, list) or len(data) > 32:
                              raise ValueError
                          ids = [row['id'] for row in data]
                          if any(not isinstance(value, str) or not 1 <= len(value) <= 128 for value in ids) or len(ids) != len(set(ids)):
                              raise ValueError
                      except (UnicodeError, ValueError, TypeError, KeyError, RecursionError):
                          raise ModelDiagProbeError('BODY_INVALID') from None
                      facts['MODEL_ALIAS'] = 'MATCH' if 'tai-qwen3-8b-q4km' in ids else 'MISMATCH'
                      facts['HTTP_RESULT'] = 'JSON_VALID'
                  if snapshot(pid, cmdline)[2] != identity:
                      raise ModelDiagProbeError('IDENTITY_CHANGED')
              except ModelDiagProbeError as error:
                  facts['MODEL_ALIAS'] = 'NOT_CHECKED'
                  facts['HTTP_RESULT'] = error.args[0] if error.args and error.args[0] in {
                      'TARGET_REJECTED', 'OWNER_REJECTED', 'KEY_REJECTED', 'IDENTITY_CHANGED',
                      'HEADERS_INVALID', 'WIRE_OVERSIZE', 'BODY_OVERSIZE', 'BODY_INVALID',
                  } else 'PROBE_ERROR'
              except (TimeoutError, socket.timeout):
                  facts['MODEL_ALIAS'] = 'NOT_CHECKED'
                  facts['HTTP_RESULT'] = 'TIMEOUT'
              except (OSError, http.client.HTTPException, UnicodeError, ValueError):
                  facts['MODEL_ALIAS'] = 'NOT_CHECKED'
                  facts['HTTP_RESULT'] = 'TRANSPORT_ERROR'
              except Exception:
                  facts['MODEL_ALIAS'] = 'NOT_CHECKED'
                  facts['HTTP_RESULT'] = 'PROBE_ERROR'
              finally:
                  if response is not None:
                      try:
                          response.close()
                      except Exception:
                          pass
                  if connection is not None:
                      try:
                          connection.close()
                      except Exception:
                          pass
              return facts

          pid = int(sys.argv[1])
          proc = pathlib.Path(f'/proc/{pid}')
          cmdline = (proc / 'cmdline').read_bytes()
          args = [part.decode('utf-8', 'replace') for part in cmdline.split(b'\0') if part]

          value_flags = {
              '--ctx-size':'ctx_size','-c':'ctx_size',
              '--threads':'threads','-t':'threads',
              '--threads-batch':'threads_batch','-tb':'threads_batch',
              '--parallel':'parallel','-np':'parallel',
              '--batch-size':'batch_size','-b':'batch_size',
              '--ubatch-size':'ubatch_size','-ub':'ubatch_size',
              '--cache-type-k':'cache_type_k','--cache-type-v':'cache_type_v',
              '--defrag-thold':'defrag_thold','--poll':'poll',
          }
          boolean_flags = {
              '--cont-batching':('cont_batching', True),
              '--no-cont-batching':('cont_batching', False),
              '--mlock':('mlock', True),
              '--no-mmap':('mmap', False),
              '--mmap':('mmap', True),
              '--flash-attn':('flash_attn', True),
              '--no-kv-offload':('kv_offload', False),
              '--kv-unified':('kv_unified', True),
              '--no-kv-unified':('kv_unified', False),
              '--metrics':('metrics', True),
          }
          found = {}
          i = 0
          while i < len(args):
              token = args[i]
              if token in value_flags and i + 1 < len(args):
                  value = args[i + 1]
                  if re.fullmatch(r'[A-Za-z0-9_.:-]{1,32}', value):
                      found[value_flags[token]] = value
                  i += 2
                  continue
              if token in boolean_flags:
                  key, value = boolean_flags[token]
                  found[key] = value
              i += 1

          env_kv_mode = 'ABSENT'
          for part in (proc / 'environ').read_bytes().split(b'\0'):
              if not part.startswith(b'LLAMA_ARG_KV_UNIFIED='):
                  continue
              value = part.split(b'=', 1)[1].decode('ascii', 'ignore').strip().lower()
              if value in {'1','true','yes','on'}:
                  env_kv_mode = 'ON'
              elif value in {'0','false','no','off'}:
                  env_kv_mode = 'OFF'
              else:
                  env_kv_mode = 'INVALID'
              break
          arg_kv_mode = 'ABSENT'
          if found.get('kv_unified') is True:
              arg_kv_mode = 'ON'
          elif found.get('kv_unified') is False:
              arg_kv_mode = 'OFF'

          status = (proc / 'status').read_text(encoding='utf-8')
          meminfo = pathlib.Path('/proc/meminfo').read_text(encoding='utf-8')
          def kb_value(text, key):
              match = re.search(rf'^{re.escape(key)}:\s+(\d+)\s+kB$', text, re.M)
              return int(match.group(1)) if match else 0

          smaps_available = 0
          pss_kb = 0
          pss_anon_kb = 0
          pss_file_kb = 0
          private_dirty_kb = 0
          try:
              smaps = (proc / 'smaps_rollup').read_text(encoding='utf-8')
              smaps_available = 1
              pss_kb = kb_value(smaps, 'Pss')
              pss_anon_kb = kb_value(smaps, 'Pss_Anon')
              pss_file_kb = kb_value(smaps, 'Pss_File')
              private_dirty_kb = kb_value(smaps, 'Private_Dirty')
          except (FileNotFoundError, PermissionError, OSError):
              pass

          affinity = sorted(os.sched_getaffinity(pid))
          physical = set()
          for cpu in affinity:
              topology = pathlib.Path(f'/sys/devices/system/cpu/cpu{cpu}/topology')
              try:
                  package = (topology / 'physical_package_id').read_text(encoding='ascii').strip()
                  core = (topology / 'core_id').read_text(encoding='ascii').strip()
                  physical.add((package, core))
              except (FileNotFoundError, PermissionError, OSError):
                  physical.clear()
                  break
          physical_cores = len(physical)
          threads_per_core = len(affinity) // physical_cores if physical_cores and len(affinity) % physical_cores == 0 else 0

          exe = (proc / 'exe').resolve(strict=True)
          version = subprocess.run(
              [str(exe), '--version'],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              timeout=8,
              check=False,
              env={'PATH':'/usr/bin:/bin','LC_ALL':'C'},
          )
          version_text = version.stdout or ''
          version_match = re.search(r'version:\s*(\d+)\s+\(([0-9a-fA-F]{7,40})\)', version_text)
          build_number = int(version_match.group(1)) if version_match else 0
          commit = version_match.group(2).lower() if version_match else 'unknown'

          print('MODEL_DIAG_SERVICE_ACTIVE=1')
          print(f'MODEL_DIAG_CPU_LOGICAL={os.cpu_count() or 0}')
          print(f'MODEL_DIAG_AFFINITY_CPUS={len(affinity)}')
          print(f'MODEL_DIAG_CPU_PHYSICAL_CORES={physical_cores}')
          print(f'MODEL_DIAG_CPU_THREADS_PER_CORE={threads_per_core}')
          print(f'MODEL_DIAG_MEM_TOTAL_KB={kb_value(meminfo, "MemTotal")}')
          print(f'MODEL_DIAG_MEM_AVAILABLE_KB={kb_value(meminfo, "MemAvailable")}')
          print(f'MODEL_DIAG_RSS_KB={kb_value(status, "VmRSS")}')
          print(f'MODEL_DIAG_RSS_ANON_KB={kb_value(status, "RssAnon")}')
          print(f'MODEL_DIAG_RSS_FILE_KB={kb_value(status, "RssFile")}')
          print(f'MODEL_DIAG_SWAP_KB={kb_value(status, "VmSwap")}')
          print(f'MODEL_DIAG_SMAPS_AVAILABLE={smaps_available}')
          print(f'MODEL_DIAG_PSS_KB={pss_kb}')
          print(f'MODEL_DIAG_PSS_ANON_KB={pss_anon_kb}')
          print(f'MODEL_DIAG_PSS_FILE_KB={pss_file_kb}')
          print(f'MODEL_DIAG_PRIVATE_DIRTY_KB={private_dirty_kb}')
          print(f'MODEL_DIAG_KV_UNIFIED_ARG_MODE={arg_kv_mode}')
          print(f'MODEL_DIAG_KV_UNIFIED_ENV_MODE={env_kv_mode}')
          print(f'MODEL_DIAG_LLAMA_BUILD={build_number}')
          print(f'MODEL_DIAG_LLAMA_COMMIT={commit}')
          print('MODEL_DIAG_FLAGS_JSON=' + json.dumps(found, sort_keys=True, separators=(',', ':')))
          print('MODEL_DIAG_CMDLINE_SHA256=' + hashlib.sha256(cmdline).hexdigest())
          for name, value in model_diag_http_facts(pid, cmdline, status, commit).items():
              print('MODEL_DIAG_' + name + '=' + value)
          PY

          active_state="$(systemctl show "$service" --property=ActiveState --value)"
          sub_state="$(systemctl show "$service" --property=SubState --value)"
          restarts="$(systemctl show "$service" --property=NRestarts --value)"
          restart_policy="$(systemctl show "$service" --property=Restart --value)"
          service_user="$(systemctl show "$service" --property=User --value)"
          fragment="$(systemctl show "$service" --property=FragmentPath --value)"
          [[ "$active_state" =~ ^[A-Za-z0-9_.:-]+$ ]]
          [[ "$sub_state" =~ ^[A-Za-z0-9_.:-]+$ ]]
          [[ "$restarts" =~ ^[0-9]+$ ]]
          [[ "$restart_policy" =~ ^[A-Za-z0-9_.:-]+$ ]]
          [[ -n "$service_user" ]]
          user_match=0
          [[ "$service_user" == "$(id -un)" ]] && user_match=1
          fragment_writable=0
          [[ -n "$fragment" && -w "$fragment" ]] && fragment_writable=1
          printf 'MODEL_DIAG_RESTARTS=%s\n' "$restarts"
          printf 'MODEL_DIAG_ACTIVE_STATE=%s\n' "$active_state"
          printf 'MODEL_DIAG_SUB_STATE=%s\n' "$sub_state"
          printf 'MODEL_DIAG_RESTART_POLICY=%s\n' "$restart_policy"
          printf 'MODEL_DIAG_SERVICE_USER_MATCH=%s\n' "$user_match"
          printf 'MODEL_DIAG_UNIT_FRAGMENT_WRITABLE=%s\n' "$fragment_writable"
          REMOTE
          grep -E '^MODEL_DIAG_(SERVICE_ACTIVE|CPU_LOGICAL|AFFINITY_CPUS|CPU_PHYSICAL_CORES|CPU_THREADS_PER_CORE|MEM_TOTAL_KB|MEM_AVAILABLE_KB|RSS_KB|RSS_ANON_KB|RSS_FILE_KB|SWAP_KB|SMAPS_AVAILABLE|PSS_KB|PSS_ANON_KB|PSS_FILE_KB|PRIVATE_DIRTY_KB|KV_UNIFIED_ARG_MODE|KV_UNIFIED_ENV_MODE|LLAMA_BUILD|LLAMA_COMMIT|FLAGS_JSON|CMDLINE_SHA256|RESTARTS|ACTIVE_STATE|SUB_STATE|RESTART_POLICY|SERVICE_USER_MATCH|UNIT_FRAGMENT_WRITABLE|HTTP_STATUS|MODEL_ALIAS|HTTP_RESULT|SWAP_ZERO)=' \
            "$RUNNER_TEMP/raw-diag" > "$RUNNER_TEMP/diag"
          [[ "$(wc -l < "$RUNNER_TEMP/diag")" -eq 32 ]]
          if grep -qEv '^MODEL_DIAG_[A-Z0-9_]+=([0-9]+|[a-f0-9]{7,64}|[A-Za-z0-9_.:-]+|\{.*\})$' "$RUNNER_TEMP/diag"; then
            echo 'Diagnostic emitted a value outside the bounded public grammar.' >&2
            exit 40
          fi
          python3 - "$RUNNER_TEMP/diag" <<'HTTP_FIELDS'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          fields = dict(line.split('=', 1) for line in lines)
          if len(lines) != 32 or len(fields) != 32:
              raise SystemExit('Diagnostic field cardinality rejected.')
          http_status = fields.get('MODEL_DIAG_HTTP_STATUS', '')
          valid_status = http_status in {'NOT_PROBED', 'NO_RESPONSE'} or (re.fullmatch(r'[1-5][0-9]{2}', http_status) is not None)
          valid_alias = fields.get('MODEL_DIAG_MODEL_ALIAS') in {'MATCH', 'MISMATCH', 'NOT_CHECKED'}
          valid_swap = fields.get('MODEL_DIAG_SWAP_ZERO') in {'YES', 'NO', 'UNKNOWN'}
          valid_result = fields.get('MODEL_DIAG_HTTP_RESULT') in {
              'JSON_VALID', 'HTTP_ERROR', 'REDIRECT_REJECTED', 'TIMEOUT', 'TRANSPORT_ERROR',
              'TARGET_REJECTED', 'OWNER_REJECTED', 'KEY_REJECTED', 'IDENTITY_CHANGED',
              'HEADERS_INVALID', 'WIRE_OVERSIZE', 'BODY_OVERSIZE', 'BODY_INVALID', 'PROBE_ERROR',
          }
          if not (valid_status and valid_alias and valid_swap and valid_result):
              raise SystemExit('Diagnostic health grammar rejected.')
          HTTP_FIELDS
          cat "$RUNNER_TEMP/diag"

      - name: Publish redacted diagnostic evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"
          {
            echo '## Gekta P0 SPEED model-host diagnostic'
            echo
            echo "- exact repository main: \`$TARGET_SHA\`"
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo '- mode: `READ_ONLY`'
            echo '- production mutation: `NONE`'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/diag"
            echo '```'
          } > "$body"
          gh issue comment 3896 --repo "$GITHUB_REPOSITORY" --body-file "$body"
