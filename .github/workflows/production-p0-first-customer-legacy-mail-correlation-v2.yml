name: Production P0 First-Customer Legacy Mail Correlation v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-first-customer-legacy-mail-correlation-v2.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-p0-first-customer-legacy-mail-correlation-v2
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  SUBJECT_SHA: 55f78afe5f01f1aa2732a984b5cc0ccb1ccfcc71
  WINDOW_START: '2026-08-15T12:56:00Z'
  WINDOW_END: '2026-08-15T13:01:00Z'
  COMMAND: /production p0-first-customer-legacy-mail-correlation-v2 31885882933
  PC_P0_IMAP_HOST: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_HOST || secrets.PC_PROD_P0_IMAP_HOST }}
  PC_P0_IMAP_PORT: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PORT || secrets.PC_PROD_P0_IMAP_PORT }}
  PC_P0_IMAP_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
  PC_P0_IMAP_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
  PC_P0_IMAP_FOLDER: ${{ secrets.PC_PROD_P0_IMAP_FOLDER }}
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/production-p0-first-customer-legacy-mail-correlation-v2.yml').read_text()
          for x in ['registration_email_delivery_result','WEB_PROVIDER','WEB_REASON','WEB_DELIVERED','IMAP_CONNECT','IMAP_LOGIN','IMAP_SELECT','IMAP_SEARCH','IMAP_RECIPIENT_MATCH','IMAP_LINK_MATCH','PRODUCTION_MUTATION NONE','readonly=True']:
              if x not in t: raise SystemExit('missing '+x)
          d=t.split('\n  diagnostic:\n',1)[1]
          bad=['docker restart','docker rm','docker compose up','docker compose down','ALTER ROLE','CREATE ROLE','DROP ROLE','GRANT ','REVOKE ','INSERT INTO','UPDATE auth.','DELETE FROM','TRUNCATE ','curl -X POST','sendTransactionalMail(','sendAuthMailSmtp(','EXPUNGE','APPEND ']
          if any(x in d for x in bad): raise SystemExit('mutation surface')
          PY

  diagnostic:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-first-customer-legacy-mail-correlation-v2 31885882933' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source boundary
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main="$(git rev-parse origin/main)"
          [[ "$main" == "$(git rev-parse HEAD)" ]]
          git cat-file -e "${SUBJECT_SHA}^{commit}"
          git merge-base --is-ancestor "$SUBJECT_SHA" "$main"
          git diff --quiet "$SUBJECT_SHA..$main" -- apps/web/app/api/auth/register/route.ts apps/web/lib/server/transactional-mail.ts apps/api/src/modules/auth/registration-application.service.ts
          echo "main=$main" >> "$GITHUB_OUTPUT"
      - name: Resolve pinned production SSH
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"; user="$(trim "${SSH_USER_SECRET:-}")"; port="$(trim "${SSH_PORT_SECRET:-22}")"; expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ && "$port" =~ ^[0-9]+$ && "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          key="$HOME/.ssh/id_pc_prod"
          valid(){ tr -d '\r' < "$1" > "$key"; chmod 600 "$key"; ! grep -Eq '^(ssh-|ecdsa-|sk-)' "$key" && ssh-keygen -y -P '' -f "$key" >/dev/null 2>&1; }
          slot(){ local raw="$1" a b c; [[ -n "$raw" ]] || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; valid "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${raw//\\n/$'\n'}" > "$b"; valid "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && valid "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          slot "${SSH_KEY_PRIMARY:-}" || slot "${SSH_KEY_SECONDARY:-}" || slot "${SSH_KEY_FALLBACK:-}"
          scan="$(mktemp)"; match="$(mktemp)"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          while IFS= read -r line; do fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"; done < "$scan"
          sort -u -o "$match" "$match"; [[ "$(grep -c . "$match" || true)" == 1 ]]; mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$key" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$user@$host" 'test "$(id -u)" -eq 0; docker version >/dev/null'
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Read legacy Web mail result
        id: web
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" "bash -s -- '$SUBJECT_SHA' '$WINDOW_START' '$WINDOW_END'" > "$RUNNER_TEMP/web-safe" <<'REMOTE'
          set -euo pipefail
          sha="$1"; start="$2"; end="$3"
          mapfile -t ids < <(docker ps -q --filter 'label=com.docker.compose.service=web'); (( ${#ids[@]} == 1 )); id="${ids[0]}"
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$id")" == "$sha" ]]
          docker logs --since "$start" --until "$end" "$id" 2>&1 | python3 -c 'import sys,re,json; e=[]
for line in sys.stdin:
 m=re.search(r"registration_email_delivery_result\\s+(\\{.*\\})",line)
 if not m: continue
 try: p=json.loads(m.group(1))
 except: continue
 provider=str(p.get("provider") or "unknown"); reason=re.sub(r"[^A-Za-z0-9_.:-]","_",str(p.get("reason") or "unknown"))[:80]; delivered=p.get("delivered") is True; h=str(p.get("accountHash") or "")
 if provider not in ("smtp","resend","none"): provider="unknown"
 if not re.fullmatch(r"[a-f0-9]{16}",h): h="NONE"
 e.append((provider,reason,delivered,h))
print("WEB_EVENTS="+str(len(e))); print("WEB_DELIVERED="+str(sum(x[2] for x in e))); ps=sorted(set(x[0] for x in e)); rs=sorted(set(x[1] for x in e)); hs=sorted(set(x[3] for x in e if x[3]!="NONE")); print("WEB_PROVIDER="+(ps[0].upper() if len(ps)==1 else ("NONE" if not ps else "MULTIPLE"))); print("WEB_REASON="+(rs[0].upper() if len(rs)==1 else ("NONE" if not rs else "MULTIPLE"))); print("ACCOUNT_HASH="+(hs[0] if len(hs)==1 else "NONE")); print("PRODUCTION_MUTATION=NONE")'
          REMOTE
          cat "$RUNNER_TEMP/web-safe"
          while IFS='=' read -r k v; do [[ "$v" =~ ^[A-Za-z0-9_.:-]{1,100}$ ]] || exit 30; echo "${k,,}=$v" >> "$GITHUB_OUTPUT"; done < "$RUNNER_TEMP/web-safe"; rm -f "$RUNNER_TEMP/web-safe"
      - name: Read mailbox correlation safely
        id: imap
        shell: bash
        env:
          ACCOUNT_HASH: ${{ steps.web.outputs.account_hash }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/imap-safe"
          import email,hashlib,html,imaplib,os,re,ssl
          from datetime import datetime,timezone
          from email.policy import default
          from email.utils import getaddresses,parsedate_to_datetime
          from urllib.parse import parse_qs,urlparse,unquote
          out={'IMAP_CONNECT':'NOT_RUN','IMAP_LOGIN':'NOT_RUN','IMAP_SELECT':'NOT_RUN','IMAP_SEARCH':'NOT_RUN','IMAP_RECIPIENT_MATCH':'0','IMAP_LINK_MATCH':'0','IMAP_TOKEN_SHAPE':'0','IMAP_ERROR':'NONE'}
          def finish():
              for k,v in out.items(): print(f'{k}={v}')
              print('PRODUCTION_MUTATION=NONE')
          h=os.environ.get('ACCOUNT_HASH','')
          if not re.fullmatch(r'[a-f0-9]{16}',h): out['IMAP_ERROR']='ACCOUNT_HASH_UNAVAILABLE'; finish(); raise SystemExit(0)
          host=os.environ.get('PC_P0_IMAP_HOST','').strip(); user=os.environ.get('PC_P0_IMAP_USER',''); password=os.environ.get('PC_P0_IMAP_PASSWORD',''); folder=(os.environ.get('PC_P0_IMAP_FOLDER') or 'INBOX').strip() or 'INBOX'
          try: port=int((os.environ.get('PC_P0_IMAP_PORT') or '993').strip())
          except: port=993
          if not host or not user or not password: out['IMAP_ERROR']='PREREQUISITE_MISSING'; finish(); raise SystemExit(0)
          client=None
          try:
              client=imaplib.IMAP4_SSL(host,port,ssl_context=ssl.create_default_context()); out['IMAP_CONNECT']='PASS'
              client.login(user,password); out['IMAP_LOGIN']='PASS'
              st,_=client.select(folder,readonly=True); out['IMAP_SELECT']='PASS' if st=='OK' else 'FAIL'
              if st!='OK': raise RuntimeError('select')
              st,data=client.search(None,'ALL'); out['IMAP_SEARCH']='PASS' if st=='OK' else 'FAIL'
              if st!='OK': raise RuntimeError('search')
              start=datetime.fromisoformat(os.environ['WINDOW_START'].replace('Z','+00:00')).timestamp()-300; end=datetime.fromisoformat(os.environ['WINDOW_END'].replace('Z','+00:00')).timestamp()+300
              rm=lm=tm=0
              for ident in reversed((data[0] or b'').split()[-500:]):
                  st,rows=client.fetch(ident,'(BODY.PEEK[])')
                  if st!='OK': continue
                  raw=next((x[1] for x in rows if isinstance(x,tuple) and len(x)>1),None)
                  if not raw: continue
                  msg=email.message_from_bytes(raw,policy=default)
                  try:
                      dt=parsedate_to_datetime(msg.get('date')); dt=dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc); ts=dt.timestamp()
                  except: continue
                  if not start<=ts<=end: continue
                  addresses=[]
                  for hd in ('to','cc','delivered-to','x-original-to','envelope-to'): addresses += [a for _,a in getaddresses(msg.get_all(hd,[])) if a]
                  matched=False
                  for a in addresses:
                      v=a.strip().lower()
                      if v.count('@')!=1: continue
                      local,domain=v.rsplit('@',1); c={v}
                      try: c.add(local+'@'+domain.encode('ascii').decode('idna').lower())
                      except: pass
                      try: c.add(local+'@'+domain.encode('idna').decode('ascii').lower())
                      except: pass
                      if any(hashlib.sha256(x.encode()).hexdigest()[:16]==h for x in c): matched=True; break
                  if not matched: continue
                  rm+=1; parts=[]
                  for p in (msg.walk() if msg.is_multipart() else (msg,)):
                      if p.get_content_type() not in ('text/plain','text/html'): continue
                      try: parts.append(p.get_content())
                      except: parts.append((p.get_payload(decode=True) or b'').decode(p.get_content_charset() or 'utf-8',errors='replace'))
                  body=html.unescape('\n'.join(parts)); urls=re.findall(r'https://[^\s<>"\']+/platform-v7/register\?[^\s<>"\']+',body,re.I)
                  if urls: lm+=1
                  if any(48<=len(unquote((parse_qs(urlparse(u).query).get('verify') or [''])[0]))<=512 and re.fullmatch(r'[A-Za-z0-9._~-]+',unquote((parse_qs(urlparse(u).query).get('verify') or [''])[0])) for u in urls): tm+=1
              out['IMAP_RECIPIENT_MATCH']=str(rm); out['IMAP_LINK_MATCH']=str(lm); out['IMAP_TOKEN_SHAPE']=str(tm)
          except imaplib.IMAP4.error:
              if out['IMAP_CONNECT']=='PASS' and out['IMAP_LOGIN']=='NOT_RUN': out['IMAP_LOGIN']='FAIL'; out['IMAP_ERROR']='LOGIN_FAILED'
              else: out['IMAP_ERROR']='IMAP_PROTOCOL_FAILED'
          except Exception:
              out['IMAP_ERROR']='IMAP_READ_FAILED'
          finally:
              if client is not None:
                  try: client.logout()
                  except: pass
          finish()
          PY
          cat "$RUNNER_TEMP/imap-safe"
          while IFS='=' read -r k v; do [[ "$v" =~ ^[A-Za-z0-9_.:-]{1,100}$ ]] || exit 31; echo "${k,,}=$v" >> "$GITHUB_OUTPUT"; done < "$RUNNER_TEMP/imap-safe"; rm -f "$RUNNER_TEMP/imap-safe"
      - name: Publish bounded evidence
        if: always()
        shell: bash
        env:
          MAIN: ${{ steps.target.outputs.main }}
          WEB_EVENTS: ${{ steps.web.outputs.web_events }}
          WEB_DELIVERED: ${{ steps.web.outputs.web_delivered }}
          WEB_PROVIDER: ${{ steps.web.outputs.web_provider }}
          WEB_REASON: ${{ steps.web.outputs.web_reason }}
          IMAP_CONNECT: ${{ steps.imap.outputs.imap_connect }}
          IMAP_LOGIN: ${{ steps.imap.outputs.imap_login }}
          IMAP_SELECT: ${{ steps.imap.outputs.imap_select }}
          IMAP_SEARCH: ${{ steps.imap.outputs.imap_search }}
          IMAP_RECIPIENT: ${{ steps.imap.outputs.imap_recipient_match }}
          IMAP_LINK: ${{ steps.imap.outputs.imap_link_match }}
          IMAP_TOKEN: ${{ steps.imap.outputs.imap_token_shape }}
          IMAP_ERROR: ${{ steps.imap.outputs.imap_error }}
        run: |
          set -euo pipefail
          body="$(mktemp)"; { echo '### PC-CROP legacy mail correlation v2 · run 31885882933'; echo; echo "- diagnostic main: \`${MAIN:-unknown}\`"; echo "- production subject: \`$SUBJECT_SHA\`"; echo "- Web events / delivered=true: \`${WEB_EVENTS:-unknown} / ${WEB_DELIVERED:-unknown}\`"; echo "- Web provider / reason: \`${WEB_PROVIDER:-unknown} / ${WEB_REASON:-unknown}\`"; echo "- IMAP connect/login/select/search: \`${IMAP_CONNECT:-unknown} / ${IMAP_LOGIN:-unknown} / ${IMAP_SELECT:-unknown} / ${IMAP_SEARCH:-unknown}\`"; echo "- IMAP recipient/link/token-shape matches: \`${IMAP_RECIPIENT:-unknown} / ${IMAP_LINK:-unknown} / ${IMAP_TOKEN:-unknown}\`"; echo "- IMAP safe error: \`${IMAP_ERROR:-unknown}\`"; echo '- production mutation: `NONE`'; } > "$body"; gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"; rm -f "$body"
      - name: Enforce diagnostic transport only
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.web.outputs.production_mutation }}' == NONE ]]
          [[ '${{ steps.imap.outputs.production_mutation }}' == NONE ]]
