name: Production Gekta Email Verification Runtime Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/production-gekta-email-verification-runtime-diagnostic.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-gekta-email-verification-runtime-diagnostic
  cancel-in-progress: false

env:
  RELEASE_ISSUE_NUMBER: 3072
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  SOURCE_RUN_ID: '31840822075'
  SOURCE_SINCE: '2026-08-14T21:04:00Z'
  SOURCE_UNTIL: '2026-08-14T21:09:00Z'
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate bounded diagnostic authority
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3072 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/production gekta-email-verify-diagnose current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact owner authority and static safety
        env:
          COMMENTER: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || '' }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -Eeuo pipefail
          if [[ '${{ github.event_name }}' == issue_comment ]]; then
            [[ "$COMMENTER" == "$OWNER" && "$ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]]
          fi
          grep -Fq 'docker inspect' .github/workflows/production-gekta-email-verification-runtime-diagnostic.yml
          grep -Fq 'docker logs' .github/workflows/production-gekta-email-verification-runtime-diagnostic.yml
          ! grep -Eq 'docker (exec|restart|stop|rm)|docker compose (up|down|restart)|psql|prisma migrate|UPDATE |INSERT |DELETE ' .github/workflows/production-gekta-email-verification-runtime-diagnostic.yml

  diagnose:
    name: Read-only active API/Web verification runtime
    needs: contract
    if: github.event_name == 'issue_comment' && needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact main
        id: main
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target_sha="$(git rev-parse origin/main)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$target_sha" ]]
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned REG.RU identity
        id: ssh
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ -n "$host" && "$host" == "${SSH_HOST_SECRET:-}" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"
          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 0600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 0600 "$HOME/.ssh/known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Inspect only bounded runtime facts and source-window markers
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${ssh_common[@]}" "$USER@$HOST" "SOURCE_SINCE='$SOURCE_SINCE' SOURCE_UNTIL='$SOURCE_UNTIL' bash -s" > "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t api_ids < <(docker ps -q --filter 'label=com.docker.compose.service=api')
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#api_ids[@]} == 1 && ${#web_ids[@]} == 1 )) || { echo 'CONTAINER_AUTHORITY=AMBIGUOUS'; exit 21; }
          api_id="${api_ids[0]}"; web_id="${web_ids[0]}"
          env_value(){
            local id="$1" key="$2"
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$id" | awk -F= -v key="$key" '$1==key {sub(/^[^=]*=/, ""); print; found=1} END {if (!found) exit 3}'
          }
          present(){ local value="$1"; [[ -n "$value" ]] && echo PRESENT || echo MISSING; }
          api_mfa="$(env_value "$api_id" MFA_ENCRYPTION_KEY 2>/dev/null || true)"
          api_delivery="$(env_value "$api_id" REGISTRATION_DELIVERY_KEY 2>/dev/null || true)"
          web_delivery="$(env_value "$web_id" REGISTRATION_DELIVERY_KEY 2>/dev/null || true)"
          web_ticket="$(env_value "$web_id" MFA_LOGIN_TICKET_SECRET 2>/dev/null || true)"
          echo "API_MFA_ENCRYPTION_KEY=$(present "$api_mfa")"
          if (( ${#api_mfa} >= 32 )); then echo 'API_MFA_ENCRYPTION_KEY_LENGTH=VALID'; else echo 'API_MFA_ENCRYPTION_KEY_LENGTH=INVALID'; fi
          echo "API_REGISTRATION_DELIVERY_KEY=$(present "$api_delivery")"
          echo "WEB_REGISTRATION_DELIVERY_KEY=$(present "$web_delivery")"
          if [[ -n "$api_delivery" && -n "$web_delivery" && "$api_delivery" == "$web_delivery" ]]; then echo 'REGISTRATION_DELIVERY_KEYS=MATCH'; else echo 'REGISTRATION_DELIVERY_KEYS=MISMATCH_OR_MISSING'; fi
          echo "WEB_MFA_LOGIN_TICKET_SECRET=$(present "$web_ticket")"
          if (( ${#web_ticket} >= 32 )); then echo 'WEB_MFA_LOGIN_TICKET_SECRET_LENGTH=VALID'; else echo 'WEB_MFA_LOGIN_TICKET_SECRET_LENGTH=INVALID'; fi
          api_log="$(docker logs --since "$SOURCE_SINCE" --until "$SOURCE_UNTIL" "$api_id" 2>&1 || true)"
          web_log="$(docker logs --since "$SOURCE_SINCE" --until "$SOURCE_UNTIL" "$web_id" 2>&1 || true)"
          if grep -Fq 'MFA_ENCRYPTION_KEY is required in production' <<<"$api_log"; then echo 'SOURCE_API_MFA_KEY_RUNTIME_ERROR=YES'; else echo 'SOURCE_API_MFA_KEY_RUNTIME_ERROR=NO'; fi
          if grep -Fq 'REGISTRATION_EMAIL_TOKEN_INVALID' <<<"$api_log"; then echo 'SOURCE_API_EMAIL_TOKEN_INVALID=YES'; else echo 'SOURCE_API_EMAIL_TOKEN_INVALID=NO'; fi
          if grep -Fq 'gekta_email_verification_contract_invalid' <<<"$web_log"; then echo 'SOURCE_WEB_VERIFY_CONTRACT_INVALID=YES'; else echo 'SOURCE_WEB_VERIFY_CONTRACT_INVALID=NO'; fi
          echo 'PRODUCTION_MUTATION=NONE'
          REMOTE
          cat "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"
          grep -Eq '^API_MFA_ENCRYPTION_KEY=(PRESENT|MISSING)$' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"
          grep -Eq '^REGISTRATION_DELIVERY_KEYS=(MATCH|MISMATCH_OR_MISSING)$' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"
          grep -Eq '^WEB_MFA_LOGIN_TICKET_SECRET=(PRESENT|MISSING)$' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"
          grep -Eq '^SOURCE_API_MFA_KEY_RUNTIME_ERROR=(YES|NO)$' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"
          grep -Eq '^SOURCE_API_EMAIL_TOKEN_INVALID=(YES|NO)$' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"
          grep -Eq '^SOURCE_WEB_VERIFY_CONTRACT_INVALID=(YES|NO)$' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"
          grep -Fxq PRODUCTION_MUTATION=NONE "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"

      - name: Guard exact main and publish bounded result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          api_mfa="$(grep '^API_MFA_ENCRYPTION_KEY=' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" | cut -d= -f2)"
          api_mfa_len="$(grep '^API_MFA_ENCRYPTION_KEY_LENGTH=' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" | cut -d= -f2)"
          delivery="$(grep '^REGISTRATION_DELIVERY_KEYS=' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" | cut -d= -f2)"
          web_ticket="$(grep '^WEB_MFA_LOGIN_TICKET_SECRET=' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" | cut -d= -f2)"
          web_ticket_len="$(grep '^WEB_MFA_LOGIN_TICKET_SECRET_LENGTH=' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" | cut -d= -f2)"
          mfa_err="$(grep '^SOURCE_API_MFA_KEY_RUNTIME_ERROR=' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" | cut -d= -f2)"
          token_invalid="$(grep '^SOURCE_API_EMAIL_TOKEN_INVALID=' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" | cut -d= -f2)"
          contract_invalid="$(grep '^SOURCE_WEB_VERIFY_CONTRACT_INVALID=' "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt" | cut -d= -f2)"
          for value in "$api_mfa" "$api_mfa_len" "$delivery" "$web_ticket" "$web_ticket_len" "$mfa_err" "$token_invalid" "$contract_invalid"; do [[ "$value" =~ ^[A-Z0-9_]+$ ]]; done
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production Gekta email-verification runtime diagnostic

- exact main: \`$TARGET_SHA\`
- source failed acceptance: \`$SOURCE_RUN_ID\`
- API MFA encryption key: \`$api_mfa / $api_mfa_len\`
- registration delivery key parity: \`$delivery\`
- Web MFA pending-ticket secret: \`$web_ticket / $web_ticket_len\`
- source-window API MFA-key runtime error: \`$mfa_err\`
- source-window API email-token invalid marker: \`$token_invalid\`
- source-window Web verify-contract-invalid marker: \`$contract_invalid\`
- production mutation: \`NONE\`
- secret values / hashes / email / phone / bearer token / cookies / TOTP / correlation IDs / raw logs: \`NOT_PUBLISHED\`
- new recurring cost: \`0 RUB\`"

      - name: Remove local credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/gekta-email-verify-diagnostic.txt"
