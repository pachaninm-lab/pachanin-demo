name: P0 Synthetic Admin Boundary Bounded Assembler

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p0-admin-boundary-assembler-3564.yml
      - .p0-repair-3564-admin-boundary/apply.py

permissions:
  contents: write

concurrency:
  group: p0-admin-boundary-assembler-3564
  cancel-in-progress: false

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bounded branch
        uses: actions/checkout@v4
        with:
          ref: p0/first-customer-access-foundation-3563
          fetch-depth: 0

      - name: Verify exact immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 98c0b3826b4929587a5ea9ffc23b7fa730427e95 HEAD
          test "$(git hash-object apps/api/src/modules/admin/admin.controller.ts)" = "809bf4eab18210b511e670958362f29d19ec8519"
          test "$(git hash-object apps/api/src/modules/admin/admin.controller.spec.ts)" = "71ffd12f2a3b131f233b0d08f58be45b8fc75cc5"
          test "$(git hash-object docs/platform-v7/autopilot/scopes/p0-first-customer-access-3563.json)" = "0adeb638d97879735e4ab5a5f04b3e64836636a6"
          mapfile -t transport_paths < <(git diff --name-only 98c0b3826b4929587a5ea9ffc23b7fa730427e95..HEAD | sort)
          test "${#transport_paths[@]}" -eq 2
          test "${transport_paths[0]}" = ".github/workflows/p0-admin-boundary-assembler-3564.yml"
          test "${transport_paths[1]}" = ".p0-repair-3564-admin-boundary/apply.py"

      - name: Assemble exact admin boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .p0-repair-3564-admin-boundary/apply.py
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "apps/api/src/modules/admin/admin.controller.spec.ts"
          test "${changed[1]}" = "apps/api/src/modules/admin/admin.controller.ts"
          test "${changed[2]}" = "docs/platform-v7/autopilot/scopes/p0-first-customer-access-3563.json"
          git diff --check
          ! grep -F "@Patch('users/:id/role')" apps/api/src/modules/admin/admin.controller.ts
          ! grep -F "@Patch('users/:id/org')" apps/api/src/modules/admin/admin.controller.ts
          ! grep -F "@Patch('users/:id/block')" apps/api/src/modules/admin/admin.controller.ts
          ! grep -F "@Post('users/:id/force-logout')" apps/api/src/modules/admin/admin.controller.ts
          ! grep -F "@Get('users/:id/mfa-status')" apps/api/src/modules/admin/admin.controller.ts
          ! grep -F 'AuthService' apps/api/src/modules/admin/admin.controller.ts

      - name: Remove transport and publish one bounded commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p0-admin-boundary-assembler-3564.yml .p0-repair-3564-admin-boundary/apply.py
          git add apps/api/src/modules/admin/admin.controller.ts \
            apps/api/src/modules/admin/admin.controller.spec.ts \
            docs/platform-v7/autopilot/scopes/p0-first-customer-access-3563.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): remove synthetic admin identity bypasses"
          git push origin HEAD:p0/first-customer-access-foundation-3563
