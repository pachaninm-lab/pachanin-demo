name: Production P0 Reviewer Reset and Auth-Hash Safety Classifier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-attempt-classifier.yml'
      - 'scripts/production-p0-reviewer-reset-attempt-classifier.sh'
      - 'scripts/check-production-p0-reviewer-reset-attempt-classifier.mjs'
      - 'docs/platform-v7/autopilot/scopes/production-p0-reviewer-reset-attempt-classifier-3785.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  PC_P0_REVIEWER_RESET_318_SCRIPT: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
    : "${GH_TOKEN:?GH_TOKEN is required}"
    : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
    : "${PC_REVIEWER_RESET_ATTEMPT_COMMAND:?PC_REVIEWER_RESET_ATTEMPT_COMMAND is required}"

    DEFAULT_HOST='195.19.12.120'
    LIVE_DOMAIN='xn----8sbjf4befbjgs9b.xn--p1ai'
    RELEASE_ISSUE_NUMBER='3072'
    SOURCE_RUN_ID='31808831183'
    ATTEMPT_SINCE='2026-08-14T14:18:35Z'
    ATTEMPT_UNTIL='2026-08-14T14:18:50Z'
    COMMAND='/production p0-reviewer-reset-attempt-classify 31808831183 current-main'
    PRODUCTION_MUTATION_MARKER='PRODUCTION_MUTATION|NONE'

    [[ "$PC_REVIEWER_RESET_ATTEMPT_COMMAND" == "$COMMAND" ]]
    [[ "$PRODUCTION_MUTATION_MARKER" == 'PRODUCTION_MUTATION|NONE' ]]

    key_path="$RUNNER_TEMP/pc-p0-reviewer-reset-attempt-31808831183-key"
    known_hosts="$RUNNER_TEMP/pc-p0-reviewer-reset-attempt-31808831183-known-hosts"
    TARGET_SHA='unknown'
    result_published=0
    failure_reason='BOOTSTRAP_FAILED'
    scan=''
    scan_raw=''
    match=''

    cleanup() {
      rm -f -- "$key_path" "$known_hosts"
      [[ -z "$scan" ]] || rm -f -- "$scan"
      [[ -z "$scan_raw" ]] || rm -f -- "$scan_raw"
      [[ -z "$match" ]] || rm -f -- "$match"
    }

    publish_failure() {
      local rc="$?"
      trap - ERR
      if [[ "$result_published" == '0' ]]; then
        gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production P0 reviewer reset attempt 31808831183 classifier

    - source reset run: \`$SOURCE_RUN_ID\`
    - exact diagnostic main: \`$TARGET_SHA\`
    - result: \`FAIL_CLOSED\`
    - failure reason: \`$failure_reason\`
    - reset replay / mail send: \`NONE\`
    - reviewer identity / reset token / credential exposure: \`NONE\`
    - raw database/runtime output: \`NOT_PUBLISHED\`
    - production mutation: \`NONE\`
    - exit code: \`$rc\`" >/dev/null || true
      fi
      exit "$rc"
    }

    trap cleanup EXIT
    trap publish_failure ERR

    trim() {
      local value="$1"
      value="${value#"${value%%[![:space:]]*}"}"
      value="${value%"${value##*[![:space:]]}"}"
      printf '%s' "$value"
    }

    guard_main() {
      [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
      git fetch --no-tags origin main >/dev/null
      [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
      [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
      [[ -z "$(git status --porcelain=v1)" ]]
    }

    failure_reason='MAIN_GUARD_FAILED'
    TARGET_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
    [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
    guard_main

    host="$(trim "${PC_PROD_HOST:-$DEFAULT_HOST}")"
    user="$(trim "${PC_PROD_SSH_USER:-}")"
    port="$(trim "${PC_PROD_SSH_PORT:-22}")"
    expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
    [[ "$host" == "$DEFAULT_HOST" ]]
    [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
    [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
    [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]

    validate_key() {
      local source="$1" public_key
      tr -d '\r' < "$source" > "$key_path"
      chmod 0600 "$key_path"
      grep -Eq '^(ssh-|ecdsa-|sk-)' "$key_path" && return 1
      public_key="$(mktemp)"
      ssh-keygen -y -P '' -f "$key_path" > "$public_key" 2>/dev/null \
        || { rm -f "$public_key"; return 1; }
      rm -f "$public_key"
    }

    try_key() {
      local raw="$1" plain escaped decoded
      [[ -n "$raw" ]] || return 1
      plain="$(mktemp)"; escaped="$(mktemp)"; decoded="$(mktemp)"
      printf '%s\n' "$raw" > "$plain"
      validate_key "$plain" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
      printf '%s' "${raw//\\n/$'\n'}" > "$escaped"
      validate_key "$escaped" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
      printf '%s' "$raw" | base64 --decode > "$decoded" 2>/dev/null \
        && validate_key "$decoded" \
        && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
      rm -f "$plain" "$escaped" "$decoded"
      return 1
    }

    failure_reason='SSH_PRIVATE_KEY_INVALID'
    try_key "${PC_PROD_SSH_KEY:-}" \
      || try_key "${PC_PROD_SSH_PRIVATE_KEY:-}" \
      || try_key "${VPS_SSH_KEY:-}"

    failure_reason='DNS_IP_GUARD_FAILED'
    domain_ips="$(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u || true)"
    grep -Fxq "$DEFAULT_HOST" <<< "$domain_ips"

    failure_reason='SSH_HOST_KEY_SCAN_FAILED'
    scan="$(mktemp)"; scan_raw="$(mktemp)"; match="$(mktemp)"
    pinned_ready=0
    for attempt in 1 2 3; do
      : > "$scan_raw"; : > "$scan"; : > "$match"
      /usr/bin/ssh-keyscan -T 10 -p "$port" "$host" > "$scan_raw" 2>/dev/null || true
      if [[ -s "$scan_raw" ]]; then
        sort -u "$scan_raw" > "$scan"
        while IFS= read -r line; do
          fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
          [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
        done < "$scan"
        sort -u -o "$match" "$match"
        if [[ "$(grep -c . "$match" || true)" == '1' ]]; then
          pinned_ready=1
          break
        fi
      fi
      (( attempt == 3 )) || sleep "$attempt"
    done
    [[ "$pinned_ready" == '1' ]]
    mv "$match" "$known_hosts"; match=''
    rm -f -- "$scan" "$scan_raw"; scan=''; scan_raw=''
    chmod 0600 "$known_hosts"

    guard_main
    failure_reason='SSH_TRANSPORT_FAILED'
    ssh_opts=(
      -i "$key_path" -p "$port"
      -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15
    )
    ssh "${ssh_opts[@]}" "$user@$host" \
      'set -Eeuo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null' >/dev/null

    guard_main
    failure_reason='REMOTE_CLASSIFICATION_FAILED'
    if ! output="$(ssh "${ssh_opts[@]}" "$user@$host" "bash -s -- '$TARGET_SHA' '$ATTEMPT_SINCE' '$ATTEMPT_UNTIL'" <<'REMOTE'
    set -Eeuo pipefail
    target_sha="$1"
    attempt_since="$2"
    attempt_until="$3"
    [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
    [[ "$attempt_since" == '2026-08-14T14:18:35Z' ]]
    [[ "$attempt_until" == '2026-08-14T14:18:50Z' ]]
    [[ "$(id -u)" -eq 0 ]]
    command -v docker >/dev/null 2>&1

    mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
    (( ${#web_ids[@]} == 1 ))
    web_id="${web_ids[0]}"
    project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
    [[ -n "$project" ]]
    mapfile -t api_ids < <(docker ps -q \
      --filter "label=com.docker.compose.project=$project" \
      --filter 'label=com.docker.compose.service=api')
    (( ${#api_ids[@]} == 1 ))
    api_id="${api_ids[0]}"
    api_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")"
    web_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")"
    [[ "$api_revision" == "$target_sha" && "$web_revision" == "$target_sha" ]]

    docker exec -i "$api_id" /nodejs/bin/node --input-type=commonjs - "$attempt_since" "$attempt_until" <<'NODE'
    const { createHash, createHmac } = require('node:crypto');
    const { PrismaClient } = require('@prisma/client');
    const [attemptSince, attemptUntil] = process.argv.slice(2);
    const safeCount = (value) => Number.isInteger(Number(value)) && Number(value) >= 0 && Number(value) <= 100;
    const fail = (code) => { throw new Error(code); };
    let staffDb;
    let authDb;

    (async () => {
      const staffUrl = String(process.env.STAFF_DATABASE_URL || '').trim();
      const authUrl = String(process.env.AUTH_DATABASE_URL || '').trim();
      const dealUrl = String(process.env.DATABASE_URL || '').trim();
      if (!staffUrl) fail('STAFF_DATABASE_URL_MISSING');
      if (!authUrl) fail('AUTH_DATABASE_URL_MISSING');
      if (!dealUrl || authUrl === dealUrl) fail('AUTH_DATABASE_URL_NOT_ISOLATED');

      staffDb = new PrismaClient({ datasources: { db: { url: staffUrl } } });
      const reviewerRows = await staffDb.$queryRawUnsafe(`
        SELECT
          preflight.active_owner_count,
          preflight.usable_reviewer_count,
          readiness.assignment_ready_count,
          readiness.active_identity_ready_count,
          readiness.membership_ready_count,
          readiness.password_ready_count,
          readiness.mfa_enrolled_ready_count,
          readiness.login_ready_count,
          auth.staff_reviewer_password_reset_subject() AS reviewer_email
        FROM auth.staff_reviewer_preflight() preflight
        CROSS JOIN auth.staff_reviewer_login_readiness() readiness
      `);
      if (reviewerRows.length !== 1) fail('REVIEWER_CARDINALITY');
      const reviewer = reviewerRows[0];
      const readiness = [
        Number(reviewer.active_owner_count),
        Number(reviewer.usable_reviewer_count),
        Number(reviewer.assignment_ready_count),
        Number(reviewer.active_identity_ready_count),
        Number(reviewer.membership_ready_count),
        Number(reviewer.password_ready_count),
        Number(reviewer.mfa_enrolled_ready_count),
        Number(reviewer.login_ready_count),
      ];
      if (readiness.some((value) => !safeCount(value)) || readiness.join('|') !== '1|1|1|1|1|0|0|0') {
        fail('REVIEWER_READINESS_NOT_EXACT');
      }
      const email = String(reviewer.reviewer_email || '');
      if (!/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$/.test(email) || email.length > 254) {
        fail('REVIEWER_SUBJECT_INVALID');
      }

      let readOnlyAuthUrl;
      try {
        readOnlyAuthUrl = new URL(authUrl);
        const existing = readOnlyAuthUrl.searchParams.get('options');
        readOnlyAuthUrl.searchParams.set(
          'options',
          `${existing ? `${existing} ` : ''}-c default_transaction_read_only=on`,
        );
      } catch {
        fail('AUTH_DATABASE_URL_INVALID');
      }
      authDb = new PrismaClient({ datasources: { db: { url: readOnlyAuthUrl.toString() } } });

      const subjectRows = await authDb.$queryRawUnsafe(
        `SELECT user_id FROM auth.resolve_password_reset_subject($1)`, email,
      );
      if (subjectRows.length !== 1 || !String(subjectRows[0]?.user_id || '')) fail('AUTH_SUBJECT_NOT_FOUND');
      const userId = String(subjectRows[0].user_id);

      const pepper = String(process.env.AUTH_TOKEN_PEPPER || '').trim();
      if (pepper.length < 32) fail('AUTH_TOKEN_PEPPER_NOT_READY');
      const hashKey = createHash('sha256').update(pepper, 'utf8').digest();
      const accountHash = createHmac('sha256', hashKey)
        .update(`password-reset:${email}`, 'utf8')
        .digest('hex');
      if (!/^[a-f0-9]{64}$/.test(accountHash)) fail('ACCOUNT_HASH_INVALID');

      const principalRows = await authDb.$queryRawUnsafe(`
        SELECT current_setting('transaction_read_only') = 'on' AS read_only,
               NOT rolsuper AS no_super,
               NOT rolbypassrls AS no_bypass,
               NOT rolinherit AS no_inherit,
               has_table_privilege(current_user, 'auth.password_reset_challenges', 'SELECT') AS reset_select,
               has_table_privilege(current_user, 'auth.audit_events', 'SELECT') AS audit_select,
               coalesce(has_function_privilege(current_user, to_regprocedure('auth.resolve_password_reset_subject(text)'), 'EXECUTE'), false) AS subject_execute
        FROM pg_roles WHERE rolname = current_user
      `);
      const principal = principalRows[0];
      if (!principal || !Object.values(principal).every((value) => value === true)) {
        fail('AUTH_PRINCIPAL_BOUNDARY');
      }

      const challengeRows = await authDb.$queryRawUnsafe(`
        SELECT
          count(*) FILTER (WHERE created_at >= $2::timestamptz AND created_at <= $3::timestamptz)::int AS attempt_count,
          count(*) FILTER (WHERE status = 'PENDING' AND expires_at > now())::int AS unexpired_pending_count,
          count(*) FILTER (WHERE status = 'PENDING' AND created_at >= now() - interval '60 seconds' AND created_at <= now())::int AS cooldown_pending_count,
          coalesce((SELECT c.status FROM auth.password_reset_challenges c WHERE c.user_id = $1 ORDER BY c.created_at DESC, c.id DESC LIMIT 1), 'NONE') AS latest_status,
          coalesce((SELECT c.expires_at <= now() FROM auth.password_reset_challenges c WHERE c.user_id = $1 ORDER BY c.created_at DESC, c.id DESC LIMIT 1), true) AS latest_expired
        FROM auth.password_reset_challenges
        WHERE user_id = $1
      `, userId, attemptSince, attemptUntil);
      if (challengeRows.length !== 1) fail('CHALLENGE_CARDINALITY');
      const challenge = challengeRows[0];
      const attemptChallenges = Number(challenge.attempt_count);
      const unexpiredPending = Number(challenge.unexpired_pending_count);
      const cooldownPending = Number(challenge.cooldown_pending_count);
      const latestStatus = String(challenge.latest_status || 'NONE');
      const latestExpired = challenge.latest_expired === true ? 1 : 0;
      if (![attemptChallenges, unexpiredPending, cooldownPending, latestExpired].every(safeCount)) {
        fail('CHALLENGE_AGGREGATE_INVALID');
      }
      if (!['NONE', 'PENDING', 'CONSUMED', 'EXPIRED'].includes(latestStatus)) fail('CHALLENGE_STATUS_INVALID');

      const auditRows = await authDb.$queryRawUnsafe(`
        SELECT
          count(*) FILTER (
            WHERE created_at >= $2::timestamptz AND created_at <= $3::timestamptz
              AND action = 'auth.password_reset.request'
              AND (user_id = $1 OR metadata->>'accountHash' = $4)
          )::int AS attempt_audit_count,
          count(*) FILTER (
            WHERE created_at >= $2::timestamptz AND created_at <= $3::timestamptz
              AND action = 'auth.password_reset.request' AND user_id = $1 AND reason = 'CHALLENGE_ISSUED'
          )::int AS issued_count,
          count(*) FILTER (
            WHERE created_at >= $2::timestamptz AND created_at <= $3::timestamptz
              AND action = 'auth.password_reset.request' AND user_id = $1 AND reason = 'COOLDOWN_ACTIVE'
          )::int AS cooldown_count,
          count(*) FILTER (
            WHERE created_at >= $2::timestamptz AND created_at <= $3::timestamptz
              AND action = 'auth.password_reset.request' AND metadata->>'accountHash' = $4 AND reason = 'DELIVERY_BOUNDARY_REJECTED'
          )::int AS boundary_count,
          count(*) FILTER (
            WHERE created_at >= $2::timestamptz AND created_at <= $3::timestamptz
              AND action = 'auth.password_reset.request' AND metadata->>'accountHash' = $4 AND reason = 'UNIVERSAL_NON_ELIGIBLE'
          )::int AS noneligible_count
        FROM auth.audit_events
      `, userId, attemptSince, attemptUntil, accountHash);
      if (auditRows.length !== 1) fail('AUDIT_CARDINALITY');
      const audit = auditRows[0];
      const attemptAudits = Number(audit.attempt_audit_count);
      const issued = Number(audit.issued_count);
      const cooldown = Number(audit.cooldown_count);
      const boundary = Number(audit.boundary_count);
      const noneligible = Number(audit.noneligible_count);
      if (![attemptAudits, issued, cooldown, boundary, noneligible].every(safeCount)) fail('AUDIT_AGGREGATE_INVALID');

      let attemptClass = 'NO_DURABLE_RESET_ATTEMPT_EVIDENCE';
      if (issued > 0 || attemptChallenges > 0) attemptClass = 'CHALLENGE_ISSUED_OR_PRESENT';
      else if (cooldown > 0) attemptClass = 'COOLDOWN_ACTIVE_DURING_ATTEMPT';
      else if (boundary > 0) attemptClass = 'DELIVERY_BOUNDARY_REJECTED';
      else if (noneligible > 0) attemptClass = 'UNIVERSAL_NON_ELIGIBLE';
      else if (attemptAudits > 0) attemptClass = 'OTHER_DURABLE_REQUEST_EVIDENCE';

      let retryClass = 'BLOCKED_ACTIVE_RESET_STATE';
      if (unexpiredPending === 0 && cooldownPending === 0 && readiness.join('|') === '1|1|1|1|1|0|0|0') {
        retryClass = 'FRESH_RESET_SAFE_BY_CURRENT_DURABLE_STATE';
      }

      process.stdout.write([
        'RESET_ATTEMPT_31808831183', 'PASS', targetRevisionSafe(process.env.PC_RUNTIME_TARGET_SHA),
        String(attemptChallenges), String(attemptAudits), String(issued), String(cooldown),
        String(boundary), String(noneligible), String(unexpiredPending), String(cooldownPending),
        latestStatus, String(latestExpired), attemptClass, retryClass, 'NONE',
      ].join('|') + '\n');
    })().catch((error) => {
      const raw = String(error?.message || 'UNKNOWN').replace(/[^A-Z0-9_-]/gi, '').slice(0, 64);
      process.stdout.write(`RESET_ATTEMPT_REMOTE_FAILURE|${raw || 'UNKNOWN'}\n`);
      process.exitCode = 1;
    }).finally(async () => {
      if (staffDb) await staffDb.$disconnect().catch(() => undefined);
      if (authDb) await authDb.$disconnect().catch(() => undefined);
    });

    function targetRevisionSafe(value) {
      const raw = String(value || '');
      return /^[0-9a-f]{40}$/.test(raw) ? raw : 'UNKNOWN';
    }
    NODE
    REMOTE
    )"; then
      false
    fi

    failure_reason='OUTPUT_VALIDATION_FAILED'
    [[ "$(wc -l <<< "$output" | tr -d '[:space:]')" == '1' ]]
    IFS='|' read -r marker pass runtime_target attempt_challenges attempt_audits issued cooldown boundary noneligible \
      unexpired_pending cooldown_pending latest_status latest_expired attempt_class retry_class mutation <<< "$output"
    [[ "$marker" == 'RESET_ATTEMPT_31808831183' && "$pass" == 'PASS' ]]
    [[ "$runtime_target" =~ ^(UNKNOWN|[0-9a-f]{40})$ ]]
    for value in "$attempt_challenges" "$attempt_audits" "$issued" "$cooldown" "$boundary" "$noneligible" "$unexpired_pending" "$cooldown_pending" "$latest_expired"; do
      [[ "$value" =~ ^[0-9]{1,3}$ ]]
    done
    [[ "$latest_status" =~ ^(NONE|PENDING|CONSUMED|EXPIRED)$ ]]
    [[ "$attempt_class" =~ ^(NO_DURABLE_RESET_ATTEMPT_EVIDENCE|CHALLENGE_ISSUED_OR_PRESENT|COOLDOWN_ACTIVE_DURING_ATTEMPT|DELIVERY_BOUNDARY_REJECTED|UNIVERSAL_NON_ELIGIBLE|OTHER_DURABLE_REQUEST_EVIDENCE)$ ]]
    [[ "$retry_class" =~ ^(FRESH_RESET_SAFE_BY_CURRENT_DURABLE_STATE|BLOCKED_ACTIVE_RESET_STATE)$ ]]
    [[ "$mutation" == 'NONE' ]]

    guard_main
    failure_reason='RESULT_PUBLISH_FAILED'
    gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production P0 reviewer reset attempt 31808831183 classifier

    - source reset run: \`$SOURCE_RUN_ID\`
    - exact diagnostic main: \`$TARGET_SHA\`
    - inspected deployed API/Web revision: \`$TARGET_SHA\`
    - result: \`PASS_READ_ONLY_CLASSIFIED\`
    - attempt-window challenges: \`$attempt_challenges\`
    - attempt-window attributable audit events: \`$attempt_audits\`
    - challenge-issued audit events: \`$issued\`
    - cooldown audit events: \`$cooldown\`
    - delivery-boundary audit events: \`$boundary\`
    - non-eligible audit events: \`$noneligible\`
    - active unexpired reset challenges now: \`$unexpired_pending\`
    - current 60-second cooldown challenges: \`$cooldown_pending\`
    - latest challenge status: \`$latest_status\`
    - latest challenge expired now: \`$latest_expired\`
    - attempt class: \`$attempt_class\`
    - retry class: \`$retry_class\`
    - reset replay / mail send: \`NONE\`
    - reviewer identity / reset token / credential exposure: \`NONE\`
    - raw database/runtime output: \`NOT_PUBLISHED\`
    - production mutation: \`NONE\`
    - machine mutation marker: \`$PRODUCTION_MUTATION_MARKER\`
    - new recurring cost: \`0 RUB\`" >/dev/null
    result_published=1

concurrency:
  group: production-p0-reviewer-reset-attempt-classifier
  cancel-in-progress: false

jobs:
  contract:
    name: Validate reviewer reset and auth-hash runtime classifier contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        (github.event.comment.body == '/production p0-reviewer-reset-attempt-classify 31706325376 current-main' ||
         github.event.comment.body == '/production p0-reviewer-reset-attempt-classify 31808831183 current-main' ||
         github.event.comment.body == '/production p0-auth-hash-runtime-classify current-main' ||
         github.event.comment.body == '/production p0-auth-hash-impact-classify current-main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-production-p0-reviewer-reset-attempt-classifier.mjs
      - run: bash -n scripts/production-p0-reviewer-reset-attempt-classifier.sh
      - name: Validate fixed reviewer reset attempt 31808831183 inline classifier
        shell: bash
        run: |
          set -Eeuo pipefail
          script="$RUNNER_TEMP/pc-p0-reviewer-reset-attempt-31808831183.sh"
          printf '%s\n' "$PC_P0_REVIEWER_RESET_318_SCRIPT" > "$script"
          chmod 0700 "$script"
          bash -n "$script"
          grep -Fq "SOURCE_RUN_ID='31808831183'" "$script"
          grep -Fq "ATTEMPT_SINCE='2026-08-14T14:18:35Z'" "$script"
          grep -Fq "ATTEMPT_UNTIL='2026-08-14T14:18:50Z'" "$script"
          grep -Fq "PRODUCTION_MUTATION_MARKER='PRODUCTION_MUTATION|NONE'" "$script"
          grep -Fq 'default_transaction_read_only=on' "$script"
          if grep -Eq 'docker[[:space:]]+(rm|restart|kill)|docker[[:space:]]+compose[[:space:]]+up' "$script"; then
            echo 'mutation surface detected in inline classifier' >&2
            exit 1
          fi

  classify:
    name: Read-only REG.RU reviewer reset and auth-hash runtime classifier
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
