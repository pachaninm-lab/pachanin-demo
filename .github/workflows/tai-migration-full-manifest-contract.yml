name: TAI Migration Full Manifest Contract

on:
  pull_request:
    paths:
      - ".github/workflows/tai-migration-full-manifest-contract.yml"
      - "scripts/check-tai-migration-sql-normalization.mjs"
      - "scripts/tai-reg-ru-deploy.sh"
      - "apps/tai/**"
      - "infra/docker/Dockerfile.tai"
      - "docs/platform-v7/autopilot/scopes/tai-migration-full-manifest-contract-20260802.json"

permissions:
  contents: read

concurrency:
  group: tai-migration-full-manifest-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: Every manifest migration through production generator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE: local/tai-migration-contract:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository manifest through exact production generator
        run: |
          set -Eeuo pipefail
          node scripts/check-tai-migration-sql-normalization.mjs
      - name: Build exact-head TAI image
        run: |
          set -Eeuo pipefail
          docker build \
            --file infra/docker/Dockerfile.tai \
            --build-arg "GIT_COMMIT=$SOURCE_SHA" \
            --build-arg "BUILD_DATE=1970-01-01T00:00:00Z" \
            --build-arg "APP_VERSION=0.1.0" \
            --tag "$IMAGE" \
            .
      - name: Run packaged image bundle through exact production generator
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/tai-image-migration-bundle.json"
          output="$RUNNER_TEMP/tai-image-migration-apply.sql"
          generator="$RUNNER_TEMP/tai-production-migration-generator.py"
          docker run --rm --read-only --network none --entrypoint python "$IMAGE" - > "$bundle" <<'PY_BUNDLE'
          import base64, hashlib, json
          from importlib import resources
          root=resources.files('tai.migrations')
          manifest=json.loads(root.joinpath('manifest.json').read_text(encoding='utf-8'))
          if manifest.get('schema_version') != 'tai.migration.manifest.v1': raise SystemExit('migration manifest schema mismatch')
          rows=[]; seen_versions=set(); seen_paths=set()
          for item in manifest.get('migrations') or []:
              version=item.get('version'); path=item.get('path')
              if not isinstance(version,int) or isinstance(version,bool) or version < 1 or version in seen_versions: raise SystemExit('migration version authority invalid')
              if not isinstance(path,str) or not path.endswith('.sql') or '/' in path or path in seen_paths: raise SystemExit('migration path authority invalid')
              raw=root.joinpath(path).read_bytes(); digest=hashlib.sha256(raw).hexdigest()
              seen_versions.add(version); seen_paths.add(path)
              rows.append({'version':version,'path':path,'sha256':digest,'contentBase64':base64.b64encode(raw).decode()})
          print(json.dumps({'schemaVersion':'tai.exact-image-migration-bundle.v1','migrations':rows},sort_keys=True,separators=(',',':')))
          PY_BUNDLE
          node - "$generator" <<'NODE_GENERATOR'
          const fs = require('node:fs');
          const [output] = process.argv.slice(2);
          const source = fs.readFileSync('scripts/tai-reg-ru-deploy.sh', 'utf8');
          const startMarker = "<<'PY_MIGRATION_SQL'\n";
          const endMarker = '\nPY_MIGRATION_SQL\n';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start + startMarker.length);
          if (start < 0 || end < 0) throw new Error('production generator heredoc missing');
          fs.writeFileSync(output, source.slice(start + startMarker.length, end), 'utf8');
          NODE_GENERATOR
          python3 "$generator" "$bundle" "$output" "$SOURCE_SHA"
          test -s "$output"
          rm -f "$bundle" "$output" "$generator"
      - name: Remove local image
        if: always()
        run: docker image rm --force "$IMAGE" >/dev/null 2>&1 || true
