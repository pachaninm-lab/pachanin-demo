name: TAI one-shot agro-wide semantic groups

on:
  push:
    branches:
      - fix/tai-agro-wide-semantic-groups-20260805
    paths:
      - .github/workflows/tai-one-shot-agro-wide-semantic-groups.yml

permissions:
  contents: write

concurrency:
  group: tai-one-shot-agro-wide-semantic-groups
  cancel-in-progress: false

jobs:
  patch:
    name: Apply governed agro-wide semantic groups
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/tai-agro-wide-semantic-groups-20260805
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/patch-tai-agro-wide-semantic-groups.py

      - name: Validate patched acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch-tai-agro-wide-semantic-groups.py
          node --check scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "id: 'bee-wintering'" scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "id: 'stores-feed'" scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "id: 'measurement-calibration'" scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "id: 'units-validation'" scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "id: 'cucumber-zh'" scripts/tai-potato-mobile-live-acceptance.mjs
          git diff --check

      - name: Commit governed result and retire temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tai-one-shot-agro-wide-semantic-groups.yml
          git rm scripts/patch-tai-agro-wide-semantic-groups.py
          git add scripts/tai-potato-mobile-live-acceptance.mjs
          git add docs/platform-v7/autopilot/scopes/tai-agro-wide-semantic-groups-20260805.json
          git commit -m "test(tai): validate all broad agro cases by semantic groups"
          git push origin HEAD:fix/tai-agro-wide-semantic-groups-20260805
