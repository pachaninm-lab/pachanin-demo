name: Temporary register Qwen recovery scope

on:
  push:
    branches:
      - governance/qwen-exact-image-chain-authority-3372
    paths:
      - .github/workflows/_temporary-register-qwen-recovery-scope.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/qwen-exact-image-chain-authority-3372
          fetch-depth: 0

      - name: Register exact bounded scope and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('docs/platform-v7/autopilot/autopilot-state.json')
          raw = path.read_text(encoding='utf-8')
          key = 'ops/qwen-recovery-exact-image-chain-3372'
          marker = '"approvedConcurrentScopes":{'
          entry = (
              '"ops/qwen-recovery-exact-image-chain-3372":['
              '".github/workflows/tai-qwen-exact-image-activation-chain.yml",'
              '"docs/platform-v7/autopilot/scopes/qwen-recovery-exact-image-chain-3372.json"],'
          )

          if key not in raw:
              count = raw.count(marker)
              if count != 1:
                  raise SystemExit(f'expected exactly one approvedConcurrentScopes marker, got {count}')
              raw = raw.replace(marker, marker + entry, 1)
              path.write_text(raw, encoding='utf-8')

          parsed = json.loads(path.read_text(encoding='utf-8'))
          expected = [
              '.github/workflows/tai-qwen-exact-image-activation-chain.yml',
              'docs/platform-v7/autopilot/scopes/qwen-recovery-exact-image-chain-3372.json',
          ]
          actual = parsed['approvedConcurrentScopes'].get(key)
          if actual != expected:
              raise SystemExit(f'wrong registered scope: {actual!r}')
          PY

          rm -f .github/workflows/_temporary-register-qwen-recovery-scope.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/platform-v7/autopilot/autopilot-state.json .github/workflows/_temporary-register-qwen-recovery-scope.yml
          git commit -m 'GOVERNANCE: register exact-image recovery scope'
          git push origin HEAD:governance/qwen-exact-image-chain-authority-3372
