name: Production P0 Reviewer Reset F37 Robust Log Classifier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-log-classifier-f37-robust.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-reset-log-classifier-f37-robust
  cancel-in-progress: false

env:
  COMMAND: /production p0-reviewer-reset-log-classify f37-consumed
  TRUSTED_CONNECTOR_APP_ID: '1144995'
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RESET_REVISION: f37cbb81ae485b48bd6e7a6e2c7b96e2b4c8bf1c
  ATTEMPT_SINCE: '2026-08-18T07:55:00Z'
  ATTEMPT_UNTIL: '2026-08-18T08:05:00Z'
  RELEASE_ISSUE_NUMBER: '3072'

jobs:
  contract:
    name: Validate bounded robust log-classifier contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-reviewer-reset-log-classify f37-consumed'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate fixed read-only diagnostic surface
        shell: bash
        run: |
          set -Eeuo pipefail
          source='.github/workflows/production-p0-reviewer-reset-log-classifier-f37-robust.yml'
          grep -Fq "COMMAND: /production p0-reviewer-reset-log-classify f37-consumed" "$source"
          grep -Fq "RESET_REVISION: f37cbb81ae485b48bd6e7a6e2c7b96e2b4c8bf1c" "$source"
          grep -Fq "ATTEMPT_SINCE: '2026-08-18T07:55:00Z'" "$source"
          grep -Fq "ATTEMPT_UNTIL: '2026-08-18T08:05:00Z'" "$source"
          grep -Fq "Password reset challenge/outbox transaction failed" "$source"
          grep -Fq "PRODUCTION_MUTATION=NONE" "$source"
          python3 - "$source" <<'PY'
          from pathlib import Path
          import sys
          t = Path(sys.argv[1]).read_text(encoding='utf-8')
          try:
              remote = t.split("<<'REMOTE'\n", 1)[1].split("\n          REMOTE", 1)[0]
          except IndexError as exc:
              raise SystemExit('REMOTE_BLOCK_MISSING') from exc
          forbidden = [
              'docker restart', 'docker rm ', 'docker compose', 'docker service',
              'docker pull', 'docker push', 'docker image rm', 'docker rmi',
              'curl --request POST', '-X POST', 'INSERT INTO', 'UPDATE auth.',
              'DELETE FROM', 'TRUNCATE ', 'ALTER ROLE', 'sendmail(',
              'MAIL FROM', 'RCPT TO', 'prisma migrate', 'psql '
          ]
          bad = [x for x in forbidden if x in remote]
          if bad:
              raise SystemExit('MUTATION_SURFACE_FORBIDDEN:' + '|'.join(bad))
          PY

      - name: Verify exact owner-issued provenance
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$COMMAND" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

  classify:
    name: Robustly classify consumed reviewer reset from fixed logs
    needs: contract
    if: github.event_name == 'issue_comment' && needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm current-main diagnostic authority
        id: authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          current="$(git rev-parse origin/main)"
          [[ "$(git rev-parse HEAD)" == "$current" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$current" ]]
          [[ "$RESET_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${RESET_REVISION}^{commit}"
          git merge-base --is-ancestor "$RESET_REVISION" "$current"
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Resolve protected key and pinned production host
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${PC_PROD_HOST:-$DEFAULT_HOST}")"
          user="$(trim "${PC_PROD_SSH_USER:-}")"
          port="$(trim "${PC_PROD_SSH_PORT:-22}")"
          expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || exit 10
          [[ -n "$user" && "$user" == "${PC_PROD_SSH_USER:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${PC_PROD_SSH_KEY:-}" || try_slot "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_slot "${VPS_SSH_KEY:-}" || exit 14

          scan="$(mktemp)"; match="$(mktemp)"; pinned=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned" == 1 ]] || { rm -f "$scan" "$match"; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Read fixed exact-revision logs and emit only safe classes
        id: classify
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          set +e
          output="$(
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$USER@$HOST" "bash -s -- '$RESET_REVISION' '$ATTEMPT_SINCE' '$ATTEMPT_UNTIL'" 2>/dev/null <<'REMOTE'
          set -Eeuo pipefail
          revision="$1"; since="$2"; until="$3"
          stage='BOOTSTRAP'
          finish(){
            rc=$?
            trap - EXIT
            printf 'REMOTE_STAGE=%s\n' "$stage"
            printf 'REMOTE_RC=%s\n' "$rc"
            printf 'PRODUCTION_MUTATION=NONE\n'
            exit "$rc"
          }
          trap finish EXIT
          [[ "$(id -u)" -eq 0 ]]
          docker version >/dev/null
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$since" == '2026-08-18T07:55:00Z' && "$until" == '2026-08-18T08:05:00Z' ]]

          stage='API_INVENTORY'
          mapfile -t api_ids < <(docker ps -aq --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} >= 1 ))

          stage='REVISION_MATCH'
          matching=()
          for id in "${api_ids[@]}"; do
            r="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$id" 2>/dev/null || true)"
            [[ "$r" != "$revision" ]] || matching+=("$id")
          done
          (( ${#matching[@]} >= 1 && ${#matching[@]} <= 6 ))

          stage='LOG_READ'
          all=''
          for id in "${matching[@]}"; do
            chunk="$(docker logs --since "$since" --until "$until" "$id" 2>&1 || true)"
            all+="${all:+$'\n'}$chunk"
          done

          stage='MARKER_COUNT'
          marker='Password reset challenge/outbox transaction failed'
          marker_count="$(grep -Fc "$marker" <<< "$all" || true)"
          [[ "$marker_count" =~ ^[0-9]+$ && "$marker_count" -ge 1 && "$marker_count" -le 8 ]]

          stage='BLOCK_EXTRACT'
          marker_line="$(grep -Fn "$marker" <<< "$all" | tail -n1 | cut -d: -f1)"
          [[ "$marker_line" =~ ^[0-9]+$ && "$marker_line" -ge 1 ]]
          end_line=$((marker_line + 35))
          block="$(sed -n "${marker_line},${end_line}p" <<< "$all")"
          [[ -n "$block" ]]
          unset all

          stage='CLASSIFY'
          error_type='UNKNOWN'
          grep -Fq 'PrismaClientKnownRequestError' <<< "$block" && error_type='PRISMA_KNOWN'
          grep -Fq 'PrismaClientUnknownRequestError' <<< "$block" && error_type='PRISMA_UNKNOWN'
          grep -Fq 'PrismaClientValidationError' <<< "$block" && error_type='PRISMA_VALIDATION'
          grep -Fq 'PrismaClientInitializationError' <<< "$block" && error_type='PRISMA_INITIALIZATION'

          source_stage='UNKNOWN'
          if grep -Eqi 'auth-mail-outbox\.service|AuthMailOutboxService|enqueue_mail_outbox' <<< "$block"; then source_stage='AUTH_MAIL_ENQUEUE'
          elif grep -Eqi 'auth-mail-crypto|encryptAuthMailEnvelope|authMailReplayDigest' <<< "$block"; then source_stage='AUTH_MAIL_CRYPTO'
          elif grep -Eqi 'auth-mail-templates|passwordResetMail|publicSiteOrigin' <<< "$block"; then source_stage='AUTH_MAIL_TEMPLATE'
          elif grep -Eqi 'password-reset\.repository|PasswordResetRepository' <<< "$block"; then source_stage='PASSWORD_RESET_REPOSITORY'
          elif grep -Eqi 'persistent-auth\.repository|PersistentAuthRepository' <<< "$block"; then source_stage='PERSISTENT_AUTH_REPOSITORY'
          elif grep -Eqi 'password-reset\.service|PasswordResetService' <<< "$block"; then source_stage='PASSWORD_RESET_SERVICE'
          fi

          code_class='NONE'
          for pair in \
            'P2034:PRISMA_P2034' 'P2002:PRISMA_P2002' 'P2010:PRISMA_P2010' 'P2028:PRISMA_P2028' \
            'P1010:PRISMA_P1010' 'P1001:PRISMA_P1001' \
            '42501:SQLSTATE_42501' '23505:SQLSTATE_23505' '23503:SQLSTATE_23503' \
            '23514:SQLSTATE_23514' '40001:SQLSTATE_40001' '25006:SQLSTATE_25006' \
            '42P01:SQLSTATE_42P01' '42883:SQLSTATE_42883' '42703:SQLSTATE_42703' \
            '22023:SQLSTATE_22023' '22P02:SQLSTATE_22P02' '22007:SQLSTATE_22007'; do
            needle="${pair%%:*}"; label="${pair#*:}"
            if grep -Fq "$needle" <<< "$block"; then code_class="$label"; break; fi
          done

          reason_class='OTHER'
          if grep -Eqi 'permission denied|insufficient privilege' <<< "$block"; then reason_class='PERMISSION_DENIED'
          elif grep -Eqi 'row-level security|violates row level security|RLS' <<< "$block"; then reason_class='ROW_LEVEL_SECURITY'
          elif grep -Eqi 'read-only transaction|read only transaction|cannot execute .* in a read-only' <<< "$block"; then reason_class='READ_ONLY_TRANSACTION'
          elif grep -Eqi 'function .*enqueue_mail_outbox.* does not exist|undefined function' <<< "$block"; then reason_class='ENQUEUE_FUNCTION_MISSING'
          elif grep -Eqi 'relation .*mail_outbox.* does not exist|undefined table' <<< "$block"; then reason_class='MAIL_OUTBOX_RELATION_MISSING'
          elif grep -Eqi 'duplicate key|unique constraint|unique violation' <<< "$block"; then reason_class='UNIQUE_VIOLATION'
          elif grep -Eqi 'foreign key|violates foreign key' <<< "$block"; then reason_class='FOREIGN_KEY_VIOLATION'
          elif grep -Eqi 'check constraint|violates check constraint' <<< "$block"; then reason_class='CHECK_CONSTRAINT'
          elif grep -Eqi 'could not serialize|serialization failure|write conflict|deadlock' <<< "$block"; then reason_class='SERIALIZATION_OR_DEADLOCK'
          elif grep -Eqi 'timeout|timed out' <<< "$block"; then reason_class='TIMEOUT'
          elif grep -Eqi 'ECONN|connection refused|connection terminated|server closed the connection' <<< "$block"; then reason_class='DB_CONNECTION'
          elif grep -Eqi 'ENOENT|no such file or directory' <<< "$block"; then reason_class='RUNTIME_FILE_MISSING'
          elif grep -Eqi 'Auth-mail key|AUTH_MAIL_OUTBOX|key version|keyring' <<< "$block"; then reason_class='AUTH_MAIL_KEY_RUNTIME'
          elif grep -Eqi 'idempotency key reused|idempotency row disappeared|invalid result' <<< "$block"; then reason_class='AUTH_MAIL_IDEMPOTENCY'
          elif grep -Eqi 'expiry must be in the future|availability is invalid|maxAttempts|correlation id is invalid|recipient is invalid|subject is invalid|text is invalid' <<< "$block"; then reason_class='AUTH_MAIL_VALIDATION'
          elif grep -Eqi 'operator does not exist|cannot cast|invalid input syntax' <<< "$block"; then reason_class='TYPE_OR_CAST'
          fi

          unset block
          printf 'STACK_CLASS=%s|%s|%s|%s|%s|%s\n' "$error_type" "$source_stage" "$code_class" "$reason_class" "$marker_count" "${#matching[@]}"
          stage='COMPLETE'
          REMOTE
          )"
          transport_rc=$?
          set -e
          remote_stage="$(sed -n 's/^REMOTE_STAGE=//p' <<< "$output" | tail -n1 || true)"
          remote_rc="$(sed -n 's/^REMOTE_RC=//p' <<< "$output" | tail -n1 || true)"
          mutation="$(sed -n 's/^PRODUCTION_MUTATION=//p' <<< "$output" | tail -n1 || true)"
          marker="$(sed -n 's/^STACK_CLASS=//p' <<< "$output" | tail -n1 || true)"

          result='FAIL_CLOSED_DIAGNOSTIC'
          error_type='TRANSPORT_OR_REMOTE'
          source_stage="${remote_stage:-NOT_STARTED}"
          code_class="SSH_RC_${transport_rc}"
          reason_class='REMOTE_CLASSIFIER_NOT_COMPLETE'
          marker_count='0'
          container_count='0'

          if (( transport_rc == 0 )) && [[ "$remote_stage" == 'COMPLETE' && "$remote_rc" == '0' && "$mutation" == 'NONE' ]] &&
             [[ "$marker" =~ ^[A-Z0-9_]+\|[A-Z0-9_]+\|[A-Z0-9_]+\|[A-Z0-9_]+\|[0-9]+\|[0-9]+$ ]]; then
            IFS='|' read -r error_type source_stage code_class reason_class marker_count container_count <<< "$marker"
            result='PASS_READ_ONLY_CLASSIFIED'
          elif [[ -n "$remote_stage" ]]; then
            code_class="REMOTE_RC_${remote_rc:-NA}"
            reason_class='REMOTE_STAGE_FAILED'
          fi

          {
            echo "result=$result"
            echo "transport_rc=$transport_rc"
            echo "remote_stage=${remote_stage:-NOT_STARTED}"
            echo "remote_rc=${remote_rc:-NA}"
            echo "error_type=$error_type"
            echo "source_stage=$source_stage"
            echo "code_class=$code_class"
            echo "reason_class=$reason_class"
            echo "marker_count=$marker_count"
            echo "container_count=$container_count"
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized read-only classification
        if: always()
        shell: bash
        env:
          AUTHORITY_OUTCOME: ${{ steps.authority.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          RESULT: ${{ steps.classify.outputs.result }}
          TRANSPORT_RC: ${{ steps.classify.outputs.transport_rc }}
          REMOTE_STAGE: ${{ steps.classify.outputs.remote_stage }}
          REMOTE_RC: ${{ steps.classify.outputs.remote_rc }}
          ERROR_TYPE: ${{ steps.classify.outputs.error_type }}
          SOURCE_STAGE: ${{ steps.classify.outputs.source_stage }}
          CODE_CLASS: ${{ steps.classify.outputs.code_class }}
          REASON_CLASS: ${{ steps.classify.outputs.reason_class }}
          MARKER_COUNT: ${{ steps.classify.outputs.marker_count }}
          CONTAINER_COUNT: ${{ steps.classify.outputs.container_count }}
        run: |
          set -Eeuo pipefail
          result="${RESULT:-FAIL_CLOSED_DIAGNOSTIC}"
          error_type="${ERROR_TYPE:-NOT_AVAILABLE}"
          source_stage="${SOURCE_STAGE:-NOT_STARTED}"
          code_class="${CODE_CLASS:-NONE}"
          reason_class="${REASON_CLASS:-PRE_REMOTE_STEP_FAILED}"
          marker_count="${MARKER_COUNT:-0}"
          container_count="${CONTAINER_COUNT:-0}"
          transport_rc="${TRANSPORT_RC:-NA}"
          remote_stage="${REMOTE_STAGE:-NOT_STARTED}"
          remote_rc="${REMOTE_RC:-NA}"

          if [[ "$AUTHORITY_OUTCOME" != 'success' ]]; then
            result='FAIL_CLOSED_AUTHORITY'
            reason_class='CURRENT_MAIN_AUTHORITY_FAILED'
          elif [[ "$SSH_OUTCOME" != 'success' ]]; then
            result='FAIL_CLOSED_SSH_PREP'
            reason_class='PINNED_SSH_PREPARATION_FAILED'
          elif [[ "$CLASSIFY_OUTCOME" != 'success' ]]; then
            result='FAIL_CLOSED_EXECUTION'
            reason_class='CLASSIFIER_STEP_FAILED'
          fi

          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production P0 reviewer consumed-reset robust log classifier

          - reset evidence comment: \`5325471181\`
          - reset revision: \`$RESET_REVISION\`
          - fixed log window: \`$ATTEMPT_SINCE .. $ATTEMPT_UNTIL\`
          - result: \`$result\`
          - authority / SSH prep / classifier step: \`$AUTHORITY_OUTCOME / $SSH_OUTCOME / $CLASSIFY_OUTCOME\`
          - transport rc / remote stage / remote rc: \`$transport_rc / $remote_stage / $remote_rc\`
          - error type: \`$error_type\`
          - source stage: \`$source_stage\`
          - safe code class: \`$code_class\`
          - safe reason class: \`$reason_class\`
          - failure marker count / exact-revision API containers: \`$marker_count / $container_count\`
          - raw logs / PII / credentials / reset material: \`NOT_PUBLISHED\`
          - reset replay / mail send / deployment: \`NONE\`
          - production mutation: \`NONE\`
          - new recurring cost: \`0 RUB\`"

          [[ "$result" == 'PASS_READ_ONLY_CLASSIFIED' ]]
