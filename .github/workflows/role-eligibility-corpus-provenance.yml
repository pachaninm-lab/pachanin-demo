name: Role Eligibility Corpus Provenance Diagnostic

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/role-eligibility-corpus-provenance.yml'
      - 'scripts/production-role-eligibility-corpus-provenance.sh'

permissions:
  contents: read
  issues: write

env:
  DEFAULT_HOST: 195.19.12.120
  ISSUE_NUMBER: 4922
  COMMAND: /role-eligibility corpus-provenance deployed
  EVIDENCE_DIR: artifacts/role-eligibility-corpus-provenance
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

concurrency:
  group: role-eligibility-corpus-provenance
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.number == 4922 &&
       github.event.comment.body == '/role-eligibility corpus-provenance deployed' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate read-only diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash -n scripts/production-role-eligibility-corpus-provenance.sh
          node - <<'NODE'
          const fs = require('node:fs');
          const src = fs.readFileSync('scripts/production-role-eligibility-corpus-provenance.sh', 'utf8');
          if (!src.includes('SET TRANSACTION READ ONLY')) throw new Error('READ_ONLY_TRANSACTION_REQUIRED');
          if (/\b(?:INSERT|UPDATE|DELETE|ALTER|DROP|TRUNCATE|CREATE|GRANT|REVOKE)\b/i.test(src)) throw new Error('MUTATING_SQL_TOKEN_FORBIDDEN');
          if (!src.includes('PRODUCTION_DATABASE_MUTATION=0')) throw new Error('DB_MUTATION_ASSERTION_REQUIRED');
          if (!src.includes('ROLE_ELIGIBILITY_ENFORCEMENT=false')) throw new Error('ENFORCEMENT_FALSE_ASSERTION_REQUIRED');
          console.log('ROLE_ELIGIBILITY_CORPUS_PROVENANCE_CONTRACT=PASS');
          NODE

      - name: Resolve protected key and pinned VPS identity
        if: github.event_name == 'issue_comment'
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo CORPUS_PROVENANCE_CANONICAL_VPS_MISMATCH >&2; exit 20; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo CORPUS_PROVENANCE_PRODUCTION_PRINCIPAL_INVALID >&2; exit 21; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 22
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo CORPUS_PROVENANCE_PINNED_HOST_FINGERPRINT_REQUIRED >&2; exit 23; }
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"; ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || { echo CORPUS_PROVENANCE_NO_VALID_PRIVATE_KEY >&2; exit 24; }

          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            if [[ "$(grep -c . "$match" || true)" == 1 ]]; then ready=1; break; fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$ready" == 1 ]] || { rm -f "$scan" "$match"; echo CORPUS_PROVENANCE_PINNED_HOST_KEY_MISMATCH >&2; exit 25; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo CORPUS_PROVENANCE_SSH_AUTH=PASS' \
            | tee "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Run deployed production corpus provenance diagnostic
        if: github.event_name == 'issue_comment'
        id: run
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            'bash -s' < scripts/production-role-eligibility-corpus-provenance.sh \
            > "$EVIDENCE_DIR/report.json" 2> "$EVIDENCE_DIR/runtime.log"
          cat "$EVIDENCE_DIR/runtime.log"
          grep -Fxq ROLE_ELIGIBILITY_CORPUS_PROVENANCE=PASS "$EVIDENCE_DIR/runtime.log"
          grep -Fxq ROLE_ELIGIBILITY_SHADOW_MODE=true "$EVIDENCE_DIR/runtime.log"
          grep -Fxq ROLE_ELIGIBILITY_ENFORCEMENT=false "$EVIDENCE_DIR/runtime.log"
          grep -Fxq PRODUCTION_DATABASE_MUTATION=0 "$EVIDENCE_DIR/runtime.log"
          grep -Fxq REGISTRATION_RUNTIME_UNCHANGED=PASS "$EVIDENCE_DIR/runtime.log"
          deployed_sha="$(sed -n 's/^ROLE_ELIGIBILITY_DEPLOYED_SHA=//p' "$EVIDENCE_DIR/runtime.log")"
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]

          node - "$EVIDENCE_DIR/report.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [path,out] = process.argv.slice(2);
          const p = JSON.parse(fs.readFileSync(path,'utf8'));
          if (p.schemaVersion !== 'role-eligibility-corpus-provenance.v1') throw new Error('REPORT_SCHEMA_INVALID');
          if (p.transactionMode !== 'READ_ONLY' || p.productionDatabaseMutation !== 0) throw new Error('REPORT_MODE_INVALID');
          const forbidden = /(?:^|_)(?:inn|ogrn|kpp|legal_name|tenant_id|organization_id|application_id|email|phone|password|secret|token)(?:$|_)/i;
          const walk = v => { if (Array.isArray(v)) return v.forEach(walk); if (!v || typeof v !== 'object') return; for (const [k,c] of Object.entries(v)) { if (forbidden.test(k)) throw new Error('PII_OUTPUT_KEY_FORBIDDEN'); walk(c); } };
          walk(p);
          const q=p.identifierQuality, s=p.structuralFixtureSignals;
          fs.appendFileSync(out, [
            `decision=${p.diagnosticDecision}`,
            `current_rows=${p.currentRows}`,
            `unique_subjects=${q.uniqueSubjects}`,
            `repeated_rows=${q.repeatedCurrentRows}`,
            `format_invalid=${q.formatInvalidRows}`,
            `checksum_invalid=${q.checksumInvalidRows}`,
            `checksum_valid=${q.checksumValidRows}`,
            `application_marker_rows=${s.applicationMarkerRows}`,
            `organization_marker_rows=${s.organizationMarkerRows}`,
            `deployed_sha=${process.env.DEPLOYED_SHA || ''}`,
          ].join('\n')+'\n');
          NODE
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"

      - name: Publish aggregate result to authority issue
        if: github.event_name == 'issue_comment' && steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ steps.run.outputs.deployed_sha }}
          DECISION: ${{ steps.run.outputs.decision }}
          CURRENT_ROWS: ${{ steps.run.outputs.current_rows }}
          UNIQUE_SUBJECTS: ${{ steps.run.outputs.unique_subjects }}
          REPEATED_ROWS: ${{ steps.run.outputs.repeated_rows }}
          FORMAT_INVALID: ${{ steps.run.outputs.format_invalid }}
          CHECKSUM_INVALID: ${{ steps.run.outputs.checksum_invalid }}
          CHECKSUM_VALID: ${{ steps.run.outputs.checksum_valid }}
          APP_MARKERS: ${{ steps.run.outputs.application_marker_rows }}
          ORG_MARKERS: ${{ steps.run.outputs.organization_marker_rows }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/result.md" <<EOF
          ## Role Eligibility production corpus provenance \`$GITHUB_RUN_ID\`

          - deployed API/worker SHA: \`$DEPLOYED_SHA\`
          - production DB transaction: \`READ ONLY\`
          - production DB mutation: \`0\`
          - registration runtime unchanged: \`PASS\`
          - enforcement: \`false\`
          - current rows: \`$CURRENT_ROWS\`
          - unique subjects: \`$UNIQUE_SUBJECTS\`
          - repeated current rows: \`$REPEATED_ROWS\`
          - identifier format invalid rows: \`$FORMAT_INVALID\`
          - identifier checksum invalid rows: \`$CHECKSUM_INVALID\`
          - identifier checksum valid rows: \`$CHECKSUM_VALID\`
          - structural application-marker rows: \`$APP_MARKERS\`
          - structural organization-marker rows: \`$ORG_MARKERS\`
          - diagnostic decision: \`$DECISION\`

          No raw INN/OGRN/application/organization identifiers are emitted. This diagnostic does not authorize enforcement or cutover.
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/result.md"

      - name: Upload immutable aggregate evidence
        if: github.event_name == 'issue_comment' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-eligibility-corpus-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Cleanup bounded credentials
        if: github.event_name == 'issue_comment' && always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
