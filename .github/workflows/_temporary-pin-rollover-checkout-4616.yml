name: temporary rollover action pin repair

on:
  push:
    branches:
      - ci/pin-rollover-checkout-4616

permissions:
  contents: write

concurrency:
  group: temporary-rollover-action-pin-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ci/pin-rollover-checkout-4616
          fetch-depth: 0
      - name: Apply bounded repair and remove this workflow
        env:
          EXPECTED_BASE: 0e9b7b13426264f11c7dd2a2695c4d83f5803340
          EXPECTED_BRANCH: ci/pin-rollover-checkout-4616
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/platform-v7-autopilot-guard.yml')
          text = path.read_text()
          floating = 'uses: actions/checkout@v4'
          pinned = 'uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4'
          if text.count(floating) != 3:
              raise SystemExit(f'expected exactly 3 floating checkout references, got {text.count(floating)}')
          parts = text.split(floating)
          path.write_text(parts[0] + pinned + parts[1] + pinned + parts[2] + floating + parts[3])
          PY
          git rm .github/workflows/_temporary-pin-rollover-checkout-4616.yml
          test "$(grep -c 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' .github/workflows/platform-v7-autopilot-guard.yml)" -ge 2
          test "$(grep -c 'actions/checkout@v4' .github/workflows/platform-v7-autopilot-guard.yml)" -eq 1
          node scripts/security/verify-action-pinning.mjs
          node --test scripts/security/verify-action-pinning.test.mjs
          node --test scripts/p7-autopilot-guard.test.mjs
          GITHUB_HEAD_REF="$EXPECTED_BRANCH" node scripts/p7-source-controlled-scope.mjs > "$RUNNER_TEMP/scope.txt"
          printf '%s\n' \
            '.github/workflows/platform-v7-autopilot-guard.yml' \
            'docs/platform-v7/autopilot/scopes/pin-rollover-checkout-4616.json' > "$RUNNER_TEMP/expected-scope.txt"
          diff -u "$RUNNER_TEMP/expected-scope.txt" "$RUNNER_TEMP/scope.txt"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/platform-v7-autopilot-guard.yml
          git commit -m 'ci: pin rollover guard checkout actions'
          git push origin HEAD:refs/heads/ci/pin-rollover-checkout-4616
