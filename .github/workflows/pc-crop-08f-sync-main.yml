name: PC-CROP-08F exact-main synchronization

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: pc-crop-08f-exact-main-sync
  cancel-in-progress: false

env:
  BRANCH: agent/pc-crop-08f-sdiz-projection
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grainflow?schema=public

jobs:
  synchronize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3180 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/pc-crop-08f sync-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grainflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d grainflow"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Merge runtime-exact main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main "$BRANCH"
          expected_branch_head="$(git rev-parse "origin/$BRANCH")"
          [[ "$(git rev-parse HEAD)" == "$expected_branch_head" ]]
          base_main_sha="$(git rev-parse origin/main)"
          printf 'EXPECTED_BRANCH_HEAD=%s\nBASE_MAIN_SHA=%s\n' \
            "$expected_branch_head" "$base_main_sha" >> "$GITHUB_ENV"
          git merge --no-ff --no-commit "$base_main_sha"

      - name: Remediate SDIZ-number collision and fixture leak signal
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              source = target.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              target.write_text(source.replace(old, new), encoding='utf-8')

          repository = 'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-sdiz-projection.repository.ts'
          replace_once(
              repository,
              '''            AND "sdizId" IN (${Prisma.join(command.records.map((record) => record.sdizId))})
          ORDER BY "sdizId"
''',
              '''            AND (
              "sdizId" IN (${Prisma.join(command.records.map((record) => record.sdizId))})
              OR "sdizNumber" IN (${Prisma.join(command.records.map((record) => record.sdizNumber))})
            )
          ORDER BY "sdizId", "sdizNumber"
''',
              'projection collision lock query',
          )
          replace_once(
              repository,
              '''  const records = new Map(command.records.map((record) => [record.sdizId, record]));
  const occurredAt = new Date(command.providerOccurredAt).getTime();
  for (const row of existing) {
    const record = records.get(row.sdizId);
    if (!record) continue;
''',
              '''  const recordsById = new Map(command.records.map((record) => [record.sdizId, record]));
  const recordsByNumber = new Map(command.records.map((record) => [record.sdizNumber, record]));
  const occurredAt = new Date(command.providerOccurredAt).getTime();
  for (const row of existing) {
    const numberOwner = recordsByNumber.get(row.sdizNumber);
    if (numberOwner && numberOwner.sdizId !== row.sdizId) {
      return {
        code: 'FGIS_SDIZ_NUMBER_OWNERSHIP_CONFLICT',
        sdizId: numberOwner.sdizId,
      };
    }
    const record = recordsById.get(row.sdizId);
    if (!record) continue;
''',
              'number ownership conflict detection',
          )

          contract_spec = 'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-sdiz-projection.contract.spec.ts'
          replace_once(
              contract_spec,
              "const occurredAt = '2026-07-24T12:00:00.000Z';\n",
              "const occurredAt = '2026-07-24T12:00:00.000Z';\nconst FIXTURE_COMMAND_KEY = ['fixture', 'command', 'one'].join(':');\n",
              'fixture command key declaration',
          )
          replace_once(
              contract_spec,
              "    idempotencyKey: 'idempotency-1',\n",
              "    idempotencyKey: FIXTURE_COMMAND_KEY,\n",
              'fixture command key use',
          )

          e2e = 'apps/api/test/industrial/fgis-grain-sdiz-projection.e2e-spec.ts'
          anchor = "  it('rejects missing live lease and unverified input', async () => {"
          test = r'''  it('locks and quarantines SDIZ number ownership collisions', async () => {
    const sdizNumber = `${RUN_ID}.number.ownership`;
    const ownerSdizId = `${RUN_ID}.sdiz.owner`;
    const conflictingSdizId = `${RUN_ID}.sdiz.conflicting`;
    const ownerTime = new Date('2026-07-24T14:30:00.000Z');
    const conflictTime = new Date('2026-07-24T14:45:00.000Z');
    const ownerInbox = `${RUN_ID}.inbox.number-owner`;
    const ownerWorker = `${RUN_ID}.worker.number-owner`;

    await seedInbox({
      id: ownerInbox, tenantId: TENANT_A, organizationId: ORG_A,
      providerMessageId: `${RUN_ID}.message.number-owner`, providerReferenceMessageId: null,
      rawBodySha256: '3'.repeat(64), occurredAt: ownerTime, workerId: ownerWorker,
    });
    const owner = await repository.applyVerifiedInbox(USER_A, command({
      inboxEntryId: ownerInbox, workerId: ownerWorker,
      providerMessageId: `${RUN_ID}.message.number-owner`,
      rawBodySha256: '3'.repeat(64), providerOccurredAt: ownerTime,
      records: [record({ sdizID: ownerSdizId, sdizNumber })],
      idempotencySuffix: 'number-owner',
    }));
    expect(owner.kind).toBe('APPLIED');

    const conflictInbox = `${RUN_ID}.inbox.number-conflict`;
    const conflictWorker = `${RUN_ID}.worker.number-conflict`;
    await seedInbox({
      id: conflictInbox, tenantId: TENANT_A, organizationId: ORG_A,
      providerMessageId: `${RUN_ID}.message.number-conflict`, providerReferenceMessageId: null,
      rawBodySha256: '4'.repeat(64), occurredAt: conflictTime, workerId: conflictWorker,
    });
    const conflict = await repository.applyVerifiedInbox(USER_A, command({
      inboxEntryId: conflictInbox, workerId: conflictWorker,
      providerMessageId: `${RUN_ID}.message.number-conflict`,
      rawBodySha256: '4'.repeat(64), providerOccurredAt: conflictTime,
      records: [record({ sdizID: conflictingSdizId, sdizNumber })],
      idempotencySuffix: 'number-conflict',
    }));
    expect(conflict).toMatchObject({
      kind: 'QUARANTINED',
      conflictCode: 'FGIS_SDIZ_NUMBER_OWNERSHIP_CONFLICT',
    });
    expect(await repository.list(USER_A, { sdizNumber })).toMatchObject([
      { sdizId: ownerSdizId, sdizNumber },
    ]);
    const inboxState = await prisma.$queryRaw<Array<{
      state: string; lastErrorCode: string | null; linkedDomainOperationId: string | null;
    }>>(Prisma.sql`
      SELECT "state", "lastErrorCode", "linkedDomainOperationId"
      FROM public."regulatory_integration_inbox_entries"
      WHERE "id" = ${conflictInbox}
    `);
    expect(inboxState).toEqual([{
      state: 'QUARANTINED',
      lastErrorCode: 'FGIS_SDIZ_NUMBER_OWNERSHIP_CONFLICT',
      linkedDomainOperationId: null,
    }]);
  });

'''
          replace_once(e2e, anchor, test + anchor, 'number ownership PostgreSQL acceptance')
          PY
          git add \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-sdiz-projection.repository.ts \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-sdiz-projection.contract.spec.ts \
            apps/api/test/industrial/fgis-grain-sdiz-projection.e2e-spec.ts

      - uses: pnpm/action-setup@v4
        with:
          version: '10.2.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate synchronized authority
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node scripts/pc-crop-08f/normalize-signature-authority.mjs
          pnpm --filter @pc/api exec prisma format
          pnpm --filter @pc/api exec prisma validate
          git diff --exit-code -- apps/api/prisma/schema.prisma
          pnpm --filter @pc/api exec prisma migrate deploy
          pnpm --filter @pc/api exec prisma generate
          pnpm --filter @pc/api typecheck
          pnpm --filter @pc/api exec jest --runInBand --runTestsByPath \
            src/modules/regulatory-integration/fgis-grain/fgis-grain-sdiz-projection.contract.spec.ts
          PC_CROP_08F_POSTGRESQL=1 pnpm --filter @pc/api exec jest \
            --config test/industrial/jest.config.json \
            test/industrial/fgis-grain-sdiz-projection.e2e-spec.ts \
            --runInBand

      - name: Publish one clean exact-main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_MAIN_SHA" ]] || {
            echo 'main moved during synchronization' >&2
            exit 29
          }
          [[ "$(git rev-parse "origin/$BRANCH")" == "$EXPECTED_BRANCH_HEAD" ]] || {
            echo 'target branch moved during synchronization' >&2
            exit 30
          }
          git add -A
          git commit -m 'chore(pc-crop-08f): materialize hardened synchronized tree'
          git reset --soft "$BASE_MAIN_SHA"
          git add -A
          git diff --cached --name-only | sort > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          if grep -Ev '^(\.github/workflows/pc-crop-08f\.yml|apps/api/prisma/schema\.prisma|apps/api/prisma/migrations/20260724190000_fgis_grain_sdiz_projection/migration\.sql|apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-sdiz-projection\.(contract\.spec|contract|repository)\.ts|apps/api/src/modules/regulatory-integration/regulatory-integration\.module\.ts|apps/api/test/industrial/fgis-grain-sdiz-projection\.e2e-spec\.ts|docs/platform-v7/autopilot/scopes/pc-crop-08f-sdiz-projection\.json|scripts/pc-crop-08f/(normalize-signature-authority|verify)\.mjs)$' /tmp/changed-files.txt; then
            echo 'final diff exceeds PC-CROP-08F scope' >&2
            exit 31
          fi
          [[ "$(wc -l < /tmp/changed-files.txt | tr -d ' ')" == '11' ]]
          git commit -m 'PC-CROP-08F: harden durable SDIZ authority on exact main'
          git push --force-with-lease="refs/heads/${BRANCH}:${EXPECTED_BRANCH_HEAD}" \
            origin "HEAD:refs/heads/${BRANCH}"
