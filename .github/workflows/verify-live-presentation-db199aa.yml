name: Diagnose Live Presentation 2fd54c74

on:
  push:
    branches:
      - verify/live-presentation-db199aa-20260828

permissions:
  contents: read

jobs:
  verify:
    name: Diagnose public presentation 500
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
      TARGET_SHA: 2fd54c74ecb122066a129feb2316f218429064ff
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - name: Verify exact live revision and public CTA
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cache="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          manifest="$(curl -fsSL --compressed --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 "$LIVE_BASE/manifest-pc-deploy.json?presentation_verify=$cache")"
          grep -Fq "$TARGET_SHA" <<< "$manifest"
          home_code="$(curl -sS -L --compressed --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 -o evidence/platform-v7.html -w '%{http_code}' "$LIVE_BASE/platform-v7?lang=ru&presentation_verify=$cache")"
          [[ "$home_code" == 200 ]]
          grep -Fq 'href="/downloads/prozrachnaya-tsena-presentation.pdf"' evidence/platform-v7.html
          grep -Fq 'data-testid="platform-v7-presentation-download"' evidence/platform-v7.html
          printf 'LIVE_REVISION=%s\nHOME_HTTP=%s\nCTA=PASS\n' "$TARGET_SHA" "$home_code" > evidence/summary.txt

      - name: Probe live PDF once
        id: pdf
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          url="$LIVE_BASE/downloads/prozrachnaya-tsena-presentation.pdf"
          code="$(curl -sS -L --connect-timeout 15 --max-time 60 -D evidence/live-presentation.headers -o evidence/live-presentation.pdf -w '%{http_code}' "$url?presentation_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          printf 'PDF_HTTP=%s\n' "$code" | tee -a evidence/summary.txt
          [[ "$code" == 200 ]]

      - name: Capture read-only web runtime error
        if: steps.pdf.outcome == 'failure'
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/prod-key"
          known="$RUNNER_TEMP/known-hosts"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          validate_key(){ local src="$1" pub; tr -d '\r' < "$src" > "$key"; chmod 0600 "$key"; pub="$(mktemp)"; ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"; }
          try_key(){ local raw="$1" a b c; [[ -n "$raw" ]] || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          host="$(trim "${PC_PROD_HOST:-195.19.12.120}")"; user="$(trim "${PC_PROD_SSH_USER:-}")"; port="$(trim "${PC_PROD_SSH_PORT:-22}")"; expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          try_key "${PC_PROD_SSH_KEY:-}" || try_key "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_key "${VPS_SSH_KEY:-}"
          scan="$(mktemp)"; match="$(mktemp)"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          while IFS= read -r line; do fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"; done < "$scan"
          sort -u -o "$match" "$match"; [[ "$(grep -c . "$match" || true)" == 1 ]]; mv "$match" "$known"; chmod 0600 "$known"
          ssh -i "$key" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" "$user@$host" 'set -Eeuo pipefail; mapfile -t w < <(docker ps -q --filter "label=com.docker.compose.service=web"); ((${#w[@]}==1)); docker logs --since 10m "${w[0]}" 2>&1 | grep -E "presentation|Brotli|brotli|zlib|Buffer|ENOENT|ReferenceError|TypeError|ERR_|Error:" | tail -160' | sed -E 's/(Bearer|token|cookie|authorization)[^ ]*/\1=[REDACTED]/Ig' | tee evidence/runtime-error.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-presentation-diagnostic-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
