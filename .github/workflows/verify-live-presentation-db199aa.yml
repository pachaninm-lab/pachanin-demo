name: Verify Live Presentation ff07563c

on:
  push:
    branches:
      - verify/live-presentation-db199aa-20260828
    paths:
      - '.github/workflows/verify-live-presentation-db199aa.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify public PDF binary twice
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
      TARGET_SHA: ff07563c300f2cd98dd8ef08497545a19366c83d
      EXPECTED_PDF_SHA256: 1f99bd881404624ef8fe8bec9a10caf10a021f8cacff3ed5a6633101255178a5
      EXPECTED_PDF_BYTES: '312533'
    steps:
      - name: Verify exact live revision
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cache="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          manifest="$(curl -fsSL --compressed --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 "$LIVE_BASE/manifest-pc-deploy.json?presentation_verify=$cache")"
          printf '%s\n' "$manifest" > evidence/manifest.json
          grep -Fq "$TARGET_SHA" <<< "$manifest"
          printf 'LIVE_REVISION=%s\n' "$TARGET_SHA" > evidence/summary.txt

      - name: Verify two independent PDF downloads
        shell: bash
        run: |
          set -Eeuo pipefail
          url="$LIVE_BASE/downloads/prozrachnaya-tsena-presentation.pdf"
          for n in 1 2; do
            pdf="evidence/live-presentation-$n.pdf"
            hdr="evidence/live-presentation-$n.headers"
            code="$(curl -sS -L --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 -D "$hdr" -o "$pdf" -w '%{http_code}' "$url?presentation_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$n")"
            bytes="$(stat -c%s "$pdf")"
            sha="$(sha256sum "$pdf" | awk '{print $1}')"
            magic="$(head -c 5 "$pdf")"
            printf 'DOWNLOAD_%s_HTTP=%s\nDOWNLOAD_%s_BYTES=%s\nDOWNLOAD_%s_SHA256=%s\nDOWNLOAD_%s_MAGIC=%s\n' "$n" "$code" "$n" "$bytes" "$n" "$sha" "$n" "$magic" | tee -a evidence/summary.txt
            [[ "$code" == 200 ]]
            grep -Eiq '^content-type:[[:space:]]*application/pdf([;[:space:]]|$)' "$hdr"
            grep -Eiq '^content-disposition:[[:space:]]*attachment;.*prozrachnaya-tsena-presentation\.pdf' "$hdr"
            [[ "$bytes" == "$EXPECTED_PDF_BYTES" ]]
            [[ "$sha" == "$EXPECTED_PDF_SHA256" ]]
            [[ "$magic" == '%PDF-' ]]
            tail -c 128 "$pdf" | grep -aFq '%%EOF'
          done
          cmp -s evidence/live-presentation-1.pdf evidence/live-presentation-2.pdf
          printf 'BYTE_IDENTICAL=YES\nLIVE_PRESENTATION_VERIFICATION=PASS\n' | tee -a evidence/summary.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-presentation-verification-ff07563c-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
