name: Production P0 All-Role Registration Failure Classifier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-all-role-registration-failure-classifier.yml'
      - 'scripts/production-p0-all-role-registration-failure-classifier.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-all-role-registration-failure-classifier.yml'
      - 'scripts/production-p0-all-role-registration-failure-classifier.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-all-role-registration-failure-classifier
  cancel-in-progress: false

env:
  COMMAND: /production p0-all-role-registration-failure-classify 33046149523 current-main

jobs:
  contract:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       (github.event.issue.number == 3072 || github.event.issue.number == 4637) &&
       github.event.comment.user.login == github.repository_owner &&
       github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner &&
       github.event.comment.body == '/production p0-all-role-registration-failure-classify 33046149523 current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-p0-all-role-registration-failure-classifier.sh
          grep -Fq "SOURCE_RUN_ID='33046149523'" scripts/production-p0-all-role-registration-failure-classifier.sh
          grep -Fq "P0_PRODUCTION_MUTATION=NONE" scripts/production-p0-all-role-registration-failure-classifier.sh

  classify:
    needs: contract
    if: >-
      needs.contract.result == 'success' && github.event_name == 'issue_comment' &&
      (github.event.issue.number == 3072 || github.event.issue.number == 4637) &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-all-role-registration-failure-classify 33046149523 current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact current main
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" == '334f50aef79fc251bb625cb6b45f7b1ed4d0975f' ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
      - name: Resolve protected pinned SSH authority
        id: ssh
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PC_PROD_HOST }}
          SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
          SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
          SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
          SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          host="${SSH_HOST//[[:space:]]/}"; user="${SSH_USER//[[:space:]]/}"; port="${SSH_PORT//[[:space:]]/}"
          [[ "$host" == '195.19.12.120' ]]
          [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          key="$RUNNER_TEMP/pc-p0-classifier-key"; known="$RUNNER_TEMP/pc-p0-classifier-known-hosts"
          validate(){ chmod 0600 "$key"; ssh-keygen -y -P '' -f "$key" >/dev/null 2>&1; }
          load(){ local raw="$1"; [[ -n "$raw" ]] || return 1; printf '%s\n' "$raw" | tr -d '\r' > "$key"; validate && return 0; printf '%s' "${raw//\\n/$'\n'}" > "$key"; validate && return 0; printf '%s' "$raw" | base64 --decode > "$key" 2>/dev/null && validate; }
          load "$SSH_KEY_PRIMARY" || load "$SSH_KEY_SECONDARY" || load "$SSH_KEY_FALLBACK"
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fp" != "$SSH_FINGERPRINT" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$known"; rm -f "$scan"; chmod 0600 "$known"
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "user=$user" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"; echo "known=$known" >> "$GITHUB_OUTPUT"
      - name: Classify failed bank registration from existing production logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PC_P0_SSH_HOST: ${{ steps.ssh.outputs.host }}
          PC_P0_SSH_USER: ${{ steps.ssh.outputs.user }}
          PC_P0_SSH_PORT: ${{ steps.ssh.outputs.port }}
          PC_P0_SSH_KEY_PATH: ${{ steps.ssh.outputs.key }}
          PC_P0_SSH_KNOWN_HOSTS: ${{ steps.ssh.outputs.known }}
        run: bash scripts/production-p0-all-role-registration-failure-classifier.sh '${{ steps.target.outputs.sha }}'
