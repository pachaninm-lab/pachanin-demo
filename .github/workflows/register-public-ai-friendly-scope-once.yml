name: One-time register public AI friendly agro scope

on:
  push:
    branches:
      - governance/public-ai-friendly-agro-expert
    paths:
      - .github/workflows/register-public-ai-friendly-scope-once.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/public-ai-friendly-agro-expert
          fetch-depth: 0
      - name: Register owner-approved concurrent scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/platform-v7/autopilot/autopilot-state.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.setdefault('approvedConcurrentScopes', {})['fix/public-ai-friendly-agro-expert'] = [
              'docs/platform-v7/autopilot/autopilot-state.json',
              'docs/platform-v7/autopilot/scopes/fix-public-ai-friendly-agro-expert.json',
              'apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts',
              'apps/api/src/modules/ai-insights/restricted-public-qwen.service.spec.ts',
              'apps/web/app/api/restricted-public-platform-assistant/route.ts',
              'apps/web/tests/unit/platformV7RestrictedPublicQwenRoute.test.ts',
              'apps/web/components/platform-v7/PublicPlatformAssistant.tsx',
              'apps/web/tests/unit/publicPlatformAssistantDomainCopy.test.ts',
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/register-public-ai-friendly-scope-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/platform-v7/autopilot/autopilot-state.json
          git commit -m 'GOVERNANCE: register public AI friendly agro scope'
          git push origin HEAD:governance/public-ai-friendly-agro-expert
