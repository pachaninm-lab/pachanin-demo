name: One-time fix Qwen subtitle assertion

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-qwen-subtitle-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qwen-live-ui-acceptance-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Stage corrected workflow blob
        shell: bash
        run: |
          set -euo pipefail
          staging='docs/platform-v7/autopilot/staging/tai-restricted-qwen-reg-ru-activation.subtitle-fixed.yml.txt'
          if [[ ! -f "$staging" ]]; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [index for index, line in enumerate(lines) if 'agro_subtitle_missing' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one agro_subtitle_missing assertion, found {len(matches)}')
          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = indent + "if (!((await dialog.locator('.pc-public-assistant-identity span').textContent()) || '').includes('агробизнесу')) throw new Error('agro_subtitle_missing');"
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
            mkdir -p "$(dirname "$staging")"
            cp .github/workflows/tai-restricted-qwen-reg-ru-activation.yml "$staging"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$staging"
            git commit -m 'QWEN: stage corrected subtitle assertion blob'
            git push origin HEAD:fix/qwen-live-ui-acceptance-v2
          fi
          out="$RUNNER_TEMP/qwen-subtitle-tree-meta"
          rm -rf "$out"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/commit-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree-sha.txt"
      - name: Upload corrected tree metadata
        uses: actions/upload-artifact@v4
        with:
          name: qwen-subtitle-tree-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen-subtitle-tree-meta
          if-no-files-found: error
          retention-days: 7
