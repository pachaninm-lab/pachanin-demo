name: Production P0 Reviewer Password Reset Ancestor Authority

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-password-reset-ancestor-authority.yml'
      - 'scripts/production-p0-reviewer-password-reset-ancestor-authority.sh'
      - 'scripts/check-production-p0-reviewer-password-reset-ancestor-authority.mjs'
      - 'scripts/production-p0-reviewer-password-reset-request.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-password-reset-ancestor-authority.yml'
      - 'scripts/production-p0-reviewer-password-reset-ancestor-authority.sh'
      - 'scripts/check-production-p0-reviewer-password-reset-ancestor-authority.mjs'
      - 'scripts/production-p0-reviewer-password-reset-request.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-password-reset-ancestor-authority
  cancel-in-progress: false

jobs:
  contract:
    name: Validate ancestor-authorized reviewer reset contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-reviewer-reset-request ancestor-authorized-current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-production-p0-reviewer-password-reset-ancestor-authority.mjs
      - run: bash -n scripts/production-p0-reviewer-password-reset-ancestor-authority.sh

  request:
    name: Request one reviewer reset through ancestor-authorized active runtime
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-reviewer-reset-request ancestor-authorized-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute one bounded reviewer reset against ancestor-authorized active runtime
        shell: bash
        run: bash scripts/production-p0-reviewer-password-reset-ancestor-authority.sh
