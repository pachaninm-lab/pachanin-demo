name: Production P0 Password Reset Runtime Provision

on:
  pull_request:
    paths:
      - '.github/workflows/production-p0-password-reset-runtime-provision.yml'
      - 'scripts/production-full-stack-exact-sha.sh'
      - 'scripts/provision-production-p0-password-reset-runtime.sh'
      - 'scripts/check-production-p0-password-reset-runtime-provision.mjs'
      - 'scripts/provision-production-gekta-runtime.sh'
      - 'scripts/check-production-gekta-runtime-provision.mjs'
      - 'docs/platform-v7/autopilot/scopes/production-p0-password-reset-runtime-provision-3785.json'
      - 'docs/platform-v7/autopilot/scopes/production-gekta-runtime-20260813.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-password-reset-runtime-provision
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3072
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  PROD_DIR_SECRET: ${{ secrets.PC_PROD_DIR }}
  PROD_COMPOSE_SECRET: ${{ secrets.PC_PROD_COMPOSE }}
  EVIDENCE_DIR: artifacts/production-p0-password-reset-runtime-provision

jobs:
  authority:
    name: Validate owner authority and password-reset runtime contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3072 &&
       github.event.comment.user.login == github.repository_owner &&
       (github.event.comment.body == '/production provision-password-reset-runtime current-main' ||
        github.event.comment.body == '/production provision-gekta-runtime current-main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate static safety contract
        if: github.event_name == 'pull_request'
        run: |
          set -Eeuo pipefail
          node scripts/check-production-p0-password-reset-runtime-provision.mjs
          node scripts/check-production-gekta-runtime-provision.mjs
          node scripts/check-production-full-stack-release.mjs
      - name: Resolve exact owner authority
        if: github.event_name == 'issue_comment'
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENTER" == "$OWNER" && "$ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]]
          git fetch --no-tags origin main
          target_sha="$(git rev-parse origin/main)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$target_sha" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          node scripts/check-production-p0-password-reset-runtime-provision.mjs
          node scripts/check-production-gekta-runtime-provision.mjs
          node scripts/check-production-full-stack-release.mjs

  provision:
    name: Provision protected auth-mail runtime on REG.RU
    needs: authority
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact current-main checkout
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          node scripts/check-production-p0-password-reset-runtime-provision.mjs
          node scripts/check-production-gekta-runtime-provision.mjs
      - name: Prepare protected transactional mail input
        id: mail
        env:
          RESEND_API_KEY_SECRET: ${{ secrets.PC_PROD_RESEND_API_KEY || secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL_SECRET: ${{ secrets.PC_PROD_RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
          SMTP_HOST_SECRET: ${{ secrets.PC_SMTP_HOST }}
          SMTP_PORT_SECRET: ${{ secrets.PC_SMTP_PORT }}
          SMTP_USER_SECRET: ${{ secrets.PC_SMTP_USER }}
          SMTP_PASS_SECRET: ${{ secrets.PC_SMTP_PASS }}
          MAIL_FROM_SECRET: ${{ secrets.PC_MAIL_FROM }}
        run: |
          set -Eeuo pipefail
          safe_scalar(){ [[ -n "$1" && "$1" != *$'\n'* && "$1" != *$'\r'* ]]; }
          input="$RUNNER_TEMP/pc-password-reset-mail.env"
          channel=EXISTING_RUNTIME
          if safe_scalar "${RESEND_API_KEY_SECRET:-}" && safe_scalar "${RESEND_FROM_EMAIL_SECRET:-}"; then
            channel=RESEND
          elif safe_scalar "${SMTP_HOST_SECRET:-}" && safe_scalar "${SMTP_USER_SECRET:-}" && safe_scalar "${SMTP_PASS_SECRET:-}"; then
            channel=SMTP
          fi
          umask 077
          rm -f -- "$input"
          if [[ "$channel" == RESEND ]]; then
            printf 'RESEND_API_KEY=%s\nRESEND_FROM_EMAIL=%s\n' "$RESEND_API_KEY_SECRET" "$RESEND_FROM_EMAIL_SECRET" > "$input"
          elif [[ "$channel" == SMTP ]]; then
            printf 'PC_SMTP_HOST=%s\nPC_SMTP_USER=%s\nPC_SMTP_PASS=%s\n' "$SMTP_HOST_SECRET" "$SMTP_USER_SECRET" "$SMTP_PASS_SECRET" > "$input"
            if [[ -n "${SMTP_PORT_SECRET:-}" ]]; then
              safe_scalar "$SMTP_PORT_SECRET" || exit 21
              printf 'PC_SMTP_PORT=%s\n' "$SMTP_PORT_SECRET" >> "$input"
            fi
            if [[ -n "${MAIL_FROM_SECRET:-}" ]]; then
              safe_scalar "$MAIL_FROM_SECRET" || exit 22
              printf 'PC_MAIL_FROM=%s\n' "$MAIL_FROM_SECRET" >> "$input"
            fi
          fi
          if [[ -f "$input" ]]; then
            chmod 0600 "$input"
          else
            [[ "$channel" == EXISTING_RUNTIME ]]
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ -n "$host" && "$host" == "${SSH_HOST_SECRET:-}" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            ssh-keygen -lf "$public_key" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; echo ROOT_SSH_AUTH_OK' > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Provision or validate runtime without disclosure
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          remote_script="/tmp/pc-password-reset-runtime-${GITHUB_RUN_ID}.sh"
          remote_mail="/tmp/pc-password-reset-mail-${GITHUB_RUN_ID}.env"
          local_mail="$RUNNER_TEMP/pc-password-reset-mail.env"
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          prod_dir_authority=""
          if [[ -n "${PROD_DIR_SECRET:-}" && -n "${PROD_COMPOSE_SECRET:-}" ]]; then
            prod_dir_authority="$PROD_DIR_SECRET"
          fi
          prod_dir_b64="$(printf '%s' "$prod_dir_authority" | base64 -w0)"
          scp "${scp_common[@]}" scripts/provision-production-p0-password-reset-runtime.sh "$USER@$HOST:$remote_script"
          remote_mail_arg=""
          remote_mail_ready=0
          if [[ -f "$local_mail" ]]; then
            [[ "$(stat -c '%a' "$local_mail")" == 600 ]]
            scp "${scp_common[@]}" "$local_mail" "$USER@$HOST:$remote_mail"
            remote_mail_arg="'$remote_mail'"
            remote_mail_ready=1
          else
            [[ ! -e "$local_mail" && "${{ steps.mail.outputs.channel }}" == EXISTING_RUNTIME ]]
          fi
          ssh "${ssh_common[@]}" "$USER@$HOST" \
            "chmod 0700 '$remote_script' && { [[ '$remote_mail_ready' == 0 ]] || chmod 0600 '$remote_mail'; } && PC_PROD_DIR_B64='$prod_dir_b64' PC_RECONCILE_ACTIVE_RUNTIME=1 '$remote_script' provision $remote_mail_arg" \
            | tee "$EVIDENCE_DIR/provision.log"
          grep -Eq '^PASSWORD_RESET_DELIVERY_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.log"
          grep -Eq '^REGISTRATION_DELIVERY_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.log"
          grep -Fxq PASSWORD_RESET_RUNTIME_VALID=1 "$EVIDENCE_DIR/provision.log"
          grep -Fxq AUTH_MAIL_RUNTIME_VALID=1 "$EVIDENCE_DIR/provision.log"
          grep -Eq '^TRANSACTIONAL_MAIL_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.log"
          grep -Eq '^TRANSACTIONAL_MAIL_CHANNEL=(RESEND|SMTP)$' "$EVIDENCE_DIR/provision.log"
          grep -Eq '^TRANSACTIONAL_MAIL_SOURCE=(EXISTING_FILE|PROTECTED_INPUT)$' "$EVIDENCE_DIR/provision.log"
          grep -Eq '^RUNTIME_AUTHORITY_RECONCILED=[01]$' "$EVIDENCE_DIR/provision.log"
      - name: Provision or validate isolated Gekta runtime without disclosure
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          remote_script="/tmp/pc-gekta-runtime-${GITHUB_RUN_ID}.sh"
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          prod_dir_authority=""
          if [[ -n "${PROD_DIR_SECRET:-}" && -n "${PROD_COMPOSE_SECRET:-}" ]]; then
            prod_dir_authority="$PROD_DIR_SECRET"
          fi
          prod_dir_b64="$(printf '%s' "$prod_dir_authority" | base64 -w0)"
          scp "${scp_common[@]}" scripts/provision-production-gekta-runtime.sh "$USER@$HOST:$remote_script"
          ssh "${ssh_common[@]}" "$USER@$HOST" \
            "chmod 0700 '$remote_script' && PC_PROD_DIR_B64='$prod_dir_b64' PC_RECONCILE_ACTIVE_RUNTIME=1 '$remote_script' provision" \
            | tee "$EVIDENCE_DIR/gekta-provision.log"
          grep -Eq '^GEKTA_API_RUNTIME_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/gekta-provision.log"
          grep -Eq '^GEKTA_WEB_RUNTIME_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/gekta-provision.log"
          grep -Fxq GEKTA_RUNTIME_VALID=1 "$EVIDENCE_DIR/gekta-provision.log"
          grep -Eq '^GEKTA_RUNTIME_AUTHORITY_RECONCILED=[01]$' "$EVIDENCE_DIR/gekta-provision.log"
      - name: Remove bounded remote asset and local credentials
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${HOST:-}" && -n "${USER:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "rm -f '/tmp/pc-password-reset-runtime-${GITHUB_RUN_ID}.sh' '/tmp/pc-password-reset-mail-${GITHUB_RUN_ID}.env' '/tmp/pc-gekta-runtime-${GITHUB_RUN_ID}.sh'" || true
          fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
          rm -f "$RUNNER_TEMP/pc-password-reset-mail.env"
      - name: Upload bounded provision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-password-reset-runtime-provision-${{ github.run_id }}
          path: artifacts/production-p0-password-reset-runtime-provision
          if-no-files-found: ignore
          retention-days: 90

  publish_images:
    name: Publish exact current-main images after provision
    needs: [authority, provision]
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success' &&
      needs.provision.result == 'success'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch and verify exact image publication
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(gh api "repos/$REPO/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run docker-publish.yml --repo "$REPO" --ref main -f services=all
          image_run_id=''
          for attempt in $(seq 1 30); do
            image_run_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/actions/workflows/docker-publish.yml/runs?event=workflow_dispatch&branch=main&per_page=30" \
              --jq ".workflow_runs
                | map(select(.head_sha == \"$TARGET_SHA\" and .created_at >= \"$dispatch_started\"))
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty")"
            [[ "$image_run_id" =~ ^[0-9]+$ ]] && break
            sleep 2
          done
          [[ "$image_run_id" =~ ^[0-9]+$ ]]
          gh run watch "$image_run_id" --repo "$REPO" --exit-status --interval 10
          [[ "$(gh run view "$image_run_id" --repo "$REPO" --json conclusion --jq '.conclusion // empty')" == success ]]
          [[ "$(gh api "repos/$REPO/commits/main" --jq .sha)" == "$TARGET_SHA" ]]

  release:
    name: Activate protected runtime through exact release
    needs: [authority, provision, publish_images]
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success' &&
      needs.provision.result == 'success' &&
      needs.publish_images.result == 'success'
    permissions:
      contents: read
      packages: read
      issues: write
    uses: ./.github/workflows/production-full-stack-exact-sha.yml
    with:
      owner_release_authorized: true
    secrets: inherit

  post_release_readiness:
    name: Verify registration and password-reset runtime without disclosure
    needs: [authority, release]
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success' &&
      needs.release.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ -n "$host" && "$host" == "${SSH_HOST_SECRET:-}" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Inspect active API and Web readiness without values
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$EVIDENCE_DIR"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE' | tee "$EVIDENCE_DIR/post-release-readiness.log"
          set -Eeuo pipefail
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 ))
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          [[ -n "$project" ]]
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} == 1 ))
          api_id="${api_ids[0]}"
          web_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")"
          api_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")"
          [[ "$web_revision" == "$TARGET_SHA" && "$api_revision" == "$TARGET_SHA" ]]
          read -r -d '' classifier <<'PY' || true
          import hmac
          import json
          import re
          import sys

          documents = json.load(sys.stdin)
          if not isinstance(documents, list) or len(documents) != 2:
              raise SystemExit(1)
          def environment(document):
              values = {}
              for item in document.get('Config', {}).get('Env', []) or []:
                  name, separator, value = str(item).partition('=')
                  if separator:
                      values[name] = value
              return values
          web = environment(documents[0])
          api = environment(documents[1])
          web_reset_key = web.get('PASSWORD_RESET_DELIVERY_KEY', '').strip()
          api_reset_key = api.get('PASSWORD_RESET_DELIVERY_KEY', '').strip()
          web_registration_key = web.get('REGISTRATION_DELIVERY_KEY', '').strip()
          api_registration_key = api.get('REGISTRATION_DELIVERY_KEY', '').strip()
          api_url_ready = bool(web.get('API_URL', '').strip())
          key_pattern = re.compile(r'^[A-Fa-f0-9]{96}$')
          web_reset_ready = bool(key_pattern.fullmatch(web_reset_key))
          api_reset_ready = bool(key_pattern.fullmatch(api_reset_key))
          reset_match = web_reset_ready and api_reset_ready and hmac.compare_digest(web_reset_key, api_reset_key)
          web_registration_ready = bool(key_pattern.fullmatch(web_registration_key))
          api_registration_ready = bool(key_pattern.fullmatch(api_registration_key))
          registration_match = (
              web_registration_ready
              and api_registration_ready
              and hmac.compare_digest(web_registration_key, api_registration_key)
          )
          purpose_keys_distinct = (
              reset_match
              and registration_match
              and not hmac.compare_digest(web_reset_key, web_registration_key)
          )
          resend_ready = bool(web.get('RESEND_API_KEY', '').strip()) and bool(
              web.get('RESEND_FROM_EMAIL', '').strip() or web.get('PC_MAIL_FROM', '').strip()
          )
          smtp_ready = all(bool(web.get(name, '').strip()) for name in ('PC_SMTP_HOST', 'PC_SMTP_USER', 'PC_SMTP_PASS'))
          mail_ready = resend_ready or smtp_ready
          print('POST_RELEASE_AUTH_MAIL_READY|' + '|'.join(
              '1' if value else '0'
              for value in (
                  api_url_ready,
                  web_reset_ready,
                  api_reset_ready,
                  reset_match,
                  web_registration_ready,
                  api_registration_ready,
                  registration_match,
                  purpose_keys_distinct,
                  mail_ready,
              )
          ))
          PY
          marker="$(docker inspect "$web_id" "$api_id" | python3 -c "$classifier")"
          [[ "$marker" == 'POST_RELEASE_AUTH_MAIL_READY|1|1|1|1|1|1|1|1|1' ]]
          printf '%s\n' "$marker"
          read -r -d '' gekta_classifier <<'PY' || true
          import hmac
          import json
          import re
          import sys

          documents = json.load(sys.stdin)
          if not isinstance(documents, list) or len(documents) != 2:
              raise SystemExit(1)
          def environment(document):
              values = {}
              for item in document.get('Config', {}).get('Env', []) or []:
                  name, separator, value = str(item).partition('=')
                  if separator:
                      values[name] = value
              return values
          web = environment(documents[0])
          api = environment(documents[1])
          hex96 = re.compile(r'^[A-Fa-f0-9]{96}$')
          mfa = web.get('MFA_LOGIN_TICKET_SECRET', '').strip()
          anonymous = web.get('GEKTA_ANONYMOUS_SESSION_SECRET', '').strip()
          phone_key = api.get('GEKTA_PHONE_ENCRYPTION_KEY', '').strip()
          phone_pepper = api.get('GEKTA_PHONE_LOOKUP_PEPPER', '').strip()
          mfa_ready = bool(hex96.fullmatch(mfa))
          anonymous_ready = bool(hex96.fullmatch(anonymous))
          phone_key_ready = bool(re.fullmatch(r'^[A-Fa-f0-9]{64}$', phone_key))
          phone_pepper_ready = bool(hex96.fullmatch(phone_pepper))
          purpose_keys_distinct = (
              mfa_ready
              and anonymous_ready
              and phone_pepper_ready
              and not hmac.compare_digest(mfa, anonymous)
              and not hmac.compare_digest(mfa, phone_pepper)
              and not hmac.compare_digest(anonymous, phone_pepper)
          )
          api_isolated = not any(api.get(name, '').strip() for name in (
              'MFA_LOGIN_TICKET_SECRET', 'GEKTA_ANONYMOUS_SESSION_SECRET'
          ))
          web_isolated = not any(web.get(name, '').strip() for name in (
              'GEKTA_PHONE_ENCRYPTION_KEY', 'GEKTA_PHONE_LOOKUP_PEPPER'
          ))
          print('POST_RELEASE_GEKTA_RUNTIME_READY|' + '|'.join(
              '1' if value else '0'
              for value in (
                  mfa_ready,
                  anonymous_ready,
                  purpose_keys_distinct,
                  phone_key_ready,
                  phone_pepper_ready,
                  api_isolated,
                  web_isolated,
              )
          ))
          PY
          gekta_marker="$(docker inspect "$web_id" "$api_id" | python3 -c "$gekta_classifier")"
          [[ "$gekta_marker" == 'POST_RELEASE_GEKTA_RUNTIME_READY|1|1|1|1|1|1|1' ]]
          printf '%s\n' "$gekta_marker"
          printf 'POST_RELEASE_DEPLOYED_REVISION=%s\n' "$web_revision"
          REMOTE
          grep -Fxq 'POST_RELEASE_AUTH_MAIL_READY|1|1|1|1|1|1|1|1|1' "$EVIDENCE_DIR/post-release-readiness.log"
          grep -Fxq 'POST_RELEASE_GEKTA_RUNTIME_READY|1|1|1|1|1|1|1' "$EVIDENCE_DIR/post-release-readiness.log"
          grep -Fxq "POST_RELEASE_DEPLOYED_REVISION=$TARGET_SHA" "$EVIDENCE_DIR/post-release-readiness.log"
      - name: Remove local SSH credential
        if: always()
        run: rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
      - name: Upload bounded post-release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-password-reset-post-release-${{ github.run_id }}
          path: artifacts/production-p0-password-reset-runtime-provision/post-release-readiness.log
          if-no-files-found: ignore
          retention-days: 90
