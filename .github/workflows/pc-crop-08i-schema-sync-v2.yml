name: One-shot PC-CROP-08I Prisma schema sync v2

on:
  pull_request:
    paths:
      - '.github/workflows/pc-crop-08i-schema-sync-v2.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PC-CROP-08I branch
        uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-08i-fgis-outbound-ack
          fetch-depth: 0

      - name: Guard immutable sync base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5cb59559616b44163c8cd1b13d9e3d4e918dbc4d"

      - uses: pnpm/action-setup@v4
        with:
          version: '10.2.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize and validate Prisma authority
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/pc-crop-08i-schema
          node scripts/pc-crop-08i/sync-prisma-schema.mjs \
            2>&1 | tee artifacts/pc-crop-08i-schema/sync.log
          sync_status=${PIPESTATUS[0]}
          if [[ "$sync_status" != "0" ]]; then exit "$sync_status"; fi
          pnpm --filter @pc/api exec prisma format \
            2>&1 | tee artifacts/pc-crop-08i-schema/format.log
          format_status=${PIPESTATUS[0]}
          if [[ "$format_status" != "0" ]]; then exit "$format_status"; fi
          pnpm --filter @pc/api exec prisma validate \
            2>&1 | tee artifacts/pc-crop-08i-schema/validate.log
          validate_status=${PIPESTATUS[0]}
          if [[ "$validate_status" != "0" ]]; then exit "$validate_status"; fi
          grep -q '^model FgisGrainAcknowledgement {' apps/api/prisma/schema.prisma
          grep -q 'map: "fgis_grain_ack_exchange_fk"' apps/api/prisma/schema.prisma
          git diff --check
          cp apps/api/prisma/schema.prisma artifacts/pc-crop-08i-schema/schema.prisma

      - name: Upload schema diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-crop-08i-schema-${{ github.run_id }}
          path: artifacts/pc-crop-08i-schema
          if-no-files-found: warn
          retention-days: 7

      - name: Commit exact schema authority to PC-CROP-08I
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- apps/api/prisma/schema.prisma)"
          git config user.name 'pc-crop-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/api/prisma/schema.prisma
          git commit -m 'PC-CROP-08I: synchronize Prisma ACK authority'
          git push origin HEAD:agent/pc-crop-08i-fgis-outbound-ack
