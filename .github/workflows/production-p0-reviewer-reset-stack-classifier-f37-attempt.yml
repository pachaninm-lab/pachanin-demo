name: Production P0 Reviewer Reset F37 Read-Only Stack Classifier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-stack-classifier-f37-attempt.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-reset-stack-classifier-f37-attempt
  cancel-in-progress: false

env:
  COMMAND: /production p0-reviewer-reset-stack-classify f37-attempt
  RESET_EVIDENCE_ID: '5325471181'
  RESET_REVISION: f37cbb81ae485b48bd6e7a6e2c7b96e2b4c8bf1c
  ATTEMPT_SINCE: '2026-08-18T07:55:00Z'
  ATTEMPT_UNTIL: '2026-08-18T08:05:00Z'
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TRUSTED_CONNECTOR_APP_ID: '1144995'

jobs:
  contract:
    name: Validate bounded read-only current reset classifier
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-reviewer-reset-stack-classify f37-attempt'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bounded source surface
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-p0-reviewer-reset-stack-classifier-f37-attempt.yml')
          t=p.read_text(encoding='utf-8')
          required=[
            'docker logs --since',
            'PRODUCTION_MUTATION=NONE',
            'StrictHostKeyChecking=yes',
            'Password reset challenge/outbox transaction failed',
            '/production p0-reviewer-reset-stack-classify f37-attempt',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('missing invariant: '+' | '.join(missing))
          classify=t.split('\n  classify:\n',1)[1]
          forbidden=[
            'docker restart','docker rm','docker stop','docker kill','docker compose','docker service',
            'curl --request POST','-X POST','INSERT INTO','UPDATE auth.','DELETE FROM','TRUNCATE ',
            'ALTER ROLE','CREATE ROLE','DROP ROLE','sendmail(','MAIL FROM','RCPT TO','forgot-password',
          ]
          bad=[x for x in forbidden if x in classify]
          if bad: raise SystemExit('mutation surface: '+' | '.join(bad))
          PY

      - name: Verify exact owner-issued provenance
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$COMMAND" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          git cat-file -e "${RESET_REVISION}^{commit}"
          git merge-base --is-ancestor "$RESET_REVISION" "$target"
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  classify:
    name: Read-only classify consumed reviewer reset transaction
    needs: contract
    if: github.event_name == 'issue_comment' && needs.contract.result == 'success' && needs.contract.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve protected SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]

          key="$RUNNER_TEMP/p0-reset-f37-key"
          known="$RUNNER_TEMP/p0-reset-f37-known-hosts"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${PC_PROD_HOST:-$DEFAULT_HOST}")"
          user="$(trim "${PC_PROD_SSH_USER:-}")"
          port="$(trim "${PC_PROD_SSH_PORT:-22}")"
          expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]

          validate_key(){
            local src="$1" pub
            tr -d '\r' < "$src" > "$key"; chmod 0600 "$key"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$key" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_key(){
            local value="$1" a b c
            [[ -n "$value" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$value" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${value//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$value" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_key "${PC_PROD_SSH_KEY:-}" || try_key "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_key "${VPS_SSH_KEY:-}"

          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          scan="$(mktemp)"; match="$(mktemp)"; pinned=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            [[ "$(grep -c . "$match" || true)" == 1 ]] && { pinned=1; break; }
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned" == 1 ]]
          mv "$match" "$known"; rm -f "$scan"; chmod 0600 "$known"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Classify exact reset transaction from API logs
        id: diag
        shell: bash
        env:
          KEY: ${{ steps.ssh.outputs.key }}
          KNOWN: ${{ steps.ssh.outputs.known }}
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          safe="$RUNNER_TEMP/p0-reset-f37-safe.txt"
          ssh -i "$KEY" -p "$PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN" -o ConnectTimeout=15 \
            "$USER@$HOST" "bash -s -- '$RESET_REVISION' '$ATTEMPT_SINCE' '$ATTEMPT_UNTIL'" > "$safe" <<'REMOTE'
          set -Eeuo pipefail
          revision="$1"; since="$2"; until="$3"
          emit(){ printf '%s\n' "$1"; }
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$since" == '2026-08-18T07:55:00Z' && "$until" == '2026-08-18T08:05:00Z' ]]
          [[ "$(id -u)" -eq 0 ]]
          command -v docker >/dev/null 2>&1

          mapfile -t api_ids < <(docker ps -aq --filter 'label=com.docker.compose.service=api' | sort -u)
          (( ${#api_ids[@]} >= 1 ))
          matching=()
          for id in "${api_ids[@]}"; do
            r="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$id" 2>/dev/null || true)"
            [[ "$r" != "$revision" ]] || matching+=("$id")
          done
          (( ${#matching[@]} >= 1 && ${#matching[@]} <= 4 ))

          all=''
          for id in "${matching[@]}"; do
            chunk="$(docker logs --since "$since" --until "$until" "$id" 2>&1 || true)"
            all+="${all:+$'\n'}$chunk"
          done
          marker='Password reset challenge/outbox transaction failed'
          marker_count="$(grep -Fc "$marker" <<< "$all" || true)"
          if [[ "$marker_count" == 0 ]]; then
            emit "STACK_CLASS|NOT_OBSERVED|UNKNOWN|NONE|NO_FAILURE_MARKER|0|${#matching[@]}"
            emit 'PRODUCTION_MUTATION=NONE'
            exit 0
          fi
          (( marker_count <= 4 ))
          line="$(grep -Fn "$marker" <<< "$all" | head -n1 | cut -d: -f1)"
          [[ "$line" =~ ^[0-9]+$ && "$line" -ge 1 ]]
          end=$((line + 32))
          block="$(sed -n "${line},${end}p" <<< "$all")"

          error_type='UNKNOWN'
          grep -Fq 'PrismaClientKnownRequestError' <<< "$block" && error_type='PRISMA_KNOWN'
          grep -Fq 'PrismaClientUnknownRequestError' <<< "$block" && error_type='PRISMA_UNKNOWN'
          grep -Fq 'PrismaClientValidationError' <<< "$block" && error_type='PRISMA_VALIDATION'
          grep -Fq 'PrismaClientInitializationError' <<< "$block" && error_type='PRISMA_INITIALIZATION'

          source_stage='UNKNOWN'
          if grep -Eqi 'auth-mail-outbox\.service|AuthMailOutboxService|enqueue_mail_outbox' <<< "$block"; then source_stage='AUTH_MAIL_ENQUEUE'
          elif grep -Eqi 'auth-mail-crypto|encryptAuthMailEnvelope|authMailReplayDigest' <<< "$block"; then source_stage='AUTH_MAIL_CRYPTO'
          elif grep -Eqi 'auth-mail-templates|passwordResetMail|publicSiteOrigin' <<< "$block"; then source_stage='AUTH_MAIL_TEMPLATE'
          elif grep -Eqi 'password-reset\.repository|PasswordResetRepository|password_reset_challenges' <<< "$block"; then source_stage='PASSWORD_RESET_REPOSITORY'
          elif grep -Eqi 'persistent-auth\.repository|PersistentAuthRepository' <<< "$block"; then source_stage='PERSISTENT_AUTH_REPOSITORY'
          elif grep -Eqi 'password-reset\.service|PasswordResetService' <<< "$block"; then source_stage='PASSWORD_RESET_SERVICE'
          fi

          code_class='NONE'
          for pair in \
            'P2034:PRISMA_P2034' 'P2002:PRISMA_P2002' 'P2010:PRISMA_P2010' 'P2028:PRISMA_P2028' 'P1010:PRISMA_P1010' 'P1001:PRISMA_P1001' \
            '42501:SQLSTATE_42501' '23505:SQLSTATE_23505' '40001:SQLSTATE_40001' '25006:SQLSTATE_25006' '42P01:SQLSTATE_42P01' '42883:SQLSTATE_42883' '22023:SQLSTATE_22023' '22P02:SQLSTATE_22P02'; do
            needle="${pair%%:*}"; label="${pair#*:}"
            if grep -Fq "$needle" <<< "$block"; then code_class="$label"; break; fi
          done

          reason_class='OTHER'
          if grep -Eqi 'permission denied|insufficient privilege' <<< "$block"; then reason_class='PERMISSION_DENIED'
          elif grep -Eqi 'row-level security|row level security|violates row level security' <<< "$block"; then reason_class='ROW_LEVEL_SECURITY'
          elif grep -Eqi 'read-only transaction|read only transaction|cannot execute .* in a read-only' <<< "$block"; then reason_class='READ_ONLY_TRANSACTION'
          elif grep -Eqi 'function .*enqueue_mail_outbox.* does not exist|undefined function' <<< "$block"; then reason_class='ENQUEUE_FUNCTION_MISSING'
          elif grep -Eqi 'relation .*mail_outbox.* does not exist|undefined table' <<< "$block"; then reason_class='MAIL_OUTBOX_RELATION_MISSING'
          elif grep -Eqi 'duplicate key|unique constraint|unique violation' <<< "$block"; then reason_class='UNIQUE_VIOLATION'
          elif grep -Eqi 'could not serialize|serialization failure|write conflict|deadlock' <<< "$block"; then reason_class='SERIALIZATION_OR_DEADLOCK'
          elif grep -Eqi 'timeout|timed out' <<< "$block"; then reason_class='TIMEOUT'
          elif grep -Eqi 'ECONN|connection refused|connection terminated|server closed the connection' <<< "$block"; then reason_class='DB_CONNECTION'
          elif grep -Eqi 'ENOENT|no such file or directory' <<< "$block"; then reason_class='RUNTIME_FILE_MISSING'
          elif grep -Eqi 'Auth-mail key|AUTH_MAIL_OUTBOX|key version|keyring' <<< "$block"; then reason_class='AUTH_MAIL_KEY_RUNTIME'
          elif grep -Eqi 'idempotency key reused|idempotency row disappeared|invalid result' <<< "$block"; then reason_class='AUTH_MAIL_IDEMPOTENCY'
          elif grep -Eqi 'expiry must be in the future|availability is invalid|maxAttempts|correlation id is invalid|recipient is invalid|subject is invalid|text is invalid' <<< "$block"; then reason_class='AUTH_MAIL_VALIDATION'
          elif grep -Eqi 'operator does not exist|invalid input syntax|cannot cast' <<< "$block"; then reason_class='SQL_TYPE_MISMATCH'
          fi

          emit "STACK_CLASS|$error_type|$source_stage|$code_class|$reason_class|$marker_count|${#matching[@]}"
          emit 'PRODUCTION_MUTATION=NONE'
          REMOTE

          marker="$(grep '^STACK_CLASS|' "$safe" | tail -n1 || true)"
          mutation="$(grep '^PRODUCTION_MUTATION=' "$safe" | tail -n1 || true)"
          rm -f "$safe"
          [[ "$marker" =~ ^STACK_CLASS\|[A-Z0-9_]+\|[A-Z0-9_]+\|[A-Z0-9_]+\|[A-Z0-9_]+\|[0-9]+\|[0-9]+$ ]]
          [[ "$mutation" == 'PRODUCTION_MUTATION=NONE' ]]
          IFS='|' read -r _ error_type source_stage code_class reason_class marker_count container_count <<< "$marker"
          for name in error_type source_stage code_class reason_class marker_count container_count; do echo "$name=${!name}" >> "$GITHUB_OUTPUT"; done

      - name: Publish sanitized classification
        shell: bash
        env:
          ERROR_TYPE: ${{ steps.diag.outputs.error_type }}
          SOURCE_STAGE: ${{ steps.diag.outputs.source_stage }}
          CODE_CLASS: ${{ steps.diag.outputs.code_class }}
          REASON_CLASS: ${{ steps.diag.outputs.reason_class }}
          MARKER_COUNT: ${{ steps.diag.outputs.marker_count }}
          CONTAINER_COUNT: ${{ steps.diag.outputs.container_count }}
        run: |
          set -Eeuo pipefail
          body="$(mktemp)"
          {
            echo '## Production P0 reviewer reset consumed-attempt stack classifier'; echo
            echo "- reset evidence id: \`$RESET_EVIDENCE_ID\`"
            echo "- diagnostic main: \`$TARGET_SHA\`"
            echo "- reset runtime revision: \`$RESET_REVISION\`"
            echo "- bounded attempt window: \`$ATTEMPT_SINCE .. $ATTEMPT_UNTIL\`"
            echo "- error type: \`${ERROR_TYPE:-UNKNOWN}\`"
            echo "- source stage: \`${SOURCE_STAGE:-UNKNOWN}\`"
            echo "- code class: \`${CODE_CLASS:-NONE}\`"
            echo "- reason class: \`${REASON_CLASS:-OTHER}\`"
            echo "- matching failure markers / exact-revision API containers: \`${MARKER_COUNT:-0}/${CONTAINER_COUNT:-0}\`"
            echo '- raw logs / PII / credentials / reset material: `NOT_PUBLISHED`'
            echo '- reset replay / mail send: `NONE`'
            echo '- production mutation: `NONE`'
          } > "$body"
          gh issue comment 3072 --repo "$GITHUB_REPOSITORY" --body-file "$body"
          rm -f "$body"

      - name: Enforce useful read-only classification
        shell: bash
        env:
          ERROR_TYPE: ${{ steps.diag.outputs.error_type }}
          REASON_CLASS: ${{ steps.diag.outputs.reason_class }}
          MARKER_COUNT: ${{ steps.diag.outputs.marker_count }}
        run: |
          set -Eeuo pipefail
          [[ "$MARKER_COUNT" =~ ^[1-9][0-9]*$ ]]
          [[ "$ERROR_TYPE" != NOT_OBSERVED ]]
          [[ "$REASON_CLASS" != NO_FAILURE_MARKER ]]
