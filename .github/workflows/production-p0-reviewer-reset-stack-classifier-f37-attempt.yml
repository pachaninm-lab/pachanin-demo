name: Production P0 Reviewer Reset F37 Read-Only Stack Classifier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-stack-classifier-f37-attempt.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-reset-stack-classifier-f37-attempt
  cancel-in-progress: false

env:
  COMMAND: /production p0-reviewer-reset-stack-classify f37-attempt
  SOURCE_SCRIPT: scripts/production-p0-reviewer-reset-stack-classifier-31974946435.sh
  SOURCE_BLOB_SHA: 90a92461b14bbddcab4e1f7502770de78429e7ef
  RESET_EVIDENCE_ID: '5325471181'
  RESET_REVISION: f37cbb81ae485b48bd6e7a6e2c7b96e2b4c8bf1c
  ATTEMPT_SINCE: '2026-08-18T07:55:00Z'
  ATTEMPT_UNTIL: '2026-08-18T08:05:00Z'
  TRUSTED_CONNECTOR_APP_ID: '1144995'

jobs:
  contract:
    name: Validate bounded read-only current reset classifier
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-reviewer-reset-stack-classify f37-attempt'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable source and exact bounded patch
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object "$SOURCE_SCRIPT")" == "$SOURCE_BLOB_SHA" ]]
          temp="$RUNNER_TEMP/p0-reset-stack-classifier-f37.sh"
          cp -- "$SOURCE_SCRIPT" "$temp"
          python3 - "$temp" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("COMMAND='/production p0-reviewer-reset-stack-classify 31974946435 current-main'", "COMMAND='/production p0-reviewer-reset-stack-classify f37-attempt'"),
              ("RESET_RUN_ID='31974946435'", "RESET_RUN_ID='5325471181'"),
              ("RESET_REVISION='440e40753e2cac13c93f8e007d9fe17c2b66caba'", "RESET_REVISION='f37cbb81ae485b48bd6e7a6e2c7b96e2b4c8bf1c'"),
              ("ATTEMPT_SINCE='2026-08-16T21:57:20Z'", "ATTEMPT_SINCE='2026-08-18T07:55:00Z'"),
              ("ATTEMPT_UNTIL='2026-08-16T21:59:06Z'", "ATTEMPT_UNTIL='2026-08-18T08:05:00Z'"),
              ("[[ \"$since\" == '2026-08-16T21:57:20Z' && \"$until\" == '2026-08-16T21:59:06Z' ]]", "[[ \"$since\" == '2026-08-18T07:55:00Z' && \"$until\" == '2026-08-18T08:05:00Z' ]]")
          ]
          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_CARDINALITY_FAILED:R{index}:{count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          bash -n "$temp"
          grep -Fqx "COMMAND='/production p0-reviewer-reset-stack-classify f37-attempt'" "$temp"
          grep -Fqx "RESET_RUN_ID='5325471181'" "$temp"
          grep -Fqx "RESET_REVISION='f37cbb81ae485b48bd6e7a6e2c7b96e2b4c8bf1c'" "$temp"
          grep -Fqx "ATTEMPT_SINCE='2026-08-18T07:55:00Z'" "$temp"
          grep -Fqx "ATTEMPT_UNTIL='2026-08-18T08:05:00Z'" "$temp"
          grep -Fq 'PRODUCTION_MUTATION=NONE' "$temp"
          python3 - "$temp" <<'PY'
          from pathlib import Path
          import sys
          t=Path(sys.argv[1]).read_text(encoding='utf-8')
          forbidden=['docker restart','docker rm','docker compose','docker service','curl --request POST','-X POST','INSERT INTO','UPDATE auth.','DELETE FROM','TRUNCATE ','ALTER ROLE','sendmail(','MAIL FROM','RCPT TO']
          bad=[x for x in forbidden if x in t]
          if bad: raise SystemExit('MUTATION_SURFACE_FORBIDDEN:'+'|'.join(bad))
          PY
          rm -f -- "$temp"

      - name: Verify exact owner-issued provenance
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$COMMAND" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

  classify:
    name: Read-only classify consumed reviewer reset transaction
    needs: contract
    if: github.event_name == 'issue_comment' && needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_REVIEWER_RESET_STACK_COMMAND: ${{ github.event.comment.body }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Execute bounded sanitized stack classifier
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object "$SOURCE_SCRIPT")" == "$SOURCE_BLOB_SHA" ]]
          temp="$RUNNER_TEMP/p0-reset-stack-classifier-f37.sh"
          cp -- "$SOURCE_SCRIPT" "$temp"
          chmod 0700 "$temp"
          python3 - "$temp" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("COMMAND='/production p0-reviewer-reset-stack-classify 31974946435 current-main'", "COMMAND='/production p0-reviewer-reset-stack-classify f37-attempt'"),
              ("RESET_RUN_ID='31974946435'", "RESET_RUN_ID='5325471181'"),
              ("RESET_REVISION='440e40753e2cac13c93f8e007d9fe17c2b66caba'", "RESET_REVISION='f37cbb81ae485b48bd6e7a6e2c7b96e2b4c8bf1c'"),
              ("ATTEMPT_SINCE='2026-08-16T21:57:20Z'", "ATTEMPT_SINCE='2026-08-18T07:55:00Z'"),
              ("ATTEMPT_UNTIL='2026-08-16T21:59:06Z'", "ATTEMPT_UNTIL='2026-08-18T08:05:00Z'"),
              ("[[ \"$since\" == '2026-08-16T21:57:20Z' && \"$until\" == '2026-08-16T21:59:06Z' ]]", "[[ \"$since\" == '2026-08-18T07:55:00Z' && \"$until\" == '2026-08-18T08:05:00Z' ]]")
          ]
          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_CARDINALITY_FAILED:R{index}:{count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          bash -n "$temp"
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$(git rev-parse HEAD)" ]]
          bash "$temp"
          rm -f -- "$temp"
