name: Apply production owner controller authority

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-production-owner-controller-authority.py"
      - ".github/workflows/apply-production-owner-controller-authority.yml"
      - "docs/platform-v7/autopilot/scopes/production-owner-controller-authority-20260802.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-owner-controller-authority-source
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout materializer authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Capture helper and exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 scripts/apply-production-owner-controller-authority.py \
            "$RUNNER_TEMP/apply-production-owner-controller-authority.py"
          git fetch --no-tags origin main
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git reset --hard origin/main
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Apply and verify bounded authority repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$RUNNER_TEMP/apply-production-owner-controller-authority.py"
          node scripts/check-production-full-stack-release.mjs
          git diff --check
          grep -Fq 'Authorize exact owner-controlled dispatch' .github/workflows/production-full-stack-exact-sha.yml
          grep -Fq 'authorization_run_id="$GITHUB_RUN_ID"' .github/workflows/platform-v7-safe-merge.yml
          grep -Fq 'authorization_comment_id="$COMMENT_ID"' .github/workflows/platform-v7-safe-merge.yml
          grep -Fq 'PRODUCTION_OWNER_AUTHORITY_EXACT_MAIN_MISMATCH' .github/workflows/production-full-stack-exact-sha.yml

      - name: Publish clean source-only branch
        shell: bash
        env:
          CLEAN_BRANCH: fix/production-owner-controller-authority-source-20260802
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git add \
            .github/workflows/platform-v7-safe-merge.yml \
            .github/workflows/production-full-stack-exact-sha.yml \
            scripts/check-production-full-stack-release.mjs
          files=$(git diff --cached --name-only | sort)
          test "$files" = $'.github/workflows/platform-v7-safe-merge.yml\n.github/workflows/production-full-stack-exact-sha.yml\nscripts/check-production-full-stack-release.mjs'
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(release): attest owner controller dispatch authority'
          git push --force origin HEAD:"refs/heads/$CLEAN_BRANCH"
