name: TAI AP-14F1C Rosstat Dataset Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f1c.yml'
      - 'apps/tai/knowledge-sources/AP-14F1C-ROSSTAT-7708234640-VSHP2016254.v1.json'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1c-3360.json'
      - 'scripts/tai-ap-14f1c/discover.mjs'
  push:
    branches:
      - main
      - agent/tai-ap-14f1c-rosstat-dataset-3360
    paths:
      - '.github/workflows/tai-ap-14f1c.yml'
      - 'apps/tai/knowledge-sources/AP-14F1C-ROSSTAT-7708234640-VSHP2016254.v1.json'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1c-3360.json'
      - 'scripts/tai-ap-14f1c/discover.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: tai-ap-14f1c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  MANIFEST: apps/tai/knowledge-sources/AP-14F1C-ROSSTAT-7708234640-VSHP2016254.v1.json
  EVIDENCE_DIR: artifacts/tai-ap-14f1c

jobs:
  exact-resource-evidence:
    name: Exact URLs · pinned DNS · immutable digests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - name: Resolve governed comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            base_ref="HEAD^"
          else
            base_ref="1136c38f67e0a4a41cef1903dadf334a22b7f4a6"
          fi
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify source-controlled scope
        if: github.ref_name != 'main'
        shell: bash
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: |
          set -euo pipefail
          export GITHUB_HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          bash scripts/p7-autopilot-guard.sh

      - name: Static and adversarial discovery acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/tai-ap-14f1c/discover.mjs
          node scripts/tai-ap-14f1c/discover.mjs --self-test

      - name: Capture Rosstat TLS identity and served chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          timeout 20 openssl s_client \
            -connect rosstat.gov.ru:443 \
            -servername rosstat.gov.ru \
            -showcerts \
            -verify_return_error \
            </dev/null > "$EVIDENCE_DIR/rosstat-tls-chain.txt" 2>&1 || true
          awk '
            /-----BEGIN CERTIFICATE-----/ {capture=1}
            capture {print}
            /-----END CERTIFICATE-----/ {exit}
          ' "$EVIDENCE_DIR/rosstat-tls-chain.txt" > /tmp/rosstat-leaf.pem
          test -s /tmp/rosstat-leaf.pem
          openssl x509 -in /tmp/rosstat-leaf.pem -noout \
            -subject -issuer -serial -dates -fingerprint -sha256 \
            | tee "$EVIDENCE_DIR/rosstat-tls-leaf.txt"

      - name: Controlled exact-resource acquisition
        id: acquisition
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node scripts/tai-ap-14f1c/discover.mjs \
            --manifest "$MANIFEST" \
            --output "$EVIDENCE_DIR/rosstat-resource-evidence.json" \
            | tee "$EVIDENCE_DIR/acquisition.log"

      - name: Upload immutable discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-ap-14f1c-rosstat-evidence-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce pinned evidence before admission
        shell: bash
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
        run: |
          set -euo pipefail
          if [[ "$ACQUISITION_OUTCOME" != "success" ]]; then
            echo "Exact Rosstat bytes were observed and evidence uploaded, but all SHA-256 values are not pinned yet or acquisition failed." >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('artifacts/tai-ap-14f1c/rosstat-resource-evidence.json', 'utf8'));
          if (evidence.exactHead !== process.env.EXACT_HEAD) throw new Error('exact-head evidence mismatch');
          if (!evidence.allDigestsPinned) throw new Error('resource digests are not pinned');
          if (evidence.rawBytesPersisted !== false || evidence.sharedRagAllowed !== false) {
            throw new Error('evidence boundary mismatch');
          }
          if (evidence.resources.length !== 4 || evidence.resources.some((item) => !item.digestMatched)) {
            throw new Error('resource evidence is incomplete');
          }
          console.log('TAI AP-14F1C exact resource evidence = success');
          NODE

  exact-main-status:
    name: Observable exact-main status
    if: github.ref_name == 'main'
    needs: exact-resource-evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Publish exact-main acceptance status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXACT_HEAD,
              state: 'success',
              context: 'TAI AP-14F1C exact-main',
              description: 'Exact Rosstat dataset evidence accepted',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
