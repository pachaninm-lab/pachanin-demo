name: TAI AP-14F1C One-Shot Ruff Fix

on:
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f1c.yml'
  push:
    branches:
      - agent/tai-ap-14f1c-rosstat-dataset-3360
    paths:
      - '.github/workflows/tai-ap-14f1c.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tai-ap-14f1c-source-fix
  cancel-in-progress: true

jobs:
  fix-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/tai-ap-14f1c-rosstat-dataset-3360
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded Ruff fixes and restore acceptance workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff>=0.11,<1'
          ruff check --fix \
            apps/tai/tai/rosstat_vshp2016254.py \
            apps/tai/tests/test_rosstat_vshp2016254.py
          git checkout HEAD^ -- .github/workflows/tai-ap-14f1c.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/tai-ap-14f1c.yml \
            apps/tai/tai/rosstat_vshp2016254.py \
            apps/tai/tests/test_rosstat_vshp2016254.py
          if git diff --cached --quiet; then
            echo 'No source fixes were needed.'
            exit 0
          fi
          git commit -m 'AP-14F1C: apply deterministic Ruff fixes'
          git push origin HEAD:agent/tai-ap-14f1c-rosstat-dataset-3360
