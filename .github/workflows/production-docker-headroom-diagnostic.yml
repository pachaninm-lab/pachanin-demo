          from pathlib import Path
          import signal
          import selectors
          import subprocess
          import sys
          import tempfile
          import textwrap
          import time
          from types import SimpleNamespace
          import unittest
          from unittest.mock import patch
          
          spec = importlib.util.spec_from_file_location('geometry', sys.argv[1])
          g = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(g)
          sys.argv = sys.argv[:1]
          TARGET = 'a' * 40
          SOURCE = 'b' * 64
          MOUNTS = (b'1 0 8:1 / / rw,relatime - ext4 /dev/PRIVATE rw\n'
                    b'2 1 0:1 / /proc rw - proc proc rw\n'
                    b'3 1 0:2 / /sys ro - sysfs sysfs ro\n')
          
          
          class Fake:
              def __init__(self):
                  self.raw = MOUNTS
                  self.fs_pair = (8, 1)
                  self.table = {
                      (8, 1): {'kind': 'partition', 'size': 100, 'start': 8, 'parent': (8, 0), 'part': 1, 'slaves': []},
                      (8, 0): {'kind': 'disk', 'size': 200, 'slaves': []}}
          
              def check(self):
                  pass
          
              def filesystem(self):
                  return self.fs_pair, {'total_bytes': 40000, 'free_bytes': 2000,
                                        'available_bytes': 1000, 'block_bytes': 4096, 'readonly': False}
          
              def path(self, pair):
                  return Path('/sys/devices/mock') / ('%d-%d' % pair)
          
              def resolve(self, pair):
                  if pair not in self.table:
                      raise FileNotFoundError()
                  return self.path(pair)
          
              def lookup(self, path):
                  for pair, data in self.table.items():
                      if str(path).startswith(str(self.path(pair)) + '/'):
                          return pair, data
                  # The partition fixture uses a canonical nesting so parent/dev can resolve.
                  if path == Path('/sys/devices/mock/dev'):
                      return (8, 0), self.table[(8, 0)]
                  raise AssertionError('unexpected fixture path')
          
              def read(self, path, cap=65536):
                  if str(path) == '/proc/self/mountinfo':
                      return self.raw
                  pair, data = self.lookup(path)
                  name = Path(path).name
                  if name == 'dev':
                      return ('%d:%d\n' % pair).encode()
                  if name == 'partition':
                      return str(data.get('part', 1)).encode()
                  if name == 'size':
                      return str(data['size']).encode()
                  if name == 'start':
                      return str(data.get('start', 0)).encode()
                  raise AssertionError('unexpected kernel read')
          
              def exists(self, path):
                  pair, data = self.lookup(path)
                  return Path(path).name == {'partition': 'partition', 'disk': 'device', 'dm': 'dm', 'raid': 'md'}.get(data['kind'])
          
              def slaves(self, path):
                  return self.table[next(pair for pair in self.table if self.path(pair) == path)]['slaves']
          
          
          def observed(fake=None):
              root, nodes, topology = g.collect(fake or Fake())
              value = g.base(TARGET, SOURCE)
              value.update(status='OBSERVED', root=root, devices=nodes, topology=topology)
              return value
          
          
          class GeometryTests(unittest.TestCase):
              def reject(self, value):
                  with self.assertRaises((ValueError, g.ClosedError, TypeError)):
                      g.validate(value, TARGET, SOURCE)
          
              def test_partition_positive(self):
                  v = observed()
                  g.validate(v, TARGET, SOURCE)
                  self.assertEqual(v['topology'], 'SIMPLE_PARTITION_WITH_PARENT')
                  self.assertEqual(v['devices'][0]['parent'], 1)
                  self.assertLess(v['root']['total_bytes'], v['devices'][0]['size_bytes'])
          
              def test_whole_positive(self):
                  f = Fake()
                  f.raw = f.raw.replace(b'8:1', b'8:0')
                  f.fs_pair = (8, 0)
                  v = observed(f)
                  g.validate(v, TARGET, SOURCE)
                  self.assertEqual(v['topology'], 'SIMPLE_WHOLE_DISK')
          
              def test_subtree_is_observed_not_nonbind_claim(self):
                  f = Fake()
                  f.raw = f.raw.replace(b'8:1 / /', b'8:1 /subtree /')
                  self.assertEqual(observed(f)['root']['bind_state'], 'SUBTREE_ROOT_OBSERVED')
                  self.assertEqual(observed()['root']['bind_state'], 'NOT_PROVEN')
          
              def test_overlay_unsupported_without_guessing_block(self):
                  f = Fake()
                  f.raw = f.raw.replace(b'ext4', b'overlay')
                  v = observed(f)
                  g.validate(v, TARGET, SOURCE)
                  self.assertEqual(v['topology'], 'MAPPED_OR_UNSUPPORTED')
                  self.assertEqual(v['devices'], [])
          
              def test_mapper_and_raid_supported_observation_unsupported_action(self):
                  for kind in ('dm', 'raid', 'unknown'):
                      with self.subTest(kind=kind):
                          f = Fake()
                          f.table[(8, 1)]['kind'] = kind
                          f.table[(8, 1)]['slaves'] = [(8, 0)]
                          v = observed(f)
                          g.validate(v, TARGET, SOURCE)
                          self.assertEqual(v['topology'], 'MAPPED_OR_UNSUPPORTED')
          
              def test_root_malformed_duplicate_missing_wrong_identity(self):
                  for raw in (b'bad', MOUNTS + MOUNTS.splitlines()[0] + b'\n',
                              MOUNTS.replace(b' / / rw', b' / /x rw'),
                              MOUNTS.replace(b'8:1', b'invalid'), MOUNTS.replace(b'ro - sysfs', b'ro - ext4')):
                      with self.subTest(raw=raw):
                          f = Fake()
                          f.raw = raw
                          with self.assertRaises(g.ClosedError):
                              g.collect(f)
                  f = Fake()
                  f.fs_pair = (9, 9)
                  with self.assertRaises(g.ClosedError):
                      g.collect(f)
          
              def test_partition_overlap_and_wrong_parent(self):
                  for change in ('overlap', 'parent'):
                      f = Fake()
                      if change == 'overlap':
                          f.table[(8, 1)]['size'] = 201
                      else:
                          f.table[(8, 0)]['kind'] = 'dm'
                      with self.assertRaises(g.ClosedError):
                          g.collect(f)
          
              def test_cycle_and_depth(self):
                  f = Fake()
                  f.table[(8, 1)]['kind'] = 'dm'
                  f.table[(8, 1)]['slaves'] = [(8, 0)]
                  f.table[(8, 0)]['kind'] = 'dm'
                  f.table[(8, 0)]['slaves'] = [(8, 1)]
                  with self.assertRaises(g.ClosedError):
                      g.collect(f)
                  f = Fake()
                  for i in range(7):
                      f.table[(8, i + 1)] = {'kind': 'dm', 'size': 200, 'slaves': [(8, i + 2)] if i < 6 else []}
                  with self.assertRaises(g.ClosedError):
                      g.collect(f)
          
              def test_node_count_boundary(self):
                  f = Fake()
                  f.table[(8, 1)] = {'kind': 'dm', 'size': 200, 'slaves': []}
                  for i in range(2, 17):
                      f.table[(8, i)] = {'kind': 'unknown', 'size': 200, 'slaves': []}
                  # Fanout in two levels avoids conflating the count with the depth cap.
                  f.table[(8, 1)]['slaves'] = [(8, i) for i in range(2, 10)]
                  f.table[(8, 2)]['kind'] = 'dm'
                  f.table[(8, 2)]['slaves'] = [(8, i) for i in range(10, 17)]
                  v = observed(f)
                  self.assertEqual(len(v['devices']), 16)
                  g.validate(v, TARGET, SOURCE)
                  f.table[(8, 17)] = {'kind': 'unknown', 'size': 200, 'slaves': []}
                  f.table[(8, 2)]['slaves'].append((8, 17))
                  with self.assertRaises(g.ClosedError):
                      g.collect(f)
          
              def test_read_exact_boundary_and_plus_one(self):
                  for length, admitted in ((16, True), (17, False)):
                      k = g.Kernel()
                      k.remaining = 17
                      with patch.object(g.os, 'open', return_value=42), patch.object(g.os, 'close'), \
                              patch.object(g.os, 'read', side_effect=[b'x' * length, b'']):
                          if admitted:
                              self.assertEqual(len(k.read('/proc/self/mountinfo', 16)), 16)
                          else:
                              with self.assertRaises(g.ClosedError):
                                  k.read('/proc/self/mountinfo', 16)
                  k = g.Kernel()
                  k.remaining = 16
                  with patch.object(g.os, 'open', return_value=42), patch.object(g.os, 'close'), \
                          patch.object(g.os, 'read', return_value=b'x' * 16) as read:
                      with self.assertRaises(g.ClosedError):
                          k.read('/proc/self/mountinfo', 16)
                      self.assertEqual(read.call_args.args[1], 16)
                  k = g.Kernel()
                  k.remaining = 0
                  with patch.object(g.os, 'open', return_value=42), patch.object(g.os, 'close'), \
                          patch.object(g.os, 'read', return_value=b'x'):
                      with self.assertRaises(g.ClosedError):
                          k.read('/proc/self/mountinfo')
          
              def test_unknown_path_and_sysfs_escape(self):
                  k = g.Kernel()
                  with self.assertRaises(g.ClosedError):
                      k.read('/etc/PRIVATE')
                  with patch.object(g.Path, 'resolve', return_value=Path('/etc/PRIVATE')):
                      with self.assertRaises(g.ClosedError):
                          k.resolve((8, 1))
          
              def test_actual_slave_directory_boundary_plus_one(self):
                  class Entries:
                      def __init__(self, count):
                          self.values = [SimpleNamespace(path='/sys/devices/mock/slave') for _ in range(count)]
                          self.closed = False
                      def __enter__(self):
                          return iter(self.values)
                      def __iter__(self):
                          return iter(self.values)
                      def __exit__(self, *args):
                          self.closed = True
                  for count in (g.SLAVE_CAP, g.SLAVE_CAP + 1):
                      entries = Entries(count)
                      k = g.Kernel()
                      with patch.object(g.os, 'scandir', return_value=entries), \
                              patch.object(g.Path, 'resolve', return_value=Path('/sys/devices/mock/slave')), \
                              patch.object(k, 'read', side_effect=[('8:%d' % i).encode() for i in range(count)]):
                          if count == g.SLAVE_CAP:
                              self.assertEqual(len(k.slaves(Path('/sys/devices/mock'))), count)
                          else:
                              with self.assertRaises(g.ClosedError):
                                  k.slaves(Path('/sys/devices/mock'))
                      self.assertTrue(entries.closed)
          
              def test_deadline_inclusive_and_plus_one(self):
                  k = g.Kernel()
                  for elapsed in (g.DEADLINE, g.DEADLINE + 0.001):
                      with patch.object(g.time, 'monotonic', return_value=k.started + elapsed):
                          with self.assertRaises(g.ClosedError):
                              k.check()
          
              def test_alarm_interrupts_userspace_without_child(self):
                  old = signal.signal(signal.SIGALRM, g.alarm_handler)
                  started = time.monotonic()
                  try:
                      signal.setitimer(signal.ITIMER_REAL, 0.02)
                      with self.assertRaises(g.ClosedError):
                          while True:
                              pass
                  finally:
                      signal.setitimer(signal.ITIMER_REAL, 0)
                      signal.signal(signal.SIGALRM, old)
                  self.assertLess(time.monotonic() - started, 1.0)
          
              def test_freshness_exact_boundary_plus_one_future(self):
                  v = observed()
                  stamp = dt.datetime.fromisoformat(v['observed_at'])
                  g.validate(v, TARGET, SOURCE, stamp + dt.timedelta(seconds=300))
                  for seconds in (300.000001, -0.000001):
                      with self.assertRaises(ValueError):
                          g.validate(v, TARGET, SOURCE, stamp + dt.timedelta(seconds=seconds))
          
              def test_wrong_sha_target_and_unknown_fields(self):
                  for key, replacement in (('target_sha', 'c' * 40), ('collector_sha256', 'd' * 64),
                                           ('PRIVATE', '/dev/PRIVATE'), ('mode', 'WRITE')):
                      v = observed()
                      v[key] = replacement
                      self.reject(v)
          
              def test_bad_graph_and_scalars(self):
                  values = []
                  for key, value in (('major', True), ('size_bytes', -1), ('size_bytes', 1 << 63),
                                     ('parent', 99), ('parent', 0), ('slaves', [1, 1]), ('start_bytes', 9999999)):
                      v = observed()
                      v['devices'][0][key] = value
                      values.append(v)
                  v = observed()
                  v['devices'][1]['major'] = 7
                  v['devices'][1]['minor'] = 99
                  v['devices'][0]['parent'] = None
                  values.append(v)
                  v = observed()
                  v['root']['total_bytes'] = 9999999
                  values.append(v)
                  for v in values:
