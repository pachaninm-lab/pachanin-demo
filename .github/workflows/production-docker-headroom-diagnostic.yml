          import ctypes
          import json
          import os
          import re
          import selectors
          import signal
          import stat
          import subprocess
          import time

          SCHEMA = 'pc.closed-docker-failure-signal.v2'
          CLI = '/usr/bin/docker'
          SOCKET = '/run/docker.sock'
          ARGV = (CLI, '--host', 'unix:///run/docker.sock', 'ps', '-aq', '--no-trunc')
          # The matching minimal startup environment is NOT proof of config isolation:
          # Docker may resolve HOME via NSS and read its user config; nothing raw is published.
          ENV = {'PATH': '/usr/sbin:/usr/bin:/sbin:/bin', 'LC_ALL': 'C'}
          MAX_STREAM = 16384
          COMMAND_SECONDS = 12
          OUTER_SECONDS = 15
          SIGNALS = frozenset(('NONE', 'UNKNOWN', 'CLI_MISSING', 'CLI_UNTRUSTED', 'SOCKET_MISSING',
              'SOCKET_UNTRUSTED', 'ROOT_REQUIRED', 'SOCKET_PERMISSION_DENIED', 'DAEMON_ENDPOINT_UNREACHABLE',
              'DAEMON_RESPONSE_ERROR', 'CLI_ARGUMENT_REJECTED', 'CLIENT_ENDPOINT_RESOLUTION_FAILED',
              'API_NEGOTIATION_FAILED', 'CONTEXT_RESOLUTION_FAILED', 'EXECUTION_UNAVAILABLE', 'FIXED_PARENT_UNTRUSTED'))
          STATUSES = frozenset(('SUCCESS', 'NOT_RUN', 'NONZERO', 'TIMED_OUT', 'OUTPUT_LIMIT',
                               'INVALID_OUTPUT', 'UNSTABLE', 'CLEANUP_UNCONFIRMED', 'UNKNOWN'))


          def failure_signal(raw):
              if type(raw) is not bytes or len(raw) > MAX_STREAM:
                  return 'UNKNOWN'
              predicates = {
                  'SOCKET_PERMISSION_DENIED': b'permission denied while trying to connect to the docker daemon socket',
                  'DAEMON_ENDPOINT_UNREACHABLE': b'Cannot connect to the Docker daemon at unix:///run/docker.sock. Is the docker daemon running?',
                  'DAEMON_RESPONSE_ERROR': b'Error response from daemon:',
                  'CLI_ARGUMENT_REJECTED': b'unknown shorthand flag:',
                  'CLIENT_ENDPOINT_RESOLUTION_FAILED': b'unable to resolve docker endpoint:',
                  'API_NEGOTIATION_FAILED': b'client version is too old. Minimum supported API version is',
                  'CONTEXT_RESOLUTION_FAILED': b'context not found:',
              }
              found = [key for key, marker in predicates.items() if marker in raw]
              return found[0] if len(found) == 1 else 'UNKNOWN'


          def fingerprint(value):
              return (value.st_dev, value.st_ino, value.st_mode, value.st_uid, value.st_gid,
                      value.st_size, value.st_mtime_ns, value.st_ctime_ns)


          def validate_report(value):
              if type(value) is not dict or set(value) != {
                  'schema', 'status', 'failure_signal', 'elapsed_ms', 'stdout_bytes', 'stderr_bytes',
                  'container_count', 'root_cause', 'production_mutation', 'deployment_authorized', 'cleanup_attestation'}:
                  raise ValueError('CLOSED_SCHEMA')
              if (value['schema'] != SCHEMA or value['status'] not in STATUSES or
                      value['failure_signal'] not in SIGNALS or value['root_cause'] != 'NOT_ESTABLISHED' or
                      value['production_mutation'] is not False or value['deployment_authorized'] is not False):
                  raise ValueError('CLOSED_VALUES')
              for key, maximum in [('elapsed_ms', 16000), ('stdout_bytes', MAX_STREAM + 1), ('stderr_bytes', MAX_STREAM + 1)]:
                  if type(value[key]) is not int or not 0 <= value[key] <= maximum:
                      raise ValueError('CLOSED_BOUNDS')
              cleanup = value['cleanup_attestation']
              if cleanup not in {'NOT_STARTED', 'OWNED_ANCESTRY_REAPED', 'NOT_ATTESTED'}:
                  raise ValueError('CLOSED_CLEANUP')
              if (value['status'] == 'CLEANUP_UNCONFIRMED') != (cleanup == 'NOT_ATTESTED'):
                  raise ValueError('CLOSED_CLEANUP_BINDING')
              count = value['container_count']
              if value['status'] == 'SUCCESS':
                  if (type(count) is not int or not 0 <= count <= 128 or value['failure_signal'] != 'NONE'
                          or cleanup != 'OWNED_ANCESTRY_REAPED'):
                      raise ValueError('CLOSED_SUCCESS')
              elif count is not None or value['failure_signal'] == 'NONE':
                  raise ValueError('CLOSED_FAILURE')
              return value


          class OwnedChildLease:
              """One fresh parent's owned child ancestry; no PID-group signals after reaping."""
              WALL = 0x40000000
              MAX_REAPED = 128

              def __init__(self):
                  import threading
                  self.active = False
                  self.final_reap_started = False
                  self.previous = ctypes.c_int(-1)
                  self.libc = ctypes.CDLL(None, use_errno=True)
                  if (threading.current_thread() is not threading.main_thread() or threading.active_count() != 1
                          or signal.getsignal(signal.SIGCHLD) != signal.SIG_DFL):
                      raise ValueError('CHILD_PARENT_NOT_FRESH')
                  try:
                      os.waitid(os.P_ALL, 0, os.WEXITED | os.WNOWAIT | os.WNOHANG | self.WALL)
                  except ChildProcessError:
                      pass
                  else:
                      raise ValueError('CHILD_PARENT_HAS_CHILDREN')
                  if self.libc.prctl(37, ctypes.byref(self.previous), 0, 0, 0) != 0 or self.previous.value != 0:
                      raise ValueError('CHILD_PARENT_SUBREAPER_STATE')
                  if self.libc.prctl(36, 1, 0, 0, 0) != 0:
                      raise ValueError('CHILD_SUBREAPER_UNAVAILABLE')
                  self.active = True

              def observe(self, proc):
                  if self.final_reap_started:
                      raise ValueError('CHILD_IDENTITY_RELEASED')
                  value = os.waitid(os.P_PID, proc.pid, os.WEXITED | os.WNOWAIT | os.WNOHANG | self.WALL)
                  if value is None:
                      return None
                  if value.si_pid != proc.pid or value.si_code not in (os.CLD_EXITED, os.CLD_KILLED, os.CLD_DUMPED):
                      raise ValueError('CHILD_IDENTITY_INVALID')
                  return value.si_status if value.si_code == os.CLD_EXITED else -value.si_status

              def wait_without_reap(self, proc, deadline):
                  while True:
                      value = self.observe(proc)
                      if value is not None:
                          return value
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise subprocess.TimeoutExpired(proc.args, 0)
                      time.sleep(min(remaining, 0.005))

              def close(self, proc, deadline):
                  clean = True
                  try:
                      if proc is None:
                          return True
                      # WNOWAIT pins the leader's identity until the single final reap.
                      # ECHILD rejects an externally/reentrantly reaped leader before any signal.
                      try:
                          self.observe(proc)
                      except (OSError, ValueError):
                          clean = False
                      else:
                          try:
                              os.killpg(proc.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          except OSError:
                              clean = False
                      for stream in (getattr(proc, 'stdin', None), proc.stdout, proc.stderr):
                          if stream is not None:
                              stream.close()
                      # After this flag there must never be another group-ID syscall.
                      self.final_reap_started = True
                      try:
                          proc.wait(timeout=max(0.001, deadline - time.monotonic()))
                      except (OSError, subprocess.TimeoutExpired):
                          return False
                      reaped = 0
                      # Subreaper adoption occurs before a dead parent's waitable exit.
                      # Reap only this previously child-free parent's adopted ancestry.
                      # ECHILD proves none remain; a live/escaped child keeps this failed/unknown.
                      while time.monotonic() < deadline:
                          if reaped >= self.MAX_REAPED:
                              try:
                                  os.waitid(os.P_ALL, 0, os.WEXITED | os.WNOWAIT | os.WNOHANG | self.WALL)
                              except ChildProcessError:
                                  return clean
                              except OSError:
                                  return False
                              return False
                          try:
                              child = os.waitid(os.P_ALL, 0, os.WEXITED | os.WNOHANG | self.WALL)
                          except ChildProcessError:
                              return clean
                          except OSError:
                              return False
                          if child is None:
                              time.sleep(min(0.005, max(0, deadline - time.monotonic())))
                              continue
                          reaped += 1
                          if child.si_pid == proc.pid:
                              return False
                      return False
                  finally:
                      if self.active:
                          self.active = False
                          # This attribute is process-local and is restored before returning.
                          # Failed restoration is an unknown cleanup result, never acceptance.
                          if self.libc.prctl(36, self.previous.value, 0, 0, 0) != 0:
                              return False


          def collect():
              started = time.monotonic()
              result = {'schema': SCHEMA, 'status': 'NOT_RUN', 'failure_signal': 'UNKNOWN', 'elapsed_ms': 0,
                        'stdout_bytes': 0, 'stderr_bytes': 0, 'container_count': None,
                        'root_cause': 'NOT_ESTABLISHED', 'production_mutation': False, 'deployment_authorized': False,
                        'cleanup_attestation': 'NOT_STARTED'}
              if os.geteuid() != 0:
                  result['failure_signal'] = 'ROOT_REQUIRED'
                  return result
              try:
                  parent_before = {path: os.lstat(path) for path in ('/', '/usr', '/usr/bin', '/run')}
                  if any(not stat.S_ISDIR(value.st_mode) or value.st_uid != 0 or value.st_mode & 0o022
                         for value in parent_before.values()):
                      raise ValueError('UNTRUSTED_PARENT')
              except (OSError, ValueError):
                  result['failure_signal'] = 'FIXED_PARENT_UNTRUSTED'
                  return result
              try:
                  cli_before = os.lstat(CLI)
              except FileNotFoundError:
                  result['failure_signal'] = 'CLI_MISSING'
                  return result
              except OSError:
                  result['failure_signal'] = 'EXECUTION_UNAVAILABLE'
                  return result
              if not stat.S_ISREG(cli_before.st_mode) or cli_before.st_uid != 0 or cli_before.st_mode & 0o022:
                  result['failure_signal'] = 'CLI_UNTRUSTED'
                  return result
              try:
                  socket_before = os.lstat(SOCKET)
              except FileNotFoundError:
                  result['failure_signal'] = 'SOCKET_MISSING'
                  return result
              except OSError:
                  result['failure_signal'] = 'EXECUTION_UNAVAILABLE'
                  return result
              if not stat.S_ISSOCK(socket_before.st_mode) or socket_before.st_uid != 0 or socket_before.st_mode & 0o002:
                  result['failure_signal'] = 'SOCKET_UNTRUSTED'
                  return result
              deadline = started + OUTER_SECONDS
              work_deadline = min(started + COMMAND_SECONDS, deadline - 1)
              proc = None
              lease = None
              poller = selectors.DefaultSelector()
              streams = {'out': bytearray(), 'err': bytearray()}
              parent = os.getpid()

              def child_limits():
                  import resource
                  resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
                  if ctypes.CDLL(None, use_errno=True).prctl(1, signal.SIGKILL, 0, 0, 0) != 0 or os.getppid() != parent:
                      os._exit(125)

              try:
                  lease = OwnedChildLease()
                  proc = subprocess.Popen(ARGV, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      env=ENV, cwd='/', close_fds=True, start_new_session=True, preexec_fn=child_limits)
                  for stream, name in ((proc.stdout, 'out'), (proc.stderr, 'err')):
                      os.set_blocking(stream.fileno(), False)
                      poller.register(stream, selectors.EVENT_READ, name)
                  while poller.get_map():
                      remaining = work_deadline - time.monotonic()
                      if remaining <= 0:
                          result['status'] = 'TIMED_OUT'
                          break
                      for item, _ in poller.select(min(remaining, 0.05)):
                          try:
                              chunk = os.read(item.fileobj.fileno(), min(4096, MAX_STREAM - len(streams[item.data]) + 1))
                          except BlockingIOError:
                              continue
                          if not chunk:
                              poller.unregister(item.fileobj)
                              continue
                          streams[item.data].extend(chunk)
                          if len(streams[item.data]) > MAX_STREAM:
                              result['status'] = 'OUTPUT_LIMIT'
                              break
                      if result['status'] == 'OUTPUT_LIMIT':
                          break
                  else:
                      code = lease.wait_without_reap(proc, work_deadline)
                      if code != 0:
                          result.update(status='NONZERO', failure_signal=failure_signal(bytes(streams['err'])))
                      else:
                          rows = bytes(streams['out']).splitlines()
                          if len(rows) <= 128 and len(set(rows)) == len(rows) and all(re.fullmatch(b'[0-9a-f]{64}', row) for row in rows):
                              result.update(status='SUCCESS', failure_signal='NONE', container_count=len(rows))
                          else:
                              result['status'] = 'INVALID_OUTPUT'
              except subprocess.TimeoutExpired:
                  result['status'] = 'TIMED_OUT'
              except (OSError, ValueError, subprocess.SubprocessError):
                  result.update(status='UNKNOWN', failure_signal='EXECUTION_UNAVAILABLE')
              finally:
                  poller.close()
                  cleaned = lease.close(proc, deadline) if lease is not None else proc is None
                  if not cleaned:
                      result.update(status='CLEANUP_UNCONFIRMED', failure_signal='UNKNOWN', container_count=None,
                                    cleanup_attestation='NOT_ATTESTED')
                  elif proc is not None:
                      result['cleanup_attestation'] = 'OWNED_ANCESTRY_REAPED'
                  try:
                      if (fingerprint(os.lstat(CLI)) != fingerprint(cli_before) or
                              fingerprint(os.lstat(SOCKET)) != fingerprint(socket_before) or
                              any(fingerprint(os.lstat(path)) != fingerprint(value) for path, value in parent_before.items())):
                          if result['status'] != 'CLEANUP_UNCONFIRMED':
                              result.update(status='UNSTABLE', failure_signal='UNKNOWN', container_count=None)
                  except OSError:
                      if result['status'] != 'CLEANUP_UNCONFIRMED':
                          result.update(status='UNSTABLE', failure_signal='UNKNOWN', container_count=None)
                  elapsed = max(0, int((time.monotonic() - started) * 1000))
                  if elapsed > OUTER_SECONDS * 1000 and result['status'] != 'CLEANUP_UNCONFIRMED':
                      result.update(status='TIMED_OUT', failure_signal='UNKNOWN', container_count=None)
                  result['elapsed_ms'] = min(16000, elapsed)
                  result['stdout_bytes'] = len(streams['out'])
                  result['stderr_bytes'] = len(streams['err'])
              return validate_report(result)


          if __name__ == '__main__':
              try:
                  report = validate_report(collect())
                  print(json.dumps(report, sort_keys=True, separators=(',', ':')))
                  raise SystemExit(0 if report['status'] == 'SUCCESS' else 1)
              except Exception:
                  # A failed closed-schema collector emits no raw errors or host fields.
                  raise SystemExit(1)
