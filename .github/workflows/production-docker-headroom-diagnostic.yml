                                       'logicalBytes': logical, 'allocatedBytes': blocks,
                                       'integrity': 'NOT_ATTESTED'}}, path, roots, device, tokens
              finally:
                  os.close(root_fd)


          def image_metadata(value, image_id):
              require(type(value) is dict and value.get('Id') == image_id and IMAGE.fullmatch(image_id),
                      'IMAGE_IDENTITY')
              config = value.get('Config') or {}
              require(type(config) is dict, 'IMAGE_CONFIG')
              labels = config.get('Labels') or {}
              require(type(labels) is dict, 'IMAGE_LABELS')
              revision = labels.get('org.opencontainers.image.revision')
              env = config.get('Env') or []
              require(type(env) is list and all(type(s) is str for s in env), 'IMAGE_ENV')
              majors = [s.split('=', 1)[1] for s in env if s.startswith('PG_MAJOR=')]
              return {'id': image_id, 'bytes': integer(value.get('Size')),
                      'revision': revision if type(revision) is str and HEX.fullmatch(revision) else None,
                      'os': value.get('Os') if value.get('Os') in ('linux', 'windows') else 'UNKNOWN',
                      'architecture': value.get('Architecture') if value.get('Architecture') in
                      ('amd64', 'arm64', '386', 'arm', 'ppc64le', 's390x') else 'UNKNOWN',
                      'postgresMajor': int(majors[0]) if len(majors) == 1 and
                      re.fullmatch('[0-9]{1,2}', majors[0]) else None}


          def bindings(records, roots, pg_path, images):
              services, rw_binds, ro_binds, unknown, pg_bindings = [], 0, 0, 0, []
              compose_files = set()
              for record in records:
                  config = record['Config']
                  labels = config.get('Labels') or {}
                  require(type(labels) is dict, 'CONTAINER_LABELS')
                  role = labels.get('com.docker.compose.service')
                  public_role = role if role in ROLES else 'UNKNOWN'
                  env = config.get('Env') or []
                  require(type(env) is list and all(type(s) is str for s in env), 'CONTAINER_ENV')
                  pgdata = [s.split('=', 1)[1].rstrip('/') for s in env if s.startswith('PGDATA=')]
                  candidates = []
