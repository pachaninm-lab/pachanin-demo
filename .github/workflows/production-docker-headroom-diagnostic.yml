          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$host" \
            'set -Eeuo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"

      - name: Prepare bounded preservation preflight payload
        shell: bash
        run: |
          set -Eeuo pipefail
          # Bounded observations only; no startup or restore acceptance.
          preservation_preflight_script="$(cat <<'PY_PRESERVATION_PREFLIGHT'
          import json
          import os
          import re
          import stat
          import sys

          MAX_ENTRIES = 2048
          MAX_BYTES = 4 * 1024 * 1024
          ROLES = frozenset(('api', 'web', 'postgres', 'postgresql', 'redis', 'minio',
                            'caddy', 'kafka', 'zookeeper', 'outbox-worker',
                            'auth-mail-worker', 'migration', 'migrations', 'pgbouncer', 'watchtower'))
          POLICIES = frozenset(('', 'no', 'always', 'unless-stopped', 'on-failure'))


          def directory_flags(traverse_only=False):
              no_atime = getattr(os, 'O_NOATIME', None)
              if no_atime is None:
                  raise OSError('NO_NOATIME')
              return os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | (0 if traverse_only else no_atime)


          def checked_directory(name, parent=None, allow_data_owner=False, traverse_only=False):
              fd = os.open(name, directory_flags(traverse_only), dir_fd=parent)
              try:
                  if not allow_data_owner and os.fstat(fd).st_uid not in (0, os.geteuid()):
                      raise ValueError('UNTRUSTED_OWNER')
                  return fd
              except BaseException:
                  os.close(fd)
                  raise


          def absolute_directory(path):
              if not isinstance(path, str) or not path.startswith('/'):
                  raise ValueError('INVALID_PATH')
              components = path.split('/')[1:]
              if any(part in ('', '.', '..') for part in components):
                  raise ValueError('INVALID_PATH')
              fd = checked_directory('/', traverse_only=True)
              try:
                  for component in components:
                      child = checked_directory(component, fd, traverse_only=True)
                      os.close(fd)
                      fd = child
                  # Traversal does not read directory entries. Only the leaf is enumerated.
                  leaf = checked_directory('.', fd)
                  os.close(fd)
                  return leaf
              except BaseException:
                  os.close(fd)
                  raise


          def names(fd):
              result = []
              with os.scandir(fd) as entries:
                  for entry in entries:
                      if len(result) >= MAX_ENTRIES:
                          raise ValueError('LIMIT_EXCEEDED')
                      result.append(entry.name)
              return sorted(result)


          def read_file(fd, name, limit=MAX_BYTES, allow_data_owner=False):
              child = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_NOATIME,
                              dir_fd=fd)
              try:
                  before = os.fstat(child)
                  if (not stat.S_ISREG(before.st_mode) or
                          (not allow_data_owner and before.st_uid != os.geteuid())
                          or before.st_size > limit):
                      raise ValueError('INVALID_FILE')
                  with os.fdopen(child, 'rb', closefd=False) as stream:
                      payload = stream.read(limit + 1)
                  after = os.fstat(child)
                  fields = ('st_size', 'st_mtime_ns', 'st_ctime_ns')
                  if len(payload) > limit or any(getattr(before, k) != getattr(after, k) for k in fields):
                      raise ValueError('UNSTABLE_FILE')
                  return payload
              finally:
                  os.close(child)


          def restart_inventory(root):
              result = {'status': 'UNAVAILABLE', 'records': [], 'rejected': 0}
              root_fd = containers_fd = None
              try:
                  root_fd = absolute_directory(root)
                  containers_fd = checked_directory('containers', root_fd)
                  for name in names(containers_fd):
                      child = None
                      try:
                          if re.fullmatch(r'[0-9a-f]{64}', name) is None:
                              raise ValueError('INVALID_ID')
                          child = checked_directory(name, containers_fd)
                          config = json.loads(read_file(child, 'config.v2.json'))
                          host = json.loads(read_file(child, 'hostconfig.json'))
                          if not isinstance(config, dict) or config.get('ID') != name or not isinstance(host, dict):
                              raise ValueError('INVALID_METADATA')
                          options = config.get('Config')
                          if not isinstance(options, dict):
                              raise ValueError('INVALID_CONFIG')
                          labels = options.get('Labels')
                          if labels is None:
                              labels = {}
                          if not isinstance(labels, dict):
                              raise ValueError('INVALID_LABELS')
                          role = labels.get('com.docker.compose.service')
                          role = role if isinstance(role, str) and role in ROLES else 'other'
                          policy = host.get('RestartPolicy')
                          if not isinstance(policy, dict) or policy.get('Name') not in POLICIES:
                              raise ValueError('UNKNOWN_RESTART_POLICY')
                          retry = policy.get('MaximumRetryCount')
                          if type(retry) is not int or not 0 <= retry <= 2147483647:
                              raise ValueError('INVALID_RETRY_COUNT')
                          image = options.get('Image', '')
                          if not isinstance(image, str):
                              raise ValueError('INVALID_IMAGE')
                          watcher = role == 'watchtower' or image.split('@')[0].rsplit('/', 1)[-1].split(':')[0] == 'watchtower'
                          compose = all(isinstance(labels.get(key), str) and bool(labels[key])
                                        for key in ('com.docker.compose.project',
                                                    'com.docker.compose.project.working_dir',
                                                    'com.docker.compose.project.config_files'))
                          state = config.get('State')
                          state = state if isinstance(state, dict) else {}
                          flags = {key: state.get(key) if type(state.get(key)) is bool else None
                                   for key in ('Running', 'Paused', 'Restarting', 'OOMKilled', 'Dead')}
                          stopped = config.get('HasBeenManuallyStopped')
                          driver = config.get('Driver')
                          driver = driver if driver in ('overlayfs', 'overlay2', 'vfs', 'btrfs', 'zfs') else 'unknown'
                          code = state.get('ExitCode')
                          ever = config.get('HasBeenStartedBefore')
                          runtime = {'container_id': name, 'driver': driver, 'state': flags,
                                     'manually_stopped': stopped if type(stopped) is bool else None,
                                     'ever_started': ever if type(ever) is bool else None,
                                     'exit_code': code if type(code) is int and 0 <= code <= 255 else None}
                          for key in ('StartedAt', 'FinishedAt'):
                              value = state.get(key)
                              runtime[key] = value if isinstance(value, str) and len(value) <= 64 and re.fullmatch(
                        r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?(?:Z|[+-][0-9]{2}:[0-9]{2})', value) else 'unknown'
                          result['records'].append({'role': role, 'policy': policy['Name'] or 'no',
                                                    'retry': retry, 'watchtower': watcher,
                                                    'compose_labels_present': compose, 'runtime_metadata': runtime})
                      except (OSError, ValueError, TypeError, RecursionError):
                          result['rejected'] += 1
                      finally:
                          if child is not None:
                              os.close(child)
                  result['status'] = 'PARTIAL' if result['rejected'] else 'COMPLETE'
              except (OSError, ValueError, TypeError):
                  result['status'] = 'UNAVAILABLE'
              finally:
                  for fd in (containers_fd, root_fd):
                      if fd is not None:
                          os.close(fd)
              return result


          def backup_inventory(path):
              result = {'status': 'UNAVAILABLE', 'files': 0, 'bytes': 0, 'dumps': 0,
                        'checksums': 0, 'other': 0, 'unsafe_permissions': 0,
                        'newest_mtime': 0, 'unsafe_directory_permissions': False}
              fd = None
              try:
                  fd = absolute_directory(path)
                  result['unsafe_directory_permissions'] = bool(stat.S_IMODE(os.fstat(fd).st_mode) & 0o077)
                  for name in names(fd):
                      info = os.stat(name, dir_fd=fd, follow_symlinks=False)
                      if not stat.S_ISREG(info.st_mode) or info.st_uid != os.geteuid():
                          raise ValueError('UNTRUSTED_BACKUP_ENTRY')
                      result['files'] += 1
                      result['bytes'] += info.st_size
                      result['newest_mtime'] = max(result['newest_mtime'], int(info.st_mtime))
                      result['unsafe_permissions'] += bool(stat.S_IMODE(info.st_mode) & 0o077)
                      result['dumps' if name.endswith('.backup') else
                             'checksums' if name.endswith('.sha256') else 'other'] += 1
                  result['status'] = 'METADATA_ONLY'
              except FileNotFoundError:
                  result['status'] = 'ABSENT'
              except (OSError, ValueError, TypeError):
                  result['status'] = 'UNAVAILABLE'
              finally:
                  if fd is not None:
                      os.close(fd)
              return result


          def pg_layout(fd):
              try:
                  version = read_file(fd, 'PG_VERSION', 32, allow_data_owner=True).decode('ascii').strip()
              except FileNotFoundError:
                  return None
              if re.fullmatch(r'[0-9]{1,2}(?:\.[0-9]{1,2})?', version) is None:
                  raise ValueError('INVALID_PG_VERSION')
              opened = []
              try:
                  for name in ('global', 'base', 'pg_wal'):
                      opened.append(checked_directory(name, fd, allow_data_owner=True))
                  control = os.stat('pg_control', dir_fd=opened[0], follow_symlinks=False)
                  if not stat.S_ISREG(control.st_mode) or control.st_size <= 0:
                      raise ValueError('INVALID_CONTROL_FILE')
                  try:
                      pid = os.stat('postmaster.pid', dir_fd=fd, follow_symlinks=False)
                      if not stat.S_ISREG(pid.st_mode):
                          raise ValueError('INVALID_PID_FILE')
                      pid_present = True
                  except FileNotFoundError:
                      pid_present = False
                  return {'major': version, 'pid_file_present': pid_present}
              finally:
                  for child in opened:
                      os.close(child)


          def volume_inventory(root):
              result = {'status': 'UNAVAILABLE', 'directories': 0, 'rejected': 0,
                        'postgres_layouts': [], 'unsupported_or_non_postgres': 0}
              root_fd = volumes_fd = None
              try:
                  root_fd = absolute_directory(root)
                  volumes_fd = checked_directory('volumes', root_fd)
                  for name in names(volumes_fd):
                      # Docker also stores its own database and backing-filesystem marker here.
                      if name in ('metadata.db', 'backingFsBlockDev'):
                          continue
                      volume_fd = data_fd = nested_fd = None
                      try:
                          volume_fd = checked_directory(name, volumes_fd)
                          data_fd = checked_directory('_data', volume_fd, allow_data_owner=True)
                          result['directories'] += 1
                          layouts = []
                          layout = pg_layout(data_fd)
                          if layout is not None:
                              layouts.append(layout)
                          try:
                              nested_fd = checked_directory('pgdata', data_fd, allow_data_owner=True)
                          except FileNotFoundError:
                              nested_fd = None
                          if nested_fd is not None:
                              layout = pg_layout(nested_fd)
                              if layout is not None:
                                  layouts.append(layout)
                          if len(layouts) > 1:
                              raise ValueError('AMBIGUOUS_PG_LAYOUT')
                          result['postgres_layouts'].extend(layouts)
                          result['unsupported_or_non_postgres'] += not layouts
                      except (OSError, ValueError, TypeError, UnicodeError):
                          result['rejected'] += 1
                      finally:
                          for fd in (nested_fd, data_fd, volume_fd):
                              if fd is not None:
                                  os.close(fd)
                  result['status'] = 'PARTIAL' if result['rejected'] else 'STRUCTURAL_ONLY'
              except (OSError, ValueError, TypeError):
                  result['status'] = 'UNAVAILABLE'
              finally:
                  for fd in (volumes_fd, root_fd):
                      if fd is not None:
                          os.close(fd)
              return result


          def bounded_command(argv, cap=65536, seconds=5, accepted=(0,)):
              import selectors
              import subprocess
              import time
              child = None
              try:
                  child = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                           stderr=subprocess.DEVNULL)
                  payload = bytearray()
                  deadline = time.monotonic() + seconds
                  with selectors.DefaultSelector() as selector:
                      selector.register(child.stdout, selectors.EVENT_READ)
                      while time.monotonic() < deadline:
                          if not selector.select(max(0, deadline - time.monotonic())):
                              return 'TIMEOUT', None
                          chunk = os.read(child.stdout.fileno(), 16384)
                          if not chunk:
                              code = child.wait(timeout=max(0.1, deadline - time.monotonic()))
                              return ('COMPLETE', bytes(payload)) if code in accepted else ('UNAVAILABLE', None)
                          payload.extend(chunk)
                          if len(payload) > cap:
                              return 'LIMIT_EXCEEDED', None
                  return 'TIMEOUT', None
              except (OSError, ValueError, subprocess.SubprocessError):
                  return 'UNAVAILABLE', None
              finally:
                  if child is not None:
                      if child.poll() is None:
                          child.kill()
                      child.wait(timeout=2)
                      child.stdout.close()


          def startup_window():
              import time
              getter = ['busctl', '--system', 'get-property', 'org.freedesktop.systemd1',
                        '/org/freedesktop/systemd1/unit/docker_2eservice',
                        'org.freedesktop.systemd1.Service', 'ExecMainStartTimestamp']
              status, raw = bounded_command(getter, cap=4096)
              match = re.fullmatch(rb't ([0-9]+)\s*', raw or b'')
              if status != 'COMPLETE' or match is None:
                  return {'status': 'UNAVAILABLE'}
              micros = int(match[1])
              start, fraction = divmod(micros, 1000000)
              if not 1577836800 <= start <= time.time() + 60:
                  return {'status': 'UNAVAILABLE'}
              status, payload = bounded_command(
                  ['journalctl', '--unit=docker.service', '--since=@' + f'{start}.{fraction:06d}',
                   '--until=@' + f'{start + 300}.{fraction:06d}', '--lines=+400', '--no-pager', '--output=cat'],
                  cap=4 * 1024 * 1024, seconds=10)
              after_status, after = bounded_command(getter, cap=4096)
              if after_status != 'COMPLETE' or after != raw:
                  return {'status': 'UNSTABLE_DAEMON'}
              result = {'status': status, 'daemon_start_epoch_us': micros, 'window_seconds': 300,
                        'record_limit': 400, 'order': 'OLDEST_FIRST', 'byte_limit': 4 * 1024 * 1024}
              if status != 'COMPLETE':
                  return result
              text = payload.decode('utf-8', errors='replace').strip()
              if text in ('', '-- No entries --'):
                  result['status'] = 'NO_RECORDS'
                  return result
              lines = [line.lower() for line in text.splitlines()]
              terms = {
                  'ENOSPC': ('no space left on device', 'enospc'),
                  'RESTORE_ERROR': ('failed to load container', 'error loading container',
                                    'error restoring container', 'failed to restore container'),
                  'METADATA_ERROR': ('invalid config.v2.json', 'invalid hostconfig.json',
                                     'unexpected end of json'),
                  'STORAGE_ERROR': ('failed to mount', 'storage driver', 'snapshotter error',
                                    'layer does not exist'),
                  'PERMISSION_ERROR': ('permission denied', 'read-only file system'),
                  'CORRUPTION_INDICATOR': ('database corruption', 'checksum mismatch', 'invalid page'),
                  'LOAD_STARTED': ('loading containers: start',),
                  'LOAD_COMPLETED': ('loading containers: done',),
              }
              result['lines'] = len(lines)
              if len(lines) >= 400:
                  result['status'] = 'WINDOW_LIMIT_REACHED'
              result['indicators'] = {key: sum(any(term in line for term in values) for line in lines)
                                      for key, values in terms.items()}
              return result


          def host_postgres_processes():
              status, raw = bounded_command(['ps', '-C', 'postgres,postmaster', '-o', 'pid='],
                                            cap=16384, accepted=(0, 1))
              if status != 'COMPLETE':
                  return {'status': status}
              pids = (raw or b'').split()
              if len(pids) > MAX_ENTRIES or any(re.fullmatch(rb'[0-9]+', pid) is None for pid in pids):
                  return {'status': 'UNAVAILABLE'}
              return {'status': 'COMPLETE', 'count': len(set(pids))}


          def preservation_tools():
              import shutil
              return {name: shutil.which(name) is not None for name in
                      ('openssl', 'gpg', 'age', 'tar', 'rsync', 'cp',
                       'pg_controldata', 'pg_checksums', 'postgres', 'busctl')}


          def main(root):
              restart = restart_inventory(root)
              backup = backup_inventory('/var/lib/pc-release-authority/backups')
              volumes = volume_inventory(root)
              for key, value in (('STARTUP_POLICY_PREFLIGHT', restart),
                                 ('LOCAL_BACKUP_METADATA', backup),
                                 ('VOLUME_LAYOUT_PREFLIGHT', volumes),
                                 ('DOCKER_STARTUP_WINDOW', startup_window()),
                                 ('HOST_POSTGRES_PROCESSES', host_postgres_processes()),
                                 ('PRESERVATION_TOOLS', preservation_tools()),
                                 ('VOLUME_CAPACITY_PROFILE', volume_capacity(root))):
                  print(key + '=' + json.dumps(value, sort_keys=True, separators=(',', ':')))
              print('STARTUP_AUTHORIZATION=NOT_GRANTED')
              print('EXTERNAL_BACKUP_EVIDENCE=NOT_COLLECTED')
              print('RESTORE_VERIFICATION=NOT_PERFORMED')


          if __name__ == '__main__':
              main(sys.argv[1])
          PY_PRESERVATION_PREFLIGHT
          )"
          printf '%s\n' "$preservation_preflight_script" > "$EVIDENCE_DIR/preservation-preflight.py"

      - name: Prepare bounded capacity profile payload
        shell: bash
        run: |
          set -Eeuo pipefail
          capacity_profile_script="$(cat <<'PY_CAPACITY_PROFILE'
          CAPACITY_ENTRY_LIMIT = 200000
          CAPACITY_SECONDS = 10
          CAPACITY_DEPTH_LIMIT = 64


          def volume_capacity(root):
              import time
              result = {'status': 'UNAVAILABLE', 'volumes': 0, 'entries': 0, 'files': 0,
                        'directories': 0, 'logical_bytes': 0, 'allocated_bytes': 0,
                        'symlinks': 0, 'special_entries': 0, 'cross_device_entries': 0,
                        'separate_filesystem_volumes': 0, 'completed_volumes': 0,
                        'profile_complete': False, 'reason': 'NOT_COLLECTED'}
              deadline = time.monotonic() + CAPACITY_SECONDS
              root_fd = volumes_fd = None

              def unchanged(before, after):
                  return all(getattr(before, key) == getattr(after, key) for key in
                             ('st_dev', 'st_ino', 'st_mode', 'st_uid', 'st_gid',
                              'st_mtime_ns', 'st_ctime_ns'))

              def within_time():
                  if time.monotonic() > deadline:
                      raise ValueError('TIME_LIMIT')

              def visit(fd, depth, device):
                  within_time()
                  if depth > CAPACITY_DEPTH_LIMIT:
                      raise ValueError('DEPTH_LIMIT')
                  before = os.fstat(fd)
                  # Capacity has its own existing global entry/time/depth budget.
                  # The forensic names() cap must not truncate a wide data directory.
                  with os.scandir(fd) as entries:
                      for entry in entries:
                          within_time()
                          if result['entries'] >= CAPACITY_ENTRY_LIMIT:
                              raise ValueError('ENTRY_LIMIT')
                          result['entries'] += 1
                          info = os.stat(entry.name, dir_fd=fd, follow_symlinks=False)
                          if info.st_dev != device:
                              result['cross_device_entries'] += 1
                          elif stat.S_ISLNK(info.st_mode):
                              result['symlinks'] += 1
                          elif stat.S_ISDIR(info.st_mode):
                              child = checked_directory(entry.name, fd, allow_data_owner=True)
                              try:
                                  if not unchanged(info, os.fstat(child)):
                                      raise ValueError('DIRECTORY_CHANGED')
                                  result['directories'] += 1
                                  visit(child, depth + 1, device)
                              finally:
                                  os.close(child)
                          elif stat.S_ISREG(info.st_mode):
                              result['files'] += 1
                              result['logical_bytes'] += info.st_size
                              result['allocated_bytes'] += info.st_blocks * 512
                          else:
                              result['special_entries'] += 1
                  within_time()
                  if not unchanged(before, os.fstat(fd)):
                      raise ValueError('DIRECTORY_CHANGED')

              try:
                  root_fd = absolute_directory(root)
                  volumes_fd = checked_directory('volumes', root_fd)
                  volumes_before = os.fstat(volumes_fd)
                  root_before = os.fstat(root_fd)
                  for name in names(volumes_fd):
                      within_time()
                      if name in ('metadata.db', 'backingFsBlockDev'):
                          continue
                      volume_fd = data_fd = None
                      try:
                          volume_fd = checked_directory(name, volumes_fd)
                          volume_before = os.fstat(volume_fd)
                          data_fd = checked_directory('_data', volume_fd, allow_data_owner=True)
                          device = os.fstat(data_fd).st_dev
                          result['separate_filesystem_volumes'] += device != os.fstat(root_fd).st_dev
                          result['volumes'] += 1
                          visit(data_fd, 0, device)
                          if not unchanged(volume_before, os.fstat(volume_fd)):
                              raise ValueError('DIRECTORY_CHANGED')
                          result['completed_volumes'] += 1
                      finally:
                          for fd in (data_fd, volume_fd):
                              if fd is not None:
                                  os.close(fd)
                  if (not unchanged(volumes_before, os.fstat(volumes_fd)) or
                          not unchanged(root_before, os.fstat(root_fd))):
                      raise ValueError('DIRECTORY_CHANGED')
                  if any(result[key] for key in ('symlinks', 'special_entries', 'cross_device_entries')):
                      raise ValueError('UNSUPPORTED_ENTRIES')
                  result.update(status='METADATA_ONLY', profile_complete=True, reason='COMPLETE')
              except ValueError as error:
                  result['status'] = 'LIMIT_OR_UNTRUSTED'
                  code = str(error)
                  result['reason'] = code if code in (
                      'TIME_LIMIT', 'ENTRY_LIMIT', 'DEPTH_LIMIT', 'DIRECTORY_CHANGED',
                      'UNSUPPORTED_ENTRIES') else 'UNTRUSTED_DIRECTORY'
              except (OSError, TypeError):
                  result['status'] = 'UNAVAILABLE'
                  result['reason'] = 'FILESYSTEM_UNAVAILABLE'
              finally:
                  for fd in (volumes_fd, root_fd):
                      if fd is not None:
                          os.close(fd)
              return result


          PY_CAPACITY_PROFILE
          )"
          printf '%s\n' "$capacity_profile_script" > "$EVIDENCE_DIR/capacity-profile.py"
          python3 - "$EVIDENCE_DIR/preservation-preflight.py" "$EVIDENCE_DIR/capacity-profile.py" <<'PY_ASSEMBLE'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          base = path.read_text()
          capacity = pathlib.Path(sys.argv[2]).read_text()
          marker = "if __name__ == '__main__':"
          if base.count(marker) != 1:
              raise SystemExit('PRESERVATION_PAYLOAD_MARKER')
          complete = base.replace(marker, capacity + '\n\n' + marker)
          compile(complete, '<complete preservation preflight>', 'exec')
          path.write_text(complete)
          PY_ASSEMBLE

      - name: Collect read-only storage and runtime evidence
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          remote_script="$(cat <<'REMOTE'
          set -Eeuo pipefail
          echo 'SCHEMA=pc.production-docker-headroom-diagnostic.v1'
          echo 'MUTATION_MODE=READ_ONLY'
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          command -v python3 >/dev/null 2>&1
          printf 'DOCKER_ROOT=%s\n' "$docker_root"
          docker info --format 'DOCKER_SERVER_VERSION={{.ServerVersion}}
          DOCKER_STORAGE_DRIVER={{.Driver}}
          DOCKER_CPUS={{.NCPU}}
          DOCKER_MEMORY_BYTES={{.MemTotal}}'
          read -r fs total used avail pct mount < <(df -Pk "$docker_root" | awk 'NR==2{print $1,$2,$3,$4,$5,$6}')
          printf 'DOCKER_FS_DEVICE=%s\nDOCKER_FS_TOTAL_KB=%s\nDOCKER_FS_USED_KB=%s\nDOCKER_FS_AVAILABLE_KB=%s\nDOCKER_FS_USED_PERCENT=%s\nDOCKER_FS_MOUNT=%s\n' "$fs" "$total" "$used" "$avail" "$pct" "$mount"
          read -r ifs itotal iused iavail ipct imount < <(df -Pi "$docker_root" | awk 'NR==2{print $1,$2,$3,$4,$5,$6}')
          printf 'DOCKER_FS_INODES_TOTAL=%s\nDOCKER_FS_INODES_USED=%s\nDOCKER_FS_INODES_AVAILABLE=%s\nDOCKER_FS_INODES_USED_PERCENT=%s\n' "$itotal" "$iused" "$iavail" "$ipct"
          if command -v findmnt >/dev/null 2>&1; then
            printf 'DOCKER_FS_FINDMNT=%s\n' "$(findmnt -n -T "$docker_root" -o SOURCE,FSTYPE,TARGET,OPTIONS | tr '\n' ' ')"
          fi
          if command -v lsblk >/dev/null 2>&1 && block_devices="$(lsblk -b -n -r -o NAME,TYPE,SIZE,FSTYPE 2>/dev/null)"; then
            printf '%s\n' "$block_devices" | sed 's/^/BLOCK_DEVICE_RECORD=/'
          else
            echo 'BLOCK_DEVICE_INVENTORY=unknown'
          fi

          containers="$(docker ps -aq --no-trunc | wc -l | tr -d '[:space:]')"
          volumes="$(docker volume ls -q | wc -l | tr -d '[:space:]')"
          networks="$(docker network ls -q | wc -l | tr -d '[:space:]')"
          images="$(docker image ls -q --no-trunc | sort -u | wc -l | tr -d '[:space:]')"
          printf 'DOCKER_OBJECT_COUNTS=containers:%s,volumes:%s,networks:%s,images:%s\n' "$containers" "$volumes" "$networks" "$images"

          mapfile -t api_ids < <(docker ps -q --no-trunc --filter 'label=com.docker.compose.service=api')
          mapfile -t web_ids < <(docker ps -q --no-trunc --filter 'label=com.docker.compose.service=web')
          printf 'RUNTIME_API_COUNT=%s\nRUNTIME_WEB_COUNT=%s\n' "${#api_ids[@]}" "${#web_ids[@]}"
          if (( ${#api_ids[@]} == 1 )); then
            cid="${api_ids[0]}"
            docker inspect --format 'RUNTIME_API_ID={{.Id}}
          RUNTIME_API_IMAGE_ID={{.Image}}
          RUNTIME_API_REVISION={{index .Config.Labels "org.opencontainers.image.revision"}}
          RUNTIME_API_CREATED={{.Created}}
          RUNTIME_API_STARTED_AT={{.State.StartedAt}}
          RUNTIME_API_STATUS={{.State.Status}}' "$cid"
          fi
          if (( ${#web_ids[@]} == 1 )); then
            cid="${web_ids[0]}"
            docker inspect --format 'RUNTIME_WEB_ID={{.Id}}
          RUNTIME_WEB_IMAGE_ID={{.Image}}
          RUNTIME_WEB_REVISION={{index .Config.Labels "org.opencontainers.image.revision"}}
          RUNTIME_WEB_CREATED={{.Created}}
          RUNTIME_WEB_STARTED_AT={{.State.StartedAt}}
          RUNTIME_WEB_STATUS={{.State.Status}}' "$cid"
          fi

          # Reconcile daemon inventory with surviving metadata before any recovery.
          container_forensics_script="$(cat <<'PY_CONTAINER_FORENSICS'
          import json
          import os
          import re
          import stat
          import subprocess
          import sys

          MAX_METADATA_BYTES = 4 * 1024 * 1024
          MAX_CONTAINERS = 2048
          ID_PATTERN = re.compile(r'[0-9a-f]{64}')
          IMAGE_PATTERN = re.compile(r'sha256:[0-9a-f]{64}')
          SERVICES = frozenset(('api', 'web', 'postgres', 'postgresql', 'redis', 'minio',
                                'caddy', 'kafka', 'zookeeper', 'outbox-worker',
                                'auth-mail-worker', 'migration', 'migrations', 'pgbouncer'))


          def read_metadata(directory_fd, name):
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_NOATIME,
                           dir_fd=directory_fd)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_size > MAX_METADATA_BYTES:
                      raise ValueError('INVALID_METADATA')
                  with os.fdopen(fd, 'rb', closefd=False) as stream:
                      data = stream.read(MAX_METADATA_BYTES + 1)
                  after = os.fstat(fd)
                  if len(data) > MAX_METADATA_BYTES or (
                      before.st_size, before.st_mtime_ns, before.st_ctime_ns
                  ) != (after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError('UNSTABLE_METADATA')
                  item = json.loads(data)
                  if not isinstance(item, dict):
                      raise ValueError('INVALID_METADATA')
                  return item
              finally:
                  os.close(fd)


          def metadata_inventory(root):
              result = {'status': 'UNAVAILABLE', 'directories': 0, 'valid': 0,
                        'rejected': 0, 'unknown_images': 0, 'volume_mounts': 0,
                        'image_refs': [], 'services': []}
              no_atime = getattr(os, 'O_NOATIME', None)
              if no_atime is None:
                  return result
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | no_atime
              root_fd = containers_fd = None
              try:
                  root_fd = os.open(root, flags)
                  containers_fd = os.open('containers', flags, dir_fd=root_fd)
                  # Bounded enumeration; absent/inaccessible metadata never means zero containers.
                  with os.scandir(containers_fd) as entries:
                      names = []
                      for entry in entries:
                          if len(names) == MAX_CONTAINERS:
                              result['status'] = 'LIMIT_EXCEEDED'
                              return result
                          names.append(entry.name)
                  for name in sorted(names):
                      if ID_PATTERN.fullmatch(name) is None:
                          result['rejected'] += 1
                          continue
                      result['directories'] += 1
                      child_fd = None
                      try:
                          child_fd = os.open(name, flags, dir_fd=containers_fd)
                          item = read_metadata(child_fd, 'config.v2.json')
                          if item.get('ID') != name:
                              raise ValueError('IDENTITY_MISMATCH')
                          image = item.get('Image')
                          if isinstance(image, str) and IMAGE_PATTERN.fullmatch(image):
                              result['image_refs'].append((name, image))
                          else:
                              result['unknown_images'] += 1
                          config = item.get('Config')
                          labels = config.get('Labels') if isinstance(config, dict) else None
                          service = labels.get('com.docker.compose.service') if isinstance(labels, dict) else None
                          service = service if isinstance(service, str) and service in SERVICES else 'other'
                          result['services'].append((name, service))
                          mounts = item.get('MountPoints')
                          if isinstance(mounts, dict):
                              result['volume_mounts'] += sum(
                                  isinstance(value, dict) and value.get('Type') == 'volume'
                                  for value in mounts.values())
                          result['valid'] += 1
                      except (OSError, ValueError, TypeError, RecursionError):
                          result['rejected'] += 1
                      finally:
                          if child_fd is not None:
                              os.close(child_fd)
                  result['status'] = 'PARTIAL' if result['rejected'] or result['unknown_images'] else 'COMPLETE'
              except (OSError, ValueError, TypeError):
                  result['status'] = 'UNAVAILABLE'
              finally:
                  if containers_fd is not None:
                      os.close(containers_fd)
                  if root_fd is not None:
                      os.close(root_fd)
              return result


          def journal_classification(payload):
              # Only closed-vocabulary counts leave this function; raw lines may contain secrets.
              result = {'ENOSPC': 0, 'CONTAINER_RESTORE_ERROR': 0,
                        'CONTAINER_RESTORE_ENOSPC': 0, 'METADATA_ERROR': 0,
                        'CORRUPTION_INDICATOR': 0}
              for line in payload.splitlines():
                  line = line.lower()
                  enospc = 'no space left on device' in line or 'enospc' in line
                  restore = 'container' in line and any(value in line for value in (
                      'failed to load', 'error loading', 'error restoring', 'failed to restore'))
                  result['ENOSPC'] += enospc
                  result['CONTAINER_RESTORE_ERROR'] += restore
                  result['CONTAINER_RESTORE_ENOSPC'] += enospc and restore
                  result['METADATA_ERROR'] += any(value in line for value in (
                      'config.v2.json', 'hostconfig.json')) and any(value in line for value in (
                          'error', 'failed', 'invalid', 'cannot', 'unable'))
                  result['CORRUPTION_INDICATOR'] += any(value in line for value in (
                      'database corruption', 'invalid database', 'checksum mismatch',
                      'invalid page', 'unexpected end of json'))
              return result


          def collect_journal():
              try:
                  child = subprocess.Popen(
                      ['journalctl', '--unit=docker.service', '--lines=400', '--no-pager',
                       '--output=cat'], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL)
                  try:
                      # Stop a local reader at the cap; never signal the Docker daemon.
                      import selectors
                      import time
                      payload = bytearray()
                      deadline = time.monotonic() + 10
                      with selectors.DefaultSelector() as selector:
                          selector.register(child.stdout, selectors.EVENT_READ)
                          while time.monotonic() < deadline:
                              ready = selector.select(max(0, deadline - time.monotonic()))
                              if not ready:
                                  return 'TIMEOUT', None
                              chunk = os.read(child.stdout.fileno(), 65536)
                              if not chunk:
                                  code = child.wait(timeout=max(0.1, deadline - time.monotonic()))
                                  if code != 0:
                                      return 'UNAVAILABLE', None
                                  return 'COMPLETE', journal_classification(payload.decode('utf-8', errors='replace'))
                              payload.extend(chunk)
                              if len(payload) > MAX_METADATA_BYTES:
                                  return 'LIMIT_EXCEEDED', None
                          return 'TIMEOUT', None
                  finally:
                      if child.poll() is None:
                          child.kill()
                      child.wait(timeout=2)
                      child.stdout.close()
              except (OSError, subprocess.SubprocessError):
                  return 'UNAVAILABLE', None


          def main(root):
              result = metadata_inventory(root)
              print('CONTAINER_METADATA_STATUS=' + result['status'])
              for field in ('directories', 'valid', 'rejected', 'unknown_images', 'volume_mounts'):
                  print('CONTAINER_METADATA_' + field.upper() + '=' + str(result[field]))
              for cid, image in result['image_refs']:
                  print('ON_DISK_CONTAINER_IMAGE_REF=' + cid + '|' + image)
              for cid, service in result['services']:
                  print('ON_DISK_CONTAINER_SERVICE=' + cid + '|' + service)
              status, counts = collect_journal()
              print('DOCKER_JOURNAL_STATUS=' + status)
              if counts is not None:
                  for key, value in counts.items():
                      print('DOCKER_JOURNAL_' + key + '=' + str(value))
              # Directory/volume existence and log indicators are not data-integrity acceptance.
              print('VOLUME_DATA_INTEGRITY=NOT_ATTESTED')
              print('BACKUP_RESTORE_APPLICABILITY=NOT_ATTESTED')


          if __name__ == '__main__':
              main(sys.argv[1])
          PY_CONTAINER_FORENSICS
          )"
          python3 -c "$container_forensics_script" "$docker_root"

          printf '%s' "$PRESERVATION_PREFLIGHT_B64" | base64 --decode | python3 - "$docker_root"

          # Engine size queries can traverse protected volume/rootfs directories.
          echo 'DOCKER_DF_STATUS=NOT_COLLECTED_ATIME_PRESERVATION'
          echo 'CONTAINER_SIZE_STATUS=NOT_COLLECTED_ATIME_PRESERVATION'

          image_metadata_script="$(cat <<'PY_IMAGE_METADATA'
          import json
          import re
          import sys

          def invalid():
              raise SystemExit('INVALID_IMAGE_METADATA')

          try:
              records = json.load(sys.stdin)
          except (ValueError, TypeError):
              invalid()
          expected_id = sys.argv[1]
          if not isinstance(records, list) or len(records) != 1 or not isinstance(records[0], dict):
              invalid()
          item = records[0]
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', expected_id) or item.get('Id') != expected_id:
              invalid()
          size = item.get('Size')
          if type(size) is not int or size < 0:
              invalid()
          refs = {}
          for key in ('RepoTags', 'RepoDigests'):
              values = item.get(key)
              values = [] if values is None else values
              if not isinstance(values, list) or any(not isinstance(value, str) for value in values):
                  invalid()
              refs[key] = values
          config = item.get('Config')
          config = config if isinstance(config, dict) else {}
          labels = config.get('Labels')
          labels = labels if isinstance(labels, dict) else {}
          revision = labels.get('org.opencontainers.image.revision')
          revision = revision if isinstance(revision, str) and re.fullmatch(r'[0-9a-f]{40}', revision) else 'unknown'
          created = item.get('Created')
          created = created if isinstance(created, str) and re.fullmatch(r'[0-9T:Z.+-]+', created) else 'unknown'
          print(f"IMAGE_RECORD={expected_id}|{size}|{json.dumps(refs['RepoTags'])}|{created}|{revision}")
          print(f"IMAGE_DIGEST_RECORD={expected_id}|{json.dumps(refs['RepoDigests'])}")
          PY_IMAGE_METADATA
          )"
          while IFS= read -r image_id; do
            [[ -n "$image_id" ]] || continue
            docker image inspect "$image_id" | python3 -c "$image_metadata_script" "$image_id"
          done < <(docker image ls -q --no-trunc | sort -u)

          while IFS= read -r cid; do
            [[ -n "$cid" ]] || continue
            docker inspect --format 'CONTAINER_IMAGE_REF={{.Id}}|{{.Image}}' "$cid"
            log_path="$(docker inspect --format '{{.LogPath}}' "$cid" 2>/dev/null || true)"
            if [[ -n "$log_path" && -f "$log_path" ]]; then
              printf 'CONTAINER_LOG_BYTES=%s|%s\n' "$(stat -c '%s' "$log_path")" "$cid"
            fi
          done < <(docker ps -aq --no-trunc)

          # Do not recursively walk customer data or Docker/backup directories.
          echo 'RECURSIVE_STORAGE_USAGE=NOT_COLLECTED_ATIME_PRESERVATION'
          echo 'BUILDER_DU_AVAILABLE=0'

          if command -v lsof >/dev/null 2>&1; then
            echo 'LSOF_AVAILABLE=1'
            if lsof_output="$(lsof -nP +L1 2>/dev/null)"; then
              echo 'LSOF_COLLECTION_STATUS=complete'
              printf '%s\n' "$lsof_output" | awk 'NR>1 && $7 ~ /^[0-9]+$/ {count += 1; total += $7} END {printf "DELETED_OPEN_FILE_COUNT=%d\nDELETED_OPEN_FILE_BYTES=%.0f\n", count, total}'
            else
              echo 'LSOF_COLLECTION_STATUS=unknown'
              echo 'DELETED_OPEN_FILE_COUNT=unknown'
              echo 'DELETED_OPEN_FILE_BYTES=unknown'
            fi
          else
            echo 'LSOF_AVAILABLE=0'
            echo 'DELETED_OPEN_FILE_COUNT=unknown'
            echo 'DELETED_OPEN_FILE_BYTES=unknown'
          fi
          echo 'PROBE_COMPLETE=1'
          REMOTE
          )"
          preservation_source_b64="$(base64 -w0 "$EVIDENCE_DIR/preservation-preflight.py")"
          [[ "$preservation_source_b64" =~ ^[A-Za-z0-9+/=]+$ ]]
          remote_script="PRESERVATION_PREFLIGHT_B64='$preservation_source_b64'"$'\n'"$remote_script"

          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PROD_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$PROD_HOST" 'bash -s' \
            > "$EVIDENCE_DIR/remote-output.txt" 2> "$EVIDENCE_DIR/remote-stderr.txt" <<< "$remote_script"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/remote-exit-code.txt"
          (( rc == 0 ))
          grep -Fxq 'MUTATION_MODE=READ_ONLY' "$EVIDENCE_DIR/remote-output.txt"
          grep -Fxq 'PROBE_COMPLETE=1' "$EVIDENCE_DIR/remote-output.txt"
          echo 'complete=true' >> "$GITHUB_OUTPUT"

      - name: Cleanup protected transport
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Build bounded diagnostic summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('artifacts/production-docker-headroom-diagnostic')
          raw = root / 'remote-output.txt'
          lines = raw.read_text(encoding='utf-8', errors='replace').splitlines() if raw.exists() else []
          scalar = {}
          images = []
          du = []
          logs = []
          docker_df = []
          for line in lines:
              if line.startswith('IMAGE_RECORD='):
                  parts = line.split('=', 1)[1].split('|', 4)
                  if len(parts) >= 2:
                      try: size = int(parts[1])
                      except ValueError: size = 0
                      images.append((size, parts[0], parts[2] if len(parts) > 2 else ''))
                  continue
              if line.startswith(('DU_TOTAL_BYTES=', 'DU_DOCKER_CHILD_BYTES=', 'DU_VAR_CHILD_BYTES=', 'DU_SRV_CHILD_BYTES=')):
                  payload = line.split('=', 1)[1]
                  if '|' in payload:
                      size, path = payload.split('|', 1)
                      try: du.append((int(size), path))
                      except ValueError: pass
                  continue
              if line.startswith('CONTAINER_LOG_BYTES='):
                  payload = line.split('=', 1)[1]
                  if '|' in payload:
                      size, cid = payload.split('|', 1)
                      try: logs.append((int(size), cid[:12]))
                      except ValueError: pass
                  continue
              if line.startswith('DOCKER_DF_JSON='):
                  try: docker_df.append(json.loads(line.split('=', 1)[1]))
                  except json.JSONDecodeError: pass
                  continue
              if '=' in line and not line.startswith(('DOCKER_DF_VERBOSE_', 'BUILDER_')):
                  k, v = line.split('=', 1)
                  if k and len(k) < 80:
                      scalar[k] = v

          images.sort(reverse=True)
          du_unique = {}
          for size, path in du:
              du_unique[path] = max(size, du_unique.get(path, 0))
          top_du = sorted(((v, k) for k, v in du_unique.items()), reverse=True)[:10]
          logs.sort(reverse=True)

          def gib(value):
              try: return f"{int(value)/(1024**3):.2f} GiB"
              except Exception: return 'unknown'
          def mib_from_kb(value):
              try: return f"{int(value)/1024:.1f} MiB"
              except Exception: return 'unknown'

          def preflight_summary(key):
              try:
                  value = json.loads(scalar.get(key, 'null'))
                  if not isinstance(value, dict):
                      return 'not-collected'
                  if key == 'STARTUP_POLICY_PREFLIGHT':
                      records = value.get('records', [])
                      counts = {policy: sum(row.get('policy') == policy for row in records)
                                for policy in ('no', 'always', 'unless-stopped', 'on-failure')}
                      value = {'status': value.get('status'), 'records': len(records),
                               'rejected': value.get('rejected'),
                               'restart_policy_counts': counts,
                               'watchtower_count': sum(row.get('watchtower') is True for row in records),
                               'watchtower_auto_restart_count': sum(
                                   row.get('watchtower') is True and row.get('policy') != 'no'
                                   for row in records)}
                  elif key == 'VOLUME_LAYOUT_PREFLIGHT':
                      layouts = value.get('postgres_layouts', [])
                      majors = sorted({row['major'] for row in layouts})
                      value = {field: value.get(field) for field in
                               ('status', 'directories', 'rejected', 'unsupported_or_non_postgres')}
                      value.update(postgres_layout_count=len(layouts),
                                   postgres_major_versions=majors[:10],
                                   omitted_major_versions=max(0, len(majors) - 10),
                                   pid_file_count=sum(row.get('pid_file_present') is True for row in layouts))
                  elif key == 'LOCAL_BACKUP_METADATA':
                      value = {field: value.get(field) for field in
                               ('status', 'files', 'bytes', 'dumps', 'checksums', 'other',
                                'unsafe_permissions', 'unsafe_directory_permissions', 'newest_mtime')}
                  return json.dumps(value, sort_keys=True, separators=(',', ':'))
              except (ValueError, TypeError, KeyError, AttributeError):
                  return 'invalid-observation'

          target = (root / 'target-sha.txt').read_text().strip() if (root / 'target-sha.txt').exists() else 'unknown'
          body = [
              '## Production Docker headroom read-only diagnostic',
              '',
              f"- exact main: `{target}`;",
              f"- mutation mode: `{scalar.get('MUTATION_MODE', 'not-proven')}`;",
              f"- Docker free: `{mib_from_kb(scalar.get('DOCKER_FS_AVAILABLE_KB'))}`; filesystem used: `{scalar.get('DOCKER_FS_USED_PERCENT', 'unknown')}`; inodes used: `{scalar.get('DOCKER_FS_INODES_USED_PERCENT', 'unknown')}`;",
              f"- Docker driver/root: `{scalar.get('DOCKER_STORAGE_DRIVER', 'unknown')}` / `{scalar.get('DOCKER_ROOT', 'unknown')}`;",
              f"- objects: `{scalar.get('DOCKER_OBJECT_COUNTS', 'unknown')}`;",
              f"- API: revision `{scalar.get('RUNTIME_API_REVISION', 'unknown')}`, status `{scalar.get('RUNTIME_API_STATUS', 'unknown')}`, started `{scalar.get('RUNTIME_API_STARTED_AT', 'unknown')}`;",
              f"- Web: revision `{scalar.get('RUNTIME_WEB_REVISION', 'unknown')}`, status `{scalar.get('RUNTIME_WEB_STATUS', 'unknown')}`, started `{scalar.get('RUNTIME_WEB_STARTED_AT', 'unknown')}`;",
              f"- deleted-open files: `{scalar.get('DELETED_OPEN_FILE_COUNT', 'unknown')}` / `{gib(scalar.get('DELETED_OPEN_FILE_BYTES'))}`;",
              f"- on-disk container metadata: `{scalar.get('CONTAINER_METADATA_STATUS', 'not-collected')}`; directories `{scalar.get('CONTAINER_METADATA_DIRECTORIES', 'unknown')}`; valid `{scalar.get('CONTAINER_METADATA_VALID', 'unknown')}`; unresolved image IDs `{scalar.get('CONTAINER_METADATA_UNKNOWN_IMAGES', 'unknown')}`; rejected `{scalar.get('CONTAINER_METADATA_REJECTED', 'unknown')}`;",
              f"- Docker journal classification: `{scalar.get('DOCKER_JOURNAL_STATUS', 'not-collected')}`; restore errors `{scalar.get('DOCKER_JOURNAL_CONTAINER_RESTORE_ERROR', 'unknown')}`; restore+ENOSPC `{scalar.get('DOCKER_JOURNAL_CONTAINER_RESTORE_ENOSPC', 'unknown')}`; corruption indicators `{scalar.get('DOCKER_JOURNAL_CORRUPTION_INDICATOR', 'unknown')}`;",
              f"- Startup policy preflight: `{preflight_summary('STARTUP_POLICY_PREFLIGHT')}`;",
              f"- Local backup file metadata: `{preflight_summary('LOCAL_BACKUP_METADATA')}`;",
              f"- PostgreSQL volume layout observation: `{preflight_summary('VOLUME_LAYOUT_PREFLIGHT')}`;",
              f"- Docker startup window: `{scalar.get('DOCKER_STARTUP_WINDOW', 'not-collected')}`;",
              f"- Host PostgreSQL processes: `{scalar.get('HOST_POSTGRES_PROCESSES', 'not-collected')}`;",
              f"- Preservation tool availability: `{scalar.get('PRESERVATION_TOOLS', 'not-collected')}`;",
              f"- Volume capacity metadata: `{scalar.get('VOLUME_CAPACITY_PROFILE', 'not-collected')}`;",
              '- Volume data integrity and backup/restore applicability: `NOT_ATTESTED`; local file metadata and structural observations do not verify a backup or authorize startup.',
              '- External backup evidence: `NOT_COLLECTED`; restore verification: `NOT_PERFORMED`.',
              '- Recursive disk/rootfs/build-cache size queries: `NOT_COLLECTED_ATIME_PRESERVATION`; full structured preflight records remain only in the artifact.',

              '',
              '**Largest measured storage consumers:**',
          ]
          for size, path in top_du[:8]:
              body.append(f"- `{path}` — `{gib(size)}`")
          if images:
              body += ['', '**Largest Docker image objects:**']
              for size, image_id, tags in images[:6]:
                  body.append(f"- `{image_id[:19]}` — `{gib(size)}` — `{tags[:160]}`")
          if logs:
              body += ['', '**Largest container JSON logs:**']
              for size, cid in logs[:5]:
                  body.append(f"- `{cid}` — `{gib(size)}`")
          if docker_df:
              body += ['', '**Docker system df:**']
              for row in docker_df:
                  body.append(f"- `{json.dumps(row, ensure_ascii=True, sort_keys=True)[:500]}`")
          body += ['', 'This probe performs no Docker deletion/prune, container/service restart, database write or customer-data mutation.']
          (root / 'issue-record.md').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY

      - name: Publish diagnostic evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment "$AUTHORITY_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/issue-record.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-docker-headroom-diagnostic-${{ github.run_id }}
          path: artifacts/production-docker-headroom-diagnostic
          if-no-files-found: error
          retention-days: 90
          compression-level: 0


  inspect:
    name: Inspect stopped recovery metadata without starting services
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.body == '/production inspect-stopped-recovery current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    concurrency:
      group: production-full-stack-exact-sha
      cancel-in-progress: false
      queue: max
    env:
      EVIDENCE_DIR: artifacts/stopped-recovery-inspection
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact inspection main and initialize receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' 'Stopped recovery inspection: UNKNOWN; no validated host result. No startup or restore performed.' > "$EVIDENCE_DIR/issue-record.md"
          printf '%s\n' '{"passed":false,"status":"UNKNOWN","runtimeRestored":false,"startupAuthorized":false}' > "$EVIDENCE_DIR/inspection.json"
          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_sha" == "$GITHUB_SHA" && "$target_sha" == "$GITHUB_WORKFLOW_SHA" && "$target_sha" == "$(git rev-parse HEAD)" ]]
          read -r state comments is_pr < <(gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTHORITY_ISSUE_NUMBER}" --jq '[.state,.comments,has("pull_request")] | @tsv')
          [[ "$state" == open && "$comments" =~ ^[0-9]+$ && "$is_pr" == false ]]
          (( comments < 2500 ))
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          printf '%s\n' "$target_sha" > "$EVIDENCE_DIR/target-sha.txt"

      - name: Resolve protected key and pinned VPS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'Canonical VPS mismatch.' >&2; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo 'Protected production principal is missing or invalid.' >&2; exit 11; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Pinned host fingerprint is required.' >&2; exit 13; }
          domain_ips="$(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u || true)"
          grep -Fxq "$DEFAULT_HOST" <<< "$domain_ips"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            ssh-keygen -lf "$pub" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo 'No valid protected SSH private key is configured.' >&2
            exit 14
          }

          scan="$(mktemp)"; match="$(mktemp)"
          pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo 'Pinned host key mismatch after bounded retries.' >&2; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PROD_HOST=$host" >> "$GITHUB_ENV"
          echo "PROD_PORT=$port" >> "$GITHUB_ENV"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$host" \
            'set -Eeuo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"

