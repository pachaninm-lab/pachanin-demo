              complete = (failed - {'errorCode'}) | {'targetSha', 'runId', 'archive', 'volumes', 'images', 'bindings',
                                                    'capacity', 'processes', 'databaseIntegrity'}
              require(set(value) in (failed, complete) and value['schemaVersion'] == SCHEMA and
                      value['runtimeRestored'] is False and value['startupAuthorized'] is False,
                      'OUTPUT_SCHEMA')
              if set(value) == failed:
