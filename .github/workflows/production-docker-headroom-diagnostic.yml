          def mem_available():
              # procfs system metadata, never process environment or command lines.
              with open('/proc/meminfo', 'rb') as handle:
                  raw = handle.read(16385)
              require(len(raw) <= 16384, 'MEMINFO_BOUND')
              match = re.search(rb'^MemAvailable:\s+([0-9]+) kB$', raw, re.M)
              require(match is not None, 'MEMINFO_SCHEMA')
              return integer(int(match[1]) * 1024)


          def process_counts():
              counts = {'postgres': 0, 'caddy': 0}
              started = time.monotonic()
              names = os.listdir('/proc')
              require(len(names) <= 32768, 'PROCESS_BOUND')
              for name in names:
                  require(time.monotonic() - started <= 5, 'PROCESS_BOUND')
                  if not name.isdecimal():
                      continue
                  try:
                      with open('/proc/' + name + '/comm', 'rb') as handle:
                          comm = handle.read(64).strip()
                  except (FileNotFoundError, ProcessLookupError):
                      continue
                  if comm in (b'postgres', b'postmaster'):
                      counts['postgres'] += 1
                  elif comm == b'caddy':
                      counts['caddy'] += 1
              return counts


          def inspect(target, run):
              require(HEX.fullmatch(target) and re.fullmatch('[0-9]{1,20}', run), 'INVOCATION')
              copied, device = archive()
              info = api('/info')
              containers = api('/containers/json?all=true')
              require(type(info) is dict and info.get('DockerRootDir') == DOCKER_ROOT and
                      type(containers) is list and not containers and info.get('Containers') == 0,
                      'ENGINE_NOT_EMPTY')
              records = metadata()
              inventory = api('/volumes')
              require(type(inventory) is dict and type(inventory.get('Volumes')) is list, 'VOLUME_API')
              names = [item['Name'] for item in inventory['Volumes']]
              profile, pg_path, roots, data_device, tokens = volume_profile(names)
              images = {image: image_metadata(api('/images/' + image + '/json'), image)
                        for image in sorted({record['Image'] for record in records})}
              bound = bindings(records, roots, pg_path, images)
              # Recheck metadata identities after the bounded inspection; no atomic-snapshot claim.
              require(records == metadata() and api('/containers/json?all=true') == [], 'RUNTIME_DRIFT')
              deadline = time.monotonic() + 30
              for path, token in tokens:
                  require(time.monotonic() <= deadline, 'PROFILE_BOUND')
                  parent, name = path.rsplit('/', 1)
                  fd = open_directory(parent)
                  try:
                      require(signature(os.stat(name, dir_fd=fd, follow_symlinks=False)) == token,
                              'PROFILE_CHANGED')
