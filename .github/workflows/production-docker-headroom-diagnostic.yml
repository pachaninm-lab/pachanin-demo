              finally:
                  os.close(root_fd)


          def volume_profile(names, root=DOCKER_ROOT):
              require(type(names) is list and len(names) == len(set(names)) == 19 and
                      all(type(n) is str and re.fullmatch('[A-Za-z0-9][A-Za-z0-9_.-]{0,254}', n)
                          for n in names), 'VOLUME_NAMES')
              deadline, count = time.monotonic() + 20, 0
              markers, clusters, sizes, roots, tokens = [], [], {}, set(), []
              root_fd = open_directory(root + '/volumes')
              device = os.fstat(root_fd).st_dev

              def visit(fd, private_path, depth):
                  nonlocal count
                  before = os.fstat(fd)
                  require(depth <= 64 and time.monotonic() <= deadline, 'PROFILE_BOUND')
                  require(before.st_dev == device, 'PROFILE_DEVICE')
                  total, allocated = 0, 0
                  with os.scandir(fd) as entries:
                      for entry in entries:
                          count += 1
                          require(count <= MAX_ENTRIES and time.monotonic() <= deadline, 'PROFILE_BOUND')
                          info = entry.stat(follow_symlinks=False)
                          require(info.st_dev == device, 'PROFILE_DEVICE')
                          require(stat.S_ISDIR(info.st_mode) or stat.S_ISREG(info.st_mode), 'PROFILE_TYPE')
                          path = private_path + '/' + entry.name
                          if stat.S_ISDIR(info.st_mode):
                              child = os.open(entry.name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW |
