                      'sourceBytes', 'sourceEntries', 'volumes', 'privateModesVerified',
                      'availableBytes', 'availableInodes'} and copied['ciphertextSha256'] == COPY_SHA and
                      copied['privateModesVerified'] is True and copied['volumes'] == 19, 'OUTPUT_ARCHIVE')
              for key in ('ciphertextBytes', 'sourceBytes', 'sourceEntries', 'availableBytes', 'availableInodes'):
                  integer(copied[key])
              require(0 < copied['ciphertextBytes'] <= MAX_ARCHIVE and
                      copied['sourceBytes'] <= 1024**3 and copied['sourceEntries'] <= MAX_ENTRIES,
                      'OUTPUT_ARCHIVE_BOUND')
              volumes = value['volumes']
              require(type(volumes) is dict and set(volumes) == {'volumes', 'entries', 'logicalBytes',
                      'allocatedBytes', 'postgres'} and volumes['volumes'] == 19, 'OUTPUT_VOLUMES')
              for key in ('entries', 'logicalBytes', 'allocatedBytes'):
                  integer(volumes[key])
              require(volumes['entries'] <= MAX_ENTRIES, 'OUTPUT_ENTRY_BOUND')
              pg = volumes['postgres']
              require(type(pg) is dict and set(pg) == {'major', 'uid', 'gid', 'logicalBytes',
                      'allocatedBytes', 'integrity'} and pg['major'] == 16 and
                      pg['integrity'] == 'NOT_ATTESTED', 'OUTPUT_POSTGRES')
              for key in ('uid', 'gid', 'logicalBytes', 'allocatedBytes'):
                  integer(pg[key])
              images = value['images']
              require(type(images) is list and 1 <= len(images) <= 32, 'OUTPUT_IMAGES')
              image_ids = set()
              for item in images:
                  require(type(item) is dict and set(item) == {'id', 'bytes', 'revision', 'os',
                          'architecture', 'postgresMajor'} and type(item['id']) is str and
                          IMAGE.fullmatch(item['id']) and item['id'] not in image_ids and
                          (item['revision'] is None or type(item['revision']) is str and HEX.fullmatch(item['revision'])) and
                          item['os'] in ('linux', 'windows', 'UNKNOWN') and item['architecture'] in
                          ('amd64', 'arm64', '386', 'arm', 'ppc64le', 's390x', 'UNKNOWN') and
                          (item['postgresMajor'] is None or type(item['postgresMajor']) is int and
                           0 <= item['postgresMajor'] <= 99), 'OUTPUT_IMAGE')
                  integer(item['bytes'])
                  image_ids.add(item['id'])
              bound = value['bindings']
              require(type(bound) is dict and set(bound) == {'services', 'postgresImage',
                      'readWriteBindsOutsideCopy', 'readOnlyBindsOutsideCopy', 'unknownMounts',
                      'composeLabelFilesPresent', 'composeLabelFilesMissing', 'currentComposeParity',
                      'bindContentsPreserved'} and bound['postgresImage'] in image_ids and
                      bound['currentComposeParity'] == 'NOT_ATTESTED' and bound['bindContentsPreserved'] is False,
                      'OUTPUT_BINDINGS')
              for key in ('readWriteBindsOutsideCopy', 'readOnlyBindsOutsideCopy', 'unknownMounts',
                          'composeLabelFilesPresent', 'composeLabelFilesMissing'):
                  integer(bound[key], 4096)
              require(type(bound['services']) is list and len(bound['services']) == len(EXPECTED_REFS),
                      'OUTPUT_SERVICES')
              for service in bound['services']:
                  require(type(service) is dict and set(service) == {'role', 'image', 'volumes'} and
                          service['role'] in ROLES | {'UNKNOWN'} and service['image'] in image_ids,
                          'OUTPUT_SERVICE')
