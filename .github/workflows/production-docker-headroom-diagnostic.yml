                      'readWriteBindsOutsideCopy': rw_binds, 'readOnlyBindsOutsideCopy': ro_binds,
                      'unknownMounts': unknown, 'composeLabelFilesPresent': existing,
                      'composeLabelFilesMissing': missing, 'currentComposeParity': 'NOT_ATTESTED',
                      'bindContentsPreserved': False}



