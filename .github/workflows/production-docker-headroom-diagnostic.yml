          class Connection(http.client.HTTPConnection):
              def connect(self):
                  self.sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  self.sock.settimeout(self.timeout)
                  self.sock.connect('/var/run/docker.sock')


          def api(path):
              require(path in ('/info', '/containers/json?all=true', '/volumes') or
                      re.fullmatch(r'/images/sha256:[0-9a-f]{64}/json', path), 'API_PATH')
              endpoint = os.stat('/var/run/docker.sock', follow_symlinks=False)
              require(stat.S_ISSOCK(endpoint.st_mode) and endpoint.st_uid == 0, 'SOCKET_IDENTITY')
              connection = Connection('localhost', timeout=5)
              try:
                  connection.request('GET', path)
                  response = connection.getresponse()
                  require(response.status == 200, 'API_STATUS')
                  raw = response.read(MAX_BYTES + 1)
