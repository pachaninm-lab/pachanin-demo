              require(type(value['capacity']) is dict and set(value['capacity']) ==
                      {'memAvailableBytes', 'archiveAndDataSameFilesystem'} and
                      type(value['capacity']['archiveAndDataSameFilesystem']) is bool, 'OUTPUT_CAPACITY')
              integer(value['capacity']['memAvailableBytes'])
              require(type(value['processes']) is dict and set(value['processes']) == {'postgres', 'caddy'},
                      'OUTPUT_PROCESSES')
              for count in value['processes'].values():
                  integer(count, 32768)
              require(len(json.dumps(value).encode()) < 32768, 'OUTPUT_BOUND')
              return value


          ERROR_CODES = frozenset(('ARCHIVE_DIGEST', 'ARCHIVE_DIRECTORY', 'ARCHIVE_PRIVATE_MODE',
              'ARCHIVE_RECEIPT', 'ENGINE_NOT_EMPTY', 'HISTORICAL_BINDING_DRIFT', 'POSTGRES_IMAGE_BINDING',
              'POSTGRES_CLUSTER_COUNT', 'POSTGRES_VERSION', 'POSTGRES_CONTROL', 'POSTGRES_DATABASE_MARKER',
              'POSTMASTER_PID_PRESENT',
              'PROFILE_BOUND', 'PROFILE_CHANGED', 'PROFILE_DEVICE', 'PROFILE_TYPE', 'RUNTIME_DRIFT',
              'VOLUME_OUTSIDE_COPY', 'VOLUME_NAMES', 'FILE_CHANGED', 'FILE_LIMIT', 'FILE_TIMEOUT',
              'FILE_TYPE_SIZE', 'PROCESS_BOUND', 'INSPECTION_UNAVAILABLE'))


          if __name__ == '__main__':
