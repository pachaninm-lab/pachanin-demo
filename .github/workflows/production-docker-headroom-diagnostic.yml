          # Reconcile daemon inventory with surviving metadata before any recovery.
          container_forensics_script="$(cat <<'PY_CONTAINER_FORENSICS'
          import json
          import os
          import re
          import stat
          import subprocess
          import sys

          MAX_METADATA_BYTES = 4 * 1024 * 1024
          MAX_CONTAINERS = 2048
          ID_PATTERN = re.compile(r'[0-9a-f]{64}')
          IMAGE_PATTERN = re.compile(r'sha256:[0-9a-f]{64}')
          SERVICES = frozenset(('api', 'web', 'postgres', 'postgresql', 'redis', 'minio',
                                'caddy', 'kafka', 'zookeeper', 'outbox-worker',
                                'auth-mail-worker', 'migration', 'migrations', 'pgbouncer'))


          def read_metadata(directory_fd, name):
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_NOATIME,
                           dir_fd=directory_fd)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_size > MAX_METADATA_BYTES:
                      raise ValueError('INVALID_METADATA')
                  with os.fdopen(fd, 'rb', closefd=False) as stream:
                      data = stream.read(MAX_METADATA_BYTES + 1)
                  after = os.fstat(fd)
                  if len(data) > MAX_METADATA_BYTES or (
                      before.st_size, before.st_mtime_ns, before.st_ctime_ns
                  ) != (after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError('UNSTABLE_METADATA')
                  item = json.loads(data)
                  if not isinstance(item, dict):
                      raise ValueError('INVALID_METADATA')
                  return item
              finally:
                  os.close(fd)


          def metadata_inventory(root):
              result = {'status': 'UNAVAILABLE', 'directories': 0, 'valid': 0,
                        'rejected': 0, 'unknown_images': 0, 'volume_mounts': 0,
                        'image_refs': [], 'services': []}
              no_atime = getattr(os, 'O_NOATIME', None)
              if no_atime is None:
                  return result
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | no_atime
              root_fd = containers_fd = None
              try:
                  root_fd = os.open(root, flags)
                  containers_fd = os.open('containers', flags, dir_fd=root_fd)
                  # Bounded enumeration; absent/inaccessible metadata never means zero containers.
                  with os.scandir(containers_fd) as entries:
                      names = []
                      for entry in entries:
                          if len(names) == MAX_CONTAINERS:
                              result['status'] = 'LIMIT_EXCEEDED'
                              return result
                          names.append(entry.name)
                  for name in sorted(names):
                      if ID_PATTERN.fullmatch(name) is None:
                          result['rejected'] += 1
                          continue
                      result['directories'] += 1
                      child_fd = None
                      try:
                          child_fd = os.open(name, flags, dir_fd=containers_fd)
                          item = read_metadata(child_fd, 'config.v2.json')
                          if item.get('ID') != name:
                              raise ValueError('IDENTITY_MISMATCH')
                          image = item.get('Image')
                          if isinstance(image, str) and IMAGE_PATTERN.fullmatch(image):
                              result['image_refs'].append((name, image))
                          else:
                              result['unknown_images'] += 1
                          config = item.get('Config')
                          labels = config.get('Labels') if isinstance(config, dict) else None
                          service = labels.get('com.docker.compose.service') if isinstance(labels, dict) else None
                          service = service if isinstance(service, str) and service in SERVICES else 'other'
                          result['services'].append((name, service))
                          mounts = item.get('MountPoints')
                          if isinstance(mounts, dict):
                              result['volume_mounts'] += sum(
                                  isinstance(value, dict) and value.get('Type') == 'volume'
                                  for value in mounts.values())
                          result['valid'] += 1
                      except (OSError, ValueError, TypeError, RecursionError):
                          result['rejected'] += 1
                      finally:
                          if child_fd is not None:
                              os.close(child_fd)
                  result['status'] = 'PARTIAL' if result['rejected'] or result['unknown_images'] else 'COMPLETE'
              except (OSError, ValueError, TypeError):
                  result['status'] = 'UNAVAILABLE'
              finally:
                  if containers_fd is not None:
                      os.close(containers_fd)
                  if root_fd is not None:
                      os.close(root_fd)
              return result


          def journal_classification(payload):
              # Only closed-vocabulary counts leave this function; raw lines may contain secrets.
              result = {'ENOSPC': 0, 'CONTAINER_RESTORE_ERROR': 0,
                        'CONTAINER_RESTORE_ENOSPC': 0, 'METADATA_ERROR': 0,
                        'CORRUPTION_INDICATOR': 0}
              for line in payload.splitlines():
                  line = line.lower()
                  enospc = 'no space left on device' in line or 'enospc' in line
                  restore = 'container' in line and any(value in line for value in (
                      'failed to load', 'error loading', 'error restoring', 'failed to restore'))
                  result['ENOSPC'] += enospc
                  result['CONTAINER_RESTORE_ERROR'] += restore
                  result['CONTAINER_RESTORE_ENOSPC'] += enospc and restore
                  result['METADATA_ERROR'] += any(value in line for value in (
                      'config.v2.json', 'hostconfig.json')) and any(value in line for value in (
                          'error', 'failed', 'invalid', 'cannot', 'unable'))
                  result['CORRUPTION_INDICATOR'] += any(value in line for value in (
                      'database corruption', 'invalid database', 'checksum mismatch',
                      'invalid page', 'unexpected end of json'))
              return result


          def collect_journal():
              try:
                  child = subprocess.Popen(
                      ['journalctl', '--unit=docker.service', '--lines=400', '--no-pager',
                       '--output=cat'], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL)
                  try:
                      # Stop a local reader at the cap; never signal the Docker daemon.
                      import selectors
                      import time
                      payload = bytearray()
                      deadline = time.monotonic() + 10
                      with selectors.DefaultSelector() as selector:
                          selector.register(child.stdout, selectors.EVENT_READ)
                          while time.monotonic() < deadline:
                              ready = selector.select(max(0, deadline - time.monotonic()))
                              if not ready:
                                  return 'TIMEOUT', None
                              chunk = os.read(child.stdout.fileno(), 65536)
                              if not chunk:
                                  code = child.wait(timeout=max(0.1, deadline - time.monotonic()))
                                  if code != 0:
                                      return 'UNAVAILABLE', None
                                  return 'COMPLETE', journal_classification(payload.decode('utf-8', errors='replace'))
                              payload.extend(chunk)
                              if len(payload) > MAX_METADATA_BYTES:
                                  return 'LIMIT_EXCEEDED', None
                          return 'TIMEOUT', None
                  finally:
                      if child.poll() is None:
                          child.kill()
                      child.wait(timeout=2)
                      child.stdout.close()
              except (OSError, subprocess.SubprocessError):
                  return 'UNAVAILABLE', None


          def main(root):
              result = metadata_inventory(root)
              print('CONTAINER_METADATA_STATUS=' + result['status'])
              for field in ('directories', 'valid', 'rejected', 'unknown_images', 'volume_mounts'):
                  print('CONTAINER_METADATA_' + field.upper() + '=' + str(result[field]))
              for cid, image in result['image_refs']:
                  print('ON_DISK_CONTAINER_IMAGE_REF=' + cid + '|' + image)
              for cid, service in result['services']:
                  print('ON_DISK_CONTAINER_SERVICE=' + cid + '|' + service)
              status, counts = collect_journal()
              print('DOCKER_JOURNAL_STATUS=' + status)
              if counts is not None:
                  for key, value in counts.items():
                      print('DOCKER_JOURNAL_' + key + '=' + str(value))
              # Directory/volume existence and log indicators are not data-integrity acceptance.
              print('VOLUME_DATA_INTEGRITY=NOT_ATTESTED')
              print('BACKUP_RESTORE_APPLICABILITY=NOT_ATTESTED')


          if __name__ == '__main__':
              main(sys.argv[1])
          PY_CONTAINER_FORENSICS
          )"
          python3 -c "$container_forensics_script" "$docker_root"

          printf '%s' "$PRESERVATION_PREFLIGHT_B64" | base64 --decode | python3 - "$docker_root"

          # Engine size queries can traverse protected volume/rootfs directories.
          echo 'DOCKER_DF_STATUS=NOT_COLLECTED_ATIME_PRESERVATION'
          echo 'CONTAINER_SIZE_STATUS=NOT_COLLECTED_ATIME_PRESERVATION'

          image_metadata_script="$(cat <<'PY_IMAGE_METADATA'
          import json
          import re
          import sys

          def invalid():
              raise SystemExit('INVALID_IMAGE_METADATA')

          try:
              records = json.load(sys.stdin)
          except (ValueError, TypeError):
              invalid()
          expected_id = sys.argv[1]
          if not isinstance(records, list) or len(records) != 1 or not isinstance(records[0], dict):
              invalid()
          item = records[0]
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', expected_id) or item.get('Id') != expected_id:
              invalid()
          size = item.get('Size')
          if type(size) is not int or size < 0:
              invalid()
          refs = {}
          for key in ('RepoTags', 'RepoDigests'):
              values = item.get(key)
              values = [] if values is None else values
              if not isinstance(values, list) or any(not isinstance(value, str) for value in values):
                  invalid()
              refs[key] = values
          config = item.get('Config')
          config = config if isinstance(config, dict) else {}
          labels = config.get('Labels')
          labels = labels if isinstance(labels, dict) else {}
          revision = labels.get('org.opencontainers.image.revision')
          revision = revision if isinstance(revision, str) and re.fullmatch(r'[0-9a-f]{40}', revision) else 'unknown'
          created = item.get('Created')
          created = created if isinstance(created, str) and re.fullmatch(r'[0-9T:Z.+-]+', created) else 'unknown'
          print(f"IMAGE_RECORD={expected_id}|{size}|{json.dumps(refs['RepoTags'])}|{created}|{revision}")
          print(f"IMAGE_DIGEST_RECORD={expected_id}|{json.dumps(refs['RepoDigests'])}")
          PY_IMAGE_METADATA
          )"
          while IFS= read -r image_id; do
            [[ -n "$image_id" ]] || continue
            docker image inspect "$image_id" | python3 -c "$image_metadata_script" "$image_id"
          done < <(docker image ls -q --no-trunc | sort -u)

          while IFS= read -r cid; do
            [[ -n "$cid" ]] || continue
            docker inspect --format 'CONTAINER_IMAGE_REF={{.Id}}|{{.Image}}' "$cid"
            log_path="$(docker inspect --format '{{.LogPath}}' "$cid" 2>/dev/null || true)"
            if [[ -n "$log_path" && -f "$log_path" ]]; then
              printf 'CONTAINER_LOG_BYTES=%s|%s\n' "$(stat -c '%s' "$log_path")" "$cid"
            fi
          done < <(docker ps -aq --no-trunc)

          # Do not recursively walk customer data or Docker/backup directories.
          echo 'RECURSIVE_STORAGE_USAGE=NOT_COLLECTED_ATIME_PRESERVATION'
          echo 'BUILDER_DU_AVAILABLE=0'

          if command -v lsof >/dev/null 2>&1; then
            echo 'LSOF_AVAILABLE=1'
            if lsof_output="$(lsof -nP +L1 2>/dev/null)"; then
              echo 'LSOF_COLLECTION_STATUS=complete'
              printf '%s\n' "$lsof_output" | awk 'NR>1 && $7 ~ /^[0-9]+$/ {count += 1; total += $7} END {printf "DELETED_OPEN_FILE_COUNT=%d\nDELETED_OPEN_FILE_BYTES=%.0f\n", count, total}'
            else
              echo 'LSOF_COLLECTION_STATUS=unknown'
              echo 'DELETED_OPEN_FILE_COUNT=unknown'
              echo 'DELETED_OPEN_FILE_BYTES=unknown'
            fi
          else
            echo 'LSOF_AVAILABLE=0'
            echo 'DELETED_OPEN_FILE_COUNT=unknown'
            echo 'DELETED_OPEN_FILE_BYTES=unknown'
          fi
          echo 'PROBE_COMPLETE=1'
          REMOTE
          )"
          preservation_source_b64="$(base64 -w0 "$EVIDENCE_DIR/preservation-preflight.py")"
          [[ "$preservation_source_b64" =~ ^[A-Za-z0-9+/=]+$ ]]
          remote_script="PRESERVATION_PREFLIGHT_B64='$preservation_source_b64'"$'\n'"$remote_script"

          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PROD_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$PROD_HOST" 'bash -s' \
            > "$EVIDENCE_DIR/remote-output.txt" 2> "$EVIDENCE_DIR/remote-stderr.txt" <<< "$remote_script"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/remote-exit-code.txt"
          (( rc == 0 ))
          grep -Fxq 'MUTATION_MODE=READ_ONLY' "$EVIDENCE_DIR/remote-output.txt"
          grep -Fxq 'PROBE_COMPLETE=1' "$EVIDENCE_DIR/remote-output.txt"
          echo 'complete=true' >> "$GITHUB_OUTPUT"

      - name: Cleanup protected transport
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Build bounded diagnostic summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('artifacts/production-docker-headroom-diagnostic')
          raw = root / 'remote-output.txt'
          lines = raw.read_text(encoding='utf-8', errors='replace').splitlines() if raw.exists() else []
          scalar = {}
          images = []
          du = []
          logs = []
          docker_df = []
          for line in lines:
              if line.startswith('IMAGE_RECORD='):
                  parts = line.split('=', 1)[1].split('|', 4)
                  if len(parts) >= 2:
                      try: size = int(parts[1])
                      except ValueError: size = 0
                      images.append((size, parts[0], parts[2] if len(parts) > 2 else ''))
                  continue
              if line.startswith(('DU_TOTAL_BYTES=', 'DU_DOCKER_CHILD_BYTES=', 'DU_VAR_CHILD_BYTES=', 'DU_SRV_CHILD_BYTES=')):
                  payload = line.split('=', 1)[1]
                  if '|' in payload:
                      size, path = payload.split('|', 1)
                      try: du.append((int(size), path))
                      except ValueError: pass
                  continue
              if line.startswith('CONTAINER_LOG_BYTES='):
                  payload = line.split('=', 1)[1]
                  if '|' in payload:
                      size, cid = payload.split('|', 1)
                      try: logs.append((int(size), cid[:12]))
                      except ValueError: pass
                  continue
              if line.startswith('DOCKER_DF_JSON='):
                  try: docker_df.append(json.loads(line.split('=', 1)[1]))
                  except json.JSONDecodeError: pass
                  continue
              if '=' in line and not line.startswith(('DOCKER_DF_VERBOSE_', 'BUILDER_')):
                  k, v = line.split('=', 1)
                  if k and len(k) < 80:
                      scalar[k] = v

          images.sort(reverse=True)
          du_unique = {}
          for size, path in du:
              du_unique[path] = max(size, du_unique.get(path, 0))
          top_du = sorted(((v, k) for k, v in du_unique.items()), reverse=True)[:10]
          logs.sort(reverse=True)

          def gib(value):
              try: return f"{int(value)/(1024**3):.2f} GiB"
              except Exception: return 'unknown'
          def mib_from_kb(value):
              try: return f"{int(value)/1024:.1f} MiB"
              except Exception: return 'unknown'

          def preflight_summary(key):
              try:
                  value = json.loads(scalar.get(key, 'null'))
                  if not isinstance(value, dict):
                      return 'not-collected'
                  if key == 'STARTUP_POLICY_PREFLIGHT':
                      records = value.get('records', [])
                      counts = {policy: sum(row.get('policy') == policy for row in records)
                                for policy in ('no', 'always', 'unless-stopped', 'on-failure')}
                      value = {'status': value.get('status'), 'records': len(records),
                               'rejected': value.get('rejected'),
                               'restart_policy_counts': counts,
                               'watchtower_count': sum(row.get('watchtower') is True for row in records),
                               'watchtower_auto_restart_count': sum(
                                   row.get('watchtower') is True and row.get('policy') != 'no'
                                   for row in records)}
                  elif key == 'VOLUME_LAYOUT_PREFLIGHT':
                      layouts = value.get('postgres_layouts', [])
                      majors = sorted({row['major'] for row in layouts})
                      value = {field: value.get(field) for field in
                               ('status', 'directories', 'rejected', 'unsupported_or_non_postgres')}
                      value.update(postgres_layout_count=len(layouts),
                                   postgres_major_versions=majors[:10],
                                   omitted_major_versions=max(0, len(majors) - 10),
                                   pid_file_count=sum(row.get('pid_file_present') is True for row in layouts))
                  elif key == 'LOCAL_BACKUP_METADATA':
                      value = {field: value.get(field) for field in
                               ('status', 'files', 'bytes', 'dumps', 'checksums', 'other',
                                'unsafe_permissions', 'unsafe_directory_permissions', 'newest_mtime')}
                  return json.dumps(value, sort_keys=True, separators=(',', ':'))
              except (ValueError, TypeError, KeyError, AttributeError):
                  return 'invalid-observation'

          target = (root / 'target-sha.txt').read_text().strip() if (root / 'target-sha.txt').exists() else 'unknown'
          body = [
              '## Production Docker headroom read-only diagnostic',
              '',
              f"- exact main: `{target}`;",
              f"- mutation mode: `{scalar.get('MUTATION_MODE', 'not-proven')}`;",
              f"- Docker free: `{mib_from_kb(scalar.get('DOCKER_FS_AVAILABLE_KB'))}`; filesystem used: `{scalar.get('DOCKER_FS_USED_PERCENT', 'unknown')}`; inodes used: `{scalar.get('DOCKER_FS_INODES_USED_PERCENT', 'unknown')}`;",
              f"- Docker driver/root: `{scalar.get('DOCKER_STORAGE_DRIVER', 'unknown')}` / `{scalar.get('DOCKER_ROOT', 'unknown')}`;",
              f"- objects: `{scalar.get('DOCKER_OBJECT_COUNTS', 'unknown')}`;",
              f"- API: revision `{scalar.get('RUNTIME_API_REVISION', 'unknown')}`, status `{scalar.get('RUNTIME_API_STATUS', 'unknown')}`, started `{scalar.get('RUNTIME_API_STARTED_AT', 'unknown')}`;",
              f"- Web: revision `{scalar.get('RUNTIME_WEB_REVISION', 'unknown')}`, status `{scalar.get('RUNTIME_WEB_STATUS', 'unknown')}`, started `{scalar.get('RUNTIME_WEB_STARTED_AT', 'unknown')}`;",
              f"- deleted-open files: `{scalar.get('DELETED_OPEN_FILE_COUNT', 'unknown')}` / `{gib(scalar.get('DELETED_OPEN_FILE_BYTES'))}`;",
              f"- on-disk container metadata: `{scalar.get('CONTAINER_METADATA_STATUS', 'not-collected')}`; directories `{scalar.get('CONTAINER_METADATA_DIRECTORIES', 'unknown')}`; valid `{scalar.get('CONTAINER_METADATA_VALID', 'unknown')}`; unresolved image IDs `{scalar.get('CONTAINER_METADATA_UNKNOWN_IMAGES', 'unknown')}`; rejected `{scalar.get('CONTAINER_METADATA_REJECTED', 'unknown')}`;",
              f"- Docker journal classification: `{scalar.get('DOCKER_JOURNAL_STATUS', 'not-collected')}`; restore errors `{scalar.get('DOCKER_JOURNAL_CONTAINER_RESTORE_ERROR', 'unknown')}`; restore+ENOSPC `{scalar.get('DOCKER_JOURNAL_CONTAINER_RESTORE_ENOSPC', 'unknown')}`; corruption indicators `{scalar.get('DOCKER_JOURNAL_CORRUPTION_INDICATOR', 'unknown')}`;",
              f"- Startup policy preflight: `{preflight_summary('STARTUP_POLICY_PREFLIGHT')}`;",
              f"- Local backup file metadata: `{preflight_summary('LOCAL_BACKUP_METADATA')}`;",
              f"- PostgreSQL volume layout observation: `{preflight_summary('VOLUME_LAYOUT_PREFLIGHT')}`;",
              f"- Docker startup window: `{scalar.get('DOCKER_STARTUP_WINDOW', 'not-collected')}`;",
              f"- Host PostgreSQL processes: `{scalar.get('HOST_POSTGRES_PROCESSES', 'not-collected')}`;",
              f"- Preservation tool availability: `{scalar.get('PRESERVATION_TOOLS', 'not-collected')}`;",
              f"- Volume capacity metadata: `{scalar.get('VOLUME_CAPACITY_PROFILE', 'not-collected')}`;",
              '- Volume data integrity and backup/restore applicability: `NOT_ATTESTED`; local file metadata and structural observations do not verify a backup or authorize startup.',
              '- External backup evidence: `NOT_COLLECTED`; restore verification: `NOT_PERFORMED`.',
              '- Recursive disk/rootfs/build-cache size queries: `NOT_COLLECTED_ATIME_PRESERVATION`; full structured preflight records remain only in the artifact.',

              '',
              '**Largest measured storage consumers:**',
          ]
          for size, path in top_du[:8]:
              body.append(f"- `{path}` — `{gib(size)}`")
          if images:
              body += ['', '**Largest Docker image objects:**']
              for size, image_id, tags in images[:6]:
                  body.append(f"- `{image_id[:19]}` — `{gib(size)}` — `{tags[:160]}`")
          if logs:
              body += ['', '**Largest container JSON logs:**']
              for size, cid in logs[:5]:
                  body.append(f"- `{cid}` — `{gib(size)}`")
          if docker_df:
              body += ['', '**Docker system df:**']
              for row in docker_df:
                  body.append(f"- `{json.dumps(row, ensure_ascii=True, sort_keys=True)[:500]}`")
          body += ['', 'This probe performs no Docker deletion/prune, container/service restart, database write or customer-data mutation.']
          (root / 'issue-record.md').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY

      - name: Publish diagnostic evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment "$AUTHORITY_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/issue-record.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-docker-headroom-diagnostic-${{ github.run_id }}
          path: artifacts/production-docker-headroom-diagnostic
          if-no-files-found: error
          retention-days: 90
          compression-level: 0


  inspect:
    name: Inspect stopped recovery metadata without starting services
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.body == '/production inspect-stopped-recovery current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    concurrency:
      group: production-full-stack-exact-sha
      cancel-in-progress: false
      queue: max
    env:
      EVIDENCE_DIR: artifacts/stopped-recovery-inspection
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact inspection main and initialize receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' 'Stopped recovery inspection: UNKNOWN; no validated host result. No startup or restore performed.' > "$EVIDENCE_DIR/issue-record.md"
          printf '%s\n' '{"passed":false,"status":"UNKNOWN","runtimeRestored":false,"startupAuthorized":false}' > "$EVIDENCE_DIR/inspection.json"
          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_sha" == "$GITHUB_SHA" && "$target_sha" == "$GITHUB_WORKFLOW_SHA" && "$target_sha" == "$(git rev-parse HEAD)" ]]
          read -r state comments is_pr < <(gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTHORITY_ISSUE_NUMBER}" --jq '[.state,.comments,has("pull_request")] | @tsv')
          [[ "$state" == open && "$comments" =~ ^[0-9]+$ && "$is_pr" == false ]]
          (( comments < 2500 ))
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          printf '%s\n' "$target_sha" > "$EVIDENCE_DIR/target-sha.txt"

      - name: Resolve protected key and pinned VPS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'Canonical VPS mismatch.' >&2; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo 'Protected production principal is missing or invalid.' >&2; exit 11; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Pinned host fingerprint is required.' >&2; exit 13; }
          domain_ips="$(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u || true)"
          grep -Fxq "$DEFAULT_HOST" <<< "$domain_ips"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            ssh-keygen -lf "$pub" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo 'No valid protected SSH private key is configured.' >&2
            exit 14
          }

          scan="$(mktemp)"; match="$(mktemp)"
          pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo 'Pinned host key mismatch after bounded retries.' >&2; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PROD_HOST=$host" >> "$GITHUB_ENV"
          echo "PROD_PORT=$port" >> "$GITHUB_ENV"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$host" \
            'set -Eeuo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"

      - name: Prepare stopped recovery inspector primitives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/stopped-recovery-inspector.py" <<'PY_PINS'
          import ast
          import hashlib
          from pathlib import Path
          import sys
          raw = Path('scripts/production_stopped_runtime_headroom.py').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '6b121fad2c380a8425f1ca6024e1740406f26172295c215e01bbe0f200768c14'
          tree = ast.parse(raw)
          refs = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign)
                      and any(isinstance(t, ast.Name) and t.id == 'EXPECTED_REFS' for t in node.targets))
          assert len(refs) == 11 and tuple(sorted(refs)) == refs
          Path(sys.argv[1]).write_text('EXPECTED_REFS = ' + repr(refs) + '\n')
          PY_PINS
          cat >> "$RUNNER_TEMP/stopped-recovery-inspector.py" <<'PY_INSPECTION_0'
          import hashlib
          import http.client
          import json
          import os
          import re
          import socket
          import stat
          import sys
          import time

          SCHEMA = 'pc.stopped-recovery-inspection.v1'
          COPY_SHA = '800264a1819ba26869e4b79d1f6874dc5078aa982ab333fdd999629f6b490603'
          COPY_MAIN = 'a509789c22298375130d70fde95915b8daa7634a'
          COPY_RUN = '39779050389'
          COPY_ROOT = '/var/lib/pc-release-authority/backups/cold-preservation-20261022'
          DOCKER_ROOT = '/var/lib/docker'
          IMAGE = re.compile(r'sha256:[0-9a-f]{64}')
          HEX = re.compile(r'[0-9a-f]{40}')
          MAX_BYTES = 4 * 1024 * 1024
          MAX_ARCHIVE = 2 * 1024 * 1024 * 1024
          MAX_ENTRIES = 100000
          ROLES = frozenset(('api', 'web', 'postgres', 'postgresql', 'db', 'redis', 'minio',
                             'kafka', 'caddy', 'outbox-worker', 'auth-mail-worker', 'marketing-worker',
                             'elasticsearch', 'migration', 'outbox', 'auth-mail'))


          class InspectionError(Exception):
              pass


          def require(value, code):
              if not value:
                  raise InspectionError(code)


          def integer(value, maximum=2**63-1):
              require(type(value) is int and 0 <= value <= maximum, 'INTEGER')
              return value


          def signature(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid,
                      info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns, info.st_atime_ns)


          def open_directory(path):
              # Check every component; following an ancestor symlink is forbidden too.
              require(isinstance(path, str) and path.startswith('/'), 'DIRECTORY_PATH')
              parts = path.split('/')[1:]
              require(parts and all(p not in ('', '.', '..') for p in parts), 'DIRECTORY_PATH')
              fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  for part in parts:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                                      dir_fd=fd)
                      os.close(fd)
                      fd = child
                  leaf = os.open('.', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_NOATIME, dir_fd=fd)
                  os.close(fd)
                  return leaf
              except BaseException:
                  os.close(fd)
                  raise


          def read_regular(parent, name, limit=MAX_BYTES, digest=False):
              require('/' not in name and name not in ('', '.', '..'), 'LEAF_NAME')
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NOATIME | os.O_NONBLOCK, dir_fd=parent)
              try:
                  before = os.fstat(fd)
