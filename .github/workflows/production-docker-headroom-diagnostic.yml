name: Production Docker Headroom Read-Only Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/production-docker-headroom-diagnostic.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-docker-headroom-readonly-diagnostic
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  AUTHORITY_ISSUE_NUMBER: 4637
  EVIDENCE_DIR: artifacts/production-docker-headroom-diagnostic

jobs:
  contract:
    name: Validate read-only diagnostic contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 4637 &&
       (github.event.comment.body == '/production diagnose-docker current-main' ||
        github.event.comment.body == '/production inspect-stopped-recovery current-main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prove read-only boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast
          import json
          import pathlib
          import re
          import subprocess
          import textwrap
          from types import SimpleNamespace as Namespace

          workflow = pathlib.Path('.github/workflows/production-docker-headroom-diagnostic.yml').read_text(encoding='utf-8')
          required = [
              "github.event.issue.number == 4637",
              "github.event.comment.body == '/production diagnose-docker current-main'",
              'github.event.comment.user.login',
              'github.repository_owner',
              'PC_PROD_SSH_HOST_FINGERPRINT',
              'StrictHostKeyChecking=yes',
              'BatchMode=yes',
              'MUTATION_MODE=READ_ONLY',
              'RECURSIVE_STORAGE_USAGE=NOT_COLLECTED_ATIME_PRESERVATION',
              'lsof -nP +L1',
              'RUNTIME_API_STARTED_AT=',
              'RUNTIME_WEB_STARTED_AT=',
              'DOCKER_OBJECT_COUNTS=',
              'STARTUP_AUTHORIZATION=NOT_GRANTED',
              'RESTORE_VERIFICATION=NOT_PERFORMED',
          ]
          for needle in required:
              if needle not in workflow:
                  raise SystemExit(f'missing diagnostic boundary: {needle}')

          fragments = [
              ('docker ' + 'system ' + 'prune'),
              ('docker ' + 'image ' + 'prune'),
              ('docker ' + 'builder ' + 'prune'),
              ('docker ' + 'container ' + 'prune'),
              ('docker ' + 'volume ' + 'prune'),
              ('docker ' + 'network ' + 'prune'),
              ('docker ' + 'image ' + 'rm'),
              ('docker ' + 'container ' + 'rm'),
              ('docker ' + 'volume ' + 'rm'),
              ('docker ' + 'network ' + 'rm'),
              ('docker ' + 'restart'),
              ('docker ' + 'stop'),
              ('docker ' + 'kill'),
              ('systemctl ' + 'restart'),
              ('systemctl ' + 'stop'),
              ('truncate ' + '-s'),
              ('docker ' + 'system ' + 'df'),
              ('docker ' + 'inspect ' + '--size'),
              ('docker ' + 'builder ' + 'du'),
              ('du ' + '-x'),
          ]
          for forbidden in fragments:
              if forbidden in workflow:
                  raise SystemExit(f'forbidden production mutation capability: {forbidden}')
          if re.search(r'StrictHostKeyChecking\s*=\s*no', workflow, re.I):
              raise SystemExit('host verification bypass forbidden')
          if not re.search(r'^  AUTHORITY_ISSUE_NUMBER: 4637$', workflow, re.M):
              raise SystemExit('diagnostic evidence must use the successor authority journal')

          unprivileged = workflow.split('\n  diagnose:\n', 1)[0]
          if ('secrets' + '.') in unprivileged or ('issues: ' + 'write') in unprivileged:
              raise SystemExit('PR contract must not receive production secrets or issue-write authority')

          conditions = {}
          allowed_nodes = (ast.Expression, ast.BoolOp, ast.And, ast.Or, ast.Compare,
                           ast.Eq, ast.Attribute, ast.Name, ast.Load, ast.Constant)
          for job in ('contract', 'diagnose'):
              block = workflow.split(f'\n  {job}:\n', 1)[1].split('\n    runs-on:', 1)[0]
              match = re.search(r'\n    if: >-\n((?:      [^\n]*\n)+)', block + '\n')
              if not match:
                  raise SystemExit(f'missing actual route condition: {job}')
              expression = ' '.join(line.strip() for line in match[1].splitlines())
              tree = ast.parse(expression.replace('&&', ' and ').replace('||', ' or '), mode='eval')
              for node in ast.walk(tree):
                  if type(node) not in allowed_nodes:
                      raise SystemExit(f'unsupported route expression: {job}')
                  if isinstance(node, ast.Name) and node.id not in ('github', 'needs'):
                      raise SystemExit(f'unsupported route name: {job}')
                  if isinstance(node, ast.Attribute) and node.attr.startswith('_'):
                      raise SystemExit(f'unsupported route attribute: {job}')
              conditions[job] = compile(tree, f'<actual {job} condition>', 'eval')

          def routed(event='issue_comment', issue=4637,
                     body='/production diagnose-docker current-main',
                     author='owner', actor='owner', triggering_actor='owner', result='success'):
              github = Namespace(event_name=event, repository_owner='owner', actor=actor,
                                 triggering_actor=triggering_actor,
                                 event=Namespace(issue=Namespace(number=issue),
                                                 comment=Namespace(body=body, user=Namespace(login=author))))
              context = {'github': github, 'needs': Namespace(contract=Namespace(result=result))}
              return tuple(bool(eval(conditions[job], {'__builtins__': {}}, context))
                           for job in ('contract', 'diagnose'))

          cases = [
              ('owner successor command', {}, (True, True)),
              ('separate stopped inspection', {'body': '/production inspect-stopped-recovery current-main'}, (True, False)),
              ('historical full journal', {'issue': 3072}, (False, False)),
              ('unrelated issue', {'issue': 5469}, (False, False)),
              ('non-owner author', {'author': 'other'}, (True, False)),
              ('non-owner actor', {'actor': 'other'}, (True, False)),
              ('non-owner triggering actor', {'triggering_actor': 'other'}, (True, False)),
              ('changed command', {'body': '/production diagnose-docker another-sha'}, (False, False)),
              ('trailing newline', {'body': '/production diagnose-docker current-main\n'}, (False, False)),
              ('trailing space', {'body': '/production diagnose-docker current-main '}, (False, False)),
              ('prefixed command', {'body': 'please /production diagnose-docker current-main'}, (False, False)),
              ('pull request validation only', {'event': 'pull_request'}, (True, False)),
              ('push cannot diagnose', {'event': 'push'}, (False, False)),
              ('failed contract', {'result': 'failure'}, (True, False)),
              ('skipped contract', {'result': 'skipped'}, (True, False)),
          ]
          for name, inputs, expected in cases:
              actual = routed(**inputs)
              if actual != expected:
                  raise SystemExit(f'actual diagnostic route rejected: {name}: {actual} != {expected}')
          print(f'PASS: {len(cases)} actual-condition diagnostic route cases; historical journal and non-owner execution rejected.')
          match = re.search(r"^          image_metadata_script=\"\$\(cat <<'PY_IMAGE_METADATA'\n(.*?)^          PY_IMAGE_METADATA\n", workflow, re.M | re.S)
          if not match:
              raise SystemExit('missing actual image metadata normalizer')
          normalizer = textwrap.dedent(match[1])
          image_id = 'sha256:' + 'a' * 64
          revision = 'b' * 40
          secret = 'ENV_VALUE_MUST_NOT_BE_PUBLISHED'
          fixture = {'Id': image_id, 'Size': 123, 'RepoTags': ['example/api:fixture'],
                     'RepoDigests': ['example/api@sha256:' + 'c' * 64],
                     'Created': '2026-01-01T00:00:00Z',
                     'Config': {'Labels': {'org.opencontainers.image.revision': revision}, 'Env': [secret]}}
          metadata_cases = [
              ('labelled image', {}, True, revision),
              ('missing Config', {'Config': None}, True, 'unknown'),
              ('empty Config', {'Config': {}}, True, 'unknown'),
              ('null Labels', {'Config': {'Labels': None}}, True, 'unknown'),
              ('empty Labels', {'Config': {'Labels': {}}}, True, 'unknown'),
              ('malformed Labels', {'Config': {'Labels': []}}, True, 'unknown'),
              ('invalid revision', {'Config': {'Labels': {'org.opencontainers.image.revision': secret}}}, True, 'unknown'),
              ('unreferenced image', {'RepoTags': None, 'RepoDigests': None}, True, revision),
              ('wrong image identity', {'Id': 'sha256:' + 'd' * 64}, False, None),
              ('invalid size', {'Size': True}, False, None),
              ('invalid tags', {'RepoTags': 'not-a-list'}, False, None),
              ('invalid digests', {'RepoDigests': [1]}, False, None),
          ]
          for name, changes, success, expected_revision in metadata_cases:
              payload = [{**fixture, **changes}]
              result = subprocess.run(['python3', '-c', normalizer, image_id], input=json.dumps(payload),
                                      text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if (result.returncode == 0) != success or secret in result.stdout + result.stderr:
                  raise SystemExit(f'image metadata normalization rejected: {name}')
              if success:
                  lines = result.stdout.splitlines()
                  if len(lines) != 2 or not lines[0].endswith('|' + expected_revision):
                      raise SystemExit(f'image metadata shape rejected: {name}')
                  if not lines[1].startswith('IMAGE_DIGEST_RECORD=' + image_id + '|'):
                      raise SystemExit(f'image digest attribution rejected: {name}')
              elif result.stdout:
                  raise SystemExit(f'partial malformed image record forbidden: {name}')
          for payload in ([], [fixture, fixture]):
              result = subprocess.run(['python3', '-c', normalizer, image_id], input=json.dumps(payload),
                                      text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode == 0 or result.stdout or secret in result.stderr:
                  raise SystemExit('ambiguous image metadata was accepted')
          print('PASS: 14 actual runtime image metadata fixtures; legacy Labels UNKNOWN, malformed records rejected and Config.Env omitted.')
          match = re.search(r"^          container_forensics_script=\"\$\(cat <<'PY_CONTAINER_FORENSICS'\n(.*?)^          PY_CONTAINER_FORENSICS\n", workflow, re.M | re.S)
          if not match:
              raise SystemExit('missing container metadata reconciler')
          forensic_source = textwrap.dedent(match[1])
          scope = {'__name__': 'contract_fixture'}
          exec(compile(forensic_source, '<actual container reconciler>', 'exec'), scope)
          import contextlib
          import io
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as fixture_directory:
              root = Path(fixture_directory)
              containers = root / 'containers'
              containers.mkdir()
              cid = 'a' * 64
              child = containers / cid
              child.mkdir()
              config = child / 'config.v2.json'
              payload = {'ID': cid, 'Image': image_id,
                         'Config': {'Env': [secret], 'Labels': {
                             'com.docker.compose.service': 'api', 'untrusted': secret}},
                         'MountPoints': {secret: {'Type': 'volume', 'Source': secret}}}
              config.write_text(json.dumps(payload))
              inventory = scope['metadata_inventory']
              baseline = inventory(str(root))
              assert baseline['status'] == 'COMPLETE' and baseline['valid'] == 1
              assert baseline['image_refs'] == [(cid, image_id)]
              assert baseline['volume_mounts'] == 1 and baseline['services'] == [(cid, 'api')]
              assert secret not in json.dumps(baseline)
              # Real file/directory reads must preserve access times, including relatime mounts.
              import os
              evidence_paths = (root, containers, child, config)
              for evidence_path in evidence_paths:
                  os.utime(evidence_path, ns=(1, evidence_path.stat().st_mtime_ns))
              assert inventory(str(root))['status'] == 'COMPLETE'
              assert all(evidence_path.stat().st_atime_ns == 1 for evidence_path in evidence_paths)
              from unittest import mock
              with mock.patch.object(os, 'O_NOATIME', None):
                  assert inventory(str(root))['status'] == 'UNAVAILABLE'
              with mock.patch.object(os, 'open', side_effect=PermissionError('not permitted')):
                  assert inventory(str(root))['status'] == 'UNAVAILABLE'

              for malformed in ([], None, {'ID': 'b' * 64}, '{bad json'):
                  config.write_text(malformed if isinstance(malformed, str) else json.dumps(malformed))
                  found = inventory(str(root))
                  assert found['status'] == 'PARTIAL' and found['valid'] == 0
                  assert not found['image_refs'] and found['rejected'] == 1
              config.unlink()
              target = root / 'must-not-read'
              target.write_text(json.dumps(payload))
              config.symlink_to(target)
              assert inventory(str(root))['rejected'] == 1
              config.unlink()
              config.write_text(json.dumps({**payload, 'padding': 'x' * scope['MAX_METADATA_BYTES']}))
              assert inventory(str(root))['rejected'] == 1
              config.unlink()
              assert inventory(str(root))['rejected'] == 1
              config.write_text(json.dumps({**payload, 'Image': secret,
                  'Config': {'Labels': {'com.docker.compose.service': secret}}}))
              unknown = inventory(str(root))
              assert unknown['status'] == 'PARTIAL' and unknown['unknown_images'] == 1 and not unknown['image_refs']
              assert unknown['services'] == [(cid, 'other')] and secret not in json.dumps(unknown)
              assert inventory(str(root / 'missing'))['status'] == 'UNAVAILABLE'
              child.rename(root / 'outside')
              child.symlink_to(root / 'outside', target_is_directory=True)
              assert inventory(str(root))['rejected'] == 1
              child.unlink()
              config = root / 'outside' / 'config.v2.json'
              config.write_text(json.dumps(payload))
              (root / 'outside').rename(child)
              scope['collect_journal'] = lambda: ('UNAVAILABLE', None)
              output = io.StringIO()
              with contextlib.redirect_stdout(output):
                  scope['main'](str(root))
              assert secret not in output.getvalue() and fixture_directory not in output.getvalue()
              assert 'VOLUME_DATA_INTEGRITY=NOT_ATTESTED' in output.getvalue()
              assert 'BACKUP_RESTORE_APPLICABILITY=NOT_ATTESTED' in output.getvalue()
              scope['MAX_CONTAINERS'] = 0
              assert inventory(str(root))['status'] == 'LIMIT_EXCEEDED'

          # Exercise the actual bounded pipe reader with real child processes.
          import sys
          from unittest import mock
          original_popen = subprocess.Popen
          # Restore the real reader after the output-redaction fixture.
          actual_scope = {'__name__': 'journal_fixture'}
          exec(compile(forensic_source, '<actual journal reader>', 'exec'), actual_scope)
          journal_reader = actual_scope['collect_journal']
          for program, expected_status in (
              ('print("error restoring container: no space left on device")', 'COMPLETE'),
              ('raise SystemExit(7)', 'UNAVAILABLE'),
              ('import sys; sys.stdout.write("x" * (4 * 1024 * 1024 + 1))', 'LIMIT_EXCEEDED'),
          ):
              children = []
              def fixture_popen(argv, **kwargs):
                  assert argv == ['journalctl', '--unit=docker.service', '--lines=400',
                                  '--no-pager', '--output=cat']
                  child = original_popen([sys.executable, '-c', program], **kwargs)
                  children.append(child)
                  return child
              with mock.patch.object(subprocess, 'Popen', side_effect=fixture_popen):
                  status, counts = journal_reader()
              assert status == expected_status and all(child.poll() is not None for child in children)
              if expected_status == 'COMPLETE':
                  assert counts['CONTAINER_RESTORE_ENOSPC'] == 1
              else:
                  assert counts is None
          print('PASS: actual journal reader handles nonzero exit and oversize output, reaps its own children and never invokes a daemon mutation.')

          classified = scope['journal_classification'](
              'error restoring container ' + secret + ': no space left on device\n'
              + 'failed to load container: invalid config.v2.json ' + secret + '\n'
              + 'checksum mismatch ' + secret + '\n')
          assert classified == {'ENOSPC': 1, 'CONTAINER_RESTORE_ERROR': 2,
              'CONTAINER_RESTORE_ENOSPC': 1, 'METADATA_ERROR': 1, 'CORRUPTION_INDICATOR': 1}
          assert secret not in json.dumps(classified)
          assert all(value == 0 for value in scope['journal_classification'](secret).values())
          print('PASS: actual on-disk metadata identity/no-atime/symlink/size/missing/limit/privacy fixtures and journal classification; no data-integrity claim.')

          print('PASS: remote diagnostic is owner-only, exact-main, pinned-SSH and contains no Docker delete/prune or service restart/stop capability.')
          PY

      - name: Verify preservation and complete capacity fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import contextlib
          import io
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import textwrap
          from pathlib import Path
          from unittest import mock
          workflow = Path('.github/workflows/production-docker-headroom-diagnostic.yml').read_text()
          cid = 'a' * 64
          secret = 'ENV_VALUE_MUST_NOT_BE_PUBLISHED'
          match = re.search(r"^          preservation_preflight_script=\"\$\(cat <<'PY_PRESERVATION_PREFLIGHT'\n(.*?)^          PY_PRESERVATION_PREFLIGHT\n", workflow, re.M | re.S)
          if not match:
              raise SystemExit('missing actual preservation preflight')
          preservation_source = textwrap.dedent(match[1])
          match = re.search(r"^          capacity_profile_script=\"\$\(cat <<'PY_CAPACITY_PROFILE'\n(.*?)^          PY_CAPACITY_PROFILE\n", workflow, re.M | re.S)
          if not match:
              raise SystemExit('missing actual capacity profile')
          capacity_source = textwrap.dedent(match[1])
          marker = "if __name__ == '__main__':"
          assert preservation_source.count(marker) == 1
          preservation_source = preservation_source.replace(marker, capacity_source + '\n\n' + marker)
          preflight = {'__name__': 'preservation_fixture'}
          exec(compile(preservation_source, '<actual preservation preflight>', 'exec'), preflight)
          with tempfile.TemporaryDirectory() as fixture_directory:
              root = Path(fixture_directory)
              docker = root / 'docker'
              containers = docker / 'containers'
              child = containers / cid
              child.mkdir(parents=True)
              config = child / 'config.v2.json'
              host = child / 'hostconfig.json'
              original_config = {'ID': cid, 'Config': {
                  'Image': 'containrrr/watchtower:latest', 'Env': [secret],
                  'Labels': {'com.docker.compose.service': 'watchtower',
                             'com.docker.compose.project': secret,
                             'com.docker.compose.project.working_dir': secret,
                             'com.docker.compose.project.config_files': secret}}}
              original_host = {'RestartPolicy': {'Name': 'always', 'MaximumRetryCount': 0}}
              config.write_text(json.dumps(original_config))
              host.write_text(json.dumps(original_host))
              restart = preflight['restart_inventory'](str(docker))
              assert restart['status'] == 'COMPLETE' and len(restart['records']) == 1
              assert restart['records'][0] == {
                  'role': 'watchtower', 'policy': 'always', 'retry': 0,
                  'watchtower': True, 'compose_labels_present': True,
                  'runtime_metadata': {'container_id': cid, 'driver': 'unknown',
                      'state': dict.fromkeys(('Running', 'Paused', 'Restarting', 'OOMKilled', 'Dead')),
                      'manually_stopped': None, 'ever_started': None, 'exit_code': None,
                      'StartedAt': 'unknown', 'FinishedAt': 'unknown'}}
              assert secret not in json.dumps(restart)
              observed_config = {**original_config, 'Driver': 'overlayfs',
                  'HasBeenManuallyStopped': True, 'HasBeenStartedBefore': True,
                  'State': {'Running': False, 'Paused': False, 'Restarting': False,
                      'OOMKilled': True, 'Dead': False, 'ExitCode': 137,
                      'StartedAt': '2026-10-01T12:00:00.123456789Z', 'FinishedAt': secret}}
              config.write_text(json.dumps(observed_config))
              runtime = preflight['restart_inventory'](str(docker))['records'][0]['runtime_metadata']
              assert runtime['driver'] == 'overlayfs' and runtime['manually_stopped'] is True
              assert runtime['state']['OOMKilled'] is True and runtime['exit_code'] == 137
              assert runtime['StartedAt'] == '2026-10-01T12:00:00.123456789Z'
              assert runtime['FinishedAt'] == 'unknown' and secret not in json.dumps(runtime)
              config.write_text(json.dumps(original_config))
              for invalid in ({}, {'Name': 'unknown', 'MaximumRetryCount': 0},
                              {'Name': 'always', 'MaximumRetryCount': True},
                              {'Name': 'on-failure', 'MaximumRetryCount': -1}):
                  host.write_text(json.dumps({'RestartPolicy': invalid}))
                  rejected = preflight['restart_inventory'](str(docker))
                  assert rejected['status'] == 'PARTIAL' and rejected['rejected'] == 1
              host.write_text(json.dumps(original_host))
              host.unlink()
              host.symlink_to(config)
              assert preflight['restart_inventory'](str(docker))['rejected'] == 1
              host.unlink()
              host.write_text(json.dumps(original_host))
              config.write_text(json.dumps({**original_config, 'ID': 'b' * 64}))
              assert preflight['restart_inventory'](str(docker))['rejected'] == 1
              config.write_text(json.dumps(original_config))
              data = docker / 'volumes' / secret / '_data'
              data.mkdir(parents=True)
              for directory in ('base', 'global', 'pg_wal'):
                  (data / directory).mkdir()
              (data / 'PG_VERSION').write_text('16\n')
              (data / 'global' / 'pg_control').write_bytes(b'opaque-control')
              (data / 'postmaster.pid').write_text(secret)
              layout = preflight['volume_inventory'](str(docker))
              assert layout['status'] == 'STRUCTURAL_ONLY'
              assert layout['postgres_layouts'] == [{'major': '16', 'pid_file_present': True}]
              assert secret not in json.dumps(layout)
              (data / 'PG_VERSION').write_text(secret)
              assert preflight['volume_inventory'](str(docker))['rejected'] == 1
              (data / 'PG_VERSION').write_text('16\n')
              (data / 'pg_wal').rmdir()
              (data / 'pg_wal').symlink_to(data / 'base', target_is_directory=True)
              assert preflight['volume_inventory'](str(docker))['rejected'] == 1
              (data / 'pg_wal').unlink()
              (data / 'pg_wal').mkdir()
              backups = root / 'backups'
              backups.mkdir()
              dump = backups / (secret + '.backup')
              digest = backups / (secret + '.backup.sha256')
              dump.write_bytes(b'opaque-backup')
              digest.write_text(secret)
              dump.chmod(0o600)
              digest.chmod(0o600)
              found = preflight['backup_inventory'](str(backups))
              assert found['status'] == 'METADATA_ONLY' and found['dumps'] == found['checksums'] == 1
              assert found['unsafe_permissions'] == 0 and secret not in json.dumps(found)
              dump.chmod(0o644)
              assert preflight['backup_inventory'](str(backups))['unsafe_permissions'] == 1
              dump.chmod(0o600)
              assert preflight['backup_inventory'](str(root / 'missing'))['status'] == 'ABSENT'
              link = root / 'alias'
              link.symlink_to(root, target_is_directory=True)
              assert preflight['backup_inventory'](str(link / 'backups'))['status'] == 'UNAVAILABLE'
              digest.unlink()
              digest.symlink_to(dump)
              assert preflight['backup_inventory'](str(backups))['status'] == 'UNAVAILABLE'
              digest.unlink()
              digest.write_text(secret)
              digest.chmod(0o600)
              # All observations preserve atime; backup bytes, PID and control contents stay unread.
              paths = [root, docker, containers, child, config, host, backups, dump, digest,
                       docker / 'volumes', data.parent, data, data / 'PG_VERSION',
                       data / 'base', data / 'global', data / 'pg_wal',
                       data / 'global' / 'pg_control', data / 'postmaster.pid']
              for path in paths:
                  os.utime(path, ns=(1, path.stat().st_mtime_ns))
              assert preflight['restart_inventory'](str(docker))['status'] == 'COMPLETE'
              assert preflight['volume_inventory'](str(docker))['status'] == 'STRUCTURAL_ONLY'
              assert preflight['backup_inventory'](str(backups))['status'] == 'METADATA_ONLY'
              assert all(path.stat().st_atime_ns == 1 for path in paths)
              with mock.patch.object(os, 'O_NOATIME', None):
                  assert preflight['restart_inventory'](str(docker))['status'] == 'UNAVAILABLE'
                  assert preflight['volume_inventory'](str(docker))['status'] == 'UNAVAILABLE'
                  assert preflight['backup_inventory'](str(backups))['status'] == 'UNAVAILABLE'
              # Execute the complete actual remote script, including every later storage step.
              def actual_step(name):
                  block = workflow.split('      - name: ' + name + '\n', 1)[1].split('\n      - name: ', 1)[0]
                  return textwrap.dedent(block.split('        run: |\n', 1)[1])
              binaries = root / 'bin'
              evidence = root / 'evidence'
              binaries.mkdir()
              evidence.mkdir()
              sha = 'a' * 40
              scripts = {
                  'git': '#!/bin/bash\nif [[ "$1" == rev-parse ]]; then echo ' + sha + '; fi\n',
                  'ssh': '#!/bin/bash\ncat > "$CAPTURE"\nprintf "MUTATION_MODE=READ_ONLY\\nPROBE_COMPLETE=1\\n"\n',
