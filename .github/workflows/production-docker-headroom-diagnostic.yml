          class Budget:
              def __init__(self, seconds):
                  self.start = time.monotonic(); self.seconds = seconds; self.read_bytes = 0
              def check(self):
                  require(time.monotonic()-self.start < self.seconds, 'DEADLINE')
              def read(self, fd, off, length):
                  self.check(); integer(length,1,RAW_CAP)
                  require(self.read_bytes+length <= 1024*1024, 'READ_BUDGET')
                  raw = os.pread(fd,length,off); self.read_bytes += len(raw)
                  require(len(raw)==length, 'SHORT_READ'); self.check(); return raw


          def run(args, seconds, data=b'', pass_fds=(), cap=COMMAND_CAP, budget=None):
