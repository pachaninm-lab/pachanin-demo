          import ctypes
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import signal
          import subprocess
          import sys
          import time

          TRANSPORT_SECONDS = 45


          def closed_json(raw):
              def unique(pairs):
                  value = {}
                  for name, item in pairs:
                      if name in value:
                          raise ValueError('CLOSED_JSON_DUPLICATE_KEY')
                      value[name] = item
                  return value
              return json.loads(raw, object_pairs_hook=unique)


          def execute(source, target, output):
              if len(source.encode()) > 20000 or not re.fullmatch('[0-9a-f]{40}', target):
                  raise ValueError('CLOSED_INPUT')
              namespace = {'__name__': 'closed_docker_validator'}
              exec(compile(source, '<closed-docker-source>', 'exec'), namespace)
              envelope = {'schema': 'pc.closed-docker-diagnostic-envelope.v2', 'target': target,
                  'transport_status': 'UNKNOWN', 'diagnostic': None, 'passed': False,
                  'production_mutation': False, 'deployment_authorized': False, 'local_cleanup_attestation': 'NOT_STARTED'}
              host = os.environ['PROD_HOST']
              user = os.environ['SSH_USER_SECRET']
              port = os.environ['PROD_PORT']
              if (host != os.environ['DEFAULT_HOST'] or not re.fullmatch('[A-Za-z_][A-Za-z0-9_-]{0,31}', user)
                      or not re.fullmatch('[0-9]{1,5}', port) or not 1 <= int(port) <= 65535):
                  raise ValueError('CLOSED_TRANSPORT_IDENTITY')
              argv = ['/usr/bin/ssh', '-i', os.environ['HOME'] + '/.ssh/id_pc_prod', '-p', port,
                  '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'StrictHostKeyChecking=yes',
                  '-o', 'ConnectTimeout=15', '-o', 'ServerAliveInterval=5', '-o', 'ServerAliveCountMax=1',
                  '-o', 'UserKnownHostsFile=' + os.environ['HOME'] + '/.ssh/known_hosts', user + '@' + host,
                  'python3 -I -']
              deadline = time.monotonic() + TRANSPORT_SECONDS
              work_deadline = deadline - 2
              proc = None
              lease = None
              poller = selectors.DefaultSelector()
              streams = {'out': bytearray(), 'err': bytearray()}
              cleanup = True
              parent = os.getpid()

              def child_limits():
                  import resource
                  resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
                  if ctypes.CDLL(None, use_errno=True).prctl(1, signal.SIGKILL, 0, 0, 0) != 0 or os.getppid() != parent:
                      os._exit(125)

              try:
                  lease = namespace['OwnedChildLease']()
                  proc = subprocess.Popen(argv, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      close_fds=True, start_new_session=True, preexec_fn=child_limits)
                  # A bounded pipe write is driven with the same deadline as response reads.
                  pending = memoryview(source.encode())
                  for stream, events, name in ((proc.stdin, selectors.EVENT_WRITE, 'in'),
                          (proc.stdout, selectors.EVENT_READ, 'out'), (proc.stderr, selectors.EVENT_READ, 'err')):
                      os.set_blocking(stream.fileno(), False)
                      poller.register(stream, events, name)
                  exhausted = False
                  while poller.get_map():
                      remaining = work_deadline - time.monotonic()
                      if remaining <= 0:
                          envelope['transport_status'] = 'TIMED_OUT'
                          break
                      for item, _ in poller.select(min(remaining, 0.05)):
                          try:
                              if item.data == 'in':
                                  count = os.write(item.fileobj.fileno(), pending[:4096])
                                  pending = pending[count:]
                                  if not pending:
                                      poller.unregister(item.fileobj)
                                      item.fileobj.close()
                                  continue
                              maximum = 4096 if item.data == 'out' else 8192
                              chunk = os.read(item.fileobj.fileno(), min(4096, maximum - len(streams[item.data]) + 1))
                          except BlockingIOError:
                              continue
                          if not chunk:
                              poller.unregister(item.fileobj)
                              continue
                          streams[item.data].extend(chunk)
                          if len(streams[item.data]) > maximum:
                              exhausted = True
                              envelope['transport_status'] = 'OUTPUT_LIMIT'
                              break
                      if exhausted:
                          break
                  else:
                      code = lease.wait_without_reap(proc, work_deadline)
                      if code not in (0, 1):
                          envelope['transport_status'] = 'NONZERO'
                      else:
                          try:
                              value = namespace['validate_report'](closed_json(bytes(streams['out']).decode('utf-8', errors='strict')))
                              if (value['status'] == 'SUCCESS') != (code == 0):
                                  raise ValueError('CLOSED_EXIT_BINDING')
                              envelope.update(transport_status='VALIDATED_REMOTE_REPORT', diagnostic=value,
                                              passed=code == 0)
                          except (ValueError, TypeError, KeyError):
                              envelope['transport_status'] = 'INVALID_REMOTE_REPORT'
              except subprocess.TimeoutExpired:
                  envelope['transport_status'] = 'TIMED_OUT'
              except (OSError, ValueError, subprocess.SubprocessError):
                  envelope['transport_status'] = 'UNKNOWN'
              finally:
                  poller.close()
                  cleanup = lease.close(proc, deadline) if lease is not None else proc is None
                  if not cleanup:
                      envelope['local_cleanup_attestation'] = 'NOT_ATTESTED'
                  elif proc is not None:
                      envelope['local_cleanup_attestation'] = 'OWNED_ANCESTRY_REAPED'
                  if not cleanup or time.monotonic() > deadline:
                      envelope.update(transport_status='CLEANUP_UNCONFIRMED', diagnostic=None, passed=False,
                                      local_cleanup_attestation='NOT_ATTESTED')
              raw = json.dumps(envelope, sort_keys=True, separators=(',', ':')) + '\n'
              if len(raw.encode()) > 4096:
                  raise ValueError('CLOSED_ENVELOPE_BOUND')
              output.write_text(raw)
              return envelope


          if __name__ == '__main__':
              try:
                  source = Path(sys.argv[1]).read_text()
                  envelope = execute(source, os.environ['TARGET_SHA'], Path(sys.argv[2]))
                  raise SystemExit(0 if envelope['passed'] else 1)
              except Exception:
                  raise SystemExit(1)
          PY_CLOSED_DOCKER_TRANSPORT

