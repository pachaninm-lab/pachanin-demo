                          value['errorCode'] in ERROR_CODES and ssh_status == 1, 'OUTPUT_FAILURE')
                  return value
              require(value['passed'] is True and ssh_status == 0 and value['targetSha'] == target and
                      HEX.fullmatch(target) and value['runId'] == run and re.fullmatch('[0-9]{1,20}', run) and
                      value['status'] == 'READ_ONLY_METADATA_INSPECTED' and
                      value['databaseIntegrity'] == 'NOT_ATTESTED', 'OUTPUT_IDENTITY')
              copied = value['archive']
