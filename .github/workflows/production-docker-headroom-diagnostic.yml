          print('PASS: actual assembled inspector, archive digest/private modes/no key reads, 19-volume normal PG16 root/base OID markers, malformed/orphan/multiple-cluster rejection, metadata-only DB reads, bounds/races/symlinks, closed publication/transport/main drift, owner-only separate routes.')

          PY_INSPECTION_TESTS


  diagnose:
    name: Diagnose production Docker storage without mutation
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.body == '/production diagnose-docker current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact current main inside diagnostic job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git fetch --no-tags origin main
          target_sha="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_sha" == "$(git rev-parse origin/main)" ]]
          git checkout --detach "$target_sha"
          [[ "$(git rev-parse HEAD)" == "$target_sha" ]]
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          printf '%s\n' "$target_sha" > "$EVIDENCE_DIR/target-sha.txt"

      - name: Validate successor evidence journal before transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          read -r state comments is_pull_request < <(gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTHORITY_ISSUE_NUMBER}" \
            --jq '[.state, .comments, has("pull_request")] | @tsv')
          [[ "$state" == open && "$comments" =~ ^[0-9]+$ && "$is_pull_request" == false ]]
          (( comments < 2500 )) || { echo 'Authority journal is full; no production transport was opened.' >&2; exit 16; }
          printf '%s\n' "$AUTHORITY_ISSUE_NUMBER" > "$EVIDENCE_DIR/authority-issue.txt"

      - name: Resolve protected key and pinned VPS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'Canonical VPS mismatch.' >&2; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo 'Protected production principal is missing or invalid.' >&2; exit 11; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Pinned host fingerprint is required.' >&2; exit 13; }
          domain_ips="$(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u || true)"
          grep -Fxq "$DEFAULT_HOST" <<< "$domain_ips"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            ssh-keygen -lf "$pub" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo 'No valid protected SSH private key is configured.' >&2
            exit 14
          }

          scan="$(mktemp)"; match="$(mktemp)"
          pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo 'Pinned host key mismatch after bounded retries.' >&2; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PROD_HOST=$host" >> "$GITHUB_ENV"
          echo "PROD_PORT=$port" >> "$GITHUB_ENV"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$host" \
            'set -Eeuo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"

      - name: Prepare bounded preservation preflight payload
        shell: bash
        run: |
          set -Eeuo pipefail
          # Bounded observations only; no startup or restore acceptance.
          preservation_preflight_script="$(cat <<'PY_PRESERVATION_PREFLIGHT'
          import json
          import os
          import re
          import stat
          import sys

          MAX_ENTRIES = 2048
          MAX_BYTES = 4 * 1024 * 1024
          ROLES = frozenset(('api', 'web', 'postgres', 'postgresql', 'redis', 'minio',
                            'caddy', 'kafka', 'zookeeper', 'outbox-worker',
                            'auth-mail-worker', 'migration', 'migrations', 'pgbouncer', 'watchtower'))
          POLICIES = frozenset(('', 'no', 'always', 'unless-stopped', 'on-failure'))


          def directory_flags(traverse_only=False):
              no_atime = getattr(os, 'O_NOATIME', None)
              if no_atime is None:
                  raise OSError('NO_NOATIME')
              return os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | (0 if traverse_only else no_atime)


          def checked_directory(name, parent=None, allow_data_owner=False, traverse_only=False):
              fd = os.open(name, directory_flags(traverse_only), dir_fd=parent)
              try:
                  if not allow_data_owner and os.fstat(fd).st_uid not in (0, os.geteuid()):
                      raise ValueError('UNTRUSTED_OWNER')
                  return fd
              except BaseException:
                  os.close(fd)
                  raise


          def absolute_directory(path):
              if not isinstance(path, str) or not path.startswith('/'):
                  raise ValueError('INVALID_PATH')
              components = path.split('/')[1:]
              if any(part in ('', '.', '..') for part in components):
                  raise ValueError('INVALID_PATH')
              fd = checked_directory('/', traverse_only=True)
              try:
                  for component in components:
                      child = checked_directory(component, fd, traverse_only=True)
                      os.close(fd)
                      fd = child
                  # Traversal does not read directory entries. Only the leaf is enumerated.
                  leaf = checked_directory('.', fd)
                  os.close(fd)
                  return leaf
              except BaseException:
                  os.close(fd)
                  raise


          def names(fd):
              result = []
              with os.scandir(fd) as entries:
                  for entry in entries:
                      if len(result) >= MAX_ENTRIES:
                          raise ValueError('LIMIT_EXCEEDED')
                      result.append(entry.name)
              return sorted(result)


          def read_file(fd, name, limit=MAX_BYTES, allow_data_owner=False):
              child = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_NOATIME,
                              dir_fd=fd)
              try:
                  before = os.fstat(child)
                  if (not stat.S_ISREG(before.st_mode) or
                          (not allow_data_owner and before.st_uid != os.geteuid())
                          or before.st_size > limit):
                      raise ValueError('INVALID_FILE')
                  with os.fdopen(child, 'rb', closefd=False) as stream:
                      payload = stream.read(limit + 1)
                  after = os.fstat(child)
                  fields = ('st_size', 'st_mtime_ns', 'st_ctime_ns')
                  if len(payload) > limit or any(getattr(before, k) != getattr(after, k) for k in fields):
                      raise ValueError('UNSTABLE_FILE')
                  return payload
              finally:
                  os.close(child)


          def restart_inventory(root):
              result = {'status': 'UNAVAILABLE', 'records': [], 'rejected': 0}
              root_fd = containers_fd = None
              try:
                  root_fd = absolute_directory(root)
                  containers_fd = checked_directory('containers', root_fd)
                  for name in names(containers_fd):
                      child = None
                      try:
                          if re.fullmatch(r'[0-9a-f]{64}', name) is None:
                              raise ValueError('INVALID_ID')
                          child = checked_directory(name, containers_fd)
                          config = json.loads(read_file(child, 'config.v2.json'))
                          host = json.loads(read_file(child, 'hostconfig.json'))
                          if not isinstance(config, dict) or config.get('ID') != name or not isinstance(host, dict):
                              raise ValueError('INVALID_METADATA')
                          options = config.get('Config')
                          if not isinstance(options, dict):
                              raise ValueError('INVALID_CONFIG')
                          labels = options.get('Labels')
                          if labels is None:
                              labels = {}
                          if not isinstance(labels, dict):
                              raise ValueError('INVALID_LABELS')
                          role = labels.get('com.docker.compose.service')
                          role = role if isinstance(role, str) and role in ROLES else 'other'
                          policy = host.get('RestartPolicy')
                          if not isinstance(policy, dict) or policy.get('Name') not in POLICIES:
                              raise ValueError('UNKNOWN_RESTART_POLICY')
                          retry = policy.get('MaximumRetryCount')
                          if type(retry) is not int or not 0 <= retry <= 2147483647:
                              raise ValueError('INVALID_RETRY_COUNT')
                          image = options.get('Image', '')
                          if not isinstance(image, str):
                              raise ValueError('INVALID_IMAGE')
                          watcher = role == 'watchtower' or image.split('@')[0].rsplit('/', 1)[-1].split(':')[0] == 'watchtower'
                          compose = all(isinstance(labels.get(key), str) and bool(labels[key])
                                        for key in ('com.docker.compose.project',
                                                    'com.docker.compose.project.working_dir',
                                                    'com.docker.compose.project.config_files'))
                          state = config.get('State')
                          state = state if isinstance(state, dict) else {}
                          flags = {key: state.get(key) if type(state.get(key)) is bool else None
                                   for key in ('Running', 'Paused', 'Restarting', 'OOMKilled', 'Dead')}
                          stopped = config.get('HasBeenManuallyStopped')
                          driver = config.get('Driver')
                          driver = driver if driver in ('overlayfs', 'overlay2', 'vfs', 'btrfs', 'zfs') else 'unknown'
                          code = state.get('ExitCode')
                          ever = config.get('HasBeenStartedBefore')
                          runtime = {'container_id': name, 'driver': driver, 'state': flags,
                                     'manually_stopped': stopped if type(stopped) is bool else None,
                                     'ever_started': ever if type(ever) is bool else None,
                                     'exit_code': code if type(code) is int and 0 <= code <= 255 else None}
                          for key in ('StartedAt', 'FinishedAt'):
                              value = state.get(key)
                              runtime[key] = value if isinstance(value, str) and len(value) <= 64 and re.fullmatch(
                        r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?(?:Z|[+-][0-9]{2}:[0-9]{2})', value) else 'unknown'
                          result['records'].append({'role': role, 'policy': policy['Name'] or 'no',
                                                    'retry': retry, 'watchtower': watcher,
                                                    'compose_labels_present': compose, 'runtime_metadata': runtime})
                      except (OSError, ValueError, TypeError, RecursionError):
                          result['rejected'] += 1
                      finally:
                          if child is not None:
                              os.close(child)
                  result['status'] = 'PARTIAL' if result['rejected'] else 'COMPLETE'
              except (OSError, ValueError, TypeError):
                  result['status'] = 'UNAVAILABLE'
              finally:
                  for fd in (containers_fd, root_fd):
                      if fd is not None:
                          os.close(fd)
              return result


          def backup_inventory(path):
              result = {'status': 'UNAVAILABLE', 'files': 0, 'bytes': 0, 'dumps': 0,
                        'checksums': 0, 'other': 0, 'unsafe_permissions': 0,
                        'newest_mtime': 0, 'unsafe_directory_permissions': False}
              fd = None
              try:
                  fd = absolute_directory(path)
                  result['unsafe_directory_permissions'] = bool(stat.S_IMODE(os.fstat(fd).st_mode) & 0o077)
                  for name in names(fd):
                      info = os.stat(name, dir_fd=fd, follow_symlinks=False)
                      if not stat.S_ISREG(info.st_mode) or info.st_uid != os.geteuid():
                          raise ValueError('UNTRUSTED_BACKUP_ENTRY')
                      result['files'] += 1
                      result['bytes'] += info.st_size
                      result['newest_mtime'] = max(result['newest_mtime'], int(info.st_mtime))
                      result['unsafe_permissions'] += bool(stat.S_IMODE(info.st_mode) & 0o077)
                      result['dumps' if name.endswith('.backup') else
                             'checksums' if name.endswith('.sha256') else 'other'] += 1
                  result['status'] = 'METADATA_ONLY'
              except FileNotFoundError:
                  result['status'] = 'ABSENT'
              except (OSError, ValueError, TypeError):
                  result['status'] = 'UNAVAILABLE'
              finally:
                  if fd is not None:
                      os.close(fd)
              return result


          def pg_layout(fd):
              try:
                  version = read_file(fd, 'PG_VERSION', 32, allow_data_owner=True).decode('ascii').strip()
              except FileNotFoundError:
                  return None
              if re.fullmatch(r'[0-9]{1,2}(?:\.[0-9]{1,2})?', version) is None:
                  raise ValueError('INVALID_PG_VERSION')
              opened = []
              try:
                  for name in ('global', 'base', 'pg_wal'):
                      opened.append(checked_directory(name, fd, allow_data_owner=True))
                  control = os.stat('pg_control', dir_fd=opened[0], follow_symlinks=False)
                  if not stat.S_ISREG(control.st_mode) or control.st_size <= 0:
                      raise ValueError('INVALID_CONTROL_FILE')
                  try:
                      pid = os.stat('postmaster.pid', dir_fd=fd, follow_symlinks=False)
                      if not stat.S_ISREG(pid.st_mode):
                          raise ValueError('INVALID_PID_FILE')
                      pid_present = True
                  except FileNotFoundError:
                      pid_present = False
                  return {'major': version, 'pid_file_present': pid_present}
              finally:
                  for child in opened:
                      os.close(child)


          def volume_inventory(root):
              result = {'status': 'UNAVAILABLE', 'directories': 0, 'rejected': 0,
                        'postgres_layouts': [], 'unsupported_or_non_postgres': 0}
              root_fd = volumes_fd = None
              try:
                  root_fd = absolute_directory(root)
                  volumes_fd = checked_directory('volumes', root_fd)
                  for name in names(volumes_fd):
                      # Docker also stores its own database and backing-filesystem marker here.
                      if name in ('metadata.db', 'backingFsBlockDev'):
                          continue
                      volume_fd = data_fd = nested_fd = None
                      try:
                          volume_fd = checked_directory(name, volumes_fd)
                          data_fd = checked_directory('_data', volume_fd, allow_data_owner=True)
                          result['directories'] += 1
                          layouts = []
                          layout = pg_layout(data_fd)
                          if layout is not None:
                              layouts.append(layout)
                          try:
                              nested_fd = checked_directory('pgdata', data_fd, allow_data_owner=True)
                          except FileNotFoundError:
                              nested_fd = None
                          if nested_fd is not None:
                              layout = pg_layout(nested_fd)
                              if layout is not None:
                                  layouts.append(layout)
                          if len(layouts) > 1:
                              raise ValueError('AMBIGUOUS_PG_LAYOUT')
                          result['postgres_layouts'].extend(layouts)
                          result['unsupported_or_non_postgres'] += not layouts
                      except (OSError, ValueError, TypeError, UnicodeError):
                          result['rejected'] += 1
                      finally:
                          for fd in (nested_fd, data_fd, volume_fd):
                              if fd is not None:
                                  os.close(fd)
                  result['status'] = 'PARTIAL' if result['rejected'] else 'STRUCTURAL_ONLY'
              except (OSError, ValueError, TypeError):
                  result['status'] = 'UNAVAILABLE'
              finally:
                  for fd in (volumes_fd, root_fd):
                      if fd is not None:
                          os.close(fd)
              return result


          def bounded_command(argv, cap=65536, seconds=5, accepted=(0,)):
              import selectors
              import subprocess
              import time
              child = None
              try:
                  child = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                           stderr=subprocess.DEVNULL)
                  payload = bytearray()
                  deadline = time.monotonic() + seconds
                  with selectors.DefaultSelector() as selector:
                      selector.register(child.stdout, selectors.EVENT_READ)
                      while time.monotonic() < deadline:
                          if not selector.select(max(0, deadline - time.monotonic())):
                              return 'TIMEOUT', None
                          chunk = os.read(child.stdout.fileno(), 16384)
                          if not chunk:
                              code = child.wait(timeout=max(0.1, deadline - time.monotonic()))
                              return ('COMPLETE', bytes(payload)) if code in accepted else ('UNAVAILABLE', None)
                          payload.extend(chunk)
                          if len(payload) > cap:
                              return 'LIMIT_EXCEEDED', None
                  return 'TIMEOUT', None
              except (OSError, ValueError, subprocess.SubprocessError):
                  return 'UNAVAILABLE', None
              finally:
                  if child is not None:
                      if child.poll() is None:
                          child.kill()
                      child.wait(timeout=2)
                      child.stdout.close()


          def startup_window():
              import time
              getter = ['busctl', '--system', 'get-property', 'org.freedesktop.systemd1',
                        '/org/freedesktop/systemd1/unit/docker_2eservice',
                        'org.freedesktop.systemd1.Service', 'ExecMainStartTimestamp']
              status, raw = bounded_command(getter, cap=4096)
              match = re.fullmatch(rb't ([0-9]+)\s*', raw or b'')
              if status != 'COMPLETE' or match is None:
                  return {'status': 'UNAVAILABLE'}
              micros = int(match[1])
              start, fraction = divmod(micros, 1000000)
              if not 1577836800 <= start <= time.time() + 60:
                  return {'status': 'UNAVAILABLE'}
              status, payload = bounded_command(
                  ['journalctl', '--unit=docker.service', '--since=@' + f'{start}.{fraction:06d}',
                   '--until=@' + f'{start + 300}.{fraction:06d}', '--lines=+400', '--no-pager', '--output=cat'],
                  cap=4 * 1024 * 1024, seconds=10)
              after_status, after = bounded_command(getter, cap=4096)
              if after_status != 'COMPLETE' or after != raw:
                  return {'status': 'UNSTABLE_DAEMON'}
              result = {'status': status, 'daemon_start_epoch_us': micros, 'window_seconds': 300,
                        'record_limit': 400, 'order': 'OLDEST_FIRST', 'byte_limit': 4 * 1024 * 1024}
              if status != 'COMPLETE':
                  return result
              text = payload.decode('utf-8', errors='replace').strip()
              if text in ('', '-- No entries --'):
                  result['status'] = 'NO_RECORDS'
                  return result
              lines = [line.lower() for line in text.splitlines()]
              terms = {
                  'ENOSPC': ('no space left on device', 'enospc'),
                  'RESTORE_ERROR': ('failed to load container', 'error loading container',
                                    'error restoring container', 'failed to restore container'),
                  'METADATA_ERROR': ('invalid config.v2.json', 'invalid hostconfig.json',
                                     'unexpected end of json'),
                  'STORAGE_ERROR': ('failed to mount', 'storage driver', 'snapshotter error',
                                    'layer does not exist'),
                  'PERMISSION_ERROR': ('permission denied', 'read-only file system'),
                  'CORRUPTION_INDICATOR': ('database corruption', 'checksum mismatch', 'invalid page'),
                  'LOAD_STARTED': ('loading containers: start',),
                  'LOAD_COMPLETED': ('loading containers: done',),
              }
              result['lines'] = len(lines)
              if len(lines) >= 400:
                  result['status'] = 'WINDOW_LIMIT_REACHED'
              result['indicators'] = {key: sum(any(term in line for term in values) for line in lines)
                                      for key, values in terms.items()}
              return result


          def host_postgres_processes():
              status, raw = bounded_command(['ps', '-C', 'postgres,postmaster', '-o', 'pid='],
                                            cap=16384, accepted=(0, 1))
              if status != 'COMPLETE':
                  return {'status': status}
              pids = (raw or b'').split()
              if len(pids) > MAX_ENTRIES or any(re.fullmatch(rb'[0-9]+', pid) is None for pid in pids):
                  return {'status': 'UNAVAILABLE'}
              return {'status': 'COMPLETE', 'count': len(set(pids))}


          def preservation_tools():
              import shutil
              return {name: shutil.which(name) is not None for name in
                      ('openssl', 'gpg', 'age', 'tar', 'rsync', 'cp',
                       'pg_controldata', 'pg_checksums', 'postgres', 'busctl')}


          def main(root):
              restart = restart_inventory(root)
              backup = backup_inventory('/var/lib/pc-release-authority/backups')
              volumes = volume_inventory(root)
              for key, value in (('STARTUP_POLICY_PREFLIGHT', restart),
                                 ('LOCAL_BACKUP_METADATA', backup),
                                 ('VOLUME_LAYOUT_PREFLIGHT', volumes),
                                 ('DOCKER_STARTUP_WINDOW', startup_window()),
                                 ('HOST_POSTGRES_PROCESSES', host_postgres_processes()),
                                 ('PRESERVATION_TOOLS', preservation_tools()),
                                 ('VOLUME_CAPACITY_PROFILE', volume_capacity(root))):
                  print(key + '=' + json.dumps(value, sort_keys=True, separators=(',', ':')))
              print('STARTUP_AUTHORIZATION=NOT_GRANTED')
              print('EXTERNAL_BACKUP_EVIDENCE=NOT_COLLECTED')
              print('RESTORE_VERIFICATION=NOT_PERFORMED')


          if __name__ == '__main__':
              main(sys.argv[1])
          PY_PRESERVATION_PREFLIGHT
          )"
          printf '%s\n' "$preservation_preflight_script" > "$EVIDENCE_DIR/preservation-preflight.py"

      - name: Prepare bounded capacity profile payload
        shell: bash
        run: |
          set -Eeuo pipefail
          capacity_profile_script="$(cat <<'PY_CAPACITY_PROFILE'
          CAPACITY_ENTRY_LIMIT = 200000
          CAPACITY_SECONDS = 10
          CAPACITY_DEPTH_LIMIT = 64


          def volume_capacity(root):
              import time
              result = {'status': 'UNAVAILABLE', 'volumes': 0, 'entries': 0, 'files': 0,
                        'directories': 0, 'logical_bytes': 0, 'allocated_bytes': 0,
                        'symlinks': 0, 'special_entries': 0, 'cross_device_entries': 0,
                        'separate_filesystem_volumes': 0, 'completed_volumes': 0,
                        'profile_complete': False, 'reason': 'NOT_COLLECTED'}
              deadline = time.monotonic() + CAPACITY_SECONDS
              root_fd = volumes_fd = None

              def unchanged(before, after):
                  return all(getattr(before, key) == getattr(after, key) for key in
                             ('st_dev', 'st_ino', 'st_mode', 'st_uid', 'st_gid',
                              'st_mtime_ns', 'st_ctime_ns'))

              def within_time():
                  if time.monotonic() > deadline:
                      raise ValueError('TIME_LIMIT')

              def visit(fd, depth, device):
                  within_time()
                  if depth > CAPACITY_DEPTH_LIMIT:
                      raise ValueError('DEPTH_LIMIT')
                  before = os.fstat(fd)
                  # Capacity has its own existing global entry/time/depth budget.
                  # The forensic names() cap must not truncate a wide data directory.
                  with os.scandir(fd) as entries:
                      for entry in entries:
                          within_time()
                          if result['entries'] >= CAPACITY_ENTRY_LIMIT:
                              raise ValueError('ENTRY_LIMIT')
                          result['entries'] += 1
                          info = os.stat(entry.name, dir_fd=fd, follow_symlinks=False)
                          if info.st_dev != device:
                              result['cross_device_entries'] += 1
                          elif stat.S_ISLNK(info.st_mode):
                              result['symlinks'] += 1
                          elif stat.S_ISDIR(info.st_mode):
                              child = checked_directory(entry.name, fd, allow_data_owner=True)
                              try:
                                  if not unchanged(info, os.fstat(child)):
                                      raise ValueError('DIRECTORY_CHANGED')
                                  result['directories'] += 1
                                  visit(child, depth + 1, device)
                              finally:
                                  os.close(child)
                          elif stat.S_ISREG(info.st_mode):
                              result['files'] += 1
                              result['logical_bytes'] += info.st_size
                              result['allocated_bytes'] += info.st_blocks * 512
                          else:
                              result['special_entries'] += 1
                  within_time()
                  if not unchanged(before, os.fstat(fd)):
                      raise ValueError('DIRECTORY_CHANGED')

              try:
                  root_fd = absolute_directory(root)
                  volumes_fd = checked_directory('volumes', root_fd)
                  volumes_before = os.fstat(volumes_fd)
                  root_before = os.fstat(root_fd)
                  for name in names(volumes_fd):
                      within_time()
                      if name in ('metadata.db', 'backingFsBlockDev'):
                          continue
                      volume_fd = data_fd = None
                      try:
                          volume_fd = checked_directory(name, volumes_fd)
                          volume_before = os.fstat(volume_fd)
                          data_fd = checked_directory('_data', volume_fd, allow_data_owner=True)
                          device = os.fstat(data_fd).st_dev
                          result['separate_filesystem_volumes'] += device != os.fstat(root_fd).st_dev
                          result['volumes'] += 1
                          visit(data_fd, 0, device)
                          if not unchanged(volume_before, os.fstat(volume_fd)):
                              raise ValueError('DIRECTORY_CHANGED')
                          result['completed_volumes'] += 1
                      finally:
                          for fd in (data_fd, volume_fd):
                              if fd is not None:
                                  os.close(fd)
                  if (not unchanged(volumes_before, os.fstat(volumes_fd)) or
                          not unchanged(root_before, os.fstat(root_fd))):
                      raise ValueError('DIRECTORY_CHANGED')
                  if any(result[key] for key in ('symlinks', 'special_entries', 'cross_device_entries')):
                      raise ValueError('UNSUPPORTED_ENTRIES')
                  result.update(status='METADATA_ONLY', profile_complete=True, reason='COMPLETE')
              except ValueError as error:
                  result['status'] = 'LIMIT_OR_UNTRUSTED'
                  code = str(error)
                  result['reason'] = code if code in (
                      'TIME_LIMIT', 'ENTRY_LIMIT', 'DEPTH_LIMIT', 'DIRECTORY_CHANGED',
                      'UNSUPPORTED_ENTRIES') else 'UNTRUSTED_DIRECTORY'
              except (OSError, TypeError):
                  result['status'] = 'UNAVAILABLE'
                  result['reason'] = 'FILESYSTEM_UNAVAILABLE'
              finally:
                  for fd in (volumes_fd, root_fd):
                      if fd is not None:
                          os.close(fd)
              return result


          PY_CAPACITY_PROFILE
          )"
          printf '%s\n' "$capacity_profile_script" > "$EVIDENCE_DIR/capacity-profile.py"
          python3 - "$EVIDENCE_DIR/preservation-preflight.py" "$EVIDENCE_DIR/capacity-profile.py" <<'PY_ASSEMBLE'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          base = path.read_text()
          capacity = pathlib.Path(sys.argv[2]).read_text()
          marker = "if __name__ == '__main__':"
          if base.count(marker) != 1:
              raise SystemExit('PRESERVATION_PAYLOAD_MARKER')
          complete = base.replace(marker, capacity + '\n\n' + marker)
          compile(complete, '<complete preservation preflight>', 'exec')
          path.write_text(complete)
          PY_ASSEMBLE

