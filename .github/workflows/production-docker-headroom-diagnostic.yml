                  require(type(env) is list and all(type(s) is str for s in env), 'CONTAINER_ENV')
                  pgdata = [s.split('=', 1)[1].rstrip('/') for s in env if s.startswith('PGDATA=')]
                  candidates = []
                  volume_count = 0
                  for point in record['MountPoints'].values():
                      require(type(point) is dict, 'MOUNT_METADATA')
                      source, dest = point.get('Source'), point.get('Destination')
                      require(type(source) is str and source.startswith('/') and
                              type(dest) is str and dest.startswith('/') and
                              '..' not in source.split('/') and '..' not in dest.split('/'), 'MOUNT_PATH')
                      source, dest = source.rstrip('/'), dest.rstrip('/')
                      if point.get('Type') == 'volume':
                          require(source in roots, 'VOLUME_OUTSIDE_COPY')
                          volume_count += 1
                      elif point.get('Type') == 'bind' and type(point.get('RW')) is bool:
                          if point['RW']:
                              rw_binds += 1
                          else:
                              ro_binds += 1
                      else:
                          unknown += 1
                      if len(pgdata) == 1 and (pgdata[0] == dest or pgdata[0].startswith(dest + '/')):
                          candidates.append((len(dest), source + pgdata[0][len(dest):]))
                  if candidates and max(candidates)[1] == pg_path:
                      pg_bindings.append(record['Image'])
                  services.append({'role': public_role, 'image': record['Image'], 'volumes': volume_count})
                  files = labels.get('com.docker.compose.project.config_files')
                  working = labels.get('com.docker.compose.project.working_dir')
                  if type(files) is str and type(working) is str and working.startswith('/'):
                      require(len(files) <= 8192, 'COMPOSE_LABEL_SIZE_BOUND')
                      require(len(working) <= 4096, 'COMPOSE_WORKING_BOUND')
                      for path in files.split(','):
                          require(path and '\0' not in path, 'COMPOSE_REFERENCE_PATH')
                          if not path.startswith('/'):
                              path = working.rstrip('/') + '/' + path
                          compose_files.add(path)
                          require(len(compose_files) <= MAX_COMPOSE_REFERENCES, 'COMPOSE_REFERENCE_BOUND')
              require(len(pg_bindings) == 1 and images[pg_bindings[0]]['postgresMajor'] == 16,
                      'POSTGRES_IMAGE_BINDING')
              # Metadata only: no Compose compiler, dotenv resolution, credential reads or config contents.
              existing, missing = 0, 0
              deadline = time.monotonic() + 15
              for path in sorted(compose_files):
                  require(time.monotonic() <= deadline, 'COMPOSE_REFERENCE_TIME_BOUND')
                  try:
                      parent, name = path.rsplit('/', 1)
                      fd = open_directory(parent)
                      try:
                          info = os.stat(name, dir_fd=fd, follow_symlinks=False)
                          require(stat.S_ISREG(info.st_mode), 'COMPOSE_REFERENCE_TYPE')
                          existing += 1
                      finally:
                          os.close(fd)
                  except FileNotFoundError:
                      missing += 1
                  require(time.monotonic() <= deadline, 'COMPOSE_REFERENCE_TIME_BOUND')
              return {'services': services, 'postgresImage': pg_bindings[0],
                      'readWriteBindsOutsideCopy': rw_binds, 'readOnlyBindsOutsideCopy': ro_binds,
                      'unknownMounts': unknown, 'composeLabelFilesPresent': existing,
                      'composeLabelFilesMissing': missing, 'currentComposeParity': 'NOT_ATTESTED',
                      'bindContentsPreserved': False}



          PY_INSPECTION_1

      - name: Prepare stopped recovery inspector publication schema
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >> "$RUNNER_TEMP/stopped-recovery-inspector.py" <<'PY_INSPECTION_2'
          def mem_available():
              # procfs system metadata, never process environment or command lines.
              with open('/proc/meminfo', 'rb') as handle:
                  raw = handle.read(16385)
              require(len(raw) <= 16384, 'MEMINFO_BOUND')
              match = re.search(rb'^MemAvailable:\s+([0-9]+) kB$', raw, re.M)
              require(match is not None, 'MEMINFO_SCHEMA')
              return integer(int(match[1]) * 1024)


          def process_counts():
              counts = {'postgres': 0, 'caddy': 0}
              started = time.monotonic()
              names = os.listdir('/proc')
              require(len(names) <= 32768, 'PROCESS_BOUND')
              for name in names:
                  require(time.monotonic() - started <= 5, 'PROCESS_BOUND')
                  if not name.isdecimal():
                      continue
                  try:
                      with open('/proc/' + name + '/comm', 'rb') as handle:
                          comm = handle.read(64).strip()
                  except (FileNotFoundError, ProcessLookupError):
                      continue
                  if comm in (b'postgres', b'postmaster'):
                      counts['postgres'] += 1
                  elif comm == b'caddy':
                      counts['caddy'] += 1
              return counts


          def inspect(target, run):
              require(HEX.fullmatch(target) and re.fullmatch('[0-9]{1,20}', run), 'INVOCATION')
              with observation('ARCHIVE'):
                  copied, device = archive()
              with observation('ENGINE'):
                  info = api('/info')
                  containers = api('/containers/json?all=true')
                  require(type(info) is dict and info.get('DockerRootDir') == DOCKER_ROOT and
                          type(containers) is list and not containers and info.get('Containers') == 0,
                          'ENGINE_NOT_EMPTY')
              with observation('METADATA'):
                  records = metadata()
              with observation('VOLUMES'):
                  inventory = api('/volumes')
                  require(type(inventory) is dict and type(inventory.get('Volumes')) is list, 'VOLUME_API')
                  names = [item['Name'] for item in inventory['Volumes']]
                  profile, pg_path, roots, data_device, tokens = volume_profile(names)
              with observation('IMAGES'):
                  images = {image: image_metadata(api('/images/' + image + '/json'), image)
                            for image in sorted({record['Image'] for record in records})}
              with observation('BINDINGS'):
                  bound = bindings(records, roots, pg_path, images)
              with observation('REVALIDATION'):
                  # Recheck identities after inspection; no atomic-snapshot claim.
                  require(records == metadata() and api('/containers/json?all=true') == [], 'RUNTIME_DRIFT')
                  deadline = time.monotonic() + 30
                  for path, token in tokens:
                      require(time.monotonic() <= deadline, 'PROFILE_BOUND')
                      parent, name = path.rsplit('/', 1)
                      fd = open_directory(parent)
                      try:
                          require(signature(os.stat(name, dir_fd=fd, follow_symlinks=False)) == token,
                                  'PROFILE_CHANGED')
                      finally:
                          os.close(fd)
              with observation('CAPACITY'):
                  available = mem_available()
              with observation('PROCESSES'):
                  processes = process_counts()
              return {'schemaVersion': SCHEMA, 'targetSha': target, 'runId': run, 'passed': True,
                      'status': 'READ_ONLY_METADATA_INSPECTED', 'runtimeRestored': False,
                      'startupAuthorized': False, 'archive': copied, 'volumes': profile,
                      'images': list(images.values()), 'bindings': bound,
                      'capacity': {'memAvailableBytes': available,
                                   'archiveAndDataSameFilesystem': device == data_device},
                      'processes': processes,
                      'databaseIntegrity': 'NOT_ATTESTED'}


          def validate(value, target, run, ssh_status):
              require(type(value) is dict, 'OUTPUT_TYPE')
              failed = {'schemaVersion', 'passed', 'status', 'runtimeRestored', 'startupAuthorized', 'errorCode'}
              complete = (failed - {'errorCode'}) | {'targetSha', 'runId', 'archive', 'volumes', 'images', 'bindings',
                                                    'capacity', 'processes', 'databaseIntegrity'}
              require(set(value) in (failed, complete) and value['schemaVersion'] == SCHEMA and
                      value['runtimeRestored'] is False and value['startupAuthorized'] is False,
                      'OUTPUT_SCHEMA')
              if set(value) == failed:
                  require(value['passed'] is False and value['status'] == 'INSPECTION_FAILED' and
                          value['errorCode'] in ERROR_CODES and ssh_status == 1, 'OUTPUT_FAILURE')
                  return value
              require(value['passed'] is True and ssh_status == 0 and value['targetSha'] == target and
                      HEX.fullmatch(target) and value['runId'] == run and re.fullmatch('[0-9]{1,20}', run) and
                      value['status'] == 'READ_ONLY_METADATA_INSPECTED' and
                      value['databaseIntegrity'] == 'NOT_ATTESTED', 'OUTPUT_IDENTITY')
              copied = value['archive']
              require(type(copied) is dict and set(copied) == {'ciphertextBytes', 'ciphertextSha256',
                      'sourceBytes', 'sourceEntries', 'volumes', 'privateModesVerified',
                      'availableBytes', 'availableInodes'} and copied['ciphertextSha256'] == COPY_SHA and
                      copied['privateModesVerified'] is True and copied['volumes'] == 19, 'OUTPUT_ARCHIVE')
              for key in ('ciphertextBytes', 'sourceBytes', 'sourceEntries', 'availableBytes', 'availableInodes'):
                  integer(copied[key])
              require(0 < copied['ciphertextBytes'] <= MAX_ARCHIVE and
                      copied['sourceBytes'] <= 1024**3 and copied['sourceEntries'] <= MAX_ENTRIES,
                      'OUTPUT_ARCHIVE_BOUND')
              volumes = value['volumes']
              require(type(volumes) is dict and set(volumes) == {'volumes', 'entries', 'logicalBytes',
                      'allocatedBytes', 'postgres'} and volumes['volumes'] == 19, 'OUTPUT_VOLUMES')
              for key in ('entries', 'logicalBytes', 'allocatedBytes'):
                  integer(volumes[key])
              require(volumes['entries'] <= MAX_ENTRIES, 'OUTPUT_ENTRY_BOUND')
              pg = volumes['postgres']
              require(type(pg) is dict and set(pg) == {'major', 'uid', 'gid', 'logicalBytes',
                      'allocatedBytes', 'integrity'} and pg['major'] == 16 and
                      pg['integrity'] == 'NOT_ATTESTED', 'OUTPUT_POSTGRES')
              for key in ('uid', 'gid', 'logicalBytes', 'allocatedBytes'):
                  integer(pg[key])
              images = value['images']
              require(type(images) is list and 1 <= len(images) <= 32, 'OUTPUT_IMAGES')
              image_ids = set()
              for item in images:
                  require(type(item) is dict and set(item) == {'id', 'bytes', 'revision', 'os',
                          'architecture', 'postgresMajor'} and type(item['id']) is str and
                          IMAGE.fullmatch(item['id']) and item['id'] not in image_ids and
                          (item['revision'] is None or type(item['revision']) is str and HEX.fullmatch(item['revision'])) and
                          item['os'] in ('linux', 'windows', 'UNKNOWN') and item['architecture'] in
                          ('amd64', 'arm64', '386', 'arm', 'ppc64le', 's390x', 'UNKNOWN') and
                          (item['postgresMajor'] is None or type(item['postgresMajor']) is int and
                           0 <= item['postgresMajor'] <= 99), 'OUTPUT_IMAGE')
                  integer(item['bytes'])
                  image_ids.add(item['id'])
              bound = value['bindings']
              require(type(bound) is dict and set(bound) == {'services', 'postgresImage',
                      'readWriteBindsOutsideCopy', 'readOnlyBindsOutsideCopy', 'unknownMounts',
                      'composeLabelFilesPresent', 'composeLabelFilesMissing', 'currentComposeParity',
                      'bindContentsPreserved'} and bound['postgresImage'] in image_ids and
                      bound['currentComposeParity'] == 'NOT_ATTESTED' and bound['bindContentsPreserved'] is False,
                      'OUTPUT_BINDINGS')
              for key in ('readWriteBindsOutsideCopy', 'readOnlyBindsOutsideCopy', 'unknownMounts',
                          'composeLabelFilesPresent', 'composeLabelFilesMissing'):
                  integer(bound[key], 4096)
              require(bound['composeLabelFilesPresent'] + bound['composeLabelFilesMissing'] <=
                      MAX_COMPOSE_REFERENCES, 'OUTPUT_BINDINGS')
              require(type(bound['services']) is list and len(bound['services']) == len(EXPECTED_REFS),
                      'OUTPUT_SERVICES')
              for service in bound['services']:
                  require(type(service) is dict and set(service) == {'role', 'image', 'volumes'} and
                          service['role'] in ROLES | {'UNKNOWN'} and service['image'] in image_ids,
                          'OUTPUT_SERVICE')
                  integer(service['volumes'], 128)
              require(type(value['capacity']) is dict and set(value['capacity']) ==
                      {'memAvailableBytes', 'archiveAndDataSameFilesystem'} and
                      type(value['capacity']['archiveAndDataSameFilesystem']) is bool, 'OUTPUT_CAPACITY')
              integer(value['capacity']['memAvailableBytes'])
              require(type(value['processes']) is dict and set(value['processes']) == {'postgres', 'caddy'},
                      'OUTPUT_PROCESSES')
              for count in value['processes'].values():
                  integer(count, 32768)
              require(len(json.dumps(value).encode()) < 32768, 'OUTPUT_BOUND')
              return value


          ERROR_CODES = frozenset(('INVOCATION', 'INTEGER', 'DIRECTORY_PATH', 'LEAF_NAME',
              'ARCHIVE_DIGEST', 'ARCHIVE_DIRECTORY', 'ARCHIVE_PRIVATE_MODE', 'ARCHIVE_RECEIPT',
              'ENGINE_NOT_EMPTY', 'API_PATH', 'SOCKET_IDENTITY', 'API_STATUS', 'API_LIMIT',
              'CONTAINER_METADATA_COUNT', 'CONTAINER_ID', 'CONTAINER_METADATA', 'CONTAINER_LABELS',
              'CONTAINER_ENV', 'HISTORICAL_BINDING_DRIFT', 'VOLUME_API', 'POSTGRES_IMAGE_BINDING',
              'POSTGRES_CLUSTER_COUNT', 'POSTGRES_VERSION', 'POSTGRES_CONTROL', 'POSTGRES_DATABASE_MARKER',
              'POSTMASTER_PID_PRESENT', 'IMAGE_IDENTITY', 'IMAGE_CONFIG', 'IMAGE_LABELS', 'IMAGE_ENV',
              'MOUNT_METADATA', 'MOUNT_PATH', 'COMPOSE_LABEL_BOUND', 'COMPOSE_REFERENCE_TYPE',
              'COMPOSE_LABEL_SIZE_BOUND', 'COMPOSE_LABEL_COUNT_BOUND', 'COMPOSE_LABEL_BOTH_BOUND',
              'COMPOSE_WORKING_BOUND', 'COMPOSE_REFERENCE_PATH', 'COMPOSE_REFERENCE_BOUND', 'COMPOSE_REFERENCE_TIME_BOUND',
              'PROFILE_BOUND', 'PROFILE_CHANGED', 'PROFILE_DEVICE', 'PROFILE_TYPE', 'RUNTIME_DRIFT',
              'VOLUME_OUTSIDE_COPY', 'VOLUME_NAMES', 'FILE_CHANGED', 'FILE_LIMIT', 'FILE_TIMEOUT',
              'FILE_TYPE_SIZE', 'PROCESS_BOUND', 'MEMINFO_BOUND', 'MEMINFO_SCHEMA',
              'OUTPUT_TYPE', 'OUTPUT_SCHEMA', 'OUTPUT_FAILURE', 'OUTPUT_IDENTITY', 'OUTPUT_ARCHIVE',
              'OUTPUT_ARCHIVE_BOUND', 'OUTPUT_VOLUMES', 'OUTPUT_ENTRY_BOUND', 'OUTPUT_POSTGRES',
              'OUTPUT_IMAGES', 'OUTPUT_IMAGE', 'OUTPUT_BINDINGS', 'OUTPUT_SERVICES', 'OUTPUT_SERVICE',
              'OUTPUT_CAPACITY', 'OUTPUT_PROCESSES', 'OUTPUT_BOUND', 'INSPECTION_UNAVAILABLE')) | \
              frozenset(stage + '_UNAVAILABLE' for stage in OBSERVATION_STAGES)


          def inspection_result(target, run):
              try:
                  result = inspect(target, run)
                  validate(result, target, run, 0)
              except Exception as error:
                  # Never serialize exception text, paths, raw input or remote stderr.
                  result = {'schemaVersion': SCHEMA, 'passed': False, 'status': 'INSPECTION_FAILED',
                            'runtimeRestored': False, 'startupAuthorized': False,
                            'errorCode': error.args[0] if type(error) is InspectionError and
                            len(error.args) == 1 and type(error.args[0]) is str and
                            error.args[0] in ERROR_CODES else 'INSPECTION_UNAVAILABLE'}
              return result


          if __name__ == '__main__':
              result = inspection_result(sys.argv[1] if len(sys.argv) > 1 else '',
                                         sys.argv[2] if len(sys.argv) > 2 else '')
              print(json.dumps(result, separators=(',', ':'), sort_keys=True))
              raise SystemExit(0 if result['passed'] else 1)

          PY_INSPECTION_2

      - name: Read stopped recovery metadata once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" == "$TARGET_SHA" ]]
          set +e
          timeout 240 ssh -i "$HOME/.ssh/id_pc_prod" -p "$PROD_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$PROD_HOST" \
            "python3 -B -I - '$TARGET_SHA' '$GITHUB_RUN_ID'" < "$RUNNER_TEMP/stopped-recovery-inspector.py" \
            > "$RUNNER_TEMP/inspection-remote.json" 2> "$RUNNER_TEMP/inspection-remote.stderr"
          ssh_status=$?
          set -e
          echo "SSH_STATUS=$ssh_status" >> "$GITHUB_ENV"
          post_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          echo "POST_MAIN=$post_main" >> "$GITHUB_ENV"

      - name: Build closed inspection receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_INSPECTION_RECEIPT'
          import json
          import os
          from pathlib import Path
          namespace = {'__name__': 'inspection_receipt'}
          exec(compile((Path(os.environ['RUNNER_TEMP']) / 'stopped-recovery-inspector.py').read_text(), '<accepted inspection schema>', 'exec'), namespace)
          root = Path(os.environ['EVIDENCE_DIR'])
          result = {'passed': False, 'status': 'UNKNOWN', 'runtimeRestored': False, 'startupAuthorized': False}
          try:
              raw = (Path(os.environ['RUNNER_TEMP']) / 'inspection-remote.json').read_bytes()
              assert len(raw) <= 32768
              assert os.environ['POST_MAIN'] == os.environ['TARGET_SHA']
              result = namespace['validate'](json.loads(raw), os.environ['TARGET_SHA'], os.environ['GITHUB_RUN_ID'], int(os.environ['SSH_STATUS']))
          except Exception:
              pass
          (root / 'inspection.json').write_text(json.dumps(result, separators=(',', ':'), sort_keys=True) + '\n')
          summary = '## Stopped recovery inspection\n\n'
          summary += 'Target: `' + os.environ['TARGET_SHA'] + '`; run ' + os.environ['GITHUB_RUN_ID'] + '.\n\n'
          summary += 'Status: **' + result['status'] + '**. Services were not started; database integrity is NOT_ATTESTED.\n'
          if result.get('errorCode') in namespace['ERROR_CODES']:
              summary += '\nFixed failure code: `' + result['errorCode'] + '`.\n'
          if result['passed']:
              summary += '\nArchive/capacity: `' + json.dumps(result['archive'], separators=(',', ':')) + '`\n'
              summary += '\nVolumes/PostgreSQL: `' + json.dumps(result['volumes'], separators=(',', ':')) + '`\n'
              summary += '\nMemory/filesystem: `' + json.dumps(result['capacity'], separators=(',', ':')) + '`\n'
              summary += '\nProcess counts: `' + json.dumps(result['processes'], separators=(',', ':')) + '`\n'
              bound = result['bindings']
              summary += '\nMount/config coverage: `' + json.dumps({key: value for key, value in bound.items() if key != 'services'}, separators=(',', ':')) + '`\n'
              summary += '\nImage IDs/revisions and fixed service roles are in the closed technical artifact. Current Compose parity and bind-content preservation are not attested.\n'
          summary += '\nNo archive, passphrase, configuration contents, raw metadata or raw transport output is published. This receipt does not authorize startup or restore.\n'
          assert len(summary.encode()) < 6000
          (root / 'issue-record.md').write_text(summary)
          PY_INSPECTION_RECEIPT

      - name: Publish bounded stopped recovery receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$EVIDENCE_DIR/issue-record.md" ]]; then
            gh issue comment "$AUTHORITY_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/issue-record.md"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stopped-recovery-inspection-${{ github.run_id }}
          path: |
            artifacts/stopped-recovery-inspection/target-sha.txt
            artifacts/stopped-recovery-inspection/inspection.json
            artifacts/stopped-recovery-inspection/issue-record.md
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Clear runner-only inspection transport
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_pc_prod" "$RUNNER_TEMP/inspection-remote.json" "$RUNNER_TEMP/inspection-remote.stderr" "$RUNNER_TEMP/stopped-recovery-inspector.py"

      - name: Require validated stopped recovery inspection
        shell: bash
        run: |
          python3 - <<'PY_INSPECTION_RESULT'
          import json
          import os
          from pathlib import Path
          value = json.loads((Path(os.environ['EVIDENCE_DIR']) / 'inspection.json').read_text())
          assert value.get('passed') is True and value.get('status') == 'READ_ONLY_METADATA_INSPECTED'
          PY_INSPECTION_RESULT

  geometry-contract:
    name: Validate prospective root geometry contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 4637 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       ((github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
        github.event.comment.performed_via_github_app.id == 1144995) &&
       github.event.comment.body == '/production inspect-root-filesystem current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      target_sha: ${{ steps.geometry-target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Extract exact inline geometry source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_GEOMETRY_EXTRACT'
          import ast, hashlib, os, pathlib, re, textwrap
          from types import SimpleNamespace as N
          text = pathlib.Path('.github/workflows/production-docker-headroom-diagnostic.yml').read_text()
          match = re.search(r"^          cat > \"\$RUNNER_TEMP/root-geometry.py\" <<'PY_ROOT_GEOMETRY'\n(.*?)^          PY_ROOT_GEOMETRY\n", text, re.M | re.S)
          assert match is not None
          raw = textwrap.dedent(match[1]).encode()
          assert hashlib.sha256(raw).hexdigest() == '4078001f9e60b6a1ff28090f90f71cf3ade4157df85efcb8b16eec15feb15c88'
          tree = ast.parse(raw)
          for node in ast.walk(tree):
              if isinstance(node, (ast.Import, ast.ImportFrom)):
                  names = [x.name for x in node.names] if isinstance(node, ast.Import) else [node.module]
                  assert not any(x.split('.')[0] in {'subprocess', 'socket', 'ctypes'} for x in names)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  assert node.func.attr not in {'system', 'popen', 'execv', 'execve', 'fork', 'spawnv'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'root-geometry.py').write_bytes(raw)
          conditions = {}
          for job in ('geometry-contract', 'root-geometry'):
              block = text.split('\n  ' + job + ':\n', 1)[1].split('\n    runs-on:', 1)[0]
              match = re.search(r'\n    if: >-\n((?:      [^\n]*\n)+)', block + '\n')
              expression = ' '.join(line.strip() for line in match[1].splitlines())
              expression = expression.replace('&&', ' and ').replace('||', ' or ').replace('needs.geometry-contract', 'needs.geometry_contract')
              tree = ast.parse(expression, mode='eval')
              allowed = (ast.Expression, ast.BoolOp, ast.And, ast.Or, ast.Compare, ast.Eq,
                         ast.Attribute, ast.Name, ast.Load, ast.Constant)
              assert all(type(node) in allowed for node in ast.walk(tree))
              conditions[job] = compile(tree, '<actual geometry condition>', 'eval')
          def route(event='issue_comment', issue=4637, author='owner', assoc='OWNER',
                    actor='owner', triggering='owner', app=0,
                    body='/production inspect-root-filesystem current-main', result='success'):
              github = N(event_name=event, repository_owner='owner', actor=actor, triggering_actor=triggering,
                         event=N(issue=N(number=issue), comment=N(user=N(login=author), author_association=assoc,
                                 performed_via_github_app=N(id=app), body=body)))
              context = {'github': github, 'needs': N(geometry_contract=N(result=result))}
              return tuple(bool(eval(conditions[job], {'__builtins__': {}}, context)) for job in conditions)
          cases = [({}, (True, True)), ({'app': 1144995, 'actor': 'connector', 'triggering': 'connector'}, (True, True)),
                   ({'event': 'pull_request'}, (True, False)), ({'event': 'push'}, (False, False)),
                   ({'issue': 3072}, (False, False)), ({'issue': 4638}, (False, False)),
                   ({'author': 'other'}, (False, False)), ({'assoc': 'MEMBER'}, (False, False)),
                   ({'actor': 'other'}, (False, False)), ({'triggering': 'other'}, (False, False)),
                   ({'app': 1, 'actor': 'other'}, (False, False)),
                   ({'app': 1144995, 'actor': 'other', 'author': 'other'}, (False, False)),
                   ({'body': '/production inspect-root-filesystem current-main\n'}, (False, False)),
                   ({'body': '/production inspect-root-filesystem current-main '}, (False, False)),
                   ({'body': '/production diagnose-docker current-main'}, (False, False)),
                   ({'body': '/production inspect-root-filesystem other'}, (False, False)),
                   ({'result': 'failure'}, (True, False)), ({'result': 'skipped'}, (True, False))]
          for inputs, expected in cases:
