name: Production Gekta First-User Mail Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-gekta-first-user-mail-diagnostic.yml'
      - 'scripts/production-gekta-first-user-mail-diagnostic.sh'
      - 'scripts/check-production-gekta-first-user-mail-diagnostic.mjs'
      - 'docs/platform-v7/autopilot/scopes/gekta-first-user-mail-diagnostic-31800628106-3072.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-gekta-first-user-mail-diagnostic
  cancel-in-progress: false

env:
  RELEASE_ISSUE_NUMBER: '3072'
  SOURCE_RUN_ID: '31800628106'
  SOURCE_RUN_ATTEMPT: '1'
  SOURCE_DEPLOYED_SHA: 'f4cca72a0716c0fe2c94fd5e838d18be774b9812'
  SOURCE_WINDOW_SINCE: '2026-08-14T12:30:00Z'
  SOURCE_WINDOW_UNTIL: '2026-08-14T12:38:00Z'

jobs:
  contract:
    name: Validate bounded Gekta mail diagnostic
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production gekta-first-user-mail-diagnose 31800628106 current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate fail-closed read-only contract
        run: |
          set -Eeuo pipefail
          node scripts/check-production-gekta-first-user-mail-diagnostic.mjs
          bash -n scripts/production-gekta-first-user-mail-diagnostic.sh

      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          git merge-base --is-ancestor "$SOURCE_DEPLOYED_SHA" "$target"
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  diagnose:
    name: Classify failed Gekta registration mail without mutation
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      EMAIL_TEMPLATE: ${{ secrets.PC_PROD_P0_MAILBOX_EMAIL_TEMPLATE || secrets.PC_PROD_P0_EMAIL_TEMPLATE }}
      IMAP_HOST: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_HOST || secrets.PC_PROD_P0_IMAP_HOST }}
      IMAP_PORT: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PORT || secrets.PC_PROD_P0_IMAP_PORT }}
      IMAP_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
      IMAP_FOLDER: ${{ secrets.PC_PROD_P0_IMAP_FOLDER }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Execute bounded read-only diagnostic
        shell: bash
        run: bash scripts/production-gekta-first-user-mail-diagnostic.sh
