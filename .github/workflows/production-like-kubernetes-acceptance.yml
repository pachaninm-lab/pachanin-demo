name: Production-like Kubernetes Acceptance

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'infra/docker/**'
      - 'infra/helm/grainflow/**'
      - 'infra/kind/production-like/**'
      - 'infra/release/**'
      - 'scripts/release/**'
      - 'scripts/test-production-like-outbox-runtime-evidence.mjs'
      - '.github/workflows/production-like-kubernetes-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'infra/docker/**'
      - 'infra/helm/grainflow/**'
      - 'infra/kind/production-like/**'
      - 'infra/release/**'
      - 'scripts/release/**'
      - 'scripts/test-production-like-outbox-runtime-evidence.mjs'
      - '.github/workflows/production-like-kubernetes-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-like-kubernetes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: artifacts/industrial-readiness

jobs:
  source-preflight:
    name: Exact-head source and scope preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      EXACT_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout complete exact-head history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.8.0'
      - name: Test source collector rejection paths
        run: bash scripts/release/production-like-kubernetes-source-preflight-test.sh
      - name: Bind public source bytes to bounded guard execution
        run: |
          python3 -I - <<'PY_SOURCE_PREFLIGHT'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import zipfile


          def require(ok):
              if not ok:
                  raise ValueError('SOURCE_PREFLIGHT_REJECTED')


          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL, timeout=30)


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def main():
              head, base = os.environ['EXACT_HEAD'], os.environ['EXACT_BASE']
              require(all(re.fullmatch('[0-9a-f]{40}', value) for value in (head, base)))
              require(git('rev-parse', 'HEAD').decode().strip() == head)
              require(git('rev-parse', '--is-shallow-repository').strip() == b'false')
              require(git('merge-base', base, head).strip())
              out = Path(os.environ['RUNNER_TEMP']) / 'ir20-source-preflight'
              out.mkdir(mode=0o700, exist_ok=False)
              report = {'schema': 'pc.source-preflight.v1', 'head': head, 'base': base,
                        'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                        'result': 'FAIL', 'stage': 'source-binding', 'independent_review': False, 'production_acceptance': False,
                        'sources': [], 'checks': []}
              def save():
                  pending = out / 'report.pending'
                  pending.write_text(json.dumps(report, indent=2) + '\n')
                  pending.replace(out / 'report.json')
              save()
              fixed = ['AGENTS.md', '.github/workflows/platform-v7-autopilot-guard.yml',
                       '.github/workflows/production-like-kubernetes-acceptance.yml',
                       'scripts/p7-autopilot-guard.sh', 'scripts/p7-autopilot-guard.test.mjs',
                       'scripts/p7-source-controlled-scope.mjs',
                       'docs/platform-v7/autopilot/autopilot-state.json']
              current = {}
              try:
                  report['node'] = subprocess.check_output(['node', '--version'], timeout=10).decode().strip()
                  report['merge_base'] = git('merge-base', base, head).decode().strip()
                  report['changed_paths'] = git('diff', '--no-renames', '--name-only', base + '...' + head).decode().splitlines()
                  total = 0
                  with zipfile.ZipFile(out / 'public-sources.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                      for label, sha in [('base', base), ('head', head)]:
                          report[label + '_tree'] = git('rev-parse', sha + '^{tree}').decode().strip()
                          scopes = git('ls-tree', '-r', '--name-only', sha, '--',
                                       'docs/platform-v7/autopilot/scopes').decode().splitlines()
                          paths = sorted(set(fixed + [p for p in scopes if p.endswith('.json')]))
                          require(len(paths) <= 5000)
                          for path in paths:
                              require(re.fullmatch('[A-Za-z0-9_./-]+', path) and '..' not in Path(path).parts)
                              entry = git('ls-tree', sha, '--', path).decode().strip().split()
                              require(len(entry) == 4 and entry[0] in ('100644', '100755') and entry[1] == 'blob' and entry[3] == path)
                              content = git('cat-file', 'blob', entry[2])
                              total += len(content)
                              require(len(content) <= 2 * 1024 * 1024 and total <= 32 * 1024 * 1024)
                              content.decode('utf-8')
                              require(hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == entry[2])
                              report['sources'].append({'ref': label, 'path': path, 'blob': entry[2],
                                                        'bytes': len(content), 'sha256': digest(content)})
                              archive.writestr(label + '/' + path, content)
                              if label == 'head':
                                  require(not Path(path).is_symlink() and Path(path).read_bytes() == content)
                                  current[path] = digest(content)
                  report['source_zip_sha256'] = digest((out / 'public-sources.zip').read_bytes())
                  save()
                  env = dict(os.environ, BASE_REF=base, HEAD_REF=head)
                  commands = [('guard-regressions', ['node', '--test', '--test-reporter=tap', 'scripts/p7-autopilot-guard.test.mjs']),
                              ('branch-scope', ['bash', 'scripts/p7-autopilot-guard.sh'])]
                  for name, command in commands:
                      report['stage'] = name
                      save()
                      # Raw test errors are private temporary bytes, not uploaded logs.
                      with tempfile.TemporaryFile() as raw:
                          result = subprocess.run(['timeout', '--kill-after=5s', '180s', *command], env=env,
                                                  stdout=raw, stderr=subprocess.STDOUT, timeout=195)
                          raw.seek(0)
                          output_hash, length, prefix = hashlib.sha256(), 0, b''
                          while chunk := raw.read(65536):
                              output_hash.update(chunk)
                              length += len(chunk)
                              if len(prefix) < 2 * 1024 * 1024:
                                  prefix += chunk[:2 * 1024 * 1024 - len(prefix)]
                      text = prefix.decode('utf-8', errors='replace')
                      check = {'name': name, 'exit_code': result.returncode, 'output_bytes': length,
                               'output_sha256': output_hash.hexdigest(), 'summary_truncated': length > len(prefix)}
                      if name == 'guard-regressions':
                          check['tap_totals'] = {k: int(v) for k, v in re.findall(r'^# (tests|pass|fail|cancelled|skipped) (\d+)\s*$', text, re.M)}
                          check['failing_ordinals'] = [int(v) for v in re.findall(r'^not ok (\d+)\b', text, re.M)]
                          test_source = Path('scripts/p7-autopilot-guard.test.mjs').read_text()
                          check['source_matched_failing_names'] = [title for title in re.findall(r'^not ok \d+ - ([^\n]{1,240})$', text, re.M) if title in test_source]
                          check['test_locations'] = sorted(set(re.findall(r'p7-autopilot-guard\.test\.mjs:(\d+:\d+)', text)))
                      report['checks'].append(check)
                      save()
                  require(all(not Path(p).is_symlink() and digest(Path(p).read_bytes()) == h for p, h in current.items()))
                  require(all(c['exit_code'] == 0 for c in report['checks']))
                  totals = report['checks'][0]['tap_totals']
                  require(totals.get('tests', 0) > 0 and totals.get('fail') == 0 and totals.get('cancelled') == 0)
                  report['stage'] = 'complete'
                  report['result'] = 'PASS'
                  save()
              except Exception:
                  report['result'] = 'FAIL'
                  save()
                  raise


          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  print('SOURCE_PREFLIGHT_FAILED', file=sys.stderr)
                  sys.exit(1)
          PY_SOURCE_PREFLIGHT
      - name: Retain source-bound result without raw errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ir20-source-preflight-${{ env.EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ir20-source-preflight/
          if-no-files-found: error
          retention-days: 7

  production-like-kubernetes:
    name: Multi-node kind · immutable rollout · deep outbox runtime
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reject incorrect outbox runtime evidence
        run: |
          node --test scripts/test-production-like-outbox-runtime-evidence.mjs
          bash scripts/release/production-like-kubernetes-kafka-storage-test.sh

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Install pinned kind and kubectl
        run: |
          set -euo pipefail
          KIND_VERSION=v0.23.0
          curl --fail --location --retry 5 \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" \
            -o /tmp/kind-linux-amd64
          curl --fail --location --retry 5 \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum" \
            -o /tmp/kind-linux-amd64.sha256sum
          (cd /tmp && sha256sum --check kind-linux-amd64.sha256sum)
          sudo install -m 0755 /tmp/kind-linux-amd64 /usr/local/bin/kind

          KUBECTL_VERSION=v1.30.4
          curl --fail --location --retry 5 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o /tmp/kubectl
          curl --fail --location --retry 5 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" \
            -o /tmp/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          kind version
          kubectl version --client
          helm version
          docker version
          docker buildx version

      - name: Execute production-like Kubernetes acceptance
        run: bash scripts/release/production-like-kubernetes-acceptance.sh

      - name: Execute deep outbox worker runtime acceptance
        run: |
          set -euo pipefail
          # Isolate the synthetic stale-token CAS row from live worker claims. The
          # restricted app_outbox principal performs both controlled claims, then
          # the accepted two-replica topology is restored before runtime scenarios.
          kubectl scale deployment grainflow-outbox-worker -n grainflow-acceptance --replicas=0
          kubectl wait --for=delete pod -n grainflow-acceptance \
            -l app.kubernetes.io/name=grainflow-outbox-worker --timeout=180s
          bash scripts/release/production-like-kubernetes-outbox-stale-token.sh
          kubectl scale deployment grainflow-outbox-worker -n grainflow-acceptance --replicas=2
          kubectl rollout status deployment/grainflow-outbox-worker \
            -n grainflow-acceptance --timeout=360s
          bash scripts/release/production-like-kubernetes-outbox-runtime.sh

      - name: Verify broker storage across outage tests
        if: always()
        run: bash scripts/release/production-like-kubernetes-kafka-storage.sh verify

      - name: Enforce machine-readable Kubernetes evidence
        if: always()
        run: |
          node scripts/release/production-like-kubernetes-fallback-evidence.mjs
          node scripts/release/production-like-kubernetes-enforce-evidence.mjs

      - name: Build canonical outbox runtime evidence
        if: always()
        run: node scripts/release/build-production-like-outbox-runtime-evidence.mjs

      - name: Enforce exact-head outbox runtime evidence
        if: always()
        run: node scripts/release/enforce-production-like-outbox-runtime-evidence.mjs

      - name: Upload production-like Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-like-kubernetes-${{ env.EXACT_HEAD }}
          path: |
            ${{ env.EVIDENCE_DIR }}
            artifacts/worker-topology
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup disposable acceptance environment
        if: always()
        run: |
          kind delete cluster --name grainflow-acceptance || true
          docker rm -f kind-registry || true
          docker system df || true

  production-like-kubernetes-gate:
    name: Production-like Kubernetes Gate · blocking
    if: always()
    runs-on: ubuntu-latest
    needs: [production-like-kubernetes]
    steps:
      - name: Enforce acceptance job
        run: test "${{ needs.production-like-kubernetes.result }}" = success
