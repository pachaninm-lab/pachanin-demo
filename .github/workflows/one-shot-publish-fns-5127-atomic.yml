name: One-shot publish FNS 5127 atomic patch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.head_ref == 'governance/publish-fns-5127-atomic-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pachaninm-lab/pachanin-demo
          ref: feat/role-eligibility-fns-registry-coverage-authority-5064
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Guard exact target head and apply audited patch atomically
        shell: bash
        env:
          EXPECTED_HEAD: e1a51f37dc4d2a548c023cc9477752022f5ccdfe
          TARGET_BRANCH: feat/role-eligibility-fns-registry-coverage-authority-5064
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || { echo "TARGET_HEAD_MOVED expected=$EXPECTED_HEAD actual=$actual"; exit 1; }
          cat > /tmp/fns.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/fns.patch.gz.b64 | gzip -d > /tmp/fns.patch
          git apply --check /tmp/fns.patch
          git apply /tmp/fns.patch
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            apps/api/prisma/migrations/20260906180000_role_eligibility_fns_registry_coverage_authority/migration.sql \
            apps/api/src/modules/role-eligibility/role-eligibility-fns-registry-coverage.service.ts \
            apps/api/src/modules/role-eligibility/role-eligibility-fns-registry-coverage.spec.ts \
            scripts/role-eligibility-postgres-smoke.sh | sort)"
          test "$changed" = "$expected" || { echo "UNEXPECTED_SCOPE"; printf '%s\n' "$changed"; exit 1; }
          bash -n scripts/role-eligibility-postgres-smoke.sh
          git config user.name 'pachaninm-lab'
          git config user.email 'pachaninm@gmail.com'
          git add -- $changed
          git commit -m 'fix(role-eligibility): execute FNS negative authority in PostgreSQL' -m 'Move the canonical EGRUL absence/finality predicate into one PostgreSQL resolver, validate legal-entity INN checksum inside the DB authority boundary, and make real PostgreSQL smoke execute fail-closed no-finality, proven-finality negative, positive, and invalid-identifier cases. Registration/enforcement/production remain unchanged.'
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PUBLISHED_FNS_HEAD=$new_head"
