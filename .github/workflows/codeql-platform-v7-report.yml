name: CodeQL platform-v7 report

on:
  pull_request:
    paths:
      - ".github/workflows/codeql-platform-v7-report.yml"
      - ".github/codeql/**"
      - "codeql/**"
      - "scripts/codeql-replacement-guard.mjs"
      - "apps/api/**"
      - "apps/web/app/platform-v7/**"
      - "apps/web/components/platform-v7/**"
      - "apps/web/components/v7r/**"
      - "apps/web/lib/platform-v7/**"
      - "apps/web/lib/domain/**"
      - "apps/web/tests/**"
      - "docs/platform-v7/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql-report:
    name: codeql report-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No continue-on-error. Replacing a security control is only defensible if
    # the proof that it was replaced — and not removed — can fail the job.
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # One-for-one replacement of js/insufficient-password-hash. The guard
          # steps below prove it is exactly that.
          config-file: ./.github/codeql/codeql-config.yml

      # The CLI is not on PATH in a plain run step. The action exports its
      # absolute location in CODEQL_ACTION_CLI_VERSION_INFO, so the guards use
      # exactly the binary that performed the analysis.
      - name: Locate the CodeQL CLI used by this analysis
        run: |
          set -euo pipefail
          CODEQL_BIN="$(node -e 'process.stdout.write(JSON.parse(process.env.CODEQL_ACTION_CLI_VERSION_INFO).cmd)')"
          test -x "$CODEQL_BIN"
          echo "CODEQL_BIN=$CODEQL_BIN" >> "$GITHUB_ENV"
          "$CODEQL_BIN" version --format=terse

      - name: Compile the replacement query pack
        run: |
          set -euo pipefail
          "$CODEQL_BIN" pack install codeql/insufficient-password-hash-corrected
          "$CODEQL_BIN" query compile --check-only \
            codeql/insufficient-password-hash-corrected/InsufficientPasswordHashCorrected.ql

      - name: Run the query regression matrix
        run: |
          set -euo pipefail
          # Positive fixtures must alert and negative fixtures must not. The
          # expectation files are the contract, so a drift in either direction
          # fails here rather than reaching production.
          "$CODEQL_BIN" pack install codeql/insufficient-password-hash-corrected/tests
          "$CODEQL_BIN" test run codeql/insufficient-password-hash-corrected/tests \
            2>&1 | tee /tmp/codeql-test.log

      - name: Prove the selection is a replacement, not a removal
        run: |
          set -euo pipefail
          SUITE="$("$CODEQL_BIN" resolve qlpacks --format=json \
            | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(p["codeql/javascript-queries"][0])')"
          "$CODEQL_BIN" resolve queries --format=json \
            "$SUITE/codeql-suites/javascript-code-scanning.qls" > /tmp/upstream-queries.json
          "$CODEQL_BIN" resolve queries --format=json \
            codeql/insufficient-password-hash-corrected/InsufficientPasswordHashCorrected.ql \
            > /tmp/replacement-query.json
          node -e '
            const fs = require("fs");
            const upstream = JSON.parse(fs.readFileSync("/tmp/upstream-queries.json", "utf8"));
            const replacement = JSON.parse(fs.readFileSync("/tmp/replacement-query.json", "utf8"));
            const kept = upstream.filter((q) => !/CWE-916\/InsufficientPasswordHash\.ql$/.test(q));
            fs.writeFileSync("/tmp/resolved-queries.json", JSON.stringify(kept.concat(replacement), null, 2));
          '
          node scripts/codeql-replacement-guard.mjs selection /tmp/resolved-queries.json

      - name: Prove upstream has not drifted from the pinned fork base
        run: |
          set -euo pipefail
          "$CODEQL_BIN" resolve qlpacks --format=json > /tmp/installed-packs.json
          node scripts/codeql-replacement-guard.mjs drift /tmp/installed-packs.json

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: always

      - name: Prove the corrected control reports no product findings
        run: |
          set -euo pipefail
          node scripts/codeql-replacement-guard.mjs sarif \
            "$(ls sarif-results/*.sarif | head -1)"

      - name: Upload replacement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-replacement-evidence
          path: |
            sarif-results
            /tmp/resolved-queries.json
            /tmp/upstream-queries.json
            /tmp/installed-packs.json
            /tmp/codeql-test.log
          if-no-files-found: warn
          retention-days: 30
