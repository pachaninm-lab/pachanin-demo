name: Production P0 All-Role Bank Failure Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-all-role-bank-failure-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: production-p0-all-role-bank-failure-diagnostic
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  SOURCE_SHA: 334f50aef79fc251bb625cb6b45f7b1ed4d0975f
  SOURCE_SINCE: '2026-08-27T06:50:30Z'
  SOURCE_UNTIL: '2026-08-27T06:51:45Z'
  SOURCE_CORRELATION: 'p0-all-role-register:334f50aef79f:33046149523-1:bank'

jobs:
  diagnose:
    name: Read-only classify bank registration failure
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - name: Resolve pinned REG.RU identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ -n "$host" && "$host" == "${SSH_HOST_SECRET:-}" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"
          key_path="$RUNNER_TEMP/pc-p0-bank-diagnostic-key"
          known_hosts="$RUNNER_TEMP/pc-p0-bank-diagnostic-known-hosts"
          validate_key(){
            local source="$1" public_key
            tr -d '\r' < "$source" > "$key_path"
            chmod 0600 "$key_path"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$key_path" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$key_path" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" plain escaped decoded
            [[ -n "$raw" ]] || return 1
            plain="$(mktemp)"; escaped="$(mktemp)"; decoded="$(mktemp)"
            printf '%s\n' "$raw" > "$plain"
            validate_key "$plain" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$escaped"
            validate_key "$escaped" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$decoded" 2>/dev/null && validate_key "$decoded" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            rm -f "$plain" "$escaped" "$decoded"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}"
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$known_hosts"
          rm -f "$scan"
          chmod 0600 "$known_hosts"
          ssh -i "$key_path" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            "$user@$host" 'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null' >/dev/null
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Emit sanitized correlated production facts
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          KEY_PATH: ${{ steps.ssh.outputs.key_path }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$KEY_PATH" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "SOURCE_SHA='$SOURCE_SHA' SOURCE_SINCE='$SOURCE_SINCE' SOURCE_UNTIL='$SOURCE_UNTIL' SOURCE_CORRELATION='$SOURCE_CORRELATION' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || { echo 'WEB_RUNTIME_AUTHORITY=AMBIGUOUS'; exit 21; }
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} == 1 )) || { echo 'API_RUNTIME_AUTHORITY=AMBIGUOUS'; exit 22; }
          api_id="${api_ids[0]}"
          web_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")"
          api_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")"
          [[ "$web_revision" == "$SOURCE_SHA" && "$api_revision" == "$SOURCE_SHA" ]] || { echo 'SOURCE_REVISION=DIFFERENT'; exit 23; }
          web_log="$(mktemp)"; api_log="$(mktemp)"
          trap 'rm -f "$web_log" "$api_log"' EXIT
          docker logs --since "$SOURCE_SINCE" --until "$SOURCE_UNTIL" "$web_id" > "$web_log" 2>&1 || true
          docker logs --since "$SOURCE_SINCE" --until "$SOURCE_UNTIL" "$api_id" > "$api_log" 2>&1 || true
          python3 - "$web_log" "$api_log" "$SOURCE_CORRELATION" <<'PY'
          import json, re, sys
          web_path, api_path, correlation = sys.argv[1:]
          web_lines = [line.rstrip('\n') for line in open(web_path, encoding='utf-8', errors='replace') if correlation in line]
          api_lines = [line.rstrip('\n') for line in open(api_path, encoding='utf-8', errors='replace') if correlation in line]

          def yn(value):
              return 'YES' if value else 'NO'

          facts = {
              'WEB_CORRELATED_LINES': str(len(web_lines)),
              'API_CORRELATED_LINES': str(len(api_lines)),
          }
          markers = {
              'WEB_REGISTRATION_CONFIGURATION_ERROR': 'registration_configuration_error',
              'WEB_REGISTRATION_API_REJECTED': 'registration_api_rejected',
              'WEB_REGISTRATION_DELIVERY_CONTRACT_INVALID': 'registration_delivery_contract_invalid',
              'WEB_REGISTRATION_EMAIL_DELIVERY_RESULT': 'registration_email_delivery_result',
              'WEB_REGISTRATION_EMAIL_DELIVERY_DEFERRED': 'registration_email_delivery_deferred',
              'WEB_REGISTRATION_TRANSPORT_FAILURE': 'registration_transport_failure',
          }
          for key, marker in markers.items():
              facts[key] = yn(any(marker in line for line in web_lines))

          def payload_for(marker):
              for line in reversed(web_lines):
                  if marker not in line:
                      continue
                  start = line.find('{', line.find(marker))
                  if start < 0:
                      continue
                  try:
                      payload = json.loads(line[start:])
                  except Exception:
                      continue
                  if payload.get('correlationId') == correlation:
                      return payload
              return {}

          rejected = payload_for('registration_api_rejected')
          if rejected:
              status = rejected.get('status')
              code = str(rejected.get('code') or '')
              if isinstance(status, int) and 100 <= status <= 599:
                  facts['WEB_UPSTREAM_STATUS'] = str(status)
              if re.fullmatch(r'[A-Z0-9_]{3,96}', code):
                  facts['WEB_UPSTREAM_CODE'] = code

          delivery = payload_for('registration_email_delivery_result')
          if delivery:
              delivered = delivery.get('delivered')
              provider = str(delivery.get('provider') or '')
              reason = str(delivery.get('reason') or '')
              if isinstance(delivered, bool):
                  facts['WEB_EMAIL_DELIVERED'] = str(delivered).lower()
              if provider in {'resend', 'smtp', 'none'}:
                  facts['WEB_EMAIL_PROVIDER'] = provider
              safe_reason = re.sub(r'[^A-Za-z0-9_:;.-]+', '_', reason)[:120]
              if safe_reason:
                  facts['WEB_EMAIL_REASON_CLASS'] = safe_reason

          api_joined = '\n'.join(api_lines)
          for code in [
              'RATE_LIMITED', 'RATE_LIMIT_UNAVAILABLE', 'REGISTRATION_IDENTITY_PREPARATION_FAILED',
              'IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD', 'CONSENT_VERSION_NOT_CURRENT',
              'REGISTRATION_VERSION_CONFLICT', 'REGISTRATION_EMAIL_TOKEN_INVALID',
          ]:
              facts[f'API_CODE_{code}'] = yn(code in api_joined)
          facts['API_PRISMA_KNOWN_REQUEST_ERROR'] = yn('PrismaClientKnownRequestError' in api_joined)
          facts['API_PRISMA_TRANSACTION_ERROR'] = yn('P2028' in api_joined)
          facts['PRODUCTION_MUTATION'] = 'NONE'
          for key in sorted(facts):
              print(f'{key}={facts[key]}')
          PY
          REMOTE

      - name: Remove local credentials
        if: always()
        shell: bash
        run: |
          rm -f '${{ steps.ssh.outputs.key_path }}' '${{ steps.ssh.outputs.known_hosts }}' \
            "$RUNNER_TEMP/pc-p0-bank-diagnostic-key" "$RUNNER_TEMP/pc-p0-bank-diagnostic-known-hosts"
