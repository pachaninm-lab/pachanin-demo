name: Production P0 REG.RU Host SMTP Runtime Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-regru-host-smtp-runtime-recover.yml'
      - 'docs/platform-v7/autopilot/scopes/production-p0-regru-host-smtp-runtime-recover-3896.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-regru-host-smtp-runtime-recover
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3072
  EVIDENCE_DIR: artifacts/production-p0-regru-host-smtp-runtime-recover
  SMTP_HOST: mail.hosting.reg.ru
  SMTP_PORT: '465'
  SMTP_FROM: access@xn----8sbjf4befbjgs9b.xn--p1ai

jobs:
  contract:
    name: Validate bounded host-side mail recovery contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (
            github.actor == github.repository_owner &&
            github.triggering_actor == github.repository_owner
          ) ||
          (
            github.actor == 'chatgpt-codex-connector[bot]' &&
            github.triggering_actor == 'chatgpt-codex-connector[bot]' &&
            github.event.comment.performed_via_github_app.id == 1144995
          )
        ) &&
        github.event.comment.body == '/production p0-regru-host-smtp-runtime-recover current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bounded contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          compile(Path('scripts/production-p0-regru-mailbox-smtp-proof.py').read_text(encoding='utf-8'), 'mail-proof.py', 'exec')
          scope = json.loads(Path('docs/platform-v7/autopilot/scopes/production-p0-regru-host-smtp-runtime-recover-3896.json').read_text())
          assert scope['schemaVersion'] == 'platform-v7.concurrent-scope.v1'
          assert scope['branch'] == 'fix/gekta-speed-regru-host-smtp-recover-3896'
          assert scope['issue'] == 3896 and scope['releaseIssue'] == 3072
          assert scope['productionHosting'] == 'REG_RU_EXISTING_INFRASTRUCTURE_ONLY'
          assert set(scope['allowedPaths']) == {
              '.github/workflows/production-p0-regru-host-smtp-runtime-recover.yml',
              'docs/platform-v7/autopilot/scopes/production-p0-regru-host-smtp-runtime-recover-3896.json',
          }
          b = scope['boundaries']
          assert b['ownerOnly'] is True and b['exactMainGuard'] is True
          assert b['databaseMutation'] is False and b['deploymentMutation'] is False
          assert b['credentialOutput'] is False and b['rawEnvironmentOutput'] is False and b['rawLogOutput'] is False
          assert b['smtpAndImapProofFromProductionHost'] is True
          assert b['runtimeFileMutationAfterProofOnly'] is True
          assert b['probeEmailMutation'] is True
          assert b['newRecurringCostRub'] == 0
          PY
          bash -n scripts/provision-production-p0-password-reset-runtime.sh

      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  recover:
    name: Prove mail from REG.RU host and materialize auth runtime
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != '' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (
        (
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner
        ) ||
        (
          github.actor == 'chatgpt-codex-connector[bot]' &&
          github.triggering_actor == 'chatgpt-codex-connector[bot]' &&
          github.event.comment.performed_via_github_app.id == 1144995
        )
      ) &&
      github.event.comment.body == '/production p0-regru-host-smtp-runtime-recover current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      PC_PROBE_EMAIL_TEMPLATE: ${{ secrets.PC_PROD_P0_MAILBOX_EMAIL_TEMPLATE || secrets.PC_PROD_P0_EMAIL_TEMPLATE }}
      SMTP_USER: ${{ secrets.PC_SMTP_USER || secrets.PC_PROD_SMTP_USER || secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.PC_SMTP_PASS || secrets.PC_PROD_SMTP_PASS || secrets.SMTP_PASSWORD || secrets.SMTP_PASS || secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
      MAILBOX_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
      MAILBOX_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
      IMAP_FOLDER: ${{ secrets.PC_PROD_P0_IMAP_FOLDER }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact current-main checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${PC_PROD_HOST:-}")"
          user="$(trim "${PC_PROD_SSH_USER:-}")"
          port="$(trim "${PC_PROD_SSH_PORT:-22}")"
          expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ -n "$host" && -n "$user" ]]
          [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${PC_PROD_SSH_KEY:-}" || try_slot "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_slot "${VPS_SSH_KEY:-}" || exit 40

          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          rm -f "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$user@$host" 'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; python3 --version >/dev/null; echo ROOT_SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Build protected host-side proof bundle
        id: bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/pc-regru-host-mail-${GITHUB_RUN_ID}.json"
          runner="$RUNNER_TEMP/pc-regru-host-mail-runner-${GITHUB_RUN_ID}.py"
          remote_prefix="/tmp/pc-regru-host-mail-${GITHUB_RUN_ID}"
          umask 077
          python3 - "$bundle" "$remote_prefix" <<'PY'
          import json, os, sys
          def scalar(name, default=''):
              value = os.environ.get(name, default)
              if not value or any(c in value for c in ('\n', '\r', '\x00')):
                  raise SystemExit(20)
              return value
          smtp_user = os.environ.get('SMTP_USER', '').strip() or 'access@xn----8sbjf4befbjgs9b.xn--p1ai'
          if smtp_user == 'access@процент-агро.рф':
              smtp_user = 'access@xn----8sbjf4befbjgs9b.xn--p1ai'
          folder = os.environ.get('IMAP_FOLDER', '').strip() or 'INBOX'
          if any(c in folder for c in ('\n', '\r', '\x00')):
              raise SystemExit(20)
          prefix = sys.argv[2]
          payload = {
              'PC_PROBE_SMTP_HOST': 'mail.hosting.reg.ru',
              'PC_PROBE_SMTP_PORT': '465',
              'PC_PROBE_SMTP_USER': smtp_user,
              'PC_PROBE_SMTP_PASSWORD': scalar('SMTP_PASSWORD'),
              'PC_PROBE_MAILBOX_USER': scalar('MAILBOX_USER'),
              'PC_PROBE_MAILBOX_PASSWORD': scalar('MAILBOX_PASSWORD'),
              'PC_PROBE_EMAIL_TEMPLATE': scalar('PC_PROBE_EMAIL_TEMPLATE'),
              'PC_PROBE_MAIL_FROM': 'access@xn----8sbjf4befbjgs9b.xn--p1ai',
              'PC_PROBE_IMAP_FOLDER': folder,
              'PC_PROBE_TARGET_SHA': scalar('TARGET_SHA'),
              'PC_PROBE_RUN_ID': scalar('GITHUB_RUN_ID'),
              'PC_PROBE_LOGIN_OUTPUT': prefix + '.login',
          }
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=True, separators=(',', ':'))
          os.chmod(sys.argv[1], 0o600)
          PY
          cat > "$runner" <<'PY'
          import json, os, runpy, sys
          mode = sys.argv[1]
          if mode == 'proof':
              with open(sys.argv[2], encoding='utf-8') as handle:
                  payload = json.load(handle)
              for key, value in payload.items():
                  if not isinstance(key, str) or not isinstance(value, str) or any(c in value for c in ('\n', '\r', '\x00')):
                      raise SystemExit(20)
                  os.environ[key] = value
              runpy.run_path(sys.argv[3], run_name='__main__')
          elif mode == 'runtime':
              with open(sys.argv[2], encoding='utf-8') as handle:
                  payload = json.load(handle)
              login = open(payload['PC_PROBE_LOGIN_OUTPUT'], encoding='ascii').read().strip()
              if not login or any(c in login for c in ('\n', '\r', '\x00', ' ')):
                  raise SystemExit(21)
              values = {
                  'PC_SMTP_HOST': payload['PC_PROBE_SMTP_HOST'],
                  'PC_SMTP_USER': login,
                  'PC_SMTP_PASS': payload['PC_PROBE_SMTP_PASSWORD'],
                  'PC_SMTP_PORT': payload['PC_PROBE_SMTP_PORT'],
                  'PC_MAIL_FROM': payload['PC_PROBE_MAIL_FROM'],
              }
              old = os.umask(0o077)
              try:
                  with open(sys.argv[3], 'w', encoding='utf-8') as handle:
                      for key, value in values.items():
                          if any(c in value for c in ('\n', '\r', '\x00')):
                              raise SystemExit(22)
                          handle.write(f'{key}={value}\n')
              finally:
                  os.umask(old)
              os.chmod(sys.argv[3], 0o600)
          else:
              raise SystemExit(23)
          PY
          chmod 0600 "$bundle" "$runner"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "prefix=$remote_prefix" >> "$GITHUB_OUTPUT"

      - name: Prove authenticated send and IMAP receipt from REG.RU host
        id: proof
        continue-on-error: true
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
          RUNNER: ${{ steps.bundle.outputs.runner }}
          PREFIX: ${{ steps.bundle.outputs.prefix }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${scp_common[@]}" "$BUNDLE" "$USER@$HOST:$PREFIX.json"
          scp "${scp_common[@]}" "$RUNNER" "$USER@$HOST:$PREFIX-runner.py"
          scp "${scp_common[@]}" scripts/production-p0-regru-mailbox-smtp-proof.py "$USER@$HOST:$PREFIX-proof.py"
          set +e
          ssh "${ssh_common[@]}" "$USER@$HOST" \
            "set -Eeuo pipefail; chmod 0600 '$PREFIX.json' '$PREFIX-runner.py' '$PREFIX-proof.py'; python3 '$PREFIX-runner.py' proof '$PREFIX.json' '$PREFIX-proof.py'" \
            > "$EVIDENCE_DIR/mail-proof.txt"
          rc=$?
          set -e
          if [[ "$rc" != 0 ]]; then
            blocker=HOST_MAIL_PROOF_FAILED
            case "$rc" in
              31) blocker=REG_RU_SMTP_EHLO_FAILED ;;
              32) blocker=REG_RU_SMTP_AUTH_FAILED ;;
              33) blocker=REG_RU_CANONICAL_SENDER_REFUSED ;;
              34) blocker=CONTROL_MAILBOX_RECIPIENT_REFUSED ;;
              35) blocker=REG_RU_SMTP_DATA_REFUSED ;;
              36)
                class="$(sed -n 's/^SMTP_TRANSPORT_CLASS=//p' "$EVIDENCE_DIR/mail-proof.txt" | tail -n1)"
                stage="$(sed -n 's/^SMTP_FAILURE_STAGE=//p' "$EVIDENCE_DIR/mail-proof.txt" | tail -n1)"
                [[ "$class" =~ ^[A-Z0-9_]+$ ]] || class=UNKNOWN
                [[ "$stage" =~ ^[A-Z0-9_]+$ ]] || stage=UNKNOWN
                blocker="REG_RU_SMTP_${class}_${stage}"
                ;;
              41|42) blocker=CONTROL_IMAP_READ_FAILED ;;
              43) blocker=CONTROL_MAIL_RECEIPT_IDENTITY_MISMATCH ;;
              44) blocker=CONTROL_MAIL_RECEIPT_TIMEOUT ;;
              255) blocker=PINNED_REG_RU_SSH_EXECUTION_FAILED ;;
            esac
            printf 'HOST_MAIL_PROOF_BLOCKER=%s\n' "$blocker" > "$EVIDENCE_DIR/blocker.txt"
            exit "$rc"
          fi
          grep -Fxq SMTP_AUTHENTICATED_SEND_OK=1 "$EVIDENCE_DIR/mail-proof.txt"
          grep -Fxq IMAP_PROBE_RECEIPT_OK=1 "$EVIDENCE_DIR/mail-proof.txt"

      - name: Materialize root-only auth-mail runtime after proof
        id: provision
        if: steps.proof.outcome == 'success'
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          PREFIX: ${{ steps.bundle.outputs.prefix }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          grep -Fxq SMTP_AUTHENTICATED_SEND_OK=1 "$EVIDENCE_DIR/mail-proof.txt"
          grep -Fxq IMAP_PROBE_RECEIPT_OK=1 "$EVIDENCE_DIR/mail-proof.txt"
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${scp_common[@]}" scripts/provision-production-p0-password-reset-runtime.sh "$USER@$HOST:$PREFIX-provision.sh"
          ssh "${ssh_common[@]}" "$USER@$HOST" \
            "set -Eeuo pipefail; chmod 0700 '$PREFIX-provision.sh'; python3 '$PREFIX-runner.py' runtime '$PREFIX.json' '$PREFIX-runtime.env'; chmod 0600 '$PREFIX-runtime.env'; PC_RECONCILE_ACTIVE_RUNTIME=1 '$PREFIX-provision.sh' provision '$PREFIX-runtime.env'" \
            > "$EVIDENCE_DIR/provision.txt"
          grep -Eq '^PASSWORD_RESET_DELIVERY_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.txt"
          grep -Eq '^REGISTRATION_DELIVERY_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.txt"
          grep -Eq '^TRANSACTIONAL_MAIL_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.txt"
          grep -Fxq TRANSACTIONAL_MAIL_CHANNEL=SMTP "$EVIDENCE_DIR/provision.txt"
          grep -Fxq PASSWORD_RESET_RUNTIME_VALID=1 "$EVIDENCE_DIR/provision.txt"
          grep -Fxq AUTH_MAIL_RUNTIME_VALID=1 "$EVIDENCE_DIR/provision.txt"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]

      - name: Upload bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-regru-host-smtp-runtime-recover-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish bounded recovery result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          result=FAIL
          blocker=HOST_MAIL_PROOF_FAILED
          mutation=NONE
          if [[ "${{ steps.proof.outcome }}" == success && "${{ steps.provision.outcome }}" == success ]]; then
            result=PASS
            blocker=NONE
            mutation=ROOT_ONLY_AUTH_MAIL_RUNTIME_FILES
          elif [[ -f "$EVIDENCE_DIR/blocker.txt" ]]; then
            blocker="$(sed -n 's/^HOST_MAIL_PROOF_BLOCKER=//p' "$EVIDENCE_DIR/blocker.txt" | tail -n1)"
          elif [[ "${{ steps.proof.outcome }}" == success ]]; then
            blocker=AUTH_MAIL_RUNTIME_PROVISION_FAILED
          fi
          [[ "$blocker" =~ ^[A-Z0-9_]+$ ]] || blocker=RESULT_EVIDENCE_INVALID
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production P0 REG.RU host-side mail recovery

          - exact main: \`$TARGET_SHA\`
          - result: \`$result\`
          - blocker: \`$blocker\`
          - proof origin: \`PINNED_REG_RU_PRODUCTION_HOST\`
          - authenticated test send + IMAP receipt: \`$([[ "$result" == PASS ]] && echo PASS || echo NOT_PROVEN)\`
          - production mutation: \`$mutation\`
          - database/deployment mutation: \`NONE\`
          - credentials/mailbox identity/raw SMTP/raw IMAP: \`NOT_PUBLISHED\`
          - new recurring cost: \`0 RUB\`" >/dev/null

      - name: Remove bounded temporary assets
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          PREFIX: ${{ steps.bundle.outputs.prefix }}
        shell: bash
        run: |
          set +e
          if [[ -n "${HOST:-}" && -n "${USER:-}" && -n "${PORT:-}" && -n "${PREFIX:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$USER@$HOST" "rm -f '$PREFIX.json' '$PREFIX-runner.py' '$PREFIX-proof.py' '$PREFIX.login' '$PREFIX-runtime.env' '$PREFIX-provision.sh'" >/dev/null 2>&1 || true
          fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
          rm -f "${{ steps.bundle.outputs.bundle }}" "${{ steps.bundle.outputs.runner }}"
          unset SMTP_PASSWORD MAILBOX_PASSWORD PC_PROD_SSH_KEY PC_PROD_SSH_PRIVATE_KEY VPS_SSH_KEY

      - name: Enforce recovery result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ steps.proof.outcome }}" == success ]]
          [[ "${{ steps.provision.outcome }}" == success ]]
          grep -Fxq SMTP_AUTHENTICATED_SEND_OK=1 "$EVIDENCE_DIR/mail-proof.txt"
          grep -Fxq IMAP_PROBE_RECEIPT_OK=1 "$EVIDENCE_DIR/mail-proof.txt"
          grep -Fxq AUTH_MAIL_RUNTIME_VALID=1 "$EVIDENCE_DIR/provision.txt"
