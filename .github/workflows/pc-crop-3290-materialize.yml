name: PC-CROP 3290 Materialize
# Second user-authored push activates the newly introduced workflow.

on:
  push:
    branches:
      - fix/pc-crop-successor-trigger-handoff-3290
    paths:
      - '.github/workflows/pc-crop-3290-materialize.yml'
      - 'scripts/pc-crop-3290/materialize.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-crop-3290-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact governed branch
        uses: actions/checkout@v4
        with:
          ref: fix/pc-crop-successor-trigger-handoff-3290
          fetch-depth: 0

      - name: Apply deterministic source transformation
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pc-crop-3290/materialize.mjs
          node scripts/pc-crop-3290/materialize.mjs
          node --check scripts/pc-crop-predecessor-trigger-governance.mjs
          node --check scripts/pc-crop-successor-trigger-governance.mjs
          node scripts/pc-crop-predecessor-trigger-governance.mjs --apply
          node scripts/pc-crop-successor-trigger-governance.mjs

      - name: Commit exact materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'PC-CROP governance: hand off shared triggers to successor acceptance'
          git push origin HEAD:fix/pc-crop-successor-trigger-handoff-3290
