name: Production Auth-Mail Worker Network Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-auth-mail-worker-network-repair.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-auth-mail-worker-network-repair
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  DEPLOYED_PRODUCTION_SHA: f166f50e8526cf43f3193e771be05ebc66888494
  REPAIR_COMMAND: /production p0-auth-mail-worker-network-repair deployed
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate worker-network-only repair contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce bounded mutation and rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/production-auth-mail-worker-network-repair.yml').read_text(encoding='utf-8')
          required=[
            'docker network connect','docker network disconnect','rollback_network',
            'AUTH_MAIL_PRISMACLIENTINITIALIZATIONERROR','WORKER_NETWORK_REPAIR=PASS',
            'API_WEB_UNCHANGED=PASS','WORKER_READY=PASS',
            'CONTROL_PLANE_MUTATION=AUTH_MAIL_WORKER_NETWORK_ONLY',
            'WORKER_SIDE_EFFECT_BOUNDARY=AUTH_MAIL_OUTBOX_PROCESSING_MAY_RESUME'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('missing invariant: '+' | '.join(missing))
          repair=text.split('\n  repair:\n',1)[1]
          forbidden=[
            'docker restart','docker rm','docker compose','docker run','docker stop','docker kill',
            'ALTER ROLE','CREATE ROLE','DROP ROLE','UPDATE auth.','INSERT INTO','DELETE FROM',
            'PC_SMTP_PASS=','AUTH_MAIL_DATABASE_URL=','PASSWORD_RESET_REPLAYED YES'
          ]
          bad=[x for x in forbidden if x in repair]
          if bad: raise SystemExit('unsafe repair surface: '+' | '.join(bad))
          PY

  repair:
    name: Attach exact worker to exact API network with rollback
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-worker-network-repair deployed' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind current main to deployed auth-mail code
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$main_sha" ]]
          git cat-file -e "${DEPLOYED_PRODUCTION_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOYED_PRODUCTION_SHA" "$main_sha"
          git diff --quiet "$DEPLOYED_PRODUCTION_SHA..$main_sha" -- \
            apps/api/src/auth-mail-worker.ts \
            apps/api/src/modules/auth-mail/auth-mail-crypto.ts \
            apps/api/src/modules/auth-mail/auth-mail-smtp.ts \
            infra/docker/Dockerfile.api \
            scripts/provision-production-auth-mail-runtime.sh \
            scripts/production-auth-mail-outbox-cutover-core.sh
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || exit 10
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$ready" == 1 ]] || exit 15
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; python3 --version >/dev/null; echo SSH_AUTH_OK' | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Repair only worker network membership
        id: repair
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"; clean="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$DEPLOYED_PRODUCTION_SHA'" > "$raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          deployed_sha="$1"
          emit(){ printf '%s=%s\n' "$1" "$2"; }
          fail(){ emit WORKER_NETWORK_REPAIR FAIL; emit ERROR_CODE "$1"; emit CONTROL_PLANE_MUTATION NONE; exit "${2:-1}"; }
          [[ "$(id -u)" -eq 0 ]] || fail ROOT_REQUIRED 20
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || fail DEPLOYED_SHA_INVALID 21

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || fail WEB_CARDINALITY_NOT_ONE 22
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          mapfile -t worker_ids < <(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker')
          (( ${#api_ids[@]} == 1 && ${#worker_ids[@]} == 1 )) || fail RUNTIME_CARDINALITY_INVALID 23
          api_id="${api_ids[0]}"; worker_id="${worker_ids[0]}"
          api_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id" 2>/dev/null || true)"
          web_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id" 2>/dev/null || true)"
          worker_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$worker_id" 2>/dev/null || true)"
          [[ "$api_revision" == "$deployed_sha" && "$web_revision" == "$deployed_sha" && "$worker_revision" == "$deployed_sha" ]] || fail REVISION_DRIFT 24
          api_image="$(docker inspect --format '{{.Image}}' "$api_id")"
          worker_image="$(docker inspect --format '{{.Image}}' "$worker_id")"
          [[ -n "$api_image" && "$worker_image" == "$api_image" ]] || fail WORKER_IMAGE_DRIFT 25

          api_restart_before="$(docker inspect --format '{{.RestartCount}}' "$api_id")"
          web_restart_before="$(docker inspect --format '{{.RestartCount}}' "$web_id")"
          api_id_before="$api_id"; web_id_before="$web_id"

          user_value="$(docker inspect --format '{{.Config.User}}' "$worker_id" 2>/dev/null || true)"
          case "$user_value" in ''|0|0:0|root|root:root) fail WORKER_USER_BOUNDARY_INVALID 26;; esac
          cmd_json="$(docker inspect --format '{{json .Config.Cmd}}' "$worker_id")"
          entry_json="$(docker inspect --format '{{json .Config.Entrypoint}}' "$worker_id")"
          python3 - "$cmd_json" "$entry_json" <<'PY' || fail WORKER_COMMAND_BOUNDARY_INVALID 27
          import json,sys
          if json.loads(sys.argv[1]) != ['dist/apps/api/src/auth-mail-worker.js']: raise SystemExit(1)
          if json.loads(sys.argv[2]) != ['/nodejs/bin/node']: raise SystemExit(1)
          PY

          startup_codes="$(docker logs --tail 300 "$worker_id" 2>&1 | sed -nE 's/^Auth-mail worker failed to start: ([A-Z0-9_]{1,120})$/\1/p' | sort -u || true)"
          [[ "$startup_codes" == AUTH_MAIL_PRISMACLIENTINITIALIZATIONERROR ]] || fail STARTUP_CLASS_CHANGED 28
          state_before="$(docker inspect --format '{{.State.Status}}' "$worker_id" 2>/dev/null || true)"
          health_before="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id" 2>/dev/null || true)"
          [[ "$state_before" == restarting || "$health_before" == unhealthy ]] || fail WORKER_NOT_IN_PROVEN_FAILURE_STATE 29

          mapfile -t api_networks < <(docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$api_id" | sed '/^$/d' | sort -u)
          mapfile -t worker_networks < <(docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$worker_id" | sed '/^$/d' | sort -u)
          (( ${#api_networks[@]} == 1 && ${#worker_networks[@]} == 1 )) || fail NETWORK_CARDINALITY_NOT_ONE 30
          api_network="${api_networks[0]}"; old_network="${worker_networks[0]}"
          [[ "$api_network" != "$old_network" ]] || fail NETWORK_ALREADY_MATCHES 31
          api_driver="$(docker network inspect --format '{{.Driver}}' "$api_network" 2>/dev/null || true)"
          old_driver="$(docker network inspect --format '{{.Driver}}' "$old_network" 2>/dev/null || true)"
          [[ "$api_driver" == bridge && "$old_driver" == bridge ]] || fail NETWORK_DRIVER_UNSUPPORTED 32
          emit PRECONDITION_NETWORK_MISMATCH PASS

          api_connected=0
          old_disconnected=0
          mutation_started=0
          rollback_network(){
            set +e
            rollback_ok=1
            if (( old_disconnected == 1 )); then
              for attempt in $(seq 1 20); do
                docker network connect --alias auth-mail-worker "$old_network" "$worker_id" >/dev/null 2>&1 || true
                docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$worker_id" | grep -Fxq "$old_network" && break
                sleep 1
              done
              docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$worker_id" | grep -Fxq "$old_network" || rollback_ok=0
            fi
            if (( api_connected == 1 )); then
              docker network disconnect "$api_network" "$worker_id" >/dev/null 2>&1 || true
              docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$worker_id" | grep -Fxq "$api_network" && rollback_ok=0
            fi
            if (( rollback_ok == 1 )); then
              emit ROLLBACK_COMPLETE YES
            else
              emit ROLLBACK_COMPLETE NO
            fi
            emit CONTROL_PLANE_MUTATION ROLLED_BACK
          }
          on_error(){
            rc=$?
            trap - ERR
            if (( mutation_started == 1 )); then rollback_network; else emit CONTROL_PLANE_MUTATION NONE; fi
            emit WORKER_NETWORK_REPAIR FAIL
            emit ERROR_CODE REPAIR_FAILED
            exit "$rc"
          }
          trap on_error ERR

          mutation_started=1
          connected=0
          for attempt in $(seq 1 30); do
            if docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$worker_id" | grep -Fxq "$api_network"; then connected=1; break; fi
            docker network connect --alias auth-mail-worker "$api_network" "$worker_id" >/dev/null 2>&1 || true
            sleep 1
          done
          (( connected == 1 )) || false
          api_connected=1

          healthy=0
          for attempt in $(seq 1 90); do
            state="$(docker inspect --format '{{.State.Status}}' "$worker_id" 2>/dev/null || true)"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id" 2>/dev/null || true)"
            if [[ "$state" == running && "$health" == healthy ]] && docker exec "$worker_id" /nodejs/bin/node -e "fetch('http://127.0.0.1:3003/ready',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" >/dev/null 2>&1; then healthy=1; break; fi
            sleep 1
          done
          (( healthy == 1 )) || false
          emit WORKER_DB_BOOTSTRAP_RECOVERED PASS

          docker network disconnect "$old_network" "$worker_id" >/dev/null
          old_disconnected=1
          mapfile -t final_networks < <(docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$worker_id" | sed '/^$/d' | sort -u)
          (( ${#final_networks[@]} == 1 )) || false
          [[ "${final_networks[0]}" == "$api_network" ]] || false

          final_state="$(docker inspect --format '{{.State.Status}}' "$worker_id")"
          final_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id")"
          [[ "$final_state" == running && "$final_health" == healthy ]] || false
          docker exec "$worker_id" /nodejs/bin/node -e "fetch('http://127.0.0.1:3003/ready',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" >/dev/null

          mapfile -t api_after < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          mapfile -t web_after < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=web')
          (( ${#api_after[@]} == 1 && ${#web_after[@]} == 1 )) || false
          [[ "${api_after[0]}" == "$api_id_before" && "${web_after[0]}" == "$web_id_before" ]] || false
          [[ "$(docker inspect --format '{{.RestartCount}}' "$api_id_before")" == "$api_restart_before" ]] || false
          [[ "$(docker inspect --format '{{.RestartCount}}' "$web_id_before")" == "$web_restart_before" ]] || false
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id_before")" == "$deployed_sha" ]] || false
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id_before")" == "$deployed_sha" ]] || false

          trap - ERR
          emit API_WEB_UNCHANGED PASS
          emit WORKER_NETWORK_PARITY PASS
          emit WORKER_READY PASS
          emit WORKER_NETWORK_REPAIR PASS
          emit ERROR_CODE NONE
          emit ROLLBACK_COMPLETE NOT_NEEDED
          emit CONTROL_PLANE_MUTATION AUTH_MAIL_WORKER_NETWORK_ONLY
          emit WORKER_SIDE_EFFECT_BOUNDARY AUTH_MAIL_OUTBOX_PROCESSING_MAY_RESUME
          REMOTE
          remote_rc=$?
          set -e
          sed -nE '/^(WORKER_NETWORK_REPAIR|ERROR_CODE|PRECONDITION_NETWORK_MISMATCH|WORKER_DB_BOOTSTRAP_RECOVERED|API_WEB_UNCHANGED|WORKER_NETWORK_PARITY|WORKER_READY|ROLLBACK_COMPLETE|CONTROL_PLANE_MUTATION|WORKER_SIDE_EFFECT_BOUNDARY)=[A-Za-z0-9_.:-]{1,160}$/p' "$raw" > "$clean"
          rm -f "$raw"; cat "$clean"; echo "rc=$remote_rc" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r k v; do
            case "$k" in
              WORKER_NETWORK_REPAIR|ERROR_CODE|PRECONDITION_NETWORK_MISMATCH|WORKER_DB_BOOTSTRAP_RECOVERED|API_WEB_UNCHANGED|WORKER_NETWORK_PARITY|WORKER_READY|ROLLBACK_COMPLETE|CONTROL_PLANE_MUTATION|WORKER_SIDE_EFFECT_BOUNDARY) echo "${k,,}=$v" >> "$GITHUB_OUTPUT";;
            esac
          done < "$clean"
          rm -f "$clean"

      - name: Publish bounded network-repair evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
          RESULT: ${{ steps.repair.outputs.worker_network_repair }}
          ERROR_CODE: ${{ steps.repair.outputs.error_code }}
          PRECONDITION: ${{ steps.repair.outputs.precondition_network_mismatch }}
          DB_RECOVERED: ${{ steps.repair.outputs.worker_db_bootstrap_recovered }}
          API_WEB: ${{ steps.repair.outputs.api_web_unchanged }}
          NETWORK_PARITY: ${{ steps.repair.outputs.worker_network_parity }}
          WORKER_READY: ${{ steps.repair.outputs.worker_ready }}
          ROLLBACK: ${{ steps.repair.outputs.rollback_complete }}
          MUTATION: ${{ steps.repair.outputs.control_plane_mutation }}
          SIDE_EFFECT: ${{ steps.repair.outputs.worker_side_effect_boundary }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP auth-mail worker network repair'; echo
            echo "- diagnostic main: \`${MAIN_SHA:-unknown}\`"
            echo "- repair / safe error: \`${RESULT:-unknown} / ${ERROR_CODE:-unknown}\`"
            echo "- proven precondition network mismatch: \`${PRECONDITION:-unknown}\`"
            echo "- worker DB bootstrap recovered: \`${DB_RECOVERED:-unknown}\`"
            echo "- API/Web unchanged: \`${API_WEB:-unknown}\`"
            echo "- worker network parity / ready: \`${NETWORK_PARITY:-unknown} / ${WORKER_READY:-unknown}\`"
            echo "- rollback: \`${ROLLBACK:-unknown}\`"
            echo "- control-plane mutation: \`${MUTATION:-unknown}\`"
            echo "- worker side-effect boundary: \`${SIDE_EFFECT:-unknown}\`"
            echo '- no network name, container/image ID, raw log, DB URL, password, SMTP credential, recipient or token is published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Enforce repair result
        shell: bash
        env:
          REMOTE_RC: ${{ steps.repair.outputs.rc }}
          RESULT: ${{ steps.repair.outputs.worker_network_repair }}
          DB_RECOVERED: ${{ steps.repair.outputs.worker_db_bootstrap_recovered }}
          API_WEB: ${{ steps.repair.outputs.api_web_unchanged }}
          NETWORK_PARITY: ${{ steps.repair.outputs.worker_network_parity }}
          WORKER_READY: ${{ steps.repair.outputs.worker_ready }}
          MUTATION: ${{ steps.repair.outputs.control_plane_mutation }}
        run: |
          set -euo pipefail
          [[ "${REMOTE_RC:-1}" == 0 ]]
          [[ "$RESULT" == PASS ]]
          [[ "$DB_RECOVERED" == PASS ]]
          [[ "$API_WEB" == PASS ]]
          [[ "$NETWORK_PARITY" == PASS ]]
          [[ "$WORKER_READY" == PASS ]]
          [[ "$MUTATION" == AUTH_MAIL_WORKER_NETWORK_ONLY ]]
