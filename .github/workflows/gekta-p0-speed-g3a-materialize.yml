name: Gekta P0 SPEED G3A Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-p0-speed-g3a-materialize.yml'
      - 'scripts/materialize-gekta-p0-speed-g3a.mjs'
      - 'docs/platform-v7/autopilot/scopes/gekta-p0-speed-g3a-3896.json'

permissions:
  contents: write

concurrency:
  group: gekta-p0-speed-g3a-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.head_ref == 'fix/gekta-p0-speed-g3a-3896' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gekta-p0-speed-g3a-3896
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Materialize exact bounded source changes
        run: node scripts/materialize-gekta-p0-speed-g3a.mjs

      - name: Prove materialized scope and self-delete one-shot files
        run: |
          set -euo pipefail
          grep -Fq 'Begin with one short self-contained complete sentence that directly answers the question' \
            apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts
          grep -Fq "not.toContain('Begin with one short self-contained complete sentence" \
            apps/api/src/modules/ai-insights/restricted-public-qwen.service.spec.ts
          git rm .github/workflows/gekta-p0-speed-g3a-materialize.yml scripts/materialize-gekta-p0-speed-g3a.mjs
          GITHUB_HEAD_REF=fix/gekta-p0-speed-g3a-3896 BASE_REF=origin/main bash scripts/p7-autopilot-guard.sh
          git diff --check

      - name: Commit exact candidate back to the governed branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts \
                  apps/api/src/modules/ai-insights/restricted-public-qwen.service.spec.ts
          if git diff --cached --quiet && git diff --quiet; then
            echo 'Candidate already materialized.'
            exit 0
          fi
          git commit -m 'Gekta P0 SPEED G3A: shorten first safe answer block'
          git push origin HEAD:fix/gekta-p0-speed-g3a-3896
