name: Production Auth-Mail Worker Readiness Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-auth-mail-worker-readiness-diagnostic
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  SUBJECT_PRODUCTION_SHA: 033964e2e553c595482b774784cf808815eccbc7
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  diagnose:
    name: Read-only auth-mail worker readiness diagnostic
    if: >-
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-readiness current-main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind diagnostic main and failed production subject
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          diagnostic_main_sha="$(git rev-parse origin/main)"
          [[ "$diagnostic_main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$diagnostic_main_sha" ]]
          [[ "$SUBJECT_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SUBJECT_PRODUCTION_SHA}^{commit}"
          git merge-base --is-ancestor "$SUBJECT_PRODUCTION_SHA" "$diagnostic_main_sha"
          echo "diagnostic_main_sha=$diagnostic_main_sha" >> "$GITHUB_OUTPUT"
          echo "subject_sha=$SUBJECT_PRODUCTION_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'AUTH_MAIL_DIAGNOSTIC=FAIL_CANONICAL_VPS'; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14

          scan="$(mktemp)"; match="$(mktemp)"; pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; python3 --version >/dev/null; echo SSH_AUTH_OK' \
            | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Diagnose failed production worker without mutation
        id: diagnostic
        shell: bash
        env:
          SUBJECT_SHA: ${{ steps.target.outputs.subject_sha }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"; clean="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$SUBJECT_SHA'" > "$raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          subject_sha="$1"
          runtime_root='/var/lib/pc-secret-authority/runtime'
          db_file="$runtime_root/database-url"
          emit(){ printf '%s=%s\n' "$1" "$2"; }
          fail(){ emit AUTH_MAIL_READINESS_DIAGNOSTIC FAIL; emit ERROR_CODE "$1"; emit PRODUCTION_MUTATION NONE; exit "${2:-1}"; }
          cleanup_paths=()
          cleanup(){ for path in "${cleanup_paths[@]:-}"; do rm -f -- "$path"; done; }
          trap cleanup EXIT

          [[ "$(id -u)" -eq 0 ]] || fail ROOT_REQUIRED 20
          command -v docker >/dev/null 2>&1 || fail DOCKER_REQUIRED 21
          command -v python3 >/dev/null 2>&1 || fail PYTHON_REQUIRED 22
          [[ "$subject_sha" =~ ^[0-9a-f]{40}$ ]] || fail SUBJECT_SHA_INVALID 23

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || fail WEB_AUTHORITY_CARDINALITY 24
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "${web_ids[0]}")"
          [[ -n "$project" ]] || fail COMPOSE_PROJECT_MISSING 25

          subject_workers=()
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$candidate" 2>/dev/null || true)"
            [[ "$revision" == "$subject_sha" ]] && subject_workers+=("$candidate")
          done < <(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker')
          emit SUBJECT_WORKER_CARDINALITY "${#subject_workers[@]}"
          (( ${#subject_workers[@]} == 1 )) || fail SUBJECT_WORKER_CARDINALITY_NOT_ONE 26
          worker_id="${subject_workers[0]}"
          emit WORKER_REVISION PASS

          state="$(docker inspect --format '{{.State.Status}}' "$worker_id" 2>/dev/null || true)"
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id" 2>/dev/null || true)"
          restart_count="$(docker inspect --format '{{.RestartCount}}' "$worker_id" 2>/dev/null || true)"
          [[ "$state" =~ ^(created|running|paused|restarting|removing|exited|dead)$ ]] || state=unknown
          [[ "$health" =~ ^(none|starting|healthy|unhealthy)$ ]] || health=unknown
          [[ "$restart_count" =~ ^[0-9]+$ ]] || restart_count=0
          emit WORKER_STATE "$state"; emit WORKER_HEALTH "$health"
          if (( restart_count > 0 )); then emit WORKER_RESTARTED YES; else emit WORKER_RESTARTED NO; fi

          inspect_env="$(mktemp)"; inspect_mounts="$(mktemp)"; cleanup_paths+=("$inspect_env" "$inspect_mounts")
          chmod 0600 "$inspect_env" "$inspect_mounts"
          docker inspect --format '{{json .Config.Env}}' "$worker_id" > "$inspect_env"
          docker inspect --format '{{json .Mounts}}' "$worker_id" > "$inspect_mounts"
          python3 - "$inspect_env" <<'PY' || fail WORKER_ENV_BOUNDARY_FAILED 27
          import json, sys
          values={}
          for item in json.load(open(sys.argv[1], encoding='utf-8')) or []:
              name, sep, value=str(item).partition('=')
              if sep: values[name]=value
          expected={
            'NODE_ENV':'production','RUNTIME_COMPONENT':'auth-mail-worker','AUTH_MAIL_WORKER_ENABLED':'true',
            'AUTH_MAIL_WORKER_HEALTH_PORT':'3003','AUTH_MAIL_OUTBOX_KEYRING_DIR':'/run/pc-auth-mail/keyring',
            'AUTH_MAIL_OUTBOX_CURRENT_KEY_VERSION_FILE':'/run/pc-auth-mail/current-key-version',
            'AUTH_MAIL_DATABASE_URL_FILE':'/run/pc-auth-mail/database-url','AUTH_MAIL_TRANSPORT_FILE':'/run/pc-auth-mail/transport.env'}
          if any(values.get(k)!=v for k,v in expected.items()): raise SystemExit(1)
          if any(k in values for k in ('PC_SMTP_PASS','AUTH_MAIL_DATABASE_URL','DATABASE_URL','AUTH_DATABASE_URL')): raise SystemExit(1)
          PY
          emit WORKER_ENV_BOUNDARY PASS

          python3 - "$inspect_mounts" <<'PY' || fail WORKER_MOUNT_BOUNDARY_FAILED 28
          import json, sys
          expected={
            '/run/pc-auth-mail/keyring':'/var/lib/pc-secret-authority/runtime/keyring',
            '/run/pc-auth-mail/current-key-version':'/var/lib/pc-secret-authority/runtime/current-key-version',
            '/run/pc-auth-mail/database-url':'/var/lib/pc-secret-authority/runtime/database-url',
            '/run/pc-auth-mail/transport.env':'/var/lib/pc-secret-authority/runtime/transport.env'}
          seen={}
          for m in json.load(open(sys.argv[1], encoding='utf-8')) or []:
              d=str(m.get('Destination') or '')
              if d in expected: seen[d]=(str(m.get('Source') or ''), bool(m.get('RW')))
          if any(seen.get(d)!=(s,False) for d,s in expected.items()): raise SystemExit(1)
          PY
          emit WORKER_MOUNT_BOUNDARY PASS

          python3 - "$runtime_root" <<'PY' || fail RUNTIME_PROJECTION_INVALID 29
          import os,re,stat,sys
          from urllib.parse import urlsplit, unquote
          root=sys.argv[1]
          if not os.path.isdir(root) or os.path.islink(root): raise SystemExit(1)
          st=os.stat(root)
          if stat.S_IMODE(st.st_mode)!=0o700 or st.st_uid or st.st_gid: raise SystemExit(1)
          for name in ('current-key-version','database-url','transport.env'):
              p=os.path.join(root,name); st=os.stat(p)
              if not os.path.isfile(p) or os.path.islink(p) or stat.S_IMODE(st.st_mode)!=0o444 or st.st_uid or st.st_gid: raise SystemExit(1)
          version=open(os.path.join(root,'current-key-version'),encoding='utf-8').read().strip()
          if not re.fullmatch(r'[1-9][0-9]{0,2}',version): raise SystemExit(1)
          key=os.path.join(root,'keyring',f'v{version}.key'); st=os.stat(key)
          if stat.S_IMODE(st.st_mode)!=0o444 or st.st_uid or st.st_gid or not re.fullmatch(r'[A-Fa-f0-9]{64}',open(key,encoding='utf-8').read().strip()): raise SystemExit(1)
          url=urlsplit(open(os.path.join(root,'database-url'),encoding='utf-8').read().strip())
          if url.scheme not in ('postgres','postgresql') or unquote(url.username or '')!='pc_auth_mail_runtime' or not url.password or not url.hostname or not url.path.strip('/'): raise SystemExit(1)
          PY
          emit RUNTIME_PROJECTION PASS

          startup_codes="$(docker logs --tail 300 "$worker_id" 2>&1 | sed -nE 's/^Auth-mail worker failed to start: ([A-Z0-9_]{1,120})$/\1/p' | sort -u || true)"
          startup_count="$(grep -c . <<< "$startup_codes" || true)"
          if [[ "$startup_count" == 0 ]]; then startup_code=NONE; elif [[ "$startup_count" == 1 ]]; then startup_code="$startup_codes"; else startup_code=MULTIPLE_SAFE_CODES; fi
          [[ "$startup_code" =~ ^[A-Z0-9_]{1,120}$ ]] || startup_code=INVALID_SAFE_CODE
          emit STARTUP_CODE "$startup_code"

          mapfile -t pg_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" | while read -r id; do
            image="$(docker inspect --format '{{.Config.Image}}' "$id" 2>/dev/null || true)"
            service="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$id" 2>/dev/null || true)"
            if [[ "$image" == postgres:* || "$image" == */postgres:* || "$service" == postgres || "$service" == db || "$service" == database ]]; then printf '%s\n' "$id"; fi
          done)
          (( ${#pg_ids[@]} == 1 )) || fail POSTGRES_AUTHORITY_CARDINALITY 30
          pg_id="${pg_ids[0]}"
          postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$pg_id" | sed -n 's/^POSTGRES_USER=//p' | head -1)"
          postgres_db="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$pg_id" | sed -n 's/^POSTGRES_DB=//p' | head -1)"
          [[ -n "$postgres_user" ]] || postgres_user=postgres; [[ -n "$postgres_db" ]] || postgres_db="$postgres_user"
          set +e
          db_result="$(python3 - "$db_file" <<'PY' | docker exec -i "$pg_id" psql -X -qAt -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$postgres_db" 2>/dev/null
          from urllib.parse import urlsplit, unquote
          import sys
          raw=open(sys.argv[1],encoding='utf-8').read().strip(); u=urlsplit(raw)
          if u.scheme not in ('postgres','postgresql') or unquote(u.username or '')!='pc_auth_mail_runtime' or not u.password or not u.hostname or not u.path.strip('/'): raise SystemExit(1)
          print('\\connect '+raw)
          print("SELECT current_user || '|' || rolsuper || '|' || rolbypassrls || '|' || rolinherit FROM pg_roles WHERE rolname=current_user;")
          PY
          )"
          db_rc=$?; set -e
          if [[ "$db_rc" == 0 && "$db_result" == 'pc_auth_mail_runtime|f|f|f' ]]; then emit DB_PRINCIPAL_LOGIN PASS; else emit DB_PRINCIPAL_LOGIN FAIL; fi

          emit AUTH_MAIL_READINESS_DIAGNOSTIC PASS; emit ERROR_CODE NONE; emit PRODUCTION_MUTATION NONE
          REMOTE
          remote_rc=$?
          set -e

          sed -nE '/^(AUTH_MAIL_READINESS_DIAGNOSTIC|ERROR_CODE|SUBJECT_WORKER_CARDINALITY|WORKER_REVISION|WORKER_STATE|WORKER_HEALTH|WORKER_RESTARTED|WORKER_ENV_BOUNDARY|WORKER_MOUNT_BOUNDARY|RUNTIME_PROJECTION|STARTUP_CODE|DB_PRINCIPAL_LOGIN|PRODUCTION_MUTATION)=[A-Za-z0-9_.:-]{1,160}$/p' "$raw" > "$clean"
          rm -f "$raw"; cat "$clean"; echo "rc=$remote_rc" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r key value; do
            case "$key" in
              AUTH_MAIL_READINESS_DIAGNOSTIC|ERROR_CODE|SUBJECT_WORKER_CARDINALITY|WORKER_REVISION|WORKER_STATE|WORKER_HEALTH|WORKER_RESTARTED|WORKER_ENV_BOUNDARY|WORKER_MOUNT_BOUNDARY|RUNTIME_PROJECTION|STARTUP_CODE|DB_PRINCIPAL_LOGIN|PRODUCTION_MUTATION) echo "${key,,}=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < "$clean"
          rm -f "$clean"

      - name: Publish bounded diagnostic evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_MAIN_SHA: ${{ steps.target.outputs.diagnostic_main_sha }}
          SUBJECT_SHA: ${{ steps.target.outputs.subject_sha }}
          REMOTE_RC: ${{ steps.diagnostic.outputs.rc }}
          DIAGNOSTIC: ${{ steps.diagnostic.outputs.auth_mail_readiness_diagnostic }}
          ERROR_CODE: ${{ steps.diagnostic.outputs.error_code }}
          CARDINALITY: ${{ steps.diagnostic.outputs.subject_worker_cardinality }}
          WORKER_REVISION: ${{ steps.diagnostic.outputs.worker_revision }}
          WORKER_STATE: ${{ steps.diagnostic.outputs.worker_state }}
          WORKER_HEALTH: ${{ steps.diagnostic.outputs.worker_health }}
          WORKER_RESTARTED: ${{ steps.diagnostic.outputs.worker_restarted }}
          WORKER_ENV_BOUNDARY: ${{ steps.diagnostic.outputs.worker_env_boundary }}
          WORKER_MOUNT_BOUNDARY: ${{ steps.diagnostic.outputs.worker_mount_boundary }}
          RUNTIME_PROJECTION: ${{ steps.diagnostic.outputs.runtime_projection }}
          STARTUP_CODE: ${{ steps.diagnostic.outputs.startup_code }}
          DB_PRINCIPAL_LOGIN: ${{ steps.diagnostic.outputs.db_principal_login }}
          PRODUCTION_MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP auth-mail worker readiness diagnostic'
            echo
            echo "- diagnostic main SHA: \`${DIAGNOSTIC_MAIN_SHA:-unknown}\`"
            echo "- failed production subject SHA: \`${SUBJECT_SHA:-unknown}\`"
            echo "- diagnostic: \`${DIAGNOSTIC:-unknown}\` (rc=\`${REMOTE_RC:-unknown}\`)"
            echo "- safe error code: \`${ERROR_CODE:-unknown}\`"
            echo "- subject worker cardinality / revision: \`${CARDINALITY:-unknown} / ${WORKER_REVISION:-unknown}\`"
            echo "- worker state / health / restarted: \`${WORKER_STATE:-unknown} / ${WORKER_HEALTH:-unknown} / ${WORKER_RESTARTED:-unknown}\`"
            echo "- env / mount / runtime projection: \`${WORKER_ENV_BOUNDARY:-unknown} / ${WORKER_MOUNT_BOUNDARY:-unknown} / ${RUNTIME_PROJECTION:-unknown}\`"
            echo "- startup code: \`${STARTUP_CODE:-unknown}\`"
            echo "- DB principal login: \`${DB_PRINCIPAL_LOGIN:-unknown}\`"
            echo "- production mutation: \`${PRODUCTION_MUTATION:-unknown}\`"
            echo '- raw logs, container IDs, labels, database URLs, credentials and secret values are never published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Enforce read-only diagnostic result
        shell: bash
        env:
          REMOTE_RC: ${{ steps.diagnostic.outputs.rc }}
          DIAGNOSTIC: ${{ steps.diagnostic.outputs.auth_mail_readiness_diagnostic }}
          PRODUCTION_MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          [[ "${REMOTE_RC:-1}" == 0 ]]
          [[ "$DIAGNOSTIC" == PASS ]]
          [[ "$PRODUCTION_MUTATION" == NONE ]]
