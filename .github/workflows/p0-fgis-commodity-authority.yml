name: P0.2 FGIS Commodity Authority

on:
  push:
    branches:
      - p0/fgis-commodity-authority-3628
    paths:
      - '.github/workflows/p0-fgis-commodity-authority.yml'
      - 'apps/api/prisma/schema.prisma'
      - 'apps/api/prisma/migrations/20260802210000_fgis_commodity_authority/migration.sql'
      - 'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-commodity-authority.*'
      - 'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-reservation.*'
      - 'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-lot-passport.*'
      - 'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-reconciliation.*'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.module.ts'
      - 'apps/api/test/regulatory/fgis-grain-commodity-authority.e2e-spec.ts'
      - 'docs/platform-v7/autopilot/scopes/p0-fgis-commodity-authority-3628.json'
      - 'docs/platform-v7/crop-platform/p0.2-2a-fgis-commodity-authority.md'
      - 'docs/platform-v7/crop-platform/p0.2-fgis-first-confirmed-lot-inventory.v1.json'
      - 'scripts/p0-fgis-commodity-authority/verify.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-fgis-commodity-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-and-verify:
    name: Prepare Prisma authority and verify invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/p0-fgis-commodity-authority
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Synchronize migration and Prisma schema
        run: node scripts/p0-fgis-commodity-authority/verify.mjs --prepare

      - name: Bind generated relations to exact database foreign keys
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const migrationPath = 'apps/api/prisma/migrations/20260802210000_fgis_commodity_authority/migration.sql';
          const schemaPath = 'apps/api/prisma/schema.prisma';
          let migration = fs.readFileSync(migrationPath, 'utf8');
          let schema = fs.readFileSync(schemaPath, 'utf8');

          const fkMarker = 'CONSTRAINT "fgis_grain_sync_run_org_fk"';
          if (!migration.includes(fkMarker)) {
            const anchor = '-- ── Scope and immutability triggers ───────────────────────────────────────────';
            const foreignKeys = `-- ── Actor and organization foreign-key authority ────────────────────────────

ALTER TABLE public."fgis_grain_organization_connections"
  ADD CONSTRAINT "fgis_grain_org_connection_created_user_fk"
    FOREIGN KEY ("createdByUserId") REFERENCES public."users"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT,
  ADD CONSTRAINT "fgis_grain_org_connection_updated_user_fk"
    FOREIGN KEY ("updatedByUserId") REFERENCES public."users"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT;
ALTER TABLE public."fgis_grain_sync_runs"
  ADD CONSTRAINT "fgis_grain_sync_run_org_fk"
    FOREIGN KEY ("organizationId") REFERENCES public."organizations"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT,
  ADD CONSTRAINT "fgis_grain_sync_run_initiated_user_fk"
    FOREIGN KEY ("initiatedByUserId") REFERENCES public."users"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT;
ALTER TABLE public."fgis_grain_party_snapshots"
  ADD CONSTRAINT "fgis_grain_party_snapshot_org_fk"
    FOREIGN KEY ("organizationId") REFERENCES public."organizations"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT;
ALTER TABLE public."fgis_grain_party_current"
  ADD CONSTRAINT "fgis_grain_party_current_org_fk"
    FOREIGN KEY ("organizationId") REFERENCES public."organizations"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT;
ALTER TABLE public."commodity_reservations"
  ADD CONSTRAINT "commodity_reservation_org_fk"
    FOREIGN KEY ("organizationId") REFERENCES public."organizations"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT,
  ADD CONSTRAINT "commodity_reservation_created_user_fk"
    FOREIGN KEY ("createdByUserId") REFERENCES public."users"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT;
ALTER TABLE public."fgis_grain_lot_passports"
  ADD CONSTRAINT "fgis_grain_lot_passport_org_fk"
    FOREIGN KEY ("organizationId") REFERENCES public."organizations"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT,
  ADD CONSTRAINT "fgis_grain_lot_passport_created_user_fk"
    FOREIGN KEY ("createdByUserId") REFERENCES public."users"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT;
ALTER TABLE public."fgis_grain_reconciliation_cases"
  ADD CONSTRAINT "fgis_grain_reconciliation_org_fk"
    FOREIGN KEY ("organizationId") REFERENCES public."organizations"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT,
  ADD CONSTRAINT "fgis_grain_reconciliation_owner_user_fk"
    FOREIGN KEY ("ownerUserId") REFERENCES public."users"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT;
ALTER TABLE public."fgis_grain_commodity_commands"
  ADD CONSTRAINT "fgis_grain_commodity_command_org_fk"
    FOREIGN KEY ("organizationId") REFERENCES public."organizations"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT,
  ADD CONSTRAINT "fgis_grain_commodity_command_actor_user_fk"
    FOREIGN KEY ("actorUserId") REFERENCES public."users"("id")
    ON UPDATE RESTRICT ON DELETE RESTRICT;

`;
            if (!migration.includes(anchor)) throw new Error('FGIS_FK_INSERTION_ANCHOR_MISSING');
            migration = migration.replace(anchor, foreignKeys + anchor);
          }

          const replacements = new Map([
            ['@relation("FgisCommodityConnectionCreatedBy", fields: [createdByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict)', '@relation("FgisCommodityConnectionCreatedBy", fields: [createdByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_org_connection_created_user_fk")'],
            ['@relation("FgisCommodityConnectionUpdatedBy", fields: [updatedByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict)', '@relation("FgisCommodityConnectionUpdatedBy", fields: [updatedByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_org_connection_updated_user_fk")'],
            ['Organization                    @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict)\n  connection      FgisGrainOrganizationConnection', 'Organization                    @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_sync_run_org_fk")\n  connection      FgisGrainOrganizationConnection'],
            ['@relation("FgisCommoditySyncInitiatedBy", fields: [initiatedByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict)', '@relation("FgisCommoditySyncInitiatedBy", fields: [initiatedByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_sync_run_initiated_user_fk")'],
            ['Organization                    @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict)\n  connection            FgisGrainOrganizationConnection', 'Organization                    @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_party_snapshot_org_fk")\n  connection            FgisGrainOrganizationConnection'],
            ['Organization                    @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict)\n  connection      FgisGrainOrganizationConnection @relation(fields: [connectionId]', 'Organization                    @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_party_current_org_fk")\n  connection      FgisGrainOrganizationConnection @relation(fields: [connectionId]'],
            ['Organization           @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict)\n  partyCurrent', 'Organization           @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "commodity_reservation_org_fk")\n  partyCurrent'],
            ['@relation("FgisCommodityReservationCreatedBy", fields: [createdByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict)', '@relation("FgisCommodityReservationCreatedBy", fields: [createdByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "commodity_reservation_created_user_fk")'],
            ['Organization           @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict)\n  partyCurrent   FgisGrainPartyCurrent  @relation(fields: [partyCurrentId]', 'Organization           @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_lot_passport_org_fk")\n  partyCurrent   FgisGrainPartyCurrent  @relation(fields: [partyCurrentId]'],
            ['@relation("FgisCommodityPassportCreatedBy", fields: [createdByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict)', '@relation("FgisCommodityPassportCreatedBy", fields: [createdByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_lot_passport_created_user_fk")'],
            ['Organization            @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict)\n  partyCurrent     FgisGrainPartyCurrent', 'Organization            @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_reconciliation_org_fk")\n  partyCurrent     FgisGrainPartyCurrent'],
            ['@relation("FgisCommodityReconciliationOwner", fields: [ownerUserId], references: [id], onDelete: Restrict, onUpdate: Restrict)', '@relation("FgisCommodityReconciliationOwner", fields: [ownerUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_reconciliation_owner_user_fk")'],
            ['Organization @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict)\n  actorUser', 'Organization @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_commodity_command_org_fk")\n  actorUser'],
            ['@relation("FgisCommodityCommandActor", fields: [actorUserId], references: [id], onDelete: Restrict, onUpdate: Restrict)', '@relation("FgisCommodityCommandActor", fields: [actorUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_commodity_command_actor_user_fk")'],
          ]);
          for (const [from, to] of replacements) {
            if (schema.includes(to)) continue;
            if (!schema.includes(from)) throw new Error(`PRISMA_FK_ANCHOR_MISSING:${from.slice(0, 80)}`);
            schema = schema.replace(from, to);
          }

          fs.writeFileSync(migrationPath, migration);
          fs.writeFileSync(schemaPath, schema);
          NODE

      - name: Enforce clean generated diff
        run: git diff --check

      - name: Commit generated authority files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            apps/api/prisma/schema.prisma \
            apps/api/prisma/migrations/20260802210000_fgis_commodity_authority/migration.sql; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/prisma/schema.prisma \
            apps/api/prisma/migrations/20260802210000_fgis_commodity_authority/migration.sql
          git commit -m 'build(fgis): synchronize 2A migration and Prisma authority'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Re-run verifier on committed tree
        run: node scripts/p0-fgis-commodity-authority/verify.mjs

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-fgis-commodity-authority-foundation-${{ github.sha }}
          path: ${{ runner.temp }}/p0-fgis-commodity-authority/p0-fgis-commodity-authority.json
          if-no-files-found: error
          retention-days: 30
