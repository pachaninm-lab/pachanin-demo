name: Production Web Exact-SHA Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/app/api/health/ready/route.ts'
      - 'infra/docker/Dockerfile.web'
  workflow_dispatch:
    inputs:
      action:
        description: 'audit, deploy or rollback'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - deploy
          - rollback
      target_sha:
        description: 'Full main commit SHA for deploy or rollback'
        required: false
        type: string
      confirmation:
        description: 'DEPLOY-EXACT-SHA or ROLLBACK-EXACT-SHA'
        required: false
        type: string
  workflow_call:
    inputs:
      action:
        description: 'audit, deploy or rollback'
        required: true
        type: string
      target_sha:
        description: 'Full main commit SHA for deploy or rollback'
        required: false
        type: string
      confirmation:
        description: 'DEPLOY-EXACT-SHA or ROLLBACK-EXACT-SHA'
        required: false
        type: string

permissions:
  contents: read
  packages: read
  issues: write

concurrency:
  group: production-web-exact-sha
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  EVIDENCE_DIR: artifacts/production-web-exact-sha
  RELEASE_ISSUE_NUMBER: 3048
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  PROD_DIR_SECRET: ${{ secrets.PC_PROD_DIR }}
  PROD_COMPOSE_SECRET: ${{ secrets.PC_PROD_COMPOSE }}
  PROD_PROJECT_SECRET: ${{ secrets.PC_PROD_PROJECT }}

jobs:
  release:
    name: Bounded web-only production release
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: pc-crop-production-release-candidate
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release intent
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            action=deploy
            target_sha="$GITHUB_SHA"
          else
            action='${{ inputs.action }}'
            target_sha='${{ inputs.target_sha }}'
            confirmation='${{ inputs.confirmation }}'
            case "$action" in
              audit)
                [[ -z "$confirmation" ]] || {
                  echo 'Audit does not accept a mutation confirmation.' >&2
                  exit 2
                }
                ;;
              deploy)
                [[ "$confirmation" == DEPLOY-EXACT-SHA ]] || {
                  echo 'Deploy confirmation is invalid.' >&2
                  exit 3
                }
                ;;
              rollback)
                [[ "$confirmation" == ROLLBACK-EXACT-SHA ]] || {
                  echo 'Rollback confirmation is invalid.' >&2
                  exit 4
                }
                ;;
              *)
                echo 'Release action is invalid.' >&2
                exit 11
                ;;
            esac
          fi

          if [[ "$action" != audit ]]; then
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'A full lowercase 40-character target SHA is required.' >&2
              exit 5
            }
            git fetch --no-tags origin main
            git cat-file -e "${target_sha}^{commit}"
            git merge-base --is-ancestor "$target_sha" origin/main
          else
            target_sha=''
          fi

          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$action" > "$EVIDENCE_DIR/action.txt"
          printf '%s\n' "${target_sha:-AUDIT}" > "$EVIDENCE_DIR/target-sha.txt"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact canonical image
        if: steps.intent.outputs.action != 'audit'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          exact_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/grainflow-web:sha-${TARGET_SHA:0:7}"
          for attempt in $(seq 1 90); do
            if docker pull "$exact_image" >/dev/null 2>&1; then
              actual="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact_image" 2>/dev/null || true)"
              echo "Image attempt $attempt/90: expected=$TARGET_SHA actual=${actual:-missing}"
              if [[ "$actual" == "$TARGET_SHA" ]]; then
                docker image inspect "$exact_image" > "$EVIDENCE_DIR/registry-image.json"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Exact canonical web image is unavailable.' >&2
          exit 6

      - name: Prepare bounded release evidence parser
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" <<'PY_WEB_EVIDENCE'
          import hashlib
          import re
          import sys
          from pathlib import Path

          def main():
              raw, destination, action, target, status = sys.argv[1:]
              if action not in ('audit', 'deploy', 'rollback') or not re.fullmatch(r'\d{1,3}', status):
                  raise ValueError()
              if int(status) > 255 or (action != 'audit' and not re.fullmatch(r'[0-9a-f]{40}', target)):
                  raise ValueError()
              data = Path(raw).read_bytes()
              if len(data) > 4 * 1024 * 1024:
                  raise ValueError()
              boolean = r'(?:0|1|unknown)'
              revision = r'(?:[0-9a-f]{40}|unknown)'
              state = r'(?:healthy|unhealthy|starting|running|exited|created|restarting|paused|dead|removing|unknown)'
              fields = {
                  'DEPLOYMENT_COMPLETE': boolean,
                  'DEPLOYED_WEB_REVISION': revision,
                  'DEPLOYED_WEB_STATE': state,
                  'ROLLBACK_BASELINE_REVISION': revision,
                  'WATCHTOWER_RETIRED': boolean,
                  'PERSISTENT_OVERRIDE_MUTATED': boolean,
                  'AUTOMATIC_ROLLBACK_ATTEMPTED': boolean,
                  'AUTOMATIC_ROLLBACK_COMPLETED': boolean,
                  'ROLLBACK_WEB_REVISION': revision,
                  'ROLLBACK_READY': boolean,
                  'CURRENT_WEB_REVISION': revision,
                  'CURRENT_WEB_STATE': state,
              }
              values = {}
              for line in data.decode('utf-8').splitlines():
                  name, separator, value = line.partition('=')
                  if separator and name in fields:
                      if name in values or not re.fullmatch(fields[name], value):
                          raise ValueError()
                      values[name] = value
              if values.get('DEPLOYMENT_COMPLETE') == '1':
                  if int(status) != 0 or action == 'audit' or values.get('DEPLOYED_WEB_REVISION') != target:
                      raise ValueError()
                  if values.get('DEPLOYED_WEB_STATE') != 'healthy' or values.get('WATCHTOWER_RETIRED') != '1':
                      raise ValueError()
              if int(status) == 0:
                  if action == 'audit':
                      if values.get('PERSISTENT_OVERRIDE_MUTATED') != '0':
                          raise ValueError()
                  elif values.get('DEPLOYMENT_COMPLETE') != '1' or values.get('PERSISTENT_OVERRIDE_MUTATED') != '1':
                      raise ValueError()
              lines = [
                  'EVIDENCE_SCHEMA=pc.web-release-evidence.v1',
                  'TRANSPORT_EXIT_CODE=' + status,
                  'RAW_OUTPUT_BYTES=' + str(len(data)),
                  'RAW_OUTPUT_SHA256=' + hashlib.sha256(data).hexdigest(),
              ]
              lines.extend(name + '=' + values.get(name, 'unknown') for name in fields)
              Path(destination).write_text('\n'.join(lines) + '\n', encoding='utf-8')

          try:
              main()
          except (OSError, UnicodeError, ValueError):
              sys.stderr.write('Release aggregate evidence rejected.\n')
              raise SystemExit(1)
          PY_WEB_EVIDENCE

      - name: Resolve key-only production SSH
        id: ssh
        shell: bash
        run: |
          set -euo pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          verify_pinned_host() {
            local host="$1" port="$2" expected="$3" known="$4"
            local scan match line fingerprint
            [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || return 1
            scan="$(mktemp)" || return 1
            match="$(mktemp)" || { rm -f "$scan"; return 1; }
            ssh-keyscan -T 10 -p "$port" -H "$host" > "$scan" 2>/dev/null || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              if fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}')"; then
                [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              fi
            done < "$scan"
            sort -u -o "$match" "$match" || { rm -f "$scan" "$match"; return 1; }
            if [[ "$(grep -c . "$match" || true)" != 1 ]]; then
              rm -f "$scan" "$match"
              return 1
            fi
            chmod 600 "$match" && mv -T "$match" "$known" || {
              rm -f "$scan" "$match"
              return 1
            }
            rm -f "$scan"
          }

          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          key="${SSH_KEY_PRIMARY:-${SSH_KEY_SECONDARY:-${SSH_KEY_FALLBACK:-}}}"
          expected_host_fingerprint="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$expected_host_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo 'A protected production host fingerprint is required.' >&2
            exit 12
          }

          [[ "$host" == "$DEFAULT_HOST" ]] || {
            echo 'SSH host is not the canonical REG.RU VPS.' >&2
            exit 7
          }
          [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || {
            echo 'PC_PROD_SSH_USER is required in protected operational storage.' >&2
            exit 8
          }
          [[ -n "$key" ]] || {
            echo 'No approved key-only production SSH credential is configured.' >&2
            exit 9
          }
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || {
            echo 'Protected production SSH port is invalid.' >&2
            exit 10
          }

          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$key" | tr -d '\r' > "$HOME/.ssh/id_pc_prod"
          chmod 600 "$HOME/.ssh/id_pc_prod"
          key_fingerprint="$(ssh-keygen -y -P '' -f "$HOME/.ssh/id_pc_prod" </dev/null 2>/dev/null |
            ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}')"
          [[ "$key_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          printf '%s\n' "$key_fingerprint" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"

          domain_ips="$(getent ahostsv4 xn----8sbjf4befbjgs9b.xn--p1ai | awk '{print $1}' | sort -u || true)"
          printf '%s\n' "$domain_ips" > "$EVIDENCE_DIR/domain-ip.txt"
          grep -Fxq "$DEFAULT_HOST" "$EVIDENCE_DIR/domain-ip.txt"

          verify_pinned_host "$host" "$port" "$expected_host_fingerprint" "$HOME/.ssh/known_hosts" || {
            echo 'Protected production host fingerprint did not match.' >&2
            exit 13
          }

          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; docker compose version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"

          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Observe persisted production preconditions without mutation
        id: readonly_audit
        if: steps.intent.outputs.action == 'audit'
        env:
          AUDIT_ACTION: ${{ steps.intent.outputs.action }}
          AUDIT_HOST: ${{ steps.ssh.outputs.host }}
          AUDIT_USER: ${{ steps.ssh.outputs.user }}
          AUDIT_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          python3 - <<'PY_WEB_READONLY_AUDIT'
          COLLECTOR = r'''import hashlib
          import ipaddress
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import signal
          import subprocess
          import time
          import urllib.request
          from urllib.parse import urlsplit, parse_qsl

          LIMIT = 1024 * 1024
          SHA = re.compile(r'[0-9a-f]{40}')
          IMAGE_ID = re.compile(r'sha256:[0-9a-f]{64}')
          DOMAIN = 'xn----8sbjf4befbjgs9b.xn--p1ai'
          NP = 'NOT_PROVEN'
          DEADLINE = None
          REJECT_REASONS = ['ANALYTICS_PAIR_PARTIAL', 'CONTAINER_CARDINALITY', 'DIRECTORY_SYMLINK', 'DIRECTORY_TYPE', 'DIRECTORY_VALUE', 'ENCODING_UTF8', 'FILE_LIST_CONTROL', 'FILE_LIST_EMPTY', 'FILE_LIST_LOCALE_EDGE', 'FILE_LIST_RAW_LIMIT', 'FILE_LIST_TOO_MANY', 'FILE_LIST_TYPE', 'INPUT_SIZE', 'INPUT_SYMLINK', 'INPUT_TYPE', 'JSON_DUPLICATE', 'JSON_FORBIDDEN_KEY', 'JSON_INVALID', 'JSON_ROOT_SHAPE', 'MODEL_RENDER_FAILED', 'NONE', 'OBSERVER_ABORTED', 'OBSERVER_DEADLINE', 'READ_CHANGED', 'READ_MISSING', 'READ_OSERROR', 'READ_PERMISSION', 'READ_SIZE', 'READ_TYPE', 'ROOT_REQUIRED', 'SELECTORS_PARTIAL', 'SNAPSHOT_BYTES_LIMIT', 'SNAPSHOT_DIRECTORY_IDENTITY', 'SNAPSHOT_FILE_IDENTITY', 'SNAPSHOT_IDENTITY_UNKNOWN', 'SNAPSHOT_INCOMPLETE', 'SNAPSHOT_UNIQUE_LIMIT', 'SNAPSHOT_WRITE_SIZE', 'UNCLASSIFIED_FAILURE', 'UNCLASSIFIED_REJECT', 'WEB_CARDINALITY', 'YAML_ALIAS_BOUND', 'YAML_ALIAS_GRAPH', 'YAML_AMBIGUOUS_SCALAR', 'YAML_ANCHOR_BOUND', 'YAML_COMPLEX_KEY', 'YAML_CONTROL_OR_ESCAPE', 'YAML_DEPTH_BOUND', 'YAML_DIRECTIVE', 'YAML_DOCUMENT_BOUND', 'YAML_DUPLICATE_KEY', 'YAML_EMPTY', 'YAML_EVENT_BOUND', 'YAML_EXPANSION_BOUND', 'YAML_FLOW_TAG_OR_ALIAS', 'YAML_FORBIDDEN_KEY', 'YAML_MODEL_ALIAS_BOUND', 'YAML_MODEL_EXPANSION_BOUND', 'YAML_MODEL_NODE_BOUND', 'YAML_PARSER_BUNDLE', 'YAML_QUOTED_KEY', 'YAML_ROOT_KEY', 'YAML_ROOT_SHAPE', 'YAML_STRUCTURE', 'YAML_SYNTAX', 'YAML_TAG', 'YAML_UNCLOSED_QUOTE', 'YAML_UNSUPPORTED_LINE']
          REJECT_STAGES = ['FORMAT_CLOSURE', 'LABEL_PATHS', 'MODEL_RENDER', 'MODEL_RESOURCE', 'NONE', 'OBSERVER', 'PERSISTED_PATHS', 'REGULAR_READ', 'ROOT_AUTHORITY', 'RUNTIME_INVENTORY', 'SELECTED_PATHS', 'SNAPSHOT_SEAL']
          INPUT_ROLES = ['ANALYTICS_OVERRIDE', 'HARDENING_OVERRIDE', 'IMAGE_OVERRIDE', 'LABEL_AND_SELECTED_COMPOSE', 'LABEL_COMPOSE', 'NONE', 'SELECTED_COMPOSE']

          def bounded(argv, payload=None, limit=LIMIT, seconds=10):
              """Bound output while reading; never publish stderr or exception text."""
              p = subprocess.Popen(argv, stdin=subprocess.PIPE if payload is not None else subprocess.DEVNULL,
                                   stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, start_new_session=True)
              deadline, result, offset = time.monotonic() + seconds, bytearray(), 0
              completed = False
              if DEADLINE is not None:
                  deadline = min(deadline, DEADLINE)
              sel = selectors.DefaultSelector()
              try:
                  os.set_blocking(p.stdout.fileno(), False)
                  sel.register(p.stdout, selectors.EVENT_READ)
                  if payload is not None:
                      os.set_blocking(p.stdin.fileno(), False)
                      sel.register(p.stdin, selectors.EVENT_WRITE)
                  while sel.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise ValueError('DEADLINE')
                      for key, event in sel.select(min(remaining, .1)):
                          if event & selectors.EVENT_WRITE:
                              offset += os.write(key.fd, payload[offset:offset + 16384])
                              if offset == len(payload):
                                  sel.unregister(key.fileobj)
                                  key.fileobj.close()
                          else:
                              chunk = os.read(key.fd, 16384)
                              if not chunk:
                                  sel.unregister(key.fileobj)
                              else:
                                  result.extend(chunk)
                                  if len(result) > limit:
                                      raise ValueError('OUTPUT_BOUND')
                  rc = p.wait(timeout=max(.01, deadline - time.monotonic()))
                  completed = True
                  if rc != 0:
                      raise ValueError('COMMAND_FAILED')
                  return bytes(result)
              finally:
                  sel.close()
                  if not completed:
                      try:
                          os.killpg(p.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                  p.wait(timeout=2)
                  p.stdout.close()
                  if p.stdin is not None and not p.stdin.closed:
                      p.stdin.close()

          class DuplicateJSON(ValueError):
              pass

          def unique(pairs):
              out = {}
              for key, value in pairs:
                  if key in out:
                      raise DuplicateJSON()
                  out[key] = value
              return out

          def decode(raw):
              return json.loads(raw.decode('utf-8', errors='strict'), object_pairs_hook=unique)

          def inspect(ref, image=False):
              rows = decode(bounded(['docker', 'image', 'inspect', ref] if image else ['docker', 'inspect', ref]))
              if not isinstance(rows, list) or len(rows) != 1 or not isinstance(rows[0], dict):
                  raise ValueError('INSPECT_SHAPE')
              return rows[0]

          def labels(row):
              value = (row.get('Config') or {}).get('Labels') or {}
              return value if isinstance(value, dict) else {}

          def identity(row):
              return (row.get('Id'), row.get('Image'), labels(row).get('org.opencontainers.image.revision'),
                      (row.get('State') or {}).get('StartedAt'), row.get('RestartCount'))

          def files_for(directory, raw, stats=None):
              if not isinstance(directory, str) or not directory.startswith('/') or len(directory) > 4096:
                  raise UnsupportedModel('DIRECTORY_VALUE')
              root = Path(directory)
              if root.is_symlink():
                  raise UnsupportedModel('DIRECTORY_SYMLINK')
              if not root.is_dir():
                  raise UnsupportedModel('DIRECTORY_TYPE')
              if not isinstance(raw, str):
                  raise UnsupportedModel('FILE_LIST_TYPE')
              if len(raw) > 16384:
                  raise UnsupportedModel('FILE_LIST_RAW_LIMIT')
              # Canonical-compatible supported subset: omit blanks and preserve ordered
              # duplicates. A path cache must never deduplicate the native -f vector.
              if any(c in raw for c in ('\0', '\r', '\n')):
                  raise UnsupportedModel('FILE_LIST_CONTROL')
              values = []
              for item in raw.split(','):
                  # Supported canonical subset: Bash ASCII shellspace is unambiguous
                  # across C/C.UTF-8. Preserve other ASCII controls as filename bytes;
                  # never silently remove them using Python's wider default strip.
                  value = item.strip(' \t\n\r\v\f')
                  if value and any(ord(c) > 127 and c.isspace() for c in (value[0], value[-1])):
                      raise UnsupportedModel('FILE_LIST_LOCALE_EDGE')
                  if value:
                      values.append(value)
              if not values:
                  raise UnsupportedModel('FILE_LIST_EMPTY')
              if len(values) > 128:
                  raise UnsupportedModel('FILE_LIST_TOO_MANY')
              paths = [Path(v) if v.startswith('/') else root / v for v in values]
              if stats is not None:
                  stats.update(entries=len(paths), duplicates=len(paths) - len(set(paths)))
              for p in paths:
                  if p.is_symlink():
                      raise UnsupportedModel('INPUT_SYMLINK')
                  if not p.is_file():
                      raise UnsupportedModel('INPUT_TYPE')
                  if p.stat().st_size > LIMIT:
                      raise UnsupportedModel('INPUT_SIZE')
              return paths

          import stat
          import tempfile

          class UnsupportedModel(Exception):
              def __init__(self, reason='UNCLASSIFIED_REJECT', stage=None):
                  super().__init__()
                  self.reason = reason if reason in REJECT_REASONS and reason != 'NONE' else 'UNCLASSIFIED_REJECT'
                  self.stage = stage if stage in REJECT_STAGES and stage != 'NONE' else None

          def rejection(error, stage, role):
              if isinstance(error, UnsupportedModel):
                  reason, stage = error.reason, error.stage or stage
              elif isinstance(error, PermissionError):
                  reason = 'READ_PERMISSION'
              elif isinstance(error, FileNotFoundError):
                  reason = 'READ_MISSING'
              elif isinstance(error, OSError):
                  reason = 'READ_OSERROR'
              else:
                  reason = 'UNCLASSIFIED_REJECT'
              return {'reject_stage': stage if stage in REJECT_STAGES and stage != 'NONE' else 'OBSERVER',
                      'reject_reason': reason, 'input_role': role if role in INPUT_ROLES else 'NONE'}

          def read_regular(path):
              fd = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode):
                      raise UnsupportedModel('READ_TYPE', 'REGULAR_READ')
                  if before.st_size > LIMIT:
                      raise UnsupportedModel('READ_SIZE', 'REGULAR_READ')
                  raw = bytearray()
                  while True:
                      part = os.read(fd, min(16384, LIMIT + 1 - len(raw)))
                      if not part:
                          break
                      raw.extend(part)
                      if len(raw) > LIMIT:
                          raise UnsupportedModel('READ_SIZE', 'REGULAR_READ')
                  after = os.fstat(fd)
                  if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns):
                      raise UnsupportedModel('READ_CHANGED', 'REGULAR_READ')
                  return bytes(raw)
              finally:
                  os.close(fd)

          # PyYAML6.0.3 event-only upstream MIT source; exact module hashes/license in bundle.
          PYYAML_LICENSE = 'Copyright (c) 2017-2021 Ingy döt Net\nCopyright (c) 2006-2016 Kirill Simonov\n\nPermission is hereby granted, free of charge, to any person obtaining a copy of\nthis software and associated documentation files (the "Software"), to deal in\nthe Software without restriction, including without limitation the rights to\nuse, copy, modify, merge, publish, distribute, sublicense, and/or sell copies\nof the Software, and to permit persons to whom the Software is furnished to do\nso, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n'
          PYYAML_EVENT_ZIP_BYTES = 17723
          PYYAML_EVENT_ZIP_SHA256 = '2cab6ed6ea68aa815e7492fc084162a44bd6c926c60a13f416c8199829824850'
