          SNAPSHOTS = None

          def model(directory, project, paths):
              if not isinstance(project, str) or project and not re.fullmatch(r'[a-z0-9][a-z0-9_-]{0,127}', project):
                  raise ValueError('PROJECT')
              argv = ['docker', 'compose', '--project-directory', directory]
              if project:
                  argv += ['--project-name', project]
              # Compute costs from the captured immutable bytes, never reopen originals.
              # Cache only event metadata by content digest; charge EVERY ordered input,
              # including duplicates, before the single Compose model render.
              costs, total = {}, {'nodes': 0, 'bytes': 0, 'aliases': 0}
              for p in paths:
                  entry = SNAPSHOTS.add(p)
                  digest = entry['digest']
                  if digest not in costs:
                      costs[digest] = closed_compose_bytes(entry['raw'], SNAPSHOTS.trusted_hardening)
                  cost = costs[digest]
                  for key in total:
                      total[key] += cost[key]
                  if total['nodes'] > 65536:
                      raise UnsupportedModel('YAML_MODEL_NODE_BOUND', 'MODEL_RESOURCE')
                  if total['bytes'] > 4 * LIMIT:
                      raise UnsupportedModel('YAML_MODEL_EXPANSION_BOUND', 'MODEL_RESOURCE')
                  if total['aliases'] > 1024:
                      raise UnsupportedModel('YAML_MODEL_ALIAS_BOUND', 'MODEL_RESOURCE')
                  argv += ['-f', str(entry['path'])]
              value = decode(bounded(argv + ['config', '--format', 'json'], seconds=15))
              services = value.get('services') if isinstance(value, dict) else None
              if not isinstance(services, dict) or not 1 <= len(services) <= 64 or not {'api', 'web'} <= set(services):
                  raise ValueError('MODEL')
              if any(not isinstance(s, dict) for s in services.values()):
                  raise ValueError('SERVICE')
              return value

          def environment(row):
              env = (row.get('Config') or {}).get('Env') or []
              if not isinstance(env, list):
                  raise ValueError('ENV')
              pairs = [v.split('=', 1) for v in env if isinstance(v, str) and '=' in v]
              return unique(pairs)

          def authority(value):
              if not isinstance(value, str) or len(value) > 16384:
                  raise ValueError('URL')
              u = urlsplit(value)
              if u.scheme not in ('postgres', 'postgresql') or not all((u.username, u.password, u.hostname, u.path.strip('/'))):
                  raise ValueError('URL')
              return (u.hostname.lower(), u.port or 5432, u.path, tuple(sorted(parse_qsl(u.query, keep_blank_values=True))))

          def reference_kind(ref, revision):
              if not isinstance(ref, str) or not 0 < len(ref) <= 512:
                  return 'UNSUPPORTED'
              if re.fullmatch(r'(?:sha256:)?[0-9a-f]{64}', ref):
                  return 'IMAGE_ID'
              repo = r'[a-z0-9][a-z0-9._-]*(?::[0-9]{1,5})?(?:/[a-z0-9][a-z0-9._-]*)*'
              if re.fullmatch(repo + r'@sha256:[0-9a-f]{64}', ref):
                  return 'REPOSITORY_DIGEST'
              if re.fullmatch(repo + r'(?::[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?', ref):
                  if isinstance(revision, str) and SHA.fullmatch(revision) and ref == 'ghcr.io/pachaninm-lab/grainflow-web:sha-' + revision[:7]:
                      return 'CANONICAL_TAG'
                  return 'LOCAL_ALIAS'
              return 'UNSUPPORTED'

          def local_exact(ref, revision, runtime_id):
              kind = reference_kind(ref, revision)
              if kind == 'UNSUPPORTED':
                  return 'UNSUPPORTED_REF'
              if not isinstance(revision, str) or not SHA.fullmatch(revision) or not isinstance(runtime_id, str) or not IMAGE_ID.fullmatch(runtime_id):
                  return NP
              try:
                  row = inspect(ref, True)
              except Exception:
                  return 'LOCAL_IMAGE_NOT_PROVEN'
              if row.get('Id') != runtime_id or kind == 'IMAGE_ID' and (ref if ref.startswith('sha256:') else 'sha256:' + ref) != runtime_id:
                  return 'LOCAL_TAG_REBOUND' if kind == 'CANONICAL_TAG' else 'LOCAL_REF_REBOUND'
              if labels(row).get('org.opencontainers.image.revision') != revision:
                  return 'REVISION_MISMATCH'
              return {'CANONICAL_TAG': 'EXACT_LOCAL_MATCH', 'IMAGE_ID': 'IMAGE_ID_LOCAL_MATCH',
                      'REPOSITORY_DIGEST': 'DIGEST_LOCAL_MATCH', 'LOCAL_ALIAS': 'ALIAS_LOCAL_MATCH'}[kind]

          def reference_binding(result):
              if result in ('EXACT_LOCAL_MATCH', 'IMAGE_ID_LOCAL_MATCH', 'DIGEST_LOCAL_MATCH', 'ALIAS_LOCAL_MATCH'):
                  return 'MATCH'
              return {'LOCAL_TAG_REBOUND': 'REBOUND', 'LOCAL_REF_REBOUND': 'REBOUND', 'REVISION_MISMATCH': 'REVISION_MISMATCH',
                      'LOCAL_IMAGE_NOT_PROVEN': 'MISSING_OR_UNREADABLE', 'UNSUPPORTED_REF': 'UNSUPPORTED'}.get(result, NP)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class ObserverDeadline(BaseException):
              pass

          class HttpDeadline(Exception):
              pass

          def get_json(url):
              previous_handler = signal.getsignal(signal.SIGALRM)
              previous_timer = signal.getitimer(signal.ITIMER_REAL)
              started = time.monotonic()
              remaining = min(5, DEADLINE - started) if DEADLINE is not None else 5
              if remaining <= 0:
                  raise ObserverDeadline()
              def alarm(signum, frame):
                  if DEADLINE is not None and time.monotonic() >= DEADLINE:
                      raise ObserverDeadline()
                  raise HttpDeadline()
              signal.signal(signal.SIGALRM, alarm)
              signal.setitimer(signal.ITIMER_REAL, remaining)
              try:
                  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
                  with opener.open(urllib.request.Request(url, method='GET', headers={'Accept': 'application/json'}), timeout=remaining) as response:
                      raw = response.read(LIMIT + 1)
                      if len(raw) > LIMIT or response.status != 200:
                          raise ValueError('HTTP_BOUND')
                      if DEADLINE is not None and time.monotonic() >= DEADLINE:
                          raise ObserverDeadline()
                      return decode(raw)
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  signal.signal(signal.SIGALRM, previous_handler)
                  if previous_timer[0] > 0:
                      left = previous_timer[0] - (time.monotonic() - started)
                      if left > 0:
                          signal.setitimer(signal.ITIMER_REAL, left, previous_timer[1])
                  if DEADLINE is not None and time.monotonic() >= DEADLINE:
                      raise ObserverDeadline()


          def caddy_route(config, web):
              # This recognizes only simple canonical-host routes; unsupported matchers
              # never become a positive route claim.
              try:
                  servers = config['apps']['http']['servers']
                  if not isinstance(servers, dict) or not 1 <= len(servers) <= 16:
                      return NP
                  targets = {'web:3000'}
                  for network in ((web.get('NetworkSettings') or {}).get('Networks') or {}).values():
                      ip = network.get('IPAddress')
                      if ip:
                          targets.add(str(ipaddress.ip_address(ip)) + ':3000')
                  found = []
                  def walk(routes, parent_allows, depth=0):
                      if depth > 8 or not isinstance(routes, list) or len(routes) > 64:
                          raise ValueError('ROUTES')
                      for route in routes:
                          if not isinstance(route, dict) or set(route) - {'match', 'handle', 'terminal'}:
                              raise ValueError('ROUTE_SHAPE')
                          matchers = route.get('match', [{}])
                          if not isinstance(matchers, list) or not 1 <= len(matchers) <= 16:
                              raise ValueError('MATCHERS')
                          local_allows = False
                          for matcher in matchers:
                              if not isinstance(matcher, dict) or set(matcher) - {'host'}:
                                  raise ValueError('UNSUPPORTED_MATCHER')
                              hosts = matcher.get('host')
                              if hosts is None:
                                  local_allows = True
                              elif not isinstance(hosts, list) or not 1 <= len(hosts) <= 16 or any(not isinstance(h, str) or not re.fullmatch(r'[A-Za-z0-9.-]+', h) for h in hosts):
                                  raise ValueError('HOSTS')
                              elif DOMAIN in hosts:
                                  local_allows = True
                          allows = parent_allows and local_allows
                          if not allows:
                              continue
                          handlers = route.get('handle')
                          if not isinstance(handlers, list) or len(handlers) != 1 or not isinstance(handlers[0], dict):
                              raise ValueError('HANDLERS')
                          handler = handlers[0]
                          if handler.get('handler') == 'subroute' and set(handler) == {'handler', 'routes'}:
                              walk(handler['routes'], allows, depth + 1)
                          elif handler.get('handler') == 'reverse_proxy' and set(handler) == {'handler', 'upstreams'}:
                              upstreams = handler.get('upstreams')
                              if not isinstance(upstreams, list) or not 1 <= len(upstreams) <= 16:
                                  raise ValueError('UPSTREAMS')
                              found.extend(isinstance(u, dict) and set(u) == {'dial'} and u['dial'] in targets for u in upstreams)
                          else:
                              raise ValueError('UNSUPPORTED_HANDLER')
                  inspected = False
                  for server in servers.values():
                      if not isinstance(server, dict):
                          return NP
                      listen = server.get('listen')
                      if listen == [':443']:
                          inspected = True
                          walk(server.get('routes'), True)
                      elif not isinstance(listen, list) or any(not isinstance(v, str) or not v.endswith(':80') for v in listen):
                          return NP
                  return 'MATCH' if inspected and found and all(found) else NP
              except Exception:
                  return NP


          def v5_fields():
              value = {'rollback_reference_kind': NP, 'rollback_reference_binding': NP, 'coverage': 'NONE', 'selected_basis': NP, 'project_runtime_binding': NP,
                       'persisted_runtime_binding': NP, 'label_persisted_relation': NP,
                       'analytics_presence': NP, 'bounded_model_scope': 'SNAPSHOT_CONFIG_ENV_STABILITY_NOT_ATTESTED',
                       'docker_storage_status': NP, 'docker_storage_basis': NP,
                       'docker_storage_available_kib': None, 'docker_storage_total_kib': None,
                       'docker_storage_available_inodes': None, 'docker_storage_total_inodes': None,
                       'docker_storage_conventional': NP, 'docker_storage_conventional_basis': NP}
              for prefix in ('label', 'selected', 'persisted'):
                  value.update({prefix + '_closure': NP, prefix + '_reject_stage': 'NONE',
                                prefix + '_reject_reason': 'NONE', prefix + '_entries': None,
                                prefix + '_duplicates': None, prefix + '_list_state': NP})
              return value

          def storage_observation():
              result = {k: v for k, v in v5_fields().items() if k.startswith('docker_storage_')}
              try:
                  raw = bounded(['docker', 'info', '--format', '{{.DockerRootDir}}'], limit=8192, seconds=3)
              except Exception:
                  result['docker_storage_status'] = 'INFO_UNAVAILABLE'
                  return result
              try:
                  root = raw.decode('utf-8', errors='strict')
                  if root.endswith('\n'):
                      root = root[:-1]
                  if not root.startswith('/') or not 1 <= len(root.encode('utf-8')) <= 4096 or any(c in root for c in ('\0', '\r', '\n')):
                      raise ValueError('ROOT')
              except (ValueError, UnicodeError):
                  result['docker_storage_status'] = 'ROOT_UNSUPPORTED'
                  return result
              try:
                  details = os.stat(root, follow_symlinks=False)
                  if not stat.S_ISDIR(details.st_mode):
                      result['docker_storage_status'] = 'ROOT_UNSUPPORTED'
                      return result
              except OSError:
                  result['docker_storage_status'] = 'STAT_UNAVAILABLE'
                  return result
              try:
                  fs = os.statvfs(root)
              except OSError:
                  result['docker_storage_status'] = 'STATVFS_UNAVAILABLE'
                  return result
              fragment = fs.f_frsize or fs.f_bsize
              numbers = (fragment, fs.f_bavail, fs.f_blocks, fs.f_favail, fs.f_files)
              if (any(type(v) is not int or v < 0 for v in numbers) or fragment == 0
                      or fs.f_bavail > fs.f_blocks or fs.f_favail > fs.f_files):
                  result['docker_storage_status'] = 'METRICS_UNSUPPORTED'
                  return result
              available, total = fs.f_bavail * fragment // 1024, fs.f_blocks * fragment // 1024
              if any(v > 2 ** 63 - 1 for v in (available, total, fs.f_favail, fs.f_files)):
                  result['docker_storage_status'] = 'METRICS_UNSUPPORTED'
                  return result
              result.update(docker_storage_status='MEASURED', docker_storage_basis='STATVFS_F_BAVAIL_1024',
                            docker_storage_available_kib=available, docker_storage_total_kib=total,
                            docker_storage_available_inodes=fs.f_favail, docker_storage_total_inodes=fs.f_files)
              try:
                  conventional = os.stat('/var/lib/docker', follow_symlinks=False)
                  if stat.S_ISDIR(conventional.st_mode):
                      result['docker_storage_conventional'] = 'SAME' if details.st_dev == conventional.st_dev else 'DIFFERENT'
                      result['docker_storage_conventional_basis'] = 'STAT_ST_DEV'
              except OSError:
                  pass
              return result


          def _collect(inputs):
              out = {'schema': 'pc.web-readonly-preconditions.v4', 'source_sha': inputs['source_sha'],
                     'closure': NP, 'observation': 'BLOCKED', 'snapshot_cleanup': 'NOT_NEEDED',
                     'reject_stage': 'NONE', 'reject_reason': 'NONE', 'input_role': 'NONE',
                     'selectors': NP, 'label_model': NP, 'selected_model': NP, 'models_relation': NP,
                     'migration': NP, 'migration_database': NP, 'persisted_model': NP, 'persisted_image': NP,
                     'persisted_hardening': NP, 'web_revision': 'unknown', 'web_health': NP,
                     'container_image_binding': NP, 'rollback_local': NP, 'caddy_mode': NP,
                     'caddy_count': 0, 'caddy_admin_route': NP, 'public_readiness': NP,
                     'runtime_stability': NP, 'observed_file_stability': NP, 'production_mutation': 'NONE'}
              out.update(v5_fields())
              out.update(storage_observation())
              if not SHA.fullmatch(inputs['source_sha']):
                  raise ValueError('SOURCE')
              ids = bounded(['docker', 'ps', '-q', '--no-trunc'], limit=8192).decode().splitlines()
              if not 1 <= len(ids) <= 64 or any(not re.fullmatch(r'[0-9a-f]{12,64}', v) for v in ids):
                  out.update(rejection(UnsupportedModel('CONTAINER_CARDINALITY'), 'RUNTIME_INVENTORY', 'NONE'))
                  return out
              rows = [inspect(v) for v in ids]
              webs = [r for r in rows if labels(r).get('com.docker.compose.service') == 'web']
              if len(webs) != 1:
                  out.update(rejection(UnsupportedModel('WEB_CARDINALITY'), 'RUNTIME_INVENTORY', 'NONE'))
                  return out
              web = webs[0]
              wl = labels(web)
              rev = wl.get('org.opencontainers.image.revision', '')
              out['web_revision'] = rev if isinstance(rev, str) and SHA.fullmatch(rev) else 'unknown'
              state = web.get('State') or {}
              health = (state.get('Health') or {}).get('Status', state.get('Status'))
              if health in ('healthy', 'unhealthy', 'starting', 'running', 'exited', 'created', 'restarting', 'paused', 'dead', 'removing'):
                  out['web_health'] = health
              runtime_id = web.get('Image', '')
              try:
                  row = inspect(runtime_id, True)
                  out['container_image_binding'] = ('MATCH' if IMAGE_ID.fullmatch(runtime_id) and row.get('Id') == runtime_id
                      and labels(row).get('org.opencontainers.image.revision') == rev and SHA.fullmatch(rev) else 'MISMATCH')
              except Exception:
                  pass
              out['rollback_reference_kind'] = reference_kind((web.get('Config') or {}).get('Image'), rev)
              out['rollback_local'] = local_exact((web.get('Config') or {}).get('Image'), rev, runtime_id)
              out['rollback_reference_binding'] = reference_binding(out['rollback_local'])
              project = wl.get('com.docker.compose.project', '')
              peers = [r for r in rows if labels(r).get('com.docker.compose.project') == project]
              apis = [r for r in peers if labels(r).get('com.docker.compose.service') == 'api']
              observed = {}
              models = {}
              directory, raw = inputs.get('directory', ''), inputs.get('compose', '')
              explicit = bool(directory) and bool(raw)
              out['selectors'] = 'PARTIAL' if bool(directory) != bool(raw) else 'EXPLICIT' if explicit else 'LABEL_FALLBACK'
              out['selected_basis'] = 'PROTECTED_EXPLICIT' if explicit else 'LABEL_CANONICAL_BASE' if out['selectors'] == 'LABEL_FALLBACK' else NP

              def fail_model(prefix, error, stage, role):
                  fields = rejection(error, stage, role)
                  out[prefix + '_reject_stage'] = fields['reject_stage']
                  out[prefix + '_reject_reason'] = fields['reject_reason']
                  if out[prefix + '_closure'] != 'SUPPORTED':
                      out[prefix + '_closure'] = 'UNSUPPORTED'
                  if out['reject_reason'] == 'NONE':
                      out.update(fields)

              def render_checked(prefix, model_dir, chosen_project, paths, stats):
                  out[prefix + '_entries'] = stats['entries']
                  out[prefix + '_duplicates'] = stats['duplicates']
                  out[prefix + '_list_state'] = 'NORMALIZED_DUPLICATES' if stats['duplicates'] else 'NORMALIZED_UNIQUE'
                  role = 'LABEL_COMPOSE' if prefix == 'label' else 'SELECTED_COMPOSE'
                  try:
                      for path in paths:
                          if prefix == 'persisted':
                              role = ('HARDENING_OVERRIDE' if path == Path(model_dir) / 'compose.production-hardening.override.yml' else
                                      'IMAGE_OVERRIDE' if path == Path(model_dir) / 'compose.production-web-image.override.yml' else
                                      'ANALYTICS_OVERRIDE' if path == Path(model_dir) / 'compose.pc-posthog-public-analytics.override.yml' else 'SELECTED_COMPOSE')
                          observed.setdefault(path, SNAPSHOTS.add(path)['digest'])
                      out[prefix + '_closure'] = 'SUPPORTED'
                  except Exception as error:
                      if SNAPSHOTS.directory_allocation_started:
                          error = UnsupportedModel('SNAPSHOT_IDENTITY_UNKNOWN', 'SNAPSHOT_SEAL')
                      fail_model(prefix, error, 'SNAPSHOT_SEAL', role)
                      return None
                  try:
                      value = model(model_dir, chosen_project, paths)
                      out[prefix + '_model'] = 'OBSERVED'
                      models[prefix] = value
                      return value
                  except UnsupportedModel as error:
                      out[prefix + '_closure'] = 'UNSUPPORTED'
                      fail_model(prefix, error, 'MODEL_RESOURCE', role)
                      return None
                  except Exception:
                      fail_model(prefix, UnsupportedModel('MODEL_RENDER_FAILED', 'MODEL_RENDER'), 'MODEL_RENDER', role)
                      return None

              def finish_models():
                  selected_ok, persisted_ok, label_ok = (out[p + '_model'] == 'OBSERVED' for p in ('selected', 'persisted', 'label'))
                  out['coverage'] = ('FULL' if selected_ok and persisted_ok and label_ok else
                                     'SELECTED_PERSISTED_ONLY' if selected_ok and persisted_ok else
                                     'SELECTED_ONLY' if selected_ok else 'LABEL_ONLY' if label_ok else 'NONE')
                  closures = [out[p + '_closure'] for p in ('label', 'selected', 'persisted')]
                  out['closure'] = ('SUPPORTED' if all(v == 'SUPPORTED' for v in closures) else
                                    'PARTIAL' if 'SUPPORTED' in closures else 'UNSUPPORTED' if 'UNSUPPORTED' in closures else NP)
                  out['observation'] = 'COMPLETE' if out['coverage'] == 'FULL' else 'PARTIAL' if out['coverage'] != 'NONE' else 'BLOCKED'

              selected_paths = None
              chosen_project = inputs.get('project') or (project if out['selectors'] == 'LABEL_FALLBACK' else '')
              # Authoritative explicit inputs are checked first. An unavailable advisory
              # label never becomes an alternate source of selected production authority.
              try:
                  if out['selectors'] == 'PARTIAL':
                      raise UnsupportedModel('SELECTORS_PARTIAL')
                  if not explicit:
                      directory = wl.get('com.docker.compose.project.working_dir')
                      raw = wl.get('com.docker.compose.project.config_files')
                  stats = {}
                  selected_paths = files_for(directory, raw, stats)
                  if not explicit:
                      selected_paths = [p for p in selected_paths if p.name not in (
                          'compose.production-hardening.override.yml', 'compose.production-web-image.override.yml')]
                      if not selected_paths:
                          raise UnsupportedModel('FILE_LIST_EMPTY')
                      stats = {'entries': len(selected_paths), 'duplicates': len(selected_paths) - len(set(selected_paths))}
                  sm = render_checked('selected', directory, chosen_project, selected_paths, stats)
              except Exception as error:
                  fail_model('selected', error, 'SELECTED_PATHS', 'SELECTED_COMPOSE' if explicit or out['selectors'] == 'PARTIAL' else 'LABEL_COMPOSE')
                  sm = None
              if SNAPSHOTS.directory_allocation_started:
                  finish_models()
                  return out
              if sm is not None:
                  name = sm.get('name')
                  out['project_runtime_binding'] = ('MATCH' if isinstance(name, str) and name and name == project else
                                                    'DIFFERENT' if isinstance(name, str) and name and isinstance(project, str) and project else NP)
                  services = sm['services']
                  migrations = [s for name, s in services.items() if re.search(r'(^|[-_])(migrate|migration)([-_]|$)', name, re.I)
                                or 'grainflow-migration' in str(s.get('image', ''))
                                or ('prisma' in str(s.get('command', '')) and 'migrate' in str(s.get('command', '')))]
                  out['migration'] = 'MISSING' if not migrations else 'UNIQUE' if len(migrations) == 1 else 'AMBIGUOUS'
                  if len(migrations) == 1 and len(apis) == 1:
                      try:
                          value = (migrations[0].get('environment') or {}).get('DATABASE_URL')
                          out['migration_database'] = ('SAME_API_AUTHORITY' if authority(value) == authority(environment(apis[0]).get('DATABASE_URL')) else 'DIFFERENT_API_AUTHORITY')
                      except Exception:
                          out['migration_database'] = 'MALFORMED_OR_MISSING'
                  # Match the canonical persistent vector order: named base entries,
                  # hardening, optional already-present analytics override, then image.
                  try:
                      hardening = Path(directory) / 'compose.production-hardening.override.yml'
                      image = Path(directory) / 'compose.production-web-image.override.yml'
                      if not hardening.exists():
                          out['persisted_hardening'] = 'ABSENT'
                      analytics_env = Path(directory) / '.pc-posthog-public-analytics.env'
                      analytics = Path(directory) / 'compose.pc-posthog-public-analytics.override.yml'
                      env_present = analytics_env.exists() or analytics_env.is_symlink()
                      analytics_present = analytics.exists() or analytics.is_symlink()
                      out['analytics_presence'] = 'PAIR_PRESENT' if env_present and analytics_present else 'PARTIAL' if env_present != analytics_present else 'ABSENT'
                      if env_present != analytics_present:
                          raise UnsupportedModel('ANALYTICS_PAIR_PARTIAL')
                      persisted_paths = selected_paths + [hardening] + ([analytics] if analytics_present else []) + [image]
                      pm = render_checked('persisted', directory, chosen_project, persisted_paths,
                                          {'entries': len(persisted_paths), 'duplicates': len(persisted_paths) - len(set(persisted_paths))})
                      if hardening in SNAPSHOTS.entries:
                          out['persisted_hardening'] = ('MATCH_SOURCE' if SNAPSHOTS.entries[hardening]['digest'].hex() == inputs['hardening_sha256'] else 'DIFFERENT_SOURCE')
                      if pm is not None:
                          image_ref = pm['services']['web'].get('image')
                          out['persisted_image'] = 'MATCH_RUNTIME_REF' if image_ref == (web.get('Config') or {}).get('Image') else 'DIFFERENT_RUNTIME_REF'
                          name = pm.get('name')
                          out['persisted_runtime_binding'] = ('MATCH' if name == project and isinstance(name, str) and name and
                              out['persisted_image'] == 'MATCH_RUNTIME_REF' and out['container_image_binding'] == 'MATCH' else
                              'DIFFERENT' if isinstance(name, str) and name and isinstance(project, str) and project else NP)
                  except Exception as error:
                      fail_model('persisted', error, 'PERSISTED_PATHS', 'SELECTED_COMPOSE')
              if SNAPSHOTS.directory_allocation_started:
                  finish_models()
                  return out
              try:
                  stats = {}
                  label_paths = files_for(wl.get('com.docker.compose.project.working_dir'), wl.get('com.docker.compose.project.config_files'), stats)
                  lm = render_checked('label', wl.get('com.docker.compose.project.working_dir'), project, label_paths, stats)
              except Exception as error:
                  fail_model('label', error, 'LABEL_PATHS', 'LABEL_COMPOSE')
                  lm = None
              if SNAPSHOTS.directory_allocation_started:
                  finish_models()
                  return out
              if lm is not None and sm is not None:
                  out['models_relation'] = 'MATCH' if lm == sm else 'DIFFERENT'
              if lm is not None and models.get('persisted') is not None:
                  out['label_persisted_relation'] = 'MATCH' if lm == models['persisted'] else 'DIFFERENT'
              finish_models()
              caddies = [r for r in rows if labels(r).get('com.docker.compose.service') == 'caddy'
                         or re.fullmatch(r'(?:[^ /]+/)*caddy(?::[^ ]+|@sha256:[0-9a-f]{64})?', str((r.get('Config') or {}).get('Image', '')))]
              out['caddy_count'] = len(caddies)
              active = None
              try:
                  unit_state = bounded(['systemctl', 'show', 'caddy', '--property=ActiveState', '--value'], limit=64, seconds=3).strip()
                  if unit_state in (b'active', b'inactive', b'failed'):
                      active = unit_state == b'active'
              except Exception:
                  pass
              out['caddy_mode'] = ('AMBIGUOUS' if len(caddies) > 1 or (caddies and active) else
                                   'COMPOSE' if len(caddies) == 1 and active is False and labels(caddies[0]).get('com.docker.compose.service') == 'caddy' else
                                   'SYSTEMD' if active and not caddies else NP)
              try:
                  out['caddy_admin_route'] = caddy_route(get_json('http://127.0.0.1:2019/config/'), web)
              except Exception:
                  pass
              try:
                  ready = get_json('https://' + DOMAIN + '/api/health/ready')
                  good = (isinstance(ready, dict) and ready.get('status') == 'ok' and ready.get('service') == 'web'
                          and ready.get('releaseAuthority') == 'exact-sha' and SHA.fullmatch(str(ready.get('revision', ''))))
                  out['public_readiness'] = ('CURRENT_REVISION' if good and ready['revision'] == rev else
                                             'DIFFERENT_REVISION' if good else 'NOT_READY')
              except Exception:
                  pass
              try:
                  out['runtime_stability'] = 'UNCHANGED' if identity(web) == identity(inspect(web['Id'])) else 'CHANGED'
                  out['observed_file_stability'] = (NP if not observed else 'UNCHANGED' if all(not p.is_symlink() and p.is_file()
                      and p.stat().st_size <= LIMIT and hashlib.sha256(read_regular(p)).digest() == digest for p, digest in observed.items()) else 'CHANGED')
              except Exception:
                  pass
              return out

          class ObserverAbort(BaseException):
              pass

          def require_root():
              if os.geteuid() != 0:
                  raise UnsupportedModel('ROOT_REQUIRED', 'ROOT_AUTHORITY')

          def collect(inputs, seconds=60):
              global DEADLINE, SNAPSHOTS
              previous_deadline, previous_snapshots = DEADLINE, SNAPSHOTS
              signals = (signal.SIGALRM, signal.SIGTERM, signal.SIGHUP)
              previous_handlers = {s: signal.getsignal(s) for s in signals}
              previous_timer = signal.getitimer(signal.ITIMER_REAL)
              started = time.monotonic()
              DEADLINE = started + seconds
              snapshots = SnapshotSet(inputs['hardening_sha256'])
              SNAPSHOTS = snapshots
              def alarm(signum, frame):
                  if signum == signal.SIGALRM:
                      raise ObserverDeadline()
                  raise ObserverAbort()
              for s in signals:
                  signal.signal(s, alarm)
              signal.setitimer(signal.ITIMER_REAL, seconds)
              out = None
              try:
                  require_root()
                  out = _collect(inputs)
              except (ObserverDeadline, ObserverAbort, Exception) as error:
                  # Fixed report only; no original exception/transport/config data escapes.
                  out = {'schema': 'pc.web-readonly-preconditions.v4', 'source_sha': inputs['source_sha'],
                         'closure': NP, 'observation': 'DEADLINE' if isinstance(error, ObserverDeadline) else 'ABORTED' if isinstance(error, ObserverAbort) else 'FAILED',
                         'snapshot_cleanup': 'UNKNOWN',
                         'reject_stage': 'OBSERVER',
                         'reject_reason': 'OBSERVER_DEADLINE' if isinstance(error, ObserverDeadline) else 'OBSERVER_ABORTED' if isinstance(error, ObserverAbort) else 'UNCLASSIFIED_FAILURE',
                         'input_role': 'NONE', 'selectors': NP, 'label_model': NP, 'selected_model': NP, 'models_relation': NP,
                         'migration': NP, 'migration_database': NP, 'persisted_model': NP, 'persisted_image': NP,
                         'persisted_hardening': NP, 'web_revision': 'unknown', 'web_health': NP,
                         'container_image_binding': NP, 'rollback_local': NP, 'caddy_mode': NP, 'caddy_count': 0,
                         'caddy_admin_route': NP, 'public_readiness': NP, 'runtime_stability': NP,
                         'observed_file_stability': NP, 'production_mutation': 'NONE'}
                  out.update(v5_fields())
                  if isinstance(error, UnsupportedModel):
                      out.update(rejection(error, 'OBSERVER', 'NONE'))
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  old_mask = signal.pthread_sigmask(signal.SIG_BLOCK, set(signals))
                  try:
                      cleanup = snapshots.close()
                      if out is not None:
                          out['snapshot_cleanup'] = cleanup
                  finally:
                      DEADLINE, SNAPSHOTS = previous_deadline, previous_snapshots
                      for s, handler in previous_handlers.items():
                          signal.signal(s, handler)
                      signal.pthread_sigmask(signal.SIG_SETMASK, old_mask)
                      if previous_timer[0] > 0:
                          left = previous_timer[0] - (time.monotonic() - started)
                          if left > 0:
                              signal.setitimer(signal.ITIMER_REAL, left, previous_timer[1])
              return out


          if __name__ == '__main__':
              try:
                  report = collect(INPUTS)
                  raw = json.dumps(report, sort_keys=True, separators=(',', ':')).encode()
                  if len(raw) > 4096:
                      raise ValueError('REPORT_BOUND')
                  print(raw.decode())
              except (Exception, ObserverDeadline):
                  print('AUDIT_OBSERVATION_FAILED', file=__import__('sys').stderr)
                  raise SystemExit(1)
          '''

          import hashlib
