name: Production Web Exact-SHA Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/app/api/health/ready/route.ts'
      - 'infra/docker/Dockerfile.web'
  workflow_dispatch:
    inputs:
      action:
        description: 'audit, deploy or rollback'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - deploy
          - rollback
      target_sha:
        description: 'Full main commit SHA for deploy or rollback'
        required: false
        type: string
      confirmation:
        description: 'DEPLOY-EXACT-SHA or ROLLBACK-EXACT-SHA'
        required: false
        type: string
  workflow_call:
    inputs:
      action:
        description: 'audit, deploy or rollback'
        required: true
        type: string
      target_sha:
        description: 'Full main commit SHA for deploy or rollback'
        required: false
        type: string
      confirmation:
        description: 'DEPLOY-EXACT-SHA or ROLLBACK-EXACT-SHA'
        required: false
        type: string

permissions:
  contents: read
  packages: read
  issues: write

concurrency:
  group: production-web-exact-sha
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  EVIDENCE_DIR: artifacts/production-web-exact-sha
  RELEASE_ISSUE_NUMBER: 3048
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  PROD_DIR_SECRET: ${{ secrets.PC_PROD_DIR }}
  PROD_COMPOSE_SECRET: ${{ secrets.PC_PROD_COMPOSE }}
  PROD_PROJECT_SECRET: ${{ secrets.PC_PROD_PROJECT }}

jobs:
  release:
    name: Bounded web-only production release
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: pc-crop-production-release-candidate
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release intent
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            action=deploy
            target_sha="$GITHUB_SHA"
          else
            action='${{ inputs.action }}'
            target_sha='${{ inputs.target_sha }}'
            confirmation='${{ inputs.confirmation }}'
            case "$action" in
              audit)
                [[ -z "$confirmation" ]] || {
                  echo 'Audit does not accept a mutation confirmation.' >&2
                  exit 2
                }
                ;;
              deploy)
                [[ "$confirmation" == DEPLOY-EXACT-SHA ]] || {
                  echo 'Deploy confirmation is invalid.' >&2
                  exit 3
                }
                ;;
              rollback)
                [[ "$confirmation" == ROLLBACK-EXACT-SHA ]] || {
                  echo 'Rollback confirmation is invalid.' >&2
                  exit 4
                }
                ;;
              *)
                echo 'Release action is invalid.' >&2
                exit 11
                ;;
            esac
          fi

          if [[ "$action" != audit ]]; then
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'A full lowercase 40-character target SHA is required.' >&2
              exit 5
            }
            git fetch --no-tags origin main
            git cat-file -e "${target_sha}^{commit}"
            git merge-base --is-ancestor "$target_sha" origin/main
          else
            target_sha=''
          fi

          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$action" > "$EVIDENCE_DIR/action.txt"
          printf '%s\n' "${target_sha:-AUDIT}" > "$EVIDENCE_DIR/target-sha.txt"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact canonical image
        if: steps.intent.outputs.action != 'audit'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          exact_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/grainflow-web:sha-${TARGET_SHA:0:7}"
          for attempt in $(seq 1 90); do
            if docker pull "$exact_image" >/dev/null 2>&1; then
              actual="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact_image" 2>/dev/null || true)"
              echo "Image attempt $attempt/90: expected=$TARGET_SHA actual=${actual:-missing}"
              if [[ "$actual" == "$TARGET_SHA" ]]; then
                docker image inspect "$exact_image" > "$EVIDENCE_DIR/registry-image.json"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Exact canonical web image is unavailable.' >&2
          exit 6

      - name: Prepare bounded release evidence parser
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" <<'PY_WEB_EVIDENCE'
          import hashlib
          import re
          import sys
          from pathlib import Path

          def main():
              raw, destination, action, target, status = sys.argv[1:]
              if action not in ('audit', 'deploy', 'rollback') or not re.fullmatch(r'\d{1,3}', status):
                  raise ValueError()
              if int(status) > 255 or (action != 'audit' and not re.fullmatch(r'[0-9a-f]{40}', target)):
                  raise ValueError()
              data = Path(raw).read_bytes()
              if len(data) > 4 * 1024 * 1024:
                  raise ValueError()
              boolean = r'(?:0|1|unknown)'
              revision = r'(?:[0-9a-f]{40}|unknown)'
              state = r'(?:healthy|unhealthy|starting|running|exited|created|restarting|paused|dead|removing|unknown)'
              fields = {
                  'DEPLOYMENT_COMPLETE': boolean,
                  'DEPLOYED_WEB_REVISION': revision,
                  'DEPLOYED_WEB_STATE': state,
                  'ROLLBACK_BASELINE_REVISION': revision,
                  'WATCHTOWER_RETIRED': boolean,
                  'PERSISTENT_OVERRIDE_MUTATED': boolean,
                  'AUTOMATIC_ROLLBACK_ATTEMPTED': boolean,
                  'AUTOMATIC_ROLLBACK_COMPLETED': boolean,
                  'ROLLBACK_WEB_REVISION': revision,
                  'ROLLBACK_READY': boolean,
                  'CURRENT_WEB_REVISION': revision,
                  'CURRENT_WEB_STATE': state,
              }
              values = {}
              for line in data.decode('utf-8').splitlines():
                  name, separator, value = line.partition('=')
                  if separator and name in fields:
                      if name in values or not re.fullmatch(fields[name], value):
                          raise ValueError()
                      values[name] = value
              if values.get('DEPLOYMENT_COMPLETE') == '1':
                  if int(status) != 0 or action == 'audit' or values.get('DEPLOYED_WEB_REVISION') != target:
                      raise ValueError()
                  if values.get('DEPLOYED_WEB_STATE') != 'healthy' or values.get('WATCHTOWER_RETIRED') != '1':
                      raise ValueError()
              if int(status) == 0:
                  if action == 'audit':
                      if values.get('PERSISTENT_OVERRIDE_MUTATED') != '0':
                          raise ValueError()
                  elif values.get('DEPLOYMENT_COMPLETE') != '1' or values.get('PERSISTENT_OVERRIDE_MUTATED') != '1':
                      raise ValueError()
              lines = [
                  'EVIDENCE_SCHEMA=pc.web-release-evidence.v1',
                  'TRANSPORT_EXIT_CODE=' + status,
                  'RAW_OUTPUT_BYTES=' + str(len(data)),
                  'RAW_OUTPUT_SHA256=' + hashlib.sha256(data).hexdigest(),
              ]
              lines.extend(name + '=' + values.get(name, 'unknown') for name in fields)
              Path(destination).write_text('\n'.join(lines) + '\n', encoding='utf-8')

          try:
              main()
          except (OSError, UnicodeError, ValueError):
              sys.stderr.write('Release aggregate evidence rejected.\n')
              raise SystemExit(1)
          PY_WEB_EVIDENCE

      - name: Resolve key-only production SSH
        id: ssh
        shell: bash
        run: |
          set -euo pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          verify_pinned_host() {
            local host="$1" port="$2" expected="$3" known="$4"
            local scan match line fingerprint
            [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || return 1
            scan="$(mktemp)" || return 1
            match="$(mktemp)" || { rm -f "$scan"; return 1; }
            ssh-keyscan -T 10 -p "$port" -H "$host" > "$scan" 2>/dev/null || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              if fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}')"; then
                [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              fi
            done < "$scan"
            sort -u -o "$match" "$match" || { rm -f "$scan" "$match"; return 1; }
            if [[ "$(grep -c . "$match" || true)" != 1 ]]; then
              rm -f "$scan" "$match"
              return 1
            fi
            chmod 600 "$match" && mv -T "$match" "$known" || {
              rm -f "$scan" "$match"
              return 1
            }
            rm -f "$scan"
          }

          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          key="${SSH_KEY_PRIMARY:-${SSH_KEY_SECONDARY:-${SSH_KEY_FALLBACK:-}}}"
          expected_host_fingerprint="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$expected_host_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo 'A protected production host fingerprint is required.' >&2
            exit 12
          }

          [[ "$host" == "$DEFAULT_HOST" ]] || {
            echo 'SSH host is not the canonical REG.RU VPS.' >&2
            exit 7
          }
          [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || {
            echo 'PC_PROD_SSH_USER is required in protected operational storage.' >&2
            exit 8
          }
          [[ -n "$key" ]] || {
            echo 'No approved key-only production SSH credential is configured.' >&2
            exit 9
          }
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || {
            echo 'Protected production SSH port is invalid.' >&2
            exit 10
          }

          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$key" | tr -d '\r' > "$HOME/.ssh/id_pc_prod"
          chmod 600 "$HOME/.ssh/id_pc_prod"
          key_fingerprint="$(ssh-keygen -y -P '' -f "$HOME/.ssh/id_pc_prod" </dev/null 2>/dev/null |
            ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}')"
          [[ "$key_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          printf '%s\n' "$key_fingerprint" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"

          domain_ips="$(getent ahostsv4 xn----8sbjf4befbjgs9b.xn--p1ai | awk '{print $1}' | sort -u || true)"
          printf '%s\n' "$domain_ips" > "$EVIDENCE_DIR/domain-ip.txt"
          grep -Fxq "$DEFAULT_HOST" "$EVIDENCE_DIR/domain-ip.txt"

          verify_pinned_host "$host" "$port" "$expected_host_fingerprint" "$HOME/.ssh/known_hosts" || {
            echo 'Protected production host fingerprint did not match.' >&2
            exit 13
          }

          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; docker compose version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"

          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Copy immutable release assets
        env:
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          scp_options=(
            -i "$HOME/.ssh/id_pc_prod"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          scp "${scp_options[@]}" \
            scripts/production-web-exact-sha.sh \
            "$SSH_USER@$SSH_HOST:/tmp/pc-production-web-exact-sha-${GITHUB_RUN_ID}.sh"
          scp "${scp_options[@]}" \
            scripts/production-web-live-acceptance.sh \
            "$SSH_USER@$SSH_HOST:/tmp/pc-production-web-live-acceptance-${GITHUB_RUN_ID}.sh"
          scp "${scp_options[@]}" \
            scripts/production-web-remote-entrypoint.sh \
            "$SSH_USER@$SSH_HOST:/tmp/pc-production-web-remote-entrypoint-${GITHUB_RUN_ID}.sh"
          scp "${scp_options[@]}" \
            infra/compose/production-web-hardening.override.yml \
            "$SSH_USER@$SSH_HOST:/tmp/pc-production-web-hardening-${GITHUB_RUN_ID}.yml"

      - name: Execute bounded production action
        id: production
        env:
          ACTION: ${{ steps.intent.outputs.action }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$(mktemp)"
          trap 'rm -f "$raw"' EXIT

          encode() {
            printf '%s' "$1" | base64 -w0
          }

          prod_dir_b64="$(encode "${PROD_DIR_SECRET:-}")"
          prod_compose_b64="$(encode "${PROD_COMPOSE_SECRET:-}")"
          prod_project_b64="$(encode "${PROD_PROJECT_SECRET:-}")"
          remote_entrypoint="/tmp/pc-production-web-remote-entrypoint-${GITHUB_RUN_ID}.sh"

          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            -o TCPKeepAlive=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "chmod 0700 '$remote_entrypoint' && PROD_DIR_B64='$prod_dir_b64' PROD_COMPOSE_B64='$prod_compose_b64' PROD_PROJECT_B64='$prod_project_b64' '$remote_entrypoint' '$ACTION' '$TARGET_SHA' '$GITHUB_RUN_ID'" \
            > "$raw" 2>&1
          rc=$?
          set -e

          python3 "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" "$raw" \
            "$EVIDENCE_DIR/production-action.log" "$ACTION" "$TARGET_SHA" "$rc"
          rm -f "$raw"
          trap - EXIT
          cat "$EVIDENCE_DIR/production-action.log"

          baseline_revision="$(sed -n 's/^ROLLBACK_BASELINE_REVISION=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          deployment_complete="$(sed -n 's/^DEPLOYMENT_COMPLETE=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          watchtower_retired="$(sed -n 's/^WATCHTOWER_RETIRED=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          persistent_override_mutated="$(sed -n 's/^PERSISTENT_OVERRIDE_MUTATED=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          deployed_revision="$(sed -n 's/^DEPLOYED_WEB_REVISION=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          deployed_state="$(sed -n 's/^DEPLOYED_WEB_STATE=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          echo "baseline_revision=${baseline_revision:-unknown}" >> "$GITHUB_OUTPUT"
          echo "deployment_complete=${deployment_complete:-0}" >> "$GITHUB_OUTPUT"
          echo "watchtower_retired=${watchtower_retired:-0}" >> "$GITHUB_OUTPUT"
          echo "persistent_override_mutated=${persistent_override_mutated:-unknown}" >> "$GITHUB_OUTPUT"
          echo "deployed_revision=${deployed_revision:-unknown}" >> "$GITHUB_OUTPUT"
          echo "deployed_state=${deployed_state:-unknown}" >> "$GITHUB_OUTPUT"

          if [[ "$ACTION" == audit ]]; then
            [[ "${persistent_override_mutated:-unknown}" == 0 ]]
          fi
          (( rc == 0 )) || exit "$rc"

      - name: Verify exact public runtime
        id: live
        if: steps.intent.outputs.action != 'audit' && steps.production.outputs.deployment_complete == '1'
        continue-on-error: true
        env:
          PC_LIVE_BASE: ${{ env.LIVE_BASE }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
          ACTION: ${{ steps.intent.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production-web-live-acceptance.sh "$TARGET_SHA" "$ACTION" |
            tee "$EVIDENCE_DIR/live-acceptance.log"

      - name: Restore previous exact revision after live failure
        if: steps.live.outcome == 'failure'
        env:
          BASELINE_SHA: ${{ steps.production.outputs.baseline_revision }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'No exact rollback baseline revision is available.' >&2
            exit 30
          }
          umask 077
          raw="$(mktemp)"
          trap 'rm -f "$raw"' EXIT

          encode() {
            printf '%s' "$1" | base64 -w0
          }
          prod_dir_b64="$(encode "${PROD_DIR_SECRET:-}")"
          prod_compose_b64="$(encode "${PROD_COMPOSE_SECRET:-}")"
          prod_project_b64="$(encode "${PROD_PROJECT_SECRET:-}")"
          remote_entrypoint="/tmp/pc-production-web-remote-entrypoint-${GITHUB_RUN_ID}.sh"

          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            -o TCPKeepAlive=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "PROD_DIR_B64='$prod_dir_b64' PROD_COMPOSE_B64='$prod_compose_b64' PROD_PROJECT_B64='$prod_project_b64' '$remote_entrypoint' rollback '$BASELINE_SHA' '$GITHUB_RUN_ID'" \
            > "$raw" 2>&1
          rc=$?
          set -e
          python3 "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" "$raw" \
            "$EVIDENCE_DIR/live-failure-rollback.log" rollback "$BASELINE_SHA" "$rc"
          rm -f "$raw"
          trap - EXIT
          cat "$EVIDENCE_DIR/live-failure-rollback.log"
          (( rc == 0 )) || exit "$rc"

      - name: Remove private runner release material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" \
            "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Enforce final release result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          action='${{ steps.intent.outputs.action }}'
          live_outcome='${{ steps.live.outcome }}'
          if [[ "$action" != audit && "$live_outcome" != success ]]; then
            echo 'Production was restored when possible, but exact live acceptance failed.' >&2
            exit 40
          fi

      - name: Build evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 |
            sort -z |
            xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"

      - name: Publish release record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.intent.outputs.action }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
          DEPLOYMENT_COMPLETE: ${{ steps.production.outputs.deployment_complete }}
          DEPLOYED_REVISION: ${{ steps.production.outputs.deployed_revision }}
          DEPLOYED_STATE: ${{ steps.production.outputs.deployed_state }}
          BASELINE_REVISION: ${{ steps.production.outputs.baseline_revision }}
          WATCHTOWER_RETIRED: ${{ steps.production.outputs.watchtower_retired }}
          PERSISTENT_OVERRIDE_MUTATED: ${{ steps.production.outputs.persistent_override_mutated }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          FINAL_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          target="${TARGET_SHA:-AUDIT}"
          live_acceptance="$(sed -n 's/^LIVE_ACCEPTANCE=//p' "$EVIDENCE_DIR/live-acceptance.log" 2>/dev/null | tail -1 || true)"
          rollback_result='not-required'
          if [[ -f "$EVIDENCE_DIR/live-failure-rollback.log" ]]; then
            rollback_result="$(sed -n 's/^DEPLOYMENT_COMPLETE=//p' "$EVIDENCE_DIR/live-failure-rollback.log" | tail -1)"
            rollback_result="${rollback_result:-attempted}"
          fi

          record="$EVIDENCE_DIR/release-issue-comment.md"
          {
            echo "## Production web release run \`$GITHUB_RUN_ID\`"
            echo
            echo "- action: \`${ACTION:-unknown}\`"
            echo "- target SHA: \`$target\`"
            echo "- deployment complete: \`${DEPLOYMENT_COMPLETE:-0}\`"
            echo "- running OCI revision: \`${DEPLOYED_REVISION:-unknown}\`"
            echo "- Docker state: \`${DEPLOYED_STATE:-unknown}\`"
            echo "- live acceptance: \`${live_acceptance:-${LIVE_OUTCOME:-not-run}}\`"
            echo "- rollback baseline: \`${BASELINE_REVISION:-unknown}\`"
            echo "- rollback result: \`$rollback_result\`"
            echo "- Watchtower retired: \`${WATCHTOWER_RETIRED:-0}\`"
            echo "- persistent override mutation: \`${PERSISTENT_OVERRIDE_MUTATED:-unknown}\`"
            echo "- workflow status at record: \`${FINAL_JOB_STATUS:-unknown}\`"
            echo "- workflow run ID: \`$GITHUB_RUN_ID\`"
          } > "$record"

          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 |
            sort -z |
            xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"

          gh issue comment "$RELEASE_ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$record"

          if [[ "${ACTION:-}" == deploy \
            && "${DEPLOYMENT_COMPLETE:-0}" == 1 \
            && "${DEPLOYED_REVISION:-}" == "$TARGET_SHA" \
            && "${live_acceptance:-}" == PASS \
            && "${WATCHTOWER_RETIRED:-0}" == 1 ]]; then
            gh issue close "$RELEASE_ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-web-exact-sha-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
