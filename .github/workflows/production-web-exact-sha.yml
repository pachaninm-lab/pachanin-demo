name: Production Web Exact-SHA Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/app/api/health/ready/route.ts'
      - 'infra/docker/Dockerfile.web'
  workflow_dispatch:
    inputs:
      action:
        description: 'audit, deploy or rollback'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - deploy
          - rollback
      target_sha:
        description: 'Full main commit SHA for deploy or rollback'
        required: false
        type: string
      confirmation:
        description: 'DEPLOY-EXACT-SHA or ROLLBACK-EXACT-SHA'
        required: false
        type: string
  workflow_call:
    inputs:
      action:
        description: 'audit, deploy or rollback'
        required: true
        type: string
      target_sha:
        description: 'Full main commit SHA for deploy or rollback'
        required: false
        type: string
      confirmation:
        description: 'DEPLOY-EXACT-SHA or ROLLBACK-EXACT-SHA'
        required: false
        type: string

permissions:
  contents: read
  packages: read
  issues: write

concurrency:
  group: production-web-exact-sha
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  EVIDENCE_DIR: artifacts/production-web-exact-sha
  RELEASE_ISSUE_NUMBER: 3048
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  PROD_DIR_SECRET: ${{ secrets.PC_PROD_DIR }}
  PROD_COMPOSE_SECRET: ${{ secrets.PC_PROD_COMPOSE }}
  PROD_PROJECT_SECRET: ${{ secrets.PC_PROD_PROJECT }}

jobs:
  release:
    name: Bounded web-only production release
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: pc-crop-production-release-candidate
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release intent
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            action=deploy
            target_sha="$GITHUB_SHA"
          else
            action='${{ inputs.action }}'
            target_sha='${{ inputs.target_sha }}'
            confirmation='${{ inputs.confirmation }}'
            case "$action" in
              audit)
                [[ -z "$confirmation" ]] || {
                  echo 'Audit does not accept a mutation confirmation.' >&2
                  exit 2
                }
                ;;
              deploy)
                [[ "$confirmation" == DEPLOY-EXACT-SHA ]] || {
                  echo 'Deploy confirmation is invalid.' >&2
                  exit 3
                }
                ;;
              rollback)
                [[ "$confirmation" == ROLLBACK-EXACT-SHA ]] || {
                  echo 'Rollback confirmation is invalid.' >&2
                  exit 4
                }
                ;;
              *)
                echo 'Release action is invalid.' >&2
                exit 11
                ;;
            esac
          fi

          if [[ "$action" != audit ]]; then
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'A full lowercase 40-character target SHA is required.' >&2
              exit 5
            }
            git fetch --no-tags origin main
            git cat-file -e "${target_sha}^{commit}"
            git merge-base --is-ancestor "$target_sha" origin/main
          else
            target_sha=''
          fi

          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$action" > "$EVIDENCE_DIR/action.txt"
          printf '%s\n' "${target_sha:-AUDIT}" > "$EVIDENCE_DIR/target-sha.txt"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact canonical image
        if: steps.intent.outputs.action != 'audit'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          exact_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/grainflow-web:sha-${TARGET_SHA:0:7}"
          for attempt in $(seq 1 90); do
            if docker pull "$exact_image" >/dev/null 2>&1; then
              actual="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact_image" 2>/dev/null || true)"
              echo "Image attempt $attempt/90: expected=$TARGET_SHA actual=${actual:-missing}"
              if [[ "$actual" == "$TARGET_SHA" ]]; then
                docker image inspect "$exact_image" > "$EVIDENCE_DIR/registry-image.json"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Exact canonical web image is unavailable.' >&2
          exit 6

      - name: Prepare bounded release evidence parser
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" <<'PY_WEB_EVIDENCE'
          import hashlib
          import re
          import sys
          from pathlib import Path

          def main():
              raw, destination, action, target, status = sys.argv[1:]
              if action not in ('audit', 'deploy', 'rollback') or not re.fullmatch(r'\d{1,3}', status):
                  raise ValueError()
              if int(status) > 255 or (action != 'audit' and not re.fullmatch(r'[0-9a-f]{40}', target)):
                  raise ValueError()
              data = Path(raw).read_bytes()
              if len(data) > 4 * 1024 * 1024:
                  raise ValueError()
              boolean = r'(?:0|1|unknown)'
              revision = r'(?:[0-9a-f]{40}|unknown)'
              state = r'(?:healthy|unhealthy|starting|running|exited|created|restarting|paused|dead|removing|unknown)'
              fields = {
                  'DEPLOYMENT_COMPLETE': boolean,
                  'DEPLOYED_WEB_REVISION': revision,
                  'DEPLOYED_WEB_STATE': state,
                  'ROLLBACK_BASELINE_REVISION': revision,
                  'WATCHTOWER_RETIRED': boolean,
                  'PERSISTENT_OVERRIDE_MUTATED': boolean,
                  'AUTOMATIC_ROLLBACK_ATTEMPTED': boolean,
                  'AUTOMATIC_ROLLBACK_COMPLETED': boolean,
                  'ROLLBACK_WEB_REVISION': revision,
                  'ROLLBACK_READY': boolean,
                  'CURRENT_WEB_REVISION': revision,
                  'CURRENT_WEB_STATE': state,
              }
              values = {}
              for line in data.decode('utf-8').splitlines():
                  name, separator, value = line.partition('=')
                  if separator and name in fields:
                      if name in values or not re.fullmatch(fields[name], value):
                          raise ValueError()
                      values[name] = value
              if values.get('DEPLOYMENT_COMPLETE') == '1':
                  if int(status) != 0 or action == 'audit' or values.get('DEPLOYED_WEB_REVISION') != target:
                      raise ValueError()
                  if values.get('DEPLOYED_WEB_STATE') != 'healthy' or values.get('WATCHTOWER_RETIRED') != '1':
                      raise ValueError()
              if int(status) == 0:
                  if action == 'audit':
                      if values.get('PERSISTENT_OVERRIDE_MUTATED') != '0':
                          raise ValueError()
                  elif values.get('DEPLOYMENT_COMPLETE') != '1' or values.get('PERSISTENT_OVERRIDE_MUTATED') != '1':
                      raise ValueError()
              lines = [
                  'EVIDENCE_SCHEMA=pc.web-release-evidence.v1',
                  'TRANSPORT_EXIT_CODE=' + status,
                  'RAW_OUTPUT_BYTES=' + str(len(data)),
                  'RAW_OUTPUT_SHA256=' + hashlib.sha256(data).hexdigest(),
              ]
              lines.extend(name + '=' + values.get(name, 'unknown') for name in fields)
              Path(destination).write_text('\n'.join(lines) + '\n', encoding='utf-8')

          try:
              main()
          except (OSError, UnicodeError, ValueError):
              sys.stderr.write('Release aggregate evidence rejected.\n')
              raise SystemExit(1)
          PY_WEB_EVIDENCE

      - name: Resolve key-only production SSH
        id: ssh
        shell: bash
        run: |
          set -euo pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          verify_pinned_host() {
            local host="$1" port="$2" expected="$3" known="$4"
            local scan match line fingerprint
            [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || return 1
            scan="$(mktemp)" || return 1
            match="$(mktemp)" || { rm -f "$scan"; return 1; }
            ssh-keyscan -T 10 -p "$port" -H "$host" > "$scan" 2>/dev/null || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              if fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}')"; then
                [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              fi
            done < "$scan"
            sort -u -o "$match" "$match" || { rm -f "$scan" "$match"; return 1; }
            if [[ "$(grep -c . "$match" || true)" != 1 ]]; then
              rm -f "$scan" "$match"
              return 1
            fi
            chmod 600 "$match" && mv -T "$match" "$known" || {
              rm -f "$scan" "$match"
              return 1
            }
            rm -f "$scan"
          }

          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          key="${SSH_KEY_PRIMARY:-${SSH_KEY_SECONDARY:-${SSH_KEY_FALLBACK:-}}}"
          expected_host_fingerprint="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$expected_host_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo 'A protected production host fingerprint is required.' >&2
            exit 12
          }

          [[ "$host" == "$DEFAULT_HOST" ]] || {
            echo 'SSH host is not the canonical REG.RU VPS.' >&2
            exit 7
          }
          [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || {
            echo 'PC_PROD_SSH_USER is required in protected operational storage.' >&2
            exit 8
          }
          [[ -n "$key" ]] || {
            echo 'No approved key-only production SSH credential is configured.' >&2
            exit 9
          }
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || {
            echo 'Protected production SSH port is invalid.' >&2
            exit 10
          }

          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$key" | tr -d '\r' > "$HOME/.ssh/id_pc_prod"
          chmod 600 "$HOME/.ssh/id_pc_prod"
          key_fingerprint="$(ssh-keygen -y -P '' -f "$HOME/.ssh/id_pc_prod" </dev/null 2>/dev/null |
            ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}')"
          [[ "$key_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          printf '%s\n' "$key_fingerprint" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"

          domain_ips="$(getent ahostsv4 xn----8sbjf4befbjgs9b.xn--p1ai | awk '{print $1}' | sort -u || true)"
          printf '%s\n' "$domain_ips" > "$EVIDENCE_DIR/domain-ip.txt"
          grep -Fxq "$DEFAULT_HOST" "$EVIDENCE_DIR/domain-ip.txt"

          verify_pinned_host "$host" "$port" "$expected_host_fingerprint" "$HOME/.ssh/known_hosts" || {
            echo 'Protected production host fingerprint did not match.' >&2
            exit 13
          }

          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; docker compose version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"

          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Observe persisted production preconditions without mutation
        id: readonly_audit
        if: steps.intent.outputs.action == 'audit'
        env:
          AUDIT_ACTION: ${{ steps.intent.outputs.action }}
          AUDIT_HOST: ${{ steps.ssh.outputs.host }}
          AUDIT_USER: ${{ steps.ssh.outputs.user }}
          AUDIT_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          python3 - <<'PY_WEB_READONLY_AUDIT'
          COLLECTOR = r'''import hashlib
          import ipaddress
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import signal
          import subprocess
          import time
          import urllib.request
          from urllib.parse import urlsplit, parse_qsl

          LIMIT = 1024 * 1024
          SHA = re.compile(r'[0-9a-f]{40}')
          IMAGE_ID = re.compile(r'sha256:[0-9a-f]{64}')
          DOMAIN = 'xn----8sbjf4befbjgs9b.xn--p1ai'
          NP = 'NOT_PROVEN'
          DEADLINE = None

          def bounded(argv, payload=None, limit=LIMIT, seconds=10):
              """Bound output while reading; never publish stderr or exception text."""
              p = subprocess.Popen(argv, stdin=subprocess.PIPE if payload is not None else subprocess.DEVNULL,
                                   stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, start_new_session=True)
              deadline, result, offset = time.monotonic() + seconds, bytearray(), 0
              completed = False
              if DEADLINE is not None:
                  deadline = min(deadline, DEADLINE)
              sel = selectors.DefaultSelector()
              try:
                  os.set_blocking(p.stdout.fileno(), False)
                  sel.register(p.stdout, selectors.EVENT_READ)
                  if payload is not None:
                      os.set_blocking(p.stdin.fileno(), False)
                      sel.register(p.stdin, selectors.EVENT_WRITE)
                  while sel.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise ValueError('DEADLINE')
                      for key, event in sel.select(min(remaining, .1)):
                          if event & selectors.EVENT_WRITE:
                              offset += os.write(key.fd, payload[offset:offset + 16384])
                              if offset == len(payload):
                                  sel.unregister(key.fileobj)
                                  key.fileobj.close()
                          else:
                              chunk = os.read(key.fd, 16384)
                              if not chunk:
                                  sel.unregister(key.fileobj)
                              else:
                                  result.extend(chunk)
                                  if len(result) > limit:
                                      raise ValueError('OUTPUT_BOUND')
                  rc = p.wait(timeout=max(.01, deadline - time.monotonic()))
                  completed = True
                  if rc != 0:
                      raise ValueError('COMMAND_FAILED')
                  return bytes(result)
              finally:
                  sel.close()
                  if not completed:
                      try:
                          os.killpg(p.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                  p.wait(timeout=2)
                  p.stdout.close()
                  if p.stdin is not None and not p.stdin.closed:
                      p.stdin.close()

          def unique(pairs):
              out = {}
              for key, value in pairs:
                  if key in out:
                      raise ValueError('DUPLICATE')
                  out[key] = value
              return out

          def decode(raw):
              return json.loads(raw.decode('utf-8', errors='strict'), object_pairs_hook=unique)

          def inspect(ref, image=False):
              rows = decode(bounded(['docker', 'image', 'inspect', ref] if image else ['docker', 'inspect', ref]))
              if not isinstance(rows, list) or len(rows) != 1 or not isinstance(rows[0], dict):
                  raise ValueError('INSPECT_SHAPE')
              return rows[0]

          def labels(row):
              value = (row.get('Config') or {}).get('Labels') or {}
              return value if isinstance(value, dict) else {}

          def identity(row):
              return (row.get('Id'), row.get('Image'), labels(row).get('org.opencontainers.image.revision'),
                      (row.get('State') or {}).get('StartedAt'), row.get('RestartCount'))

          def files_for(directory, raw):
              if not isinstance(directory, str) or not directory.startswith('/') or len(directory) > 4096:
                  raise ValueError('DIRECTORY')
              root = Path(directory)
              if root.is_symlink() or not root.is_dir() or not isinstance(raw, str) or len(raw) > 16384:
                  raise ValueError('FILES')
              values = raw.split(',')
              if not 1 <= len(values) <= 16 or any(not v.strip() for v in values):
                  raise ValueError('FILES')
              paths = [Path(v.strip()) if v.strip().startswith('/') else root / v.strip() for v in values]
              if len(set(paths)) != len(paths):
                  raise ValueError('FILES')
              for p in paths:
                  if p.is_symlink() or not p.is_file() or p.stat().st_size > LIMIT:
                      raise ValueError('FILE')
              return paths

          import stat
          import tempfile

          class UnsupportedModel(Exception):
              pass

          def read_regular(path):
              fd = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_size > LIMIT:
                      raise UnsupportedModel()
                  raw = bytearray()
                  while True:
                      part = os.read(fd, min(16384, LIMIT + 1 - len(raw)))
                      if not part:
                          break
                      raw.extend(part)
                      if len(raw) > LIMIT:
                          raise UnsupportedModel()
                  after = os.fstat(fd)
                  if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns):
                      raise UnsupportedModel()
                  return bytes(raw)
              finally:
                  os.close(fd)

          def closed_compose_bytes(raw, trusted_hardening):
              # A deliberately narrow block-YAML subset, not a second Compose/YAML engine.
              # A byte-identical accepted hardening file is the sole custom-tag exception.
              if hashlib.sha256(raw).hexdigest() == trusted_hardening:
                  return
              text = raw.decode('utf-8', errors='strict')
              forbidden = {'include', 'extends', 'build', 'develop', 'provider'}
              if text.lstrip().startswith('{'):
                  value = decode(raw)
                  def walk(item):
                      if isinstance(item, dict):
                          for key, child in item.items():
                              if not isinstance(key, str) or key.lower() in forbidden or key == '<<':
                                  raise UnsupportedModel()
                              walk(child)
                      elif isinstance(item, list):
                          for child in item:
                              walk(child)
                  if not isinstance(value, dict) or set(value) - {'name', 'version', 'services', 'networks', 'volumes', 'configs', 'secrets'}:
                      raise UnsupportedModel()
                  walk(value)
                  return
              if any(c in text for c in ('\0', '\r', '\t', '\\')):
                  raise UnsupportedModel()
              parents, seen, roots = [], set(), 0
              for number, original in enumerate(text.splitlines()):
                  if not original.strip() or original.lstrip().startswith('#'):
                      continue
                  indent = len(original) - len(original.lstrip(' '))
                  line = original[indent:]
                  if indent % 2 or line.startswith(('%', '---', '...', '?', ':')):
                      raise UnsupportedModel()
                  # Keep quoted scalar text opaque; reject escapes/multiline quotes and
                  # all YAML flow/tag/alias/anchor/merge syntax outside scalar quotes.
                  quote, clean = None, []
                  for char in line:
                      if quote:
                          if char == quote:
                              quote = None
                          continue
                      if char in ('"', "'"):
                          quote = char
                          clean.append('Q')
                      elif char == '#':
                          break
                      elif char in '{}[]&*!|>?%@':
                          raise UnsupportedModel()
                      else:
                          clean.append(char)
                  if quote:
                      raise UnsupportedModel()
                  token = ''.join(clean).rstrip()
                  if re.match(r'^(?:- )?Q:', token):
                      raise UnsupportedModel()
                  while parents and parents[-1][0] >= indent:
                      parents.pop()
                  if token.startswith('- '):
                      parents.append((indent, 'item-' + str(number)))
                      token = token[2:]
                      indent += 2
                  elif token == '-':
                      parents.append((indent, 'item-' + str(number)))
                      continue
                  match = re.fullmatch(r'([A-Za-z_][A-Za-z0-9_.-]*):(?: (.*))?', token)
                  if not match:
                      # A plain/quoted sequence scalar cannot introduce a mapping key.
                      if parents and parents[-1][1].startswith('item-') and not re.search(r':\s', token):
                          continue
                      raise UnsupportedModel()
                  key, value = match.groups()
                  if key.lower() in forbidden or value and re.search(r':\s', value):
                      raise UnsupportedModel()
                  scope = (tuple(parents), indent, key)
                  if scope in seen:
                      raise UnsupportedModel()
                  seen.add(scope)
                  if indent == 0:
                      roots += 1
                      if key not in ('name', 'version', 'services', 'networks', 'volumes', 'configs', 'secrets') and not key.startswith('x-'):
                          raise UnsupportedModel()
                  if value is None:
                      parents.append((indent, key))
              if not roots:
                  raise UnsupportedModel()

          class SnapshotSet:
              def __init__(self, trusted_hardening):
                  self.trusted_hardening = trusted_hardening
                  self.entries, self.total, self.directory, self.directory_stat = {}, 0, None, None
                  self.directory_allocation_started = False

              def add(self, path):
                  path = Path(path)
                  if path in self.entries:
                      if not self.entries[path]['complete']:
                          raise UnsupportedModel()
                      return self.entries[path]
                  raw = read_regular(path)
                  closed_compose_bytes(raw, self.trusted_hardening)
                  if len(self.entries) >= 48 or self.total + len(raw) > 4 * LIMIT:
                      raise UnsupportedModel()
                  if self.directory is None:
                      allocation_signals = {signal.SIGALRM, signal.SIGTERM, signal.SIGHUP}
                      allocation_mask = signal.pthread_sigmask(signal.SIG_BLOCK, allocation_signals)
                      try:
                          self.directory_allocation_started = True
                          self.directory = Path(tempfile.mkdtemp(prefix='pc-web-readonly-audit-'))
                          self.directory.chmod(0o700)
                          self.directory_stat = self.directory.lstat()
                          if self.directory_stat.st_uid != os.geteuid() or stat.S_IMODE(self.directory_stat.st_mode) != 0o700:
                              raise UnsupportedModel()
                          self.directory_allocation_started = False
                      finally:
                          # Deliver the original pending signal only after the directory
                          # identity is registered; do not restart or extend its timer.
                          signal.pthread_sigmask(signal.SIG_SETMASK, allocation_mask)
                  target = self.directory / ('input-' + str(len(self.entries)) + '.yml')
                  blocked_signals = {signal.SIGALRM, signal.SIGTERM, signal.SIGHUP}
                  old_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked_signals)
                  fd = None
                  try:
                      fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
                      record = os.fstat(fd)
                      entry = {'path': target, 'raw': raw, 'digest': hashlib.sha256(raw).digest(),
                               'identity': (record.st_dev, record.st_ino, record.st_uid), 'complete': False, 'fd': fd}
                      self.entries[path] = entry
                      self.total += len(raw)
                  finally:
                      signal.pthread_sigmask(signal.SIG_SETMASK, old_mask)
                  try:
                      if record.st_uid != os.geteuid() or not stat.S_ISREG(record.st_mode) or stat.S_IMODE(record.st_mode) != 0o600 or record.st_nlink != 1:
                          raise UnsupportedModel()
                      offset = 0
                      while offset < len(raw):
                          offset += os.write(fd, raw[offset:])
                      if os.fstat(fd).st_size != len(raw):
                          raise UnsupportedModel()
                      entry['complete'] = True
                  finally:
                      if fd is not None:
                          os.close(fd)
                          entry['fd'] = None
                  return entry

              def close(self):
                  if self.directory is None:
                      return 'UNKNOWN' if self.directory_allocation_started else 'NOT_NEEDED'
                  try:
                      current = self.directory.lstat()
                      if (current.st_dev, current.st_ino, current.st_uid) != (self.directory_stat.st_dev, self.directory_stat.st_ino, self.directory_stat.st_uid) or not stat.S_ISDIR(current.st_mode) or stat.S_IMODE(current.st_mode) != 0o700:
                          return 'UNKNOWN'
                      for entry in self.entries.values():
                          if entry.get('fd') is not None:
                              os.close(entry['fd'])
                              entry['fd'] = None
                          path = entry['path']
                          record = path.lstat()
                          if (record.st_dev, record.st_ino, record.st_uid) != entry['identity'] or not stat.S_ISREG(record.st_mode) or stat.S_IMODE(record.st_mode) != 0o600 or record.st_nlink != 1:
                              return 'UNKNOWN'
                          path.unlink()
                      self.directory.rmdir()
                      return 'COMPLETE' if not self.directory.exists() else 'UNKNOWN'
                  except Exception:
                      return 'UNKNOWN'


          SNAPSHOTS = None

          def model(directory, project, paths):
              if not isinstance(project, str) or project and not re.fullmatch(r'[a-z0-9][a-z0-9_-]{0,127}', project):
                  raise ValueError('PROJECT')
              argv = ['docker', 'compose', '--project-directory', directory]
              if project:
                  argv += ['--project-name', project]
              for p in paths:
                  entry = SNAPSHOTS.add(p)
                  argv += ['-f', str(entry['path'])]
              value = decode(bounded(argv + ['config', '--format', 'json'], seconds=15))
              services = value.get('services') if isinstance(value, dict) else None
              if not isinstance(services, dict) or not 1 <= len(services) <= 64 or not {'api', 'web'} <= set(services):
                  raise ValueError('MODEL')
              if any(not isinstance(s, dict) for s in services.values()):
                  raise ValueError('SERVICE')
              return value

          def environment(row):
              env = (row.get('Config') or {}).get('Env') or []
              if not isinstance(env, list):
                  raise ValueError('ENV')
              pairs = [v.split('=', 1) for v in env if isinstance(v, str) and '=' in v]
              return unique(pairs)

          def authority(value):
              if not isinstance(value, str) or len(value) > 16384:
                  raise ValueError('URL')
              u = urlsplit(value)
              if u.scheme not in ('postgres', 'postgresql') or not all((u.username, u.password, u.hostname, u.path.strip('/'))):
                  raise ValueError('URL')
              return (u.hostname.lower(), u.port or 5432, u.path, tuple(sorted(parse_qsl(u.query, keep_blank_values=True))))

          def local_exact(ref, revision, runtime_id):
              if not isinstance(ref, str) or not SHA.fullmatch(revision):
                  return NP
              if ref != 'ghcr.io/pachaninm-lab/grainflow-web:sha-' + revision[:7]:
                  return 'NON_EXACT_REF'
              try:
                  row = inspect(ref, True)
              except Exception:
                  return 'LOCAL_IMAGE_NOT_PROVEN'
              if row.get('Id') != runtime_id:
                  return 'LOCAL_TAG_REBOUND'
              if labels(row).get('org.opencontainers.image.revision') != revision:
                  return 'REVISION_MISMATCH'
              return 'EXACT_LOCAL_MATCH'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class ObserverDeadline(BaseException):
              pass

          class HttpDeadline(Exception):
              pass

          def get_json(url):
              previous_handler = signal.getsignal(signal.SIGALRM)
              previous_timer = signal.getitimer(signal.ITIMER_REAL)
              started = time.monotonic()
              remaining = min(5, DEADLINE - started) if DEADLINE is not None else 5
              if remaining <= 0:
                  raise ObserverDeadline()
              def alarm(signum, frame):
                  if DEADLINE is not None and time.monotonic() >= DEADLINE:
                      raise ObserverDeadline()
                  raise HttpDeadline()
              signal.signal(signal.SIGALRM, alarm)
              signal.setitimer(signal.ITIMER_REAL, remaining)
              try:
                  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
                  with opener.open(urllib.request.Request(url, method='GET', headers={'Accept': 'application/json'}), timeout=remaining) as response:
                      raw = response.read(LIMIT + 1)
                      if len(raw) > LIMIT or response.status != 200:
                          raise ValueError('HTTP_BOUND')
                      if DEADLINE is not None and time.monotonic() >= DEADLINE:
                          raise ObserverDeadline()
                      return decode(raw)
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  signal.signal(signal.SIGALRM, previous_handler)
                  if previous_timer[0] > 0:
                      left = previous_timer[0] - (time.monotonic() - started)
                      if left > 0:
                          signal.setitimer(signal.ITIMER_REAL, left, previous_timer[1])
                  if DEADLINE is not None and time.monotonic() >= DEADLINE:
                      raise ObserverDeadline()


          def caddy_route(config, web):
              # This recognizes only simple canonical-host routes; unsupported matchers
              # never become a positive route claim.
              try:
                  servers = config['apps']['http']['servers']
                  if not isinstance(servers, dict) or not 1 <= len(servers) <= 16:
                      return NP
                  targets = {'web:3000'}
                  for network in ((web.get('NetworkSettings') or {}).get('Networks') or {}).values():
                      ip = network.get('IPAddress')
                      if ip:
                          targets.add(str(ipaddress.ip_address(ip)) + ':3000')
                  found = []
                  def walk(routes, parent_allows, depth=0):
                      if depth > 8 or not isinstance(routes, list) or len(routes) > 64:
                          raise ValueError('ROUTES')
                      for route in routes:
                          if not isinstance(route, dict) or set(route) - {'match', 'handle', 'terminal'}:
                              raise ValueError('ROUTE_SHAPE')
                          matchers = route.get('match', [{}])
                          if not isinstance(matchers, list) or not 1 <= len(matchers) <= 16:
                              raise ValueError('MATCHERS')
                          local_allows = False
                          for matcher in matchers:
                              if not isinstance(matcher, dict) or set(matcher) - {'host'}:
                                  raise ValueError('UNSUPPORTED_MATCHER')
                              hosts = matcher.get('host')
                              if hosts is None:
                                  local_allows = True
                              elif not isinstance(hosts, list) or not 1 <= len(hosts) <= 16 or any(not isinstance(h, str) or not re.fullmatch(r'[A-Za-z0-9.-]+', h) for h in hosts):
                                  raise ValueError('HOSTS')
                              elif DOMAIN in hosts:
                                  local_allows = True
                          allows = parent_allows and local_allows
                          if not allows:
                              continue
                          handlers = route.get('handle')
                          if not isinstance(handlers, list) or len(handlers) != 1 or not isinstance(handlers[0], dict):
                              raise ValueError('HANDLERS')
                          handler = handlers[0]
                          if handler.get('handler') == 'subroute' and set(handler) == {'handler', 'routes'}:
                              walk(handler['routes'], allows, depth + 1)
                          elif handler.get('handler') == 'reverse_proxy' and set(handler) == {'handler', 'upstreams'}:
                              upstreams = handler.get('upstreams')
                              if not isinstance(upstreams, list) or not 1 <= len(upstreams) <= 16:
                                  raise ValueError('UPSTREAMS')
                              found.extend(isinstance(u, dict) and set(u) == {'dial'} and u['dial'] in targets for u in upstreams)
                          else:
                              raise ValueError('UNSUPPORTED_HANDLER')
                  inspected = False
                  for server in servers.values():
                      if not isinstance(server, dict):
                          return NP
                      listen = server.get('listen')
                      if listen == [':443']:
                          inspected = True
                          walk(server.get('routes'), True)
                      elif not isinstance(listen, list) or any(not isinstance(v, str) or not v.endswith(':80') for v in listen):
                          return NP
                  return 'MATCH' if inspected and found and all(found) else NP
              except Exception:
                  return NP


          def _collect(inputs):
              out = {'schema': 'pc.web-readonly-preconditions.v1', 'source_sha': inputs['source_sha'],
                     'closure': NP, 'observation': 'BLOCKED', 'snapshot_cleanup': 'NOT_NEEDED',
                     'selectors': NP, 'label_model': NP, 'selected_model': NP, 'models_relation': NP,
                     'migration': NP, 'migration_database': NP, 'persisted_model': NP, 'persisted_image': NP,
                     'persisted_hardening': NP, 'web_revision': 'unknown', 'web_health': NP,
                     'container_image_binding': NP, 'rollback_local': NP, 'caddy_mode': NP,
                     'caddy_count': 0, 'caddy_admin_route': NP, 'public_readiness': NP,
                     'runtime_stability': NP, 'observed_file_stability': NP, 'production_mutation': 'NONE'}
              if not SHA.fullmatch(inputs['source_sha']):
                  raise ValueError('SOURCE')
              ids = bounded(['docker', 'ps', '-q', '--no-trunc'], limit=8192).decode().splitlines()
              if not 1 <= len(ids) <= 64 or any(not re.fullmatch(r'[0-9a-f]{12,64}', v) for v in ids):
                  return out
              rows = [inspect(v) for v in ids]
              webs = [r for r in rows if labels(r).get('com.docker.compose.service') == 'web']
              if len(webs) != 1:
                  return out
              web = webs[0]
              wl = labels(web)
              rev = wl.get('org.opencontainers.image.revision', '')
              out['web_revision'] = rev if isinstance(rev, str) and SHA.fullmatch(rev) else 'unknown'
              state = web.get('State') or {}
              health = (state.get('Health') or {}).get('Status', state.get('Status'))
              if health in ('healthy', 'unhealthy', 'starting', 'running', 'exited', 'created', 'restarting', 'paused', 'dead', 'removing'):
                  out['web_health'] = health
              runtime_id = web.get('Image', '')
              try:
                  row = inspect(runtime_id, True)
                  out['container_image_binding'] = ('MATCH' if IMAGE_ID.fullmatch(runtime_id) and row.get('Id') == runtime_id
                      and labels(row).get('org.opencontainers.image.revision') == rev and SHA.fullmatch(rev) else 'MISMATCH')
              except Exception:
                  pass
              out['rollback_local'] = local_exact((web.get('Config') or {}).get('Image'), rev, runtime_id)
              project = wl.get('com.docker.compose.project', '')
              peers = [r for r in rows if labels(r).get('com.docker.compose.project') == project]
              apis = [r for r in peers if labels(r).get('com.docker.compose.service') == 'api']
              observed = {}
              try:
                  label_paths = files_for(wl.get('com.docker.compose.project.working_dir'), wl.get('com.docker.compose.project.config_files'))
                  directory, raw = inputs.get('directory', ''), inputs.get('compose', '')
                  if bool(directory) != bool(raw):
                      out['selectors'] = 'PARTIAL'
                      raise UnsupportedModel()
                  if not directory:
                      directory, raw = wl.get('com.docker.compose.project.working_dir'), wl.get('com.docker.compose.project.config_files')
                  selected_paths = files_for(directory, raw)
                  all_paths = list(dict.fromkeys(label_paths + selected_paths))
                  for name in ('compose.production-hardening.override.yml', 'compose.production-web-image.override.yml'):
                      candidate = Path(directory) / name
                      if candidate.exists() or candidate.is_symlink():
                          all_paths.append(candidate)
                  for candidate in all_paths:
                      entry = SNAPSHOTS.add(candidate)
                      observed.setdefault(candidate, entry['digest'])
                  out['closure'] = 'SUPPORTED'
              except (UnsupportedModel, ValueError, UnicodeError, OSError):
                  out['closure'] = 'UNSUPPORTED'
                  return out
              out['observation'] = 'COMPLETE'
              def render(directory, raw, chosen_project):
                  paths = files_for(directory, raw)
                  for p in paths:
                      observed.setdefault(p, SNAPSHOTS.add(p)['digest'])
                  return model(directory, chosen_project, paths), paths
              lm = sm = None
              try:
                  lm, _ = render(wl.get('com.docker.compose.project.working_dir'), wl.get('com.docker.compose.project.config_files'), project)
                  out['label_model'] = 'OBSERVED'
              except Exception:
                  pass
              directory, raw = inputs.get('directory', ''), inputs.get('compose', '')
              if bool(directory) != bool(raw):
                  out['selectors'] = 'PARTIAL'
              else:
                  out['selectors'] = 'EXPLICIT' if directory else 'LABEL_FALLBACK'
                  if not directory:
                      directory, raw = wl.get('com.docker.compose.project.working_dir'), wl.get('com.docker.compose.project.config_files')
                  try:
                      chosen_project = inputs.get('project') or (project if out['selectors'] == 'LABEL_FALLBACK' else '')
                      sm, paths = render(directory, raw, chosen_project)
                      out['selected_model'] = 'OBSERVED'
                      if lm is not None:
                          out['models_relation'] = 'MATCH' if lm == sm else 'DIFFERENT'
                      services = sm['services']
                      migrations = [s for name, s in services.items() if re.search(r'(^|[-_])(migrate|migration)([-_]|$)', name, re.I)
                                    or 'grainflow-migration' in str(s.get('image', ''))
                                    or ('prisma' in str(s.get('command', '')) and 'migrate' in str(s.get('command', '')))]
                      out['migration'] = 'MISSING' if not migrations else 'UNIQUE' if len(migrations) == 1 else 'AMBIGUOUS'
                      if len(migrations) == 1 and len(apis) == 1:
                          try:
                              value = (migrations[0].get('environment') or {}).get('DATABASE_URL')
                              out['migration_database'] = ('SAME_API_AUTHORITY' if authority(value) == authority(environment(apis[0]).get('DATABASE_URL')) else 'DIFFERENT_API_AUTHORITY')
                          except Exception:
                              out['migration_database'] = 'MALFORMED_OR_MISSING'
                      hardening = Path(directory) / 'compose.production-hardening.override.yml'
                      image = Path(directory) / 'compose.production-web-image.override.yml'
                      extra = []
                      if not hardening.exists():
                          out['persisted_hardening'] = 'ABSENT'
                      elif not hardening.is_symlink() and hardening.is_file() and hardening.stat().st_size <= LIMIT:
                          out['persisted_hardening'] = ('MATCH_SOURCE' if SNAPSHOTS.add(hardening)['digest'].hex() == inputs['hardening_sha256'] else 'DIFFERENT_SOURCE')
                      for p in (hardening, image):
                          if p.is_symlink() or not p.is_file() or p.stat().st_size > LIMIT:
                              raise ValueError('PERSISTED_FILE')
                          observed.setdefault(p, SNAPSHOTS.add(p)['digest'])
                          if p not in paths:
                              extra.append(p)
                      out['persisted_hardening'] = ('MATCH_SOURCE' if observed[hardening].hex() == inputs['hardening_sha256'] else 'DIFFERENT_SOURCE')
                      pm = model(directory, chosen_project, paths + extra)
                      out['persisted_model'] = 'OBSERVED'
                      image_ref = pm['services']['web'].get('image')
                      out['persisted_image'] = 'MATCH_RUNTIME_REF' if image_ref == (web.get('Config') or {}).get('Image') else 'DIFFERENT_RUNTIME_REF'
                  except Exception:
                      pass
              caddies = [r for r in rows if labels(r).get('com.docker.compose.service') == 'caddy'
                         or re.fullmatch(r'(?:[^ /]+/)*caddy(?::[^ ]+|@sha256:[0-9a-f]{64})?', str((r.get('Config') or {}).get('Image', '')))]
              out['caddy_count'] = len(caddies)
              active = None
              try:
                  unit_state = bounded(['systemctl', 'show', 'caddy', '--property=ActiveState', '--value'], limit=64, seconds=3).strip()
                  if unit_state in (b'active', b'inactive', b'failed'):
                      active = unit_state == b'active'
              except Exception:
                  pass
              out['caddy_mode'] = ('AMBIGUOUS' if len(caddies) > 1 or (caddies and active) else
                                   'COMPOSE' if len(caddies) == 1 and active is False and labels(caddies[0]).get('com.docker.compose.service') == 'caddy' else
                                   'SYSTEMD' if active and not caddies else NP)
              try:
                  out['caddy_admin_route'] = caddy_route(get_json('http://127.0.0.1:2019/config/'), web)
              except Exception:
                  pass
              try:
                  ready = get_json('https://' + DOMAIN + '/api/health/ready')
                  good = (isinstance(ready, dict) and ready.get('status') == 'ok' and ready.get('service') == 'web'
                          and ready.get('releaseAuthority') == 'exact-sha' and SHA.fullmatch(str(ready.get('revision', ''))))
                  out['public_readiness'] = ('CURRENT_REVISION' if good and ready['revision'] == rev else
                                             'DIFFERENT_REVISION' if good else 'NOT_READY')
              except Exception:
                  pass
              try:
                  out['runtime_stability'] = 'UNCHANGED' if identity(web) == identity(inspect(web['Id'])) else 'CHANGED'
                  out['observed_file_stability'] = ('UNCHANGED' if observed and all(not p.is_symlink() and p.is_file()
                      and p.stat().st_size <= LIMIT and hashlib.sha256(read_regular(p)).digest() == digest for p, digest in observed.items()) else 'CHANGED')
              except Exception:
                  pass
              return out

          class ObserverAbort(BaseException):
              pass

          def require_root():
              if os.geteuid() != 0:
                  raise UnsupportedModel()

          def collect(inputs, seconds=60):
              global DEADLINE, SNAPSHOTS
              previous_deadline, previous_snapshots = DEADLINE, SNAPSHOTS
              signals = (signal.SIGALRM, signal.SIGTERM, signal.SIGHUP)
              previous_handlers = {s: signal.getsignal(s) for s in signals}
              previous_timer = signal.getitimer(signal.ITIMER_REAL)
              started = time.monotonic()
              DEADLINE = started + seconds
              snapshots = SnapshotSet(inputs['hardening_sha256'])
              SNAPSHOTS = snapshots
              def alarm(signum, frame):
                  if signum == signal.SIGALRM:
                      raise ObserverDeadline()
                  raise ObserverAbort()
              for s in signals:
                  signal.signal(s, alarm)
              signal.setitimer(signal.ITIMER_REAL, seconds)
              out = None
              try:
                  require_root()
                  out = _collect(inputs)
              except (ObserverDeadline, ObserverAbort, Exception) as error:
                  # Fixed report only; no original exception/transport/config data escapes.
                  out = {'schema': 'pc.web-readonly-preconditions.v1', 'source_sha': inputs['source_sha'],
                         'closure': NP, 'observation': 'DEADLINE' if isinstance(error, ObserverDeadline) else 'ABORTED' if isinstance(error, ObserverAbort) else 'FAILED',
                         'snapshot_cleanup': 'UNKNOWN', 'selectors': NP, 'label_model': NP, 'selected_model': NP, 'models_relation': NP,
                         'migration': NP, 'migration_database': NP, 'persisted_model': NP, 'persisted_image': NP,
                         'persisted_hardening': NP, 'web_revision': 'unknown', 'web_health': NP,
                         'container_image_binding': NP, 'rollback_local': NP, 'caddy_mode': NP, 'caddy_count': 0,
                         'caddy_admin_route': NP, 'public_readiness': NP, 'runtime_stability': NP,
                         'observed_file_stability': NP, 'production_mutation': 'NONE'}
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  old_mask = signal.pthread_sigmask(signal.SIG_BLOCK, set(signals))
                  try:
                      cleanup = snapshots.close()
                      if out is not None:
                          out['snapshot_cleanup'] = cleanup
                  finally:
                      DEADLINE, SNAPSHOTS = previous_deadline, previous_snapshots
                      for s, handler in previous_handlers.items():
                          signal.signal(s, handler)
                      signal.pthread_sigmask(signal.SIG_SETMASK, old_mask)
                      if previous_timer[0] > 0:
                          left = previous_timer[0] - (time.monotonic() - started)
                          if left > 0:
                              signal.setitimer(signal.ITIMER_REAL, left, previous_timer[1])
              return out


          if __name__ == '__main__':
              try:
                  report = collect(INPUTS)
                  raw = json.dumps(report, sort_keys=True, separators=(',', ':')).encode()
                  if len(raw) > 4096:
                      raise ValueError('REPORT_BOUND')
                  print(raw.decode())
              except (Exception, ObserverDeadline):
                  print('AUDIT_OBSERVATION_FAILED', file=__import__('sys').stderr)
                  raise SystemExit(1)
          '''

          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import sys

          ENUMS = {
              'closure': {'SUPPORTED', 'UNSUPPORTED', 'NOT_PROVEN'},
              'observation': {'COMPLETE', 'BLOCKED', 'DEADLINE', 'ABORTED', 'FAILED'},
              'snapshot_cleanup': {'COMPLETE', 'UNKNOWN', 'NOT_NEEDED'},
              'selectors': {'EXPLICIT', 'LABEL_FALLBACK', 'PARTIAL', 'NOT_PROVEN'},
              'label_model': {'OBSERVED', 'NOT_PROVEN'},
              'selected_model': {'OBSERVED', 'NOT_PROVEN'},
              'models_relation': {'MATCH', 'DIFFERENT', 'NOT_PROVEN'},
              'migration': {'MISSING', 'UNIQUE', 'AMBIGUOUS', 'NOT_PROVEN'},
              'migration_database': {'SAME_API_AUTHORITY', 'DIFFERENT_API_AUTHORITY', 'MALFORMED_OR_MISSING', 'NOT_PROVEN'},
              'persisted_model': {'OBSERVED', 'NOT_PROVEN'},
              'persisted_image': {'MATCH_RUNTIME_REF', 'DIFFERENT_RUNTIME_REF', 'NOT_PROVEN'},
              'persisted_hardening': {'MATCH_SOURCE', 'DIFFERENT_SOURCE', 'ABSENT', 'NOT_PROVEN'},
              'web_health': {'healthy', 'unhealthy', 'starting', 'running', 'exited', 'created', 'restarting', 'paused', 'dead', 'removing', 'NOT_PROVEN'},
              'container_image_binding': {'MATCH', 'MISMATCH', 'NOT_PROVEN'},
              'rollback_local': {'EXACT_LOCAL_MATCH', 'NON_EXACT_REF', 'LOCAL_IMAGE_NOT_PROVEN', 'LOCAL_TAG_REBOUND', 'REVISION_MISMATCH', 'NOT_PROVEN'},
              'caddy_mode': {'COMPOSE', 'SYSTEMD', 'AMBIGUOUS', 'NOT_PROVEN'},
              'caddy_admin_route': {'MATCH', 'NOT_PROVEN'},
              'public_readiness': {'CURRENT_REVISION', 'DIFFERENT_REVISION', 'NOT_READY', 'NOT_PROVEN'},
              'runtime_stability': {'UNCHANGED', 'CHANGED', 'NOT_PROVEN'},
              'observed_file_stability': {'UNCHANGED', 'CHANGED', 'NOT_PROVEN'},
          }

          def validate_report(raw, source_sha):
              if not 0 < len(raw) <= 4096:
                  raise ValueError('BOUND')
              ns = {'__name__': 'audit_admission'}
              exec(compile(COLLECTOR, '<audit-collector>', 'exec'), ns)
              value = ns['decode'](raw)
              expected = set(ENUMS) | {'schema', 'source_sha', 'web_revision', 'caddy_count', 'production_mutation'}
              if not isinstance(value, dict) or set(value) != expected:
                  raise ValueError('SCHEMA')
              if value['schema'] != 'pc.web-readonly-preconditions.v1' or value['source_sha'] != source_sha or not re.fullmatch(r'[0-9a-f]{40}', source_sha):
                  raise ValueError('BINDING')
              if value['production_mutation'] != 'NONE':
                  raise ValueError('AUTHORITY')
              for key, choices in ENUMS.items():
                  if not isinstance(value[key], str) or value[key] not in choices:
                      raise ValueError('ENUM')
              if type(value['caddy_count']) is not int or not 0 <= value['caddy_count'] <= 64:
                  raise ValueError('COUNT')
              if not isinstance(value['web_revision'], str) or not re.fullmatch(r'(?:[0-9a-f]{40}|unknown)', value['web_revision']):
                  raise ValueError('REVISION')
              if value['observation'] == 'COMPLETE' and value['closure'] != 'SUPPORTED':
                  raise ValueError('CLOSURE')
              if value['closure'] != 'SUPPORTED' and any(value[k] != 'NOT_PROVEN' for k in ('label_model', 'selected_model', 'models_relation', 'migration', 'migration_database', 'persisted_model', 'persisted_image', 'persisted_hardening')):
                  raise ValueError('UNSUPPORTED_RENDER')
              if value['caddy_mode'] == 'COMPOSE' and value['caddy_count'] != 1 or value['caddy_mode'] == 'SYSTEMD' and value['caddy_count'] != 0:
                  raise ValueError('CADDY')
              if value['selectors'] == 'PARTIAL' and value['selected_model'] != 'NOT_PROVEN':
                  raise ValueError('SELECTION')
              if value['migration'] != 'NOT_PROVEN' and value['selected_model'] != 'OBSERVED':
                  raise ValueError('MODEL')
              if value['migration_database'] != 'NOT_PROVEN' and value['migration'] != 'UNIQUE':
                  raise ValueError('MIGRATION')
              if value['persisted_model'] == 'OBSERVED' and value['selected_model'] != 'OBSERVED':
                  raise ValueError('PERSISTED')
              if value['public_readiness'] == 'CURRENT_REVISION' and value['web_revision'] == 'unknown':
                  raise ValueError('PUBLIC_REVISION')
              if value['rollback_local'] == 'EXACT_LOCAL_MATCH' and value['container_image_binding'] != 'MATCH':
                  raise ValueError('LOCAL_BINDING')
              return json.dumps(value, sort_keys=True, separators=(',', ':')).encode() + b'\n'

          def main():
              destination = Path(os.environ['EVIDENCE_DIR']) / 'readonly-preconditions.json'
              destination.unlink(missing_ok=True)
              os.umask(0o077)
              try:
                  if os.environ.get('AUDIT_ACTION') != 'audit':
                      raise ValueError('MODE')
                  host, user, port = (os.environ.get(k, '') for k in ('AUDIT_HOST', 'AUDIT_USER', 'AUDIT_PORT'))
                  if host != '195.19.12.120' or not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_-]{0,31}', user) or not port.isdigit() or not 1 <= int(port) <= 65535:
                      raise ValueError('TRANSPORT')
                  source_sha = os.environ.get('GITHUB_SHA', '')
                  inputs = {'source_sha': source_sha,
                            'directory': os.environ.get('PROD_DIR_SECRET', ''),
                            'compose': os.environ.get('PROD_COMPOSE_SECRET', ''),
                            'project': os.environ.get('PROD_PROJECT_SECRET', ''),
                            'hardening_sha256': hashlib.sha256(Path('infra/compose/production-web-hardening.override.yml').read_bytes()).hexdigest()}
                  if any(len(v) > 16384 or '\0' in v or '\n' in v or '\r' in v for v in inputs.values()):
                      raise ValueError('INPUT_BOUND')
                  bootstrap = "import json,sys;p=json.loads(sys.stdin.buffer.read(196609));exec(compile(p['source'],'<web-readonly-audit>','exec'),{'__name__':'__main__','INPUTS':p['inputs']})"
                  payload = json.dumps({'source': COLLECTOR, 'inputs': inputs}, separators=(',', ':')).encode()
                  if len(payload) > 196608:
                      raise ValueError('SOURCE_BOUND')
                  ns = {'__name__': 'audit_transport'}
                  exec(compile(COLLECTOR, '<audit-collector>', 'exec'), ns)
                  argv = ['ssh', '-T', '-i', str(Path.home() / '.ssh/id_pc_prod'), '-p', port,
                          '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'StrictHostKeyChecking=yes',
                          '-o', 'ConnectTimeout=15', user + '@' + host, 'python3 -c ' + shlex.quote(bootstrap)]
                  raw = ns['bounded'](argv, payload=payload, limit=4096, seconds=90)
                  admitted = validate_report(raw, source_sha)
                  destination.write_bytes(admitted)
                  destination.chmod(0o600)
                  sys.stdout.write(admitted.decode())
                  result = json.loads(admitted)
                  if result['observation'] != 'COMPLETE' or result['closure'] != 'SUPPORTED' or result['snapshot_cleanup'] != 'COMPLETE':
                      sys.stderr.write('Audit blocked before legacy production execution.\n')
                      raise SystemExit(2)
              except Exception:
                  destination.unlink(missing_ok=True)
                  sys.stderr.write('Audit observation rejected.\n')
                  raise SystemExit(1)

          if __name__ == '__main__':
              main()
          PY_WEB_READONLY_AUDIT

      - name: Copy immutable release assets
        if: steps.intent.outputs.action != 'audit'
        env:
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          scp_options=(
            -i "$HOME/.ssh/id_pc_prod"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          scp "${scp_options[@]}" \
            scripts/production-web-exact-sha.sh \
            "$SSH_USER@$SSH_HOST:/tmp/pc-production-web-exact-sha-${GITHUB_RUN_ID}.sh"
          scp "${scp_options[@]}" \
            scripts/production-web-live-acceptance.sh \
            "$SSH_USER@$SSH_HOST:/tmp/pc-production-web-live-acceptance-${GITHUB_RUN_ID}.sh"
          scp "${scp_options[@]}" \
            scripts/production-web-remote-entrypoint.sh \
            "$SSH_USER@$SSH_HOST:/tmp/pc-production-web-remote-entrypoint-${GITHUB_RUN_ID}.sh"
          scp "${scp_options[@]}" \
            infra/compose/production-web-hardening.override.yml \
            "$SSH_USER@$SSH_HOST:/tmp/pc-production-web-hardening-${GITHUB_RUN_ID}.yml"

      - name: Execute bounded production action
        if: steps.intent.outputs.action != 'audit'
        id: production
        env:
          ACTION: ${{ steps.intent.outputs.action }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$(mktemp)"
          trap 'rm -f "$raw"' EXIT

          encode() {
            printf '%s' "$1" | base64 -w0
          }

          prod_dir_b64="$(encode "${PROD_DIR_SECRET:-}")"
          prod_compose_b64="$(encode "${PROD_COMPOSE_SECRET:-}")"
          prod_project_b64="$(encode "${PROD_PROJECT_SECRET:-}")"
          remote_entrypoint="/tmp/pc-production-web-remote-entrypoint-${GITHUB_RUN_ID}.sh"

          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            -o TCPKeepAlive=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "chmod 0700 '$remote_entrypoint' && PROD_DIR_B64='$prod_dir_b64' PROD_COMPOSE_B64='$prod_compose_b64' PROD_PROJECT_B64='$prod_project_b64' '$remote_entrypoint' '$ACTION' '$TARGET_SHA' '$GITHUB_RUN_ID'" \
            > "$raw" 2>&1
          rc=$?
          set -e

          python3 "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" "$raw" \
            "$EVIDENCE_DIR/production-action.log" "$ACTION" "$TARGET_SHA" "$rc"
          rm -f "$raw"
          trap - EXIT
          cat "$EVIDENCE_DIR/production-action.log"

          baseline_revision="$(sed -n 's/^ROLLBACK_BASELINE_REVISION=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          deployment_complete="$(sed -n 's/^DEPLOYMENT_COMPLETE=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          watchtower_retired="$(sed -n 's/^WATCHTOWER_RETIRED=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          persistent_override_mutated="$(sed -n 's/^PERSISTENT_OVERRIDE_MUTATED=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          deployed_revision="$(sed -n 's/^DEPLOYED_WEB_REVISION=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          deployed_state="$(sed -n 's/^DEPLOYED_WEB_STATE=//p' "$EVIDENCE_DIR/production-action.log" | tail -1)"
          echo "baseline_revision=${baseline_revision:-unknown}" >> "$GITHUB_OUTPUT"
          echo "deployment_complete=${deployment_complete:-0}" >> "$GITHUB_OUTPUT"
          echo "watchtower_retired=${watchtower_retired:-0}" >> "$GITHUB_OUTPUT"
          echo "persistent_override_mutated=${persistent_override_mutated:-unknown}" >> "$GITHUB_OUTPUT"
          echo "deployed_revision=${deployed_revision:-unknown}" >> "$GITHUB_OUTPUT"
          echo "deployed_state=${deployed_state:-unknown}" >> "$GITHUB_OUTPUT"

          if [[ "$ACTION" == audit ]]; then
            [[ "${persistent_override_mutated:-unknown}" == 0 ]]
          fi
          (( rc == 0 )) || exit "$rc"

      - name: Verify exact public runtime
        id: live
        if: steps.intent.outputs.action != 'audit' && steps.production.outputs.deployment_complete == '1'
        continue-on-error: true
        env:
          PC_LIVE_BASE: ${{ env.LIVE_BASE }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
          ACTION: ${{ steps.intent.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production-web-live-acceptance.sh "$TARGET_SHA" "$ACTION" |
            tee "$EVIDENCE_DIR/live-acceptance.log"

      - name: Restore previous exact revision after live failure
        if: steps.live.outcome == 'failure'
        env:
          BASELINE_SHA: ${{ steps.production.outputs.baseline_revision }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'No exact rollback baseline revision is available.' >&2
            exit 30
          }
          umask 077
          raw="$(mktemp)"
          trap 'rm -f "$raw"' EXIT

          encode() {
            printf '%s' "$1" | base64 -w0
          }
          prod_dir_b64="$(encode "${PROD_DIR_SECRET:-}")"
          prod_compose_b64="$(encode "${PROD_COMPOSE_SECRET:-}")"
          prod_project_b64="$(encode "${PROD_PROJECT_SECRET:-}")"
          remote_entrypoint="/tmp/pc-production-web-remote-entrypoint-${GITHUB_RUN_ID}.sh"

          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            -o TCPKeepAlive=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "PROD_DIR_B64='$prod_dir_b64' PROD_COMPOSE_B64='$prod_compose_b64' PROD_PROJECT_B64='$prod_project_b64' '$remote_entrypoint' rollback '$BASELINE_SHA' '$GITHUB_RUN_ID'" \
            > "$raw" 2>&1
          rc=$?
          set -e
          python3 "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" "$raw" \
            "$EVIDENCE_DIR/live-failure-rollback.log" rollback "$BASELINE_SHA" "$rc"
          rm -f "$raw"
          trap - EXIT
          cat "$EVIDENCE_DIR/live-failure-rollback.log"
          (( rc == 0 )) || exit "$rc"

      - name: Remove private runner release material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/pc-web-evidence-$GITHUB_RUN_ID.py" \
            "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Enforce final release result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          action='${{ steps.intent.outputs.action }}'
          live_outcome='${{ steps.live.outcome }}'
          if [[ "$action" != audit && "$live_outcome" != success ]]; then
            echo 'Production was restored when possible, but exact live acceptance failed.' >&2
            exit 40
          fi

      - name: Build evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 |
            sort -z |
            xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"

      - name: Publish release record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.intent.outputs.action }}
          TARGET_SHA: ${{ steps.intent.outputs.target_sha }}
          DEPLOYMENT_COMPLETE: ${{ steps.production.outputs.deployment_complete }}
          DEPLOYED_REVISION: ${{ steps.production.outputs.deployed_revision }}
          DEPLOYED_STATE: ${{ steps.production.outputs.deployed_state }}
          BASELINE_REVISION: ${{ steps.production.outputs.baseline_revision }}
          WATCHTOWER_RETIRED: ${{ steps.production.outputs.watchtower_retired }}
          PERSISTENT_OVERRIDE_MUTATED: ${{ steps.production.outputs.persistent_override_mutated }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          FINAL_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          target="${TARGET_SHA:-AUDIT}"
          live_acceptance="$(sed -n 's/^LIVE_ACCEPTANCE=//p' "$EVIDENCE_DIR/live-acceptance.log" 2>/dev/null | tail -1 || true)"
          rollback_result='not-required'
          if [[ -f "$EVIDENCE_DIR/live-failure-rollback.log" ]]; then
            rollback_result="$(sed -n 's/^DEPLOYMENT_COMPLETE=//p' "$EVIDENCE_DIR/live-failure-rollback.log" | tail -1)"
            rollback_result="${rollback_result:-attempted}"
          fi

          record="$EVIDENCE_DIR/release-issue-comment.md"
          {
            echo "## Production web release run \`$GITHUB_RUN_ID\`"
            echo
            echo "- action: \`${ACTION:-unknown}\`"
            echo "- target SHA: \`$target\`"
            echo "- deployment complete: \`${DEPLOYMENT_COMPLETE:-0}\`"
            echo "- running OCI revision: \`${DEPLOYED_REVISION:-unknown}\`"
            echo "- Docker state: \`${DEPLOYED_STATE:-unknown}\`"
            echo "- live acceptance: \`${live_acceptance:-${LIVE_OUTCOME:-not-run}}\`"
            echo "- rollback baseline: \`${BASELINE_REVISION:-unknown}\`"
            echo "- rollback result: \`$rollback_result\`"
            echo "- Watchtower retired: \`${WATCHTOWER_RETIRED:-0}\`"
            echo "- persistent override mutation: \`${PERSISTENT_OVERRIDE_MUTATED:-unknown}\`"
            echo "- workflow status at record: \`${FINAL_JOB_STATUS:-unknown}\`"
            echo "- workflow run ID: \`$GITHUB_RUN_ID\`"
          } > "$record"

          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 |
            sort -z |
            xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"

          gh issue comment "$RELEASE_ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$record"

          if [[ "${ACTION:-}" == deploy \
            && "${DEPLOYMENT_COMPLETE:-0}" == 1 \
            && "${DEPLOYED_REVISION:-}" == "$TARGET_SHA" \
            && "${live_acceptance:-}" == PASS \
            && "${WATCHTOWER_RETIRED:-0}" == 1 ]]; then
            gh issue close "$RELEASE_ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-web-exact-sha-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
