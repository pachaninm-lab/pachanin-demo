name: TAI one-shot reconcile PR 3667 with current main

on:
  push:
    branches:
      - fix/tai-general-agro-completeness-20260803
    paths:
      - .github/workflows/tai-one-shot-reconcile-current-main-3667.yml

permissions:
  contents: write

concurrency:
  group: tai-one-shot-reconcile-current-main-3667
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile exact TAI functional diff with current main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/tai-general-agro-completeness-20260803
          fetch-depth: 0

      - name: Merge current main and resolve only superseded security files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if (( merge_status != 0 )); then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            printf 'Conflicts detected:\n%s\n' "$conflicts"
            allowed_conflicts=$'docs/platform-v7/autopilot/security-exceptions.json\npackage.json\npnpm-lock.yaml\nscripts/p7-autopilot-guard.sh'
            unexpected="$(comm -23 <(printf '%s\n' "$conflicts" | sed '/^$/d' | sort) <(printf '%s\n' "$allowed_conflicts" | sort) || true)"
            [[ -z "$unexpected" ]] || { printf 'Unexpected merge conflicts:\n%s\n' "$unexpected" >&2; git merge --abort; exit 21; }
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              if printf '%s\n' "$conflicts" | grep -Fxq "$file"; then
                git checkout --theirs -- "$file"
                git add "$file"
              fi
            done <<< "$allowed_conflicts"
            remaining="$(git diff --name-only --diff-filter=U)"
            [[ -z "$remaining" ]] || { printf 'Unresolved conflicts:\n%s\n' "$remaining" >&2; git merge --abort; exit 22; }
          fi

          git rm .github/workflows/tai-one-shot-reconcile-current-main-3667.yml

          MAIN_SHA="$MAIN_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('docs/platform-v7/autopilot/scopes/tai-general-agro-completeness-20260803.json')
          data = {
              'schemaVersion': 'platform-v7.concurrent-scope.v1',
              'branch': 'fix/tai-general-agro-completeness-20260803',
              'status': 'active',
              'title': 'TAI general-agro answer completeness and activation acceptance repair',
              'priority': 'P0',
              'baselineExactMain': os.environ['MAIN_SHA'],
              'productionHosting': 'REG_RU_VPS_ONLY',
              'newRecurringCostRub': 0,
              'objective': 'Require useful concrete factors in broad agriculture and agribusiness answers while preserving model-first, fail-open content routing and fail-closed authority boundaries.',
              'allowedPaths': [
                  '.github/workflows/tai-restricted-qwen-reg-ru-activation.yml',
                  'apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts',
                  'apps/api/src/modules/ai-insights/restricted-public-qwen.quality.spec.ts',
                  'scripts/tai-potato-mobile-live-acceptance.mjs',
                  'docs/platform-v7/autopilot/scopes/tai-general-agro-completeness-20260803.json',
              ],
              'boundaries': [
                  'Do not weaken, remove, skip or make optional any RU, EN, ZH, SSE, Chromium, mobile, subject-relevance or substantive-factor acceptance assertion',
                  'General-agro answers remain model-first and must name at least two applicable observable or measurable decision factors before clarification',
                  'The completeness frame is reusable across crop production, irrigation, livestock, machinery, storage, farm infrastructure, economics and farm IT rather than a single hard-coded answer',
                  'Do not fabricate agronomic doses, pesticide rates, veterinary medicines, machinery specifications, diagnostic codes, compatibility, prices, laws, integrations or production status',
                  'Private model transport, HMAC authority, role and tenant boundaries, secret redaction, no-write guarantees and current-evidence controls remain unchanged',
                  'Activation failure evidence retains the actual failed public answer and completed-case metadata',
                  'The activation workflow runs when the restricted public Qwen service or its tests change',
                  'Dependency and lockfile authority comes exclusively from current main; this branch carries no dependency remediation or exception',
                  'No paid model, SaaS, hosting, database or recurring cost is added',
                  'Completion requires exact-head checks, exact-main merge, canonical images, REG.RU release, preflight, protected Qwen activation, 21 endpoint and 5 mobile Chromium cases, finalization accept and postflight',
              ],
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/platform-v7/autopilot/scopes/tai-general-agro-completeness-20260803.json

          for file in package.json pnpm-lock.yaml scripts/p7-autopilot-guard.sh docs/platform-v7/autopilot/security-exceptions.json; do
            git diff --quiet origin/main -- "$file" || { echo "Superseded security file differs from current main: $file" >&2; exit 23; }
          done

          expected=$'.github/workflows/tai-restricted-qwen-reg-ru-activation.yml\napps/api/src/modules/ai-insights/restricted-public-qwen.quality.spec.ts\napps/api/src/modules/ai-insights/restricted-public-qwen.service.ts\ndocs/platform-v7/autopilot/scopes/tai-general-agro-completeness-20260803.json\nscripts/tai-potato-mobile-live-acceptance.mjs'
          actual="$(git diff --cached --name-only origin/main | sort)"
          [[ "$actual" == "$(printf '%s\n' "$expected" | sort)" ]] || {
            printf 'Unexpected final diff.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 24
          }
          git diff --check --cached

          git commit -m "merge: reconcile TAI agro completeness with current main"
          git push origin HEAD:fix/tai-general-agro-completeness-20260803
