name: Diagnose presentation live 500

on:
  push:
    branches:
      - verify/presentation-live-final-f69-20260829-r2
    paths:
      - .github/workflows/diagnose-presentation-live-500-f69.yml

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reproduce exact image locally
        shell: bash
        run: |
          set -u
          image='ghcr.io/pachaninm-lab/grainflow-web:sha-f69a308'
          docker pull "$image"
          id="$(docker run -d -p 3000:3000 "$image")"
          cleanup(){ docker logs "$id" 2>&1 | tail -200 || true; docker rm -f "$id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          local_body="$(mktemp)"
          local_headers="$(mktemp)"
          local_status="$(curl -sS -D "$local_headers" -o "$local_body" -w '%{http_code}' http://127.0.0.1:3000/downloads/prozrachnaya-tsena-presentation.pdf || true)"
          echo "LOCAL_HTTP=$local_status"
          echo "LOCAL_BYTES=$(wc -c < "$local_body" | tr -d '[:space:]')"
          echo "LOCAL_SHA256=$(sha256sum "$local_body" | awk '{print $1}')"
          cat "$local_headers"

          live_body="$(mktemp)"
          live_headers="$(mktemp)"
          live_status="$(curl -sS -L --retry 2 --retry-all-errors --connect-timeout 15 --max-time 60 -D "$live_headers" -o "$live_body" -w '%{http_code}' https://xn----8sbjf4befbjgs9b.xn--p1ai/downloads/prozrachnaya-tsena-presentation.pdf || true)"
          echo "LIVE_HTTP=$live_status"
          echo "LIVE_BYTES=$(wc -c < "$live_body" | tr -d '[:space:]')"
          echo "LIVE_SHA256=$(sha256sum "$live_body" | awk '{print $1}')"
          cat "$live_headers"

          test "$local_status" = 200
