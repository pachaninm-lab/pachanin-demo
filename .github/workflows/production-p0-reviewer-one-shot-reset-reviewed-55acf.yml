name: Production P0 Reviewer One-Shot Reset Exact-Signature 55acf

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-one-shot-reset-reviewed-55acf.yml'
      - 'docs/platform-v7/autopilot/scopes/p0-reviewer-one-shot-reset-reviewed-55acf-3785.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-one-shot-reset-reviewed-55acf
  cancel-in-progress: false

env:
  REVIEWED_FIX_SHA: 55acf811e3484cabe5d15c7197b24f0a6633d4c3
  AUTH_WORKFLOW: production-p0-reviewer-reset-preflight-reviewed-55acf.yml
  COMMAND: /production p0-reviewer-reset-request reviewed-55acf811-exact-main
  CLAIM_MARKER: P0_REVIEWER_RESET_EXACT_SIGNATURE_CLAIM=55acf811
  RESET_SOURCE_BLOB: 7a586ded1b40ab3812335b351d0e8cc519020aa4
  PREFLIGHT_SOURCE_BLOB: 83d9c310c257844ac288fdfc2feb9e6fdddf900f

jobs:
  contract:
    name: Validate exact-signature one-shot reset contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-reviewer-reset-request reviewed-55acf811-exact-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      target_sha: ${{ steps.authorization.outputs.target_sha }}
      authorization_run_id: ${{ steps.authorization.outputs.authorization_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate immutable reset authorities
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/check-production-p0-reviewer-password-reset-request.mjs
          bash -n scripts/production-p0-reviewer-password-reset-request.sh
          bash -n scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh
          [[ "$(git hash-object scripts/production-p0-reviewer-password-reset-request.sh)" == "$RESET_SOURCE_BLOB" ]]
          [[ "$(git hash-object scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh)" == "$PREFLIGHT_SOURCE_BLOB" ]]
          grep -Fqx "COMMAND='/production p0-reviewer-reset-request current-main'" scripts/production-p0-reviewer-password-reset-request.sh
          grep -Fq "REVIEWED_RESET_SHA='a9c16814960520b20e8ae0c722570d9a3b4147f9'" scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh
          grep -Fq 'SET TRANSACTION READ ONLY' scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh
          grep -Fq 'PRODUCTION_MUTATION=NONE' scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh
          test -f ".github/workflows/$AUTH_WORKFLOW"
          grep -Fq "REVIEWED_FIX_SHA: $REVIEWED_FIX_SHA" ".github/workflows/$AUTH_WORKFLOW"
          grep -Fq '/production p0-reviewer-reset-preflight reviewed-55acf811-exact-main' ".github/workflows/$AUTH_WORKFLOW"

      - name: Verify exact owner-issued provenance
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EXPECTED_BODY: /production p0-reviewer-reset-request reviewed-55acf811-exact-main
          TRUSTED_CONNECTOR_APP_ID: '1144995'
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$EXPECTED_BODY" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

      - name: Resolve exact main and successful exact-signature preflight
        id: authorization
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          git cat-file -e "${REVIEWED_FIX_SHA}^{commit}"
          git merge-base --is-ancestor "$REVIEWED_FIX_SHA" "$target"
          [[ -z "$(git status --porcelain=v1)" ]]

          workflow_meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$AUTH_WORKFLOW" --jq '[.id,.path,.state] | @tsv')"
          IFS=$'\t' read -r workflow_id workflow_path workflow_state <<< "$workflow_meta"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          [[ "$workflow_path" == ".github/workflows/$AUTH_WORKFLOW" ]]
          [[ "$workflow_state" == 'active' ]]

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$AUTH_WORKFLOW/runs?event=issue_comment&branch=main&per_page=30")"
          authorization_run_id="$(jq -r --arg sha "$target" '[.workflow_runs[] | select(.conclusion == "success" and .event == "issue_comment" and .head_sha == $sha and .run_attempt == 1)] | sort_by(.id) | last | .id // empty' <<< "$runs")"
          [[ "$authorization_run_id" =~ ^[0-9]+$ ]]

          run_meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$authorization_run_id" --jq '[.conclusion,.event,.head_sha,(.workflow_id|tostring),(.run_attempt|tostring)] | join("|")')"
          [[ "$run_meta" == "success|issue_comment|$target|$workflow_id|1" ]]
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$authorization_run_id/jobs?per_page=100")"
          contract_count="$(jq '[.jobs[] | select(.name == "Validate exact-signature reset preflight contract" and .conclusion == "success")] | length' <<< "$jobs")"
          preflight_count="$(jq '[.jobs[] | select(.name == "Inspect exact-main runtime and authorize at most one reset" and .conclusion == "success")] | length' <<< "$jobs")"
          [[ "$contract_count" == '1' && "$preflight_count" == '1' ]]

          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          echo "authorization_run_id=$authorization_run_id" >> "$GITHUB_OUTPUT"

  request:
    name: Execute exactly one claimed reviewer password-reset request
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != '' &&
      needs.contract.outputs.authorization_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      AUTHORIZATION_RUN_ID: ${{ needs.contract.outputs.authorization_run_id }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact main and immutable authorities
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_RUN_ATTEMPT:-1}" == '1' ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          git merge-base --is-ancestor "$REVIEWED_FIX_SHA" "$TARGET_SHA"
          [[ -z "$(git status --porcelain=v1)" ]]
          [[ "$(git hash-object scripts/production-p0-reviewer-password-reset-request.sh)" == "$RESET_SOURCE_BLOB" ]]
          [[ "$(git hash-object scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh)" == "$PREFLIGHT_SOURCE_BLOB" ]]

      - name: Reject replay before any production request
        shell: bash
        run: |
          set -Eeuo pipefail
          counts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/3072/comments?per_page=100" --jq "[.[] | select(.body | contains(\"$CLAIM_MARKER\"))] | length")"
          claimed="$(awk '{s+=$1} END{print s+0}' <<< "$counts")"
          [[ "$claimed" == '0' ]]

      - name: Re-run exact-signature fail-closed preflight immediately before claim
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          source='scripts/production-p0-reviewer-reset-drift-tolerant-preflight.sh'
          temp="$RUNNER_TEMP/p0-reviewed-reset-preflight-55acf.sh"
          out="$RUNNER_TEMP/p0-reviewed-reset-preflight-55acf.out"
          [[ "$(git hash-object "$source")" == "$PREFLIGHT_SOURCE_BLOB" ]]
          cp -- "$source" "$temp"
          chmod 0700 "$temp"
          python3 - "$temp" "$REVIEWED_FIX_SHA" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          reviewed_sha = sys.argv[2]
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("REVIEWED_RESET_SHA='a9c16814960520b20e8ae0c722570d9a3b4147f9'", f"REVIEWED_RESET_SHA='{reviewed_sha}'"),
              ("failure_reason='RESET_CRITICAL_MANIFEST_INVALID'\n(( ${#RESET_CRITICAL_PATHS[@]} == 21 ))", "failure_reason='DEPLOYED_MAIN_PARITY_REQUIRED'\n[[ \"$RUNTIME_DEPLOYED_SHA\" == \"$TARGET_SHA\" ]]\n\nfailure_reason='RESET_CRITICAL_MANIFEST_INVALID'\n(( ${#RESET_CRITICAL_PATHS[@]} == 21 ))"),
          ]
          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_CARDINALITY_FAILED:R{index}:{count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          bash -n "$temp"
          set +e
          bash "$temp" >"$out" 2>&1
          rc=$?
          set -e
          cat "$out"
          (( rc == 0 ))
          grep -Fxq 'RESET_AUTHORIZED=YES' "$out"
          grep -Fxq 'PRODUCTION_MUTATION=NONE' "$out"
          runtime="$(grep -E '^RUNTIME_DEPLOYED_SHA=[0-9a-f]{40}$' "$out" | tail -n1 | cut -d= -f2-)"
          [[ "$runtime" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          echo "runtime_sha=$runtime" >> "$GITHUB_OUTPUT"
          rm -f -- "$temp" "$out"

      - name: Claim the single reset authorization irreversibly
        shell: bash
        run: |
          set -Eeuo pipefail
          counts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/3072/comments?per_page=100" --jq "[.[] | select(.body | contains(\"$CLAIM_MARKER\"))] | length")"
          claimed="$(awk '{s+=$1} END{print s+0}' <<< "$counts")"
          [[ "$claimed" == '0' ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          gh issue comment 3072 --repo "$GITHUB_REPOSITORY" --body "## Production P0 reviewer exact-signature one-shot reset claimed

          - marker: \`$CLAIM_MARKER\`
          - authorization run: \`$AUTHORIZATION_RUN_ID\`
          - exact main/runtime: \`$TARGET_SHA\`
          - production reset mutation at claim: \`NONE\`
          - replay: \`FORBIDDEN\`
          - next: \`EXECUTE_REVIEWED_NORMAL_PASSWORD_RESET_REQUEST_EXACTLY_ONCE\`" >/dev/null

      - name: Execute reviewed reset source exactly once
        shell: bash
        env:
          RUNTIME_DEPLOYED_SHA: ${{ steps.preflight.outputs.runtime_sha }}
        run: |
          set -Eeuo pipefail
          source_script='scripts/production-p0-reviewer-password-reset-request.sh'
          temp_script="$RUNNER_TEMP/p0-reviewer-reset-authorized.sh"
          cp -- "$source_script" "$temp_script"
          chmod 0700 "$temp_script"
          python3 - "$temp_script" "$COMMAND" "$RUNTIME_DEPLOYED_SHA" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          command = sys.argv[2]
          expected = sys.argv[3]
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("COMMAND='/production p0-reviewer-reset-request current-main'", f"COMMAND='{command}'"),
              ('[[ "$api_revision" == "$target_sha" && "$web_revision" == "$target_sha" && "$worker_revision" == "$target_sha" ]]', f'''[[ "$api_revision" == '{expected}' && "$web_revision" == '{expected}' && "$worker_revision" == '{expected}' ]]'''),
              ('[[ "$api_revision" == "$TARGET_SHA" && "$web_revision" == "$TARGET_SHA" && "$worker_revision" == "$TARGET_SHA" ]]', f'''[[ "$api_revision" == '{expected}' && "$web_revision" == '{expected}' && "$worker_revision" == '{expected}' ]]'''),
          ]
          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_CARDINALITY_FAILED:R{index}:{count}')
              text = text.replace(old, new, 1)
          if text.count(expected) != 6:
              raise SystemExit(f'EXPECTED_REVISION_BINDING_COUNT:{text.count(expected)}')
          if text.count(f"COMMAND='{command}'") != 1:
              raise SystemExit('COMMAND_BINDING_INVALID')
          path.write_text(text, encoding='utf-8')
          PY
          bash -n "$temp_script"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          bash "$temp_script"
          rm -f -- "$temp_script"

      - name: Publish consumed authorization evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment 3072 --repo "$GITHUB_REPOSITORY" --body "## Production P0 reviewer exact-signature reset authorization consumed

          - marker: \`$CLAIM_MARKER\`
          - authorization run: \`$AUTHORIZATION_RUN_ID\`
          - exact main/runtime: \`$TARGET_SHA\`
          - source reset flow: \`PASS\`
          - production mutation: \`NORMAL_PASSWORD_RESET_REQUEST_ONLY\`
          - replay: \`FORBIDDEN\`" >/dev/null
          printf 'P0_REVIEWER_ONE_SHOT_RESET=PASS\n'
          printf 'AUTHORIZATION_RUN_ID=%s\n' "$AUTHORIZATION_RUN_ID"
          printf 'RUNTIME_DEPLOYED_SHA=%s\n' '${{ steps.preflight.outputs.runtime_sha }}'
