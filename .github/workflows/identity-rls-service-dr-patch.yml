name: Identity RLS service and DR finalization

on:
  push:
    branches: [identity-rls-3670]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: identity-rls-3670
          fetch-depth: 0
      - name: Apply idempotent final wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('apps/api/src/modules/staff-access/staff-access.service.ts')
          text = service.read_text()
          text = text.replace(
              '    const target = await this.validateTargetScope(input);',
              '    const target = await this.validateTargetScope(user, assignment.id, input);',
          )
          if 'private async validateTargetScope(\n    user: RequestUser,' not in text:
              pattern = r"  private async validateTargetScope\(input: RequestStaffAccessInput\) \{.*?\n  \}\n\n  private canAutoApprove"
              replacement = """  private async validateTargetScope(
    user: RequestUser,
    assignmentId: string,
    input: RequestStaffAccessInput,
  ) {
    const customerMode = input.accessMode !== StaffAccessMode.CONTROL_PLANE;
    if (customerMode && !input.targetOrganizationId && !input.targetTenantId && !input.targetDealId) {
      throw new BadRequestException('Customer-context access must be scoped to a tenant, organization or deal');
    }
    if (input.targetUserId && !input.targetOrganizationId) {
      throw new BadRequestException('Target user requires target organization');
    }

    const target = await this.repository.resolveTargetScope(this.repository.prisma, {
      actorUserId: user.id,
      assignmentId,
      targetTenantId: input.targetTenantId ?? null,
      targetOrganizationId: input.targetOrganizationId ?? null,
      targetUserId: input.targetUserId ?? null,
    });
    if (!target) {
      throw new ForbiddenException('Target staff access scope could not be verified');
    }
    return {
      tenantId: target.tenant_id,
      organizationId: target.organization_id,
      userId: target.user_id,
    };
  }

  private canAutoApprove"""
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('staff-access.service.ts: validateTargetScope replacement failed')
          service.write_text(text)

          one_deal = Path('scripts/platform-v7-one-deal-e2e.sh')
          text = one_deal.read_text()
          grant = 'GRANT EXECUTE ON FUNCTION auth.resolve_staff_target_scope(TEXT, TEXT, TEXT, TEXT, TEXT) TO one_deal_auth;'
          if grant not in text:
              anchor = 'GRANT EXECUTE ON FUNCTION auth.resolve_session_identity(TEXT, TEXT, TEXT, TEXT) TO one_deal_auth;'
              if anchor not in text:
                  raise SystemExit('one-deal grant anchor missing')
              text = text.replace(anchor, anchor + '\n' + grant, 1)
          one_deal.write_text(text)

          dr = Path('scripts/platform-v7-database-dr-rehearsal.sh')
          text = dr.read_text()
          if "'auth.resolve_staff_target_scope(text,text,text,text,text)'" not in text:
              text = text.replace(
                  "    'auth.resolve_session_identity(text,text,text,text)',\n    'auth.validate_deal_creation_actors(text,text,text,text,text)',",
                  "    'auth.resolve_session_identity(text,text,text,text)',\n    'auth.resolve_staff_target_scope(text,text,text,text,text)',\n    'auth.validate_deal_creation_actors(text,text,text,text,text)',",
                  1,
              )
          grant_dr = '    GRANT EXECUTE ON FUNCTION auth.resolve_staff_target_scope(text,text,text,text,text) TO one_deal_auth;'
          if grant_dr not in text:
              anchor = '    GRANT EXECUTE ON FUNCTION auth.resolve_session_identity(text,text,text,text) TO one_deal_auth;'
              text = text.replace(anchor, anchor + '\n' + grant_dr, 1)
          text = text.replace(
              "         'resolve_session_identity', 'validate_deal_creation_actors')",
              "         'resolve_session_identity', 'resolve_staff_target_scope',\n         'validate_deal_creation_actors')",
              1,
          )
          text = text.replace(
              "   WHERE (\n       n.nspname = 'auth'",
              "   WHERE ((\n       n.nspname = 'auth'",
              1,
          )
          text = text.replace(
              "       AND p.proname = 'app_logistics_assignment_projection'\n     )\n     AND owner.rolname = 'pc_identity_bootstrap')::text",
              "       AND p.proname = 'app_logistics_assignment_projection'\n     ))\n     AND owner.rolname = 'pc_identity_bootstrap')::text",
              1,
          )
          text = text.replace('"3:9:0:1:1:0:1:0"', '"3:10:0:1:1:0:1:0"', 1)
          dr.write_text(text)

          for path in [
              '.github/workflows/identity-rls-service-dr-patch.yml',
              '.github/workflows/identity-rls-final-source-patch.yml',
              '.github/workflows/identity-rls-source-fix-dispatch.yml',
              '.github/identity-rls-source-fix.trigger',
              'scripts/apply-identity-rls-source-fix.py',
          ]:
              Path(path).unlink(missing_ok=True)
          PY
          git diff --check
          grep -q 'validateTargetScope(user, assignment.id, input)' apps/api/src/modules/staff-access/staff-access.service.ts
          grep -q 'resolveTargetScope(this.repository.prisma' apps/api/src/modules/staff-access/staff-access.service.ts
          grep -q 'resolve_staff_target_scope' scripts/platform-v7-database-dr-rehearsal.sh
      - name: Commit final wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(identity-rls): wire bounded staff scope and DR"
          git push origin HEAD:identity-rls-3670
