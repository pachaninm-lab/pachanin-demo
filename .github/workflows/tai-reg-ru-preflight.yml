name: TAI REG.RU Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - "scripts/tai-reg-ru-preflight.sh"
      - "scripts/check-tai-reg-ru-preflight.mjs"
      - "scripts/check-tai-reg-ru-local-runner.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "apps/tai/TAI_REG_RU_PREFLIGHT.md"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-local-runner-authority-20260731.json"
  workflow_run:
    workflows: ["Build & Publish Canonical Docker Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter PREFLIGHT-TAI-REG-RU
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tai-reg-ru-preflight-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Read-only preflight contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Bash syntax
        run: |
          bash -n scripts/tai-reg-ru-preflight.sh
          bash -n scripts/install-pc-prod-actions-runner.sh
      - name: Enforce preflight authority
        run: |
          node scripts/check-tai-reg-ru-preflight.mjs
          node scripts/check-tai-reg-ru-local-runner.mjs

  image-authority:
    name: Verify exact-main canonical TAI image
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'PREFLIGHT-TAI-REG-RU'
      )
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      reference: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
    steps:
      - name: Resolve exact target metadata
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify canonical exact-SHA TAI image outside production
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/pachaninm-lab/grainflow-tai:sha-${SHORT_SHA}"
          ready=0
          for attempt in $(seq 1 90); do
            if docker pull "$image" >/dev/null 2>&1; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
              user="$(docker image inspect --format '{{.Config.User}}' "$image")"
              digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
              if [[ "$revision" == "$TARGET_SHA" && "$user" == '65532:65532' && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]; then ready=1; break; fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo 'Exact TAI image is unavailable or invalid.' >&2; exit 2; }
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  live-preflight:
    name: Exact-main REG.RU local inventory only
    if: needs.image-authority.result == 'success'
    needs: [contract, image-authority]
    runs-on: [self-hosted, linux, x64, pc-prod, tai-release]
    permissions:
      contents: read
      packages: none
      statuses: none
    timeout-minutes: 35
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Resolve exact target
        id: target
        env:
          TARGET_SHA: ${{ needs.image-authority.outputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]]
          git checkout --detach "$TARGET_SHA"
          [[ "$TARGET_SHA" == "$(git rev-parse HEAD)" ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify local release runner authority
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 ]]
          [[ "${RUNNER_NAME:-}" == pc-prod-* ]]
          [[ "$(id -u)" -eq 0 ]]
          [[ -S /var/run/docker.sock ]]
          docker version >/dev/null
          docker compose version >/dev/null
          python3 - <<'PY'
          import json
          marker=json.load(open('/etc/pc-release-authority/actions-runner.json', encoding='utf-8'))
          assert marker['transport']=='OUTBOUND_ONLY_HTTPS'
          assert marker['executionUser']=='root'
          assert marker['productionInboundSshRequired'] is False
          PY
      - name: Initialize fail-closed evidence
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/tai-reg-ru-preflight.json" "$TARGET_SHA" <<'PY'
          import json, sys
          json.dump({'schemaVersion':'tai.reg-ru.preflight.v1','targetSha':sys.argv[2],'mode':'READ_ONLY_PREFLIGHT','productionMutationAllowed':False,'checks':[{'code':'PREFLIGHT_NOT_EXECUTED','status':'BLOCKED'}],'blockers':['PREFLIGHT_NOT_EXECUTED'],'passed':False},open(sys.argv[1],'w',encoding='utf-8'),separators=(',',':'))
          PY
          chmod 0600 "$RUNNER_TEMP/tai-reg-ru-preflight.json"
      - name: Execute local read-only production preflight
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TAI_IMAGE: ${{ needs.image-authority.outputs.reference }}
          TAI_DIGEST: ${{ needs.image-authority.outputs.digest }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight.json"
          candidate="$RUNNER_TEMP/tai-reg-ru-preflight.candidate.json"
          if ! bash scripts/tai-reg-ru-preflight.sh "$TARGET_SHA" "$TAI_IMAGE" "$TAI_DIGEST" > "$candidate"; then
            python3 - "$report" "$TARGET_SHA" <<'PY'
          import json, sys
          json.dump({'schemaVersion':'tai.reg-ru.preflight.v1','targetSha':sys.argv[2],'mode':'READ_ONLY_PREFLIGHT','productionMutationAllowed':False,'checks':[{'code':'PREFLIGHT_EXECUTION_FAILED','status':'BLOCKED'}],'blockers':['PREFLIGHT_EXECUTION_FAILED'],'passed':False},open(sys.argv[1],'w',encoding='utf-8'),separators=(',',':'))
          PY
            chmod 0600 "$report"
            exit 20
          fi
          mv "$candidate" "$report"
          chmod 0600 "$report"
          python3 - "$report" "$TARGET_SHA" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          assert report.get('schemaVersion')=='tai.reg-ru.preflight.v1'
          assert report.get('targetSha')==sys.argv[2]
          assert report.get('productionMutationAllowed') is False
          PY
      - name: Upload redacted preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-reg-ru-preflight-${{ steps.target.outputs.short }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-reg-ru-preflight.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce manual preflight result
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python3 - "$RUNNER_TEMP/tai-reg-ru-preflight.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          if report.get('blockers') or report.get('passed') is not True: raise SystemExit('REG.RU preflight is blocked')
          PY
      - name: Remove transient runner material
        if: always()
        run: rm -f "$RUNNER_TEMP/tai-reg-ru-preflight.json" "$RUNNER_TEMP/tai-reg-ru-preflight.candidate.json"

  publish-status:
    name: Publish REG.RU preflight status
    if: always() && needs.live-preflight.outputs.target_sha != ''
    needs: live-preflight
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tai-reg-ru-preflight-${{ needs.live-preflight.outputs.target_short }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-reg-ru-preflight
      - name: Publish exact-main preflight commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.live-preflight.outputs.target_sha }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight/tai-reg-ru-preflight.json"
          read -r state description < <(python3 - "$report" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); b=r.get('blockers') or []
          print('success TAI REG.RU preflight PASS' if r.get('passed') is True and not b else f'failure BLOCKED: {len(b)} prerequisite(s)')
          PY
          )
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -f state="$state" -f context='TAI REG.RU Preflight' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
