name: TAI REG.RU Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - "scripts/pc-tai-release-controller.sh"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "scripts/resume-pc-prod-actions-runner.sh"
      - "scripts/check-resume-pc-prod-actions-runner.mjs"
      - "scripts/check-pc-tai-release-controller.mjs"
      - "scripts/check-tai-reg-ru-preflight.mjs"
      - "apps/tai/TAI_REG_RU_PREFLIGHT.md"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-least-privilege-controller-20260731.json"
      - "docs/platform-v7/autopilot/scopes/tai-runner-resume-authority-20260731.json"
  workflow_run:
    workflows: ["Build & Publish Canonical Docker Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter PREFLIGHT-TAI-REG-RU
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tai-reg-ru-preflight-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Least-privilege preflight contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate controller and preflight authority
        run: |
          bash -n scripts/pc-tai-release-controller.sh
          bash -n scripts/install-pc-prod-actions-runner.sh
          bash -n scripts/resume-pc-prod-actions-runner.sh
          node scripts/check-resume-pc-prod-actions-runner.mjs
          node scripts/check-pc-tai-release-controller.mjs
          node scripts/check-tai-reg-ru-preflight.mjs

  image_authority:
    name: Exact-main canonical TAI image authority
    needs: contract
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'PREFLIGHT-TAI-REG-RU'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      statuses: write
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
      reference: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact current main
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify canonical exact-SHA TAI image outside production
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/pachaninm-lab/grainflow-tai:sha-${SHORT_SHA}"
          ready=0
          for attempt in $(seq 1 90); do
            if docker pull "$image" >/dev/null 2>&1; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
              user="$(docker image inspect --format '{{.Config.User}}' "$image")"
              digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
              if [[ "$revision" == "$TARGET_SHA" && "$user" == '65532:65532' && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]; then ready=1; break; fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo 'Exact TAI image is unavailable or invalid.' >&2; exit 2; }
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Publish local-runner pending status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state='pending' -f context='TAI REG.RU Preflight' -f description='Awaiting least-privilege REG.RU controller' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Remove hosted registry session
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  live_preflight:
    name: Exact-main REG.RU controller inventory
    needs: image_authority
    if: needs.image_authority.result == 'success'
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    permissions:
      contents: read
      packages: none
      statuses: none
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
      TARGET_SHORT: ${{ needs.image_authority.outputs.target_short }}
      TAI_IMAGE: ${{ needs.image_authority.outputs.reference }}
      TAI_DIGEST: ${{ needs.image_authority.outputs.digest }}
    steps:
      - name: Verify non-root runner and restricted controller authority
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == pc-prod-* ]]
          [[ "$(id -u)" -ne 0 ]]
          ! id -nG | tr ' ' '\n' | grep -Fxq docker
          if docker version >/dev/null 2>&1; then exit 21; fi
          python3 - <<'PY'
          import hashlib,json,os
          marker=json.load(open('/etc/pc-release-authority/actions-runner.json',encoding='utf-8'))
          assert marker['schemaVersion']=='pc.actions-runner-authority.v3'
          assert marker['transport']=='OUTBOUND_ONLY_HTTPS'
          assert marker['executionUser']=='pcactions'
          assert marker['dockerSocketAccess'] is False
          assert marker['productionInboundSshRequired'] is False
          controller=marker['sudoController']
          assert controller=='/usr/local/sbin/pc-tai-release-controller'
          assert hashlib.sha256(open(controller,'rb').read()).hexdigest()==marker['sudoControllerSha256']
          assert os.stat(controller).st_uid==0 and os.stat(controller).st_mode & 0o022 == 0
          PY
          sudo -n -l | grep -Fq '/usr/local/sbin/pc-tai-release-controller'
      - name: Execute protected read-only preflight
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/pc-tai-release-controller preflight "$TARGET_SHA" "$GITHUB_RUN_ID" "$TAI_IMAGE" "$TAI_DIGEST"
      - name: Upload redacted preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-reg-ru-preflight-${{ env.TARGET_SHORT }}-${{ github.run_id }}
          path: /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/preflight.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce manual preflight result
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python3 - "/var/lib/pc-release-authority/runner-output/${GITHUB_RUN_ID}/preflight.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if r.get('passed') is not True or r.get('blockers'): raise SystemExit(f'blocked: {r.get("blockers")}')
          PY

  publish_status:
    name: Publish REG.RU preflight status
    if: always() && needs.image_authority.outputs.target_sha != ''
    needs: [image_authority, live_preflight]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.live_preflight.result == 'success'
        with:
          name: tai-reg-ru-preflight-${{ needs.image_authority.outputs.target_short }}-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight
      - name: Publish exact-main preflight commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
          LIVE_RESULT: ${{ needs.live_preflight.result }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/preflight/preflight.json"
          state=error; description='REG.RU controller execution failed before evidence'
          if [[ "$LIVE_RESULT" == success && -s "$report" ]]; then
            read -r state description < <(python3 - "$report" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); b=r.get('blockers') or []
          print('success TAI REG.RU preflight PASS' if r.get('passed') is True and not b else f'failure BLOCKED: {len(b)} prerequisite(s)')
          PY
            )
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" -f context='TAI REG.RU Preflight' -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
