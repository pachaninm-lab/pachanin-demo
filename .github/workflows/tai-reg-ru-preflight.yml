name: TAI REG.RU Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - "scripts/tai-reg-ru-preflight.sh"
      - "scripts/check-tai-reg-ru-preflight.mjs"
      - "apps/tai/TAI_REG_RU_PREFLIGHT.md"
      - "docs/platform-v7/autopilot/scopes/tai-agro-os-v4-stage1-reg-ru-preflight-20260731.json"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter PREFLIGHT-TAI-REG-RU
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: tai-reg-ru-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Read-only preflight contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Bash syntax
        run: bash -n scripts/tai-reg-ru-preflight.sh
      - name: Enforce no-mutation preflight authority
        run: node scripts/check-tai-reg-ru-preflight.mjs

  live-preflight:
    name: Exact-main REG.RU inventory only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirmation == 'PREFLIGHT-TAI-REG-RU'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEFAULT_PROD_HOST: 195.19.12.120
      PROD_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      PROD_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      PROD_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      PROD_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      PROD_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      PROD_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      PROD_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact target
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target='${{ inputs.target_sha }}'
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse origin/main)" ]]
          git checkout --detach "$target"
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "short=${target:0:7}" >> "$GITHUB_OUTPUT"

      - name: Verify canonical exact-SHA TAI image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/pachaninm-lab/grainflow-tai:sha-${SHORT_SHA}"
          ready=0
          for attempt in $(seq 1 90); do
            if docker pull "$image" >/dev/null 2>&1; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
              user="$(docker image inspect --format '{{.Config.User}}' "$image")"
              digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
              if [[ "$revision" == "$TARGET_SHA" && "$user" == '65532:65532' && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo 'Exact TAI image is unavailable or invalid.' >&2; exit 2; }
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned production SSH transport
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }
          host="$(trim "${PROD_HOST_SECRET:-$DEFAULT_PROD_HOST}")"
          user="$(trim "${PROD_USER_SECRET:-root}")"
          port="$(trim "${PROD_PORT_SECRET:-22}")"
          [[ "$host" == "$DEFAULT_PROD_HOST" ]]
          [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && ((port >= 1 && port <= 65535))
          [[ "$PROD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          key="${PROD_KEY_PRIMARY:-${PROD_KEY_SECONDARY:-${PROD_KEY_FALLBACK:-}}}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          write_key "$key" "$HOME/.ssh/id_pc_prod" || { echo 'Protected production private key is unavailable.' >&2; exit 10; }
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          while IFS= read -r line; do
            fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fp" != "$PROD_HOST_FINGERPRINT" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/prod_known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/prod_known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Execute read-only production preflight
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TAI_IMAGE: ${{ steps.image.outputs.reference }}
          TAI_DIGEST: ${{ steps.image.outputs.digest }}
          PROD_HOST: ${{ steps.ssh.outputs.host }}
          PROD_USER: ${{ steps.ssh.outputs.user }}
          PROD_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight.json"
          ssh -i "$HOME/.ssh/id_pc_prod" \
            -p "$PROD_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/prod_known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "bash -s -- '$TARGET_SHA' '$TAI_IMAGE' '$TAI_DIGEST'" \
            < scripts/tai-reg-ru-preflight.sh > "$report"
          chmod 0600 "$report"
          python3 - "$report" "$TARGET_SHA" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          if report.get('schemaVersion') != 'tai.reg-ru.preflight.v1':
              raise SystemExit('invalid preflight schema')
          if report.get('targetSha') != sys.argv[2]:
              raise SystemExit('preflight target mismatch')
          for item in report.get('checks', []):
              print(f"{item.get('status')} {item.get('code')}")
          PY

      - name: Upload redacted preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-reg-ru-preflight-${{ steps.target.outputs.short }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-reg-ru-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce preflight result
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/tai-reg-ru-preflight.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          blockers = report.get('blockers') or []
          with open('/tmp/tai-summary.md', 'w', encoding='utf-8') as out:
              out.write('## TAI REG.RU preflight\n\n')
              out.write(f"- Status: {'PASS' if report.get('passed') else 'BLOCKED'}\n")
              out.write(f"- Blockers: {len(blockers)}\n")
              for code in blockers:
                  out.write(f"  - `{code}`\n")
          if blockers or report.get('passed') is not True:
              raise SystemExit('REG.RU preflight is blocked; inspect redacted evidence artifact')
          PY
          cat /tmp/tai-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transient SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/prod_known_hosts"
