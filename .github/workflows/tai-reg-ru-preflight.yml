name: TAI REG.RU Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - "scripts/tai-reg-ru-preflight.sh"
      - "scripts/check-tai-reg-ru-preflight.mjs"
      - "scripts/prepare-reg-ru-bastion-ssh.sh"
      - "scripts/check-reg-ru-bastion-transport.mjs"
      - "apps/tai/TAI_REG_RU_PREFLIGHT.md"
      - "docs/platform-v7/autopilot/scopes/tai-agro-os-v4-stage1-reg-ru-preflight-20260731.json"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-bastion-transport-20260731.json"
  workflow_run:
    workflows: ["Build & Publish Canonical Docker Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter PREFLIGHT-TAI-REG-RU
        required: true
        type: string

permissions:
  contents: read
  packages: read
  statuses: write

concurrency:
  group: tai-reg-ru-preflight-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Read-only preflight contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Bash syntax
        run: |
          bash -n scripts/tai-reg-ru-preflight.sh
          bash -n scripts/prepare-reg-ru-bastion-ssh.sh
      - name: Enforce no-mutation preflight authority
        run: node scripts/check-tai-reg-ru-preflight.mjs
      - name: Enforce ephemeral bastion transport
        run: node scripts/check-reg-ru-bastion-transport.mjs

  live-preflight:
    name: Exact-main REG.RU inventory only
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'PREFLIGHT-TAI-REG-RU'
      )
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DEFAULT_PROD_HOST: 195.19.12.120
      MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
      MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
      MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
      MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
      PROD_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      PROD_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      PROD_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      PROD_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      PROD_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      PROD_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      PROD_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact target
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            target='${{ github.event.workflow_run.head_sha }}'
            [[ '${{ github.event.workflow_run.conclusion }}' == success ]]
            [[ '${{ github.event.workflow_run.head_branch }}' == main ]]
            [[ '${{ github.event.workflow_run.event }}' == push ]]
          else
            target='${{ inputs.target_sha }}'
          fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse origin/main)" ]]
          git checkout --detach "$target"
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "short=${target:0:7}" >> "$GITHUB_OUTPUT"

      - name: Verify canonical exact-SHA TAI image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/pachaninm-lab/grainflow-tai:sha-${SHORT_SHA}"
          ready=0
          for attempt in $(seq 1 90); do
            if docker pull "$image" >/dev/null 2>&1; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
              user="$(docker image inspect --format '{{.Config.User}}' "$image")"
              digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
              if [[ "$revision" == "$TARGET_SHA" && "$user" == '65532:65532' && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo 'Exact TAI image is unavailable or invalid.' >&2; exit 2; }
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned production SSH through existing model-host bastion
        id: ssh
        shell: bash
        run: bash scripts/prepare-reg-ru-bastion-ssh.sh prepare

      - name: Execute read-only production preflight
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TAI_IMAGE: ${{ steps.image.outputs.reference }}
          TAI_DIGEST: ${{ steps.image.outputs.digest }}
          PROD_HOST: ${{ steps.ssh.outputs.prod_host }}
          PROD_USER: ${{ steps.ssh.outputs.prod_user }}
          PROD_PORT: ${{ steps.ssh.outputs.prod_port }}
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight.json"
          ssh -i "$HOME/.ssh/id_pc_prod" \
            -p "$PROD_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/prod_known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "bash -s -- '$TARGET_SHA' '$TAI_IMAGE' '$TAI_DIGEST'" \
            < scripts/tai-reg-ru-preflight.sh > "$report"
          chmod 0600 "$report"
          python3 - "$report" "$TARGET_SHA" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          if report.get('schemaVersion') != 'tai.reg-ru.preflight.v1':
              raise SystemExit('invalid preflight schema')
          if report.get('targetSha') != sys.argv[2]:
              raise SystemExit('preflight target mismatch')
          for item in report.get('checks', []):
              print(f"{item.get('status')} {item.get('code')}")
          PY

      - name: Upload redacted preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-reg-ru-preflight-${{ steps.target.outputs.short }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-reg-ru-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact-main preflight commit status
        if: always() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight.json"
          state=error
          description='Preflight execution failed before evidence'
          if [[ -s "$report" ]]; then
            read -r state description < <(python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          blockers = report.get('blockers') or []
          if report.get('passed') is True and not blockers:
              print('success TAI REG.RU preflight PASS')
          else:
              print(f"failure BLOCKED: {len(blockers)} prerequisite(s)")
          PY
            )
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='TAI REG.RU Preflight' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce manual preflight result
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/tai-reg-ru-preflight.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          blockers = report.get('blockers') or []
          if blockers or report.get('passed') is not True:
              raise SystemExit('REG.RU preflight is blocked; inspect redacted evidence artifact')
          PY

      - name: Write preflight summary
        if: always() && steps.target.outputs.sha != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight.json"
          [[ -s "$report" ]] || exit 0
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          blockers = report.get('blockers') or []
          print('## TAI REG.RU preflight')
          print()
          print('- Transport: ephemeral ProxyJump through existing REG.RU model host')
          print(f"- Status: {'PASS' if report.get('passed') else 'BLOCKED'}")
          print(f"- Blockers: {len(blockers)}")
          for code in blockers:
              print(f"  - `{code}`")
          PY

      - name: Remove transient SSH material
        if: always()
        run: bash scripts/prepare-reg-ru-bastion-ssh.sh cleanup
