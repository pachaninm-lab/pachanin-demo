name: TAI REG.RU Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - "scripts/tai-reg-ru-preflight.sh"
      - "scripts/check-tai-reg-ru-preflight.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "apps/tai/TAI_REG_RU_PREFLIGHT.md"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-local-runner-authority-v2-20260731.json"
  workflow_run:
    workflows: ["Build & Publish Canonical Docker Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter PREFLIGHT-TAI-REG-RU
        required: true
        type: string

permissions:
  contents: read
  packages: read
  statuses: write

concurrency:
  group: tai-reg-ru-preflight-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Read-only preflight contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Bash syntax
        run: |
          bash -n scripts/tai-reg-ru-preflight.sh
          bash -n scripts/install-pc-prod-actions-runner.sh
      - name: Enforce no-mutation preflight authority
        run: node scripts/check-tai-reg-ru-preflight.mjs

  image_authority:
    name: Exact-main canonical TAI image authority
    needs: contract
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'PREFLIGHT-TAI-REG-RU'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      short_sha: ${{ steps.target.outputs.short }}
      reference: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact target
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            target='${{ github.event.workflow_run.head_sha }}'
            [[ '${{ github.event.workflow_run.conclusion }}' == success ]]
            [[ '${{ github.event.workflow_run.head_branch }}' == main ]]
            [[ '${{ github.event.workflow_run.event }}' == push ]]
          else
            target='${{ inputs.target_sha }}'
          fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse origin/main)" ]]
          git checkout --detach "$target"
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "short=${target:0:7}" >> "$GITHUB_OUTPUT"

      - name: Verify canonical exact-SHA TAI image outside production
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/pachaninm-lab/grainflow-tai:sha-${SHORT_SHA}"
          ready=0
          for attempt in $(seq 1 90); do
            if docker pull "$image" >/dev/null 2>&1; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
              user="$(docker image inspect --format '{{.Config.User}}' "$image")"
              digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
              if [[ "$revision" == "$TARGET_SHA" && "$user" == '65532:65532' && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo 'Exact TAI image is unavailable or invalid.' >&2; exit 2; }
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish local-runner pending status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state='pending' \
            -f context='TAI REG.RU Preflight' \
            -f description='Awaiting outbound-only REG.RU runner' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Remove hosted registry session
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1

  live_preflight:
    name: Exact-main local REG.RU inventory only
    needs: [contract, image_authority]
    if: needs.image_authority.result == 'success'
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    timeout-minutes: 35
    permissions:
      contents: read
      packages: none
      statuses: none
    env:
      TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
      TAI_IMAGE: ${{ needs.image_authority.outputs.reference }}
      TAI_DIGEST: ${{ needs.image_authority.outputs.digest }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact target and current main
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]]

      - name: Verify local production runner authority
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == pc-prod-* ]]
          [[ "$(id -u)" -ne 0 ]]
          id -nG | tr ' ' '\n' | grep -Fxq docker
          [[ -S /var/run/docker.sock ]]
          docker version >/dev/null
          docker compose version >/dev/null
          python3 - /etc/pc-release-authority/actions-runner.json <<'PY'
          import json, os, sys
          path = sys.argv[1]
          st = os.stat(path)
          if st.st_mode & 0o022:
              raise SystemExit('runner authority file is writable outside owner')
          payload = json.load(open(path, encoding='utf-8'))
          if payload.get('schemaVersion') != 'pc.actions-runner-authority.v1':
              raise SystemExit('runner authority schema mismatch')
          if payload.get('repository') != 'https://github.com/pachaninm-lab/pachanin-demo':
              raise SystemExit('runner repository mismatch')
          if payload.get('transport') != 'OUTBOUND_ONLY':
              raise SystemExit('runner transport mismatch')
          labels = set(payload.get('labels') or [])
          required = {'self-hosted', 'linux', 'x64', 'pc-prod', 'tai-readonly'}
          if not required.issubset(labels):
              raise SystemExit('runner labels mismatch')
          PY

      - name: Initialize fail-closed evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight.json"
          python3 - "$report" "$TARGET_SHA" <<'PY'
          import json, os, sys
          path, target = sys.argv[1:]
          payload = {
              'schemaVersion': 'tai.reg-ru.preflight.v1',
              'targetSha': target,
              'mode': 'READ_ONLY_PREFLIGHT',
              'productionMutationAllowed': False,
              'checks': [],
              'blockers': ['PREFLIGHT_NOT_EXECUTED'],
              'passed': False,
          }
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=True, separators=(',', ':'))
              handle.write('\n')
          os.chmod(path, 0o600)
          PY

      - name: Execute local read-only production preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight.json"
          raw="$RUNNER_TEMP/tai-reg-ru-preflight.raw"
          set +e
          bash scripts/tai-reg-ru-preflight.sh "$TARGET_SHA" "$TAI_IMAGE" "$TAI_DIGEST" > "$raw"
          rc=$?
          set -e
          if (( rc == 0 )); then
            mv "$raw" "$report"
          else
            rm -f "$raw"
            python3 - "$report" "$TARGET_SHA" <<'PY'
          import json, os, sys
          path, target = sys.argv[1:]
          payload = {
              'schemaVersion': 'tai.reg-ru.preflight.v1',
              'targetSha': target,
              'mode': 'READ_ONLY_PREFLIGHT',
              'productionMutationAllowed': False,
              'checks': [],
              'blockers': ['PREFLIGHT_EXECUTION_FAILED'],
              'passed': False,
          }
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=True, separators=(',', ':'))
              handle.write('\n')
          os.chmod(path, 0o600)
          PY
          fi
          chmod 0600 "$report"
          python3 - "$report" "$TARGET_SHA" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          if report.get('schemaVersion') != 'tai.reg-ru.preflight.v1':
              raise SystemExit('invalid preflight schema')
          if report.get('targetSha') != sys.argv[2]:
              raise SystemExit('preflight target mismatch')
          if report.get('productionMutationAllowed') is not False:
              raise SystemExit('preflight mutation boundary mismatch')
          for item in report.get('checks', []):
              print(f"{item.get('status')} {item.get('code')}")
          PY

      - name: Upload redacted preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-reg-ru-preflight-${{ needs.image_authority.outputs.short_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-reg-ru-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient runner material
        if: always()
        run: rm -f "$RUNNER_TEMP/tai-reg-ru-preflight.json" "$RUNNER_TEMP/tai-reg-ru-preflight.raw"

  publish_status:
    name: Publish exact-main preflight result
    needs: [image_authority, live_preflight]
    if: always() && needs.image_authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Download redacted preflight evidence
        uses: actions/download-artifact@v4
        with:
          pattern: tai-reg-ru-preflight-${{ needs.image_authority.outputs.short_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-reg-ru-preflight-evidence
          merge-multiple: true

      - name: Publish exact-main preflight commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight-evidence/tai-reg-ru-preflight.json"
          state=error
          description='REG.RU runner evidence unavailable'
          if [[ -s "$report" ]]; then
            read -r state description < <(python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          blockers = report.get('blockers') or []
          if report.get('passed') is True and not blockers:
              print('success TAI REG.RU preflight PASS')
          else:
              print(f"failure BLOCKED: {len(blockers)} prerequisite(s)")
          PY
            )
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='TAI REG.RU Preflight' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce manual preflight result
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight-evidence/tai-reg-ru-preflight.json"
          python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          blockers = report.get('blockers') or []
          if blockers or report.get('passed') is not True:
              raise SystemExit('REG.RU preflight is blocked; inspect redacted evidence artifact')
          PY

      - name: Write preflight summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-preflight-evidence/tai-reg-ru-preflight.json"
          [[ -s "$report" ]] || exit 0
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          blockers = report.get('blockers') or []
          print('## TAI REG.RU preflight')
          print()
          print(f"- Status: {'PASS' if report.get('passed') else 'BLOCKED'}")
          print(f"- Blockers: {len(blockers)}")
          for code in blockers:
              print(f"  - `{code}`")
          PY
