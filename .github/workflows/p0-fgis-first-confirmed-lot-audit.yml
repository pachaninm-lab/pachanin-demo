name: P0.2 FGIS First Confirmed Lot Audit

on:
  pull_request:
    paths:
      - '.github/workflows/p0-fgis-first-confirmed-lot-audit.yml'
      - 'docs/platform-v7/autopilot/scopes/p0-fgis-first-confirmed-lot-audit-3585.json'
      - 'docs/platform-v7/crop-platform/p0.2-fgis-first-confirmed-lot-audit.md'
      - 'docs/platform-v7/crop-platform/p0.2-fgis-first-confirmed-lot-inventory.v1.json'
      - 'scripts/p0-fgis-first-confirmed-lot/verify-audit.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-fgis-first-confirmed-lot-audit.yml'
      - 'docs/platform-v7/autopilot/scopes/p0-fgis-first-confirmed-lot-audit-3585.json'
      - 'docs/platform-v7/crop-platform/p0.2-fgis-first-confirmed-lot-audit.md'
      - 'docs/platform-v7/crop-platform/p0.2-fgis-first-confirmed-lot-inventory.v1.json'
      - 'scripts/p0-fgis-first-confirmed-lot/verify-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-fgis-first-confirmed-lot-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The original Stage-1 audit is permanently anchored to the exact main it
# audited. Later PRs and main commits run the same verifier/tests as regression
# acceptance; they must not pretend that today's main is the historical audit
# base. The original governed audit branch retains the exact-base + narrow-scope
# fail-closed checks.
env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  AUDITED_MAIN: aad390e160a5ed5335d2a99d16519ca0e025279c
  GOVERNED_AUDIT_BRANCH: p0/fgis-first-confirmed-lot-audit-3585

jobs:
  exact-main-audit:
    name: Exact main · 17 areas · official SOAP · unsafe quarantine boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision and full ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: '10.2.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enforce governed audit or successor regression boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${RUNNER_TEMP}/p0-fgis-first-confirmed-lot-audit"
          export EVIDENCE_DIR
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXACT_HEAD" > "$EVIDENCE_DIR/exact-head.txt"
          printf '%s\n' "$AUDITED_MAIN" > "$EVIDENCE_DIR/audited-main.txt"

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            git fetch --no-tags origin "$BASE_BRANCH"
            current_base="$(git rev-parse "origin/$BASE_BRANCH")"
            printf '%s\n' "$current_base" > "$EVIDENCE_DIR/current-base.txt"

            if [ "$HEAD_BRANCH" = "$GOVERNED_AUDIT_BRANCH" ]; then
              printf '%s\n' 'EXACT_AUDIT' > "$EVIDENCE_DIR/scope-mode.txt"
              if [ "$current_base" != "$AUDITED_MAIN" ]; then
                echo "Governed audit base drift: expected $AUDITED_MAIN, actual $current_base" >&2
                exit 1
              fi
              GITHUB_HEAD_REF="$HEAD_BRANCH" node scripts/p7-source-controlled-scope.mjs \
                | tee "$EVIDENCE_DIR/source-controlled-scope.log"
              diff_base="$AUDITED_MAIN"
            else
              printf '%s\n' 'SUCCESSOR_REGRESSION' > "$EVIDENCE_DIR/scope-mode.txt"
              diff_base="origin/$BASE_BRANCH"
            fi
          elif [ "$EVENT_NAME" = 'push' ]; then
            printf '%s\n' 'MAIN_REGRESSION' > "$EVIDENCE_DIR/scope-mode.txt"
            if [ -n "$PUSH_BEFORE" ] \
              && [ "$PUSH_BEFORE" != '0000000000000000000000000000000000000000' ] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              diff_base="$PUSH_BEFORE"
            else
              diff_base='HEAD^'
            fi
          else
            printf '%s\n' 'MANUAL_REGRESSION' > "$EVIDENCE_DIR/scope-mode.txt"
            diff_base='HEAD^'
          fi

          printf '%s\n' "$diff_base" > "$EVIDENCE_DIR/diff-base.txt"
          git diff --name-only "$diff_base...$EXACT_HEAD" | sort \
            | tee "$EVIDENCE_DIR/changed-files.txt"

          node --check scripts/p0-fgis-first-confirmed-lot/verify-audit.mjs
          node scripts/p0-fgis-first-confirmed-lot/verify-audit.mjs \
            | tee "$EVIDENCE_DIR/audit-verification.json"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-run audited contract, XML, tenant and auction tests
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${RUNNER_TEMP}/p0-fgis-first-confirmed-lot-audit"
          export EVIDENCE_DIR
          pnpm --filter @pc/api exec prisma generate \
            2>&1 | tee "$EVIDENCE_DIR/prisma-generate.log"
          pnpm --filter @pc/api exec jest --runInBand \
            src/modules/regulatory-integration/fgis-grain/fgis-grain-1.0.23.contract.spec.ts \
            src/modules/regulatory-integration/fgis-grain/fgis-grain-1.0.23.xml-codec.spec.ts \
            src/modules/regulatory-integration/fgis-grain/fgis-grain-1.0.23.xml-policy.spec.ts \
            src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.contract.spec.ts \
            src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.spec.ts \
            src/modules/auctions/auction-postgresql-authority.spec.ts \
            src/modules/auctions/auction-command.service.spec.ts \
            2>&1 | tee "$EVIDENCE_DIR/targeted-tests.log"

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="${RUNNER_TEMP}/p0-fgis-first-confirmed-lot-audit"
          mkdir -p "$EVIDENCE_DIR"
          mode="$(cat "$EVIDENCE_DIR/scope-mode.txt" 2>/dev/null || printf 'NO_EVIDENCE')"
          {
            echo '## P0.2 FGIS first confirmed lot · Stage 1 audit/regression'
            echo "- Historical audited main: \`$AUDITED_MAIN\`"
            echo "- Exact head: \`$EXACT_HEAD\`"
            echo "- Acceptance mode: \`$mode\`"
            echo '- Operational status: `NOT_ATTESTED`'
            echo '- `LIVE_CONFIRMED`: `0`'
            echo '- Required audit areas: `17`'
            if [[ -f "$EVIDENCE_DIR/audit-verification.json" ]]; then
              echo '- Audit verifier: `PASS`'
            else
              echo '- Audit verifier: `NO_EVIDENCE`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-fgis-first-confirmed-lot-audit-${{ env.EXACT_HEAD }}
          path: ${{ runner.temp }}/p0-fgis-first-confirmed-lot-audit
          if-no-files-found: error
          retention-days: 90
