name: Production Legacy Boot Evidence

on:
  pull_request:
    paths:
      - .github/workflows/production-legacy-boot-evidence.yml
      - scripts/production-legacy-boot-evidence.py
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR files against the accepted base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_REPO" == "$GITHUB_REPOSITORY" && "$SOURCE_REF" == 'ops/gekta-legacy-boot-evidence-20261111' ]]
          python3 -I -S -B scripts/production-legacy-boot-evidence.py --verify-pr "$BASE_SHA" "$HEAD_SHA"
          python3 -I -S -B scripts/production-legacy-boot-evidence.py --self-test

  rollback_rehearsal:
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Save and restore the pinned API image on the disposable runner
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "$GITHUB_EVENT_NAME" == pull_request && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/api-rollback.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          script=scripts/production-legacy-boot-evidence.py
          python3 -I -S -B "$script" --rollback-rehearsal-inputs "$HEAD_SHA" > "$work/inputs"
          mapfile -t inputs < "$work/inputs"
          [[ "${#inputs[@]}" == 4 ]]
          registry=${inputs[0]}
          config_id=${inputs[1]}
          baseline_id=${inputs[2]}
          transfer=${inputs[3]}
          mkdir -m 0700 "$work/registry"
          docker=(/usr/bin/docker --host unix:///var/run/docker.sock --config "$work/registry")
          printf '%s' "$GH_TOKEN" | "${docker[@]}" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          unset GH_TOKEN
          available=$(df -PB1 "$work" | awk 'NR == 2 { print $4 }')
          [[ "$available" =~ ^[0-9]+$ && "$available" -ge 6442450944 ]]
          timeout --kill-after=5s 300s "${docker[@]}" image pull --platform linux/amd64 "$registry" >/dev/null
          [[ "$("${docker[@]}" image inspect --format '{{.Id}}' "$registry")" == "$config_id" ]]
          "${docker[@]}" image tag "$registry" "$transfer"
          timeout --kill-after=5s 120s "${docker[@]}" image save --output "$work/api.tar" "$transfer"
          bytes=$(stat -c '%s' "$work/api.tar")
          [[ "$bytes" =~ ^[0-9]+$ && "$bytes" -gt 0 && "$bytes" -le 2147483648 ]]
          "${docker[@]}" image rm --no-prune "$transfer" "$registry" >/dev/null
          for identity in "$config_id" "$baseline_id" "$transfer"; do
            if "${docker[@]}" image inspect "$identity" >/dev/null 2>&1; then
              exit 1
            fi
          done
          timeout --kill-after=5s 120s "${docker[@]}" image load --input "$work/api.tar" >/dev/null
          format=$'{{.Id}}\n{{.Os}}\n{{.Architecture}}\n{{json .RootFS.Layers}}\n{{json .Config}}'
          result=$("${docker[@]}" image inspect --format "$format" "$transfer" |
            python3 -I -S -B "$script" --verify-restored-api-image "$HEAD_SHA")
          case "$result" in
            EXACT_BASELINE_IMAGE_RESTORED|RESTORED_IMAGE_ID_DIFFERS|RESTORED_IMAGE_CONTENT_DIFFERS) ;;
            *) exit 1 ;;
          esac
          printf 'ROLLBACK_IMAGE_REHEARSAL=%s\n' "$result" | tee -a "$GITHUB_STEP_SUMMARY"

  observe:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 && github.event.issue.pull_request == null &&
      (github.event.comment.body == '/production observe-legacy-boot current-main' ||
       github.event.comment.body == '/production observe-original19-identity current-main' ||
       github.event.comment.body == '/production observe-api-baseline-content current-main' ||
       github.event.comment.body == '/production rehearse-running-api-store current-main') &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.run_attempt == '1'
    concurrency:
      group: ${{ github.event.comment.body == '/production rehearse-running-api-store current-main' && 'pc-crop-production-release-candidate' || 'production-docker-headroom-readonly-diagnostic' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.comment.body == '/production rehearse-running-api-store current-main' && 10 || 5 }}
    permissions:
      contents: read
      issues: write
    env:
      LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
      DEFAULT_HOST: 195.19.12.120
      EVIDENCE_DIR: artifacts/legacy-boot-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and fresh owner command
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$COMMAND_ID" =~ ^[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]
          operation="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMAND_ID" |
            jq -er --arg owner "$GITHUB_REPOSITORY_OWNER" --arg issue "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/4637" '
              select(.user.login == $owner and .author_association == "OWNER" and .issue_url == $issue and
                     .created_at == .updated_at and
                     ((now - (.created_at | fromdateiso8601)) as $age | $age >= 0 and $age <= 600)) |
              if .body == "/production observe-legacy-boot current-main" then "boot"
              elif .body == "/production observe-original19-identity current-main" then "identity"
              elif .body == "/production observe-api-baseline-content current-main" then "api"
              elif .body == "/production rehearse-running-api-store current-main" then "api-archive"
              else empty end
            ')"
          python3 -I -S -B scripts/production-legacy-boot-evidence.py --verify-main "$GITHUB_SHA"
          python3 -I -S -B scripts/production-legacy-boot-evidence.py --self-test
          [[ "$operation" == boot || "$operation" == identity || "$operation" == api || "$operation" == api-archive ]]
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"

      - name: Reuse the pinned production SSH resolver
        env:
          SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
          SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
          SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
          SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
          SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
          SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          workflow=.github/workflows/production-docker-headroom-diagnostic.yml
          [[ "$(git hash-object "$workflow")" == '44b16b8a0cd882cf13e795da6ac3081d1c7e0654' ]]
          python3 -I -S -B - "$workflow" > "$RUNNER_TEMP/legacy-boot-ssh-resolver.sh" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          source = Path(sys.argv[1]).read_text()
          section, end, _ = source.partition('\n      - name: Collect one closed Docker admission signal\n')
          marker = '      - name: Resolve protected key and pinned VPS identity\n        shell: bash\n        run: |\n'
          _, start, resolver = section.rpartition(marker)
          if not start or not end:
              raise SystemExit('unexpected resolver section')
          print(textwrap.dedent(resolver), end='')
          PY
          bash "$RUNNER_TEMP/legacy-boot-ssh-resolver.sh"

      - name: Collect one bounded host observation
        id: boot
        if: steps.provenance.outputs.operation != 'api-archive'
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
          OPERATION: ${{ steps.provenance.outputs.operation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]
          [[ "$PROD_HOST" == "$DEFAULT_HOST" && "$PROD_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$SSH_USER_SECRET" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          script=scripts/production-legacy-boot-evidence.py
          payload="$script"
          remote='/usr/bin/python3 -I -S -B -'
          if [[ "$OPERATION" == identity ]]; then
            umask 077
            source="$RUNNER_TEMP/original19-identity-reference.py"
            git show '8fc8061fa924cad7182b93b3e6a08b2abb697c27:scripts/production-market-release-preflight.py' > "$source"
            [[ "$(git hash-object "$source")" == 'c45e7e2aa18d672e2d1372ac0cf7c83934c3a6c3' ]]
            payload="$RUNNER_TEMP/original19-identity-payload.py"
            python3 -I -S -B "$script" --build-identity-payload "$source" "$script" > "$payload"
            remote='/usr/bin/python3 -I -S -B - --identity'
          elif [[ "$OPERATION" == api ]]; then
            umask 077
            payload="$RUNNER_TEMP/api-baseline-content-payload.py"
            python3 -I -S -B "$script" --build-api-baseline-payload "$GITHUB_SHA" > "$payload"
            remote='/usr/bin/python3 -I -S -B - --api-baseline'
          else
            [[ "$OPERATION" == boot ]]
          fi
          before="$(date +%s%3N)"
          receipt=NOT_PROVEN
          if response="$(timeout --kill-after=2s 30s /usr/bin/ssh -F /dev/null -T \
            -i "$HOME/.ssh/id_pc_prod" -p "$PROD_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ClearAllForwardings=yes -o ConnectTimeout=12 -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=1 -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER_SECRET@$PROD_HOST" "$remote" < "$payload" 2>/dev/null | head -c 65)"; then
            if (( ${#response} < 64 )); then
              if [[ "$OPERATION" == identity ]]; then
                receipt="$(python3 -I -S -B "$script" --validate-identity "$response")"
              elif [[ "$OPERATION" == api ]]; then
                receipt="$(python3 -I -S -B "$script" --validate-api "$response")"
              else
                receipt="$(python3 -I -S -B "$script" --reconcile "$response" "$before" "$(date +%s%3N)")"
              fi
            fi
          fi
          [[ "$receipt" =~ ^[A-Z][A-Z0-9_]{0,63}$ ]]
          printf 'result=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

      - name: Restore the running API image archive on the disposable runner
        id: rollback
        if: steps.provenance.outputs.operation == 'api-archive'
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]
          [[ "$PROD_HOST" == "$DEFAULT_HOST" && "$PROD_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$SSH_USER_SECRET" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/running-api-archive.XXXXXXXX")
          daemon_job=''
          cleanup() {
            if [[ -f "$work/docker.pid" ]]; then
              pid=$(sudo -n cat "$work/docker.pid")
              if [[ "$pid" =~ ^[0-9]+$ && "$pid" -gt 1 ]]; then sudo -n kill -TERM "$pid" || true; fi
            fi
            if [[ -n "$daemon_job" ]]; then sudo -n kill -TERM "$daemon_job" 2>/dev/null || true; fi
            sudo -n rm -rf -- "$work"
          }
          trap cleanup EXIT
          available=$(df -PB1 "$work" | awk 'NR == 2 { print $4 }')
          [[ "$available" =~ ^[0-9]+$ && "$available" -ge 6442450944 ]]
          script=scripts/production-legacy-boot-evidence.py
          python3 -I -S -B "$script" --build-api-baseline-payload "$GITHUB_SHA" > "$work/export.py"
          python3 -I -S -B "$script" --rollback-rehearsal-inputs "$GITHUB_SHA" > "$work/inputs"
          mapfile -t inputs < "$work/inputs"
          [[ "${#inputs[@]}" == 4 ]]
          baseline=${inputs[2]}
          store=$(timeout --kill-after=5s 210s /usr/bin/ssh -F /dev/null -T \
            -i "$HOME/.ssh/id_pc_prod" -p "$PROD_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ClearAllForwardings=yes -o ConnectTimeout=12 -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=1 -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER_SECRET@$PROD_HOST" '/usr/bin/python3 -I -S -B - --export-running-api-archive' \
            < "$work/export.py" 2>/dev/null |
            python3 -I -S -B "$script" --capture-api-image-archive "$work/api.tar")
          [[ "$store" == CLASSIC || "$store" == CONTAINERD ]]
          docker=(/usr/bin/docker --host unix:///var/run/docker.sock)
          detect_store() {
            timeout 5s "${docker[@]}" info --format '{{json .DriverStatus}}' 2>/dev/null |
              python3 -I -S -B "$script" --classify-image-store
          }
          runner_store=$(detect_store)
          if [[ "$runner_store" != "$store" ]]; then
            snapshotter=false
            if [[ "$store" == CONTAINERD ]]; then snapshotter=true; fi
            printf '{"features":{"containerd-snapshotter":%s}}\n' "$snapshotter" > "$work/docker.json"
            sudo -n /usr/bin/timeout --kill-after=5s 220s /usr/bin/dockerd \
              --config-file "$work/docker.json" --data-root "$work/data" --exec-root "$work/exec" \
              --pidfile "$work/docker.pid" --host "unix://$work/docker.sock" --bridge none \
              --iptables=false --ip6tables=false --ip-forward=false --ip-masq=false >/dev/null 2>&1 &
            daemon_job=$!
            docker=(sudo -n /usr/bin/docker --host "unix://$work/docker.sock")
            runner_store=''
            for attempt in {1..15}; do
              if runner_store=$(detect_store 2>/dev/null); then break; fi
              sleep 1
            done
          fi
          [[ "$runner_store" == "$store" ]]
          printf 'image_store=%s\n' "$store" >> "$GITHUB_OUTPUT"
          if "${docker[@]}" image inspect "$baseline" >/dev/null 2>&1; then exit 1; fi
          "${docker[@]}" image ls --all --quiet --no-trunc | LC_ALL=C sort -u > "$work/before"
          timeout --kill-after=5s 120s "${docker[@]}" image load --input "$work/api.tar" >/dev/null
          format=$'{{.Id}}\n{{.Os}}\n{{.Architecture}}\n{{json .RootFS.Layers}}\n{{json .Config}}'
          if "${docker[@]}" image inspect --format "$format" "$baseline" > "$work/restored" 2>/dev/null; then
            result=$(python3 -I -S -B "$script" --verify-restored-api-image "$GITHUB_SHA" < "$work/restored")
          else
            "${docker[@]}" image ls --all --quiet --no-trunc | LC_ALL=C sort -u > "$work/after"
            mapfile -t loaded < <(LC_ALL=C comm -13 "$work/before" "$work/after")
            result=RESTORED_IMAGE_ID_UNAVAILABLE
            if [[ "${#loaded[@]}" == 1 && "${loaded[0]}" =~ ^sha256:[0-9a-f]{64}$ ]] &&
                "${docker[@]}" image inspect --format "$format" "${loaded[0]}" > "$work/restored" 2>/dev/null; then
              result=$(python3 -I -S -B "$script" --verify-restored-api-image "$GITHUB_SHA" < "$work/restored")
            fi
          fi
          case "$result" in
            EXACT_BASELINE_IMAGE_RESTORED|RESTORED_IMAGE_ID_DIFFERS|RESTORED_IMAGE_CONTENT_DIFFERS|RESTORED_IMAGE_ID_UNAVAILABLE) ;;
            *) exit 1 ;;
          esac
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"

      - name: Remove protected transport material
        if: always()
        shell: bash
        run: >-
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/legacy-boot-ssh-resolver.sh"
          "$RUNNER_TEMP/original19-identity-reference.py" "$RUNNER_TEMP/original19-identity-payload.py"
          "$RUNNER_TEMP/api-baseline-content-payload.py"

      - name: Publish closed evidence
        if: always() && steps.provenance.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.rollback.outputs.result || steps.boot.outputs.result }}
          IMAGE_STORE: ${{ steps.rollback.outputs.image_store }}
          OPERATION: ${{ steps.provenance.outputs.operation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$OPERATION" == identity ]]; then
            result="$(python3 -I -S -B scripts/production-legacy-boot-evidence.py --validate-identity "$RESULT")"
            body="$(printf '## Read-only Original19 identity classification\n\n- Exact source: `%s`\n- Run: `%s`\n- Fixed identity result: `%s`\n- Production mutation: `NONE`\n- Original19 and release authorization: `NOT_ATTESTED`\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$result")"
          elif [[ "$OPERATION" == api ]]; then
            result="$(python3 -I -S -B scripts/production-legacy-boot-evidence.py --validate-api "$RESULT")"
            body="$(printf '## Read-only running API image metadata comparison\n\n- Exact source: `%s`\n- Run: `%s`\n- Fixed content result: `%s`\n- Evidence scope: Docker-reported OCI layer IDs and selected image defaults.\n- Production mutation: `NONE`\n- Release authorization: `NOT_ATTESTED`\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$result")"
          elif [[ "$OPERATION" == api-archive ]]; then
            case "$RESULT" in
              EXACT_BASELINE_IMAGE_RESTORED|RESTORED_IMAGE_ID_DIFFERS|RESTORED_IMAGE_CONTENT_DIFFERS|RESTORED_IMAGE_ID_UNAVAILABLE) result="$RESULT" ;;
              *) result=NOT_PROVEN ;;
            esac
            store=NOT_PROVEN
            if [[ "$IMAGE_STORE" == CLASSIC || "$IMAGE_STORE" == CONTAINERD ]]; then store="$IMAGE_STORE"; fi
            body="$(printf '## Isolated restoration of the running API image in the matching Docker store\n\n- Exact source: `%s`\n- Run: `%s`\n- Matched Docker store: `%s`\n- Exact image result: `%s`\n- Production mutation: `NONE`\n- Release authorization: `NOT_ATTESTED`\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$store" "$result")"
          else
            result=NOT_PROVEN
            if [[ "$RESULT" == BOOT_AFTER_LEGACY_CUTOFF ]]; then result="$RESULT"; fi
            body="$(printf '## Read-only Ubuntu boot evidence\n\n- Exact source: `%s`\n- Run: `%s`\n- Journal and clock reconciliation: `%s`\n- Production mutation: `NONE`\n- Original19 and release authorization: `NOT_ATTESTED`\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$result")"
          fi
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 4637 --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          [[ "$result" != NOT_PROVEN ]]
