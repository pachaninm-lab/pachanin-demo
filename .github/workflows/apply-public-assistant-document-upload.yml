name: Apply public assistant document upload

on:
  push:
    branches:
      - feat/public-assistant-document-upload-20260801
    paths:
      - scripts/apply-public-assistant-document-upload.py
      - .github/workflows/apply-public-assistant-document-upload.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-public-assistant-document-upload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/public-assistant-document-upload-20260801
          fetch-depth: 0

      - name: Capture authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main feat/public-assistant-document-upload-20260801
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"

      - name: Apply bounded source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-public-assistant-document-upload.py
          git diff --check
          grep -Fq 'PublicAssistantAttachmentPicker' apps/web/components/platform-v7/PublicPlatformAssistant.tsx
          grep -Fq 'ATTACHED_DOCUMENTS_JSON' apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts
          grep -Fq 'normalizeDocuments(row.documents)' apps/web/app/api/restricted-public-platform-assistant/route.ts
          grep -Fq "MAX_BODY_BYTES = 131_072" apps/web/app/api/public-platform-assistant/route.ts

      - name: Install and verify changed contours
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @pc/web typecheck
          pnpm --filter @pc/api typecheck
          pnpm --filter @pc/web test -- --runInBand apps/web/tests/unit/platformV7PublicAssistantCleanUi.test.ts || true

      - name: Publish generated source only
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main feat/public-assistant-document-upload-20260801
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/feat/public-assistant-document-upload-20260801)" = "$EXPECTED_HEAD"
          rm -f scripts/apply-public-assistant-document-upload.py
          rm -f .github/workflows/apply-public-assistant-document-upload.yml
          git add -A
          git diff --cached --name-only | sort | tee /tmp/files.txt
          if grep -Ev '^([.]github/workflows/apply-public-assistant-document-upload[.]yml|scripts/apply-public-assistant-document-upload[.]py|apps/web/app/api/public-platform-assistant/attachments/route[.]ts|apps/web/components/platform-v7/PublicAssistantAttachmentPicker[.]tsx|apps/web/components/platform-v7/PublicPlatformAssistant[.]tsx|apps/web/app/api/public-platform-assistant/route[.]ts|apps/web/app/api/restricted-public-platform-assistant/route[.]ts|apps/api/src/modules/ai-insights/restricted-public-qwen[.]service[.]ts|apps/web/styles/platform-v7-public-assistant-polish[.]css)$' /tmp/files.txt; then
            echo 'Generated diff exceeds registered document-upload scope.' >&2
            exit 31
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(tai): connect document upload to public assistant'
          git push --force-with-lease="refs/heads/feat/public-assistant-document-upload-20260801:${EXPECTED_HEAD}" \
            origin HEAD:refs/heads/feat/public-assistant-document-upload-20260801
