name: One-time fix Qwen hydration wait

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-qwen-hydration-wait-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qwen-live-ui-acceptance-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Stage valid hydration wait repair
        shell: bash
        run: |
          set -euo pipefail
          staging='docs/platform-v7/autopilot/staging/tai-restricted-qwen-reg-ru-activation.hydration-fixed.yml.txt'
          if [[ ! -f "$staging" ]]; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml')
          text = path.read_text(encoding='utf-8')
          old = "              await page.waitForFunction(() => document.querySelector('.pc-public-assistant-shortcut')?.getAttribute('aria-hidden') === 'true', null, { timeout: 30000 });"
          new = "              await page.waitForTimeout(750);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one impossible aria-hidden wait, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if "getAttribute('aria-hidden') === 'true'" in text:
              raise SystemExit('impossible aria-hidden wait remains')
          path.write_text(text, encoding='utf-8')
          PY
            mkdir -p "$(dirname "$staging")"
            cp .github/workflows/tai-restricted-qwen-reg-ru-activation.yml "$staging"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$staging"
            git commit -m 'QWEN: stage valid hydration wait repair'
            git push origin HEAD:fix/qwen-live-ui-acceptance-v2
          fi
          out="$RUNNER_TEMP/qwen-hydration-tree-meta"
          rm -rf "$out"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/commit-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree-sha.txt"
      - name: Upload hydration repair tree metadata
        uses: actions/upload-artifact@v4
        with:
          name: qwen-hydration-tree-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen-hydration-tree-meta
          if-no-files-found: error
          retention-days: 7
