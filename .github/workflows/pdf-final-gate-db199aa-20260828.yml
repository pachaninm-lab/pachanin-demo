name: PDF Final Gate db199aa

on:
  push:
    branches:
      - verify/pdf-final-gate-db199aa-20260828

permissions:
  contents: read

jobs:
  verify-public-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify two independent public downloads
        shell: bash
        run: |
          set -euo pipefail
          URL='https://xn----8sbjf4befbjgs9b.xn--p1ai/downloads/prozrachnaya-tsena-presentation.pdf'
          EXPECTED_BYTES='312533'
          EXPECTED_SHA256='1f99bd83a65cb738a2874ec284a30f4ac64e3974d37f8d5f93d5fd8a255178a5'
          EXPECTED_PAGES='14'

          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

          mkdir -p evidence
          : > evidence/result.txt

          for i in 1 2; do
            file="evidence/presentation-${i}.pdf"
            headers="evidence/headers-${i}.txt"
            http_code="$(curl -fLsS --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 90 \
              -D "$headers" -o "$file" -w '%{http_code}' "$URL")"
            bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            sha256="$(sha256sum "$file" | awk '{print $1}')"
            pages="$(pdfinfo "$file" | awk '/^Pages:/ {print $2}')"

            {
              echo "DOWNLOAD_${i}_HTTP=${http_code}"
              echo "DOWNLOAD_${i}_BYTES=${bytes}"
              echo "DOWNLOAD_${i}_SHA256=${sha256}"
              echo "DOWNLOAD_${i}_PAGES=${pages}"
            } | tee -a evidence/result.txt

            test "$http_code" = '200'
            test "$bytes" = "$EXPECTED_BYTES"
            test "$sha256" = "$EXPECTED_SHA256"
            test "$pages" = "$EXPECTED_PAGES"
          done

          cmp -s evidence/presentation-1.pdf evidence/presentation-2.pdf
          echo 'BINARY_IDENTICAL=1' | tee -a evidence/result.txt
          echo 'PDF_FINAL_GATE=PASS' | tee -a evidence/result.txt

      - name: Upload final-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-final-gate-db199aa-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
