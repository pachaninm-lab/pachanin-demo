name: Temporary auth-mail Go-template repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-auth-mail-go-template-fix.yml'
      - 'scripts/production-full-stack-exact-sha.sh'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/industrial-auth-mail-outbox-3785
          fetch-depth: 0
      - name: Normalize Docker Go templates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/production-full-stack-exact-sha.sh')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()
          changed = 0
          out = []
          for line in lines:
              if re.search(r"(?:--format|inspect\s+-f)\s+'[^']*\\\"[^']*'", line):
                  fixed = line.replace('\\"', '"')
                  if fixed != line:
                      changed += 1
                      line = fixed
              out.append(line)
          if changed == 0:
              if any(re.search(r"(?:--format|inspect\s+-f)\s+'[^']*\\\"[^']*'", line) for line in lines):
                  raise SystemExit('escaped Go templates remain')
          elif changed < 2:
              raise SystemExit(f'unexpectedly small Go-template repair count: {changed}')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f'GO_TEMPLATE_FIX_COUNT={changed}')
          PY
          bash -n scripts/production-full-stack-exact-sha.sh
          node scripts/check-production-full-stack-release.mjs
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/production-full-stack-exact-sha.sh; then
            echo 'GO_TEMPLATE_FIX=ALREADY_APPLIED'
            exit 0
          fi
          git config user.name 'pc-crop-auth-mail-release'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/production-full-stack-exact-sha.sh
          git commit -m 'fix(auth-mail): correct Docker Go-template quoting'
          git push origin HEAD:p0/industrial-auth-mail-outbox-3785
