name: Gekta P0 SPEED Prompt Prefix Locality Patch

on:
  push:
    branches:
      - perf/gekta-p0-speed-prompt-prefix-locality-3896
    paths:
      - .github/workflows/gekta-p0-speed-prompt-prefix-locality-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Move variable prompt fragments behind shared prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts')
          workflow_path = Path('.github/workflows/gekta-p0-speed-prompt-prefix-locality-patch.yml')
          text = service_path.read_text(encoding='utf-8')
          fn_start = text.index('function publicSystemPrompt(')
          fn_end = text.index('\nfunction generalAgroResponseBudgetRule(', fn_start)
          block = text[fn_start:fn_end]

          for old in (
              'Reply in ${language}. ',
              '${responseBudgetRule} ',
              '${authorityRule} ${currentRule} ',
          ):
              if block.count(old) != 1:
                  raise SystemExit(f'prompt fragment count mismatch: {old!r}')
              block = block.replace(old, '')

          tail = 'Start with the direct answer and avoid generic filler.`;'
          if block.count(tail) != 1:
              raise SystemExit('prompt tail mismatch')
          block = block.replace(
              tail,
              'Start with the direct answer and avoid generic filler. ${authorityRule} ${currentRule} ${responseBudgetRule} Reply in ${language}.`;'
          )
          service_path.write_text(text[:fn_start] + block + text[fn_end:], encoding='utf-8')
          workflow_path.unlink()
          PY
          git diff --check
          git diff -- apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts

      - name: Commit bounded prompt-prefix change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts .github/workflows/gekta-p0-speed-prompt-prefix-locality-patch.yml
          git commit -m 'perf(gekta): maximize prompt-prefix cache locality'
          git push origin HEAD:perf/gekta-p0-speed-prompt-prefix-locality-3896
