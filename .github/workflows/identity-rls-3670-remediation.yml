name: Identity RLS exact remediation

on:
  push:
    branches:
      - identity-rls-3670
    paths:
      - .github/workflows/identity-rls-3670-remediation.yml

permissions:
  contents: write

concurrency:
  group: identity-rls-3670-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT_SHA: 1fbd0096ef4ba5fc30c1fd3ee116cdd55117a8ed
      BRANCH: identity-rls-3670
      WORKFLOW_PATH: .github/workflows/identity-rls-3670-remediation.yml
    steps:
      - name: Checkout exact remediation commit
        uses: actions/checkout@v4
        with:
          ref: identity-rls-3670
          fetch-depth: 2

      - name: Verify single-purpose parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT_SHA" HEAD)" = "$WORKFLOW_PATH"

      - name: Patch nanoid and production-like PgBouncer staff routing
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const manifest = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          manifest.pnpm ??= {};
          manifest.pnpm.overrides ??= {};
          const existing = manifest.pnpm.overrides['nanoid@<3.3.17'];
          if (existing != null && existing !== '3.3.17') {
            throw new Error(`Unexpected nanoid override: ${existing}`);
          }
          manifest.pnpm.overrides['nanoid@<3.3.17'] = '3.3.17';
          fs.writeFileSync(packagePath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new))

          pgb = 'scripts/release/production-like-kubernetes-pgbouncer.sh'
          replace_once(
              pgb,
              '  --from-literal=AUTH_DB_PASSWORD="$AUTH_DB_PASSWORD" \\\n  --from-literal=STORAGE_DB_PASSWORD="$STORAGE_DB_PASSWORD" \\\n',
              '  --from-literal=AUTH_DB_PASSWORD="$AUTH_DB_PASSWORD" \\\n  --from-literal=STAFF_DB_PASSWORD="$STAFF_DB_PASSWORD" \\\n  --from-literal=STORAGE_DB_PASSWORD="$STORAGE_DB_PASSWORD" \\\n',
          )
          replace_once(
              pgb,
              '  --from-literal=AUTH_DATABASE_URL="postgresql://app_auth:${AUTH_DB_PASSWORD}@pgbouncer:5432/grainflow?schema=public&connection_limit=10&pool_timeout=10" \\\n  --from-literal=STORAGE_DATABASE_URL="postgresql://app_storage:${STORAGE_DB_PASSWORD}@pgbouncer:5432/grainflow?schema=public&connection_limit=10&pool_timeout=10" \\\n',
              '  --from-literal=AUTH_DATABASE_URL="postgresql://app_auth:${AUTH_DB_PASSWORD}@pgbouncer:5432/grainflow?schema=public&connection_limit=10&pool_timeout=10" \\\n  --from-literal=STAFF_DATABASE_URL="postgresql://app_staff:${STAFF_DB_PASSWORD}@pgbouncer:5432/grainflow?schema=public&connection_limit=10&pool_timeout=10" \\\n  --from-literal=STORAGE_DATABASE_URL="postgresql://app_storage:${STORAGE_DB_PASSWORD}@pgbouncer:5432/grainflow?schema=public&connection_limit=10&pool_timeout=10" \\\n',
          )
          replace_once(
              pgb,
              '  --env="APP_DB_PASSWORD=${APP_DB_PASSWORD}" \\\n  --env="OUTBOX_DB_PASSWORD=${OUTBOX_DB_PASSWORD}" \\\n',
              '  --env="APP_DB_PASSWORD=${APP_DB_PASSWORD}" \\\n  --env="STAFF_DB_PASSWORD=${STAFF_DB_PASSWORD}" \\\n  --env="OUTBOX_DB_PASSWORD=${OUTBOX_DB_PASSWORD}" \\\n',
          )
          replace_once(
              pgb,
              "  'PGPASSWORD=\"$APP_DB_PASSWORD\" psql -h pgbouncer -p 5432 -U app_runtime -d grainflow -v ON_ERROR_STOP=1 -c \"SELECT current_user, current_database()\"; PGPASSWORD=\"$OUTBOX_DB_PASSWORD\" psql -h pgbouncer -p 5432 -U app_outbox -d grainflow -v ON_ERROR_STOP=1 -c \"SELECT current_user, current_database()\"'\n",
              "  'PGPASSWORD=\"$APP_DB_PASSWORD\" psql -h pgbouncer -p 5432 -U app_runtime -d grainflow -v ON_ERROR_STOP=1 -c \"SELECT current_user, current_database()\"; PGPASSWORD=\"$STAFF_DB_PASSWORD\" psql -h pgbouncer -p 5432 -U app_staff -d grainflow -v ON_ERROR_STOP=1 -c \"SELECT current_user, current_database()\"; PGPASSWORD=\"$OUTBOX_DB_PASSWORD\" psql -h pgbouncer -p 5432 -U app_outbox -d grainflow -v ON_ERROR_STOP=1 -c \"SELECT current_user, current_database()\"'\n",
          )

          yaml = 'infra/kind/production-like/pgbouncer.yaml'
          replace_once(
              yaml,
              '              printf \'"app_auth" "%s"\\n\' "$AUTH_DB_PASSWORD" >> /generated/userlist.txt\n              printf \'"app_storage" "%s"\\n\' "$STORAGE_DB_PASSWORD" >> /generated/userlist.txt\n',
              '              printf \'"app_auth" "%s"\\n\' "$AUTH_DB_PASSWORD" >> /generated/userlist.txt\n              printf \'"app_staff" "%s"\\n\' "$STAFF_DB_PASSWORD" >> /generated/userlist.txt\n              printf \'"app_storage" "%s"\\n\' "$STORAGE_DB_PASSWORD" >> /generated/userlist.txt\n',
          )

          evidence = 'scripts/release/production-like-kubernetes-pgbouncer-evidence.sh'
          replace_once(
              evidence,
              "      jq -r '.data.DATABASE_URL,.data.AUTH_DATABASE_URL,.data.STORAGE_DATABASE_URL | @base64d'\n",
              "      jq -r '.data.DATABASE_URL,.data.AUTH_DATABASE_URL,.data.STAFF_DATABASE_URL,.data.STORAGE_DATABASE_URL | @base64d'\n",
          )
          replace_once(evidence, 'test "$pgbouncer_routed_principals" = "4"\n', 'test "$pgbouncer_routed_principals" = "5"\n')

          builder = 'scripts/release/build-production-like-kubernetes-evidence.mjs'
          replace_once(builder, '  pgbouncerRoutedPrincipals: 4,\n', '  pgbouncerRoutedPrincipals: 5,\n')
          replace_once(
              builder,
              '      actual.pgbouncerReplicas >= 2 && actual.pgbouncerRoutedPrincipals >= 4,\n',
              '      actual.pgbouncerReplicas >= 2 && actual.pgbouncerRoutedPrincipals >= 5,\n',
          )
          PY

      - name: Regenerate exact pnpm lockfile
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.2.1 --activate
          test "$(pnpm --version)" = "10.2.1"
          pnpm install --lockfile-only

      - name: Verify dependency and routing remediation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "nanoid@<3.3.17: 3.3.17" pnpm-lock.yaml
          grep -Fq "nanoid@3.3.17:" pnpm-lock.yaml
          ! grep -Fq "nanoid@3.3.16:" pnpm-lock.yaml
          grep -Fq 'STAFF_DATABASE_URL="postgresql://app_staff:${STAFF_DB_PASSWORD}@pgbouncer:5432/' scripts/release/production-like-kubernetes-pgbouncer.sh
          grep -Fq '"app_staff" "%s"' infra/kind/production-like/pgbouncer.yaml
          grep -Fq 'pgbouncerRoutedPrincipals: 5' scripts/release/build-production-like-kubernetes-evidence.mjs
          bash -n scripts/release/production-like-kubernetes-pgbouncer.sh
          bash -n scripts/release/production-like-kubernetes-pgbouncer-evidence.sh
          node --check scripts/release/build-production-like-kubernetes-evidence.mjs
          git diff --check

      - name: Frozen install and production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high

      - name: Publish single remediation commit and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$WORKFLOW_PATH"
          expected="$({ printf '%s\n' \
            'infra/kind/production-like/pgbouncer.yaml' \
            'package.json' \
            'pnpm-lock.yaml' \
            'scripts/release/build-production-like-kubernetes-evidence.mjs' \
            'scripts/release/production-like-kubernetes-pgbouncer-evidence.sh' \
            'scripts/release/production-like-kubernetes-pgbouncer.sh' \
            "$WORKFLOW_PATH"; } | sort)"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected remediation paths:\n%s\n' "$actual" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 20
          }
          git add -A
          git commit -m 'fix(security): remediate nanoid and route staff via pgbouncer'
          git push origin "HEAD:refs/heads/${BRANCH}"
