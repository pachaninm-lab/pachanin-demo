name: SEO Live Smoke

# Runs only after a production release that was actually accepted by the REG.RU
# virtual server. A push to main updates source authority; it does not deploy,
# so it is not evidence that the live domain serves that commit.
on:
  workflow_run:
    workflows: ['Production Web Exact-SHA Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: 'Diagnostics only: full main SHA a production release accepted.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  accepted:
    name: Resolve accepted production release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/production-release-accepted-sha.yml
    with:
      release_run_id: ${{ github.event.workflow_run.id || '' }}
      manual_sha: ${{ inputs.accepted_sha || '' }}

  live-smoke:
    name: Verify production SEO headers
    needs: accepted
    if: needs.accepted.outputs.deployment_accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCEPTED_SHA: ${{ needs.accepted.outputs.accepted_sha }}
      RELEASE_SOURCE: ${{ needs.accepted.outputs.release_source }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Record the accepted release under test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/seo-live
          SITE="https://xn----8sbjf4befbjgs9b.xn--p1ai"
          body="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            "$SITE/manifest-pc-deploy.json?accepted=$ACCEPTED_SHA")"
          printf '%s\n' "$body" > artifacts/seo-live/deploy-evidence-latest.json
          live_sha="$(jq -r '.commitSha // empty' <<< "$body")"
          echo "accepted=$ACCEPTED_SHA live=$live_sha source=$RELEASE_SOURCE"
          test "$live_sha" = "$ACCEPTED_SHA"

      - name: Verify live SEO authority
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://xn----8sbjf4befbjgs9b.xn--p1ai"
          EVIDENCE="artifacts/seo-live"
          PUBLIC_PATHS=(
            "/platform-v7"
            "/platform-v7/secure-grain-deal"
            "/platform-v7/fgis-zerno"
            "/platform-v7/deal-flow"
          )
          PRIVATE_PATHS=(
            "/platform-v7/buyer"
            "/platform-v7/bank"
            "/platform-v7/deals/DL-9102/clean"
          )

          public_json='[]'
          private_json='[]'

          for path in "${PUBLIC_PATHS[@]}"; do
            safe="$(tr '/-' '__' <<< "${path#/}")"
            headers_file="$EVIDENCE/public-${safe}.headers.txt"
            curl --fail --silent --show-error --head --location \
              --retry 5 --retry-all-errors \
              "$SITE$path?acceptance_sha=$ACCEPTED_SHA" | tr -d '\r' | tee "$headers_file"
            status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' "$headers_file")"
            robots="$(awk -F': ' 'tolower($1)=="x-robots-tag" { value=$2 } END { print value }' "$headers_file")"
            [[ "$status" =~ ^(2|3)[0-9][0-9]$ ]]
            grep -Eqi '^x-robots-tag: index, follow([,]|$)' "$headers_file"
            public_json="$(jq --arg path "$path" --arg status "$status" --arg robots "$robots" '. + [{path:$path,status:($status|tonumber),xRobotsTag:$robots}]' <<< "$public_json")"
          done

          for path in "${PRIVATE_PATHS[@]}"; do
            safe="$(tr '/-' '__' <<< "${path#/}")"
            headers_file="$EVIDENCE/private-${safe}.headers.txt"
            curl --fail --silent --show-error --head --location \
              --retry 5 --retry-all-errors \
              "$SITE$path?acceptance_sha=$ACCEPTED_SHA" | tr -d '\r' | tee "$headers_file"
            status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' "$headers_file")"
            robots="$(awk -F': ' 'tolower($1)=="x-robots-tag" { value=$2 } END { print value }' "$headers_file")"
            [[ "$status" =~ ^(2|3)[0-9][0-9]$ ]]
            grep -Eqi '^x-robots-tag: noindex, nofollow([,]|$)' "$headers_file"
            private_json="$(jq --arg path "$path" --arg status "$status" --arg robots "$robots" '. + [{path:$path,status:($status|tonumber),xRobotsTag:$robots}]' <<< "$private_json")"
          done

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "$SITE/sitemap.xml?acceptance_sha=$ACCEPTED_SHA" -o "$EVIDENCE/sitemap.xml"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "$SITE/robots.txt?acceptance_sha=$ACCEPTED_SHA" -o "$EVIDENCE/robots.txt"

          for required in \
            "/platform-v7" \
            "/platform-v7/secure-grain-deal" \
            "/platform-v7/fgis-zerno" \
            "/platform-v7/deal-flow"; do
            grep -Fq "$required" "$EVIDENCE/sitemap.xml"
            grep -Fq "$required" "$EVIDENCE/robots.txt"
          done

          for forbidden in \
            "/platform-v7/buyer" \
            "/platform-v7/bank" \
            "/platform-v7/deals/" \
            "/platform-v7/lots/" \
            "/platform-v7/counterparty/" \
            "/platform-v7/demo"; do
            ! grep -Fq "$forbidden" "$EVIDENCE/sitemap.xml"
          done

          grep -Fq '/platform-v7/buyer' "$EVIDENCE/robots.txt"
          grep -Fq '/platform-v7/bank' "$EVIDENCE/robots.txt"

          sitemap_sha="sha256:$(sha256sum "$EVIDENCE/sitemap.xml" | awk '{print $1}')"
          robots_sha="sha256:$(sha256sum "$EVIDENCE/robots.txt" | awk '{print $1}')"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch main \
            --arg commitSha "$ACCEPTED_SHA" \
            --arg releaseSource "$RELEASE_SOURCE" \
            --arg releaseRunId "${RELEASE_RUN_ID:-}" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sitemapSha256 "$sitemap_sha" \
            --arg robotsSha256 "$robots_sha" \
            --argjson public "$public_json" \
            --argjson private "$private_json" \
            '{schemaVersion:2,repository:$repository,branch:$branch,commitSha:$commitSha,releaseSource:$releaseSource,releaseRunId:$releaseRunId,runId:$runId,checkedAt:$checkedAt,public:$public,private:$private,sitemap:{sha256:$sitemapSha256},robots:{sha256:$robotsSha256},violatedThresholds:[],pass:true,result:"PASS"}' \
            > "$EVIDENCE/seo-live-evidence.json"

      - name: Enforce machine-readable SEO evidence
        run: |
          node -e 'const r=require("./artifacts/seo-live/seo-live-evidence.json"); if(r.commitSha!==process.env.ACCEPTED_SHA||r.pass!==true||r.result!=="PASS"||r.violatedThresholds.length!==0) process.exit(1)'

      - name: Upload production SEO evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo-live-${{ needs.accepted.outputs.accepted_sha }}
          path: artifacts/seo-live
          if-no-files-found: error
          retention-days: 90
