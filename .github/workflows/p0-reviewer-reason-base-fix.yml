name: P0 Reviewer Reason Diagnostic Base Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-reviewer-reason-base-fix.yml'

permissions:
  contents: write

concurrency:
  group: p0-reviewer-reason-base-fix
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-reviewer-reason-classifier-base-3810'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-reviewer-reason-classifier-base-3810
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bind classifier to the exact pre-PR main and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          old_base = '0a9bbe85951a59ac7613a0a074c3abb3d398a784'
          new_base = 'b81ee2e51f9fbf5ec66603211c3f32224532e782'
          wrapper_path = Path('scripts/production-p0-reviewer-repair-diagnose-deployed-sha.sh')
          checker_path = Path('scripts/check-production-p0-reviewer-repair-diagnose.mjs')
          scope_path = Path('docs/platform-v7/autopilot/scopes/production-p0-reviewer-repair-diagnose-3802.json')
          self_path = Path('.github/workflows/p0-reviewer-reason-base-fix.yml')

          wrapper = wrapper_path.read_text(encoding='utf-8')
          if wrapper.count(old_base) != 1 or new_base in wrapper:
              raise SystemExit('wrapper diagnostic-base anchor mismatch')
          wrapper_path.write_text(wrapper.replace(old_base, new_base, 1), encoding='utf-8')

          checker = checker_path.read_text(encoding='utf-8')
          if checker.count(old_base) != 2 or new_base in checker:
              raise SystemExit(
                  f'checker diagnostic-base marker mismatch: {checker.count(old_base)}'
              )
          checker = checker.replace(old_base, new_base)
          anchor = "    || scope.productionHosting !== 'REG_RU_EXISTING_INFRASTRUCTURE_ONLY'\n"
          insertion = (
              "    || scope.diagnosticBaseRevision !== 'b81ee2e51f9fbf5ec66603211c3f32224532e782'\n"
              + anchor
          )
          if checker.count(anchor) != 1 or 'scope.diagnosticBaseRevision' in checker:
              raise SystemExit('checker scope-base binding anchor mismatch')
          checker_path.write_text(checker.replace(anchor, insertion, 1), encoding='utf-8')

          scope = json.loads(scope_path.read_text(encoding='utf-8'))
          if 'diagnosticBaseRevision' in scope:
              raise SystemExit('scope diagnostic base already present')
          scope['diagnosticBaseRevision'] = new_base
          scope_path.write_text(json.dumps(scope, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          self_path.unlink()
          PY

          bash -n scripts/production-p0-reviewer-repair-diagnose-deployed-sha.sh
          node --check scripts/check-production-p0-reviewer-repair-diagnose.mjs
          node scripts/check-production-p0-reviewer-repair-diagnose.mjs
          python -m json.tool docs/platform-v7/autopilot/scopes/production-p0-reviewer-repair-diagnose-3802.json >/dev/null
          git diff --check

          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            '.github/workflows/p0-reviewer-reason-base-fix.yml'
            'docs/platform-v7/autopilot/scopes/production-p0-reviewer-repair-diagnose-3802.json'
            'scripts/check-production-p0-reviewer-repair-diagnose.mjs'
            'scripts/production-p0-reviewer-repair-diagnose-deployed-sha.sh'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "$(printf '%s\n' "${changed[@]}")" == "$(printf '%s\n' "${expected[@]}")" ]]

          git config user.name 'pachaninm-lab'
          git config user.email '263435807+pachaninm-lab@users.noreply.github.com'
          git add -A
          git commit -m 'P0: bind reviewer reason diagnostic to exact pre-PR main'
          git push origin HEAD:fix/p0-reviewer-reason-classifier-base-3810
