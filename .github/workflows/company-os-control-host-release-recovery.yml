name: Company OS Control Host Release Recovery

on:
  workflow_run:
    workflows:
      - 'Company OS Control Host Authorized Cutover 2026-08-18'
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: company-os-control-host-release-recovery
  cancel-in-progress: false

env:
  TARGET_ISSUE: '4159'
  RELEASE_ISSUE: '3072'
  CANONICAL_VPS: '195.19.12.120'
  MIN_BOUNDARY_COMMIT: 'ef01ce98aad645ec941d03f88bdc0275e763e604'
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  recover-stale-boundary:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Admit only a deployed-boundary failure
        id: admit
        uses: actions/github-script@v7
        with:
          script: |
            const failedRun = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: failedRun.id,
              filter: 'latest',
              per_page: 100,
            });
            const failedSteps = [];
            for (const job of jobs) {
              for (const step of job.steps || []) {
                if (['failure', 'cancelled', 'timed_out'].includes(step.conclusion)) {
                  failedSteps.push(step.name);
                }
              }
            }
            const eligible = failedSteps.some((name) => /Inspect current state and perform atomic cutover|Require running web revision to contain Company OS boundary/i.test(name));
            core.setOutput('eligible', eligible ? 'YES' : 'NO');
            core.setOutput('failed_run_id', String(failedRun.id));
            core.setOutput('failed_steps', failedSteps.join(' | '));

      - name: Stop when recovery is not applicable
        if: steps.admit.outputs.eligible != 'YES'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.TARGET_ISSUE),
              body: [
                '## Company OS release recovery not admitted',
                '',
                `- Failed cutover run: ${context.payload.workflow_run.id}`,
                `- Failed steps: \`${{ steps.admit.outputs.failed_steps }}\``,
                '- Reason: failure is not proven to be a stale deployed Company OS boundary.',
                '- Production mutation by recovery: **NONE**',
              ].join('\n'),
            });

      - name: Resolve pinned production SSH identity
        if: steps.admit.outputs.eligible == 'YES'
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$CANONICAL_VPS}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$CANONICAL_VPS" ]]
          [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ && "$port" -ge 1 && "$port" -le 65535 ]]
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          validate_key(){ local source="$1" target="$HOME/.ssh/id_pc_prod" pub; tr -d '\r' < "$source" > "$target"; chmod 600 "$target"; grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1; pub="$(mktemp)"; ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"; }
          try_slot(){ local raw="$1" a b c; [[ -n "$raw" ]] || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}"
          scan="$(mktemp)"; match="$(mktemp)"; pinned=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" == "$expected" ]] && printf '%s\n' "$line" >> "$match"; done < "$scan"
            sort -u -o "$match" "$match"; [[ "$(grep -c . "$match" || true)" == 1 ]] && { pinned=1; break; }; (( attempt == 3 )) || sleep "$attempt"
          done
          rm -f "$scan"; [[ "$pinned" == 1 ]]; mv "$match" "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" 'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo READY' | grep -Fxq READY
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"; echo "user=$user" >> "$GITHUB_OUTPUT"

      - name: Prove the running web revision is stale
        if: steps.admit.outputs.eligible == 'YES'
        id: production
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          USER: ${{ steps.ssh.outputs.user }}
        run: |
          set -euo pipefail
          mapfile -t running_web < <(ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "docker ps -q --filter 'label=com.docker.compose.service=web' | sort -u")
          [[ "${#running_web[@]}" == 1 ]]
          web_id="${running_web[0]}"
          revision="$(ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "docker inspect --format '{{.Image}}' '$web_id' | xargs docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}'")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$revision^{commit}"
          if git merge-base --is-ancestor "$MIN_BOUNDARY_COMMIT" "$revision"; then
            echo 'stale=NO' >> "$GITHUB_OUTPUT"
          else
            echo 'stale=YES' >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Refuse release when production already contains the boundary
        if: steps.admit.outputs.eligible == 'YES' && steps.production.outputs.stale != 'YES'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.TARGET_ISSUE),
              body: [
                '## Company OS release recovery refused',
                '',
                `- Running web revision: \`${{ steps.production.outputs.revision }}\``,
                '- Boundary ancestry: **PRESENT**',
                '- Reason: an application release is not justified by the observed failure.',
                '- Production mutation by recovery: **NONE**',
              ].join('\n'),
            });

      - name: Discover exact release-authority workflow
        if: steps.admit.outputs.eligible == 'YES' && steps.production.outputs.stale == 'YES'
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const entries = await github.paginate(github.rest.repos.getContent, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/workflows',
              ref: 'main',
              per_page: 100,
            });
            const yamlEntries = entries.filter((entry) => entry.type === 'file' && /\.ya?ml$/i.test(entry.name));
            const candidates = [];
            for (const entry of yamlEntries) {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: entry.path,
                ref: 'main',
              });
              if (Array.isArray(response.data) || !response.data.content) continue;
              const text = Buffer.from(response.data.content, response.data.encoding || 'base64').toString('utf8');
              const authority = /(?:TARGET_ISSUE|RELEASE_ISSUE)[^\n]*['\"]?3072['\"]?|issue\.number\s*==\s*3072|#3072/i.test(text);
              const fullStack = /(production|REG\.RU)[\s\S]{0,100}(full[ -]?stack|release)|full[ -]?stack[\s\S]{0,100}(production|REG\.RU)/i.test(text);
              const dispatch = /workflow_dispatch\s*:/i.test(text);
              if (authority && fullStack && dispatch) candidates.push({ id: entry.name, path: entry.path, text });
            }
            if (candidates.length !== 1) {
              core.setFailed(`Expected one exact #3072 full-stack workflow_dispatch authority, found ${candidates.map((c) => c.path).join(', ') || 'none'}`);
              return;
            }
            core.setOutput('workflow_id', candidates[0].id);
            core.setOutput('workflow_path', candidates[0].path);

      - name: Dispatch exact-main full-stack release
        if: steps.admit.outputs.eligible == 'YES' && steps.production.outputs.stale == 'YES'
        id: dispatch
        uses: actions/github-script@v7
        env:
          WORKFLOW_ID: ${{ steps.release.outputs.workflow_id }}
        with:
          script: |
            const main = await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: 'main' });
            const sha = main.data.sha;
            const workflowId = process.env.WORKFLOW_ID;
            const attempts = [
              {},
              { target_sha: sha },
              { sha },
              { commit_sha: sha },
              { release_sha: sha },
              { target_sha: sha, issue_number: process.env.RELEASE_ISSUE },
              { sha, issue_number: process.env.RELEASE_ISSUE },
              { target_sha: sha, authority_issue: process.env.RELEASE_ISSUE },
              { sha, authority_issue: process.env.RELEASE_ISSUE },
              { target_sha: sha, confirm: 'true' },
              { sha, confirm: 'true' },
              { target_sha: sha, environment: 'production' },
              { sha, environment: 'production' },
            ];
            let accepted = null;
            for (const inputs of attempts) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowId,
                  ref: 'main',
                  inputs,
                });
                accepted = inputs;
                break;
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            if (accepted === null) {
              core.setFailed('Exact #3072 workflow found but none of the bounded dispatch contracts was accepted.');
              return;
            }
            core.setOutput('main_sha', sha);
            core.setOutput('dispatched_at', new Date().toISOString());
            core.notice(`Accepted release dispatch input keys: ${Object.keys(accepted).join(', ') || 'none'}`);

      - name: Wait for exact release completion
        if: steps.admit.outputs.eligible == 'YES' && steps.production.outputs.stale == 'YES'
        id: wait
        uses: actions/github-script@v7
        env:
          WORKFLOW_ID: ${{ steps.release.outputs.workflow_id }}
          TARGET_SHA: ${{ steps.dispatch.outputs.main_sha }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        with:
          script: |
            let selected = null;
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: process.env.WORKFLOW_ID,
                event: 'workflow_dispatch',
                per_page: 30,
              });
              selected = response.data.workflow_runs
                .filter((run) => run.created_at >= process.env.DISPATCHED_AT)
                .filter((run) => run.head_sha === process.env.TARGET_SHA)
                .sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)))
                .at(-1) || null;
              if (selected && selected.status === 'completed') break;
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            if (!selected || selected.status !== 'completed') {
              core.setFailed('Exact-main release run was not observed as completed within 30 minutes.');
              return;
            }
            if (selected.conclusion !== 'success') {
              core.setFailed(`Exact-main release run ${selected.id} concluded ${selected.conclusion}.`);
              return;
            }
            core.setOutput('run_id', String(selected.id));

      - name: Re-run the owner-authorized cutover after successful release
        if: steps.admit.outputs.eligible == 'YES' && steps.production.outputs.stale == 'YES'
        uses: actions/github-script@v7
        env:
          FAILED_RUN_ID: ${{ steps.admit.outputs.failed_run_id }}
        with:
          script: |
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.FAILED_RUN_ID),
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.TARGET_ISSUE),
              body: [
                '## Company OS stale-boundary recovery dispatched',
                '',
                `- Previous running web revision: \`${{ steps.production.outputs.revision }}\``,
                `- Exact release main: \`${{ steps.dispatch.outputs.main_sha }}\``,
                `- Release run: ${{ steps.wait.outputs.run_id }}`,
                `- Re-run cutover: ${{ steps.admit.outputs.failed_run_id }}`,
                '- New mandatory cost: **0 ₽**',
              ].join('\n'),
            });
