name: Temporary force-cancel stale PR5631 retries v3

on:
  push:
    branches:
      - ops/cancel-stale-pr5631-6b56-20260926

permissions:
  actions: write
  contents: read

jobs:
  drain-stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Drain stale retry queue only
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_SHA: '6b56b156a87865aac92e4492accf0d5e6686682c'
          CURRENT_SHA: '6e0d75d02fa7747ccd4da3309f45d21792d29153'
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/5631" --jq .head.sha)"
          [[ "$current" == "$CURRENT_SHA" ]]

          for run_id in 36264044057 36264044086 36264044097 36264043980 36264043959; do
            echo "draining stale run $run_id"
            drained=0
            for attempt in $(seq 1 60); do
              run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              head_sha="$(jq -r '.head_sha' <<<"$run")"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              [[ "$head_sha" == "$STALE_SHA" ]] || { echo "refusing mismatched run $run_id" >&2; exit 31; }

              if [[ "$status" == completed ]]; then
                echo "stale run $run_id terminal: $conclusion"
                drained=1
                break
              fi

              set +e
              response="$(gh api --method POST                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" 2>&1)"
              rc=$?
              set -e

              if [[ $rc -eq 0 ]]; then
                echo "force-cancel accepted for stale run $run_id"
              elif grep -q 'has not yet queued' <<<"$response"; then
                echo "stale run $run_id not cancelable yet; attempt $attempt/60"
                sleep 5
                continue
              else
                printf '%s\n' "$response" >&2
                exit 32
              fi

              for settle in $(seq 1 30); do
                status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)"
                if [[ "$status" == completed ]]; then
                  echo "stale run $run_id drained"
                  drained=1
                  break
                fi
                sleep 2
              done
              [[ $drained -eq 1 ]] && break
            done
            [[ $drained -eq 1 ]] || { echo "stale run $run_id did not drain in time" >&2; exit 33; }
          done
