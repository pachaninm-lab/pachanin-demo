name: Temporary canonical production mobile dispatcher

on:
  push:
    branches:
      - ops/tmp-production-mobile-dispatch-20260926-35ce384

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 35ce3841f15572bfcba7c8d7e03afb858da0888d
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" == "$TARGET_SHA" ]]
          echo "exact main verified: $TARGET_SHA"

      - name: Dispatch canonical production mobile acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 35ce3841f15572bfcba7c8d7e03afb858da0888d
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/mobile-dispatch.json"
          printf '{"ref":"main","inputs":{"target_sha":"%s"}}\n' "$TARGET_SHA" > "$payload"
          gh api --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "repos/$GITHUB_REPOSITORY/actions/workflows/platform-v7-production-mobile-acceptance.yml/dispatches"             --input "$payload"
          echo "canonical mobile workflow dispatched for $TARGET_SHA"
