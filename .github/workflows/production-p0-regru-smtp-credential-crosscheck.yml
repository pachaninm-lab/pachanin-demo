name: Production P0 REG.RU SMTP Credential Cross-check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-regru-smtp-credential-crosscheck.yml'
      - 'docs/platform-v7/autopilot/scopes/production-p0-regru-smtp-credential-crosscheck-3785.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-regru-smtp-credential-crosscheck
  cancel-in-progress: false

env:
  RELEASE_ISSUE_NUMBER: 3072
  SMTP_HOST: mail.hosting.reg.ru
  SMTP_PORT: '465'
  SMTP_USER: access@xn----8sbjf4befbjgs9b.xn--p1ai
  EVIDENCE_DIR: artifacts/production-p0-regru-smtp-credential-crosscheck

jobs:
  contract:
    name: Validate bounded SMTP credential cross-check contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-regru-smtp-credential-crosscheck current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate fail-closed contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          workflow = Path('.github/workflows/production-p0-regru-smtp-credential-crosscheck.yml').read_text(encoding='utf-8')
          scope = json.loads(Path('docs/platform-v7/autopilot/scopes/production-p0-regru-smtp-credential-crosscheck-3785.json').read_text(encoding='utf-8'))
          assert scope['schemaVersion'] == 'platform-v7.concurrent-scope.v1'
          assert scope['branch'] == 'fix/p0-regru-single-credential-crosscheck-3785'
          assert scope['issue'] == 3785 and scope['releaseIssue'] == 3072
          assert scope['productionHosting'] == 'REG_RU_EXISTING_INFRASTRUCTURE_ONLY'
          assert set(scope['allowedPaths']) == {
              '.github/workflows/production-p0-regru-smtp-credential-crosscheck.yml',
              'docs/platform-v7/autopilot/scopes/production-p0-regru-smtp-credential-crosscheck-3785.json',
          }
          b = scope['boundaries']
          assert b['productionMutation'] == 'NONE'
          assert b['emailMutation'] is False and b['runtimeFileMutation'] is False
          assert b['databaseMutation'] is False and b['deploymentMutation'] is False
          assert b['credentialOutput'] is False and b['piiOutput'] is False
          assert b['ownerOnly'] is True and b['exactMainGuard'] is True
          assert b['singleCredentialAttempt'] is True and b['newRecurringCostRub'] == 0
          crosscheck = workflow.split('\n  crosscheck:\n', 1)[1]
          for forbidden in ('send_message(', 'sendmail(', 'scp ', 'ssh ', 'docker ', 'curl '):
              assert forbidden not in crosscheck
          assert 'client.login(user, password)' in crosscheck
          assert 'secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD' in crosscheck
          PY
          GITHUB_HEAD_REF=fix/p0-regru-single-credential-crosscheck-3785 BASE_REF=origin/main bash scripts/p7-autopilot-guard.sh
      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  crosscheck:
    name: Test one protected password against canonical platform SMTP login
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != '' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-regru-smtp-credential-crosscheck current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      CANDIDATE_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact current-main checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
      - name: Perform one auth-only credential cross-check
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          [[ -n "${CANDIDATE_PASSWORD:-}" && "$CANDIDATE_PASSWORD" != *$'\n'* && "$CANDIDATE_PASSWORD" != *$'\r'* ]]
          python3 - "$EVIDENCE_DIR/result.txt" <<'PY'
          import os, smtplib, ssl, sys
          host = os.environ['SMTP_HOST']
          port = int(os.environ['SMTP_PORT'])
          user = os.environ['SMTP_USER']
          password = os.environ['CANDIDATE_PASSWORD']
          result = 'ERROR'
          try:
              with smtplib.SMTP_SSL(host, port, timeout=12, context=ssl.create_default_context()) as client:
                  client.login(user, password)
              result = 'MATCH'
          except smtplib.SMTPAuthenticationError:
              result = 'NO_MATCH'
          except Exception:
              result = 'ERROR'
          with open(sys.argv[1], 'w', encoding='ascii') as handle:
              handle.write(f'SMTP_CREDENTIAL_CROSSCHECK={result}\n')
              handle.write('PRODUCTION_MUTATION=NONE\n')
          if result == 'ERROR':
              raise SystemExit(41)
          PY
      - name: Reconfirm exact main
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-regru-smtp-credential-crosscheck-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
      - name: Publish bounded result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          result=ERROR
          if [[ -f "$EVIDENCE_DIR/result.txt" ]]; then
            result="$(sed -n 's/^SMTP_CREDENTIAL_CROSSCHECK=//p' "$EVIDENCE_DIR/result.txt" | tail -n1)"
          fi
          [[ "$result" =~ ^(MATCH|NO_MATCH|ERROR)$ ]] || result=ERROR
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Production P0 REG.RU SMTP credential cross-check: exact-main=$TARGET_SHA result=$result attempt-count=1 email-sent=NO production-mutation=NONE credential-and-protocol=NOT_PUBLISHED new-recurring-cost=0-RUB" >/dev/null
      - name: Enforce bounded result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Eq '^SMTP_CREDENTIAL_CROSSCHECK=(MATCH|NO_MATCH)$' "$EVIDENCE_DIR/result.txt"
          grep -Fxq 'PRODUCTION_MUTATION=NONE' "$EVIDENCE_DIR/result.txt"
