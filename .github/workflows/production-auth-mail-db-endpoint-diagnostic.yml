name: Production Auth-Mail DB Endpoint Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-auth-mail-db-endpoint-diagnostic.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-auth-mail-db-endpoint-diagnostic
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  SUBJECT_PRODUCTION_SHA: 033964e2e553c595482b774784cf808815eccbc7
  DIAGNOSTIC_COMMAND: /production p0-auth-mail-db-endpoint current-main
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate read-only DB endpoint diagnostic contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce diagnostic-only surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/production-auth-mail-db-endpoint-diagnostic.yml').read_text(encoding='utf-8')
          required=[
            'SUBJECT_PRODUCTION_SHA: 033964e2e553c595482b774784cf808815eccbc7',
            'DIAGNOSTIC_COMMAND: /production p0-auth-mail-db-endpoint current-main',
            'PRODUCTION_MUTATION NONE',
            'DB_ENDPOINT_KIND',
            'AUTH_ENDPOINT_PARITY',
            'CURRENT_CREDENTIAL_LOGIN',
            'PRISMA_CONNECT_CLASS',
            'WORKER_API_SHARED_NETWORK',
            'LOCAL_ROLE_CONTRACT',
          ]
          missing=[m for m in required if m not in text]
          if missing: raise SystemExit('missing diagnostic invariant: '+' | '.join(missing))
          diagnostic=text.split('\n  diagnostic:\n',1)[1]
          forbidden=[
            'ALTER ROLE', 'CREATE ROLE', 'DROP ROLE', 'rotate-db', 'rotate-smtp', 'rotate-key',
            'docker compose up', 'docker restart', 'docker rm', 'docker run', 'password-reset',
            'PASSWORD_RESET_REPLAYED YES', 'PRODUCTION_MUTATION DB_',
          ]
          bad=[m for m in forbidden if m in diagnostic]
          if bad: raise SystemExit('mutation surface forbidden: '+' | '.join(bad))
          PY

  diagnostic:
    name: Read-only auth-mail DB endpoint and Prisma classifier
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-db-endpoint current-main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind diagnostic main and immutable production subject
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          diagnostic_main_sha="$(git rev-parse origin/main)"
          [[ "$diagnostic_main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$diagnostic_main_sha" ]]
          git cat-file -e "${SUBJECT_PRODUCTION_SHA}^{commit}"
          git merge-base --is-ancestor "$SUBJECT_PRODUCTION_SHA" "$diagnostic_main_sha"
          git diff --quiet "$SUBJECT_PRODUCTION_SHA..$diagnostic_main_sha" -- \
            apps/api/src/auth-mail-worker.ts \
            apps/api/prisma/migrations/20260812010000_p0_industrial_auth_mail_outbox/migration.sql \
            scripts/provision-production-auth-mail-runtime.sh \
            scripts/production-auth-mail-outbox-cutover-core.sh
          echo "diagnostic_main_sha=$diagnostic_main_sha" >> "$GITHUB_OUTPUT"
          echo "subject_sha=$SUBJECT_PRODUCTION_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || exit 10
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"; ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"; pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              [[ "$(grep -c . "$match" || true)" == 1 ]] && { pinned_ready=1; break; }
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; python3 --version >/dev/null; echo SSH_AUTH_OK' | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Classify endpoint, network and Prisma connection without mutation
        id: diagnostic
        shell: bash
        env:
          SUBJECT_SHA: ${{ steps.target.outputs.subject_sha }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"; clean="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$SUBJECT_SHA'" > "$raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          subject_sha="$1"
          runtime_root='/var/lib/pc-secret-authority/runtime'
          db_file="$runtime_root/database-url"
          tmp_root="$(mktemp -d /tmp/pc-auth-mail-db-endpoint.XXXXXX)"
          cleanup(){ rm -rf -- "$tmp_root"; }
          trap cleanup EXIT
          emit(){ printf '%s=%s\n' "$1" "$2"; }
          fail(){ emit AUTH_MAIL_DB_ENDPOINT_DIAGNOSTIC FAIL; emit ERROR_CODE "$1"; emit PRODUCTION_MUTATION NONE; exit "${2:-1}"; }
          [[ "$(id -u)" -eq 0 ]] || fail ROOT_REQUIRED 20
          [[ "$subject_sha" =~ ^[0-9a-f]{40}$ ]] || fail SUBJECT_SHA_INVALID 21
          [[ -f "$db_file" && ! -L "$db_file" && "$(stat -c '%a:%u:%g' "$db_file")" == '444:0:0' ]] || fail DB_RUNTIME_FILE_INVALID 22

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || fail WEB_CARDINALITY 23
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "${web_ids[0]}")"
          [[ -n "$project" ]] || fail PROJECT_MISSING 24
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} == 1 )) || fail API_CARDINALITY 25
          api_id="${api_ids[0]}"; web_id="${web_ids[0]}"
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")" == "$subject_sha" ]] || fail API_REVISION_DRIFT 26
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")" == "$subject_sha" ]] || fail WEB_REVISION_DRIFT 27

          subject_workers=()
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$candidate" 2>/dev/null || true)" == "$subject_sha" ]] && subject_workers+=("$candidate")
          done < <(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker')
          (( ${#subject_workers[@]} == 1 )) || fail WORKER_CARDINALITY 28
          worker_id="${subject_workers[0]}"

          mapfile -t pg_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" | while read -r id; do
            image="$(docker inspect --format '{{.Config.Image}}' "$id" 2>/dev/null || true)"
            service="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$id" 2>/dev/null || true)"
            if [[ "$image" == postgres:* || "$image" == */postgres:* || "$service" == postgres || "$service" == db || "$service" == database ]]; then printf '%s\n' "$id"; fi
          done)
          (( ${#pg_ids[@]} == 1 )) || fail POSTGRES_CARDINALITY 29
          pg_id="${pg_ids[0]}"
          pool_ids=()
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            image="$(docker inspect --format '{{.Config.Image}}' "$id" 2>/dev/null || true)"
            service="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$id" 2>/dev/null || true)"
            low="${image,,}:${service,,}"
            [[ "$low" == *pgbouncer* ]] && pool_ids+=("$id")
          done < <(docker ps -q --filter "label=com.docker.compose.project=$project")

          api_auth_file="$tmp_root/api-auth-url"; chmod 600 "$api_auth_file"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$api_id" | sed -n 's/^AUTH_DATABASE_URL=//p' | head -1 > "$api_auth_file"
          [[ -s "$api_auth_file" ]] || fail API_AUTH_URL_MISSING 30

          endpoint_script="$tmp_root/classify.py"
          cat > "$endpoint_script" <<'PY'
          import json, subprocess, sys
          from urllib.parse import urlsplit, unquote, parse_qsl
          db_file, api_file, worker_id, api_id, pg_id, *pool_ids = sys.argv[1:]
          worker_raw=open(db_file,encoding='utf-8').read().strip()
          api_raw=open(api_file,encoding='utf-8').read().strip()
          wu=urlsplit(worker_raw); au=urlsplit(api_raw)
          if wu.scheme not in ('postgres','postgresql') or au.scheme not in ('postgres','postgresql'): raise SystemExit(2)
          if unquote(wu.username or '') != 'pc_auth_mail_runtime' or not wu.password: raise SystemExit(3)
          def inspect(cid):
              return json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
          wi, ai, pi = inspect(worker_id), inspect(api_id), inspect(pg_id)
          pools=[inspect(x) for x in pool_ids]
          def networks(obj): return set((obj.get('NetworkSettings') or {}).get('Networks') or {})
          def names(obj):
              out=set()
              name=str(obj.get('Name') or '').lstrip('/').lower()
              if name: out.add(name)
              labels=(obj.get('Config') or {}).get('Labels') or {}
              service=str(labels.get('com.docker.compose.service') or '').lower()
              if service: out.add(service)
              for data in ((obj.get('NetworkSettings') or {}).get('Networks') or {}).values():
                  ip=str(data.get('IPAddress') or '').lower()
                  if ip: out.add(ip)
                  for alias in data.get('Aliases') or []: out.add(str(alias).lower())
              return out
          host=(wu.hostname or '').lower(); port=wu.port or 5432
          if host in {'localhost','127.0.0.1','::1'}: kind='LOOPBACK'
          elif host in names(pi): kind='POSTGRES'
          elif any(host in names(x) for x in pools): kind='PGBOUNCER'
          else: kind='OTHER'
          parity=(wu.hostname or '').lower()==(au.hostname or '').lower() and (wu.port or 5432)==(au.port or 5432) and wu.path==au.path and sorted(parse_qsl(wu.query))==sorted(parse_qsl(au.query))
          shared_api=bool(networks(wi)&networks(ai))
          backend = pi if kind=='POSTGRES' else next((x for x in pools if host in names(x)), None)
          shared_backend='NA' if backend is None else ('PASS' if networks(wi)&networks(backend) else 'FAIL')
          print('WORKER_DB_USER=PASS')
          print('AUTH_ENDPOINT_PARITY='+('PASS' if parity else 'FAIL'))
          print('DB_ENDPOINT_KIND='+kind)
          print('DB_PORT_CLASS='+('POSTGRES_DEFAULT' if port==5432 else 'NONDEFAULT'))
          print('WORKER_API_SHARED_NETWORK='+('PASS' if shared_api else 'FAIL'))
          print('WORKER_DB_BACKEND_SHARED_NETWORK='+shared_backend)
          PY
          endpoint_out="$tmp_root/endpoint.out"
          python3 "$endpoint_script" "$db_file" "$api_auth_file" "$worker_id" "$api_id" "$pg_id" "${pool_ids[@]:-}" > "$endpoint_out" || fail ENDPOINT_CLASSIFIER_FAILED 31
          cat "$endpoint_out"

          target_db="$(python3 - "$db_file" <<'PY'
          from urllib.parse import urlsplit,unquote
          import sys
          u=urlsplit(open(sys.argv[1],encoding='utf-8').read().strip())
          db=unquote(u.path.lstrip('/'))
          if not db or any(c in db for c in '\r\n\0'): raise SystemExit(1)
          print(db)
          PY
          )" || fail DB_NAME_CLASSIFY_FAILED 32
          postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$pg_id" | sed -n 's/^POSTGRES_USER=//p' | head -1)"
          [[ -n "$postgres_user" ]] || postgres_user=postgres
          role_meta="$(docker exec "$pg_id" psql -X -qAt -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$target_db" -c "SELECT rolcanlogin||'|'||rolsuper||'|'||rolbypassrls||'|'||rolinherit||'|'||(rolpassword IS NOT NULL)||'|'||has_database_privilege('pc_auth_mail_runtime',current_database(),'CONNECT')||'|'||has_schema_privilege('pc_auth_mail_runtime','auth','USAGE')||'|'||has_table_privilege('pc_auth_mail_runtime','auth.mail_outbox','SELECT') FROM pg_authid WHERE rolname='pc_auth_mail_runtime';" 2>/dev/null)" || fail ROLE_METADATA_QUERY_FAILED 33
          if [[ "$role_meta" == 'true|false|false|false|true|true|true|true' || "$role_meta" == 't|f|f|f|t|t|t|t' ]]; then emit LOCAL_ROLE_CONTRACT PASS; else emit LOCAL_ROLE_CONTRACT FAIL; fi

          login_raw="$tmp_root/login.out"; login_err="$tmp_root/login.err"; chmod 600 "$login_raw" "$login_err"
          set +e
          python3 - "$db_file" <<'PY' | docker exec -i "$pg_id" env PGCONNECT_TIMEOUT=5 psql -X -qAt -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$target_db" >"$login_raw" 2>"$login_err"
          import sys
          raw=open(sys.argv[1],encoding='utf-8').read().strip()
          print('\\connect '+raw)
          print('SELECT current_user;')
          PY
          login_rc=$?
          set -e
          if [[ "$login_rc" == 0 ]] && grep -Fxq pc_auth_mail_runtime "$login_raw"; then
            emit CURRENT_CREDENTIAL_LOGIN PASS
          elif grep -Eqi 'password authentication failed|authentication failed' "$login_err"; then emit CURRENT_CREDENTIAL_LOGIN AUTH_FAILED
          elif grep -Eqi 'no pg_hba.conf entry' "$login_err"; then emit CURRENT_CREDENTIAL_LOGIN HBA_DENIED
          elif grep -Eqi 'does not exist' "$login_err"; then emit CURRENT_CREDENTIAL_LOGIN ROLE_OR_DATABASE_MISSING
          elif grep -Eqi 'permission denied for database' "$login_err"; then emit CURRENT_CREDENTIAL_LOGIN CONNECT_DENIED
          elif grep -Eqi 'could not translate host name|Name or service not known' "$login_err"; then emit CURRENT_CREDENTIAL_LOGIN DNS_FAILED
          elif grep -Eqi 'connection refused|could not connect|timeout expired|timed out' "$login_err"; then emit CURRENT_CREDENTIAL_LOGIN NETWORK_FAILED
          elif grep -Eqi 'SSL|TLS|certificate' "$login_err"; then emit CURRENT_CREDENTIAL_LOGIN TLS_FAILED
          else emit CURRENT_CREDENTIAL_LOGIN OTHER_FAILED
          fi

          prisma_script="$tmp_root/prisma-probe.js"; chmod 600 "$prisma_script"
          python3 - "$db_file" > "$prisma_script" <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding='utf-8').read().strip()
          print("const {PrismaClient}=require('@prisma/client');")
          print('const url='+json.dumps(raw)+';')
          print("const p=new PrismaClient({datasources:{db:{url}}});")
          print("(async()=>{try{await p.$connect();const rows=await p.$queryRawUnsafe('SELECT current_user');if(rows?.[0]?.current_user!=='pc_auth_mail_runtime')process.stdout.write('PRISMA_CONNECT_CLASS=WRONG_PRINCIPAL\\n');else process.stdout.write('PRISMA_CONNECT_CLASS=PASS\\n')}catch(e){const c=String(e?.errorCode||e?.code||e?.name||'UNKNOWN').replace(/[^A-Za-z0-9_]/g,'_').toUpperCase().slice(0,80);process.stdout.write('PRISMA_CONNECT_CLASS='+c+'\\n')}finally{await p.$disconnect().catch(()=>{})}})();")
          PY
          prisma_out="$tmp_root/prisma.out"
          docker exec -i "$api_id" /nodejs/bin/node --input-type=commonjs - < "$prisma_script" > "$prisma_out" 2>/dev/null || true
          prisma_class="$(sed -nE 's/^PRISMA_CONNECT_CLASS=([A-Z0-9_]{1,80})$/\1/p' "$prisma_out" | head -1)"
          [[ -n "$prisma_class" ]] || prisma_class=NO_SAFE_RESULT
          emit PRISMA_CONNECT_CLASS "$prisma_class"

          emit AUTH_MAIL_DB_ENDPOINT_DIAGNOSTIC PASS
          emit ERROR_CODE NONE
          emit PRODUCTION_MUTATION NONE
          REMOTE
          remote_rc=$?
          set -e
          sed -nE '/^(AUTH_MAIL_DB_ENDPOINT_DIAGNOSTIC|ERROR_CODE|WORKER_DB_USER|AUTH_ENDPOINT_PARITY|DB_ENDPOINT_KIND|DB_PORT_CLASS|WORKER_API_SHARED_NETWORK|WORKER_DB_BACKEND_SHARED_NETWORK|LOCAL_ROLE_CONTRACT|CURRENT_CREDENTIAL_LOGIN|PRISMA_CONNECT_CLASS|PRODUCTION_MUTATION)=[A-Za-z0-9_.:-]{1,160}$/p' "$raw" > "$clean"
          rm -f "$raw"; cat "$clean"; echo "rc=$remote_rc" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r key value; do
            case "$key" in AUTH_MAIL_DB_ENDPOINT_DIAGNOSTIC|ERROR_CODE|WORKER_DB_USER|AUTH_ENDPOINT_PARITY|DB_ENDPOINT_KIND|DB_PORT_CLASS|WORKER_API_SHARED_NETWORK|WORKER_DB_BACKEND_SHARED_NETWORK|LOCAL_ROLE_CONTRACT|CURRENT_CREDENTIAL_LOGIN|PRISMA_CONNECT_CLASS|PRODUCTION_MUTATION) echo "${key,,}=$value" >> "$GITHUB_OUTPUT";; esac
          done < "$clean"
          rm -f "$clean"

      - name: Publish sanitized endpoint evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ steps.target.outputs.subject_sha }}
          REMOTE_RC: ${{ steps.diagnostic.outputs.rc }}
          DIAGNOSTIC: ${{ steps.diagnostic.outputs.auth_mail_db_endpoint_diagnostic }}
          ERROR_CODE: ${{ steps.diagnostic.outputs.error_code }}
          WORKER_DB_USER: ${{ steps.diagnostic.outputs.worker_db_user }}
          AUTH_ENDPOINT_PARITY: ${{ steps.diagnostic.outputs.auth_endpoint_parity }}
          DB_ENDPOINT_KIND: ${{ steps.diagnostic.outputs.db_endpoint_kind }}
          DB_PORT_CLASS: ${{ steps.diagnostic.outputs.db_port_class }}
          WORKER_API_SHARED_NETWORK: ${{ steps.diagnostic.outputs.worker_api_shared_network }}
          WORKER_DB_BACKEND_SHARED_NETWORK: ${{ steps.diagnostic.outputs.worker_db_backend_shared_network }}
          LOCAL_ROLE_CONTRACT: ${{ steps.diagnostic.outputs.local_role_contract }}
          CURRENT_CREDENTIAL_LOGIN: ${{ steps.diagnostic.outputs.current_credential_login }}
          PRISMA_CONNECT_CLASS: ${{ steps.diagnostic.outputs.prisma_connect_class }}
          PRODUCTION_MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP auth-mail DB endpoint diagnostic'
            echo
            echo "- production subject SHA: \`${SUBJECT_SHA:-unknown}\`"
            echo "- diagnostic: \`${DIAGNOSTIC:-unknown}\` (rc=\`${REMOTE_RC:-unknown}\`)"
            echo "- safe error code: \`${ERROR_CODE:-unknown}\`"
            echo "- worker DB user / API endpoint parity: \`${WORKER_DB_USER:-unknown} / ${AUTH_ENDPOINT_PARITY:-unknown}\`"
            echo "- endpoint kind / port class: \`${DB_ENDPOINT_KIND:-unknown} / ${DB_PORT_CLASS:-unknown}\`"
            echo "- worker↔API / worker↔DB-backend shared network: \`${WORKER_API_SHARED_NETWORK:-unknown} / ${WORKER_DB_BACKEND_SHARED_NETWORK:-unknown}\`"
            echo "- local PostgreSQL role contract: \`${LOCAL_ROLE_CONTRACT:-unknown}\`"
            echo "- current credential login classifier: \`${CURRENT_CREDENTIAL_LOGIN:-unknown}\`"
            echo "- Prisma connect classifier: \`${PRISMA_CONNECT_CLASS:-unknown}\`"
            echo "- production mutation: \`${PRODUCTION_MUTATION:-unknown}\`"
            echo '- hostnames, database names, URLs, passwords/hashes, container IDs, raw errors and mail/reviewer credentials are never published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Enforce read-only diagnostic result
        shell: bash
        env:
          REMOTE_RC: ${{ steps.diagnostic.outputs.rc }}
          DIAGNOSTIC: ${{ steps.diagnostic.outputs.auth_mail_db_endpoint_diagnostic }}
          PRODUCTION_MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          [[ "${REMOTE_RC:-1}" == 0 ]]
          [[ "$DIAGNOSTIC" == PASS ]]
          [[ "$PRODUCTION_MUTATION" == NONE ]]
