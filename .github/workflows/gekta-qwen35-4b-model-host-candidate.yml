          owned_fd = os.open(os.devnull, os.O_RDONLY)
          with contextlib.ExitStack() as stack:
              stack.enter_context(mock.patch.object(module.os, 'pidfd_open', return_value=owned_fd))
              stack.enter_context(mock.patch.object(module, 'pidfd_exited', return_value=False))
              stack.enter_context(mock.patch.object(module, 'candidate_guard_process_matches', return_value=True))
              stack.enter_context(mock.patch.object(module, 'candidate_process_matches', return_value=False))
              stack.enter_context(mock.patch.object(module.os, 'getpgid', return_value=424242))
              fd = module.open_owned_candidate_pidfd(424242)
              if fd != owned_fd:
                  raise AssertionError('transitional guard was not accepted as owned')
              os.close(fd)

          print('QWEN35_OWNERSHIP_REGRESSION=PASS')
          PY
      - name: Prove bounded startup diagnostic confidentiality
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import ast
          import contextlib
          import importlib.util
          import io
          import os
          import pathlib
          import subprocess
          import textwrap
          import tempfile
          import unittest
          from unittest import mock

          path = pathlib.Path('scripts/gekta-qwen35-4b-model-host-candidate.py').resolve()
          spec = importlib.util.spec_from_file_location('qwen35_diagnostic_contract', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          class StartupDiagnosticContract(unittest.TestCase):
              def setUp(self):
                  self.tmp = tempfile.TemporaryDirectory()
                  self.addCleanup(self.tmp.cleanup)
                  self.root = pathlib.Path(self.tmp.name)
                  self.log_path = self.root / 'candidate.log'
                  patch = mock.patch.object(module, 'LOG_PATH', self.log_path)
                  patch.start()
                  self.addCleanup(patch.stop)

              def opened(self):
                  log, cursor = module.open_candidate_log()
                  self.addCleanup(log.close)
                  return log, cursor

              def test_closed_classification_vocabulary(self):
                  cases = (
                      (b'', 'no_log'),
                      (b'private-key-not-for-output', 'unclassified'),
                      (b'error loading model: unknown model architecture: secret-value', 'model_architecture_unsupported'),
                      (b'error loading model: unknown pre-tokenizer type: secret-value', 'tokenizer_unsupported'),
                      (b'gguf_init_from_file: invalid magic secret-value', 'model_format_error'),
                      (b'error while loading shared libraries: /private/secret-value', 'runtime_library_error'),
                      (b'failed to allocate secret-value bytes', 'allocation_failure'),
                      (b'address already in use secret-value', 'bind_failure'),
                      (b'error: invalid argument: --secret-value', 'argument_rejected'),
                      (b'error loading model /private/secret-value', 'model_load_error'),
                      (b'address already in use\nfailed to allocate secret-value', 'multiple_errors'),
                  )
                  for raw, expected in cases:
                      with self.subTest(expected=expected):
                          self.assertEqual(module.classify_start_log(raw), expected)
                          self.assertIn(expected, module.START_LOG_CLASSES)
                  for bad in (None, '', [], bytearray(b'unknown model architecture:'), b'x' * (module.START_LOG_LIMIT + 1)):
                      with self.subTest(kind=type(bad).__name__):
                          self.assertEqual(module.classify_start_log(bad), 'log_unavailable')

              def test_does_not_reuse_historical_attempt_or_emit_secret(self):
                  self.log_path.write_bytes(b'error loading model: unknown model architecture: OLD_PRIVATE\n')
                  log, cursor = self.opened()
                  log.write(b'new attempt PRIVATE_SENTINEL\n')
                  out = io.StringIO()
                  with contextlib.redirect_stdout(out):
                      module.emit_candidate_start_diagnostic(log, cursor, 'identity')
                  self.assertIn('START_LOG_CLASS=unclassified\n', out.getvalue())
                  self.assertNotIn('PRIVATE', out.getvalue())
                  self.assertNotIn('architecture', out.getvalue())
                  self.assertEqual(len(out.getvalue().splitlines()), 4)
                  self.assertEqual(os.fstat(log.fileno()).st_mode & 0o777, 0o600)

              def test_read_bound_and_partial_line(self):
                  log, cursor = self.opened()
                  log.write(b'x' * (module.START_LOG_LIMIT + 2))
                  self.assertEqual(module.candidate_start_diagnostic(log, cursor), ('unclassified', module.START_LOG_LIMIT, 1))
                  log.write(b'\nerror loading model: unknown model architecture: PRIVATE\n')
                  self.assertEqual(module.candidate_start_diagnostic(log, cursor), ('model_architecture_unsupported', module.START_LOG_LIMIT, 1))

              def test_path_replacement_cannot_redirect_read(self):
                  log, cursor = self.opened()
                  log.write(b'owned attempt\n')
                  self.log_path.rename(self.root / 'held.log')
                  self.log_path.write_bytes(b'unknown model architecture: FOREIGN_SECRET\n')
                  self.assertEqual(module.candidate_start_diagnostic(log, cursor), ('unclassified', 14, 0))

              def test_rejects_stale_cursor_and_truncation(self):
                  self.log_path.write_bytes(b'previous\n')
                  log, cursor = self.opened()
                  self.assertEqual(module.candidate_start_diagnostic(log, (cursor[0], cursor[1] + 1, cursor[2]))[0], 'log_unavailable')
                  os.ftruncate(log.fileno(), 0)
                  self.assertEqual(module.candidate_start_diagnostic(log, cursor), ('log_unavailable', 0, 0))

              def test_rejects_changed_ownership_or_permissions(self):
                  log, cursor = self.opened()
                  with mock.patch.object(module.os, 'geteuid', return_value=os.geteuid() + 1):
                      self.assertEqual(module.candidate_start_diagnostic(log, cursor)[0], 'log_unavailable')
                  os.fchmod(log.fileno(), 0o644)
                  self.assertEqual(module.candidate_start_diagnostic(log, cursor)[0], 'log_unavailable')

              def test_rejects_symlink_hardlink_and_fifo(self):
                  other = self.root / 'other'
                  other.write_bytes(b'PRIVATE')
                  self.log_path.symlink_to(other)
                  with self.assertRaises(OSError):
                      module.open_candidate_log()
                  self.log_path.unlink()
                  os.link(other, self.log_path)
                  with self.assertRaises(module.CandidateError):
                      module.open_candidate_log()
                  self.log_path.unlink()
                  os.mkfifo(self.log_path)
                  with self.assertRaises(module.CandidateError):
                      module.open_candidate_log()
                  self.assertEqual(other.read_bytes(), b'PRIVATE')

              def test_detects_mutation_during_read(self):
                  log, cursor = self.opened()
                  log.write(b'owned\n')
                  original = os.pread
                  def changing(fd, count, offset):
                      raw = original(fd, count, offset)
                      os.ftruncate(fd, os.fstat(fd).st_size + 1)
                      return raw
                  with mock.patch.object(module.os, 'pread', side_effect=changing):
                      self.assertEqual(module.candidate_start_diagnostic(log, cursor), ('log_unavailable', 0, 0))

              def test_rejects_invalid_cursor_or_closed_fd(self):
                  log, cursor = self.opened()
                  for bad in (None, (), (1, 2), (True, 2, 3), (1, -1, 0), ('secret', 2, 3)):
                      self.assertEqual(module.candidate_start_diagnostic(log, bad), ('log_unavailable', 0, 0))
                  log.close()
                  self.assertEqual(module.candidate_start_diagnostic(log, cursor), ('log_unavailable', 0, 0))

              def test_output_failure_does_not_raise_or_leak_exception(self):
                  log, cursor = self.opened()
                  with mock.patch.object(module, 'emit', side_effect=OSError('PRIVATE')):
                      module.emit_candidate_start_diagnostic(log, cursor, 'identity')

              def test_untrusted_phase_is_not_emitted(self):
                  log, cursor = self.opened()
                  out = io.StringIO()
                  with contextlib.redirect_stdout(out):
                      module.emit_candidate_start_diagnostic(log, cursor, 'PRIVATE_PHASE')
                  self.assertNotIn('PRIVATE', out.getvalue())
                  self.assertIn('START_LOG_CLASS=log_unavailable', out.getvalue())

              def report_diagnostic(self, text):
                  workflow = pathlib.Path('.github/workflows/gekta-qwen35-4b-model-host-candidate.yml').read_text()
                  publish = workflow.split('\n      - name: Publish bounded evidence\n', 1)[1]
                  script = publish.split('        run: |\n', 1)[1]
                  lines = script.splitlines()
                  first = next(i for i, line in enumerate(lines) if line.strip().startswith('# Only fixed diagnostic vocabulary'))
                  last = next(i for i, line in enumerate(lines[first:], first) if line.strip() == 'body="$RUNNER_TEMP/qwen35-comment.md"')
                  filters = textwrap.dedent('\n'.join(lines[first:last]))
                  if text is not None:
                      (self.root / 'qwen35-start').write_text(text)
                  result = subprocess.run(
                      ['bash', '-c', 'set -Eeuo pipefail\n' + filters + '\nprintf "%s\\n%s\\n" "$start_phase" "$start_class"\n'],
                      env={**os.environ, 'RUNNER_TEMP': str(self.root)},
                      capture_output=True, text=True, timeout=5, check=True,
                  )
                  self.assertEqual(result.stderr, '')
                  return result.stdout

              def test_report_accepts_only_complete_allowlisted_lines(self):
                  out = self.report_diagnostic(
                      'QWEN35_CANDIDATE_START_PHASE=PRIVATE\n'
                      'QWEN35_CANDIDATE_START_PHASE=readiness\n'
                      'PRIVATE QWEN35_CANDIDATE_START_LOG_CLASS=allocation_failure\n'
                      'QWEN35_CANDIDATE_START_LOG_CLASS=model_load_error\n'
                      'QWEN35_CANDIDATE_START_LOG_CLASS=bind_failure PRIVATE\n'
                  )
                  self.assertEqual(out, 'QWEN35_CANDIDATE_START_PHASE=readiness\nQWEN35_CANDIDATE_START_LOG_CLASS=model_load_error\n')
                  self.assertNotIn('PRIVATE', out)

              def test_report_missing_evidence_is_not_success(self):
                  self.assertEqual(self.report_diagnostic(None), 'QWEN35_CANDIDATE_START_PHASE=not_reported\nQWEN35_CANDIDATE_START_LOG_CLASS=not_reported\n')

              def exercise_start_failure(self, cleanup_fails):
                  candidate = self.root / 'model.gguf'
                  candidate.write_bytes(b'x')
                  order = []
                  class Proc:
                      pid = 424242
                      exited = False
                      def wait(self, timeout=None):
                          order.append('child_exit')
                          self.exited = True
                          return 0
                      def poll(self):
                          return 0 if self.exited else None
                  def listener_absent():
                      order.append('listener_absent')
                      if cleanup_fails:
                          raise module.CandidateError('PRIVATE_CLEANUP_FAILURE')
                  with contextlib.ExitStack() as stack:
                      for name, value in {
                          'CANDIDATE_PATH': candidate, 'CANDIDATE_SIZE': 1, 'CANDIDATE_SHA256': 'hash',
                          'STATE_DIR': self.root, 'PID_PATH': self.root / 'candidate.pid',
                          'CANDIDATE_IDENTITY_PATH': self.root / 'identity.json',
                      }.items():
                          stack.enter_context(mock.patch.object(module, name, value))
                      for name, value in {
                          'require_nonroot': 'tai', 'sha_file': 'hash', 'ensure_start_capacity': None,
                          'save_state': None,
                          'snapshot_baseline': ({'pid': 999}, pathlib.Path('/bin/true'), [b'/bin/true'], {}),
                      }.items():
                          stack.enter_context(mock.patch.object(module, name, return_value=value))
                      stack.enter_context(mock.patch.object(module.subprocess, 'Popen', return_value=Proc()))
                      stack.enter_context(mock.patch.object(module.os, 'pidfd_open', side_effect=OSError('PRIVATE_PIDFD_FAILURE')))
                      stack.enter_context(mock.patch.object(module, 'verify_listener_absent', side_effect=listener_absent))
                      stack.enter_context(mock.patch.object(module, 'stop_watchdog', side_effect=lambda: order.append('watchdog_stop')))
                      stack.enter_context(mock.patch.object(module, 'emit_candidate_start_diagnostic', side_effect=lambda *args: order.append('diagnostic')))
                      with self.assertRaises(module.CandidateError) as raised:
                          module.start('a' * 64)
                  self.assertEqual(str(raised.exception), 'candidate_start_cleanup_failed' if cleanup_fails else 'candidate_pidfd_setup_failed')
                  return order

              def test_actual_start_preserves_error_and_diagnoses_after_cleanup(self):
                  self.assertEqual(self.exercise_start_failure(False), ['child_exit', 'listener_absent', 'watchdog_stop', 'diagnostic'])

              def test_actual_cleanup_failure_suppresses_diagnostic(self):
                  self.assertEqual(self.exercise_start_failure(True), ['child_exit', 'listener_absent'])

              def test_diagnostics_cannot_precede_cleanup_or_replace_start_error(self):
                  start = next(n for n in ast.parse(path.read_text()).body if isinstance(n, ast.FunctionDef) and n.name == 'start')
                  handler = next(n for n in ast.walk(start) if isinstance(n, ast.ExceptHandler) and n.name == 'start_error')
                  calls = [n for n in handler.body if isinstance(n, ast.Expr) and isinstance(n.value, ast.Call)]
                  self.assertEqual(len(calls), 1)
                  self.assertEqual(calls[0].value.func.id, 'emit_candidate_start_diagnostic')
                  cleanup = next(n for n in handler.body if isinstance(n, ast.Try) and any(h.name == 'cleanup_error' for h in n.handlers))
                  self.assertLess(handler.body.index(cleanup), handler.body.index(calls[0]))
                  self.assertTrue(any(isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == 'stop_owned_child' for n in ast.walk(cleanup)))
                  self.assertTrue(any(isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == 'verify_listener_absent' for n in ast.walk(cleanup)))
                  self.assertIsInstance(cleanup.handlers[0].body[-1], ast.Raise)
                  self.assertIsInstance(handler.body[-1], ast.Raise)
                  self.assertEqual(handler.body[-1].exc.id, 'start_error')

          unittest.main(argv=['startup-diagnostic-contract'], verbosity=2)
          PY
