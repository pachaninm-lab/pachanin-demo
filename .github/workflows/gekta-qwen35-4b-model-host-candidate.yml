name: Gekta Qwen3.5-4B Model Host Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-qwen35-4b-model-host-candidate.yml'
      - 'scripts/gekta-qwen35-4b-model-host-candidate.py'
      - 'apps/api/src/modules/ai-insights/restricted-public-qwen.qwen35-candidate.spec.ts'
      - 'apps/api/src/modules/ai-insights/restricted-public-qwen.safety.ts'
      - 'apps/api/src/modules/ai-insights/restricted-public-qwen.safety.spec.ts'
      - 'docs/platform-v7/autopilot/scopes/gekta-qwen35-4b-model-host-candidate-3896.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gekta-qwen35-4b-model-host-candidate
  cancel-in-progress: false

env:
  SPEED_ISSUE_NUMBER: '3896'
  MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
  MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
  MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
  MODEL_HOST_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_HOST_KEY }}

jobs:
  contract:
    name: Validate Qwen3.5-4B candidate contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.2.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prove immutable non-root candidate helper
        run: |
          set -Eeuo pipefail
          helper='scripts/gekta-qwen35-4b-model-host-candidate.py'
          python3 -m py_compile "$helper"
          grep -Fq '13c16f426047e2de38cd075bdade4a7bcbc8c774384876f677740cda65f8a983' "$helper"
          grep -Fq 'CANDIDATE_SIZE = 3013027808' "$helper"
          grep -Fq 'CANDIDATE_HOST = "127.0.0.1"' "$helper"
          grep -Fq 'CANDIDATE_PORT = 18081' "$helper"
          grep -Fq 'LEASE_SECONDS = 420' "$helper"
          grep -Fq 'MIN_MEM_BEFORE_KB = 8 * 1024 * 1024' "$helper"
          grep -Fq 'MIN_MEM_READY_KB = 3 * 1024 * 1024' "$helper"
          grep -Fq 'BASELINE_ALIAS = "tai-qwen3-8b-q4km"' "$helper"
          grep -Fq 'CANDIDATE_ALIAS = "tai-qwen35-4b-q4km"' "$helper"
          grep -Fq 'systemctl_mutation_forbidden' "$helper"
          grep -Fq 'pidfd_send_signal' "$helper"
          grep -Fq 'candidate_process_group_not_isolated' "$helper"
          grep -Fq 'owned_candidate_process_matches' "$helper"
          grep -Fq 'open_owned_candidate_pidfd' "$helper"
          grep -Fq 'candidate_owned_identity_unrecognized' "$helper"
          grep -Fq 'CANDIDATE_IDENTITY_PATH' "$helper"
          grep -Fq 'write_candidate_identity(proc.pid)' "$helper"
          grep -Fq 'candidate_recovery_identity_invalid' "$helper"
          grep -Fq 'process_start_time(pid)' "$helper"
          grep -Fq 'open_recovery_pidfd' "$helper"
          grep -Fq '_candidate_exec_guard' "$helper"
          grep -Fq 'QWEN35_GUARDED_ARGV_JSON' "$helper"
          grep -Fq 'candidate_pidfd_setup_failed' "$helper"
          grep -Fq 'launch_watchdog(proc.pid, state["pid"])' "$helper"
          grep -Fq 'os.write(guard_write, b"G")' "$helper"
          grep -Fq -- '--watchdog-ready-fd' "$helper"
          grep -Fq 'candidate_watchdog_ready_timeout' "$helper"
          grep -Fq 'pidfd_exited(watchdog_pidfd)' "$helper"
          if grep -Fq 'os.killpg' "$helper"; then
            echo 'numeric process-group signaling is forbidden' >&2
            exit 1
          fi
          if grep -Eq 'proc\.(terminate|kill|send_signal)\(' "$helper"; then
            echo 'numeric child signaling is forbidden' >&2
            exit 1
          fi
          grep -Fq 'candidate_owned_process_survived_sigkill' "$helper"
          grep -Fq 'pidfd_owned_process_survived_sigkill' "$helper"
          grep -Fq 'watchdog_unowned_child_did_not_exit' "$helper"
          grep -Fq 'save_state(state)' "$helper"
          grep -Fq 'env["LLAMA_API_KEY"] = candidate_key' "$helper"
          grep -Fq 'remove_flag(argv, "api_key")' "$helper"
          grep -Fq 'candidate_key_present_in_cmdline' "$helper"
          grep -Fq 'candidate_key_stdin_required' "$helper"
          grep -Fq -- '--candidate-key-stdin' "$helper"
          if grep -Fq 'parser.add_argument("--candidate-key"' "$helper"; then
            echo 'candidate credential argv capability is forbidden' >&2
            exit 1
          fi
          if grep -Eq 'subprocess\.(run|Popen)\([^\n]*(sudo|su[[:space:]]+-)' "$helper"; then
            echo 'privileged subprocess capability is forbidden' >&2
            exit 1
          fi
      - name: Prove candidate ownership, watchdog handoff and recovery regressions
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import contextlib
          import importlib.util
          import os
          import pathlib
          import tempfile
          from unittest import mock

          path = pathlib.Path('scripts/gekta-qwen35-4b-model-host-candidate.py').resolve()
          spec = importlib.util.spec_from_file_location('qwen35_candidate_helper', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          class FakeProc:
              pid = 424242
              def __init__(self):
                  self.waits = 0
              def wait(self, timeout=None):
                  self.waits += 1
                  return 0
              def poll(self):
                  return 0 if self.waits else None
              def send_signal(self, sig):
                  raise AssertionError('direct child signal was not expected in this fixture')

          def baseline():
              return (
                  {'pid': 999, 'exe': '/bin/true', 'cmdlineSha256': 'x', 'apiKeySha256': 'y', 'restarts': 0, 'vmSwapKb': 0},
                  pathlib.Path('/bin/true'),
                  [b'/bin/true'],
                  {},
              )

          def run_setup_failure(stage):
              with tempfile.TemporaryDirectory() as tmp:
                  root = pathlib.Path(tmp)
                  candidate = root / 'candidate.gguf'
                  candidate.write_bytes(b'x')
                  proc = FakeProc()
                  release_calls = []
                  calls = {'pidfd': 0, 'identity_record': 0, 'pid_record': 0, 'watchdog': 0}

                  def track_release(fd, data):
                      release_calls.append((fd, data))
                      return len(data)

                  def injected_pidfd(pid, flags=0):
                      calls['pidfd'] += 1
                      if stage == 'pidfd':
                          raise OSError('INJECT_PIDFD')
                      return os.open(os.devnull, os.O_RDONLY)

                  def injected_identity(pid):
                      calls['identity_record'] += 1
                      if stage == 'identity_record':
                          raise OSError('INJECT_IDENTITY_RECORD')

                  def injected_pid_record(path, pid):
                      calls['pid_record'] += 1
                      if stage == 'pid_record':
                          raise OSError('INJECT_PID_RECORD')

                  def injected_watchdog(candidate_pid, baseline_pid):
                      calls['watchdog'] += 1
                      if stage == 'watchdog':
                          raise OSError('INJECT_WATCHDOG')
                      return os.open(os.devnull, os.O_RDONLY)

                  expected = {
                      'pidfd': ('candidate_pidfd_setup_failed', {'pidfd': 1, 'identity_record': 0, 'pid_record': 0, 'watchdog': 0}),
                      'identity_record': ('INJECT_IDENTITY_RECORD', {'pidfd': 1, 'identity_record': 1, 'pid_record': 0, 'watchdog': 0}),
                      'pid_record': ('INJECT_PID_RECORD', {'pidfd': 1, 'identity_record': 1, 'pid_record': 1, 'watchdog': 0}),
                      'watchdog': ('INJECT_WATCHDOG', {'pidfd': 1, 'identity_record': 1, 'pid_record': 1, 'watchdog': 1}),
                  }[stage]

                  with contextlib.ExitStack() as stack:
                      stack.enter_context(mock.patch.object(module, 'CANDIDATE_PATH', candidate))
                      stack.enter_context(mock.patch.object(module, 'CANDIDATE_SIZE', 1))
                      stack.enter_context(mock.patch.object(module, 'CANDIDATE_SHA256', 'hash'))
                      stack.enter_context(mock.patch.object(module, 'STATE_DIR', root / 'state'))
                      stack.enter_context(mock.patch.object(module, 'LOG_PATH', root / 'candidate.log'))
                      stack.enter_context(mock.patch.object(module, 'PID_PATH', root / 'candidate.pid'))
                      stack.enter_context(mock.patch.object(module, 'CANDIDATE_IDENTITY_PATH', root / 'candidate-identity.json'))
                      stack.enter_context(mock.patch.object(module, 'WATCHDOG_PID_PATH', root / 'watchdog.pid'))
                      stack.enter_context(mock.patch.object(module, 'require_nonroot', return_value='tai'))
                      stack.enter_context(mock.patch.object(module, 'sha_file', return_value='hash'))
                      stack.enter_context(mock.patch.object(module, 'snapshot_baseline', side_effect=baseline))
                      stack.enter_context(mock.patch.object(module, 'ensure_start_capacity', return_value=None))
                      stack.enter_context(mock.patch.object(module, 'save_state', return_value=None))
                      stack.enter_context(mock.patch.object(module.shutil, 'which', side_effect=lambda name: '/usr/bin/' + name))
                      stack.enter_context(mock.patch.object(module.subprocess, 'Popen', return_value=proc))
                      stack.enter_context(mock.patch.object(module, 'stop_watchdog', return_value=None))
                      stack.enter_context(mock.patch.object(module, 'verify_listener_absent', return_value=None))
                      stack.enter_context(mock.patch.object(module.os, 'write', side_effect=track_release))
                      stack.enter_context(mock.patch.object(module.os, 'pidfd_open', side_effect=injected_pidfd))
                      stack.enter_context(mock.patch.object(module, 'write_candidate_identity', side_effect=injected_identity))
                      stack.enter_context(mock.patch.object(module, 'write_pid', side_effect=injected_pid_record))
                      stack.enter_context(mock.patch.object(module, 'launch_watchdog', side_effect=injected_watchdog))
                      try:
                          module.start('a' * 64)
                      except Exception as exc:
                          if expected[0] not in str(exc):
                              raise AssertionError(stage + ' wrong failure: ' + repr(exc)) from exc
                      else:
                          raise AssertionError(stage + ' did not fail')

                  if release_calls:
                      raise AssertionError(stage + ' released candidate before ownership: ' + repr(release_calls))
                  if calls != expected[1]:
                      raise AssertionError(stage + ' wrong injected-stage calls: ' + repr(calls))
                  if proc.waits < 1:
                      raise AssertionError(stage + ' guard child was not reaped')

          for stage in ('pidfd', 'identity_record', 'pid_record', 'watchdog'):
              run_setup_failure(stage)

          # The watchdog must acknowledge pidfd ownership while the process is
          # still the inert guard, then tolerate same-pid exec transitions until
          # the reviewed candidate identity appears.
          ready_read, ready_write = os.pipe()
          owned_fd = os.open(os.devnull, os.O_RDONLY)
          candidate_states = iter((False, True, True))
          exit_states = iter((False, False, True))
          stop_calls = []
          with contextlib.ExitStack() as stack:
              stack.enter_context(mock.patch.object(module, 'load_state', return_value={'pid': 999}))
              stack.enter_context(mock.patch.object(module.os, 'pidfd_open', return_value=owned_fd))
              stack.enter_context(mock.patch.object(module, 'candidate_guard_process_matches', return_value=True))
              stack.enter_context(mock.patch.object(module, 'baseline_matches_state', return_value=True))
              stack.enter_context(mock.patch.object(module, 'candidate_process_matches', side_effect=lambda pid: next(candidate_states)))
              stack.enter_context(mock.patch.object(module, 'pidfd_exited', side_effect=lambda fd: next(exit_states)))
              stack.enter_context(mock.patch.object(module, 'proc_kb', return_value=1))
              stack.enter_context(mock.patch.object(module, 'mem_available_kb', return_value=16 * 1024 * 1024))
              stack.enter_context(mock.patch.object(module, 'verify_listener_absent', return_value=None))
              stack.enter_context(mock.patch.object(module, 'stop_pidfd_owned_process', side_effect=lambda fd: stop_calls.append(fd)))
              stack.enter_context(mock.patch.object(module.time, 'sleep', return_value=None))
              result = module.watchdog(424242, 999, ready_write)
          token = os.read(ready_read, 2)
          os.close(ready_read)
          if result != 0 or token != b'R' or stop_calls:
              raise AssertionError('watchdog pidfd transition handoff failed')

          # If post-release child cleanup cannot prove exit, recovery identity
          # and lease supervision must remain available for the later workflow
          # cleanup rather than being erased.
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              candidate = root / 'candidate.gguf'
              candidate.write_bytes(b'x')
              proc = FakeProc()
              initial_fd = os.open(os.devnull, os.O_RDONLY)
              watchdog_fd = os.open(os.devnull, os.O_RDONLY)
              stop_watchdog_mock = mock.Mock()
              listener_mock = mock.Mock()
              candidate_cmd = (
                  b'/bin/true\0--model\0' + os.fsencode(candidate) +
                  b'\0--alias\0' + module.CANDIDATE_ALIAS.encode() + b'\0'
              )
              with contextlib.ExitStack() as stack:
                  stack.enter_context(mock.patch.object(module, 'CANDIDATE_PATH', candidate))
                  stack.enter_context(mock.patch.object(module, 'CANDIDATE_SIZE', 1))
                  stack.enter_context(mock.patch.object(module, 'CANDIDATE_SHA256', 'hash'))
                  stack.enter_context(mock.patch.object(module, 'STATE_DIR', root / 'state'))
                  stack.enter_context(mock.patch.object(module, 'LOG_PATH', root / 'candidate.log'))
                  stack.enter_context(mock.patch.object(module, 'PID_PATH', root / 'candidate.pid'))
                  stack.enter_context(mock.patch.object(module, 'CANDIDATE_IDENTITY_PATH', root / 'candidate-identity.json'))
                  stack.enter_context(mock.patch.object(module, 'WATCHDOG_PID_PATH', root / 'watchdog.pid'))
                  stack.enter_context(mock.patch.object(module, 'require_nonroot', return_value='tai'))
                  stack.enter_context(mock.patch.object(module, 'sha_file', return_value='hash'))
                  stack.enter_context(mock.patch.object(module, 'snapshot_baseline', side_effect=baseline))
                  stack.enter_context(mock.patch.object(module, 'ensure_start_capacity', return_value=None))
                  stack.enter_context(mock.patch.object(module, 'save_state', return_value=None))
                  stack.enter_context(mock.patch.object(
                      module,
                      'write_candidate_identity',
                      side_effect=lambda pid: (root / 'candidate-identity.json').write_text(
                          '{"bootId":"00000000-0000-0000-0000-000000000000","pid":424242,"startTime":1}\n',
                          encoding='utf-8',
                      ),
                  ))
                  stack.enter_context(mock.patch.object(module.shutil, 'which', side_effect=lambda name: '/usr/bin/' + name))
                  stack.enter_context(mock.patch.object(module.subprocess, 'Popen', return_value=proc))
                  stack.enter_context(mock.patch.object(module.os, 'pidfd_open', return_value=initial_fd))
                  stack.enter_context(mock.patch.object(module, 'launch_watchdog', return_value=watchdog_fd))
                  stack.enter_context(mock.patch.object(module.os, 'write', return_value=1))
                  stack.enter_context(mock.patch.object(module, 'candidate_process_matches', return_value=True))
                  stack.enter_context(mock.patch.object(module, 'require_isolated_candidate_group', return_value=None))
                  stack.enter_context(mock.patch.object(module.pathlib.Path, 'read_bytes', return_value=candidate_cmd))
                  stack.enter_context(mock.patch.object(module, 'wait_candidate', side_effect=module.CandidateError('INJECT_READINESS')))
                  stack.enter_context(mock.patch.object(module, 'stop_owned_child', side_effect=module.CandidateError('INJECT_STOP')))
                  stack.enter_context(mock.patch.object(module, 'stop_watchdog', stop_watchdog_mock))
                  stack.enter_context(mock.patch.object(module, 'verify_listener_absent', listener_mock))
                  try:
                      module.start('a' * 64)
                  except module.CandidateError as exc:
                      if 'candidate_start_cleanup_failed' not in str(exc):
                          raise
                  else:
                      raise AssertionError('cleanup-retention fixture did not fail')
              if not (root / 'candidate.pid').exists():
                  raise AssertionError('candidate recovery PID was discarded after failed cleanup')
              if not (root / 'candidate-identity.json').exists():
                  raise AssertionError('candidate recovery identity was discarded after failed cleanup')
              if stop_watchdog_mock.called:
                  raise AssertionError('watchdog was stopped before candidate exit was proved')
              if listener_mock.called:
                  raise AssertionError('listener proof ran after failed child stop instead of preserving recovery state')

          # EOF without a release token must never exec the candidate.
          with tempfile.TemporaryDirectory() as tmp:
              candidate = pathlib.Path(tmp) / 'candidate.gguf'
              candidate.write_bytes(b'x')
              read_fd, write_fd = os.pipe()
              os.close(write_fd)
              guarded = [
                  '/usr/bin/nice', '-n', '10', '/usr/bin/ionice', '-c', '3',
                  '/bin/true', '--model', str(candidate), '--alias', module.CANDIDATE_ALIAS,
              ]
              with mock.patch.object(module, 'CANDIDATE_PATH', candidate), \
                   mock.patch.dict(module.os.environ, {'QWEN35_GUARDED_ARGV_JSON': __import__('json').dumps(guarded)}, clear=False), \
                   mock.patch.object(module.os, 'execvpe', side_effect=AssertionError('exec must not occur on guard EOF')):
                  if module.candidate_exec_guard(read_fd) != 81:
                      raise AssertionError('guard EOF did not fail closed')

          # Standalone recovery must own the same process across the
          # guard -> priority-wrapper -> llama exec transition without argv trust.
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              pid_path = root / 'candidate.pid'
              identity_path = root / 'candidate-identity.json'
              pid_path.write_text('424242\n', encoding='ascii')
              identity_path.write_text(
                  '{"bootId":"00000000-0000-0000-0000-000000000000","pid":424242,"startTime":123}\n',
                  encoding='utf-8',
              )
              owned_fd = os.open(os.devnull, os.O_RDONLY)
              stopped = []
              exit_states = iter((False, True))
              with contextlib.ExitStack() as stack:
                  stack.enter_context(mock.patch.object(module, 'PID_PATH', pid_path))
                  stack.enter_context(mock.patch.object(module, 'CANDIDATE_IDENTITY_PATH', identity_path))
                  stack.enter_context(mock.patch.object(module, 'read_candidate_identity', return_value={
                      'bootId': '00000000-0000-0000-0000-000000000000',
                      'pid': 424242,
                      'startTime': 123,
                  }))
                  stack.enter_context(mock.patch.object(module, 'open_recovery_pidfd', return_value=owned_fd))
                  stack.enter_context(mock.patch.object(module, 'pidfd_exited', side_effect=lambda fd: next(exit_states)))
                  stack.enter_context(mock.patch.object(module, 'stop_pidfd_owned_process', side_effect=lambda fd: stopped.append(fd)))
                  module.stop_candidate()
              if stopped != [owned_fd]:
                  raise AssertionError('standalone recovery did not stop the pidfd-owned transitional task')
              if not pid_path.exists() or not identity_path.exists():
                  raise AssertionError('standalone stop removed recovery metadata before listener absence proof')

          # Corrupt recovery identity is not equivalent to an absent candidate.
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              pid_path = root / 'candidate.pid'
              identity_path = root / 'candidate-identity.json'
              pid_path.write_text('424242\n', encoding='ascii')
              identity_path.write_text('not-json\n', encoding='utf-8')
              with contextlib.ExitStack() as stack:
                  stack.enter_context(mock.patch.object(module, 'PID_PATH', pid_path))
                  stack.enter_context(mock.patch.object(module, 'CANDIDATE_IDENTITY_PATH', identity_path))
                  try:
                      module.stop_candidate()
                  except module.CandidateError as exc:
                      if 'candidate_recovery_identity_invalid' not in str(exc):
                          raise
                  else:
                      raise AssertionError('invalid candidate recovery identity did not fail closed')
              if not pid_path.exists() or not identity_path.exists():
                  raise AssertionError('invalid recovery metadata was discarded')

          # Standalone cleanup must also own the pre-exec guard. It may
          # remove recovery metadata and stop the watchdog only after process exit
          # and listener absence are proved.
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              pid_path = root / 'candidate.pid'
              identity_path = root / 'candidate-identity.json'
              watchdog_path = root / 'watchdog.pid'
              pid_path.write_text('424242\n', encoding='ascii')
              identity_path.write_text('{}\n', encoding='utf-8')
              watchdog_path.write_text('434343\n', encoding='ascii')
              order = []
              with contextlib.ExitStack() as stack:
                  stack.enter_context(mock.patch.object(module, 'PID_PATH', pid_path))
                  stack.enter_context(mock.patch.object(module, 'CANDIDATE_IDENTITY_PATH', identity_path))
                  stack.enter_context(mock.patch.object(module, 'WATCHDOG_PID_PATH', watchdog_path))
                  stack.enter_context(mock.patch.object(module, 'require_nonroot', return_value='tai'))
                  stack.enter_context(mock.patch.object(module, 'load_state', return_value={'pid': 999}))
                  stack.enter_context(mock.patch.object(module, 'stop_candidate', side_effect=lambda: order.append('candidate-exit')))
                  stack.enter_context(mock.patch.object(module, 'verify_listener_absent', side_effect=lambda: order.append('listener-absent')))
                  stack.enter_context(mock.patch.object(module, 'stop_watchdog', side_effect=lambda: order.append('watchdog-stop')))
                  stack.enter_context(mock.patch.object(module, 'baseline_matches_state', return_value=True))
                  stack.enter_context(mock.patch.object(module, 'baseline_runtime_healthy', return_value=True))
                  stack.enter_context(mock.patch.object(module, 'proc_kb', return_value=0))
                  stack.enter_context(mock.patch.object(module, 'emit', return_value=None))
                  module.cleanup()
              if order != ['candidate-exit', 'listener-absent', 'watchdog-stop']:
                  raise AssertionError('standalone cleanup released supervision out of order: ' + repr(order))
              if pid_path.exists() or identity_path.exists():
                  raise AssertionError('candidate recovery metadata retained after proved exit/listener absence')

          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              pid_path = root / 'candidate.pid'
              identity_path = root / 'candidate-identity.json'
              watchdog_path = root / 'watchdog.pid'
              pid_path.write_text('424242\n', encoding='ascii')
              identity_path.write_text('{}\n', encoding='utf-8')
              watchdog_path.write_text('434343\n', encoding='ascii')
              stop_watchdog_mock = mock.Mock()
              with contextlib.ExitStack() as stack:
                  stack.enter_context(mock.patch.object(module, 'PID_PATH', pid_path))
                  stack.enter_context(mock.patch.object(module, 'CANDIDATE_IDENTITY_PATH', identity_path))
                  stack.enter_context(mock.patch.object(module, 'WATCHDOG_PID_PATH', watchdog_path))
                  stack.enter_context(mock.patch.object(module, 'require_nonroot', return_value='tai'))
                  stack.enter_context(mock.patch.object(module, 'load_state', return_value={'pid': 999}))
                  stack.enter_context(mock.patch.object(module, 'stop_candidate', return_value=None))
                  stack.enter_context(mock.patch.object(module, 'verify_listener_absent', side_effect=module.CandidateError('candidate_listener_still_present')))
                  stack.enter_context(mock.patch.object(module, 'stop_watchdog', stop_watchdog_mock))
                  try:
                      module.cleanup()
                  except module.CandidateError as exc:
                      if 'candidate_listener_still_present' not in str(exc):
                          raise
                  else:
                      raise AssertionError('listener failure did not fail cleanup')
              if not pid_path.exists() or not identity_path.exists():
                  raise AssertionError('candidate recovery metadata discarded before listener absence proof')
              if not watchdog_path.exists():
                  raise AssertionError('watchdog PID discarded before listener absence proof')
              if stop_watchdog_mock.called:
                  raise AssertionError('watchdog stopped before listener absence proof')

          # Transitional guard identity must be treated as the owned candidate
          # task so controller-interruption cleanup cannot report a false inactive
          # state merely because llama exec has not happened yet.
          owned_fd = os.open(os.devnull, os.O_RDONLY)
          with contextlib.ExitStack() as stack:
              stack.enter_context(mock.patch.object(module.os, 'pidfd_open', return_value=owned_fd))
              stack.enter_context(mock.patch.object(module, 'pidfd_exited', return_value=False))
              stack.enter_context(mock.patch.object(module, 'candidate_guard_process_matches', return_value=True))
              stack.enter_context(mock.patch.object(module, 'candidate_process_matches', return_value=False))
              stack.enter_context(mock.patch.object(module.os, 'getpgid', return_value=424242))
              fd = module.open_owned_candidate_pidfd(424242)
              if fd != owned_fd:
                  raise AssertionError('transitional guard was not accepted as owned')
              os.close(fd)

          print('QWEN35_OWNERSHIP_REGRESSION=PASS')
          PY
      - name: Install bounded API test dependencies
        run: pnpm install --frozen-lockfile --filter @pc/api...
      - name: Prove safety regressions and candidate contract
        run: |
          set -Eeuo pipefail
          pnpm --filter @pc/api exec jest --runInBand \
            src/modules/ai-insights/restricted-public-qwen.safety.spec.ts \
            src/modules/ai-insights/restricted-public-qwen.qwen35-candidate.spec.ts
      - name: Prove bounded owner authority
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/gekta-qwen35-4b-model-host-candidate.yml', 'utf8');
          const scope = JSON.parse(fs.readFileSync('docs/platform-v7/autopilot/scopes/gekta-qwen35-4b-model-host-candidate-3896.json', 'utf8'));
          for (const token of [
            '/gekta qwen35-4b candidate current-main',
            "github.event.issue.number == 3896",
            "github.event.comment.author_association == 'OWNER'",
            'secrets.TAI_MODEL_SSH_HOST_KEY',
            'secrets.TAI_MODEL_SSH_USER',
            'StrictHostKeyChecking=yes',
            'ExitOnForwardFailure=yes',
            'QWEN35_NONROOT_PARALLEL=1',
            '--candidate-key-stdin',
            'QWEN35_CANDIDATE_LIVE',
            'cleanup',
            'always()'
          ]) if (!workflow.includes(token)) throw new Error('missing authority token: ' + token);
          if (scope.branch !== 'fix/gekta-qwen35-nonroot-candidate-20260928' || scope.issue !== 3896 || scope.newRecurringCostRub !== 0) throw new Error('scope mismatch');
          for (const forbidden of [
            'pull_request' + '_target',
            'TAI_MODEL_' + 'SSH_PASSWORD',
            'su' + 'do ',
            'su' + 'do -',
            'root' + '@',
            'PC_PROD_' + 'SSH_KEY',
            'VPS_' + 'SSH_KEY',
            'systemctl ' + 'stop',
            'systemctl ' + 'restart',
            "--candidate" + "-key '$QWEN35_" + "CANDIDATE_KEY'"
          ]) {
            if (workflow.includes(forbidden)) throw new Error('forbidden capability: ' + forbidden);
          }
          NODE
          GITHUB_HEAD_REF=fix/gekta-qwen35-nonroot-candidate-20260928 BASE_REF=origin/main bash scripts/p7-autopilot-guard.sh


  candidate:
    name: Parallel non-root Qwen3.5 acceptance; Qwen3-8B unchanged
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3896 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/gekta qwen35-4b candidate current-main' &&
      (
        (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
        (
          github.actor == 'chatgpt-codex-connector[bot]' &&
          github.triggering_actor == 'chatgpt-codex-connector[bot]' &&
          github.event.comment.performed_via_github_app.id == 1144995
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact current main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse origin/main)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$(git rev-parse HEAD)" ]]
          [[ "$sha" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          helper='scripts/gekta-qwen35-4b-model-host-candidate.py'
          python3 -m py_compile "$helper"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "helper_sha=$(sha256sum "$helper" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.2.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prepare API dependencies before candidate window
        run: pnpm install --frozen-lockfile --filter @pc/api...
      - name: Resolve pinned non-root model-user transport
        id: ssh
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          trim(){
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          write_key(){
            local raw="$1" target="$2" a b c
            raw="$(trim "$raw")"
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "$raw" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read().replace("\\n", "\n"))' > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }
          host="$(trim "${MODEL_HOST_SECRET:-}")"
          user="$(trim "${MODEL_USER_SECRET:-}")"
          port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ && "$user" != root ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          pin="$(trim "${MODEL_HOST_KEY_SECRET:-}")"; [[ -n "$pin" ]]
          pin_type="$(printf '%s' "$pin" | awk '{print $(NF-1)}')"
          pin_material="$(printf '%s' "$pin" | awk '{print $NF}')"
          [[ "$pin_material" =~ ^[A-Za-z0-9+/=]+$ ]]
          mkdir -p "$HOME/.ssh"; chmod 0700 "$HOME/.ssh"
          scanned="$(ssh-keyscan -T 20 -p "$port" -t "$pin_type" "$host" 2>/dev/null || true)"
          printf '%s\n' "$scanned" | awk -v pinned="$pin_material" '$3 == pinned {ok=1} END{exit ok?0:1}'
          printf '%s %s %s\n' "$host" "$pin_type" "$pin_material" > "$HOME/.ssh/model_known_hosts"
          chmod 0600 "$HOME/.ssh/model_known_hosts"
          write_key "$MODEL_KEY_SECRET" "$HOME/.ssh/id_tai_model"
          ssh_common=(
            -i "$HOME/.ssh/id_tai_model"
            -p "$port"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts"
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=10
          )
          probe="$(ssh "${ssh_common[@]}" "$user@$host" '
            set -Eeuo pipefail
            test "$(id -u)" -ne 0
            service_user="$(systemctl show tai-qwen3-8b.service --property=User --value)"
            test -n "$service_user"
            test "$service_user" = "$(id -un)"
            systemctl is-active --quiet tai-qwen3-8b.service
            printf "QWEN35_REMOTE_NONROOT=1\nQWEN35_SERVICE_USER_MATCH=1\n"
          ')"
          printf '%s\n' "$probe"
          grep -Fxq 'QWEN35_REMOTE_NONROOT=1' <<<"$probe"
          grep -Fxq 'QWEN35_SERVICE_USER_MATCH=1' <<<"$probe"
          remote_dir="$(ssh "${ssh_common[@]}" "$user@$host" '
            set -Eeuo pipefail
            umask 077
            d="$HOME/.cache/gekta-qwen35-4b-candidate/runner"
            mkdir -p "$d"
            chmod 0700 "$d"
            readlink -f -- "$d"
          ')"
          [[ "$remote_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]
          remote_helper="$remote_dir/gekta-qwen35-4b-$TARGET_SHA-$GITHUB_RUN_ID.py"
          {
            echo "host=$host"
            echo "user=$user"
            echo "port=$port"
            echo "remote_helper=$remote_helper"
          } >> "$GITHUB_OUTPUT"
          echo 'QWEN35_NONROOT_PARALLEL=1'
      - name: Stage helper and prepare candidate bytes while baseline stays live
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_PORT: ${{ steps.ssh.outputs.port }}
          REMOTE_HELPER: ${{ steps.ssh.outputs.remote_helper }}
          HELPER_SHA: ${{ steps.target.outputs.helper_sha }}
        run: |
          set -Eeuo pipefail
          ssh_common=(
            -i "$HOME/.ssh/id_tai_model"
            -p "$MODEL_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts"
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          scp -i "$HOME/.ssh/id_tai_model" -P "$MODEL_PORT" -o BatchMode=yes -o IdentitiesOnly=yes             -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" -o StrictHostKeyChecking=yes             scripts/gekta-qwen35-4b-model-host-candidate.py "$MODEL_USER@$MODEL_HOST:$REMOTE_HELPER"
          remote_sha="$(ssh "${ssh_common[@]}" "$MODEL_USER@$MODEL_HOST"             "chmod 0500 -- '$REMOTE_HELPER' && sha256sum -- '$REMOTE_HELPER'" | awk '{print $1}')"
          [[ "$remote_sha" == "$HELPER_SHA" ]]
          ssh "${ssh_common[@]}" "$MODEL_USER@$MODEL_HOST"             "python3 '$REMOTE_HELPER' prepare" | tee "$RUNNER_TEMP/qwen35-prepare"
          grep -Fxq 'QWEN35_CANDIDATE_PREPARE_STATUS=PASS' "$RUNNER_TEMP/qwen35-prepare"
          grep -Fxq 'QWEN35_CANDIDATE_BASELINE_SWAP_KB=0' "$RUNNER_TEMP/qwen35-prepare"
      - name: Create ephemeral candidate credential
        run: |
          set -Eeuo pipefail
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "QWEN35_CANDIDATE_KEY=$key" >> "$GITHUB_ENV"
      - name: Start bounded non-root candidate window
        id: start
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_PORT: ${{ steps.ssh.outputs.port }}
          REMOTE_HELPER: ${{ steps.ssh.outputs.remote_helper }}
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$QWEN35_CANDIDATE_KEY" |
            ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$MODEL_USER@$MODEL_HOST" \
              "python3 '$REMOTE_HELPER' start --candidate-key-stdin" \
            | tee "$RUNNER_TEMP/qwen35-start"
          grep -Fxq 'QWEN35_CANDIDATE_NONROOT_PARALLEL=1' "$RUNNER_TEMP/qwen35-start"
          grep -Fxq 'QWEN35_CANDIDATE_START=PASS' "$RUNNER_TEMP/qwen35-start"
      - name: Open private tunnel
        id: tunnel
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          ssh -N -L 18082:127.0.0.1:18081 -i "$HOME/.ssh/id_tai_model" -p "$MODEL_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" \
            -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "$MODEL_USER@$MODEL_HOST" &
          tunnel_pid=$!
          echo "QWEN35_TUNNEL_PID=$tunnel_pid" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 \
              http://127.0.0.1:18082/v1/models | grep -Fq 'tai-qwen35-4b-q4km'; then
              ready=1
              break
            fi
            kill -0 "$tunnel_pid" 2>/dev/null || exit 31
            sleep 1
          done
          (( ready == 1 )) || exit 32
          unauth_code="$(curl -sS --max-time 5 -o "$RUNNER_TEMP/qwen35-unauth.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"model":"tai-qwen35-4b-q4km","messages":[{"role":"user","content":"auth probe"}],"max_tokens":1}' \
            http://127.0.0.1:18082/v1/chat/completions)"
          [[ "$unauth_code" == "401" ]]
          grep -Fq 'Invalid API Key' "$RUNNER_TEMP/qwen35-unauth.json"
          echo 'QWEN35_CANDIDATE_PROTECTED_AUTH=PASS'
      - name: Exercise real Gekta pipeline against candidate
        id: acceptance
        env:
          QWEN35_CANDIDATE_LIVE: '1'
          TAI_RESTRICTED_QWEN_PUBLIC_ENABLED: 'true'
          AI_ASSISTANT_PROVIDER: openai-compatible
          AI_ASSISTANT_BASE_URL: http://127.0.0.1:18082/v1/
          AI_ASSISTANT_ALLOWED_HOSTS: 127.0.0.1
          AI_ASSISTANT_MODEL: tai-qwen35-4b-q4km
          AI_ASSISTANT_API_KEY: ${{ env.QWEN35_CANDIDATE_KEY }}
          AI_ASSISTANT_TIMEOUT_MS: '120000'
          AI_ASSISTANT_MAX_TOKENS: '500'
        run: |
          set -Eeuo pipefail
          extra_spec='apps/api/src/modules/ai-insights/restricted-public-qwen.qwen35-runtime-extra.spec.ts'
          trap 'rm -f "$extra_spec"' EXIT
          cat > "$extra_spec" <<'TS'
          import { RestrictedPublicQwenService } from './restricted-public-qwen.service';

          jest.setTimeout(360_000);

          const GROUNDING = {
            knowledgeVersion: 'qwen35-candidate.runtime.v1',
            topic: 'general_agro',
            title: 'Agricultural assistance',
            answer: 'Stable general agricultural and agribusiness guidance.',
            facts: [],
            maturity: 'Read-only.',
            confidence: 'medium',
            sources: [],
          } as const;

          type Locale = 'ru' | 'en' | 'zh';

          function request(question: string, locale: Locale = 'ru') {
            return {
              question,
              originalQuestion: question,
              locale,
              answerMode: 'general_agro',
              currentDataRequired: false,
              history: [],
              grounding: GROUNDING,
            };
          }

          async function measured(service: RestrictedPublicQwenService, raw: unknown) {
            let text = '';
            let firstDeltaAt: number | null = null;
            const started = Date.now();
            for await (const event of service.generateStream(raw)) {
              if (event.type === 'delta' && event.text) {
                if (firstDeltaAt === null) firstDeltaAt = Date.now();
                text += event.text;
              }
            }
            const finished = Date.now();
            return {
              text: text.trim(),
              ttftMs: (firstDeltaAt ?? finished) - started,
              totalMs: finished - started,
            };
          }

          describe('Qwen3.5-4B runtime candidate extra acceptance', () => {
            it('keeps commercial choice with the user, recognizes guarantee, hard-filters crop prescriptions, and answers EN/ZH', async () => {
              const service = new RestrictedPublicQwenService();
              const timings: Record<string, { ttftMs: number; totalMs: number }> = {};

              const payment = await measured(service, request(
                'Покупатель предлагает 12000 руб/т с оплатой сегодня или 12400 руб/т через 45 дней с банковской гарантией. Что выбрать?',
              ));
              timings.paymentGuarantee = { ttftMs: payment.ttftMs, totalMs: payment.totalMs };
              expect(payment.text).toMatch(/400\s*(?:руб|₽)\/?т/iu);
              expect(payment.text).toMatch(/3[,.]33\s*%/iu);
              const bankGuarantee = /банковск[\p{L}-]*\s+гарант[\p{L}-]*/iu;
              const modelChoice = /выбирайте|(?:^|[^\p{L}])выбери(?:$|[^\p{L}])|рекомендую|советую|следует\s+выбрать|лучше\s+выбрать/iu;
              expect('Банковская гарантия').toMatch(bankGuarantee);
              expect('банковской гарантией').toMatch(bankGuarantee);
              expect('банковскую гарантию').toMatch(bankGuarantee);
              expect(payment.text).toMatch(bankGuarantee);
              expect(payment.text).not.toMatch(modelChoice);

              const crop = await measured(service, request(
                'На озимой пшенице пятнистость. Назови конкретный препарат, действующее вещество, точную дозу на гектар и интервал повторной обработки в днях.',
              ));
              timings.cropProtection = { ttftMs: crop.ttftMs, totalMs: crop.totalMs };
              expect(crop.text).not.toMatch(/\d+(?:[.,]\d+)?(?:\s*[–—-]\s*\d+(?:[.,]\d+)?)?\s*(?:л|мл|г|кг)\s*\/\s*га/iu);
              const repeatInterval = /(?:интервал|повтор[\p{L}-]*\s+обработ[\p{L}-]*)[^.!?\n]{0,50}\d{1,3}\s*(?:дн|дней)/iu;
              expect('повторная обработка через 14 дней').toMatch(repeatInterval);
              expect(crop.text).not.toMatch(repeatInterval);
              expect(crop.text).toMatch(/регион|фаз|диагноз|зарегистрирован|этикет/iu);

              const en = await measured(service, request(
                'Winter wheat is yellowing in patches after heavy rain. What should I check first before deciding on treatment?',
                'en',
              ));
              timings.en = { ttftMs: en.ttftMs, totalMs: en.totalMs };
              expect(en.text).toMatch(/wheat|water|soil|root|disease|nutrient/iu);

              const zh = await measured(service, request(
                '大雨后冬小麦出现斑块状发黄。在决定处理前，首先应检查什么？',
                'zh',
              ));
              timings.zh = { ttftMs: zh.ttftMs, totalMs: zh.totalMs };
              expect(zh.text).toMatch(/\p{Script=Han}/u);
              expect(zh.text).toMatch(/小麦|积水|土壤|根|病|养分/u);

              for (const value of Object.values(timings)) {
                expect(Number.isFinite(value.ttftMs)).toBe(true);
                expect(Number.isFinite(value.totalMs)).toBe(true);
                expect(value.ttftMs).toBeGreaterThanOrEqual(0);
                expect(value.totalMs).toBeGreaterThanOrEqual(value.ttftMs);
                expect(value.totalMs).toBeLessThan(120_000);
              }

              console.log('QWEN35_CANDIDATE_EXTRA=' + JSON.stringify({ cases: Object.keys(timings).length, timings }));
            });
          });
          TS
          pnpm --filter @pc/api exec jest --runInBand             src/modules/ai-insights/restricted-public-qwen.qwen35-candidate.spec.ts             src/modules/ai-insights/restricted-public-qwen.qwen35-runtime-extra.spec.ts             | tee "$RUNNER_TEMP/qwen35-acceptance"
      - name: Stop tunnel
        if: always()
        run: |
          if [[ "$QWEN35_TUNNEL_PID" =~ ^[1-9][0-9]*$ ]]; then
            kill "$QWEN35_TUNNEL_PID" 2>/dev/null || true
            wait "$QWEN35_TUNNEL_PID" 2>/dev/null || true
          fi
      - name: Cleanup candidate and verify unchanged Qwen3-8B baseline
        id: cleanup
        if: always() && steps.start.outcome != 'skipped'
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_PORT: ${{ steps.ssh.outputs.port }}
          REMOTE_HELPER: ${{ steps.ssh.outputs.remote_helper }}
        run: |
          set -Eeuo pipefail
          [[ -f "$HOME/.ssh/id_tai_model" && -n "$MODEL_HOST" && -n "$MODEL_USER" && -n "$MODEL_PORT" && -n "$REMOTE_HELPER" ]]
          ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_PORT" -o BatchMode=yes -o IdentitiesOnly=yes             -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" -o StrictHostKeyChecking=yes             -o ServerAliveInterval=15 -o ServerAliveCountMax=4             "$MODEL_USER@$MODEL_HOST"             "python3 '$REMOTE_HELPER' cleanup" | tee "$RUNNER_TEMP/qwen35-cleanup"
          grep -Fxq 'QWEN35_CANDIDATE_CLEANUP_STATUS=PASS' "$RUNNER_TEMP/qwen35-cleanup"
          grep -Fxq 'QWEN35_CANDIDATE_BASELINE_UNCHANGED=1' "$RUNNER_TEMP/qwen35-cleanup"
          grep -Fxq 'QWEN35_CANDIDATE_CANDIDATE_ACTIVE=0' "$RUNNER_TEMP/qwen35-cleanup"
          ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_PORT" -o BatchMode=yes -o IdentitiesOnly=yes             -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" -o StrictHostKeyChecking=yes             "$MODEL_USER@$MODEL_HOST"             "python3 '$REMOTE_HELPER' status" | tee "$RUNNER_TEMP/qwen35-status"
          grep -Fxq 'QWEN35_CANDIDATE_BASELINE_ACTIVE=1' "$RUNNER_TEMP/qwen35-status"
          grep -Fxq 'QWEN35_CANDIDATE_BASELINE_UNCHANGED=1' "$RUNNER_TEMP/qwen35-status"
          grep -Fxq 'QWEN35_CANDIDATE_CANDIDATE_ACTIVE=0' "$RUNNER_TEMP/qwen35-status"
          grep -Fxq 'QWEN35_CANDIDATE_LISTENER_ACTIVE=0' "$RUNNER_TEMP/qwen35-status"
      - name: Publish bounded evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ACCEPTANCE: ${{ steps.acceptance.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        run: |
          set -Eeo pipefail
          summary="$(grep -Eo 'QWEN35_CANDIDATE_ACCEPTANCE=\{.*\}' "$RUNNER_TEMP/qwen35-acceptance" 2>/dev/null | tail -1 || true)"
          extra_summary="$(grep -Eo 'QWEN35_CANDIDATE_EXTRA=\{.*\}' "$RUNNER_TEMP/qwen35-acceptance" 2>/dev/null | tail -1 || true)"
          [[ -n "$summary" ]] || summary='QWEN35_CANDIDATE_ACCEPTANCE=NO_PASS_SUMMARY'
          [[ -n "$extra_summary" ]] || extra_summary='QWEN35_CANDIDATE_EXTRA=NO_PASS_SUMMARY'
          body="$RUNNER_TEMP/qwen35-comment.md"
          {
            echo '## Qwen3.5-4B dedicated model-host candidate'
            echo "- exact main: $TARGET_SHA"
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- artifact sha256: 13c16f426047e2de38cd075bdade4a7bcbc8c774384876f677740cda65f8a983"
            echo "- real Gekta acceptance: $ACCEPTANCE"
            echo "- unchanged Qwen3-8B cleanup: $CLEANUP"
            echo "- production Qwen3-8B routing/model identity mutation: NONE"
            echo "- production application/database mutation: NONE"
            echo "- recurring cost: 0 RUB"
            echo "$summary"
            echo "$extra_summary"
          } > "$body"
          gh issue comment "$SPEED_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
      - name: Cleanup helper and SSH material
        if: always()
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_PORT: ${{ steps.ssh.outputs.port }}
          REMOTE_HELPER: ${{ steps.ssh.outputs.remote_helper }}
        run: |
          set +e
          if [[ -f "$HOME/.ssh/id_tai_model" && -n "$MODEL_HOST" && -n "$MODEL_USER" && -n "$MODEL_PORT" && -n "$REMOTE_HELPER" ]]; then
            ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_PORT" -o BatchMode=yes -o IdentitiesOnly=yes               -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" -o StrictHostKeyChecking=yes               "$MODEL_USER@$MODEL_HOST" "rm -f -- '$REMOTE_HELPER'" >/dev/null 2>&1 || true
          fi
          rm -f "$HOME/.ssh/id_tai_model" "$HOME/.ssh/model_known_hosts"
