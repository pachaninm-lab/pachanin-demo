        run: |
          set -Eeuo pipefail
          trim(){
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          write_key(){
            local raw="$1" target="$2" a b c
            raw="$(trim "$raw")"
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "$raw" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read().replace("\\n", "\n"))' > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }
          host="$(trim "${MODEL_HOST_SECRET:-}")"
          user="$(trim "${MODEL_USER_SECRET:-}")"
          port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ && "$user" != root ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          pin="$(trim "${MODEL_HOST_KEY_SECRET:-}")"; [[ -n "$pin" ]]
          pin_type="$(printf '%s' "$pin" | awk '{print $(NF-1)}')"
          pin_material="$(printf '%s' "$pin" | awk '{print $NF}')"
          [[ "$pin_material" =~ ^[A-Za-z0-9+/=]+$ ]]
          mkdir -p "$HOME/.ssh"; chmod 0700 "$HOME/.ssh"
          scanned="$(ssh-keyscan -T 20 -p "$port" -t "$pin_type" "$host" 2>/dev/null || true)"
          printf '%s\n' "$scanned" | awk -v pinned="$pin_material" '$3 == pinned {ok=1} END{exit ok?0:1}'
          printf '%s %s %s\n' "$host" "$pin_type" "$pin_material" > "$HOME/.ssh/model_known_hosts"
          chmod 0600 "$HOME/.ssh/model_known_hosts"
          write_key "$MODEL_KEY_SECRET" "$HOME/.ssh/id_tai_model"
          ssh_common=(
            -i "$HOME/.ssh/id_tai_model"
