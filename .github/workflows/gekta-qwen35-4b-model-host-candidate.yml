name: Gekta Qwen3.5-4B Model Host Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-qwen35-4b-model-host-candidate.yml'
      - 'scripts/gekta-qwen35-4b-model-host-candidate.py'
      - 'apps/api/src/modules/ai-insights/restricted-public-qwen.qwen35-candidate.spec.ts'
      - 'apps/api/src/modules/ai-insights/restricted-public-qwen.safety.ts'
      - 'apps/api/src/modules/ai-insights/restricted-public-qwen.safety.spec.ts'
      - 'docs/platform-v7/autopilot/scopes/gekta-qwen35-4b-model-host-candidate-3896.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gekta-qwen35-4b-model-host-candidate
  cancel-in-progress: false

env:
  SPEED_ISSUE_NUMBER: '3896'
  MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
  MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
  MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
  MODEL_HOST_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_HOST_KEY }}

jobs:
  contract:
    name: Validate Qwen3.5-4B candidate contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.2.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prove immutable non-root candidate helper
        run: |
          set -Eeuo pipefail
          helper='scripts/gekta-qwen35-4b-model-host-candidate.py'
          python3 -m py_compile "$helper"
          grep -Fq '13c16f426047e2de38cd075bdade4a7bcbc8c774384876f677740cda65f8a983' "$helper"
          grep -Fq 'CANDIDATE_SIZE = 3013027808' "$helper"
          grep -Fq 'CANDIDATE_HOST = "127.0.0.1"' "$helper"
          grep -Fq 'CANDIDATE_PORT = 18081' "$helper"
          grep -Fq 'LEASE_SECONDS = 420' "$helper"
          grep -Fq 'LEASE_TERM_MARGIN_SECONDS = 2.0' "$helper"
          grep -Fq 'LEASE_KILL_MARGIN_SECONDS = 1.0' "$helper"
          grep -Fq 'CANDIDATE_NICE_DELTA = 10' "$helper"
          grep -Fq 'os.nice(CANDIDATE_NICE_DELTA)' "$helper"
          grep -Fq 'candidate_priority_not_lowered' "$helper"
          if grep -Fq 'shutil.which("nice")' "$helper" || grep -Fq 'shutil.which("ionice")' "$helper"; then
            echo 'external priority wrapper chain is forbidden' >&2
            exit 1
          fi
          grep -Fq 'def enforce_hard_lease(' "$helper"
          grep -Fq 'target=enforce_hard_lease' "$helper"
          grep -Fq 'baseline_process_matches_state' "$helper"
          grep -Fq 'MIN_MEM_BEFORE_KB = 8 * 1024 * 1024' "$helper"
          grep -Fq 'MIN_MEM_READY_KB = 3 * 1024 * 1024' "$helper"
          grep -Fq 'BASELINE_ALIAS = "tai-qwen3-8b-q4km"' "$helper"
          grep -Fq 'CANDIDATE_ALIAS = "tai-qwen35-4b-q4km"' "$helper"
          grep -Fq 'systemctl_mutation_forbidden' "$helper"
          grep -Fq 'pidfd_send_signal' "$helper"
          grep -Fq 'candidate_process_group_not_isolated' "$helper"
          grep -Fq 'owned_candidate_process_matches' "$helper"
          grep -Fq 'open_owned_candidate_pidfd' "$helper"
          grep -Fq 'candidate_owned_identity_unrecognized' "$helper"
          grep -Fq 'CANDIDATE_IDENTITY_PATH' "$helper"
          grep -Fq 'write_candidate_identity' "$helper"
          grep -Fq 'candidate_recovery_identity_mismatch' "$helper"
          grep -Fq 'candidate_recovery_identity_missing' "$helper"
          grep -Fq 'CANDIDATE_IDENTITY_PATH' "$helper"
          grep -Fq 'write_candidate_identity(proc.pid)' "$helper"
          grep -Fq 'candidate_recovery_identity_invalid' "$helper"
          grep -Fq 'process_start_time(pid)' "$helper"
          grep -Fq 'open_recovery_pidfd' "$helper"
          grep -Fq '_candidate_exec_guard' "$helper"
          grep -Fq 'QWEN35_GUARDED_ARGV_JSON' "$helper"
          grep -Fq 'candidate_pidfd_setup_failed' "$helper"
          grep -Fq 'launch_watchdog(proc.pid, state["pid"])' "$helper"
          grep -Fq 'os.write(guard_write, b"G")' "$helper"
          grep -Fq -- '--watchdog-ready-fd' "$helper"
          grep -Fq -- '--watchdog-arm-fd' "$helper"
          grep -Fq 'candidate_watchdog_ready_timeout' "$helper"
          grep -Fq 'candidate_watchdog_arm_failed' "$helper"
          grep -Fq 'candidate_guard_exited_before_release' "$helper"
          grep -Fq 'candidate_guard_or_exec_exited' "$helper"
          grep -Fq 'pidfd_exited(watchdog_pidfd)' "$helper"
          if grep -Fq 'os.killpg' "$helper"; then
            echo 'numeric process-group signaling is forbidden' >&2
            exit 1
          fi
          if grep -Eq 'proc\.(terminate|kill|send_signal)\(' "$helper"; then
            echo 'numeric child signaling is forbidden' >&2
            exit 1
          fi
          grep -Fq 'candidate_owned_process_survived_sigkill' "$helper"
          grep -Fq 'pidfd_owned_process_survived_sigkill' "$helper"
          grep -Fq 'watchdog_unowned_child_did_not_exit' "$helper"
          grep -Fq 'save_state(state)' "$helper"
          grep -Fq 'env["LLAMA_API_KEY"] = candidate_key' "$helper"
          grep -Fq 'remove_flag(argv, "api_key")' "$helper"
          grep -Fq 'candidate_key_present_in_cmdline' "$helper"
          grep -Fq 'candidate_key_stdin_required' "$helper"
          grep -Fq -- '--candidate-key-stdin' "$helper"
          if grep -Fq 'parser.add_argument("--candidate-key"' "$helper"; then
            echo 'candidate credential argv capability is forbidden' >&2
            exit 1
          fi
          if grep -Eq 'subprocess\.(run|Popen)\([^\n]*(sudo|su[[:space:]]+-)' "$helper"; then
            echo 'privileged subprocess capability is forbidden' >&2
            exit 1
          fi
      - name: Prove OS-bound identity and credential-free real pre-exec
        run: |
          set -Eeuo pipefail
          python3 <<'PYGUARD'
          import contextlib
          import importlib.util
          import io
          import json
          import os
          import pathlib
          from unittest import mock

          path = pathlib.Path('scripts/gekta-qwen35-4b-model-host-candidate.py').resolve()
          spec = importlib.util.spec_from_file_location('qwen35_key_guard', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          marker = 'SYNTHETIC_NOT_A_CREDENTIAL_7f914ef09a8b4c11'
          valid = ['/fixture/llama-server', '--model', str(module.CANDIDATE_PATH), '--alias', module.CANDIDATE_ALIAS]
          assert module.candidate_exec_argv_status(valid) == 0
          assert module.candidate_exec_argv_status([valid[0], '--model=' + str(module.CANDIDATE_PATH), '--alias=' + module.CANDIDATE_ALIAS]) == 0
          for flags in [
              ['--api-key', marker], ['--api-key=' + marker],
              ['--api_key', marker], ['--api_key=' + marker],
              ['--api-key'], ['--api-key='],
              ['--api-key', marker, '--api-key=' + marker],
          ]:
              argv = valid + flags
              assert module.candidate_exec_argv_status(argv) == 84
              read_fd, write_fd = os.pipe()
              try:
                  os.write(write_fd, b'G')
                  os.close(write_fd)
                  write_fd = -1
                  with mock.patch.dict(os.environ, {'QWEN35_GUARDED_ARGV_JSON': json.dumps(argv)}), \
                       mock.patch.object(module.os, 'execvpe') as exec_mock, \
                       mock.patch.object(module.os, 'nice') as nice_mock:
                      assert module.candidate_exec_guard(read_fd) == 84
                      read_fd = -1
                      exec_mock.assert_not_called()
                      nice_mock.assert_not_called()
              finally:
                  for fd in (read_fd, write_fd):
                      if fd >= 0:
                          with contextlib.suppress(OSError):
                              os.close(fd)
          prepared = [os.fsencode(item) for item in valid]
          observed = prepared + [b'--api-key=' + marker.encode('ascii')]
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              try:
                  module.require_candidate_keyless_argv(prepared, observed)
              except module.CandidateError as exc:
                  assert str(exc) == 'candidate_key_present_in_cmdline'
              else:
                  raise AssertionError('observed key must fail closed')
          assert output.getvalue().splitlines() == [
              'QWEN35_CANDIDATE_ARGV_DIAGNOSTIC_VERSION=v1',
              'QWEN35_CANDIDATE_ARGV_PREPARED_API_KEY=absent',
              'QWEN35_CANDIDATE_ARGV_OBSERVED_API_KEY=joined',
              'QWEN35_CANDIDATE_ARGV_CHANGED_AFTER_EXEC=1',
          ]
          assert marker not in output.getvalue()
          import subprocess
          import sys
          import tempfile

          # Re-import the complete actual helper in independent interpreters. No HOME
          # value, OS-account path or generated credential is emitted by the test.
          status_probe = '''import importlib.util,json,sys
          s=importlib.util.spec_from_file_location("probe",sys.argv[1])
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          print(m.candidate_exec_argv_status(json.loads(sys.argv[2])))
          '''
          for home in ('/synthetic/ssh-home', '/synthetic/service-home', None):
              env = dict(os.environ)
              if home is None:
                  env.pop('HOME', None)
              else:
                  env['HOME'] = home
              result = subprocess.run(
                  [sys.executable, '-c', status_probe, str(path), json.dumps(valid)],
                  env=env, capture_output=True, text=True, timeout=5, check=True,
              )
              assert result.stdout == '0\n' and result.stderr == ''

          guard_probe = '''import importlib.util,sys
          s=importlib.util.spec_from_file_location("guard",sys.argv[1])
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          sys.exit(m.candidate_exec_guard(int(sys.argv[2])))
          '''
          with tempfile.TemporaryDirectory() as temporary:
              root = pathlib.Path(temporary)
              evidence = root / 'exec.json'
              executable = root / 'synthetic-exec'
              executable.write_text('#!' + sys.executable + '\n' + '''import json,os,pathlib,sys
          pathlib.Path(os.environ['QWEN35_TEST_MARKER_PATH']).write_text(json.dumps({
              'pid': os.getpid(), 'nice': os.getpriority(os.PRIO_PROCESS, 0),
              'home': os.environ.get('HOME'),
              'key_preserved': os.environ.get('LLAMA_API_KEY') == 'SYNTHETIC_NOT_A_CREDENTIAL',
              'guard_env_present': 'QWEN35_GUARDED_ARGV_JSON' in os.environ,
              'argv': sys.argv[1:]
          }))
          ''')
              executable.chmod(0o700)
              fake_argv = [str(executable), '--model', str(module.CANDIDATE_PATH), '--alias', module.CANDIDATE_ALIAS]

              def real_guard(argv):
                  read_fd, write_fd = os.pipe()
                  try:
                      os.write(write_fd, b'G')
                      os.close(write_fd)
                      write_fd = -1
                      env = {
                          **os.environ,
                          'HOME': '/synthetic/service-home',
                          'LLAMA_API_KEY': 'SYNTHETIC_NOT_A_CREDENTIAL',
                          'QWEN35_TEST_MARKER_PATH': str(evidence),
                          'QWEN35_GUARDED_ARGV_JSON': json.dumps(argv),
                      }
                      with subprocess.Popen(
                          [sys.executable, '-c', guard_probe, str(path), str(read_fd)],
                          env=env, pass_fds=(read_fd,), stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      ) as child:
                          try:
                              out, err = child.communicate(timeout=5)
                          except subprocess.TimeoutExpired:
                              child.kill()
                              child.communicate()
                              raise
                          assert out == b'' and err == b''
                          return child.returncode, child.pid
                  finally:
                      for fd in (read_fd, write_fd):
                          if fd >= 0:
                              os.close(fd)

              for flags in (
                  ['--api-key', marker], ['--api-key=' + marker],
                  ['--api_key', marker], ['--api_key=' + marker],
                  ['--api-key'], ['--api-key='], ['--api_key'], ['--api_key='],
                  ['--api-key', marker, '--api_key=' + marker],
                  ['--api-key', marker, '--api-key', marker],
                  ['--api_key=' + marker, '--api_key=' + marker],
              ):
                  code, _ = real_guard(fake_argv + flags)
                  assert code == 84
                  assert not evidence.exists(), 'credential argv reached exec'

              code, pid = real_guard(fake_argv)
              assert code == 0
              result = json.loads(evidence.read_text())
              assert result['pid'] == pid, 'exec changed the supervised task'
              assert result['nice'] >= module.CANDIDATE_NICE_DELTA
              assert result['home'] == '/synthetic/service-home', 'runtime HOME was rewritten'
              assert result['key_preserved'] and not result['guard_env_present']
              assert result['argv'] == fake_argv[1:]

          print('QWEN35_OS_HOME_IDENTITY_CONTRACT=PASS')
          print('QWEN35_REAL_PREEXEC_KEY_REJECTION=PASS')
          print('QWEN35_HOME_INDEPENDENT_SAME_PID_EXEC=PASS')
          print('QWEN35_PREEXEC_KEY_GUARD_CONTRACT=PASS')
          PYGUARD
      - name: Prove candidate ownership, watchdog handoff and recovery regressions
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import contextlib
          import importlib.util
          import os
          import pathlib
          import sys
          import tempfile
          import time
          from unittest import mock

          path = pathlib.Path('scripts/gekta-qwen35-4b-model-host-candidate.py').resolve()
          spec = importlib.util.spec_from_file_location('qwen35_candidate_helper', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          class FakeProc:
              pid = 424242
              def __init__(self):
                  self.waits = 0
              def wait(self, timeout=None):
                  self.waits += 1
                  return 0
              def poll(self):
                  return 0 if self.waits else None
              def send_signal(self, sig):
                  raise AssertionError('direct child signal was not expected in this fixture')

          def baseline():
              return (
                  {'pid': 999, 'exe': '/bin/true', 'cmdlineSha256': 'x', 'apiKeySha256': 'y', 'restarts': 0, 'vmSwapKb': 0, 'startTime': 1},
                  pathlib.Path('/bin/true'),
                  [b'/bin/true'],
                  {},
              )

          def run_setup_failure(stage):
              with tempfile.TemporaryDirectory() as tmp:
                  root = pathlib.Path(tmp)
                  candidate = root / 'candidate.gguf'
                  candidate.write_bytes(b'x')
                  proc = FakeProc()
                  release_calls = []
                  calls = {'pidfd': 0, 'identity_record': 0, 'pid_record': 0, 'watchdog': 0}

                  def track_release(fd, data):
                      release_calls.append((fd, data))
                      return len(data)

                  def injected_pidfd(pid, flags=0):
                      calls['pidfd'] += 1
                      if stage == 'pidfd':
                          raise OSError('INJECT_PIDFD')
                      return os.open(os.devnull, os.O_RDONLY)

                  def injected_identity(pid):
                      calls['identity_record'] += 1
                      if stage == 'identity_record':
                          raise OSError('INJECT_IDENTITY_RECORD')

                  def injected_identity_record(pid):
                      calls['identity_record'] += 1
                      if stage == 'identity_record':
                          raise OSError('INJECT_IDENTITY_RECORD')
                      identity_path.write_text('{"bootId":"review","pid":424242,"startTime":1}\n', encoding='utf-8')

                  def injected_pid_record(path, pid):
                      calls['pid_record'] += 1
                      if stage == 'pid_record':
                          raise OSError('INJECT_PID_RECORD')

                  def injected_watchdog(candidate_pid, baseline_pid):
                      calls['watchdog'] += 1
                      if stage == 'watchdog':
                          raise OSError('INJECT_WATCHDOG')
                      return (
                          os.open(os.devnull, os.O_RDONLY),
                          os.open(os.devnull, os.O_WRONLY),
                      )

                  expected = {
                      'pidfd': ('candidate_pidfd_setup_failed', {'pidfd': 1, 'identity_record': 0, 'pid_record': 0, 'watchdog': 0}),
                      'identity_record': ('INJECT_IDENTITY_RECORD', {'pidfd': 1, 'identity_record': 1, 'pid_record': 0, 'watchdog': 0}),
                      'pid_record': ('INJECT_PID_RECORD', {'pidfd': 1, 'identity_record': 1, 'pid_record': 1, 'watchdog': 0}),
                      'watchdog': ('INJECT_WATCHDOG', {'pidfd': 1, 'identity_record': 1, 'pid_record': 1, 'watchdog': 1}),
                  }[stage]

                  with contextlib.ExitStack() as stack:
                      stack.enter_context(mock.patch.object(module, 'CANDIDATE_PATH', candidate))
                      stack.enter_context(mock.patch.object(module, 'CANDIDATE_SIZE', 1))
                      stack.enter_context(mock.patch.object(module, 'CANDIDATE_SHA256', 'hash'))
                      stack.enter_context(mock.patch.object(module, 'STATE_DIR', root / 'state'))
                      stack.enter_context(mock.patch.object(module, 'LOG_PATH', root / 'candidate.log'))
                      stack.enter_context(mock.patch.object(module, 'PID_PATH', root / 'candidate.pid'))
                      stack.enter_context(mock.patch.object(module, 'CANDIDATE_IDENTITY_PATH', root / 'candidate-identity.json'))
                      stack.enter_context(mock.patch.object(module, 'WATCHDOG_PID_PATH', root / 'watchdog.pid'))
                      stack.enter_context(mock.patch.object(module, 'require_nonroot', return_value='tai'))
                      stack.enter_context(mock.patch.object(module, 'sha_file', return_value='hash'))
                      stack.enter_context(mock.patch.object(module, 'snapshot_baseline', side_effect=baseline))
                      stack.enter_context(mock.patch.object(module, 'ensure_start_capacity', return_value=None))
                      stack.enter_context(mock.patch.object(module, 'save_state', return_value=None))
                      stack.enter_context(mock.patch.object(module.subprocess, 'Popen', return_value=proc))
                      stack.enter_context(mock.patch.object(module, 'stop_watchdog', return_value=None))
                      stack.enter_context(mock.patch.object(module, 'verify_listener_absent', return_value=None))
                      stack.enter_context(mock.patch.object(module.os, 'write', side_effect=track_release))
                      stack.enter_context(mock.patch.object(module.os, 'pidfd_open', side_effect=injected_pidfd))
                      stack.enter_context(mock.patch.object(module, 'write_candidate_identity', side_effect=injected_identity))
                      stack.enter_context(mock.patch.object(module, 'write_pid', side_effect=injected_pid_record))
                      stack.enter_context(mock.patch.object(module, 'launch_watchdog', side_effect=injected_watchdog))
                      try:
                          module.start('a' * 64)
                      except Exception as exc:
                          if expected[0] not in str(exc):
                              raise AssertionError(stage + ' wrong failure: ' + repr(exc)) from exc
                      else:
                          raise AssertionError(stage + ' did not fail')

                  if release_calls:
                      raise AssertionError(stage + ' released candidate before ownership: ' + repr(release_calls))
                  if calls != expected[1]:
                      raise AssertionError(stage + ' wrong injected-stage calls: ' + repr(calls))
                  if proc.waits < 1:
                      raise AssertionError(stage + ' guard child was not reaped')

          for stage in ('pidfd', 'identity_record', 'pid_record', 'watchdog'):
              run_setup_failure(stage)

          # The watchdog must acknowledge pidfd ownership while the process is
          # still the inert guard, arm an independent hard-lease enforcer, and
          # wait for the explicit parent ARM token before it may monitor/stop the
          # candidate. This closes the READY->release race seen on Linux.
          class FakeLeaseThread:
              def __init__(self, *, target, args, name, daemon):
                  self.target = target
                  self.args = args
                  self.name = name
                  self.daemon = daemon
                  self.alive = False
                  self.closed = False
              def start(self):
                  self.alive = True
                  self.args[2].set()
              def is_alive(self):
                  return self.alive
              def join(self, timeout=None):
                  if not self.closed:
                      os.close(self.args[0])
                      self.closed = True
                  self.alive = False

          ready_read, ready_write = os.pipe()
          arm_read, arm_write = os.pipe()
          os.write(arm_write, b'A')
          os.close(arm_write)
          owned_fd = os.open(os.devnull, os.O_RDONLY)
          candidate_states = iter((False, True, True))
          exit_states = iter((False, False, True))
          stop_calls = []
          heavy_baseline = mock.Mock(return_value=True)
          with contextlib.ExitStack() as stack:
              stack.enter_context(mock.patch.object(module, 'load_state', return_value={'pid': 999, 'startTime': 1}))
              stack.enter_context(mock.patch.object(module.os, 'pidfd_open', return_value=owned_fd))
              stack.enter_context(mock.patch.object(module.os, 'dup', return_value=os.open(os.devnull, os.O_RDONLY)))
              stack.enter_context(mock.patch.object(module, 'candidate_guard_process_matches', return_value=True))
              stack.enter_context(mock.patch.object(module, 'baseline_matches_state', heavy_baseline))
              stack.enter_context(mock.patch.object(module, 'baseline_process_matches_state', return_value=True))
              stack.enter_context(mock.patch.object(module, 'candidate_process_matches', side_effect=lambda pid: next(candidate_states)))
              stack.enter_context(mock.patch.object(module, 'pidfd_exited', side_effect=lambda fd: next(exit_states)))
              stack.enter_context(mock.patch.object(module, 'wait_pidfd_exit', return_value=False))
              stack.enter_context(mock.patch.object(module, 'proc_kb', return_value=1))
              stack.enter_context(mock.patch.object(module, 'mem_available_kb', return_value=16 * 1024 * 1024))
              stack.enter_context(mock.patch.object(module, 'verify_listener_absent', return_value=None))
              stack.enter_context(mock.patch.object(module, 'stop_pidfd_owned_process', side_effect=lambda fd: stop_calls.append(fd)))
              stack.enter_context(mock.patch.object(module.threading, 'Thread', side_effect=FakeLeaseThread))
              result = module.watchdog(424242, 999, ready_write, arm_read)
          token = os.read(ready_read, 2)
          os.close(ready_read)
          if result != 0 or token != b'R' or stop_calls:
              raise AssertionError('watchdog pidfd transition handoff failed')
          if heavy_baseline.call_count != 1:
              raise AssertionError('blocking baseline probe ran after candidate release')

          # Parent release ordering must be G first and A second. This exercises
          # the exact seam that failed in production with BrokenPipe before inference.
          def success_baseline():
              argv = [
                  b'/bin/true',
                  b'--model', b'/tmp/base.gguf',
                  b'--alias', module.BASELINE_ALIAS.encode(),
                  b'--host', b'127.0.0.1',
                  b'--port', b'8080',
                  b'--threads', b'16',
                  b'--threads-batch', b'16',
                  b'--parallel', b'1',
                  b'--ctx-size', b'8192',
                  b'--batch-size', b'512',
                  b'--ubatch-size', b'128',
              ]
              return (
                  {
                      'pid': 999,
                      'exe': '/bin/true',
                      'cmdlineSha256': 'x',
                      'apiKeySha256': 'y',
                      'restarts': 0,
                      'vmSwapKb': 0,
                      'startTime': 1,
                  },
                  pathlib.Path('/bin/true'),
                  argv,
                  {'LLAMA_API_KEY': 'b' * 64},
              )

          def run_parent_release_order(break_guard=False):
              with tempfile.TemporaryDirectory() as tmp:
                  root = pathlib.Path(tmp)
                  candidate = root / 'candidate.gguf'
                  candidate.write_bytes(b'x')
