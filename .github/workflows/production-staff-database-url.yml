name: Production Staff Database URL Provision

on:
  pull_request:
    paths:
      - '.github/workflows/production-staff-database-url.yml'
      - 'scripts/production-full-stack-exact-sha.sh'
      - 'scripts/provision-production-staff-database-url.sh'
      - 'scripts/check-production-staff-database-provision.mjs'
      - 'docs/platform-v7/autopilot/scopes/production-staff-database-provision-3734.json'
      - 'docs/platform-v7/autopilot/autopilot-state.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-staff-database-url
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3072
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  EVIDENCE_DIR: artifacts/production-staff-database-url

jobs:
  authority:
    name: Validate owner authority and staff-database provision contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3072 &&
       github.event.comment.user.login == github.repository_owner &&
       (github.event.comment.body == '/production provision-staff-database-url current-main' ||
        github.event.comment.body == '/production rollback-full-stack failed-run-31273608232'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.target.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate static safety contract
        if: github.event_name == 'pull_request'
        run: |
          set -Eeuo pipefail
          node scripts/check-production-staff-database-provision.mjs
          node scripts/check-production-full-stack-release.mjs
      - name: Resolve exact owner authority
        id: target
        if: github.event_name == 'issue_comment'
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENTER" == "$OWNER" && "$ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]]
          git fetch --no-tags origin main
          target_sha="$(git rev-parse origin/main)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$target_sha" ]]
          node scripts/check-production-staff-database-provision.mjs
          node scripts/check-production-full-stack-release.mjs
          echo "authorized=1" >> "$GITHUB_OUTPUT"

  provision:
    name: Provision protected staff database URL on REG.RU
    needs: authority
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success' &&
      needs.authority.outputs.authorized == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact current-main checkout
        id: current
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target_sha="$(git rev-parse origin/main)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$target_sha" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          node scripts/check-production-staff-database-provision.mjs
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"; user="$(trim "${SSH_USER_SECRET:-}")"; port="$(trim "${SSH_PORT_SECRET:-22}")"; expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ && "$port" =~ ^[0-9]+$ && "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          (( port >= 1 && port <= 65535 ))
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            ssh-keygen -lf "$public_key" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          while IFS= read -r line; do fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"; done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]; mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" 'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; docker compose version >/dev/null; echo ROOT_SSH_AUTH_OK' > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "user=$user" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Provision staff URL or restore the bounded failed rollout
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          COMMAND: ${{ github.event.comment.body }}
          TARGET_SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -Eeuo pipefail
          case "$COMMAND" in
            '/production provision-staff-database-url current-main')
              remote="/tmp/pc-staff-database-url-${GITHUB_RUN_ID}.sh"
              scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/provision-production-staff-database-url.sh "$USER@$HOST:$remote"
              ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "chmod 0700 '$remote' && '$remote' provision" | tee "$EVIDENCE_DIR/provision.log"
              grep -Eq '^STAFF_DATABASE_URL_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.log"
              grep -Fxq STAFF_DATABASE_URL_VALID=1 "$EVIDENCE_DIR/provision.log"
              ;;
            '/production rollback-full-stack failed-run-31273608232')
              remote="/tmp/pc-full-stack-rollback-${GITHUB_RUN_ID}.sh"
              scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/production-full-stack-exact-sha.sh "$USER@$HOST:$remote"
              ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "chmod 0700 '$remote' && '$remote' rollback '$TARGET_SHA' '31273608232'" | tee "$EVIDENCE_DIR/rollback.log"
              grep -Fxq ROLLBACK_COMPLETE=1 "$EVIDENCE_DIR/rollback.log"
              grep -Fxq ROLLBACK_CONTAINER_REVISIONS_VERIFIED=1 "$EVIDENCE_DIR/rollback.log"
              mapfile -t restored_api < <(sed -n 's/^RESTORED_API_REVISION=//p' "$EVIDENCE_DIR/rollback.log")
              mapfile -t restored_web < <(sed -n 's/^RESTORED_WEB_REVISION=//p' "$EVIDENCE_DIR/rollback.log")
              [[ "${#restored_api[@]}" == 1 && "${#restored_web[@]}" == 1 ]]
              is_revision() { local revision="$1"; [[ "${#revision}" == 40 && "$revision" != *[!0123456789abcdef]* ]]; }
              is_revision "${restored_api[0]}" && is_revision "${restored_web[0]}"
              ;;
            *) exit 15 ;;
          esac
      - name: Remove bounded remote asset and local credentials
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${HOST:-}" && -n "${USER:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "rm -f '/tmp/pc-staff-database-url-${GITHUB_RUN_ID}.sh' '/tmp/pc-full-stack-rollback-${GITHUB_RUN_ID}.sh'" || true; fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
      - name: Publish provision or recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-staff-database-or-recovery-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
