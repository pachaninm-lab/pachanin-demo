name: Gekta P0 SPEED G3C Process Env Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-p0-speed-g3c-process-env-probe.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gekta-p0-speed-g3c-process-env-probe
  cancel-in-progress: false

env:
  MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
  MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
  MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
  MODEL_HOST_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_HOST_KEY }}

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove read-only bounded contract
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/gekta-p0-speed-g3c-process-env-probe.yml
          python3 - "$file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          for required in [
              "github.event.issue.number == 3896",
              "/gekta speed-g3c-process-env-probe current-main",
              "secrets.TAI_MODEL_SSH_KEY",
              "secrets.TAI_MODEL_SSH_HOST_KEY",
              "StrictHostKeyChecking=yes",
              "G3D_ENV_LLAMA_UBATCH_CLASS",
              "G3D_ENV_LD_PRELOAD_PRESENT",
              "G3D_PROC_PPID_IS_1",
              "G3D_PROC_CGROUP_SERVICE_MATCH",
          ]:
              if required not in text:
                  raise SystemExit(f'missing control: {required}')
          # Keep remote mutation/privilege escalation impossible while allowing
          # runner-local temporary-file/key hygiene required by pinned SSH.
          forbidden = [
              'sudo' + ' ',
              'systemctl' + ' restart', 'systemctl' + ' start',
              'systemctl' + ' stop', 'systemctl' + ' enable', 'systemctl' + ' disable',
              'systemctl' + ' daemon-reload', 'systemctl' + ' edit',
              'systemctl' + ' set-property',
              'kill' + ' ', 'pkill' + ' ',
              'secrets.' + 'PC_PROD_SSH_KEY', 'secrets.' + 'PC_PROD_SSH_PRIVATE_KEY',
              'secrets.' + 'VPS_SSH_KEY', 'secrets.' + 'TAI_MODEL_ROOT_SSH_KEY',
              'StrictHostKeyChecking' + '=no',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden control: {token}')
          PY

  probe:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3896 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/gekta speed-g3c-process-env-probe current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact current main
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse origin/main)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" == "$(git rev-parse HEAD)" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned model-host transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }
          host="$(trim "${MODEL_HOST_SECRET:-}")"
          user="$(trim "${MODEL_USER_SECRET:-}")"
          port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ && "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535))
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          write_key "$(trim "${MODEL_KEY_SECRET:-}")" "$HOME/.ssh/id_tai_model" || { echo 'TAI_MODEL_SSH_KEY is required.' >&2; exit 21; }
          pin="$(trim "${MODEL_HOST_KEY_SECRET:-}")"
          [[ -n "$pin" ]] || { echo 'TAI_MODEL_SSH_HOST_KEY is required.' >&2; exit 22; }
          pin_type="$(printf '%s' "$pin" | awk '{print $(NF-1)}')"
          pin_material="$(printf '%s' "$pin" | awk '{print $NF}')"
          [[ -n "$pin_type" && -n "$pin_material" ]] || exit 22
          scanned="$(ssh-keyscan -T 30 -p "$port" -t "$pin_type" "$host" 2>/dev/null || true)"
          printf '%s\n' "$scanned" | awk -v pinned="$pin_material" '$3 == pinned {ok=1} END{exit ok?0:1}' || { echo 'model host key does not match pinned TAI_MODEL_SSH_HOST_KEY' >&2; exit 22; }
          printf '%s %s %s\n' "$host" "$pin_type" "$pin_material" > "$HOME/.ssh/model_known_hosts"
          chmod 600 "$HOME/.ssh/model_known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Read process provenance and environment presence
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$MODEL_USER@$MODEL_HOST" /bin/bash -s > "$RUNNER_TEMP/raw" <<'REMOTE'
          set -Eeuo pipefail
          service=tai-qwen3-8b.service
          systemctl is-active --quiet "$service"
          pid="$(systemctl show "$service" --property=MainPID --value)"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          python3 - "$pid" "$service" <<'PY'
          import hashlib, pathlib, re, subprocess, sys
          pid=int(sys.argv[1]); service=sys.argv[2]
          proc=pathlib.Path(f'/proc/{pid}')
          raw_cmd=proc.joinpath('cmdline').read_bytes()
          argv=[x for x in raw_cmd.split(b'\0') if x]
          env={}
          for entry in proc.joinpath('environ').read_bytes().split(b'\0'):
              if entry and b'=' in entry:
                  k,v=entry.split(b'=',1); env[k]=v
          status=proc.joinpath('status').read_text(encoding='ascii')
          m=re.search(r'^PPid:\s+(\d+)$', status, re.M)
          ppid=int(m.group(1)) if m else -1
          cgroup=proc.joinpath('cgroup').read_text(encoding='utf-8', errors='replace')
          exe=proc.joinpath('exe').resolve(strict=True)

          aliases=(b'--ubatch-size', b'-ub')
          hits=[]
          for i,tok in enumerate(argv):
              for alias in aliases:
                  if tok==alias and i+1<len(argv): hits.append(argv[i+1])
                  elif tok.startswith(alias+b'='): hits.append(tok[len(alias)+1:])
          ub=hits[0] if len(hits)==1 else b''
          def klass(key, allowed):
              if key not in env: return 'ABSENT'
              value=env[key]
              return value.decode('ascii') if value in allowed else 'OTHER'
          app=env.get(b'LLAMA_APP_CMD')
          app_class='ABSENT' if app is None else ('SERVER' if app in {b'server',b'serve'} else 'OTHER')
          restart=subprocess.run(['systemctl','show',service,'--property=Restart','--value'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=5,check=False,env={'PATH':'/usr/bin:/bin','LC_ALL':'C'}).stdout.strip()

          print('G3D_SERVICE_ACTIVE=1')
          print('G3D_PROC_MAINPID_MATCH=1')
          print('G3D_PROC_PPID='+str(ppid))
          print('G3D_PROC_PPID_IS_1='+str(int(ppid==1)))
          print('G3D_PROC_CGROUP_SERVICE_MATCH='+str(int(service in cgroup)))
          print('G3D_PROC_EXE_SHA256='+hashlib.sha256(exe.read_bytes()).hexdigest())
          print('G3D_PROC_CMDLINE_SHA256='+hashlib.sha256(raw_cmd).hexdigest())
          print('G3D_ARG_UBATCH='+(ub.decode('ascii') if re.fullmatch(rb'[0-9]+',ub) else 'INVALID'))
          print('G3D_ENV_LLAMA_UBATCH_CLASS='+klass(b'LLAMA_ARG_UBATCH',{b'128',b'512'}))
          print('G3D_ENV_LLAMA_BATCH_CLASS='+klass(b'LLAMA_ARG_BATCH',{b'128',b'512',b'2048'}))
          print('G3D_ENV_LD_PRELOAD_PRESENT='+str(int(b'LD_PRELOAD' in env)))
          print('G3D_ENV_LD_LIBRARY_PATH_PRESENT='+str(int(b'LD_LIBRARY_PATH' in env)))
          print('G3D_ENV_LLAMA_APP_CMD_CLASS='+app_class)
          print('G3D_SERVICE_RESTART='+(restart if re.fullmatch(r'[A-Za-z0-9_.:-]+',restart) else 'INVALID'))
          PY
          REMOTE
          grep -E '^G3D_[A-Z0-9_]+=([A-Z0-9_.:-]+|[a-f0-9]{64}|[0-9]+)$' "$RUNNER_TEMP/raw" > "$RUNNER_TEMP/evidence"
          [[ "$(wc -l < "$RUNNER_TEMP/evidence")" -eq 15 ]]
          cat "$RUNNER_TEMP/evidence"

      - name: Publish bounded evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Gekta P0 SPEED G3C process/env probe'
            echo
            echo "- exact repository main: \`$TARGET_SHA\`"
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo '- mode: `READ_ONLY`'
            echo '- production mutation: `NONE`'
            echo '- raw environment/argv disclosure: `NONE`'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/evidence"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment 3896 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
