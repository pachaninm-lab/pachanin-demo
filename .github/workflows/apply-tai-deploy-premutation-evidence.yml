name: Apply TAI deploy pre-mutation evidence repair

on:
  push:
    branches:
      - fix/tai-deploy-premutation-evidence-20260802
    paths:
      - scripts/apply-tai-deploy-premutation-evidence.py
      - .github/workflows/apply-tai-deploy-premutation-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tai-deploy-premutation-evidence
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/tai-deploy-premutation-evidence-20260802
          fetch-depth: 0

      - name: Capture exact authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main fix/tai-deploy-premutation-evidence-20260802
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"

      - name: Apply and verify bounded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-tai-deploy-premutation-evidence.py
          bash -n scripts/pc-tai-release-controller-core.sh
          node scripts/check-pc-tai-release-controller.mjs
          git diff --check
          grep -Fq 'set_deploy_failure_stage MODEL_ARTIFACT_EVIDENCE_RECOVERY_FAILED' scripts/pc-tai-release-controller-core.sh
          grep -Fq 'set_deploy_failure_stage ACTIVE_MODEL_TOKEN_RECOVERY_FAILED' scripts/pc-tai-release-controller-core.sh
          grep -Fq '"$job_state/deploy-stage-error.log" "$job_state/full-stack.log"' scripts/pc-tai-release-controller-core.sh
          ! grep -Eq 'publish_file .*deploy[-]stage[-]error[.]log|runner-output/.+deploy[-]stage[-]error[.]log' scripts/pc-tai-release-controller-core.sh

      - name: Publish reviewed source changes only
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main fix/tai-deploy-premutation-evidence-20260802
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/fix/tai-deploy-premutation-evidence-20260802)" = "$EXPECTED_HEAD"
          rm -f scripts/apply-tai-deploy-premutation-evidence.py
          rm -f .github/workflows/apply-tai-deploy-premutation-evidence.yml
          git add -A
          git diff --cached --name-only | sort | tee /tmp/changed.txt
          if grep -Ev '^([.]github/workflows/apply-tai-deploy-premutation-evidence[.]yml|scripts/apply-tai-deploy-premutation-evidence[.]py|scripts/check-pc-tai-release-controller[.]mjs|scripts/pc-tai-release-controller-core[.]sh)$' /tmp/changed.txt; then
            echo 'Final diff exceeds registered pre-mutation evidence scope.' >&2
            exit 31
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(tai): preserve exact pre-mutation deploy blocker'
          git push --force-with-lease="refs/heads/fix/tai-deploy-premutation-evidence-20260802:${EXPECTED_HEAD}" \
            origin HEAD:refs/heads/fix/tai-deploy-premutation-evidence-20260802
