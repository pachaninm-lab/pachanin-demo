name: Outbox Worker Publication Contract

on:
  pull_request:
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/outbox-worker-publication-contract.yml'
      - 'infra/docker/Dockerfile.outbox-worker'
      - 'scripts/release/verify-published-outbox-worker.mjs'
      - 'scripts/release/verify-published-outbox-worker.test.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify publication identity and rejection cases
        run: node --test scripts/release/verify-published-outbox-worker.test.mjs
