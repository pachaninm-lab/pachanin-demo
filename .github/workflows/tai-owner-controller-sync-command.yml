name: TAI Owner Exact Controller Sync Command

on:
  pull_request:
    paths:
      - ".github/workflows/tai-owner-controller-sync-command.yml"
      - "scripts/pc-tai-controller-sync.sh"
      - "scripts/check-tai-controller-sync.mjs"
      - "docs/platform-v7/autopilot/scopes/tai-exact-controller-sync-20260803.json"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: tai-owner-exact-controller-sync-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  authority:
    name: Resolve exact successful full-stack authority
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3365 &&
        github.event.comment.body == '/tai sync-controller current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.authority.outputs.target_sha }}
      full_stack_run_id: ${{ steps.authority.outputs.full_stack_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact controller sync contract
        if: github.event_name == 'pull_request'
        run: |
          set -Eeuo pipefail
          bash -n scripts/pc-tai-controller-sync.sh
          node scripts/check-tai-controller-sync.mjs
      - name: Verify owner command and successful exact-main full-stack run
        id: authority
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENTER" == "$OWNER" ]]
          [[ "$ACTOR" == "$OWNER" ]]
          [[ "$TRIGGERING_ACTOR" == "$OWNER" ]]
          target_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-full-stack-exact-sha.yml/runs?branch=main&status=success&per_page=100" \
            > "$RUNNER_TEMP/full-stack-runs.json"
          full_stack_run_id="$(node - "$RUNNER_TEMP/full-stack-runs.json" "$target_sha" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require('node:fs');
          const [path, sha, repository] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const runs = (Array.isArray(report.workflow_runs) ? report.workflow_runs : [])
            .filter((run) => run?.name === 'Production Full-Stack Exact-SHA Release'
              && run?.head_sha === sha
              && run?.head_branch === 'main'
              && run?.head_repository?.full_name === repository
              && run?.status === 'completed'
              && run?.conclusion === 'success'
              && ['push','workflow_dispatch','issue_comment'].includes(run?.event)
              && Number.isSafeInteger(run?.id) && run.id > 0)
            .sort((left, right) => Date.parse(right.updated_at || right.created_at || '') - Date.parse(left.updated_at || left.created_at || '') || right.id - left.id);
          if (!runs[0]) process.exit(2);
          process.stdout.write(String(runs[0].id));
          NODE
          )"
          [[ "$full_stack_run_id" =~ ^[0-9]+$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${full_stack_run_id}/jobs?per_page=100" \
            > "$RUNNER_TEMP/full-stack-jobs.json"
          node - "$RUNNER_TEMP/full-stack-jobs.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report || !Array.isArray(report.jobs) || report.total_count !== report.jobs.length) process.exit(2);
          const required = ['Validate full-stack release contract','Migrate, deploy API and web, verify live intake'];
          for (const name of required) {
            const matches = report.jobs.filter((job) => job?.name === name);
            if (matches.length !== 1 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success') process.exit(3);
          }
          NODE
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "full_stack_run_id=$full_stack_run_id" >> "$GITHUB_OUTPUT"

  sync:
    name: Synchronize exact root controller on REG.RU
    needs: authority
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success' &&
      needs.authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ needs.authority.outputs.target_sha }}
      EVIDENCE_DIR: artifacts/tai-controller-sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact checkout
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          bash -n scripts/pc-tai-release-controller.sh
          bash -n scripts/pc-tai-controller-sync.sh
      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            ssh-keygen -lf "$public_key" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}"
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; echo ROOT_SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Copy bounded exact-main controller assets
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${common[@]}" scripts/pc-tai-release-controller.sh "$USER@$HOST:/tmp/pc-tai-controller-${GITHUB_RUN_ID}.sh"
          scp "${common[@]}" scripts/pc-tai-controller-sync.sh "$USER@$HOST:/tmp/pc-tai-controller-sync-${GITHUB_RUN_ID}.sh"
      - name: Atomically synchronize controller and authority digest
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "chmod 0700 /tmp/pc-tai-controller-sync-${GITHUB_RUN_ID}.sh && /tmp/pc-tai-controller-sync-${GITHUB_RUN_ID}.sh '$TARGET_SHA' '$GITHUB_RUN_ID' '/tmp/pc-tai-controller-${GITHUB_RUN_ID}.sh' '/var/lib/pc-release-authority/runner-output/${GITHUB_RUN_ID}/controller-sync.json'" \
            | tee "$EVIDENCE_DIR/controller-sync.log"
          grep -Fxq TAI_CONTROLLER_SYNC_COMPLETE=1 "$EVIDENCE_DIR/controller-sync.log"
      - name: Retrieve redacted controller evidence
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${common[@]}" "$USER@$HOST:/var/lib/pc-release-authority/runner-output/${GITHUB_RUN_ID}/controller-sync.json" "$EVIDENCE_DIR/controller-sync.json"
          node - "$EVIDENCE_DIR/controller-sync.json" "$TARGET_SHA" <<'NODE'
          const fs = require('node:fs');
          const [path, sha] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.schemaVersion !== 'tai.controller-sync.v1' || report.targetSha !== sha || report.passed !== true || report.currentSha256 !== report.markerCurrentSha256 || report.runnerDirectDockerAuthority !== false) process.exit(2);
          NODE
      - name: Remove transient remote and local key material
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set +e
          if [[ -n "${HOST:-}" && -n "${USER:-}" && "${PORT:-}" =~ ^[0-9]+$ && -f "$HOME/.ssh/id_pc_prod" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "rm -f '/tmp/pc-tai-controller-${GITHUB_RUN_ID}.sh' '/tmp/pc-tai-controller-sync-${GITHUB_RUN_ID}.sh'" >/dev/null 2>&1
          fi
          rm -rf "$HOME/.ssh"
      - name: Upload controller sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-controller-sync-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish exact controller sync result
    needs: [authority, sync]
    if: >-
      always() &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3365 &&
      github.event.comment.body == '/tai sync-controller current-main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - name: Publish terminal redacted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          SYNC_RESULT: ${{ needs.sync.result }}
          TARGET_SHA: ${{ needs.authority.outputs.target_sha }}
          FULL_STACK_RUN_ID: ${{ needs.authority.outputs.full_stack_run_id }}
        run: |
          set -Eeuo pipefail
          state=failure
          terminal=FAILED_NO_PREFLIGHT_STARTED
          description='TAI exact controller synchronization failed'
          if [[ "$AUTHORITY_RESULT" == success && "$SYNC_RESULT" == success ]]; then
            state=success
            terminal=PASS
            description='TAI exact controller synchronization PASS'
          fi
          if [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$state" -f context='TAI Controller Sync' -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## TAI exact controller synchronization

          - result: \`$terminal\`
          - exact main: \`${TARGET_SHA:-unresolved}\`
          - verified full-stack run: \`${FULL_STACK_RUN_ID:-none}\`
          - controller sync run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - self-hosted runner privilege changed: \`false\`
          - TAI preflight started: \`false\`
          EOF
          gh issue comment 3365 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          [[ "$state" == success ]]

  result_gate:
    name: Confirm exact controller sync result
    needs: [authority, sync, publish]
    if: >-
      always() &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3365 &&
      github.event.comment.body == '/tai sync-controller current-main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject failed or skipped synchronization jobs
        env:
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          SYNC_RESULT: ${{ needs.sync.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -Eeuo pipefail
          [[ "$AUTHORITY_RESULT" == success ]]
          [[ "$SYNC_RESULT" == success ]]
          [[ "$PUBLISH_RESULT" == success ]]
