name: TAI Qwen Model Host Password Repair and Activation Retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tai-qwen-model-host-password-repair.yml'
      - 'apps/web/.release-triggers/qwen-3372-6.txt'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter REPAIR-WITH-PROTECTED-SUDO-AND-ACTIVATE
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write
  statuses: write

concurrency:
  group: tai-qwen-model-host-repair-and-activation
  cancel-in-progress: false

env:
  MODEL_PRIVATE_IP: 192.168.0.206
  MODEL_PORT: '18080'
  MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
  MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
  MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
  MODEL_PASSWORD_SECRET: ${{ secrets.TAI_MODEL_SSH_PASSWORD }}
  PROD_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  PROD_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  PROD_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}

jobs:
  repair-and-dispatch:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          inputs.confirmation == 'REPAIR-WITH-PROTECTED-SUDO-AND-ACTIVATE'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact current-main target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          target='${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}'
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse origin/main)" ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Publish repair pending status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending \
            -f context='TAI Qwen Protected Sudo Repair exact-main' \
            -f description='Protected sudo repair and activation preparation is running' \
            -f target_url="$run_url" >/dev/null

      - name: Resolve protected model-host SSH transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          marker_file="$RUNNER_TEMP/tai-qwen-password-repair-failure"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }

          model_host="$(trim "${MODEL_HOST_SECRET:-}")"
          model_user="$(trim "${MODEL_USER_SECRET:-root}")"
          model_port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$model_host" && "$model_user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || {
            echo 'MODEL_REPAIR_FAIL=SSH_IDENTITY_INVALID' | tee "$marker_file" >&2
            exit 10
          }
          [[ "$model_port" =~ ^[0-9]+$ ]] && (( model_port >= 1 && model_port <= 65535 )) || {
            echo 'MODEL_REPAIR_FAIL=SSH_PORT_INVALID' | tee "$marker_file" >&2
            exit 11
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          model_key="${MODEL_KEY_SECRET:-${PROD_KEY_PRIMARY:-${PROD_KEY_SECONDARY:-${PROD_KEY_FALLBACK:-}}}}"
          write_key "$model_key" "$HOME/.ssh/id_tai_model" || {
            echo 'MODEL_REPAIR_FAIL=SSH_PRIVATE_KEY_UNAVAILABLE' | tee "$marker_file" >&2
            exit 12
          }
          ssh-keyscan -T 10 -p "$model_port" "$model_host" 2>/dev/null | sort -u > "$HOME/.ssh/model_known_hosts"
          [[ -s "$HOME/.ssh/model_known_hosts" ]] || {
            echo 'MODEL_REPAIR_FAIL=SSH_HOST_KEY_UNAVAILABLE' | tee "$marker_file" >&2
            exit 13
          }
          chmod 600 "$HOME/.ssh/model_known_hosts"
          {
            echo "model_host=$model_host"
            echo "model_user=$model_user"
            echo "model_port=$model_port"
          } >> "$GITHUB_OUTPUT"

      - name: Repair through protected sudo credential and install exact activation bridge
        id: repair
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.model_host }}
          MODEL_USER: ${{ steps.ssh.outputs.model_user }}
          MODEL_SSH_PORT: ${{ steps.ssh.outputs.model_port }}
          SUDO_PASSWORD: ${{ env.MODEL_PASSWORD_SECRET }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker_file="$RUNNER_TEMP/tai-qwen-password-repair-failure"
          repair_log="$RUNNER_TEMP/tai-qwen-password-repair.log"
          root_script="$RUNNER_TEMP/tai-qwen-password-root-repair.sh"
          rm -f "$marker_file" "$repair_log" "$root_script"
          ssh_common=(
            -i "$HOME/.ssh/id_tai_model"
            -p "$MODEL_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts"
            -o StrictHostKeyChecking=yes
          )
          [[ -z "${SUDO_PASSWORD:-}" ]] || echo "::add-mask::$SUDO_PASSWORD"

          set +e
          rollback_result="$(
            ssh "${ssh_common[@]}" "$MODEL_USER@$MODEL_HOST" \
              'TAI_QWEN_ACTIVATION_BRIDGE_ROLLBACK_V1' 2>/dev/null
          )"
          rollback_rc=$?
          set -e
          if (( rollback_rc == 0 )) && grep -Fq 'TAI_QWEN_ACTIVATION_BRIDGE_ROLLBACK=PASS' <<<"$rollback_result"; then
            echo 'MODEL_REPAIR_PASS=PRIOR_BRIDGE_ROLLED_BACK'
          fi
          unset rollback_result

          privilege="$(
            ssh "${ssh_common[@]}" "$MODEL_USER@$MODEL_HOST" \
              'if [ "$(id -u)" -eq 0 ]; then echo ROOT; elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then echo SUDO_N; else echo SUDO_PASSWORD; fi'
          )" || {
            echo 'MODEL_REPAIR_FAIL=SSH_PRIVILEGE_PROBE_FAILED' | tee "$marker_file" >&2
            exit 20
          }
          case "$privilege" in
            ROOT|SUDO_N|SUDO_PASSWORD) ;;
            *)
              echo 'MODEL_REPAIR_FAIL=SSH_PRIVILEGE_MODE_INVALID' | tee "$marker_file" >&2
              exit 21
              ;;
          esac

          if [[ "$privilege" == SUDO_PASSWORD ]]; then
            [[ -n "${SUDO_PASSWORD:-}" ]] || {
              echo 'MODEL_REPAIR_FAIL=SUDO_PASSWORD_SECRET_UNAVAILABLE' | tee "$marker_file" >&2
              exit 22
            }
            set +e
            printf '%s\n' "$SUDO_PASSWORD" |
              ssh "${ssh_common[@]}" "$MODEL_USER@$MODEL_HOST" \
                "sudo -S -p '' -k true" >/dev/null 2>&1
            sudo_probe_rc=${PIPESTATUS[1]}
            set -e
            (( sudo_probe_rc == 0 )) || {
              echo 'MODEL_REPAIR_FAIL=SUDO_PASSWORD_REJECTED' | tee "$marker_file" >&2
              exit 23
            }
            echo 'MODEL_REPAIR_PASS=PROTECTED_SUDO_PASSWORD_ACCEPTED'
          elif [[ "$privilege" == SUDO_N ]]; then
            echo 'MODEL_REPAIR_PASS=PASSWORDLESS_SUDO_ACCEPTED'
          else
            echo 'MODEL_REPAIR_PASS=SSH_LOGIN_ALREADY_ROOT'
          fi

          cat > "$root_script" <<'ROOT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          login_user="$1"
          service=tai-qwen3-8b.service
          env_file=/etc/tai/qwen3-8b.env
          private_listener=192.168.0.206:18080
          bridge=/usr/local/sbin/tai-qwen-ssh-activation-bridge
          helper=/usr/local/sbin/tai-qwen-activation-preflight
          rollback=/usr/local/sbin/tai-qwen-activation-bridge-rollback
          shell_backup=/etc/tai/qwen3-8b-ssh-shell.before
          sudoers=/etc/sudoers.d/tai-qwen-activation-preflight
          expected_hash=2f4c983b3b64c7d8a952c8f473974ee788ce66e2728d9fb25a6a91606642fe77

          diagnostics(){
            systemctl show "$service" --no-pager \
              --property=ActiveState,SubState,Result,ExecMainStatus,NRestarts 2>/dev/null |
              sed 's/^/MODEL_SERVICE_/' >&2 || true
            ss -H -ltn 'sport = :18080' 2>/dev/null |
              awk '{print $4}' | sort -u | sed 's/^/MODEL_LISTENER=/' >&2 || true
          }
          fail(){ printf 'MODEL_REPAIR_FAIL=%s\n' "$1" >&2; diagnostics; exit "$2"; }
          pass(){ printf 'MODEL_REPAIR_PASS=%s\n' "$1"; }

          [[ "$(id -u)" -eq 0 ]] || fail ROOT_ELEVATION_FAILED 30
          [[ "$login_user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || fail LOGIN_USER_INVALID 31
          id "$login_user" >/dev/null 2>&1 || fail LOGIN_USER_UNKNOWN 32
          [[ -r "$env_file" ]] || fail ENV_FILE_MISSING_OR_UNREADABLE 33
          chmod 0600 "$env_file" || fail ENV_FILE_MODE_REPAIR_FAILED 34
          pass ENV_FILE_MODE_600

          set +u
          set -a
          source "$env_file" || fail ENV_FILE_PARSE_FAILED 35
          set +a
          key_length="${#TAI_LLM_API_KEY}"
          set -u
          if (( key_length < 32 )); then
            command -v openssl >/dev/null 2>&1 || fail OPENSSL_UNAVAILABLE 36
            new_key="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            found=0
            while IFS= read -r line || [[ -n "$line" ]]; do
              case "$line" in
                TAI_LLM_API_KEY=*) printf 'TAI_LLM_API_KEY=%s\n' "$new_key" >> "$tmp"; found=1 ;;
                *) printf '%s\n' "$line" >> "$tmp" ;;
              esac
            done < "$env_file"
            (( found == 1 )) || printf 'TAI_LLM_API_KEY=%s\n' "$new_key" >> "$tmp"
            install -m 0600 -o root -g root "$tmp" "$env_file"
            rm -f "$tmp"
            unset new_key TAI_LLM_API_KEY
            pass API_KEY_ROTATED_WITHOUT_DISCLOSURE
          else
            unset TAI_LLM_API_KEY
            pass API_KEY_LENGTH_VALID
          fi

          systemctl daemon-reload || fail SYSTEMD_DAEMON_RELOAD_FAILED 37
          systemctl restart "$service" || fail SERVICE_RESTART_FAILED 38
          ready=0
          for attempt in $(seq 1 45); do
            if systemctl is-active --quiet "$service" &&
               ss -H -ltn 'sport = :18080' 2>/dev/null |
                 awk -v expected="$private_listener" '$4 == expected { found=1 } END { exit(found ? 0 : 1) }'; then
              ready=1
              break
            fi
            sleep 4
          done
          (( ready == 1 )) || fail PRIVATE_LISTENER_NOT_READY 39
          pass PRIVATE_LISTENER_READY

          listeners="$(ss -H -ltn 'sport = :18080' 2>/dev/null | awk '{print $4}' | sort -u)"
          [[ -n "$listeners" ]] || fail LISTENER_SET_EMPTY 40
          while IFS= read -r listener; do
            case "$listener" in
              0.0.0.0:18080|'[::]':18080|'*':18080) fail PUBLIC_LISTENER_PRESENT 41 ;;
            esac
          done <<< "$listeners"
          pass PUBLIC_LISTENER_ABSENT

          set +u
          set -a
          source "$env_file" || fail ENV_FILE_RELOAD_FAILED 42
          set +a
          [[ "${#TAI_LLM_API_KEY}" -ge 32 ]] || fail API_KEY_INVALID_AFTER_REPAIR 43
          health_code="$(
            curl -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 3 --max-time 20 \
              -H "Authorization: Bearer $TAI_LLM_API_KEY" \
              http://192.168.0.206:18080/health || true
          )"
          unset TAI_LLM_API_KEY
          set -u
          [[ "$health_code" == 200 ]] || fail "HEALTH_HTTP_${health_code:-NONE}" 44
          pass AUTHENTICATED_HEALTH_200

          install -d -m 0700 /etc/tai
          current_shell="$(getent passwd "$login_user" | awk -F: '{print $7}')"
          [[ -n "$current_shell" ]] || fail LOGIN_SHELL_UNRESOLVED 45
          if [[ "$current_shell" != "$bridge" ]]; then
            [[ "$current_shell" == /* && -x "$current_shell" ]] || fail LOGIN_SHELL_UNSAFE 46
            printf '%s\n' "$current_shell" > "$shell_backup"
            chmod 0600 "$shell_backup"
          elif [[ ! -s "$shell_backup" ]]; then
            fail LOGIN_SHELL_BACKUP_MISSING 47
          fi

          cat > "$helper.tmp" <<'HELPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          test "$(id -u)" -eq 0
          systemctl is-active --quiet tai-qwen3-8b.service
          test -r /etc/tai/qwen3-8b.env
          test "$(stat -c %a /etc/tai/qwen3-8b.env)" = 600
          set -a; source /etc/tai/qwen3-8b.env; set +a
          test "${#TAI_LLM_API_KEY}" -ge 32
          ss -H -ltn | grep -Eq "192[.]168[.]0[.]206:18080[[:space:]]"
          ! ss -H -ltn | grep -Eq "(^|[[:space:]])(0[.]0[.]0[.]0|[[]::[]]):18080[[:space:]]"
          curl -fsS --connect-timeout 3 --max-time 15 \
            -H "Authorization: Bearer $TAI_LLM_API_KEY" \
            http://192.168.0.206:18080/health >/dev/null
          printf %s "$TAI_LLM_API_KEY"
          HELPER
          install -m 0755 -o root -g root "$helper.tmp" "$helper"
          rm -f "$helper.tmp"

          cat > "$rollback.tmp" <<ROLLBACK
          #!/usr/bin/env bash
          set -Eeuo pipefail
          original_shell="\$(cat "$shell_backup")"
          [[ "\$original_shell" == /* && -x "\$original_shell" ]]
          usermod -s "\$original_shell" "$login_user"
          echo TAI_QWEN_ACTIVATION_BRIDGE_ROLLBACK=PASS
          ROLLBACK
          install -m 0755 -o root -g root "$rollback.tmp" "$rollback"
          rm -f "$rollback.tmp"

          cat > "$bridge.tmp" <<BRIDGE
          #!/bin/sh
          set -eu
          if [ "\${1:-}" = "-c" ] && [ "\$#" -eq 2 ]; then
            if [ "\$2" = "TAI_QWEN_ACTIVATION_BRIDGE_ROLLBACK_V1" ]; then
              exec sudo -n "$rollback"
            fi
            actual="\$(printf %s "\$2" | sha256sum | awk '{print \$1}')"
            if [ "\$actual" = "$expected_hash" ]; then
              exec sudo -n "$helper"
            fi
          fi
          echo TAI_QWEN_SSH_COMMAND_DENIED >&2
          exit 126
          BRIDGE
          install -m 0755 -o root -g root "$bridge.tmp" "$bridge"
          rm -f "$bridge.tmp"

          command -v visudo >/dev/null 2>&1 || fail VISUDO_UNAVAILABLE 48
          {
            printf '%s ALL=(root) NOPASSWD: %s, %s\n' "$login_user" "$helper" "$rollback"
          } > "$sudoers.tmp"
          chmod 0440 "$sudoers.tmp"
          visudo -cf "$sudoers.tmp" >/dev/null || fail SUDOERS_VALIDATION_FAILED 49
          install -m 0440 -o root -g root "$sudoers.tmp" "$sudoers"
          rm -f "$sudoers.tmp"
          visudo -cf "$sudoers" >/dev/null || fail SUDOERS_INSTALL_INVALID 50

          activation_remote='set -euo pipefail
          test "$(id -u)" -eq 0
          systemctl is-active --quiet tai-qwen3-8b.service
          test -r /etc/tai/qwen3-8b.env
          test "$(stat -c %a /etc/tai/qwen3-8b.env)" = 600
          set -a; source /etc/tai/qwen3-8b.env; set +a
          test "${#TAI_LLM_API_KEY}" -ge 32
          ss -H -ltn | grep -Eq "192[.]168[.]0[.]206:18080[[:space:]]"
          ! ss -H -ltn | grep -Eq "(^|[[:space:]])(0[.]0[.]0[.]0|[[]::[]]):18080[[:space:]]"
          curl -fsS --connect-timeout 3 --max-time 15 -H "Authorization: Bearer $TAI_LLM_API_KEY" http://192.168.0.206:18080/health >/dev/null
          printf %s "$TAI_LLM_API_KEY"'
          computed_hash="$(printf %s "$activation_remote" | sha256sum | awk '{print $1}')"
          [[ "$computed_hash" == "$expected_hash" ]] || fail ACTIVATION_COMMAND_HASH_DRIFT 51
          probe_key="$(sudo -u "$login_user" "$bridge" -c "$activation_remote")" || fail BRIDGE_POSITIVE_PROBE_FAILED 52
          [[ "${#probe_key}" -ge 32 ]] || fail BRIDGE_KEY_PROBE_INVALID 53
          unset probe_key
          if sudo -u "$login_user" "$bridge" -c 'id' >/dev/null 2>&1; then
            fail BRIDGE_NEGATIVE_PROBE_ALLOWED 54
          fi
          pass BRIDGE_LOCAL_PROBES_PASS

          usermod -s "$bridge" "$login_user" || fail BRIDGE_SHELL_INSTALL_FAILED 55
          [[ "$(getent passwd "$login_user" | awk -F: '{print $7}')" == "$bridge" ]] || fail BRIDGE_SHELL_NOT_ACTIVE 56
          pass EXACT_ACTIVATION_BRIDGE_ACTIVE
          printf 'MODEL_REPAIR_STATUS=PASS\n'
          ROOT
          chmod 0700 "$root_script"

          set +e
          case "$privilege" in
            ROOT)
              ssh "${ssh_common[@]}" "$MODEL_USER@$MODEL_HOST" \
                "exec /bin/bash -s -- '$MODEL_USER'" \
                < "$root_script" 2>&1 | tee "$repair_log"
              remote_rc=${PIPESTATUS[0]}
              ;;
            SUDO_N)
              ssh "${ssh_common[@]}" "$MODEL_USER@$MODEL_HOST" \
                "exec sudo -n /bin/bash -s -- '$MODEL_USER'" \
                < "$root_script" 2>&1 | tee "$repair_log"
              remote_rc=${PIPESTATUS[0]}
              ;;
            SUDO_PASSWORD)
              {
                printf '%s\n' "$SUDO_PASSWORD"
                cat "$root_script"
              } |
                ssh "${ssh_common[@]}" "$MODEL_USER@$MODEL_HOST" \
                  "exec sudo -S -p '' -k /bin/bash -s -- '$MODEL_USER'" \
                  2>&1 | tee "$repair_log"
              pipe_status=("${PIPESTATUS[@]}")
              remote_rc="${pipe_status[1]}"
              ;;
          esac
          set -e
          rm -f "$root_script"
          unset SUDO_PASSWORD

          if (( remote_rc != 0 )); then
            marker="$(grep -Eo 'MODEL_REPAIR_FAIL=[A-Z0-9_]+' "$repair_log" | tail -1 || true)"
            [[ -n "$marker" ]] || marker='MODEL_REPAIR_FAIL=REMOTE_REPAIR_UNCLASSIFIED'
            printf '%s\n' "$marker" | tee "$marker_file" >&2
            exit "$remote_rc"
          fi
          grep -Fxq 'MODEL_REPAIR_STATUS=PASS' "$repair_log" || {
            echo 'MODEL_REPAIR_FAIL=PASS_MARKER_MISSING' | tee "$marker_file" >&2
            exit 24
          }
          echo 'repair_passed=1' >> "$GITHUB_OUTPUT"

      - name: Publish repair success and dispatch accepted activation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=success \
            -f context='TAI Qwen Protected Sudo Repair exact-main' \
            -f description='Private Qwen repaired; exact activation bridge accepted' \
            -f target_url="$run_url" >/dev/null
          gh issue reopen 3372 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh issue comment 3372 --repo "$GITHUB_REPOSITORY" --body "Protected sudo repair, private authenticated health and exact-command activation bridge passed for exact main \`$TARGET_SHA\`. Repair workflow: $run_url. The accepted REG.RU activation workflow is being dispatched; live success remains exclusively its observer's PASS."
          jq -n --arg ref main --arg sha "$TARGET_SHA" \
            '{ref:$ref,inputs:{target_sha:$sha,confirmation:"ACTIVATE-RESTRICTED-QWEN-REG-RU"}}' |
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/tai-restricted-qwen-reg-ru-activation.yml/dispatches" \
              --input -

      - name: Publish precise repair failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          marker_file="$RUNNER_TEMP/tai-qwen-password-repair-failure"
          marker="$(cat "$marker_file" 2>/dev/null || true)"
          marker="$(grep -Eo 'MODEL_REPAIR_FAIL=[A-Z0-9_]+' <<<"$marker" | tail -1 || true)"
          [[ -n "$marker" ]] || marker='MODEL_REPAIR_FAIL=WORKFLOW_UNCLASSIFIED'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue reopen 3372 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh issue comment 3372 --repo "$GITHUB_REPOSITORY" --body "Protected-sudo Qwen repair failed closed for exact main \`$TARGET_SHA\`: \`$marker\`. Workflow: $run_url. Production activation was not dispatched."
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=failure \
            -f context='TAI Qwen Protected Sudo Repair exact-main' \
            -f description="$marker" \
            -f target_url="$run_url" >/dev/null
