name: TAI orphan runtime role recovery materializer

on:
  push:
    branches:
      - fix/tai-orphan-runtime-role-recovery-20260803
    paths:
      - .github/workflows/tai-orphan-runtime-role-recovery-materializer.yml

permissions:
  contents: write

concurrency:
  group: tai-orphan-runtime-role-recovery-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tai-orphan-runtime-role-recovery-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize reviewed source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          deploy_path = Path('scripts/tai-reg-ru-deploy.sh')
          checker_path = Path('scripts/check-tai-reg-ru-deploy.mjs')
          workflow_path = Path('.github/workflows/tai-orphan-runtime-role-recovery-materializer.yml')
          test_path = Path('scripts/check-tai-orphan-runtime-role-recovery.mjs')
          scope_path = Path('docs/platform-v7/autopilot/scopes/tai-orphan-runtime-role-recovery-20260803.json')

          deploy = deploy_path.read_text(encoding='utf-8')
          checker = checker_path.read_text(encoding='utf-8')

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          deploy = replace_once(
              deploy,
              'ROLE_CREATED=0\nPREVIOUS_TAI=0',
              'ROLE_CREATED=0\nORPHAN_ROLE_RECOVERY=0\nPREVIOUS_TAI=0',
              'role recovery state',
          )

          role_anchor = '''role_exists="$(psql_admin -Atc "SELECT COUNT(*) FROM pg_roles WHERE rolname = '${ROLE_NAME}';")"
          [[ "$role_exists" == 0 || "$role_exists" == 1 ]]
          if [[ "$role_exists" == 1 ]]; then
          '''
          role_replacement = '''role_exists="$(psql_admin -Atc "SELECT COUNT(*) FROM pg_roles WHERE rolname = '${ROLE_NAME}';")"
          [[ "$role_exists" == 0 || "$role_exists" == 1 ]]
          if [[ "$role_exists" == 1 && ! -f "$ENV_FILE" ]]; then
            orphan_role_boundary="$(psql_admin -AtF $'\\t' <<SQL
          WITH role_row AS (
            SELECT oid, rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolbypassrls
            FROM pg_catalog.pg_roles
            WHERE rolname = '${ROLE_NAME}'
          ), non_tai AS (
            SELECT COUNT(*)::int AS count
            FROM pg_catalog.pg_class AS relation
            JOIN pg_catalog.pg_namespace AS namespace ON namespace.oid = relation.relnamespace
            WHERE namespace.nspname = 'public'
              AND relation.relname NOT LIKE 'tai\\\\_%' ESCAPE '\\\\'
              AND relation.relkind IN ('r','v','m','p','f')
              AND has_table_privilege('${ROLE_NAME}', format('%I.%I', namespace.nspname, relation.relname),
                'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
          ), owned_objects AS (
            SELECT (
              (SELECT COUNT(*) FROM pg_catalog.pg_class WHERE relowner = role_row.oid)
              + (SELECT COUNT(*) FROM pg_catalog.pg_proc WHERE proowner = role_row.oid)
              + (SELECT COUNT(*) FROM pg_catalog.pg_type WHERE typowner = role_row.oid AND typrelid = 0)
            )::int AS count
            FROM role_row
          ), active_sessions AS (
            SELECT COUNT(*)::int AS count
            FROM pg_catalog.pg_stat_activity
            WHERE usename = '${ROLE_NAME}'
          )
          SELECT role_row.rolsuper, role_row.rolcreatedb, role_row.rolcreaterole,
                 role_row.rolreplication, role_row.rolbypassrls,
                 (SELECT COUNT(*) FROM pg_catalog.pg_auth_members WHERE member = role_row.oid),
                 (SELECT COUNT(*) FROM pg_catalog.pg_auth_members WHERE roleid = role_row.oid),
                 non_tai.count, owned_objects.count, active_sessions.count
          FROM role_row, non_tai, owned_objects, active_sessions;
          SQL
          )"
            [[ "$(printf '%s\\n' "$orphan_role_boundary" | grep -c .)" == 1 ]]
            IFS=$'\\t' read -r orphan_super orphan_createdb orphan_createrole orphan_replication orphan_bypass orphan_memberships orphan_grantees orphan_non_tai orphan_owned orphan_sessions <<< "$orphan_role_boundary"
            for value in "$orphan_memberships" "$orphan_grantees" "$orphan_non_tai" "$orphan_owned" "$orphan_sessions"; do
              [[ "$value" =~ ^[0-9]+$ ]]
            done
            if [[ "$orphan_super" != f || "$orphan_createdb" != f || "$orphan_createrole" != f || "$orphan_replication" != f || "$orphan_bypass" != f ]]; then
              set_internal_deploy_stage TAI_DEPLOY_ORPHAN_ROLE_ELEVATED_AUTHORITY_FAILED
              exit 18
            fi
            if [[ "$orphan_memberships" != 0 || "$orphan_grantees" != 0 ]]; then
              set_internal_deploy_stage TAI_DEPLOY_ORPHAN_ROLE_MEMBERSHIP_FAILED
              exit 18
            fi
            if [[ "$orphan_non_tai" != 0 ]]; then
              set_internal_deploy_stage TAI_DEPLOY_ORPHAN_ROLE_NON_TAI_PRIVILEGE_FAILED
              exit 18
            fi
            if [[ "$orphan_owned" != 0 ]]; then
              set_internal_deploy_stage TAI_DEPLOY_ORPHAN_ROLE_OWNERSHIP_FAILED
              exit 18
            fi
            if [[ "$orphan_sessions" != 0 ]]; then
              set_internal_deploy_stage TAI_DEPLOY_ORPHAN_ROLE_ACTIVE_SESSION_FAILED
              exit 18
            fi
            (( PREVIOUS_TAI == 0 ))
            [[ ! -f "$OVERRIDE" ]]
            ORPHAN_ROLE_RECOVERY=1
            role_exists=0
          fi
          if [[ "$role_exists" == 1 ]]; then
          '''
          deploy = replace_once(deploy, role_anchor, role_replacement, 'orphan role classification')

          deploy = replace_once(
              deploy,
              'ROLE_CREATED=$(( role_exists == 0 ? 1 : 0 ))\nPREVIOUS_TAI=$PREVIOUS_TAI',
              'ROLE_CREATED=$(( role_exists == 0 ? 1 : 0 ))\nORPHAN_ROLE_RECOVERY=$ORPHAN_ROLE_RECOVERY\nPREVIOUS_TAI=$PREVIOUS_TAI',
              'deployment metadata',
          )

          create_anchor = '''if [[ "$role_exists" == 0 ]]; then
            set_internal_deploy_stage TAI_DEPLOY_DATABASE_ROLE_CREATE_FAILED
          '''
          create_replacement = '''if (( ORPHAN_ROLE_RECOVERY == 1 )); then
            set_internal_deploy_stage TAI_DEPLOY_DATABASE_ORPHAN_ROLE_RESET_FAILED
            psql_admin <<SQL
          DROP OWNED BY ${ROLE_NAME};
          DROP ROLE ${ROLE_NAME};
          SQL
            [[ "$(psql_admin -Atc "SELECT COUNT(*) FROM pg_roles WHERE rolname = '${ROLE_NAME}';")" == 0 ]]
          fi

          if [[ "$role_exists" == 0 ]]; then
            set_internal_deploy_stage TAI_DEPLOY_DATABASE_ROLE_CREATE_FAILED
          '''
          deploy = replace_once(deploy, create_anchor, create_replacement, 'orphan role reset')

          checker = replace_once(
              checker,
              "import './check-tai-migration-sql-normalization.mjs';\n",
              "import './check-tai-migration-sql-normalization.mjs';\nimport './check-tai-orphan-runtime-role-recovery.mjs';\n",
              'focused recovery checker import',
          )

          test_source = r'''#!/usr/bin/env node
          import { readFileSync } from 'node:fs';

          const path = 'scripts/tai-reg-ru-deploy.sh';
          const source = readFileSync(path, 'utf8');
          const violations = [];
          const requireFragment = (fragment) => {
            if (!source.includes(fragment)) violations.push(`missing ${JSON.stringify(fragment)}`);
          };

          for (const fragment of [
            'ORPHAN_ROLE_RECOVERY=0',
            'if [[ "$role_exists" == 1 && ! -f "$ENV_FILE" ]]; then',
            'TAI_DEPLOY_ORPHAN_ROLE_ELEVATED_AUTHORITY_FAILED',
            'TAI_DEPLOY_ORPHAN_ROLE_MEMBERSHIP_FAILED',
            'TAI_DEPLOY_ORPHAN_ROLE_NON_TAI_PRIVILEGE_FAILED',
            'TAI_DEPLOY_ORPHAN_ROLE_OWNERSHIP_FAILED',
            'TAI_DEPLOY_ORPHAN_ROLE_ACTIVE_SESSION_FAILED',
            'pg_catalog.pg_auth_members WHERE roleid = role_row.oid',
            'pg_catalog.pg_stat_activity',
            'ORPHAN_ROLE_RECOVERY=1',
            'TAI_DEPLOY_DATABASE_ORPHAN_ROLE_RESET_FAILED',
            'DROP OWNED BY ${ROLE_NAME};',
            'DROP ROLE ${ROLE_NAME};',
            'ORPHAN_ROLE_RECOVERY=$ORPHAN_ROLE_RECOVERY',
          ]) requireFragment(fragment);

          const classify = (fixture) => fixture.roleExists === 1
            && fixture.envPresent === false
            && fixture.previousTai === 0
            && fixture.overridePresent === false
            && fixture.superuser === false
            && fixture.createdb === false
            && fixture.createrole === false
            && fixture.replication === false
            && fixture.bypassrls === false
            && fixture.memberships === 0
            && fixture.grantees === 0
            && fixture.nonTaiPrivileges === 0
            && fixture.ownedObjects === 0
            && fixture.activeSessions === 0;

          const safe = {
            roleExists: 1,
            envPresent: false,
            previousTai: 0,
            overridePresent: false,
            superuser: false,
            createdb: false,
            createrole: false,
            replication: false,
            bypassrls: false,
            memberships: 0,
            grantees: 0,
            nonTaiPrivileges: 0,
            ownedObjects: 0,
            activeSessions: 0,
          };
          if (!classify(safe)) violations.push('safe orphan fixture was not recoverable');
          for (const [name, patch] of Object.entries({
            superuser: { superuser: true },
            membership: { memberships: 1 },
            grantee: { grantees: 1 },
            nonTai: { nonTaiPrivileges: 1 },
            ownership: { ownedObjects: 1 },
            active: { activeSessions: 1 },
            env: { envPresent: true },
            service: { previousTai: 1 },
          })) {
            if (classify({ ...safe, ...patch })) violations.push(`unsafe orphan fixture passed: ${name}`);
          }

          const classification = source.indexOf('if [[ "$role_exists" == 1 && ! -f "$ENV_FILE" ]]; then');
          const mutation = source.indexOf('MUTATION_STARTED=1');
          const reset = source.indexOf('TAI_DEPLOY_DATABASE_ORPHAN_ROLE_RESET_FAILED');
          const create = source.indexOf('CREATE ROLE ${ROLE_NAME}');
          if (!(classification > 0 && mutation > classification && reset > mutation && create > reset)) {
            violations.push('orphan recovery ordering is not classify -> mutation guard -> reset -> create');
          }

          if (violations.length) {
            console.error('TAI orphan runtime role recovery contract failed:');
            for (const violation of violations) console.error(`- ${violation}`);
            process.exit(1);
          }
          console.log('TAI orphan runtime role recovery contract PASS: only an unused, unowned, unprivileged orphan is reset after the mutation guard.');
          '''
          test_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_source.splitlines()) + '\n'

          scope = {
              'schemaVersion': 'platform-v7.concurrent-scope.v1',
              'branch': 'fix/tai-orphan-runtime-role-recovery-20260803',
              'status': 'active',
              'title': 'TAI orphan runtime database role recovery',
              'priority': 'P0',
              'baselineExactMain': 'f13c4186e132fbc45d089943690738ff41cae7b1',
              'objective': 'Recover only a safe orphaned tai_runtime role left without the dedicated environment or service, then resume the existing least-privilege standalone TAI deployment and exact postflight.',
              'allowedPaths': [
                  'scripts/tai-reg-ru-deploy.sh',
                  'scripts/check-tai-reg-ru-deploy.mjs',
                  'scripts/check-tai-orphan-runtime-role-recovery.mjs',
                  'docs/platform-v7/autopilot/scopes/tai-orphan-runtime-role-recovery-20260803.json',
              ],
              'boundaries': [
                  'Recovery is allowed only when the dedicated environment, override and running TAI service are absent',
                  'Elevated role attributes, memberships, grantees, non-TAI privileges, owned objects or active sessions fail closed',
                  'The orphan reset occurs only after the existing mutation guard and rollback snapshots',
                  'The recreated role retains the existing exact least-privilege grants and runtime attestation',
                  'No public model listener, tenant authority, financial authority or external integration is added',
                  'REG.RU only and zero new recurring cost',
              ],
          }

          deploy_path.write_text(deploy, encoding='utf-8')
          checker_path.write_text(checker, encoding='utf-8')
          test_path.write_text(test_source, encoding='utf-8')
          scope_path.write_text(json.dumps(scope, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          workflow_path.unlink()
          PY

          chmod +x scripts/check-tai-orphan-runtime-role-recovery.mjs
          bash -n scripts/tai-reg-ru-deploy.sh
          node scripts/check-tai-orphan-runtime-role-recovery.mjs
          node scripts/check-tai-reg-ru-deploy.mjs
          node scripts/check-tai-owner-deployment-command.mjs
          git diff --check
      - name: Commit clean source-only repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/tai-orphan-runtime-role-recovery-materializer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/tai-reg-ru-deploy.sh \
            scripts/check-tai-reg-ru-deploy.mjs \
            scripts/check-tai-orphan-runtime-role-recovery.mjs \
            docs/platform-v7/autopilot/scopes/tai-orphan-runtime-role-recovery-20260803.json \
            .github/workflows/tai-orphan-runtime-role-recovery-materializer.yml
          git commit -m 'fix(tai): recover safe orphan runtime database role'
          git push origin HEAD:fix/tai-orphan-runtime-role-recovery-20260803
