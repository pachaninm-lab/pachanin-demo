name: TAI Semantic Source Repair Finalize

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tai-semantic-repair-finalize.yml

permissions:
  contents: write

concurrency:
  group: tai-semantic-source-repair-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'claude/tai-agro-os-v4-production-izow8x'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tai-agro-os-v4-production-izow8x
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source repair
        env:
          PATCH_B64: ""
        run: |
          set -Eeuo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/tai-semantic-source-repair.py
          python3 /tmp/tai-semantic-source-repair.py
      - name: Validate focused source repair
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @pc/web exec tsc --noEmit
          pnpm --filter @pc/web exec vitest run \
            tests/unit/taiSemanticRelevanceRouter.test.ts \
            tests/unit/taiSemanticAcceptanceCorpus.test.ts \
            tests/unit/platformV7PublicAssistantStreamContract.test.ts
          git diff --check
      - name: Publish verified source-only commit
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tai): preserve semantic context across fallback paths'
          ! git diff --name-only origin/main...HEAD | grep -E '^\.github/workflows/tai-semantic-(followup|repair)'
          test -z "$(git status --porcelain)"
          git push origin HEAD:claude/tai-agro-os-v4-production-izow8x
