name: TAI Semantic Source Repair Finalize

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tai-semantic-repair-finalize.yml

permissions:
  contents: write

concurrency:
  group: tai-semantic-source-repair-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'claude/tai-agro-os-v4-production-izow8x'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tai-agro-os-v4-production-izow8x
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          source_url = (
              'https://api.github.com/repos/pachaninm-lab/pachanin-demo/contents/'
              '.github/workflows/tai-semantic-repair-finalize.yml'
              '?ref=87fd984b4d88ca942cb834a05333301c24bea670'
          )
          request = Request(
              source_url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'tai-semantic-source-finalizer',
              },
          )
          with urlopen(request, timeout=30) as response:
              source_payload = json.load(response)
          source = base64.b64decode(source_payload['content']).decode('utf-8')

          match = re.search(r'^\s*PATCH_B64:\s*"([A-Za-z0-9+/=]+)"\s*$', source, re.MULTILINE)
          if not match:
              raise SystemExit('PATCH_B64 not found in exact source finalizer')

          patch = base64.b64decode(match.group(1)).decode('utf-8')
          old_import = "import { fileURLToPath } from 'node:url';"
          new_import = "import { resolve } from 'node:path';"
          old_path = "fileURLToPath(new URL('../../components/platform-v7/PublicPlatformAssistant.tsx', import.meta.url))"
          new_path = "resolve(process.cwd(), 'components/platform-v7/PublicPlatformAssistant.tsx')"
          old_helper = '''def replace_once(path: str, old: str, new: str, label: str) -> None:
              text = read(path)
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing source fragment: {label} ({path})")
              write(path, text.replace(old, new, 1))
          '''
          new_helper = '''def replace_once(path: str, old: str, new: str, label: str) -> None:
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"missing source fragment: {label} ({path})")
          '''

          for old, new, label in (
              (old_import, new_import, 'router test path import'),
              (old_path, new_path, 'router test component path'),
              (old_helper, new_helper, 'old-first replace helper'),
          ):
              if patch.count(old) != 1:
                  raise SystemExit(f'unexpected {label} count: {patch.count(old)}')
              patch = patch.replace(old, new, 1)

          Path('/tmp/tai-semantic-source-repair.py').write_text(patch, encoding='utf-8')
          PY
          python3 /tmp/tai-semantic-source-repair.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/lib/platform-v7/assistant-relevance-router.ts')
          text = path.read_text(encoding='utf-8')
          late_block = '''  // An explicit off-topic marker outranks sentence shape. "How do I choose a
            // tattoo?" opens like a follow-up and is asked from inside the platform, and
            // reading it as a continuation was how entertainment questions slipped into
            // the contextual branch.
            if (containsAny(normalized, UNRELATED_TERMS) && context.semanticHint !== 'related') {
              return outcome('REDIRECT_UNRELATED', { domain: 'none', signals });
            }

          '''
          insertion_anchor = "  if (context.semanticHint === 'related') signals.push('semantic_hint');\n\n"
          early_block = '''  const hasUnrelatedSubject = containsAny(normalized, UNRELATED_TERMS);

            // A named off-topic subject outranks generic section vocabulary and sentence
            // shape, but never an explicit platform, agriculture or business subject.
            // This redirects "Кто увидит этот фильм?" while keeping "фильм о платформе"
            // and "видео о пшенице" answerable.
            if (
              hasUnrelatedSubject
              && !hasAgroObject
              && !hasPlatformSubject
              && !hasAgroBusiness
              && !hasAdjacent
              && context.semanticHint !== 'related'
            ) {
              return outcome('REDIRECT_UNRELATED', { domain: 'none', signals });
            }

          '''

          if late_block not in text:
              raise SystemExit('late unrelated block missing after source repair')
          text = text.replace(late_block, '', 1)
          if early_block not in text:
              if insertion_anchor not in text:
                  raise SystemExit('unrelated decision insertion anchor missing')
              text = text.replace(insertion_anchor, insertion_anchor + early_block, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile --reporter=silent
      - name: Web typecheck
        run: pnpm --filter @pc/web exec tsc --noEmit
      - name: Semantic relevance router tests
        run: |
          set +e
          pnpm --filter @pc/web exec vitest run tests/unit/taiSemanticRelevanceRouter.test.ts \
            --reporter=json --outputFile=/tmp/router.json >/tmp/router-command.log 2>&1
          status=$?
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          report_path = Path('/tmp/router.json')
          if not report_path.exists():
              print(Path('/tmp/router-command.log').read_text(encoding='utf-8', errors='replace')[-4000:])
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding='utf-8'))
          failures = 0
          for test_file in report.get('testResults', []):
              for assertion in test_file.get('assertionResults', []):
                  if assertion.get('status') != 'failed':
                      continue
                  failures += 1
                  title = ' > '.join([*assertion.get('ancestorTitles', []), assertion.get('title', '')])
                  print(f'FAILED: {title}')
                  for message in assertion.get('failureMessages', []):
                      print(message[-3500:])
          print(f'router_failed_assertions={failures}')
          PY
          exit "$status"
      - name: Semantic acceptance corpus tests
        run: pnpm --filter @pc/web exec vitest run tests/unit/taiSemanticAcceptanceCorpus.test.ts --reporter=verbose
      - name: Public assistant stream contract tests
        run: pnpm --filter @pc/web exec vitest run tests/unit/platformV7PublicAssistantStreamContract.test.ts --reporter=verbose
      - name: Diff integrity
        run: git diff --check
      - name: Publish source-only commit
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tai): preserve semantic context across fallback paths'
          git push origin HEAD:claude/tai-agro-os-v4-production-izow8x
