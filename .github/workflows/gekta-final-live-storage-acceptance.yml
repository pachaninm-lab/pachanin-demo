name: Gekta Final Live Storage Acceptance

on:
  push:
    branches:
      - ops/gekta-final-live-acceptance-20260927
    paths:
      - .github/workflows/gekta-final-live-storage-acceptance.yml

permissions:
  contents: read

concurrency:
  group: gekta-final-live-storage-acceptance
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  EXPECTED_SHA: 06f686d52247ebe7805f1b75d937b2ca8daf8f6f

jobs:
  live-storage:
    name: Read-only exact-SHA storage semantics and latency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Run two-turn production acceptance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawn, spawnSync } from 'node:child_process';

          const base = process.env.LIVE_BASE;
          const expected = process.env.EXPECTED_SHA;
          const repo = process.env.GITHUB_REPOSITORY;
          const runId = process.env.GITHUB_RUN_ID;
          const firstQuestion = 'Пшеница, 500 тонн, предлагают 12000 рублей за тонну. Хранение 200 рублей за тонну в месяц. Продавать сейчас или хранить?';
          const secondQuestion = 'Срок хранения два месяца. Насколько должна вырасти цена, чтобы покрыть только хранение?';
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'gekta-final-'));
          const cookieJar = path.join(tmp, 'cookies.txt');

          const fail = (message) => { throw new Error(message); };
          const oneLine = (value) => String(value ?? '').replace(/\s+/gu, ' ').trim().slice(0, 1800);

          async function currentMain() {
            const response = await fetch(`https://api.github.com/repos/${repo}/commits/main`, {
              headers: { 'Accept': 'application/vnd.github+json', 'User-Agent': 'pc-crop-final-live-acceptance' },
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) fail(`github_main_http_${response.status}`);
            const body = await response.json();
            if (!/^[0-9a-f]{40}$/u.test(body?.sha || '')) fail('github_main_sha_invalid');
            return body.sha;
          }

          async function manifestSha() {
            const response = await fetch(`${base}/manifest-pc-deploy.json?final-storage=${runId}-${Date.now()}`, {
              cache: 'no-store',
              headers: { 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(30_000),
            });
            if (!response.ok) fail(`manifest_http_${response.status}`);
            const body = await response.json();
            const sha = body?.commitSha;
            if (!/^[0-9a-f]{40}$/u.test(sha || '')) fail('manifest_commit_sha_missing');
            return sha;
          }

          function reserve(turn) {
            const bodyFile = path.join(tmp, `reserve-${turn}.json`);
            const headerFile = path.join(tmp, `reserve-${turn}.headers`);
            const result = spawnSync('curl', [
              '-sS', '-D', headerFile, '-o', bodyFile,
              '-c', cookieJar, '-b', cookieJar,
              '-w', '%{http_code}\t%{content_type}\t%{time_total}\t%{size_download}',
              '--compressed', '--max-time', '25',
              '-H', 'Content-Type: application/json',
              '-H', 'Accept: application/json',
              '--data', '{"action":"reserve"}',
              `${base}/api/gekta/entitlement`,
            ], { encoding: 'utf8', timeout: 35_000 });

            if (result.error) fail(`reserve_spawn_${turn}_${result.error.code || 'error'}`);
            if (result.status !== 0) fail(`reserve_curl_${turn}_${result.status}_${oneLine(result.stderr)}`);
            const [http, type, total] = String(result.stdout || '').trim().split('\t');
            if (http !== '200') fail(`reserve_http_${turn}_${http || 'missing'}`);
            let body;
            try { body = JSON.parse(fs.readFileSync(bodyFile, 'utf8')); } catch { fail(`reserve_json_${turn}`); }
            if (body?.allowed !== true) fail(`reserve_not_allowed_${turn}_${body?.code || body?.error || 'unknown'}`);
            if (!/^[0-9a-z]{8,12}\.[A-Za-z0-9_-]{16}$/u.test(body?.ticket || '')) fail(`reserve_ticket_invalid_${turn}`);
            return { ticket: body.ticket, reserveMs: Number(total) * 1000, contentType: type };
          }

          function stream(turn, question, history, conversationId) {
            return new Promise((resolve, reject) => {
              let reserved;
              try { reserved = reserve(turn); } catch (error) { reject(error); return; }

              const headerFile = path.join(tmp, `stream-${turn}.headers`);
              const payload = JSON.stringify({
                message: question,
                locale: 'ru',
                context: 'gekta-standalone',
                conversationId,
                history,
              });
              const args = [
                '-sS', '-D', headerFile,
                '-c', cookieJar, '-b', cookieJar,
                '--no-buffer', '--max-time', '170',
                '-H', 'Content-Type: application/json',
                '-H', 'Accept: text/event-stream',
                '-H', `x-gekta-answer-ticket: ${reserved.ticket}`,
                '--data', payload,
                `${base}/api/agro-chat?stream=1`,
              ];

              const started = performance.now();
              const child = spawn('curl', args, { stdio: ['ignore', 'pipe', 'pipe'] });
              const decoder = new TextDecoder();
              let buffer = '';
              let answer = '';
              let firstMeaningfulMs = null;
              let meta = false;
              let doneFrame = false;
              let complete = false;
              let tokenEvents = 0;
              let stderr = '';

              const acceptFrame = (block) => {
                for (const line of block.split('\n')) {
                  if (!line.startsWith('data:')) continue;
                  const raw = line.slice(5).trim();
                  if (!raw) continue;
                  let event;
                  try { event = JSON.parse(raw); } catch { continue; }
                  if (event?.event === 'meta') meta = true;
                  if (event?.event === 'token' && typeof event.text === 'string') {
                    tokenEvents += 1;
                    answer += event.text;
                    if (firstMeaningfulMs === null && /[\p{L}\p{N}]/u.test(event.text)) {
                      firstMeaningfulMs = performance.now() - started;
                    }
                  }
                  if (event?.event === 'done') {
                    doneFrame = true;
                    complete = event.complete === true;
                  }
                  if (event?.event === 'error') {
                    reject(new Error(`stream_error_${turn}_${event.refusal || event.code || 'unknown'}`));
                    child.kill('SIGTERM');
                  }
                }
              };

              child.stdout.on('data', (chunk) => {
                buffer += decoder.decode(chunk, { stream: true });
                buffer = buffer.replace(/\r\n/gu, '\n');
                let split;
                while ((split = buffer.indexOf('\n\n')) >= 0) {
                  acceptFrame(buffer.slice(0, split));
                  buffer = buffer.slice(split + 2);
                }
              });
              child.stderr.on('data', (chunk) => { stderr += chunk.toString('utf8'); });

              child.on('error', (error) => reject(error));
              child.on('close', (code) => {
                try {
                  buffer += decoder.decode();
                  buffer = buffer.replace(/\r\n/gu, '\n');
                  if (buffer.trim()) acceptFrame(buffer);
                  const totalMs = performance.now() - started;
                  if (code !== 0) fail(`stream_curl_${turn}_${code}_${oneLine(stderr)}`);
                  const headers = fs.readFileSync(headerFile, 'utf8').replace(/\r\n/gu, '\n');
                  const statuses = [...headers.matchAll(/^HTTP\/\S+\s+(\d{3})/gmu)].map((m) => m[1]);
                  const http = statuses.at(-1) || 'missing';
                  const types = [...headers.matchAll(/^content-type:\s*([^\n]+)/gmiu)].map((m) => m[1].trim());
                  const contentType = types.at(-1) || 'missing';
                  if (http !== '200') fail(`stream_http_${turn}_${http}`);
                  if (!contentType.toLowerCase().startsWith('text/event-stream')) fail(`stream_type_${turn}_${contentType}`);
                  if (!meta || !doneFrame || !complete || tokenEvents < 1 || firstMeaningfulMs === null) fail(`stream_incomplete_${turn}`);
                  resolve({
                    answer: answer.trim(),
                    reserveMs: reserved.reserveMs,
                    firstMeaningfulMs,
                    totalMs,
                    tokenEvents,
                  });
                } catch (error) {
                  reject(error);
                }
              });
            });
          }

          const mainBefore = await currentMain();
          const manifestBefore = await manifestSha();
          if (mainBefore !== expected) fail(`main_drift_before_${mainBefore}`);
          if (manifestBefore !== expected) fail(`manifest_drift_before_${manifestBefore}`);

          const conversationId = `gektafinal${runId}`;
          const turn1 = await stream(1, firstQuestion, [], conversationId);
          if (!turn1.answer) fail('turn1_answer_empty');

          const unsafeVerdict = /(?:продавать\s+сейчас\s+выгоднее|выгоднее\s+продавать|лучше\s+(?:сразу\s+)?продать|лучше\s+продавать|хранить\s+выгоднее|выгоднее\s+хранить|лучше\s+хранить)/iu;
          if (unsafeVerdict.test(turn1.answer)) fail('turn1_unsupported_profitability_verdict');

          const history = [
            { role: 'user', text: firstQuestion },
            { role: 'assistant', text: turn1.answer },
          ];
          const turn2 = await stream(2, secondQuestion, history, conversationId);
          if (!turn2.answer) fail('turn2_answer_empty');
          if (unsafeVerdict.test(turn2.answer)) fail('turn2_unsupported_profitability_verdict');

          const storage400 = /(?:^|\D)400\s*(?:руб(?:\.|лей|ля)?|₽)(?:\s*\/\s*т|.{0,24}(?:за|на)\s+тонн)/iu;
          if (!storage400.test(turn2.answer)) fail('turn2_storage_400_rub_per_tonne_missing');
          if (/^\s*\d+[.)]\s*$/mu.test(turn1.answer) || /^\s*\d+[.)]\s*$/mu.test(turn2.answer)) fail('orphan_numbered_marker');

          const mainAfter = await currentMain();
          const manifestAfter = await manifestSha();
          if (mainAfter !== expected) fail(`main_drift_after_${mainAfter}`);
          if (manifestAfter !== expected) fail(`manifest_drift_after_${manifestAfter}`);

          console.log(`EXPECTED_SHA=${expected}`);
          console.log(`MAIN_BEFORE=${mainBefore}`);
          console.log(`MANIFEST_BEFORE=${manifestBefore}`);
          console.log(`TURN1_RESERVE_MS=${turn1.reserveMs.toFixed(1)}`);
          console.log(`TURN1_FIRST_MEANINGFUL_MS=${turn1.firstMeaningfulMs.toFixed(1)}`);
          console.log(`TURN1_TOTAL_MS=${turn1.totalMs.toFixed(1)}`);
          console.log(`TURN1_TOKEN_EVENTS=${turn1.tokenEvents}`);
          console.log(`TURN1_ANSWER=${oneLine(turn1.answer)}`);
          console.log(`TURN2_RESERVE_MS=${turn2.reserveMs.toFixed(1)}`);
          console.log(`TURN2_FIRST_MEANINGFUL_MS=${turn2.firstMeaningfulMs.toFixed(1)}`);
          console.log(`TURN2_TOTAL_MS=${turn2.totalMs.toFixed(1)}`);
          console.log(`TURN2_TOKEN_EVENTS=${turn2.tokenEvents}`);
          console.log(`TURN2_ANSWER=${oneLine(turn2.answer)}`);
          console.log('STORAGE_ARITHMETIC_400_RUB_PER_TONNE=PASS');
          console.log('UNSUPPORTED_PROFITABILITY_FILTER=PASS');
          console.log('ORPHAN_NUMBERED_MARKERS=PASS');
          console.log(`MAIN_AFTER=${mainAfter}`);
          console.log(`MANIFEST_AFTER=${manifestAfter}`);
          console.log('LIVE_STORAGE_ACCEPTANCE=PASS');

          const randomCases = [
            ['soil-crust', 'После сильного дождя на суглинке появилась корка, всходы подсолнечника редкие. Какие причины проверить до пересева?'],
            ['grain-hotspot', 'В зерноскладе температура в одном участке насыпи выросла на 4°C за сутки. Что проверить в первую очередь?'],
            ['loader-belt', 'После замены ремня зернопогрузчик свистит только под нагрузкой. Какие безопасные проверки сделать до следующего запуска?'],
          ];
          const randomResults = [];
          let randomIndex = 0;
          for (const [id, question] of randomCases) {
            randomIndex += 1;
            const result = await stream(10 + randomIndex, question, [], `gektarandom${runId}${randomIndex}`);
            if (result.answer.length < 40) fail(`random_answer_too_short_${id}_${result.answer.length}`);
            randomResults.push({ id, ...result });
            console.log(`RANDOM_${id.toUpperCase().replace(/-/gu, '_')}_FIRST_MEANINGFUL_MS=${result.firstMeaningfulMs.toFixed(1)}`);
            console.log(`RANDOM_${id.toUpperCase().replace(/-/gu, '_')}_TOTAL_MS=${result.totalMs.toFixed(1)}`);
            console.log(`RANDOM_${id.toUpperCase().replace(/-/gu, '_')}_TOKEN_EVENTS=${result.tokenEvents}`);
            console.log(`RANDOM_${id.toUpperCase().replace(/-/gu, '_')}_ANSWER=${oneLine(result.answer)}`);
          }
          const firstTimes = randomResults.map((item) => item.firstMeaningfulMs).sort((a, b) => a - b);
          const totals = randomResults.map((item) => item.totalMs).sort((a, b) => a - b);
          console.log(`RANDOM_FIRST_MEANINGFUL_MIN_MS=${firstTimes[0].toFixed(1)}`);
          console.log(`RANDOM_FIRST_MEANINGFUL_MEDIAN_MS=${firstTimes[1].toFixed(1)}`);
          console.log(`RANDOM_FIRST_MEANINGFUL_MAX_MS=${firstTimes[2].toFixed(1)}`);
          console.log(`RANDOM_TOTAL_MEDIAN_MS=${totals[1].toFixed(1)}`);
          console.log('RANDOM_NONSTARTER_ACCEPTANCE=PASS');

          const mainFinal = await currentMain();
          const manifestFinal = await manifestSha();
          if (mainFinal !== expected) fail(`main_drift_final_${mainFinal}`);
          if (manifestFinal !== expected) fail(`manifest_drift_final_${manifestFinal}`);
          console.log(`MAIN_FINAL=${mainFinal}`);
          console.log(`MANIFEST_FINAL=${manifestFinal}`);
          console.log('FINAL_LIVE_GEКTA_ACCEPTANCE=PASS');

          fs.rmSync(tmp, { recursive: true, force: true });
          NODE
