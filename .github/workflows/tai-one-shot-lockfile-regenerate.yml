name: TAI one-shot pnpm lockfile regeneration

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/tai-one-shot-lockfile-regenerate.yml

permissions:
  contents: write

concurrency:
  group: tai-one-shot-lockfile-regenerate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate frozen pnpm lockfile
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/tai-general-agro-completeness-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/tai-general-agro-completeness-20260803
          fetch-depth: 0

      - name: Setup repository pnpm pin
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate lockfile without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
          git diff --check

          grep -Fq "socket.io-parser@4.2.7:" pnpm-lock.yaml
          if grep -Fq "socket.io-parser@4.2.6:" pnpm-lock.yaml; then
            echo "Vulnerable socket.io-parser 4.2.6 remains in pnpm-lock.yaml" >&2
            exit 1
          fi

          grep -Fq "brace-expansion@2.1.4:" pnpm-lock.yaml
          if grep -Fq "brace-expansion@5.0.8:" pnpm-lock.yaml; then
            echo "Vulnerable brace-expansion 5.0.8 remains in pnpm-lock.yaml" >&2
            exit 1
          fi

          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml did not change" >&2
            exit 1
          fi

      - name: Commit generated lockfile to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): apply security dependency overrides"
          git push origin HEAD:fix/tai-general-agro-completeness-20260803
