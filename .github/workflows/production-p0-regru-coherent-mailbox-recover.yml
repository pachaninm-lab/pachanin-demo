name: Production P0 REG.RU Coherent Mailbox Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-regru-coherent-mailbox-recover.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-regru-coherent-mailbox-recover
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: '3072'
  EVIDENCE_DIR: artifacts/production-p0-regru-coherent-mailbox-recover
  SMTP_HOST: mail.hosting.reg.ru
  SMTP_PORT: '465'
  IMAP_PORT: '993'

jobs:
  contract:
    name: Validate coherent mailbox recovery contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (
            github.actor == github.repository_owner &&
            github.triggering_actor == github.repository_owner
          ) ||
          (
            github.actor == 'chatgpt-codex-connector[bot]' &&
            github.triggering_actor == 'chatgpt-codex-connector[bot]'
          )
        ) &&
        github.event.comment.body == '/production p0-regru-coherent-mailbox-recover current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bounded fail-closed contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-p0-regru-coherent-mailbox-recover.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              "github.event.issue.number == 3072",
              "github.event.comment.author_association == 'OWNER'",
              "TRUSTED_CONNECTOR_APP_ID: '1144995'",
              '/production p0-regru-coherent-mailbox-recover current-main',
              'mail.hosting.reg.ru',
              "SMTP_PORT: '465'",
              "IMAP_PORT: '993'",
              'StrictHostKeyChecking=yes',
              'SMTP_AUTHENTICATED_SEND_OK=1',
              'IMAP_PROBE_RECEIPT_OK=1',
              'PC_SMTP_USER=%s\\nPC_SMTP_PASS=%s\\nPC_SMTP_PORT=%s\\nPC_MAIL_FROM=%s\\n',
              '"$normalized" "$MAILBOX_PASSWORD" "$SMTP_PORT" "$normalized"',
              'TRANSACTIONAL_MAIL_RECONCILE=',
              'ROOT_ONLY_AUTH_MAIL_RUNTIME_FILE',
              'database/deployment mutation: `NONE`',
              'new recurring cost: `0 RUB`',
          )
          for marker in required:
              assert marker in text, marker
          for forbidden in ('docker compose up', 'docker service update', 'prisma migrate', 'psql ', 'DATABASE_URL=', 'RESEND_API_KEY='):
              assert forbidden not in text, forbidden
          compile(text.split("cat > \"$proof\" <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0].replace('          ', '', 1), str(path), 'exec')
          PY
          bash -n scripts/provision-production-p0-password-reset-runtime.sh

      - name: Verify owner or trusted connector provenance
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EXPECTED_BODY: /production p0-regru-coherent-mailbox-recover current-main
          TRUSTED_CONNECTOR_APP_ID: '1144995'
        shell: bash
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          [[ "$user" == "$owner" && "$assoc" == OWNER && "$body" == "$EXPECTED_BODY" ]]
          if [[ "$EVENT_ACTOR" == "$owner" && "$EVENT_TRIGGERING_ACTOR" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$EVENT_ACTOR" == 'chatgpt-codex-connector[bot]' ]]
            [[ "$EVENT_TRIGGERING_ACTOR" == 'chatgpt-codex-connector[bot]' ]]
            app_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // empty')"
            [[ "$app_id" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  recover:
    name: Prove coherent REG.RU send/receipt and recover auth runtime
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      MAILBOX_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
      MAILBOX_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
      EMAIL_TEMPLATE: ${{ secrets.PC_PROD_P0_MAILBOX_EMAIL_TEMPLATE || secrets.PC_PROD_P0_EMAIL_TEMPLATE }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact main and protected inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          safe_scalar(){ [[ -n "$1" && "$1" != *$'\n'* && "$1" != *$'\r'* && "$1" != *$'\0'* ]]; }
          safe_scalar "$MAILBOX_USER"
          safe_scalar "$MAILBOX_PASSWORD"
          safe_scalar "$EMAIL_TEMPLATE"
          safe_scalar "$PC_PROD_HOST"
          safe_scalar "$PC_PROD_SSH_USER"
          safe_scalar "$PC_PROD_SSH_HOST_FINGERPRINT"
          [[ -n "$PC_PROD_SSH_KEY" || -n "$PC_PROD_SSH_PRIVATE_KEY" || -n "$VPS_SSH_KEY" ]]

      - name: Resolve pinned REG.RU root SSH
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "$PC_PROD_HOST")"
          user="$(trim "$PC_PROD_SSH_USER")"
          port="$(trim "${PC_PROD_SSH_PORT:-22}")"
          expected="$(trim "$PC_PROD_SSH_HOST_FINGERPRINT")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"
            return 1
          }
          try_slot "$PC_PROD_SSH_KEY" || try_slot "$PC_PROD_SSH_PRIVATE_KEY" || try_slot "$VPS_SSH_KEY" || exit 40

          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            got="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$got" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          rm -f "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$user@$host" 'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; command -v python3 >/dev/null; docker version >/dev/null; echo ROOT_SSH_PYTHON_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_PYTHON_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Build protected coherent mailbox proof
        id: proof
        shell: bash
        run: |
          set -Eeuo pipefail
          config="$RUNNER_TEMP/coherent-mail-${GITHUB_RUN_ID}.json"
          proof="$RUNNER_TEMP/coherent-mail-${GITHUB_RUN_ID}.py"
          umask 077
          CONFIG="$config" python3 - <<'PY'
          import json, os
          cfg = {
              'user': os.environ['MAILBOX_USER'],
              'password': os.environ['MAILBOX_PASSWORD'],
              'template': os.environ['EMAIL_TEMPLATE'],
              'target_sha': os.environ['TARGET_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }
          if any((not str(v)) or any(c in str(v) for c in ('\n','\r','\x00')) for v in cfg.values()):
              raise SystemExit(20)
          with open(os.environ['CONFIG'], 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=True, separators=(',', ':'))
          PY
          cat > "$proof" <<'PY'
          import email
          import imaplib
          import json
          import re
          import secrets
          import smtplib
          import socket
          import ssl
          import sys
          import time
          from email.message import EmailMessage
          from email.policy import default
          from email.utils import formatdate, getaddresses, make_msgid

          HOST='mail.hosting.reg.ru'
          SMTP_PORT=465
          IMAP_PORT=993
          DOMAIN='xn----8sbjf4befbjgs9b.xn--p1ai'

          def ascii_email(value):
              if value.count('@') != 1:
                  raise ValueError('email')
              local, domain = value.rsplit('@', 1)
              local.encode('ascii')
              result = f"{local}@{domain.encode('idna').decode('ascii').lower()}"
              if len(result) > 254 or not re.fullmatch(r'[^\s@]{1,64}@[^\s@]{1,189}', result):
                  raise ValueError('email')
              return result

          def recipient_from(template, run_id):
              identity_format = template.count('{identity}') == 1 and '{run}' not in template and '{slot}' not in template
              run_slot_format = template.count('{identity}') == 0 and template.count('{run}') == 1 and template.count('{slot}') == 1
              if identity_format:
                  value = template.replace('{identity}', f'coherent-{run_id}')
              elif run_slot_format:
                  value = template.replace('{run}', run_id).replace('{slot}', 'coherent')
              else:
                  raise ValueError('template')
              return ascii_email(value.lower())

          def body_text(message):
              parts=[]
              iterator=message.walk() if message.is_multipart() else (message,)
              for part in iterator:
                  if part.get_content_type() not in ('text/plain','text/html'):
                      continue
                  try:
                      parts.append(part.get_content())
                  except Exception:
                      raw=part.get_payload(decode=True) or b''
                      parts.append(raw.decode(part.get_content_charset() or 'utf-8', errors='replace'))
              return '\n'.join(parts)

          def methods(client):
              raw=str(client.esmtp_features.get('auth','')).upper()
              return {m for m in raw.split() if re.fullmatch(r'[A-Z0-9_-]{1,32}',m)}

          def auth_plain(client, user, password):
              client.auth('PLAIN', lambda challenge=None: f'\0{user}\0{password}', initial_response_ok=True)

          def auth_login(client, user, password):
              state={'n':0}
              def response(challenge=None):
                  state['n'] += 1
                  return user if state['n'] == 1 else password
              client.auth('LOGIN', response, initial_response_ok=False)

          with open(sys.argv[1], encoding='utf-8') as f:
              cfg=json.load(f)
          try:
              user=ascii_email(str(cfg['user']))
              password=str(cfg['password'])
              recipient=recipient_from(str(cfg['template']), str(cfg['run_id']))
              target_sha=str(cfg['target_sha'])
              run_id=str(cfg['run_id'])
          except Exception:
              raise SystemExit(21)
          if not user.endswith('@'+DOMAIN) or not password or not re.fullmatch(r'[0-9a-f]{40}',target_sha) or not run_id.isdigit():
              raise SystemExit(21)

          token=f"PC-CROP-COHERENT-{target_sha[:12]}-{run_id}-{secrets.token_hex(8)}"
          msg=EmailMessage()
          msg['From']=user
          msg['To']=recipient
          msg['Date']=formatdate(localtime=False)
          msg['Message-ID']=make_msgid(domain=DOMAIN)
          msg['Subject']='PC-CROP auth mail coherence verification'
          msg.set_content('Production authentication mail channel verification.\n'+f'Verification marker: {token}\n')

          context=ssl.create_default_context()
          sent=False
          supported=False
          for method in ('PLAIN','LOGIN'):
              try:
                  with smtplib.SMTP_SSL(HOST, SMTP_PORT, timeout=15, context=context) as client:
                      code,_=client.ehlo()
                      if code != 250:
                          raise SystemExit(31)
                      advertised=methods(client)
                      if method not in advertised:
                          continue
                      supported=True
                      if method == 'PLAIN':
                          auth_plain(client,user,password)
                      else:
                          auth_login(client,user,password)
                      client.send_message(msg, from_addr=user, to_addrs=[recipient])
                      print(f'SMTP_AUTH_METHOD={method}')
                      sent=True
                      break
              except smtplib.SMTPAuthenticationError:
                  if method == 'PLAIN':
                      continue
                  raise SystemExit(32)
              except smtplib.SMTPSenderRefused:
                  raise SystemExit(33)
              except smtplib.SMTPRecipientsRefused:
                  raise SystemExit(34)
              except smtplib.SMTPDataError:
                  raise SystemExit(35)
              except (socket.gaierror, TimeoutError, socket.timeout, ssl.SSLError, smtplib.SMTPException, OSError):
                  raise SystemExit(36)
          if not sent:
              raise SystemExit(31 if not supported else 32)

          deadline=time.time()+120
          while time.time() < deadline:
              box=None
              try:
                  box=imaplib.IMAP4_SSL(HOST, IMAP_PORT, ssl_context=context, timeout=15)
                  box.login(user,password)
                  status,_=box.select('INBOX',readonly=True)
                  if status != 'OK':
                      raise SystemExit(41)
                  status,data=box.search(None,'ALL')
                  if status != 'OK':
                      raise SystemExit(42)
                  ids=(data[0] or b'').split()[-250:]
                  for identifier in reversed(ids):
                      status,rows=box.fetch(identifier,'(BODY.PEEK[])')
                      if status != 'OK':
                          continue
                      raw=next((item[1] for item in rows if isinstance(item,tuple) and len(item)>1),None)
                      if not raw:
                          continue
                      parsed=email.message_from_bytes(raw,policy=default)
                      if token not in body_text(parsed):
                          continue
                      senders=[ascii_email(a) for _,a in getaddresses(parsed.get_all('from',[])) if a]
                      recipients=[]
                      for h in ('to','cc','delivered-to','x-original-to','envelope-to'):
                          recipients.extend(ascii_email(a) for _,a in getaddresses(parsed.get_all(h,[])) if a)
                      if user not in senders or recipient not in recipients:
                          raise SystemExit(43)
                      box.logout()
                      print('SMTP_AUTHENTICATED_SEND_OK=1')
                      print('IMAP_PROBE_RECEIPT_OK=1')
                      raise SystemExit(0)
                  box.logout()
              except imaplib.IMAP4.error:
                  if box is not None:
                      try: box.logout()
                      except Exception: pass
                  raise SystemExit(41)
              except SystemExit:
                  raise
              except (OSError,ssl.SSLError,ValueError):
                  if box is not None:
                      try: box.logout()
                      except Exception: pass
              time.sleep(5)
          raise SystemExit(44)
          PY
          chmod 0600 "$config" "$proof"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "proof=$proof" >> "$GITHUB_OUTPUT"

      - name: Prove real authenticated send and IMAP receipt on REG.RU host
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          CONFIG: ${{ steps.proof.outputs.config }}
          PROOF: ${{ steps.proof.outputs.proof }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          remote_cfg="/tmp/pc-coherent-mail-${GITHUB_RUN_ID}.json"
          remote_proof="/tmp/pc-coherent-mail-${GITHUB_RUN_ID}.py"
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${scp_common[@]}" "$CONFIG" "$USER@$HOST:$remote_cfg"
          scp "${scp_common[@]}" "$PROOF" "$USER@$HOST:$remote_proof"
          set +e
          ssh "${ssh_common[@]}" "$USER@$HOST" "chmod 0600 '$remote_cfg' '$remote_proof'; python3 '$remote_proof' '$remote_cfg'" > "$EVIDENCE_DIR/mail-proof.txt"
          rc=$?
          set -e
          blocker=NONE
          case "$rc" in
            0) ;;
            20|21) blocker=PROTECTED_MAIL_INPUT_INVALID ;;
            31) blocker=SMTP_AUTH_CAPABILITY_OR_EHLO_FAILED ;;
            32) blocker=SMTP_AUTH_REJECTED ;;
            33) blocker=SMTP_COHERENT_SENDER_REFUSED ;;
            34) blocker=CONTROL_RECIPIENT_REFUSED ;;
            35) blocker=SMTP_DATA_REFUSED ;;
            36) blocker=SMTP_TRANSPORT_OR_PROTOCOL_FAILED ;;
            41) blocker=IMAP_LOGIN_OR_SELECT_FAILED ;;
            42) blocker=IMAP_SEARCH_FAILED ;;
            43) blocker=IMAP_RECEIPT_IDENTITY_MISMATCH ;;
            44) blocker=IMAP_RECEIPT_TIMEOUT ;;
            *) blocker=UNEXPECTED_MAIL_PROOF_FAILURE ;;
          esac
          printf 'COHERENT_MAIL_PROOF_BLOCKER=%s\nPRODUCTION_MUTATION=NONE\n' "$blocker" > "$EVIDENCE_DIR/result.txt"
          [[ "$rc" == 0 ]]
          grep -Fxq SMTP_AUTHENTICATED_SEND_OK=1 "$EVIDENCE_DIR/mail-proof.txt"
          grep -Fxq IMAP_PROBE_RECEIPT_OK=1 "$EVIDENCE_DIR/mail-proof.txt"

      - name: Build coherent root-only runtime input
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          normalized="$(RAW_MAILBOX_USER="$MAILBOX_USER" python3 - <<'PY'
          import os,re
          raw=os.environ['RAW_MAILBOX_USER']
          if raw.count('@') != 1: raise SystemExit(1)
          local,domain=raw.rsplit('@',1); local.encode('ascii')
          value=f"{local}@{domain.encode('idna').decode('ascii').lower()}"
          if not re.fullmatch(r'[^\s@]{1,64}@[^\s@]{1,189}',value): raise SystemExit(1)
          if not value.endswith('@xn----8sbjf4befbjgs9b.xn--p1ai'): raise SystemExit(1)
          print(value)
          PY
          )"
          [[ "$normalized" =~ ^[^[:space:]@]+@xn----8sbjf4befbjgs9b\.xn--p1ai$ ]]
          mailenv="$RUNNER_TEMP/pc-password-reset-mail-${GITHUB_RUN_ID}.env"
          umask 077
          printf 'PC_SMTP_HOST=%s\nPC_SMTP_USER=%s\nPC_SMTP_PASS=%s\nPC_SMTP_PORT=%s\nPC_MAIL_FROM=%s\n' \
            "$SMTP_HOST" "$normalized" "$MAILBOX_PASSWORD" "$SMTP_PORT" "$normalized" > "$mailenv"
          chmod 0600 "$mailenv"
          echo "mailenv=$mailenv" >> "$GITHUB_OUTPUT"

      - name: Atomically reconcile proven auth-mail runtime with rollback
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          MAILENV: ${{ steps.runtime.outputs.mailenv }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          remote_mail="/tmp/pc-password-reset-mail-${GITHUB_RUN_ID}.env"
          remote_provisioner="/tmp/pc-auth-runtime-provision-${GITHUB_RUN_ID}.sh"
          remote_wrapper="/tmp/pc-auth-runtime-coherent-${GITHUB_RUN_ID}.sh"
          wrapper="$RUNNER_TEMP/pc-auth-runtime-coherent-${GITHUB_RUN_ID}.sh"
          cat > "$wrapper" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mail_input="$1"
          provisioner="$2"
          [[ "$(id -u)" -eq 0 ]]
          [[ -f "$mail_input" && ! -L "$mail_input" && "$(stat -c '%a:%u:%g' "$mail_input")" == '600:0:0' ]]
          [[ -f "$provisioner" && ! -L "$provisioner" ]]
          python3 - "$mail_input" <<'PY'
          import re,sys
          raw=open(sys.argv[1],encoding='utf-8').read()
          if not raw.endswith('\n') or '\r' in raw or '\0' in raw: raise SystemExit(1)
          values={}
          for line in raw.rstrip('\n').split('\n'):
              k,sep,v=line.partition('=')
              if not sep or k in values or not v or v != v.strip(): raise SystemExit(1)
              values[k]=v
          if set(values) != {'PC_SMTP_HOST','PC_SMTP_USER','PC_SMTP_PASS','PC_SMTP_PORT','PC_MAIL_FROM'}: raise SystemExit(1)
          if values['PC_SMTP_HOST'] != 'mail.hosting.reg.ru' or values['PC_SMTP_PORT'] != '465': raise SystemExit(1)
          if values['PC_SMTP_USER'] != values['PC_MAIL_FROM']: raise SystemExit(1)
          if not re.fullmatch(r'[^\s@]{1,64}@[^\s@]{1,189}',values['PC_SMTP_USER']): raise SystemExit(1)
          if not values['PC_SMTP_USER'].endswith('@xn----8sbjf4befbjgs9b.xn--p1ai'): raise SystemExit(1)
          if not (1 <= len(values['PC_SMTP_PASS']) <= 512): raise SystemExit(1)
          PY
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 ))
          active_dir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "${web_ids[0]}")"
          [[ -n "$active_dir" && "$active_dir" == /* && "$active_dir" != / && -d "$active_dir" && ! -L "$active_dir" ]]
          active_dir="$(realpath -e -- "$active_dir")"
          target="$active_dir/.pc-transactional-mail.env"
          [[ "$target" == "$active_dir"/* && ! -L "$target" ]]
          backup="/tmp/pc-auth-mail-backup-${GITHUB_RUN_ID}.env"
          existed=0
          if [[ -e "$target" ]]; then
            [[ -f "$target" && ! -L "$target" && "$(stat -c '%a:%u:%g' "$target")" == '600:0:0' ]]
            cp --preserve=mode,ownership,timestamps -- "$target" "$backup"
            chmod 0600 "$backup"; chown 0:0 "$backup"
            existed=1
          fi
          rollback(){
            rc=$?
            set +e
            if (( rc != 0 )); then
              if (( existed == 1 )) && [[ -f "$backup" ]]; then mv -f -- "$backup" "$target"; else rm -f -- "$target"; fi
            fi
            rm -f -- "$backup" "${tmp:-}" "${provision_out:-}"
            exit "$rc"
          }
          trap rollback EXIT
          tmp="$(mktemp "$active_dir/.pc-transactional-mail.env.XXXXXX")"
          install -m 0600 -o 0 -g 0 "$mail_input" "$tmp"
          mv -f -- "$tmp" "$target"
          tmp=''
          cmp -s -- "$mail_input" "$target"
          [[ "$(stat -c '%a:%u:%g' "$target")" == '600:0:0' ]]
          provision_out="$(mktemp)"
          PC_RECONCILE_ACTIVE_RUNTIME=1 "$provisioner" provision "$mail_input" > "$provision_out"
          grep -Eq '^PASSWORD_RESET_DELIVERY_PROVISION=(CREATED|EXISTING)$' "$provision_out"
          grep -Eq '^REGISTRATION_DELIVERY_PROVISION=(CREATED|EXISTING)$' "$provision_out"
          grep -Eq '^TRANSACTIONAL_MAIL_PROVISION=(CREATED|EXISTING)$' "$provision_out"
          grep -Fxq TRANSACTIONAL_MAIL_CHANNEL=SMTP "$provision_out"
          grep -Fxq PASSWORD_RESET_RUNTIME_VALID=1 "$provision_out"
          grep -Fxq AUTH_MAIL_RUNTIME_VALID=1 "$provision_out"
          printf 'PASSWORD_RESET_RUNTIME_VALID=1\nAUTH_MAIL_RUNTIME_VALID=1\nTRANSACTIONAL_MAIL_CHANNEL=SMTP\n'
          if (( existed == 1 )); then printf 'TRANSACTIONAL_MAIL_RECONCILE=REPLACED_COHERENT\n'; else printf 'TRANSACTIONAL_MAIL_RECONCILE=CREATED_COHERENT\n'; fi
          rm -f -- "$backup" "$provision_out"
          trap - EXIT
          REMOTE
          chmod 0700 "$wrapper"
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${scp_common[@]}" "$MAILENV" "$USER@$HOST:$remote_mail"
          scp "${scp_common[@]}" scripts/provision-production-p0-password-reset-runtime.sh "$USER@$HOST:$remote_provisioner"
          scp "${scp_common[@]}" "$wrapper" "$USER@$HOST:$remote_wrapper"
          ssh "${ssh_common[@]}" "$USER@$HOST" \
            "chmod 0600 '$remote_mail'; chmod 0700 '$remote_provisioner' '$remote_wrapper'; GITHUB_RUN_ID='$GITHUB_RUN_ID' '$remote_wrapper' '$remote_mail' '$remote_provisioner'" \
            > "$EVIDENCE_DIR/runtime.txt"
          grep -Fxq PASSWORD_RESET_RUNTIME_VALID=1 "$EVIDENCE_DIR/runtime.txt"
          grep -Fxq AUTH_MAIL_RUNTIME_VALID=1 "$EVIDENCE_DIR/runtime.txt"
          grep -Fxq TRANSACTIONAL_MAIL_CHANNEL=SMTP "$EVIDENCE_DIR/runtime.txt"
          grep -Eq '^TRANSACTIONAL_MAIL_RECONCILE=(CREATED_COHERENT|REPLACED_COHERENT)$' "$EVIDENCE_DIR/runtime.txt"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          printf 'COHERENT_MAIL_PROOF_BLOCKER=NONE\nPRODUCTION_MUTATION=ROOT_ONLY_AUTH_MAIL_RUNTIME_FILE\n' > "$EVIDENCE_DIR/result.txt"

      - name: Publish bounded PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production P0 REG.RU coherent mailbox recovery

          - exact main: \`$TARGET_SHA\`
          - result: \`PASS\`
          - SMTP authority: \`mail.hosting.reg.ru:465 implicit TLS\`
          - auth identity / envelope sender coherence: \`PASS\`
          - authenticated real send: \`PASS\`
          - IMAP real receipt: \`PASS\`
          - auth-mail runtime: \`READY_SMTP\`
          - production mutation: \`ROOT_ONLY_AUTH_MAIL_RUNTIME_FILE\`
          - database/deployment mutation: \`NONE\`
          - credentials / mailbox identity / message token / raw protocol: \`NOT_PUBLISHED\`
          - new recurring cost: \`0 RUB\`
          - next: \`P0_AUTH_RUNTIME_AUTODISCOVERY_RELEASE\`" >/dev/null

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-regru-coherent-mailbox-recover-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Cleanup transient protected assets
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set +e
          if [[ -n "${HOST:-}" && -n "${USER:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$USER@$HOST" "rm -f \
                '/tmp/pc-coherent-mail-${GITHUB_RUN_ID}.json' \
                '/tmp/pc-coherent-mail-${GITHUB_RUN_ID}.py' \
                '/tmp/pc-password-reset-mail-${GITHUB_RUN_ID}.env' \
                '/tmp/pc-auth-runtime-provision-${GITHUB_RUN_ID}.sh' \
                '/tmp/pc-auth-runtime-coherent-${GITHUB_RUN_ID}.sh' \
                '/tmp/pc-auth-mail-backup-${GITHUB_RUN_ID}.env'" >/dev/null 2>&1 || true
          fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
          rm -f "$RUNNER_TEMP/coherent-mail-${GITHUB_RUN_ID}.json" "$RUNNER_TEMP/coherent-mail-${GITHUB_RUN_ID}.py"
          rm -f "$RUNNER_TEMP/pc-password-reset-mail-${GITHUB_RUN_ID}.env" "$RUNNER_TEMP/pc-auth-runtime-coherent-${GITHUB_RUN_ID}.sh"
          unset MAILBOX_PASSWORD PC_PROD_SSH_KEY PC_PROD_SSH_PRIVATE_KEY VPS_SSH_KEY
