name: PC-CROP-08H Replay Provenance Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pc-crop-08h-replay-fix-materialize.yml'
      - 'scripts/pc-crop-08h-replay-fix/**'
  push:
    branches:
      - agent/pc-crop-08h-exchange-receipt
    paths:
      - '.github/workflows/pc-crop-08h-replay-fix-materialize.yml'
      - 'scripts/pc-crop-08h-replay-fix/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-crop-08h-replay-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact governed branch
        uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-08h-exchange-receipt
          fetch-depth: 0

      - name: Apply deterministic replay-provenance hardening
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pc-crop-08h-replay-fix/materialize.mjs
          node scripts/pc-crop-08h-replay-fix/materialize.mjs
          grep -q 'v_replay_correlation_id IS DISTINCT FROM p_correlation_id' \
            apps/api/prisma/migrations/20260727195000_fgis_grain_exchange_correlation_replay/migration.sql
          grep -q "code: 'EXCHANGE_AUTHORITY_MISMATCH'" \
            apps/api/test/industrial/fgis-grain-exchange.e2e-spec.ts
          grep -q "message.includes('FGIS_EXCHANGE_REPLAY_MISMATCH')" \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-exchange-correlation.repository.ts

      - name: Commit exact hardened implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'PC-CROP-08H: bind exact replay to immutable evidence'
          git push origin HEAD:agent/pc-crop-08h-exchange-receipt
