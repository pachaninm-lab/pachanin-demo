name: Temporary cancel duplicate production release

on:
  push:
    branches:
      - ops/tmp-cancel-duplicate-release-20260926-35ce384

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only queued duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '36259074838'
          EXPECTED_SHA: '35ce3841f15572bfcba7c8d7e03afb858da0888d'
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" == "$EXPECTED_SHA" ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID")"
          head_sha="$(jq -r '.head_sha' <<<"$run")"
          status="$(jq -r '.status' <<<"$run")"
          [[ "$head_sha" == "$EXPECTED_SHA" ]]
          case "$status" in
            queued|pending|waiting|requested)
              gh api --method POST                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/cancel"
              echo "duplicate run cancellation requested"
              ;;
            completed)
              echo "duplicate run already terminal"
              ;;
            in_progress)
              echo "refusing to cancel an in-progress run" >&2
              exit 31
              ;;
            *)
              echo "unexpected run status: $status" >&2
              exit 32
              ;;
          esac
