name: Verify presentation transport source 39b77b5

on:
  push:
    branches:
      - verify/presentation-transport-source-39b77b5-20260829

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact transport and PDF
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          let base64 = '';
          for (let i = 0; i < 14; i++) {
            const suffix = String(i).padStart(2, '0');
            const src = fs.readFileSync(`apps/web/lib/presentation-pdf/part-${suffix}.ts`, 'utf8');
            const literals = [...src.matchAll(/"([A-Za-z0-9+/=]+)"/g)].map(m => m[1]);
            if (!literals.length) throw new Error(`missing payload ${suffix}`);
            const part = literals.join('');
            const expected = i < 13 ? 18900 : 18864;
            if (part.length !== expected) throw new Error(`part ${suffix} length ${part.length}`);
            base64 += part;
          }
          const compressed = Buffer.from(base64, 'base64');
          console.log(`BASE64_LENGTH=${base64.length}`);
          console.log(`BROTLI_BYTES=${compressed.length}`);
          console.log(`BROTLI_SHA256=${hash(compressed)}`);
          if (base64.length !== 264564) throw new Error('base64 length');
          if (compressed.length !== 198423) throw new Error('brotli length');
          if (hash(compressed) !== 'e99c503bb653bfc1f4c2fd800a5bc230404a6d22d02f3d1362cb66e1172b0612') throw new Error('brotli sha');
          const pdf = zlib.brotliDecompressSync(compressed);
          const pages = (pdf.toString('latin1').match(/\/Type\s*\/Page\b/g) || []).length;
          console.log(`PDF_BYTES=${pdf.length}`);
          console.log(`PDF_SHA256=${hash(pdf)}`);
          console.log(`PDF_PAGES=${pages}`);
          if (pdf.length !== 312533) throw new Error('pdf length');
          if (hash(pdf) !== '1f99bd881404624ef8fe8bec9a10caf10a021f8cacff3ed5a6633101255178a5') throw new Error('pdf sha');
          if (pages !== 14) throw new Error('pages');
          if (!pdf.subarray(0,5).equals(Buffer.from('%PDF-'))) throw new Error('magic');
          if (!pdf.subarray(-64).includes(Buffer.from('%%EOF'))) throw new Error('eof');
          console.log('TRANSPORT_SOURCE_VERDICT=PASS');
          NODE
