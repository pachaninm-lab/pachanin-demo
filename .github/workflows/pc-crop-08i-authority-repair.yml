name: One-shot PC-CROP-08I authority repair

on:
  pull_request:
    paths:
      - '.github/workflows/pc-crop-08i-authority-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: ghcr.io/pachaninm-lab/ci-postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: grainflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d grainflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grainflow?schema=public
      DIAGNOSTICS: artifacts/pc-crop-08i-repair

    steps:
      - name: Checkout exact PC-CROP-08I branch
        uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-08i-fgis-outbound-ack
          fetch-depth: 0

      - name: Guard immutable repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3af027d4993e9387836c74209046323e65c10537"

      - uses: pnpm/action-setup@v4
        with:
          version: '10.2.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair exact migration, TypeScript and Prisma authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTICS"
          node <<'NODE'
          const fs = require('node:fs');

          function patchFile(path, replacements) {
            let value = fs.readFileSync(path, 'utf8');
            for (const { before, after, expected, label } of replacements) {
              const actual = value.split(before).length - 1;
              if (actual !== expected) throw new Error(`${path} ${label}: expected ${expected}, found ${actual}`);
              value = value.split(before).join(after);
            }
            fs.writeFileSync(path, value, 'utf8');
          }

          patchFile('apps/api/prisma/migrations/20260728004500_fgis_grain_outbound_ack/migration.sql', [
            {
              before: '  "auditEventId" text,\n',
              after: '  "auditEventId" text UNIQUE,\n',
              expected: 1,
              label: 'audit evidence uniqueness',
            },
            {
              before: '  "eventOutboxEntryId" text,\n',
              after: '  "eventOutboxEntryId" text UNIQUE,\n',
              expected: 1,
              label: 'event outbox uniqueness',
            },
            {
              before: '     OR COALESCE((v_inbox."verificationResult" ->> \'verified\')::boolean, false) IS NOT TRUE\n',
              after: '     OR v_inbox."verificationResult" ->> \'verified\' IS DISTINCT FROM \'true\'\n',
              expected: 1,
              label: 'fail-closed verified flag',
            },
            {
              before: "  IF current_user NOT IN ('app_runtime', 'app_service')\n     OR NOT public.app_rls_context_ready()\n     OR v_actor_role NOT IN ('ADMIN', 'COMPLIANCE_OFFICER')\n",
              after: "  IF NOT public.app_rls_context_ready()\n     OR v_actor_role NOT IN ('ADMIN', 'COMPLIANCE_OFFICER')\n",
              expected: 1,
              label: 'SECURITY DEFINER invoker authority',
            },
            {
              before: "    IF p_ack_envelope_reference !~ '^object-store://[A-Za-z0-9][A-Za-z0-9:_.@/-]{2,500}$'\n       OR p_ack_envelope_sha256 !~ '^[a-f0-9]{64}$'\n       OR p_ack_envelope_size_bytes IS NULL OR p_ack_envelope_size_bytes <= 0\n       OR p_ack_message_data_id !~ '^[A-Za-z_][A-Za-z0-9._-]{0,127}$'\n       OR p_provider_configuration_reference !~ '^config://[A-Za-z0-9][A-Za-z0-9:_.@/-]{2,500}$'\n",
              after: "    IF char_length(p_ack_envelope_reference) NOT BETWEEN 18 AND 512\n       OR p_ack_envelope_reference !~ '^object-store://[A-Za-z0-9][A-Za-z0-9:_.@/-]+$'\n       OR p_ack_envelope_sha256 !~ '^[a-f0-9]{64}$'\n       OR p_ack_envelope_size_bytes IS NULL OR p_ack_envelope_size_bytes <= 0\n       OR p_ack_message_data_id !~ '^[A-Za-z_][A-Za-z0-9._-]{0,127}$'\n       OR char_length(p_provider_configuration_reference) NOT BETWEEN 12 AND 512\n       OR p_provider_configuration_reference !~ '^config://[A-Za-z0-9][A-Za-z0-9:_.@/-]+$'\n",
              expected: 1,
              label: 'bounded PostgreSQL reference validation',
            },
            {
              before: '       AND v_existing."decision" = CASE WHEN v_required THEN \'REQUIRED\' ELSE \'NOT_REQUIRED\' END\n',
              after: '       AND v_existing."decision" = (CASE WHEN v_required THEN \'REQUIRED\' ELSE \'NOT_REQUIRED\' END)\n',
              expected: 1,
              label: 'ACK replay decision expression',
            },
            {
              before: 'UPDATE public."fgis_grain_acknowledgements"\n',
              after: 'UPDATE public."fgis_grain_acknowledgements" AS target\n',
              expected: 3,
              label: 'ACK mutation aliases',
            },
            {
              before: 'RETURNING to_jsonb(public."fgis_grain_acknowledgements".*) INTO v_after;',
              after: 'RETURNING to_jsonb(target.*) INTO v_after;',
              expected: 3,
              label: 'ACK returning aliases',
            },
          ]);

          patchFile('apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.contract.ts', [
            {
              before: "  eligibleInboundTransportOperations: ['SendRequest', 'SendResponse'],\n",
              after: "  eligibleInboundTransportOperations: ['SendRequest', 'SendResponse'] as const,\n",
              expected: 1,
              label: 'eligible transport tuple',
            },
            {
              before: "  ineligibleInboundTransportOperations: ['Ack'],\n",
              after: "  ineligibleInboundTransportOperations: ['Ack'] as const,\n",
              expected: 1,
              label: 'ineligible transport tuple',
            },
            {
              before: "  eligibleResponseCodes: ['success', 'accepted'],\n",
              after: "  eligibleResponseCodes: ['success', 'accepted'] as const,\n",
              expected: 1,
              label: 'eligible response tuple',
            },
            {
              before: "  ineligibleResponseCodes: ['queue-is-empty', 'ignored'],\n",
              after: "  ineligibleResponseCodes: ['queue-is-empty', 'ignored'] as const,\n",
              expected: 1,
              label: 'ineligible response tuple',
            },
          ]);

          patchFile('apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.contract.spec.ts', [
            {
              before: "      expect(() => normalizeGenerateFgisGrainAckCommand(input)).toThrow(\n        expect.objectContaining<FgisGrainAckAuthorityError>({ code: 'ACK_ENVELOPE_FORBIDDEN' }),\n      );\n",
              after: "      expect(() => normalizeGenerateFgisGrainAckCommand(input)).toThrow(\n        /ACK_ENVELOPE_FORBIDDEN/u,\n      );\n",
              expected: 1,
              label: 'Jest error matcher',
            },
          ]);

          patchFile('apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.repository.ts', [
            {
              before: "              ${command.inboxEntryId},\n              CAST(${command.expectedInboxVersion} AS bigint),\n              ${command.inboundTransportOperation},\n              ${command.inboundMessageId},\n              ${command.inboundReferenceMessageId},\n              ${command.inboundResponseCode},\n              ${command.verifiedPayloadFingerprint},\n              ${command.ackEnvelopeReference},\n              ${command.ackEnvelopeSha256},\n              ${command.ackEnvelopeSizeBytes},\n              ${command.ackMessageDataId},\n              ${command.providerConfigurationReference},\n              ${command.correlationId},\n              ${command.causationId},\n              ${command.idempotencyKey},\n              ${command.reason}\n",
              after: "              CAST(${command.inboxEntryId} AS text),\n              CAST(${command.expectedInboxVersion} AS bigint),\n              CAST(${command.inboundTransportOperation} AS text),\n              CAST(${command.inboundMessageId} AS text),\n              CAST(${command.inboundReferenceMessageId} AS text),\n              CAST(${command.inboundResponseCode} AS text),\n              CAST(${command.verifiedPayloadFingerprint} AS text),\n              CAST(${command.ackEnvelopeReference} AS text),\n              CAST(${command.ackEnvelopeSha256} AS text),\n              CAST(${command.ackEnvelopeSizeBytes} AS integer),\n              CAST(${command.ackMessageDataId} AS text),\n              CAST(${command.providerConfigurationReference} AS text),\n              CAST(${command.correlationId} AS text),\n              CAST(${command.causationId} AS text),\n              CAST(${command.idempotencyKey} AS text),\n              CAST(${command.reason} AS text)\n",
              expected: 1,
              label: 'exact PostgreSQL function argument types',
            },
            {
              before: "    'unable to persist durable FGIS ACK authority',\n",
              after: "    `unable to persist durable FGIS ACK authority: ${message.slice(0, 1000)}`,\n",
              expected: 1,
              label: 'diagnostic database error',
            },
          ]);

          patchFile('apps/api/test/industrial/fgis-grain-ack.e2e-spec.ts', [
            {
              before: 'function actor(tenantId: string, orgId: string, suffix: string, role = Role.ADMIN): RequestUser {\n',
              after: "function actor(\n  tenantId: string,\n  orgId: string,\n  suffix: string,\n  role: RequestUser['role'] = Role.ADMIN,\n): RequestUser {\n",
              expected: 1,
              label: 'role parameter authority',
            },
            {
              before: "      'fgis-zerno-1.0.23-catalog.v1', 'PRE_PRODUCTION',\n      CAST('[\"INBOUND_EVENTS\",\"SIGNATURE_VERIFICATION\",\"SCHEMA_MAPPING\"]' AS jsonb),\n",
              after: "      'fgis-zerno-1.0.23-catalog.v1', 'PREPROD',\n      CAST('[\"INBOUND_EVENTS\",\"SIGNATURE_VERIFICATION\",\"SCHEMA_MAPPING\"]' AS jsonb),\n",
              expected: 1,
              label: 'inbox environment authority',
            },
          ]);
          NODE

          node scripts/pc-crop-08i/sync-prisma-schema.mjs 2>&1 | tee "$DIAGNOSTICS/schema-sync.log"
          pnpm --filter @pc/api exec prisma format 2>&1 | tee "$DIAGNOSTICS/prisma-format.log"
          pnpm --filter @pc/api exec prisma validate 2>&1 | tee "$DIAGNOSTICS/prisma-validate.log"
          git diff --check
          cp apps/api/prisma/schema.prisma "$DIAGNOSTICS/schema.prisma"
          cp apps/api/prisma/migrations/20260728004500_fgis_grain_outbound_ack/migration.sql "$DIAGNOSTICS/migration.sql"

      - name: Apply migration chain and generate client
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/api exec prisma migrate deploy 2>&1 | tee "$DIAGNOSTICS/migrate-deploy.log"
          status=${PIPESTATUS[0]}
          if [[ "$status" != "0" ]]; then exit "$status"; fi
          pnpm --filter @pc/api exec prisma migrate status 2>&1 | tee "$DIAGNOSTICS/migrate-status.log"
          pnpm --filter @pc/api exec prisma generate 2>&1 | tee "$DIAGNOSTICS/prisma-generate.log"

      - name: Run typecheck and ACK tests
        shell: bash
        env:
          PC_CROP_08I_POSTGRESQL: '1'
        run: |
          set -o pipefail
          pnpm --filter @pc/api typecheck 2>&1 | tee "$DIAGNOSTICS/typecheck.log"
          status=${PIPESTATUS[0]}
          if [[ "$status" != "0" ]]; then exit "$status"; fi
          pnpm --filter @pc/api exec jest --runInBand --runTestsByPath \
            src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.contract.spec.ts \
            2>&1 | tee "$DIAGNOSTICS/unit.log"
          status=${PIPESTATUS[0]}
          if [[ "$status" != "0" ]]; then exit "$status"; fi
          pnpm --filter @pc/api exec jest \
            --config test/industrial/jest.config.json \
            test/industrial/fgis-grain-ack.e2e-spec.ts \
            --runInBand 2>&1 | tee "$DIAGNOSTICS/e2e.log"
          status=${PIPESTATUS[0]}
          if [[ "$status" != "0" ]]; then exit "$status"; fi
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.repository.ts';
          let value = fs.readFileSync(path, 'utf8');
          const diagnostic = '    `unable to persist durable FGIS ACK authority: ${message.slice(0, 1000)}`,\n';
          const production = "    'unable to persist durable FGIS ACK authority',\n";
          if (value.split(diagnostic).length - 1 !== 1) throw new Error('diagnostic fallback boundary missing');
          value = value.replace(diagnostic, production);
          fs.writeFileSync(path, value, 'utf8');
          NODE
          node scripts/pc-crop-08i/verify.mjs 2>&1 | tee "$DIAGNOSTICS/verify.json"

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-crop-08i-repair-${{ github.run_id }}
          path: ${{ env.DIAGNOSTICS }}
          if-no-files-found: warn
          retention-days: 7

      - name: Commit proven authority repair to PC-CROP-08I
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --porcelain -- \
            apps/api/prisma/schema.prisma \
            apps/api/prisma/migrations/20260728004500_fgis_grain_outbound_ack/migration.sql \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.contract.ts \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.contract.spec.ts \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.repository.ts \
            apps/api/test/industrial/fgis-grain-ack.e2e-spec.ts)"
          git config user.name 'pc-crop-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            apps/api/prisma/schema.prisma \
            apps/api/prisma/migrations/20260728004500_fgis_grain_outbound_ack/migration.sql \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.contract.ts \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.contract.spec.ts \
            apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-ack.repository.ts \
            apps/api/test/industrial/fgis-grain-ack.e2e-spec.ts
          git commit -m 'PC-CROP-08I: repair ACK database and TypeScript authority'
          git push origin HEAD:agent/pc-crop-08i-fgis-outbound-ack
