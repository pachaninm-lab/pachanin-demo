name: Gekta Production Speed Baseline

# Read-only latency measurement of the public Gekta assistant.
#
# This workflow never deploys, never mutates REG.RU, never touches Docker, the
# database or any production secret, and never receives SSH. It issues public
# HTTPS requests to the published assistant endpoint and records how long the
# stream took to become readable. The P0 SPEED gate is stated in user-visible
# terms, so the measurement is taken where a user would experience it.
#
# The contract job runs on every change to this scope and proves the tool
# without any network access. The baseline job runs only on an owner-authorized
# trigger.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-speed-production-baseline.yml'
      - 'scripts/tai-speed-baseline.mjs'
      - 'apps/web/tests/unit/taiSpeedBaseline.test.ts'
      - 'docs/platform-v7/autopilot/scopes/gekta-p0-speed-20260811.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gekta-speed-production-baseline.yml'
      - 'scripts/tai-speed-baseline.mjs'
      - 'apps/web/tests/unit/taiSpeedBaseline.test.ts'
      - 'docs/platform-v7/autopilot/scopes/gekta-p0-speed-20260811.json'
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit read-only measurement mode
        required: true
        default: speed
        type: choice
        options: [speed, broad1000, broad5000]
      seed:
        description: BEFORE seed, either bounded gzip/base64 or blob:GIT_SHA:SHA256 in this repository
        required: false
        type: string
      phase:
        description: Baseline phase label recorded in the artifact name
        required: true
        default: before
        type: choice
        options: [before, after]
      concurrency_waves:
        description: Comma-separated read-only concurrency waves
        required: false
        default: '1,2,4'
      repeat:
        description: How many times the corpus is repeated per wave
        required: false
        default: '1'
  issue_comment:
    types: [created]

permissions:
  contents: read

# Only real measurement commands share a group, so at most one benchmark ever
# runs against production at a time. Everything else — and `issue_comment` fires
# for every comment in the repository, not just this command — gets a group of
# its own, because a queued run that will immediately skip must never supersede
# a queued measurement. A shared group cancels pending runs even when
# cancel-in-progress is false, which silently cancelled the first attempts.
concurrency:
  group: >-
    gekta-speed-production-baseline-${{
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/gekta-batch5000-fast-20261117' &&
      github.event.inputs.operation == 'broad5000' && startsWith(github.event.inputs.seed, 'g5k:121:') &&
      'handoff-44129220061' ||
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        (startsWith(github.event.comment.body, '/gekta speed-baseline current-main') ||
         startsWith(github.event.comment.body, '/gekta broad1000 current-main'))))
      && 'measurement' || github.run_id }}
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3072
  EVIDENCE_DIR: artifacts/gekta-speed-baseline

jobs:
  contract:
    name: Validate speed baseline contract
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # The tool is proven against synthetic streams. A contract check that
      # needed production to pass would be a deployment gate, not a unit test.
      - name: Prove the measurement tool without any network access
        run: pnpm vitest run apps/web/tests/unit/taiSpeedBaseline.test.ts

      - name: Refuse to run without an explicit target
        run: |
          set +e
          node scripts/tai-speed-baseline.mjs > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected exit 2 when no --base-url is given, got $status."
            exit 1
          fi
          echo "Baseline tool refuses to run against nothing."

      - name: Assert the baseline job holds no production credential
        run: |
          set -euo pipefail
          # A measurement that needed a production secret would no longer be a
          # read-only measurement. The default token is the only one allowed,
          # and this scope never asks for it either.
          if grep -nE 'secrets\.' .github/workflows/gekta-speed-production-baseline.yml; then
            echo "This workflow must not reference any repository secret."
            exit 1
          fi
          if ! grep -qE '^permissions:' .github/workflows/gekta-speed-production-baseline.yml; then
            echo "This workflow must declare explicit least-privilege permissions."
            exit 1
          fi
          echo "No secret referenced; permissions are declared explicitly."

  baseline:
    name: Measure production speed baseline
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/main' &&
      github.triggering_actor == github.repository_owner &&
      (
      (
        github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.operation == 'speed' || github.event.inputs.operation == '') &&
        github.actor == github.repository_owner
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        startsWith(github.event.comment.body, '/gekta speed-baseline current-main')
      )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Recorded before any request, so the run can never be re-attributed to a
      # revision that happened to deploy while it was measuring.
      - name: Record the exact repository main under measurement
        id: authority
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "Repository main under measurement: $MAIN_SHA"

      - name: Record the deployed web revision before measuring
        run: |
          set -euo pipefail
          curl -sS --max-time 30 "$LIVE_BASE/api/health/ready" | tee /tmp/deployed-revision.json
          echo

      # Attribution first: if the contour refuses the benchmark, the run has to
      # say which layer refused it. This never sends a credential.
      - name: Attribute the public contour
        continue-on-error: true
        run: node scripts/tai-speed-baseline.mjs --base-url "$LIVE_BASE" --probe-only

      # The artifact path is fixed before the benchmark runs, so a non-zero exit
      # still leaves the summary and upload steps able to find what was written.
      - name: Reserve the evidence path
        env:
          PHASE: ${{ github.event.inputs.phase || 'before' }}
          MAIN_SHA: ${{ steps.authority.outputs.main_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "BASELINE_ARTIFACT=$EVIDENCE_DIR/gekta-speed-baseline-${PHASE}-${GITHUB_RUN_ID}-${MAIN_SHA}.json" >> "$GITHUB_ENV"

      - name: Measure the public assistant stream
        env:
          WAVES: ${{ github.event.inputs.concurrency_waves || '1,2,4' }}
          REPEAT: ${{ github.event.inputs.repeat || '1' }}
          MAIN_SHA: ${{ steps.authority.outputs.main_sha }}
        run: |
          set -euo pipefail
          node scripts/tai-speed-baseline.mjs \
            --base-url "$LIVE_BASE" \
            --concurrency "$WAVES" \
            --repeat "$REPEAT" \
            --locales ru,en,zh \
            --main-sha "$MAIN_SHA" \
            --cooldown-ms 15000 \
            --out "$BASELINE_ARTIFACT"
          echo "MEASUREMENT_OUTCOME=passed" >> "$GITHUB_ENV"

      - name: Summarize what was and was not proven
        if: always()
        run: |
          set -euo pipefail
          # Three outcomes are distinguished on purpose. A failed measurement
          # that still wrote evidence is far more useful than one that did not,
          # and neither may be reported as a pass.
          if [ ! -f "${BASELINE_ARTIFACT:-}" ]; then
            echo "MEASUREMENT_FAILED_NO_ARTIFACT"
            echo "No baseline artifact was produced. Reporting no baseline rather than a fabricated one."
            exit 0
          fi
          if [ "${MEASUREMENT_OUTCOME:-failed}" = "passed" ]; then
            echo "MEASUREMENT_PASS"
          else
            echo "MEASUREMENT_FAILED_WITH_ARTIFACT"
          fi
          # Rendered by the tool, not by an inline script. An inline summary
          # once carried a top-level return, and that syntax error reported a
          # measurement that had passed as a failed job.
          node scripts/tai-speed-baseline.mjs --summarize "$BASELINE_ARTIFACT"

      - name: Upload bounded baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gekta-speed-baseline-${{ github.event.inputs.phase || 'before' }}-${{ github.run_id }}-${{ steps.authority.outputs.main_sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30

  broad-plan:
    name: Plan finite Gekta 1000 measurement
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'broad1000' && github.event.inputs.phase == 'before') ||
        (github.event_name == 'issue_comment' && github.event.issue.number == 3072 &&
         github.event.comment.user.login == github.repository_owner &&
         startsWith(github.event.comment.body, '/gekta broad1000 current-main'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify checked-out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate owner command and immutable local evidence
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/tai-speed-baseline.mjs --broad-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gekta-1000-plan
          path: artifacts/gekta-broad/plan/plan.json
          if-no-files-found: error
          retention-days: 7

  broad-client:
    name: Gekta broad client (${{ matrix.slot }})
    needs: broad-plan
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.broad-plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    # Same60-minute cap as the existing measurement. At most16*150s requests
    # plus16*15s health checks leave margin for setup and receipt transfer.
    timeout-minutes: 60
    env:
      BROAD_SOURCE_SHA: ${{ needs.broad-plan.outputs.source_sha }}
      BROAD_SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.broad-plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify pinned accepted source
        run: test "$(git rev-parse HEAD)" = "$BROAD_SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gekta-1000-plan
          path: artifacts/gekta-broad/plan
      - name: Refuse to proceed after a lost or failed native client
        id: prior
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/tai-speed-baseline.mjs --broad-prepare
      - name: Download exact prior receipts from this run
        if: steps.prior.outputs.prior_artifact_ids != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.prior.outputs.prior_artifact_ids }}
          path: artifacts/gekta-broad/prior
          merge-multiple: false
      - name: Measure at most16 new cases on the unchanged public widget
        run: node scripts/tai-speed-baseline.mjs --broad-client
      - name: Preserve completed and partial native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gekta-1000-part-${{ matrix.slot }}
          path: artifacts/gekta-broad/current
          if-no-files-found: error
          retention-days: 7

  broad-report:
    name: Report actual Gekta 1000 outcomes
    needs: [broad-plan, broad-client]
    if: always() && needs.broad-plan.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BROAD_SOURCE_SHA: ${{ needs.broad-plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.broad-plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify pinned accepted source
        run: test "$(git rev-parse HEAD)" = "$BROAD_SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gekta-1000-plan
          path: artifacts/gekta-broad/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gekta-1000-part-*
          path: artifacts/gekta-broad/prior
          merge-multiple: false
      - name: Separate protocol outcomes from semantic quality
        run: node scripts/tai-speed-baseline.mjs --broad-aggregate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gekta-1000-report
          path: artifacts/gekta-broad/final/report.json
          if-no-files-found: error
          retention-days: 7

  broad5000-handoff:
    name: Preserve the current packet and switch Gekta to faster pacing
    if: >-
      github.run_attempt == 1 && github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/ops/gekta-batch5000-fast-20261117' && github.event.inputs.phase == 'before' &&
      github.event.inputs.operation == 'broad5000' && startsWith(github.event.inputs.seed, 'g5k:121:')
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Extract the validated runner and recreate the exact corpus
        env:
          ARCHIVE_SHA: '9c467795e2e9cc2d76848a39b0c56ac34fb6a23e6bb2b6820f956b6c9ba9183c'
          WORKER_ARCHIVE: ''
          CORPUS_SHA: '8a5135edaec9aba63de768d87a921d75293187e3b5892c6d297ca2de60c84929'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gekta-5000/deck"
          cd "$RUNNER_TEMP/gekta-5000/deck"
          python3 - <<'PY'
          import base64, hashlib, io, os
          from pathlib import Path
          from zipfile import ZipFile

          payload=base64.b64decode(os.environ['WORKER_ARCHIVE'],validate=True)
          assert hashlib.sha256(payload).hexdigest()==os.environ['ARCHIVE_SHA']
          files={'common.py','documents.py','farming.py','market.py','generate.py','run.py','pilot.jsonl','aggregate.py','resume.py','handoff.py'}
          with ZipFile(io.BytesIO(payload)) as archive:
              assert len(archive.namelist())==len(files) and set(archive.namelist())==files
              for name in files:
                  Path(name).write_bytes(archive.read(name))
          PY
          python3 generate.py
          printf '%s  cases.jsonl\n' "$CORPUS_SHA" | sha256sum --check
      - name: Wait for the next saved packet before stopping the original test run
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_REFERENCE: ${{ github.event.inputs.seed }}
          CORPUS_SHA: '8a5135edaec9aba63de768d87a921d75293187e3b5892c6d297ca2de60c84929'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gekta-5000/deck"
          python3 -u handoff.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gekta5k-fast-deck
          path: ${{ runner.temp }}/gekta-5000/deck
          if-no-files-found: error
          retention-days: 14

  broad5000-plan:
    name: Verify saved replies and plan the remaining Gekta questions
    needs: broad5000-handoff
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      prefix: ${{ steps.plan.outputs.prefix }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gekta5k-fast-deck
          path: ${{ runner.temp }}/gekta-5000/deck
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gekta5k-part-*
          path: ${{ runner.temp }}/gekta-5000/original
          merge-multiple: false
          run-id: '44129220061'
          github-token: ${{ github.token }}
      - name: Verify the original run has stopped and retain every saved answer
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_REFERENCE: ${{ github.event.inputs.seed }}
          CORPUS_SHA: '8a5135edaec9aba63de768d87a921d75293187e3b5892c6d297ca2de60c84929'
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44129220061" > "$RUNNER_TEMP/gekta-5000-original.json"
          cd "$RUNNER_TEMP/gekta-5000/deck"
          printf '%s  cases.jsonl\n' "$CORPUS_SHA" | sha256sum --check
          python3 resume.py plan --parts ../original --deck cases.jsonl --original "$RUNNER_TEMP/gekta-5000-original.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gekta5k-deck-and-binding
          path: ${{ runner.temp }}/gekta-5000/deck
          if-no-files-found: error
          retention-days: 14

  broad5000-client:
    name: Gekta 5000 shard ${{ matrix.slot }}
    needs: broad5000-plan
    concurrency:
      group: gekta-speed-production-baseline-measurement
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 315
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.broad5000-plan.outputs.matrix) }}
    env:
      SLOT: ${{ matrix.slot }}
      START: ${{ matrix.offset }}
      COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gekta5k-deck-and-binding
          path: ${{ runner.temp }}/gekta-5000/deck
      - name: Require all preceding finished shards and the pinned corpus
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gekta-5000/deck"
          printf '%s  cases.jsonl\n' '8a5135edaec9aba63de768d87a921d75293187e3b5892c6d297ca2de60c84929' | sha256sum --check
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
          python3 - "$names" <<'PY'
          import json, os, sys
          from pathlib import Path
          binding=json.loads(Path('run-binding.json').read_text())
          slot=int(os.environ['SLOT'])
          assert binding['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert binding['repository_commit']==os.environ['GITHUB_SHA']
          assert binding['shards'][slot]=={'slot':slot,'offset':int(os.environ['START']),'count':int(os.environ['COUNT'])}
          actual={x for x in sys.argv[1].splitlines() if x.startswith('gekta5k-part-')}
          expected={f'gekta5k-part-{i}' for i in range(slot)}
          assert actual==expected, (sorted(actual),sorted(expected))
          PY
      - name: Record live public replies with adaptive 5 s pacing
        id: measure
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gekta-5000/deck"
          mkdir -p results
          status=0
          python3 -u run.py run --expect-web '02f4e148c421632d4d2a7c2c3f091ee3991560a4' --cooldown 5 --skip-prefix "$START" --count "$COUNT" || status=$?
          python3 run.py report --output results
          cp run-binding.json results/
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path('results/summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as h:
              h.write(f"Gekta 5000 shard {os.environ['SLOT']} · {d['attempted']} sent · {d['completed']} completed\n")
          assert d['attempted']==int(os.environ['COUNT']) and d['outcome_unknown']==0
          PY
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.prior.outcome == 'success'
        with:
          name: gekta5k-part-${{ matrix.slot }}
          path: ${{ runner.temp }}/gekta-5000/deck/results
          if-no-files-found: error
          retention-days: 14

  broad5000-report:
    name: Gekta 5000 outcome and reference comparison
    if: always() && needs.broad5000-plan.result == 'success'
    needs: [broad5000-plan, broad5000-client]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREFIX: ${{ needs.broad5000-plan.outputs.prefix }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gekta5k-deck-and-binding
          path: ${{ runner.temp }}/gekta-5000/deck
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gekta5k-part-*
          path: ${{ runner.temp }}/gekta-5000/parts
          merge-multiple: false
      - name: Aggregate saved replies and separate failed transport from quality checks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gekta-5000/deck"
          mkdir -p ../parts
          cp -r previous/gekta5k-part-original ../parts/
          python3 aggregate.py --parts ../parts --deck cases.jsonl --prefix "$PREFIX" --output final
          cp run-binding.json final/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gekta5k-summary-and-comparison
          path: ${{ runner.temp }}/gekta-5000/deck/final
          if-no-files-found: error
          retention-days: 30
