name: Apply TAI database role materialization fix

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-tai-database-role-materialization-fix.py"
      - ".github/workflows/apply-tai-database-role-materialization-fix.yml"
      - "docs/platform-v7/autopilot/scopes/tai-database-role-materialization-20260802.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tai-database-role-materialization-clean-source
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout materializer authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Rebase execution onto exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 scripts/apply-tai-database-role-materialization-fix.py \
            "$RUNNER_TEMP/apply-tai-database-role-materialization-fix.py"
          git fetch --no-tags origin main
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git reset --hard origin/main
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Materialize and verify exact source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$RUNNER_TEMP/apply-tai-database-role-materialization-fix.py"
          bash -n scripts/tai-reg-ru-deploy.sh
          node scripts/check-tai-reg-ru-deploy.mjs
          git diff --check
          grep -Fq 'END;' scripts/tai-reg-ru-deploy.sh
          ! python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/tai-reg-ru-deploy.sh').read_text(encoding='utf-8')
          raise SystemExit(0 if "END\n\\$grant\\$;" in text else 1)
          PY

      - name: Publish clean source-only branch
        shell: bash
        env:
          CLEAN_BRANCH: fix/tai-database-role-materialization-source-20260802
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git add scripts/tai-reg-ru-deploy.sh scripts/check-tai-reg-ru-deploy.mjs
          files=$(git diff --cached --name-only | sort)
          test "$files" = $'scripts/check-tai-reg-ru-deploy.mjs\nscripts/tai-reg-ru-deploy.sh'
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(tai): terminate runtime role grant block'
          git push --force origin HEAD:"refs/heads/$CLEAN_BRANCH"
