name: Production P0 Reviewer Reset Route Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-route-diagnostic.yml'
      - 'scripts/production-p0-reviewer-reset-route-diagnostic.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-reset-route-diagnostic-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Prove public route vs direct Web BFF without reset
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-reviewer-reset-route-diagnostic current-runtime'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate diagnostic-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          script='scripts/production-p0-reviewer-reset-route-diagnostic.sh'
          bash -n "$script"
          python3 - "$script" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          required = [
              "COMMAND='/production p0-reviewer-reset-route-diagnostic current-runtime'",
              "--data-binary '{\"email\":\"invalid\",\"locale\":\"ru\"}'",
              '/api/auth/forgot-password',
              'PUBLIC_ROUTE_DIVERGES_FROM_WEB_BFF',
              'PUBLIC_AND_WEB_BFF_PASS',
              'RESET_REQUEST_SENT NO',
              'REVIEWER_IDENTITY_EXPOSURE NONE',
              'PRODUCTION_MUTATION NONE',
              'StrictHostKeyChecking=yes',
              'PC_PROD_SSH_HOST_FINGERPRINT',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('missing invariant: ' + ' | '.join(missing))
          forbidden = [
              'staff_reviewer_password_reset_subject',
              '/auth/password-reset/request',
              'MAIL FROM', 'RCPT TO', 'sendmail(', 'send_message(',
              'INSERT INTO', 'UPDATE auth.', 'DELETE FROM', 'TRUNCATE ', 'ALTER ROLE',
              'docker restart', 'docker compose', 'docker service',
              'StrictHostKeyChecking=no', 'UserKnownHostsFile=/dev/null',
          ]
          bad = [x for x in forbidden if x in text]
          if bad:
              raise SystemExit('forbidden mutation/identity surface: ' + ' | '.join(bad))
          if text.count('--data-binary') != 2:
              raise SystemExit('expected exactly two invalid-input POST probes')
          if text.count('"email":"invalid"') != 2:
              raise SystemExit('both POST probes must remain invalid-email only')
          PY

      - name: Verify exact owner-issued provenance and current main
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EXPECTED_BODY: /production p0-reviewer-reset-route-diagnostic current-runtime
          TRUSTED_CONNECTOR_APP_ID: '1144995'
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$EXPECTED_BODY" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" == "$(git rev-parse HEAD)" ]]
          [[ "$main_sha" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Run read-only route diagnostic
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
          PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
          PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
          PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
          PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
        run: bash scripts/production-p0-reviewer-reset-route-diagnostic.sh
