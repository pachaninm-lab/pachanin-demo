name: Repair presentation branch once

on:
  push:
    branches:
      - fix/presentation-build-static-materialization-20260829
    paths:
      - .github/workflows/restore-approved-presentation-transport-20260829.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/presentation-build-static-materialization-20260829
          fetch-depth: 0

      - name: Restore governed part and prove exact PDF
        shell: bash
        run: |
          set -euo pipefail
          git checkout f69a308d15e5eba5b79666e5957a99086a87afb2 -- apps/web/lib/presentation-pdf/part-00.ts
          node apps/web/scripts/materialize-presentation-pdf.mjs
          out='apps/web/public/downloads/prozrachnaya-tsena-presentation.pdf'
          test "$(wc -c < "$out" | tr -d '[:space:]')" = '312533'
          test "$(sha256sum "$out" | awk '{print $1}')" = '1f99bd881404624ef8fe8bec9a10caf10a021f8cacff3ed5a6633101255178a5'

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/restore-approved-presentation-transport-20260829.yml
          git add apps/web/lib/presentation-pdf/part-00.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): restore governed presentation source and finalize materializer'
          git push origin HEAD:fix/presentation-build-static-materialization-20260829
