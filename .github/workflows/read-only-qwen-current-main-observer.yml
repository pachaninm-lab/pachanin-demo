name: Read-only Qwen Current-Main Observer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/read-only-qwen-current-main-observer.yml'
      - 'docs/platform-v7/autopilot/scopes/read-only-qwen-current-main-observer-3372.json'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: acffe4e6fea38990219923da50a8a0f63cdedb8e
      ISSUE_NUMBER: '3372'
    steps:
      - name: Resolve exact current main and read workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          activation_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tai-restricted-qwen-reg-ru-activation.yml/runs?branch=main&head_sha=$TARGET_SHA&per_page=20")"
          publish_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docker-publish.yml/runs?branch=main&head_sha=$TARGET_SHA&per_page=20")"

          body="$RUNNER_TEMP/qwen-read-only-status.md"
          {
            printf '<!-- read-only-qwen-current-main-observer:%s -->\n' "$TARGET_SHA"
            printf '## Read-only GitHub Actions status for `%s`\n\n' "$TARGET_SHA"
            printf -- '- Current `main`: `%s`\n' "$current_main"
            printf -- '- Exact-main match: `%s`\n\n' "$([[ "$current_main" == "$TARGET_SHA" ]] && echo PASS || echo FAIL)"
            printf '### TAI Restricted Qwen REG.RU Activation\n\n'
            if [[ "$(jq '.total_count' <<< "$activation_json")" -eq 0 ]]; then
              printf -- '- No run found for this exact SHA.\n'
            else
              jq -r '.workflow_runs[] | "- Run `\(.id)`: event=`\(.event)`, status=`\(.status)`, conclusion=`\(.conclusion // "pending")`, attempt=`\(.run_attempt)`, URL=\(.html_url)"' <<< "$activation_json"
            fi
            printf '\n### Canonical docker-publish\n\n'
            if [[ "$(jq '.total_count' <<< "$publish_json")" -eq 0 ]]; then
              printf -- '- No run found for this exact SHA.\n'
            else
              jq -r '.workflow_runs[] | "- Run `\(.id)`: event=`\(.event)`, status=`\(.status)`, conclusion=`\(.conclusion // "pending")`, attempt=`\(.run_attempt)`, URL=\(.html_url)"' <<< "$publish_json"
            fi
            printf '\nThis observer is read-only. It did not rerun, dispatch, deploy, cancel or mutate production.\n'
          } > "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
