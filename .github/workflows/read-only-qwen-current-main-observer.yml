name: Read-only Branch Workflow Observer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/read-only-qwen-current-main-observer.yml'
      - 'docs/platform-v7/autopilot/scopes/read-only-qwen-current-main-observer-3372.json'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: 2eb2321a02f96c74340e292853f85b5dee64c64b
      TARGET_BRANCH: fix/public-ai-branding-cleanup-20260730
      ISSUE_NUMBER: '3450'
    steps:
      - name: Read exact branch workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$TARGET_BRANCH&head_sha=$TARGET_SHA&per_page=100")"

          body="$RUNNER_TEMP/branch-read-only-status.md"
          {
            printf '<!-- read-only-branch-workflow-observer:%s -->\n' "$TARGET_SHA"
            printf '## Read-only workflow status for `%s`\n\n' "$TARGET_SHA"
            printf -- '- Branch: `%s`\n' "$TARGET_BRANCH"
            if [[ "$(jq '.total_count' <<< "$runs_json")" -eq 0 ]]; then
              printf -- '- No workflow run found for this exact branch commit.\n'
            else
              jq -r '.workflow_runs[] | "- `\(.name)` run `\(.id)`: event=`\(.event)`, status=`\(.status)`, conclusion=`\(.conclusion // "pending")`, attempt=`\(.run_attempt)`, URL=\(.html_url)"' <<< "$runs_json"
            fi
            printf '\nThis observer is read-only. It did not rerun, dispatch, cancel, merge, deploy or mutate production.\n'
          } > "$body"

          cat "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body" || true
