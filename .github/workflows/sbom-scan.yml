name: IP Clean Room & Full SBOM

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/ip/**'
      - 'docs/ip/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/CODEOWNERS'
      - '.github/workflows/sbom-scan.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/ip/**'
      - 'docs/ip/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/CODEOWNERS'
      - '.github/workflows/sbom-scan.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ip-clean-room-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.2.1'
  CDXGEN_VERSION: '12.8.3'

jobs:
  ip-evidence:
    name: Full provenance, licenses & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify internal package no-publish policy
        run: node scripts/ip/verify-private-packages.mjs

      - name: Build full-history clean-room provenance
        run: node scripts/ip/build-ip-clean-room.mjs artifacts/ip-clean-room

      - name: Generate Node/pnpm CycloneDX + SPDX SBOM
        env:
          FETCH_LICENSE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/ip-clean-room/sbom
          corepack pnpm dlx @cyclonedx/cdxgen@${CDXGEN_VERSION} \
            -t pnpm \
            --format cyclonedx,spdx \
            --include-formulation \
            --validate \
            -o artifacts/ip-clean-room/sbom/sbom-node.cdx.json \
            .

      - name: Generate Python/TAI CycloneDX + SPDX SBOM
        env:
          FETCH_LICENSE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          corepack pnpm dlx @cyclonedx/cdxgen@${CDXGEN_VERSION} \
            -t python \
            --format cyclonedx,spdx \
            --include-formulation \
            --validate \
            -o artifacts/ip-clean-room/sbom/sbom-tai.cdx.json \
            apps/tai

      - name: Build transitive license map
        continue-on-error: true
        run: node scripts/ip/build-license-map.mjs artifacts/ip-clean-room/sbom artifacts/ip-clean-room

      - name: Screen proprietary core against public GitHub code
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ip/scan-github-public-matches.mjs artifacts/ip-clean-room

      - name: Upload immutable IP evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-clean-room-${{ github.sha }}
          path: artifacts/ip-clean-room
          if-no-files-found: error
          retention-days: 90

      - name: Enforce complete IP evidence gate
        if: always()
        run: node scripts/ip/verify-ip-evidence.mjs artifacts/ip-clean-room
