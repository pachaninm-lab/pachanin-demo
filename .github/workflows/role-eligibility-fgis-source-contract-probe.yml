name: Role Eligibility FGIS Source Contract Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/role-eligibility-fgis-source-contract-probe.yml'
      - 'scripts/role-eligibility-fgis-contract-probe.mjs'
      - 'apps/api/src/modules/role-eligibility/adapters/fgis-grain.adapter.ts'

permissions:
  contents: read

jobs:
  probe:
    name: Probe official FGIS Grain open-data contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run bounded read-only official-source probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/role-eligibility-fgis-contract-probe
          node scripts/role-eligibility-fgis-contract-probe.mjs \
            | tee artifacts/role-eligibility-fgis-contract-probe/probe.json
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('artifacts/role-eligibility-fgis-contract-probe/probe.json', 'utf8'));
          if (p.schemaVersion !== 'role-eligibility-fgis-source-contract-probe.v1') throw new Error('FGIS_PROBE_SCHEMA_INVALID');
          if (p.mode !== 'READ_ONLY_EXTERNAL_OBSERVATION' || p.productionDatabaseMutation !== 0 || p.registrationTouched !== false) throw new Error('FGIS_PROBE_BOUNDARY_INVALID');
          if (p.fatalErrorCode) throw new Error(p.fatalErrorCode);
          if (p.data?.errorCode) throw new Error(p.data.errorCode);
          if (p.structure?.errorCode) throw new Error(p.structure.errorCode);
          if (!Array.isArray(p.discoveredLinks) || p.discoveredLinks.length < 2) throw new Error('FGIS_PROBE_CONTRACT_LINKS_INSUFFICIENT');
          if (!p.discoveredLinks.every((x) => new URL(x.secureUrl).hostname === 'opendata.mcx.ru' && new URL(x.secureUrl).protocol === 'https:')) throw new Error('FGIS_PROBE_NON_OFFICIAL_LINK');
          NODE

      - name: Inspect binary envelope without entity values
        if: hashFiles('fgis-dataset-sample.bin') != ''
        shell: bash
        run: |
          set -euo pipefail
          file fgis-dataset-sample.bin | sed 's#fgis-dataset-sample.bin: ##' \
            > artifacts/role-eligibility-fgis-contract-probe/file-type.txt
          sha256sum fgis-dataset-sample.bin \
            | awk '{print $1}' \
            > artifacts/role-eligibility-fgis-contract-probe/data-sha256.txt
          rm -f fgis-dataset-sample.bin

      - name: Upload immutable probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-eligibility-fgis-source-contract-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/role-eligibility-fgis-contract-probe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
