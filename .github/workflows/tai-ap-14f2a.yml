name: TAI AP-14F2A Rosstat Structured Fact Pack

on:
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f2a.yml'
      - 'apps/tai/tai/migrations/0022_public_fact_pack_authority.sql'
      - 'apps/tai/tai/migrations/manifest.json'
      - 'apps/tai/tai/rosstat_fact_pack.py'
      - 'apps/tai/tests/test_migration_manifest.py'
      - 'apps/tai/tests/test_rosstat_fact_pack.py'
      - 'apps/tai/tests/test_rosstat_fact_pack_database.py'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f2a-3381.json'
      - 'scripts/tai-ap-14f2a/verify.py'
  push:
    branches:
      - main
      - agent/tai-ap-14f2a-rosstat-fact-pack-3381
    paths:
      - '.github/workflows/tai-ap-14f2a.yml'
      - 'apps/tai/tai/migrations/0022_public_fact_pack_authority.sql'
      - 'apps/tai/tai/migrations/manifest.json'
      - 'apps/tai/tai/rosstat_fact_pack.py'
      - 'apps/tai/tests/test_migration_manifest.py'
      - 'apps/tai/tests/test_rosstat_fact_pack.py'
      - 'apps/tai/tests/test_rosstat_fact_pack_database.py'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f2a-3381.json'
      - 'scripts/tai-ap-14f2a/verify.py'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: tai-ap-14f2a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: artifacts/tai-ap-14f2a
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tai_ap14f2a

jobs:
  rosstat-fact-pack:
    name: Exact decimals · dimensions · citations · withdrawal
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: ghcr.io/pachaninm-lab/ci-postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tai_ap14f2a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tai_ap14f2a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - name: Resolve governed comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            base_ref="HEAD^"
          else
            base_ref="015d6fc4c1fdee24860a2ebee49d2cd95de9be2c"
          fi
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/tai/pyproject.toml

      - name: Verify source-controlled scope
        if: github.ref_name != 'main'
        shell: bash
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: |
          set -euo pipefail
          export GITHUB_HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          bash scripts/p7-autopilot-guard.sh

      - name: Install TAI toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e 'apps/tai[dev]'

      - name: Static, type and deterministic unit acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ruff check \
            apps/tai/tai/rosstat_fact_pack.py \
            apps/tai/tests/test_migration_manifest.py \
            apps/tai/tests/test_rosstat_fact_pack.py \
            apps/tai/tests/test_rosstat_fact_pack_database.py \
            scripts/tai-ap-14f2a/verify.py \
            | tee "$EVIDENCE_DIR/ruff.txt"
          mypy apps/tai/tai/rosstat_fact_pack.py \
            | tee "$EVIDENCE_DIR/mypy.txt"
          pytest \
            apps/tai/tests/test_migration_manifest.py \
            apps/tai/tests/test_rosstat_fact_pack.py \
            | tee "$EVIDENCE_DIR/unit-pytest.txt"

      - name: PostgreSQL concurrency, query and withdrawal acceptance
        shell: bash
        run: |
          set -euo pipefail
          pytest apps/tai/tests/test_rosstat_fact_pack_database.py \
            | tee "$EVIDENCE_DIR/postgresql-pytest.txt"

      - name: Verify fail-closed exact slice contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tai-ap-14f2a/verify.py \
            --scope-guard "${{ steps.base.outputs.base_ref }}" \
            | tee "$EVIDENCE_DIR/acceptance.json"

      - name: Record PostgreSQL evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$EVIDENCE_DIR/postgresql-evidence.json"
          import json
          import os

          import psycopg
          from psycopg.rows import dict_row

          with psycopg.connect(
              os.environ["TEST_DATABASE_URL"],
              row_factory=dict_row,
          ) as connection:
              versions = connection.execute(
                  """
                  SELECT version_id, manifest_sha256, status, fact_count,
                         source_snapshot_id, dimension_codes
                  FROM tai_public_fact_pack_versions
                  ORDER BY version_id
                  """
              ).fetchall()
              facts = connection.execute(
                  """
                  SELECT fact_id, source_id, source_snapshot_id,
                         artifact_sha256, chunk_id, source_uri, xpath,
                         dimensions, measure_code, exact_value_text,
                         provenance_sha256
                  FROM tai_public_fact_pack_facts
                  ORDER BY version_id, fact_id
                  """
              ).fetchall()
              active_count = connection.execute(
                  """
                  SELECT count(*) AS count
                  FROM tai_active_public_fact_pack_facts_v1
                  """
              ).fetchone()["count"]
              audit = connection.execute(
                  """
                  SELECT event_sha256, event_type, pack_id, version_id,
                         manifest_sha256, actor_id, reason_code,
                         payload_sha256
                  FROM tai_public_fact_pack_audit
                  ORDER BY created_at, event_sha256
                  """
              ).fetchall()
          payload = {
              "schemaVersion": "tai.ap14f2a-postgresql-evidence.v1",
              "exactHead": os.environ["EXACT_HEAD"],
              "packId": "factpack.rosstat.7708234640-vshp2016254",
              "sourceId": "official.rosstat.opendata.7708234640-vshp2016254",
              "versions": versions,
              "facts": facts,
              "activeFactCountAfterWithdrawal": active_count,
              "audit": audit,
              "modelInvoked": False,
              "floatAuthority": False,
              "tenantId": None,
              "operationalStatus": "NOT_ATTESTED",
              "productionHosting": "REG_RU_VPS_ONLY",
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2, default=str))
          PY

      - name: Upload immutable AP-14F2A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-ap-14f2a-fact-pack-evidence-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish observable exact-main status
        if: always() && github.ref_name == 'main'
        uses: actions/github-script@v7
        env:
          ACCEPTANCE_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.ACCEPTANCE_JOB_STATUS === 'success'
              ? 'success'
              : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXACT_HEAD,
              state,
              context: 'TAI AP-14F2A exact-main',
              description: state === 'success'
                ? 'Exact Rosstat structured fact pack accepted on exact main'
                : 'AP-14F2A exact-main acceptance failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
