              `const fs = require('node:fs'); const args = process.argv.slice(2);\n` +
              `fs.appendFileSync(process.env.IR20_CAPTURE, JSON.stringify(args)+'\\n');\n` +
              `if (process.env.IR20_FAIL && args.some(x => x.includes(process.env.IR20_FAIL))) process.exit(9);\n`);
            fs.chmodSync(path.join(root, 'gh'), 0o700);
            const env = { ...process.env, PATH: `${root}:${process.env.PATH}`, GH_TOKEN: 'inert-test-token',
              GITHUB_REPOSITORY: repo, HEAD_SHA: head, BASE_SHA: base, PR_NUMBER: String(pr),
              GITHUB_RUN_ID: '42', GITHUB_RUN_ATTEMPT: '2', VALIDATION_RC: '0', IR20_CAPTURE: log, IR20_FAIL: '', ...overrides };
            for (const key of Object.keys(env)) if (env[key] === undefined) delete env[key];
            const result = spawnSync('bash', ['-c', script], { encoding: 'utf8', env, timeout: 10000 });
            const calls = fs.existsSync(log) ? fs.readFileSync(log, 'utf8').trim().split('\n').map(JSON.parse) : [];
            return { result, calls };
          }
          function fields(args) {
            const out = {};
