              github: { event_name: 'pull_request_target', event: { pull_request: { head: { ref: branch } } } },
            }, { timeout: 100 });
          }
          function jobName(source, branch) {
            const name = source.match(/^    name: (.+)$/mu)[1];
            return name.startsWith('$') ? evaluate(name, branch) : name;
          }
