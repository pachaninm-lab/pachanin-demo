          [[ "$VALIDATION_RC" == 0 ]]
          [[ "$CONTEXT_OUTCOME" == success ]]

  trusted-egrul-scope:
    name: FNS EGRUL immutable scope · trusted base
    if: >-
      github.event_name == 'pull_request_target' &&
