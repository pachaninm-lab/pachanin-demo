          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { runInNewContext } from 'node:vm';
          import test from 'node:test';
          import { nativeScopeGuardBinding, nativeScopeGuardMatchesRun } from './docs/platform-v7/autopilot/verify-pr-review-gate.mjs';
          const workflow = fs.readFileSync('.github/workflows/platform-v7-autopilot-guard.yml', 'utf8');
          const branches = ['governance/ir20-api-database-binding-admission-20260919', 'governance/ir20-binding-immutable-scope-20260919'];
          const repo = 'fixture/project', head = 'a'.repeat(40), base = 'b'.repeat(40), pr = 5438;
          const canonicalName = 'PC-CROP implementation immutable scope · trusted base';
          function job(id) {
            const start = new RegExp(`^  ${id}:$`, 'm').exec(workflow);
            assert.ok(start, `missing job ${id}`);
            return workflow.slice(start.index).split(/\n(?=  [a-z][a-z0-9_-]*:\n)/u)[0];
          }
          const bootstrap = job('trusted-ir20-binding-bootstrap');
          const generic = job('trusted-immutable-scope');
          function evaluate(expression, branch) {
            return runInNewContext(expression.trim().replace(/^\$\{\{\s*/u, '').replace(/\s*\}\}$/u, ''), {
              github: { event_name: 'pull_request_target', event: { pull_request: { head: { ref: branch } } } },
            }, { timeout: 100 });
          }
          function jobName(source, branch) {
            const name = source.match(/^    name: (.+)$/mu)[1];
            return name.startsWith('$') ? evaluate(name, branch) : name;
          }
          function jobRuns(source, branch) {
            const condition = source.match(/^    if: >-\n((?:      .+\n)+)/mu)[1];
            return evaluate(condition, branch);
          }
          function shellStep(source, name) {
            const step = source.split(`      - name: ${name}\n`)[1]?.split(/\n      - /u)[0];
            assert.ok(step, `missing step ${name}`);
            return step.split('        run: |\n')[1].split('\n').map(line => {
              assert.ok(!line || line.startsWith('          '), 'unexpected shell indentation');
              return line.slice(10);
            }).join('\n');
          }
          const publisher = shellStep(bootstrap, 'Emit required guard context from accepted IR-20 bootstrap');
          const enforce = shellStep(bootstrap, 'Require the IR-20 validation and guard publication to succeed');
          function publish(t, overrides = {}, script = publisher) {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'ir20-provenance-'));
            t.after(() => fs.rmSync(root, { recursive: true, force: true }));
            const log = path.join(root, 'calls.jsonl');
            fs.writeFileSync(path.join(root, 'gh'), `#!${process.execPath}\n` +
              `const fs = require('node:fs'); const args = process.argv.slice(2);\n` +
              `fs.appendFileSync(process.env.IR20_CAPTURE, JSON.stringify(args)+'\\n');\n` +
              `if (process.env.IR20_FAIL && args.some(x => x.includes(process.env.IR20_FAIL))) process.exit(9);\n`);
            fs.chmodSync(path.join(root, 'gh'), 0o700);
            const env = { ...process.env, PATH: `${root}:${process.env.PATH}`, GH_TOKEN: 'inert-test-token',
              GITHUB_REPOSITORY: repo, HEAD_SHA: head, BASE_SHA: base, PR_NUMBER: String(pr),
              GITHUB_RUN_ID: '42', GITHUB_RUN_ATTEMPT: '2', VALIDATION_RC: '0', IR20_CAPTURE: log, IR20_FAIL: '', ...overrides };
            for (const key of Object.keys(env)) if (env[key] === undefined) delete env[key];
            const result = spawnSync('bash', ['-c', script], { encoding: 'utf8', env, timeout: 10000 });
            const calls = fs.existsSync(log) ? fs.readFileSync(log, 'utf8').trim().split('\n').map(JSON.parse) : [];
            return { result, calls };
          }
          function fields(args) {
            const out = {};
            for (let i = 0; i < args.length; i++) if (args[i] === '-f') {
              const index = args[i + 1].indexOf('=');
              out[args[i + 1].slice(0, index)] = args[i + 1].slice(index + 1);
            }
            return out;
          }
          function evidence(calls, branch = branches[0]) {
            assert.equal(calls.length, 2);
            assert.ok(calls[0].includes(`repos/${repo}/statuses/${head}`));
            assert.ok(calls[1].includes(`repos/${repo}/check-runs`));
            const s = fields(calls[0]), c = fields(calls[1]);
            const check = { id: 101, name: c.name, head_sha: c.head_sha, app: { id: 15368, slug: 'github-actions' },
              status: c.status, conclusion: c.conclusion, external_id: c.external_id,
              details_url: `https://github.com/${repo}/runs/101`,
              started_at: '2026-09-19T00:00:02Z', completed_at: '2026-09-19T00:00:02Z',
              output: { title: c['output[title]'], summary: c['output[summary]'], annotations_count: 0, text: null } };
            const statuses = [{ ...s, created_at: '2026-09-19T00:00:01Z',
              creator: { login: 'github-actions[bot]', id: 41898282, type: 'Bot' } }];
            const run = { id: 42, run_attempt: 2, workflow_id: 1, run_number: 2, check_suite_id: 33,
              repository: { id: 1, full_name: repo }, head_repository: { full_name: repo },
              name: 'platform-v7 autopilot guard', path: '.github/workflows/platform-v7-autopilot-guard.yml',
              event: 'pull_request_target', head_sha: head, head_branch: branch, status: 'completed',
              run_started_at: '2026-09-19T00:00:00Z', updated_at: '2026-09-19T00:00:04Z',
              pull_requests: [{ number: pr, head: { sha: head, ref: branch, repo: { id: 1 } },
                base: { sha: base, ref: 'main', repo: { id: 1 } } }] };
            const peers = [{ id: 102, name: jobName(bootstrap, branch), app: check.app, head_sha: head,
              details_url: c.details_url, check_suite: { id: 33 }, status: 'completed', conclusion: c.conclusion,
              started_at: '2026-09-19T00:00:00Z', completed_at: '2026-09-19T00:00:03Z' }];
