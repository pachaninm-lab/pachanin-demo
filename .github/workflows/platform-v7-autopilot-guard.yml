          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          conclusion=failure
          title='FNS EGRUL immutable scope rejected'
          summary='The base-controlled EGRUL scope check failed closed.'
          if [[ "$VALIDATION_RC" == 0 ]]; then
            conclusion=success
            title='FNS EGRUL immutable scope accepted'
            summary='The exact PR head satisfies the EGRUL authority recorded in the trusted base.'
