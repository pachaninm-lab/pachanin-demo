          const changed = execFileSync(
            'git', ['diff', '--no-renames', '--name-only', `${baseSha}...${headSha}`], { encoding: 'utf8' },
          ).trim().split(/\r?\n/u).map((value) => value.trim()).filter(Boolean);

          if (branch === governanceBranch) {
            if (changed.length !== 1 || changed[0] !== manifestPath) {
              throw new Error(`EGRUL_GOVERNANCE_SCOPE_VIOLATION:${changed.join(',')}`);
            }
            console.log(`PASS: ${governanceBranch} is limited to the one prior-authority manifest.`);
            process.exit(0);
          }
          if (branch !== implementationBranch) throw new Error('EGRUL_SCOPE_BRANCH_UNAUTHORIZED');

