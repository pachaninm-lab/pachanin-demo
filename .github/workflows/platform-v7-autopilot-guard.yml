concurrency:
  group: platform-v7-autopilot-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-ir20-binding-bootstrap:
    name: ${{ (github.event.pull_request.head.ref == 'governance/ir20-api-database-binding-admission-20260919' || github.event.pull_request.head.ref == 'governance/ir20-binding-immutable-scope-20260919') && 'PC-CROP implementation immutable scope · trusted base' || 'IR-20 binding governance bootstrap · trusted base' }}
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.head.ref == 'governance/ir20-api-database-binding-admission-20260919' ||
      github.event.pull_request.head.ref == 'governance/ir20-binding-immutable-scope-20260919')
    permissions:
      contents: read
      checks: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout accepted IR-20 bootstrap authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bounded IR-20 governance without executing the candidate
        id: trusted_validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          IR20_SCOPE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          (
            set -Eeuo pipefail
            [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$BASE_SHA"
            timeout 60s git fetch --no-tags origin "$HEAD_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
            node - <<'IR20_SCOPE_JS'
          const { execFileSync } = require('node:child_process');
          const { isDeepStrictEqual } = require('node:util');
          const admission = 'governance/ir20-api-database-binding-admission-20260919';
          const prerequisite = 'governance/ir20-binding-immutable-scope-20260919';
          const implementation = 'ops/ir20-api-database-binding-20260919';
          const statePath = 'docs/platform-v7/autopilot/autopilot-state.json';
          const governancePaths = [
            'scripts/p7-autopilot-guard.sh',
            'scripts/p7-autopilot-guard.test.mjs',
            '.github/workflows/platform-v7-autopilot-guard.yml',
            statePath,
          ];
          const implementationPaths = [
            'scripts/release/ir20-api-database-binding.py',
            'scripts/release/test-ir20-api-database-binding.py',
            'scripts/release/test-ir20-api-database-binding-integration.py',
            '.github/workflows/ir20-api-database-binding.yml',
            'docs/ops/ir20-api-database-binding.md',
          ];
          const base = process.env.BASE_SHA;
          const head = process.env.HEAD_SHA;
          const branch = process.env.IR20_SCOPE_BRANCH;
          function reject(reason) { throw new Error(`IR20_TRUSTED_BOOTSTRAP:${reason}`); }
          if (!/^[0-9a-f]{40}$/.test(base || '') || !/^[0-9a-f]{40}$/.test(head || '')) reject('invalid SHA');
          if (!process.env.GITHUB_REPOSITORY || process.env.HEAD_REPOSITORY !== process.env.GITHUB_REPOSITORY) reject('fork or missing repository identity');
          if (branch !== admission && branch !== prerequisite) reject('unknown branch');
          function git(...args) {
            return execFileSync('git', args, { encoding: 'utf8', timeout: 10000, maxBuffer: 1024 * 1024 });
          }
          git('merge-base', '--is-ancestor', base, head);
          function readState(ref) {
            const raw = git('show', `${ref}:${statePath}`);
            if (Buffer.byteLength(raw) > 256 * 1024) reject('oversized state');
            const state = JSON.parse(raw);
            if (!state || Array.isArray(state) || typeof state !== 'object' || !state.approvedConcurrentScopes ||
                Array.isArray(state.approvedConcurrentScopes) || typeof state.approvedConcurrentScopes !== 'object') reject('invalid state');
            return state;
          }
          const accepted = readState(base);
          const candidate = readState(head);
          const expected = structuredClone(accepted);
          let allowed;
          if (branch === admission) {
            if (Object.hasOwn(accepted.approvedConcurrentScopes, prerequisite) ||
                Object.hasOwn(accepted.approvedConcurrentScopes, implementation)) reject('admission is not a fresh prerequisite');
            expected.approvedConcurrentScopes[prerequisite] = governancePaths;
            allowed = [statePath];
          } else {
            const basePaths = accepted.approvedConcurrentScopes[prerequisite];
            if (!Array.isArray(basePaths) || !isDeepStrictEqual([...basePaths].sort(), [...governancePaths].sort())) reject('missing exact base-only four-file admission');
            if (Object.hasOwn(accepted.approvedConcurrentScopes, implementation)) reject('implementation already admitted');
            expected.approvedConcurrentScopes[implementation] = implementationPaths;
            allowed = basePaths;
          }
          if (!isDeepStrictEqual(candidate, expected)) reject('unauthorized state or scope mutation');
          const entries = git('diff', '--no-renames', '--name-status', '-z', `${base}...${head}`).split('\0');
          if (entries.pop() !== '' || entries.length % 2 !== 0) reject('malformed diff');
          const changed = [];
          for (let index = 0; index < entries.length; index += 2) {
            const status = entries[index];
            const file = entries[index + 1];
            if (status !== 'M' || !allowed.includes(file)) reject('only exact existing governance files may change');
            for (const ref of [base, head]) {
              const mode = git('ls-tree', '-z', ref, '--', file);
              if (!/^(100644|100755) blob [0-9a-f]{40}\t/.test(mode) || mode.split('\0').length !== 2) reject('non-regular governance file');
            }
            changed.push(file);
          }
          if (!isDeepStrictEqual([...changed].sort(), [...allowed].sort())) reject('incomplete or duplicate governance diff');
          console.log(`PASS: ${head} is the exact ${branch === admission ? 'state-only admission' : 'four-file enforcement prerequisite'}; candidate code was not executed.`);
          IR20_SCOPE_JS
          ) > "$RUNNER_TEMP/trusted-ir20-binding-bootstrap.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/trusted-ir20-binding-bootstrap.log"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Emit required guard context from accepted IR-20 bootstrap
        id: trusted_context
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_RC: ${{ steps.trusted_validation.outputs.rc }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          conclusion=failure
          title='PC-CROP immutable scope rejected'
          summary='The base-controlled immutable scope check failed closed.'
          if [[ "$VALIDATION_RC" == 0 ]]; then
            conclusion=success
            title='PC-CROP immutable scope accepted'
            summary='The exact PR head satisfies the immutable scope recorded in the trusted base.'
          fi
          binding="platform-v7.scope-guard.v1:pr:$PR_NUMBER:head:$HEAD_SHA:base:$BASE_SHA:run:$GITHUB_RUN_ID:attempt:$GITHUB_RUN_ATTEMPT"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='scope-guard/exact-head' -f "state=$conclusion" \
            -f "target_url=$run_url" \
            -f description='Trusted-base immutable scope result; exact PR head and workflow run required' >/dev/null
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='guard' -f head_sha="$HEAD_SHA" \
            -f "external_id=$binding" \
            -f "details_url=$run_url" \
            -f status='completed' \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary" >/dev/null
      - name: Require the IR-20 validation and guard publication to succeed
        if: always()
        env:
          VALIDATION_RC: ${{ steps.trusted_validation.outputs.rc }}
          CONTEXT_OUTCOME: ${{ steps.trusted_context.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "$VALIDATION_RC" == 0 && "$CONTEXT_OUTCOME" == success ]]


  public-home-contract:
    name: Final public experience · exact-head unit contracts
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/platform-v7-strategic-rebuild-v3'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact public implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify all admitted homepage unit contracts
        run: >-
          pnpm --filter @pc/web exec vitest run
          tests/unit/platformV7HeroInfrastructureMessage.test.ts
          tests/unit/platformV7RootWorkEntry.test.ts
          tests/unit/platformV7StrategicHomeSafety.test.ts
          tests/unit/gektaProductSeparation.test.ts
          tests/unit/platformV7AccountingClosureValue.test.ts
          tests/unit/platformV7HomeTaiRoleEntry.test.ts
          tests/unit/platformV7HomepageProductCopy.test.ts
          tests/unit/platformV7HomepageVisibleOperatingCopy.test.ts
          tests/unit/platformV7PublicCopyQuality.test.ts
          tests/unit/platformV7PublicExperienceV4.test.ts
