            'foreign suite': e => { e.peers[0].check_suite.id = 99; },
            'foreign producer run': e => { e.peers[0].details_url = `https://github.com/${repo}/actions/runs/99`; },
            'status before run': e => { e.statuses[0].created_at = '2026-09-18T23:00:00Z'; },
