              status: c.status, conclusion: c.conclusion, external_id: c.external_id,
              details_url: `https://github.com/${repo}/runs/101`,
              started_at: '2026-09-19T00:00:02Z', completed_at: '2026-09-19T00:00:02Z',
              output: { title: c['output[title]'], summary: c['output[summary]'], annotations_count: 0, text: null } };
            const statuses = [{ ...s, created_at: '2026-09-19T00:00:01Z',
              creator: { login: 'github-actions[bot]', id: 41898282, type: 'Bot' } }];
            const run = { id: 42, run_attempt: 2, workflow_id: 1, run_number: 2, check_suite_id: 33,
              repository: { id: 1, full_name: repo }, head_repository: { full_name: repo },
              name: 'platform-v7 autopilot guard', path: '.github/workflows/platform-v7-autopilot-guard.yml',
