          if (manifest.status !== 'active') throw new Error('EGRUL_SCOPE_NOT_ACTIVE');
          if (manifest.branch !== implementationBranch) throw new Error('EGRUL_SCOPE_BRANCH_MISMATCH');

          const expectedAllowed = [
            'apps/api/src/fns-egrul-import.ts',
            'apps/api/src/modules/role-eligibility/fns-egrul-file-import.service.ts',
            'apps/api/src/modules/role-eligibility/fns-egrul-file-import.service.spec.ts',
            'apps/api/src/modules/role-eligibility/role-eligibility-fns-egrul-import.module.ts',
