name: platform-v7 autopilot guard

on:
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/fns-egrul-import.ts'
      - 'apps/api/src/modules/role-eligibility/**'
      - 'apps/api/src/modules/auth/**'
      - 'apps/api/src/modules/staff-access/**'
      - 'apps/web/app/api/staff/**'
      - 'apps/web/app/platform-v7/**'
      - 'apps/web/components/platform-v7/**'
      - 'apps/web/components/transaction-ux/**'
      - 'apps/web/components/v7r/**'
      - 'apps/web/public/platform-v7/**'
      - 'apps/web/lib/auction-server.ts'
      - 'apps/web/lib/logistics-server.ts'
      - 'apps/web/lib/deal-execution-server.ts'
      - 'apps/web/lib/bank-release-server.ts'
      - 'apps/web/lib/platform-v7/**'
      - 'apps/web/lib/organization-team-server.ts'
      - 'apps/web/styles/**'
      - 'apps/web/tests/**'
      - 'packages/design-system-v8/**'
      - 'packages/design-tokens/**'
      - 'packages/domain-core/src/execution-simulation/**'
      - 'docs/api/**'
      - 'docs/platform-v7/**'
      - 'docs/security/CRYPTOGRAPHIC_INVENTORY.md'
      - 'docs/security/cryptographic-inventory.json'
      - 'design-governance-v8.json'
      - 'scripts/check-design-system-v8*.mjs'
      - 'scripts/platform-v7-route-inventory.mjs'
      - 'scripts/p7-autopilot-guard.sh'
      - 'scripts/p7-autopilot-guard.test.mjs'
      - 'scripts/check-production-like-kubernetes-timeout.mjs'
      - 'scripts/check-production-p0-staff-decision-idempotency.mjs'
      - 'scripts/check-production-p0-staff-decision-session.mjs'
      - 'scripts/check-production-p0-registration-decision-replay-notification.mjs'
      - '.github/workflows/platform-v7-autopilot-guard.yml'
      - '.github/workflows/production-like-kubernetes-acceptance.yml'
      - '.github/workflows/platform-v7-safe-merge.yml'
      - '.github/workflows/production-full-stack-exact-sha.yml'
      - '.github/workflows/production-auth-mail-outbox-cutover.yml'
      - '.github/workflows/production-p0-staff-api-origin-local-controller-repair.yml'
      - '.github/workflows/production-p0-reviewer-inspect.yml'
      - '.github/workflows/production-p0-first-customer-acceptance.yml'
      - '.github/workflows/production-p0-all-role-registration.yml'
      - 'scripts/production-p0-reviewer-inspect.sh'
      - 'scripts/check-production-full-stack-release.mjs'
      - 'scripts/check-production-auth-mail-outbox-cutover.mjs'
      - 'scripts/check-production-p0-reviewer-inspect.mjs'
      - 'scripts/check-production-p0-first-customer-acceptance.mjs'
      - 'scripts/check-production-p0-all-role-registration.mjs'
      - 'docs/ops/production-full-stack-release.md'
      - 'docs/ops/production-p0-first-customer-acceptance.md'
      - 'docs/ops/production-p0-all-role-registration.md'

concurrency:
  group: platform-v7-autopilot-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-egrul-scope:
    name: FNS EGRUL immutable scope · trusted base
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.head.ref == 'governance/role-eligibility-fns-egrul-file-import-5016' ||
      github.event.pull_request.head.ref == 'feat/role-eligibility-fns-egrul-file-import-5016')
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Validate EGRUL scope from trusted base authority
        id: trusted_validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EGRUL_SCOPE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          (
            set -Eeuo pipefail
            if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo 'PC-CROP immutable-scope authority rejects same-name branches from forks.' >&2
              exit 1
            fi
            if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'EGRUL trusted-scope guard received an invalid commit SHA.' >&2
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$BASE_SHA"
            git fetch --no-tags origin "$HEAD_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
            node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const baseSha = String(process.env.BASE_SHA || '').trim();
          const headSha = String(process.env.HEAD_SHA || '').trim();
          const branch = String(process.env.EGRUL_SCOPE_BRANCH || '').trim();
          const governanceBranch = 'governance/role-eligibility-fns-egrul-file-import-5016';
          const implementationBranch = 'feat/role-eligibility-fns-egrul-file-import-5016';
          const manifestPath = 'docs/platform-v7/autopilot/scopes/role-eligibility-fns-egrul-file-import-5016.json';
          const changed = execFileSync(
            'git', ['diff', '--no-renames', '--name-only', `${baseSha}...${headSha}`], { encoding: 'utf8' },
          ).trim().split(/\r?\n/u).map((value) => value.trim()).filter(Boolean);

          if (branch === governanceBranch) {
            if (changed.length !== 1 || changed[0] !== manifestPath) {
              throw new Error(`EGRUL_GOVERNANCE_SCOPE_VIOLATION:${changed.join(',')}`);
            }
            console.log(`PASS: ${governanceBranch} is limited to the one prior-authority manifest.`);
            process.exit(0);
          }
          if (branch !== implementationBranch) throw new Error('EGRUL_SCOPE_BRANCH_UNAUTHORIZED');

          let manifest;
          try {
            manifest = JSON.parse(execFileSync('git', ['show', `${baseSha}:${manifestPath}`], { encoding: 'utf8' }));
          } catch {
            throw new Error('EGRUL_TRUSTED_BASE_MANIFEST_MISSING');
          }
          if (manifest.schemaVersion !== 'platform-v7.concurrent-scope.v1') throw new Error('EGRUL_SCOPE_SCHEMA_INVALID');
          if (manifest.status !== 'active') throw new Error('EGRUL_SCOPE_NOT_ACTIVE');
          if (manifest.branch !== implementationBranch) throw new Error('EGRUL_SCOPE_BRANCH_MISMATCH');

          const expectedAllowed = [
            'apps/api/src/fns-egrul-import.ts',
            'apps/api/src/modules/role-eligibility/fns-egrul-file-import.service.ts',
            'apps/api/src/modules/role-eligibility/fns-egrul-file-import.service.spec.ts',
            'apps/api/src/modules/role-eligibility/role-eligibility-fns-egrul-import.module.ts',
            'docs/security/CRYPTOGRAPHIC_INVENTORY.md',
            'docs/security/cryptographic-inventory.json',
          ];
          if (!Array.isArray(manifest.allowedPaths)) throw new Error('EGRUL_SCOPE_ALLOWED_PATHS_INVALID');
          const allowed = manifest.allowedPaths.map((value, index) => {
            if (typeof value !== 'string') throw new Error(`EGRUL_SCOPE_ALLOWED_PATH_${index}_INVALID`);
            const normalized = value.trim().replace(/\/+$/u, '');
            if (!normalized || normalized.includes('\\') || normalized.includes('*') || normalized === '..' || normalized.startsWith('../') || normalized.includes('/../')) {
              throw new Error(`EGRUL_SCOPE_ALLOWED_PATH_${index}_UNSAFE`);
            }
            return normalized;
          });
          if (new Set(allowed).size !== allowed.length) throw new Error('EGRUL_SCOPE_ALLOWED_PATH_DUPLICATE');
          const expectedSorted = [...expectedAllowed].sort();
          const actualSorted = [...allowed].sort();
          if (JSON.stringify(actualSorted) !== JSON.stringify(expectedSorted)) throw new Error('EGRUL_SCOPE_ALLOWLIST_DRIFT');

          const expectedForbidden = [
            'apps/api/prisma/migrations/**',
            'apps/api/prisma/schema.prisma',
            'apps/web/**',
            'infra/**',
          ];
          if (!Array.isArray(manifest.forbiddenPaths)) throw new Error('EGRUL_SCOPE_FORBIDDEN_PATHS_INVALID');
          const forbidden = manifest.forbiddenPaths.map((value) => String(value).trim()).sort();
          if (JSON.stringify(forbidden) !== JSON.stringify([...expectedForbidden].sort())) throw new Error('EGRUL_SCOPE_FORBIDDEN_PATHS_DRIFT');

          const outside = changed.filter((file) => !allowed.includes(file));
          if (outside.length) throw new Error(`EGRUL_IMPLEMENTATION_SCOPE_VIOLATION:${outside.join(',')}`);
          const mutableAuthorities = changed.filter((file) => (
            file === 'AGENTS.md'
            || file === manifestPath
            || file === 'scripts/p7-autopilot-guard.sh'
            || file === 'scripts/p7-autopilot-guard.test.mjs'
            || file === 'scripts/p7-source-controlled-scope.mjs'
            || file === '.github/workflows/platform-v7-autopilot-guard.yml'
            || file === 'docs/platform-v7/autopilot/autopilot-state.json'
            || file.startsWith('docs/platform-v7/autopilot/')
          ));
          if (mutableAuthorities.length) throw new Error(`EGRUL_MUTABLE_AUTHORITY_CHANGED:${mutableAuthorities.join(',')}`);
          const forbiddenRuntime = changed.filter((file) => (
            file === 'apps/api/prisma/schema.prisma'
            || file.startsWith('apps/api/prisma/migrations/')
            || file.startsWith('apps/web/')
            || file.startsWith('infra/')
          ));
          if (forbiddenRuntime.length) throw new Error(`EGRUL_FORBIDDEN_RUNTIME_PATH:${forbiddenRuntime.join(',')}`);
          console.log(`PASS: ${changed.length} EGRUL implementation files match the immutable trusted-base manifest.`);
          NODE
          ) > "$RUNNER_TEMP/trusted-egrul-scope.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/trusted-egrul-scope.log"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Emit EGRUL guard context on the PR head
        id: trusted_context
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_RC: ${{ steps.trusted_validation.outputs.rc }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          conclusion=failure
          title='FNS EGRUL immutable scope rejected'
          summary='The base-controlled EGRUL scope check failed closed.'
          if [[ "$VALIDATION_RC" == 0 ]]; then
            conclusion=success
            title='FNS EGRUL immutable scope accepted'
            summary='The exact PR head satisfies the EGRUL authority recorded in the trusted base.'
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='guard' \
            -f head_sha="$HEAD_SHA" \
            -f status='completed' \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary" >/dev/null
      - name: Enforce trusted EGRUL immutable-scope result
        if: always()
        env:
          VALIDATION_RC: ${{ steps.trusted_validation.outputs.rc }}
          CONTEXT_OUTCOME: ${{ steps.trusted_context.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "$VALIDATION_RC" == 0 ]]
          [[ "$CONTEXT_OUTCOME" == success ]]

  trusted-immutable-scope:
    name: PC-CROP implementation immutable scope · trusted base
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.head.ref == 'fix/p0-registration-authority-rollover-4637' ||
      github.event.pull_request.head.ref == 'fix/p0-owner-control-plane-audit-lock-4698' || github.event.pull_request.head.ref == 'governance/pc-crop-post-registration-progress-scope-4997' || github.event.pull_request.head.ref == 'governance/pc-crop-inventory-reservation-scope-4997' || github.event.pull_request.head.ref == 'docs/pc-crop-post-registration-progress-4997')
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Validate untrusted head with trusted base guard
        id: trusted_validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          IMMUTABLE_SCOPE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          (
            set -Eeuo pipefail
            if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo 'PC-CROP immutable-scope authority rejects same-name branches from forks.' >&2
              exit 1
            fi
            case "$IMMUTABLE_SCOPE_BRANCH" in
              fix/p0-registration-authority-rollover-4637|fix/p0-owner-control-plane-audit-lock-4698|governance/pc-crop-post-registration-progress-scope-4997|governance/pc-crop-inventory-reservation-scope-4997|docs/pc-crop-post-registration-progress-4997) ;;
              *) echo 'Trusted immutable-scope guard received an unauthorized branch.' >&2; exit 1 ;;
            esac
            if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Trusted immutable-scope guard received an invalid commit SHA.' >&2
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$BASE_SHA"
            git fetch --no-tags origin "$HEAD_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
            BASE_REF="$BASE_SHA" HEAD_REF="$HEAD_SHA" GITHUB_HEAD_REF="$IMMUTABLE_SCOPE_BRANCH" \
              bash scripts/p7-autopilot-guard.sh
          ) > "$RUNNER_TEMP/trusted-immutable-scope.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/trusted-immutable-scope.log"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Emit required guard context from trusted base on the PR head
        id: trusted_context
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_RC: ${{ steps.trusted_validation.outputs.rc }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          conclusion=failure
          title='PC-CROP immutable scope rejected'
          summary='The base-controlled immutable scope check failed closed.'
          if [[ "$VALIDATION_RC" == 0 ]]; then
            conclusion=success
            title='PC-CROP immutable scope accepted'
            summary='The exact PR head satisfies the immutable scope recorded in the trusted base.'
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='guard' \
            -f head_sha="$HEAD_SHA" \
            -f status='completed' \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary" >/dev/null
      - name: Enforce trusted immutable-scope result
        if: always()
        env:
          VALIDATION_RC: ${{ steps.trusted_validation.outputs.rc }}
          CONTEXT_OUTCOME: ${{ steps.trusted_context.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "$VALIDATION_RC" == 0 ]]
          [[ "$CONTEXT_OUTCOME" == success ]]

  guard:
    name: ${{ github.event_name == 'pull_request' && (github.head_ref == 'fix/p0-registration-authority-rollover-4637' || github.head_ref == 'fix/p0-owner-control-plane-audit-lock-4698' || github.head_ref == 'governance/pc-crop-post-registration-progress-scope-4997' || github.head_ref == 'governance/pc-crop-inventory-reservation-scope-4997' || github.head_ref == 'docs/pc-crop-post-registration-progress-4997' || github.head_ref == 'governance/role-eligibility-fns-egrul-file-import-5016' || github.head_ref == 'feat/role-eligibility-fns-egrul-file-import-5016') && 'PC-CROP immutable scope · PR-head defense' || 'guard' }}
    needs: standard_validation
    if: always() && github.event_name != 'pull_request_target'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require standard validations in the required guard context
        if: >-
          github.event_name != 'pull_request' ||
          (github.head_ref != 'fix/p0-registration-authority-rollover-4637' &&
          github.head_ref != 'fix/p0-owner-control-plane-audit-lock-4698' && github.head_ref != 'docs/pc-crop-post-registration-progress-4997')
        env:
          STANDARD_VALIDATION_RESULT: ${{ needs.standard_validation.result }}
        run: |
          if [ "$STANDARD_VALIDATION_RESULT" != 'success' ]; then
            echo "Standard platform-v7 guard validations did not pass: $STANDARD_VALIDATION_RESULT" >&2
            exit 1
          fi
      - name: Validate immutable scope with trusted base guard on PR head
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'fix/p0-registration-authority-rollover-4637' ||
          github.head_ref == 'fix/p0-owner-control-plane-audit-lock-4698' || github.head_ref == 'governance/pc-crop-post-registration-progress-scope-4997' || github.head_ref == 'governance/pc-crop-inventory-reservation-scope-4997' || github.head_ref == 'docs/pc-crop-post-registration-progress-4997')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IMMUTABLE_SCOPE_BRANCH: ${{ github.head_ref }}
        run: |
          case "$IMMUTABLE_SCOPE_BRANCH" in
            fix/p0-registration-authority-rollover-4637|fix/p0-owner-control-plane-audit-lock-4698|governance/pc-crop-post-registration-progress-scope-4997|governance/pc-crop-inventory-reservation-scope-4997|docs/pc-crop-post-registration-progress-4997) ;;
            *) echo 'PR-head immutable-scope guard received an unauthorized branch.' >&2; exit 1 ;;
          esac
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'PR-head immutable-scope guard received an invalid commit SHA.' >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          TRUSTED_GUARD=$(mktemp)
          git show "$BASE_SHA:scripts/p7-autopilot-guard.sh" > "$TRUSTED_GUARD"
          chmod 0700 "$TRUSTED_GUARD"
          BASE_REF="$BASE_SHA" HEAD_REF="$HEAD_SHA" GITHUB_HEAD_REF="$IMMUTABLE_SCOPE_BRANCH" \
            bash "$TRUSTED_GUARD"
      - name: Validate post-registration DoD register
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/pc-crop-post-registration-progress-4997'
        run: node docs/platform-v7/crop-platform/post-registration/verify-w0.mjs
      - name: Validate standard branch scope on PR head
        if: >-
          github.event_name != 'pull_request' ||
          (github.head_ref != 'fix/p0-registration-authority-rollover-4637' &&
          github.head_ref != 'fix/p0-owner-control-plane-audit-lock-4698' && github.head_ref != 'governance/pc-crop-post-registration-progress-scope-4997' && github.head_ref != 'governance/pc-crop-inventory-reservation-scope-4997' && github.head_ref != 'docs/pc-crop-post-registration-progress-4997')
        run: bash scripts/p7-autopilot-guard.sh

  standard_validation:
    name: Standard platform-v7 guard validations
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
      (github.head_ref != 'fix/p0-registration-authority-rollover-4637' &&
      github.head_ref != 'fix/p0-owner-control-plane-audit-lock-4698' && github.head_ref != 'docs/pc-crop-post-registration-progress-4997'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate PC-CROP immutable-scope guard regression
        run: node --test scripts/p7-autopilot-guard.test.mjs
      - name: Validate production-like Kubernetes timeout contract
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'governance/production-like-kubernetes-timeout-3750' ||
          github.head_ref == 'fix/production-like-kubernetes-timeout-3750')
        run: |
          if [ "$GITHUB_HEAD_REF" = 'governance/production-like-kubernetes-timeout-3750' ]; then
            node scripts/check-production-like-kubernetes-timeout.mjs --self-test
          else
            node scripts/check-production-like-kubernetes-timeout.mjs
          fi
      - name: Validate production P0 staff decision idempotency contract
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'governance/production-p0-staff-decision-idempotency-3750' ||
          github.head_ref == 'fix/production-p0-staff-decision-idempotency-3750')
        run: |
          if [ "$GITHUB_HEAD_REF" = 'governance/production-p0-staff-decision-idempotency-3750' ]; then
            node scripts/check-production-p0-staff-decision-idempotency.mjs --self-test
          else
            node scripts/check-production-p0-staff-decision-idempotency.mjs
          fi
      - name: Validate production P0 staff decision session contract
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'governance/production-p0-staff-decision-session-3750-v2' ||
          github.head_ref == 'fix/production-p0-staff-decision-session-3750')
        run: |
          if [ "$GITHUB_HEAD_REF" = 'governance/production-p0-staff-decision-session-3750-v2' ]; then
            node scripts/check-production-p0-staff-decision-session.mjs --self-test
          else
            node scripts/check-production-p0-staff-decision-session.mjs
          fi
      - name: Validate production P0 registration decision replay notification contract
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'governance/production-p0-registration-decision-replay-notification-3750' ||
          github.head_ref == 'fix/production-p0-registration-decision-replay-notification-3750')
        run: |
          if [ "$GITHUB_HEAD_REF" = 'governance/production-p0-registration-decision-replay-notification-3750' ]; then
            node scripts/check-production-p0-registration-decision-replay-notification.mjs --self-test
          else
            node scripts/check-production-p0-registration-decision-replay-notification.mjs
          fi
      - name: Generate Platform V7 route inventory
        run: node scripts/platform-v7-route-inventory.mjs --output=platform-v7-route-inventory.json
      - name: Upload Platform V7 route inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v7-route-inventory-${{ github.sha }}
          path: platform-v7-route-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate role grain alias migration scope
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/role-grain-alias-canonicalization'
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const expected = new Set([
