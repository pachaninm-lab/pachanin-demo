              throw new Error(`EGRUL_SCOPE_ALLOWED_PATH_${index}_UNSAFE`);
            }
            return normalized;
          });
          if (new Set(allowed).size !== allowed.length) throw new Error('EGRUL_SCOPE_ALLOWED_PATH_DUPLICATE');
          const expectedSorted = [...expectedAllowed].sort();
          const actualSorted = [...allowed].sort();
          if (JSON.stringify(actualSorted) !== JSON.stringify(expectedSorted)) throw new Error('EGRUL_SCOPE_ALLOWLIST_DRIFT');

          const expectedForbidden = [
            'apps/api/prisma/migrations/**',
            'apps/api/prisma/schema.prisma',
            'apps/web/**',
            'infra/**',
