              name: jobName(generic, branch), conclusion: 'skipped' });
            return { check, statuses, run, peers, branch };
          }
          function valid(e) {
            const binding = nativeScopeGuardBinding(e.check, e.statuses, repo, pr, head);
            return Boolean(binding && nativeScopeGuardMatchesRun(binding, e.check, e.run, e.peers, repo, pr, head, e.branch));
          }
          for (const branch of [...branches, 'governance/pc-crop-post-registration-progress-scope-4997']) {
            test(`IR-20 provenance uses exactly one actual native producer: ${branch}`, () => {
              const active = [bootstrap, generic].filter(source => jobRuns(source, branch));
