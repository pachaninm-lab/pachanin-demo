  trusted-kind-minio-governance-bootstrap:
    name: Kind MinIO governance bootstrap · trusted base
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.ref == 'governance/kind-minio-image-source-20260912'
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate MinIO governance bootstrap from trusted base
        id: trusted_validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set +e
          (
            set -Eeuo pipefail
            if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo 'Kind MinIO governance bootstrap rejects same-name branches from forks.' >&2
