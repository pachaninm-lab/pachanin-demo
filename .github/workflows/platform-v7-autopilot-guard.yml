            test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
            node <<'NODE'
          const { isDeepStrictEqual } = require('node:util');
          const { execFileSync } = require('node:child_process');

          const baseSha = String(process.env.BASE_SHA || '').trim();
          const headSha = String(process.env.HEAD_SHA || '').trim();
          const statePath = 'docs/platform-v7/autopilot/autopilot-state.json';
          const expectedBaseStateBlob = '1cdd0fbaa8b21533790d46d5ad941be5311bcf76';
          const governanceBranch = 'governance/kind-minio-image-source-20260912';
          const implementationBranch = 'fix/kind-minio-image-source-20260912';
          const governancePaths = [
            '.github/workflows/platform-v7-autopilot-guard.yml',
            'docs/platform-v7/autopilot/autopilot-state.json',
            'docs/platform-v7/autopilot/prompts/current-codex-task.md',
            'docs/platform-v7/autopilot/prompts/current-review-task.md',
            'docs/platform-v7/execution-queue.md',
            'scripts/p7-autopilot-guard.sh',
            'scripts/p7-autopilot-guard.test.mjs',
          ];
          const implementationPaths = [
            'infra/kind/production-like/dependencies.yaml',
            'infra/kind/production-like/minio-tls-check.yaml',
            'scripts/release/production-like-kubernetes-cluster.sh',
          ];
          const ensureSafeUniqueExactPaths = (label, actual, expected) => {
            if (!Array.isArray(actual)) throw new Error(`${label}_NOT_ARRAY`);
            const normalized = actual.map((value, index) => {
              if (typeof value !== 'string' || value !== value.trim()) {
                throw new Error(`${label}_${index}_INVALID`);
              }
              if (!value || value.includes('\\') || value.includes('*') || value === '..' || value.startsWith('../') || value.includes('/../') || value.startsWith('/')) {
                throw new Error(`${label}_${index}_UNSAFE`);
              }
              return value;
            });
            if (new Set(normalized).size !== normalized.length) throw new Error(`${label}_DUPLICATE`);
            if (!isDeepStrictEqual(normalized, expected)) throw new Error(`${label}_IDENTITY_MISMATCH`);
          };

          const baseStateBlob = execFileSync('git', ['rev-parse', `${baseSha}:${statePath}`], { encoding: 'utf8' }).trim();
          if (baseStateBlob !== expectedBaseStateBlob) throw new Error('KIND_MINIO_BOOTSTRAP_BASE_STATE_MISMATCH');

          const diff = execFileSync(
            'git', ['diff', '--no-renames', '--name-status', `${baseSha}...${headSha}`], { encoding: 'utf8' },
          ).trim().split(/\r?\n/u).filter(Boolean).map((line) => {
            const [status, file, extra] = line.split('\t');
            if (extra || !file || status !== 'M') throw new Error(`KIND_MINIO_BOOTSTRAP_DIFF_STATUS:${line}`);
            return file;
          });
          if (new Set(diff).size !== diff.length || !isDeepStrictEqual([...diff].sort(), [...governancePaths].sort())) {
            throw new Error(`KIND_MINIO_BOOTSTRAP_SCOPE_VIOLATION:${diff.join(',')}`);
          }

          const baseState = JSON.parse(execFileSync('git', ['show', `${baseSha}:${statePath}`], { encoding: 'utf8' }));
          const headState = JSON.parse(execFileSync('git', ['show', `${headSha}:${statePath}`], { encoding: 'utf8' }));
          if (!baseState.approvedConcurrentScopes || typeof baseState.approvedConcurrentScopes !== 'object') {
            throw new Error('KIND_MINIO_BOOTSTRAP_BASE_SCOPES_INVALID');
          }
          if (Object.hasOwn(baseState.approvedConcurrentScopes, governanceBranch) || Object.hasOwn(baseState.approvedConcurrentScopes, implementationBranch)) {
            throw new Error('KIND_MINIO_BOOTSTRAP_IDENTITY_ALREADY_EXISTS');
          }
          const expectedHeadState = structuredClone(baseState);
          expectedHeadState.approvedConcurrentScopes[governanceBranch] = governancePaths;
          expectedHeadState.approvedConcurrentScopes[implementationBranch] = implementationPaths;
          if (!isDeepStrictEqual(headState, expectedHeadState)) throw new Error('KIND_MINIO_BOOTSTRAP_STATE_MUTATION');
          ensureSafeUniqueExactPaths('KIND_MINIO_GOVERNANCE_PATHS', headState.approvedConcurrentScopes[governanceBranch], governancePaths);
          ensureSafeUniqueExactPaths('KIND_MINIO_IMPLEMENTATION_PATHS', headState.approvedConcurrentScopes[implementationBranch], implementationPaths);
          console.log(`PASS: exact head ${headSha} is the bounded seven-file Kind MinIO governance bootstrap.`);
          NODE
          ) > "$RUNNER_TEMP/trusted-kind-minio-bootstrap.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/trusted-kind-minio-bootstrap.log"
