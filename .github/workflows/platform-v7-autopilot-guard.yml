            fi
            test "$(git rev-parse HEAD)" = "$BASE_SHA"
            git fetch --no-tags origin "$HEAD_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
            node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const baseSha = String(process.env.BASE_SHA || '').trim();
          const headSha = String(process.env.HEAD_SHA || '').trim();
          const branch = String(process.env.EGRUL_SCOPE_BRANCH || '').trim();
          const governanceBranch = 'governance/role-eligibility-fns-egrul-file-import-5016';
          const implementationBranch = 'feat/role-eligibility-fns-egrul-file-import-5016';
          const manifestPath = 'docs/platform-v7/autopilot/scopes/role-eligibility-fns-egrul-file-import-5016.json';
          const changed = execFileSync(
            'git', ['diff', '--no-renames', '--name-only', `${baseSha}...${headSha}`], { encoding: 'utf8' },
          ).trim().split(/\r?\n/u).map((value) => value.trim()).filter(Boolean);

          if (branch === governanceBranch) {
            if (changed.length !== 1 || changed[0] !== manifestPath) {
              throw new Error(`EGRUL_GOVERNANCE_SCOPE_VIOLATION:${changed.join(',')}`);
            }
            console.log(`PASS: ${governanceBranch} is limited to the one prior-authority manifest.`);
            process.exit(0);
          }
          if (branch !== implementationBranch) throw new Error('EGRUL_SCOPE_BRANCH_UNAUTHORIZED');

          let manifest;
          try {
            manifest = JSON.parse(execFileSync('git', ['show', `${baseSha}:${manifestPath}`], { encoding: 'utf8' }));
          } catch {
            throw new Error('EGRUL_TRUSTED_BASE_MANIFEST_MISSING');
          }
          if (manifest.schemaVersion !== 'platform-v7.concurrent-scope.v1') throw new Error('EGRUL_SCOPE_SCHEMA_INVALID');
          if (manifest.status !== 'active') throw new Error('EGRUL_SCOPE_NOT_ACTIVE');
          if (manifest.branch !== implementationBranch) throw new Error('EGRUL_SCOPE_BRANCH_MISMATCH');

          const expectedAllowed = [
            'apps/api/src/fns-egrul-import.ts',
            'apps/api/src/modules/role-eligibility/fns-egrul-file-import.service.ts',
            'apps/api/src/modules/role-eligibility/fns-egrul-file-import.service.spec.ts',
            'apps/api/src/modules/role-eligibility/role-eligibility-fns-egrul-import.module.ts',
            'apps/api/src/modules/role-eligibility/role-eligibility-registry-sync.service.ts',
            'apps/api/src/modules/role-eligibility/role-eligibility-registry-sync.spec.ts',
            'docs/security/CRYPTOGRAPHIC_INVENTORY.md',
            'docs/security/cryptographic-inventory.json',
          ];
          if (!Array.isArray(manifest.allowedPaths)) throw new Error('EGRUL_SCOPE_ALLOWED_PATHS_INVALID');
