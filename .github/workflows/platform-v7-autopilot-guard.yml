              assert.equal(calls.length, count);
              const final = spawnSync('bash', ['-c', enforce], { env: { ...process.env, VALIDATION_RC: '0', CONTEXT_OUTCOME: 'failure' } });
              assert.notEqual(final.status, 0);
            });
          }
          const mutations = {
            'missing binding': e => { delete e.check.external_id; },
            'wrong PR': e => { e.check.external_id = e.check.external_id.replace(`:pr:${pr}:`, ':pr:1:'); },
            'wrong head': e => { e.check.external_id = e.check.external_id.replace(`:head:${head}:`, `:head:${base}:`); },
            'wrong base': e => { e.check.external_id = e.check.external_id.replace(`:base:${base}:`, `:base:${head}:`); },
            'wrong attempt': e => { e.run.run_attempt = 1; },
            'wrong event': e => { e.run.event = 'pull_request'; },
            'wrong workflow': e => { e.run.path = '.github/workflows/other.yml'; },
            'foreign repository': e => { e.run.head_repository.full_name = 'fork/project'; },
            'wrong status producer': e => { e.statuses[0].creator.id = 1; },
            'missing status': e => { e.statuses = []; },
            'missing producer': e => { e.peers = []; },
            'unrun producer': e => { e.peers[0].conclusion = 'skipped'; },
