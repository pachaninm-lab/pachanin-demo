      - name: Validate PC-CROP immutable-scope guard regression
        run: node --test scripts/p7-autopilot-guard.test.mjs
      - name: Validate IR-20 trusted bootstrap rejection regressions
        run: |
          node --input-type=module <<'IR20_BOOTSTRAP_TESTS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import test from 'node:test';
          const sourceWorkflow = path.resolve('.github/workflows/platform-v7-autopilot-guard.yml');
          function write(root, file, content) {
            const target = path.join(root, file);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, content);
          }
          function git(root, args) {
            const result = spawnSync('git', args, { cwd: root, encoding: 'utf8', timeout: 10000 });
            assert.equal(result.status, 0, `${result.stdout}\n${result.stderr}`);
            return result.stdout.trim();
          }
          function commit(root, message) {
            git(root, ['add', '--all']);
            git(root, ['commit', '-m', message]);
