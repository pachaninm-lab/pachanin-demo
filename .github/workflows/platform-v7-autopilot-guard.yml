            for (const file of ['scripts/p7-autopilot-guard.sh', 'scripts/p7-source-controlled-scope.mjs',
              '.github/workflows/platform-v7-autopilot-guard.yml']) write(root, file, '# accepted inert fixture\n');
            git(root, ['init', '--initial-branch=main']);
            git(root, ['config', 'user.name', 'IR20 Bootstrap Regression']);
            git(root, ['config', 'user.email', 'ir20-bootstrap@example.invalid']);
            commit(root, 'initial fixture');
            git(root, ['switch', '-c', implementationBranch]);
            return { root, implementationBranch };
          }

          // IR-20 admission and enforcement are two independently reviewed transitions.
          const ir20AdmissionBranch = 'governance/ir20-api-database-binding-admission-20260919';
          const ir20PrerequisiteBranch = 'governance/ir20-binding-immutable-scope-20260919';
          const ir20ImplementationBranch = 'ops/ir20-api-database-binding-20260919';
          const ir20StatePath = 'docs/platform-v7/autopilot/autopilot-state.json';
          const ir20GovernancePaths = ['scripts/p7-autopilot-guard.sh', 'scripts/p7-autopilot-guard.test.mjs',
            '.github/workflows/platform-v7-autopilot-guard.yml', ir20StatePath];
          const ir20ImplementationPaths = ['scripts/release/ir20-api-database-binding.py',
            'scripts/release/test-ir20-api-database-binding.py', 'scripts/release/test-ir20-api-database-binding-integration.py',
            '.github/workflows/ir20-api-database-binding.yml', 'docs/ops/ir20-api-database-binding.md'];

          function ir20BootstrapFixture(t, branch = ir20PrerequisiteBranch) {
            const context = fixture(t, branch);
            const accepted = { allowedCurrentScope: ['apps/api/src/common/outbox/**'], current: 'IR-20', next: 'IR-21',
              approvedConcurrentScopes: { 'unrelated/accepted': ['unrelated.txt'] } };
            if (branch === ir20PrerequisiteBranch) accepted.approvedConcurrentScopes[branch] = ir20GovernancePaths;
            write(context.root, ir20StatePath, `${JSON.stringify(accepted, null, 2)}\n`);
            write(context.root, 'scripts/p7-autopilot-guard.test.mjs', '// accepted fixture test\n');
            commit(context.root, 'accepted bootstrap authority');
            context.baseline = git(context.root, ['rev-parse', 'HEAD']);
            const candidate = structuredClone(accepted);
            if (branch === ir20AdmissionBranch) {
              candidate.approvedConcurrentScopes[ir20PrerequisiteBranch] = ir20GovernancePaths;
            } else {
              candidate.approvedConcurrentScopes[ir20ImplementationBranch] = ir20ImplementationPaths;
              for (const file of ir20GovernancePaths.filter((file) => file !== ir20StatePath)) {
                write(context.root, file, fs.readFileSync(path.join(context.root, file), 'utf8') + '\n# inert candidate fixture\n');
              }
            }
            write(context.root, ir20StatePath, `${JSON.stringify(candidate, null, 2)}\n`);
            return context;
          }

          function runIr20Bootstrap(context, overrides = {}) {
            const workflow = fs.readFileSync(sourceWorkflow, 'utf8');
            const start = "            node - <<'IR20_SCOPE_JS'\n";
            const finish = '\n          IR20_SCOPE_JS';
            assert.equal(workflow.split(start).length, 2);
            const body = workflow.split(start)[1].split(finish)[0].split('\n').map((line) => {
              assert.ok(line.startsWith('          '));
              return line.slice(10);
            }).join('\n');
            return spawnSync(process.execPath, ['-'], {
              cwd: context.root, input: body, encoding: 'utf8', timeout: 20000,
              env: { ...process.env, BASE_SHA: context.baseline, HEAD_SHA: git(context.root, ['rev-parse', 'HEAD']),
                IR20_SCOPE_BRANCH: context.implementationBranch, GITHUB_REPOSITORY: 'fixture/project',
                HEAD_REPOSITORY: 'fixture/project', ...overrides },
            });
          }

          for (const branch of [ir20AdmissionBranch, ir20PrerequisiteBranch]) {
            test(`IR-20 trusted bootstrap accepts the exact bounded transition: ${branch}`, (t) => {
              const context = ir20BootstrapFixture(t, branch);
              commit(context.root, 'bounded candidate');
              const result = runIr20Bootstrap(context);
              assert.equal(result.status, 0, result.stdout + result.stderr);
              assert.match(result.stdout, /candidate code was not executed/);
            });
            for (const mutation of ['self-scope', 'global-scope', 'neighbor-scope', 'score', 'own-manifest', 'broad-current', 'delete', 'symlink']) {
              test(`IR-20 trusted bootstrap rejects ${mutation}: ${branch}`, (t) => {
                const context = ir20BootstrapFixture(t, branch);
                const file = path.join(context.root, ir20StatePath);
                const state = JSON.parse(fs.readFileSync(file, 'utf8'));
                if (mutation === 'self-scope') state.approvedConcurrentScopes[ir20PrerequisiteBranch] = [...ir20GovernancePaths, 'unrelated.txt'];
                if (mutation === 'global-scope') state.allowedCurrentScope.push('scripts/release/**');
                if (mutation === 'neighbor-scope') state.approvedConcurrentScopes['unrelated/accepted'].push('extra.txt');
                if (mutation === 'score') state.current = 'IR-21';
                fs.writeFileSync(file, `${JSON.stringify(state, null, 2)}\n`);
                if (mutation === 'own-manifest') write(context.root, 'docs/platform-v7/autopilot/scopes/ir20-self.json',
                  JSON.stringify({ schemaVersion: 'platform-v7.concurrent-scope.v1', branch, status: 'active', allowedPaths: ['unrelated.txt'] }));
                if (mutation === 'broad-current') write(context.root, 'apps/api/src/common/outbox/unrelated.txt', 'inert\n');
                if (mutation === 'delete') fs.unlinkSync(file);
                if (mutation === 'symlink') { fs.unlinkSync(file); fs.symlinkSync('nonexistent-inert-target', file); }
                commit(context.root, 'hostile candidate');
                const result = runIr20Bootstrap(context);
                assert.notEqual(result.status, 0, result.stdout + result.stderr);
              });
            }
          }

          test('IR-20 trusted bootstrap rejects missing accepted prerequisite and implementation authority files', (t) => {
            const missing = ir20BootstrapFixture(t);
            const accepted = JSON.parse(git(missing.root, ['show', `${missing.baseline}:${ir20StatePath}`]));
            delete accepted.approvedConcurrentScopes[ir20PrerequisiteBranch];
            write(missing.root, ir20StatePath, JSON.stringify(accepted));
            commit(missing.root, 'base without prerequisite admission');
            missing.baseline = git(missing.root, ['rev-parse', 'HEAD']);
            accepted.approvedConcurrentScopes[ir20PrerequisiteBranch] = ir20GovernancePaths;
            accepted.approvedConcurrentScopes[ir20ImplementationBranch] = ir20ImplementationPaths;
            write(missing.root, ir20StatePath, JSON.stringify(accepted));
            commit(missing.root, 'self admission cannot substitute for base');
            assert.notEqual(runIr20Bootstrap(missing).status, 0);
            const authority = ir20BootstrapFixture(t);
            const value = JSON.parse(fs.readFileSync(path.join(authority.root, ir20StatePath), 'utf8'));
            value.approvedConcurrentScopes[ir20ImplementationBranch].push('docs/platform-v7/autopilot/scopes/ir20-api-database-binding-20260919.json');
            write(authority.root, ir20StatePath, JSON.stringify(value));
            commit(authority.root, 'forbidden sixth authority path');
            assert.notEqual(runIr20Bootstrap(authority).status, 0);
          });

          test('IR-20 trusted bootstrap rejects forks, invalid refs, unknown branches and non-descendant heads', (t) => {
            const context = ir20BootstrapFixture(t);
            commit(context.root, 'bounded candidate');
            for (const overrides of [{ HEAD_REPOSITORY: 'fork/project' }, { BASE_SHA: 'main' }, { HEAD_SHA: 'HEAD' },
              { IR20_SCOPE_BRANCH: ir20ImplementationBranch }, { BASE_SHA: git(context.root, ['rev-parse', 'HEAD']), HEAD_SHA: context.baseline }]) {
              assert.notEqual(runIr20Bootstrap(context, overrides).status, 0, JSON.stringify(overrides));
            }
          });

          test('IR-20 trusted bootstrap never executes a candidate guard or resolver', (t) => {
            const context = ir20BootstrapFixture(t);
            write(context.root, 'scripts/p7-autopilot-guard.sh', '#!/usr/bin/env bash\ntouch CANDIDATE_EXECUTED\nexit 0\n');
            const value = JSON.parse(fs.readFileSync(path.join(context.root, ir20StatePath), 'utf8'));
            value.approvedConcurrentScopes[ir20PrerequisiteBranch].push('scripts/release/unrelated.txt');
            write(context.root, ir20StatePath, JSON.stringify(value));
            write(context.root, 'scripts/release/unrelated.txt', 'inert\n');
            commit(context.root, 'hostile candidate with a replacement guard');
            assert.notEqual(runIr20Bootstrap(context).status, 0);
            assert.equal(fs.existsSync(path.join(context.root, 'CANDIDATE_EXECUTED')), false);
          });

          test('IR-20 trusted bootstrap workflow binds validation and required context to the same exact head', () => {
            const workflow = fs.readFileSync(sourceWorkflow, 'utf8');
            const job = workflow.split('  trusted-ir20-binding-bootstrap:\n')[1].split(/\n  [a-z][a-z0-9_-]*:\n/u)[0];
            assert.match(job, /github\.event_name == 'pull_request_target'/);
            for (const branch of [ir20AdmissionBranch, ir20PrerequisiteBranch]) {
              assert.ok(job.includes(`github.event.pull_request.head.ref == '${branch}'`));
              const prHeadName = workflow.split('  guard:\n')[1].split('\n    needs:')[0];
              assert.ok(prHeadName.includes(`github.head_ref == '${branch}'`));
            }
            assert.match(job, /ref: \$\{\{ github\.event\.pull_request\.base\.sha \}\}/);
            assert.match(job, /persist-credentials: false/);
            assert.match(job, /contents: read\n      checks:\x20write/);
            assert.match(job, /conclusion=failure/);
