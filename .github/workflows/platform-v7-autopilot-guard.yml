            node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const baseSha = String(process.env.BASE_SHA || '').trim();
          const headSha = String(process.env.HEAD_SHA || '').trim();
          const branch = String(process.env.EGRUL_SCOPE_BRANCH || '').trim();
          const governanceBranch = 'governance/role-eligibility-fns-egrul-file-import-5016';
          const implementationBranch = 'feat/role-eligibility-fns-egrul-file-import-5016';
          const manifestPath = 'docs/platform-v7/autopilot/scopes/role-eligibility-fns-egrul-file-import-5016.json';
          const changed = execFileSync(
            'git', ['diff', '--no-renames', '--name-only', `${baseSha}...${headSha}`], { encoding: 'utf8' },
          ).trim().split(/\r?\n/u).map((value) => value.trim()).filter(Boolean);

          if (branch === governanceBranch) {
            if (changed.length !== 1 || changed[0] !== manifestPath) {
              throw new Error(`EGRUL_GOVERNANCE_SCOPE_VIOLATION:${changed.join(',')}`);
            }
            console.log(`PASS: ${governanceBranch} is limited to the one prior-authority manifest.`);
            process.exit(0);
          }
          if (branch !== implementationBranch) throw new Error('EGRUL_SCOPE_BRANCH_UNAUTHORIZED');

          let manifest;
          try {
            manifest = JSON.parse(execFileSync('git', ['show', `${baseSha}:${manifestPath}`], { encoding: 'utf8' }));
          } catch {
            throw new Error('EGRUL_TRUSTED_BASE_MANIFEST_MISSING');
          }
