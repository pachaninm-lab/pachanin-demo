name: TAI AP-14F1D Shared Retrieval Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f1d.yml'
      - 'apps/tai/tai/postgres_retrieval_index.py'
      - 'apps/tai/tai/public_corpus_shared_retrieval.py'
      - 'apps/tai/tai/retrieval_index.py'
      - 'apps/tai/tai/retrieval_service.py'
      - 'apps/tai/tests/test_public_corpus_shared_retrieval.py'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1d-3374.json'
      - 'scripts/tai-ap-14f1d/verify.py'
  push:
    branches:
      - main
      - agent/tai-ap-14f1d-shared-retrieval-3374
    paths:
      - '.github/workflows/tai-ap-14f1d.yml'
      - 'apps/tai/tai/postgres_retrieval_index.py'
      - 'apps/tai/tai/public_corpus_shared_retrieval.py'
      - 'apps/tai/tai/retrieval_index.py'
      - 'apps/tai/tai/retrieval_service.py'
      - 'apps/tai/tests/test_public_corpus_shared_retrieval.py'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1d-3374.json'
      - 'scripts/tai-ap-14f1d/verify.py'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: tai-ap-14f1d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: artifacts/tai-ap-14f1d
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tai_ap14f1d
  OBSERVED_AT: '2026-07-29T09:00:00Z'

jobs:
  governed-shared-retrieval:
    name: PostgreSQL sync · RU/EN/ZH citations · withdrawal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/pachaninm-lab/ci-postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tai_ap14f1d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tai_ap14f1d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - name: Resolve governed comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            base_ref="HEAD^"
          else
            base_ref="aa0583eef4a3d70a0810992a2d115811a6a97d0d"
          fi
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/tai/pyproject.toml

      - name: Verify source-controlled scope
        if: github.ref_name != 'main'
        shell: bash
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: |
          set -euo pipefail
          export GITHUB_HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          bash scripts/p7-autopilot-guard.sh

      - name: Install TAI test toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e 'apps/tai[dev]'

      - name: Static and adversarial acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ruff check \
            apps/tai/tai/retrieval_index.py \
            apps/tai/tai/postgres_retrieval_index.py \
            apps/tai/tai/retrieval_service.py \
            apps/tai/tai/public_corpus_shared_retrieval.py \
            apps/tai/tests/test_public_corpus_shared_retrieval.py \
            scripts/tai-ap-14f1d/verify.py \
            | tee "$EVIDENCE_DIR/ruff.txt"
          mypy \
            apps/tai/tai/retrieval_index.py \
            apps/tai/tai/postgres_retrieval_index.py \
            apps/tai/tai/retrieval_service.py \
            apps/tai/tai/public_corpus_shared_retrieval.py \
            | tee "$EVIDENCE_DIR/mypy.txt"
          pytest \
            apps/tai/tests/test_public_corpus_shared_retrieval.py \
            apps/tai/tests/test_retrieval_service.py \
            apps/tai/tests/test_rag_pipeline.py \
            | tee "$EVIDENCE_DIR/pytest.txt"

      - name: PostgreSQL 16 retrieval activation and withdrawal acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tai-ap-14f1d/verify.py \
            --database-url "$TEST_DATABASE_URL" \
            --observed-at "$OBSERVED_AT" \
            --evidence-output "$EVIDENCE_DIR/postgresql-shared-retrieval-evidence.json" \
            | tee "$EVIDENCE_DIR/postgresql.log"

      - name: Enforce exact-head evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('artifacts/tai-ap-14f1d/postgresql-shared-retrieval-evidence.json')
          evidence = json.loads(path.read_text(encoding='utf-8'))
          if evidence['exactHead'] != os.environ['EXACT_HEAD']:
              raise SystemExit('exact-head evidence mismatch')
          if evidence['localizedStatuses'] != {
              'en': 'SUPPORTED',
              'ru': 'SUPPORTED',
              'zh': 'SUPPORTED',
          }:
              raise SystemExit('localized retrieval acceptance mismatch')
          if evidence['irrelevantQueryStatus'] != 'ABSTAINED':
              raise SystemExit('irrelevant query did not abstain')
          if evidence['withdrawnQueryStatus'] != 'ABSTAINED':
              raise SystemExit('withdrawn query did not abstain')
          if evidence['activeTargetCountAfterWithdrawal'] != 0:
              raise SystemExit('withdrawn source remains active')
          if evidence['generationStatuses'] != ['RETIRED', 'RETIRED', 'ACTIVE']:
              raise SystemExit('generation retirement contract mismatch')
          for flag in (
              'baselinePreserved',
              'replayIdempotent',
              'withdrawalReplayIdempotent',
          ):
              if evidence[flag] is not True:
                  raise SystemExit(f'{flag} is not proven')
          if evidence['modelInvoked'] is not False or evidence['tenantId'] is not None:
              raise SystemExit('model or tenant boundary mismatch')
          if evidence['operationalStatus'] != 'NOT_ATTESTED':
              raise SystemExit('operational status overclaim')
          print('TAI AP-14F1D exact-head evidence = success')
          PY

      - name: Upload immutable acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-ap-14f1d-shared-retrieval-evidence-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

  exact-main-status:
    name: Observable exact-main status
    if: github.ref_name == 'main'
    needs: governed-shared-retrieval
    runs-on: ubuntu-24.04
    steps:
      - name: Publish exact-main acceptance status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXACT_HEAD,
              state: 'success',
              context: 'TAI AP-14F1D exact-main',
              description: 'Shared Rosstat retrieval activation and withdrawal accepted',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
