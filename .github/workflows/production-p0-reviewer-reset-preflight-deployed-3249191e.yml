name: Production P0 Reviewer Reset Preflight Deployed 3249191e

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-preflight-deployed-3249191e.yml'
      - 'scripts/production-p0-reviewer-reset-preflight-deployed-50990d.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-reset-preflight-deployed-3249191e-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  BASELINE_SHA: 50990d616463c3aa7a4888fc182bc6064931b080
  DEPLOYED_SHA: 3249191e922a03258fe9edfec38c7df170157393

jobs:
  contract:
    name: Validate deployed-3249191e read-only reset preflight contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-reviewer-reset-preflight deployed-3249191e'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove deployed revision is safe descendant of reset baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git cat-file -e "${DEPLOYED_SHA}^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "$DEPLOYED_SHA"
          # Reset-critical backend/migrations must be byte-identical to the already-reviewed baseline.
          git diff --quiet "$BASELINE_SHA..$DEPLOYED_SHA" -- apps/api/src apps/api/prisma infra/docker

      - name: Build ephemeral deployed-3249191e preflight and enforce read-only boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          source='scripts/production-p0-reviewer-reset-preflight-deployed-50990d.sh'
          target='/tmp/production-p0-reviewer-reset-preflight-deployed-3249191e.sh'
          bash -n "$source"
          python3 - "$source" "$target" "$BASELINE_SHA" "$DEPLOYED_SHA" <<'PY'
          from pathlib import Path
          import sys
          source, target, baseline, deployed = sys.argv[1:]
          text = Path(source).read_text(encoding='utf-8')
          required = [
              f"EXPECTED_DEPLOYED_SHA='{baseline}'",
              "IMAP_RUN_ID='31923014818'",
              "SMTP_RUN_ID='31923847459'",
              'IMAP_AUTH_RESULT=PASS',
              'SMTP587_AUTH_RESULT=PASS',
              'auth.staff_reviewer_login_readiness()',
              'auth.staff_reviewer_password_reset_subject()',
              'StrictHostKeyChecking=yes',
              'RESET_AUTHORIZED=YES',
              'PRODUCTION_MUTATION=NONE',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('missing source invariant: ' + ' | '.join(missing))
          forbidden = [
              '/api/auth/forgot-password', '--request POST', '-X POST', '--data', '--data-binary',
              'send_message(', 'sendmail(', 'MAIL FROM', 'RCPT TO',
              'INSERT INTO', 'UPDATE auth.', 'DELETE FROM', 'TRUNCATE ', 'ALTER ROLE',
              'docker restart', 'docker compose', 'docker service', 'PC_RECONCILE_ACTIVE_RUNTIME',
          ]
          bad = [x for x in forbidden if x in text]
          if bad:
              raise SystemExit('production mutation surface forbidden: ' + ' | '.join(bad))
          if text.count(baseline) < 2:
              raise SystemExit('baseline pin cardinality too small')
          text = text.replace(baseline, deployed)
          text = text.replace('deployed-50990d', 'deployed-3249191e')
          text = text.replace('deployed 50990d', 'deployed 3249191e')
          if baseline in text:
              raise SystemExit('stale baseline pin remains')
          Path(target).write_text(text, encoding='utf-8')
          PY
          chmod 0700 "$target"
          bash -n "$target"
          grep -Fq "EXPECTED_DEPLOYED_SHA='$DEPLOYED_SHA'" "$target"
          grep -Fq 'PRODUCTION_MUTATION=NONE' "$target"
          if grep -Eq '/api/auth/forgot-password|--request POST|-X POST|--data|--data-binary|docker restart|docker compose|docker service' "$target"; then
            echo 'mutation surface detected' >&2
            exit 1
          fi

      - name: Verify exact owner-issued provenance
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EXPECTED_BODY: /production p0-reviewer-reset-preflight deployed-3249191e
          TRUSTED_CONNECTOR_APP_ID: '1144995'
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$EXPECTED_BODY" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "${{ github.triggering_actor }}" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          git merge-base --is-ancestor "$DEPLOYED_SHA" "$target"
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  preflight:
    name: Verify deployed-3249191e reviewer reset authorization without mutation
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact current-main checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          git merge-base --is-ancestor "$DEPLOYED_SHA" "$TARGET_SHA"
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Build ephemeral exact deployed preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          source='scripts/production-p0-reviewer-reset-preflight-deployed-50990d.sh'
          target='/tmp/production-p0-reviewer-reset-preflight-deployed-3249191e.sh'
          python3 - "$source" "$target" "$BASELINE_SHA" "$DEPLOYED_SHA" <<'PY'
          from pathlib import Path
          import sys
          source, target, baseline, deployed = sys.argv[1:]
          text = Path(source).read_text(encoding='utf-8')
          text = text.replace(baseline, deployed)
          text = text.replace('deployed-50990d', 'deployed-3249191e')
          text = text.replace('deployed 50990d', 'deployed 3249191e')
          if baseline in text:
              raise SystemExit('stale baseline pin remains')
          Path(target).write_text(text, encoding='utf-8')
          PY
          chmod 0700 "$target"
          bash -n "$target"

      - name: Run exact deployed read-only reset preflight
        shell: bash
        run: /tmp/production-p0-reviewer-reset-preflight-deployed-3249191e.sh
