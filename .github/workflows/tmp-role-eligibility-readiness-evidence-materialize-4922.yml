name: Temporary Role Eligibility Readiness Blocker Evidence Materializer

on:
  push:
    branches:
      - tmp/role-eligibility-readiness-evidence-materialize-4922
    paths:
      - '.github/workflows/tmp-role-eligibility-readiness-evidence-materialize-4922.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply bounded readiness evidence patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp-role-eligibility-readiness-evidence-patch-4922.py
          bash -n scripts/production-role-eligibility-readiness.sh
          node scripts/check-role-eligibility-readiness-contract.mjs
      - name: Materialize only validated target files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          source_sha="$GITHUB_SHA"
          repo="$GITHUB_REPOSITORY"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          put_target() {
            local path="$1" message="$2" meta payload current_sha encoded
            meta="$(mktemp)"
            payload="$(mktemp)"
            gh api "repos/$repo/contents/$path?ref=$source_sha" > "$meta"
            current_sha="$(jq -r .sha < "$meta")"
            [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
            encoded="$(base64 -w0 < "$path")"
            jq -n \
              --arg message "$message" \
              --arg content "$encoded" \
              --arg sha "$current_sha" \
              --arg branch "$branch" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > "$payload"
            gh api --method PUT "repos/$repo/contents/$path" --input "$payload" >/dev/null
            rm -f "$meta" "$payload"
          }
          put_target '.github/workflows/role-eligibility-enforcement-readiness.yml' 'fix(role-eligibility): preserve fail-closed blocker evidence'
          put_target 'scripts/check-role-eligibility-readiness-contract.mjs' 'test(role-eligibility): require fail-closed blocker evidence'
          echo ROLE_ELIGIBILITY_READINESS_MATERIALIZED=PASS
