name: Temporary Role Eligibility Readiness Blocker Evidence Materializer

on:
  push:
    branches:
      - tmp/role-eligibility-readiness-evidence-materialize-4922
    paths:
      - '.github/workflows/tmp-role-eligibility-readiness-evidence-materialize-4922.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply bounded readiness evidence patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp-role-eligibility-readiness-evidence-patch-4922.py
          bash -n scripts/production-role-eligibility-readiness.sh
          node scripts/check-role-eligibility-readiness-contract.mjs
      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/role-eligibility-enforcement-readiness.yml scripts/check-role-eligibility-readiness-contract.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo ROLE_ELIGIBILITY_READINESS_MATERIALIZER_NO_DIFF >&2; exit 2; }
          git commit -m 'fix(role-eligibility): preserve fail-closed blocker evidence'
          git push origin HEAD:${{ github.ref_name }}
