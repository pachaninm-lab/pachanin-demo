name: Locate historical presentation binaries

on:
  push:
    branches:
      - verify/presentation-live-final-f69-20260829-r2
    paths:
      - .github/workflows/verify-live-presentation-final-f69-20260829.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find presentation PDF candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' >/dev/null 2>&1
          refs=(
            origin/fix/direct-presentation-download-20260829
            origin/fix/direct-static-presentation-20260829
            origin/fix/presentation-approved-source-exact-20260829
            origin/fix/presentation-download-live-hotfix-20260829
            origin/fix/presentation-download-lockfile-hotfix-20260829
            origin/fix/presentation-regenerate-approved-source-20260829
            origin/fix/presentation-runtime-static-imports-20260829
            origin/fix/presentation-static-pdf-current-20260829
            origin/governance/direct-presentation-binary-20260829
            origin/governance/direct-presentation-download-20260829
            origin/governance/public-presentation-embedded-pdf-20260828
            origin/governance/public-presentation-real-pdf-20260827
            origin/ops/regenerate-presentation-approved-source-20260829
            origin/verify/live-presentation-ff07563-20260829
            origin/verify/pdf-final-gate-db199aa-20260828
            origin/verify/presentation-source-payload-20260829
            origin/verify/presentation-transport-21parts-20260829
            origin/verify/presentation-transport-source-39b77b5-20260829
          )

          found=0
          for ref in "${refs[@]}"; do
            git rev-parse --verify "$ref" >/dev/null 2>&1 || continue
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              tmp="$(mktemp --suffix=.pdf)"
              if git show "$ref:$path" > "$tmp" 2>/dev/null && head -c5 "$tmp" | grep -q '^%PDF-'; then
                bytes="$(wc -c < "$tmp" | tr -d '[:space:]')"
                sha="$(sha256sum "$tmp" | awk '{print $1}')"
                pages="$(grep -aoE '/Type[[:space:]]*/Page([^sA-Za-z]|$)' "$tmp" | wc -l | tr -d '[:space:]')"
                echo "PDF_CANDIDATE ref=$ref path=$path bytes=$bytes pages=$pages sha256=$sha"
                found=$((found+1))
              fi
              rm -f "$tmp"
            done < <(git ls-tree -r --name-only "$ref" | grep -Ei '\.pdf$' | grep -Ei 'presentation|prezent|prozrachnaya|transparent|price|gekta' || true)
          done

          echo "TARGET_HASH_HISTORY"
          git log --all -S'1f99bd881404624ef8fe8bec9a10caf10a021f8cacff3ed5a6633101255178a5' --date=iso --format='HASH_COMMIT %H %ad %s' --name-status -- \
            apps/web ':!apps/web/lib/presentation-pdf/part-*' | head -120 || true

          echo "PDF_PATH_HISTORY"
          git log --all --date=iso --format='PDF_COMMIT %H %ad %s' --name-status -- '*.pdf' | grep -Ei '^(PDF_COMMIT|[AMD].*(presentation|prezent|prozrachnaya|transparent|price|gekta))' | head -160 || true

          echo "FOUND=$found"
