name: Diagnose live presentation 500

on:
  push:
    branches:
      - verify/presentation-live-final-f69-20260829-r2
    paths:
      - .github/workflows/verify-live-presentation-final-f69-20260829.yml

permissions:
  contents: read

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resolve protected SSH authority
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){ local source="$1" target="$HOME/.ssh/id_pc_prod" pub; tr -d '\r' < "$source" > "$target"; chmod 600 "$target"; grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1; pub="$(mktemp)"; ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"; }
          try_slot(){ local raw="$1" a b c; [[ -n "$raw" ]] || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}"
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 15 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          while IFS= read -r line; do fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"; done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"; rm -f "$scan"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Read-only production diagnosis
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes "$SSH_USER_SECRET@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          echo "WEB_CONTAINER_COUNT=${#web_ids[@]}"
          (( ${#web_ids[@]} == 1 ))
          web="${web_ids[0]}"
          echo "WEB_REVISION=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web")"
          echo "WEB_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$web")"
          echo "WEB_STATE=$(docker inspect --format '{{.State.Status}}' "$web")"
          echo "WEB_ENTRYPOINT=$(docker inspect --format '{{json .Config.Entrypoint}}' "$web")"
          echo "WEB_CMD=$(docker inspect --format '{{json .Config.Cmd}}' "$web")"
          ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$web")"
          echo "WEB_IP_PRESENT=$([[ -n "$ip" ]] && echo 1 || echo 0)"
          echo '--- direct container request ---'
          headers="$(mktemp)"; body="$(mktemp)"
          set +e
          status="$(curl -sS --connect-timeout 10 --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "http://${ip}:3000/downloads/prozrachnaya-tsena-presentation.pdf")"
          rc=$?
          set -e
          echo "INTERNAL_CURL_RC=$rc"
          echo "INTERNAL_HTTP=$status"
          echo "INTERNAL_BYTES=$(wc -c < "$body" | tr -d '[:space:]')"
          awk 'BEGIN{IGNORECASE=1} /^(content-type|content-disposition|content-length|etag):/ {gsub(/\r/,""); print "INTERNAL_HEADER_" toupper($1) substr($0,index($0,":")+1)}' "$headers" || true
          rm -f "$headers" "$body"
          echo '--- recent web logs ---'
          docker logs --since 15m --tail 800 "$web" 2>&1 | sed -E 's#postgres(ql)?://[^[:space:]@]+@#postgresql://[REDACTED]@#g' | tail -500 || true
          echo 'DIAGNOSTIC_COMPLETE=1'
          REMOTE
