          anchored_probe = anchored_repair_schema(schema_probe, probe_item, (7, 'sanitize(input)'))
          anchored_properties = anchored_probe['properties']['findings']['items']['properties']
          if anchored_properties['path'] != {'type': 'string', 'enum': ['probe.ts']}:
              fail('VALIDATOR_SELFTEST_REPAIR_SCHEMA_PATH_NOT_PINNED')
          if anchored_properties['line'] != {'type': 'integer', 'enum': [7]}:
              fail('VALIDATOR_SELFTEST_REPAIR_SCHEMA_LINE_NOT_PINNED')
