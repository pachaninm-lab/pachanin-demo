          bad_evidence_anchor = candidate_anchor(probe_item, speculative_bad_evidence_candidate)
          if bad_evidence_anchor is not None:
              fail('VALIDATOR_SELFTEST_REPAIR_BAD_EVIDENCE_SCHEMA_ANCHOR_ACCEPTED')
          bad_evidence_scoped = anchored_repair_schema(schema_probe, probe_item, bad_evidence_anchor)
          if bad_evidence_scoped != schema_probe:
