              fail('VALIDATOR_SELFTEST_REPAIR_BAD_EVIDENCE_ANCHOR_ACCEPTED')
          speculative_wrong_line_candidate = json.dumps({'findings': [speculative_wrong_line_probe]}, separators=(',', ':'))
          if candidate_anchor(probe_item, speculative_wrong_line_candidate) is not None:
              fail('VALIDATOR_SELFTEST_REPAIR_WRONG_LINE_ANCHOR_ACCEPTED')
          schema_probe = {
              'properties': {
