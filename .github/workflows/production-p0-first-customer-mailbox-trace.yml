name: Production P0 First-Customer Mailbox Trace

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-first-customer-mailbox-trace.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-p0-first-customer-mailbox-trace
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  SUBJECT_SHA: 55f78afe5f01f1aa2732a984b5cc0ccb1ccfcc71
  FAILED_RUN_ID: '31885882933-1'
  RUN_WINDOW_START: '2026-08-15T12:56:00Z'
  RUN_WINDOW_END: '2026-08-15T13:01:00Z'
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate read-only mailbox trace
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/production-p0-first-customer-mailbox-trace.yml').read_text(encoding='utf-8')
          required = [
              'SUBJECT_SHA: 55f78afe5f01f1aa2732a984b5cc0ccb1ccfcc71',
              "FAILED_RUN_ID: '31885882933-1'",
              'registration_email_delivery_result',
              'WEB_DELIVERY_EVENT_COUNT',
              'TARGET_RECIPIENT_COUNT',
              'TARGET_VERIFY_URL_COUNT',
              'TARGET_VALID_TOKEN_COUNT',
              'MAILBOX_READ_ONLY=PASS',
              'PRODUCTION_MUTATION=NONE',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('missing invariant: ' + ' | '.join(missing))
          diagnostic = text.split('\n  diagnostic:\n', 1)[1]
          forbidden = [
              'docker restart', 'docker rm', 'docker compose up', 'docker compose down',
              'ALTER ROLE', 'CREATE ROLE', 'DROP ROLE', 'GRANT ', 'REVOKE ',
              'INSERT INTO', 'UPDATE auth.', 'DELETE FROM', 'TRUNCATE ',
              'prisma migrate', 'prisma db execute', 'sendTransactionalMail(',
              'sendAuthMailSmtp(', 'claimBatch(', 'markSent(', 'markFailure(',
          ]
          bad = [item for item in forbidden if item in diagnostic]
          if bad:
              raise SystemExit('mutation surface forbidden: ' + ' | '.join(bad))
          PY

  diagnostic:
    name: Trace exact candidate-A Web SMTP acknowledgement and IMAP visibility
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-first-customer-mailbox-trace 31885882933' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PC_P0_EMAIL_TEMPLATE: ${{ secrets.PC_PROD_P0_MAILBOX_EMAIL_TEMPLATE || secrets.PC_PROD_P0_EMAIL_TEMPLATE }}
      PC_P0_IMAP_HOST: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_HOST || secrets.PC_PROD_P0_IMAP_HOST }}
      PC_P0_IMAP_PORT: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PORT || secrets.PC_PROD_P0_IMAP_PORT }}
      PC_P0_IMAP_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
      PC_P0_IMAP_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
      PC_P0_IMAP_FOLDER: ${{ secrets.PC_PROD_P0_IMAP_FOLDER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bind current main to failed production subject
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$(git rev-parse HEAD)" == "$main_sha" ]]
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SUBJECT_SHA}^{commit}"
          git merge-base --is-ancestor "$SUBJECT_SHA" "$main_sha"
          git diff --quiet "$SUBJECT_SHA..$main_sha" -- \
            apps/web/app/api/auth/register/route.ts \
            apps/web/lib/server/transactional-mail.ts \
            scripts/production-p0-first-customer-acceptance.sh
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned REG.RU identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || exit 10
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          validate_key() {
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_slot() {
            local raw="$1" plain escaped decoded
            [[ -n "$raw" ]] || return 1
            plain="$(mktemp)"; escaped="$(mktemp)"; decoded="$(mktemp)"
            printf '%s\n' "$raw" > "$plain"
            validate_key "$plain" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$escaped"
            validate_key "$escaped" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$decoded" 2>/dev/null \
              && validate_key "$decoded" \
              && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            rm -f "$plain" "$escaped" "$decoded"
            return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" \
            || try_slot "${SSH_KEY_SECONDARY:-}" \
            || try_slot "${SSH_KEY_FALLBACK:-}" \
            || exit 14
          scan="$(mktemp)"
          match="$(mktemp)"
          ready=0
          for attempt in 1 2 3; do
            : > "$scan"
            : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$ready" == 1 ]] || exit 15
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' \
            | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Trace exact Web registration delivery acknowledgement
        id: web
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            "bash -s -- '$SUBJECT_SHA' '$FAILED_RUN_ID' '$RUN_WINDOW_START' '$RUN_WINDOW_END'" \
            > "$raw" 2>/dev/null <<'REMOTE'
          set -Eeuo pipefail
          subject="$1"
          failed_run="$2"
          start="$3"
          end="$4"
          fail() {
            printf 'WEB_TRACE=FAIL\nWEB_TRACE_ERROR=%s\nPRODUCTION_MUTATION=NONE\n' "$1"
            exit 1
          }
          [[ "$(id -u)" -eq 0 ]] || fail ROOT_REQUIRED
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || fail WEB_CARDINALITY
          web_id="${web_ids[0]}"
          revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")"
          [[ "$revision" == "$subject" ]] || fail PRODUCTION_REVISION_DRIFT
          correlation="p0-registration:${subject:0:12}:$failed_run:a"
          read -r -d '' parser <<'PY' || true
          import json
          import re
          import sys

          correlation = sys.argv[1]
          counts = {
              'delivery': 0,
              'delivered': 0,
              'deferred': 0,
              'api_rejected': 0,
              'transport': 0,
              'contract': 0,
              'config': 0,
          }
          providers = set()
          reasons = set()
          patterns = {
              'delivery': re.compile(r'registration_email_delivery_result\s+(\{.*\})'),
              'deferred': re.compile(r'registration_email_delivery_deferred\s+(\{.*\})'),
              'api_rejected': re.compile(r'registration_api_rejected\s+(\{.*\})'),
              'transport': re.compile(r'registration_transport_failure\s+(\{.*\})'),
              'contract': re.compile(r'registration_delivery_contract_invalid\s+(\{.*\})'),
              'config': re.compile(r'registration_configuration_error\s+(\{.*\})'),
          }

          def safe(value):
              return re.sub(r'[^A-Za-z0-9_.:-]', '_', str(value or 'NONE'))[:80] or 'NONE'

          for line in sys.stdin:
              for kind, pattern in patterns.items():
                  match = pattern.search(line)
                  if not match:
                      continue
                  try:
                      payload = json.loads(match.group(1))
                  except Exception:
                      continue
                  if payload.get('correlationId') != correlation:
                      continue
                  counts[kind] += 1
                  if kind == 'delivery':
                      if payload.get('delivered') is True:
                          counts['delivered'] += 1
                      providers.add(safe(payload.get('provider')))
                      reasons.add(safe(payload.get('reason')))

          print(f"WEB_DELIVERY_EVENT_COUNT={counts['delivery']}")
          print(f"WEB_DELIVERED_TRUE_COUNT={counts['delivered']}")
          print(f"WEB_DEFERRED_COUNT={counts['deferred']}")
          print(f"WEB_API_REJECTED_COUNT={counts['api_rejected']}")
          print(f"WEB_TRANSPORT_FAILURE_COUNT={counts['transport']}")
          print(f"WEB_CONTRACT_INVALID_COUNT={counts['contract']}")
          print(f"WEB_CONFIG_ERROR_COUNT={counts['config']}")
          print('WEB_PROVIDER_CLASS=' + (':'.join(sorted(providers)) if providers else 'NONE'))
          print('WEB_REASON_CLASS=' + (':'.join(sorted(reasons)) if reasons else 'NONE'))
          PY
          docker logs --since "$start" --until "$end" "$web_id" 2>&1 | python3 -c "$parser" "$correlation"
          printf 'WEB_TRACE=PASS\nPRODUCTION_MUTATION=NONE\n'
          REMOTE
          sed -nE '/^(WEB_TRACE|WEB_TRACE_ERROR|WEB_DELIVERY_EVENT_COUNT|WEB_DELIVERED_TRUE_COUNT|WEB_DEFERRED_COUNT|WEB_API_REJECTED_COUNT|WEB_TRANSPORT_FAILURE_COUNT|WEB_CONTRACT_INVALID_COUNT|WEB_CONFIG_ERROR_COUNT|WEB_PROVIDER_CLASS|WEB_REASON_CLASS|PRODUCTION_MUTATION)=[A-Za-z0-9_.:-]{1,120}$/p' "$raw"
          while IFS='=' read -r key value; do
            case "$key" in
              WEB_TRACE|WEB_TRACE_ERROR|WEB_DELIVERY_EVENT_COUNT|WEB_DELIVERED_TRUE_COUNT|WEB_DEFERRED_COUNT|WEB_API_REJECTED_COUNT|WEB_TRANSPORT_FAILURE_COUNT|WEB_CONTRACT_INVALID_COUNT|WEB_CONFIG_ERROR_COUNT|WEB_PROVIDER_CLASS|WEB_REASON_CLASS|PRODUCTION_MUTATION)
                echo "${key,,}=$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < <(sed -nE '/^(WEB_TRACE|WEB_TRACE_ERROR|WEB_DELIVERY_EVENT_COUNT|WEB_DELIVERED_TRUE_COUNT|WEB_DEFERRED_COUNT|WEB_API_REJECTED_COUNT|WEB_TRANSPORT_FAILURE_COUNT|WEB_CONTRACT_INVALID_COUNT|WEB_CONFIG_ERROR_COUNT|WEB_PROVIDER_CLASS|WEB_REASON_CLASS|PRODUCTION_MUTATION)=[A-Za-z0-9_.:-]{1,120}$/p' "$raw")
          rm -f "$raw"

      - name: Trace exact candidate-A visibility in configured mailbox
        id: mailbox
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PC_P0_EMAIL_TEMPLATE" && -n "$PC_P0_IMAP_HOST" && -n "$PC_P0_IMAP_USER" && -n "$PC_P0_IMAP_PASSWORD" ]]
          python3 - <<'PY' > "$RUNNER_TEMP/mailbox-trace.out"
          import email
          import imaplib
          import os
          import re
          import ssl
          from datetime import datetime
          from email.policy import default
          from email.utils import getaddresses, parsedate_to_datetime
          from urllib.parse import parse_qs, unquote, urlparse

          subject_sha = os.environ['SUBJECT_SHA']
          failed_run = os.environ['FAILED_RUN_ID']
          run = f"{failed_run}-{subject_sha[:7]}"
          slot = 'a'
          identity = f'{run}-{slot}'
          template = os.environ['PC_P0_EMAIL_TEMPLATE'].strip()
          if template.count('{identity}') == 1 and '{run}' not in template and '{slot}' not in template:
              target = template.replace('{identity}', identity).lower()
          elif template.count('{identity}') == 0 and template.count('{run}') == 1 and template.count('{slot}') == 1:
              target = template.replace('{run}', run).replace('{slot}', slot).lower()
          else:
              raise SystemExit('MAILBOX_TEMPLATE_INVALID')

          def canonical(value):
              try:
                  value = str(value or '').strip().lower()
                  if value.count('@') != 1:
                      return None
                  local, domain = value.rsplit('@', 1)
                  local.encode('ascii')
                  domain = domain.encode('idna').decode('ascii').lower()
                  result = f'{local}@{domain}'
                  return result if len(result) <= 254 else None
              except Exception:
                  return None

          target = canonical(target)
          if not target:
              raise SystemExit('MAILBOX_TARGET_INVALID')
          start = int(datetime.fromisoformat(os.environ['RUN_WINDOW_START'].replace('Z', '+00:00')).timestamp())
          host = os.environ['PC_P0_IMAP_HOST'].strip()
          port = int((os.environ.get('PC_P0_IMAP_PORT') or '993').strip())
          username = os.environ['PC_P0_IMAP_USER']
          password = os.environ['PC_P0_IMAP_PASSWORD']
          folder = (os.environ.get('PC_P0_IMAP_FOLDER') or 'INBOX').strip() or 'INBOX'
          url_pattern = re.compile(r'https://[^\s<>"\']+/platform-v7/register\?[^\s<>"\']+', re.I)

          client = imaplib.IMAP4_SSL(host, port, ssl_context=ssl.create_default_context(), timeout=15)
          print('MAILBOX_CONNECT=PASS')
          status, _ = client.login(username, password)
          print('MAILBOX_LOGIN=' + ('PASS' if status == 'OK' else 'FAIL'))
          status, _ = client.select(folder, readonly=True)
          print('MAILBOX_SELECT=' + ('PASS' if status == 'OK' else 'FAIL'))
          if status != 'OK':
              raise SystemExit(2)
          status, data = client.search(None, 'ALL')
          print('MAILBOX_SEARCH=' + ('PASS' if status == 'OK' else 'FAIL'))
          if status != 'OK':
              raise SystemExit(3)

          identifiers = (data[0] or b'').split()
          scan = identifiers[-1000:]
          recipient_count = 0
          fresh_count = 0
          url_count = 0
          token_count = 0
          delays = []

          def body_text(message):
              parts = []
              iterator = message.walk() if message.is_multipart() else (message,)
              for part in iterator:
                  if part.get_content_type() not in ('text/plain', 'text/html'):
                      continue
                  try:
                      parts.append(part.get_content())
                  except Exception:
                      payload = part.get_payload(decode=True) or b''
                      parts.append(payload.decode(part.get_content_charset() or 'utf-8', errors='replace'))
              return '\n'.join(parts)

          for identifier in reversed(scan):
              status, rows = client.fetch(identifier, '(BODY.PEEK[])')
              if status != 'OK':
                  continue
              raw = next((item[1] for item in rows if isinstance(item, tuple) and len(item) > 1), None)
              if not raw:
                  continue
              message = email.message_from_bytes(raw, policy=default)
              recipients = []
              for header in ('to', 'cc', 'delivered-to', 'x-original-to', 'envelope-to'):
                  for _, address in getaddresses(message.get_all(header, [])):
                      mailbox = canonical(address)
                      if mailbox:
                          recipients.append(mailbox)
              if target not in recipients:
                  continue
              recipient_count += 1
              try:
                  sent_at = int(parsedate_to_datetime(message.get('date')).timestamp())
              except Exception:
                  sent_at = start
              if sent_at < start - 300:
                  continue
              fresh_count += 1
              delays.append(sent_at - start)
              body = body_text(message).replace('&amp;', '&')
              for candidate in url_pattern.findall(body):
                  url_count += 1
                  query = parse_qs(urlparse(candidate).query)
                  token = unquote((query.get('verify') or [''])[0])
                  if 48 <= len(token) <= 512 and re.fullmatch(r'[A-Za-z0-9._~-]+', token):
                      token_count += 1

          try:
              client.logout()
          except Exception:
              pass
          print(f'MAILBOX_TOTAL_COUNT={len(identifiers)}')
          print(f'MAILBOX_SCAN_COUNT={len(scan)}')
          print(f'TARGET_RECIPIENT_COUNT={recipient_count}')
          print(f'TARGET_FRESH_COUNT={fresh_count}')
          print(f'TARGET_VERIFY_URL_COUNT={url_count}')
          print(f'TARGET_VALID_TOKEN_COUNT={token_count}')
          print(f'TARGET_MIN_DATE_DELTA_SECONDS={min(delays) if delays else -1}')
          print('MAILBOX_READ_ONLY=PASS')
          PY
          cat "$RUNNER_TEMP/mailbox-trace.out"
          while IFS='=' read -r key value; do
            case "$key" in
              MAILBOX_CONNECT|MAILBOX_LOGIN|MAILBOX_SELECT|MAILBOX_SEARCH|MAILBOX_TOTAL_COUNT|MAILBOX_SCAN_COUNT|TARGET_RECIPIENT_COUNT|TARGET_FRESH_COUNT|TARGET_VERIFY_URL_COUNT|TARGET_VALID_TOKEN_COUNT|TARGET_MIN_DATE_DELTA_SECONDS|MAILBOX_READ_ONLY)
                echo "${key,,}=$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < "$RUNNER_TEMP/mailbox-trace.out"
          rm -f "$RUNNER_TEMP/mailbox-trace.out"

      - name: Publish sanitized trace evidence
        if: always()
        shell: bash
        env:
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
          WEB_TRACE: ${{ steps.web.outputs.web_trace }}
          WEB_EVENT: ${{ steps.web.outputs.web_delivery_event_count }}
          WEB_DELIVERED: ${{ steps.web.outputs.web_delivered_true_count }}
          WEB_DEFERRED: ${{ steps.web.outputs.web_deferred_count }}
          WEB_REJECTED: ${{ steps.web.outputs.web_api_rejected_count }}
          WEB_TRANSPORT: ${{ steps.web.outputs.web_transport_failure_count }}
          WEB_CONTRACT: ${{ steps.web.outputs.web_contract_invalid_count }}
          WEB_CONFIG: ${{ steps.web.outputs.web_config_error_count }}
          WEB_PROVIDER: ${{ steps.web.outputs.web_provider_class }}
          WEB_REASON: ${{ steps.web.outputs.web_reason_class }}
          MAIL_CONNECT: ${{ steps.mailbox.outputs.mailbox_connect }}
          MAIL_LOGIN: ${{ steps.mailbox.outputs.mailbox_login }}
          MAIL_SELECT: ${{ steps.mailbox.outputs.mailbox_select }}
          MAIL_SEARCH: ${{ steps.mailbox.outputs.mailbox_search }}
          MAIL_TOTAL: ${{ steps.mailbox.outputs.mailbox_total_count }}
          MAIL_SCAN: ${{ steps.mailbox.outputs.mailbox_scan_count }}
          TARGET_COUNT: ${{ steps.mailbox.outputs.target_recipient_count }}
          TARGET_FRESH: ${{ steps.mailbox.outputs.target_fresh_count }}
          URL_COUNT: ${{ steps.mailbox.outputs.target_verify_url_count }}
          TOKEN_COUNT: ${{ steps.mailbox.outputs.target_valid_token_count }}
          DATE_DELTA: ${{ steps.mailbox.outputs.target_min_date_delta_seconds }}
          MAIL_RO: ${{ steps.mailbox.outputs.mailbox_read_only }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP first-customer candidate-A mailbox trace · run 31885882933'
            echo
            echo "- diagnostic main: \`${MAIN_SHA:-unknown}\`"
            echo "- failed production subject: \`$SUBJECT_SHA\`"
            echo "- Web trace: \`${WEB_TRACE:-unknown}\`"
            echo "- exact Web delivery events / delivered=true: \`${WEB_EVENT:-unknown} / ${WEB_DELIVERED:-unknown}\`"
            echo "- exact Web deferred / API rejected / transport / contract / config: \`${WEB_DEFERRED:-unknown} / ${WEB_REJECTED:-unknown} / ${WEB_TRANSPORT:-unknown} / ${WEB_CONTRACT:-unknown} / ${WEB_CONFIG:-unknown}\`"
            echo "- Web provider / reason class: \`${WEB_PROVIDER:-unknown} / ${WEB_REASON:-unknown}\`"
            echo "- IMAP connect/login/select/search: \`${MAIL_CONNECT:-unknown} / ${MAIL_LOGIN:-unknown} / ${MAIL_SELECT:-unknown} / ${MAIL_SEARCH:-unknown}\`"
            echo "- mailbox total/scanned: \`${MAIL_TOTAL:-unknown} / ${MAIL_SCAN:-unknown}\`"
            echo "- exact candidate recipient / fresh / verify-URL / valid-token matches: \`${TARGET_COUNT:-unknown} / ${TARGET_FRESH:-unknown} / ${URL_COUNT:-unknown} / ${TOKEN_COUNT:-unknown}\`"
            echo "- earliest matching message Date delta from failed-run window start: \`${DATE_DELTA:-unknown} seconds\`"
            echo "- mailbox mode: \`${MAIL_RO:-unknown}\`"
            echo '- production mutation: `NONE`'
            echo '- candidate address, mailbox identity, message contents, links/tokens, credentials, raw logs and provider responses are not published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Enforce read-only trace completion
        shell: bash
        env:
          WEB_TRACE: ${{ steps.web.outputs.web_trace }}
          WEB_MUTATION: ${{ steps.web.outputs.production_mutation }}
          MAIL_RO: ${{ steps.mailbox.outputs.mailbox_read_only }}
        run: |
          set -euo pipefail
          [[ "$WEB_TRACE" == PASS ]]
          [[ "$WEB_MUTATION" == NONE ]]
          [[ "$MAIL_RO" == PASS ]]
