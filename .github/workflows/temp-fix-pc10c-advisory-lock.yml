name: Temporary fix PC-CROP-10C advisory lock

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-fix-pc10c-advisory-lock.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
          persist-credentials: true
      - name: Execute advisory lock without deserializing void
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts')
          source = path.read_text()
          old = "await tx.$queryRaw(Prisma.sql`SELECT pg_advisory_xact_lock(hashtextextended(${AUDIT_CHAIN_LOCK}, 0))`);"
          new = "await tx.$executeRaw(Prisma.sql`SELECT pg_advisory_xact_lock(hashtextextended(${AUDIT_CHAIN_LOCK}, 0))`);"
          if source.count(old) != 1:
              raise SystemExit(f'advisory lock anchor count: {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts
          git commit -m 'PC-CROP-10C: execute advisory lock without void decoding'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
