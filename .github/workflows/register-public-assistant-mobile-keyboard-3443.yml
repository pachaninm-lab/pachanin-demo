name: Register public assistant mobile keyboard scope

on:
  push:
    branches:
      - governance/register-public-assistant-mobile-keyboard-3443

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: governance/register-public-assistant-mobile-keyboard-3443

      - name: Register exact concurrent scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('docs/platform-v7/autopilot/autopilot-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          scopes = state.setdefault('approvedConcurrentScopes', {})
          scopes['fix/public-assistant-mobile-keyboard-light-ui'] = [
              'apps/web/components/platform-v7/ContextualSupportOrAssistant.tsx',
              'apps/web/styles/platform-v7-public-assistant-mobile-hotfix.css',
              'apps/web/tests/unit/platformV7PublicAssistantMobileKeyboard.test.ts',
              'apps/web/next.config.js',
              'docs/platform-v7/autopilot/scopes/fix-public-assistant-mobile-keyboard-light-ui.json',
          ]
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )
          PY
          rm -f .github/workflows/register-public-assistant-mobile-keyboard-3443.yml

      - name: Commit source-controlled registration and remove launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/platform-v7/autopilot/autopilot-state.json .github/workflows/register-public-assistant-mobile-keyboard-3443.yml
          git diff --cached --check
          git commit -m 'GOVERNANCE: register public assistant mobile keyboard scope'
          git push origin HEAD:governance/register-public-assistant-mobile-keyboard-3443
