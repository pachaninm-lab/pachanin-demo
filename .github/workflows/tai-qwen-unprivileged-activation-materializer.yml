name: QWEN Recovery Dispatch Gate Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/tai-qwen-unprivileged-activation-materializer.yml'

permissions:
  contents: write

concurrency:
  group: qwen-recovery-dispatch-gate-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == github.repository_owner &&
      github.head_ref == 'ops/qwen-recovery-unprivileged-activation-3372'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact owner-authorized scope
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch='ops/qwen-recovery-unprivileged-activation-3372'
          scope='docs/platform-v7/autopilot/scopes/qwen-recovery-unprivileged-activation-3372.json'
          git fetch --no-tags origin main "$branch"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node - "$scope" <<'NODE'
          const fs = require('node:fs');
          const scope = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (scope.branch !== 'ops/qwen-recovery-unprivileged-activation-3372') process.exit(2);
          if (scope.status !== 'active' || scope.issue !== 3372) process.exit(3);
          if (scope.ownerAuthorizedExceptionId !== 'PRODUCTION_AI_RECOVERY_3372') process.exit(4);
          if (!scope.allowedPaths.includes('.github/workflows/tai-qwen-unprivileged-activation-materializer.yml')) process.exit(5);
          if (!scope.allowedPaths.includes('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml')) process.exit(6);
          NODE
          node scripts/verify-pc-crop-project-lock.mjs --self-test
          PC_CROP_BRANCH="$branch" \
          PC_CROP_TITLE='QWEN-RECOVERY: permit governed chain dispatch and reject root model SSH' \
          PC_CROP_ISSUE=3372 \
          PC_CROP_SCOPE_PATH="$scope" \
            node scripts/verify-pc-crop-project-lock.mjs

      - name: Materialize exact activation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml')
          text = path.read_text(encoding='utf-8')

          old_permissions = (
              "permissions:\n"
              "  contents: read\n"
              "  packages: read\n"
              "  issues: write\n"
          )
          new_permissions = (
              "permissions:\n"
              "  contents: read\n"
              "  packages: read\n"
              "  actions: write\n"
              "  issues: write\n"
          )
          if text.count(old_permissions) != 1:
              raise SystemExit('ACTIVATION_MATERIALIZER_FAIL=PERMISSIONS_ANCHOR_MISMATCH')
          text = text.replace(old_permissions, new_permissions, 1)

          old_gate = (
              "        (\n"
              "          github.event_name == 'workflow_dispatch' &&\n"
              "          github.actor == github.repository_owner &&\n"
              "          github.triggering_actor == github.repository_owner &&\n"
              "          inputs.confirmation == 'ACTIVATE-RESTRICTED-QWEN-REG-RU'\n"
              "        )\n"
          )
          new_gate = (
              "        (\n"
              "          github.event_name == 'workflow_dispatch' &&\n"
              "          inputs.confirmation == 'ACTIVATE-RESTRICTED-QWEN-REG-RU' &&\n"
              "          (\n"
              "            (\n"
              "              github.actor == github.repository_owner &&\n"
              "              github.triggering_actor == github.repository_owner\n"
              "            ) ||\n"
              "            (\n"
              "              github.actor == 'github-actions[bot]' &&\n"
              "              github.triggering_actor == 'github-actions[bot]'\n"
              "            ) ||\n"
              "            (\n"
              "              github.actor == 'github-actions[bot]' &&\n"
              "              github.triggering_actor == github.repository_owner\n"
              "            )\n"
              "          )\n"
              "        )\n"
          )
          if text.count(old_gate) != 1:
              raise SystemExit('ACTIVATION_MATERIALIZER_FAIL=GATE_ANCHOR_MISMATCH')
          text = text.replace(old_gate, new_gate, 1)

          old_images = (
              '          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null\n'
              '          for component in api web migration; do\n'
              '            image="ghcr.io/pachaninm-lab/grainflow-${component}:sha-${SHORT_SHA}"\n'
              '            ready=0\n'
              '            for attempt in $(seq 1 90); do\n'
              '              if docker pull "$image" >/dev/null 2>&1; then\n'
              '                revision="$(docker image inspect --format \'{{ index .Config.Labels "org.opencontainers.image.revision" }}\' "$image" 2>/dev/null || true)"\n'
              '                if [[ "$revision" == "$TARGET_SHA" ]]; then ready=1; break; fi\n'
              '              fi\n'
              '              sleep 10\n'
              '            done\n'
              '            (( ready == 1 )) || { echo "Exact ${component} image unavailable." >&2; exit 2; }\n'
              '            echo "${component}_image=$image" >> "$GITHUB_OUTPUT"\n'
              '          done\n'
          )
          new_images = (
              '          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null\n'
              '          exact_image_ready() {\n'
              '            local component="$1" image revision\n'
              '            image="ghcr.io/pachaninm-lab/grainflow-${component}:sha-${SHORT_SHA}"\n'
              '            docker pull "$image" >/dev/null 2>&1 || return 1\n'
              '            revision="$(docker image inspect --format \'{{ index .Config.Labels "org.opencontainers.image.revision" }}\' "$image" 2>/dev/null || true)"\n'
              '            [[ "$revision" == "$TARGET_SHA" ]]\n'
              '          }\n'
              '\n'
              '          missing=0\n'
              '          for component in api web migration; do\n'
              '            exact_image_ready "$component" || missing=1\n'
              '          done\n'
              '          if (( missing == 1 )); then\n'
              '            git fetch --no-tags origin main\n'
              '            test "$TARGET_SHA" = "$(git rev-parse origin/main)"\n'
              '            gh api --method POST \\\n'
              '              "repos/$GITHUB_REPOSITORY/actions/workflows/docker-publish.yml/dispatches" \\\n'
              '              -f ref=main \\\n'
              "              -f 'inputs[services]=all' >/dev/null\n"
              '          fi\n'
              '\n'
              '          for component in api web migration; do\n'
              '            image="ghcr.io/pachaninm-lab/grainflow-${component}:sha-${SHORT_SHA}"\n'
              '            ready=0\n'
              '            for attempt in $(seq 1 90); do\n'
              '              git fetch --no-tags origin main >/dev/null 2>&1\n'
              '              test "$TARGET_SHA" = "$(git rev-parse origin/main)"\n'
              '              if exact_image_ready "$component"; then ready=1; break; fi\n'
              '              sleep 10\n'
              '            done\n'
              '            (( ready == 1 )) || { echo "Exact ${component} image unavailable." >&2; exit 2; }\n'
              '            echo "${component}_image=$image" >> "$GITHUB_OUTPUT"\n'
              '          done\n'
          )
          if text.count(old_images) != 1:
              raise SystemExit('ACTIVATION_MATERIALIZER_FAIL=IMAGE_ANCHOR_MISMATCH')
          text = text.replace(old_images, new_images, 1)

          old_user = '          model_user="$(trim "${MODEL_USER_SECRET:-root}")"\n'
          new_user = '          model_user="$(trim "${MODEL_USER_SECRET:-}")"\n'
          if text.count(old_user) != 1:
              raise SystemExit('ACTIVATION_MATERIALIZER_FAIL=MODEL_USER_ANCHOR_MISMATCH')
          text = text.replace(old_user, new_user, 1)

          old_validation = '          [[ -n "$model_host" && "$model_user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]\n'
          new_validation = old_validation + '          [[ "$model_user" != root ]]\n'
          if text.count(old_validation) != 1:
              raise SystemExit('ACTIVATION_MATERIALIZER_FAIL=MODEL_USER_VALIDATION_MISMATCH')
          text = text.replace(old_validation, new_validation, 1)

          old_remote = (
              "          remote='set -euo pipefail\n"
              "          systemctl is-active --quiet tai-qwen3-8b.service\n"
          )
          new_remote = (
              "          remote='set -euo pipefail\n"
              '          test "$(id -u)" -ne 0\n'
              "          systemctl is-active --quiet tai-qwen3-8b.service\n"
          )
          if text.count(old_remote) != 1:
              raise SystemExit('ACTIVATION_MATERIALIZER_FAIL=REMOTE_ANCHOR_MISMATCH')
          text = text.replace(old_remote, new_remote, 1)

          path.write_text(text, encoding='utf-8')
          PY

          ruby -e "require 'yaml'; YAML.load_file(ARGV.fetch(0))" .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq 'actions: write' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq "github.actor == 'github-actions[bot]'" .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq "github.triggering_actor == 'github-actions[bot]'" .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq 'actions/workflows/docker-publish.yml/dispatches' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq 'test "$TARGET_SHA" = "$(git rev-parse origin/main)"' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq 'model_user="$(trim "${MODEL_USER_SECRET:-}")"' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq '[[ "$model_user" != root ]]' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq 'test "$(id -u)" -ne 0' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          git diff --check -- .github/workflows/tai-restricted-qwen-reg-ru-activation.yml

      - name: Rebuild branch as one clean activation commit
        env:
          BRANCH: ops/qwen-recovery-unprivileged-activation-3372
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tai-qwen-unprivileged-activation-materializer.yml
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git reset --soft "$BASE_SHA"
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/tai-restricted-qwen-reg-ru-activation.yml'
          git diff --cached --check
          git config user.name 'pachaninm-lab'
          git config user.email '263435807+pachaninm-lab@users.noreply.github.com'
          git commit -m 'QWEN-RECOVERY: self-publish exact images and permit governed activation'
          git push --force-with-lease="refs/heads/$BRANCH:$SOURCE_HEAD_SHA" origin "HEAD:refs/heads/$BRANCH"
