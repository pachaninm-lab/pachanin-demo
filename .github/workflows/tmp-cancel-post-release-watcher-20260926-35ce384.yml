name: Temporary cancel completed-goal watcher

on:
  push:
    branches:
      - ops/tmp-cancel-duplicate-release-20260926-35ce384

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only redundant post-release watcher
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '36260088651'
          EXPECTED_MAIN: '35ce3841f15572bfcba7c8d7e03afb858da0888d'
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" == "$EXPECTED_MAIN" ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID")"
          [[ "$(jq -r '.head_sha' <<<"$run")" == "$EXPECTED_MAIN" ]]
          status="$(jq -r '.status' <<<"$run")"
          case "$status" in
            queued|pending|waiting|requested|in_progress)
              gh api --method POST                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/cancel"
              echo "redundant watcher cancellation requested"
              ;;
            completed)
              echo "redundant watcher already terminal"
              ;;
            *)
              echo "unexpected watcher status: $status" >&2
              exit 32
              ;;
          esac
