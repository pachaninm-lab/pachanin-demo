name: Temporary auth-mail YAML fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-auth-mail-yaml-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/industrial-auth-mail-outbox-3785
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix one YAML indentation defect and create blob
        id: fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=.github/workflows/production-full-stack-exact-sha.yml
          bad='scp "${scp_common[@]}" scripts/provision-production-auth-mail-runtime.sh "$SSH_USER_SECRET@$HOST:/tmp/pc-auth-mail-provision-${GITHUB_RUN_ID}.sh"'
          [[ "$(grep -Fxc "$bad" "$target")" == 1 ]]
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/production-full-stack-exact-sha.yml')
          s = p.read_text(encoding='utf-8')
          old = 'scp "${scp_common[@]}" scripts/provision-production-auth-mail-runtime.sh "$SSH_USER_SECRET@$HOST:/tmp/pc-auth-mail-provision-${GITHUB_RUN_ID}.sh"\n'
          new = '          ' + old
          if s.count(old) != 1:
              raise SystemExit(f'expected one unindented scp, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m pip install --disable-pip-version-check 'pyyaml>=6,<7' >/dev/null
          python3 scripts/check-workflow-syntax.py
          node scripts/check-production-full-stack-release.mjs
          git diff --check

          payload="$(jq -n --arg content "$(base64 -w0 "$target")" '{content:$content,encoding:"base64"}')"
          sha="$(curl --fail-with-body -sS \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            -d "$payload" | jq -r '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "BLOB_RELEASE_WORKFLOW=$sha"
          echo "blob=$sha" >> "$GITHUB_OUTPUT"
          echo 'YAML_FIX=PASS'

      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BLOB_RELEASE_WORKFLOW=${{ steps.fix.outputs.blob }}"
            echo "RESULT=${{ steps.fix.outcome }}"
          } > /tmp/auth-mail-yaml-fix.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-mail-yaml-fix-evidence
          path: /tmp/auth-mail-yaml-fix.txt
          if-no-files-found: error
          retention-days: 1
