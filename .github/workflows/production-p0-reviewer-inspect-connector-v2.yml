name: Production P0 Reviewer Inspect Connector v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-inspect-connector-v2.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-inspect-connector-v2
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate bounded read-only contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-p0-reviewer-inspect.sh
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/production-p0-reviewer-inspect-connector-v2.yml').read_text(encoding='utf-8')
          script = Path('scripts/production-p0-reviewer-inspect.sh').read_text(encoding='utf-8')
          required = [
              "github.event.comment.user.login == github.repository_owner",
              "github.event.comment.author_association == 'OWNER'",
              'github.event.comment.performed_via_github_app.id == 1144995',
              "github.event.comment.body == '/production p0-reviewer-inspect-v2 current-main'",
              'auth.staff_reviewer_login_readiness()',
              'PRODUCTION_MUTATION=NONE',
              'StrictHostKeyChecking=yes',
          ]
          merged = workflow + '\n' + script
          missing = [item for item in required if item not in merged]
          if missing:
              raise SystemExit('missing invariants: ' + ' | '.join(missing))
          forbidden = [
              'ALTER ROLE', 'CREATE ROLE', 'DROP ROLE', 'INSERT INTO',
              'UPDATE auth.', 'DELETE FROM', 'TRUNCATE ',
              'docker restart', 'docker rm ', 'docker compose up', 'docker compose down',
          ]
          bad = [item for item in forbidden if item in script]
          if bad:
              raise SystemExit('mutation surface forbidden: ' + ' | '.join(bad))
          PY

  inspect:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (
        (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
        github.event.comment.performed_via_github_app.id == 1144995
      ) &&
      github.event.comment.body == '/production p0-reviewer-inspect-v2 current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact owner-issued connector provenance
        shell: bash
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == OWNER ]]
          [[ "$body" == '/production p0-reviewer-inspect-v2 current-main' ]]
          if [[ "$GITHUB_ACTOR" != "$owner" ]]; then
            [[ "$app" == 1144995 ]]
          fi
      - name: Inspect exact-main reviewer readiness without mutation
        shell: bash
        run: bash scripts/production-p0-reviewer-inspect.sh
