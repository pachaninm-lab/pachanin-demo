name: PC-CROP Inventory Reservation Authority

on:
  pull_request:
    paths:
      - 'packages/domain-core/src/inventory*'
      - 'packages/domain-core/src/index.ts'
      - 'apps/api/src/modules/inventory/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/prisma/migrations/20260905040000_inventory_reservation_authority/**'
      - 'apps/api/test/industrial/inventory-reservation-authority.e2e-spec.ts'
      - 'scripts/platform-v7-one-deal-e2e.sh'
      - 'scripts/verify-pc-crop-inventory-scope.test.mjs'
      - '.github/workflows/pc-crop-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain-core/src/inventory*'
      - 'apps/api/src/modules/inventory/**'
      - 'apps/api/prisma/migrations/20260905040000_inventory_reservation_authority/**'
      - 'apps/api/test/industrial/inventory-reservation-authority.e2e-spec.ts'
      - '.github/workflows/pc-crop-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-crop-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/grainflow
  EVIDENCE_DIR: artifacts/pc-crop-inventory

jobs:
  inventory-authority:
    name: Exact quantities, restricted PostgreSQL reservations and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/pachaninm-lab/ci-postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: grainflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d grainflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
      - name: Bind evidence and verify base scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXACT_HEAD" > "$EVIDENCE_DIR/exact-head.txt"
          if [[ "${GITHUB_HEAD_REF:-}" == feat/pc-crop-inventory-reservation-authority-4997 ]]; then
            PC_CROP_BASE_REF="$BASE_SHA" node --test scripts/verify-pc-crop-inventory-scope.test.mjs 2>&1 | tee "$EVIDENCE_DIR/scope.log"
          else
            node --test scripts/verify-pc-crop-inventory-scope.test.mjs 2>&1 | tee "$EVIDENCE_DIR/scope.log"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.2.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply complete migration chain and prove zero public-schema drift
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @pc/api exec prisma migrate deploy 2>&1 | tee "$EVIDENCE_DIR/migrate-deploy.log"
          pnpm --filter @pc/api exec prisma migrate status 2>&1 | tee "$EVIDENCE_DIR/migrate-status.log"
          pnpm --filter @pc/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code 2>&1 | tee "$EVIDENCE_DIR/schema-drift.log"
          pnpm --filter @pc/api exec prisma generate 2>&1 | tee "$EVIDENCE_DIR/prisma-generate.log"
      - name: Typecheck and run exact quantity and API contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @pc/api typecheck 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"
          pnpm exec vitest run packages/domain-core/src/inventory.test.ts 2>&1 | tee "$EVIDENCE_DIR/domain.log"
          pnpm --filter @pc/api exec jest --runInBand --runTestsByPath src/modules/inventory/inventory.contract.spec.ts 2>&1 | tee "$EVIDENCE_DIR/contracts.log"
      - name: Create a restricted disposable acceptance principal
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE inventory_acceptance_app LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'ephemeral_inventory_acceptance_only';
          GRANT USAGE ON SCHEMA inventory TO inventory_acceptance_app;
          GRANT SELECT ON ALL TABLES IN SCHEMA inventory TO inventory_acceptance_app;
          GRANT EXECUTE ON FUNCTION inventory.execute_command(jsonb), inventory.position_view(inventory.positions) TO inventory_acceptance_app;
          SQL
      - name: Exercise restricted raw commands at READ COMMITTED
        env:
          NODE_ENV: test
          ONE_DEAL_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/grainflow
          ONE_DEAL_APP_URL: postgresql://inventory_acceptance_app:ephemeral_inventory_acceptance_only@127.0.0.1:5432/grainflow
          DB_PRINCIPAL_BOUNDARY_ENFORCED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @pc/api exec jest --runInBand --config test/industrial/jest.config.json --runTestsByPath test/industrial/inventory-reservation-authority.e2e-spec.ts 2>&1 | tee "$EVIDENCE_DIR/postgresql.log"
      - name: Restore inventory and immutable evidence into a second database
        shell: bash
        run: |
          set -euo pipefail
          pg_dump "$DATABASE_URL" --format=custom --file "$RUNNER_TEMP/inventory-acceptance.dump"
          psql "$DATABASE_URL" -X --set ON_ERROR_STOP=1 -c 'CREATE DATABASE inventory_restore'
          restore_url=postgresql://postgres:postgres@127.0.0.1:5432/inventory_restore
          pg_restore --exit-on-error --dbname "$restore_url" "$RUNNER_TEMP/inventory-acceptance.dump" 2>&1 | tee "$EVIDENCE_DIR/restore.log"
          psql "$restore_url" -X --set ON_ERROR_STOP=1 <<'SQL' 2>&1 | tee "$EVIDENCE_DIR/restored-authority.log"
          DO $proof$
          BEGIN
            IF (SELECT count(*) FROM inventory.command_events) < 10 THEN RAISE EXCEPTION 'inventory acceptance corpus missing'; END IF;
            IF EXISTS (SELECT 1 FROM inventory.positions WHERE declared_quantity::numeric <> available_quantity::numeric+reserved_quantity+committed_quantity+blocked_quantity+disputed_quantity+depleted_quantity) THEN
              RAISE EXCEPTION 'restored inventory conservation failed';
            END IF;
            IF EXISTS (SELECT 1 FROM inventory.availability_snapshots WHERE content_hash <> encode(digest(convert_to(snapshot::text,'UTF8'),'sha256'),'hex')) THEN
              RAISE EXCEPTION 'restored snapshot hash mismatch';
            END IF;
            IF EXISTS (SELECT 1 FROM inventory.command_events e JOIN inventory.availability_snapshots s ON s.id=e.snapshot_id
              JOIN public.outbox_entries o ON o.id=e.outbox_id JOIN public.audit_events a ON a.id=e.audit_id
              WHERE e.receipt->'position' IS DISTINCT FROM s.snapshot OR o.payload->'receipt' IS DISTINCT FROM e.receipt
                OR a."afterState" IS DISTINCT FROM s.snapshot OR s.source_state_version <> e.state_version) THEN
              RAISE EXCEPTION 'restored command evidence mismatch';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid='inventory.execute_command(jsonb)'::regprocedure
              AND proowner='pc_inventory_authority'::regrole AND prosecdef) THEN
              RAISE EXCEPTION 'restored function owner mismatch';
            END IF;
          END
          $proof$;
          SELECT 'INVENTORY_RESTORE_AUTHORITY_PASS' AS result;
          SQL
      - name: Upload exact inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc-crop-inventory-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
  inventory-gate:
    name: PC-CROP Inventory Gate · blocking
    if: always()
    runs-on: ubuntu-24.04
    needs: inventory-authority
    steps:
      - name: Enforce inventory authority result
        run: test "${{ needs.inventory-authority.result }}" = success
