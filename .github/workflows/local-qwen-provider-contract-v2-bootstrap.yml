name: Local Qwen Output Budget Repair Bootstrap

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.issue.number == 5127 &&
      github.event.comment.body == '/review repair-local-qwen-output-budget current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Publish bounded Qwen output-budget repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$live_main" == "$GITHUB_SHA" ]] || {
            echo "main moved before provider repair: event=$GITHUB_SHA live=$live_main" >&2
            exit 10
          }

          repair_branch='fix/local-qwen-output-budget-768-20260910'
          if gh api "repos/$GITHUB_REPOSITORY/branches/$repair_branch" >/dev/null 2>&1; then
            echo "Repair branch already exists; refusing to overwrite it." >&2
            exit 11
          fi
          git checkout -b "$repair_branch" "$live_main"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/local-qwen-independent-review.yml')
          text = path.read_text(encoding='utf-8')
          had_final_newline = text.endswith('\n')

          if text.count(r'ws ::= [ \t\n\r]?') != 1:
              raise SystemExit('Expected the admitted bounded whitespace grammar exactly once.')
          exported_hash = r'''printf 'prompt_bundle_sha256=%s\n' "$prompt_bundle_sha256" >> "$GITHUB_OUTPUT"'''
          if text.count(exported_hash) != 1:
              raise SystemExit('Expected the admitted prompt-bundle hash export exactly once.')

          old_budget = 'n_predict:1536'
          new_budget = 'n_predict:768'
          if text.count(old_budget) != 1:
              raise SystemExit(f'Expected exactly one request output budget {old_budget}, found {text.count(old_budget)}')
          if new_budget in text:
              raise SystemExit('Target request output budget is already present; refusing duplicate repair.')
          text = text.replace(old_budget, new_budget, 1)

          if old_budget in text or text.count(new_budget) != 1:
              raise SystemExit('Qwen request output-budget replacement is not exact.')
          path.write_text(text if had_final_newline else text.rstrip('\n'), encoding='utf-8')
          PY

          git rm .github/workflows/local-qwen-provider-contract-v2-bootstrap.yml
          git diff --check
          mapfile -t changed < <({ git diff --name-only; git diff --cached --name-only; } | sort -u)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/local-qwen-independent-review.yml"
          test "${changed[1]}" = ".github/workflows/local-qwen-provider-contract-v2-bootstrap.yml"
          grep -F 'ws ::= [ \t\n\r]?' .github/workflows/local-qwen-independent-review.yml
          grep -F 'n_predict:768' .github/workflows/local-qwen-independent-review.yml
          ! grep -F 'n_predict:1536' .github/workflows/local-qwen-independent-review.yml
          grep -F 'prompt_bundle_sha256=%s' .github/workflows/local-qwen-independent-review.yml | grep -F 'GITHUB_OUTPUT'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): bound Local Qwen completion budget at 768 tokens'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$repair_branch"
