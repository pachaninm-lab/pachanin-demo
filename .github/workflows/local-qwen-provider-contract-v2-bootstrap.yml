name: Local Qwen Prompt Hash Repair Bootstrap

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.issue.number == 5240 &&
      github.event.comment.body == '/review repair-local-qwen-prompt-hash current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish bounded prompt-hash repair branch
        shell: bash
        run: |
          set -Eeuo pipefail
          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$live_main" == "$GITHUB_SHA" ]] || {
            echo "main moved before provider repair: event=$GITHUB_SHA live=$live_main" >&2
            exit 10
          }

          repair_branch='fix/local-qwen-prompt-bundle-output-20260910'
          if git ls-remote --exit-code origin "refs/heads/$repair_branch" >/dev/null 2>&1; then
            echo "Repair branch already exists; refusing to overwrite it." >&2
            exit 11
          fi
          git checkout -b "$repair_branch" "$live_main"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/local-qwen-independent-review.yml')
          text = path.read_text(encoding='utf-8')

          old_output = "printf 'prompt_bundle_sha256=%s\\n' \"$prompt_bundle_sha256\""
          new_output = old_output + ' >> "$GITHUB_OUTPUT"'
          if text.count(old_output) != 1:
              raise SystemExit(f'Expected exactly one prompt bundle output line, found {text.count(old_output)}')
          if new_output in text:
              raise SystemExit('Prompt bundle hash is already exported; refusing duplicate repair.')
          text = text.replace(old_output, new_output, 1)

          if text.count(r'ws ::= [ \t\n\r]?') != 1:
              raise SystemExit('Expected the already-admitted bounded whitespace grammar exactly once.')
          if text.count('n_predict:1536') != 1:
              raise SystemExit('Expected the admitted n_predict:1536 request budget exactly once.')

          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/local-qwen-provider-contract-v2-bootstrap.yml
          git diff --check
          mapfile -t changed < <({ git diff --name-only; git diff --cached --name-only; } | sort -u)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/local-qwen-independent-review.yml"
          test "${changed[1]}" = ".github/workflows/local-qwen-provider-contract-v2-bootstrap.yml"
          grep -F 'ws ::= [ \t\n\r]?' .github/workflows/local-qwen-independent-review.yml
          grep -F 'n_predict:1536' .github/workflows/local-qwen-independent-review.yml
          grep -F 'prompt_bundle_sha256=%s' .github/workflows/local-qwen-independent-review.yml | grep -F 'GITHUB_OUTPUT'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): bind Local Qwen prompt bundle hash output'
          git push origin "HEAD:refs/heads/$repair_branch"
