name: Local Qwen Provider Contract v2 Bootstrap

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-provider-repair-pr:
    if: >-
      github.event.issue.number == 5240 &&
      github.event.comment.body == '/review repair-local-qwen-contract-v2 current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REPAIR_BRANCH: fix/local-qwen-provider-contract-v2-actual-20260910
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Build exact provider-only repair PR
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          local_main="$(git rev-parse HEAD)"
          [[ "$local_main" == "$current_main" ]] || {
            echo "Current-main drift: checkout=$local_main remote=$current_main" >&2
            exit 10
          }

          git checkout -B "$REPAIR_BRANCH" "$current_main"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/local-qwen-independent-review.yml')
          text = path.read_text(encoding='utf-8')

          old_server = '--n-predict 128'
          if text.count(old_server) != 1:
              raise SystemExit(f'Expected exactly one {old_server!r}, found {text.count(old_server)}')
          text = text.replace(old_server, '--n-predict 1536', 1)

          request_budget = 'n_predict:1536'
          if text.count(request_budget) != 1:
              raise SystemExit(f'Expected exactly one {request_budget!r}, found {text.count(request_budget)}')

          old_output = "printf 'prompt_bundle_sha256=%s\\n' \"$prompt_bundle_sha256\""
          if text.count(old_output) != 1:
              raise SystemExit(f'Expected exactly one prompt bundle output line, found {text.count(old_output)}')
          text = text.replace(old_output, old_output + ' >> "$GITHUB_OUTPUT"', 1)

          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/local-qwen-provider-contract-v2-bootstrap.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/local-qwen-independent-review.yml"
          test "${changed[1]}" = ".github/workflows/local-qwen-provider-contract-v2-bootstrap.yml"
          grep -F -- "--n-predict 1536" .github/workflows/local-qwen-independent-review.yml
          grep -F "n_predict:1536" .github/workflows/local-qwen-independent-review.yml
          grep -F "prompt_bundle_sha256=%s" .github/workflows/local-qwen-independent-review.yml | grep -F 'GITHUB_OUTPUT'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/local-qwen-independent-review.yml .github/workflows/local-qwen-provider-contract-v2-bootstrap.yml
          git commit -m 'fix(review): align Local Qwen server cap and prompt hash contract'
          git push origin "$REPAIR_BRANCH"

          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          Provider-only Local Qwen contract repair generated from exact current main by the owner-bound bootstrap admitted in #5240.

          Evidence-backed changes only:
          - align llama-server default `--n-predict` with the already-admitted per-request `n_predict:1536` bound from #5239;
          - export the already-computed `prompt_bundle_sha256` into `$GITHUB_OUTPUT`, because downstream exact-head evidence consumes `steps.prompt.outputs.prompt_bundle_sha256`;
          - remove the temporary #5240 bootstrap workflow in the same PR.

          Preserved unchanged: immutable model/runtime/policy pins, 400000-byte full-diff cap, 8000-byte chunk cap, 96-chunk bound, complete chunk coverage, deterministic inference settings, 170/180-second per-request wall-clock limits, strict GBNF/schema/post-generation validation, exact-head revalidation, provider status semantics, fail-closed behavior, product/API/DB/RBAC/registration/production behavior, REG.RU-only hosting policy, and recurring cost = 0 RUB.

          This provider-maintenance PR is not independent review evidence for substantive PR #5184. After merge, #5184 must synchronize current main and obtain a genuine Local Qwen exact-head PASS before merge.
          BODY

          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$REPAIR_BRANCH" \
            --title 'fix(review): export Local Qwen prompt hash and align server cap' \
            --body-file "$RUNNER_TEMP/pr-body.md"
