name: One-shot public intake and release fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-release-controller-fix.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate bounded public intake and release fix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FIX_BRANCH: fix/public-intake-release-generated-20260730
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$FIX_BRANCH" origin/main

          python <<'PY'
          from pathlib import Path
          import json

          middleware = Path('apps/web/middleware.ts')
          text = middleware.read_text()
          old = """  '/api/platform-v7/inquiries',
  '/api/platform-v7/leads',
]);"""
          new = """  '/api/platform-v7/inquiries',
  '/api/platform-v7/leads',
  '/api/platform-v7/organization-connect',
]);"""
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('public API allow-list anchor mismatch')
              text = text.replace(old, new)
          middleware.write_text(text)

          release = Path('.github/workflows/production-full-stack-exact-sha.yml')
          text = release.read_text()
          old = """      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner &&
       inputs.confirmation == 'DEPLOY-FULL-STACK-EXACT-SHA')"""
          new = """      (github.event_name == 'workflow_dispatch' &&
       (github.actor == github.repository_owner ||
        github.actor == 'github-actions[bot]') &&
       inputs.confirmation == 'DEPLOY-FULL-STACK-EXACT-SHA')"""
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('release actor guard anchor mismatch')
              text = text.replace(old, new)
          release.write_text(text)

          controller = Path('.github/workflows/platform-v7-safe-merge.yml')
          text = controller.read_text()
          if 'latest_release_deploy_state=not-found' not in text:
              old = """          latest_release_conclusion=none
          latest_release_step=none
          if [[ -n \"$selected_release\" ]]; then
            IFS=$'\\t' read -r latest_release_id _ latest_release_status latest_release_conclusion _ _ _ <<< \"$selected_release\"
            latest_release_step=$(gh api -H 'Accept: application/vnd.github+json' \"repos/$REPO/actions/runs/$latest_release_id/jobs?per_page=100\" \\
              --jq '[.jobs[] | {name, step: (([.steps[]? | select(.status == \"in_progress\" or .conclusion == \"failure\") | .name][0]) // \"none\")} | select(.step != \"none\") | (.name + \" / \" + .step)][0] // \"none\"')
          fi"""
              new = """          latest_release_conclusion=none
          latest_release_step=none
          latest_release_deploy_state=not-found
          if [[ -n \"$selected_release\" ]]; then
            IFS=$'\\t' read -r latest_release_id _ latest_release_status latest_release_conclusion _ _ _ <<< \"$selected_release\"
            latest_release_deploy_state=$(gh api -H 'Accept: application/vnd.github+json' \"repos/$REPO/actions/runs/$latest_release_id/jobs?per_page=100\" \\
              --jq '[.jobs[] | select(.name == \"Migrate, deploy API and web, verify live intake\") | (.conclusion // .status)][0] // \"missing\"')
            latest_release_step=$(gh api -H 'Accept: application/vnd.github+json' \"repos/$REPO/actions/runs/$latest_release_id/jobs?per_page=100\" \\
              --jq '[.jobs[] | {name, step: (([.steps[]? | select(.status == \"in_progress\" or .conclusion == \"failure\") | .name][0]) // \"none\")} | select(.step != \"none\") | (.name + \" / \" + .step)][0] // \"none\"')
          fi"""
              if text.count(old) != 1:
                  raise SystemExit('controller state anchor mismatch')
              text = text.replace(old, new)
          if 'deployment job skipped' not in text:
              old = """          if [[ \"$latest_release_conclusion\" == 'success' ]]; then
            status_title=\"Production release success · $sha7\"
          elif [[ \"$latest_release_status\" == 'in_progress' || \"$latest_release_status\" == 'queued' || \"$latest_release_status\" == 'pending' ]]; then"""
              new = """          if [[ \"$latest_release_conclusion\" == 'success' && \"$latest_release_deploy_state\" == 'success' ]]; then
            status_title=\"Production release success · $sha7\"
          elif [[ \"$latest_release_deploy_state\" == 'skipped' ]]; then
            status_title=\"Production release blocked: deployment job skipped · $sha7\"
          elif [[ \"$latest_release_status\" == 'in_progress' || \"$latest_release_status\" == 'queued' || \"$latest_release_status\" == 'pending' ]]; then"""
              if text.count(old) != 1:
                  raise SystemExit('controller title anchor mismatch')
              text = text.replace(old, new)
          controller.write_text(text)

          test = Path('apps/web/tests/unit/platformV7PublicOrganizationConnectMiddleware.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs';
import { join } from 'node:path';
import { describe, expect, it } from 'vitest';

const middleware = readFileSync(join(process.cwd(), 'middleware.ts'), 'utf8');

describe('public organization connect middleware authority', () => {
  it('keeps the public same-origin intake endpoint outside cabinet authentication', () => {
    expect(middleware).toContain("'/api/platform-v7/organization-connect'");
  });
});
""")

          trigger = Path('scripts/check-production-full-stack-release.mjs')
          marker = '// release-trigger: public-organization-connect-middleware-20260730'
          text = trigger.read_text()
          if marker not in text:
              trigger.write_text(text.rstrip() + '\n' + marker + '\n')

          scope = {
              'schemaVersion': 'platform-v7.concurrent-scope.v1',
              'branch': 'fix/public-intake-release-generated-20260730',
              'status': 'active',
              'issue': 3072,
              'baseCommit': 'GENERATED_FROM_CURRENT_MAIN',
              'operationalStatus': 'PUBLIC_INTAKE_401_AND_RELEASE_AUTHORITY_FIX',
              'allowedPaths': [
                  'apps/web/middleware.ts',
                  'apps/web/tests/unit/platformV7PublicOrganizationConnectMiddleware.test.ts',
                  '.github/workflows/production-full-stack-exact-sha.yml',
                  '.github/workflows/platform-v7-safe-merge.yml',
                  'scripts/check-production-full-stack-release.mjs',
                  '.github/workflows/one-shot-release-controller-fix.yml',
                  'docs/platform-v7/autopilot/scopes/one-shot-release-controller-fix-3072.json',
                  'docs/platform-v7/autopilot/scopes/fix-public-intake-release-3072.json',
              ],
              'boundaries': {
                  'runtimeBusinessBehaviorChange': False,
                  'securityGateDisabled': False,
                  'acceptanceGateWeakened': False,
                  'blanketContinueOnError': False,
                  'productionDeployment': True,
              },
              'acceptance': [
                  'public organization-connect BFF bypasses cabinet authentication only for its exact path',
                  'all other API routes retain existing authentication',
                  'skipped deployment cannot be reported as success',
                  'merge triggers exact API web migration images and production rollout',
                  'REG.RU VPS remains the only production authority',
              ],
              'productionHosting': 'REG_RU_VPS_ONLY',
          }
          Path('docs/platform-v7/autopilot/scopes/fix-public-intake-release-3072.json').write_text(
              json.dumps(scope, ensure_ascii=False, indent=2) + '\n'
          )
          PY

          rm .github/workflows/one-shot-release-controller-fix.yml
          rm docs/platform-v7/autopilot/scopes/one-shot-release-controller-fix-3072.json
          node scripts/check-production-full-stack-release.mjs
          grep -Fq "'/api/platform-v7/organization-connect'" apps/web/middleware.ts
          git diff --check

          git add apps/web/middleware.ts \
            apps/web/tests/unit/platformV7PublicOrganizationConnectMiddleware.test.ts \
            .github/workflows/production-full-stack-exact-sha.yml \
            .github/workflows/platform-v7-safe-merge.yml \
            scripts/check-production-full-stack-release.mjs \
            .github/workflows/one-shot-release-controller-fix.yml \
            docs/platform-v7/autopilot/scopes/one-shot-release-controller-fix-3072.json \
            docs/platform-v7/autopilot/scopes/fix-public-intake-release-3072.json
          git commit -m 'FIX: restore public organization intake and exact release authority'
          git push --force origin "HEAD:refs/heads/$FIX_BRANCH"

          existing=$(gh pr list --repo "$REPO" --state open --head "$FIX_BRANCH" --json number --jq '.[0].number // empty')
          if [[ -z "$existing" ]]; then
            pr_url=$(gh pr create --repo "$REPO" --base main --head "$FIX_BRANCH" \
              --title 'FIX: restore public organization intake and exact release authority' \
              --body 'Restores the exact public organization-connect BFF path in middleware after live acceptance returned 401 and rolled back the public AI UI release. Also fixes controller dispatch authority and prevents skipped deployment from being reported as success. The release trigger marker forces exact image publication and REG.RU rollout after merge. The one-shot generator removes itself in this PR.')
          else
            pr_url="$GITHUB_SERVER_URL/$REPO/pull/$existing"
          fi
          gh issue comment 3072 --repo "$REPO" --body "Generated corrective PR: $pr_url"
