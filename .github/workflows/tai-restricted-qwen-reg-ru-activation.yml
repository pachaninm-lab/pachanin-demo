name: TAI Restricted Qwen REG.RU Activation

on:
  pull_request:
    paths:
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - "scripts/pc-tai-release-controller.sh"
      - "scripts/tai-restricted-qwen-reg-ru-activate.sh"
      - "scripts/tai-live-public-ai-acceptance.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "scripts/check-pc-tai-release-controller.mjs"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-least-privilege-controller-20260731.json"
  workflow_run:
    workflows: ["TAI REG.RU Preflight"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter ACTIVATE-RESTRICTED-QWEN-REG-RU
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tai-restricted-qwen-reg-ru-activation
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai

jobs:
  contract:
    name: Least-privilege activation contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate activation authority
        run: |
          bash -n scripts/pc-tai-release-controller.sh
          bash -n scripts/tai-restricted-qwen-reg-ru-activate.sh
          bash -n scripts/install-pc-prod-actions-runner.sh
          node --check scripts/tai-live-public-ai-acceptance.mjs
          node scripts/check-pc-tai-release-controller.mjs

  image_authority:
    name: Exact-main API, web and migration image authority
    needs: contract
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'ACTIVATE-RESTRICTED-QWEN-REG-RU'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
      api_image: ${{ steps.images.outputs.api_image }}
      api_digest: ${{ steps.images.outputs.api_digest }}
      web_image: ${{ steps.images.outputs.web_image }}
      web_digest: ${{ steps.images.outputs.web_digest }}
      migration_image: ${{ steps.images.outputs.migration_image }}
      migration_digest: ${{ steps.images.outputs.migration_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact current main
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify exact images outside production
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          for component in api web migration; do
            image="ghcr.io/pachaninm-lab/grainflow-${component}:sha-${SHORT_SHA}"
            ready=0
            for attempt in $(seq 1 90); do
              if docker pull "$image" >/dev/null 2>&1; then
                revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image" 2>/dev/null || true)"
                digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image" 2>/dev/null || true)"
                if [[ "$revision" == "$TARGET_SHA" && "$digest" =~ ^ghcr[.]io/pachaninm-lab/grainflow-${component}@sha256:[0-9a-f]{64}$ ]]; then ready=1; break; fi
              fi
              sleep 10
            done
            (( ready == 1 )) || { echo "Exact ${component} image unavailable." >&2; exit 2; }
            echo "${component}_image=$image" >> "$GITHUB_OUTPUT"
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Remove hosted registry session
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  activate:
    name: Activate through protected REG.RU controller
    needs: image_authority
    if: needs.image_authority.result == 'success'
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    permissions:
      contents: read
      packages: none
      statuses: none
      issues: none
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
      TARGET_SHORT: ${{ needs.image_authority.outputs.target_short }}
      API_IMAGE: ${{ needs.image_authority.outputs.api_image }}
      API_DIGEST: ${{ needs.image_authority.outputs.api_digest }}
      WEB_IMAGE: ${{ needs.image_authority.outputs.web_image }}
      WEB_DIGEST: ${{ needs.image_authority.outputs.web_digest }}
      MIGRATION_IMAGE: ${{ needs.image_authority.outputs.migration_image }}
      MIGRATION_DIGEST: ${{ needs.image_authority.outputs.migration_digest }}
      MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
      MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
      MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
    steps:
      - name: Prepare fixed model transport input
        run: |
          set -Eeuo pipefail
          [[ "$(id -u)" -ne 0 ]]
          ! id -nG | tr ' ' '\n' | grep -Fxq docker
          if docker version >/dev/null 2>&1; then exit 21; fi
          sudo -n -l | grep -Fq '/usr/local/sbin/pc-tai-release-controller'
          input="/var/lib/pc-release-authority/runner-input/${GITHUB_RUN_ID}"
          rm -rf "$input"
          install -d -m 0700 "$input"
          [[ "$(stat -c '%U:%G:%a' "$input")" == pcactions:pcactions:700 ]]
          if [[ -n "${MODEL_KEY_SECRET:-}" ]]; then
            printf '%s' "$MODEL_KEY_SECRET" > "$input/model-key"
            chmod 0600 "$input/model-key"
          fi
          printf '%s' "${MODEL_USER_SECRET:-root}" > "$input/model-user"
          printf '%s' "${MODEL_PORT_SECRET:-22}" > "$input/model-port"
          chmod 0600 "$input/model-user" "$input/model-port"
      - name: Execute protected exact-main activation
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/pc-tai-release-controller activate "$TARGET_SHA" "$GITHUB_RUN_ID" "$API_IMAGE" "$API_DIGEST" "$WEB_IMAGE" "$WEB_DIGEST" "$MIGRATION_IMAGE" "$MIGRATION_DIGEST"
      - name: Verify public RU, EN and ZH SSE answers
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/tai-live"; mkdir -p "$out"
          for entry in 'ru|Что влияет на цену зерна?' 'en|What affects grain prices?' 'zh|哪些因素影响粮食价格？'; do
            locale="${entry%%|*}"; question="${entry#*|}"
            payload="$(python3 - "$locale" "$question" <<'PY'
          import json,sys
          print(json.dumps({'message':sys.argv[2],'locale':sys.argv[1]},ensure_ascii=False))
          PY
            )"
            curl -fsS --connect-timeout 10 --max-time 240 -H 'Content-Type: application/json' -H 'Accept: text/event-stream' -H 'Sec-Fetch-Site: same-origin' -H "Origin: $LIVE_BASE" --data-binary "$payload" "$LIVE_BASE/api/public-platform-assistant?stream=1" > "$out/${locale}.sse"
          done
          python3 - "$out" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          for locale in ('ru','en','zh'):
            text=(root/f'{locale}.sse').read_text(encoding='utf-8'); frames=[]
            for block in text.split('\n\n'):
              for line in block.splitlines():
                if line.startswith('data: '): frames.append(json.loads(line[6:]))
            assert 'token' in [f.get('event') for f in frames]
            assert frames[-1].get('event')=='done' and frames[-1].get('complete') is True
            for forbidden in ('192.168.0.206','tenantId','membershipId','subjectId','AI_ASSISTANT_API_KEY','TAI_PUBLIC_GATEWAY_HMAC_SECRET'):
              assert forbidden not in text
          PY
      - name: Upload activation and SSE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-restricted-qwen-activation-${{ env.TARGET_SHORT }}-${{ github.run_id }}
          path: |
            /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/activation.json
            ${{ runner.temp }}/tai-live
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: Hosted live public AI acceptance
    needs: [image_authority, activate]
    if: needs.activate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.image_authority.outputs.target_sha }}
          persist-credentials: false
      - name: Verify clean public AI window in Chromium
        env:
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
          UI_EVIDENCE_DIR: ${{ runner.temp }}/tai-live-ui/evidence
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/tai-live-ui-runtime"; mkdir -p "$work" "$UI_EVIDENCE_DIR"; cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts playwright@1.59.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/tai-live-public-ai-acceptance.mjs" "$work/acceptance.mjs"
          LIVE_BASE="$LIVE_BASE" node "$work/acceptance.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tai-live-public-ai-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-live-ui/evidence
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Finalize or roll back activation
    needs: [image_authority, activate, acceptance]
    if: always() && needs.image_authority.result == 'success'
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    permissions:
      contents: read
      packages: none
      statuses: none
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
      TARGET_SHORT: ${{ needs.image_authority.outputs.target_short }}
      ACTIVATE_RESULT: ${{ needs.activate.result }}
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
    steps:
      - name: Apply final acceptance decision
        run: |
          set -Eeuo pipefail
          decision=rollback
          if [[ "$ACTIVATE_RESULT" == success && "$ACCEPTANCE_RESULT" == success ]]; then decision=accept; fi
          sudo -n /usr/local/sbin/pc-tai-release-controller finalize-activation "$TARGET_SHA" "$GITHUB_RUN_ID" "$decision"
      - name: Upload finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-restricted-qwen-finalization-${{ env.TARGET_SHORT }}-${{ github.run_id }}
          path: /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/finalization.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish restricted Qwen activation result
    needs: [image_authority, activate, acceptance, finalize]
    if: always() && needs.image_authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - name: Publish exact-main activation status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
          ACTIVATE_RESULT: ${{ needs.activate.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
        run: |
          set -Eeuo pipefail
          state=failure; description='Restricted Qwen activation failed or rolled back'
          if [[ "$ACTIVATE_RESULT" == success && "$ACCEPTANCE_RESULT" == success && "$FINALIZE_RESULT" == success ]]; then
            state=success; description='Restricted Qwen REG.RU activation PASS'
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" -f context='TAI Restricted Qwen REG.RU Activation' -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$state" == success ]]; then
            gh issue comment 3365 --repo "$GITHUB_REPOSITORY" --body "Restricted Qwen accepted on REG.RU for exact main \`$TARGET_SHA\`: least-privilege controller, no production inbound SSH, private model transport, RU/EN/ZH SSE PASS and hosted Chromium UI PASS."
          fi
