name: TAI Restricted Qwen REG.RU Activation

on:
  pull_request:
    paths:
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - "scripts/tai-restricted-qwen-reg-ru-activate.sh"
      - "scripts/tai-live-public-ai-acceptance.mjs"
      - "scripts/check-tai-reg-ru-local-runner.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "scripts/production-full-stack-exact-sha.sh"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-local-runner-authority-20260731.json"
  workflow_run:
    workflows: ["Build & Publish Canonical Docker Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter ACTIVATE-RESTRICTED-QWEN-REG-RU
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tai-restricted-qwen-reg-ru-activation
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  MODEL_PRIVATE_IP: 192.168.0.206
  MODEL_PORT: "18080"
  MODEL_BASE_URL: http://192.168.0.206:18080/v1/
  MODEL_IDENTITY: tai-qwen3-8b-q4km

jobs:
  contract:
    name: Local release transport contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate activation authority
        run: |
          bash -n scripts/tai-restricted-qwen-reg-ru-activate.sh
          bash -n scripts/install-pc-prod-actions-runner.sh
          node --check scripts/tai-live-public-ai-acceptance.mjs
          node scripts/check-tai-reg-ru-local-runner.mjs

  image-authority:
    name: Verify exact API, web and migration images
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'ACTIVATE-RESTRICTED-QWEN-REG-RU'
      )
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
      migration_image: ${{ steps.images.outputs.migration_image }}
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
    steps:
      - name: Resolve exact target metadata
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify exact API, web and migration images outside production
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          for component in api web migration; do
            image="ghcr.io/pachaninm-lab/grainflow-${component}:sha-${SHORT_SHA}"
            ready=0
            for attempt in $(seq 1 90); do
              if docker pull "$image" >/dev/null 2>&1; then
                revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image" 2>/dev/null || true)"
                if [[ "$revision" == "$TARGET_SHA" ]]; then ready=1; break; fi
              fi
              sleep 10
            done
            (( ready == 1 )) || { echo "Exact ${component} image unavailable." >&2; exit 2; }
            echo "${component}_image=$image" >> "$GITHUB_OUTPUT"
          done

  activate:
    name: Activate restricted Qwen on local REG.RU authority
    if: needs.image-authority.result == 'success'
    needs: [contract, image-authority]
    runs-on: [self-hosted, linux, x64, pc-prod, tai-release]
    permissions:
      contents: read
      packages: none
      statuses: none
      issues: none
    timeout-minutes: 90
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
    env:
      MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
      MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
      MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
      PROD_DIR_SECRET: ${{ secrets.PC_PROD_DIR }}
      PROD_COMPOSE_SECRET: ${{ secrets.PC_PROD_COMPOSE }}
      PROD_PROJECT_SECRET: ${{ secrets.PC_PROD_PROJECT }}
      BACKUP_EVIDENCE_FILE_SECRET: ${{ secrets.PC_PROD_BACKUP_EVIDENCE_FILE }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Resolve exact current-main target
        id: target
        env:
          TARGET_SHA: ${{ needs.image-authority.outputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]]
          git checkout --detach "$TARGET_SHA"
          [[ "$TARGET_SHA" == "$(git rev-parse HEAD)" ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify local root release authority
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == pc-prod-* && "$(id -u)" -eq 0 ]]
          [[ -S /var/run/docker.sock ]]
          docker version >/dev/null
          docker compose version >/dev/null
          python3 - <<'PY'
          import json
          m=json.load(open('/etc/pc-release-authority/actions-runner.json',encoding='utf-8'))
          assert m['transport']=='OUTBOUND_ONLY_HTTPS' and m['productionInboundSshRequired'] is False
          PY
      - name: Resolve private model-host SSH transport only
        id: model_ssh
        run: |
          set -Eeuo pipefail
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"; rm -f "$a" "$b" "$c"; return 0
              fi
            done
            rm -f "$a" "$b" "$c"; return 1
          }
          model_user="${MODEL_USER_SECRET:-root}"
          model_port="${MODEL_PORT_SECRET:-22}"
          [[ "$model_user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$model_port" =~ ^[0-9]+$ ]] && ((model_port>=1 && model_port<=65535))
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          write_key "${MODEL_KEY_SECRET:-}" "$HOME/.ssh/id_tai_model" || { echo 'Protected model-host key unavailable.' >&2; exit 10; }
          [[ -s /etc/pc-release-authority/model_known_hosts ]]
          python3 - "$model_port" <<'PY'
          import hashlib,json,sys
          marker=json.load(open('/etc/pc-release-authority/actions-runner.json',encoding='utf-8'))
          data=open('/etc/pc-release-authority/model_known_hosts','rb').read()
          assert marker['modelSshHost']=='192.168.0.206'
          assert marker['modelSshPort']==int(sys.argv[1])
          assert marker['modelKnownHostsSha256']==hashlib.sha256(data).hexdigest()
          PY
          echo "user=$model_user" >> "$GITHUB_OUTPUT"
          echo "port=$model_port" >> "$GITHUB_OUTPUT"
      - name: Verify private model service and recover API key without disclosure
        env:
          MODEL_USER: ${{ steps.model_ssh.outputs.user }}
          MODEL_SSH_PORT: ${{ steps.model_ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          remote='set -Eeuo pipefail
          systemctl is-active --quiet tai-qwen3-8b.service
          pid="$(systemctl show tai-qwen3-8b.service --property=MainPID --value)"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          test -r "/proc/$pid/environ"
          test "$(stat -c %u "/proc/$pid")" -eq "$(id -u)"
          mapfile -t keys < <(tr "\0" "\n" < "/proc/$pid/environ" | sed -n "s/^TAI_LLM_API_KEY=//p")
          (( ${#keys[@]} == 1 )); api_key="${keys[0]}"
          test "${#api_key}" -ge 32; [[ "$api_key" != *[[:space:]]* ]]
          ss -H -ltn | grep -Eq "192[.]168[.]0[.]206:18080[[:space:]]"
          ! ss -H -ltn | grep -Eq "(^|[[:space:]])(0[.]0[.]0[.]0|[[]::[]]):18080[[:space:]]"
          curl -fsS --connect-timeout 3 --max-time 15 -H "Authorization: Bearer $api_key" http://192.168.0.206:18080/health >/dev/null
          printf %s "$api_key"'
          api_key="$(ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile=/etc/pc-release-authority/model_known_hosts -o StrictHostKeyChecking=yes "$MODEL_USER@$MODEL_PRIVATE_IP" "$remote")"
          [[ ${#api_key} -ge 32 && "$api_key" != *[[:space:]]* ]]
          echo "::add-mask::$api_key"
          printf '%s' "$api_key" > "$RUNNER_TEMP/tai-model-api-key"; chmod 0600 "$RUNNER_TEMP/tai-model-api-key"
      - name: Prepare restricted activation payload
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          api_key="$(cat "$RUNNER_TEMP/tai-model-api-key")"
          hmac_secret="$(openssl rand -hex 32)"; echo "::add-mask::$hmac_secret"
          api_env="/tmp/tai-qwen-api-${RUN_ID}.env"; web_env="/tmp/tai-qwen-web-${RUN_ID}.env"
          cat > "$api_env" <<EOF2
          AI_ASSISTANT_PROVIDER=openai-compatible
          AI_ASSISTANT_BASE_URL=$MODEL_BASE_URL
          AI_ASSISTANT_MODEL=$MODEL_IDENTITY
          AI_ASSISTANT_API_KEY=$api_key
          AI_ASSISTANT_ALLOWED_HOSTS=$MODEL_PRIVATE_IP
          TAI_RESTRICTED_QWEN_PUBLIC_ENABLED=true
          TAI_PUBLIC_GATEWAY_HMAC_SECRET=$hmac_secret
          EOF2
          cat > "$web_env" <<EOF2
          TAI_RESTRICTED_QWEN_PUBLIC_ENABLED=true
          TAI_RESTRICTED_QWEN_MODEL_IDENTITY=$MODEL_IDENTITY
          TAI_PUBLIC_GATEWAY_HMAC_SECRET=$hmac_secret
          TAI_INTERNAL_API_BASE_URL=http://api:3001/api/
          TAI_INTERNAL_API_ALLOWED_HOSTS=api
          TAI_PUBLIC_MODEL_TIMEOUT_MS=130000
          NEXT_PUBLIC_SITE_URL=https://процент-агро.рф
          EOF2
          chmod 0600 "$api_env" "$web_env"; rm -f "$RUNNER_TEMP/tai-model-api-key"
      - name: Deploy exact main API and web images locally
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          API_IMAGE: ${{ needs.image-authority.outputs.api_image }}
          WEB_IMAGE: ${{ needs.image-authority.outputs.web_image }}
          MIGRATION_IMAGE: ${{ needs.image-authority.outputs.migration_image }}
        run: |
          set -Eeuo pipefail
          enc(){ printf '%s' "$1" | base64 -w0; }
          export PC_API_IMAGE="$API_IMAGE" PC_WEB_IMAGE="$WEB_IMAGE" PC_MIGRATION_IMAGE="$MIGRATION_IMAGE"
          export PC_PROD_DIR_B64="$(enc "${PROD_DIR_SECRET:-}")" PC_PROD_COMPOSE_B64="$(enc "${PROD_COMPOSE_SECRET:-}")" PC_PROD_PROJECT_B64="$(enc "${PROD_PROJECT_SECRET:-}")" PC_PROD_BACKUP_EVIDENCE_FILE_B64="$(enc "${BACKUP_EVIDENCE_FILE_SECRET:-}")"
          raw="$RUNNER_TEMP/pc-full-stack.log"
          set +e; bash scripts/production-full-stack-exact-sha.sh deploy "$TARGET_SHA" "$GITHUB_RUN_ID" > "$raw" 2>&1; rc=$?; set -e
          sed -E 's#postgres(ql)?://[^[:space:]@]+@#postgresql://[REDACTED]@#g; /(_PATH|_DIR|COMPOSE|CONFIG_FILES)=/ s#=.*#=[REDACTED]#' "$raw"
          grep -Fxq 'DEPLOYMENT_COMPLETE=1' "$raw"; (( rc == 0 ))
      - name: Activate restricted Qwen environment locally
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          bash scripts/tai-restricted-qwen-reg-ru-activate.sh "$TARGET_SHA" "$RUN_ID" "/tmp/tai-qwen-api-${RUN_ID}.env" "/tmp/tai-qwen-web-${RUN_ID}.env"
      - name: Verify live public RU, EN and ZH model answers
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/tai-live"
          for entry in 'ru|Что влияет на цену зерна?' 'en|What affects grain prices?' 'zh|哪些因素影响粮食价格？'; do
            locale="${entry%%|*}"; question="${entry#*|}"
            payload="$(python3 - "$locale" "$question" <<'PY'
          import json, sys
          print(json.dumps({'message':sys.argv[2],'locale':sys.argv[1]},ensure_ascii=False))
          PY
            )"
            curl -fsS --connect-timeout 10 --max-time 240 -H 'Content-Type: application/json' -H 'Accept: text/event-stream' -H 'Sec-Fetch-Site: same-origin' -H "Origin: $LIVE_BASE" --data-binary "$payload" "$LIVE_BASE/api/public-platform-assistant?stream=1" > "$RUNNER_TEMP/tai-live/${locale}.sse"
          done
          python3 - "$RUNNER_TEMP/tai-live" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          for locale in ('ru','en','zh'):
              text=(root/f'{locale}.sse').read_text(encoding='utf-8'); frames=[]
              for block in text.split('\n\n'):
                  for line in block.splitlines():
                      if line.startswith('data: '): frames.append(json.loads(line[6:]))
              assert 'token' in [f.get('event') for f in frames]
              assert frames[-1].get('event')=='done' and frames[-1].get('complete') is True
              assert '192.168.0.206' not in text
              for forbidden in ('tenantId','membershipId','subjectId','AI_ASSISTANT_API_KEY','TAI_PUBLIC_GATEWAY_HMAC_SECRET'): assert forbidden not in text
          PY
      - name: Collect activation evidence
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/tai-restricted-qwen-activation.json"
          install -m 0600 "/var/lib/pc-release-authority/tai-qwen-${RUN_ID}/evidence.json" "$evidence"
          python3 - "$evidence" "$TARGET_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('schemaVersion')=='tai.restricted-qwen.activation.v1' and r.get('targetSha')==sys.argv[2] and r.get('passed') is True
          assert r.get('productionInboundSshUsed') is False and r.get('publicModelPortPublished') is False
          PY
      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-restricted-qwen-activation-${{ steps.target.outputs.short }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tai-restricted-qwen-activation.json
            ${{ runner.temp }}/tai-live
          if-no-files-found: error
          retention-days: 30
      - name: Roll back failed activation acceptance locally
        if: failure()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          enc(){ printf '%s' "$1" | base64 -w0; }
          qwen_state="/var/lib/pc-release-authority/tai-qwen-${RUN_ID}"
          if [[ -f "$qwen_state/MUTATION_STARTED" && -x "$qwen_state/rollback-qwen-env.sh" ]]; then "$qwen_state/rollback-qwen-env.sh"; else echo QWEN_ENV_ROLLBACK_NOT_REQUIRED; fi
          full_state="/var/lib/pc-release-authority/full-stack-${RUN_ID}.state"
          if [[ -f "$full_state" ]]; then
            export PC_PROD_DIR_B64="$(enc "${PROD_DIR_SECRET:-}")" PC_PROD_COMPOSE_B64="$(enc "${PROD_COMPOSE_SECRET:-}")" PC_PROD_PROJECT_B64="$(enc "${PROD_PROJECT_SECRET:-}")" PC_PROD_BACKUP_EVIDENCE_FILE_B64="$(enc "${BACKUP_EVIDENCE_FILE_SECRET:-}")"
            bash scripts/production-full-stack-exact-sha.sh rollback "$TARGET_SHA" "$RUN_ID"
          else
            echo FULL_STACK_ROLLBACK_NOT_REQUIRED
          fi
      - name: Remove transient activation materials
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: rm -f "$HOME/.ssh/id_tai_model" "$RUNNER_TEMP/tai-model-api-key" "$RUNNER_TEMP/pc-full-stack.log" "/tmp/tai-qwen-api-${RUN_ID}.env" "/tmp/tai-qwen-web-${RUN_ID}.env"

  acceptance:
    name: Hosted live public AI acceptance
    if: needs.activate.result == 'success'
    needs: activate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify clean public AI window in live Chromium
        env:
          LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
          TARGET_SHA: ${{ needs.activate.outputs.target_sha }}
          UI_EVIDENCE_DIR: ${{ runner.temp }}/tai-live-ui/evidence
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/tai-live-ui-runtime"; mkdir -p "$work" "$UI_EVIDENCE_DIR"; cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts playwright@1.59.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/tai-live-public-ai-acceptance.mjs" "$work/acceptance.mjs"
          node "$work/acceptance.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tai-live-public-ai-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-live-ui/evidence
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish restricted Qwen activation result
    if: always() && needs.activate.outputs.target_sha != ''
    needs: [activate, acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - name: Publish exact-main activation status and evidence boundary
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.activate.outputs.target_sha }}
          ACTIVATE_RESULT: ${{ needs.activate.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          set -Eeuo pipefail
          state=failure; description='Restricted Qwen REG.RU activation failed or rolled back'
          if [[ "$ACTIVATE_RESULT" == success && "$ACCEPTANCE_RESULT" == success ]]; then state=success; description='Restricted Qwen REG.RU activation PASS'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -f state="$state" -f context='TAI Restricted Qwen REG.RU Activation' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$state" == success ]]; then
            gh issue comment 3365 --repo "$GITHUB_REPOSITORY" --body "Restricted Qwen activation accepted on REG.RU for exact main \`$TARGET_SHA\`: outbound-only local production runner, no production inbound SSH, private model transport, RU/EN/ZH SSE PASS and hosted Chromium UI PASS."
          fi
