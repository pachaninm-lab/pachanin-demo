name: TEMP PC-CROP-10C replay finalization

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-pc-crop-10c-replay-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
      - name: Bind replay to exact current authority and remove launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts')
          source = path.read_text()
          replacements = [
            (
              '  operationCode: string;\n  requestSha256: string;\n  decision: string;',
              '  operationCode: string;\n  correlationId: string;\n  requestReference: string;\n  requestSha256: string;\n  decision: string;',
            ),
            (
              '        const replay = await this.findReplay(tx, context, input.idempotencyKey);\n        if (replay) return { replay, context, authorization: null, configuration: null } as const;\n        const authorization = await this.lockAuthorization(tx, context, input.authorizationId);\n        if (authorization.version !== BigInt(input.authorizationVersion)) {\n          throw new PreconditionFailedException(\'Authorization version changed\');\n        }',
              '        const authorization = await this.lockAuthorization(tx, context, input.authorizationId);\n        if (authorization.version !== BigInt(input.authorizationVersion)) {\n          throw new PreconditionFailedException(\'Authorization version changed\');\n        }\n        const replay = await this.findReplay(tx, context, input.idempotencyKey);\n        if (replay) return { replay, context, authorization: null, configuration: null } as const;',
            ),
            (
              '      row.authorizationId !== input.authorizationId\n      || row.operationCode !== input.operationCode\n      || row.requestSha256 !== input.requestSha256',
              '      row.authorizationId !== input.authorizationId\n      || row.operationCode !== input.operationCode\n      || row.correlationId !== input.correlationId\n      || row.requestReference !== input.requestReference\n      || row.requestSha256 !== input.requestSha256',
            ),
            (
              '      SELECT "id", "authorizationId", "operationCode", "requestSha256",\n             "decision", "providerRequestId", "responseReference",',
              '      SELECT "id", "authorizationId", "operationCode", "correlationId",\n             "requestReference", "requestSha256", "decision", "providerRequestId", "responseReference",',
            ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'replay replacement anchor count {count}: {old[:80]}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          rm .github/workflows/temp-pc-crop-10c-replay-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts .github/workflows/temp-pc-crop-10c-replay-finalize.yml
          git commit -m 'PC-CROP-10C: bind replay to exact current read authority'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
