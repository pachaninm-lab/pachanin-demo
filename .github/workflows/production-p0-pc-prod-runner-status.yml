name: PC-CROP P0 v4 Attestation Run Status

on:
  pull_request:
    paths:
      - ".github/workflows/production-p0-pc-prod-runner-status.yml"
      - "docs/platform-v7/autopilot/scopes/pc-crop-p0-runner-status-4445.json"

permissions:
  contents: read

jobs:
  run_status:
    name: Read v4 attestation run state without production access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate hosted-only read boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          workflow_path=Path('.github/workflows/production-p0-pc-prod-runner-status.yml')
          scope_path=Path('docs/platform-v7/autopilot/scopes/pc-crop-p0-runner-status-4445.json')
          scope=json.loads(scope_path.read_text(encoding='utf-8'))
          if scope.get('branch')!='fix/pc-crop-p0-runner-status-4445': raise SystemExit('SCOPE_BRANCH')
          if set(scope.get('allowedPaths') or [])!={str(workflow_path),str(scope_path)}: raise SystemExit('SCOPE_PATHS')
          runtime=workflow_path.read_text(encoding='utf-8').split('      - name: Query latest v4 issue-comment run',1)[1]
          for marker in ('self-hosted','ssh-keyscan','ssh ','docker ','psql ','sudo ','gh secret','registration-token','remove-token'):
              if marker in runtime: raise SystemExit(f'FORBIDDEN:{marker}')
          PY
      - name: Query latest v4 issue-comment run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(mktemp)"; jobs="$(mktemp)"
          trap 'rm -f "$runs" "$jobs"' EXIT
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/workflows/production-p0-ssh-host-key-attestation-v4.yml/runs?event=issue_comment&per_page=10" > "$runs"
          run_id="$(python3 - "$runs" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=p.get('workflow_runs') or []
          if not rows: raise SystemExit('V4_RUN_NOT_FOUND')
          rows=sorted(rows,key=lambda r:r.get('created_at') or '',reverse=True)
          r=rows[0]
          print(r.get('id'))
          print(f"V4_RUN_ID={r.get('id')}",file=sys.stderr)
          print(f"V4_RUN_STATUS={str(r.get('status')).upper()}",file=sys.stderr)
          print(f"V4_RUN_CONCLUSION={str(r.get('conclusion')).upper()}",file=sys.stderr)
          print(f"V4_RUN_HEAD_SHA={r.get('head_sha')}",file=sys.stderr)
          PY
          )"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$jobs"
          python3 - "$jobs" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          for j in p.get('jobs') or []:
              print('V4_JOB=' + str(j.get('name')))
              print('V4_JOB_STATUS=' + str(j.get('status')).upper())
              print('V4_JOB_CONCLUSION=' + str(j.get('conclusion')).upper())
          print('PRODUCTION_MUTATION=NONE')
          PY
