name: Temporary Local Qwen speculative repair scope

on:
  push:
    branches:
      - fix/local-qwen-speculative-repair-scope-20260916

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/local-qwen-speculative-repair-scope-20260916
          fetch-depth: 1

      - name: Apply bounded repair-scope hardening
        run: python3 scripts/tmp-scope-local-qwen-speculative-repair.py

      - name: Validate generated workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          grep -F "def scoped_speculative_repair_item" .github/workflows/local-qwen-independent-review.yml >/dev/null
          grep -F "repair_item = scoped_speculative_repair_item" .github/workflows/local-qwen-independent-review.yml >/dev/null

      - name: Preserve generated target workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-local-qwen-provider-patch-${{ github.sha }}
          path: .github/workflows/local-qwen-independent-review.yml
          if-no-files-found: error
          retention-days: 1
