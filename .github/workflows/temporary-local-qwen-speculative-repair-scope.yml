name: Temporary Local Qwen speculative repair scope

on:
  push:
    branches:
      - fix/local-qwen-speculative-repair-scope-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/local-qwen-speculative-repair-scope-20260916
          fetch-depth: 1

      - name: Apply bounded repair-scope hardening
        run: python3 scripts/tmp-scope-local-qwen-speculative-repair.py

      - name: Validate and commit bounded provider repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          grep -F "def scoped_speculative_repair_item" .github/workflows/local-qwen-independent-review.yml >/dev/null
          grep -F "repair_item = scoped_speculative_repair_item" .github/workflows/local-qwen-independent-review.yml >/dev/null
          git rm .github/workflows/temporary-local-qwen-speculative-repair-scope.yml scripts/tmp-scope-local-qwen-speculative-repair.py
          git config user.name 'pachaninm-lab'
          git config user.email 'pachaninm@gmail.com'
          git add .github/workflows/local-qwen-independent-review.yml
          git diff --cached --check
          git commit -m 'fix(local-qwen): scope speculative repair to original anchor'
          git push origin HEAD:fix/local-qwen-speculative-repair-scope-20260916
