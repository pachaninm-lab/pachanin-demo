name: TAI AP-13C.1g bounded implementation finalizer

on:
  push:
    branches:
      - agent/tai-ap-13c1g-public-role-qwen-3365
    paths:
      - .github/workflows/tai-ap-13c1g-implementation.yml

permissions:
  contents: write

concurrency:
  group: tai-ap-13c1g-implementation
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tai-ap-13c1g-public-role-qwen-3365
          fetch-depth: 0

      - name: Apply exact bounded runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          service = "apps/api/src/modules/ai-insights/ai-assistant.service.ts"
          replace_once(
              service,
              "const PROVIDER_TIMEOUT_MS = 18_000;",
              "const DEFAULT_PROVIDER_TIMEOUT_MS = 120_000;\nconst DEFAULT_PROVIDER_MAX_TOKENS = 500;",
          )
          replace_once(
              service,
              "const timeout = setTimeout(() => controller.abort(), PROVIDER_TIMEOUT_MS);",
              "const timeout = setTimeout(() => controller.abort(), providerTimeoutMs());",
          )
          replace_once(
              service,
              "body: JSON.stringify({ model, messages, temperature: 0.2, max_tokens: 900 }),",
              "body: JSON.stringify({\n          model,\n          messages,\n          temperature: 0,\n          seed: 0,\n          max_tokens: providerMaxTokens(),\n          stream: false,\n          chat_template_kwargs: { enable_thinking: false },\n        }),",
          )
          replace_once(
              service,
              "function ensureTrailingSlash(value: string): string {\n  return value.endsWith('/') ? value : `${value}/`;\n}\n",
              "function ensureTrailingSlash(value: string): string {\n  return value.endsWith('/') ? value : `${value}/`;\n}\n\nfunction providerTimeoutMs(): number {\n  return boundedProviderInteger(\n    process.env.AI_ASSISTANT_TIMEOUT_MS,\n    DEFAULT_PROVIDER_TIMEOUT_MS,\n    1_000,\n    300_000,\n  );\n}\n\nfunction providerMaxTokens(): number {\n  return boundedProviderInteger(\n    process.env.AI_ASSISTANT_MAX_TOKENS,\n    DEFAULT_PROVIDER_MAX_TOKENS,\n    32,\n    1_200,\n  );\n}\n\nfunction boundedProviderInteger(\n  raw: string | undefined,\n  fallback: number,\n  minimum: number,\n  maximum: number,\n): number {\n  const parsed = Number(raw);\n  if (!Number.isInteger(parsed)) return fallback;\n  return Math.min(maximum, Math.max(minimum, parsed));\n}\n",
          )

          route = "apps/web/app/api/restricted-public-platform-assistant/route.ts"
          replace_once(
              route,
              "import { createHash, createHmac } from 'node:crypto';",
              "import { createHash, createHmac, randomUUID } from 'node:crypto';",
          )
          replace_once(route, "const streamId = crypto.randomUUID();", "const streamId = randomUUID();")

          public_service = "apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts"
          replace_once(
              public_service,
              "if (!/^\\/platform-v7(?:\\/|$)/u.test(href) || href.includes('..') || href.includes('://')) {",
              "const privateRoute = /^\\/platform-v7\\/(?:deals|staff|admin|operator|buyer|seller|bank|logistics|driver|elevator|laboratory|surveyor|compliance|arbitrator|executive)(?:\\/|$)/u;\n  if (!/^\\/platform-v7(?:\\/|$)/u.test(href) || privateRoute.test(href) || href.includes('..') || href.includes('://')) {",
          )
          PY

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: API focused tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @pc/api test -- --runInBand \
            src/modules/ai-insights/restricted-public-qwen.service.spec.ts \
            src/modules/ai-insights/restricted-public-qwen.controller.spec.ts \
            src/modules/ai-insights/ai-assistant.service.spec.ts

      - name: Web focused test
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @pc/web test -- tests/unit/platformV7RestrictedPublicQwenRoute.test.ts

      - name: Typecheck API and web
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @pc/api typecheck
          pnpm --filter @pc/web typecheck

      - name: Commit exact tested implementation and retire finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tai-ap-13c1g-implementation.yml
          git add \
            apps/api/src/modules/ai-insights/ai-assistant.service.ts \
            apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts \
            apps/web/app/api/restricted-public-platform-assistant/route.ts
          git diff --cached --check
          git commit -m 'TAI AP-13C.1g: harden restricted Qwen runtime'
          git push origin HEAD:agent/tai-ap-13c1g-public-role-qwen-3365
