name: TAI AP-13C.1g exact-main synchronizer

on:
  push:
    branches:
      - agent/tai-ap-13c1g-public-role-qwen-3365
    paths:
      - .github/workflows/tai-ap-13c1g-implementation.yml

permissions:
  contents: write

concurrency:
  group: tai-ap-13c1g-exact-main-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: agent/tai-ap-13c1g-public-role-qwen-3365
          fetch-depth: 0

      - name: Merge current main and retire synchronizer
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/tai-ap-13c1g-public-role-qwen-3365'
          self='.github/workflows/tai-ap-13c1g-implementation.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main "$branch"
          expected_head="$(git rev-parse "origin/$branch")"
          test "$(git rev-parse HEAD)" = "$expected_head"
          main_sha="$(git rev-parse origin/main)"
          git merge --no-ff --no-commit "$main_sha"
          git rm "$self"
          git diff --check
          git commit -m "chore(tai): synchronize AP-13C.1g with exact main"
          git fetch --no-tags origin main "$branch"
          test "$(git rev-parse origin/main)" = "$main_sha"
          test "$(git rev-parse "origin/$branch")" = "$expected_head"
          git push origin "HEAD:refs/heads/$branch"
