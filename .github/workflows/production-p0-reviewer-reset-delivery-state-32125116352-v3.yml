name: Production P0 Reviewer Reset Delivery State 32125116352 v3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-reset-delivery-state-32125116352-v3.yml'

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-reset-delivery-state-32125116352-v3
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RESET_SHA: 834e51aad00e94163aaff3044b26f0db9c32d8f1
  WINDOW_START: '2026-08-18T10:05:00Z'
  WINDOW_END: '2026-08-18T10:35:00Z'

jobs:
  inspect:
    name: Read-only reviewer reset state probe
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
      PC_P0_IMAP_HOST: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_HOST || secrets.PC_PROD_P0_IMAP_HOST }}
      PC_P0_IMAP_PORT: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PORT || secrets.PC_PROD_P0_IMAP_PORT }}
      PC_P0_IMAP_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
      PC_P0_IMAP_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
      PC_P0_IMAP_FOLDER: ${{ secrets.PC_PROD_P0_IMAP_FOLDER }}
    outputs:
      row_count: ${{ steps.probe.outputs.row_count }}
      status: ${{ steps.probe.outputs.status }}
      attempts: ${{ steps.probe.outputs.attempts }}
      max_attempts: ${{ steps.probe.outputs.max_attempts }}
      error_code: ${{ steps.probe.outputs.error_code }}
      sent_at: ${{ steps.probe.outputs.sent_at }}
      mailbox_result: ${{ steps.probe.outputs.mailbox_result }}
      mailbox_match_count: ${{ steps.probe.outputs.mailbox_match_count }}
      mailbox_error: ${{ steps.probe.outputs.mailbox_error }}
      production_mutation: ${{ steps.probe.outputs.production_mutation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bounded read-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          source='.github/workflows/production-p0-reviewer-reset-delivery-state-32125116352-v3.yml'
          grep -Fq "RESET_SHA: 834e51aad00e94163aaff3044b26f0db9c32d8f1" "$source"
          grep -Fq "message_kind = 'PASSWORD_RESET'" "$source"
          grep -Fq "readonly=True" "$source"
          grep -Fq "BODY.PEEK[HEADER.FIELDS (MESSAGE-ID DATE)]" "$source"
          python3 - "$source" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          markers=[i for i,line in enumerate(lines) if line.strip() == '# OPERATIONAL_BEGIN']
          if len(markers) != 1:
              raise SystemExit(f'OPERATIONAL_MARKER_INVALID:{len(markers)}')
          operational='\n'.join(lines[markers[0]+1:])
          forbidden=[
              'docker restart','docker rm ','docker compose up','docker compose down',
              'INSERT INTO','UPDATE auth.','DELETE FROM','TRUNCATE ','ALTER ROLE',
              'CREATE ROLE','DROP ROLE','GRANT ','REVOKE ','curl -X POST',
              'sendAuthMailSmtp(','client.store(','client.append(','client.expunge(',
          ]
          bad=[token for token in forbidden if token in operational]
          if bad:
              raise SystemExit('MUTATION_SURFACE_FORBIDDEN:'+'|'.join(bad))
          PY

      # OPERATIONAL_BEGIN
      - name: Resolve pinned production SSH authority
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${PC_PROD_HOST:-$DEFAULT_HOST}")"
          user="$(trim "${PC_PROD_SSH_USER:-}")"
          port="$(trim "${PC_PROD_SSH_PORT:-22}")"
          expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          key="$HOME/.ssh/id_pc_prod"
          validate_key(){
            local src="$1" pub
            tr -d '\r' < "$src" > "$key"; chmod 600 "$key"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$key" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${PC_PROD_SSH_KEY:-}" || try_slot "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_slot "${VPS_SSH_KEY:-}"
          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$ready" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Inspect durable reset and mailbox read-only
        id: probe
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          emit(){ printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          finish_blocked(){
            local rows="$1" status="$2" attempts="$3" max_attempts="$4" err="$5" sent="$6" mailbox="$7" matches="$8" mailerr="$9"
            emit row_count "$rows"; emit status "$status"; emit attempts "$attempts"; emit max_attempts "$max_attempts"
            emit error_code "$err"; emit sent_at "$sent"; emit mailbox_result "$mailbox"
            emit mailbox_match_count "$matches"; emit mailbox_error "$mailerr"; emit production_mutation NONE
            echo "PRODUCTION_MUTATION=NONE"
            exit 0
          }
          set +e
          raw="$(ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$USER@$HOST" \
            "bash -s -- '$WINDOW_START' '$WINDOW_END'" 2>/dev/null <<'REMOTE'
          set -Eeuo pipefail
          start="$1"; end="$2"
          stage=uid_boundary
          trap 'printf "REMOTE_FAIL_STAGE=%s\n" "$stage"' ERR
          [[ "$(id -u)" -eq 0 ]]
          stage=web_container_discovery
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 ))
          web_id="${web_ids[0]}"
          stage=compose_project_discovery
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          [[ -n "$project" ]]
          stage=worker_container_discovery
          mapfile -t worker_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker')
          (( ${#worker_ids[@]} == 1 ))
          worker_id="${worker_ids[0]}"
          stage=worker_runtime_state
          worker_state="$(docker inspect --format '{{.State.Status}}' "$worker_id")"
          worker_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id")"
          [[ "$worker_state" == running && "$worker_health" == healthy ]]
          stage=db_read
          docker exec -i "$worker_id" /nodejs/bin/node --input-type=commonjs - "$start" "$end" <<'NODE'
          const {readFileSync}=require('node:fs');
          const {PrismaClient}=require('@prisma/client');
          const safe=v=>String(v??'NONE').toUpperCase().replace(/[^A-Z0-9_:-]/g,'_').slice(0,100)||'NONE';
          const [start,end]=process.argv.slice(2);
          (async()=>{
            const file=String(process.env.AUTH_MAIL_DATABASE_URL_FILE||'').trim();
            if(!file) throw new Error('DB_FILE_MISSING');
            const url=readFileSync(file,'utf8').trim();
            const db=new PrismaClient({datasources:{db:{url}}});
            try {
              const principal=await db.$queryRawUnsafe("SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user");
              const p=principal?.[0];
              if(!p || p.current_user!=='pc_auth_mail_runtime' || p.rolsuper || p.rolbypassrls) throw new Error('PRINCIPAL_BOUNDARY');
              const rows=await db.$queryRawUnsafe(`
                SELECT id,status,attempt_count,max_attempts,COALESCE(last_error_code,'NONE') AS last_error_code,sent_at
                FROM auth.mail_outbox
                WHERE message_kind = 'PASSWORD_RESET'
                  AND created_at >= $1::timestamptz
                  AND created_at < $2::timestamptz
                ORDER BY created_at,id
              `,start,end);
              console.log(`ROW_COUNT=${rows.length}`);
              if(rows.length!==1) return;
              const r=rows[0];
              const id=String(r.id||'');
              if(!/^[A-Za-z0-9._-]{8,160}$/.test(id)) throw new Error('OUTBOX_ID_SHAPE');
              console.log(`OUTBOX_ID=${id}`);
              console.log(`STATUS=${safe(r.status)}`);
              console.log(`ATTEMPTS=${Number(r.attempt_count||0)}`);
              console.log(`MAX_ATTEMPTS=${Number(r.max_attempts||0)}`);
              console.log(`ERROR_CODE=${safe(r.last_error_code)}`);
              console.log(`SENT_AT=${r.sent_at?'YES':'NO'}`);
            } finally { await db.$disconnect().catch(()=>{}); }
          })().catch(e=>{ console.log(`DB_SAFE_ERROR=${safe(e?.message||e?.name||'UNKNOWN')}`); process.exitCode=1; });
          NODE
          REMOTE
          )"
          ssh_rc=$?
          set -e
          remote_stage="$(sed -n 's/^REMOTE_FAIL_STAGE=//p' <<< "$raw" | tail -1)"
          db_error="$(sed -n 's/^DB_SAFE_ERROR=//p' <<< "$raw" | head -1)"
          if (( ssh_rc != 0 )); then
            code="REMOTE_${remote_stage:-SSH_READ}_FAILED"
            [[ -z "$db_error" ]] || code="DB_$db_error"
            code="$(tr '[:lower:]' '[:upper:]' <<< "$code" | tr -c 'A-Z0-9_:-' '_' | head -c 100)"
            finish_blocked 0 REMOTE_FAIL 0 0 "$code" NO SKIPPED 0 NOT_ATTEMPTED
          fi
          row_count="$(sed -n 's/^ROW_COUNT=//p' <<< "$raw" | head -1)"
          [[ "$row_count" =~ ^[0-9]+$ ]] || finish_blocked 0 PARSE_FAIL 0 0 ROW_COUNT_INVALID NO SKIPPED 0 NOT_ATTEMPTED
          if [[ "$row_count" != 1 ]]; then
            finish_blocked "$row_count" ROW_CARDINALITY 0 0 "ROW_COUNT_$row_count" NO SKIPPED 0 NOT_ATTEMPTED
          fi
          outbox_id="$(sed -n 's/^OUTBOX_ID=//p' <<< "$raw" | head -1)"
          status="$(sed -n 's/^STATUS=//p' <<< "$raw" | head -1)"
          attempts="$(sed -n 's/^ATTEMPTS=//p' <<< "$raw" | head -1)"
          max_attempts="$(sed -n 's/^MAX_ATTEMPTS=//p' <<< "$raw" | head -1)"
          error_code="$(sed -n 's/^ERROR_CODE=//p' <<< "$raw" | head -1)"
          sent_at="$(sed -n 's/^SENT_AT=//p' <<< "$raw" | head -1)"
          [[ "$outbox_id" =~ ^[A-Za-z0-9._-]{8,160}$ ]] || finish_blocked 1 PARSE_FAIL 0 0 OUTBOX_ID_INVALID NO SKIPPED 0 NOT_ATTEMPTED
          [[ "$status" =~ ^(PENDING|PROCESSING|SENT|DEAD_LETTER)$ ]] || finish_blocked 1 PARSE_FAIL 0 0 OUTBOX_STATUS_INVALID NO SKIPPED 0 NOT_ATTEMPTED
          [[ "$attempts" =~ ^[0-9]{1,3}$ && "$max_attempts" =~ ^[0-9]{1,3}$ ]] || finish_blocked 1 PARSE_FAIL 0 0 ATTEMPT_COUNT_INVALID NO SKIPPED 0 NOT_ATTEMPTED
          [[ "$error_code" =~ ^[A-Z0-9_:-]{1,100}$ ]] || finish_blocked 1 PARSE_FAIL "$attempts" "$max_attempts" OUTBOX_ERROR_INVALID "$sent_at" SKIPPED 0 NOT_ATTEMPTED
          [[ "$sent_at" =~ ^(YES|NO)$ ]] || finish_blocked 1 PARSE_FAIL "$attempts" "$max_attempts" SENT_AT_INVALID NO SKIPPED 0 NOT_ATTEMPTED
          echo "::add-mask::$outbox_id"
          if [[ "$status" != SENT || "$sent_at" != YES ]]; then
            finish_blocked 1 "$status" "$attempts" "$max_attempts" "$error_code" "$sent_at" SKIPPED 0 OUTBOX_NOT_SENT
          fi
          set +e
          mailbox="$(OUTBOX_ID="$outbox_id" python3 - <<'PY' 2>/dev/null
          import email, imaplib, os, re, ssl
          from email.policy import default
          def normalized_login(value):
              value=str(value or '').strip()
              if not value:
                  return None
              if '@' not in value:
                  return value if len(value)<=254 and not re.search(r'\s',value) else None
              if value.count('@') != 1:
                  return None
              local,domain=value.rsplit('@',1)
              try:
                  local.encode('ascii'); domain=domain.encode('idna').decode('ascii').lower()
              except Exception:
                  return None
              result=f'{local}@{domain}'
              return result if len(result)<=254 and re.fullmatch(r'[^\s@]{1,64}@[^\s@]{1,189}',result) else None
          def safe_fail(code):
              print(f'MAILBOX_SAFE_ERROR={code}')
              raise SystemExit(71)
          outbox_id=os.environ.get('OUTBOX_ID','').strip()
          host=os.environ.get('PC_P0_IMAP_HOST','').strip()
          user=normalized_login(os.environ.get('PC_P0_IMAP_USER',''))
          password=os.environ.get('PC_P0_IMAP_PASSWORD','')
          try: port=int((os.environ.get('PC_P0_IMAP_PORT') or '993').strip())
          except Exception: safe_fail('IMAP_PORT_INVALID')
          folder=(os.environ.get('PC_P0_IMAP_FOLDER') or 'INBOX').strip() or 'INBOX'
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,160}',outbox_id): safe_fail('OUTBOX_ID_INVALID')
          if not host or not user or not password: safe_fail('IMAP_CONFIG_OR_IDENTITY_INVALID')
          target=f'<{outbox_id}@xn----8sbjf4befbjgs9b.xn--p1ai>'
          client=None; matches=0; checked=0; stage='TLS_CONNECT'
          try:
              client=imaplib.IMAP4_SSL(host,port,ssl_context=ssl.create_default_context(),timeout=15)
              stage='LOGIN'; result,_=client.login(user,password)
              if result!='OK': safe_fail('IMAP_LOGIN_NON_OK')
              stage='SELECT'; result,_=client.select(folder,readonly=True)
              if result!='OK': safe_fail('IMAP_SELECT_NON_OK')
              stage='SEARCH'; result,data=client.search(None,'ALL')
              if result!='OK': safe_fail('IMAP_SEARCH_NON_OK')
              stage='FETCH'
              ids=(data[0] or b'').split()[-1000:]
              for ident in reversed(ids):
                  result,rows=client.fetch(ident,'(BODY.PEEK[HEADER.FIELDS (MESSAGE-ID DATE)])')
                  if result!='OK': continue
                  header=next((x[1] for x in rows if isinstance(x,tuple) and len(x)>1),None)
                  if not header: continue
                  checked+=1
                  msg=email.message_from_bytes(header,policy=default)
                  if str(msg.get('message-id') or '').strip()==target: matches+=1
              print(f'MAILBOX_MATCH_COUNT={matches}')
              print(f'MAILBOX_MESSAGES_CHECKED={checked}')
              print('MAILBOX_RESULT=PASS' if matches==1 else 'MAILBOX_RESULT=NO_EXACT_MATCH')
          except SystemExit:
              raise
          except BaseException:
              safe_fail(f'IMAP_{stage}_FAILED')
          finally:
              if client is not None:
                  try: client.logout()
                  except Exception: pass
          PY
          )"
          mailbox_rc=$?
          set -e
          mail_error="$(sed -n 's/^MAILBOX_SAFE_ERROR=//p' <<< "$mailbox" | head -1)"
          if (( mailbox_rc != 0 )); then
            [[ "$mail_error" =~ ^[A-Z0-9_:-]{1,100}$ ]] || mail_error=IMAP_PROBE_FAILED
            finish_blocked 1 "$status" "$attempts" "$max_attempts" "$error_code" "$sent_at" FAIL 0 "$mail_error"
          fi
          match_count="$(sed -n 's/^MAILBOX_MATCH_COUNT=//p' <<< "$mailbox" | head -1)"
          mailbox_result="$(sed -n 's/^MAILBOX_RESULT=//p' <<< "$mailbox" | head -1)"
          [[ "$match_count" =~ ^[0-9]+$ ]] || match_count=0
          [[ "$mailbox_result" =~ ^(PASS|NO_EXACT_MATCH)$ ]] || mailbox_result=FAIL
          mail_error=NONE
          [[ "$mailbox_result" == PASS ]] || mail_error=MESSAGE_ID_MATCH_COUNT_MISMATCH
          finish_blocked 1 "$status" "$attempts" "$max_attempts" "$error_code" "$sent_at" "$mailbox_result" "$match_count" "$mail_error"

  classify:
    needs: inspect
    if: always()
    name: >-
      Reset ${{ needs.inspect.outputs.status }}
      ${{ needs.inspect.outputs.attempts }}/${{ needs.inspect.outputs.max_attempts }}
      err=${{ needs.inspect.outputs.error_code }}
      mailbox=${{ needs.inspect.outputs.mailbox_result }}:${{ needs.inspect.outputs.mailbox_match_count }}:${{ needs.inspect.outputs.mailbox_error }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact delivery proof
        shell: bash
        env:
          ROW_COUNT: ${{ needs.inspect.outputs.row_count }}
          STATUS: ${{ needs.inspect.outputs.status }}
          SENT_AT: ${{ needs.inspect.outputs.sent_at }}
          MAILBOX_RESULT: ${{ needs.inspect.outputs.mailbox_result }}
          MAILBOX_MATCH_COUNT: ${{ needs.inspect.outputs.mailbox_match_count }}
          PRODUCTION_MUTATION: ${{ needs.inspect.outputs.production_mutation }}
        run: |
          set -Eeuo pipefail
          [[ "$PRODUCTION_MUTATION" == NONE ]]
          [[ "$ROW_COUNT" == 1 ]]
          [[ "$STATUS" == SENT ]]
          [[ "$SENT_AT" == YES ]]
          [[ "$MAILBOX_RESULT" == PASS ]]
          [[ "$MAILBOX_MATCH_COUNT" == 1 ]]
          echo "RESET_DELIVERY_GATE=PASS"
          echo "PRODUCTION_MUTATION=NONE"
