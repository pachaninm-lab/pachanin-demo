name: Temporary register PC-CROP-10C runtime scope

on:
  push:
    branches:
      - governance/register-pc-crop-10c-runtime-scope-3446

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/register-pc-crop-10c-runtime-scope-3446
          fetch-depth: 0
          persist-credentials: true
      - name: Register exact implementation scope and remove launcher
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/platform-v7/autopilot/autopilot-state.json';
          const state = JSON.parse(fs.readFileSync(path, 'utf8'));
          state.approvedConcurrentScopes ||= {};
          state.approvedConcurrentScopes['agent/pc-crop-10c-tenant-authorized-read-adapter'] = [
            '.github/workflows/pc-crop-10c.yml',
            'docs/platform-v7/autopilot/scopes/pc-crop-10c-tenant-authorized-read-adapter-3446.json',
            'apps/api/prisma/migrations/20260730103000_fgis_grain_tenant_read_authority/migration.sql',
            'apps/api/src/modules/regulatory-integration/regulatory-integration.module.ts',
            'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.contract.ts',
            'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts',
            'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.controller.ts',
            'apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.spec.ts',
            'apps/api/test/industrial/fgis-grain-tenant-read.e2e-spec.ts',
            'scripts/pc-crop-10c/verify.mjs'
          ];
          fs.writeFileSync(path, `${JSON.stringify(state)}\n`);
          NODE
          rm -f .github/workflows/temp-register-pc-crop-10c-runtime-scope-3446.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/platform-v7/autopilot/autopilot-state.json .github/workflows/temp-register-pc-crop-10c-runtime-scope-3446.yml
          git commit -m 'GOVERNANCE: register PC-CROP-10C tenant read scope'
          git push origin HEAD:governance/register-pc-crop-10c-runtime-scope-3446
