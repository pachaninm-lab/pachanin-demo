name: PC-CROP employee GUEST MFA bootstrap 4884

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/p0-employee-guest-mfa-bootstrap-4884.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: p0-employee-guest-mfa-bootstrap-4884
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-employee-guest-mfa-4884'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply bounded employee login-MFA fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          service_path = Path('apps/api/src/modules/auth/auth.service.ts')
          service = service_path.read_text(encoding='utf-8')
          policy_anchor = """export function requiresRoleMfa(role: Role): boolean {
            return PRIVILEGED_MFA_ROLES.has(role);
          }

          export function requiresRecentFinancialMfa(amountKopecks: number): boolean {
          """
          policy_replacement = """export function requiresRoleMfa(role: Role): boolean {
            return PRIVILEGED_MFA_ROLES.has(role);
          }

          export function requiresLoginMfa(
            role: Role,
            isOrganizationAdmin: boolean,
            mfaEnabled: boolean,
          ): boolean {
            return role === Role.GUEST
              || requiresRoleMfa(role)
              || isOrganizationAdmin
              || mfaEnabled;
          }

          export function requiresRecentFinancialMfa(amountKopecks: number): boolean {
          """
          if service.count(policy_anchor) != 1:
              raise SystemExit(f'P0_EMPLOYEE_LOGIN_MFA_POLICY_ANCHOR={service.count(policy_anchor)}')
          service = service.replace(policy_anchor, policy_replacement, 1)

          session_anchor = """    const mfaRequired = requiresRoleMfa(this.role(identity.role)) || identity.is_org_admin || credential.mfa_enabled;
          """
          session_replacement = """    const role = this.role(identity.role);
              const mfaRequired = requiresLoginMfa(role, identity.is_org_admin, credential.mfa_enabled);
          """
          if service.count(session_anchor) != 1:
              raise SystemExit(f'P0_EMPLOYEE_LOGIN_MFA_SESSION_ANCHOR={service.count(session_anchor)}')
          service = service.replace(session_anchor, session_replacement, 1)
          service_path.write_text(service, encoding='utf-8')

          spec_path = Path('apps/api/src/modules/auth/auth.service.spec.ts')
          spec = spec_path.read_text(encoding='utf-8')
          import_anchor = """import {
            AuthService,
            requiresRecentFinancialMfa,
            requiresRoleMfa,
          } from './auth.service';
          """
          import_replacement = """import {
            AuthService,
            PRIVILEGED_SESSION_IDLE_TIMEOUT_MS,
            SESSION_IDLE_TIMEOUT_MS,
            idleTimeoutMsForRole,
            requiresLoginMfa,
            requiresRecentFinancialMfa,
            requiresRoleMfa,
          } from './auth.service';
          """
          if spec.count(import_anchor) != 1:
              raise SystemExit(f'P0_EMPLOYEE_LOGIN_MFA_SPEC_IMPORT_ANCHOR={spec.count(import_anchor)}')
          spec = spec.replace(import_anchor, import_replacement, 1)

          test_anchor = """  it('requires recent MFA at the exact financial threshold', () => {
          """
          test_replacement = """  it('requires login MFA for the employee GUEST without changing privileged idle policy', () => {
            expect(requiresLoginMfa(Role.GUEST, false, false)).toBe(true);
            expect(requiresLoginMfa(Role.ADMIN, false, false)).toBe(true);
            expect(idleTimeoutMsForRole(Role.GUEST)).toBe(SESSION_IDLE_TIMEOUT_MS);
            expect(idleTimeoutMsForRole(Role.GUEST)).not.toBe(PRIVILEGED_SESSION_IDLE_TIMEOUT_MS);
          });

          it('preserves ordinary non-admin login policy and existing admin or enrolled MFA', () => {
            expect(requiresLoginMfa(Role.FARMER, false, false)).toBe(false);
            expect(requiresLoginMfa(Role.FARMER, true, false)).toBe(true);
            expect(requiresLoginMfa(Role.FARMER, false, true)).toBe(true);
          });

          it('requires recent MFA at the exact financial threshold', () => {
          """
          if spec.count(test_anchor) != 1:
              raise SystemExit(f'P0_EMPLOYEE_LOGIN_MFA_SPEC_TEST_ANCHOR={spec.count(test_anchor)}')
          spec = spec.replace(test_anchor, test_replacement, 1)
          spec_path.write_text(spec, encoding='utf-8')

          scope_path = Path('docs/platform-v7/autopilot/scopes/p0-employee-guest-mfa-4884.json')
          scope_path.parent.mkdir(parents=True, exist_ok=True)
          scope = {
            'schemaVersion': 'platform-v7.concurrent-scope.v1',
            'branch': 'fix/p0-employee-guest-mfa-4884',
            'status': 'active',
            'issue': 4884,
            'registrationIssue': 3785,
            'releaseAuthorityIssue': 4637,
            'authorityBaseExactMain': 'dc61910f579ed5f2bda0f0379e81f79984456f10',
            'purpose': 'Require first-login MFA enrollment for the server-derived employee GUEST membership while preserving the ordinary GUEST idle-timeout tier.',
            'allowedPaths': [
              'apps/api/src/modules/auth/auth.service.ts',
              'apps/api/src/modules/auth/auth.service.spec.ts',
              'docs/platform-v7/autopilot/scopes/p0-employee-guest-mfa-4884.json',
            ],
            'boundaries': {
              'productionMutation': False,
              'databaseMutation': False,
              'databaseSchemaChange': False,
              'identityMutation': False,
              'roleMappingChange': False,
              'tenantMappingChange': False,
              'reviewerCredentialInput': False,
              'mfaWeakening': False,
              'rlsWeakening': False,
              'mailChange': False,
              'rateLimitChange': False,
              'tokenContractChange': False,
              'webBffChange': False,
              'acceptanceRunnerChange': False,
              'guestFirstLoginMfaRequired': True,
              'guestIdleTimeoutTierPreserved': True,
            },
            'productionHosting': 'REG_RU_VPS_ONLY',
            'newRecurringCostRub': 0,
          }
          scope_path.write_text(json.dumps(scope, ensure_ascii=True, indent=2) + '\n', encoding='utf-8')
          PY

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'apps/api/src/modules/auth/auth.service.spec.ts'
            'apps/api/src/modules/auth/auth.service.ts'
            'docs/platform-v7/autopilot/scopes/p0-employee-guest-mfa-4884.json'
          )
          [[ "${#changed[@]}" == "${#expected[@]}" ]]
          for i in "${!expected[@]}"; do [[ "${changed[$i]}" == "${expected[$i]}" ]]; done
          git diff --check

      - name: Run focused API verification
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @pc/api exec prisma generate
          pnpm --filter @pc/api exec jest src/modules/auth/auth.service.spec.ts src/modules/auth/session-idle-timeout.spec.ts --runInBand
          pnpm --filter @pc/api exec tsc -p tsconfig.json --noEmit

      - name: Commit bounded fix to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/api/src/modules/auth/auth.service.ts \
            apps/api/src/modules/auth/auth.service.spec.ts \
            docs/platform-v7/autopilot/scopes/p0-employee-guest-mfa-4884.json
          git commit -m 'fix(auth): require MFA for employee guest (#4884)'
          git push origin "HEAD:$HEAD_REF"
