name: PC-CROP Predecessor Trigger Governance

on:
  pull_request:
    paths:
      - '.github/workflows/pc-crop-07a.yml'
      - '.github/workflows/pc-crop-07b.yml'
      - '.github/workflows/pc-crop-08b.yml'
      - '.github/workflows/pc-crop-08c.yml'
      - '.github/workflows/pc-crop-08d.yml'
      - '.github/workflows/pc-crop-08f.yml'
      - '.github/workflows/pc-crop-predecessor-trigger-governance.yml'
      - 'docs/platform-v7/autopilot/pc-crop-predecessor-trigger-lock.json'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-predecessor-trigger-isolation-3170.json'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-successor-trigger-handoff-3290.json'
      - 'scripts/pc-crop-predecessor-trigger-governance.mjs'
      - 'scripts/pc-crop-successor-trigger-governance.mjs'
      - 'scripts/test-pc-crop-predecessor-07b-compat.mjs'
      - 'scripts/p7-source-controlled-scope.mjs'
      - 'scripts/verify-pc-crop-07b-routing-compat.py'
      - 'scripts/test-pc-crop-07b-routing-compat.py'
      - 'apps/web/tests/unit/platformV7IntegrationControlTower.test.ts'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-predecessor-5580-20261011.json'
      - 'docs/platform-v7/autopilot/scopes/governance-pc-crop-predecessor-5580-20261011.json'
      - 'apps/web/middleware.ts'
      - 'apps/web/next.config.js'
      - 'apps/web/app/platform-v7/integrations/page.tsx'
      - 'apps/web/tests/unit/platformV7BankPaymentBasisRoutesManifest.test.ts'
  push:
    branches:
      - main
      - governance/pc-crop-predecessor-trigger-isolation-3170
    paths:
      - '.github/workflows/pc-crop-07a.yml'
      - '.github/workflows/pc-crop-07b.yml'
      - '.github/workflows/pc-crop-08b.yml'
      - '.github/workflows/pc-crop-08c.yml'
      - '.github/workflows/pc-crop-08d.yml'
      - '.github/workflows/pc-crop-08f.yml'
      - '.github/workflows/pc-crop-predecessor-trigger-governance.yml'
      - 'docs/platform-v7/autopilot/pc-crop-predecessor-trigger-lock.json'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-predecessor-trigger-isolation-3170.json'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-successor-trigger-handoff-3290.json'
      - 'scripts/pc-crop-predecessor-trigger-governance.mjs'
      - 'scripts/pc-crop-successor-trigger-governance.mjs'
      - 'scripts/test-pc-crop-predecessor-07b-compat.mjs'
      - 'scripts/p7-source-controlled-scope.mjs'
      - 'scripts/verify-pc-crop-07b-routing-compat.py'
      - 'scripts/test-pc-crop-07b-routing-compat.py'
      - 'apps/web/tests/unit/platformV7IntegrationControlTower.test.ts'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-predecessor-5580-20261011.json'
      - 'docs/platform-v7/autopilot/scopes/governance-pc-crop-predecessor-5580-20261011.json'
      - 'apps/web/middleware.ts'
      - 'apps/web/next.config.js'
      - 'apps/web/app/platform-v7/integrations/page.tsx'
      - 'apps/web/tests/unit/platformV7BankPaymentBasisRoutesManifest.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predecessor-trigger-governance:
    name: Exact ownership paths · immutable predecessor jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVIDENCE_DIR: artifacts/pc-crop-predecessor-trigger-governance
      GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify governance programs
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pc-crop-predecessor-trigger-governance.mjs
          node --check scripts/pc-crop-successor-trigger-governance.mjs

      - name: Fetch pinned successor workflow authority
        shell: bash
        run: |
          set -euo pipefail
          scope='docs/platform-v7/autopilot/scopes/pc-crop-successor-trigger-handoff-3290.json'
          successor_branch="$(node -e "const s=JSON.parse(require('node:fs').readFileSync('$scope','utf8')); process.stdout.write(s.handoffs.successorBranch)")"
          successor_commit="$(node -e "const s=JSON.parse(require('node:fs').readFileSync('$scope','utf8')); process.stdout.write(s.handoffs.successorCommit)")"
          test -n "$successor_branch"
          test -n "$successor_commit"
          git fetch --no-tags origin "$successor_branch"
          git cat-file -e "${successor_commit}^{commit}"

      - name: Apply canonical predecessor triggers
        run: node scripts/pc-crop-predecessor-trigger-governance.mjs --apply

      - name: Validate complete accepted-base finish SOURCE scope
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_HEAD_REF" in
            fix/pc-crop-predecessor-5580-20261011)
              # This separately admitted validator change needs full nonauthor
              # current-head review; its own test result is not trusted code approval.
              BASE_REF="$GOVERNANCE_BASE_SHA" HEAD_REF="$EXACT_HEAD" \
                node scripts/p7-source-controlled-scope.mjs
              ;;
            fix/pc-crop-07b-routing-5580-20261011|fix/protected-entry-locale-5580-20261011)
              # Run accepted-base bytes, independently of candidate validators
              # and of the shell guard's early empty-merge-base-diff return.
              trusted_helper="$(mktemp --suffix=.mjs)"
              trap 'rm -f "$trusted_helper"' EXIT
              git show "$GOVERNANCE_BASE_SHA:scripts/p7-source-controlled-scope.mjs" > "$trusted_helper"
              BASE_REF="$GOVERNANCE_BASE_SHA" HEAD_REF="$EXACT_HEAD" node "$trusted_helper"
              ;;
          esac

      - name: Test exact admitted PC-CROP-07B variant and rejection vectors
        run: node --test scripts/test-pc-crop-predecessor-07b-compat.mjs

      - name: Verify historical preservation for the current combined admission
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_HEAD_REF" == 'fix/pc-crop-predecessor-5580-20261011' ]]; then
            python3 scripts/test-pc-crop-07b-routing-compat.py --verify-admitted-compatibility
          fi

      - name: Prove successor trigger handoff contract
        run: node scripts/pc-crop-successor-trigger-governance.mjs

      - name: Enforce idempotent clean authority
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > "$EVIDENCE_DIR/working-tree-files.txt"
          test ! -s "$EVIDENCE_DIR/working-tree-files.txt"
          test -f docs/platform-v7/autopilot/pc-crop-predecessor-trigger-lock.json
          test -f docs/platform-v7/autopilot/scopes/pc-crop-successor-trigger-handoff-3290.json
          test -s "$EVIDENCE_DIR/successor-trigger-handoff.json"

      - name: Upload governance evidence and migration bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-crop-predecessor-trigger-governance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/pc-crop-predecessor-trigger-governance
            .github/workflows/pc-crop-07a.yml
            .github/workflows/pc-crop-07b.yml
            .github/workflows/pc-crop-08b.yml
            .github/workflows/pc-crop-08c.yml
            .github/workflows/pc-crop-08d.yml
            .github/workflows/pc-crop-08f.yml
            docs/platform-v7/autopilot/pc-crop-predecessor-trigger-lock.json
            docs/platform-v7/autopilot/scopes/pc-crop-successor-trigger-handoff-3290.json
          if-no-files-found: error
          retention-days: 90
