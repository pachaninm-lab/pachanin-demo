name: Exact-Head Crypto Inventory Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-head-crypto-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Generate exact-head inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/crypto-inventory
          SOURCE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'             node scripts/security/discover-cryptography.mjs               artifacts/crypto-inventory/cryptographic-inventory.json               artifacts/crypto-inventory/CRYPTOGRAPHIC_INVENTORY.md
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > artifacts/crypto-inventory/exact-head.txt

      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-crypto-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/crypto-inventory
          if-no-files-found: error
          retention-days: 7
