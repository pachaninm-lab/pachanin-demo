name: Production Auth-Mail Worker Current Readiness v8

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-auth-mail-worker-current-readiness-v8.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-auth-mail-worker-current-readiness-v8
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  DEPLOYED_PRODUCTION_SHA: f166f50e8526cf43f3193e771be05ebc66888494
  DIAGNOSTIC_COMMAND: /production p0-auth-mail-worker-current-v8 deployed
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate read-only current-worker diagnostic contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce read-only service inspection boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/production-auth-mail-worker-current-readiness-v8.yml').read_text(encoding='utf-8')
          required=['CURRENT_WORKER_CARDINALITY','WORKER_REVISION','WORKER_IMAGE_PARITY','WORKER_STATE','WORKER_HEALTH','WORKER_RESTARTED','WORKER_USER_BOUNDARY','WORKER_COMMAND_BOUNDARY','WORKER_NETWORK_PARITY','WORKER_ENV_BOUNDARY','WORKER_MOUNT_BOUNDARY','STARTUP_CODE','CURRENT_WORKER_READY','PRODUCTION_MUTATION NONE']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('missing invariant: '+' | '.join(missing))
          diagnostic=text.split('\n  diagnostic:\n',1)[1]
          forbidden=['docker restart','docker rm','docker compose','docker exec','docker run','sendAuthMailSmtp','claimBatch','expireStale','AUTH PLAIN','AUTH LOGIN','SMTP AUTH','UPDATE auth.','INSERT INTO','DELETE FROM','ALTER ROLE','CREATE ROLE','DROP ROLE','PASSWORD_RESET_REPLAYED YES']
          bad=[x for x in forbidden if x in diagnostic]
          if bad: raise SystemExit('unsafe diagnostic surface: '+' | '.join(bad))
          PY

  diagnostic:
    name: Inspect current auth-mail worker without mutation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-worker-current-v8 deployed' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind current main to deployed auth-mail code
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$main_sha" ]]
          git cat-file -e "${DEPLOYED_PRODUCTION_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOYED_PRODUCTION_SHA" "$main_sha"
          git diff --quiet "$DEPLOYED_PRODUCTION_SHA..$main_sha" -- \
            apps/api/src/auth-mail-worker.ts \
            apps/api/src/modules/auth-mail/auth-mail-crypto.ts \
            apps/api/src/modules/auth-mail/auth-mail-smtp.ts \
            infra/docker/Dockerfile.api \
            scripts/provision-production-auth-mail-runtime.sh \
            scripts/production-auth-mail-outbox-cutover-core.sh
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || exit 10
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$ready" == 1 ]] || exit 15
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; python3 --version >/dev/null; echo SSH_AUTH_OK' | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Inspect current service parity and readiness
        id: diagnostic
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"; clean="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$DEPLOYED_PRODUCTION_SHA'" > "$raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          deployed_sha="$1"
          emit(){ printf '%s=%s\n' "$1" "$2"; }
          fail(){ emit AUTH_MAIL_CURRENT_DIAGNOSTIC FAIL; emit ERROR_CODE "$1"; emit PRODUCTION_MUTATION NONE; exit "${2:-1}"; }
          [[ "$(id -u)" -eq 0 ]] || fail ROOT_REQUIRED 20
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || fail DEPLOYED_SHA_INVALID 21

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || fail WEB_CARDINALITY_NOT_ONE 22
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          [[ -n "$project" ]] || fail COMPOSE_PROJECT_MISSING 23
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} == 1 )) || fail API_CARDINALITY_NOT_ONE 24
          api_id="${api_ids[0]}"
          api_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id" 2>/dev/null || true)"
          web_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id" 2>/dev/null || true)"
          [[ "$api_revision" == "$deployed_sha" && "$web_revision" == "$deployed_sha" ]] || fail API_WEB_REVISION_DRIFT 25

          mapfile -t worker_ids < <(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker')
          emit CURRENT_WORKER_CARDINALITY "${#worker_ids[@]}"
          (( ${#worker_ids[@]} == 1 )) || fail CURRENT_WORKER_CARDINALITY_NOT_ONE 26
          worker_id="${worker_ids[0]}"

          worker_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$worker_id" 2>/dev/null || true)"
          [[ "$worker_revision" == "$deployed_sha" ]] && revision=PASS || revision=DRIFT
          emit WORKER_REVISION "$revision"
          api_image_id="$(docker inspect --format '{{.Image}}' "$api_id" 2>/dev/null || true)"
          worker_image_id="$(docker inspect --format '{{.Image}}' "$worker_id" 2>/dev/null || true)"
          [[ -n "$api_image_id" && "$worker_image_id" == "$api_image_id" ]] && image_parity=PASS || image_parity=DRIFT
          emit WORKER_IMAGE_PARITY "$image_parity"

          state="$(docker inspect --format '{{.State.Status}}' "$worker_id" 2>/dev/null || true)"
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id" 2>/dev/null || true)"
          restart_count="$(docker inspect --format '{{.RestartCount}}' "$worker_id" 2>/dev/null || true)"
          [[ "$state" =~ ^(created|running|paused|restarting|removing|exited|dead)$ ]] || state=unknown
          [[ "$health" =~ ^(none|starting|healthy|unhealthy)$ ]] || health=unknown
          [[ "$restart_count" =~ ^[0-9]+$ ]] || restart_count=0
          emit WORKER_STATE "$state"; emit WORKER_HEALTH "$health"
          (( restart_count > 0 )) && emit WORKER_RESTARTED YES || emit WORKER_RESTARTED NO

          user_value="$(docker inspect --format '{{.Config.User}}' "$worker_id" 2>/dev/null || true)"
          case "$user_value" in ''|0|0:0|root|root:root) user_boundary=FAIL;; *) user_boundary=PASS;; esac
          emit WORKER_USER_BOUNDARY "$user_boundary"

          cmd_json="$(docker inspect --format '{{json .Config.Cmd}}' "$worker_id" 2>/dev/null || true)"
          entry_json="$(docker inspect --format '{{json .Config.Entrypoint}}' "$worker_id" 2>/dev/null || true)"
          if python3 - "$cmd_json" "$entry_json" <<'PY'
          import json,sys
          cmd=json.loads(sys.argv[1]); entry=json.loads(sys.argv[2])
          if cmd != ['dist/apps/api/src/auth-mail-worker.js']: raise SystemExit(1)
          if entry != ['/nodejs/bin/node']: raise SystemExit(1)
          PY
          then command_boundary=PASS; else command_boundary=FAIL; fi
          emit WORKER_COMMAND_BOUNDARY "$command_boundary"

          api_networks="$(docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$api_id" | sed '/^$/d' | sort -u)"
          worker_networks="$(docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$worker_id" | sed '/^$/d' | sort -u)"
          [[ -n "$api_networks" && "$worker_networks" == "$api_networks" ]] && network_parity=PASS || network_parity=FAIL
          emit WORKER_NETWORK_PARITY "$network_parity"

          env_file="$(mktemp)"; mounts_file="$(mktemp)"
          trap 'rm -f "$env_file" "$mounts_file"' EXIT
          chmod 0600 "$env_file" "$mounts_file"
          docker inspect --format '{{json .Config.Env}}' "$worker_id" > "$env_file"
          docker inspect --format '{{json .Mounts}}' "$worker_id" > "$mounts_file"
          if python3 - "$env_file" <<'PY'
          import json,sys
          values={}
          for item in json.load(open(sys.argv[1],encoding='utf-8')) or []:
              k,sep,v=str(item).partition('=')
              if sep: values[k]=v
          expected={'NODE_ENV':'production','RUNTIME_COMPONENT':'auth-mail-worker','AUTH_MAIL_WORKER_ENABLED':'true','AUTH_MAIL_WORKER_HEALTH_PORT':'3003','AUTH_MAIL_OUTBOX_KEYRING_DIR':'/run/pc-auth-mail/keyring','AUTH_MAIL_OUTBOX_CURRENT_KEY_VERSION_FILE':'/run/pc-auth-mail/current-key-version','AUTH_MAIL_DATABASE_URL_FILE':'/run/pc-auth-mail/database-url','AUTH_MAIL_TRANSPORT_FILE':'/run/pc-auth-mail/transport.env'}
          if any(values.get(k)!=v for k,v in expected.items()): raise SystemExit(1)
          if any(k in values for k in ('PC_SMTP_PASS','AUTH_MAIL_DATABASE_URL','DATABASE_URL','AUTH_DATABASE_URL')): raise SystemExit(1)
          PY
          then env_boundary=PASS; else env_boundary=FAIL; fi
          emit WORKER_ENV_BOUNDARY "$env_boundary"

          if python3 - "$mounts_file" <<'PY'
          import json,sys
          expected={'/run/pc-auth-mail/keyring':'/var/lib/pc-secret-authority/runtime/keyring','/run/pc-auth-mail/current-key-version':'/var/lib/pc-secret-authority/runtime/current-key-version','/run/pc-auth-mail/database-url':'/var/lib/pc-secret-authority/runtime/database-url','/run/pc-auth-mail/transport.env':'/var/lib/pc-secret-authority/runtime/transport.env'}
          seen={}
          for m in json.load(open(sys.argv[1],encoding='utf-8')) or []:
              d=str(m.get('Destination') or '')
              if d in expected: seen[d]=(str(m.get('Source') or ''),bool(m.get('RW')))
          if any(seen.get(d)!=(s,False) for d,s in expected.items()): raise SystemExit(1)
          PY
          then mount_boundary=PASS; else mount_boundary=FAIL; fi
          emit WORKER_MOUNT_BOUNDARY "$mount_boundary"

          startup_codes="$(docker logs --tail 300 "$worker_id" 2>&1 | sed -nE 's/^Auth-mail worker failed to start: ([A-Z0-9_]{1,120})$/\1/p' | sort -u || true)"
          startup_count="$(grep -c . <<< "$startup_codes" || true)"
          if [[ "$startup_count" == 0 ]]; then startup_code=NONE; elif [[ "$startup_count" == 1 ]]; then startup_code="$startup_codes"; else startup_code=MULTIPLE_SAFE_CODES; fi
          [[ "$startup_code" =~ ^[A-Z0-9_]{1,120}$ ]] || startup_code=INVALID_SAFE_CODE
          emit STARTUP_CODE "$startup_code"

          ready=PASS
          [[ "$revision" == PASS && "$image_parity" == PASS && "$state" == running && "$health" == healthy && "$user_boundary" == PASS && "$command_boundary" == PASS && "$network_parity" == PASS && "$env_boundary" == PASS && "$mount_boundary" == PASS && "$startup_code" == NONE ]] || ready=FAIL
          emit CURRENT_WORKER_READY "$ready"
          emit AUTH_MAIL_CURRENT_DIAGNOSTIC PASS
          emit ERROR_CODE NONE
          emit PRODUCTION_MUTATION NONE
          REMOTE
          remote_rc=$?
          set -e
          sed -nE '/^(AUTH_MAIL_CURRENT_DIAGNOSTIC|ERROR_CODE|CURRENT_WORKER_CARDINALITY|WORKER_REVISION|WORKER_IMAGE_PARITY|WORKER_STATE|WORKER_HEALTH|WORKER_RESTARTED|WORKER_USER_BOUNDARY|WORKER_COMMAND_BOUNDARY|WORKER_NETWORK_PARITY|WORKER_ENV_BOUNDARY|WORKER_MOUNT_BOUNDARY|STARTUP_CODE|CURRENT_WORKER_READY|PRODUCTION_MUTATION)=[A-Za-z0-9_.:-]{1,160}$/p' "$raw" > "$clean"
          rm -f "$raw"; cat "$clean"; echo "rc=$remote_rc" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r k v; do
            case "$k" in
              AUTH_MAIL_CURRENT_DIAGNOSTIC|ERROR_CODE|CURRENT_WORKER_CARDINALITY|WORKER_REVISION|WORKER_IMAGE_PARITY|WORKER_STATE|WORKER_HEALTH|WORKER_RESTARTED|WORKER_USER_BOUNDARY|WORKER_COMMAND_BOUNDARY|WORKER_NETWORK_PARITY|WORKER_ENV_BOUNDARY|WORKER_MOUNT_BOUNDARY|STARTUP_CODE|CURRENT_WORKER_READY|PRODUCTION_MUTATION) echo "${k,,}=$v" >> "$GITHUB_OUTPUT";;
            esac
          done < "$clean"
          rm -f "$clean"

      - name: Publish bounded current-worker evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
          DIAGNOSTIC: ${{ steps.diagnostic.outputs.auth_mail_current_diagnostic }}
          ERROR_CODE: ${{ steps.diagnostic.outputs.error_code }}
          CARDINALITY: ${{ steps.diagnostic.outputs.current_worker_cardinality }}
          REVISION: ${{ steps.diagnostic.outputs.worker_revision }}
          IMAGE_PARITY: ${{ steps.diagnostic.outputs.worker_image_parity }}
          STATE: ${{ steps.diagnostic.outputs.worker_state }}
          HEALTH: ${{ steps.diagnostic.outputs.worker_health }}
          RESTARTED: ${{ steps.diagnostic.outputs.worker_restarted }}
          USER_BOUNDARY: ${{ steps.diagnostic.outputs.worker_user_boundary }}
          COMMAND_BOUNDARY: ${{ steps.diagnostic.outputs.worker_command_boundary }}
          NETWORK_PARITY: ${{ steps.diagnostic.outputs.worker_network_parity }}
          ENV_BOUNDARY: ${{ steps.diagnostic.outputs.worker_env_boundary }}
          MOUNT_BOUNDARY: ${{ steps.diagnostic.outputs.worker_mount_boundary }}
          STARTUP_CODE: ${{ steps.diagnostic.outputs.startup_code }}
          READY: ${{ steps.diagnostic.outputs.current_worker_ready }}
          MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP current auth-mail worker readiness v8'; echo
            echo "- diagnostic main: \`${MAIN_SHA:-unknown}\`"
            echo "- diagnostic / safe error: \`${DIAGNOSTIC:-unknown} / ${ERROR_CODE:-unknown}\`"
            echo "- current worker cardinality: \`${CARDINALITY:-unknown}\`"
            echo "- revision / image parity: \`${REVISION:-unknown} / ${IMAGE_PARITY:-unknown}\`"
            echo "- state / health / restarted: \`${STATE:-unknown} / ${HEALTH:-unknown} / ${RESTARTED:-unknown}\`"
            echo "- user / command / network: \`${USER_BOUNDARY:-unknown} / ${COMMAND_BOUNDARY:-unknown} / ${NETWORK_PARITY:-unknown}\`"
            echo "- env / mounts: \`${ENV_BOUNDARY:-unknown} / ${MOUNT_BOUNDARY:-unknown}\`"
            echo "- startup code: \`${STARTUP_CODE:-unknown}\`"
            echo "- current worker ready: \`${READY:-unknown}\`"
            echo "- production mutation: \`${MUTATION:-unknown}\`"
            echo '- raw logs, container/image IDs, labels, environment values, database URLs, credentials and secret values are never published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Enforce current worker readiness result
        shell: bash
        env:
          REMOTE_RC: ${{ steps.diagnostic.outputs.rc }}
          DIAGNOSTIC: ${{ steps.diagnostic.outputs.auth_mail_current_diagnostic }}
          READY: ${{ steps.diagnostic.outputs.current_worker_ready }}
          MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          [[ "${REMOTE_RC:-1}" == 0 ]]
          [[ "$DIAGNOSTIC" == PASS ]]
          [[ "$READY" == PASS ]]
          [[ "$MUTATION" == NONE ]]
