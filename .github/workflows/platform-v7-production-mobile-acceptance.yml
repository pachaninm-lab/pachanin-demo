name: Platform V7 Production Mobile Acceptance

on:
  workflow_run:
    workflows:
      - 'Production Web Exact-SHA Release'
      - 'Production Web Owner Exact-SHA Command'
      - 'platform-v7 safe merge'
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full deployed main SHA; blank uses the selected ref SHA'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: platform-v7-production-mobile-acceptance
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3048

jobs:
  accepted:
    name: Resolve accepted protected Web release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name != 'platform-v7 safe merge'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/production-release-accepted-sha.yml
    with:
      release_run_id: ${{ github.event.workflow_run.id }}
      manual_sha: ''

  accepted-full-stack:
    name: Verify nested owner-controlled full-stack deployment
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'platform-v7 safe merge' &&
      github.event.workflow_run.event == 'issue_comment' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deployment_accepted: ${{ steps.evidence.outputs.deployment_accepted }}
      accepted_sha: ${{ steps.evidence.outputs.accepted_sha }}
    steps:
      - name: Verify controller identity and nested deploy jobs
        id: controller
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_RUN_ID: ${{ github.event.workflow_run.id }}
          CONTROLLER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONTROLLER_SHA: ${{ github.event.workflow_run.head_sha }}
          CONTROLLER_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CONTROLLER_ACTOR: ${{ github.event.workflow_run.actor.login }}
          CONTROLLER_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_RUN_ID" =~ ^[0-9]+$ && "$CONTROLLER_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROLLER_REPOSITORY" == "$GITHUB_REPOSITORY" ]]

          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROLLER_RUN_ID")
          jq -e --argjson id "$CONTROLLER_RUN_ID" --argjson attempt "$CONTROLLER_ATTEMPT" \
            --arg sha "$CONTROLLER_SHA" \
            '.id == $id and .run_attempt == $attempt and .name == "platform-v7 safe merge" and
             .path == ".github/workflows/platform-v7-safe-merge.yml" and .event == "issue_comment" and
             .head_branch == "main" and .head_sha == $sha and .status == "completed" and
             .conclusion == "success" and .head_repository.full_name == .repository.full_name' \
            <<< "$run" >/dev/null

          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROLLER_RUN_ID/attempts/$CONTROLLER_ATTEMPT/jobs?per_page=100")
          jq -e '.total_count == (.jobs | length) and .total_count <= 100' <<< "$jobs" >/dev/null
          job_state() {
            jq -r --arg name "$1" \
              '[.jobs[] | select(.name == $name)] | if length == 1 then .[0].conclusion else "missing-or-ambiguous" end' \
              <<< "$jobs"
          }
          control=$(job_state 'production-release-control-3072')
          if [[ "$control" == skipped ]]; then
            echo 'No owner release command in this safe-merge run.'
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$control" == success ]]
          [[ "$CONTROLLER_ACTOR" == "$GITHUB_REPOSITORY_OWNER" &&
             "$CONTROLLER_TRIGGERING_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
          [[ "$(job_state 'production-full-stack-execution-3072 / Validate full-stack release contract')" == success ]]
          [[ "$(job_state 'production-full-stack-execution-3072 / Migrate, deploy API/web and canonical outbox, verify live delivery')" == success ]]
          [[ "$(job_state 'production-auth-mail-cutover-3072 / Cut over exact production to durable auth-mail worker')" == success ]]
          [[ "$(job_state 'production-reviewer-readiness-3072 / Read-only REG.RU reviewer login readiness')" == success ]]
          echo 'candidate=true' >> "$GITHUB_OUTPUT"

      - name: Download exact nested release evidence
        if: steps.controller.outputs.candidate == 'true'
        uses: actions/download-artifact@v4
        with:
          name: production-full-stack-release-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: nested-release-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Bind full-stack evidence to exact main and live deployment
        id: evidence
        if: steps.controller.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence=nested-release-evidence
          for file in sha256.txt target-sha.txt production-action.log live.log durable-intake-db.log ir20-observation.log; do
            [[ -f "$evidence/$file" ]]
          done
          (cd "$evidence" && sed 's#  artifacts/production-full-stack-release/#  #' sha256.txt | sha256sum --check --status --strict)
          [[ "$(tr -d '[:space:]' < "$evidence/target-sha.txt")" == "$CONTROLLER_SHA" ]]
          field() { sed -n "s/^$1=//p" "$evidence/$2" | tail -1 | tr -d '\r'; }
          [[ "$(field EXACT_IMAGE_SOURCE production-action.log)" == pinned-ssh ]]
          [[ "$(field MIGRATION_COMPLETE production-action.log)" == 1 ]]
          [[ "$(field DEPLOYMENT_COMPLETE production-action.log)" == 1 ]]
          [[ "$(field DEPLOYED_API_REVISION production-action.log)" == "$CONTROLLER_SHA" ]]
          [[ "$(field DEPLOYED_WEB_REVISION production-action.log)" == "$CONTROLLER_SHA" ]]
          [[ "$(field DEPLOYED_OUTBOX_WORKER_REVISION production-action.log)" == "$CONTROLLER_SHA" ]]
          [[ "$(field IR20_KAFKA_READY production-action.log)" == 1 ]]
          [[ "$(field IR20_OUTBOX_WORKER_READY production-action.log)" == 1 ]]
          [[ "$(field LIVE_ACCEPTANCE live.log)" == PASS ]]
          [[ "$(field DURABLE_INTAKE_DB durable-intake-db.log)" == PASS ]]
          [[ "$(field IR20_LIVE_OUTBOX_DELIVERY durable-intake-db.log)" == PASS ]]
          [[ "$(field IR20_RUNTIME_OBSERVATION ir20-observation.log)" == PASS ]]

          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$current_main" == "$CONTROLLER_SHA" ]] || {
            echo "Main advanced after the nested deployment: deployed=$CONTROLLER_SHA main=$current_main" >&2
            exit 19
          }
          echo "accepted_sha=$CONTROLLER_SHA" >> "$GITHUB_OUTPUT"
          echo 'deployment_accepted=true' >> "$GITHUB_OUTPUT"

  mobile-acceptance:
    name: Chromium + WebKit 320x700, 375x812, 390x844 and 430x932 production acceptance
    needs: [accepted, accepted-full-stack]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.accepted.outputs.deployment_accepted == 'true' ||
       needs.accepted-full-stack.outputs.deployment_accepted == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Resolve exact deployed SHA
        id: target
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          ACCEPTED_SHA: ${{ needs.accepted.outputs.accepted_sha }}
          FULL_STACK_SHA: ${{ needs.accepted-full-stack.outputs.accepted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && -n "${FULL_STACK_SHA:-}" ]]; then
            target_sha="$FULL_STACK_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_run && -n "${ACCEPTED_SHA:-}" ]]; then
            target_sha="$ACCEPTED_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            echo 'No accepted release evidence for this workflow run.' >&2
            exit 2
          elif [[ -n "${INPUT_TARGET_SHA:-}" ]]; then
            target_sha="$INPUT_TARGET_SHA"
          else
            target_sha="$GITHUB_SHA"
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 1

      - name: Verify exact public revision before browser acceptance
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$current_main" == "$TARGET_SHA" ]] || {
            echo "Main differs before mobile acceptance: target=$TARGET_SHA main=$current_main" >&2
            exit 19
          }
          evidence_dir='artifacts/platform-v7-production-mobile/live-revision'
          summary="$evidence_dir/attempts.tsv"
          mkdir -p "$evidence_dir"
          printf 'attempt\tmanifest_http\tmanifest_rc\tmanifest_sha\tpage_http\tpage_rc\n' > "$summary"

          accepted=0
          last_manifest_sha='missing'
          for attempt in $(seq 1 12); do
            cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            manifest_file="$evidence_dir/manifest-${attempt}.json"
            manifest_headers="$evidence_dir/manifest-${attempt}.headers"
            page_file="$evidence_dir/platform-${attempt}.html"
            page_headers="$evidence_dir/platform-${attempt}.headers"

            set +e
            manifest_http="$(curl --silent --show-error --location --compressed \
              --connect-timeout 10 --max-time 30 \
              -D "$manifest_headers" -o "$manifest_file" -w '%{http_code}' \
              "$LIVE_BASE/manifest-pc-deploy.json?mobile-acceptance=$cache_bust")"
            manifest_rc=$?
            page_http="$(curl --silent --show-error --location --compressed \
              --connect-timeout 10 --max-time 30 \
              -D "$page_headers" -o "$page_file" -w '%{http_code}' \
              "$LIVE_BASE/platform-v7?lang=ru&mobile-acceptance=$cache_bust")"
            page_rc=$?
            set -e

            manifest_sha="$(jq -r '.commitSha // empty' "$manifest_file" 2>/dev/null || true)"
            last_manifest_sha="${manifest_sha:-missing}"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$attempt" "${manifest_http:-000}" "$manifest_rc" "$last_manifest_sha" \
              "${page_http:-000}" "$page_rc" >> "$summary"

            if [[ "$manifest_rc" == 0 && "$page_rc" == 0 \
              && "$manifest_http" == 200 && "$page_http" == 200 \
              && "$manifest_sha" == "$TARGET_SHA" ]] \
              && grep -Fq 'data-testid="platform-v7-root-execution-cockpit"' "$page_file"; then
              cp "$manifest_file" "$evidence_dir/accepted-manifest.json"
              cp "$manifest_headers" "$evidence_dir/accepted-manifest.headers"
              cp "$page_file" "$evidence_dir/accepted-platform.html"
              cp "$page_headers" "$evidence_dir/accepted-platform.headers"
              printf 'PASS\n' > "$evidence_dir/result.txt"
              accepted=1
              break
            fi

            [[ "$attempt" == 12 ]] || sleep 5
          done

          echo "manifest_sha=$last_manifest_sha" >> "$GITHUB_OUTPUT"
          if (( accepted != 1 )); then
            printf 'FAIL\n' > "$evidence_dir/result.txt"
            echo "Exact public revision mismatch: expected=$TARGET_SHA manifest=$last_manifest_sha" >&2
            cat "$summary" >&2
            exit 3
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and WebKit runtimes
        run: pnpm --filter @pc/web exec playwright install --with-deps chromium webkit

      - name: Run exact dual-engine mobile viewport acceptance
        id: acceptance
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.LIVE_BASE }}
        run: pnpm --filter @pc/web exec playwright test --config=playwright.production-mobile.config.ts

      - name: Verify public Gekta burger handoff in Chromium and WebKit
        id: burger-handoff
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.LIVE_BASE }}
          EVIDENCE_DIR: ${{ github.workspace }}/artifacts/platform-v7-production-mobile/burger-handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          trap 'printf "FAIL\n" > "$EVIDENCE_DIR/result.txt"' ERR
          pnpm --filter @pc/web exec node --input-type=module <<'NODE'
          import { chromium, webkit } from '@playwright/test';

          const base = process.env.PLAYWRIGHT_BASE_URL;
          const evidence = process.env.EVIDENCE_DIR;
          if (!base || !evidence) throw new Error('burger handoff environment missing');

          for (const [engine, browserType] of [['chromium', chromium], ['webkit', webkit]]) {
            const browser = await browserType.launch({ headless: true });
            try {
              const page = await browser.newPage({
                viewport: { width: 390, height: 844 },
                locale: 'ru-RU',
                timezoneId: 'Europe/Moscow',
              });
              const response = await page.goto(
                `${base}/platform-v7?lang=ru&burger-handoff=${Date.now()}`,
                { waitUntil: 'load', timeout: 30_000 },
              );
              if (!response?.ok()) throw new Error(`${engine}: public home HTTP ${response?.status() ?? 'missing'}`);

              const dock = page.locator(".pc-public-contact-dock[data-assistant-context='public'][data-public-mode='gekta']");
              const launcher = dock.locator('.pc-public-contact-dock-assistant');
              const bottomNav = page.locator('.pc-cp-bottom-nav');
              await dock.waitFor({ state: 'visible', timeout: 15_000 });
              await launcher.waitFor({ state: 'visible', timeout: 15_000 });
              await bottomNav.waitFor({ state: 'visible', timeout: 15_000 });

              const [launcherBox, bottomBox] = await Promise.all([launcher.boundingBox(), bottomNav.boundingBox()]);
              if (!launcherBox || !bottomBox) throw new Error(`${engine}: launcher/nav geometry missing`);
              if (launcherBox.width < 44 || launcherBox.height < 44) {
                throw new Error(`${engine}: launcher below 44px (${launcherBox.width}x${launcherBox.height})`);
              }
              if (launcherBox.y + launcherBox.height > bottomBox.y - 4) {
                throw new Error(`${engine}: launcher overlaps bottom navigation`);
              }

              const menu = page.locator('details.pc-site-mobile-menu');
              const toggle = menu.locator('summary');
              await toggle.click();
              await page.waitForFunction(() => document.querySelector('details.pc-site-mobile-menu')?.hasAttribute('open'));
              await dock.waitFor({ state: 'hidden', timeout: 5_000 });
              await page.screenshot({ path: `${evidence}/${engine}-burger-open.png`, animations: 'disabled' });

              await toggle.click();
              await page.waitForFunction(() => !document.querySelector('details.pc-site-mobile-menu')?.hasAttribute('open'));
              await dock.waitFor({ state: 'visible', timeout: 5_000 });
              await launcher.waitFor({ state: 'visible', timeout: 5_000 });
              await page.screenshot({ path: `${evidence}/${engine}-burger-closed.png`, animations: 'disabled' });

              await launcher.click();
              const panel = page.locator('#pc-public-assistant-panel');
              await panel.waitFor({ state: 'visible', timeout: 15_000 });
              await panel.locator('textarea').waitFor({ state: 'visible', timeout: 15_000 });
              await page.screenshot({ path: `${evidence}/${engine}-assistant-panel.png`, animations: 'disabled' });
            } finally {
              await browser.close();
            }
          }
          NODE
          trap - ERR
          printf 'PASS\n' > "$EVIDENCE_DIR/result.txt"

      - name: Confirm exact main and live revision after browser acceptance
        id: final_revision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          INITIAL_REVISION_OUTCOME: ${{ steps.revision.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          BURGER_HANDOFF_OUTCOME: ${{ steps.burger-handoff.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INITIAL_REVISION_OUTCOME" == success && "$ACCEPTANCE_OUTCOME" == success && "$BURGER_HANDOFF_OUTCOME" == success ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          live_sha=$(curl --fail --silent --show-error --location --compressed \
            --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
            "$LIVE_BASE/manifest-pc-deploy.json?mobile-final=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | jq -r '.commitSha // empty')
          [[ "$live_sha" == "$TARGET_SHA" ]]
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$current_main" == "$TARGET_SHA" ]] || {
            echo "Main advanced during mobile acceptance: target=$TARGET_SHA main=$current_main" >&2
            exit 19
          }

      - name: Publish mobile acceptance record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          REVISION_OUTCOME: ${{ steps.revision.outcome }}
          MANIFEST_SHA: ${{ steps.revision.outputs.manifest_sha }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          BURGER_HANDOFF_OUTCOME: ${{ steps.burger-handoff.outcome }}
          FINAL_REVISION_OUTCOME: ${{ steps.final_revision.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/platform-v7-production-mobile
          [[ "$REVISION_OUTCOME" == success ]] && revision_result=PASS || revision_result=FAIL
          [[ "$FINAL_REVISION_OUTCOME" == success ]] && final_revision_result=PASS || final_revision_result=FAIL
          [[ "$BURGER_HANDOFF_OUTCOME" == success ]] && burger_result=PASS || burger_result=FAIL
          if [[ "$ACCEPTANCE_OUTCOME" == success && "$FINAL_REVISION_OUTCOME" == success ]]; then
            result=PASS
          elif [[ "$ACCEPTANCE_OUTCOME" == failure || "$FINAL_REVISION_OUTCOME" == failure ]]; then
            result=FAIL
          else
            result=NOT_RUN
          fi
          record=artifacts/platform-v7-production-mobile/issue-comment.md
          {
            echo "## Platform V7 + Gekta production mobile acceptance \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo
            echo "- target SHA: \`$TARGET_SHA\`"
            echo "- exact public revision gate: \`$revision_result\`"
            echo "- final exact main/live revision gate: \`$final_revision_result\`"
            echo "- Gekta burger open/hide/close/restore and real assistant panel (Chromium + WebKit): \`$burger_result\`"
            echo "- manifest revision: \`${MANIFEST_SHA:-missing}\`"
            echo "- browser engines: \`Chromium + WebKit\`"
            echo "- retries: \`0\`"
            echo "- Gekta viewport 320×700: \`$result\`"
            echo "- Gekta viewport 375×812: \`$result\`"
            echo "- Platform V7 + Gekta viewport 390×844: \`$result\`"
            echo "- Platform V7 + Gekta viewport 430×932: \`$result\`"
            echo "- Gekta mobile history, chat, composer and sources: \`$result\`"
            echo "- Gekta EN/ZH canonical mobile smoke: \`$result\`"
            echo "- horizontal overflow: \`$result\`"
            echo "- 44 px Gekta primary touch targets: \`$result\`"
            echo "- mobile Trust cards one-column/readable contract: \`$result\`"
            echo "- Market RU/EN/ZH never accepts unavailable as PASS: \`$result\`"
            echo "- linked public pages RU/EN/ZH: \`$result\`"
            echo "- Gekta launcher above bottom navigation: \`$result\`"
            if [[ "$result" == PASS ]]; then
              echo "- failures: \`0\`"
            else
              echo "- failures: \`nonzero-or-not-run\`"
            fi
            echo "- Platform V7 sticky header, anchors and Deal workspace: \`$result\`"
            echo "- screenshots and traces: workflow artifact"
            echo "- workflow run ID: \`$GITHUB_RUN_ID\`"
            echo "- workflow run attempt: \`$GITHUB_RUN_ATTEMPT\`"
          } > "$record"
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"

      - name: Build visual evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='artifacts/platform-v7-production-mobile'
          mkdir -p "$evidence_dir"
          roots=("$evidence_dir")
          for candidate in apps/web/test-results/production-mobile apps/web/playwright-report-production-mobile; do
            [[ ! -e "$candidate" ]] || roots+=("$candidate")
          done
          printf '%s\n' '${{ steps.target.outputs.target_sha }}' > "$evidence_dir/target-sha.txt"
          printf '%s\n' '${{ steps.revision.outcome }}' > "$evidence_dir/revision-outcome.txt"
          printf '%s\n' '${{ steps.acceptance.outcome }}' > "$evidence_dir/outcome.txt"
          printf '%s\n' '${{ steps.burger-handoff.outcome }}' > "$evidence_dir/burger-handoff-outcome.txt"
          printf '%s\n' '${{ steps.final_revision.outcome }}' > "$evidence_dir/final-revision-outcome.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/run-attempt.txt"
          printf '%s\n' 'chromium' 'webkit' > "$evidence_dir/browser-engines.txt"
          find "${roots[@]}" -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > "$evidence_dir/sha256.txt"

      - name: Upload production mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v7-production-mobile-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            apps/web/test-results/production-mobile
            apps/web/playwright-report-production-mobile
            artifacts/platform-v7-production-mobile
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Enforce mobile acceptance result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.revision.outcome }}' == success ]] || exit 41
          [[ '${{ steps.acceptance.outcome }}' == success ]] || exit 40
          [[ '${{ steps.burger-handoff.outcome }}' == success ]] || exit 43
          [[ '${{ steps.final_revision.outcome }}' == success ]] || exit 42
