name: Platform V7 Production Mobile Acceptance

on:
  workflow_run:
    workflows:
      - 'Production Web Exact-SHA Release'
      - 'Production Web Owner Exact-SHA Command'
      - 'Production Full-Stack Exact-SHA Release'
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full deployed main SHA; blank uses the selected ref SHA'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: platform-v7-production-mobile-acceptance
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3048

jobs:
  accepted:
    name: Resolve accepted protected Web release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/production-release-accepted-sha.yml
    with:
      release_run_id: ${{ github.event.workflow_run.id }}
      manual_sha: ''

  mobile-acceptance:
    name: Chromium + WebKit 320x700, 375x812, 390x844 and 430x932 production acceptance
    needs: accepted
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'Production Full-Stack Exact-SHA Release') ||
       needs.accepted.outputs.deployment_accepted == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Resolve exact deployed SHA
        id: target
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          ACCEPTED_SHA: ${{ needs.accepted.outputs.accepted_sha }}
          RELEASE_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && -n "${ACCEPTED_SHA:-}" ]]; then
            target_sha="$ACCEPTED_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            target_sha="$RELEASE_TARGET_SHA"
          elif [[ -n "${INPUT_TARGET_SHA:-}" ]]; then
            target_sha="$INPUT_TARGET_SHA"
          else
            target_sha="$GITHUB_SHA"
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 1

      - name: Verify exact public revision before browser acceptance
        id: revision
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='artifacts/platform-v7-production-mobile/live-revision'
          summary="$evidence_dir/attempts.tsv"
          mkdir -p "$evidence_dir"
          printf 'attempt\tmanifest_http\tmanifest_rc\tmanifest_sha\tpage_http\tpage_rc\n' > "$summary"

          accepted=0
          last_manifest_sha='missing'
          for attempt in $(seq 1 12); do
            cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            manifest_file="$evidence_dir/manifest-${attempt}.json"
            manifest_headers="$evidence_dir/manifest-${attempt}.headers"
            page_file="$evidence_dir/platform-${attempt}.html"
            page_headers="$evidence_dir/platform-${attempt}.headers"

            set +e
            manifest_http="$(curl --silent --show-error --location --compressed \
              --connect-timeout 10 --max-time 30 \
              -D "$manifest_headers" -o "$manifest_file" -w '%{http_code}' \
              "$LIVE_BASE/manifest-pc-deploy.json?mobile-acceptance=$cache_bust")"
            manifest_rc=$?
            page_http="$(curl --silent --show-error --location --compressed \
              --connect-timeout 10 --max-time 30 \
              -D "$page_headers" -o "$page_file" -w '%{http_code}' \
              "$LIVE_BASE/platform-v7?lang=ru&mobile-acceptance=$cache_bust")"
            page_rc=$?
            set -e

            manifest_sha="$(jq -r '.commitSha // empty' "$manifest_file" 2>/dev/null || true)"
            last_manifest_sha="${manifest_sha:-missing}"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$attempt" "${manifest_http:-000}" "$manifest_rc" "$last_manifest_sha" \
              "${page_http:-000}" "$page_rc" >> "$summary"

            if [[ "$manifest_rc" == 0 && "$page_rc" == 0 \
              && "$manifest_http" == 200 && "$page_http" == 200 \
              && "$manifest_sha" == "$TARGET_SHA" ]] \
              && grep -Fq 'data-testid="platform-v7-root-execution-cockpit"' "$page_file"; then
              cp "$manifest_file" "$evidence_dir/accepted-manifest.json"
              cp "$manifest_headers" "$evidence_dir/accepted-manifest.headers"
              cp "$page_file" "$evidence_dir/accepted-platform.html"
              cp "$page_headers" "$evidence_dir/accepted-platform.headers"
              printf 'PASS\n' > "$evidence_dir/result.txt"
              accepted=1
              break
            fi

            [[ "$attempt" == 12 ]] || sleep 5
          done

          echo "manifest_sha=$last_manifest_sha" >> "$GITHUB_OUTPUT"
          if (( accepted != 1 )); then
            printf 'FAIL\n' > "$evidence_dir/result.txt"
            echo "Exact public revision mismatch: expected=$TARGET_SHA manifest=$last_manifest_sha" >&2
            cat "$summary" >&2
            exit 3
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and WebKit runtimes
        run: pnpm --filter @pc/web exec playwright install --with-deps chromium webkit

      - name: Run exact dual-engine mobile viewport acceptance
        id: acceptance
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.LIVE_BASE }}
        run: pnpm --filter @pc/web exec playwright test --config=playwright.production-mobile.config.ts

      - name: Publish mobile acceptance record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          REVISION_OUTCOME: ${{ steps.revision.outcome }}
          MANIFEST_SHA: ${{ steps.revision.outputs.manifest_sha }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/platform-v7-production-mobile
          [[ "$REVISION_OUTCOME" == success ]] && revision_result=PASS || revision_result=FAIL
          case "$ACCEPTANCE_OUTCOME" in success) result=PASS ;; failure) result=FAIL ;; *) result=NOT_RUN ;; esac
          record=artifacts/platform-v7-production-mobile/issue-comment.md
          {
            echo "## Platform V7 + Gekta production mobile acceptance \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo
            echo "- target SHA: \`$TARGET_SHA\`"
            echo "- exact public revision gate: \`$revision_result\`"
            echo "- manifest revision: \`${MANIFEST_SHA:-missing}\`"
            echo "- browser engines: \`Chromium + WebKit\`"
            echo "- retries: \`0\`"
            echo "- Gekta viewport 320×700: \`$result\`"
            echo "- Gekta viewport 375×812: \`$result\`"
            echo "- Platform V7 + Gekta viewport 390×844: \`$result\`"
            echo "- Platform V7 + Gekta viewport 430×932: \`$result\`"
            echo "- Gekta mobile history, chat, composer and sources: \`$result\`"
            echo "- Gekta EN/ZH canonical mobile smoke: \`$result\`"
            echo "- horizontal overflow: \`$result\`"
            echo "- 44 px Gekta primary touch targets: \`$result\`"
            echo "- Platform V7 sticky header, anchors and Deal workspace: \`$result\`"
            echo "- screenshots and traces: workflow artifact"
            echo "- workflow run ID: \`$GITHUB_RUN_ID\`"
            echo "- workflow run attempt: \`$GITHUB_RUN_ATTEMPT\`"
          } > "$record"
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"

      - name: Build visual evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='artifacts/platform-v7-production-mobile'
          mkdir -p "$evidence_dir"
          roots=("$evidence_dir")
          for candidate in apps/web/test-results/production-mobile apps/web/playwright-report-production-mobile; do
            [[ ! -e "$candidate" ]] || roots+=("$candidate")
          done
          find "${roots[@]}" -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > "$evidence_dir/sha256.txt"
          printf '%s\n' '${{ steps.target.outputs.target_sha }}' > "$evidence_dir/target-sha.txt"
          printf '%s\n' '${{ steps.revision.outcome }}' > "$evidence_dir/revision-outcome.txt"
          printf '%s\n' '${{ steps.acceptance.outcome }}' > "$evidence_dir/outcome.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/run-attempt.txt"
          printf '%s\n' 'chromium' 'webkit' > "$evidence_dir/browser-engines.txt"

      - name: Upload production mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v7-production-mobile-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            apps/web/test-results/production-mobile
            apps/web/playwright-report-production-mobile
            artifacts/platform-v7-production-mobile
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Enforce mobile acceptance result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.revision.outcome }}' == success ]] || exit 41
          [[ '${{ steps.acceptance.outcome }}' == success ]] || exit 40
