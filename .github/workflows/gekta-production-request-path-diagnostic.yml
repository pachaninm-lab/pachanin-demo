name: Gekta Production Request Path Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/gekta-production-request-path-diagnostic.yml"
      - "scripts/gekta-production-request-path-diagnostic.sh"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gekta-production-request-path-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  COMMAND: /gekta speed-request-path current-main
  EVIDENCE_DIR: artifacts/gekta-production-request-path

jobs:
  contract:
    name: Validate read-only request-path contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and mutation boundary
        run: |
          set -Eeuo pipefail
          bash -n scripts/gekta-production-request-path-diagnostic.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/gekta-production-request-path-diagnostic.sh').read_text(encoding='utf-8')
          forbidden = (
              'docker restart', 'docker stop', 'docker kill', 'docker rm',
              'docker compose', 'systemctl ', 'service ', 'reboot', 'shutdown',
              'console.log(process.env', 'process.stdout.write(process.env',
          )
          bad = [token for token in forbidden if token in script]
          if bad:
              raise SystemExit(f'forbidden diagnostic token(s): {bad}')
          required = (
              'GEKTA_PATH_MODE=READ_ONLY',
              'GEKTA_PATH_RUNTIME_MUTATION=NONE',
              'TAI_INTERNAL_API_BASE_URL',
              'TAI_INTERNAL_API_ALLOWED_HOSTS',
              '/internal/tai/public-generate-stream',
              'X-TAI-Signature',
              'GEKTA_PATH_FIRST_TOKEN_MS',
              'GEKTA_PATH_CLASSIFICATION',
              'GEKTA_PATH_DIAGNOSTIC=COMPLETE',
          )
          missing = [token for token in required if token not in script]
          if missing:
              raise SystemExit(f'missing diagnostic token(s): {missing}')
          PY

  diagnose:
    name: Trace live web to API to Qwen stream
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3896 &&
      github.event.comment.body == '/gekta speed-request-path current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify owner command and exact current main
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENTER" == "$OWNER" ]]
          [[ "$ACTOR" == "$OWNER" ]]
          [[ "$TRIGGERING_ACTOR" == "$OWNER" ]]
          [[ "${{ github.event.comment.body }}" == "$COMMAND" ]]
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse refs/remotes/origin/main)" ]]
          bash -n scripts/gekta-production-request-path-diagnostic.sh
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/repository-main.txt"

      - name: Resolve pinned production root transport
        id: ssh
        env:
          SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
          SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
          SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
          SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
          SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
          SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}"

          scan="$(mktemp)"; match="$(mktemp)"
          pinned=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; echo ROOT_DOCKER_READ_OK' \
            | tee "$EVIDENCE_DIR/transport.txt"
          grep -Fxq ROOT_DOCKER_READ_OK "$EVIDENCE_DIR/transport.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Run redacted signed request-path probe
        id: probe
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'bash -s' < scripts/gekta-production-request-path-diagnostic.sh \
            | tee "$EVIDENCE_DIR/request-path.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          printf 'GEKTA_PATH_PROBE_RC=%s\n' "$rc" | tee -a "$EVIDENCE_DIR/request-path.txt"

      - name: Publish bounded diagnostic evidence
        if: always() && steps.probe.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RC: ${{ steps.probe.outputs.rc }}
        run: |
          set -Eeuo pipefail
          main="$(cat "$EVIDENCE_DIR/repository-main.txt" 2>/dev/null || echo unknown)"
          report="$RUNNER_TEMP/report.md"
          {
            echo '## Gekta signed production request-path diagnostic'
            echo
            echo "- repository main: \`$main\`"
            echo "- probe rc: \`${PROBE_RC:-unknown}\`"
            echo '- path: `web -> signed internal API stream -> Qwen`; runtime mutation: `NONE`'
            echo '- run: '${GITHUB_SERVER_URL}'/'${GITHUB_REPOSITORY}'/actions/runs/'${GITHUB_RUN_ID}
            echo
            echo '```text'
            grep -E '^GEKTA_PATH_[A-Z0-9_]+=([A-Za-z0-9._:-]+)$' "$EVIDENCE_DIR/request-path.txt" 2>/dev/null || true
            echo '```'
          } > "$report"
          gh issue comment 3896 --repo "$GITHUB_REPOSITORY" --body-file "$report"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gekta-production-request-path-${{ github.run_id }}
          path: artifacts/gekta-production-request-path
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce diagnostic result
        if: always() && steps.probe.outcome != 'skipped'
        env:
          PROBE_RC: ${{ steps.probe.outputs.rc }}
        run: |
          set -Eeuo pipefail
          grep -Fxq 'GEKTA_PATH_MODE=READ_ONLY' "$EVIDENCE_DIR/request-path.txt"
          grep -Fxq 'GEKTA_PATH_RUNTIME_MUTATION=NONE' "$EVIDENCE_DIR/request-path.txt"
          grep -Fxq 'GEKTA_PATH_DIAGNOSTIC=COMPLETE' "$EVIDENCE_DIR/request-path.txt"
          [[ "${PROBE_RC:-999}" == 0 ]]
          grep -Fxq 'GEKTA_PATH_CLASSIFICATION=PASS' "$EVIDENCE_DIR/request-path.txt"

      - name: Cleanup protected transport
        if: always()
        run: rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

  live-storage-final:
    name: Live Gekta storage semantics and TTFT
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify current main is the accepted production target
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='06f686d52247ebe7805f1b75d937b2ca8daf8f6f'
          actual="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || {
            echo "LIVE_STORAGE_MAIN_DRIFT expected=$expected actual=${actual:-missing}" >&2
            exit 31
          }
          echo "LIVE_STORAGE_MAIN_EXACT=$actual"

      - name: Run exact live storage scenario and arbitrary-question latency probe
        shell: bash
        env:
          LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
          EXPECTED_SHA: 06f686d52247ebe7805f1b75d937b2ca8daf8f6f
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const { performance } = require('node:perf_hooks');

          const base = process.env.LIVE_BASE;
          const expected = process.env.EXPECTED_SHA;
          const jar = new Map();

          function applyCookies(headers) {
            const values = typeof headers.getSetCookie === 'function'
              ? headers.getSetCookie()
              : [headers.get('set-cookie')].filter(Boolean);
            for (const line of values) {
              const first = String(line).split(';', 1)[0];
              const eq = first.indexOf('=');
              if (eq > 0) jar.set(first.slice(0, eq), first.slice(eq + 1));
            }
          }
          function cookieHeader() {
            return [...jar.entries()].map(([k, v]) => k + '=' + v).join('; ');
          }

          async function reserve() {
            const response = await fetch(base + '/api/gekta/entitlement', {
              method: 'POST',
              headers: { 'content-type': 'application/json', accept: 'application/json', ...(jar.size ? { cookie: cookieHeader() } : {}) },
              body: JSON.stringify({ action: 'reserve' }),
              redirect: 'manual',
              signal: AbortSignal.timeout(25000),
            });
            applyCookies(response.headers);
            const body = await response.json().catch(() => null);
            if (!response.ok || body?.allowed !== true || !/^[0-9a-z]{8,12}\.[A-Za-z0-9_-]{16}$/.test(String(body?.ticket || ''))) {
              throw new Error('RESERVE_FAILED:' + response.status + ':' + String(body?.code || body?.error || 'unknown'));
            }
            return String(body.ticket);
          }

          function parseFrame(block) {
            const data = block.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n');
            if (!data) return null;
            try { return JSON.parse(data); } catch { return null; }
          }

          async function ask(question, history, conversationId) {
            const ticket = await reserve();
            const started = performance.now();
            const response = await fetch(base + '/api/agro-chat?stream=1', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                accept: 'text/event-stream',
                'x-gekta-answer-ticket': ticket,
                cookie: cookieHeader(),
              },
              body: JSON.stringify({ message: question, locale: 'ru', context: 'gekta-standalone', conversationId, history }),
              redirect: 'manual',
              signal: AbortSignal.timeout(170000),
            });
            applyCookies(response.headers);
            if (!response.ok || !String(response.headers.get('content-type') || '').toLowerCase().includes('text/event-stream') || !response.body) {
              throw new Error('STREAM_HTTP_FAILED:' + response.status + ':' + (response.headers.get('content-type') || 'missing'));
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let answer = '';
            let firstTokenMs = null;
            let tokenCount = 0;
            let meta = 0;
            let assessment = 0;
            let done = 0;
            let complete = false;
            let refusal = null;

            const handle = (block) => {
              const row = parseFrame(block);
              if (!row) return;
              if (row.event === 'meta') meta += 1;
              if (row.event === 'token') {
                const text = typeof row.text === 'string' ? row.text : '';
                if (text.trim() && firstTokenMs === null) firstTokenMs = performance.now() - started;
                answer += text;
                tokenCount += 1;
              }
              if (row.event === 'assessment') assessment += 1;
              if (row.event === 'done') {
                done += 1;
                complete = row.complete === true;
              }
              if (row.event === 'error' || row.event === 'refusal') refusal = String(row.code || row.refusal || row.message || row.event);
            };

            while (true) {
              const chunk = await reader.read();
              if (chunk.done) break;
              buffer += decoder.decode(chunk.value, { stream: true });
              buffer = buffer.replace(/\r\n/g, '\n');
              let cut;
              while ((cut = buffer.indexOf('\n\n')) >= 0) {
                const block = buffer.slice(0, cut);
                buffer = buffer.slice(cut + 2);
                handle(block);
              }
            }
            buffer += decoder.decode();
            if (buffer.trim()) handle(buffer);

            const totalMs = performance.now() - started;
            if (meta < 1 || tokenCount < 1 || assessment < 1 || done !== 1 || !complete || refusal) {
              throw new Error('STREAM_INCOMPLETE:meta=' + meta + ':tokens=' + tokenCount + ':assessment=' + assessment + ':done=' + done + ':complete=' + complete + ':refusal=' + (refusal || 'none'));
            }
            return { answer: answer.trim(), firstTokenMs, totalMs, tokenCount };
          }

          (async () => {
            const manifestResponse = await fetch(base + '/manifest-pc-deploy.json?storage-final=' + Date.now(), {
              headers: { accept: 'application/json' },
              signal: AbortSignal.timeout(20000),
            });
            const manifest = await manifestResponse.json();
            const deployed = [manifest?.commitSha, manifest?.revision, manifest?.sha, manifest?.commit, manifest?.gitSha]
              .find(v => typeof v === 'string' && /^[0-9a-f]{40}$/.test(v));
            if (!manifestResponse.ok || deployed !== expected) {
              throw new Error('MANIFEST_NOT_EXACT:' + manifestResponse.status + ':' + (deployed || 'missing'));
            }
            console.log('LIVE_STORAGE_MANIFEST_EXACT=' + deployed);

            const q1 = 'Пшеница, 500 тонн, предлагают 12000 рублей за тонну. Хранение 200 рублей за тонну в месяц. Продавать сейчас или хранить?';
            const q2 = 'Срок хранения два месяца. Насколько должна вырасти цена, чтобы покрыть только хранение?';
            const q3 = 'Если в одной точке силоса температура зерна за сутки выросла на 4 °C, а в соседних точках стабильна, что проверить до решения о перемещении партии?';
            const conversationId = 'gekta-live-storage-' + Date.now();

            const a1 = await ask(q1, [], conversationId);
            const a2 = await ask(q2, [
              { role: 'user', text: q1 },
              { role: 'assistant', text: a1.answer },
            ], conversationId);
            const a3 = await ask(q3, [], conversationId + '-arbitrary');

            const normalized2 = a2.answer.replace(/\s+/g, ' ');
            const has400PerTonne =
              /400(?:[,.]0+)?\s*(?:руб(?:\.|лей|ля|ль)?|₽)\s*(?:\/\s*т\b|(?:за|на)\s+тонн[уы])/iu.test(normalized2)
              || /400(?:[,.]0+)?\s*(?:руб(?:\.|лей|ля|ль)?|₽)\/т\b/iu.test(normalized2);
            if (!has400PerTonne) throw new Error('STORAGE_400_RUB_PER_TONNE_MISSING:' + normalized2.slice(0, 600));

            const affirmativeProfit = [
              /лучше\s+(?:продавать|продать|хранить)/iu,
              /(?:рекомендую|советую)\s+(?:сейчас\s+)?(?:продавать|продать|хранить)/iu,
              /(?:надо|нужно|следует)\s+(?:сейчас\s+)?(?:продавать|продать|хранить)/iu,
            ];
            if (affirmativeProfit.some(re => re.test(a1.answer) || re.test(a2.answer))) {
              throw new Error('UNSUPPORTED_PROFITABILITY_RECOMMENDATION');
            }
            if (a3.answer.length < 80) throw new Error('ARBITRARY_ANSWER_TOO_SHORT:' + a3.answer.length);

            const result = {
              exactSha: deployed,
              storageScenario: {
                q1: { ttftMs: Math.round(a1.firstTokenMs ?? -1), totalMs: Math.round(a1.totalMs), tokenFrames: a1.tokenCount, answer: a1.answer },
                q2: { ttftMs: Math.round(a2.firstTokenMs ?? -1), totalMs: Math.round(a2.totalMs), tokenFrames: a2.tokenCount, answer: a2.answer },
                arithmetic: '400 RUB_PER_TONNE',
                unsupportedProfitabilityRecommendation: false,
              },
              arbitraryQuestion: {
                ttftMs: Math.round(a3.firstTokenMs ?? -1),
                totalMs: Math.round(a3.totalMs),
                tokenFrames: a3.tokenCount,
                answer: a3.answer,
              },
            };
            console.log('LIVE_GEKTA_FINAL_ACCEPTANCE=' + JSON.stringify(result));
            console.log('LIVE_GEKTA_STORAGE_FINAL=PASS');
          })().catch(error => {
            console.error('LIVE_GEKTA_STORAGE_FINAL=FAIL ' + (error?.message || String(error)));
            process.exit(1);
          });
          NODE
