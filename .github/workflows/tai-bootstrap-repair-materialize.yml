          replace_once(preflight, """ok = row.get('status') == 'ready' and components.get('tools') == 'disabled-safe' and not row.get('reasons')\n""", """ok = (\n    row.get('status') == 'ready'\n    and components.get('tools') == 'disabled-safe'\n    and components.get('restricted_model') == 'authorized'\n    and components.get('model_admission') in {'not_attested', 'accepted'}\n    and not row.get('reasons')\n)\n""")
          replace_once(preflight, """blockers = sorted(set(line.strip() for line in open(blockers_path, encoding='utf-8') if line.strip()))\nreport = {\n""", """blockers = sorted(set(line.strip() for line in open(blockers_path, encoding='utf-8') if line.strip()))\nmaturity = [item for item in checks if item.get('status') == 'DEFERRED']\nreport = {\n""")
          replace_once(preflight, """    'checks': checks,\n    'blockers': blockers,\n""", """    'checks': checks,\n    'maturity': maturity,\n    'blockers': blockers,\n""")

          check_preflight = "scripts/check-tai-reg-ru-preflight.mjs"
          replace_once(check_preflight, """  'ACTIVE_MODEL_IDENTITY_MATCHED','MODEL_ADMISSION_ACCEPTED','ACTIVE_KNOWLEDGE_READY',\n""", """  'ACTIVE_MODEL_IDENTITY_MATCHED','MODEL_ADMISSION_ACCEPTED','MODEL_ADMISSION_NOT_ATTESTED','ACTIVE_KNOWLEDGE_READY',\n  'record_maturity','restricted_model','model_admission',\n""")

          check_deploy = "scripts/check-tai-reg-ru-deploy.mjs"
          replace_once(check_deploy, """const scopePath='docs/platform-v7/autopilot/scopes/tai-reg-ru-least-privilege-controller-20260731.json';\n""", """const scopePath='docs/platform-v7/autopilot/scopes/tai-reg-ru-bootstrap-repair-20260801.json';\n""")
          replace_once(check_deploy, """  'TAI_REG_RU_DEPLOY_ROLLBACK=PASS','TAI_REG_RU_DEPLOYMENT_COMPLETE=1','tai.reg-ru.deployment.v1','newRecurringCostRub',\n""", """  'TAI_REG_RU_DEPLOY_ROLLBACK=PASS','TAI_REG_RU_DEPLOYMENT_COMPLETE=1','tai.reg-ru.deployment.v1','newRecurringCostRub',\n  'MODEL_EVIDENCE_FILE','tai_schema_migrations','tai.production-bootstrap-authority.v1','TAI_RESTRICTED_MODEL_OPERATIONAL=true',\n  'permanentModelAdmissionStatus','FORWARD_ONLY_IDEMPOTENT','tai-agro-os-master-spec-v4.0',\n""")
          replace_once(check_deploy, """if(scope.branch!=='agent/tai-reg-ru-least-privilege-controller-20260731')violations.push(`${scopePath}: branch mismatch`);\n""", """if(scope.branch!=='agent/tai-reg-ru-bootstrap-repair-20260801')violations.push(`${scopePath}: branch mismatch`);\n""")
          replace_once(check_deploy, """for(const p of [workflowPath,deployPath,preflightPath,'scripts/check-tai-reg-ru-deploy.mjs'])if(!scope.allowedPaths.includes(p))violations.push(`${scopePath}: ${p} outside allowedPaths`);\n""", """for(const p of [workflowPath,deployPath,preflightPath,'scripts/check-tai-reg-ru-deploy.mjs','apps/tai/tai/bootstrap_authority.py','apps/tai/tai/restricted_model_authority.py'])if(!scope.allowedPaths.includes(p))violations.push(`${scopePath}: ${p} outside allowedPaths`);\nforbid(deploy,/INSERT\\s+INTO\\s+(?:public[.])?tai_model_admission_decisions/iu,`${deployPath}: fabricated permanent model admission is forbidden`);\n""")

          append_once("apps/tai/TAI_REG_RU_DEPLOY.md", "## Restricted operational bootstrap authority", """## Restricted operational bootstrap authority\n\nThe standalone REG.RU deployment applies only the migration manifest packaged in the immutable exact-SHA TAI image, records every migration path and SHA-256 in `tai_schema_migrations`, and materializes a source-backed foundation chunk from TAI Agro OS Master Specification v4.0.\n\nThe protected controller derives the Qwen GGUF path, size, context bound and SHA-256 from the active private REG.RU model process through pinned SSH host authority. The resulting profile is authorized as `restricted operational`; permanent model admission remains explicitly `NOT_ATTESTED` unless a real accepted admission record exists. No admission decision is synthesized by deployment.\n\nPostflight remains blocking on exact image digest, rootless read-only isolation, dedicated PostgreSQL principal, active source-backed knowledge, supervisor-refreshed model health, grounded local Qwen inference with citations, disabled tools, rollback evidence, REG.RU-only hosting and zero new recurring expense. Schema migrations are forward-only and idempotent; service, environment, role and Compose authority retain rollback.\n""")

