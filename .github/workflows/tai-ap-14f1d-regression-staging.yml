name: TAI AP-14F1D Regression Compatibility Staging

on:
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f1d-regression-staging.yml'
      - 'scripts/tai-ap-14f1d/regression_staging_patch.py'
  push:
    branches:
      - agent/tai-ap-14f1d-regression-fix-staging
    paths:
      - '.github/workflows/tai-ap-14f1d-regression-staging.yml'
      - 'scripts/tai-ap-14f1d/regression_staging_patch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tai-ap-14f1d-regression-fix-staging-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-regression-authorities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tai-ap-14f1d-regression-fix-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch and prove legacy regression compatibility
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tai-ap-14f1d/regression_staging_patch.py
          node --check scripts/tai-ap-14f1a/verify.mjs
          node --check scripts/tai-ap-14f1b2/verify.mjs
          node scripts/tai-ap-14f1a/verify.mjs > /tmp/ap1a-regression.json
          node scripts/tai-ap-14f1b2/verify.mjs > /tmp/ap1b2-regression.json
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of ['/tmp/ap1a-regression.json', '/tmp/ap1b2-regression.json']) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (report.status !== 'PASS') throw new Error(`${path} did not pass`);
            if (report.operationalStatus !== 'NOT_ATTESTED') throw new Error(`${path} status drift`);
            if (Object.values(report.boundaries).some(Boolean)) throw new Error(`${path} boundary drift`);
          }
          NODE
          git diff --check
          mkdir -p artifacts/tai-ap-14f1d-regression-compat
          cp --parents \
            .github/workflows/tai-ap-14f1a.yml \
            .github/workflows/tai-ap-14f1b2.yml \
            scripts/tai-ap-14f1b2/verify.mjs \
            docs/platform-v7/autopilot/scopes/tai-ap-14f1d-3374.json \
            artifacts/tai-ap-14f1d-regression-compat
          cp /tmp/ap1a-regression.json \
            artifacts/tai-ap-14f1d-regression-compat/ap1a-regression.json
          cp /tmp/ap1b2-regression.json \
            artifacts/tai-ap-14f1d-regression-compat/ap1b2-regression.json

      - name: Upload verified compatibility sources
        uses: actions/upload-artifact@v4
        with:
          name: tai-ap-14f1d-regression-compat-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/tai-ap-14f1d-regression-compat
          if-no-files-found: error
          retention-days: 14
