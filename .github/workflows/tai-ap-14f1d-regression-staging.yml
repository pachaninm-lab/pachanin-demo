name: TAI AP-14F1D Exact CA Pin Export

on:
  push:
    branches:
      - agent/tai-ap-14f1d-regression-fix-staging
    paths:
      - '.github/workflows/tai-ap-14f1d-regression-staging.yml'
      - 'scripts/tai-ap-14f1d/export_exact_ca_pins.py'
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f1d-regression-staging.yml'
      - 'scripts/tai-ap-14f1d/export_exact_ca_pins.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tai-ap-14f1d-exact-ca-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export-exact-ca-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tai-ap-14f1d-regression-fix-staging
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated RPM reader
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'rpmfile==2.1.0'

      - name: Export exact verified CA pins
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tai-ap-14f1d/export_exact_ca_pins.py \
            --output artifacts/tai-ap-14f1d-exact-ca

      - name: Upload exact CA pins
        uses: actions/upload-artifact@v4
        with:
          name: tai-ap-14f1d-exact-ca-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/tai-ap-14f1d-exact-ca
          if-no-files-found: error
          retention-days: 30

      - name: Publish observable exporter result
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3377,
              body: `CA_PIN_EXPORT_SUCCESS run=${context.runId} sha=${context.sha}`,
            });
