name: One-shot real public Qwen inference repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/tai-public-qwen-real-inference-20260801'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tai-public-qwen-real-inference-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded repair and validate syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/one-shot-tai-public-qwen-real-inference-20260801.py
          python3 scripts/one-shot-tai-public-qwen-real-inference-20260801.py
          node --check scripts/tai-live-public-ai-acceptance.mjs
          git diff --check

      - name: Commit production repair files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/app/api/restricted-public-platform-assistant/route.ts \
            apps/web/tests/unit/platformV7RestrictedPublicQwenRoute.test.ts \
            apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts \
            apps/api/src/modules/ai-insights/restricted-public-qwen.service.spec.ts \
            apps/web/lib/platform-v7/ai-gateway-stream.ts \
            apps/web/components/platform-v7/UnifiedModalSheetFullscreenController.tsx \
            apps/web/tests/unit/platformV7PublicAssistantBrandingCleanup.test.ts \
            scripts/tai-live-public-ai-acceptance.mjs \
            apps/web/tests/unit/taiLivePublicQwenInferenceAcceptance.test.ts \
            docs/platform-v7/autopilot/scopes/tai-public-qwen-real-inference-20260801.json
          git diff --cached --check
          git commit -m 'fix: require real public Qwen inference before live acceptance'
          git push origin HEAD:agent/tai-public-qwen-real-inference-20260801