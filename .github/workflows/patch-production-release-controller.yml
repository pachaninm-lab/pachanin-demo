name: TEMP patch production release controller authority

on:
  push:
    branches:
      - fix/production-release-controller-authority-20260730
    paths:
      - '.github/workflows/patch-production-release-controller.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-release-controller-authority-20260730
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact fail-closed release fix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          release = Path('.github/workflows/production-full-stack-exact-sha.yml')
          text = release.read_text()
          old = """      (github.event_name == 'workflow_dispatch' &&
               github.actor == github.repository_owner &&
               inputs.confirmation == 'DEPLOY-FULL-STACK-EXACT-SHA')"""
          new = """      (github.event_name == 'workflow_dispatch' &&
               (github.actor == github.repository_owner ||
                github.actor == 'github-actions[bot]') &&
               inputs.confirmation == 'DEPLOY-FULL-STACK-EXACT-SHA')"""
          if text.count(old) != 1:
              raise SystemExit('release actor guard anchor mismatch')
          release.write_text(text.replace(old, new))

          controller = Path('.github/workflows/platform-v7-safe-merge.yml')
          text = controller.read_text()
          old = """          latest_release_conclusion=none
                    latest_release_step=none
                    if [[ -n \"$selected_release\" ]]; then
                      IFS=$'\\t' read -r latest_release_id _ latest_release_status latest_release_conclusion _ _ _ <<< \"$selected_release\"
                      latest_release_step=$(gh api -H 'Accept: application/vnd.github+json' \"repos/$REPO/actions/runs/$latest_release_id/jobs?per_page=100\" \\
                        --jq '[.jobs[] | {name, step: (([.steps[]? | select(.status == \"in_progress\" or .conclusion == \"failure\") | .name][0]) // \"none\")} | select(.step != \"none\") | (.name + \" / \" + .step)][0] // \"none\"')
                    fi"""
          new = """          latest_release_conclusion=none
                    latest_release_step=none
                    latest_release_deploy_state=not-found
                    if [[ -n \"$selected_release\" ]]; then
                      IFS=$'\\t' read -r latest_release_id _ latest_release_status latest_release_conclusion _ _ _ <<< \"$selected_release\"
                      latest_release_deploy_state=$(gh api -H 'Accept: application/vnd.github+json' \"repos/$REPO/actions/runs/$latest_release_id/jobs?per_page=100\" \\
                        --jq '[.jobs[] | select(.name == \"Migrate, deploy API and web, verify live intake\") | (.conclusion // .status)][0] // \"missing\"')
                      latest_release_step=$(gh api -H 'Accept: application/vnd.github+json' \"repos/$REPO/actions/runs/$latest_release_id/jobs?per_page=100\" \\
                        --jq '[.jobs[] | {name, step: (([.steps[]? | select(.status == \"in_progress\" or .conclusion == \"failure\") | .name][0]) // \"none\")} | select(.step != \"none\") | (.name + \" / \" + .step)][0] // \"none\"')
                    fi"""
          if text.count(old) != 1:
              raise SystemExit('controller state anchor mismatch')
          text = text.replace(old, new)
          old = """          if [[ \"$latest_release_conclusion\" == 'success' ]]; then
                      status_title=\"Production release success · $sha7\"
                    elif [[ \"$latest_release_status\" == 'in_progress' || \"$latest_release_status\" == 'queued' || \"$latest_release_status\" == 'pending' ]]; then"""
          new = """          if [[ \"$latest_release_conclusion\" == 'success' && \"$latest_release_deploy_state\" == 'success' ]]; then
                      status_title=\"Production release success · $sha7\"
                    elif [[ \"$latest_release_deploy_state\" == 'skipped' ]]; then
                      status_title=\"Production release blocked: deployment job skipped · $sha7\"
                    elif [[ \"$latest_release_status\" == 'in_progress' || \"$latest_release_status\" == 'queued' || \"$latest_release_status\" == 'pending' ]]; then"""
          if text.count(old) != 1:
              raise SystemExit('controller title anchor mismatch')
          controller.write_text(text.replace(old, new))

          check = Path('scripts/check-production-full-stack-release.mjs')
          text = check.read_text()
          old = """  'DEPLOY-FULL-STACK-EXACT-SHA',
            'RELEASE_ISSUE_NUMBER: 3072',"""
          new = """  'DEPLOY-FULL-STACK-EXACT-SHA',
            \"github.actor == 'github-actions[bot]'\",
            'RELEASE_ISSUE_NUMBER: 3072',"""
          if text.count(old) != 1:
              raise SystemExit('workflow contract anchor mismatch')
          text = text.replace(old, new)
          old = """  'Main advanced during image publication',
            'gh workflow run production-full-stack-exact-sha.yml',"""
          new = """  'Main advanced during image publication',
            'gh workflow run production-full-stack-exact-sha.yml',
            'latest_release_deploy_state',
            'deployment job skipped',"""
          if text.count(old) != 1:
              raise SystemExit('controller contract anchor mismatch')
          check.write_text(text.replace(old, new))

          scope = {
              'schemaVersion': 'platform-v7.concurrent-scope.v1',
              'branch': 'fix/production-release-controller-authority-20260730',
              'status': 'active',
              'issue': 3072,
              'baseCommit': 'b82cbfca240293a2e0a75705aeb7df4081c0850a',
              'operationalStatus': 'PRODUCTION_RELEASE_CONTROLLER_AUTHORITY_FIX',
              'allowedPaths': [
                  '.github/workflows/production-full-stack-exact-sha.yml',
                  '.github/workflows/platform-v7-safe-merge.yml',
                  'scripts/check-production-full-stack-release.mjs',
                  'docs/platform-v7/autopilot/scopes/fix-production-release-controller-authority-3072.json',
              ],
              'boundaries': {
                  'runtimeBusinessBehaviorChange': False,
                  'securityGateDisabled': False,
                  'acceptanceGateWeakened': False,
                  'blanketContinueOnError': False,
                  'productionDeployment': True,
              },
              'acceptance': [
                  'an owner-authorized issue-comment controller may dispatch the exact-main release through github-actions[bot]',
                  'manual workflow dispatch remains restricted to the repository owner',
                  'target SHA must remain exact current main',
                  'a skipped deployment job can never be reported as production release success',
                  'release contract validation passes before merge',
              ],
              'productionHosting': 'REG_RU_VPS_ONLY',
          }
          path = Path('docs/platform-v7/autopilot/scopes/fix-production-release-controller-authority-3072.json')
          path.write_text(json.dumps(scope, ensure_ascii=False, indent=2) + '\n')
          PY
          rm .github/workflows/patch-production-release-controller.yml
          node scripts/check-production-full-stack-release.mjs
          git diff --check
          git status --short
      - name: Commit bounded fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production-full-stack-exact-sha.yml \
            .github/workflows/platform-v7-safe-merge.yml \
            scripts/check-production-full-stack-release.mjs \
            docs/platform-v7/autopilot/scopes/fix-production-release-controller-authority-3072.json \
            .github/workflows/patch-production-release-controller.yml
          git commit -m 'OPS: authorize owner-controlled exact-main release dispatch'
          git push origin HEAD:fix/production-release-controller-authority-20260730
