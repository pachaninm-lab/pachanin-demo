name: Production P0 Staff API Origin Runtime Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-staff-api-origin-runtime-repair.yml'
      - 'scripts/production-p0-staff-api-origin-runtime-repair.sh'
      - 'scripts/check-production-p0-staff-api-origin-runtime-repair.mjs'
      - 'docs/platform-v7/autopilot/scopes/p0-staff-api-origin-runtime-4559.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-staff-api-origin-runtime-repair.yml'
      - 'scripts/production-p0-staff-api-origin-runtime-repair.sh'
      - 'scripts/check-production-p0-staff-api-origin-runtime-repair.mjs'
      - 'docs/platform-v7/autopilot/scopes/p0-staff-api-origin-runtime-4559.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-staff-api-origin-runtime-repair
  cancel-in-progress: false

jobs:
  contract:
    name: Validate staff API origin runtime repair contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-staff-api-origin-repair current-runtime'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/check-production-p0-staff-api-origin-runtime-repair.mjs
      - run: bash -n scripts/production-p0-staff-api-origin-runtime-repair.sh

  repair:
    name: Guarded REG.RU Web API authority repair
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-staff-api-origin-repair current-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish bounded guard run locator
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3072,
              body: `P0_STAFF_API_ORIGIN_GUARD_RUN=${context.runId};ATTEMPT=${process.env.GITHUB_RUN_ATTEMPT || 'unknown'};SHA=${context.sha}`,
            });

      - name: Reject concurrent production mutation workflows
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const active = [];
            const staleQueuedNames = new Set([
              'Production P0 REG.RU Live Resend Recovery',
              'Production P0 Reviewer SMTP 451 Detail',
              'Production P0 Reviewer Inspect',
              'Production P0 Reuse Existing Auth Runtime',
              'Production P0 REG.RU Mail Auth Diagnostic',
            ]);
            const provenOrphanedRuns = new Map([
              [32219738787, { name: 'Production P0 REG.RU Live Resend Recovery', workflowId: 332213597, path: '.github/workflows/production-p0-regru-live-resend-recover.yml', headSha: '8bb7a5b98e75b4d9ad80b12ae492553e608fccb3', createdAt: '2026-08-19T05:31:28Z', actor: 'chatgpt-codex-connector[bot]', mode: 'MUTATION_NEUTRALIZED' }],
              [32219737778, { name: 'Production P0 Reviewer SMTP 451 Detail', workflowId: 334513498, path: '.github/workflows/production-p0-reviewer-smtp-451-detail.yml', headSha: '8bb7a5b98e75b4d9ad80b12ae492553e608fccb3', createdAt: '2026-08-19T05:31:28Z', actor: 'chatgpt-codex-connector[bot]', mode: 'READ_ONLY' }],
              [32219738538, { name: 'Production P0 Reviewer Inspect', workflowId: 330899844, path: '.github/workflows/production-p0-reviewer-inspect.yml', headSha: '8bb7a5b98e75b4d9ad80b12ae492553e608fccb3', createdAt: '2026-08-19T05:31:28Z', actor: 'chatgpt-codex-connector[bot]', mode: 'READ_ONLY' }],
              [32218490249, { name: 'Production P0 Reuse Existing Auth Runtime', workflowId: 332013279, path: '.github/workflows/production-p0-reuse-existing-auth-runtime.yml', headSha: '8bb7a5b98e75b4d9ad80b12ae492553e608fccb3', createdAt: '2026-08-19T05:11:23Z', actor: 'pachaninm-lab', mode: 'MUTATION_NEUTRALIZED' }],
              [32218487944, { name: 'Production P0 REG.RU Mail Auth Diagnostic', workflowId: 332723955, path: '.github/workflows/production-p0-regru-mail-auth-diagnostic.yml', headSha: '8bb7a5b98e75b4d9ad80b12ae492553e608fccb3', createdAt: '2026-08-19T05:11:21Z', actor: 'pachaninm-lab', mode: 'READ_ONLY' }],
            ]);
            const nonProductionCiProfiles = new Map([
              ['TAI Release Acceptance', {
                path: '.github/workflows/tai-release-acceptance.yml',
                required: [
                  'permissions:\n  actions: read\n  contents: read',
                  'runs-on: ubuntu-latest',
                  'production_operational_status") != "NOT_ATTESTED"',
                ],
              }],
              ['Production-like Kubernetes Acceptance', {
                path: '.github/workflows/production-like-kubernetes-acceptance.yml',
                required: [
                  'permissions:\n  contents: read',
                  'runs-on: ubuntu-latest',
                  'KIND_VERSION=v0.23.0',
                  'kind delete cluster --name grainflow-acceptance || true',
                  'docker rm -f kind-registry || true',
                ],
              }],
              ['TAI REG.RU Preflight', {
                path: '.github/workflows/tai-reg-ru-preflight.yml',
                proofMode: 'REG_RU_READONLY_PREFLIGHT',
                required: [
                  'permissions:\n  contents: read',
                  'runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]',
                  '[[ "$(id -u)" -ne 0 ]]',
                  'if docker version >/dev/null 2>&1; then exit 21; fi',
                  '[[ ! -r /etc/pc-release-authority/actions-runner.json ]]',
                  'sudo -n /usr/local/sbin/pc-tai-release-controller preflight "$TARGET_SHA" "$GITHUB_RUN_ID" "$TAI_IMAGE" "$TAI_DIGEST"',
                ],
              }],
            ]);
            const staleAfterMs = 72 * 60 * 60 * 1000;
            const now = Date.now();
            const isActiveStatus = (status) => ['queued', 'in_progress'].includes(String(status || ''));
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function waitForRetirement(runId) {
              let lastStatus = 'unknown';
              for (let attempt = 0; attempt < 6; attempt += 1) {
                const refreshed = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                });
                lastStatus = String(refreshed.data.status || 'unknown');
                if (!isActiveStatus(lastStatus)) return lastStatus;
                await sleep(1000);
              }
              return lastStatus;
            }

            async function proveNonProductionCi(run) {
              const profile = nonProductionCiProfiles.get(String(run.name || ''));
              if (!profile) return false;
              if (String(run.path || '') !== profile.path || !/^[0-9a-f]{40}$/.test(String(run.head_sha || ''))) {
                core.warning(`Non-production CI proof metadata mismatch for run ${run.id}:${run.name}`);
                return false;
              }

              let data;
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: profile.path,
                  ref: run.head_sha,
                });
                data = response.data;
              } catch (error) {
                core.warning(`Exact-head non-production CI workflow fetch failed for run ${run.id}:${run.name}; status=${Number(error?.status || 0) || 'unknown'}`);
                return false;
              }

              if (Array.isArray(data) || data?.type !== 'file' || data?.encoding !== 'base64' || typeof data?.content !== 'string') {
                core.warning(`Exact-head non-production CI workflow content invalid for run ${run.id}:${run.name}`);
                return false;
              }
              const source = Buffer.from(data.content.replace(/\s/g, ''), 'base64').toString('utf8');
              if (!source.startsWith(`name: ${run.name}\n`)) return false;
              if (!profile.required.every((marker) => source.includes(marker))) return false;

              if (profile.proofMode === 'REG_RU_READONLY_PREFLIGHT') {
                if (/\$\{\{\s*secrets\./i.test(source) || /\bPC_PROD(?:_|\b)/.test(source)) return false;
                if (/(?:^|[\s;|&])(?:ssh|scp|sftp|rsync)(?:[\s;|&]|$)/im.test(source) || /ssh-keyscan/i.test(source)) return false;
                const writes = [...source.matchAll(/^\s{2,}(actions|checks|contents|deployments|discussions|id-token|issues|packages|pages|pull-requests|repository-projects|security-events|statuses):\s*write\s*$/gmi)].map((m) => m[1]);
                if (writes.some((permission) => permission !== 'statuses')) return false;
                const start = source.indexOf('\n  live_preflight:\n');
                const end = source.indexOf('\n  publish_status:\n', start + 1);
                if (start < 0 || end <= start) return false;
                const live = source.slice(start, end);
                const hosted = [...source.matchAll(/runs-on:\s*\[[^\]]*self-hosted[^\]]*\]/gi)].map((m) => m[0]);
                if (hosted.length !== 1 || hosted[0] !== 'runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]') return false;
                if (!live.includes('[[ "$(id -u)" -ne 0 ]]')) return false;
                if (!live.includes("! id -nG | tr ' ' '\\n' | grep -Fxq docker")) return false;
                if (!live.includes('if docker version >/dev/null 2>&1; then exit 21; fi')) return false;
                if (!live.includes('[[ ! -r /etc/pc-release-authority/actions-runner.json ]]')) return false;
                if (!live.includes("sudo -n -l | grep -Fq '/usr/local/sbin/pc-tai-release-controller'")) return false;
                const ops = [...live.matchAll(/sudo -n \/usr\/local\/sbin\/pc-tai-release-controller\s+([A-Za-z0-9_-]+)/g)].map((m) => m[1]);
                if (ops.length !== 1 || ops[0] !== 'preflight') return false;
                if (/docker\s+(?:run|exec|compose|restart|stop|rm|kill|update|build|push)\b/i.test(live)) return false;
                core.notice(`RESTRICTED_REG_RU_READONLY_PREFLIGHT_PROVEN id=${run.id} name=${run.name} head_sha=${run.head_sha}`);
                return true;
              }

              const forbidden = [
                /\$\{\{\s*secrets\./i,
                /\bPC_PROD(?:_|\b)/,
                /(?:^|[\s;|&])(?:ssh|scp|sftp|rsync)(?:[\s;|&]|$)/im,
                /ssh-keyscan/i,
                /appleboy\/ssh-action/i,
                /runs-on:\s*(?:self-hosted|\[[^\]]*self-hosted)/i,
                /permissions:\s*(?:write-all|read-all)/i,
                /(?:actions|checks|contents|deployments|discussions|id-token|issues|packages|pages|pull-requests|repository-projects|security-events|statuses):\s*write\b/i,
              ];
              if (forbidden.some((pattern) => pattern.test(source))) return false;

              core.notice(`NON_PRODUCTION_CI_PROVEN id=${run.id} name=${run.name} head_sha=${run.head_sha}`);
              return true;
            }

            function mutationNeutralizersPresent() {
              const fs = require('fs');
              const liveResend = fs.readFileSync('scripts/production-p0-regru-live-resend-recover.sh', 'utf8');
              const provisioner = fs.readFileSync('scripts/provision-production-p0-password-reset-runtime.sh', 'utf8');
              return liveResend.includes("if [[ \"${GITHUB_RUN_ID:-}\" == '32219738787' ]]; then") &&
                liveResend.includes('STALE_ACTIONS_ORPHAN_NEUTRALIZED') &&
                provisioner.includes("pc-auth-runtime-reconcile-32218490249.sh") &&
                provisioner.includes('STALE_ACTIONS_ORPHAN_NEUTRALIZED');
            }

            async function quarantineProvenOrphan(latest, cancelStatus, forceCancelStatus, deleteStatus) {
              const spec = provenOrphanedRuns.get(Number(latest.id));
              if (!spec) return { known: false, quarantined: false };

              const exactMetadata =
                String(latest.status || '') === 'queued' &&
                latest.event === 'issue_comment' &&
                String(latest.name || '') === spec.name &&
                Number(latest.workflow_id) === spec.workflowId &&
                String(latest.path || '') === spec.path &&
                String(latest.head_sha || '') === spec.headSha &&
                String(latest.created_at || '') === spec.createdAt &&
                String(latest.updated_at || '') === spec.createdAt &&
                Number(latest.run_attempt || 0) === 1 &&
                String(latest.actor?.login || '') === spec.actor &&
                String(latest.triggering_actor?.login || '') === spec.actor;
              const exactBackendFailure = Number(cancelStatus) === 500 && Number(forceCancelStatus) === 500 && Number(deleteStatus) === 403;
              if (!exactMetadata || !exactBackendFailure) {
                active.push(JSON.stringify({
                  id: latest.id, name: latest.name, status: latest.status, event: latest.event, head_sha: latest.head_sha,
                  retirement: 'FAILED_CLOSED_ORPHAN_METADATA_OR_BACKEND_DRIFT', cancel_http_status: cancelStatus,
                  force_cancel_http_status: forceCancelStatus, delete_http_status: deleteStatus,
                }));
                return { known: true, quarantined: false };
              }

              let jobs;
              try {
                jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner, repo: context.repo.repo, run_id: latest.id, per_page: 100,
                });
              } catch (error) {
                active.push(JSON.stringify({
                  id: latest.id, name: latest.name, status: latest.status, retirement: 'FAILED_CLOSED_ORPHAN_JOBS_REREAD',
                  jobs_http_status: Number(error?.status || 0) || 'unknown',
                }));
                return { known: true, quarantined: false };
              }
              if (jobs.length !== 0) {
                active.push(JSON.stringify({
                  id: latest.id, name: latest.name, status: latest.status, retirement: 'FAILED_CLOSED_ORPHAN_HAS_JOBS',
                  job_count: jobs.length,
                }));
                return { known: true, quarantined: false };
              }
              if (spec.mode === 'MUTATION_NEUTRALIZED' && !mutationNeutralizersPresent()) {
                active.push(JSON.stringify({
                  id: latest.id, name: latest.name, status: latest.status, retirement: 'FAILED_CLOSED_ORPHAN_NEUTRALIZER_MISSING',
                }));
                return { known: true, quarantined: false };
              }

              core.notice(`ORPHANED_API_RECORD_QUARANTINED id=${latest.id} name=${latest.name} mode=${spec.mode}`);
              return { known: true, quarantined: true };
            }

            async function retireStaleQueuedRun(run) {
              let cancelStatus = null;
              let forceCancelStatus = null;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
              } catch (error) {
                cancelStatus = Number(error?.status || 0) || 'unknown';
                core.warning(`Normal cancellation failed for stale run ${run.id}:${run.name}; status=${cancelStatus}`);
              }

              let finalStatus = await waitForRetirement(run.id);
              if (isActiveStatus(finalStatus)) {
                try {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                } catch (error) {
                  forceCancelStatus = Number(error?.status || 0) || 'unknown';
                  core.warning(`Force cancellation failed for stale run ${run.id}:${run.name}; status=${forceCancelStatus}`);
                }
                finalStatus = await waitForRetirement(run.id);
              }

              if (isActiveStatus(finalStatus)) {
                let latest;
                try {
                  const response = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  latest = response.data;
                } catch (error) {
                  active.push(JSON.stringify({
                    id: run.id,
                    name: run.name,
                    status: finalStatus,
                    event: run.event,
                    head_sha: run.head_sha,
                    retirement: 'FAILED_CLOSED_REREAD',
                    cancel_http_status: cancelStatus,
                    force_cancel_http_status: forceCancelStatus,
                    reread_http_status: Number(error?.status || 0) || 'unknown',
                  }));
                  return false;
                }

                const latestCreatedAt = Date.parse(String(latest.created_at || ''));
                const latestNeverUpdated = Boolean(latest.created_at) && latest.updated_at === latest.created_at;
                const strictStaleStillQueued =
                  String(latest.status || '') === 'queued' &&
                  latest.event === 'issue_comment' &&
                  staleQueuedNames.has(String(latest.name || '')) &&
                  Number.isFinite(latestCreatedAt) &&
                  now - latestCreatedAt >= staleAfterMs &&
                  latestNeverUpdated &&
                  String(latest.head_sha || '') !== String(context.sha || '');

                if (!strictStaleStillQueued) {
                  active.push(JSON.stringify({
                    id: latest.id,
                    name: latest.name,
                    status: latest.status,
                    event: latest.event,
                    head_sha: latest.head_sha,
                    retirement: 'FAILED_CLOSED_CHANGED_BEFORE_DELETE',
                    cancel_http_status: cancelStatus,
                    force_cancel_http_status: forceCancelStatus,
                  }));
                  return false;
                }

                let deleteStatus = null;
                try {
                  await github.request('DELETE /repos/{owner}/{repo}/actions/runs/{run_id}', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                } catch (error) {
                  if (Number(error?.status || 0) === 404) {
                    core.notice(`Stale queued production run ${run.id}:${run.name} already deleted`);
                    return true;
                  }
                  deleteStatus = Number(error?.status || 0) || 'unknown';
                  core.warning(`Deletion failed for strict stale run ${run.id}:${run.name}; status=${deleteStatus}`);
                }

                if (deleteStatus === null) {
                  for (let attempt = 0; attempt < 6; attempt += 1) {
                    try {
                      await github.rest.actions.getWorkflowRun({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: run.id,
                      });
                    } catch (error) {
                      if (Number(error?.status || 0) === 404) {
                        core.notice(`Deleted strict stale queued production run ${run.id}:${run.name}`);
                        return true;
                      }
                      deleteStatus = Number(error?.status || 0) || 'unknown';
                      break;
                    }
                    await sleep(1000);
                  }
                }

                if (deleteStatus !== null) {
                  const orphan = await quarantineProvenOrphan(latest, cancelStatus, forceCancelStatus, deleteStatus);
                  if (orphan.quarantined) return true;
                  if (orphan.known) return false;
                }

                active.push(JSON.stringify({
                  id: run.id,
                  name: run.name,
                  status: finalStatus,
                  event: run.event,
                  head_sha: run.head_sha,
                  retirement: 'FAILED_CLOSED_DELETE',
                  cancel_http_status: cancelStatus,
                  force_cancel_http_status: forceCancelStatus,
                  delete_http_status: deleteStatus,
                }));
                return false;
              }

              core.notice(`Retired stale queued production issue-comment run ${run.id}:${run.name}; final_status=${finalStatus}`);
              return true;
            }

            for (const status of ['queued', 'in_progress']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                status,
                per_page: 100,
              });
              for (const run of runs) {
                if (Number(run.id) === Number(context.runId)) continue;
                const name = String(run.name || '');
                if (!/(production|release|deploy|reg\.ru|cutover|activation|rolling|repair)/i.test(name)) continue;
                if (nonProductionCiProfiles.has(name) && await proveNonProductionCi(run)) continue;

                const createdAt = Date.parse(String(run.created_at || ''));
                const neverUpdated = Boolean(run.created_at) && run.updated_at === run.created_at;
                const staleQueuedIssueComment =
                  status === 'queued' &&
                  run.event === 'issue_comment' &&
                  staleQueuedNames.has(name) &&
                  Number.isFinite(createdAt) &&
                  now - createdAt >= staleAfterMs &&
                  neverUpdated &&
                  String(run.head_sha || '') !== String(context.sha || '');

                if (staleQueuedIssueComment) {
                  await retireStaleQueuedRun(run);
                  continue;
                }

                active.push(JSON.stringify({
                  id: run.id,
                  name,
                  status,
                  event: run.event,
                  actor: run.actor?.login || null,
                  triggering_actor: run.triggering_actor?.login || null,
                  created_at: run.created_at,
                  updated_at: run.updated_at,
                  head_sha: run.head_sha,
                  workflow_id: run.workflow_id,
                  run_attempt: run.run_attempt,
                  display_title: run.display_title,
                }));
              }
            }
            if (active.length) core.setFailed(`Concurrent production workflow detected: ${active.join(', ')}`);

      - name: Repair only the proven invalid Web server API authority
        shell: bash
        run: bash scripts/production-p0-staff-api-origin-runtime-repair.sh
