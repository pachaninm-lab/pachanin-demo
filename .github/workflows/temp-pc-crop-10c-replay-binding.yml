name: TEMP PC-CROP-10C replay binding patch

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-pc-crop-10c-replay-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
      - name: Bind replay to current authority and exact command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts')
          source = path.read_text()
          replacements = [
            (
              '''  operationCode: string;
  requestSha256: string;
  decision: string;''',
              '''  operationCode: string;
  correlationId: string;
  requestReference: string;
  requestSha256: string;
  decision: string;''',
            ),
            (
              '''        const replay = await this.findReplay(tx, context, input.idempotencyKey);
        if (replay) return { replay, context, authorization: null, configuration: null } as const;
        const authorization = await this.lockAuthorization(tx, context, input.authorizationId);
        if (authorization.version !== BigInt(input.authorizationVersion)) {
          throw new PreconditionFailedException('Authorization version changed');
        }''',
              '''        const authorization = await this.lockAuthorization(tx, context, input.authorizationId);
        if (authorization.version !== BigInt(input.authorizationVersion)) {
          throw new PreconditionFailedException('Authorization version changed');
        }
        const replay = await this.findReplay(tx, context, input.idempotencyKey);
        if (replay) return { replay, context, authorization: null, configuration: null } as const;''',
            ),
            (
              '''      row.authorizationId !== input.authorizationId
      || row.operationCode !== input.operationCode
      || row.requestSha256 !== input.requestSha256''',
              '''      row.authorizationId !== input.authorizationId
      || row.operationCode !== input.operationCode
      || row.correlationId !== input.correlationId
      || row.requestReference !== input.requestReference
      || row.requestSha256 !== input.requestSha256''',
            ),
            (
              '''      SELECT "id", "authorizationId", "operationCode", "requestSha256",
             "decision", "providerRequestId", "responseReference",''',
              '''      SELECT "id", "authorizationId", "operationCode", "correlationId",
             "requestReference", "requestSha256", "decision", "providerRequestId", "responseReference",''',
            ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'replacement anchor count {source.count(old)} for {old[:60]!r}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          rm .github/workflows/temp-pc-crop-10c-replay-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts .github/workflows/temp-pc-crop-10c-replay-binding.yml
          git commit -m 'PC-CROP-10C: bind replay to exact current read authority'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
