name: Cancel Duplicate Release Runs 20260927

on:
  push:
    branches:
      - ops/gekta-live-storage-acceptance-20260927
    paths:
      - .github/workflows/cancel-duplicate-release-runs-20260927.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: 06f686d52247ebe7805f1b75d937b2ca8daf8f6f
      RUN_IDS: "36345284461 36345593886 36347424612 36347000571"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only pending exact-SHA duplicates
        shell: bash
        run: |
          set -euo pipefail
          for run_id in $RUN_IDS; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run")"
            sha="$(jq -r '.head_sha' <<<"$run")"
            name="$(jq -r '.name' <<<"$run")"
            echo "run=$run_id name=$name status=$status sha=$sha"
            [[ "$sha" == "$EXPECTED_SHA" ]] || { echo "skip wrong SHA"; continue; }
            case "$status" in
              queued|pending|waiting|requested)
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null
                echo "CANCEL_REQUESTED=$run_id"
                ;;
              in_progress)
                if [[ "$name" == "Gekta Production Browser Speed Baseline" ]]; then
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null
                  echo "CANCEL_REQUESTED=$run_id"
                else
                  echo "NO_CANCEL_ACTIVE_MUTATION=$run_id:$name"
                fi
                ;;
              *)
                echo "NO_CANCEL=$run_id:$status"
                ;;
            esac
          done
