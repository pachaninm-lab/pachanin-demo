name: platform-v7 autopilot generated merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: platform-v7-generated-merge-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  merge-generated:
    if: >-
      (github.event_name == 'pull_request_target' ||
       github.event_name == 'pull_request_review' ||
       github.event_name == 'pull_request_review_comment') &&
      github.event.pull_request.state == 'open' &&
      contains(github.event.pull_request.labels.*.name, 'platform-v7') &&
      contains(github.event.pull_request.labels.*.name, 'agent-generated') &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Inspect legacy product-slice authority
        id: authority
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('docs/platform-v7/autopilot/autopilot-state.json', 'utf8'));
          const current = String(state.current || '');
          const writable = Array.isArray(state.agentWritableScope) ? state.agentWritableScope : [];
          const active = /Autopilot Product Slice\s+\d+/i.test(current) && writable.length === 1;
          console.log(`active=${active}`);
          console.log(`current=${current.replace(/[\r\n]/g, ' ')}`);
          console.log(`writable_count=${writable.length}`);
          NODE

      - name: Guard and merge generated PR
        if: steps.authority.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          P7_GENERATED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          node --test docs/platform-v7/autopilot/verify-pr-review-gate.test.mjs
          node docs/platform-v7/autopilot/verify-pr-review-gate.mjs

          if ! REQUIRE_GREEN_CI=1 node docs/platform-v7/autopilot/verify-pr-review-gate.mjs; then
            echo 'Generated merge deferred: exact-head CI is not terminal green yet.'
            exit 0
          fi

          node scripts/p7-autopilot-generated-inline-checks.mjs
          node scripts/p7-autopilot-generated-merge-and-advance.mjs
          node scripts/p7-autopilot-generated-merge-reconcile.mjs

      - name: Skip outside legacy product-slice authority
        if: steps.authority.outputs.active != 'true'
        run: |
          echo "Generated PR merge is inactive for current authority: ${{ steps.authority.outputs.current }}"
          echo "agentWritableScope count: ${{ steps.authority.outputs.writable_count }}"

  reconcile-generated:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/reconcile generated'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Inspect legacy product-slice authority
        id: authority
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('docs/platform-v7/autopilot/autopilot-state.json', 'utf8'));
          const current = String(state.current || '');
          const writable = Array.isArray(state.agentWritableScope) ? state.agentWritableScope : [];
          const active = /Autopilot Product Slice\s+\d+/i.test(current) && writable.length === 1;
          console.log(`active=${active}`);
          console.log(`current=${current.replace(/[\r\n]/g, ' ')}`);
          console.log(`writable_count=${writable.length}`);
          NODE

      - name: Verify exact-head reviews for every reconciliation merge candidate
        if: steps.authority.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --test docs/platform-v7/autopilot/verify-pr-review-gate.test.mjs

          current_slice=$(node - <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('docs/platform-v7/autopilot/autopilot-state.json', 'utf8'));
          const match = String(state.current || '').match(/Autopilot Product Slice\s+(\d+)/i);
          process.stdout.write(match ? match[1] : '');
          NODE
          )
          [ -n "$current_slice" ] || { echo 'Unable to resolve current product slice.' >&2; exit 1; }

          gh pr list \
            --repo "$REPO" \
            --state open \
            --label platform-v7 \
            --limit 100 \
            --json number,headRefOid,headRefName,title,labels \
            > /tmp/p7-review-candidates.json

          CURRENT_SLICE="$current_slice" node <<'NODE' > /tmp/p7-review-candidates.tsv
          const fs = require('node:fs');
          const slice = Number(process.env.CURRENT_SLICE || 0);
          const prs = JSON.parse(fs.readFileSync('/tmp/p7-review-candidates.json', 'utf8'));
          for (const pr of prs) {
            const labels = new Set((pr.labels || []).map((label) => label.name));
            const titleMatch = String(pr.title || '').match(/autopilot product slice\s+(\d+)/i);
            const generated = labels.has('agent-generated') && labels.has('automerge') && Number(titleMatch?.[1] || 0) === slice;
            const stateAdvance = String(pr.headRefName || '').startsWith('p7-state/') && String(pr.title || '') === 'p7 advance after generated PR';
            if (generated || stateAdvance) {
              process.stdout.write(`${pr.number}\t${pr.headRefOid}\n`);
            }
          }
          NODE

          while IFS=$'\t' read -r pr_number head_sha; do
            [ -n "${pr_number:-}" ] || continue
            PR_NUMBER="$pr_number" HEAD_SHA="$head_sha" node docs/platform-v7/autopilot/verify-pr-review-gate.mjs
          done < /tmp/p7-review-candidates.tsv

      - name: Reconcile generated PRs
        if: steps.authority.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/p7-autopilot-generated-merge-reconcile.mjs

      - name: Skip outside legacy product-slice authority
        if: steps.authority.outputs.active != 'true'
        run: |
          echo "Generated PR reconciliation is inactive for current authority: ${{ steps.authority.outputs.current }}"
          echo "agentWritableScope count: ${{ steps.authority.outputs.writable_count }}"
