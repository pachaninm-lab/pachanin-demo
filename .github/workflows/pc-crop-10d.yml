name: PC-CROP-10D Final Repository Truth

on:
  pull_request:
    paths:
      - '.github/workflows/pc-crop-10d.yml'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-10d-final-truth.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.final-truth.schema.v1.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.final-truth.v1.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.readiness.v2.json'
      - 'scripts/pc-crop-10d/verify.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pc-crop-10d.yml'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-10d-final-truth.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.final-truth.schema.v1.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.final-truth.v1.json'
      - 'docs/platform-v7/crop-platform/agricultural-government-systems.readiness.v2.json'
      - 'scripts/pc-crop-10d/verify.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: pc-crop-10d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: artifacts/pc-crop-10d

jobs:
  final-repository-truth:
    name: Internal completion · external live blocked
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision and full ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve exact base and enforce active PC-CROP project lock
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
            export PC_CROP_BRANCH="${{ github.head_ref }}"
            export PC_CROP_TITLE="${{ github.event.pull_request.title }}"
            export PC_CROP_ISSUE="$(node -p "require('./docs/platform-v7/autopilot/scopes/pc-crop-10d-final-truth.json').issue")"
            export PC_CROP_SCOPE_PATH='docs/platform-v7/autopilot/scopes/pc-crop-10d-final-truth.json'
            node scripts/verify-pc-crop-project-lock.mjs | tee project-lock.log
          else
            base_ref='HEAD^'
          fi
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"

      - name: Parse every final-truth authority
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            docs/platform-v7/autopilot/project-locks/pc-crop-remainder.json \
            docs/platform-v7/autopilot/scopes/pc-crop-10d-final-truth.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.registry.v1.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.authority-bindings.v1.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.final-truth.schema.v1.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.final-truth.v1.json \
            docs/platform-v7/crop-platform/agricultural-government-systems.readiness.v2.json; do
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done

      - name: Verify immutable predecessors and fail-closed truth
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node --check scripts/pc-crop-10d/verify.mjs
          node scripts/pc-crop-10d/verify.mjs --self-test \
            | tee "$EVIDENCE_DIR/verification.log"

      - name: Require accepted PC-CROP-10C exact-main status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tenant_read_merge="$(
            node -p "require('./docs/platform-v7/crop-platform/agricultural-government-systems.final-truth.v1.json').terminalAuthority.mergeSha"
          )"
          gh api "repos/$GITHUB_REPOSITORY/commits/$tenant_read_merge/status" \
            --jq '.statuses[] | select(.context == "PC-CROP-10C exact-main" and .state == "success") | .context' \
            | grep -Fx 'PC-CROP-10C exact-main' \
            | tee "$EVIDENCE_DIR/pc-crop-10c-exact-main-status.txt"

      - name: Enforce machine-readable terminal acceptance
        shell: bash
        run: |
          set -euo pipefail
          node - "$EVIDENCE_DIR/acceptance.json" "$EXACT_HEAD" <<'NODE'
          const fs = require('node:fs');
          const [path, head] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.schemaVersion !== 'pc-crop-10d.acceptance.v1') process.exit(1);
          if (report.status !== 'PASS' || report.exactHead !== head) process.exit(2);
          if (report.slice !== 'PC-CROP-10D') process.exit(3);
          if (report.operationalStatus !== 'NOT_ATTESTED') process.exit(4);
          if (report.productionHosting !== 'REG_RU_VPS_ONLY') process.exit(5);
          if (report.internalRepositoryRemainderComplete !== true) process.exit(6);
          if (report.industrialLiveReady !== false) process.exit(7);
          if (report.counts?.acceptedAuthoritySlices !== 10) process.exit(8);
          if (report.counts?.acceptedFgisGrainRuntimeSlices !== 9) process.exit(9);
          if (report.counts?.liveDeclarations !== 0) process.exit(10);
          if (report.counts?.externalProviderE2E !== 'ABSENT') process.exit(11);
          if (Object.values(report.boundaries || {}).some(Boolean)) process.exit(12);
          if ((report.failures || []).length !== 0) process.exit(13);
          NODE

      - name: Upload exact-head PC-CROP-10D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-crop-10d-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

  exact-main-status:
    name: Publish PC-CROP-10D exact-main status
    if: always() && github.ref_name == 'main'
    needs: [final-repository-truth]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish final truth exact-main result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          RESULT: ${{ needs.final-repository-truth.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='PC-CROP-10D final repository truth failed'
          if [[ "$RESULT" == success ]]; then
            state=success
            description='PC-CROP repository remainder complete; external live remains not attested'
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" \
            -f context='PC-CROP-10D exact-main' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          [[ "$state" == success ]]
