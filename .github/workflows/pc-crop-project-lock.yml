name: PC-CROP Owner Recovery Route Governance Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc-crop-project-lock.yml'

permissions:
  contents: write

concurrency:
  group: pc-crop-owner-recovery-route-governance
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == github.repository_owner &&
      github.head_ref == 'governance/pc-crop-project-lock-3389'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Materialize exact public assistant recovery authorization
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

          python3 - "$BASE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          base_sha = sys.argv[1]
          lock_path = pathlib.Path('docs/platform-v7/autopilot/project-locks/pc-crop-remainder.json')
          scope_path = pathlib.Path('docs/platform-v7/autopilot/scopes/pc-crop-project-lock-3389.json')
          verifier_path = pathlib.Path('scripts/verify-pc-crop-project-lock.mjs')

          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          exceptions = lock.get('ownerAuthorizedExceptions')
          if not isinstance(exceptions, list) or len(exceptions) != 1:
              raise SystemExit('GOVERNANCE_MATERIALIZER_FAIL=EXCEPTION_SET')
          exception = exceptions[0]
          if exception.get('id') != 'PRODUCTION_AI_RECOVERY_3372':
              raise SystemExit('GOVERNANCE_MATERIALIZER_FAIL=EXCEPTION_ID')
          prefixes = exception.get('allowedPathPrefixes')
          expected = [
              '.github/workflows/tai-qwen-',
              '.github/workflows/tai-restricted-qwen-',
              'docs/platform-v7/autopilot/scopes/qwen-recovery-',
          ]
          if prefixes != expected:
              raise SystemExit('GOVERNANCE_MATERIALIZER_FAIL=PREFIX_DRIFT')
          exception['allowedPathPrefixes'] = [*expected, 'apps/web/middleware.ts']
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          scope = json.loads(scope_path.read_text(encoding='utf-8'))
          if scope.get('branch') != 'governance/pc-crop-project-lock-3389' or scope.get('issue') != 3389:
              raise SystemExit('GOVERNANCE_MATERIALIZER_FAIL=SCOPE_IDENTITY')
          scope['baseCommit'] = base_sha
          evidence = list(scope.get('requiredEvidence') or [])
          marker = 'Owner-authorized production AI recovery is limited to the exact public assistant middleware route'
          if marker not in evidence:
              evidence.append(marker)
          scope['requiredEvidence'] = evidence
          scope_path.write_text(json.dumps(scope, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          verifier = verifier_path.read_text(encoding='utf-8')
          old = """  assert(
            Array.isArray(exception.allowedPathPrefixes) && exception.allowedPathPrefixes.length === 3,
            'owner-authorized exception path prefixes incomplete',
            target,
          );
          """
          new = """  assert(
            Array.isArray(exception.allowedPathPrefixes) &&
              exception.allowedPathPrefixes.length === 4 &&
              exception.allowedPathPrefixes.includes('apps/web/middleware.ts'),
            'owner-authorized exception path prefixes incomplete',
            target,
          );
          """
          if verifier.count(old) != 1:
              raise SystemExit('GOVERNANCE_MATERIALIZER_FAIL=VERIFIER_ANCHOR')
          verifier = verifier.replace(old, new, 1)
          verifier_path.write_text(verifier, encoding='utf-8')
          PY

          git checkout origin/main -- .github/workflows/pc-crop-project-lock.yml
          node scripts/verify-pc-crop-project-lock.mjs --self-test
          PC_CROP_BRANCH='governance/pc-crop-project-lock-3389' \
          PC_CROP_TITLE='PC-CROP project lock: authorize exact public assistant recovery route' \
          PC_CROP_ISSUE=3389 \
          PC_CROP_SCOPE_PATH='docs/platform-v7/autopilot/scopes/pc-crop-project-lock-3389.json' \
            node scripts/verify-pc-crop-project-lock.mjs
          git diff --check

      - name: Rebuild as one clean governance commit
        env:
          BRANCH: governance/pc-crop-project-lock-3389
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git reset --soft "$BASE_SHA"
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          expected=(
            'docs/platform-v7/autopilot/project-locks/pc-crop-remainder.json'
            'docs/platform-v7/autopilot/scopes/pc-crop-project-lock-3389.json'
            'scripts/verify-pc-crop-project-lock.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --cached --check
          git config user.name 'pachaninm-lab'
          git config user.email '263435807+pachaninm-lab@users.noreply.github.com'
          git commit -m 'Authorize exact public assistant middleware recovery path'
          git push --force-with-lease="refs/heads/$BRANCH:$SOURCE_HEAD_SHA" origin "HEAD:refs/heads/$BRANCH"
