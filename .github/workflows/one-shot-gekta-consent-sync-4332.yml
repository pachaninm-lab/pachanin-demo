name: One-shot Gekta consent acceptance repair 4332

on:
  push:
    branches:
      - fix/gekta-production-consent-sync-4332
    paths:
      - '.github/workflows/one-shot-gekta-consent-sync-4332.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gekta-production-consent-sync-4332
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact bounded test synchronization patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/tests/e2e/gekta-production-mobile-acceptance.spec.ts')
          text = path.read_text()
          old = '''    await page.locator('[data-gekta-starter="true"]').first().click();
              await acceptConsentIfPresent(page);

              const composer = page.locator('#gekta-composer-input');'''
          new = '''    await page.locator('[data-gekta-starter="true"]').first().click();
              await acceptRequiredConsent(page);
              await expect(page.locator('[data-gekta-consent="true"]')).toHaveCount(0);

              const composer = page.locator('#gekta-composer-input');'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact active-chat consent block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one-shot-gekta-consent-sync-4332.yml
          git diff --check
          grep -Fq "await acceptRequiredConsent(page);" apps/web/tests/e2e/gekta-production-mobile-acceptance.spec.ts
          grep -Fq "await expect(page.locator('[data-gekta-consent=\"true\"]')).toHaveCount(0);" apps/web/tests/e2e/gekta-production-mobile-acceptance.spec.ts

      - name: Commit bounded result and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/tests/e2e/gekta-production-mobile-acceptance.spec.ts .github/workflows/one-shot-gekta-consent-sync-4332.yml
          git commit -m 'test(web): wait for required Gekta consent before keyboard soak'
          git push origin HEAD:fix/gekta-production-consent-sync-4332
