name: Identity RLS runtime and DR finalization

on:
  push:
    branches:
      - identity-rls-3670

permissions:
  contents: write

concurrency:
  group: identity-rls-runtime-dr-finalization
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: identity-rls-3670
          fetch-depth: 0

      - name: Finalize bounded runtime and DR authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          one_deal = Path('scripts/platform-v7-one-deal-e2e.sh')
          text = one_deal.read_text()
          target_grant = 'GRANT EXECUTE ON FUNCTION auth.resolve_staff_target_scope(TEXT, TEXT, TEXT, TEXT, TEXT) TO one_deal_auth;'
          if target_grant not in text:
              anchor = 'GRANT EXECUTE ON FUNCTION auth.resolve_session_identity(TEXT, TEXT, TEXT, TEXT) TO one_deal_auth;'
              if text.count(anchor) != 1:
                  raise SystemExit(f'one-deal: expected one session grant, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + '\n' + target_grant, 1)
          one_deal.write_text(text)

          dr = Path('scripts/platform-v7-database-dr-rehearsal.sh')
          text = dr.read_text()

          owner_signature = "    'auth.resolve_staff_target_scope(text,text,text,text,text)',"
          if owner_signature not in text:
              anchor = "    'auth.resolve_session_identity(text,text,text,text)',"
              if text.count(anchor) != 1:
                  raise SystemExit(f'dr: expected one owner anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + '\n' + owner_signature, 1)

          target_grant_dr = '    GRANT EXECUTE ON FUNCTION auth.resolve_staff_target_scope(text,text,text,text,text) TO one_deal_auth;'
          if target_grant_dr not in text:
              anchor = '    GRANT EXECUTE ON FUNCTION auth.resolve_session_identity(text,text,text,text) TO one_deal_auth;'
              if text.count(anchor) != 1:
                  raise SystemExit(f'dr: expected one grant anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + '\n' + target_grant_dr, 1)

          old_names = "         'resolve_session_identity', 'validate_deal_creation_actors')"
          new_names = "         'resolve_session_identity', 'resolve_staff_target_scope',\n         'validate_deal_creation_actors')"
          if 'resolve_staff_target_scope' not in text[text.find('RESTORE_IDENTITY_PROOF'):]:
              if old_names not in text:
                  raise SystemExit('dr: restored owner proof name anchor missing')
              text = text.replace(old_names, new_names, 1)

          old_where = "   WHERE (\n       n.nspname = 'auth'"
          if old_where in text:
              text = text.replace(old_where, "   WHERE ((\n       n.nspname = 'auth'", 1)
          old_close = "       AND p.proname = 'app_logistics_assignment_projection'\n     )\n     AND owner.rolname = 'pc_identity_bootstrap')::text"
          if old_close in text:
              text = text.replace(old_close, "       AND p.proname = 'app_logistics_assignment_projection'\n     ))\n     AND owner.rolname = 'pc_identity_bootstrap')::text", 1)

          text = text.replace('"3:9:0:1:1:0:1:0"', '"3:10:0:1:1:0:1:0"', 1)
          dr.write_text(text)

          Path('.github/workflows/identity-rls-runtime-dr-finalize.yml').unlink()
          PY

          git diff --check
          grep -q 'resolve_staff_target_scope(TEXT, TEXT, TEXT, TEXT, TEXT) TO one_deal_auth' scripts/platform-v7-one-deal-e2e.sh
          grep -q "'auth.resolve_staff_target_scope(text,text,text,text,text)'" scripts/platform-v7-database-dr-rehearsal.sh
          grep -q '"3:10:0:1:1:0:1:0"' scripts/platform-v7-database-dr-rehearsal.sh

      - name: Commit exact finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(identity-rls): finalize runtime and DR authority"
          git push origin HEAD:identity-rls-3670
