name: TAI REG.RU Runner Resume Once

on:
  push:
    branches:
      - agent/tai-reg-ru-bootstrap-repair-20260801
    paths:
      - .github/workflows/tai-reg-ru-runner-resume-once.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: tai-reg-ru-runner-resume-once
  cancel-in-progress: false

env:
  CANONICAL_HOST: 195.19.12.120
  PUBLIC_HOST: xn----8sbjf4befbjgs9b.xn--p1ai
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}

jobs:
  resume:
    runs-on: ubuntu-24.04
    if: github.actor == github.repository_owner
    timeout-minutes: 10
    steps:
      - name: Diagnose transport and resume existing least-privilege runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          state=failure
          description='REG.RU runner resume failed'
          publish() {
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context='TAI REG.RU Runner Resume' \
              -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }
          trap publish EXIT
          state=pending
          description='Diagnosing REG.RU transport and resuming runner'
          publish
          state=failure

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          host="$(trim "${SSH_HOST_SECRET:-$CANONICAL_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          configured_port="$(trim "${SSH_PORT_SECRET:-22}")"
          key="${SSH_KEY_PRIMARY:-${SSH_KEY_SECONDARY:-${SSH_KEY_FALLBACK:-}}}"
          [[ "$host" == "$CANONICAL_HOST" ]]
          [[ -n "$user" && -n "$key" ]]
          [[ "$configured_port" =~ ^[0-9]+$ ]] && (( configured_port >= 1 && configured_port <= 65535 ))

          https_state=unreachable
          if curl --silent --show-error --insecure --head \
            --connect-timeout 10 --max-time 20 \
            -H "Host: ${PUBLIC_HOST}" "https://${host}/" >/dev/null; then
            https_state=reachable
          fi
          echo "REG.RU HTTPS: ${https_state}"

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$key" | tr -d '\r' > "$HOME/.ssh/id_pc_prod"
          chmod 0600 "$HOME/.ssh/id_pc_prod"
          ssh-keygen -y -f "$HOME/.ssh/id_pc_prod" >/dev/null

          ports=("$configured_port")
          [[ "$configured_port" == 22 ]] || ports+=(22)
          selected_port=''
          : > "$HOME/.ssh/known_hosts"
          for candidate_index in "${!ports[@]}"; do
            candidate="${ports[$candidate_index]}"
            for attempt in 1 2 3; do
              echo "SSH candidate $((candidate_index + 1)) attempt ${attempt}/3"
              if ssh-keyscan -T 12 -p "$candidate" -H "$host" > "$HOME/.ssh/known_hosts" 2>/dev/null && [[ -s "$HOME/.ssh/known_hosts" ]]; then
                selected_port="$candidate"
                break 2
              fi
              : > "$HOME/.ssh/known_hosts"
              sleep 4
            done
          done
          [[ -n "$selected_port" ]] || {
            if [[ "$https_state" == reachable ]]; then
              description='REG.RU online; SSH endpoint unreachable'
              echo REG_RU_HTTPS_ONLY_SSH_UNREACHABLE >&2
            else
              description='REG.RU production host unreachable'
              echo REG_RU_HOST_UNREACHABLE >&2
            fi
            exit 31
          }
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_pc_prod" -p "$selected_port" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes \
            "$user@$host" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(id -u)" -eq 0 ]]
          service_file="$(find /etc/systemd/system -maxdepth 1 -type f -name 'actions.runner.pachaninm-lab-pachanin-demo.pc-prod-*.service' -print -quit)"
          [[ -n "$service_file" ]]
          service_name="$(basename "$service_file")"
          systemctl daemon-reload
          systemctl enable "$service_name" >/dev/null
          systemctl restart "$service_name"
          systemctl is-active --quiet "$service_name"
          [[ "$(systemctl show "$service_name" --property=User --value)" == pcactions ]]
          main_pid="$(systemctl show "$service_name" --property=MainPID --value)"
          [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]
          echo RUNNER_RESUMED
          REMOTE

          state=success
          description='REG.RU least-privilege runner resumed'
