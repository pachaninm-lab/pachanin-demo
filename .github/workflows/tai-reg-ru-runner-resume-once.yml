name: TAI REG.RU PostgreSQL Authority Inspect Once

on:
  push:
    branches:
      - agent/tai-reg-ru-bootstrap-repair-20260801
    paths:
      - .github/workflows/tai-reg-ru-runner-resume-once.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: tai-reg-ru-postgres-authority-inspect-once
  cancel-in-progress: false

env:
  CANONICAL_PROD_HOST: 195.19.12.120
  PROD_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  PROD_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  PROD_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  PROD_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  PROD_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  PROD_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}

jobs:
  inspect:
    runs-on: ubuntu-24.04
    if: github.actor == github.repository_owner
    timeout-minutes: 10
    steps:
      - name: Inspect active API database authority without secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          state=failure
          description='PostgreSQL authority inspection failed'
          publish() {
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" -f context='TAI PostgreSQL Authority Inspect' \
              -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }
          trap publish EXIT
          state=pending; description='Inspecting production Compose database authority'; publish
          state=failure

          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"; rm -f "$a" "$b" "$c"; return 0
              fi
            done
            rm -f "$a" "$b" "$c"; return 1
          }
          host="$(trim "${PROD_HOST_SECRET:-$CANONICAL_PROD_HOST}")"
          user="$(trim "${PROD_USER_SECRET:-}")"
          port="$(trim "${PROD_PORT_SECRET:-22}")"
          [[ "$host" == "$CANONICAL_PROD_HOST" && -n "$user" ]]
          install -d -m 0700 "$HOME/.ssh"
          key="${PROD_KEY_PRIMARY:-${PROD_KEY_SECONDARY:-${PROD_KEY_FALLBACK:-}}}"
          write_key "$key" "$HOME/.ssh/id_pc_prod"
          ssh-keyscan -T 15 -p "$port" -H "$host" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$user@$host" 'python3 -' <<'PY'
          import json, re, subprocess
          from urllib.parse import urlparse

          web_ids = subprocess.check_output([
              'docker','ps','-q','--filter','label=com.docker.compose.service=web'
          ], text=True).split()
          if len(web_ids) != 1:
              raise SystemExit('web authority ambiguous')
          web_id = web_ids[0]
          def inspect(template):
              return subprocess.check_output(['docker','inspect','--format',template,web_id],text=True).strip()
          prod_dir=inspect('{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')
          prod_files=inspect('{{ index .Config.Labels "com.docker.compose.project.config_files" }}')
          prod_project=inspect('{{ index .Config.Labels "com.docker.compose.project" }}')
          cmd=['docker','compose','--project-directory',prod_dir,'--project-name',prod_project]
          for raw in prod_files.split(','):
              path=raw.strip()
              if not path: continue
              if not path.startswith('/'): path=f'{prod_dir}/{path}'
              if not path.endswith('/compose.tai-agro-os.override.yml'):
                  cmd.extend(['-f',path])
          cfg=json.loads(subprocess.check_output(cmd+['config','--format','json'],text=True))
          api_id=subprocess.check_output(cmd+['ps','-q','api'],text=True).strip().splitlines()[0]
          env_lines=subprocess.check_output([
              'docker','inspect','--format','{{range .Config.Env}}{{println .}}{{end}}',api_id
          ],text=True).splitlines()
          dsn=next((line.split('=',1)[1] for line in env_lines if line.startswith('DATABASE_URL=')), '')
          parsed=urlparse(dsn)
          print(f'API_DATABASE_SCHEME={parsed.scheme}')
          print(f'API_DATABASE_HOST={parsed.hostname or ""}')
          print(f'API_DATABASE_NAME={parsed.path.lstrip("/")}')
          services=cfg.get('services') or {}
          old=[]
          for name,service in sorted(services.items()):
              image=str(service.get('image') or '')
              matches=bool(re.search(r'(^|[-_])(postgres|postgresql)([-_]|$)',name,re.I) or 'postgres' in image.lower())
              if matches: old.append(name)
              print(f'SERVICE={name}|IMAGE={image}|OLD_MATCH={str(matches).lower()}')
          print('OLD_MATCHES=' + ','.join(old))
          print('DATABASE_HOST_IS_SERVICE=' + str((parsed.hostname or '') in services).lower())
          PY

          state=success
          description='Production PostgreSQL authority inspected'
