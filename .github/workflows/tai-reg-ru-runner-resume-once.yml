name: TAI REG.RU Runner Resume Once

on:
  push:
    branches:
      - agent/tai-reg-ru-bootstrap-repair-20260801
    paths:
      - .github/workflows/tai-reg-ru-runner-resume-once.yml

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: tai-model-transport-provision-once
  cancel-in-progress: false

env:
  TARGET_SHA: 0a4d5c854485d3b51db0144bdeb2bbe4ce4c7830
  CANONICAL_PROD_HOST: 195.19.12.120
  PROD_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  PROD_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  PROD_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  PROD_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  PROD_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  PROD_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}

jobs:
  provision-and-dispatch:
    runs-on: ubuntu-24.04
    if: github.actor == github.repository_owner
    timeout-minutes: 15
    steps:
      - name: Provision protected model key on REG.RU controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          state=failure
          description='Protected model transport provisioning failed'
          publish() {
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$state" \
              -f context='TAI Model Transport Provisioning' \
              -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }
          trap publish EXIT
          state=pending
          description='Installing protected model transport authority'
          publish
          state=failure

          current_main="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$current_main" == "$TARGET_SHA" ]]

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          write_key() {
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }

          host="$(trim "${PROD_HOST_SECRET:-$CANONICAL_PROD_HOST}")"
          user="$(trim "${PROD_USER_SECRET:-}")"
          port="$(trim "${PROD_PORT_SECRET:-22}")"
          [[ "$host" == "$CANONICAL_PROD_HOST" ]]
          [[ -n "$user" ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))

          install -d -m 0700 "$HOME/.ssh"
          prod_key="${PROD_KEY_PRIMARY:-${PROD_KEY_SECONDARY:-${PROD_KEY_FALLBACK:-}}}"
          write_key "$prod_key" "$HOME/.ssh/id_pc_prod" || {
            description='Protected production SSH key is invalid'
            exit 21
          }
          write_key "${MODEL_KEY_SECRET:-}" "$HOME/.ssh/id_tai_model" || {
            description='Protected model SSH key is absent or invalid'
            exit 22
          }

          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 12 -p "$port" -H "$host" > "$HOME/.ssh/known_hosts" 2>/dev/null && [[ -s "$HOME/.ssh/known_hosts" ]]; then
              break
            fi
            : > "$HOME/.ssh/known_hosts"
            sleep 4
          done
          [[ -s "$HOME/.ssh/known_hosts" ]] || {
            description='REG.RU production SSH endpoint is unreachable'
            exit 23
          }
          chmod 0600 "$HOME/.ssh/known_hosts"

          cat "$HOME/.ssh/id_tai_model" | ssh \
            -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$user@$host" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(id -u)" -eq 0 ]]
          install -d -m 0700 -o root -g root /etc/pc-release-authority
          tmp="$(mktemp /etc/pc-release-authority/.model-id.XXXXXX)"
          trap 'rm -f "$tmp"' EXIT
          cat > "$tmp"
          chmod 0600 "$tmp"
          ssh-keygen -y -P '' -f "$tmp" >/dev/null
          install -m 0600 -o root -g root "$tmp" /etc/pc-release-authority/model_id
          [[ "$(stat -c '%U:%G:%a:%h' /etc/pc-release-authority/model_id)" == root:root:600:1 ]]
          [[ -s /etc/pc-release-authority/model_known_hosts && ! -L /etc/pc-release-authority/model_known_hosts ]]
          ssh-keygen -y -P '' -f /etc/pc-release-authority/model_id >/dev/null
          REMOTE

          state=success
          description='Protected model transport authority installed'

      - name: Dispatch exact-main standalone TAI deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run tai-reg-ru-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_sha="$TARGET_SHA" \
            -f confirmation=DEPLOY-TAI-REG-RU
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/tai-reg-ru-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=20" \
              --jq '.workflow_runs[] | select(.head_sha == env.TARGET_SHA) | .id' | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]]
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='TAI REG.RU Deployment' \
            -f description='Standalone TAI deployment redispatched after transport repair' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null
          echo "DEPLOYMENT_RUN_ID=$run_id"
