name: TAI REG.RU Runner Resume Once

on:
  push:
    branches:
      - agent/tai-reg-ru-bootstrap-repair-20260801
    paths:
      - .github/workflows/tai-reg-ru-runner-resume-once.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: tai-reg-ru-bounded-unused-image-reclaim
  cancel-in-progress: false

env:
  TARGET_SHA: 0a4d5c854485d3b51db0144bdeb2bbe4ce4c7830
  CANONICAL_PROD_HOST: 195.19.12.120
  PROD_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  PROD_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  PROD_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  PROD_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  PROD_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  PROD_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}

jobs:
  reclaim:
    runs-on: ubuntu-24.04
    if: github.actor == github.repository_owner
    timeout-minutes: 20
    steps:
      - name: Reclaim unused images older than 24h and prove active runtime unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          state=failure
          description='Bounded unused-image reclaim failed'
          publish() {
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$state" \
              -f context='TAI REG.RU Docker Capacity' \
              -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }
          trap publish EXIT
          state=pending
          description='Pruning only unused images older than 24 hours'
          publish
          state=failure

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          write_key() {
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }

          host="$(trim "${PROD_HOST_SECRET:-$CANONICAL_PROD_HOST}")"
          user="$(trim "${PROD_USER_SECRET:-}")"
          port="$(trim "${PROD_PORT_SECRET:-22}")"
          [[ "$host" == "$CANONICAL_PROD_HOST" && -n "$user" ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -d -m 0700 "$HOME/.ssh"
          prod_key="${PROD_KEY_PRIMARY:-${PROD_KEY_SECONDARY:-${PROD_KEY_FALLBACK:-}}}"
          write_key "$prod_key" "$HOME/.ssh/id_pc_prod"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 12 -p "$port" -H "$host" > "$HOME/.ssh/known_hosts" 2>/dev/null && [[ -s "$HOME/.ssh/known_hosts" ]]; then break; fi
            : > "$HOME/.ssh/known_hosts"; sleep 4
          done
          [[ -s "$HOME/.ssh/known_hosts" ]]
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$user@$host" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(id -u)" -eq 0 ]]
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          docker ps --no-trunc --format '{{.ID}}|{{.Image}}|{{.Names}}' | sort > "$work/running.before"
          docker ps -q | sort > "$work/container-ids.before"
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            docker inspect --format '{{.Image}}' "$id"
          done < "$work/container-ids.before" | sort -u > "$work/active-image-ids.before"
          before_kb="$(df -Pk /var/lib/docker | awk 'NR==2 {print $4}')"
          echo "DOCKER_AVAILABLE_KB_BEFORE=$before_kb"
          echo "ACTIVE_IMAGE_COUNT=$(wc -l < "$work/active-image-ids.before")"
          docker system df

          docker image prune --all --force --filter until=24h

          docker ps --no-trunc --format '{{.ID}}|{{.Image}}|{{.Names}}' | sort > "$work/running.after"
          cmp -s "$work/running.before" "$work/running.after" || {
            echo ACTIVE_RUNTIME_CHANGED >&2
            diff -u "$work/running.before" "$work/running.after" >&2 || true
            exit 41
          }
          while IFS= read -r image_id; do
            [[ -n "$image_id" ]] || continue
            docker image inspect "$image_id" >/dev/null || {
              echo ACTIVE_IMAGE_REMOVED >&2
              exit 42
            }
          done < "$work/active-image-ids.before"

          after_kb="$(df -Pk /var/lib/docker | awk 'NR==2 {print $4}')"
          echo "DOCKER_AVAILABLE_KB_AFTER=$after_kb"
          (( after_kb >= 5242880 )) || {
            echo DOCKER_CAPACITY_STILL_LOW >&2
            docker system df >&2
            exit 43
          }
          docker ps --format '{{.Names}}|{{.Status}}' | sort
          docker system df
          echo UNUSED_IMAGE_RECLAIM_PASS
          REMOTE

          state=success
          description='Docker capacity PASS; active runtime unchanged'
