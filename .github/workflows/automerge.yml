name: Repo automations

# This existing workflow only reports engineering readiness. It cannot merge.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request to evaluate for manual review
        required: true
        type: string
  workflow_run:
    workflows:
      - CI
      - Node CI
      - API Tests
      - web-unit
      - Production-like Kubernetes Acceptance
      - Outbox Worker Topology Acceptance
      - Production Hosting Authority
      - PC-CROP Active Project Lock
      - PC-CROP Scope Governance Acceptance
      - Netlify Retirement Authority
      - Workflow Syntax Guard
      - PC-CROP-10A Government Systems Registry
      - CI PostgreSQL Image Authority
      - Production Staff Database URL Provision
      - Security Scan
      - Dependency Review
      - Disputes PostgreSQL Authority Acceptance
      - Outbox PostgreSQL Authority Acceptance
      - platform-v7 autopilot guard
      - Security Quality Gate
      - platform-v7 autopilot executor wiring
      - Optional Runtime Retirement Gate
      - Qodana platform-v7 report
      - PC-CROP-01B.4 Post-merge Remediation Acceptance
      - Canonical SBOM Generation & IP Clean Room
      - Auction Atomic Execution Acceptance
      - Security Abuse and Evidence Acceptance
      - CodeQL platform-v7 report
      - Runtime Context Security Gate
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
  checks: write
  statuses: write

# Serial publication prevents an older evaluator overwriting a newer result.
concurrency:
  group: repo-engineering-readiness
  cancel-in-progress: false
  queue: max

jobs:
  engineering-readiness:
    name: Reconcile engineering readiness
    if: >-
      (github.event_name != 'workflow_dispatch' ||
        (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request &&
         github.event.comment.user.login == github.repository_owner &&
         github.event.comment.author_association == 'OWNER' &&
         github.event.comment.body == '/merge-readiness')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.repository.id == github.event.repository.id &&
         github.event.workflow_run.name != 'Repo automations' &&
         github.event.workflow_run.name != 'Local Qwen Independent Review' &&
         github.event.workflow_run.name != 'Independent Octopus Review'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Evaluate exact-head engineering readiness
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const checkName = 'Exact-head clean-comment gate';
            const statusContext = 'merge-readiness/exact-head';
            const detailsUrl = `${context.serverUrl}/${repository}/actions/runs/${context.runId}`;
            const sha40 = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
            const positiveNumber = value => /^[1-9][0-9]*$/.test(String(value)) && Number.isSafeInteger(Number(value));
            const candidates = new Map();
            const addCandidate = (number, expectedHead = '') => {
              if (!positiveNumber(number) || (expectedHead && !sha40(expectedHead))) throw new Error('READINESS_CANDIDATE_INVALID');
              const key = Number(number);
              if (candidates.has(key) && candidates.get(key) !== expectedHead) throw new Error('READINESS_CANDIDATE_CONFLICT');
              candidates.set(key, expectedHead);
              if (candidates.size > 100) throw new Error('READINESS_CANDIDATE_LIMIT');
            };

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run?.repository?.id !== context.payload.repository?.id || !sha40(run?.head_sha)) throw new Error('READINESS_RUN_INVALID');
              if (['Repo automations', 'Local Qwen Independent Review', 'Independent Octopus Review'].includes(run.name)) return;
              const associated = Array.isArray(run.pull_requests) && run.pull_requests.length
                ? run.pull_requests
                : await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                    owner, repo, commit_sha: run.head_sha, per_page: 100,
                  });
              for (const pr of associated) addCandidate(pr.number, pr.head?.sha || '');
            } else if (context.eventName === 'workflow_dispatch') {
              if (context.ref !== 'refs/heads/main' || context.actor !== owner) throw new Error('READINESS_MANUAL_AUTHORITY_INVALID');
              addCandidate(context.payload.inputs?.pr_number);
            } else if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment;
              if (!context.payload.issue?.pull_request || comment?.user?.login !== owner || comment?.author_association !== 'OWNER' || comment?.body !== '/merge-readiness') return;
              addCandidate(context.payload.issue.number);
            } else if (['pull_request_target', 'pull_request_review', 'pull_request_review_comment'].includes(context.eventName)) {
              addCandidate(context.payload.pull_request?.number, context.payload.pull_request?.head?.sha);
            } else {
              throw new Error('READINESS_EVENT_UNSUPPORTED');
            }

            let blocked = false;
            for (const [number, expectedHead] of candidates) {
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
              if (pr.base?.repo?.full_name !== repository || pr.base?.ref !== 'main' || !sha40(pr.head?.sha)) throw new Error('READINESS_PR_INVALID');
              if (expectedHead && pr.head.sha !== expectedHead) continue;
              const head = pr.head.sha;
              // These labels no longer confer review or merge authority.
              for (const label of ['review-gate-passed', 'review-gate-bootstrap-passed']) {
                if ((pr.labels || []).some(value => value.name === label)) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: label });
                  } catch (error) {
                    if (error.status !== 404) throw new Error('READINESS_LABEL_INVALIDATION_FAILED');
                  }
                }
              }
              const check = (await github.rest.checks.create({
                owner, repo, name: checkName, head_sha: head, status: 'in_progress', details_url: detailsUrl,
                output: { title: 'Engineering readiness evaluation', summary: 'Independent review and a manual exact-SHA merge remain required.' },
              })).data;
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: head, context: statusContext, state: 'pending', target_url: detailsUrl,
                description: 'Engineering readiness is being evaluated; manual review remains required',
              });

              let ready = false;
              try {
                if (pr.state !== 'open' || pr.draft !== false || pr.auto_merge !== null) throw new Error('READINESS_PR_NOT_MANUAL');
                const output = execFileSync('node', ['docs/platform-v7/autopilot/verify-pr-review-gate.mjs', '--manual-readiness'], {
                  encoding: 'utf8', timeout: 600000, maxBuffer: 1024 * 1024,
                  stdio: ['ignore', 'pipe', 'pipe'],
                  env: { ...process.env, REPO: repository, PR_NUMBER: String(number), HEAD_SHA: head, REQUIRE_GREEN_CI: '1' },
                });
                const results = output.split(/\r?\n/).filter(line => line.startsWith('MERGE_READINESS_RESULT='));
                if (results.length !== 1) throw new Error('READINESS_RESULT_MISSING');
                const result = JSON.parse(results[0].slice('MERGE_READINESS_RESULT='.length));
                if (!result || Array.isArray(result) || Object.keys(result).sort().join(',') !== 'automaticMergeAllowed,head,independentReviewRequired,schemaVersion,status'
                  || result.schemaVersion !== 'platform-v7.merge-readiness.v1'
                  || result.status !== 'READY_FOR_MANUAL_REVIEW' || result.head !== head
                  || result.independentReviewRequired !== true || result.automaticMergeAllowed !== false) {
                  throw new Error('READINESS_RESULT_INVALID');
                }
                const live = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
                ready = live.head?.sha === head && live.state === 'open' && live.draft === false
                  && live.base?.ref === 'main' && live.base?.repo?.full_name === repository && live.auto_merge === null;
              } catch {
                // Raw API/provider output is never converted to evidence or published.
                ready = false;
              }
              const description = ready
                ? 'Engineering checks ready; independent review and manual merge still required'
                : 'Engineering readiness blocked; manual merge is not ready';
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: head, context: statusContext, state: ready ? 'success' : 'failure',
                target_url: detailsUrl, description,
              });
              await github.rest.checks.update({
                owner, repo, check_run_id: check.id, status: 'completed', conclusion: ready ? 'success' : 'failure',
                completed_at: new Date().toISOString(), details_url: detailsUrl,
                output: {
                  title: ready ? 'Ready for independent manual review' : 'Engineering readiness blocked',
                  summary: `PR #${number}; exact head ${head}. ${description}. No independent-review approval or merge authority is issued.`,
                },
              });
              core.info(`ENGINEERING_READINESS=${ready ? 'READY_FOR_MANUAL_REVIEW' : 'BLOCKED'} pr=${number} head=${head}`);
              blocked ||= !ready;
            }
            if (blocked) core.setFailed('Engineering readiness is blocked for at least one exact PR head.');
