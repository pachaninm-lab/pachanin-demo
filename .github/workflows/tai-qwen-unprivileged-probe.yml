name: TAI Qwen Unprivileged Capability Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/tai-qwen-unprivileged-probe.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tai-qwen-unprivileged-probe.yml'

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: tai-qwen-unprivileged-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
  MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
  MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
  PROD_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  PROD_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  PROD_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}

jobs:
  probe:
    if: >-
      github.event_name == 'push' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ops/qwen-unprivileged-probe-3372-7'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish probe pending status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending \
            -f context='TAI Qwen Unprivileged Probe exact-revision' \
            -f description='Read-only model-user capability probe is running' \
            -f target_url="$run_url" >/dev/null

      - name: Resolve protected non-root SSH transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }
          model_host="$(trim "${MODEL_HOST_SECRET:-}")"
          model_user="$(trim "${MODEL_USER_SECRET:-}")"
          model_port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$model_host" && "$model_user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$model_port" =~ ^[0-9]+$ ]] && ((model_port>=1 && model_port<=65535))
          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"
          model_key="${MODEL_KEY_SECRET:-${PROD_KEY_PRIMARY:-${PROD_KEY_SECONDARY:-${PROD_KEY_FALLBACK:-}}}}"
          write_key "$model_key" "$HOME/.ssh/id_tai_model"
          ssh-keyscan -T 10 -p "$model_port" "$model_host" 2>/dev/null | sort -u > "$HOME/.ssh/model_known_hosts"
          [[ -s "$HOME/.ssh/model_known_hosts" ]]
          chmod 0600 "$HOME/.ssh/model_known_hosts"
          {
            echo "model_host=$model_host"
            echo "model_user=$model_user"
            echo "model_port=$model_port"
          } >> "$GITHUB_OUTPUT"

      - name: Probe read-only model-user capabilities
        id: probe
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.model_host }}
          MODEL_USER: ${{ steps.ssh.outputs.model_user }}
          MODEL_SSH_PORT: ${{ steps.ssh.outputs.model_port }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" \
            -o StrictHostKeyChecking=yes "$MODEL_USER@$MODEL_HOST" 'bash -s' <<'REMOTE'
          set -u
          service=tai-qwen3-8b.service
          env_file=/etc/tai/qwen3-8b.env
          service_active=0
          systemctl is-active --quiet "$service" && service_active=1
          env_readable=0
          [ -r "$env_file" ] && env_readable=1
          service_user="$(systemctl show "$service" --property=User --value 2>/dev/null || true)"
          same_user=0
          [ -n "$service_user" ] && [ "$service_user" = "$(id -un)" ] && same_user=1
          main_pid="$(systemctl show "$service" --property=MainPID --value 2>/dev/null || true)"
          case "$main_pid" in ""|*[!0-9]*) main_pid=0 ;; esac
          proc_readable=0
          [ "$main_pid" -gt 1 ] && [ -r "/proc/$main_pid/environ" ] && proc_readable=1
          private_listener=0
          ss -H -ltn 2>/dev/null | awk '$4 == "192.168.0.206:18080" { found=1 } END { exit(found ? 0 : 1) }' && private_listener=1
          public_absent=1
          ss -H -ltn 2>/dev/null | awk '$4 == "0.0.0.0:18080" || $4 == "[::]:18080" || $4 == "*:18080" { found=1 } END { exit(found ? 0 : 1) }' && public_absent=0
          key_source=NONE
          key=""
          if [ "$env_readable" -eq 1 ]; then
            set +u
            set -a
            . "$env_file" >/dev/null 2>&1 || true
            set +a
            key="${TAI_LLM_API_KEY:-}"
            unset TAI_LLM_API_KEY
            [ "${#key}" -ge 32 ] && key_source=ENV_FILE
            set -u
          fi
          if [ "$key_source" = NONE ] && [ "$proc_readable" -eq 1 ]; then
            key="$(tr '\000' '\n' < "/proc/$main_pid/environ" 2>/dev/null | awk -F= '$1 == "TAI_LLM_API_KEY" { sub(/^[^=]*=/, ""); print; exit }')"
            [ "${#key}" -ge 32 ] && key_source=PROC_ENV
          fi
          auth_health=0
          if [ "$key_source" != NONE ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 15 -H "Authorization: Bearer $key" http://192.168.0.206:18080/health 2>/dev/null || true)"
            [ "$code" = 200 ] && auth_health=1
          fi
          unset key
          printf 'SERVICE_ACTIVE=%s\n' "$service_active"
          printf 'ENV_READABLE=%s\n' "$env_readable"
          printf 'SAME_AS_SERVICE_USER=%s\n' "$same_user"
          printf 'PROC_ENV_READABLE=%s\n' "$proc_readable"
          printf 'PRIVATE_LISTENER=%s\n' "$private_listener"
          printf 'PUBLIC_LISTENER_ABSENT=%s\n' "$public_absent"
          printf 'KEY_SOURCE=%s\n' "$key_source"
          printf 'AUTHENTICATED_HEALTH_200=%s\n' "$auth_health"
          REMOTE
          )"
          printf '%s\n' "$output"
          while IFS='=' read -r key value; do
            case "$key" in
              SERVICE_ACTIVE|ENV_READABLE|SAME_AS_SERVICE_USER|PROC_ENV_READABLE|PRIVATE_LISTENER|PUBLIC_LISTENER_ABSENT|KEY_SOURCE|AUTHENTICATED_HEALTH_200)
                printf '%s=%s\n' "${key,,}" "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done <<< "$output"

      - name: Publish bounded diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SERVICE_ACTIVE: ${{ steps.probe.outputs.service_active || '0' }}
          ENV_READABLE: ${{ steps.probe.outputs.env_readable || '0' }}
          SAME_AS_SERVICE_USER: ${{ steps.probe.outputs.same_as_service_user || '0' }}
          PROC_ENV_READABLE: ${{ steps.probe.outputs.proc_env_readable || '0' }}
          PRIVATE_LISTENER: ${{ steps.probe.outputs.private_listener || '0' }}
          PUBLIC_LISTENER_ABSENT: ${{ steps.probe.outputs.public_listener_absent || '0' }}
          KEY_SOURCE: ${{ steps.probe.outputs.key_source || 'NONE' }}
          AUTHENTICATED_HEALTH_200: ${{ steps.probe.outputs.authenticated_health_200 || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          state=failure
          description='Unprivileged model access is insufficient'
          if [[ "$SERVICE_ACTIVE" == 1 && "$PRIVATE_LISTENER" == 1 && "$PUBLIC_LISTENER_ABSENT" == 1 && "$AUTHENTICATED_HEALTH_200" == 1 ]]; then
            state=success
            description='Unprivileged authenticated Qwen access is ready'
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" \
            -f context='TAI Qwen Unprivileged Probe exact-revision' \
            -f description="$description" \
            -f target_url="$run_url" >/dev/null
          body="Read-only Qwen model-user capability probe completed for exact revision \`$TARGET_SHA\`. Service active: \`$SERVICE_ACTIVE\`; env readable: \`$ENV_READABLE\`; SSH user equals service user: \`$SAME_AS_SERVICE_USER\`; process environment readable: \`$PROC_ENV_READABLE\`; exact private listener: \`$PRIVATE_LISTENER\`; public listener absent: \`$PUBLIC_LISTENER_ABSENT\`; bounded key source: \`$KEY_SOURCE\`; authenticated health 200: \`$AUTHENTICATED_HEALTH_200\`. Probe: $run_url. No secret values or production mutations occurred."
          gh issue reopen 3372 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh issue comment 3372 --repo "$GITHUB_REPOSITORY" --body "$body"
