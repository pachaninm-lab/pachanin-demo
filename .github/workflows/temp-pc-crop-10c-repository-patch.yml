name: TEMP PC-CROP-10C repository patch

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-pc-crop-10c-repository-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
      - name: Patch Prisma text-array binding and remove launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts"); s=p.read_text(); old="${input.allowedOperations}::text[]"; new="ARRAY[${Prisma.join(input.allowedOperations)}]::text[]"; assert s.count(old) == 2, s.count(old); p.write_text(s.replace(old, new))'
          rm .github/workflows/temp-pc-crop-10c-repository-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts .github/workflows/temp-pc-crop-10c-repository-patch.yml
          git commit -m 'PC-CROP-10C: bind PostgreSQL read operation arrays safely'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
