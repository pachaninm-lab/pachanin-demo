name: TAI PostgreSQL Repair Materializer Inspect Once

on:
  push:
    branches:
      - agent/tai-reg-ru-bootstrap-repair-20260801
    paths:
      - .github/workflows/tai-chain-inspect-once.yml

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    if: github.actor == github.repository_owner
    steps:
      - name: Inspect materializer run and branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/tai-postgres-authority-materialize.yml/runs?branch=agent/tai-postgres-authority-20260801&per_page=10")"
          printf '%s' "$run_json" | jq -r '.workflow_runs[] | [.id,.status,(.conclusion//"-"),.head_sha,.html_url] | @tsv'
          run_id="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].id // 0')"
          [[ "$run_id" != 0 ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | [.id,.name,.status,(.conclusion//"-")] | @tsv'
          head_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/agent/tai-postgres-authority-20260801" --jq .sha)"
          description="materializer=$(printf '%s' "$run_json" | jq -r '.workflow_runs[0] | "\(.status):\(.conclusion//"-")"'); head=${head_sha:0:7}"
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='TAI PostgreSQL Materializer Inspect' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
