name: TAI Exact-Main Chain Inspect Once

on:
  push:
    branches:
      - agent/tai-reg-ru-bootstrap-repair-20260801
    paths:
      - .github/workflows/tai-chain-inspect-once.yml

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    if: github.actor == github.repository_owner
    env:
      TARGET_SHA: 0a4d5c854485d3b51db0144bdeb2bbe4ce4c7830
    steps:
      - name: Inspect exact-main workflow chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          inspect_workflow() {
            local workflow="$1"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=20" \
              --jq --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha) | {id,name,status,conclusion,event,head_sha,created_at,updated_at,html_url}]'
          }
          mkdir -p "$RUNNER_TEMP/tai-chain"
          inspect_workflow tai-reg-ru-preflight.yml > "$RUNNER_TEMP/tai-chain/preflight.json"
          inspect_workflow tai-restricted-qwen-reg-ru-activation.yml > "$RUNNER_TEMP/tai-chain/activation.json"
          inspect_workflow tai-reg-ru-deploy.yml > "$RUNNER_TEMP/tai-chain/deployment.json"
          python3 - "$RUNNER_TEMP/tai-chain" > "$RUNNER_TEMP/tai-chain/summary.json" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          result = {}
          for name in ('preflight','activation','deployment'):
              runs = json.loads((root / f'{name}.json').read_text())
              result[name] = runs[0] if runs else None
          print(json.dumps(result, sort_keys=True, separators=(',',':')))
          PY
          summary="$(cat "$RUNNER_TEMP/tai-chain/summary.json")"
          description="$(python3 - "$RUNNER_TEMP/tai-chain/summary.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          parts=[]
          for key in ('preflight','activation','deployment'):
              run=data.get(key)
              value='missing' if run is None else f"{run.get('status')}:{run.get('conclusion') or '-'}"
              parts.append(f"{key}={value}")
          print('; '.join(parts)[:140])
          PY
          )"
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='TAI Exact-Main Chain Inspect' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/upload-artifact@v4
        with:
          name: tai-exact-main-chain-${{ github.run_id }}
          path: ${{ runner.temp }}/tai-chain
          if-no-files-found: error
          retention-days: 1
