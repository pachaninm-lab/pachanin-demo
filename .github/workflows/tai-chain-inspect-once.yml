name: TAI Exact-Main Chain Inspect Once

on:
  push:
    branches:
      - agent/tai-reg-ru-bootstrap-repair-20260801
    paths:
      - .github/workflows/tai-chain-inspect-once.yml

permissions:
  contents: read
  statuses: write

env:
  CANONICAL_PROD_HOST: 195.19.12.120
  PROD_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  PROD_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  PROD_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  PROD_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  PROD_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  PROD_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    if: github.actor == github.repository_owner
    timeout-minutes: 10
    steps:
      - name: Print bounded redacted deployment log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          publish() {
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$1" -f context='TAI Controller Diagnostic' \
              -f description="$2" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }
          trap 'publish failure "Bounded deploy-log diagnostic failed"' EXIT
          publish pending 'Reading bounded redacted deploy log'
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key() {
            local raw="$1" target="$2" a b c; [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; printf '%s' "${raw//\\n/$'\n'}" > "$b"; printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for x in "$a" "$b" "$c"; do if [[ -s "$x" ]] && ssh-keygen -y -P '' -f "$x" >/dev/null 2>&1; then install -m 0600 "$x" "$target"; rm -f "$a" "$b" "$c"; return 0; fi; done
            rm -f "$a" "$b" "$c"; return 1
          }
          host="$(trim "${PROD_HOST_SECRET:-$CANONICAL_PROD_HOST}")"; user="$(trim "${PROD_USER_SECRET:-}")"; port="$(trim "${PROD_PORT_SECRET:-22}")"
          install -d -m 0700 "$HOME/.ssh"; key="${PROD_KEY_PRIMARY:-${PROD_KEY_SECONDARY:-${PROD_KEY_FALLBACK:-}}}"; write_key "$key" "$HOME/.ssh/id_pc_prod"
          ssh-keyscan -T 15 -p "$port" -H "$host" > "$HOME/.ssh/known_hosts"; chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$user@$host" 'python3 -' <<'PY'
          import pathlib,re
          job=pathlib.Path('/var/lib/pc-release-authority/controller-jobs/30694093424')
          state=pathlib.Path('/var/lib/pc-release-authority/tai-agro-os-30694093424')
          print(f'DEPLOY_STATE_EXISTS={state.exists()}')
          for name in ('deploy.log','deployment-failure.json'):
              p=job/name
              print(f'--- {name} exists={p.is_file()} size={p.stat().st_size if p.is_file() else 0} ---')
              if not p.is_file(): continue
              text=p.read_text(encoding='utf-8',errors='replace')
              text=re.sub(r'(?i)(authorization|bearer|api[_-]?key|private[_-]?key|password|token|secret)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
              print(text[:10000])
          if state.is_dir():
              for p in sorted(state.iterdir()):
                  print(f'STATE={p.name}|{p.stat().st_size if p.is_file() else 0}')
          PY
          trap - EXIT
          publish success 'Bounded deploy log extracted'
