name: TAI one-shot plant-disease completeness repair

on:
  push:
    branches:
      - fix/tai-plant-disease-completeness-20260805
    paths:
      - .github/workflows/tai-one-shot-plant-disease-completeness.yml

permissions:
  contents: write

concurrency:
  group: tai-one-shot-plant-disease-completeness
  cancel-in-progress: false

jobs:
  patch:
    name: Apply bounded disease-completeness repair
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/tai-plant-disease-completeness-20260805
          fetch-depth: 0

      - name: Materialize and execute governed patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/tai-plant-disease-patch.py"
          python3 "$RUNNER_TEMP/tai-plant-disease-patch.py"
          node --check scripts/tai-potato-mobile-live-acceptance.mjs
          git diff --check
          grep -Fq 'GENERAL_AGRO_PLANT_DISEASE_COMPLETENESS_FLOOR' apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts
          grep -Fq "id: 'sanitation-inoculum'" scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "adds a bounded plant-disease completeness floor" apps/api/src/modules/ai-insights/restricted-public-qwen.quality.spec.ts

      - name: Commit governed repair and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tai-one-shot-plant-disease-completeness.yml
          git add \
            apps/api/src/modules/ai-insights/restricted-public-qwen.service.ts \
            apps/api/src/modules/ai-insights/restricted-public-qwen.quality.spec.ts \
            scripts/tai-potato-mobile-live-acceptance.mjs
          git diff --cached --check
          git commit -m "fix(tai): enforce disease-specific answer completeness"
          git push origin HEAD:fix/tai-plant-disease-completeness-20260805
