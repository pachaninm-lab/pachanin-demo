name: One-shot Stage Qwen Subtitle Selector

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/one-shot-stage-qwen-subtitle-selector.yml'

permissions:
  contents: write

jobs:
  stage:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/qwen-subtitle-stable-selector-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Stage selector-corrected activation workflow as ordinary file
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_BASE: 25402379df279ea1bde69a0d80608276317f08c5
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git merge-base HEAD origin/main)" == "$EXPECTED_BASE" ]]
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_BASE" ]]
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml')
          text = source.read_text(encoding='utf-8')
          old = "dialog.locator('.pc-public-assistant-identity div > span')"
          new = "dialog.locator('[data-pc-public-assistant-subtitle=\"true\"]')"
          if text.count(old) != 1:
              raise SystemExit(f'unexpected subtitle locator count: {text.count(old)}')
          text = text.replace(old, new, 1)
          assert new in text and old not in text
          staging = Path('docs/platform-v7/autopilot/artifacts/tai-restricted-qwen-reg-ru-activation-stable-subtitle.yml')
          staging.parent.mkdir(parents=True, exist_ok=True)
          staging.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/platform-v7/autopilot/artifacts/tai-restricted-qwen-reg-ru-activation-stable-subtitle.yml
          git commit -m 'OPS: stage stable subtitle-selector activation workflow'
          git push origin "HEAD:$HEAD_BRANCH"
