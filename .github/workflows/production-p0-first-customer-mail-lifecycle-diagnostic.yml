name: Production P0 First-Customer Mail Lifecycle Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-first-customer-mail-lifecycle-diagnostic.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-p0-first-customer-mail-lifecycle-diagnostic
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  SUBJECT_SHA: 55f78afe5f01f1aa2732a984b5cc0ccb1ccfcc71
  RUN_WINDOW_START: '2026-08-15T12:56:00Z'
  RUN_WINDOW_END: '2026-08-15T13:01:00Z'
  DIAGNOSTIC_COMMAND: /production p0-first-customer-mail-lifecycle 31885882933
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate read-only mail lifecycle diagnostic
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/production-p0-first-customer-mail-lifecycle-diagnostic.yml').read_text(encoding='utf-8')
          required=[
            'SUBJECT_SHA: 55f78afe5f01f1aa2732a984b5cc0ccb1ccfcc71',
            "RUN_WINDOW_START: '2026-08-15T12:56:00Z'",
            "RUN_WINDOW_END: '2026-08-15T13:01:00Z'",
            'REGISTRATION_EMAIL_VERIFICATION',
            'OUTBOX_WINDOW_COUNT',
            'OUTBOX_SENT_COUNT',
            'OUTBOX_PENDING_COUNT',
            'OUTBOX_PROCESSING_COUNT',
            'OUTBOX_DEAD_COUNT',
            'OUTBOX_ATTEMPT_MAX',
            'OUTBOX_ERROR_CLASS',
            'PRODUCTION_MUTATION NONE',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('missing invariant: '+' | '.join(missing))
          diagnostic=text.split('\n  diagnostic:\n',1)[1]
          forbidden=[
            'docker restart','docker rm','docker compose','ALTER ROLE','CREATE ROLE','DROP ROLE',
            'GRANT ','REVOKE ','INSERT INTO','UPDATE auth.','DELETE FROM','TRUNCATE ',
            'prisma migrate','prisma db execute','sendAuthMailSmtp(','claimBatch(','markSent(','markFailure(',
          ]
          bad=[x for x in forbidden if x in diagnostic]
          if bad: raise SystemExit('mutation surface forbidden: '+' | '.join(bad))
          PY

  diagnostic:
    name: Inspect failed candidate-A auth-mail lifecycle without mutation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-first-customer-mail-lifecycle 31885882933' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bind current main to failed-run production subject
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$(git rev-parse HEAD)" == "$main_sha" ]]
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SUBJECT_SHA}^{commit}"
          git merge-base --is-ancestor "$SUBJECT_SHA" "$main_sha"
          git diff --quiet "$SUBJECT_SHA..$main_sha" -- \
            apps/api/src/auth-mail-worker.ts \
            apps/api/src/modules/auth-mail/auth-mail-outbox.service.ts \
            apps/api/src/modules/auth-mail/auth-mail-smtp.ts \
            apps/api/src/modules/auth-mail/auth-mail-templates.ts \
            apps/api/prisma/migrations/20260812010000_p0_industrial_auth_mail_outbox/migration.sql \
            scripts/provision-production-auth-mail-runtime.sh \
            scripts/production-auth-mail-outbox-cutover-core.sh
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || exit 10
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$ready" == 1 ]] || exit 15
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Classify candidate-A mail-outbox lifecycle
        id: diagnostic
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"; clean="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$SUBJECT_SHA' '$RUN_WINDOW_START' '$RUN_WINDOW_END'" > "$raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          subject_sha="$1"; window_start="$2"; window_end="$3"
          tmp="$(mktemp -d /tmp/pc-p0-mail-lifecycle.XXXXXX)"
          trap 'rm -rf -- "$tmp"' EXIT
          emit(){ printf '%s=%s\n' "$1" "$2"; }
          fail(){ emit MAIL_LIFECYCLE_DIAGNOSTIC FAIL; emit ERROR_CODE "$1"; emit PRODUCTION_MUTATION NONE; exit "${2:-1}"; }
          [[ "$(id -u)" -eq 0 ]] || fail ROOT_REQUIRED 20
          [[ "$subject_sha" =~ ^[0-9a-f]{40}$ ]] || fail SUBJECT_SHA_INVALID 21

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || fail WEB_CARDINALITY 22
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          [[ "$project" =~ ^[A-Za-z0-9_.-]{1,128}$ ]] || fail PROJECT_INVALID 23
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          mapfile -t worker_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker')
          (( ${#api_ids[@]} == 1 )) || fail API_CARDINALITY 24
          (( ${#worker_ids[@]} == 1 )) || fail WORKER_CARDINALITY 25
          api_id="${api_ids[0]}"; worker_id="${worker_ids[0]}"
          api_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")"
          web_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")"
          worker_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$worker_id")"
          [[ "$api_rev" == "$subject_sha" && "$web_rev" == "$subject_sha" && "$worker_rev" == "$subject_sha" ]] || fail PRODUCTION_REVISION_DRIFT 26
          emit PRODUCTION_REVISION PASS

          docker exec -i "$worker_id" /nodejs/bin/node --input-type=commonjs - "$window_start" "$window_end" > "$tmp/db.out" 2>/dev/null <<'NODE'
          const {readFileSync}=require('node:fs');
          const {PrismaClient}=require('@prisma/client');
          const [start,end]=process.argv.slice(2);
          const safe=s=>String(s??'NONE').toUpperCase().replace(/[^A-Z0-9_:-]/g,'_').slice(0,100)||'NONE';
          (async()=>{
            const file=String(process.env.AUTH_MAIL_DATABASE_URL_FILE||'').trim();
            if(!file) throw new Error('DB_FILE_MISSING');
            const url=readFileSync(file,'utf8').trim();
            const db=new PrismaClient({datasources:{db:{url}}});
            try{
              const principal=await db.$queryRawUnsafe("SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user");
              const p=principal?.[0];
              if(!p || p.current_user!=='pc_auth_mail_runtime' || p.rolsuper || p.rolbypassrls) throw new Error('PRINCIPAL_BOUNDARY');
              const rows=await db.$queryRawUnsafe(`
                SELECT status, attempt_count, COALESCE(last_error_code,'NONE') AS last_error_code,
                       (sent_at IS NOT NULL) AS has_sent_at
                FROM auth.mail_outbox
                WHERE message_kind='REGISTRATION_EMAIL_VERIFICATION'
                  AND created_at >= $1::timestamptz
                  AND created_at < $2::timestamptz
                ORDER BY created_at, id
              `, start, end);
              const counts={PENDING:0,PROCESSING:0,SENT:0,DEAD_LETTER:0};
              let maxAttempt=0; const errors=new Set(); let sentAt=0;
              for(const row of rows){
                if(Object.prototype.hasOwnProperty.call(counts,row.status)) counts[row.status]+=1;
                maxAttempt=Math.max(maxAttempt,Number(row.attempt_count||0));
                errors.add(safe(row.last_error_code));
                if(row.has_sent_at) sentAt+=1;
              }
              console.log(`OUTBOX_WINDOW_COUNT=${rows.length}`);
              console.log(`OUTBOX_PENDING_COUNT=${counts.PENDING}`);
              console.log(`OUTBOX_PROCESSING_COUNT=${counts.PROCESSING}`);
              console.log(`OUTBOX_SENT_COUNT=${counts.SENT}`);
              console.log(`OUTBOX_DEAD_COUNT=${counts.DEAD_LETTER}`);
              console.log(`OUTBOX_ATTEMPT_MAX=${maxAttempt}`);
              console.log(`OUTBOX_SENT_AT_COUNT=${sentAt}`);
              console.log(`OUTBOX_ERROR_CLASS=${rows.length ? [...errors].sort().join(':').slice(0,100) : 'NONE'}`);
            } finally { await db.$disconnect().catch(()=>{}); }
          })().catch(e=>{console.log(`DB_SAFE_ERROR=${safe(e?.message||e?.name||'UNKNOWN')}`);process.exitCode=1});
          NODE
          db_rc=$?
          sed -nE '/^(OUTBOX_WINDOW_COUNT|OUTBOX_PENDING_COUNT|OUTBOX_PROCESSING_COUNT|OUTBOX_SENT_COUNT|OUTBOX_DEAD_COUNT|OUTBOX_ATTEMPT_MAX|OUTBOX_SENT_AT_COUNT)=[0-9]{1,8}$/p; /^(OUTBOX_ERROR_CLASS|DB_SAFE_ERROR)=[A-Z0-9_:-]{1,100}$/p' "$tmp/db.out"
          (( db_rc == 0 )) || fail OUTBOX_READ_FAILED 27

          docker exec -i "$worker_id" /nodejs/bin/node --input-type=commonjs - > "$tmp/metrics.out" 2>/dev/null <<'NODE'
          (async()=>{
            try{
              const r=await fetch('http://127.0.0.1:3003/metrics',{signal:AbortSignal.timeout(5000)});
              if(!r.ok) throw new Error('HTTP_'+r.status);
              const j=await r.json();
              const n=v=>Number.isFinite(Number(v))?Math.max(0,Math.floor(Number(v))):0;
              const safe=s=>String(s??'NONE').toUpperCase().replace(/[^A-Z0-9_:-]/g,'_').slice(0,100)||'NONE';
              console.log(`WORKER_CLAIMED=${n(j.claimed)}`);
              console.log(`WORKER_SENT=${n(j.sent)}`);
              console.log(`WORKER_RETRIED=${n(j.retried)}`);
              console.log(`WORKER_DEAD=${n(j.deadLettered)}`);
              console.log(`WORKER_LAST_ERROR=${safe(j.lastErrorCode)}`);
            }catch(e){console.log('WORKER_METRICS_SAFE_ERROR=UNAVAILABLE');process.exitCode=1}
          })();
          NODE
          metrics_rc=$?
          sed -nE '/^(WORKER_CLAIMED|WORKER_SENT|WORKER_RETRIED|WORKER_DEAD)=[0-9]{1,12}$/p; /^(WORKER_LAST_ERROR|WORKER_METRICS_SAFE_ERROR)=[A-Z0-9_:-]{1,100}$/p' "$tmp/metrics.out"
          (( metrics_rc == 0 )) || true

          emit MAIL_LIFECYCLE_DIAGNOSTIC PASS
          emit ERROR_CODE NONE
          emit PRODUCTION_MUTATION NONE
          REMOTE
          rc=$?
          set -e
          sed -nE '/^(MAIL_LIFECYCLE_DIAGNOSTIC|ERROR_CODE|PRODUCTION_REVISION|OUTBOX_WINDOW_COUNT|OUTBOX_PENDING_COUNT|OUTBOX_PROCESSING_COUNT|OUTBOX_SENT_COUNT|OUTBOX_DEAD_COUNT|OUTBOX_ATTEMPT_MAX|OUTBOX_SENT_AT_COUNT|OUTBOX_ERROR_CLASS|DB_SAFE_ERROR|WORKER_CLAIMED|WORKER_SENT|WORKER_RETRIED|WORKER_DEAD|WORKER_LAST_ERROR|WORKER_METRICS_SAFE_ERROR|PRODUCTION_MUTATION)=[A-Za-z0-9_.:-]{1,160}$/p' "$raw" > "$clean"
          rm -f "$raw"
          cat "$clean"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r k v; do
            case "$k" in
              MAIL_LIFECYCLE_DIAGNOSTIC|ERROR_CODE|PRODUCTION_REVISION|OUTBOX_WINDOW_COUNT|OUTBOX_PENDING_COUNT|OUTBOX_PROCESSING_COUNT|OUTBOX_SENT_COUNT|OUTBOX_DEAD_COUNT|OUTBOX_ATTEMPT_MAX|OUTBOX_SENT_AT_COUNT|OUTBOX_ERROR_CLASS|DB_SAFE_ERROR|WORKER_CLAIMED|WORKER_SENT|WORKER_RETRIED|WORKER_DEAD|WORKER_LAST_ERROR|WORKER_METRICS_SAFE_ERROR|PRODUCTION_MUTATION)
                echo "${k,,}=$v" >> "$GITHUB_OUTPUT";;
            esac
          done < "$clean"
          rm -f "$clean"

      - name: Publish sanitized lifecycle evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
          RC: ${{ steps.diagnostic.outputs.rc }}
          RESULT: ${{ steps.diagnostic.outputs.mail_lifecycle_diagnostic }}
          ERROR: ${{ steps.diagnostic.outputs.error_code }}
          REVISION: ${{ steps.diagnostic.outputs.production_revision }}
          COUNT: ${{ steps.diagnostic.outputs.outbox_window_count }}
          SENT: ${{ steps.diagnostic.outputs.outbox_sent_count }}
          PENDING: ${{ steps.diagnostic.outputs.outbox_pending_count }}
          PROCESSING: ${{ steps.diagnostic.outputs.outbox_processing_count }}
          DEAD: ${{ steps.diagnostic.outputs.outbox_dead_count }}
          ATTEMPTS: ${{ steps.diagnostic.outputs.outbox_attempt_max }}
          SENT_AT: ${{ steps.diagnostic.outputs.outbox_sent_at_count }}
          ERROR_CLASS: ${{ steps.diagnostic.outputs.outbox_error_class }}
          WORKER_CLAIMED: ${{ steps.diagnostic.outputs.worker_claimed }}
          WORKER_SENT: ${{ steps.diagnostic.outputs.worker_sent }}
          WORKER_RETRIED: ${{ steps.diagnostic.outputs.worker_retried }}
          WORKER_DEAD: ${{ steps.diagnostic.outputs.worker_dead }}
          WORKER_LAST_ERROR: ${{ steps.diagnostic.outputs.worker_last_error }}
          MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP first-customer verification mail lifecycle · run 31885882933'; echo
            echo "- diagnostic main: \`${MAIN_SHA:-unknown}\`"
            echo "- subject production SHA: \`$SUBJECT_SHA\`"
            echo "- result: \`${RESULT:-unknown}\` (rc=\`${RC:-unknown}\`)"
            echo "- safe error: \`${ERROR:-unknown}\`"
            echo "- production revision parity: \`${REVISION:-unknown}\`"
            echo "- registration verification outbox rows in failed-run window: \`${COUNT:-unknown}\`"
            echo "- SENT / PENDING / PROCESSING / DEAD_LETTER: \`${SENT:-unknown} / ${PENDING:-unknown} / ${PROCESSING:-unknown} / ${DEAD:-unknown}\`"
            echo "- max attempts / sent_at rows / safe outbox error class: \`${ATTEMPTS:-unknown} / ${SENT_AT:-unknown} / ${ERROR_CLASS:-unknown}\`"
            echo "- current worker cumulative claimed/sent/retried/dead: \`${WORKER_CLAIMED:-unknown} / ${WORKER_SENT:-unknown} / ${WORKER_RETRIED:-unknown} / ${WORKER_DEAD:-unknown}\`"
            echo "- current worker safe last error: \`${WORKER_LAST_ERROR:-unknown}\`"
            echo "- production mutation: \`${MUTATION:-unknown}\`"
            echo '- recipients, message bodies, bearer links/tokens, credentials, database URLs, container IDs and raw provider responses are not published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Enforce read-only result
        shell: bash
        env:
          RC: ${{ steps.diagnostic.outputs.rc }}
          RESULT: ${{ steps.diagnostic.outputs.mail_lifecycle_diagnostic }}
          MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          [[ "${RC:-1}" == 0 ]]
          [[ "$RESULT" == PASS ]]
          [[ "$MUTATION" == NONE ]]
