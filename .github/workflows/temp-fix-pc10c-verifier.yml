name: Temporary fix PC-CROP-10C verifier

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-fix-pc10c-verifier.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
          persist-credentials: true
      - name: Align verifier with conditional runtime-role grant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/pc-crop-10c/verify.mjs')
          source = path.read_text()
          old = "check(migration.includes('GRANT SELECT, INSERT ON public.\"fgis_grain_tenant_read_audits\"'), 'audit runtime grant is not append-only');"
          new = "check(migration.includes('GRANT SELECT, INSERT ON TABLE public.\"fgis_grain_tenant_read_audits\"'), 'audit runtime grant is not append-only');"
          if source.count(old) != 1:
              raise SystemExit(f'verifier grant anchor count: {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/pc-crop-10c/verify.mjs
          git commit -m 'PC-CROP-10C: align append-only grant verification'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
