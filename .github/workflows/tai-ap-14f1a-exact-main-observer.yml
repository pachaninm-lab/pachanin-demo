name: TAI AP-14F1A Exact Main Observer

on:
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f1a-exact-main-observer.yml'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1a-exact-main-observer-3345.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tai-ap-14f1a-exact-main-observer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_MAIN_SHA: fcd0a372fb3a94ba36408479bd1b18f33b16c4e8
  EVIDENCE_DIR: artifacts/tai-ap-14f1a-exact-main
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tai_ap14f1a_exact_main

jobs:
  exact-main:
    name: Reproduce AP-14F1A on accepted main SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: ghcr.io/pachaninm-lab/ci-postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tai_ap14f1a_exact_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tai_ap14f1a_exact_main"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout observer exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify observer source-controlled scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          export BASE_REF=origin/main
          export GITHUB_HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          bash scripts/p7-autopilot-guard.sh

      - name: Checkout accepted exact-main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_MAIN_SHA }}
          fetch-depth: 0

      - name: Prove accepted SHA remains in main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN_SHA"
          git merge-base --is-ancestor "$TARGET_MAIN_SHA" origin/main
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$TARGET_MAIN_SHA" > "$EVIDENCE_DIR/exact-main.txt"
          git rev-parse origin/main > "$EVIDENCE_DIR/current-main.txt"
          printf '%s\n' "${TARGET_MAIN_SHA}^" > "$EVIDENCE_DIR/base-ref.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/tai/pyproject.toml

      - name: Install exact-main TAI toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e 'apps/tai[dev]'

      - name: Reproduce static, unit and PostgreSQL exploit acceptance
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            apps/tai/tai/public_official_corpus.py \
            apps/tai/tai/postgres_public_official_corpus.py \
            apps/tai/tests/test_public_official_corpus.py \
            apps/tai/tests/test_postgres_public_official_corpus.py \
            apps/tai/tests/test_migration_manifest.py \
            | tee "$EVIDENCE_DIR/ruff.txt"
          mypy \
            apps/tai/tai/public_official_corpus.py \
            apps/tai/tai/postgres_public_official_corpus.py \
            | tee "$EVIDENCE_DIR/mypy.txt"
          pytest \
            apps/tai/tests/test_public_official_corpus.py \
            apps/tai/tests/test_postgres_public_official_corpus.py \
            apps/tai/tests/test_migration_manifest.py \
            | tee "$EVIDENCE_DIR/pytest.txt"

      - name: Reproduce exact-main slice verifier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tai-ap-14f1a/verify.mjs \
            --scope-guard "${TARGET_MAIN_SHA}^" \
            | tee "$EVIDENCE_DIR/acceptance.json"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/acceptance.json`, 'utf8'));
          if (report.status !== 'PASS') process.exit(1);
          if (report.operationalStatus !== 'NOT_ATTESTED') process.exit(1);
          if (report.productionHosting !== 'REG_RU_VPS_ONLY') process.exit(1);
          if (report.counts.changedPaths !== 11) process.exit(1);
          if (report.counts.migrationVersion !== 21) process.exit(1);
          if (report.counts.auditEventTypes !== 7) process.exit(1);
          if (Object.values(report.boundaries).some(Boolean)) process.exit(1);
          NODE

      - name: Upload AP-14F1A exact-main evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-ap-14f1a-exact-main-${{ env.TARGET_MAIN_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
