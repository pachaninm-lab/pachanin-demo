name: TAI Owner Incomplete Deployment Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/tai-owner-incomplete-deployment-recovery.yml"
      - "scripts/tai-incomplete-deployment-recovery.sh"
      - "scripts/check-tai-incomplete-deployment-recovery.mjs"
      - "docs/platform-v7/autopilot/scopes/tai-incomplete-deployment-recovery-20260807.json"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: tai-owner-incomplete-deployment-recovery-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  EVIDENCE_DIR: artifacts/tai-incomplete-deployment-recovery

jobs:
  authority:
    name: Resolve exact successful full-stack recovery authority
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3365 &&
        github.event.comment.body == '/tai recover-incomplete-deployment current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.authority.outputs.target_sha }}
      full_stack_run_id: ${{ steps.authority.outputs.full_stack_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bounded recovery contract
        if: github.event_name == 'pull_request'
        run: |
          set -Eeuo pipefail
          bash -n scripts/tai-incomplete-deployment-recovery.sh
          node scripts/check-tai-incomplete-deployment-recovery.mjs
      - name: Verify owner command and exact successful full-stack authority
        id: authority
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENTER" == "$OWNER" ]]
          [[ "$ACTOR" == "$OWNER" ]]
          [[ "$TRIGGERING_ACTOR" == "$OWNER" ]]
          target_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-full-stack-exact-sha.yml/runs?branch=main&status=success&per_page=100" \
            > "$RUNNER_TEMP/full-stack-runs.json"
          candidate_run_ids="$(node - "$RUNNER_TEMP/full-stack-runs.json" "$target_sha" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require('node:fs');
          const [path, sha, repository] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const allowedEvents = new Set(['push', 'workflow_dispatch', 'issue_comment', 'workflow_run']);
          const runs = (Array.isArray(report.workflow_runs) ? report.workflow_runs : [])
            .filter((run) => run?.name === 'Production Full-Stack Exact-SHA Release'
              && run?.head_sha === sha
              && run?.head_branch === 'main'
              && run?.head_repository?.full_name === repository
              && run?.status === 'completed'
              && run?.conclusion === 'success'
              && allowedEvents.has(run?.event)
              && Number.isSafeInteger(run?.id) && run.id > 0)
            .sort((left, right) => Date.parse(right.updated_at || right.created_at || '') - Date.parse(left.updated_at || left.created_at || '') || right.id - left.id);
          if (!runs.length) process.exit(2);
          process.stdout.write(runs.map((run) => String(run.id)).join('\n'));
          NODE
          )"
          [[ -n "$candidate_run_ids" ]]
          full_stack_run_id=''
          while IFS= read -r candidate_run_id; do
            [[ "$candidate_run_id" =~ ^[0-9]+$ ]] || exit 2
            jobs="$RUNNER_TEMP/full-stack-jobs-${candidate_run_id}.json"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/jobs?per_page=100" > "$jobs"
            if node - "$jobs" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report || !Array.isArray(report.jobs) || report.total_count !== report.jobs.length) process.exit(2);
          for (const name of ['Validate full-stack release contract', 'Migrate, deploy API and web, verify live intake']) {
            const matches = report.jobs.filter((job) => job?.name === name);
            if (matches.length !== 1 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success') process.exit(3);
          }
          NODE
            then
              full_stack_run_id="$candidate_run_id"
              break
            fi
          done <<< "$candidate_run_ids"
          [[ "$full_stack_run_id" =~ ^[0-9]+$ ]]
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "full_stack_run_id=$full_stack_run_id" >> "$GITHUB_OUTPUT"

  recover:
    name: Recover bounded incomplete TAI deployment on REG.RU
    needs: authority
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success' &&
      needs.authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      recovered_target_sha: ${{ steps.verify.outputs.recovered_target_sha }}
      recovered_run_id: ${{ steps.verify.outputs.recovered_run_id }}
      role_action: ${{ steps.verify.outputs.role_action }}
    env:
      TARGET_SHA: ${{ needs.authority.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact recovery source
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          bash -n scripts/tai-incomplete-deployment-recovery.sh
          node scripts/check-tai-incomplete-deployment-recovery.mjs
      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            ssh-keygen -lf "$public_key" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo 'No valid protected SSH private key is configured.' >&2
            exit 14
          }
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; docker compose version >/dev/null; echo ROOT_SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Copy bounded recovery asset
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes scripts/tai-incomplete-deployment-recovery.sh \
            "$USER@$HOST:/tmp/pc-tai-incomplete-recovery-${GITHUB_RUN_ID}.sh"
      - name: Execute exact bounded recovery
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          remote_script="/tmp/pc-tai-incomplete-recovery-${GITHUB_RUN_ID}.sh"
          remote_evidence="/var/lib/pc-release-authority/runner-output/${GITHUB_RUN_ID}/incomplete-tai-recovery.json"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "chmod 0700 '$remote_script' && '$remote_script' '$TARGET_SHA' '$GITHUB_RUN_ID' '$remote_evidence'" \
            | tee "$EVIDENCE_DIR/recovery.log"
          grep -Fxq TAI_INCOMPLETE_DEPLOYMENT_RECOVERY=PASS "$EVIDENCE_DIR/recovery.log"
      - name: Retrieve and validate redacted recovery evidence
        id: verify
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          remote_evidence="/var/lib/pc-release-authority/runner-output/${GITHUB_RUN_ID}/incomplete-tai-recovery.json"
          local_evidence="$EVIDENCE_DIR/incomplete-tai-recovery.json"
          scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$USER@$HOST:$remote_evidence" "$local_evidence"
          node - "$local_evidence" "$TARGET_SHA" <<'NODE' > "$RUNNER_TEMP/recovery-output"
          const fs = require('node:fs');
          const [path, sha] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.schemaVersion !== 'tai.incomplete-deployment-recovery.v1') process.exit(2);
          if (report.currentSha !== sha || !/^[0-9a-f]{40}$/.test(report.recoveredTargetSha || '') || report.recoveredTargetSha === sha) process.exit(3);
          if (!/^[0-9]{1,20}$/.test(String(report.recoveredRunId || ''))) process.exit(4);
          if (typeof report.previousTaiRestored !== 'boolean') process.exit(5);
          if (!['DROPPED_CREATED_ROLE','PRESERVED_PREEXISTING'].includes(report.runtimeRoleAction)) process.exit(6);
          if (report.productionHosting !== 'REG_RU_VPS_ONLY' || report.newRecurringCostRub !== 0 || report.passed !== true) process.exit(7);
          process.stdout.write(`${report.recoveredTargetSha}\n${report.recoveredRunId}\n${report.runtimeRoleAction}\n`);
          NODE
          recovered_target_sha="$(sed -n '1p' "$RUNNER_TEMP/recovery-output")"
          recovered_run_id="$(sed -n '2p' "$RUNNER_TEMP/recovery-output")"
          role_action="$(sed -n '3p' "$RUNNER_TEMP/recovery-output")"
          echo "recovered_target_sha=$recovered_target_sha" >> "$GITHUB_OUTPUT"
          echo "recovered_run_id=$recovered_run_id" >> "$GITHUB_OUTPUT"
          echo "role_action=$role_action" >> "$GITHUB_OUTPUT"
      - name: Remove transient remote and local key material
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set +e
          if [[ -n "${HOST:-}" && -n "${USER:-}" && "${PORT:-}" =~ ^[0-9]+$ && -f "$HOME/.ssh/id_pc_prod" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "rm -f '/tmp/pc-tai-incomplete-recovery-${GITHUB_RUN_ID}.sh'" >/dev/null 2>&1
          fi
          rm -rf "$HOME/.ssh"
      - name: Upload bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-incomplete-deployment-recovery-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish exact incomplete deployment recovery result
    needs: [authority, recover]
    if: >-
      always() &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3365 &&
      github.event.comment.body == '/tai recover-incomplete-deployment current-main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - name: Publish redacted terminal recovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          RECOVERY_RESULT: ${{ needs.recover.result }}
          TARGET_SHA: ${{ needs.authority.outputs.target_sha }}
          FULL_STACK_RUN_ID: ${{ needs.authority.outputs.full_stack_run_id }}
          RECOVERED_TARGET_SHA: ${{ needs.recover.outputs.recovered_target_sha }}
          RECOVERED_RUN_ID: ${{ needs.recover.outputs.recovered_run_id }}
          ROLE_ACTION: ${{ needs.recover.outputs.role_action }}
        run: |
          set -Eeuo pipefail
          state=failure
          terminal=FAILED_NO_UNBOUNDED_MUTATION
          description='TAI incomplete deployment recovery failed or was not authorized'
          if [[ "$AUTHORITY_RESULT" == success && "$RECOVERY_RESULT" == success ]]; then
            state=success
            terminal=PASS
            description='TAI incomplete deployment recovery PASS'
          fi
          if [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$state" -f context='TAI Incomplete Deployment Recovery' -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## TAI incomplete deployment recovery

          - result: \`$terminal\`
          - exact current main: \`${TARGET_SHA:-unresolved}\`
          - verified full-stack run: \`${FULL_STACK_RUN_ID:-none}\`
          - recovered failed target: \`${RECOVERED_TARGET_SHA:-none}\`
          - recovered failed run: \`${RECOVERED_RUN_ID:-none}\`
          - runtime role action: \`${ROLE_ACTION:-none}\`
          - production deployment started: `false`
          - recovery run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 3365 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          [[ "$state" == success ]]

  result_gate:
    name: Confirm incomplete deployment recovery result
    needs: [authority, recover, publish]
    if: >-
      always() &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3365 &&
      github.event.comment.body == '/tai recover-incomplete-deployment current-main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject failed or skipped recovery jobs
        env:
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          RECOVERY_RESULT: ${{ needs.recover.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -Eeuo pipefail
          [[ "$AUTHORITY_RESULT" == success ]]
          [[ "$RECOVERY_RESULT" == success ]]
          [[ "$PUBLISH_RESULT" == success ]]
