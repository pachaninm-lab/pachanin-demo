name: Production Auth-Mail Cutover After Owner Release Controller

on:
  workflow_run:
    workflows: ['platform-v7 safe merge']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-auth-mail-controller-bridge
  cancel-in-progress: false

jobs:
  cutover:
    name: Chain successful owner release into auth-mail cutover
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'issue_comment' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      github.event.workflow_run.triggering_actor.login == github.repository_owner
    uses: ./.github/workflows/production-auth-mail-outbox-cutover.yml
    with:
      controller_authorized: true
    secrets: inherit
