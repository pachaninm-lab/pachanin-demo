name: TAI AP-13C.1g credential hardening

on:
  push:
    branches:
      - agent/tai-ap-13c1g-public-role-qwen-3365
    paths:
      - .github/workflows/tai-ap-13c1g-credential-hardening.yml

permissions:
  contents: write

concurrency:
  group: tai-ap-13c1g-credential-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tai-ap-13c1g-public-role-qwen-3365
          fetch-depth: 0

      - name: Apply and verify protected transport
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tai-ap-13c1g-credential-hardening.py
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml', encoding='utf-8'))"
          grep -Fq "model_mode='password'" .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq 'sshpass -e ssh' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          grep -Fq '::add-mask::$api_key' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          ! grep -Eq 'echo .*MODEL_SSH_PASSWORD|printf .*MODEL_SSH_PASSWORD' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml

      - name: Commit hardened activation and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tai-ap-13c1g-credential-hardening.yml
          git rm scripts/tai-ap-13c1g-credential-hardening.py
          git add .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          git diff --cached --check
          git commit -m 'TAI AP-13C.1g: support protected model-host password transport'
          git push origin HEAD:agent/tai-ap-13c1g-public-role-qwen-3365
