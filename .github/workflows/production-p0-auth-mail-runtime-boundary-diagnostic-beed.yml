name: Production P0 Auth-Mail Runtime Boundary Diagnostic beed

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-auth-mail-runtime-boundary-diagnostic-beed.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-p0-auth-mail-runtime-boundary-diagnostic-beed
  cancel-in-progress: false

env:
  TARGET_SHA: beed71c08783906d4235f3a02ad0b737a4c8be15
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  COMMAND: /production p0-auth-mail-runtime-boundary beed-read-only

jobs:
  contract:
    name: Validate read-only boundary diagnostic contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce inspection-only surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-p0-auth-mail-runtime-boundary-diagnostic-beed.yml')
          t=p.read_text()
          required=['PRODUCTION_MUTATION=NONE','docker inspect','docker compose','config --format json','RUNTIME_BOUNDARY_CLASS','AUTHORITY_FILE_CLASS','github.event.issue.number == 3072']
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('missing invariant: '+' | '.join(missing))
          diagnostic=t.split('\n  diagnostic:\n',1)[1]
          forbidden=['docker compose up','docker compose down','docker restart','docker rm','docker rmi','docker exec','docker run','systemctl ','ALTER ROLE','CREATE ROLE','DROP ROLE','INSERT INTO','UPDATE auth.','DELETE FROM','password-reset/request','forgot-password','AUTH PLAIN','AUTH LOGIN']
          bad=[x for x in forbidden if x in diagnostic]
          if bad: raise SystemExit('unsafe diagnostic surface: '+' | '.join(bad))
          PY

  diagnostic:
    name: Classify REG.RU auth-mail boundary without mutation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-runtime-boundary beed-read-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Resolve pinned production SSH
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"; user="$(trim "${SSH_USER_SECRET:-}")"; port="$(trim "${SSH_PORT_SECRET:-22}")"; expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          test "$host" = "$DEFAULT_HOST"; [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]; [[ "$port" =~ ^[0-9]+$ ]]; ((port>=1 && port<=65535)); [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate(){ local src="$1" pub; tr -d '\r' < "$src" > "$HOME/.ssh/id_pc_prod"; chmod 600 "$HOME/.ssh/id_pc_prod"; pub="$(mktemp)"; ssh-keygen -y -P '' -f "$HOME/.ssh/id_pc_prod" > "$pub" 2>/dev/null; local rc=$?; rm -f "$pub"; return $rc; }
          try(){ local raw="$1" a b c; test -n "$raw" || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; validate "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$raw" | base64 -d > "$c" 2>/dev/null && validate "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          try "${SSH_KEY_PRIMARY:-}" || try "${SSH_KEY_SECONDARY:-}" || try "${SSH_KEY_FALLBACK:-}"
          scan="$(mktemp)"; match="$(mktemp)"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          while IFS= read -r line; do fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; test "$fp" != "$expected" || printf '%s\n' "$line" >> "$match"; done < "$scan"
          sort -u -o "$match" "$match"; test "$(grep -c . "$match")" = 1; mv "$match" "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"; rm -f "$scan"
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Inspect runtime and projected authority names only
        id: inspect
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          out="$(mktemp)"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$HOST" "bash -s -- '$TARGET_SHA'" > "$out" <<'REMOTE'
          set -Eeuo pipefail
          target="$1"; emit(){ printf '%s=%s\n' "$1" "$2"; }; finish(){ emit RUNTIME_BOUNDARY_CLASS "$1"; emit AUTHORITY_FILE_CLASS "$2"; emit PRODUCTION_MUTATION NONE; exit 0; }
          test "$(id -u)" -eq 0 || finish ROOT_REQUIRED NOT_CHECKED
          mapfile -t webs < <(docker ps -q --filter 'label=com.docker.compose.service=web'); test "${#webs[@]}" -eq 1 || finish RUNTIME_CARDINALITY_INVALID NOT_CHECKED
          web="${webs[0]}"; project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web")"; work="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$web")"
          test -n "$project" && test -n "$work" && test -d "$work" || finish COMPOSE_AUTHORITY_MISSING NOT_CHECKED
          mapfile -t apis < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api'); mapfile -t workers < <(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker')
          test "${#apis[@]}" -eq 1 && test "${#workers[@]}" -eq 1 || finish RUNTIME_CARDINALITY_INVALID NOT_CHECKED
          api="${apis[0]}"; worker="${workers[0]}"
          arev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api" 2>/dev/null || true)"; wrev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web" 2>/dev/null || true)"; mrev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$worker" 2>/dev/null || true)"
          parity=0; test "$arev" = "$target" && test "$wrev" = "$target" && test "$mrev" = "$target" && parity=1 || true

          classify_file(){
            python3 - "$1" "$2" <<'PY'
          import re,sys
          p,kind=sys.argv[1:]
          try:
              raw=open(p,encoding='utf-8').read()
          except Exception: print('MISSING'); raise SystemExit
          if not raw.endswith('\n') or '\r' in raw or '\0' in raw: print('FORMAT'); raise SystemExit
          vals={}
          for line in raw.rstrip('\n').split('\n'):
              k,s,v=line.partition('=')
              if not s or k in vals: print('FORMAT'); raise SystemExit
              vals[k]=v
          if kind=='web': expected={'MFA_LOGIN_TICKET_SECRET','GEKTA_ANONYMOUS_SESSION_SECRET'}
          elif kind=='api': expected={'GEKTA_PHONE_ENCRYPTION_KEY','GEKTA_PHONE_LOOKUP_PEPPER'}
          elif kind=='reset': expected={'PASSWORD_RESET_DELIVERY_KEY'}
          elif kind=='transport': expected={'PC_SMTP_HOST','PC_SMTP_PORT','PC_SMTP_USER','PC_SMTP_PASS','PC_MAIL_FROM'}
          else: print('FORMAT'); raise SystemExit
          if set(vals)!=expected: print('KEYSET'); raise SystemExit
          if kind=='transport':
              if vals['PC_SMTP_HOST']!='mail.hosting.reg.ru' or vals['PC_SMTP_PORT']!='465': print('TRANSPORT_ENDPOINT'); raise SystemExit
              if vals['PC_MAIL_FROM']!='access@xn----8sbjf4befbjgs9b.xn--p1ai': print('TRANSPORT_SENDER'); raise SystemExit
              u=vals['PC_SMTP_USER']; pw=vals['PC_SMTP_PASS']
              if not re.fullmatch(r'[^\s@<>]+@[^\s@<>]+',u): print('TRANSPORT_USER'); raise SystemExit
              if not 8<=len(pw)<=512 or any(c in pw for c in '\r\n\0'): print('TRANSPORT_PASSWORD'); raise SystemExit
          print('PASS')
          PY
          }
          webf="$(classify_file "$work/.pc-gekta-web-runtime.env" web)"; apif="$(classify_file "$work/.pc-gekta-api-runtime.env" api)"; resetf="$(classify_file "$work/.pc-password-reset-delivery.env" reset)"; transportf="$(classify_file /var/lib/pc-secret-authority/runtime/transport.env transport)"
          authority="WEB_${webf}_API_${apif}_RESET_${resetf}_TRANSPORT_${transportf}"
          if test "$webf" != PASS || test "$apif" != PASS || test "$resetf" != PASS || test "$transportf" != PASS; then finish AUTHORITY_FILE_INVALID "$authority"; fi

          envnames(){ docker inspect --format '{{json .Config.Env}}' "$1" | python3 -c "import json,sys; print('\\n'.join(sorted(str(x).partition('=')[0] for x in (json.load(sys.stdin) or []))))"; }
          webn="$(envnames "$web")"; apin="$(envnames "$api")"; workern="$(envnames "$worker")"
          grep -Eq '^AUTH_MAIL_' <<< "$webn" && finish WEB_WORKER_AUTHORITY_PRESENT "$authority"
          grep -Eq '^(PC_SMTP_|PC_MAIL_FROM|RESEND_API_KEY|RESEND_FROM_EMAIL|AUTH_MAIL_DATABASE_URL_FILE|AUTH_MAIL_TRANSPORT_FILE)$' <<< "$apin" && finish API_FORBIDDEN_MAIL_AUTHORITY_PRESENT "$authority"
          grep -Eq '^(PC_SMTP_PASS|AUTH_MAIL_DATABASE_URL)$' <<< "$workern" && finish WORKER_PLAINTEXT_SECRET_PRESENT "$authority"

          # Inspect the active Compose model only for environment key names. This is read-only (`config`).
          cfg_label="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$web" 2>/dev/null || true)"
          if test -z "$cfg_label"; then finish COMPOSE_CONFIG_FILES_MISSING "$authority"; fi
          IFS=',' read -r -a files <<< "$cfg_label"; args=(); for f in "${files[@]}"; do test -f "$f" || finish COMPOSE_CONFIG_FILE_MISSING "$authority"; args+=( -f "$f" ); done
          model="$(mktemp)"; trap 'rm -f "$model"' EXIT
          docker compose -p "$project" "${args[@]}" config --format json > "$model" 2>/dev/null || finish COMPOSE_CONFIG_RENDER_FAILED "$authority"
          modelclass="$(python3 - "$model" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); s=d.get('services',{})
          def env(x):
              e=s.get(x,{}).get('environment') or {}
              if isinstance(e,list): return {str(v).partition('=')[0] for v in e}
              return set(map(str,e))
          web,api,worker=env('web'),env('api'),env('auth-mail-worker')
          if any(k.startswith('AUTH_MAIL_') for k in web): print('MODEL_WEB_WORKER_AUTHORITY'); raise SystemExit
          if api & {'PC_SMTP_HOST','PC_SMTP_PORT','PC_SMTP_USER','PC_SMTP_PASS','PC_MAIL_FROM','RESEND_API_KEY','RESEND_FROM_EMAIL','AUTH_MAIL_DATABASE_URL_FILE','AUTH_MAIL_TRANSPORT_FILE'}: print('MODEL_API_FORBIDDEN_MAIL_AUTHORITY'); raise SystemExit
          if worker & {'PC_SMTP_PASS','AUTH_MAIL_DATABASE_URL'}: print('MODEL_WORKER_PLAINTEXT_SECRET'); raise SystemExit
          print('PASS')
          PY
          )"
          test "$modelclass" = PASS || finish "$modelclass" "$authority"
          if test "$parity" = 1; then finish CURRENT_RUNTIME_BOUNDARY_PASS "$authority"; else finish CURRENT_RUNTIME_CLEAN_BUT_WORKER_REVISION_DRIFT "$authority"; fi
          REMOTE
          grep -E '^(RUNTIME_BOUNDARY_CLASS|AUTHORITY_FILE_CLASS|PRODUCTION_MUTATION)=' "$out" | tee "$GITHUB_OUTPUT"
          test "$(grep '^PRODUCTION_MUTATION=' "$out")" = 'PRODUCTION_MUTATION=NONE'
          rm -f "$out"
      - name: Publish sanitized diagnosis
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 3072 --repo "$GITHUB_REPOSITORY" --body "## PC-CROP auth-mail runtime boundary read-only diagnosis

- exact main: \`$TARGET_SHA\`
- runtime boundary class: \`${{ steps.inspect.outputs.RUNTIME_BOUNDARY_CLASS }}\`
- authority-file class: \`${{ steps.inspect.outputs.AUTHORITY_FILE_CLASS }}\`
- secret values / identities / raw Compose or inspect output: \`NOT_PUBLISHED\`
- reset / mail / DB / identity / container mutation: \`NONE\`
- production mutation: \`NONE\`" >/dev/null
