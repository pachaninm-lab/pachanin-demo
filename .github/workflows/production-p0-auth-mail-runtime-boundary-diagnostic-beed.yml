name: Production P0 Auth-Mail Runtime Boundary Diagnostic beed

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-auth-mail-runtime-boundary-diagnostic-beed.yml'
      - 'scripts/production-p0-auth-mail-runtime-boundary-diagnostic-beed.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-p0-auth-mail-runtime-boundary-diagnostic-beed
  cancel-in-progress: false

env:
  TARGET_SHA: beed71c08783906d4235f3a02ad0b737a4c8be15
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120

jobs:
  contract:
    name: Validate read-only boundary diagnostic contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate shell and inspection-only surface
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-p0-auth-mail-runtime-boundary-diagnostic-beed.sh
          python3 - <<'PY'
          from pathlib import Path
          t=Path('scripts/production-p0-auth-mail-runtime-boundary-diagnostic-beed.sh').read_text()
          required=['PRODUCTION_MUTATION NONE','docker inspect','docker compose','config --format json','RUNTIME_BOUNDARY_CLASS','AUTHORITY_FILE_CLASS']
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('missing invariant: '+' | '.join(missing))
          forbidden=['docker compose up','docker compose down','docker restart','docker rm','docker rmi','docker exec','docker run','systemctl ','ALTER ROLE','CREATE ROLE','DROP ROLE','INSERT INTO','UPDATE auth.','DELETE FROM','password-reset/request','forgot-password']
          bad=[x for x in forbidden if x in t]
          if bad: raise SystemExit('unsafe diagnostic surface: '+' | '.join(bad))
          PY

  diagnostic:
    name: Classify REG.RU auth-mail boundary without mutation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-runtime-boundary beed-read-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Inspect safe boundary classes only
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production-p0-auth-mail-runtime-boundary-diagnostic-beed.sh | tee "$RUNNER_TEMP/result"
          grep -E '^(RUNTIME_BOUNDARY_CLASS|AUTHORITY_FILE_CLASS|PRODUCTION_MUTATION)=' "$RUNNER_TEMP/result" >> "$GITHUB_OUTPUT"
          test "$(grep '^PRODUCTION_MUTATION=' "$RUNNER_TEMP/result")" = 'PRODUCTION_MUTATION=NONE'
      - name: Publish sanitized diagnosis
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 3072 --repo "$GITHUB_REPOSITORY" --body "## PC-CROP auth-mail runtime boundary read-only diagnosis

- exact main: \`$TARGET_SHA\`
- runtime boundary class: \`${{ steps.inspect.outputs.RUNTIME_BOUNDARY_CLASS }}\`
- authority-file class: \`${{ steps.inspect.outputs.AUTHORITY_FILE_CLASS }}\`
- secret values / identities / raw Compose or inspect output: \`NOT_PUBLISHED\`
- reset / mail / DB / identity / container mutation: \`NONE\`
- production mutation: \`NONE\`" >/dev/null
