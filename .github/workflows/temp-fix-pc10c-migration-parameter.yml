name: Temporary fix PC-CROP-10C migration parameter

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-fix-pc10c-migration-parameter.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
          persist-credentials: true
      - name: Rename reserved SQL parameter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/prisma/migrations/20260730101500_fgis_grain_tenant_read_authority/migration.sql')
          source = path.read_text()
          source = source.replace(
              'public.text_array_has_unique_elements(values text[])',
              'public.text_array_has_unique_elements(items text[])',
          )
          source = source.replace('SELECT cardinality(values) = (', 'SELECT cardinality(items) = (')
          source = source.replace('FROM unnest(values) AS item(value)', 'FROM unnest(items) AS item(value)')
          if 'values text[]' in source or 'cardinality(values)' in source or 'unnest(values)' in source:
              raise SystemExit('reserved parameter remains')
          path.write_text(source)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/prisma/migrations/20260730101500_fgis_grain_tenant_read_authority/migration.sql
          git commit -m 'PC-CROP-10C: avoid reserved SQL parameter name'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
