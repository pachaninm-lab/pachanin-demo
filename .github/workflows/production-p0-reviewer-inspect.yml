name: Production P0 Employee Join Inspect

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-inspect.yml'
      - 'scripts/production-p0-reviewer-inspect.sh'
      - 'scripts/check-production-p0-reviewer-inspect.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-inspect.yml'
      - 'scripts/production-p0-reviewer-inspect.sh'
      - 'scripts/check-production-p0-reviewer-inspect.mjs'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-employee-join-inspect
  cancel-in-progress: false

jobs:
  contract:
    name: Validate production employee join inspect contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 4637 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-employee-join-inspect 33293760567-1 9639a2a3d06f0aa3b38187bc22891450468115c0'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-production-p0-reviewer-inspect.mjs
      - run: bash -n scripts/production-p0-reviewer-inspect.sh

  inspect:
    name: Read-only REG.RU employee join diagnostic
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-employee-join-inspect 33293760567-1 9639a2a3d06f0aa3b38187bc22891450468115c0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
      PC_PRODUCTION_AUTHORITY_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect exact failed employee join without mutation
        shell: bash
        run: bash scripts/production-p0-reviewer-inspect.sh
