name: Temporary sync public AI routing governance with main

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/_temporary-sync-public-ai-routing-3438.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'governance/register-public-ai-routing-3438'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/register-public-ai-routing-3438
          fetch-depth: 0

      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit -X ours origin/main
          rm -f .github/workflows/_temporary-sync-public-ai-routing-3438.yml
          git add .github/workflows/_temporary-sync-public-ai-routing-3438.yml
          git commit -m 'SYNC: bring public AI routing governance to exact current main'
          git push origin HEAD:governance/register-public-ai-routing-3438
