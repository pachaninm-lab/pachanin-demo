name: TAI Owner Partial Deployment Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/tai-owner-partial-deployment-recovery-command.yml"
      - "scripts/tai-partial-deployment-recovery.sh"
      - "scripts/check-tai-partial-deployment-recovery.mjs"
      - "docs/platform-v7/autopilot/scopes/tai-runner-partial-deploy-recovery-20260807.json"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: tai-owner-partial-deploy-recovery-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  authority:
    name: Resolve exact current-main recovery authority
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3365 &&
        github.event.comment.body == '/tai recover-partial-deploy current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.authority.outputs.target_sha }}
      full_stack_run_id: ${{ steps.authority.outputs.full_stack_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate partial recovery contract
        if: github.event_name == 'pull_request'
        run: |
          set -Eeuo pipefail
          bash -n scripts/tai-partial-deployment-recovery.sh
          node scripts/check-tai-partial-deployment-recovery.mjs
      - name: Verify owner and successful exact-main full-stack authority
        id: authority
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENTER" == "$OWNER" ]]
          [[ "$ACTOR" == "$OWNER" ]]
          [[ "$TRIGGERING_ACTOR" == "$OWNER" ]]
          target_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-full-stack-exact-sha.yml/runs?branch=main&status=success&per_page=100" \
            > "$RUNNER_TEMP/full-stack-runs.json"
          candidate_run_ids="$(node - "$RUNNER_TEMP/full-stack-runs.json" "$target_sha" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require('node:fs');
          const [path, sha, repository] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const runs = (Array.isArray(report.workflow_runs) ? report.workflow_runs : [])
            .filter((run) => run?.name === 'Production Full-Stack Exact-SHA Release'
              && run?.head_sha === sha
              && run?.head_branch === 'main'
              && run?.head_repository?.full_name === repository
              && run?.status === 'completed'
              && run?.conclusion === 'success'
              && ['push','workflow_dispatch','issue_comment','workflow_run'].includes(run?.event)
              && Number.isSafeInteger(run?.id) && run.id > 0)
            .sort((a,b) => Date.parse(b.updated_at || b.created_at || '') - Date.parse(a.updated_at || a.created_at || '') || b.id-a.id);
          if (!runs.length) process.exit(2);
          process.stdout.write(runs.map((run) => String(run.id)).join('\n'));
          NODE
          )"
          [[ -n "$candidate_run_ids" ]]
          full_stack_run_id=''
          while IFS= read -r candidate_run_id; do
            [[ "$candidate_run_id" =~ ^[0-9]+$ ]] || exit 2
            jobs_path="$RUNNER_TEMP/full-stack-jobs-${candidate_run_id}.json"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/jobs?per_page=100" \
              > "$jobs_path"
            if node - "$jobs_path" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report || !Array.isArray(report.jobs) || report.total_count !== report.jobs.length) process.exit(2);
          for (const name of ['Validate full-stack release contract','Migrate, deploy API and web, verify live intake']) {
            const matches = report.jobs.filter((job) => job?.name === name);
            if (matches.length !== 1 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success') process.exit(3);
          }
          NODE
            then
              full_stack_run_id="$candidate_run_id"
              break
            fi
          done <<< "$candidate_run_ids"
          [[ "$full_stack_run_id" =~ ^[0-9]+$ ]]
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "full_stack_run_id=$full_stack_run_id" >> "$GITHUB_OUTPUT"

  recover:
    name: Recover bounded orphan TAI materialization on REG.RU
    needs: authority
    if: >-
      github.event_name == 'issue_comment' &&
      needs.authority.result == 'success' &&
      needs.authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      evidence_json: ${{ steps.evidence.outputs.json }}
    env:
      TARGET_SHA: ${{ needs.authority.outputs.target_sha }}
      EVIDENCE_DIR: artifacts/tai-partial-deploy-recovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact recovery source
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          bash -n scripts/tai-partial-deployment-recovery.sh
      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            ssh-keygen -lf "$public_key" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}"
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; docker compose version >/dev/null; echo ROOT_RECOVERY_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_RECOVERY_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Copy exact bounded recovery script
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${common[@]}" scripts/tai-partial-deployment-recovery.sh "$USER@$HOST:/tmp/tai-partial-recovery-${GITHUB_RUN_ID}.sh"
      - name: Execute bounded partial deployment recovery
        id: execute
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          output="/var/lib/pc-release-authority/runner-output/${GITHUB_RUN_ID}/partial-deploy-recovery.json"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "set -Eeuo pipefail; install -d -m 0750 -o root -g pcactions '/var/lib/pc-release-authority/runner-output/${GITHUB_RUN_ID}'; chmod 0700 '/tmp/tai-partial-recovery-${GITHUB_RUN_ID}.sh'; '/tmp/tai-partial-recovery-${GITHUB_RUN_ID}.sh' '$TARGET_SHA' '$GITHUB_RUN_ID' '$output'" \
            | tee "$EVIDENCE_DIR/recovery.log"
          grep -Fxq TAI_PARTIAL_DEPLOYMENT_RECOVERY=PASS "$EVIDENCE_DIR/recovery.log"
      - name: Retrieve and validate redacted recovery evidence
        id: evidence
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          remote="/var/lib/pc-release-authority/runner-output/${GITHUB_RUN_ID}/partial-deploy-recovery.json"
          local_file="$EVIDENCE_DIR/partial-deploy-recovery.json"
          scp "${common[@]}" "$USER@$HOST:$remote" "$local_file"
          canonical="$(node - "$local_file" "$TARGET_SHA" <<'NODE'
          const fs = require('node:fs');
          const [path, sha] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path,'utf8'));
          if (report.schemaVersion !== 'tai.partial-deployment-recovery.v1'
            || report.authorityTargetSha !== sha
            || !/^[0-9a-f]{40}$/.test(report.orphanTargetSha || '')
            || report.orphanTargetSha === sha
            || report.passed !== true
            || report.taiServiceRemoved !== true
            || report.protectedEnvironmentRestoredAbsent !== true
            || report.protectedOverrideRestoredAbsent !== true
            || report.schemaRollback !== 'FORWARD_ONLY_IDEMPOTENT'
            || report.apiWebMutation !== false
            || report.permanentModelAdmissionMutation !== false) process.exit(2);
          process.stdout.write(JSON.stringify(report));
          NODE
          )"
          [[ -n "$canonical" && "${#canonical}" -le 65536 && "$canonical" != *$'\n'* && "$canonical" != *$'\r'* ]]
          echo "json=$canonical" >> "$GITHUB_OUTPUT"
      - name: Remove transient remote and local key material
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set +e
          if [[ -n "${HOST:-}" && -n "${USER:-}" && "${PORT:-}" =~ ^[0-9]+$ && -f "$HOME/.ssh/id_pc_prod" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "rm -f '/tmp/tai-partial-recovery-${GITHUB_RUN_ID}.sh'" >/dev/null 2>&1
          fi
          rm -rf "$HOME/.ssh"

  publish:
    name: Publish partial deployment recovery result
    needs: [authority, recover]
    if: >-
      always() &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3365 &&
      github.event.comment.body == '/tai recover-partial-deploy current-main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - name: Publish terminal redacted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.authority.outputs.target_sha }}
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          RECOVERY_RESULT: ${{ needs.recover.result }}
          EVIDENCE_JSON: ${{ needs.recover.outputs.evidence_json }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          description='Partial TAI deployment recovery failed closed'
          orphan='unknown'
          role_action='unknown'
          if [[ "$RECOVERY_RESULT" == success && -n "$EVIDENCE_JSON" ]]; then
            read -r orphan role_action < <(node - "$EVIDENCE_JSON" <<'NODE'
          const r=JSON.parse(process.argv[2]);
          process.stdout.write(`${r.orphanTargetSha} ${r.runtimeRoleAction}`);
          NODE
            )
            state=success
            description='Bounded partial TAI deployment recovery PASS'
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='TAI Partial Deployment Recovery' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## TAI partial deployment recovery

          - exact current main: \`$TARGET_SHA\`
          - authority: \`$AUTHORITY_RESULT\`
          - recovery: \`$RECOVERY_RESULT\`
          - recovered orphan SHA: \`$orphan\`
          - runtime role action: \`$role_action\`
          - API/Web mutation: \`NONE\`
          - schema rollback: \`FORWARD_ONLY_IDEMPOTENT\`
          - production mutation: \`BOUNDED_ORPHAN_RECOVERY_ONLY\`
          - run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 3365 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          [[ "$state" == success ]]
