name: Production P0 First-Customer Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-first-customer-acceptance.yml'
      - 'scripts/production-p0-first-customer-acceptance.sh'
      - 'scripts/check-production-p0-first-customer-acceptance.mjs'
      - 'docs/ops/production-p0-first-customer-acceptance.md'
      - 'docs/platform-v7/autopilot/scopes/production-p0-first-customer-acceptance-3749.json'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-p0-first-customer-acceptance
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3072
  EVIDENCE_DIR: artifacts/production-p0-first-customer-acceptance
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate exact-main owner authority and P0 contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3072 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/production accept-p0-registration current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.authority.outputs.authorized }}
      target_sha: ${{ steps.authority.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate static fail-closed contract
        run: node scripts/check-production-p0-first-customer-acceptance.mjs
      - name: Resolve exact owner-authorized current main
        id: authority
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ github.event_name }}' != issue_comment ]]; then
            echo 'authorized=0' >> "$GITHUB_OUTPUT"
            echo 'target_sha=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$COMMENTER" == "$OWNER" && "$ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]]
          git fetch --no-tags origin main
          target_sha="$(git rev-parse origin/main)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$target_sha" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          echo 'authorized=1' >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  acceptance:
    name: Two registrations · MFA · cabinet · tenant RLS · causal receipt
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.authorized == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconfirm exact current main before external actions
        env:
          TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          node scripts/check-production-p0-first-customer-acceptance.mjs

      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'Canonical REG.RU VPS mismatch.' >&2; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Pinned host fingerprint is required.' >&2; exit 13; }
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh" "$EVIDENCE_DIR"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            ssh-keygen -lf "$public_key" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"
            return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo 'No valid protected SSH private key is configured.' >&2
            exit 14
          }

          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]] || { rm -f "$scan" "$match"; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$user@$host" 'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; docker compose version >/dev/null; command -v jq >/dev/null; echo ROOT_SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Execute fail-closed production P0 journey
        env:
          TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
          PC_PROD_SSH_HOST: ${{ steps.ssh.outputs.host }}
          PC_PROD_SSH_USER: ${{ steps.ssh.outputs.user }}
          PC_PROD_SSH_PORT: ${{ steps.ssh.outputs.port }}
          PC_PROD_P0_MAILBOX_EMAIL_TEMPLATE: ${{ secrets.PC_PROD_P0_MAILBOX_EMAIL_TEMPLATE }}
          PC_PROD_P0_MAILBOX_IMAP_HOST: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_HOST }}
          PC_PROD_P0_MAILBOX_IMAP_PORT: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PORT }}
          PC_PROD_P0_MAILBOX_IMAP_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER }}
          PC_PROD_P0_MAILBOX_IMAP_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD }}
          PC_PROD_P0_STAFF_EMAIL: ${{ secrets.PC_PROD_P0_STAFF_EMAIL }}
          PC_PROD_P0_STAFF_PASSWORD: ${{ secrets.PC_PROD_P0_STAFF_PASSWORD }}
          PC_PROD_P0_STAFF_TOTP_SECRET: ${{ secrets.PC_PROD_P0_STAFF_TOTP_SECRET }}
        shell: bash
        run: PC_PROD_SSH_KEY_PATH="$HOME/.ssh/id_pc_prod" bash scripts/production-p0-first-customer-acceptance.sh

      - name: Prove main did not advance during acceptance
        env:
          TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]] || {
            echo 'Main advanced during P0 production acceptance.' >&2
            exit 20
          }
          jq -e --arg sha "$TARGET_SHA" '.result == "PASS" and .targetSha == $sha' "$EVIDENCE_DIR/acceptance.json" >/dev/null

      - name: Upload redacted exact-SHA acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-first-customer-${{ needs.contract.outputs.target_sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove local production credential
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

  report:
    name: Publish bounded P0 result
    needs: [contract, acceptance]
    if: always() && github.event_name == 'issue_comment' && needs.contract.outputs.authorized == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Comment safe result on production authority issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$ACCEPTANCE_RESULT" == success ]]; then
            title='P0 registration production acceptance PASS'
          else
            title='P0 registration production acceptance BLOCKED'
          fi
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$REPO" \
            --body "$title for exact main \`$TARGET_SHA\`: $run_url"
          [[ "$ACCEPTANCE_RESULT" == success ]]
