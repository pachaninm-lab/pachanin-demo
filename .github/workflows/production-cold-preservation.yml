KER_SOCKET_PROFILE\')\n        self.owned = set()\n        self.planned = {}\n        self.clean = set()\n        self.probes = {}\n        self.planned_probes = {}\n\n    def _request(self, method, path, body=None, expected=(200,), raw=False, timeout=8):\n        payload = None if body is None else json.dumps(body, separators=(\',\', \':\')).encode()\n        demand(payload is None or len(payload) <= MAX_JSON, \'REQUEST_BOUND\')\n        conn = UnixConnection(self.socket, timeout=timeout)\n        try:\n            headers = {} if payload is None else {\'Content-Type\': \'application/json\', \'Content-Length\': str(len(payload))}\n            conn.request(method, \'/v1.51\' + path, body=payload, headers=headers)\n            response = conn.getresponse()\n            data = response.read(MAX_JSON + 1)\n            demand(len(data) <= MAX_JSON and response.status in expected, \'DOCKER_RESPONSE\')\n            if raw:\n                return data\n            return None if not data else closed_json(data)\n        except Refusal:\n            raise\n        except BaseException:\n            raise Refusal(\'DOCKER_TRANSPORT_UNKNOWN\') from None\n        finally:\n            conn.close()\n\n    def get(self, path):\n        demand(path in (\'/containers/json?all=1\', \'/images/json?all=1\', \'/volumes\', \'/networks\') or\n               re.fullmatch(r\'/images/sha256:[0-9a-f]{64}/json\', path) or\n               re.fullmatch(r\'/containers/[0-9a-f]{64}/json\', path) or\n               re.fullmatch(r\'/networks/[0-9a-f]{64}\', path) or\n               re.fullmatch(r\'/volumes/[A-Za-z0-9][A-Za-z0-9_.-]{0,254}\', path), \'DOCKER_GET_PROFILE\')\n        return self._request(\'GET\', path)\n\n    def admit(self, plans):\n        demand(not self.planned and not self.owned, \'API_ALREADY_ADMITTED\')\n        self.planned = {p[\'name\']: hashlib.sha256(json.dumps(p[\'body\'], sort_keys=True).encode()).hexdigest() for p in plans}\n        self.planned_probes = {p[\'name\']: probe_command(p[\'role\'], p[\'record\']) for p in plans}\n\n    def create(self, name, body):\n        digest = hashlib.sha256(json.dumps(body, sort_keys=True).encode()).hexdigest()\n        demand(name in self.planned and self.planned[name] == digest, \'UNPLANNED_CREATE\')\n        del self.planned[name]  # Attempt is spent even on an ambiguous transport.\n        result = self._request(\'POST\', \'/containers/create?name=\' + quote(name, safe=\'\'), body, (201,))\n        demand(type(result) is dict and type(result.get(\'Id\')) is str and HEX.fullmatch(result[\'Id\']), \'CREATE_UNKNOWN\')\n        self.owned.add(result[\'Id\'])\n        self.probes[result[\'Id\']] = self.planned_probes[name]\n        if set(result) == {\'Id\', \'Warnings\'} and result[\'Warnings\'] == []:\n            self.clean.add(result[\'Id\'])\n        return result[\'Id\']\n\n    def created_clean(self, identity):\n        return identity in self.clean\n\n    def start(self, identity):\n        demand(identity in self.owned, \'UNOWNED_START\')\n        self._request(\'POST\', \'/containers/\' + identity + \'/start\', expected=(204,))\n\n    def stop(self, identity, seconds=3):\n        demand(identity in self.owned, \'UNOWNED_STOP\')\n        demand(type(seconds) is int and 1 <= seconds <= 30, \'STOP_BOUND\')\n        # Never DELETE an object or volume. A failed stop remains UNKNOWN.\n        self._request(\'POST\', \'/containers/\' + identity + \'/stop?t=\' + str(seconds),\n                      expected=(204, 304), timeout=seconds + 1)\n\n    def exec_exit(self, identity, command, env=None):\n        demand(identity in self.owned and type(command) is list and len(command) <= 24,\n               \'UNOWNED_EXEC\')\n        demand(self.probes.get(identity) == (command, env or []), \'UNPLANNED_EXEC\')\n        result = self._request(\'POST\', \'/containers/\' + identity + \'/exec\',\n                               {\'AttachStdout\': True, \'AttachStderr\': True, \'Tty\': False,\n                                \'Cmd\': command, \'Env\': env or []}, (201,))\n        demand(type(result) is dict and type(result.get(\'Id\')) is str and HEX.fullmatch(result[\'Id\']), \'EXEC_ID\')\n        eid = result[\'Id\']\n        # Drain bounded multiplexed stdout/stderr without publishing contents.\n        self._request(\'POST\', \'/exec/\' + eid + \'/start\', {\'Detach\': False, \'Tty\': False}, (200,), raw=True)\n        result = self._request(\'GET\', \'/exec/\' + eid + \'/json\')\n        demand(type(result) is dict and result.get(\'Running\') is False and type(result.get(\'ExitCode\')) is int,\n               \'EXEC_UNKNOWN\')\n        return result[\'ExitCode\']\n\n\ndef snapshot(api):\n    containers = api.get(\'/containers/json?all=1\')\n    volumes = api.get(\'/volumes\')\n    networks = api.get(\'/networks\')\n    images = api.get(\'/images/json?all=1\')\n    demand(type(containers) is list and type(volumes) is dict and type(volumes.get(\'Volumes\')) is list and\n           type(networks) is list and type(images) is list, \'INVENTORY_PROFILE\')\n    v = {row[\'Name\']: {key: row.get(key) for key in (\'Name\', \'Driver\', \'Mountpoint\', \'Labels\', \'Options\', \'Scope\', \'CreatedAt\')}\n         for row in volumes[\'Volumes\']}\n    n = {row[\'Name\']: row for row in networks}\n    demand(len(v) == 19 and len(v) == len(volumes[\'Volumes\']) and len(n) == 6 and len(n) == len(networks),\n           \'VOLUME_NETWORK_PROFILE\')\n    demand(all(NAME.fullmatch(name) for name in v) and all(type(row.get(\'Id\')) is str and HEX.fullmatch(row[\'Id\']) for row in networks),\n           \'INVENTORY_IDENTITY\')\n    demand(all(type(row.get(\'Id\')) is str and IMAGE.fullmatch(row[\'Id\']) for row in images), \'IMAGE_INVENTORY\')\n    return {\'containers\': containers, \'volumes\': v, \'networks\': n, \'images\': {row[\'Id\'] for row in images}}\n\n\ndef role_of(record):\n    cfg = record.get(\'Config\')\n    demand(type(cfg) is dict and type(cfg.get(\'Labels\')) is dict, \'SAVED_CONFIG\')\n    role = cfg[\'Labels\'].get(\'com.docker.compose.service\')\n    return \'postgres\' if role in PG_ROLES else role\n\n\ndef safe_mounts(record, state, source, image):\n    points = record.get(\'MountPoints\')\n    demand(type(points) is dict and len(points) <= 32, \'SAVED_MOUNT_PROFILE\')\n    mounts, targets = [], set()\n    for point in points.values():\n        demand(type(point) is dict and type(point.get(\'RW\')) is bool, \'SAVED_MOUNT_PROFILE\')\n        target = point.get(\'Destination\')\n        demand(type(target) is str and target.startswith(\'/\') and \'\\0\' not in target and\n               \'..\' not in target.split(\'/\') and target not in targets, \'MOUNT_TARGET\')\n        targets.add(target)\n        kind = point.get(\'Type\')\n        if kind == \'volume\':\n            name = point.get(\'Name\')\n            demand(type(name) is str and name in state[\'volumes\'], \'MISSING_EXISTING_VOLUME\')\n            vol = state[\'volumes\'][name]\n            demand(vol.get(\'Driver\') == \'local\' and not vol.get(\'Options\') and\n                   vol.get(\'Mountpoint\') == point.get(\'Source\'), \'VOLUME_BINDING\')\n            mounts.append({\'Type\': \'volume\', \'Source\': name, \'Target\': target,\n                           \'ReadOnly\': not point[\'RW\'], \'VolumeOptions\': {\'NoCopy\': True}})\n        elif kind == \'bind\':\n            path = point.get(\'Source\')\n            demand(point[\'RW\'] is False and type(path) is str and path.startswith(\'/\') and\n                   \'\\0\' not in path and \'..\' not in path.split(\'/\') and source.bind_preserved(path) is True,\n                   \'BIND_NOT_PRESERVED\')\n            propagation = point.get(\'Propagation\') or \'rprivate\'\n            demand(propagation in (\'private\', \'rprivate\'), \'BIND_PROPAGATION\')\n            mounts.append({\'Type\': \'bind\', \'Source\': path, \'Target\': target, \'ReadOnly\': True,\n                           \'BindOptions\': {\'CreateMountpoint\': False, \'Propagation\': propagation}})\n        else:\n            raise Refusal(\'UNSUPPORTED_MOUNT\')\n    declared = record[\'Config\'].get(\'Volumes\') or {}\n    image_declared = (image.get(\'Config\') or {}).get(\'Volumes\') or {}\n    demand(type(declared) is dict and type(image_declared) is dict and\n           set(declared) | set(image_declared) <= targets, \'ANONYMOUS_VOLUME_FORBIDDEN\')\n    return mounts\n\n\ndef endpoint_plan(record, state):\n    settings = record.get(\'NetworkSettings\')\n    demand(type(settings) is dict and type(settings.get(\'Networks\')) is dict and\n           1 <= len(settings[\'Networks\']) <= 4, \'SAVED_NETWORK_PROFILE\')\n    endpoints = {}\n    for name, old in settings[\'Networks\'].items():\n        demand(type(name) is str and name in state[\'networks\'] and type(old) is dict and\n               old.get(\'NetworkID\') == state[\'networks\'][name][\'Id\'], \'NETWORK_BINDING\')\n        live = state[\'networks\'][name]\n        demand(live.get(\'Driver\') == \'bridge\' and live.get(\'Scope\') == \'local\' and\n               live.get(\'Ingress\') is not True and not live.get(\'Containers\'), \'NETWORK_NOT_EXCLUSIVE\')\n        aliases = old.get(\'Aliases\') or []\n        demand(type(aliases) is list and len(aliases) <= 32 and all(type(a) is str and NAME.fullmatch(a) for a in aliases),\n               \'NETWORK_ALIASES\')\n        # Static endpoint configuration needs separate IP conflict/range proof.\n        # Never copy stale operational IPAddress/EndpointID/MAC into create.\n        demand(not old.get(\'IPAMConfig\') and not old.get(\'Links\') and not old.get(\'DriverOpts\') and\n               not old.get(\'GwPriority\'), \'UNSUPPORTED_ENDPOINT_CONFIG\')\n        endpoints[name] = {\'NetworkID\': old[\'NetworkID\'], \'Aliases\': list(dict.fromkeys(aliases))}\n    return endpoints\n\n\ndef build_plan(records, state, refs, source, operation=OP):\n    demand(type(operation) is str and re.fullmatch(r\'core-bootstrap-[0-9]{8}\', operation), \'OPERATION_PROFILE\')\n    demand(type(refs) is tuple and len(refs) == 11 and len(set(refs)) == 11, \'SOURCE_REFS\')\n    demand(type(records) is list and len(records) == 11 and\n           {(r.get(\'ID\'), r.get(\'Image\')) for r in records} == set(refs), \'SAVED_IDENTITIES\')\n    by_role = {}\n    for record in records:\n        role = role_of(record)\n        if role in CORE:\n            demand(role not in by_role, \'AMBIGUOUS_CORE_ROLE\')\n            by_role[role] = record\n    demand(set(by_role) == set(CORE), \'CORE_ROLE_MISSING\')\n    plans = []\n    for role in ORDER:\n        record = by_role[role]\n        image = record.get(\'Image\')\n        demand(type(image) is str and IMAGE.fullmatch(image) and image in state[\'images\'], \'PINNED_IMAGE_MISSING\')\n        inspected = source.image(image)\n        demand(type(inspected) is dict and inspected.get(\'Id\') == image and inspected.get(\'Os\') == \'linux\' and\n               inspected.get(\'Architecture\') == \'amd64\', \'PINNED_IMAGE_PROFILE\')\n        cfg, host = copy.deepcopy(record[\'Config\']), copy.deepcopy(record.get(\'HostConfig\'))\n        demand(type(host) is dict and set(host) <= HOST_KEYS and type(cfg.get(\'Env\')) is list and len(cfg[\'Env\']) <= 4096 and\n               all(type(e) is str and \'\\0\' not in e for e in cfg[\'Env\']), \'SAVED_HOST_CONFIG\')\n        for field in (\'AutoRemove\', \'Privileged\', \'PublishAllPorts\', \'ReadonlyRootfs\', \'OomKillDisable\', \'Init\'):\n            demand(host.get(field) is None or type(host[field]) is bool, \'HOST_BOOLEAN_TYPE\')\n        for field in (\'CpuShares\', \'Memory\', \'NanoCpus\', \'OomScoreAdj\', \'ShmSize\', \'CpuPeriod\', \'CpuQuota\',\n                      \'CpuRealtimePeriod\', \'CpuRealtimeRuntime\', \'MemoryReservation\', \'MemorySwap\',\n                      \'MemorySwappiness\', \'PidsLimit\', \'CpuCount\', \'CpuPercent\', \'BlkioWeight\',\n                      \'IOMaximumIOps\', \'IOMaximumBandwidth\'):\n            demand(host.get(field) is None or type(host[field]) is int and -1 <= host[field] < 2**63,\n                   \'HOST_INTEGER_TYPE\')\n        for field in (\'NetworkDisabled\', \'Tty\', \'OpenStdin\'):\n            demand(cfg.get(field) is None or type(cfg[field]) is bool and cfg[field] is False, \'CONFIG_RUNTIME_PROFILE\')\n        demand(cfg.get(\'MacAddress\') in (\'\', None), \'CONFIG_RUNTIME_PROFILE\')\n        for field in (\'VolumesFrom\', \'Links\', \'Devices\', \'DeviceRequests\', \'DeviceCgroupRules\', \'Tmpfs\', \'StorageOpt\', \'Sysctls\', \'Annotations\', \'CapAdd\'):\n            demand(not host.get(field), \'UNSUPPORTED_HOST_REFERENCE\')\n        demand(host.get(\'AutoRemove\') is not True and host.get(\'Privileged\') is not True and\n               host.get(\'PublishAllPorts\') is not True and host.get(\'Runtime\') in (\'runc\', \'\', None) and\n               host.get(\'CgroupnsMode\') in (\'private\', \'\', None) and host.get(\'UTSMode\') in (\'\', None) and\n               host.get(\'UsernsMode\') in (\'\', None) and host.get(\'VolumeDriver\') in (\'local\', \'\', None) and\n               host.get(\'PidMode\') in (\'\', None) and host.get(\'IpcMode\') in (\'private\', \'\', None) and\n               (host.get(\'LogConfig\') or {}).get(\'Type\', \'json-file\') in (\'json-file\', \'local\'), \'UNSUPPORTED_HOST_PROFILE\')\n        log_options = (host.get(\'LogConfig\') or {}).get(\'Config\') or {}\n        demand(type(log_options) is dict and set(log_options) <= {\'max-size\', \'max-file\', \'compress\'} and\n               all(type(v) is str and len(v) <= 64 for v in log_options.values()), \'LOG_OPTIONS_PROFILE\')\n        demand(source.startup_safe(role, record, inspected) is True, \'STARTUP_COMMAND_NOT_ATTESTED\')\n        mode = host.get(\'NetworkMode\')\n        demand(type(mode) is str and mode in state[\'networks\'], \'HOST_NETWORK_MODE\')\n        endpoints = endpoint_plan(record, state)\n        demand(mode in endpoints, \'HOST_NETWORK_ENDPOINT_MISMATCH\')\n        mounts = safe_mounts(record, state, source, inspected)\n        for key in (\'ContainerIDFile\', \'CgroupParent\'):\n            demand(not host.get(key), \'UNSUPPORTED_HOST_REFERENCE\')\n        # This is a closed reconstruction, not wholesale HostConfig forwarding.\n        # Unknown/new or nondefault unsupported fields refuse before writing.\n        for key in set(host) - HOST_RETAIN - HOST_REWRITE:\n            value = host[key]\n            if key == \'ConsoleSize\':\n                demand(type(value) is list and len(value) == 2 and all(type(v) is int and v == 0 for v in value),\n                       \'UNSUPPORTED_NONDEFAULT_HOST_FIELD\')\n            else:\n                demand(value is None or value is False or type(value) is int and value == 0 or\n                       value == \'\' or value == [] or value == {} or key == \'VolumeDriver\' and value == \'local\',\n                       \'UNSUPPORTED_NONDEFAULT_HOST_FIELD\')\n        host = {key: value for key, value in host.items() if key in HOST_RETAIN}\n        host.update(Binds=[], VolumesFrom=[], Mounts=mounts,\n                    RestartPolicy={\'Name\': \'no\', \'MaximumRetryCount\': 0},\n                    AutoRemove=False, PublishAllPorts=False, Privileged=False, Runtime=\'runc\')\n        # Retain all original published port mappings, but reject any new API,\n        # database or ancillary exposure. Only Caddy may bind wildcards80/443.\n        ports = host.get(\'PortBindings\') or {}\n        demand(type(ports) is dict and len(ports) <= 16, \'PORT_PROFILE\')\n        for target, rows in ports.items():\n            demand(type(target) is str and re.fullmatch(r\'[1-9][0-9]{0,4}/(?:tcp|udp)\', target) and\n                   int(target.split(\'/\')[0]) <= 65535, \'PORT_PROFILE\')\n            demand(type(rows) is list and len(rows) <= 4, \'PORT_PROFILE\')\n            for binding in rows:\n                demand(type(binding) is dict and set(binding) <= {\'HostIp\', \'HostPort\'}, \'PORT_PROFILE\')\n                address, port = binding.get(\'HostIp\', \'\'), binding.get(\'HostPort\')\n                demand(type(port) is str and port.isdigit() and 1 <= int(port) <= 65535, \'PORT_PROFILE\')\n                demand(address in (\'127.0.0.1\', \'::1\') or role == \'caddy\' and\n                       address in (\'\', \'0.0.0.0\', \'::\') and port in (\'80\', \'443\'), \'UNSAFE_PUBLIC_PORT\')\n        cfg[\'Image\'] = image\n        cfg[\'Labels\'][OP_LABEL], cfg[\'Labels\'][ROLE_LABEL] = operation, role\n        cfg[\'HostConfig\'] = host\n        cfg[\'NetworkingConfig\'] = {\'EndpointsConfig\': endpoints}\n        plans.append({\'role\': role, \'name\': \'pc-\' + operation + \'-\' + role, \'body\': cfg,\n                      \'originalId\': record[\'ID\'], \'image\': image, \'record\': record})\n    return plans\n\n\nclass Journal:\n    """Private one-use fsync journal. Existing operation always refuses replay."""\n    def __init__(self, directory, sha, operation=OP, uid=0):\n        demand(os.getuid() == os.geteuid() == uid, \'ROOT_REQUIRED\')\n        self.root = Path(directory)\n        demand(self.root.is_absolute() and all(part not in (\'.\', \'..\') for part in self.root.parts), \'JOURNAL_PATH\')\n        self.parent_fd = os.open(\'/\', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\n        try:\n            parts = self.root.parent.parts[1:]\n            for index, part in enumerate(parts):\n                info = os.fstat(self.parent_fd)\n                shared = bool(info.st_mode & stat.S_ISVTX) and info.st_uid == 0\n                demand(info.st_uid in (0, uid) and (not info.st_mode & 0o022 or shared), \'JOURNAL_ANCESTOR_PROFILE\')\n                child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=self.parent_fd)\n                os.close(self.parent_fd); self.parent_fd = child\n            info = os.fstat(self.parent_fd)\n            demand(info.st_uid == uid and info.st_mode & 0o777 == 0o700, \'JOURNAL_PARENT_PROFILE\')\n            os.mkdir(self.root.name, 0o700, dir_fd=self.parent_fd)\n            self.fd = os.open(self.root.name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=self.parent_fd)\n        except BaseException:\n            os.close(self.parent_fd);self.parent_fd=None\n            raise\n        self.sha, self.operation, self.steps = sha, operation, []\n        self.record(\'PLANNED\', None, None)\n\n    def record(self, stage, role, identity):\n        demand(stage in (\'PLANNED\', \'CREATE_INTENT\', \'CREATED\', \'START_INTENT\', \'STARTED\', \'READY\',\n                         \'STOP_INTENT\', \'STOPPED\', \'COMPLETE\', \'UNKNOWN\'), \'JOURNAL_STAGE\')\n        demand(role is None or role in CORE, \'JOURNAL_ROLE\')\n        demand(identity is None or type(identity) is str and HEX.fullmatch(identity), \'JOURNAL_ID\')\n        self.steps.append({\'stage\': stage, \'role\': role, \'id\': identity})\n        data = json.dumps({\'schemaVersion\': \'pc.core-bootstrap-journal.v1\', \'targetSha\': self.sha,\n                           \'operation\': self.operation, \'steps\': self.steps}, separators=(\',\', \':\')).encode()\n        demand(len(data) <= 32768, \'JOURNAL_BOUND\')\n        fd = os.open(\'next.json\', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=self.fd)\n        try:\n            with os.fdopen(fd, \'wb\', closefd=False) as stream:\n                stream.write(data); stream.flush(); os.fsync(fd)\n        finally:\n            os.close(fd)\n        os.replace(\'next.json\', \'journal.json\', src_dir_fd=self.fd, dst_dir_fd=self.fd)\n        os.fsync(self.fd); os.fsync(self.parent_fd)\n\n    def close(self):\n        for name in (\'fd\', \'parent_fd\'):\n            value = getattr(self, name, None)\n            if value is not None:\n                os.close(value); setattr(self, name, None)\n\n    def __del__(self):\n        self.close()\n\n\ndef verify_inventory(api, baseline, owned):\n    now = snapshot(api)\n    ids = {row.get(\'Id\') for row in now[\'containers\']}\n    demand(ids == set(owned) and now[\'volumes\'] == baseline[\'volumes\'] and\n           set(now[\'networks\']) == set(baseline[\'networks\']) and now[\'images\'] == baseline[\'images\'], \'RUNTIME_DRIFT\')\n    demand({n: v[\'Id\'] for n, v in now[\'networks\'].items()} == {n: v[\'Id\'] for n, v in baseline[\'networks\'].items()},\n           \'NETWORK_ID_DRIFT\')\n\n\ndef verify_owned_identity(api, plan, identity):\n    demand(identity in api.owned, \'UNOWNED_CONTAINER\')\n    value = api.get(\'/containers/\' + identity + \'/json\')\n    demand(type(value) is dict and value.get(\'Id\') == identity and value.get(\'Image\') == plan[\'image\'] and\n           value.get(\'Name\') == \'/\' + plan[\'name\'], \'CREATED_IDENTITY\')\n    cfg = value.get(\'Config\')\n    demand(type(cfg) is dict and cfg.get(\'Labels\', {}).get(OP_LABEL) == OP and\n           cfg.get(\'Labels\', {}).get(ROLE_LABEL) == plan[\'role\'], \'CREATED_OWNERSHIP\')\n    return value\n\n\ndef verify_created(api, plan, identity):\n    value = verify_owned_identity(api, plan, identity)\n    cfg, host = value.get(\'Config\'), value.get(\'HostConfig\')\n    demand(type(cfg) is dict and cfg.get(\'Labels\', {}).get(OP_LABEL) == OP and\n           cfg.get(\'Labels\', {}).get(ROLE_LABEL) == plan[\'role\'] and type(host) is dict and\n           host.get(\'RestartPolicy\') == {\'Name\': \'no\', \'MaximumRetryCount\': 0}, \'CREATED_POLICY\')\n    expected = plan[\'body\']\n    for field in (\'Image\', \'Env\', \'Cmd\', \'Entrypoint\', \'User\', \'WorkingDir\', \'Labels\', \'StopSignal\', \'StopTimeout\', \'ExposedPorts\'):\n        demand(cfg.get(field) == expected.get(field), \'CREATED_CONFIG_MISMATCH\')\n    def health(value):\n        if value is None:\n            return None\n        demand(type(value) is dict and set(value) <= {\'Test\', \'Interval\', \'Timeout\', \'StartPeriod\', \'StartInterval\', \'Retries\'},\n               \'CREATED_HEALTH_PROFILE\')\n        return (value.get(\'Test\'),) + tuple(value.get(key, 0) for key in (\'Interval\', \'Timeout\', \'StartPeriod\', \'StartInterval\', \'Retries\'))\n    demand(health(cfg.get(\'Healthcheck\')) == health(expected.get(\'Healthcheck\')), \'CREATED_HEALTH_MISMATCH\')\n    expected_host = expected[\'HostConfig\']\n    for field in (\'NetworkMode\', \'Runtime\', \'LogConfig\'):\n        demand(host.get(field) == expected_host.get(field), \'CREATED_HOST_MISMATCH\')\n    for field in (\'Privileged\', \'AutoRemove\', \'PublishAllPorts\', \'ReadonlyRootfs\'):\n        demand(host.get(field, False) is expected_host.get(field, False), \'CREATED_HOST_MISMATCH\')\n    for field in (\'CapAdd\', \'CapDrop\', \'SecurityOpt\', \'Dns\', \'DnsOptions\', \'DnsSearch\', \'ExtraHosts\', \'GroupAdd\'):\n        demand((host.get(field) or []) == (expected_host.get(field) or []), \'CREATED_HOST_MISMATCH\')\n    demand((host.get(\'PortBindings\') or {}) == (expected_host.get(\'PortBindings\') or {}), \'CREATED_PORT_MISMATCH\')\n    demand(set((value.get(\'NetworkSettings\') or {}).get(\'Networks\', {})) ==\n           set(plan[\'body\'][\'NetworkingConfig\'][\'EndpointsConfig\']), \'CREATED_NETWORKS\')\n    for name, endpoint in expected[\'NetworkingConfig\'][\'EndpointsConfig\'].items():\n        actual_endpoint = value[\'NetworkSettings\'][\'Networks\'][name]\n        saved_id = plan[\'record\'][\'NetworkSettings\'][\'Networks\'][name][\'NetworkID\']\n        demand(actual_endpoint.get(\'NetworkID\') == saved_id and\n               set(endpoint.get(\'Aliases\') or []) <= set(actual_endpoint.get(\'Aliases\') or []), \'CREATED_NETWORK_BINDING\')\n    actual = value.get(\'Mounts\')\n    demand(type(actual) is list and len(actual) == len(plan[\'body\'][\'HostConfig\'][\'Mounts\']), \'CREATED_MOUNTS\')\n    for mount in plan[\'body\'][\'HostConfig\'][\'Mounts\']:\n        matches = [m for m in actual if m.get(\'Destinatio