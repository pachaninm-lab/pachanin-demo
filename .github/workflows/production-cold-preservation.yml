name: Production Cold Preservation

on:
  pull_request:
    paths:
      - 'scripts/production_cold_preservation.py'
      - 'scripts/test_production_cold_preservation.py'
      - '.github/workflows/production-cold-preservation.yml'
      - 'docs/ops/production-cold-preservation.md'
      - 'scripts/test_production_stopped_runtime_headroom.py'
      - 'scripts/production_stopped_runtime_headroom.py'
      - '.github/workflows/production-full-stack-exact-sha.yml'
      - '.github/workflows/production-docker-headroom-recovery.yml'
      - '.github/workflows/production-docker-headroom-owner-push-once.yml'
      - 'scripts/release/ir20-restore-drill.sh'
      - 'scripts/release/test-ir20-restore-drill.py'
      - 'scripts/release/test-ir20-restore-drill-integration.sh'
      - '.github/workflows/ir20-restore-drill.yml'
      - 'docs/ops/ir20-isolated-restore.md'
      - 'docs/platform-v7/autopilot/scopes/ir20-isolated-restore-20260919.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  EVIDENCE_DIR: artifacts/production-cold-preservation

jobs:
  contract:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 4637 &&
       github.event.comment.body == '/production restore-historical-core current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prepare only the pinned public Compose parser on the runner
        shell: bash
        run: |
          python3 - <<'PY_VENDOR'
          import hashlib, os, pathlib, tempfile, urllib.request
          try:
              with urllib.request.urlopen('https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64', timeout=60) as response:
                  data = response.read(32663527)
              if len(data) != 32663526 or hashlib.sha256(data).hexdigest() != '40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a':
                  raise ValueError()
              fd, path = tempfile.mkstemp(prefix='pc-verified-compose-', dir=os.environ['RUNNER_TEMP'])
              with os.fdopen(fd, 'wb') as handle:
                  os.fchmod(handle.fileno(), 0o700)
                  handle.write(data)
              with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as handle:
                  handle.write('COMPOSE_PARSER_FILE=' + path + '\nPC_CROP_TEST_COMPOSE_BINARY=' + path + '\n')
          except BaseException:
              raise SystemExit('PINNED_COMPOSE_DOWNLOAD_UNAVAILABLE') from None
          PY_VENDOR
      - name: Verify stopped recovery controllers and shared production contracts
        run: |
          python3 -B scripts/test_production_cold_preservation.py --require-native-compose PreservationTests BindingPreservationTests ConfigurationObservationTests
          python3 -B scripts/test_production_cold_preservation.py BootstrapEngineTests BootstrapControllerTests BootstrapSourceTests BootstrapStartupPolicyTests
          python3 -B scripts/test_production_stopped_runtime_headroom.py

      - name: Pin runner Docker 28.5.1 for the production API wire contract
        shell: bash
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          test "$(uname -m)" = x86_64
          /usr/bin/timeout 15s systemctl show docker.service --property=ExecStart --value | grep -F '/usr/bin/dockerd' >/dev/null
          native_docker_dir="$(mktemp -d "${RUNNER_TEMP}/pc-docker-28.5.1.XXXXXXXX")"
          export PC_CROP_NATIVE_DOCKER_DIR="$native_docker_dir"
          /usr/bin/timeout --signal=TERM --kill-after=10s 150s python3 - <<'PY_RUNNER_DOCKER'
          import hashlib, io, os, pathlib, tarfile, urllib.request
          root = pathlib.Path(os.environ['PC_CROP_NATIVE_DOCKER_DIR'])
          url = 'https://download.docker.com/linux/static/stable/x86_64/docker-28.5.1.tgz'
          with urllib.request.urlopen(url, timeout=45) as response:
              data = response.read(82150846)
          if len(data) != 82150845 or hashlib.sha256(data).hexdigest() != '5c0d19f31fece1accd0358bb8cff591fe25d7b6cba19f0fd412cbfdc07f75ff6':
              raise SystemExit('PINNED_RUNNER_DOCKER_ARCHIVE_MISMATCH')
          names = {'docker/runc', 'docker/docker', 'docker/dockerd', 'docker/containerd', 'docker/ctr',
                   'docker/containerd-shim-runc-v2', 'docker/docker-proxy', 'docker/docker-init'}
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              members = archive.getmembers()
              if (len(members) != 9 or {m.name for m in members} != names | {'docker'} or
                  any(not (m.name == 'docker' and m.isdir() and m.mode == 0o755 or
                           m.name in names and m.isfile() and m.mode == 0o755 and 0 < m.size < 100000000)
                      for m in members)):
                  raise SystemExit('PINNED_RUNNER_DOCKER_ARCHIVE_PROFILE')
              # Only the pinned CLI and daemon replace the ephemeral runner binaries.
              # Existing distro containerd/runc/service configuration is retained.
              for name in ('docker/docker', 'docker/dockerd'):
                  raw = archive.extractfile(name).read()
                  target = root / pathlib.PurePosixPath(name).name
                  target.write_bytes(raw)
                  target.chmod(0o755)
          PY_RUNNER_DOCKER
          "$native_docker_dir/docker" --version | grep -F 'Docker version 28.5.1, build e180ab8' >/dev/null
          "$native_docker_dir/dockerd" --version | grep -F 'Docker version 28.5.1, build f8215cc2' >/dev/null
          sudo -n /usr/bin/timeout --signal=TERM --kill-after=10s 60s systemctl stop docker.service docker.socket
          sudo -n install -m 0755 "$native_docker_dir/docker" /usr/bin/docker
          sudo -n install -m 0755 "$native_docker_dir/dockerd" /usr/bin/dockerd
          sudo -n /usr/bin/timeout --signal=TERM --kill-after=10s 60s systemctl start docker.socket docker.service
          /usr/bin/timeout 15s /usr/bin/docker --host unix:///var/run/docker.sock version --format '{{json .Server}}' | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["Version"]=="28.5.1" and v["ApiVersion"]=="1.51", "PINNED_RUNNER_DOCKER_SERVER_MISMATCH"'

      - name: Exercise actual isolated PostgreSQL Docker wire and owned cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$(node --input-type=module - <<'NODE_MIRROR'
          import fs from 'node:fs';
          import { checkManifests } from './scripts/check-ci-postgres-image-authority.mjs';
          const file='.github/container-images/postgres-16.v1.json';
          const manifest=JSON.parse(fs.readFileSync(file,'utf8'));
          if(checkManifests([{file,manifest}]).length!==0 || manifest.schema!=='pc.ci-container-image.v1' ||
             manifest.logical_name!=='postgres-16' || manifest.verified_by?.digest_preserved!==true) process.exit(1);
          console.log(manifest.mirrored_repository+'@'+manifest.mirrored_digest);
          NODE_MIRROR
          )"
          /usr/bin/timeout --signal=TERM --kill-after=15s 180s docker pull "$image" >/dev/null
          sudo -n env PC_CROP_FIXTURE_POSTGRES_IMAGE="$image" /usr/bin/timeout --signal=TERM --kill-after=75s 240s \
            /usr/bin/python3 -B scripts/test_production_cold_preservation.py --require-native-docker BootstrapNativeWireTests

  recover:
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.body == '/production restore-historical-core current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    concurrency:
      group: production-full-stack-exact-sha
      cancel-in-progress: false
      queue: max
    env:
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind accepted exact main and evidence journal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$(dirname "$EVIDENCE_DIR")"
          mkdir -- "$EVIDENCE_DIR"
          target_sha="$GITHUB_SHA"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$target_sha" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/production-cold-preservation.yml@refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$target_sha" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$target_sha" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" == "$target_sha" ]]
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          printf '%s\n' "$target_sha" > "$EVIDENCE_DIR/target-sha.txt"
          echo "EVIDENCE_INITIALIZED=1" >> "$GITHUB_ENV"
          python3 - <<'PY_BIND'
          import hashlib, json, pathlib, re, stat, subprocess
          def require(ok):
              if not ok:
                  raise SystemExit('ACCEPTED_IR20_CONTROLLER_BINDING_INVALID')
          def closed(pairs):
              require(len(pairs) == len(dict(pairs)))
              return dict(pairs)
          def accepted(path, mode, digest):
              p = pathlib.Path(path)
              info = p.lstat()
              require(stat.S_ISREG(info.st_mode) and not p.is_symlink() and
                      stat.S_IMODE(info.st_mode) == (int(mode, 8) & 0o7777) and
                      0 < info.st_size <= (370287 if path == '.github/workflows/production-docker-headroom-diagnostic.yml' else 200000))
              require(hashlib.sha256(p.read_bytes()).hexdigest() == digest)
          def ancestor(value):
              require(type(value) is str and re.fullmatch('[0-9a-f]{40}', value) is not None)
              require(subprocess.run(['git', 'merge-base', '--is-ancestor', value, 'HEAD'],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0)
          state_bytes = pathlib.Path('docs/platform-v7/autopilot/autopilot-state.json').read_bytes()
          require(0 < len(state_bytes) <= 3 * 1024 * 1024)
          state = json.loads(state_bytes.decode('utf-8', errors='strict'), object_pairs_hook=closed)
          purpose = state.get('coordinationAdmissions', {}).get('stopped-core-bootstrap-20261024')
          expected_purpose = {'owner': 'ACCOUNT_1_CORE', 'sourceBranch': 'ops/production-cold-preservation-20261022', 'authorityBaseExactMain': 'e48117a2acf2030dffb845ff48e4807f694d01be', 'ownerDecision': '#5469#issuecomment-6391790945', 'operationName': 'core-bootstrap-20261024', 'originalStartupAuthorized': True, 'workersAuthorized': False, 'productionAcceptance': False, 'inspectionSha256': '31b39b0436ef704ff8b066cb3f3d4bb9595c6cccdc5abfcd707934ce5d2e2bd7', 'limits': 'Historical6core only; existing images/mounts/networks; no workers, PgBouncer, daemon restart, pull, migration, private transfer or new cost.'}
          require(type(purpose) is dict and set(purpose) == set(expected_purpose) | {'sourcePins'})
          require(all(type(purpose[k]) is type(v) and purpose[k] == v for k, v in expected_purpose.items()))
          observer = state.get('coordinationAdmissions', {}).get('stopped-configuration-controller-20261024')
          require(type(observer) is dict and observer.get('readOnly') is True and observer.get('originalStartupAuthorized') is False
                  and observer.get('productionAcceptance') is False and observer.get('operationName') == 'stopped-configuration-20261024')
          ancestor(purpose['authorityBaseExactMain'])
          accepted('.github/workflows/production-docker-headroom-diagnostic.yml', '100644', purpose['inspectionSha256'])
          require(state.get('approvedConcurrentScopes', {}).get(purpose['sourceBranch']) == [
              'scripts/production_cold_preservation.py', 'scripts/test_production_cold_preservation.py',
              '.github/workflows/production-cold-preservation.yml', 'docs/ops/production-cold-preservation.md',
              'scripts/test_production_stopped_runtime_headroom.py'])
          controller_paths = ['.github/workflows/production-cold-preservation.yml',
                              'scripts/test_production_cold_preservation.py', 'docs/ops/production-cold-preservation.md']
          def pins(items, paths, modes):
              require(type(items) is list and len(items) == len(paths))
              for item, path, mode in zip(items, paths, modes):
                  require(type(item) is dict and set(item) == {'path', 'mode', 'sha256'} and
                          item['path'] == path and item['mode'] == mode and
                          type(item['sha256']) is str and re.fullmatch('[0-9a-f]{64}', item['sha256']) is not None)
                  accepted(path, mode, item['sha256'])
          pins(purpose['sourcePins'], controller_paths, ['100644'] * 3)
          engine = state.get('coordinationAdmissions', {}).get('ir20-stopped-copy-source-20261023')
          require(type(engine) is dict and set(engine) == {
              'authorityBaseExactMain', 'dependencySha256', 'limits', 'owner', 'ownerDecision',
              'productionAcceptance', 'productionInvocationAuthorized', 'sourceBranch', 'sourcePins', 'writerHandoff'})
          require(engine['owner'] == 'ACCOUNT_1_CORE' and
                  engine['sourceBranch'] == 'ops/ir20-isolated-restore-20260919' and
                  engine['ownerDecision'] == '#5469#issuecomment-6354447020' and
                  engine['writerHandoff'] == '#5469#issuecomment-6368785509' and
                  engine['productionAcceptance'] is False and engine['productionInvocationAuthorized'] is False and
                  engine['limits'] == 'Six-path source-only stopped PG16 volatile-copy prerequisite. No host dispatch, original startup, transfer or new cost.')
          ancestor(engine['authorityBaseExactMain'])
          engine_paths = ['scripts/release/ir20-restore-drill.sh', 'scripts/release/test-ir20-restore-drill.py',
                          'scripts/release/test-ir20-restore-drill-integration.sh', '.github/workflows/ir20-restore-drill.yml',
                          'docs/ops/ir20-isolated-restore.md', 'docs/platform-v7/autopilot/scopes/ir20-isolated-restore-20260919.json']
          require(state.get('approvedConcurrentScopes', {}).get(engine['sourceBranch']) == engine_paths)
          pins(engine['sourcePins'], engine_paths, ['100755'] * 3 + ['100644'] * 3)
          dependencies = {
              'scripts/production_stopped_runtime_headroom.py': '6b121fad2c380a8425f1ca6024e1740406f26172295c215e01bbe0f200768c14',
              'scripts/production_cold_preservation.py': '19c873694debb0076701a912b394aad6bb0e092947f04d97e5144320ca5ca832'}
          require(engine['dependencySha256'] == dependencies)
          for path, digest in dependencies.items():
              accepted(path, '100644', digest)
          PY_BIND
          read -r state comments is_pr < <(gh api "repos/${GITHUB_REPOSITORY}/issues/4637" --jq '[.state,.comments,has("pull_request")] | @tsv')
          [[ "$state" == open && "$comments" =~ ^[0-9]+$ && "$is_pr" == false ]] && (( comments < 2500 ))
      - name: Resolve protected key and pinned VPS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'Canonical VPS mismatch.' >&2; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo 'Protected production principal is missing or invalid.' >&2; exit 11; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Pinned host fingerprint is required.' >&2; exit 13; }
          domain_ips="$(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u || true)"
          grep -Fxq "$DEFAULT_HOST" <<< "$domain_ips"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            ssh-keygen -lf "$pub" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo 'No valid protected SSH private key is configured.' >&2
            exit 14
          }

          scan="$(mktemp)"; match="$(mktemp)"
          pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo 'Pinned host key mismatch after bounded retries.' >&2; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PROD_HOST=$host" >> "$GITHUB_ENV"
          echo "PROD_PORT=$port" >> "$GITHUB_ENV"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$host" \
            'set -Eeuo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"

      - name: Restore only the accepted historical core
        id: historical-core-bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          python3 - "$TARGET_SHA" "$EVIDENCE_DIR" <<'PY_PENDING'
          import pathlib,re,sys
          target,output=sys.argv[1:]
          if not re.fullmatch('[0-9a-f]{40}',target): raise SystemExit('INVALID_SOURCE_SHA')
          q=chr(96)
          body=f'# Historical core bootstrap\n\nExact source: {q}{target}{q}.\n\n'
          body+='Stage outcome: UNKNOWN. Core state requires reconciliation; exact-current-main release and registration are not accepted.\n'
          body+='Keep original volumes, both archives/keys, created objects and the one-use journal. Do not replay.\n'
          pathlib.Path(output,'issue-record.md').write_text(body)
          PY_PENDING
          raw="$(mktemp)"
          payload="$(mktemp)"
          trap 'rm -f "$raw" "$payload"' EXIT
          python3 - "$TARGET_SHA" > "$payload" <<'PY_PAYLOAD'
          import ast,base64,hashlib,subprocess,sys,textwrap
          target = sys.argv[1]
          def source(path):
              return subprocess.check_output(['git','show',target+':'+path])
          helper = source('scripts/production_stopped_runtime_headroom.py')
          cold = source('scripts/production_cold_preservation.py')
          if hashlib.sha256(helper).hexdigest() != '6b121fad2c380a8425f1ca6024e1740406f26172295c215e01bbe0f200768c14' or hashlib.sha256(cold).hexdigest() != '19c873694debb0076701a912b394aad6bb0e092947f04d97e5144320ca5ca832':
              raise SystemExit('BOOTSTRAP_DEPENDENCY_IDENTITY')
          tree = ast.parse(helper)
          refs = [ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='EXPECTED_REFS' for t in n.targets)]
          if len(refs)!=1 or type(refs[0]) is not tuple or len(refs[0])!=11 or tuple(sorted(refs[0]))!=refs[0]:
              raise SystemExit('BOOTSTRAP_SAVED_REFERENCE_PROFILE')
          workflow = source('.github/workflows/production-docker-headroom-diagnostic.yml')
          if hashlib.sha256(workflow).hexdigest() != '31b39b0436ef704ff8b066cb3f3d4bb9595c6cccdc5abfcd707934ce5d2e2bd7':
              raise SystemExit('BOOTSTRAP_INSPECTOR_IDENTITY')
          # Exact Oct29 web transition; never derive authority from host inventory.
          prior_web = ('e643540aecc11ff0158fdca743af410e8746bb7ed408c9cc8b5dd3fccb618d65', 'sha256:4a9a5687ef842f091619ba0c442901c1d760bff225231cd4dbc70b411ce74d49')
          accepted_web = ('b97bfde412b4652d208cc679e8278d56fa5697588ef112d7c9056cda0ab415e9', 'sha256:74d2304531d758ff945da74f52c80fbc71126f51a8f108555fabdd319c8d4dd8')
          if refs[0].count(prior_web) != 1 or any(cid == accepted_web[0] for cid, image in refs[0]):
              raise SystemExit('BOOTSTRAP_WEB_TRANSITION_INVALID')
          current_refs = tuple(sorted(accepted_web if item == prior_web else item for item in refs[0]))
          parts = []
          for name in ('PY_INSPECTION_0','PY_INSPECTION_1','PY_INSPECTION_2'):
              begin,end=("<<'"+name+"'\n").encode(),('\n          '+name+'\n').encode()
              if workflow.count(begin)!=1 or workflow.count(end)!=1: raise SystemExit('BOOTSTRAP_INSPECTOR_BOUNDARY')
