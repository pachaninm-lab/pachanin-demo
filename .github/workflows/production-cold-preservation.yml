          import json
          import re


          def validate_terminal(data, expected, run_id, status):
              def require(ok):
                  if not ok:
                      raise ValueError('BOOTSTRAP_TERMINAL_INVALID')
              def closed(pairs):
                  require(len(pairs) == len(dict(pairs)))
                  return dict(pairs)
              require(type(data) is bytes and 0 < len(data) <= 16384)
              value = json.loads(data.decode('utf-8', errors='strict'), object_pairs_hook=closed,
                                 parse_constant=lambda _: (_ for _ in ()).throw(ValueError()))
              require(type(value) is dict and re.fullmatch('[0-9a-f]{40}', expected) and
                      re.fullmatch('[1-9][0-9]{0,19}', run_id))
              fixed = {'schemaVersion': 'pc.core-bootstrap.v1', 'targetSha': expected, 'runId': run_id,
                       'exactCurrentMainReleased': False, 'registrationAccepted': False,
                       'dataRollbackClaimed': False}
              require(all(type(value.get(k)) is type(v) and value[k] == v for k, v in fixed.items()))
              if value.get('passed') is False:
                  require(set(value) == set(fixed) | {'passed', 'outcome', 'errorCode'})
                  require(type(value['outcome']) is str and value['outcome'] in ('REFUSED', 'UNKNOWN') and
                          type(value['errorCode']) is str and re.fullmatch('[A-Z_]{1,64}', value['errorCode']) and
                          type(status) is str and status == '1')
                  return value
              success = {'passed': True, 'historicalCoreRestored': True, 'createdCoreCount': 6,
                         'quarantinedRecordCount': 5, 'originalArchivesRetained': True}
              require(set(value) == set(fixed) | set(success) and type(status) is str and status == '0')
              require(all(type(value.get(k)) is type(v) and value[k] == v for k, v in success.items()))
              return value

          import pathlib, sys
          raw_name,expected,run_id,output,status=sys.argv[1:]
          try:
              with pathlib.Path(raw_name).open('rb') as handle:
                  value=validate_terminal(handle.read(16385),expected,run_id,status)
          except BaseException:
              raise SystemExit('BOOTSTRAP_TERMINAL_INVALID') from None
          if value['passed'] is not True:
              print('BOOTSTRAP_EXECUTOR_FAILURE='+value['errorCode'])
              raise SystemExit('HISTORICAL_CORE_BOOTSTRAP_NOT_ACCEPTED')
          with pathlib.Path(output,'result.json').open('x') as handle:
              handle.write(json.dumps(value,separators=(',',':'))+'\n')
          q=chr(96)
          body=f'# Historical core bootstrap\n\nExact source: {q}{expected}{q}.\n\n'
          body+='Historical six-service core restored and local health verified; five historical records remain quarantined.\n'
          body+='Exact-current-main release, farmer registration acceptance and data rollback are not claimed. Original volumes, both archives/keys and the durable journal remain retained.\n'
          pathlib.Path(output,'issue-record.md').write_text(body)
          PY_RECORD
          (( rc == 0 ))
      - name: Cleanup protected transport
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
      - name: Publish bounded terminal evidence
        id: publish-evidence
        if: always() && env.EVIDENCE_INITIALIZED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_OUTCOME: ${{ steps.historical-core-bootstrap.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$EXECUTION_OUTCOME" != success ]]; then
            rm -f "$EVIDENCE_DIR/result.json"
            python3 - "$TARGET_SHA" "$EVIDENCE_DIR" <<'PY_UNKNOWN'
          import pathlib,re,sys
          target,output=sys.argv[1:]
          if not re.fullmatch('[0-9a-f]{40}',target): raise SystemExit('INVALID_SOURCE_SHA')
          q=chr(96)
          body=f'# Historical core bootstrap\n\nExact source: {q}{target}{q}.\n\n'
          body+='Stage outcome: UNKNOWN. Core state requires reconciliation; exact-current-main release and registration are not accepted.\n'
          body+='Keep original volumes, both archives/keys, created objects and the one-use journal. Do not replay.\n'
          pathlib.Path(output,'issue-record.md').write_text(body)
          PY_UNKNOWN
          fi
          if [[ -f "$EVIDENCE_DIR/issue-record.md" ]]; then
            gh issue comment 4637 --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/issue-record.md"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.EVIDENCE_INITIALIZED == '1' && steps.publish-evidence.outcome == 'success'
        with:
          name: cold-preservation-${{ github.run_id }}
          path: |
            artifacts/production-cold-preservation/target-sha.txt
            artifacts/production-cold-preservation/issue-record.md
            artifacts/production-cold-preservation/result.json
          if-no-files-found: error
          retention-days: 90
