name: Production Web Exact-SHA Image Gate

on:
  push:
    branches: [main]
    paths:
      - 'infra/docker/Dockerfile.web'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full main commit SHA to wait for and deploy'
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: production-web-exact-sha-image-gate
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/production-web-exact-sha-image-gate
  IMAGE_WAIT_ATTEMPTS: '240'
  IMAGE_WAIT_SECONDS: '10'
  PRIMARY_RELEASE_DISCOVERY_ATTEMPTS: '30'
  PRIMARY_RELEASE_DISCOVERY_SECONDS: '2'
  PRIMARY_RELEASE_WAIT_ATTEMPTS: '180'
  PRIMARY_RELEASE_WAIT_SECONDS: '10'

jobs:
  wait-and-dispatch:
    name: Wait for canonical image and preserve a single bounded release
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact main target
        id: target
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            target_sha="$GITHUB_SHA"
          else
            target_sha="$INPUT_TARGET_SHA"
          fi

          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'A full lowercase 40-character target SHA is required.' >&2
            exit 2
          }

          git fetch --no-tags origin main
          git cat-file -e "${target_sha}^{commit}"
          git merge-base --is-ancestor "$target_sha" origin/main

          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$target_sha" > "$EVIDENCE_DIR/target-sha.txt"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact canonical web image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          exact_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/grainflow-web:sha-${TARGET_SHA:0:7}"

          for attempt in $(seq 1 "$IMAGE_WAIT_ATTEMPTS"); do
            if docker pull "$exact_image" >/dev/null 2>&1; then
              actual="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact_image" 2>/dev/null || true)"
              echo "Image attempt $attempt/$IMAGE_WAIT_ATTEMPTS: expected=$TARGET_SHA actual=${actual:-missing}"
              if [[ "$actual" == "$TARGET_SHA" ]]; then
                docker image inspect "$exact_image" > "$EVIDENCE_DIR/registry-image.json"
                printf '%s\n' "$exact_image" > "$EVIDENCE_DIR/image.txt"
                exit 0
              fi
            fi
            sleep "$IMAGE_WAIT_SECONDS"
          done

          echo 'Exact canonical web image was not published within the bounded wait window.' >&2
          exit 3

      - name: Resolve primary push release authority
        id: primary
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'action=dispatch' >> "$GITHUB_OUTPUT"
            echo 'reason=manual_image_gate' >> "$GITHUB_OUTPUT"
            printf '%s\n' MANUAL_IMAGE_GATE > "$EVIDENCE_DIR/primary-release-status.txt"
            exit 0
          fi

          primary_run=''
          for attempt in $(seq 1 "$PRIMARY_RELEASE_DISCOVERY_ATTEMPTS"); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow production-web-exact-sha.yml \
              --branch main \
              --event push \
              --limit 50 \
              --json databaseId,headSha,status,conclusion \
              > "$EVIDENCE_DIR/primary-release-candidates.json"
            primary_run="$(jq -r --arg sha "$TARGET_SHA" '.[] | select(.headSha == $sha) | .databaseId' "$EVIDENCE_DIR/primary-release-candidates.json" | head -n 1)"
            if [[ "$primary_run" =~ ^[0-9]+$ ]]; then
              break
            fi
            primary_run=''
            sleep "$PRIMARY_RELEASE_DISCOVERY_SECONDS"
          done

          [[ "$primary_run" =~ ^[0-9]+$ ]] || {
            echo 'The automatic primary push release run was not discoverable; refusing an uncoordinated fallback deploy.' >&2
            exit 4
          }

          printf '%s\n' "$primary_run" > "$EVIDENCE_DIR/primary-release-run-id.txt"
          echo "primary_run_id=$primary_run" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 "$PRIMARY_RELEASE_WAIT_ATTEMPTS"); do
            gh run view "$primary_run" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,headSha,status,conclusion,url \
              > "$EVIDENCE_DIR/primary-release-run.json"
            status="$(jq -r '.status' "$EVIDENCE_DIR/primary-release-run.json")"
            conclusion="$(jq -r '.conclusion // ""' "$EVIDENCE_DIR/primary-release-run.json")"
            echo "Primary release attempt $attempt/$PRIMARY_RELEASE_WAIT_ATTEMPTS: run=$primary_run status=$status conclusion=${conclusion:-pending}"

            if [[ "$status" == completed ]]; then
              case "$conclusion" in
                success)
                  echo 'action=skip' >> "$GITHUB_OUTPUT"
                  echo 'reason=primary_release_succeeded' >> "$GITHUB_OUTPUT"
                  printf '%s\n' SKIPPED_PRIMARY_RELEASE_SUCCEEDED > "$EVIDENCE_DIR/dispatch-status.txt"
                  exit 0
                  ;;
                failure|cancelled|timed_out|action_required|stale)
                  echo 'action=dispatch' >> "$GITHUB_OUTPUT"
                  echo 'reason=primary_release_failed' >> "$GITHUB_OUTPUT"
                  printf '%s\n' "$conclusion" > "$EVIDENCE_DIR/primary-release-status.txt"
                  exit 0
                  ;;
                *)
                  echo "Primary release ended with an unsupported conclusion: $conclusion" >&2
                  exit 5
                  ;;
              esac
            fi
            sleep "$PRIMARY_RELEASE_WAIT_SECONDS"
          done

          echo 'Primary release did not reach a terminal state inside the bounded wait; refusing a duplicate fallback deploy.' >&2
          exit 6

      - name: Dispatch bounded exact-SHA fallback release
        if: steps.primary.outputs.action == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          DISPATCH_REASON: ${{ steps.primary.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-web-exact-sha.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f action=deploy \
            -f target_sha="$TARGET_SHA" \
            -f confirmation=DEPLOY-EXACT-SHA
          printf 'DISPATCHED reason=%s\n' "$DISPATCH_REASON" > "$EVIDENCE_DIR/dispatch-status.txt"

      - name: Build evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 |
            sort -z |
            xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"

      - name: Upload image-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-web-exact-sha-image-gate-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
