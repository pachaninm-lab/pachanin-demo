name: Apply production full-stack owner trigger

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-production-full-stack-owner-trigger.py"
      - ".github/workflows/apply-production-full-stack-owner-trigger.yml"
      - "docs/platform-v7/autopilot/scopes/production-full-stack-owner-trigger-20260802.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-full-stack-owner-trigger-source
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout materializer authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Capture helper and exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 scripts/apply-production-full-stack-owner-trigger.py \
            "$RUNNER_TEMP/apply-production-full-stack-owner-trigger.py"
          git fetch --no-tags origin main
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git reset --hard origin/main
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Apply and capture verified source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$RUNNER_TEMP/apply-production-full-stack-owner-trigger.py"
          node scripts/check-production-full-stack-release.mjs
          git diff --check
          grep -Fq "github.event.comment.body == '/production full-stack current-main'" .github/workflows/production-full-stack-exact-sha.yml
          grep -Fq 'github.event.comment.user.login == github.repository_owner' .github/workflows/production-full-stack-exact-sha.yml
          grep -Fq 'github.event.issue.number == 3072' .github/workflows/production-full-stack-exact-sha.yml
          ! grep -Eq "github\.actor[[:space:]]*==[[:space:]]*['\"]github-actions\[bot\]['\"]" .github/workflows/production-full-stack-exact-sha.yml
          git diff --binary -- \
            .github/workflows/production-full-stack-exact-sha.yml \
            scripts/check-production-full-stack-release.mjs \
            > "$RUNNER_TEMP/production-full-stack-owner-trigger.patch"
          test -s "$RUNNER_TEMP/production-full-stack-owner-trigger.patch"

      - name: Publish clean source-only branch
        shell: bash
        env:
          CLEAN_BRANCH: fix/production-full-stack-owner-trigger-source-20260802
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git reset --hard origin/main
          git clean -fdx
          git apply --index "$RUNNER_TEMP/production-full-stack-owner-trigger.patch"
          files=$(git diff --cached --name-only | sort)
          test "$files" = $'.github/workflows/production-full-stack-exact-sha.yml\nscripts/check-production-full-stack-release.mjs'
          node scripts/check-production-full-stack-release.mjs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(release): authorize owner-only full-stack trigger'
          git push --force origin HEAD:"refs/heads/$CLEAN_BRANCH"
