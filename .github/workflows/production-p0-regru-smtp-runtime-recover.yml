name: Production P0 REG.RU SMTP Runtime Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-regru-smtp-runtime-recover.yml'
      - 'docs/platform-v7/autopilot/scopes/production-p0-regru-smtp-runtime-recover-3785.json'
      - 'scripts/provision-production-p0-password-reset-runtime.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3072
  EVIDENCE_DIR: artifacts/production-p0-regru-smtp-runtime-recover
  DEFAULT_SMTP_HOST: sm38.hosting.reg.ru
  DEFAULT_SMTP_PORT: '465'
  DEFAULT_SMTP_USER: access@xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_MAIL_FROM: access@xn----8sbjf4befbjgs9b.xn--p1ai

jobs:
  contract:
    name: Validate REG.RU SMTP recovery contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-regru-smtp-runtime-recover current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate bounded safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/check-production-p0-password-reset-runtime-provision.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path

          scope_path = Path('docs/platform-v7/autopilot/scopes/production-p0-regru-smtp-runtime-recover-3785.json')
          scope = json.loads(scope_path.read_text())
          assert scope['schemaVersion'] == 'platform-v7.concurrent-scope.v1'
          assert scope['issue'] == 3785 and scope['releaseIssue'] == 3072
          assert scope['productionHosting'] == 'REG_RU_EXISTING_INFRASTRUCTURE_ONLY'
          assert scope['boundaries']['newRecurringCostRub'] == 0
          assert scope['boundaries']['ownerOnly'] is True
          assert scope['boundaries']['exactMainGuard'] is True
          assert scope['boundaries']['databaseMutation'] is False
          assert scope['boundaries']['deploymentMutation'] is False
          assert scope['boundaries']['credentialOutput'] is False
          assert scope['boundaries']['piiOutput'] is False
          assert scope['boundaries']['rawEnvironmentOutput'] is False
          assert scope['boundaries']['rawLogOutput'] is False
          expected_paths = {
              '.github/workflows/production-p0-regru-smtp-runtime-recover.yml',
              'docs/platform-v7/autopilot/scopes/production-p0-regru-smtp-runtime-recover-3785.json',
          }
          assert set(scope['allowedPaths']) == expected_paths
          PY
      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  recover:
    name: Recover root-only REG.RU auth-mail runtime
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != '' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-regru-smtp-runtime-recover current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
      SMTP_HOST_SECRET: ${{ secrets.PC_SMTP_HOST || secrets.PC_PROD_SMTP_HOST || secrets.SMTP_HOST }}
      SMTP_PORT_SECRET: ${{ secrets.PC_SMTP_PORT || secrets.PC_PROD_SMTP_PORT || secrets.SMTP_PORT }}
      SMTP_USER_SECRET: ${{ secrets.PC_SMTP_USER || secrets.PC_PROD_SMTP_USER || secrets.SMTP_USER }}
      SMTP_PASS_SECRET: ${{ secrets.PC_SMTP_PASS || secrets.PC_PROD_SMTP_PASS || secrets.SMTP_PASSWORD || secrets.SMTP_PASS }}
      MAIL_FROM_SECRET: ${{ secrets.PC_MAIL_FROM || secrets.PC_PROD_MAIL_FROM || secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact current-main checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Resolve existing REG.RU SMTP authority without disclosure
        id: mail
        shell: bash
        run: |
          set -Eeuo pipefail
          safe_scalar(){ [[ -n "$1" && "$1" != *$'\n'* && "$1" != *$'\r'* ]]; }
          host="${SMTP_HOST_SECRET:-$DEFAULT_SMTP_HOST}"
          port="${SMTP_PORT_SECRET:-$DEFAULT_SMTP_PORT}"
          user="${SMTP_USER_SECRET:-$DEFAULT_SMTP_USER}"
          from="${MAIL_FROM_SECRET:-$DEFAULT_MAIL_FROM}"
          pass="${SMTP_PASS_SECRET:-}"

          [[ "$user" != 'access@процент-агро.рф' ]] || user="$DEFAULT_SMTP_USER"
          [[ "$from" != 'access@процент-агро.рф' ]] || from="$DEFAULT_MAIL_FROM"

          safe_scalar "$host" && safe_scalar "$port" && safe_scalar "$user" && safe_scalar "$from" || exit 20
          if ! safe_scalar "$pass"; then
            echo 'ERROR_CODE=REG_RU_SMTP_PASSWORD_SECRET_MISSING' >&2
            exit 21
          fi
          [[ "$host" == "$DEFAULT_SMTP_HOST" ]] || { echo 'ERROR_CODE=REG_RU_SMTP_HOST_MISMATCH' >&2; exit 22; }
          [[ "$port" == "$DEFAULT_SMTP_PORT" ]] || { echo 'ERROR_CODE=REG_RU_SMTP_PORT_MISMATCH' >&2; exit 23; }
          [[ "$user" == "$DEFAULT_SMTP_USER" ]] || { echo 'ERROR_CODE=REG_RU_SMTP_USER_MISMATCH' >&2; exit 24; }
          [[ "$from" == "$DEFAULT_MAIL_FROM" ]] || { echo 'ERROR_CODE=REG_RU_SMTP_FROM_MISMATCH' >&2; exit 25; }

          mkdir -p "$EVIDENCE_DIR"
          input="$RUNNER_TEMP/pc-regru-smtp-mail.env"
          umask 077
          printf 'PC_SMTP_HOST=%s\nPC_SMTP_USER=%s\nPC_SMTP_PASS=%s\nPC_SMTP_PORT=%s\nPC_MAIL_FROM=%s\n' \
            "$host" "$user" "$pass" "$port" "$from" > "$input"
          chmod 0600 "$input"
          echo "input=$input" >> "$GITHUB_OUTPUT"

          SMTP_HOST="$host" SMTP_PORT="$port" SMTP_USER="$user" SMTP_PASS="$pass" node <<'NODE' > "$EVIDENCE_DIR/smtp-auth.txt"
          const tls = require('node:tls');
          const host = process.env.SMTP_HOST;
          const port = Number(process.env.SMTP_PORT);
          const user = process.env.SMTP_USER;
          const pass = process.env.SMTP_PASS;
          let buffer = '';
          let waiter = null;
          const socket = tls.connect({ host, port, servername: host, rejectUnauthorized: true });
          const timeout = setTimeout(() => fail(30), 10000);

          function fail(code) {
            clearTimeout(timeout);
            try { socket.destroy(); } catch {}
            process.exit(code);
          }
          function nextResponse() {
            return new Promise((resolve) => { waiter = resolve; drain(); });
          }
          function drain() {
            if (!waiter) return;
            const lines = buffer.split(/\r?\n/);
            if (lines.length < 2) return;
            const complete = lines.findIndex((line) => /^\d{3} /.test(line));
            if (complete < 0) return;
            const response = lines.slice(0, complete + 1).join('\n');
            buffer = lines.slice(complete + 1).join('\n');
            const resolve = waiter; waiter = null; resolve(response);
          }
          function code(response) { return Number(String(response).slice(0, 3)); }
          async function command(value, expected) {
            socket.write(`${value}\r\n`);
            const response = await nextResponse();
            if (!expected.includes(code(response))) fail(31);
          }
          socket.on('data', (chunk) => { buffer += chunk.toString('utf8'); drain(); });
          socket.on('error', () => fail(32));
          socket.once('secureConnect', async () => {
            const greeting = await nextResponse();
            if (code(greeting) !== 220) fail(33);
            await command('EHLO transparent-price.local', [250]);
            const auth = Buffer.from(`\u0000${user}\u0000${pass}`, 'utf8').toString('base64');
            await command(`AUTH PLAIN ${auth}`, [235]);
            socket.write('QUIT\r\n');
            clearTimeout(timeout);
            socket.end();
            process.stdout.write('REG_RU_SMTP_AUTH_OK=1\n');
          });
          NODE
          grep -Fxq REG_RU_SMTP_AUTH_OK=1 "$EVIDENCE_DIR/smtp-auth.txt" || {
            echo 'ERROR_CODE=REG_RU_SMTP_AUTH_FAILED' >&2
            exit 26
          }

      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ -n "$host" && -n "$user" ]]
          [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null && validate_key "$third" && {
              rm -f "$first" "$second" "$third"; return 0;
            }
            rm -f "$first" "$second" "$third"
            return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 40

          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$user@$host" 'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; echo ROOT_SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Materialize protected runtime through existing provisioner
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          MAIL_INPUT: ${{ steps.mail.outputs.input }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -f "$MAIL_INPUT" && "$(stat -c '%a' "$MAIL_INPUT")" == 600 ]]
          remote_script="/tmp/pc-regru-mail-runtime-${GITHUB_RUN_ID}.sh"
          remote_mail="/tmp/pc-regru-mail-${GITHUB_RUN_ID}.env"
          scp_common=(-i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh_common=(-i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${scp_common[@]}" scripts/provision-production-p0-password-reset-runtime.sh "$USER@$HOST:$remote_script"
          scp "${scp_common[@]}" "$MAIL_INPUT" "$USER@$HOST:$remote_mail"
          ssh "${ssh_common[@]}" "$USER@$HOST" \
            "chmod 0700 '$remote_script' && chmod 0600 '$remote_mail' && PC_RECONCILE_ACTIVE_RUNTIME=1 '$remote_script' provision '$remote_mail'" \
            | tee "$EVIDENCE_DIR/provision.log"
          grep -Eq '^PASSWORD_RESET_DELIVERY_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.log"
          grep -Eq '^REGISTRATION_DELIVERY_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.log"
          grep -Fxq PASSWORD_RESET_RUNTIME_VALID=1 "$EVIDENCE_DIR/provision.log"
          grep -Fxq AUTH_MAIL_RUNTIME_VALID=1 "$EVIDENCE_DIR/provision.log"
          grep -Eq '^TRANSACTIONAL_MAIL_PROVISION=(CREATED|EXISTING)$' "$EVIDENCE_DIR/provision.log"
          grep -Fxq TRANSACTIONAL_MAIL_CHANNEL=SMTP "$EVIDENCE_DIR/provision.log"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]

      - name: Publish bounded recovery result
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production P0 REG.RU SMTP runtime recovery

          - exact main: \`$TARGET_SHA\`
          - result: \`PASS\`
          - SMTP authority: \`REG_RU_EXISTING_ACCESS_MAILBOX\`
          - SMTP auth: \`PASS_NO_MESSAGE_SENT\`
          - password-reset delivery runtime: \`READY\`
          - registration delivery runtime: \`READY\`
          - transactional-mail runtime: \`READY_SMTP\`
          - production mutation: \`ROOT_ONLY_AUTH_MAIL_RUNTIME_FILES\`
          - deployment mutation: \`NONE\`
          - raw paths, credentials and environment values: \`NOT_PUBLISHED\`
          - next: \`P0_AUTH_RUNTIME_AUTODISCOVERY_RELEASE\`" >/dev/null

      - name: Remove bounded remote assets and local credentials
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${HOST:-}" && -n "${USER:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$USER@$HOST" "rm -f '/tmp/pc-regru-mail-runtime-${GITHUB_RUN_ID}.sh' '/tmp/pc-regru-mail-${GITHUB_RUN_ID}.env'" || true
          fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
          rm -f "$RUNNER_TEMP/pc-regru-smtp-mail.env"

      - name: Upload bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-regru-smtp-runtime-recover-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 90
