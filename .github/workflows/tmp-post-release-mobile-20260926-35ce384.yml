name: Temporary post-release exact mobile acceptance

on:
  push:
    branches:
      - ops/tmp-post-release-mobile-20260926-35ce384

permissions:
  actions: write
  contents: read

jobs:
  post-release-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Wait for exact production controller and dispatch canonical mobile acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: '35ce3841f15572bfcba7c8d7e03afb858da0888d'
          RELEASE_RUN_ID: '36258611136'
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" == "$TARGET_SHA" ]] || { echo "MAIN_DRIFT"; exit 40; }

          release_head="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq .head_sha)"
          [[ "$release_head" == "$TARGET_SHA" ]] || { echo "RELEASE_HEAD_MISMATCH"; exit 41; }

          gh run watch "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          release_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq '.conclusion // empty')"
          [[ "$release_conclusion" == success ]] || { echo "RELEASE_NOT_SUCCESS"; exit 42; }

          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" == "$TARGET_SHA" ]] || { echo "MAIN_DRIFT_AFTER_RELEASE"; exit 43; }

          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$RUNNER_TEMP/mobile-dispatch.json"
          printf '{"ref":"main","inputs":{"target_sha":"%s"}}\n' "$TARGET_SHA" > "$payload"
          gh api --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "repos/$GITHUB_REPOSITORY/actions/workflows/platform-v7-production-mobile-acceptance.yml/dispatches"             --input "$payload"

          mobile_run=''
          for attempt in $(seq 1 60); do
            mobile_run="$(gh api               "repos/$GITHUB_REPOSITORY/actions/workflows/platform-v7-production-mobile-acceptance.yml/runs?event=workflow_dispatch&branch=main&per_page=30"               --jq ".workflow_runs | map(select(.head_sha == \"$TARGET_SHA\" and .created_at >= \"$started\")) | sort_by(.created_at) | reverse | .[0].id // empty")"
            [[ "$mobile_run" =~ ^[0-9]+$ ]] && break
            sleep 2
          done
          [[ "$mobile_run" =~ ^[0-9]+$ ]] || { echo "MOBILE_RUN_NOT_FOUND"; exit 44; }

          echo "MOBILE_RUN_ID=$mobile_run"
          gh run watch "$mobile_run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          mobile_head="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$mobile_run" --jq .head_sha)"
          mobile_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$mobile_run" --jq '.conclusion // empty')"
          [[ "$mobile_head" == "$TARGET_SHA" && "$mobile_conclusion" == success ]] || { echo "MOBILE_NOT_SUCCESS"; exit 45; }
          echo "POST_RELEASE_MOBILE=PASS"
