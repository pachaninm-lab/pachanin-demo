name: Auction Atomic Execution Acceptance
# Exact-head rerun after forward-safe minor-unit constraint hardening.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auction-atomic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grainflow?schema=public
  DATABASE_URL: postgresql://app_deal:app_deal@localhost:5432/grainflow?schema=public
  AUCTION_DIR: artifacts/auction-atomic
jobs:
  auction-atomic:
    name: PostgreSQL race, restart and rollback acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: ghcr.io/pachaninm-lab/ci-postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: grainflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d grainflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
      - name: Initialize exact-head evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$AUCTION_DIR"
          printf '%s\n' "$EXACT_HEAD" > "$AUCTION_DIR/exact-head.txt"
          if [[ "${GITHUB_HEAD_REF:-}" == feat/pc-crop-auction-inventory-authority-4997 ]]; then
            PC_CROP_BASE_REF="$BASE_SHA" node --test scripts/verify-pc-crop-auction-inventory-scope.test.mjs
          else
            node --test scripts/verify-pc-crop-auction-inventory-scope.test.mjs
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: '10.2.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Create restricted application principal
        run: |
          psql postgresql://postgres:postgres@localhost:5432/grainflow -X --set ON_ERROR_STOP=1 <<'SQL'
          DO $role$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_deal') THEN
              CREATE ROLE app_deal LOGIN PASSWORD 'app_deal' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
            END IF;
          END
          $role$;
          GRANT CONNECT ON DATABASE grainflow TO app_deal;
          GRANT USAGE ON SCHEMA public TO app_deal;
          SQL
      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ env.TEST_ADMIN_DATABASE_URL }}
        run: pnpm --filter @pc/api exec prisma generate
      - name: Apply forward migrations on PostgreSQL 16
        env:
          DATABASE_URL: ${{ env.TEST_ADMIN_DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @pc/api exec prisma migrate deploy 2>&1 | tee "$AUCTION_DIR/migrate-deploy.log"
          pnpm --filter @pc/api exec prisma migrate status 2>&1 | tee "$AUCTION_DIR/migrate-status.log"
          pnpm --filter @pc/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code 2>&1 | tee "$AUCTION_DIR/schema-drift.log"
      - name: Typecheck auction command authority
        env:
          DATABASE_URL: ${{ env.TEST_ADMIN_DATABASE_URL }}
        run: pnpm --filter @pc/api typecheck
      - name: Run auction policy tests
        env:
          DATABASE_URL: ${{ env.TEST_ADMIN_DATABASE_URL }}
        run: |
          pnpm --filter @pc/api exec jest --runInBand --runTestsByPath \
            src/modules/auctions/auction-postgresql-authority.spec.ts \
            src/modules/auctions/auction-command.service.spec.ts \
            src/modules/auctions/auction-fgis-self-verification.spec.ts \
            src/modules/auctions/auction-inventory.contract.spec.ts
      - name: Run PostgreSQL race and restart acceptance
        run: |
          set -euo pipefail
          pnpm --filter @pc/api exec jest --config test/industrial/jest.config.json \
            test/industrial/auction-atomic-execution.e2e-spec.ts \
            test/industrial/auction-idempotency-race.e2e-spec.ts \
            --runInBand --json \
            --outputFile="$GITHUB_WORKSPACE/$AUCTION_DIR/auction-jest.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/$AUCTION_DIR/auction-jest.log"
      - name: Prove Inventory binding under restricted PostgreSQL commands
        env:
          NODE_ENV: test
          ONE_DEAL_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/grainflow
          ONE_DEAL_APP_URL: postgresql://app_deal:app_deal@localhost:5432/grainflow
        run: |
          set -euo pipefail
          pnpm --filter @pc/api exec jest --config test/industrial/jest.config.json \
            --runInBand --runTestsByPath test/industrial/auction-inventory-authority.e2e-spec.ts \
            --json --outputFile="$GITHUB_WORKSPACE/$AUCTION_DIR/inventory-jest.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/$AUCTION_DIR/inventory-jest.log"
      - name: Restore binding and evidence with their owners and grants
        run: |
          set -euo pipefail
          pg_dump postgresql://postgres:postgres@localhost:5432/grainflow --format=custom --file "$RUNNER_TEMP/auction-inventory.dump"
          psql postgresql://postgres:postgres@localhost:5432/grainflow -X --set ON_ERROR_STOP=1 -c 'CREATE DATABASE auction_inventory_restore'
          pg_restore --exit-on-error --dbname postgresql://postgres:postgres@localhost:5432/auction_inventory_restore \
            "$RUNNER_TEMP/auction-inventory.dump" 2>&1 | tee "$AUCTION_DIR/inventory-restore.log"
      - name: Recheck restricted replay and release denial after restore
        env:
          NODE_ENV: test
          AUCTION_INVENTORY_RESTORE_PROOF: '1'
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_inventory_restore
          ONE_DEAL_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/auction_inventory_restore
          ONE_DEAL_APP_URL: postgresql://app_deal:app_deal@localhost:5432/auction_inventory_restore
          DATABASE_URL: postgresql://app_deal:app_deal@localhost:5432/auction_inventory_restore
        run: |
          set -euo pipefail
          pnpm --filter @pc/api exec jest --config test/industrial/jest.config.json \
            --runInBand --runTestsByPath test/industrial/auction-inventory-authority.e2e-spec.ts \
            --json --outputFile="$GITHUB_WORKSPACE/$AUCTION_DIR/inventory-restore-jest.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/$AUCTION_DIR/inventory-restored-authority.log"
      - name: Build exact-head machine evidence
        env:
          AUCTION_ACCEPTANCE_EXACT_HEAD: ${{ env.EXACT_HEAD }}
          AUCTION_JEST_REPORT: ${{ env.AUCTION_DIR }}/auction-jest.json
          AUCTION_INVENTORY_JEST_REPORT: ${{ env.AUCTION_DIR }}/inventory-jest.json
          AUCTION_INVENTORY_RESTORE_JEST_REPORT: ${{ env.AUCTION_DIR }}/inventory-restore-jest.json
          AUCTION_ACCEPTANCE_REPORT: ${{ env.AUCTION_DIR }}/auction-atomic-acceptance.json
          AUCTION_ACCEPTANCE_JUNIT: ${{ env.AUCTION_DIR }}/auction-atomic-acceptance.xml
        run: node scripts/auction-atomic-acceptance.mjs
      - name: Upload atomic auction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auction-atomic-${{ env.EXACT_HEAD }}
          path: ${{ env.AUCTION_DIR }}
          if-no-files-found: error
          retention-days: 90
  auction-gate:
    name: Auction Atomic Gate · all blocking checks
    if: always()
    runs-on: ubuntu-latest
    needs: auction-atomic
    steps:
      - name: Enforce auction result
        run: test "${{ needs.auction-atomic.result }}" = success
