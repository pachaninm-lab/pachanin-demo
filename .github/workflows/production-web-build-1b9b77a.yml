name: Build exact production web 1b9b77a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-web-build-1b9b77a.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-web-build-1b9b77a
  cancel-in-progress: false

env:
  TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92
  EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a
  EVIDENCE_DIR: artifacts/production-web-build-1b9b77a

jobs:
  build:
    name: Build and verify immutable web image
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact merge SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify target is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TARGET_SHA" > "$EVIDENCE_DIR/target-sha.txt"
          printf '%s\n' "$EXACT_IMAGE" > "$EVIDENCE_DIR/exact-image.txt"

      - name: Build and push exact web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ env.EXACT_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
            org.opencontainers.image.source=https://github.com/pachaninm-lab/pachanin-demo
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            GIT_COMMIT=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64

      - name: Verify registry OCI revision and architecture
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$EXACT_IMAGE"
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$EXACT_IMAGE")"
          architecture="$(docker image inspect --format '{{ .Architecture }}' "$EXACT_IMAGE")"
          image_id="$(docker image inspect --format '{{ .Id }}' "$EXACT_IMAGE")"
          printf 'EXPECTED_REVISION=%s\nACTUAL_REVISION=%s\nARCHITECTURE=%s\nIMAGE_ID=%s\n' \
            "$TARGET_SHA" "$actual_revision" "$architecture" "$image_id" | tee "$EVIDENCE_DIR/registry-verification.txt"
          [[ "$actual_revision" == "$TARGET_SHA" ]]
          [[ "$architecture" == amd64 ]]
          docker image inspect "$EXACT_IMAGE" > "$EVIDENCE_DIR/registry-image.json"

      - name: Build evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-web-build-1b9b77a-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
