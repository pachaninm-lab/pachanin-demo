name: Platform V7 Canonical Visual Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'DESIGN_AUTHORITY.md'
      - 'apps/web/app/platform-v7/**'
      - 'apps/web/components/platform-v7/**'
      - 'apps/web/styles/platform-v7-canonical-public-v1.css'
      - 'apps/web/tests/e2e/platform-v7-canonical-visual-evidence.spec.ts'
      - 'apps/web/playwright.canonical-visual.config.ts'
      - '.github/workflows/platform-v7-canonical-visual-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-v7-canonical-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      JWT_SECRET: canonical-public-visual-evidence-2026
      PC_CABINET_SESSION_SECRET: canonical-public-visual-evidence-2026
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pc/web exec playwright install --with-deps chromium

      - name: Typecheck web
        run: pnpm --filter @pc/web typecheck

      - name: Build production web
        run: pnpm --filter @pc/web build

      - name: Capture canonical visual evidence
        working-directory: apps/web
        run: pnpm exec playwright test --config=playwright.canonical-visual.config.ts

      - name: Publish exact-head metadata
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/platform-v7-canonical-visual
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > artifacts/platform-v7-canonical-visual/exact-head.txt
          printf '%s\n' 'DESIGN_AUTHORITY.md' > artifacts/platform-v7-canonical-visual/design-authority.txt

      - name: Upload canonical visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v7-canonical-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/web/test-results/canonical-visual
            apps/web/playwright-report-canonical-visual
            artifacts/platform-v7-canonical-visual
          if-no-files-found: warn
          retention-days: 30
