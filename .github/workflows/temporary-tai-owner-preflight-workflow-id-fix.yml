name: Temporary TAI Owner Preflight Workflow Identity Fix

on:
  push:
    branches: [fix/tai-owner-preflight-workflow-id-20260802]
    paths:
      - '.github/workflows/temporary-tai-owner-preflight-workflow-id-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tai-owner-preflight-workflow-id-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact bounded workflow identity patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          owner='.github/workflows/tai-reg-ru-preflight-owner-command.yml'
          activation='.github/workflows/tai-restricted-qwen-reg-ru-activation.yml'
          checker='scripts/check-tai-reg-ru-release-chain.mjs'

          replace_exact(owner,'name: TAI REG.RU Preflight\n','name: TAI Owner REG.RU Preflight\n')
          replace_exact(activation,'TAI REG.RU Preflight','TAI Owner REG.RU Preflight',expected=2)
          replace_exact(
              checker,
              "  'upstream_preflight_gate:',\n",
              "  'upstream_preflight_gate:',\n  'workflows: [\"TAI Owner REG.RU Preflight\"]',\n",
          )
          replace_exact(checker,"'TAI REG.RU Preflight'","'TAI Owner REG.RU Preflight'",expected=3)
          PY
      - name: Validate workflow and release-chain contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/check-tai-reg-ru-release-chain.mjs
          node scripts/check-tai-bootstrap-preflight.mjs
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          for path in [
            '.github/workflows/tai-reg-ru-preflight-owner-command.yml',
            '.github/workflows/tai-restricted-qwen-reg-ru-activation.yml',
          ]:
            yaml.safe_load(Path(path).read_text(encoding='utf-8'))
          PY
          grep -Fq 'name: TAI Owner REG.RU Preflight' .github/workflows/tai-reg-ru-preflight-owner-command.yml
          grep -Fq 'workflows: ["TAI Owner REG.RU Preflight"]' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
          ! grep -Fq 'workflows: ["TAI REG.RU Preflight"]' .github/workflows/tai-restricted-qwen-reg-ru-activation.yml
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/temporary-tai-owner-preflight-workflow-id-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tai-reg-ru-preflight-owner-command.yml \
                  .github/workflows/tai-restricted-qwen-reg-ru-activation.yml \
                  scripts/check-tai-reg-ru-release-chain.mjs \
                  .github/workflows/temporary-tai-owner-preflight-workflow-id-fix.yml
          git diff --cached --check
          git commit -m 'fix(tai): bind activation to unique owner preflight workflow'
          git push origin HEAD:fix/tai-owner-preflight-workflow-id-20260802
