name: Diagnose Live Presentation Current 500

on:
  push:
    branches:
      - verify/live-presentation-db199aa-20260828
    paths:
      - '.github/workflows/diagnose-live-presentation-500-db199aa.yml'

permissions:
  contents: read

env:
  CANONICAL_VPS: '195.19.12.120'
  LIVE_BASE: 'https://xn----8sbjf4befbjgs9b.xn--p1ai'
  TARGET_SHA: 'ff07563c300f2cd98dd8ef08497545a19366c83d'

jobs:
  diagnose:
    name: Read-only current presentation route diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - name: Resolve pinned production SSH
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          key="$HOME/.ssh/id_pc_prod"; known="$HOME/.ssh/known_hosts"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          validate_key(){ local src="$1" pub; tr -d '\r' < "$src" > "$key"; chmod 0600 "$key"; grep -Eq '^(ssh-|ecdsa-|sk-)' "$key" && return 1; pub="$(mktemp)"; ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"; }
          try_key(){ local raw="$1" a b c; [[ -n "$raw" ]] || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          host="$(trim "${PC_PROD_HOST:-$CANONICAL_VPS}")"; user="$(trim "${PC_PROD_SSH_USER:-}")"; port="$(trim "${PC_PROD_SSH_PORT:-22}")"; expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ "$host" == "$CANONICAL_VPS" && -n "$user" && "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          try_key "${PC_PROD_SSH_KEY:-}" || try_key "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_key "${VPS_SSH_KEY:-}"
          scan="$(mktemp)"; match="$(mktemp)"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          while IFS= read -r line; do fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" == "$expected" ]] && printf '%s\n' "$line" >> "$match"; done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]; mv "$match" "$known"; chmod 0600 "$known"; rm -f "$scan"
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "user=$user" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Reproduce current 500 and read exact web exception
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" bash -s -- "$LIVE_BASE" "$TARGET_SHA" "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          live_base="${1:?}"; target_sha="${2:?}"; run_id="${3:?}"
          mapfile -t ids < <(docker ps -q --filter 'label=com.docker.compose.service=web' | sort -u)
          [[ ${#ids[@]} -eq 1 ]]
          id="${ids[0]}"
          revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$id")"
          state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")"
          echo "WEB_REVISION=$revision"
          echo "WEB_STATE=$state"
          [[ "$revision" == "$target_sha" ]]

          probe_start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          hdr="$(mktemp)"; body="$(mktemp)"
          code="$(curl -sS -L --connect-timeout 15 --max-time 60 -D "$hdr" -o "$body" -w '%{http_code}' "$live_base/downloads/prozrachnaya-tsena-presentation.pdf?diag=$run_id" || true)"
          bytes="$(stat -c%s "$body" 2>/dev/null || echo 0)"
          echo "PROBE_START=$probe_start"
          echo "PDF_HTTP=$code"
          echo "PDF_BYTES=$bytes"
          echo '--- RESPONSE HEADERS ---'
          sed -E 's/(set-cookie:).*/\1 [REDACTED]/Ig; s/(authorization:).*/\1 [REDACTED]/Ig' "$hdr" | tail -80
          echo '--- END RESPONSE HEADERS ---'
          sleep 2
          echo '--- CURRENT PRESENTATION EXCEPTION ---'
          docker logs --since "$probe_start" "$id" 2>&1 \
            | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[IP]/g; s/(token|secret|password|authorization|cookie)=?[^[:space:]]*/\1=[REDACTED]/Ig' \
            | tail -320
          echo '--- END CURRENT PRESENTATION EXCEPTION ---'
          rm -f "$hdr" "$body"
          REMOTE
