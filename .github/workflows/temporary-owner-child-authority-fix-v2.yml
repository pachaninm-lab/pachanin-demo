name: Temporary Owner Child Authority Fix V2

on:
  push:
    branches: [fix/tai-owner-child-authority-20260802]
    paths:
      - '.github/workflows/temporary-owner-child-authority-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tai-owner-child-authority-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and execute bounded patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/temporary-owner-child-authority-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n      - name: Validate modified contracts"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('bounded patch markers are missing or ambiguous')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/apply-owner-child-authority.py').write_text(dedent(body), encoding='utf-8')
          PY
          python3 /tmp/apply-owner-child-authority.py
      - name: Validate modified contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/check-production-full-stack-release.mjs
          node scripts/check-tai-reg-ru-release-chain.mjs
          set +e
          node scripts/verify-owner-command-authority.mjs >/dev/null 2>&1
          rc=$?
          set -e
          [[ "$rc" -eq 2 ]]
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          for path in [
            '.github/workflows/tai-reg-ru-preflight-owner-command.yml',
            '.github/workflows/production-full-stack-exact-sha.yml',
            '.github/workflows/tai-reg-ru-preflight.yml',
          ]:
            yaml.safe_load(Path(path).read_text(encoding='utf-8'))
          PY
      - name: Commit bounded implementation and remove temporary runners
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/temporary-owner-child-authority-fix.yml
          rm .github/workflows/temporary-owner-child-authority-fix-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tai-reg-ru-preflight-owner-command.yml \
                  .github/workflows/production-full-stack-exact-sha.yml \
                  .github/workflows/tai-reg-ru-preflight.yml \
                  scripts/verify-owner-command-authority.mjs \
                  scripts/check-production-full-stack-release.mjs \
                  scripts/check-tai-reg-ru-release-chain.mjs \
                  .github/workflows/temporary-owner-child-authority-fix.yml \
                  .github/workflows/temporary-owner-child-authority-fix-v2.yml
          git diff --cached --check
          git commit -m 'fix(release): verify owner authority across child workflows'
          git push origin HEAD:fix/tai-owner-child-authority-20260802
