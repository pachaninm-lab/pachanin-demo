name: TAI one-shot bee-wintering semantic validator repair

on:
  push:
    branches:
      - fix/tai-bee-wintering-semantic-validator-20260805
    paths:
      - .github/workflows/tai-one-shot-bee-wintering-semantic-validator.yml

permissions:
  contents: write

concurrency:
  group: tai-one-shot-bee-wintering-semantic-validator
  cancel-in-progress: false

jobs:
  patch:
    name: Apply bounded bee-wintering semantic validator repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/tai-bee-wintering-semantic-validator-20260805
          fetch-depth: 0

      - name: Verify governed baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 647e53a7a8d2acdfaae528b56968efe53e8d850f)" = "647e53a7a8d2acdfaae528b56968efe53e8d850f"
          test -f docs/platform-v7/autopilot/scopes/tai-bee-wintering-semantic-validator-20260805.json

      - name: Patch semantic factor groups and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          acceptance_path = Path('scripts/tai-potato-mobile-live-acceptance.mjs')
          acceptance = acceptance_path.read_text(encoding='utf-8')
          old = "  { id: 'bee-wintering', locale: 'ru', question: 'Как подготовить пчёл к зимовке?', subject: ['пчел'], support: ['корм', 'клещ', 'семь', 'вентиляц', 'запас'] },"
          new = """  {
            id: 'bee-wintering',
            locale: 'ru',
            question: 'Как подготовить пчёл к зимовке?',
            subject: ['пчел'],
            support: ['корм', 'клещ', 'семь', 'вентиляц', 'запас'],
            supportGroups: [
              { id: 'feed-reserves', terms: ['корм', 'мед', 'запас', 'сироп', 'сахар', 'перг'] },
              { id: 'colony-health', terms: ['клещ', 'варро', 'болезн', 'паразит', 'инфекц', 'акари', 'ноземат'] },
              { id: 'winter-microclimate', terms: ['вентиляц', 'утепл', 'влаг', 'конденсат', 'температур', 'мороз', 'ветр', 'сквозняк'] },
              { id: 'colony-strength', terms: ['матк', 'расплод', 'сила семьи', 'сильная семья', 'ослабленн', 'объединен'] },
              { id: 'hive-preparation', terms: ['леток', 'гнезд', 'рамк', 'подмор', 'мыш', 'щел', 'ремонт', 'очист'] },
            ],
          },"""
          if acceptance.count(old) != 1:
              raise SystemExit(f'expected one exact bee-wintering case anchor, found {acceptance.count(old)}')
          acceptance_path.write_text(acceptance.replace(old, new, 1), encoding='utf-8')

          test_path = Path('apps/web/tests/unit/taiPotatoRoutingRegression.test.ts')
          test_text = test_path.read_text(encoding='utf-8')
          marker = "validates bee wintering by independent semantic factor groups"
          if marker in test_text:
              raise SystemExit('bee-wintering regression contract already exists')
          closing = test_text.rfind('\n});')
          if closing < 0:
              raise SystemExit('test suite closing anchor not found')
          addition = """

            it('validates bee wintering by independent semantic factor groups', () => {
              const beeStart = acceptance.indexOf("id: 'bee-wintering'");
              const beeEnd = acceptance.indexOf("id: 'tractor-overheat'", beeStart);
              expect(beeStart).toBeGreaterThan(-1);
              expect(beeEnd).toBeGreaterThan(beeStart);
              const beeCase = acceptance.slice(beeStart, beeEnd);
              expect(beeCase).toContain("id: 'feed-reserves'");
              expect(beeCase).toContain("id: 'colony-health'");
              expect(beeCase).toContain("id: 'winter-microclimate'");
              expect(beeCase).toContain("'мед'");
              expect(beeCase).toContain("'болезн'");
              expect(beeCase).toContain("'утепл'");
            });"""
          test_path.write_text(test_text[:closing] + addition + test_text[closing:], encoding='utf-8')
          PY

          node --check scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "id: 'feed-reserves'" scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "id: 'colony-health'" scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "id: 'winter-microclimate'" scripts/tai-potato-mobile-live-acceptance.mjs
          grep -Fq "validates bee wintering by independent semantic factor groups" apps/web/tests/unit/taiPotatoRoutingRegression.test.ts

          python3 - <<'PY'
          answer = '''Подготовка пчёл к зимовке зависит от двух ключевых факторов: состояния улья и климатических условий региона. Убедитесь, что пчелы имеют достаточное количество меда. Также важно проверить, чтобы пчёлы не страдали от болезней или паразитов. В регионах с холодной зимой пчёлам нужно обеспечить утепление улья и защиту от ветра и сильных морозов.'''.lower().replace('ё', 'е')
          groups = {
              'feed-reserves': ['корм', 'мед', 'запас', 'сироп', 'сахар', 'перг'],
              'colony-health': ['клещ', 'варро', 'болезн', 'паразит', 'инфекц', 'акари', 'ноземат'],
              'winter-microclimate': ['вентиляц', 'утепл', 'влаг', 'конденсат', 'температур', 'мороз', 'ветр', 'сквозняк'],
              'colony-strength': ['матк', 'расплод', 'сила семьи', 'сильная семья', 'ослабленн', 'объединен'],
              'hive-preparation': ['леток', 'гнезд', 'рамк', 'подмор', 'мыш', 'щел', 'ремонт', 'очист'],
          }
          matched = [name for name, terms in groups.items() if any(term in answer for term in terms)]
          expected = {'feed-reserves', 'colony-health', 'winter-microclimate'}
          if len(matched) < 2 or not expected.issubset(set(matched)):
              raise SystemExit(f'production evidence must match independent groups, got {matched}')
          print('BEE_WINTERING_SEMANTIC_GROUPS=PASS', ','.join(matched))
          PY

          git diff --check

      - name: Commit repair and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tai-one-shot-bee-wintering-semantic-validator.yml
          git add \
            scripts/tai-potato-mobile-live-acceptance.mjs \
            apps/web/tests/unit/taiPotatoRoutingRegression.test.ts \
            docs/platform-v7/autopilot/scopes/tai-bee-wintering-semantic-validator-20260805.json
          git commit -m "test(tai): validate bee-wintering semantic factor groups"
          git push origin HEAD:fix/tai-bee-wintering-semantic-validator-20260805
