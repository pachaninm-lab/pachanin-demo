name: Production Full-Stack Network Alias Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-full-stack-network-alias-recovery.yml'
      - 'apps/web/tests/unit/platformV7ReleaseNetworkAliasRecovery.test.ts'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-full-stack-network-alias-recovery
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  RELEASE_ISSUE_NUMBER: '3072'
  COMMAND: /production repair-full-stack-api-alias current-main
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate fail-closed API alias recovery contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3072 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/production repair-full-stack-api-alias current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce bounded recovery surface
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/production-full-stack-network-alias-recovery.yml').read_text(encoding='utf-8')
          required=[
            "github.event.issue.number == 3072",
            "github.event.comment.body == '/production repair-full-stack-api-alias current-main'",
            'github.event.comment.performed_via_github_app.id == 1144995',
            'StrictHostKeyChecking=yes',
            'com.docker.compose.service=web',
            'com.docker.compose.service=api',
            'docker network disconnect -f',
            'STALE_API_ALIAS_DISCONNECTED',
            'API_ALIAS_UNIQUENESS=PASS',
            'PRODUCTION_MUTATION=STALE_API_NETWORK_ALIAS_DISCONNECTED',
            'AUTHORITATIVE_API_REVISION_UNCHANGED=PASS',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('missing recovery invariant: '+' | '.join(missing))
          forbidden=['docker rm','docker stop','docker kill','docker restart','docker network rm','docker compose up','docker system prune','docker container prune','docker volume rm','ALTER ROLE','UPDATE auth.','INSERT INTO','DELETE FROM']
          bad=[x for x in forbidden if x in text]
          if bad: raise SystemExit('forbidden mutation surface: '+' | '.join(bad))
          print('PASS: recovery can only detach a provably foreign stale compose-api endpoint from the authoritative API network.')
          PY

  remediate:
    name: Detach only stale foreign API alias endpoint
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/production repair-full-stack-api-alias current-main' &&
      ((github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
       github.event.comment.performed_via_github_app.id == 1144995)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse origin/main)" ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          echo "TARGET_MAIN=$target" >> "$GITHUB_ENV"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"; user="$(trim "${SSH_USER_SECRET:-}")"; port="$(trim "${SSH_PORT_SECRET:-22}")"; expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'Canonical VPS mismatch.' >&2; exit 10; }
          [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$host"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate(){ local f="$1" pub; tr -d '\r' < "$f" > "$HOME/.ssh/id_pc_prod"; chmod 600 "$HOME/.ssh/id_pc_prod"; ! grep -Eq '^(ssh-|ecdsa-|sk-)' "$HOME/.ssh/id_pc_prod" || return 1; pub="$(mktemp)"; ssh-keygen -y -P '' -f "$HOME/.ssh/id_pc_prod" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"; }
          slot(){ local r="$1" a b c; [[ -n "$r" ]] || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$r" > "$a"; validate "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${r//\\n/$'\n'}" > "$b"; validate "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$r" | base64 -d > "$c" 2>/dev/null && validate "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          slot "${SSH_KEY_PRIMARY:-}" || slot "${SSH_KEY_SECONDARY:-}" || slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"; ok=0
          for n in 1 2 3; do : > "$scan"; : > "$match"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true; while IFS= read -r line; do fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"; done < "$scan"; sort -u -o "$match" "$match"; [[ "$(grep -c . "$match" || true)" == 1 ]] && { ok=1; break; }; done
          [[ "$ok" == 1 ]]; mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$user@$host" 'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; echo SSH_AUTH_OK' | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Reconcile only duplicate foreign api alias
        id: repair
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -Eeuo pipefail
          raw="$(mktemp)"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER_SECRET@$HOST" 'bash -s' > "$raw" <<'REMOTE'
          set -Eeuo pipefail
          emit(){ printf '%s=%s\n' "$1" "$2"; }
          fail(){ emit API_ALIAS_RECOVERY FAIL; emit ERROR_CODE "$1"; emit PRODUCTION_MUTATION "${2:-NONE}"; exit "${3:-1}"; }
          [[ "$(id -u)" -eq 0 ]] || fail ROOT_REQUIRED NONE 20
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || fail WEB_AUTHORITY_AMBIGUOUS NONE 21
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          [[ "$project" =~ ^[A-Za-z0-9_.-]{1,128}$ ]] || fail PROJECT_INVALID NONE 22
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} == 1 )) || fail API_AUTHORITY_AMBIGUOUS NONE 23
          api_id="${api_ids[0]}"
          api_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")"
          [[ "$api_revision" =~ ^[0-9a-f]{40}$ ]] || fail API_REVISION_INVALID NONE 24
          mapfile -t nets < <(docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$api_id" | sed '/^$/d')
          (( ${#nets[@]} == 1 )) || fail API_NETWORK_CARDINALITY NONE 25
          net="${nets[0]}"; [[ "$net" =~ ^[A-Za-z0-9_.-]{1,128}$ ]] || fail API_NETWORK_INVALID NONE 26
          docker network inspect "$net" >/dev/null
          has_alias(){ docker inspect "$1" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; n=sys.argv[1]; print("\n".join((d.get("NetworkSettings",{}).get("Networks",{}).get(n,{}) or {}).get("Aliases") or []))' "$net" | grep -Fxq api; }
          has_alias "$api_id" || fail AUTHORITATIVE_API_ALIAS_MISSING NONE 27
          mapfile -t members < <(docker network inspect --format '{{range $id,$c := .Containers}}{{println $id}}{{end}}' "$net" | sed '/^$/d')
          collisions=()
          for id in "${members[@]}"; do [[ "$id" == "$api_id" ]] && continue; has_alias "$id" && collisions+=("$id"); done
          (( ${#collisions[@]} >= 1 )) || fail STALE_API_ALIAS_COLLISION_NOT_PRESENT NONE 28
          for id in "${collisions[@]}"; do
            svc="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$id")"; other_project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$id")"; name="$(docker inspect --format '{{.Name}}' "$id")"; name="${name#/}"
            [[ "$svc" == api ]] || fail FOREIGN_ALIAS_NOT_API_SERVICE NONE 29
            [[ "$other_project" =~ ^[A-Za-z0-9_.-]{1,128}$ && "$other_project" != "$project" ]] || fail FOREIGN_ALIAS_PROJECT_NOT_PROVABLY_STALE NONE 30
            [[ "$name" == "$other_project-api-1" || "$name" == "${other_project}_api_1" ]] || fail FOREIGN_ALIAS_NAME_NOT_COMPOSE_STALE NONE 31
          done
          for id in "${collisions[@]}"; do docker network disconnect -f "$net" "$id"; emit STALE_API_ALIAS_DISCONNECTED PASS; done
          mapfile -t members_after < <(docker network inspect --format '{{range $id,$c := .Containers}}{{println $id}}{{end}}' "$net" | sed '/^$/d')
          alias_ids=()
          for id in "${members_after[@]}"; do has_alias "$id" && alias_ids+=("$id"); done
          (( ${#alias_ids[@]} == 1 )) && [[ "${alias_ids[0]}" == "$api_id" ]] || fail API_ALIAS_STILL_AMBIGUOUS STALE_API_NETWORK_ALIAS_DISCONNECTED 32
          docker exec "$api_id" /nodejs/bin/node -e "fetch('http://127.0.0.1:3001/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" || fail AUTHORITATIVE_API_NOT_READY STALE_API_NETWORK_ALIAS_DISCONNECTED 33
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")" == "$api_revision" ]] || fail AUTHORITATIVE_API_REVISION_CHANGED STALE_API_NETWORK_ALIAS_DISCONNECTED 34
          emit API_ALIAS_UNIQUENESS PASS
          emit AUTHORITATIVE_API_REVISION_UNCHANGED PASS
          emit API_REVISION "$api_revision"
          emit API_ALIAS_RECOVERY PASS
          emit PRODUCTION_MUTATION STALE_API_NETWORK_ALIAS_DISCONNECTED
          REMOTE
          grep -Fxq 'API_ALIAS_RECOVERY=PASS' "$raw"
          grep -Fxq 'API_ALIAS_UNIQUENESS=PASS' "$raw"
          grep -Fxq 'AUTHORITATIVE_API_REVISION_UNCHANGED=PASS' "$raw"
          api_revision="$(sed -n 's/^API_REVISION=//p' "$raw" | tail -1)"; [[ "$api_revision" =~ ^[0-9a-f]{40}$ ]]
          echo "api_revision=$api_revision" >> "$GITHUB_OUTPUT"
          sed -nE '/^(API_ALIAS_RECOVERY|STALE_API_ALIAS_DISCONNECTED|API_ALIAS_UNIQUENESS|AUTHORITATIVE_API_REVISION_UNCHANGED|PRODUCTION_MUTATION)=/p' "$raw"
          rm -f "$raw"

      - name: Verify public API route still resolves to authoritative revision
        env:
          EXPECTED_API_REVISION: ${{ steps.repair.outputs.api_revision }}
        shell: bash
        run: |
          set -Eeuo pipefail
          matched=0
          for attempt in 1 2 3; do
            headers="$(mktemp)"; body="$(mktemp)"
            http="$(curl --fail-with-body --silent --show-error --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$LIVE_BASE/api/health" || true)"
            sha="$(awk 'BEGIN{IGNORECASE=1} /^x-build-sha:/{gsub(/\r/,"",$2); print $2}' "$headers" | tail -1)"
            rm -f "$headers" "$body"
            if [[ "$http" == 200 && "$sha" == "$EXPECTED_API_REVISION" ]]; then matched=1; break; fi
          done
          (( matched == 1 ))
          echo 'PUBLIC_API_ALIAS_AUTHORITY=PASS'
