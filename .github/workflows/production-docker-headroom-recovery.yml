  resolve:
    name: Bind immutable owner event and current main
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.body == '/production reclaim-docker current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Verify exact owner command and immutable event
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/production-docker-headroom-recovery.yml@refs/heads/main" ]]
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.login)"
          [[ "$COMMENTER" == "$owner" && "$GITHUB_ACTOR" == "$owner" && "$TRIGGERING_ACTOR" == "$owner" ]]
          [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .user.login)" == "$owner" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .author_association)" == OWNER ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body)" == '/production reclaim-docker current-main' ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]
          echo OWNER_IMMUTABLE_EVENT_PROVENANCE=PASS

  reclaim:
    name: Reclaim only attested unused canonical images
    needs: [contract, resolve]
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' && needs.resolve.result == 'success' &&
      github.event.issue.number == 4637 &&
      github.event.comment.body == '/production reclaim-docker current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize conservative transport receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/target-sha.txt"
          python3 - <<'PY_UNKNOWN'
          import json,os,pathlib
          p=pathlib.Path(os.environ['EVIDENCE_DIR'])/'result.json'
          v={'schemaVersion':'pc.production-docker-headroom-transport.v1','targetSha':os.environ['GITHUB_SHA'],
             'runId':int(os.environ['GITHUB_RUN_ID']),'status':'UNKNOWN','hostReport':'NOT_ADMITTED','productionAcceptance':False}
          p.write_text(json.dumps(v,sort_keys=True,separators=(',',':'))+'\n');p.chmod(0o600)
          PY_UNKNOWN
      - name: Refuse stale event or source before private transport
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/production-docker-headroom-recovery.yml@refs/heads/main" ]]
          git fetch --no-tags origin main >/dev/null 2>/dev/null
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=no)" ]]
          echo IMMUTABLE_SOURCE_CURRENT_MAIN=PASS
      - name: Resolve protected key and pinned canonical host
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          timeout --signal=TERM --kill-after=2s 15s getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          key="$RUNNER_TEMP/headroom-live-key"; known="$RUNNER_TEMP/headroom-live-known"
          scan="$RUNNER_TEMP/headroom-live-scan"; match="$RUNNER_TEMP/headroom-live-match"
          trap 'rm -f -- "$scan" "$match"' EXIT
          validate_key(){
            local src="$1" pub="$RUNNER_TEMP/headroom-live-pub"
            tr -d '\r' < "$src" > "$key"; chmod 0600 "$key"
            if grep -Eq '^(ssh-|ecdsa-|sk-)' "$key"; then return 1; fi
            if ! ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null; then rm -f -- "$pub"; return 1; fi
            rm -f -- "$pub"
          }
          try_key(){
            local raw="$1" a="$RUNNER_TEMP/headroom-live-slot-a" b="$RUNNER_TEMP/headroom-live-slot-b" c="$RUNNER_TEMP/headroom-live-slot-c"
            [[ -n "$raw" ]] || return 1
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f -- "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f -- "$a" "$b" "$c"; return 0; }
            if printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c"; then rm -f -- "$a" "$b" "$c"; return 0; fi
            rm -f -- "$a" "$b" "$c"; return 1
          }
          try_key "${SSH_KEY_PRIMARY:-}" || try_key "${SSH_KEY_SECONDARY:-}" || try_key "${SSH_KEY_FALLBACK:-}"
          pinned=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            timeout --signal=TERM --kill-after=2s 15s ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned=1; break; fi
          done
          [[ "$pinned" == 1 ]]
          mv -- "$match" "$known"; chmod 0600 "$known"
          echo SSH_PINNED_IDENTITY_READY=PASS
      - name: Execute one bounded owner operation and validate closed result
        id: recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git fetch --no-tags origin main >/dev/null 2>/dev/null
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" && "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]
          # The prewritten UNKNOWN remains authoritative until transport, source and closed result all reconcile.
          raw="$RUNNER_TEMP/headroom-live-untrusted.json"
          trap 'rm -f -- "$raw"' EXIT
          host="${SSH_HOST_SECRET:-$DEFAULT_HOST}"; user="$SSH_USER_SECRET"; port="${SSH_PORT_SECRET:-22}"
          [[ "$host" == "$DEFAULT_HOST" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ && "$port" =~ ^[0-9]+$ ]]
          export HEADROOM_RAW="$raw"
          remote_deadline=$(( $(date +%s) + 255 ))
          hold_remote_deadline(){ while (( $(date +%s) < remote_deadline )); do sleep 1; done; }
          status=0
          (
            ulimit -f 64
            timeout --signal=TERM --kill-after=15s 240s ssh -i "$RUNNER_TEMP/headroom-live-key" -p "$port" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/headroom-live-known" -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "$user@$host" \
              "timeout --signal=TERM --kill-after=10s 210s /bin/bash -s -- '$GITHUB_SHA' '$GITHUB_RUN_ID'" \
              < scripts/production-docker-headroom-recovery.sh > "$raw" 2>/dev/null
          ) || status=$?
          source_ok=1
          git fetch --no-tags origin main >/dev/null 2>/dev/null || source_ok=0
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || source_ok=0
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" && "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || source_ok=0
          if (( source_ok != 1 )); then hold_remote_deadline; exit 1; fi
          admitted=0
          python3 - "$raw" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$status" "$EVIDENCE_DIR/result.json" <<'PY_HOST_RESULT' || admitted=$?
          def validate_host_result(raw, target, run_id, ssh_status):
              import json,re
              def require(value):
                  if not value:
                      raise ValueError('PRIVATE_HOST_RESULT_NOT_ADMITTED')
              def pairs(items):
                  value={}
                  for key,item in items:
                      require(key not in value)
                      value[key]=item
                  return value
              def nonfinite(value):
                  raise ValueError('PRIVATE_HOST_RESULT_NOT_ADMITTED')
              require(type(raw) is bytes and 0<len(raw)<=16384)
              require(type(target) is str and re.fullmatch('[0-9a-f]{40}',target) is not None)
              require(type(run_id) is int and 0<run_id<2**63)
              require(type(ssh_status) is int and ssh_status in (0,1,2))
              value=json.loads(raw.decode('utf-8',errors='strict'),object_pairs_hook=pairs,parse_constant=nonfinite)
              keys={'schemaVersion','targetSha','runId','mode','deleteAuthority','reclaimComponents','reclaimNamespaces',
                    'rollbackImagesPerComponentPerNamespace','requiredAvailableKb','targetAvailableKb',
                    'beforeAvailableKb','afterAvailableKb','canonicalImageCount','eligibleImageCount',
                    'containerProtectedImageCount','protectedImageCount','attemptedImageCount','removedReferenceCount',
                    'deletedImageCount','skippedImageCount','reclaimedBytes','targetReached','passed','status','failure',
                    'journal','runtimeIdentityUnchanged','objectSetsUnchanged','productionAcceptance'}
              require(type(value) is dict and set(value)==keys)
              exact={'schemaVersion':'pc.production-docker-headroom-recovery.v2','targetSha':target,'runId':run_id,
                     'mode':'BOUNDED_UNUSED_CANONICAL_IMAGE_RECLAIM','deleteAuthority':'CANONICAL_REFERENCE_OR_FULL_IMAGE_ID_NO_FORCE',
                     'reclaimComponents':['api','migration','web'],
                     'reclaimNamespaces':['EXACT_SHA_TRANSFER_ALIAS','REGISTRY_CANONICAL'],
                     'rollbackImagesPerComponentPerNamespace':2,'requiredAvailableKb':5242880,'targetAvailableKb':6291456,
                     'productionAcceptance':False}
              for key,expected in exact.items():
                  require(type(value[key]) is type(expected) and value[key]==expected)
              for key in ('beforeAvailableKb','afterAvailableKb'):
                  require(value[key] is None or type(value[key]) is int and 0<=value[key]<2**53)
              counts=('canonicalImageCount','eligibleImageCount','containerProtectedImageCount','protectedImageCount',
                      'attemptedImageCount','removedReferenceCount','deletedImageCount','skippedImageCount')
              require(all(type(value[key]) is int and 0<=value[key]<=65536 for key in counts))
              require(value['canonicalImageCount']<=512 and value['eligibleImageCount']<=value['canonicalImageCount'])
              require(value['containerProtectedImageCount']<=128 and value['protectedImageCount']<=512)
              require(value['protectedImageCount']>=value['containerProtectedImageCount'])
              # Protected includes every referenced image, including unclassified images.
              # Canonical records partition into eligible and canonical-protected; only
              # referenced foreign images can add protected IDs outside that partition.
              classified=value['canonicalImageCount']; eligible=value['eligibleImageCount']
              protected=value['protectedImageCount']; referenced=value['containerProtectedImageCount']
              require(classified<=eligible+protected<=classified+referenced)
              require(value['attemptedImageCount']<=value['eligibleImageCount'] and value['deletedImageCount']<=value['attemptedImageCount'])
              require(type(value['reclaimedBytes']) is int and 0<=value['reclaimedBytes']<2**63)
              for key in ('targetReached','passed','runtimeIdentityUnchanged','objectSetsUnchanged'):
                  require(type(value[key]) is bool)
              statuses={'VERIFIED_HEADROOM_ONLY':0,'INSUFFICIENT_HEADROOM':2,'REFUSED':1,'UNKNOWN':1}
              require(type(value['status']) is str and statuses.get(value['status'])==ssh_status)
              failures={'INVALID_INPUT','ROOT_REQUIRED','DEADLINE','COMMAND_LIMIT','OUTPUT_LIMIT','COMMAND_FAILED',
                        'COMMAND_NOT_PROVEN','METADATA_NOT_PROVEN','INVENTORY_LIMIT','RUNTIME_NOT_PROVEN',
                        'RUNTIME_CHANGED','IMAGE_CHANGED','RESERVE_CHANGED','STORAGE_NOT_PROVEN',
                        'JOURNAL_NOT_PROVEN','OPERATION_ALREADY_EXISTS','REMOVE_NOT_PROVEN','INTERNAL_NOT_PROVEN'}
              require(value['failure'] is None or type(value['failure']) is str and value['failure'] in failures)
              require(value['journal'] in ('NOT_CREATED','UNKNOWN','TERMINAL_RECEIPT_DURABLE'))
              terminal=value['status'] in ('VERIFIED_HEADROOM_ONLY','INSUFFICIENT_HEADROOM')
              if terminal:
                  require(value['beforeAvailableKb'] is not None and value['afterAvailableKb'] is not None)
                  require(value['failure'] is None and value['runtimeIdentityUnchanged'] and value['objectSetsUnchanged'])
                  # The actual engine completes each attempted image or emits UNKNOWN.
                  # Its fixed-purpose journal exists only after an attempted removal.
                  require(value['attemptedImageCount']==value['deletedImageCount'])
                  require(value['skippedImageCount']==0)
                  require(value['journal']==('TERMINAL_RECEIPT_DURABLE' if value['attemptedImageCount'] else 'NOT_CREATED'))
                  require(value['deletedImageCount']<=value['removedReferenceCount']<=128*value['deletedImageCount'])
                  require(value['passed'] is (value['afterAvailableKb']>=value['requiredAvailableKb']))
                  require(value['targetReached'] is (value['afterAvailableKb']>=value['targetAvailableKb']))
                  require(value['reclaimedBytes']==max(0,value['afterAvailableKb']-value['beforeAvailableKb'])*1024)
                  require(value['passed'] is (value['status']=='VERIFIED_HEADROOM_ONLY'))
                  if value['removedReferenceCount'] or value['deletedImageCount']:
                      require(value['journal']=='TERMINAL_RECEIPT_DURABLE')
              else:
                  require(value['failure'] is not None and not value['passed'] and not value['targetReached'])
                  require(not value['runtimeIdentityUnchanged'] and not value['objectSetsUnchanged'])
                  require(value['journal']==('UNKNOWN' if value['status']=='UNKNOWN' else 'NOT_CREATED'))
              return value

          def finalize_host_receipt(raw_path,target,run_id,ssh_status,destination):
              import hashlib,json,os,pathlib
              with pathlib.Path(raw_path).open('rb') as handle:raw=handle.read(16385)
              value=validate_host_result(raw,target,run_id,ssh_status)
              destination=pathlib.Path(destination);pending=destination.with_suffix('.pending')
              payload=(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode()
              with pending.open('xb') as handle:
                  os.fchmod(handle.fileno(),0o600);handle.write(payload);handle.flush();os.fsync(handle.fileno())
              os.replace(pending,destination)
              fd=os.open(destination.parent,os.O_RDONLY|os.O_DIRECTORY)
              try:os.fsync(fd)
              finally:os.close(fd)
              actual=destination.read_bytes()
              if actual!=payload:raise ValueError('PRIVATE_HOST_RESULT_NOT_ADMITTED')
              digest=hashlib.sha256(actual).hexdigest()
              # These independent step outputs exist only after all receipt barriers.
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
                  output.write('receipt_sha256='+digest+'\nactual_transport_status='+str(ssh_status)+'\nreceipt_admitted=true\n')
                  output.flush()
              return value

          def preserve_transport_unknown(destination,target,run_id):
              import json,pathlib
              value={'schemaVersion':'pc.production-docker-headroom-transport.v1','targetSha':target,'runId':run_id,
                     'status':'UNKNOWN','hostReport':'NOT_ADMITTED','productionAcceptance':False}
              path=pathlib.Path(destination)
              path.write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n');path.chmod(0o600)

          if __name__=='__main__':
              import sys
              try:
                  value=finalize_host_receipt(sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4]),sys.argv[5])
                  print('MARK_VALIDATED_HOST_RESULT='+value['status'])
              except Exception:
                  try:preserve_transport_unknown(sys.argv[5],sys.argv[2],int(sys.argv[3]))
                  except Exception:pass
                  raise SystemExit('PRIVATE_HOST_RESULT_NOT_ADMITTED') from None
          PY_HOST_RESULT
          if (( admitted != 0 )); then hold_remote_deadline; exit 1; fi
          if (( status != 0 )); then hold_remote_deadline; exit 1; fi
      - name: Erase runner-only private transport files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- "$RUNNER_TEMP/headroom-live-key" "$RUNNER_TEMP/headroom-live-known" \
            "$RUNNER_TEMP/headroom-live-scan" "$RUNNER_TEMP/headroom-live-match" "$RUNNER_TEMP/headroom-live-pub" \
            "$RUNNER_TEMP/headroom-live-slot-a" "$RUNNER_TEMP/headroom-live-slot-b" "$RUNNER_TEMP/headroom-live-slot-c" \
            "$RUNNER_TEMP/headroom-live-untrusted.json"
      - name: Publish allowlisted aggregate operation receipt
        id: publication
        if: always()
        env:
          RECEIPT_ADMITTED: ${{ steps.recovery.outputs.receipt_admitted }}
          RECEIPT_SHA256: ${{ steps.recovery.outputs.receipt_sha256 }}
          ACTUAL_TRANSPORT_STATUS: ${{ steps.recovery.outputs.actual_transport_status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_PUBLIC_RECEIPT'
          def validate_host_result(raw, target, run_id, ssh_status):
              import json,re
              def require(value):
                  if not value:
                      raise ValueError('PRIVATE_HOST_RESULT_NOT_ADMITTED')
              def pairs(items):
                  value={}
                  for key,item in items:
                      require(key not in value)
                      value[key]=item
                  return value
              def nonfinite(value):
                  raise ValueError('PRIVATE_HOST_RESULT_NOT_ADMITTED')
              require(type(raw) is bytes and 0<len(raw)<=16384)
              require(type(target) is str and re.fullmatch('[0-9a-f]{40}',target) is not None)
              require(type(run_id) is int and 0<run_id<2**63)
              require(type(ssh_status) is int and ssh_status in (0,1,2))
              value=json.loads(raw.decode('utf-8',errors='strict'),object_pairs_hook=pairs,parse_constant=nonfinite)
              keys={'schemaVersion','targetSha','runId','mode','deleteAuthority','reclaimComponents','reclaimNamespaces',
                    'rollbackImagesPerComponentPerNamespace','requiredAvailableKb','targetAvailableKb',
                    'beforeAvailableKb','afterAvailableKb','canonicalImageCount','eligibleImageCount',
                    'containerProtectedImageCount','protectedImageCount','attemptedImageCount','removedReferenceCount',
                    'deletedImageCount','skippedImageCount','reclaimedBytes','targetReached','passed','status','failure',
                    'journal','runtimeIdentityUnchanged','objectSetsUnchanged','productionAcceptance'}
              require(type(value) is dict and set(value)==keys)
              exact={'schemaVersion':'pc.production-docker-headroom-recovery.v2','targetSha':target,'runId':run_id,
                     'mode':'BOUNDED_UNUSED_CANONICAL_IMAGE_RECLAIM','deleteAuthority':'CANONICAL_REFERENCE_OR_FULL_IMAGE_ID_NO_FORCE',
                     'reclaimComponents':['api','migration','web'],
                     'reclaimNamespaces':['EXACT_SHA_TRANSFER_ALIAS','REGISTRY_CANONICAL'],
                     'rollbackImagesPerComponentPerNamespace':2,'requiredAvailableKb':5242880,'targetAvailableKb':6291456,
                     'productionAcceptance':False}
              for key,expected in exact.items():
                  require(type(value[key]) is type(expected) and value[key]==expected)
              for key in ('beforeAvailableKb','afterAvailableKb'):
                  require(value[key] is None or type(value[key]) is int and 0<=value[key]<2**53)
              counts=('canonicalImageCount','eligibleImageCount','containerProtectedImageCount','protectedImageCount',
                      'attemptedImageCount','removedReferenceCount','deletedImageCount','skippedImageCount')
              require(all(type(value[key]) is int and 0<=value[key]<=65536 for key in counts))
              require(value['canonicalImageCount']<=512 and value['eligibleImageCount']<=value['canonicalImageCount'])
              require(value['containerProtectedImageCount']<=128 and value['protectedImageCount']<=512)
              require(value['protectedImageCount']>=value['containerProtectedImageCount'])
              # Protected includes every referenced image, including unclassified images.
              # Canonical records partition into eligible and canonical-protected; only
              # referenced foreign images can add protected IDs outside that partition.
              classified=value['canonicalImageCount']; eligible=value['eligibleImageCount']
              protected=value['protectedImageCount']; referenced=value['containerProtectedImageCount']
              require(classified<=eligible+protected<=classified+referenced)
              require(value['attemptedImageCount']<=value['eligibleImageCount'] and value['deletedImageCount']<=value['attemptedImageCount'])
              require(type(value['reclaimedBytes']) is int and 0<=value['reclaimedBytes']<2**63)
              for key in ('targetReached','passed','runtimeIdentityUnchanged','objectSetsUnchanged'):
                  require(type(value[key]) is bool)
              statuses={'VERIFIED_HEADROOM_ONLY':0,'INSUFFICIENT_HEADROOM':2,'REFUSED':1,'UNKNOWN':1}
              require(type(value['status']) is str and statuses.get(value['status'])==ssh_status)
              failures={'INVALID_INPUT','ROOT_REQUIRED','DEADLINE','COMMAND_LIMIT','OUTPUT_LIMIT','COMMAND_FAILED',
                        'COMMAND_NOT_PROVEN','METADATA_NOT_PROVEN','INVENTORY_LIMIT','RUNTIME_NOT_PROVEN',
                        'RUNTIME_CHANGED','IMAGE_CHANGED','RESERVE_CHANGED','STORAGE_NOT_PROVEN',
                        'JOURNAL_NOT_PROVEN','OPERATION_ALREADY_EXISTS','REMOVE_NOT_PROVEN','INTERNAL_NOT_PROVEN'}
              require(value['failure'] is None or type(value['failure']) is str and value['failure'] in failures)
              require(value['journal'] in ('NOT_CREATED','UNKNOWN','TERMINAL_RECEIPT_DURABLE'))
              terminal=value['status'] in ('VERIFIED_HEADROOM_ONLY','INSUFFICIENT_HEADROOM')
              if terminal:
                  require(value['beforeAvailableKb'] is not None and value['afterAvailableKb'] is not None)
                  require(value['failure'] is None and value['runtimeIdentityUnchanged'] and value['objectSetsUnchanged'])
                  # The actual engine completes each attempted image or emits UNKNOWN.
                  # Its fixed-purpose journal exists only after an attempted removal.
                  require(value['attemptedImageCount']==value['deletedImageCount'])
                  require(value['skippedImageCount']==0)
                  require(value['journal']==('TERMINAL_RECEIPT_DURABLE' if value['attemptedImageCount'] else 'NOT_CREATED'))
                  require(value['deletedImageCount']<=value['removedReferenceCount']<=128*value['deletedImageCount'])
                  require(value['passed'] is (value['afterAvailableKb']>=value['requiredAvailableKb']))
                  require(value['targetReached'] is (value['afterAvailableKb']>=value['targetAvailableKb']))
                  require(value['reclaimedBytes']==max(0,value['afterAvailableKb']-value['beforeAvailableKb'])*1024)
                  require(value['passed'] is (value['status']=='VERIFIED_HEADROOM_ONLY'))
                  if value['removedReferenceCount'] or value['deletedImageCount']:
                      require(value['journal']=='TERMINAL_RECEIPT_DURABLE')
              else:
                  require(value['failure'] is not None and not value['passed'] and not value['targetReached'])
                  require(not value['runtimeIdentityUnchanged'] and not value['objectSetsUnchanged'])
                  require(value['journal']==('UNKNOWN' if value['status']=='UNKNOWN' else 'NOT_CREATED'))
              return value
          import hashlib,json,os,pathlib,re
          root=pathlib.Path(os.environ['EVIDENCE_DIR']);root.mkdir(mode=0o700,parents=True,exist_ok=True)
          target=os.environ['GITHUB_SHA'];run_id=os.environ['GITHUB_RUN_ID']
          assert re.fullmatch('[0-9a-f]{40}',target) and re.fullmatch('[1-9][0-9]{0,19}',run_id)
          fallback={'schemaVersion':'pc.production-docker-headroom-transport.v1','targetSha':target,'runId':int(run_id),
                    'status':'UNKNOWN','hostReport':'NOT_ADMITTED','productionAcceptance':False}
          value=fallback
          try:
              assert os.environ.get('RECEIPT_ADMITTED')=='true'
              digest=os.environ.get('RECEIPT_SHA256','');status=os.environ.get('ACTUAL_TRANSPORT_STATUS','')
              assert re.fullmatch('[0-9a-f]{64}',digest) and re.fullmatch('[012]',status)
              with (root/'result.json').open('rb') as handle:raw=handle.read(16385)
              assert 0<len(raw)<=16384 and hashlib.sha256(raw).hexdigest()==digest
              value=validate_host_result(raw,target,int(run_id),int(status))
          except Exception:
              value=fallback
          payload=(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode()
          with (root/'result.json').open('wb') as handle:
              handle.write(payload);handle.flush();os.fsync(handle.fileno())
          (root/'result.json').chmod(0o600)
          text='## Bounded live image headroom observation\n\n'
          text+='- exact target: `'+target+'`\n'
          text+='- run: `'+run_id+'`\n'
          text+='- result: `'+value['status']+'`\n'
          text+='- backup restore and registration: `NOT_PROVEN`\n'
          text+='- production acceptance: `false`\n'
          for name,content in (('target-sha.txt',target+'\n'),('issue-record.md',text)):
              with (root/name).open('w',encoding='utf-8') as handle:
                  handle.write(content);handle.flush();os.fsync(handle.fileno())
          fd=os.open(root,os.O_RDONLY|os.O_DIRECTORY)
          try:os.fsync(fd)
          finally:os.close(fd)
          # No safe persistent artifact is uploaded unless this final publication fence passes.
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('artifacts_ready=true\n');output.flush()

          PY_PUBLIC_RECEIPT
          gh issue comment "$RECOVERY_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/issue-record.md" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.publication.outputs.artifacts_ready == 'true' }}
        env:
          GH_TOKEN: ''
          SSH_HOST_SECRET: ''
          SSH_USER_SECRET: ''
          SSH_PORT_SECRET: ''
          SSH_KEY_PRIMARY: ''
          SSH_KEY_SECONDARY: ''
          SSH_KEY_FALLBACK: ''
          SSH_HOST_FINGERPRINT_SECRET: ''
        with:
          name: production-docker-headroom-recovery-${{ github.run_id }}
          path: |
            artifacts/production-docker-headroom-recovery/target-sha.txt
            artifacts/production-docker-headroom-recovery/issue-record.md
            artifacts/production-docker-headroom-recovery/result.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
