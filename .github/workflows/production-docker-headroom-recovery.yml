name: Production Docker Headroom Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/production-docker-headroom-recovery.yml'
      - 'scripts/production-docker-headroom-recovery.sh'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-hosted-docker-headroom-recovery-3785.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-full-stack-exact-sha
  cancel-in-progress: false
  queue: max

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  RECOVERY_ISSUE_NUMBER: 4637
  EVIDENCE_DIR: artifacts/production-docker-headroom-recovery

jobs:
  contract:
    name: Validate bounded recovery contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 4637 &&
       github.event.comment.body == '/production reclaim-docker current-main' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate shell, immutable scope and secret isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/production-docker-headroom-recovery.sh
          python3 - <<'PY_CONTRACT'
          import ast,json,pathlib,re
          workflow=pathlib.Path('.github/workflows/production-docker-headroom-recovery.yml').read_text()
          script=pathlib.Path('scripts/production-docker-headroom-recovery.sh').read_text()
          scope=json.loads(pathlib.Path('docs/platform-v7/autopilot/scopes/pc-crop-hosted-docker-headroom-recovery-3785.json').read_text())
          pr=workflow.split('\n  contract:\n',1)[1].split('\n  resolve:\n',1)[0]
          global_scope=workflow.split('\njobs:\n',1)[0]
          secret_marker='secrets'+'.'
          assert secret_marker not in global_scope
          assert secret_marker not in pr
          issues_write='issues'+': write'
          assert issues_write not in global_scope and issues_write not in pr
          assert "group: production-full-stack-exact-sha" in global_scope and 'queue: max' in global_scope
          assert scope['branch']=='fix/pc-crop-docker-headroom-rollover-4637'
          assert scope['authorityContinuationIssue']==4637 and scope['issue']==3785 and scope['evidenceIssue']==3072
          assert scope['registrationMatrixIssue']==3785 and scope['newRecurringCostRub']==0
          for required in ['GITHUB_WORKFLOW_SHA', 'StrictHostKeyChecking=yes', 'BatchMode=yes',
                           'timeout --signal=TERM --kill-after=10s 210s', 'timeout --signal=TERM --kill-after=15s 240s',
                           'github.event.comment.author_association', 'PRIVATE_HOST_RESULT_NOT_ADMITTED',
                           'MARK_VALIDATED_HOST_RESULT', 'target-sha.txt', 'issue-record.md', 'result.json']:
              assert required in workflow, required
          for forbidden in ['s'+'cp -', 'recovery'+'.log', '2>'+'&1', 'ref: '+'main', 'github.event.repository.'+'default_branch']:
              assert forbidden not in workflow, forbidden
          for pattern in [r'docker\s+(?:system|image|builder)\s+prune',r'docker\s+(?:container|volume|network)\s+(?:rm|prune)',
                          r'StrictHostKeyChecking=no',r'sshpass',r'SSH_PASSWORD']:
              assert not re.search(pattern,script,re.I), pattern
          lines=workflow.splitlines();run_sizes=[]
          for index,line in enumerate(lines):
              if line=='        run: |':
                  content=[]
                  for item in lines[index+1:]:
                      if item.strip() and not item.startswith('          '):break
                      content.append(item[10:] if item.startswith('          ') else '')
                  assert ('$'+'{{') not in '\n'.join(content), 'ACTIONS_EXPRESSION_IN_RUN_BODY'
                  run_sizes.append(len('\n'.join(content)+'\n'))
          assert run_sizes and all(size<=21000 for size in run_sizes),run_sizes
          payload=script.split("<<'PY_RECLAIM'\n",1)[1].split('\nPY_RECLAIM\n',1)[0]
          ast.parse(payload)
          assert 'pc.production-docker-headroom-recovery.v2' in payload
          assert 'live-headroom-20261030' in payload
          assert '--no-prune' in payload
          assert "[:2]" in payload
          print('RECOVERY_CONTRACT=PASS')
          PY_CONTRACT
      - name: Prepare headroom-engine fixture part 1
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cat > "$RUNNER_TEMP/headroom-engine.py" <<'PY_FIXTURE_PART'
