name: Production Docker Headroom Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/production-docker-headroom-recovery.yml'
      - 'scripts/production-docker-headroom-recovery.sh'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-hosted-docker-headroom-recovery-3785.json'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  # Serialize this storage mutation with the exact-SHA production rollout.
  group: production-full-stack-exact-sha
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  RECOVERY_ISSUE_NUMBER: 4637
  EVIDENCE_DIR: artifacts/production-docker-headroom-recovery
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate bounded recovery contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 4637 &&
       github.event.comment.body == '/production reclaim-docker current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate shell and recovery boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/production-docker-headroom-recovery.sh
          python3 - <<'PY'
          import json
          import pathlib
          import re

          workflow = pathlib.Path('.github/workflows/production-docker-headroom-recovery.yml').read_text(encoding='utf-8')
          script = pathlib.Path('scripts/production-docker-headroom-recovery.sh').read_text(encoding='utf-8')
          scope = json.loads(pathlib.Path('docs/platform-v7/autopilot/scopes/pc-crop-hosted-docker-headroom-recovery-3785.json').read_text(encoding='utf-8'))
          required_workflow = [
              "github.event.issue.number == 4637",
              "github.event.comment.body == '/production reclaim-docker current-main'",
              'github.event.comment.user.login',
              'github.repository_owner',
              'PC_PROD_SSH_HOST_FINGERPRINT',
              'StrictHostKeyChecking=yes',
              'BatchMode=yes',
              'scripts/production-docker-headroom-recovery.sh',
              'CONTAINERD_STORAGE_FILESYSTEM_SHARED=1',
              'RUNTIME_CONTAINER_IDENTITY_UNCHANGED=1',
              'DOCKER_OBJECT_COUNTS_UNCHANGED=1',
              'echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"',
              'mkdir -p "$EVIDENCE_DIR"',
          ]
          required_script = [
              'REQUIRED_KB=$((5 * 1024 * 1024))',
              'TARGET_KB=$((6 * 1024 * 1024))',
              "docker info --format '{{.DockerRootDir}}'",
              "stat -c '%d' /var/lib/containerd",
              "docker', 'ps', '-aq', '--no-trunc'",
              "grainflow-(api|web|migration|tai)",
              "revision == target_sha",
              "[:2]",
              "docker', 'image', 'rm'",
              "'rm', '--no-prune', ref",
              "'rm', '--no-prune', record['id']",
              'BOUNDED_UNUSED_CANONICAL_IMAGE_RECLAIM',
              'DOCKER_HEADROOM_RECOVERY=',
          ]
          for needle in required_workflow:
              if needle not in workflow:
                  raise SystemExit(f'missing workflow boundary: {needle}')
          for needle in required_script:
              if needle not in script:
                  raise SystemExit(f'missing recovery boundary: {needle}')
          cross_job_target = 'needs.resolve.outputs.' + 'target_sha'
          if cross_job_target in workflow:
              raise SystemExit('cross-job target SHA output is forbidden because GitHub secret masking can redact ordinary SHAs')
          forbidden = [
              r'docker\s+system\s+prune',
              r'docker\s+image\s+prune',
              r'docker\s+builder\s+prune',
              r'docker\s+(?:container|volume|network)\s+(?:rm|prune)',
              r'docker[^\n]*\brm\s+-f\b',
              r'StrictHostKeyChecking' + r'=no',
              r'ssh' + r'pass',
              r'SSH_' + r'PASSWORD',
          ]
          combined = workflow + '\n' + script
          for pattern in forbidden:
              if re.search(pattern, combined, re.I):
                  raise SystemExit(f'forbidden recovery capability: {pattern}')
          if scope.get('branch') != 'fix/pc-crop-docker-headroom-rollover-4637':
              raise SystemExit('scope branch mismatch')
          if scope.get('issue') != 3785 or scope.get('evidenceIssue') != 3072:
              raise SystemExit('historical authority binding mismatch')
          if scope.get('authorityContinuationIssue') != 4637 or scope.get('registrationMatrixIssue') != 3785:
              raise SystemExit('continuation authority mismatch')
          if scope.get('newRecurringCostRub') != 0:
              raise SystemExit('scope recurring cost mismatch')
          print('PASS: bounded hosted recovery preserves running/stopped container images, exact-main images, two newest canonical rollback images, and forbids broad prune/delete capabilities.')
          PY

      - name: Prove actual bounded reclaim positive and negative scenarios
        shell: bash
        run: |
          python3 - <<'PY_RECLAIM_TEST'
          import ast
          import copy
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile
          import unittest
          from unittest.mock import patch
          
          SOURCE = pathlib.Path('scripts/production-docker-headroom-recovery.sh').read_text()
          PAYLOAD = SOURCE.split("<<'PY_RECLAIM'\n", 1)[1].split('\nPY_RECLAIM\n', 1)[0]
          TARGET = 'f' * 40
          GIB_KB = 1024 * 1024
          
          
          def image(component, generation, namespace='transfer', revision=None):
              revision = revision or hashlib.sha1(f'{component}-{namespace}-{generation}'.encode()).hexdigest()
              image_id = 'sha256:' + hashlib.sha256(f'{component}-{namespace}-{generation}'.encode()).hexdigest()
              prefix = f'pc-crop-transfer/{component}' if namespace == 'transfer' else f'ghcr.io/pachaninm-lab/grainflow-{component}'
              return {
                  'Id': image_id, 'Size': 1024 * 1024,
                  'Created': f'2026-09-{generation:02d}T00:00:00.000000000Z',
                  'RepoTags': [f'{prefix}:{revision}'],
                  'RepoDigests': [f'{prefix}@{image_id}'],
                  'Config': {'Labels': {'org.opencontainers.image.revision': revision}},
              }
          
          
          class DockerFixture:
              def __init__(self, items=None, free=0, gain=6 * GIB_KB, all_become_used=False, changed_refs=False, changed_ref_target=False, removal_error=False, retain_unreferenced=False, parent_chain=False):
                  items = items or [image(c, g, n) for c in ('api', 'web', 'migration') for n in ('transfer', 'canonical') for g in (1, 2, 3)]
                  self.images = {i['Id']: copy.deepcopy(i) for i in items}
                  self.parent_links = {}
                  self.unattested_parents = ()
                  if parent_chain:
                      child = image('web', 1)['Id']
                      parent_ids = tuple('sha256:' + hashlib.sha256(f'unproven-parent-{n}'.encode()).hexdigest() for n in (1, 2))
                      for parent_id in parent_ids:
                          self.images[parent_id] = {'Id': parent_id, 'Size': 0, 'Created': '2026-08-01T00:00:00Z',
                                                    'RepoTags': [], 'RepoDigests': [], 'Config': {'Labels': None}}
                      self.parent_links = {child: parent_ids[0], parent_ids[0]: parent_ids[1]}
                      self.unattested_parents = parent_ids
                  self.before = copy.deepcopy(self.images)
                  self.containers = {}
                  self.free = free
                  self.gain = gain
                  self.all_become_used = all_become_used
                  self.changed_refs = changed_refs
                  self.changed_ref_target = changed_ref_target
                  self.removal_error = removal_error
                  self.retain_unreferenced = retain_unreferenced
                  self.ps_calls = 0
                  self.ls_done = False
                  self.removed_refs = []
                  self.deleted = []
                  self.all_commands = []
          
              def resolve(self, ref):
                  if ref in self.images:
                      return self.images[ref]
                  return next((x for x in self.images.values() if ref in (x.get('RepoTags') or []) + (x.get('RepoDigests') or [])), None)
          
              def run(self, argv, **kwargs):
                  self.all_commands.append(argv)
                  assert kwargs['stdout'] == subprocess.PIPE and kwargs['stderr'] == subprocess.PIPE
                  stdout, stderr, rc = '', '', 0
                  if argv[:2] == ['df', '-Pk']:
                      stdout = f'Filesystem 1024-blocks Used Available Capacity Mounted on\n/dev/test 99999999 100 {self.free} 100% /test\n'
                  elif argv == ['docker', 'ps', '-aq', '--no-trunc']:
                      self.ps_calls += 1
                      if self.all_become_used and self.ps_calls > 1:
                          self.containers = {f'container-{i}': k for i, k in enumerate(self.images)}
                      stdout = '\n'.join(self.containers)
                  elif argv[:2] == ['docker', 'inspect']:
                      stdout = json.dumps([{'Image': self.containers[argv[2]]}])
                  elif argv == ['docker', 'image', 'ls', '-q', '--no-trunc']:
                      self.ls_done = True
                      stdout = '\n'.join(self.images)
                  elif argv[:3] == ['docker', 'image', 'inspect']:
                      ref = argv[3]
                      row = self.resolve(ref)
                      if self.changed_refs and self.ps_calls > 1 and row:
                          row['RepoTags'] = ['third-party/unapproved:latest']
                      if self.changed_ref_target and not ref.startswith('sha256:') and self.ps_calls > 1 and row:
                          row = {**row, 'Id': 'sha256:' + 'e' * 64}
                      if row:
                          stdout = json.dumps([row])
                      else:
                          rc, stderr = 1, 'No such image'
                  elif argv[:3] == ['docker', 'image', 'rm']:
                      arguments = argv[3:]
                      no_prune = arguments[:1] == ['--no-prune']
                      ref = arguments[-1]
                      assert arguments == (['--no-prune', ref] if no_prune else [ref]) and not ref.startswith('-'), argv
                      row = self.resolve(ref)
                      if self.removal_error:
                          rc, stderr = 1, 'no space left on device'
                      elif row is None:
                          rc, stderr = 1, 'No such image'
                      else:
                          assert row['Id'] not in self.containers.values(), 'referenced image removal attempted'
                          self.removed_refs.append(ref)
                          for key in ('RepoTags', 'RepoDigests'):
                              row[key] = [r for r in (row.get(key) or []) if r != ref]
                          if ref == row['Id'] or not self.retain_unreferenced and not row['RepoTags'] + row['RepoDigests']:
                              self.deleted.append(row['Id'])
                              del self.images[row['Id']]
                              self.free += self.gain
                              # Model Docker's documented automatic deletion of untagged parents.
                              parent_id = self.parent_links.get(row['Id'])
                              while not no_prune and parent_id in self.images:
                                  parent = self.images[parent_id]
                                  if parent_id in self.containers.values() or parent['RepoTags'] or parent['RepoDigests']:
                                      break
                                  self.deleted.append(parent_id)
                                  del self.images[parent_id]
                                  parent_id = self.parent_links.get(parent_id)
                  else:
                      raise AssertionError(f'unexpected capability: {argv}')
                  return subprocess.CompletedProcess(argv, rc, stdout, stderr)
          
          
          def execute(fixture):
              with tempfile.TemporaryDirectory() as tmp:
                  report = pathlib.Path(tmp) / 'report.json'
                  argv = ['reclaim', TARGET, '123', str(report), str(5 * GIB_KB), str(6 * GIB_KB), '/test']
                  code = 0
                  with patch.object(sys, 'argv', argv), patch.object(subprocess, 'run', fixture.run):
                      try:
                          exec(compile(PAYLOAD, '<actual recovery payload>', 'exec'), {})
                      except SystemExit as e:
                          code = e.code
                  return code, json.loads(report.read_text())
          
          
          class RecoveryTests(unittest.TestCase):
              def test_proven_transfer_tag_then_digest_removes_object(self):
                  f = DockerFixture([image('web', g) for g in (1, 2, 3)])
                  code, report = execute(f)
                  self.assertEqual(code, 0)
                  self.assertEqual(report['removedReferenceCount'], 2)
                  self.assertEqual(report['deletedImageCount'], 1)
                  self.assertNotIn(image('web', 1)['Id'], f.images)
                  self.assertIn(image('web', 2)['Id'], f.images)
                  self.assertIn(image('web', 3)['Id'], f.images)
          
              def test_attested_orphan_removed_only_by_exact_id(self):
                  f = DockerFixture([image('web', g) for g in (1, 2, 3)], retain_unreferenced=True)
                  code, report = execute(f)
                  self.assertEqual(code, 0)
                  self.assertEqual(report['removedReferenceCount'], 2)
                  self.assertEqual(report['deletedImageCount'], 1)
                  self.assertEqual(f.removed_refs[-1], image('web', 1)['Id'])
          
              def assert_unattested_parent_chain_survives(self, retain_unreferenced):
                  f = DockerFixture([image('web', g) for g in (1, 2, 3)],
                                    retain_unreferenced=retain_unreferenced, parent_chain=True)
                  code, report = execute(f)
                  self.assertEqual(code, 0)
                  self.assertTrue(report['passed'])
                  self.assertEqual(report['eligibleImageCount'], 1)
                  self.assertEqual(report['deletedImageCount'], 1)
                  self.assertEqual(f.deleted, [image('web', 1)['Id']])
                  for parent_id in f.unattested_parents:
                      self.assertEqual(f.images.get(parent_id), f.before[parent_id])
                  self.assertIn(image('web', 2)['Id'], f.images)
                  self.assertIn(image('web', 3)['Id'], f.images)
                  if retain_unreferenced:
                      self.assertEqual(f.removed_refs[-1], image('web', 1)['Id'])
                  else:
                      self.assertFalse(f.removed_refs[-1].startswith('sha256:'))
          
              def test_reference_removal_preserves_unattested_parent_chain(self):
                  self.assert_unattested_parent_chain_survives(retain_unreferenced=False)
          
              def test_immutable_id_removal_preserves_unattested_parent_chain(self):
                  self.assert_unattested_parent_chain_survives(retain_unreferenced=True)
          
              def test_actual_payload_stops_at_target_and_preserves_both_reserves(self):
                  f = DockerFixture()
                  code, report = execute(f)
                  self.assertEqual(code, 0)
                  self.assertEqual(report['deletedImageCount'], 1)
                  self.assertEqual(report['afterAvailableKb'], 6 * GIB_KB)
                  self.assertTrue(report['passed'])
                  self.assertEqual(report['eligibleImageCount'], 6)
                  for c in ('api', 'web', 'migration'):
                      for n in ('canonical', 'transfer'):
                          for g in (2, 3):
                              self.assertIn(image(c, g, n)['Id'], f.images)
          
              def test_no_removal_when_capacity_already_sufficient(self):
                  f = DockerFixture(free=6 * GIB_KB)
                  _, report = execute(f)
                  self.assertEqual(f.removed_refs, [])
                  self.assertEqual(report['attemptedImageCount'], 0)
          
              def test_running_and_stopped_container_images_are_protected(self):
                  f = DockerFixture()
                  for n in ('canonical', 'transfer'):
                      for c in ('api', 'web', 'migration'):
                          f.containers[f'{n}-{c}-stopped'] = image(c, 1, n)['Id']
                  code, report = execute(f)
                  self.assertEqual(code, 91)
                  self.assertEqual(report['eligibleImageCount'], 0)
                  self.assertEqual(f.removed_refs, [])
          
              def test_new_container_reference_before_removal_fails_closed(self):
                  f = DockerFixture(all_become_used=True)
                  code, report = execute(f)
                  self.assertEqual(code, 91)
                  self.assertEqual(f.removed_refs, [])
                  self.assertEqual(report['removeFailureCounts']['CONTAINER_REFERENCE'], 6)
          
              def test_changed_reference_namespace_fails_closed(self):
                  f = DockerFixture(changed_refs=True)
                  code, report = execute(f)
                  self.assertEqual(code, 91)
                  self.assertEqual(f.removed_refs, [])
                  self.assertEqual(report['removeFailureCounts']['UNEXPECTED_REFERENCE_STATE'], 6)
          
              def test_reference_now_resolves_to_different_image_fails_closed(self):
                  f = DockerFixture(changed_ref_target=True)
                  code, report = execute(f)
                  self.assertEqual(code, 91)
                  self.assertEqual(f.removed_refs, [])
                  self.assertEqual(report['removeFailureCounts']['UNEXPECTED_REFERENCE_STATE'], 6)
          
              def test_docker_removal_failure_has_no_false_capacity_pass(self):
                  f = DockerFixture(removal_error=True)
                  code, report = execute(f)
                  self.assertEqual(code, 91)
                  self.assertFalse(report['passed'])
                  self.assertEqual(report['deletedImageCount'], 0)
                  self.assertEqual(report['afterAvailableKb'], 0)
                  self.assertEqual(report['removeFailureCounts']['NO_SPACE'], 6)
          
              def test_exact_main_revision_is_protected(self):
                  items = [image('web', g) for g in (1, 2, 3)]
                  items[0] = image('web', 1, revision=TARGET)
                  f = DockerFixture(items)
                  code, report = execute(f)
                  self.assertEqual(code, 91)
                  self.assertEqual(report['eligibleImageCount'], 0)
                  self.assertEqual(f.removed_refs, [])
          
              def test_new_registry_import_cannot_displace_transfer_rollback(self):
                  items = [image('web', g, n) for n, generations in [('canonical', (1, 5, 6)), ('transfer', (1, 2, 3))] for g in generations]
                  f = DockerFixture(items)
                  _, report = execute(f)
                  self.assertEqual(report['eligibleImageCount'], 2)
                  self.assertIn(image('web', 2)['Id'], f.images)
                  self.assertIn(image('web', 3)['Id'], f.images)
                  self.assertIn(image('web', 5, 'canonical')['Id'], f.images)
                  self.assertIn(image('web', 6, 'canonical')['Id'], f.images)
          
              def test_container_environment_never_enters_report(self):
                  f = DockerFixture()
                  for row in f.images.values():
                      row['Config']['Env'] = ['SECRET=CUSTOMER_ENV_SENTINEL']
                  _, report = execute(f)
                  self.assertNotIn('CUSTOMER_ENV_SENTINEL', json.dumps(report))
          
              def test_invalid_image_identity_fails_before_any_removal(self):
                  f = DockerFixture()
                  next(iter(f.images.values()))['Id'] = 'sha256:' + 'e' * 64
                  with self.assertRaisesRegex(RuntimeError, 'image_inspect_id_mismatch'):
                      execute(f)
                  self.assertEqual(f.removed_refs, [])
          
              def test_classifier_positive_and_negative_cases_from_actual_source(self):
                  module = ast.parse(PAYLOAD)
                  constants = {'canonical_tag', 'canonical_digest', 'transfer_tag', 'transfer_digest', 'revision_re', 'image_id_re', 'reclaim_components'}
                  functions = {'image_refs', 'ref_component', 'classify_release_image'}
                  nodes = [n for n in module.body if isinstance(n, (ast.Import, ast.ImportFrom)) or isinstance(n, ast.FunctionDef) and n.name in functions or isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id in constants for t in n.targets)]
                  ns = {}
                  exec(compile(ast.Module(body=nodes, type_ignores=[]), '<actual classifier>', 'exec'), ns)
                  classify = ns['classify_release_image']
                  positive = image('web', 1)
                  self.assertIsNotNone(classify(positive, require_tag=False))
                  digest_only = image('web', 1, 'canonical')
                  digest_only['RepoTags'] = []
                  self.assertIsNotNone(classify(digest_only, require_tag=False))
                  cases = []
                  for component in ('tai', 'outbox-worker'):
                      cases.extend([image(component, 1, 'canonical'), image(component, 1)])
                  for config in (None, {}, {'Labels': None}, {'Labels': {}}, {'Labels': {'org.opencontainers.image.revision': 'unknown'}}, {'Labels': {'org.opencontainers.image.revision': 'a' * 39}}):
                      cases.append({**positive, 'Config': config})
                  cases.extend([
                      {**positive, 'RepoTags': []},
                      {**positive, 'RepoTags': None},
                      {**positive, 'RepoTags': ['pc-crop-transfer/web:latest']},
                      {**positive, 'RepoTags': ['pc-crop-transfer/web:' + 'd' * 40]},
                      {**positive, 'RepoTags': [1]},
                      {**positive, 'RepoDigests': ['pc-crop-transfer/api@sha256:' + 'b' * 64]},
                      {**positive, 'RepoDigests': ['third-party/web@sha256:' + 'b' * 64]},
                      {**positive, 'RepoDigests': ['ghcr.io/pachaninm-lab/grainflow-web@sha256:' + 'b' * 64]},
                      {**positive, 'RepoTags': positive['RepoTags'] + ['third-party/unapproved:latest']},
                      {**positive, 'RepoTags': positive['RepoTags'] + ['pc-crop-transfer/api:' + positive['Config']['Labels']['org.opencontainers.image.revision']]},
                  ])
                  for i, row in enumerate(cases):
                      with self.subTest(case=i):
                          self.assertIsNone(classify(row, require_tag=False))
                  print(f'CLASSIFIER_NEGATIVE_CASES={len(cases)}')
          
          
          if __name__ == '__main__':
              unittest.main()
          PY_RECLAIM_TEST

  resolve:
    name: Resolve owner-authorized exact current main
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.body == '/production reclaim-docker current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce repository-owner command authority
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$COMMENTER" == "$OWNER" ]]
          [[ "$ACTOR" == "$OWNER" ]]
          [[ "$TRIGGERING_ACTOR" == "$OWNER" ]]
      - name: Resolve exact current main authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          target_sha="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          echo 'Current-main authority resolved without cross-job SHA output.'

  reclaim:
    name: Reclaim only unused canonical production images
    needs: [contract, resolve]
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bind and revalidate exact current main inside reclaim job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git fetch --no-tags origin main
          target_sha="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_sha" == "$(git rev-parse origin/main)" ]]
          git checkout --detach "$target_sha"
          [[ "$(git rev-parse HEAD)" == "$target_sha" ]]
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          printf '%s\n' "$target_sha" > "$EVIDENCE_DIR/target-sha.txt"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'Canonical VPS mismatch.' >&2; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo 'Protected production principal is missing or invalid.' >&2; exit 11; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Pinned host fingerprint is required.' >&2; exit 13; }
          domain_ips="$(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u || true)"
          grep -Fxq "$DEFAULT_HOST" <<< "$domain_ips"
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            ssh-keygen -lf "$pub" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo 'No valid protected SSH private key is configured.' >&2
            exit 14
          }

          scan="$(mktemp)"; match="$(mktemp)"
          pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo 'Pinned host key mismatch after bounded retries.' >&2; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER_SECRET@$host" \
            'set -Eeuo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Copy bounded recovery script
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/production-docker-headroom-recovery.sh \
            "$SSH_USER_SECRET@$HOST:/tmp/pc-docker-headroom-${GITHUB_RUN_ID}.sh"

      - name: Execute bounded recovery and prove runtime immutability
        id: recovery
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          raw="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "set -Eeuo pipefail
            script='/tmp/pc-docker-headroom-${GITHUB_RUN_ID}.sh'
            chmod 0700 \"\$script\"
            mapfile -t api_ids < <(docker ps -q --filter 'label=com.docker.compose.service=api')
            mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
            (( \${#api_ids[@]} == 1 && \${#web_ids[@]} == 1 ))
            before_api_id=\"\${api_ids[0]}\"; before_web_id=\"\${web_ids[0]}\"
            before_api_revision=\"\$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' \"\$before_api_id\")\"
            before_web_revision=\"\$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' \"\$before_web_id\")\"
            before_containers=\"\$(docker ps -aq | wc -l | tr -d '[:space:]')\"
            before_volumes=\"\$(docker volume ls -q | wc -l | tr -d '[:space:]')\"
            before_networks=\"\$(docker network ls -q | wc -l | tr -d '[:space:]')\"
            \"\$script\" '$TARGET_SHA' '$GITHUB_RUN_ID'
            after_api_id=\"\$(docker ps -q --filter 'label=com.docker.compose.service=api')\"
            after_web_id=\"\$(docker ps -q --filter 'label=com.docker.compose.service=web')\"
            [[ \"\$after_api_id\" == \"\$before_api_id\" && \"\$after_web_id\" == \"\$before_web_id\" ]]
            after_api_revision=\"\$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' \"\$after_api_id\")\"
            after_web_revision=\"\$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' \"\$after_web_id\")\"
            [[ \"\$after_api_revision\" == \"\$before_api_revision\" && \"\$after_web_revision\" == \"\$before_web_revision\" ]]
            after_containers=\"\$(docker ps -aq | wc -l | tr -d '[:space:]')\"
            after_volumes=\"\$(docker volume ls -q | wc -l | tr -d '[:space:]')\"
            after_networks=\"\$(docker network ls -q | wc -l | tr -d '[:space:]')\"
            [[ \"\$after_containers\" == \"\$before_containers\" && \"\$after_volumes\" == \"\$before_volumes\" && \"\$after_networks\" == \"\$before_networks\" ]]
            printf 'RUNTIME_CONTAINER_IDENTITY_UNCHANGED=1\\n'
            printf 'RUNTIME_REVISIONS_UNCHANGED=1\\n'
            printf 'BASELINE_API_REVISION=%s\\n' \"\$after_api_revision\"
            printf 'BASELINE_WEB_REVISION=%s\\n' \"\$after_web_revision\"
            printf 'DOCKER_OBJECT_COUNTS_UNCHANGED=1\\n'" > "$raw" 2>&1
          rc=$?
          set -e
          sed -E 's#postgres(ql)?://[^[:space:]@]+@#postgresql://[REDACTED]@#g; /(_PATH|_DIR|COMPOSE|CONFIG_FILES)=/ s#=.*#=[REDACTED]#' "$raw" > "$EVIDENCE_DIR/recovery.log"
          rm -f "$raw"
          cat "$EVIDENCE_DIR/recovery.log"
          (( rc == 0 )) || exit "$rc"
          grep -Fxq 'DOCKER_HEADROOM_RECOVERY=PASS' "$EVIDENCE_DIR/recovery.log"
          grep -Fxq 'CONTAINERD_STORAGE_FILESYSTEM_SHARED=1' "$EVIDENCE_DIR/recovery.log"
          grep -Fxq 'RUNTIME_CONTAINER_IDENTITY_UNCHANGED=1' "$EVIDENCE_DIR/recovery.log"
          grep -Fxq 'RUNTIME_REVISIONS_UNCHANGED=1' "$EVIDENCE_DIR/recovery.log"
          grep -Fxq 'DOCKER_OBJECT_COUNTS_UNCHANGED=1' "$EVIDENCE_DIR/recovery.log"
          after="$(sed -n 's/^DOCKER_HEADROOM_AFTER_KB=//p' "$EVIDENCE_DIR/recovery.log" | tail -1)"
          [[ "$after" =~ ^[0-9]+$ && "$after" -ge $((5 * 1024 * 1024)) ]]
          echo "after_kb=$after" >> "$GITHUB_OUTPUT"

      - name: Cleanup protected transport
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${HOST:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
              "rm -f '/tmp/pc-docker-headroom-${GITHUB_RUN_ID}.sh'" || true
          fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Publish bounded recovery evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          AFTER_KB: ${{ steps.recovery.outputs.after_kb }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          status=FAIL_CLOSED
          [[ "$RECOVERY_OUTCOME" != success ]] || status=PASS
          after="${AFTER_KB:-unknown}"
          target="${TARGET_SHA:-unresolved}"
          {
            echo "## Production Docker headroom recovery run \`$GITHUB_RUN_ID\`"
            echo
            echo "- target SHA: \`$target\`"
            echo "- result: \`$status\`"
            echo "- available after (KiB): \`$after\`"
            echo "- policy: bounded unused canonical images only"
            echo "- running API/web containers and revisions: unchanged when PASS"
            echo "- containers/volumes/networks: unchanged when PASS"
            echo "- production application/database/customer-data mutation: none"
          } > "$EVIDENCE_DIR/issue-record.md"
          gh issue comment "$RECOVERY_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/issue-record.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-docker-headroom-recovery-${{ github.run_id }}
          path: artifacts/production-docker-headroom-recovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
