name: Apply TAI deploy internal stage evidence v2

on:
  push:
    branches:
      - fix/tai-deploy-internal-stage-evidence-v2-20260802
    paths:
      - scripts/apply-tai-deploy-internal-stage-evidence.py
      - docs/platform-v7/autopilot/scopes/tai-deploy-internal-stage-evidence-20260802.json
      - .github/workflows/apply-tai-deploy-internal-stage-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tai-deploy-internal-stage-evidence-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/tai-deploy-internal-stage-evidence-v2-20260802
          fetch-depth: 0

      - name: Capture exact authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main fix/tai-deploy-internal-stage-evidence-v2-20260802
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"

      - name: Apply and verify bounded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-tai-deploy-internal-stage-evidence.py
          bash -n scripts/tai-reg-ru-deploy.sh
          node scripts/check-tai-reg-ru-deploy.mjs
          node scripts/check-pc-tai-release-controller.mjs
          node scripts/check-tai-reg-ru-release-chain.mjs
          git diff --check
          grep -Fq 'set_internal_deploy_stage TAI_DEPLOY_EXACT_MAIN_CONVERGENCE_FAILED' scripts/tai-reg-ru-deploy.sh
          grep -Fq 'set_internal_deploy_stage TAI_DEPLOY_POSTGRES_AUTHORITY_RESOLUTION_FAILED' scripts/tai-reg-ru-deploy.sh
          grep -Fq 'set_internal_deploy_stage TAI_DEPLOY_MIGRATIONS_FAILED' scripts/tai-reg-ru-deploy.sh
          grep -Fq 'set_internal_deploy_stage TAI_DEPLOY_RUNTIME_HEALTHCHECK_FAILED' scripts/tai-reg-ru-deploy.sh
          grep -Fq 'set_internal_deploy_stage TAI_DEPLOY_GROUNDED_INFERENCE_PROOF_FAILED' scripts/tai-reg-ru-deploy.sh
          ! grep -Eq 'publish_file .*deploy-stage-error|runner-output/.+deploy-stage-error' scripts/tai-reg-ru-deploy.sh scripts/pc-tai-release-controller-core.sh

      - name: Publish reviewed source changes only
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main fix/tai-deploy-internal-stage-evidence-v2-20260802
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/fix/tai-deploy-internal-stage-evidence-v2-20260802)" = "$EXPECTED_HEAD"
          rm -f scripts/apply-tai-deploy-internal-stage-evidence.py
          rm -f .github/workflows/apply-tai-deploy-internal-stage-evidence.yml
          git add -A
          git diff --cached --name-only | sort | tee /tmp/tai-deploy-stage-files.txt
          if grep -Ev '^([.]github/workflows/apply-tai-deploy-internal-stage-evidence[.]yml|docs/platform-v7/autopilot/scopes/tai-deploy-internal-stage-evidence-20260802[.]json|scripts/apply-tai-deploy-internal-stage-evidence[.]py|scripts/check-tai-reg-ru-deploy[.]mjs|scripts/tai-reg-ru-deploy[.]sh)$' /tmp/tai-deploy-stage-files.txt; then
            echo 'Final diff exceeds registered internal-stage evidence scope.' >&2
            exit 31
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(tai): materialize exact internal deploy stages'
          git push --force-with-lease="refs/heads/fix/tai-deploy-internal-stage-evidence-v2-20260802:${EXPECTED_HEAD}" \
            origin HEAD:refs/heads/fix/tai-deploy-internal-stage-evidence-v2-20260802
