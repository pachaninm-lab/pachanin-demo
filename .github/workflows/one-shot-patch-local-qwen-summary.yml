name: One-shot patch Local Qwen canonical summary

on:
  push:
    branches:
      - ops/patch-local-qwen-summary-20260910

permissions:
  contents: write

jobs:
  patch-provider-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout disposable helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact provider patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cp scripts/one-shot-patch-local-qwen-summary.sh "$RUNNER_TEMP/patch-provider.sh"
          bash "$RUNNER_TEMP/patch-provider.sh"
