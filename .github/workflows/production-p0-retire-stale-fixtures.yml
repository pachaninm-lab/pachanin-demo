name: Production P0 Retire Stale Acceptance Fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-retire-stale-fixtures.yml'
      - 'scripts/production-p0-retire-stale-fixtures.cjs'
      - 'scripts/production-p0-retire-stale-fixtures-remote.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && github.event.issue.number == 4637 && github.event.comment.body == '/production p0-retire-stale-fixtures current-main' && 'pc-crop-registration-lifecycle' || 'production-p0-retire-stale-fixtures-contract' }}
  cancel-in-progress: false
  queue: max

env:
  AUTHORITY_ISSUE: '4637'
  EXPECTED_PRODUCTION_SHA: fd33ce36ed4c2b39f23aafda050863045cb04299
  MAINTENANCE_BASE_SHA: d8e86a668a7b60ad2bf95925f84a994eb166ba3c
  LIVE_HOST: '195.19.12.120'
  WORKFLOW_PATH: .github/workflows/production-p0-retire-stale-fixtures.yml
  RUNNER_PATH: scripts/production-p0-retire-stale-fixtures.cjs
  REMOTE_PATH: scripts/production-p0-retire-stale-fixtures-remote.sh
  STALE_SECONDS: '1800'

jobs:
  contract:
    name: Validate bounded stale-fixture retirement contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Validate immutable PR-head maintenance sources
        shell: bash
        run: |
          set -euo pipefail
          workflow="$RUNNER_TEMP/workflow.yml"
          runner="$RUNNER_TEMP/retire.cjs"
          remote="$RUNNER_TEMP/retire-remote.sh"
          gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 --decode > "$workflow"
          gh api "repos/$GITHUB_REPOSITORY/contents/$RUNNER_PATH?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 --decode > "$runner"
          gh api "repos/$GITHUB_REPOSITORY/contents/$REMOTE_PATH?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 --decode > "$remote"
          node --check "$runner"
          bash -n "$remote"
          for marker in \
            "github.event.issue.number == 4637" \
            "github.event.comment.user.login == github.repository_owner" \
            "github.event.comment.author_association == 'OWNER'" \
            "github.actor == github.repository_owner" \
            "github.triggering_actor == github.repository_owner" \
            "github.event.comment.body == '/production p0-retire-stale-fixtures current-main'" \
            "EXPECTED_PRODUCTION_SHA: fd33ce36ed4c2b39f23aafda050863045cb04299" \
            "MAINTENANCE_BASE_SHA: d8e86a668a7b60ad2bf95925f84a994eb166ba3c" \
            "ACTIVE_REGISTRATION_ACCEPTANCE"; do
            grep -Fq "$marker" "$workflow"
          done
          for marker in \
            "Production P0 exact-run organization" \
            "p0-all-role-register:" \
            "status = 'CANCELLED'" \
            "P0_ACCEPTANCE_FIXTURE_RETIRED" \
            "auth.registration_application_events" \
            "auth.audit_events" \
            "CANDIDATE_ACTIVE_SESSION_PRESENT" \
            "MAINTENANCE_DATABASE_PRIVILEGES_INSUFFICIENT" \
            "P0_RETIRE_DATABASE_URL" \
            "LIMIT 257"; do
            grep -Fq "$marker" "$runner"
          done
          for marker in \
            "docker compose" \
            "MIGRATION_DATABASE_AUTHORITY_UNAVAILABLE" \
            "DATABASE_TARGET_PARITY_FAILED" \
            "P0_RETIRE_BOUNDED_MAINTENANCE=1" \
            "P0_REMOTE_DB_AUTHORITY=PASS"; do
            grep -Fq "$marker" "$remote"
          done
          ! grep -Eiq '\bDELETE[[:space:]]+FROM[[:space:]]+(auth|public)\.' "$runner" "$remote"
          ! grep -Fq 'registration_platform_actor_authorized' "$runner" "$remote"
          ! grep -Fq 'apply_registration_identity_transition' "$runner" "$remote"
          echo 'PASS: bounded owner-only retirement uses the actual live SHA and migration DB authority without reviewer bypass.'

  retire:
    name: Retire stale exact-run fixtures on REG.RU
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-retire-stale-fixtures current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - name: Prove live lineage, bounded source drift and no active acceptance
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]]
          live_lineage="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_PRODUCTION_SHA...$MAINTENANCE_BASE_SHA" --jq .status)"
          [[ "$live_lineage" == ahead || "$live_lineage" == identical ]]
          compare="$RUNNER_TEMP/maintenance-compare.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$MAINTENANCE_BASE_SHA...$current" > "$compare"
          source_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8")).get("status",""))' "$compare")"
          [[ "$source_status" == ahead || "$source_status" == identical ]]
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8")); allowed=set(sys.argv[2:]); changed={str(x.get("filename","")) for x in r.get("files",[])}; extra=changed-allowed; raise SystemExit("MAIN_CONTAINS_NON_MAINTENANCE_DRIFT" if extra else 0)' "$compare" "$WORKFLOW_PATH" "$RUNNER_PATH" "$REMOTE_PATH"
          for state in in_progress queued; do
            active="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$state&per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/production-p0-all-role-registration.yml" or .path == ".github/workflows/production-p0-first-customer-acceptance.yml")] | length')"
            [[ "$active" == 0 ]] || { echo 'P0_RETIRE_BLOCKER=ACTIVE_REGISTRATION_ACCEPTANCE'; exit 21; }
          done
          runner="$RUNNER_TEMP/retire.cjs"
          remote="$RUNNER_TEMP/retire-remote.sh"
          gh api "repos/$GITHUB_REPOSITORY/contents/$RUNNER_PATH?ref=$current" --jq .content | tr -d '\n' | base64 --decode > "$runner"
          gh api "repos/$GITHUB_REPOSITORY/contents/$REMOTE_PATH?ref=$current" --jq .content | tr -d '\n' | base64 --decode > "$remote"
          node --check "$runner"
          bash -n "$remote"
          chmod 0600 "$runner" "$remote"
          echo "main_sha=$current" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "remote=$remote" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned production SSH identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/p0-retire-key"
          known_hosts="$RUNNER_TEMP/p0-retire-known-hosts"
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          host="$(trim "${SSH_HOST_SECRET:-}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$LIVE_HOST" ]]
          [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          validate_key() {
            local source="$1" pub
            tr -d '\r' < "$source" > "$key_path"
            chmod 0600 "$key_path"
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$key_path" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_key() {
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"
            return 1
          }
          try_key "${SSH_KEY_PRIMARY:-}" || try_key "${SSH_KEY_SECONDARY:-}" || try_key "${SSH_KEY_FALLBACK:-}"
          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$known_hosts"; rm -f "$scan"; chmod 0600 "$known_hosts"
          echo "key=$key_path" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Copy bounded maintenance controllers to REG.RU
        id: copy
        shell: bash
        env:
          KEY_PATH: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
          LOCAL_RUNNER: ${{ steps.scope.outputs.runner }}
          LOCAL_REMOTE: ${{ steps.scope.outputs.remote }}
        run: |
          set -euo pipefail
          remote_runner="/tmp/p0-retire-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.cjs"
          remote_controller="/tmp/p0-retire-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -q -i "$KEY_PATH" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$LOCAL_RUNNER" "$SSH_USER@$SSH_HOST:$remote_runner"
          scp -q -i "$KEY_PATH" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$LOCAL_REMOTE" "$SSH_USER@$SSH_HOST:$remote_controller"
          echo "remote_runner=$remote_runner" >> "$GITHUB_OUTPUT"
          echo "remote_controller=$remote_controller" >> "$GITHUB_OUTPUT"

      - name: Retire only stale all-role fixtures with canonical event and audit evidence
        shell: bash
        env:
          KEY_PATH: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
          REMOTE_RUNNER: ${{ steps.copy.outputs.remote_runner }}
          REMOTE_CONTROLLER: ${{ steps.copy.outputs.remote_controller }}
        run: |
          set -euo pipefail
          cleanup_correlation="p0-fixture-retire:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          remote_output="$(ssh -i "$KEY_PATH" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$SSH_USER@$SSH_HOST" "bash '$REMOTE_CONTROLLER' '$EXPECTED_PRODUCTION_SHA' '$STALE_SECONDS' '$cleanup_correlation' '$REMOTE_RUNNER'" 2>/dev/null)"
          remote_rc=$?
          set -e
          safe_output="$(printf '%s\n' "$remote_output" | grep -E '^P0_(RETIRE_(RESULT|BLOCKER|RETIRED|REMAINING|EVENT_EVIDENCE|AUDIT_EVIDENCE|RAW_IDENTIFIERS|NON_MARKER_MUTATIONS)|REMOTE_(PRODUCTION_SHA|DB_AUTHORITY))=' || true)"
          printf '%s\n' "$safe_output"
          if (( remote_rc != 0 )); then
            blocker="$(sed -n 's/^P0_RETIRE_BLOCKER=//p' <<< "$safe_output" | tail -1)"
            [[ "$blocker" =~ ^[A-Z0-9_]{4,96}$ ]] || blocker=REMOTE_RETIRE_FAILED_CLOSED
            body="$RUNNER_TEMP/retire-fail.md"
            printf '%s\n' '## Production P0 stale fixture retirement' '' '- result: `FAIL`' "- expected live production SHA: \`$EXPECTED_PRODUCTION_SHA\`" "- blocker: \`$blocker\`" '- physical deletes: `0`' '- raw identifiers or credentials published: `0`' > "$body"
            gh issue comment "$AUTHORITY_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$body" >/dev/null
            exit "$remote_rc"
          fi
          for marker in P0_RETIRE_RESULT=PASS P0_RETIRE_REMAINING=0 P0_RETIRE_RAW_IDENTIFIERS=0 P0_RETIRE_NON_MARKER_MUTATIONS=0 P0_REMOTE_PRODUCTION_SHA=PASS P0_REMOTE_DB_AUTHORITY=PASS; do
            grep -Fxq "$marker" <<< "$safe_output"
          done
          retired="$(sed -n 's/^P0_RETIRE_RETIRED=//p' <<< "$safe_output" | tail -1)"
          events="$(sed -n 's/^P0_RETIRE_EVENT_EVIDENCE=//p' <<< "$safe_output" | tail -1)"
          audits="$(sed -n 's/^P0_RETIRE_AUDIT_EVIDENCE=//p' <<< "$safe_output" | tail -1)"
          [[ "$retired" =~ ^[0-9]{1,3}$ && "$events" == "$retired" && "$audits" == "$retired" ]]
          body="$RUNNER_TEMP/retire-pass.md"
          printf '%s\n' '## Production P0 stale fixture retirement' '' '- result: `PASS`' "- live production SHA: \`$EXPECTED_PRODUCTION_SHA\`" "- retired stale exact-run NEW_ORGANIZATION fixtures: \`$retired\`" '- remaining stale marked reviewer-queue rows: `0`' "- lifecycle event evidence: \`$events\`" "- chained auth audit evidence: \`$audits\`" '- migration DB authority target parity: `PASS`' '- non-marker mutations: `0`' '- physical deletes: `0`' '- raw identifiers or credentials published: `0`' > "$body"
          gh issue comment "$AUTHORITY_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$body" >/dev/null

      - name: Remove protected local SSH material
        if: always()
        shell: bash
        env:
          KEY_PATH: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        run: rm -f -- "${KEY_PATH:-}" "${KNOWN_HOSTS:-}"
