name: Production P0 Retire Stale Acceptance Fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-retire-stale-fixtures.yml'
      - 'scripts/production-p0-retire-stale-fixtures.cjs'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && github.event.issue.number == 4637 && github.event.comment.body == '/production p0-retire-stale-fixtures current-main' && 'pc-crop-registration-lifecycle' || 'production-p0-retire-stale-fixtures-contract' }}
  cancel-in-progress: false
  queue: max

env:
  AUTHORITY_ISSUE: '4637'
  EXPECTED_PRODUCTION_SHA: d8e86a668a7b60ad2bf95925f84a994eb166ba3c
  LIVE_HOST: '195.19.12.120'
  WORKFLOW_PATH: .github/workflows/production-p0-retire-stale-fixtures.yml
  RUNNER_PATH: scripts/production-p0-retire-stale-fixtures.cjs
  STALE_SECONDS: '1800'

jobs:
  contract:
    name: Validate bounded stale-fixture retirement contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Validate immutable PR-head maintenance sources
        shell: bash
        run: |
          set -euo pipefail
          workflow="$RUNNER_TEMP/workflow.yml"
          runner="$RUNNER_TEMP/retire.cjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 --decode > "$workflow"
          gh api "repos/$GITHUB_REPOSITORY/contents/$RUNNER_PATH?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 --decode > "$runner"
          node --check "$runner"
          for marker in \
            "github.event.issue.number == 4637" \
            "github.event.comment.user.login == github.repository_owner" \
            "github.event.comment.author_association == 'OWNER'" \
            "github.actor == github.repository_owner" \
            "github.triggering_actor == github.repository_owner" \
            "github.event.comment.body == '/production p0-retire-stale-fixtures current-main'" \
            "EXPECTED_PRODUCTION_SHA: d8e86a668a7b60ad2bf95925f84a994eb166ba3c" \
            "ACTIVE_REGISTRATION_ACCEPTANCE"; do
            grep -Fq "$marker" "$workflow"
          done
          for marker in \
            "Production P0 exact-run organization" \
            "p0-all-role-register:" \
            "status = 'CANCELLED'" \
            "P0_ACCEPTANCE_FIXTURE_RETIRED" \
            "auth.registration_application_events" \
            "auth.audit_events" \
            "CANDIDATE_ACTIVE_SESSION_PRESENT" \
            "LIMIT 257"; do
            grep -Fq "$marker" "$runner"
          done
          ! grep -Eiq '\bDELETE[[:space:]]+FROM[[:space:]]+(auth|public)\.' "$runner"
          ! grep -Fq 'registration_platform_actor_authorized' "$runner"
          ! grep -Fq 'apply_registration_identity_transition' "$runner"
          echo 'PASS: bounded owner-only retirement contract is syntax-valid and has no reviewer bypass.'

  retire:
    name: Retire stale exact-run fixtures on REG.RU
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4637 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-retire-stale-fixtures current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - name: Prove immutable maintenance scope and no active registration acceptance
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]]
          compare="$RUNNER_TEMP/compare.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_PRODUCTION_SHA...$current" > "$compare"
          status="$(python3 - "$compare" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          print(report.get('status', ''))
          PY
          )"
          [[ "$status" == ahead || "$status" == identical ]]
          python3 - "$compare" "$WORKFLOW_PATH" "$RUNNER_PATH" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          allowed = {sys.argv[2], sys.argv[3]}
          changed = {str(row.get('filename', '')) for row in report.get('files', [])}
          if changed - allowed:
              raise SystemExit('MAIN_CONTAINS_NON_MAINTENANCE_DRIFT')
          PY
          for state in in_progress queued; do
            active="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$state&per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/production-p0-all-role-registration.yml" or .path == ".github/workflows/production-p0-first-customer-acceptance.yml")] | length')"
            [[ "$active" == 0 ]] || { echo 'P0_RETIRE_BLOCKER=ACTIVE_REGISTRATION_ACCEPTANCE'; exit 21; }
          done
          runner="$RUNNER_TEMP/retire.cjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/$RUNNER_PATH?ref=$current" --jq .content | tr -d '\n' | base64 --decode > "$runner"
          node --check "$runner"
          chmod 0600 "$runner"
          echo "main_sha=$current" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned production SSH identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/p0-retire-key"
          known_hosts="$RUNNER_TEMP/p0-retire-known-hosts"
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          host="$(trim "${SSH_HOST_SECRET:-}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$LIVE_HOST" ]]
          [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]

          validate_key() {
            local source="$1" public_key
            tr -d '\r' < "$source" > "$key_path"
            chmod 0600 "$key_path"
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$key_path" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_key() {
            local raw="$1" plain escaped decoded
            [[ -n "$raw" ]] || return 1
            plain="$(mktemp)"; escaped="$(mktemp)"; decoded="$(mktemp)"
            printf '%s\n' "$raw" > "$plain"
            validate_key "$plain" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$escaped"
            validate_key "$escaped" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$decoded" 2>/dev/null && validate_key "$decoded" && { rm -f "$plain" "$escaped" "$decoded"; return 0; }
            rm -f "$plain" "$escaped" "$decoded"
            return 1
          }
          try_key "${SSH_KEY_PRIMARY:-}" || try_key "${SSH_KEY_SECONDARY:-}" || try_key "${SSH_KEY_FALLBACK:-}"

          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$known_hosts"; rm -f "$scan"; chmod 0600 "$known_hosts"
          echo "key=$key_path" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Copy bounded runner to REG.RU
        id: copy
        shell: bash
        env:
          KEY_PATH: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
          LOCAL_RUNNER: ${{ steps.scope.outputs.runner }}
        run: |
          set -euo pipefail
          remote_runner="/tmp/p0-retire-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.cjs"
          scp -q -i "$KEY_PATH" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$LOCAL_RUNNER" "$SSH_USER@$SSH_HOST:$remote_runner"
          echo "remote_runner=$remote_runner" >> "$GITHUB_OUTPUT"

      - name: Cancel only stale all-role acceptance fixtures with canonical audit
        shell: bash
        env:
          KEY_PATH: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
          REMOTE_RUNNER: ${{ steps.copy.outputs.remote_runner }}
        run: |
          set -euo pipefail
          cleanup_correlation="p0-fixture-retire:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          remote_output="$(ssh -i "$KEY_PATH" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$SSH_USER@$SSH_HOST" "bash -s -- '$EXPECTED_PRODUCTION_SHA' '$STALE_SECONDS' '$cleanup_correlation' '$REMOTE_RUNNER'" 2>/dev/null <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"; stale_seconds="$2"; cleanup_correlation="$3"; runner_path="$4"
          fail() { printf 'P0_RETIRE_RESULT=FAIL\nP0_RETIRE_BLOCKER=%s\n' "$1"; exit "${2:-1}"; }
          cleanup() { rm -f -- "$runner_path"; }
          trap cleanup EXIT
          [[ "$(id -u)" -eq 0 ]] || fail ROOT_AUTHORITY_REQUIRED 31
          command -v docker >/dev/null 2>&1 || fail DOCKER_REQUIRED 32
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || fail EXPECTED_SHA_INVALID 33
          [[ "$stale_seconds" == 1800 ]] || fail STALE_WINDOW_INVALID 34
          [[ "$cleanup_correlation" =~ ^p0-fixture-retire:[0-9]+-[0-9]+$ ]] || fail CORRELATION_INVALID 35
          [[ "$runner_path" =~ ^/tmp/p0-retire-[0-9]+-[0-9]+[.]cjs$ && -f "$runner_path" ]] || fail RUNNER_PATH_INVALID 36
          chmod 0600 "$runner_path"
          mapfile -t api_ids < <(docker ps -q --filter 'label=com.docker.compose.service=api')
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#api_ids[@]} == 1 )) || fail API_CARDINALITY_NOT_ONE 37
          (( ${#web_ids[@]} == 1 )) || fail WEB_CARDINALITY_NOT_ONE 38
          api_id="${api_ids[0]}"; web_id="${web_ids[0]}"
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")" == "$expected_sha" ]] || fail API_REVISION_MISMATCH 39
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")" == "$expected_sha" ]] || fail WEB_REVISION_MISMATCH 40
          docker exec "$api_id" /nodejs/bin/node -e "fetch('http://127.0.0.1:3001/ready',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" >/dev/null 2>&1 || fail API_NOT_READY 41
          set +e
          node_output="$(docker exec -i "$api_id" /nodejs/bin/node - "$stale_seconds" "$cleanup_correlation" < "$runner_path" 2>/dev/null)"
          node_rc=$?
          set -e
          printf '%s\n' "$node_output" | grep -E '^P0_RETIRE_(RESULT|BLOCKER|RETIRED|REMAINING|EVENT_EVIDENCE|AUDIT_EVIDENCE|RAW_IDENTIFIERS|NON_MARKER_MUTATIONS)=' || true
          (( node_rc == 0 )) || exit "$node_rc"
          grep -Fxq 'P0_RETIRE_RESULT=PASS' <<< "$node_output" || fail NODE_RESULT_NOT_PASS 42
          printf 'P0_REMOTE_PRODUCTION_SHA=PASS\n'
          REMOTE
          )"
          remote_rc=$?
          set -e
          safe_output="$(printf '%s\n' "$remote_output" | grep -E '^P0_(RETIRE_(RESULT|BLOCKER|RETIRED|REMAINING|EVENT_EVIDENCE|AUDIT_EVIDENCE|RAW_IDENTIFIERS|NON_MARKER_MUTATIONS)|REMOTE_PRODUCTION_SHA)=' || true)"
          printf '%s\n' "$safe_output"
          if (( remote_rc != 0 )); then
            blocker="$(sed -n 's/^P0_RETIRE_BLOCKER=//p' <<< "$safe_output" | tail -1)"
            [[ "$blocker" =~ ^[A-Z0-9_]{4,96}$ ]] || blocker=REMOTE_RETIRE_FAILED_CLOSED
            body="$RUNNER_TEMP/retire-fail.md"
            printf '%s\n' '## Production P0 stale fixture retirement' '' "- result: \`FAIL\`" "- expected production SHA: \`$EXPECTED_PRODUCTION_SHA\`" "- blocker: \`$blocker\`" '- production mutation scope: exact stale all-role fixtures only' '- raw identifiers or credentials published: `0`' > "$body"
            gh issue comment "$AUTHORITY_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$body" >/dev/null
            exit "$remote_rc"
          fi
          for marker in P0_RETIRE_RESULT=PASS P0_RETIRE_REMAINING=0 P0_RETIRE_RAW_IDENTIFIERS=0 P0_RETIRE_NON_MARKER_MUTATIONS=0 P0_REMOTE_PRODUCTION_SHA=PASS; do grep -Fxq "$marker" <<< "$safe_output"; done
          retired="$(sed -n 's/^P0_RETIRE_RETIRED=//p' <<< "$safe_output" | tail -1)"
          events="$(sed -n 's/^P0_RETIRE_EVENT_EVIDENCE=//p' <<< "$safe_output" | tail -1)"
          audits="$(sed -n 's/^P0_RETIRE_AUDIT_EVIDENCE=//p' <<< "$safe_output" | tail -1)"
          [[ "$retired" =~ ^[0-9]{1,3}$ && "$events" == "$retired" && "$audits" == "$retired" ]]
          body="$RUNNER_TEMP/retire-pass.md"
          printf '%s\n' '## Production P0 stale fixture retirement' '' '- result: `PASS`' "- production SHA: \`$EXPECTED_PRODUCTION_SHA\`" "- retired stale exact-run NEW_ORGANIZATION fixtures: \`$retired\`" '- remaining stale marked reviewer-queue rows: `0`' "- lifecycle event evidence: \`$events\`" "- chained auth audit evidence: \`$audits\`" '- non-marker mutations: `0`' '- physical deletes: `0`' '- raw identifiers or credentials published: `0`' > "$body"
          gh issue comment "$AUTHORITY_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$body" >/dev/null

      - name: Remove protected local SSH material
        if: always()
        shell: bash
        env:
          KEY_PATH: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        run: rm -f -- "${KEY_PATH:-}" "${KNOWN_HOSTS:-}"
