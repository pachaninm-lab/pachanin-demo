name: Production Auth-Mail DB Runtime Diagnostic v3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-auth-mail-db-runtime-diagnostic-v3.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-auth-mail-db-runtime-diagnostic-v3
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  DEPLOYED_PRODUCTION_SHA: f166f50e8526cf43f3193e771be05ebc66888494
  MIGRATION_DATASOURCE_FIX_SHA: 1762b4a22a99d786a971e78cbe16ec1f74bb5a74
  EXPECTED_PROVISION_BLOB: ae36405e7916a7c44deede109f204776fc49fc04
  DIAGNOSTIC_COMMAND: /production p0-auth-mail-db-runtime-v3 deployed
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate DB runtime diagnostic v3 contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce read-only deployed-runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/production-auth-mail-db-runtime-diagnostic-v3.yml').read_text(encoding='utf-8')
          required=[
            'DEPLOYED_PRODUCTION_SHA: f166f50e8526cf43f3193e771be05ebc66888494',
            'MIGRATION_DATASOURCE_FIX_SHA: 1762b4a22a99d786a971e78cbe16ec1f74bb5a74',
            'EXPECTED_PROVISION_BLOB: ae36405e7916a7c44deede109f204776fc49fc04',
            'MIGRATION_ENDPOINT_PARITY', 'API_AUTH_ENDPOINT_PARITY',
            'PSQL_CONNECT_CLASS', 'PRISMA_CONNECT_CLASS', 'PRISMA_PRINCIPAL_CLASS',
            'ROLE_CONTRACT', 'MAIL_OUTBOX_SELECT_CLASS', 'PRODUCTION_MUTATION NONE',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('missing invariant: '+' | '.join(missing))
          diagnostic=text.split('\n  diagnostic:\n',1)[1]
          forbidden=[
            'ALTER ROLE','CREATE ROLE','DROP ROLE','GRANT ','REVOKE ','INSERT INTO','UPDATE auth.','DELETE FROM','TRUNCATE ',
            'rotate-db','rotate-smtp','rotate-key','docker compose up','docker restart','docker rm','docker run','--force-recreate',
            'prisma migrate','prisma db execute','PASSWORD_RESET_REPLAYED YES','PRODUCTION_MUTATION DB_'
          ]
          bad=[x for x in forbidden if x in diagnostic]
          if bad: raise SystemExit('mutation surface forbidden: '+' | '.join(bad))
          PY

  diagnostic:
    name: Read-only deployed DB authority and Prisma classifier
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-db-runtime-v3 deployed' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind current main to reviewed deployed runtime
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$main_sha" ]]
          git cat-file -e "${DEPLOYED_PRODUCTION_SHA}^{commit}"
          git cat-file -e "${MIGRATION_DATASOURCE_FIX_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOYED_PRODUCTION_SHA" "$main_sha"
          git merge-base --is-ancestor "$MIGRATION_DATASOURCE_FIX_SHA" "$DEPLOYED_PRODUCTION_SHA"
          git diff --quiet "$DEPLOYED_PRODUCTION_SHA..$main_sha" -- \
            apps/api/src/auth-mail-worker.ts \
            apps/api/prisma/migrations/20260812010000_p0_industrial_auth_mail_outbox/migration.sql \
            scripts/provision-production-auth-mail-runtime.sh \
            scripts/production-auth-mail-outbox-cutover-core.sh
          [[ "$(git hash-object scripts/provision-production-auth-mail-runtime.sh)" == "$EXPECTED_PROVISION_BLOB" ]]
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$DEPLOYED_PRODUCTION_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || exit 10
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$ready" == 1 ]] || exit 15
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; docker compose version >/dev/null; python3 --version >/dev/null; echo SSH_AUTH_OK' | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Diagnose deployed DB authority without worker recreation
        id: diagnostic
        shell: bash
        env:
          DEPLOYED_SHA: ${{ steps.target.outputs.deployed_sha }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"; clean="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$DEPLOYED_SHA'" > "$raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          deployed_sha="$1"
          authority='/var/lib/pc-secret-authority'
          runtime="$authority/runtime"
          db_file="$runtime/database-url"
          tmp="$(mktemp -d /tmp/pc-auth-mail-db-v3.XXXXXX)"
          trap 'rm -rf -- "$tmp"' EXIT
          emit(){ printf '%s=%s\n' "$1" "$2"; }
          fail(){ emit AUTH_MAIL_DB_RUNTIME_V3 FAIL; emit ERROR_CODE "$1"; emit PRODUCTION_MUTATION NONE; exit "${2:-1}"; }
          [[ "$(id -u)" -eq 0 ]] || fail ROOT_REQUIRED 20
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || fail DEPLOYED_SHA_INVALID 21
          [[ -d "$runtime" && ! -L "$runtime" && "$(stat -c '%a:%u:%g' "$runtime")" == '700:0:0' ]] || fail RUNTIME_ROOT_INVALID 22
          [[ -f "$db_file" && ! -L "$db_file" && "$(stat -c '%a:%u:%g' "$db_file")" == '444:0:0' ]] || fail DB_RUNTIME_FILE_INVALID 23
          [[ -f "$runtime/current-key-version" && -f "$runtime/transport.env" && -d "$runtime/keyring" ]] || fail RUNTIME_PROJECTION_INCOMPLETE 24
          emit RUNTIME_PROJECTION PASS

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || fail WEB_CARDINALITY 25
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          [[ -n "$project" ]] || fail PROJECT_MISSING 26
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} == 1 )) || fail API_CARDINALITY 27
          api_id="${api_ids[0]}"
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")" == "$deployed_sha" ]] || fail API_REVISION_DRIFT 28
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")" == "$deployed_sha" ]] || fail WEB_REVISION_DRIFT 29
          emit API_WEB_REVISION PASS

          worker_count="$(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker' | grep -c . || true)"
          [[ "$worker_count" =~ ^[0-9]+$ ]] || worker_count=0
          emit RETAINED_WORKER_COUNT "$worker_count"

          working_dir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$api_id")"
          config_files="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$api_id")"
          [[ "$working_dir" == /* && "$working_dir" != / && -d "$working_dir" && ! -L "$working_dir" && -n "$config_files" ]] || fail COMPOSE_AUTHORITY_INVALID 30
          working_dir="$(realpath -e -- "$working_dir")"
          dc=(docker compose --project-directory "$working_dir" --project-name "$project")
          IFS=',' read -r -a raw_files <<< "$config_files"
          compose_count=0
          for raw_file in "${raw_files[@]}"; do
            file="${raw_file#"${raw_file%%[![:space:]]*}"}"; file="${file%"${file##*[![:space:]]}"}"
            [[ -n "$file" ]] || continue
            [[ "$file" == /* ]] || file="$working_dir/$file"
            [[ -f "$file" && ! -L "$file" ]] || fail COMPOSE_FILE_INVALID 31
            file="$(realpath -e -- "$file")"
            [[ "$file" == "$working_dir"/* ]] || fail COMPOSE_FILE_OUTSIDE_AUTHORITY 32
            dc+=(-f "$file"); compose_count=$((compose_count+1))
          done
          (( compose_count >= 1 )) || fail COMPOSE_FILE_CARDINALITY 33
          compose_json="$tmp/compose.json"; chmod 600 "$compose_json"
          "${dc[@]}" config --format json > "$compose_json" || fail COMPOSE_RENDER_FAILED 34

          migration_file="$tmp/migration-url"; api_file="$tmp/api-auth-url"; chmod 600 "$migration_file" "$api_file"
          python3 - "$compose_json" "$migration_file" <<'PY' || fail MIGRATION_DATASOURCE_DISCOVERY_FAILED 35
          import json,re,sys
          from urllib.parse import urlsplit
          cfg=json.load(open(sys.argv[1],encoding='utf-8')); services=cfg.get('services') or {}; candidates=[]
          for name,service in services.items():
              image=str(service.get('image') or '')
              command=service.get('command'); command=' '.join(command) if isinstance(command,list) else str(command or '')
              if re.search(r'(^|[-_])(migrate|migration)([-_]|$)',name,re.I) or 'grainflow-migration' in image or ('prisma' in command and 'migrate' in command): candidates.append(name)
          if len(candidates)!=1: raise SystemExit(1)
          env=services[candidates[0]].get('environment') or {}
          if isinstance(env,list): env=dict(item.split('=',1) for item in env if isinstance(item,str) and '=' in item)
          value=str(env.get('DATABASE_URL') or '').strip(); u=urlsplit(value)
          if u.scheme not in ('postgres','postgresql') or not u.username or not u.password or not u.hostname or not u.path.strip('/'): raise SystemExit(1)
          open(sys.argv[2],'w',encoding='utf-8').write(value+'\n')
          PY
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$api_id" | sed -n 's/^AUTH_DATABASE_URL=//p' | head -1 > "$api_file"
          [[ -s "$api_file" ]] || fail API_AUTH_URL_MISSING 36

          python3 - "$db_file" "$migration_file" "$api_file" "$project" <<'PY' > "$tmp/endpoint" || fail ENDPOINT_CLASSIFIER_FAILED 37
          import json,subprocess,sys
          from urllib.parse import urlsplit,unquote,parse_qsl
          dbf,migf,apif,project=sys.argv[1:]
          w=urlsplit(open(dbf,encoding='utf-8').read().strip()); m=urlsplit(open(migf,encoding='utf-8').read().strip()); a=urlsplit(open(apif,encoding='utf-8').read().strip())
          if any(u.scheme not in ('postgres','postgresql') for u in (w,m,a)): raise SystemExit(2)
          if unquote(w.username or '')!='pc_auth_mail_runtime' or not w.password: raise SystemExit(3)
          def auth(u): return ((u.hostname or '').lower(),u.port or 5432,u.path,tuple(sorted(parse_qsl(u.query,keep_blank_values=True))))
          host=(w.hostname or '').lower(); kind='OTHER'
          ids=subprocess.check_output(['docker','ps','-q','--filter',f'label=com.docker.compose.project={project}'],text=True).split()
          for cid in ids:
              obj=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
              image=str((obj.get('Config') or {}).get('Image') or '').lower(); labels=(obj.get('Config') or {}).get('Labels') or {}; service=str(labels.get('com.docker.compose.service') or '').lower()
              names={str(obj.get('Name') or '').lstrip('/').lower(),service}
              for d in ((obj.get('NetworkSettings') or {}).get('Networks') or {}).values():
                  names.update(str(x).lower() for x in (d.get('Aliases') or [])); names.add(str(d.get('IPAddress') or '').lower())
              if host not in names: continue
              if 'pgbouncer' in image or 'pgbouncer' in service: kind='PGBOUNCER'; break
              if image.startswith('postgres:') or '/postgres:' in image or service in {'postgres','db','database'}: kind='POSTGRES'; break
          if host in {'localhost','127.0.0.1','::1'}: kind='LOOPBACK'
          print('WORKER_DB_USER=PASS')
          print('MIGRATION_ENDPOINT_PARITY='+('PASS' if auth(w)==auth(m) else 'FAIL'))
          print('API_AUTH_ENDPOINT_PARITY='+('PASS' if auth(w)==auth(a) else 'FAIL'))
          print('DB_ENDPOINT_KIND='+kind)
          print('DB_PORT_CLASS='+('POSTGRES_DEFAULT' if (w.port or 5432)==5432 else 'NONDEFAULT'))
          PY
          cat "$tmp/endpoint"

          mapfile -t pg_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" | while read -r id; do
            image="$(docker inspect --format '{{.Config.Image}}' "$id" 2>/dev/null || true)"; service="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$id" 2>/dev/null || true)"
            if [[ "$image" == postgres:* || "$image" == */postgres:* || "$service" == postgres || "$service" == db || "$service" == database ]]; then printf '%s\n' "$id"; fi
          done)
          if (( ${#pg_ids[@]} == 1 )); then
            pg_id="${pg_ids[0]}"; postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$pg_id" | sed -n 's/^POSTGRES_USER=//p' | head -1)"; postgres_db="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$pg_id" | sed -n 's/^POSTGRES_DB=//p' | head -1)"; [[ -n "$postgres_user" ]] || postgres_user=postgres; [[ -n "$postgres_db" ]] || postgres_db="$postgres_user"
            set +e
            python3 - "$db_file" <<'PY' | docker exec -i "$pg_id" env PGCONNECT_TIMEOUT=5 psql -X -qAt -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$postgres_db" >"$tmp/psql.out" 2>"$tmp/psql.err"
          import sys
          raw=open(sys.argv[1],encoding='utf-8').read().strip(); print('\\connect '+raw); print('SELECT current_user;')
          PY
            psql_rc=$?; set -e
            if [[ "$psql_rc" == 0 ]] && grep -Fxq pc_auth_mail_runtime "$tmp/psql.out"; then emit PSQL_CONNECT_CLASS PASS
            elif grep -Eqi 'password authentication failed|authentication failed' "$tmp/psql.err"; then emit PSQL_CONNECT_CLASS AUTH_FAILED
            elif grep -Eqi 'no pg_hba.conf entry' "$tmp/psql.err"; then emit PSQL_CONNECT_CLASS HBA_DENIED
            elif grep -Eqi 'does not exist' "$tmp/psql.err"; then emit PSQL_CONNECT_CLASS ROLE_OR_DATABASE_MISSING
            elif grep -Eqi 'connection refused|could not connect|timeout expired|timed out' "$tmp/psql.err"; then emit PSQL_CONNECT_CLASS NETWORK_FAILED
            elif grep -Eqi 'SSL|TLS|certificate' "$tmp/psql.err"; then emit PSQL_CONNECT_CLASS TLS_FAILED
            else emit PSQL_CONNECT_CLASS OTHER_FAILED; fi
          else emit PSQL_CONNECT_CLASS NO_LOCAL_POSTGRES; fi

          prisma="$tmp/prisma.js"; chmod 600 "$prisma"
          python3 - "$db_file" > "$prisma" <<'PY'
          import json,sys
          url=open(sys.argv[1],encoding='utf-8').read().strip()
          print("const {PrismaClient}=require('@prisma/client');"); print('const url='+json.dumps(url)+';')
          print(r'''
          const safe=e=>([e?.errorCode,e?.meta?.code,e?.code,e?.name].filter(Boolean).map(x=>String(x).toUpperCase().replace(/[^A-Z0-9_]/g,'_').slice(0,40)).slice(0,3).join('_')||'UNKNOWN').slice(0,100);
          const out=(k,v)=>process.stdout.write(`${k}=${v}\n`); const p=new PrismaClient({datasources:{db:{url}}});
          (async()=>{try{await p.$connect();out('PRISMA_CONNECT_CLASS','PASS')}catch(e){out('PRISMA_CONNECT_CLASS',safe(e));out('PRISMA_PRINCIPAL_CLASS','NOT_RUN');out('ROLE_CONTRACT','NOT_RUN');out('MAIL_OUTBOX_SELECT_CLASS','NOT_RUN');return}
          try{const r=await p.$queryRawUnsafe('SELECT current_user');out('PRISMA_PRINCIPAL_CLASS',r?.[0]?.current_user==='pc_auth_mail_runtime'?'PASS':'WRONG_PRINCIPAL')}catch(e){out('PRISMA_PRINCIPAL_CLASS',safe(e));out('ROLE_CONTRACT','NOT_RUN');out('MAIL_OUTBOX_SELECT_CLASS','NOT_RUN');return}
          try{const r=await p.$queryRawUnsafe("SELECT rolcanlogin,rolsuper,rolbypassrls,rolinherit,has_database_privilege(current_user,current_database(),'CONNECT') connect_ok,has_schema_privilege(current_user,'auth','USAGE') schema_ok,has_table_privilege(current_user,'auth.mail_outbox','SELECT') select_ok FROM pg_roles WHERE rolname=current_user");const x=r?.[0];out('ROLE_CONTRACT',x&&x.rolcanlogin===true&&x.rolsuper===false&&x.rolbypassrls===false&&x.rolinherit===false&&x.connect_ok===true&&x.schema_ok===true&&x.select_ok===true?'PASS':'FAIL')}catch(e){out('ROLE_CONTRACT',safe(e))}
          try{await p.$queryRawUnsafe('SELECT 1 FROM auth.mail_outbox LIMIT 0');out('MAIL_OUTBOX_SELECT_CLASS','PASS')}catch(e){out('MAIL_OUTBOX_SELECT_CLASS',safe(e))}})().finally(async()=>{await p.$disconnect().catch(()=>{})});
          ''')
          PY
          docker exec -i "$api_id" /nodejs/bin/node --input-type=commonjs - < "$prisma" > "$tmp/prisma.out" 2>/dev/null || true
          for key in PRISMA_CONNECT_CLASS PRISMA_PRINCIPAL_CLASS ROLE_CONTRACT MAIL_OUTBOX_SELECT_CLASS; do value="$(sed -nE "s/^${key}=([A-Z0-9_]{1,100})$/\\1/p" "$tmp/prisma.out" | head -1)"; [[ -n "$value" ]] || value=NO_SAFE_RESULT; emit "$key" "$value"; done

          emit AUTH_MAIL_DB_RUNTIME_V3 PASS
          emit ERROR_CODE NONE
          emit PRODUCTION_MUTATION NONE
          REMOTE
          rc=$?; set -e
          sed -nE '/^(AUTH_MAIL_DB_RUNTIME_V3|ERROR_CODE|RUNTIME_PROJECTION|API_WEB_REVISION|RETAINED_WORKER_COUNT|WORKER_DB_USER|MIGRATION_ENDPOINT_PARITY|API_AUTH_ENDPOINT_PARITY|DB_ENDPOINT_KIND|DB_PORT_CLASS|PSQL_CONNECT_CLASS|PRISMA_CONNECT_CLASS|PRISMA_PRINCIPAL_CLASS|ROLE_CONTRACT|MAIL_OUTBOX_SELECT_CLASS|PRODUCTION_MUTATION)=[A-Za-z0-9_.:-]{1,160}$/p' "$raw" > "$clean"
          rm -f "$raw"; cat "$clean"; echo "rc=$rc" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r k v; do case "$k" in AUTH_MAIL_DB_RUNTIME_V3|ERROR_CODE|RUNTIME_PROJECTION|API_WEB_REVISION|RETAINED_WORKER_COUNT|WORKER_DB_USER|MIGRATION_ENDPOINT_PARITY|API_AUTH_ENDPOINT_PARITY|DB_ENDPOINT_KIND|DB_PORT_CLASS|PSQL_CONNECT_CLASS|PRISMA_CONNECT_CLASS|PRISMA_PRINCIPAL_CLASS|ROLE_CONTRACT|MAIL_OUTBOX_SELECT_CLASS|PRODUCTION_MUTATION) echo "${k,,}=$v" >> "$GITHUB_OUTPUT";; esac; done < "$clean"
          rm -f "$clean"

      - name: Publish sanitized v3 evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
          DEPLOYED_SHA: ${{ steps.target.outputs.deployed_sha }}
          REMOTE_RC: ${{ steps.diagnostic.outputs.rc }}
          RESULT: ${{ steps.diagnostic.outputs.auth_mail_db_runtime_v3 }}
          ERROR_CODE: ${{ steps.diagnostic.outputs.error_code }}
          RUNTIME_PROJECTION: ${{ steps.diagnostic.outputs.runtime_projection }}
          API_WEB_REVISION: ${{ steps.diagnostic.outputs.api_web_revision }}
          RETAINED_WORKER_COUNT: ${{ steps.diagnostic.outputs.retained_worker_count }}
          WORKER_DB_USER: ${{ steps.diagnostic.outputs.worker_db_user }}
          MIGRATION_ENDPOINT_PARITY: ${{ steps.diagnostic.outputs.migration_endpoint_parity }}
          API_AUTH_ENDPOINT_PARITY: ${{ steps.diagnostic.outputs.api_auth_endpoint_parity }}
          DB_ENDPOINT_KIND: ${{ steps.diagnostic.outputs.db_endpoint_kind }}
          DB_PORT_CLASS: ${{ steps.diagnostic.outputs.db_port_class }}
          PSQL_CONNECT_CLASS: ${{ steps.diagnostic.outputs.psql_connect_class }}
          PRISMA_CONNECT_CLASS: ${{ steps.diagnostic.outputs.prisma_connect_class }}
          PRISMA_PRINCIPAL_CLASS: ${{ steps.diagnostic.outputs.prisma_principal_class }}
          ROLE_CONTRACT: ${{ steps.diagnostic.outputs.role_contract }}
          MAIL_OUTBOX_SELECT_CLASS: ${{ steps.diagnostic.outputs.mail_outbox_select_class }}
          PRODUCTION_MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP deployed auth-mail DB runtime diagnostic v3'; echo
            echo "- diagnostic main SHA: \`${MAIN_SHA:-unknown}\`"; echo "- deployed API/Web SHA: \`${DEPLOYED_SHA:-unknown}\`"
            echo "- result: \`${RESULT:-unknown}\` (rc=\`${REMOTE_RC:-unknown}\`)"; echo "- safe error: \`${ERROR_CODE:-unknown}\`"
            echo "- runtime projection / API-Web revision: \`${RUNTIME_PROJECTION:-unknown} / ${API_WEB_REVISION:-unknown}\`"
            echo "- retained worker count: \`${RETAINED_WORKER_COUNT:-unknown}\`"
            echo "- worker DB user: \`${WORKER_DB_USER:-unknown}\`"
            echo "- migration endpoint parity / API auth parity: \`${MIGRATION_ENDPOINT_PARITY:-unknown} / ${API_AUTH_ENDPOINT_PARITY:-unknown}\`"
            echo "- endpoint kind / port: \`${DB_ENDPOINT_KIND:-unknown} / ${DB_PORT_CLASS:-unknown}\`"
            echo "- psql / Prisma connect: \`${PSQL_CONNECT_CLASS:-unknown} / ${PRISMA_CONNECT_CLASS:-unknown}\`"
            echo "- Prisma principal / role / mail_outbox SELECT: \`${PRISMA_PRINCIPAL_CLASS:-unknown} / ${ROLE_CONTRACT:-unknown} / ${MAIL_OUTBOX_SELECT_CLASS:-unknown}\`"
            echo "- production mutation: \`${PRODUCTION_MUTATION:-unknown}\`"
            echo '- no URLs, hostnames, database names, credentials, hashes, container IDs, raw PostgreSQL/Prisma errors, recipients or tokens are published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"; rm -f "$record"

      - name: Enforce read-only diagnostic result
        shell: bash
        env:
          REMOTE_RC: ${{ steps.diagnostic.outputs.rc }}
          RESULT: ${{ steps.diagnostic.outputs.auth_mail_db_runtime_v3 }}
          PRODUCTION_MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          [[ "${REMOTE_RC:-1}" == 0 ]]
          [[ "$RESULT" == PASS ]]
          [[ "$PRODUCTION_MUTATION" == NONE ]]
