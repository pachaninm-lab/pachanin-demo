name: TAI Migration Stdin Authority Materializer

on:
  push:
    branches:
      - agent/tai-migration-stdin-authority-20260801
    paths:
      - .github/workflows/tai-migration-stdin-authority-materialize.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: tai-migration-stdin-authority-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tai-migration-stdin-authority-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate exact source repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          state=failure
          description='Migration stdin source repair failed'
          publish() {
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" -f context='TAI Migration Stdin Materializer' \
              -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }
          trap publish EXIT
          state=pending; description='Materializing migration stdin authority'; publish
          state=failure

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'missing source fragment: {label}')

          deploy_path = Path('scripts/tai-reg-ru-deploy.sh')
          deploy = deploy_path.read_text(encoding='utf-8')
          deploy = replace_once(
              deploy,
              'docker run --rm --read-only --network none --entrypoint python "$TAI_IMAGE_DIGEST" - > "$MIGRATION_BUNDLE"',
              'docker run --rm -i --read-only --network none --entrypoint python "$TAI_IMAGE_DIGEST" - > "$MIGRATION_BUNDLE"',
              'docker stdin attachment',
          )
          if 'TAI_MIGRATION_BUNDLE_EMPTY' not in deploy:
              deploy = replace_once(
                  deploy,
                  "PY_MIGRATIONS\n  chmod 0600 \"$MIGRATION_BUNDLE\"",
                  "PY_MIGRATIONS\n  [[ -s \"$MIGRATION_BUNDLE\" ]] || { echo \"TAI_MIGRATION_BUNDLE_EMPTY\" >&2; exit 19; }\n  chmod 0600 \"$MIGRATION_BUNDLE\"",
                  'non-empty migration bundle guard',
              )
          deploy_path.write_text(deploy, encoding='utf-8')

          check_path = Path('scripts/check-tai-reg-ru-deploy.mjs')
          check = check_path.read_text(encoding='utf-8')
          check = replace_once(
              check,
              "const scopePath = 'docs/platform-v7/autopilot/scopes/tai-postgres-authority-20260801.json';",
              "const scopePath = 'docs/platform-v7/autopilot/scopes/tai-migration-stdin-authority-20260801.json';",
              'checker scope path',
          )
          check = replace_once(
              check,
              "if (scope.branch !== 'fix/tai-postgres-service-authority-20260801')",
              "if (scope.branch !== 'agent/tai-migration-stdin-authority-20260801')",
              'checker branch authority',
          )
          if "'TAI_MIGRATION_BUNDLE_EMPTY'," not in check:
              check = replace_once(
                  check,
                  "  'tai-agro-os-master-spec-v4.0',\n]) requireFragment(deploy, fragment, deployPath);",
                  "  'tai-agro-os-master-spec-v4.0',\n  'docker run --rm -i --read-only --network none --entrypoint python',\n  'TAI_MIGRATION_BUNDLE_EMPTY',\n]) requireFragment(deploy, fragment, deployPath);",
                  'checker required fragments',
              )
          if 'migration extractor does not attach stdin' not in check:
              check = replace_once(
                  check,
                  "for (const fragment of [\n  \"set -Eeuo pipefail\",",
                  "if (deploy.includes('docker run --rm --read-only --network none --entrypoint python \\\"$TAI_IMAGE_DIGEST\\\" -')) {\n  violations.push(deployPath + ': migration extractor does not attach stdin');\n}\nif (!deploy.includes('docker run --rm -i --read-only --network none --entrypoint python \\\"$TAI_IMAGE_DIGEST\\\" -')) {\n  violations.push(deployPath + ': stdin-driven immutable-image Python must use docker run -i');\n}\n\nfor (const fragment of [\n  \"set -Eeuo pipefail\",",
                  'checker stdin guard',
              )
          check_path.write_text(check, encoding='utf-8')

          Path('.github/workflows/tai-migration-stdin-authority-materialize.yml').unlink()
          PY

          bash -n scripts/tai-reg-ru-deploy.sh
          node scripts/check-tai-reg-ru-deploy.mjs
          git diff --check
          grep -Fq 'docker run --rm -i --read-only --network none --entrypoint python "$TAI_IMAGE_DIGEST" -' scripts/tai-reg-ru-deploy.sh
          grep -Fq 'TAI_MIGRATION_BUNDLE_EMPTY' scripts/tai-reg-ru-deploy.sh
          ! grep -Fq 'docker run --rm --read-only --network none --entrypoint python "$TAI_IMAGE_DIGEST" -' scripts/tai-reg-ru-deploy.sh

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tai): attach immutable migration stdin'
          git push origin HEAD:agent/tai-migration-stdin-authority-20260801

          state=success
          description='Migration stdin source repair materialized'
