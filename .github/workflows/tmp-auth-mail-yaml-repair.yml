name: Temporary auth-mail release YAML repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-auth-mail-yaml-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/industrial-auth-mail-outbox-3785
          fetch-depth: 0

      - name: Repair, validate and create corrected workflow blob
        id: repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT="/tmp/auth-mail-yaml-repair-${GITHUB_RUN_ID}.txt"
          WF='.github/workflows/production-full-stack-exact-sha.yml'
          exec > >(tee "$REPORT") 2>&1
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"

          python3 -c 'from pathlib import Path; p=Path(".github/workflows/production-full-stack-exact-sha.yml"); s=p.read_text(); repls={"\nscp \"${scp_common[@]}\" scripts/provision-production-auth-mail-runtime.sh":"\n          scp \"${scp_common[@]}\" scripts/provision-production-auth-mail-runtime.sh","\nDEPLOYED_AUTH_MAIL_WORKER_REVISION: ${{ steps.production.outputs.deployed_auth_mail_worker_revision }}":"\n          DEPLOYED_AUTH_MAIL_WORKER_REVISION: ${{ steps.production.outputs.deployed_auth_mail_worker_revision }}","\nAUTH_MAIL_RUNTIME: ${{ steps.production.outputs.auth_mail_runtime }}":"\n          AUTH_MAIL_RUNTIME: ${{ steps.production.outputs.auth_mail_runtime }}","            echo \"- web revision: `${DEPLOYED_WEB_REVISION:-unknown}`\"":"            echo \"- web revision: \\`${DEPLOYED_WEB_REVISION:-unknown}\\`\"","  echo \"- auth-mail worker revision: `${DEPLOYED_AUTH_MAIL_WORKER_REVISION:-unknown}`\"":"            echo \"- auth-mail worker revision: \\`${DEPLOYED_AUTH_MAIL_WORKER_REVISION:-unknown}\\`\"","  echo \"- auth-mail runtime: `${AUTH_MAIL_RUNTIME:-unknown}`\"":"            echo \"- auth-mail runtime: \\`${AUTH_MAIL_RUNTIME:-unknown}\\`\""}; [( (_ for _ in ()).throw(SystemExit(f"repair count {s.count(old)} for {old!r}")) if s.count(old)!=1 else None, globals().__setitem__("s",s.replace(old,new,1)) ) for old,new in repls.items()]; p.write_text(s)'

          python3 scripts/check-workflow-syntax.py
          bash -n scripts/provision-production-auth-mail-runtime.sh
          bash -n scripts/production-full-stack-exact-sha.sh
          node scripts/check-production-full-stack-release.mjs
          git diff --check
          echo 'VALIDATION=PASS'

          payload="$(jq -n --arg content "$(base64 -w0 "$WF")" '{content:$content,encoding:"base64"}')"
          sha="$(curl --fail-with-body -sS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" -d "$payload" | jq -r '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "BLOB_RELEASE_WORKFLOW_CORRECTED=$sha"
          echo 'YAML_REPAIR=PASS'

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-mail-yaml-repair-evidence
          path: /tmp/auth-mail-yaml-repair-*.txt
          if-no-files-found: error
          retention-days: 1
