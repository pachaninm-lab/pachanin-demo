name: Emergency Exact Current-Main Agriculture Byline Images

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/emergency-exact-current-main-agriculture-byline-images.yml'
      - 'docs/platform-v7/autopilot/scopes/emergency-exact-current-main-agriculture-byline-images.json'

permissions:
  contents: read
  packages: write

concurrency:
  group: emergency-exact-current-main-agriculture-byline-images
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/grainflow
    steps:
      - name: Resolve exact current main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "short=${target:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable build date
        id: source
        shell: bash
        run: echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:sha-${{ steps.target.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          build-args: |
            BUILD_DATE=${{ steps.source.outputs.build_date }}
            GIT_COMMIT=${{ steps.target.outputs.sha }}

      - name: Build and push exact web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:sha-${{ steps.target.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            BUILD_DATE=${{ steps.source.outputs.build_date }}
            GIT_COMMIT=${{ steps.target.outputs.sha }}

      - name: Build and push exact migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.migrations
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-migration:sha-${{ steps.target.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration
          build-args: |
            BUILD_DATE=${{ steps.source.outputs.build_date }}
            GIT_COMMIT=${{ steps.target.outputs.sha }}

      - name: Verify exact OCI revisions and unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" == "$TARGET_SHA" ]]
          for component in api web migration; do
            image="${IMAGE_PREFIX}-${component}:sha-${SHORT_SHA}"
            docker pull "$image" >/dev/null
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            [[ "$revision" == "$TARGET_SHA" ]]
            printf '%s=%s\n' "$component" "$revision"
          done
          echo "EXACT_IMAGES=PASS"
          echo "EXACT_MAIN=$TARGET_SHA"
