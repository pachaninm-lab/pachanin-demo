name: One-shot socket.io-parser security remediation

on:
  push:
    branches:
      - security/socket-io-parser-4.2.7-20260803
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-socket-io-parser-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message != 'fix(security): pin socket.io-parser 4.2.7') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'security/socket-io-parser-4.2.7-20260803') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/socket-io-parser-4.2.7-20260803
          fetch-depth: 0

      - name: Setup repository pnpm pin
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Apply deterministic parser override
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          pkg.pnpm.overrides['socket.io-parser@<4.2.7'] = '4.2.7';
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only

      - name: Verify frozen install and resolved version
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');

          if (pkg.pnpm?.overrides?.['socket.io-parser@<4.2.7'] !== '4.2.7') {
            throw new Error('missing socket.io-parser override');
          }
          if (!lock.includes('socket.io-parser@4.2.7:')) {
            throw new Error('socket.io-parser 4.2.7 snapshot missing');
          }
          if (!lock.includes('socket.io-parser: 4.2.7')) {
            throw new Error('socket.io-parser 4.2.7 resolution missing');
          }
          if (lock.includes('socket.io-parser@4.2.6:')) {
            throw new Error('vulnerable socket.io-parser 4.2.6 remains');
          }
          NODE
          git diff --check

      - name: Commit final two-file remediation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-socket-io-parser-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/one-shot-socket-io-parser-remediation.yml
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const names = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter(Boolean)
            .sort();
          const expected = [
            '.github/workflows/one-shot-socket-io-parser-remediation.yml',
            'package.json',
            'pnpm-lock.yaml',
          ];
          if (JSON.stringify(names) !== JSON.stringify(expected)) {
            throw new Error(`unexpected staged paths: ${names.join(', ')}`);
          }
          NODE
          git commit -m "fix(security): pin socket.io-parser 4.2.7"
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const names = execFileSync('git', ['diff', '--name-only', 'origin/main...HEAD'], { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter(Boolean)
            .sort();
          const expected = ['package.json', 'pnpm-lock.yaml'];
          if (JSON.stringify(names) !== JSON.stringify(expected)) {
            throw new Error(`unexpected final PR paths: ${names.join(', ')}`);
          }
          NODE
          git push origin HEAD:security/socket-io-parser-4.2.7-20260803
