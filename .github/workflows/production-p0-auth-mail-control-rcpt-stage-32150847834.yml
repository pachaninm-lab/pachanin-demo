name: Production P0 Auth Mail Control RCPT Stage 32150847834

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-auth-mail-control-rcpt-stage-32150847834.yml'

permissions:
  contents: read

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  SUBJECT_SHA: d3968b730ff7d5c6f02cfebc5ffa02edfa5bef68

jobs:
  probe:
    name: Control mailbox pre-DATA RCPT classifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
      CONTROL_RECIPIENT: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate no-mail contract
        shell: bash
        run: |
          set -Eeuo pipefail
          source='.github/workflows/production-p0-auth-mail-control-rcpt-stage-32150847834.yml'
          grep -Fq 'MAIL_SENT=NO' "$source"
          python3 - "$source" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          markers=[i for i,line in enumerate(lines) if line.strip() == '# OPERATIONAL_BEGIN']
          if len(markers)!=1: raise SystemExit('OPERATIONAL_MARKER_INVALID')
          operational='\n'.join(lines[markers[0]+1:])
          forbidden=['DATA\\r\\n','command(\'DATA\'','command("DATA"','sendAuthMailSmtp(','docker restart','docker compose up','docker rm ','INSERT INTO','UPDATE auth.','DELETE FROM','GRANT ','REVOKE ']
          bad=[x for x in forbidden if x in operational]
          if bad: raise SystemExit('FORBIDDEN_OPERATION:'+'|'.join(bad))
          PY

      # OPERATIONAL_BEGIN
      - name: Resolve pinned production SSH authority
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${PC_PROD_HOST:-$DEFAULT_HOST}")"; user="$(trim "${PC_PROD_SSH_USER:-}")"; port="$(trim "${PC_PROD_SSH_PORT:-22}")"; expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]; [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]; [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)); [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"; key="$HOME/.ssh/id_pc_prod"
          validate_key(){ local src="$1" pub; tr -d '\r' < "$src" > "$key"; chmod 600 "$key"; grep -Eq '^(ssh-|ecdsa-|sk-)' "$key" && return 1; pub="$(mktemp)"; ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"; }
          try_slot(){ local raw="$1" a b c; [[ -n "$raw" ]] || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          try_slot "${PC_PROD_SSH_KEY:-}" || try_slot "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_slot "${VPS_SSH_KEY:-}"
          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do : > "$scan"; : > "$match"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true; while IFS= read -r line; do [[ -n "$line" ]] || continue; fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"; done < "$scan"; sort -u -o "$match" "$match"; [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }; ((attempt==3)) || sleep "$attempt"; done
          [[ "$ready" == 1 ]]; mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "user=$user" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Probe control recipient without DATA
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          [[ -n "$CONTROL_RECIPIENT" ]]
          safe="$(printf '%s' "$CONTROL_RECIPIENT" | ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER@$HOST" "bash -s -- '$SUBJECT_SHA'" 2>/dev/null <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"; read -r recipient; [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; [[ "$(id -u)" -eq 0 ]]; [[ "$recipient" =~ ^[^[:space:]@]{1,64}@[^[:space:]@]{1,189}$ ]]
          tmp="$(mktemp -d /root/pc-control-rcpt.XXXXXX)"; chmod 700 "$tmp"; trap 'rm -rf -- "$tmp"' EXIT; printf '%s' "$recipient" > "$tmp/recipient"; unset recipient; chmod 600 "$tmp/recipient"
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web'); (( ${#web_ids[@]} == 1 )); web_id="${web_ids[0]}"; project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"; [[ -n "$project" ]]
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api'); mapfile -t worker_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker'); (( ${#api_ids[@]} == 1 && ${#worker_ids[@]} == 1 )); api_id="${api_ids[0]}"; worker_id="${worker_ids[0]}"; api_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")"; web_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")"; worker_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$worker_id")"; [[ "$api_rev" == "$expected_sha" && "$web_rev" == "$expected_sha" && "$worker_rev" == "$expected_sha" ]]
          docker exec -i "$worker_id" /nodejs/bin/node --input-type=commonjs - <<'NODE' > "$tmp/config.json"
          const {readFileSync}=require('node:fs'); const path=String(process.env.AUTH_MAIL_TRANSPORT_FILE||'').trim(); if(!path) process.exit(2); const out={}; for(const src of readFileSync(path,'utf8').split(/\r?\n/)){const line=src.trim(); if(!line||line.startsWith('#')) continue; const i=line.indexOf('='); if(i<=0) process.exit(3); out[line.slice(0,i).trim()]=line.slice(i+1).trim();} process.stdout.write(JSON.stringify({host:out.PC_SMTP_HOST||'',port:out.PC_SMTP_PORT||'465',user:out.PC_SMTP_USER||'',pass:out.PC_SMTP_PASS||'',from:out.PC_MAIL_FROM||out.PC_SMTP_USER||''}));
          NODE
          chmod 600 "$tmp/config.json"
          python3 - "$tmp/config.json" "$tmp/recipient" <<'PY'
          import base64,json,re,socket,ssl,sys
          cfg=json.load(open(sys.argv[1],encoding='utf-8')); recipient=open(sys.argv[2],encoding='utf-8').read().strip(); stage='BOOTSTRAP'; code='NONE'; last=''
          def mailbox(v):
              v=str(v or '').strip();
              if v.count('@')!=1 or re.search(r'[\r\n\x00<> ]',v): raise ValueError('mailbox')
              local,domain=v.rsplit('@',1); local.encode('ascii'); domain=domain.encode('idna').decode('ascii').lower(); return f'{local}@{domain}'
          def readresp(f):
              global last
              first=f.readline(4096)
              if not first or len(first)<4 or not first[:3].isdigit(): raise RuntimeError('RESPONSE_INVALID')
              c=first[:3].decode('ascii'); final=first
              if first[3:4]==b'-':
                  while True:
                      line=f.readline(4096)
                      if not line: raise RuntimeError('RESPONSE_EOF')
                      final=line
                      if line.startswith(c.encode()+b' '): break
              last=final.decode('utf-8','replace').strip()[:1024]; return c
          def cmd(sock,f,text,expected):
              sock.sendall(text.encode('ascii')+b'\r\n'); c=readresp(f)
              if c not in expected: raise ValueError(c)
              return c
          try:
              host=str(cfg.get('host') or '').strip().lower(); port=int(str(cfg.get('port') or '465')); user=mailbox(cfg.get('user')); password=str(cfg.get('pass') or ''); sender=mailbox(cfg.get('from')); rcpt=mailbox(recipient)
              if host!='mail.hosting.reg.ru' or port!=465 or sender!='access@xn----8sbjf4befbjgs9b.xn--p1ai' or len(password)<8: raise RuntimeError('CONFIG_BOUNDARY')
              stage='TLS_CONNECT'; raw=socket.create_connection((host,port),timeout=15); sock=ssl.create_default_context().wrap_socket(raw,server_hostname=host); sock.settimeout(15); f=sock.makefile('rb'); stage='GREETING'; code=readresp(f)
              if code!='220': raise ValueError(code)
              stage='EHLO'; code=cmd(sock,f,'EHLO xn----8sbjf4befbjgs9b.xn--p1ai',{'250'}); stage='AUTH'; auth=base64.b64encode(('\x00'+user+'\x00'+password).encode()).decode(); code=cmd(sock,f,'AUTH PLAIN '+auth,{'235'}); stage='MAIL_FROM'; code=cmd(sock,f,f'MAIL FROM:<{sender}>',{'250'}); stage='RCPT_TO'; code=cmd(sock,f,f'RCPT TO:<{rcpt}>',{'250','251'}); stage='PRE_DATA_COMPLETE'; code='NONE'
              try: cmd(sock,f,'RSET',{'250'}); cmd(sock,f,'QUIT',{'221'})
              except Exception: pass
              sock.close(); print('CONTROL_PROBE_RESULT=PASS')
          except ValueError as exc:
              c=str(exc); code=c if re.fullmatch(r'[2-5][0-9]{2}',c) else code; print('CONTROL_PROBE_RESULT=FAIL')
          except Exception:
              print('CONTROL_PROBE_RESULT=FAIL')
          print(f'CONTROL_LAST_STAGE={stage}'); print(f'CONTROL_SMTP_CODE={code}'); print('MAIL_SENT=NO'); print('PRODUCTION_MUTATION=NONE')
          PY
          REMOTE
          )"
          grep -E '^(CONTROL_PROBE_RESULT|CONTROL_LAST_STAGE|CONTROL_SMTP_CODE|MAIL_SENT|PRODUCTION_MUTATION)=' <<< "$safe"
          grep -Fxq 'MAIL_SENT=NO' <<< "$safe"; grep -Fxq 'PRODUCTION_MUTATION=NONE' <<< "$safe"
