name: Production P0 Reviewer SMTP587 STARTTLS Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-smtp587-starttls-probe.yml'
      - 'scripts/production-p0-reviewer-smtp587-starttls-probe.sh'
      - 'scripts/production-p0-reviewer-smtp-recipient-isolation-probe.sh'
      - 'scripts/production-p0-reviewer-direct-mx-predata-probe.sh'
      - 'scripts/production-p0-reviewer-direct-mx-tls-probe.sh'
      - 'scripts/production-p0-direct-mx-authz-probe.sh'
      - 'docs/platform-v7/autopilot/scopes/p0-auth-mail-smtp587-starttls-3785.json'
      - 'docs/platform-v7/autopilot/scopes/p0-auth-mail-smtp587-starttls-3785.md'
      - 'docs/platform-v7/autopilot/scopes/p0-auth-mail-smtp587-starttls-3785.txt'

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-smtp587-starttls-probe
  cancel-in-progress: true

jobs:
  probe:
    name: REG.RU 587 STARTTLS pre-DATA probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate bounded no-mail contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in scripts/production-p0-reviewer-smtp587-starttls-probe.sh scripts/production-p0-reviewer-smtp-recipient-isolation-probe.sh scripts/production-p0-reviewer-direct-mx-predata-probe.sh scripts/production-p0-reviewer-direct-mx-tls-probe.sh scripts/production-p0-direct-mx-authz-probe.sh; do bash -n "$f"; ! grep -Fq "command('DATA'" "$f"; ! grep -Fq 'sendAuthMailSmtp(' "$f"; done
          grep -Fq "stage='STARTTLS'" scripts/production-p0-reviewer-smtp587-starttls-probe.sh
          grep -Fq "stage='RCPT_TO'" scripts/production-p0-reviewer-smtp587-starttls-probe.sh

      - name: Probe existing REG.RU identity through 587 STARTTLS without DATA
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/production-p0-reviewer-smtp587-starttls-probe.sh

      - name: Distinguish reviewer-recipient policy from sender-account policy
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/production-p0-reviewer-smtp-recipient-isolation-probe.sh

      - name: Probe direct recipient MX without DATA
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/production-p0-reviewer-direct-mx-predata-probe.sh

      - name: Verify direct MX TLS capability without DATA
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/production-p0-reviewer-direct-mx-tls-probe.sh

      - name: Verify direct MX SPF DMARC PTR readiness
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/production-p0-direct-mx-authz-probe.sh
