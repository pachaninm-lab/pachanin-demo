name: PC-CROP Provider Registry Authority

on:
  pull_request:
    paths:
      - 'packages/domain-core/src/service-provider-registry.ts'
      - 'apps/api/prisma/schema.prisma'
      - 'apps/api/prisma/migrations/20260904210000_provider_registry_authority/**'
      - 'apps/api/src/modules/service-providers/**'
      - 'apps/api/test/industrial/provider-registry-authority.e2e-spec.ts'
      - 'scripts/platform-v7-one-deal-e2e.sh'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-provider-registry-authority-4997.json'
      - 'scripts/verify-pc-crop-provider-registry-scope.test.mjs'
      - '.github/workflows/pc-crop-provider-registry.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain-core/src/service-provider-registry.ts'
      - 'apps/api/prisma/schema.prisma'
      - 'apps/api/prisma/migrations/20260904210000_provider_registry_authority/**'
      - 'apps/api/src/modules/service-providers/**'
      - 'apps/api/test/industrial/provider-registry-authority.e2e-spec.ts'
      - 'scripts/platform-v7-one-deal-e2e.sh'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-provider-registry-authority-4997.json'
      - 'scripts/verify-pc-crop-provider-registry-scope.test.mjs'
      - '.github/workflows/pc-crop-provider-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-crop-provider-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/grainflow
  EVIDENCE_DIR: artifacts/pc-crop-provider-registry

jobs:
  provider-registry-authority:
    name: PostgreSQL schema, bounded authority and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/pachaninm-lab/ci-postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: grainflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d grainflow"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - name: Bind and verify narrow scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXACT_HEAD" > "$EVIDENCE_DIR/exact-head.txt"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="HEAD^"
          fi
          printf '%s\n' "$base_ref" > "$EVIDENCE_DIR/base-ref.txt"
          if [[ "${GITHUB_HEAD_REF:-}" == "feat/pc-crop-provider-registry-authority-4997" ]]; then
            PC_CROP_BASE_REF="$base_ref" \
              node --test scripts/verify-pc-crop-provider-registry-scope.test.mjs \
              2>&1 | tee "$EVIDENCE_DIR/scope.log"
          else
            # This workflow remains a regression gate for later provider work,
            # but its historical W1-B diff boundary must not reject a new,
            # separately approved scope.
            node --test scripts/verify-pc-crop-provider-registry-scope.test.mjs \
              2>&1 | tee "$EVIDENCE_DIR/scope.log"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.2.1'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply complete migration chain and prove zero drift
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/api exec prisma migrate deploy \
            2>&1 | tee "$EVIDENCE_DIR/migrate-deploy.log"
          pnpm --filter @pc/api exec prisma migrate status \
            2>&1 | tee "$EVIDENCE_DIR/migrate-status.log"
          pnpm --filter @pc/api exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            2>&1 | tee "$EVIDENCE_DIR/schema-drift.log"
          pnpm --filter @pc/api exec prisma generate \
            2>&1 | tee "$EVIDENCE_DIR/prisma-generate.log"

      - name: Typecheck provider registry authority
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/api typecheck \
            2>&1 | tee "$EVIDENCE_DIR/typecheck.log"

      - name: Run provider registry contract tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/api exec jest --runInBand \
            --runTestsByPath src/modules/service-providers/provider-registry.contract.spec.ts \
            2>&1 | tee "$EVIDENCE_DIR/contract-tests.log"

      - name: Record runtime acceptance owner
        run: |
          printf '%s\n' \
            'Restricted-principal PostgreSQL runtime acceptance is blocking in CI one-deal exploitation.' \
            > "$EVIDENCE_DIR/runtime-acceptance-owner.txt"

      - name: Build exact evidence inventory
        if: always()
        run: |
          find "$EVIDENCE_DIR" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$EVIDENCE_DIR/exact-evidence-sha256.txt"

      - name: Upload provider registry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc-crop-provider-registry-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  provider-registry-gate:
    name: PC-CROP Provider Registry Gate · blocking
    if: always()
    runs-on: ubuntu-24.04
    needs: provider-registry-authority
    steps:
      - name: Enforce provider registry authority result
        run: test "${{ needs.provider-registry-authority.result }}" = success
