name: Public AI window current-main synchronization

on:
  push:
    branches:
      - agent/public-ai-window-clean-ui
    paths:
      - .github/workflows/public-ai-window-current-main-sync.yml

permissions:
  contents: write

concurrency:
  group: public-ai-window-current-main-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-ai-window-clean-ui
          fetch-depth: 0

      - name: Merge current main and remove synchronizer
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/public-ai-window-clean-ui'
          scope='docs/platform-v7/autopilot/scopes/public-ai-window-clean-ui-3368.json'
          workflow='.github/workflows/public-ai-window-current-main-sync.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main "$branch"

          expected_branch_head="$(git rev-parse "origin/$branch")"
          [[ "$(git rev-parse HEAD)" == "$expected_branch_head" ]]
          main_sha="$(git rev-parse origin/main)"

          git merge --no-ff --no-edit "$main_sha"

          MAIN_SHA="$main_sha" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('docs/platform-v7/autopilot/scopes/public-ai-window-clean-ui-3368.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['baseCommit'] = os.environ['MAIN_SHA']
          data['operationalStatus'] = 'UI_ONLY_SYNCED_TO_CURRENT_MAIN_PENDING_FINAL_GATES'
          data['allowedPaths'] = [
              item for item in data['allowedPaths']
              if item != '.github/workflows/public-ai-window-current-main-sync.yml'
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f "$workflow"
          git add -A
          git commit -m 'chore(ui): synchronize clean AI window with current main'

          git fetch --no-tags origin main "$branch"
          [[ "$(git rev-parse origin/main)" == "$main_sha" ]] || {
            echo 'main moved during synchronization' >&2
            exit 29
          }
          [[ "$(git rev-parse "origin/$branch")" == "$expected_branch_head" ]] || {
            echo 'target branch moved during synchronization' >&2
            exit 30
          }
          git push origin "HEAD:refs/heads/$branch"
