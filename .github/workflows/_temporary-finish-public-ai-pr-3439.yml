name: Temporary finish public AI PR 3439

on:
  push:
    branches:
      - fix/public-ai-friendly-agro-expert
    paths:
      - .github/workflows/_temporary-finish-public-ai-pr-3439.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-ai-friendly-agro-expert
          fetch-depth: 0

      - name: Sync, remediate matcher, test and self-clean
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit origin/main

          python3 - <<'PY'
          from pathlib import Path

          route_path = Path('apps/web/app/api/restricted-public-platform-assistant/route.ts')
          route = route_path.read_text()
          old_pattern = r"  /(?:как\s+работает|как\s+устроен\w*|что\s+такое|для\s+чего|зачем|чем\s+помогает|опиши(?:те)?|расскажи(?:те)?)\s+(?:(?:эта|данная|ваша|наша)\s+)?платформ\w*/iu,"
          new_patterns = r"""  /^(?:как\s+работает|как\s+устроен\w*|что\s+такое|для\s+чего|зачем|чем\s+помогает|опиши(?:те)?|расскажи(?:те)?)\s+(?:(?:эта|данная|ваша|наша)\s+)?(?:платформа|система)\s*[?!.]*$/iu,
  /^(?:(?:how\s+(?:does|is))|(?:what\s+(?:is|does))|why\s+does|describe|explain)\s+(?:(?:this|your|the|our)\s+)?(?:platform|system)(?:\s+(?:work|operate|function|structured|help|do))?\s*[?!.]*$/iu,
  /^(?:这个|该|本|你们的|我们的)?(?:平台|系统)(?:如何)?(?:运作|运行|工作|构成|使用|是什么|有什么用)[？?!！。]*$/iu,"""
          if old_pattern not in route:
              raise SystemExit('expected generic matcher not found')
          route_path.write_text(route.replace(old_pattern, new_patterns, 1))

          test_path = Path('apps/web/tests/unit/platformV7RestrictedPublicQwenRoute.test.ts')
          tests = test_path.read_text()
          start_marker = "  it('routes generic platform wording through verified grounding and publishes a source', async () => {"
          end_marker = "  it('routes greetings and broad agriculture questions to general-agro generation without fake citations', async () => {"
          start = tests.find(start_marker)
          end = tests.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('expected platform routing test block not found')
          replacement = r"""  it.each([
    ['Как работает платформа?', 'Платформа ведёт Сделку по контролируемому маршруту от условий до закрытия.'],
    ['How does the platform work?', 'The platform guides a Deal through a controlled execution route.'],
    ['平台如何运作？', '平台按照受控流程推进交易直至完成。'],
  ])('routes current-platform wording through verified grounding: %s', async (question, answer) => {
    const fetchMock = vi.fn(async (_url: unknown, init: RequestInit) => {
      const body = JSON.parse(String(init.body));
      expect(body).toMatchObject({
        originalQuestion: question,
        answerMode: 'verified_platform',
        currentDataRequired: false,
      });
      return modelResponse(answer);
    });
    Object.defineProperty(globalThis, 'fetch', { configurable: true, writable: true, value: fetchMock });

    const { POST } = await loadRoute();
    const frames = parseFrames(await (await POST(request(question))).text());

    expect(fetchMock).toHaveBeenCalledTimes(1);
    expect(frames.map((frame) => frame.event)).toEqual(['meta', 'citation', 'token', 'assessment', 'done']);
    expect(frames[1]).toMatchObject({ event: 'citation' });
    expect(JSON.parse(String(frames[3].summary))).toMatchObject({ answerMode: 'verified_platform' });
    for (const frame of frames) expect(validateFrame(frame, 'public').ok).toBe(true);
  });

  it.each([
    'Как работает платформа Госуслуги?',
    'How does the SAP platform work?',
  ])('does not attach Transparent Price grounding to a named external platform: %s', async (question) => {
    const fetchMock = vi.fn(async () => modelResponse('Это другая внешняя платформа.'));
    Object.defineProperty(globalThis, 'fetch', { configurable: true, writable: true, value: fetchMock });

    const { POST } = await loadRoute();
    const frames = parseFrames(await (await POST(request(question))).text());

    expect(frames.some((frame) => frame.event === 'citation')).toBe(false);
    const assessment = frames.find((frame) => frame.event === 'assessment');
    if (assessment) expect(JSON.parse(String(assessment.summary))).not.toMatchObject({ answerMode: 'verified_platform' });
    for (const frame of frames) expect(validateFrame(frame, 'public').ok).toBe(true);
  });

"""
          test_path.write_text(tests[:start] + replacement + tests[end:])
          PY

          pnpm --filter web exec vitest run tests/unit/platformV7RestrictedPublicQwenRoute.test.ts
          pnpm --filter web typecheck
          git diff --check

          rm -f .github/workflows/_temporary-finish-public-ai-pr-3439.yml
          git add \
            apps/web/app/api/restricted-public-platform-assistant/route.ts \
            apps/web/tests/unit/platformV7RestrictedPublicQwenRoute.test.ts \
            .github/workflows/_temporary-finish-public-ai-pr-3439.yml
          git commit -m 'TAI: restrict generic platform grounding to current product'
          git push origin HEAD:fix/public-ai-friendly-agro-expert
