name: Temporary apply PC-CROP-10C hardening

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-pc10c-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact hardening and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/temp-pc10c-migration.py
          python3 .github/scripts/temp-pc10c-repository.py
          python3 .github/scripts/temp-pc10c-e2e.py
          python3 .github/scripts/temp-pc10c-workflow.py
          python3 .github/scripts/temp-pc10c-verifier.py
          rm -f \
            .github/scripts/temp-pc10c-migration.py \
            .github/scripts/temp-pc10c-repository.py \
            .github/scripts/temp-pc10c-e2e.py \
            .github/scripts/temp-pc10c-workflow.py \
            .github/scripts/temp-pc10c-verifier.py \
            .github/workflows/temp-pc10c-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PC-CROP-10C: harden replay, RLS and denial evidence'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
