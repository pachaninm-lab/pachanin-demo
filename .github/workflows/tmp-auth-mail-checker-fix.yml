name: Temporary auth-mail checker fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-auth-mail-checker-fix.yml'
      - 'scripts/check-production-full-stack-release.mjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/industrial-auth-mail-outbox-3785
          fetch-depth: 0

      - name: Replace rollback-blind mail-secret regex
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-production-full-stack-release.mjs')
          source = path.read_text(encoding='utf-8')
          old = "  /web:[\\s\\S]{0,500}(?:PC_SMTP_PASS|RESEND_API_KEY|PASSWORD_RESET_DELIVERY_KEY|REGISTRATION_DELIVERY_KEY)/,\n"
          marker = "forbid('executor', [\n"
          guard = """const executorSource = text.executor ?? '';
          const authMailBlockStart = executorSource.indexOf('    auth-mail)');
          const authMailBlockEnd = authMailBlockStart >= 0 ? executorSource.indexOf('\\n      ;;', authMailBlockStart) : -1;
          if (authMailBlockStart < 0 || authMailBlockEnd <= authMailBlockStart) {
            failures.push(`${paths.executor}: auth-mail target override block missing`);
          } else {
            const authMailTargetBlock = executorSource.slice(authMailBlockStart, authMailBlockEnd);
            for (const forbidden of ['PC_SMTP_PASS', 'RESEND_API_KEY', 'PASSWORD_RESET_DELIVERY_KEY', 'REGISTRATION_DELIVERY_KEY']) {
              if (authMailTargetBlock.includes(forbidden)) failures.push(`${paths.executor}: auth-mail target override contains forbidden mail authority ${forbidden}`);
            }
          }

          """

          if old in source:
              if source.count(old) != 1:
                  raise SystemExit('expected exactly one rollback-blind regex')
              if source.count(marker) != 1:
                  raise SystemExit('expected exactly one executor forbid marker')
              source = source.replace(old, '', 1)
              source = source.replace(marker, guard + marker, 1)
              path.write_text(source, encoding='utf-8')
          elif 'const authMailBlockStart = executorSource.indexOf' not in source:
              raise SystemExit('checker is neither old nor already fixed')
          PY

          node scripts/check-production-full-stack-release.mjs
          git diff --check

      - name: Commit checker fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/check-production-full-stack-release.mjs; then
            echo 'CHECKER_FIX=ALREADY_APPLIED'
            exit 0
          fi
          git config user.name 'pc-crop-auth-mail-checker'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/check-production-full-stack-release.mjs
          git commit -m 'fix(auth-mail): scope target secret boundary check'
          git push origin HEAD:p0/industrial-auth-mail-outbox-3785
