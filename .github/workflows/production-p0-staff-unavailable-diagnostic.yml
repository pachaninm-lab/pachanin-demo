name: Production P0 Staff Unavailable Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-staff-unavailable-diagnostic.yml'
      - 'scripts/production-p0-staff-unavailable-diagnostic.sh'
      - 'scripts/check-production-p0-staff-unavailable-diagnostic.mjs'
      - 'docs/platform-v7/autopilot/scopes/p0-staff-unavailable-diagnostic-4556.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-staff-unavailable-diagnostic.yml'
      - 'scripts/production-p0-staff-unavailable-diagnostic.sh'
      - 'scripts/check-production-p0-staff-unavailable-diagnostic.mjs'
      - 'docs/platform-v7/autopilot/scopes/p0-staff-unavailable-diagnostic-4556.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-staff-unavailable-diagnostic
  cancel-in-progress: false

jobs:
  contract:
    name: Validate staff unavailable diagnostic contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-staff-unavailable-diagnose deployed-runtime'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/check-production-p0-staff-unavailable-diagnostic.mjs
      - run: bash -n scripts/production-p0-staff-unavailable-diagnostic.sh

  diagnose:
    name: Read-only REG.RU staff unavailable classification
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-staff-unavailable-diagnose deployed-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify staff-control unavailable state without mutation
        shell: bash
        run: bash scripts/production-p0-staff-unavailable-diagnostic.sh
