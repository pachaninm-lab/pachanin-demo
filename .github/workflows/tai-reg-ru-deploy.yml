name: TAI REG.RU Deployment

on:
  pull_request:
    paths:
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - "scripts/pc-tai-release-controller.sh"
      - "scripts/tai-reg-ru-deploy.sh"
      - "scripts/tai-reg-ru-preflight.sh"
      - "scripts/check-tai-reg-ru-deploy.mjs"
      - "scripts/check-pc-tai-release-controller.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "apps/tai/TAI_REG_RU_DEPLOY.md"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-least-privilege-controller-20260731.json"
  workflow_run:
    workflows: ["TAI Restricted Qwen REG.RU Activation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY-TAI-REG-RU
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tai-reg-ru-deployment
  cancel-in-progress: false

jobs:
  materialize_postgres_authority_fix:
    name: Materialize PostgreSQL service authority repair
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'fix/tai-postgres-service-authority-20260801' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tai-postgres-service-authority-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate exact source repair
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          deploy_path = Path('scripts/tai-reg-ru-deploy.sh')
          deploy = deploy_path.read_text(encoding='utf-8')
          old = '''services = cfg.get("services") or {}
db = []
for name, service in services.items():
    image = str(service.get("image") or "")
    if re.search(r"(^|[-_])(postgres|postgresql)([-_]|$)", name, re.I) or "postgres" in image.lower():
        db.append(name)
if len(db) != 1:
    raise SystemExit("POSTGRES_SERVICE_AUTHORITY_AMBIGUOUS")
'''
          new = '''services = cfg.get("services") or {}
db = []
persistent_data_target = "/var/lib/postgresql/data"
one_shot_pattern = re.compile(
    r"(^|[-_])(provision|init|migrate|migration|seed|backup|restore)([-_]|$)",
    re.I,
)
for name, service in services.items():
    image = str(service.get("image") or "")
    targets = set()
    for mount in service.get("volumes") or []:
        if isinstance(mount, dict):
            target = str(mount.get("target") or "")
            if target:
                targets.add(target)
        elif isinstance(mount, str):
            parts = mount.split(":")
            if len(parts) >= 2:
                targets.add(parts[1])
    name_candidate = bool(
        re.search(r"(^|[-_])(postgres|postgresql)([-_]|$)", name, re.I)
    )
    postgres_image = bool(
        re.search(r"(^|/)postgres(?=[:@]|$)", image.lower())
    )
    one_shot = bool(one_shot_pattern.search(name))
    persistent_postgres = postgres_image and persistent_data_target in targets
    if not one_shot and (name_candidate or persistent_postgres):
        db.append(name)
if len(db) != 1:
    raise SystemExit(
        "POSTGRES_SERVICE_AUTHORITY_AMBIGUOUS:" + ",".join(sorted(db))
    )
'''
          if old in deploy:
              deploy = deploy.replace(old, new, 1)
              deploy_path.write_text(deploy, encoding='utf-8')
          elif new not in deploy:
              raise SystemExit('PostgreSQL selector source block mismatch')

          check_path = Path('scripts/check-tai-reg-ru-deploy.mjs')
          check = check_path.read_text(encoding='utf-8')
          old_tokens = """  'permanentModelAdmissionStatus','FORWARD_ONLY_IDEMPOTENT','tai-agro-os-master-spec-v4.0',
]) requireFragment(deploy,fragment,deployPath);"""
          new_tokens = """  'permanentModelAdmissionStatus','FORWARD_ONLY_IDEMPOTENT','tai-agro-os-master-spec-v4.0',
  'persistent_data_target = "/var/lib/postgresql/data"','one_shot_pattern = re.compile(',
  'postgres_image = bool(','persistent_postgres = postgres_image and persistent_data_target in targets',
]) requireFragment(deploy,fragment,deployPath);"""
          if old_tokens in check:
              check = check.replace(old_tokens, new_tokens, 1)
          elif new_tokens not in check:
              raise SystemExit('Deployment contract token block mismatch')

          anchor = "forbid(deploy,/INSERT\\s+INTO\\s+(?:public[.])?tai_model_admission_decisions/iu,`${deployPath}: fabricated permanent model admission is forbidden`);\n"
          guard = "forbid(deploy,/\\\"postgres\\\"\\s+in\\s+image[.]lower\\(\\)/u,`${deployPath}: broad PostgreSQL image substring selector is forbidden`);\n"
          if guard not in check:
              if anchor not in check:
                  raise SystemExit('Deployment contract forbid anchor mismatch')
              check = check.replace(anchor, anchor + guard, 1)
          check_path.write_text(check, encoding='utf-8')
          PY

          bash -n scripts/tai-reg-ru-deploy.sh
          node scripts/check-tai-reg-ru-deploy.mjs
          python3 - <<'PY'
          import re

          services = {
              'postgres': {
                  'image': 'postgres:16',
                  'volumes': [
                      {
                          'type': 'volume',
                          'source': 'postgres_data',
                          'target': '/var/lib/postgresql/data',
                      }
                  ],
              },
              'provision': {'image': 'postgres:16', 'volumes': []},
              'pgbouncer': {'image': 'edoburu/pgbouncer:latest', 'volumes': []},
          }
          persistent_data_target = '/var/lib/postgresql/data'
          one_shot_pattern = re.compile(
              r'(^|[-_])(provision|init|migrate|migration|seed|backup|restore)([-_]|$)',
              re.I,
          )
          selected = []
          for name, service in services.items():
              image = str(service.get('image') or '')
              targets = {
                  str(mount.get('target') or '')
                  for mount in service.get('volumes') or []
                  if isinstance(mount, dict)
              }
              name_candidate = bool(
                  re.search(r'(^|[-_])(postgres|postgresql)([-_]|$)', name, re.I)
              )
              postgres_image = bool(
                  re.search(r'(^|/)postgres(?=[:@]|$)', image.lower())
              )
              one_shot = bool(one_shot_pattern.search(name))
              persistent_postgres = (
                  postgres_image and persistent_data_target in targets
              )
              if not one_shot and (name_candidate or persistent_postgres):
                  selected.append(name)
          assert selected == ['postgres'], selected
          PY
          git diff --check

      - name: Publish source-only commit and restore workflow authority
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/tai-reg-ru-deploy.yml
          rm -f \
            .github/workflows/tai-postgres-authority-pr-trigger.yml \
            .github/workflows/tai-postgres-authority-fix-materialize.yml \
            .github/workflows/tai-reg-ru-runner-resume-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tai): disambiguate PostgreSQL service authority'
          git push origin HEAD:fix/tai-postgres-service-authority-20260801

  contract:
    name: Least-privilege deployment contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment authority
        run: |
          bash -n scripts/pc-tai-release-controller.sh
          bash -n scripts/tai-reg-ru-deploy.sh
          bash -n scripts/tai-reg-ru-preflight.sh
          node scripts/check-pc-tai-release-controller.mjs
          node scripts/check-tai-reg-ru-deploy.mjs

  image_authority:
    name: Exact-main rootless TAI image authority
    needs: contract
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'DEPLOY-TAI-REG-RU'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
      reference: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact current main
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify canonical exact-SHA rootless TAI image outside production
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/pachaninm-lab/grainflow-tai:sha-${SHORT_SHA}"
          ready=0
          for attempt in $(seq 1 90); do
            if docker pull "$image" >/dev/null 2>&1; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
              user="$(docker image inspect --format '{{.Config.User}}' "$image")"
              digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
              if [[ "$revision" == "$TARGET_SHA" && "$user" == '65532:65532' && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]; then ready=1; break; fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo 'Exact rootless TAI image is unavailable or invalid.' >&2; exit 2; }
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Remove hosted registry session
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  deploy:
    name: Deploy through protected REG.RU controller
    needs: image_authority
    if: needs.image_authority.result == 'success'
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    permissions:
      contents: read
      packages: none
      statuses: none
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
      TARGET_SHORT: ${{ needs.image_authority.outputs.target_short }}
      TAI_IMAGE: ${{ needs.image_authority.outputs.reference }}
      TAI_DIGEST: ${{ needs.image_authority.outputs.digest }}
      MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
      MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
    steps:
      - name: Verify direct production authority is absent
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == pc-prod-* ]]
          [[ "$(id -u)" -ne 0 ]]
          ! id -nG | tr ' ' '\n' | grep -Fxq docker
          if docker version >/dev/null 2>&1; then exit 21; fi
          sudo -n -l | grep -Fq '/usr/local/sbin/pc-tai-release-controller'
      - name: Prepare protected model evidence input
        run: |
          set -Eeuo pipefail
          input="/var/lib/pc-release-authority/runner-input/${GITHUB_RUN_ID}"
          rm -rf "$input"
          install -d -m 0700 "$input"
          [[ "$(stat -c '%U:%G:%a' "$input")" == pcactions:pcactions:700 ]]
          printf '%s' "${MODEL_USER_SECRET:-root}" > "$input/model-user"
          printf '%s' "${MODEL_PORT_SECRET:-22}" > "$input/model-port"
          chmod 0600 "$input/model-user" "$input/model-port"
      - name: Execute protected exact-main deployment and postflight
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/pc-tai-release-controller deploy "$TARGET_SHA" "$GITHUB_RUN_ID" "$TAI_IMAGE" "$TAI_DIGEST"
      - name: Upload exact-main deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-reg-ru-deployment-${{ env.TARGET_SHORT }}-${{ github.run_id }}
          path: |
            /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/predeploy.json
            /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/deployment.json
            /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/postdeploy.json
          if-no-files-found: error
          retention-days: 30

  publish_status:
    name: Publish TAI REG.RU deployment status
    needs: [image_authority, deploy]
    if: always() && needs.image_authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish exact-main deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -Eeuo pipefail
          state=failure; description='TAI REG.RU deployment failed or rolled back'
          if [[ "$DEPLOY_RESULT" == success ]]; then state=success; description='Standalone TAI REG.RU deployment PASS'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" -f context='TAI REG.RU Deployment' -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$state" == success ]]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state='success' -f context='TAI REG.RU Preflight' -f description='TAI REG.RU post-deployment preflight PASS' \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
