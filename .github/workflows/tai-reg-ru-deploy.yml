name: TAI REG.RU Deployment

on:
  pull_request:
    paths:
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - "scripts/tai-reg-ru-deploy.sh"
      - "scripts/tai-reg-ru-preflight.sh"
      - "scripts/check-tai-reg-ru-deploy.mjs"
      - "scripts/check-tai-reg-ru-preflight.mjs"
      - "scripts/check-tai-reg-ru-local-runner.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "apps/tai/TAI_REG_RU_DEPLOY.md"
      - "apps/tai/TAI_REG_RU_PREFLIGHT.md"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-local-runner-authority-20260731.json"
  workflow_run:
    workflows: ["TAI Restricted Qwen REG.RU Activation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY-TAI-REG-RU
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tai-reg-ru-deployment
  cancel-in-progress: false

jobs:
  contract:
    name: Fail-closed deployment contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment authority
        run: |
          bash -n scripts/tai-reg-ru-deploy.sh
          bash -n scripts/tai-reg-ru-preflight.sh
          node scripts/check-tai-reg-ru-deploy.mjs
          node scripts/check-tai-reg-ru-preflight.mjs
          node scripts/check-tai-reg-ru-local-runner.mjs

  image-authority:
    name: Verify exact-main rootless TAI image
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'DEPLOY-TAI-REG-RU'
      )
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      reference: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
    steps:
      - name: Resolve exact target metadata
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify canonical exact-SHA rootless TAI image outside production
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/pachaninm-lab/grainflow-tai:sha-${SHORT_SHA}"
          ready=0
          for attempt in $(seq 1 90); do
            if docker pull "$image" >/dev/null 2>&1; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
              user="$(docker image inspect --format '{{.Config.User}}' "$image")"
              digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
              if [[ "$revision" == "$TARGET_SHA" && "$user" == '65532:65532' && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]; then ready=1; break; fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo 'Exact rootless TAI image is unavailable or invalid.' >&2; exit 2; }
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Exact-main standalone TAI on local REG.RU authority
    if: needs.image-authority.result == 'success'
    needs: [contract, image-authority]
    runs-on: [self-hosted, linux, x64, pc-prod, tai-release]
    permissions:
      contents: read
      packages: none
      statuses: none
    timeout-minutes: 90
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Resolve exact target
        id: target
        env:
          TARGET_SHA: ${{ needs.image-authority.outputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]]
          git checkout --detach "$TARGET_SHA"
          [[ "$TARGET_SHA" == "$(git rev-parse HEAD)" ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify local root release authority
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == pc-prod-* && "$(id -u)" -eq 0 ]]
          [[ -S /var/run/docker.sock ]]
          docker version >/dev/null
          docker compose version >/dev/null
          python3 - <<'PY'
          import json
          m=json.load(open('/etc/pc-release-authority/actions-runner.json',encoding='utf-8'))
          assert m['transport']=='OUTBOUND_ONLY_HTTPS' and m['executionUser']=='root'
          PY
      - name: Execute strict local read-only pre-deployment inventory
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TAI_IMAGE: ${{ needs.image-authority.outputs.reference }}
          TAI_DIGEST: ${{ needs.image-authority.outputs.digest }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-predeploy.json"
          bash scripts/tai-reg-ru-preflight.sh "$TARGET_SHA" "$TAI_IMAGE" "$TAI_DIGEST" > "$report"
          chmod 0600 "$report"
          python3 - "$report" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); blockers=set(r.get('blockers') or [])
          allowed={'TAI_SERVICE_NOT_MATERIALIZED','TAI_DEDICATED_ENV_NOT_MATERIALIZED','TAI_DEDICATED_DB_PRINCIPAL_NOT_ATTESTED'}
          if r.get('schemaVersion')!='tai.reg-ru.preflight.v1' or not blockers.issubset(allowed):
              raise SystemExit(f'unexpected pre-deployment blockers: {sorted(blockers)}')
          PY
      - name: Recover active private model token from local API without disclosure
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          mapfile -t api_ids < <(docker ps -q --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} == 1 ))
          api_id="${api_ids[0]}"
          mapfile -t keys < <(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$api_id" | sed -n 's/^AI_ASSISTANT_API_KEY=//p')
          mapfile -t bases < <(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$api_id" | sed -n 's/^AI_ASSISTANT_BASE_URL=//p')
          mapfile -t models < <(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$api_id" | sed -n 's/^AI_ASSISTANT_MODEL=//p')
          (( ${#keys[@]} == 1 && ${#bases[@]} == 1 && ${#models[@]} == 1 ))
          key="${keys[0]}"; base="${bases[0]}"; model="${models[0]}"
          [[ ${#key} -ge 32 && "$key" != *[[:space:]]* ]]
          [[ "$base" == 'http://192.168.0.206:18080/v1/' && "$model" == 'tai-qwen3-8b-q4km' ]]
          echo "::add-mask::$key"
          curl -fsS --connect-timeout 3 --max-time 15 -H "Authorization: Bearer $key" http://192.168.0.206:18080/health >/dev/null
          token_file="/tmp/tai-model-token-${RUN_ID}"
          printf '%s' "$key" > "$token_file"
          chmod 0600 "$token_file"
      - name: Deploy exact TAI image locally on existing REG.RU authority
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TAI_IMAGE: ${{ needs.image-authority.outputs.reference }}
          TAI_DIGEST: ${{ needs.image-authority.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          raw="$RUNNER_TEMP/tai-reg-ru-deploy.log"
          set +e
          bash scripts/tai-reg-ru-deploy.sh "$TARGET_SHA" "$TAI_IMAGE" "$TAI_DIGEST" "$RUN_ID" "/tmp/tai-model-token-${RUN_ID}" > "$raw" 2>&1
          rc=$?
          set -e
          sed -E 's#postgres(ql)?://[^[:space:]@]+@#postgresql://[REDACTED]@#g; /TOKEN|SECRET|PASSWORD|DATABASE_URL/ s#=.*#=[REDACTED]#' "$raw"
          grep -Fxq 'TAI_REG_RU_DEPLOYMENT_COMPLETE=1' "$raw"
          (( rc == 0 ))
      - name: Collect redacted local deployment evidence
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/tai-reg-ru-deployment.json"
          install -m 0600 "/var/lib/pc-release-authority/tai-agro-os-${RUN_ID}/evidence.json" "$evidence"
          python3 - "$evidence" "$TARGET_SHA" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('schemaVersion')=='tai.reg-ru.deployment.v1' and r.get('targetSha')==sys.argv[2] and r.get('passed') is True
          assert r.get('publicPorts')==[] and r.get('rootlessUid')==65532
          p=r.get('databasePrincipal') or {}
          assert p.get('nonTaiTableGrantCount')==0 and p.get('inherit') is False
          assert (r.get('inference') or {}).get('preparedActionCount')==0
          PY
      - name: Execute strict local post-deployment preflight
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TAI_IMAGE: ${{ needs.image-authority.outputs.reference }}
          TAI_DIGEST: ${{ needs.image-authority.outputs.digest }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/tai-reg-ru-postdeploy.json"
          bash scripts/tai-reg-ru-preflight.sh "$TARGET_SHA" "$TAI_IMAGE" "$TAI_DIGEST" > "$report"
          chmod 0600 "$report"
          python3 - "$report" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if r.get('passed') is not True or r.get('blockers'): raise SystemExit(f'post-deployment preflight blocked: {r.get("blockers")}')
          PY
      - name: Upload exact-main deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-reg-ru-deployment-${{ steps.target.outputs.short }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tai-reg-ru-predeploy.json
            ${{ runner.temp }}/tai-reg-ru-deployment.json
            ${{ runner.temp }}/tai-reg-ru-postdeploy.json
          if-no-files-found: error
          retention-days: 30
      - name: Roll back failed local deployment acceptance
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          state="/var/lib/pc-release-authority/tai-agro-os-${RUN_ID}"
          if [[ -x "$state/rollback.sh" ]]; then
            "$state/rollback.sh"
          elif [[ -f "$state/MUTATION_STARTED" ]]; then
            echo INCOMPLETE_ROLLBACK_AUTHORITY >&2
            exit 73
          else
            echo TAI_ROLLBACK_NOT_REQUIRED
          fi
      - name: Remove transient local materials
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: rm -f "/tmp/tai-model-token-${RUN_ID}" "$RUNNER_TEMP/tai-reg-ru-deploy.log" "$RUNNER_TEMP/tai-reg-ru-predeploy.json" "$RUNNER_TEMP/tai-reg-ru-deployment.json" "$RUNNER_TEMP/tai-reg-ru-postdeploy.json"

  publish-status:
    name: Publish TAI REG.RU deployment status
    if: always() && needs.deploy.outputs.target_sha != ''
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish exact-main deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.deploy.outputs.target_sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -Eeuo pipefail
          state=failure; description='TAI REG.RU deployment failed or rolled back'
          if [[ "$DEPLOY_RESULT" == success ]]; then state=success; description='Standalone TAI REG.RU deployment PASS'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -f state="$state" -f context='TAI REG.RU Deployment' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
