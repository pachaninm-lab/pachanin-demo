name: TAI REG.RU Deployment

on:
  pull_request:
    paths:
      - ".github/workflows/tai-reg-ru-deploy.yml"
      - ".github/workflows/tai-reg-ru-preflight.yml"
      - ".github/workflows/tai-restricted-qwen-reg-ru-activation.yml"
      - "scripts/pc-tai-release-controller.sh"
      - "scripts/tai-reg-ru-deploy.sh"
      - "scripts/tai-reg-ru-preflight.sh"
      - "scripts/check-tai-reg-ru-deploy.mjs"
      - "scripts/check-pc-tai-release-controller.mjs"
      - "scripts/check-tai-reg-ru-release-chain.mjs"
      - "scripts/verify-tai-upstream-workflow-jobs.mjs"
      - "scripts/install-pc-prod-actions-runner.sh"
      - "apps/tai/TAI_REG_RU_DEPLOY.md"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-least-privilege-controller-20260731.json"
      - "docs/platform-v7/autopilot/scopes/tai-reg-ru-release-chain-gate-20260801.json"
  workflow_run:
    workflows: ["TAI Restricted Qwen REG.RU Activation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY-TAI-REG-RU
        required: true
        type: string
      upstream_run_id:
        description: Exact successful restricted Qwen activation run ID
        required: true
        type: string
      upstream_run_attempt:
        description: Exact successful restricted Qwen activation run attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tai-reg-ru-deployment
  cancel-in-progress: false

jobs:
  upstream_activation_gate:
    name: Require exact-run restricted Qwen activation PASS
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Reject an untrusted upstream repository before checkout
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -Eeuo pipefail
          [[ "$UPSTREAM_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify exact-attempt activation job authority
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || inputs.upstream_run_id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.upstream_run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then exit 0; fi
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ "$UPSTREAM_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
            [[ "$UPSTREAM_CONCLUSION" == success ]]
            [[ "$UPSTREAM_BRANCH" == main ]]
          else
            [[ "$EVENT_NAME" == workflow_dispatch ]]
            [[ "$CURRENT_REF" == refs/heads/main ]]
            [[ "$ACTOR" == "$OWNER" ]]
            [[ "$TRIGGERING_ACTOR" == "$OWNER" ]]
            [[ "$CONFIRMATION" == DEPLOY-TAI-REG-RU ]]
          fi
          [[ "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$UPSTREAM_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}" > "$RUNNER_TEMP/activation-run.json"
          node scripts/verify-tai-upstream-workflow-jobs.mjs --run "$RUNNER_TEMP/activation-run.json" \
            "$TARGET_SHA" "$UPSTREAM_RUN_ATTEMPT" 'TAI Restricted Qwen REG.RU Activation' "$GITHUB_REPOSITORY"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/attempts/${UPSTREAM_RUN_ATTEMPT}/jobs?per_page=100" \
            > "$RUNNER_TEMP/activation-jobs.json"
          node scripts/verify-tai-upstream-workflow-jobs.mjs --jobs "$RUNNER_TEMP/activation-jobs.json" \
            'Require exact-run REG.RU preflight completion' \
            'Least-privilege activation contract' \
            'Exact-main API, web and migration image authority' \
            'Activate through protected REG.RU controller' \
            'Hosted live public AI acceptance' \
            'Finalize or roll back activation' \
            'Publish restricted Qwen activation result' \
            'Confirm restricted Qwen activation chain result'

  contract:
    name: Least-privilege deployment contract
    needs: upstream_activation_gate
    if: needs.upstream_activation_gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment authority
        run: |
          bash -n scripts/pc-tai-release-controller.sh
          bash -n scripts/tai-reg-ru-deploy.sh
          bash -n scripts/tai-reg-ru-preflight.sh
          node scripts/check-pc-tai-release-controller.mjs
          node scripts/check-tai-reg-ru-deploy.mjs
          node scripts/check-tai-reg-ru-release-chain.mjs

  image_authority:
    name: Exact-main rootless TAI image authority
    needs: contract
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        inputs.confirmation == 'DEPLOY-TAI-REG-RU'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_short: ${{ steps.target.outputs.short }}
      reference: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact current main
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Verify canonical exact-SHA rootless TAI image outside production
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SHORT_SHA: ${{ steps.target.outputs.short }}
        run: |
          set -Eeuo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/pachaninm-lab/grainflow-tai:sha-${SHORT_SHA}"
          ready=0
          for attempt in $(seq 1 90); do
            if docker pull "$image" >/dev/null 2>&1; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
              user="$(docker image inspect --format '{{.Config.User}}' "$image")"
              digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
              if [[ "$revision" == "$TARGET_SHA" && "$user" == '65532:65532' && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]; then ready=1; break; fi
            fi
            sleep 10
          done
          (( ready == 1 )) || { echo 'Exact rootless TAI image is unavailable or invalid.' >&2; exit 2; }
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Remove hosted registry session
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  deploy:
    name: Deploy through protected REG.RU controller
    needs: image_authority
    if: needs.image_authority.result == 'success'
    runs-on: [self-hosted, linux, x64, pc-prod, tai-readonly]
    permissions:
      contents: read
      packages: none
      statuses: none
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
      TARGET_SHORT: ${{ needs.image_authority.outputs.target_short }}
      TAI_IMAGE: ${{ needs.image_authority.outputs.reference }}
      TAI_DIGEST: ${{ needs.image_authority.outputs.digest }}
      MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
      MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
    steps:
      - name: Verify direct production authority is absent
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == pc-prod-* ]]
          [[ "$(id -u)" -ne 0 ]]
          ! id -nG | tr ' ' '\n' | grep -Fxq docker
          if docker version >/dev/null 2>&1; then exit 21; fi
          sudo -n -l | grep -Fq '/usr/local/sbin/pc-tai-release-controller'
      - name: Prepare protected model evidence input
        run: |
          set -Eeuo pipefail
          input="/var/lib/pc-release-authority/runner-input/${GITHUB_RUN_ID}"
          rm -rf "$input"
          install -d -m 0700 "$input"
          [[ "$(stat -c '%U:%G:%a' "$input")" == pcactions:pcactions:700 ]]
          printf '%s' "${MODEL_USER_SECRET:-root}" > "$input/model-user"
          printf '%s' "${MODEL_PORT_SECRET:-22}" > "$input/model-port"
          chmod 0600 "$input/model-user" "$input/model-port"
      - name: Execute protected exact-main deployment and postflight
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/pc-tai-release-controller deploy "$TARGET_SHA" "$GITHUB_RUN_ID" "$TAI_IMAGE" "$TAI_DIGEST"
      - name: Upload exact-main deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-reg-ru-deployment-${{ env.TARGET_SHORT }}-${{ github.run_id }}
          path: |
            /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/predeploy.json
            /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/deployment.json
            /var/lib/pc-release-authority/runner-output/${{ github.run_id }}/postdeploy.json
          if-no-files-found: error
          retention-days: 30

  publish_status:
    name: Publish TAI REG.RU deployment status
    needs: [image_authority, deploy]
    if: always() && needs.image_authority.outputs.target_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish exact-main deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.image_authority.outputs.target_sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -Eeuo pipefail
          state=failure; description='TAI REG.RU deployment failed or rolled back'
          if [[ "$DEPLOY_RESULT" == success ]]; then state=success; description='Standalone TAI REG.RU deployment PASS'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" -f context='TAI REG.RU Deployment' -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$state" == success ]]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state='success' -f context='TAI REG.RU Preflight' -f description='TAI REG.RU post-deployment preflight PASS' \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

  result_gate:
    name: Confirm standalone TAI deployment chain result
    needs: [upstream_activation_gate, contract, image_authority, deploy, publish_status]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject failed or skipped deployment jobs
        env:
          UPSTREAM_RESULT: ${{ needs.upstream_activation_gate.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          IMAGE_RESULT: ${{ needs.image_authority.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLISH_RESULT: ${{ needs.publish_status.result }}
        run: |
          set -Eeuo pipefail
          [[ "$UPSTREAM_RESULT" == success ]]
          [[ "$CONTRACT_RESULT" == success ]]
          [[ "$IMAGE_RESULT" == success ]]
          [[ "$DEPLOY_RESULT" == success ]]
          [[ "$PUBLISH_RESULT" == success ]]
