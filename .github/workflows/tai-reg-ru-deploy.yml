name: TAI REG.RU Deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tai-reg-ru-deploy.yml

permissions:
  contents: write

concurrency:
  group: tai-postgres-authority-source-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.head_ref == 'fix/tai-postgres-service-authority-20260801' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tai-postgres-service-authority-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate exact source repair
        env:
          PATCH_B64: ""
        run: |
          set -Eeuo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | python3
          bash -n scripts/tai-reg-ru-deploy.sh
          node scripts/check-tai-reg-ru-deploy.mjs
          git diff --check
      - name: Restore workflow and publish source-only commit
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/tai-reg-ru-deploy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tai): disambiguate PostgreSQL service authority'
          git push origin HEAD:fix/tai-postgres-service-authority-20260801
