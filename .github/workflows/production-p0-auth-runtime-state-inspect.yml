name: Production P0 Auth Runtime State Inspect

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-auth-runtime-state-inspect.yml'
      - 'docs/platform-v7/autopilot/scopes/production-p0-auth-runtime-state-inspect-3785.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  RELEASE_ISSUE_NUMBER: 3072
  EVIDENCE_DIR: artifacts/production-p0-auth-runtime-state-inspect

jobs:
  contract:
    name: Validate owner authority and read-only runtime-state contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-auth-runtime-state-inspect current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/platform-v7/autopilot/scopes/production-p0-auth-runtime-state-inspect-3785.json')
          data = json.loads(path.read_text())
          assert data['schemaVersion'] == 'platform-v7.concurrent-scope.v1'
          assert data['issue'] == 3785
          assert data['releaseIssue'] == 3072
          assert data['boundaries']['productionMutation'] == 'NONE'
          assert data['boundaries']['databaseMutation'] is False
          assert data['boundaries']['deploymentMutation'] is False
          assert data['boundaries']['credentialMutation'] is False
          assert data['boundaries']['rawEnvironmentOutput'] is False
          assert data['boundaries']['rawLogOutput'] is False
          assert data['boundaries']['ownerOnly'] is True
          assert data['boundaries']['exactMainGuard'] is True
          assert data['boundaries']['newRecurringCostRub'] == 0
          PY
      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  inspect:
    name: Inspect active REG.RU auth-mail runtime without disclosure
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != '' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-runtime-state-inspect current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
      SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
      SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
      SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
      SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
      SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact current-main checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Resolve protected root key and pinned REG.RU identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local value="$1"; value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"; printf '%s' "$value"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]
          [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"

          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" public_key
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            public_key="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$public_key" 2>/dev/null || { rm -f "$public_key"; return 1; }
            rm -f "$public_key"
          }
          try_slot(){
            local raw="$1" first second third
            [[ -n "$raw" ]] || return 1
            first="$(mktemp)"; second="$(mktemp)"; third="$(mktemp)"
            printf '%s\n' "$raw" > "$first"
            validate_key "$first" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$second"
            validate_key "$second" && { rm -f "$first" "$second" "$third"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$third" 2>/dev/null &&
              validate_key "$third" &&
              { rm -f "$first" "$second" "$third"; return 0; }
            rm -f "$first" "$second" "$third"
            return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" ||
            try_slot "${SSH_KEY_SECONDARY:-}" ||
            try_slot "${SSH_KEY_FALLBACK:-}" ||
            exit 14

          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$fingerprint" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$HOME/.ssh/known_hosts"
          rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$user@$host" \
            'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; docker version >/dev/null; echo ROOT_SSH_AUTH_OK' \
            > "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROOT_SSH_AUTH_OK "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Read only active runtime file state
        id: state
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]

          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$USER@$HOST" 'bash -s' <<'REMOTE' | tee "$EVIDENCE_DIR/state.txt"
          set -Eeuo pipefail
          [[ "$(id -u)" -eq 0 ]]
          command -v docker >/dev/null 2>&1
          command -v python3 >/dev/null 2>&1

          delivery_state='UNKNOWN'
          mail_state='UNKNOWN'

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          if (( ${#web_ids[@]} == 0 )); then
            printf '%s\n' 'AUTH_RUNTIME_STATE|COMPOSE=WEB_ZERO|DELIVERY=UNKNOWN|MAIL=UNKNOWN'
            printf '%s\n' 'PRODUCTION_MUTATION=NONE'
            exit 0
          fi
          if (( ${#web_ids[@]} != 1 )); then
            printf '%s\n' 'AUTH_RUNTIME_STATE|COMPOSE=WEB_MULTIPLE|DELIVERY=UNKNOWN|MAIL=UNKNOWN'
            printf '%s\n' 'PRODUCTION_MUTATION=NONE'
            exit 0
          fi

          active_dir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "${web_ids[0]}")"
          if [[ -z "$active_dir" || "$active_dir" != /* || "$active_dir" == / || ! -d "$active_dir" || -L "$active_dir" ]]; then
            printf '%s\n' 'AUTH_RUNTIME_STATE|COMPOSE=WORKING_DIR_INVALID|DELIVERY=UNKNOWN|MAIL=UNKNOWN'
            printf '%s\n' 'PRODUCTION_MUTATION=NONE'
            exit 0
          fi
          active_dir="$(realpath -e -- "$active_dir")"

          delivery="$active_dir/.pc-password-reset-delivery.env"
          mail="$active_dir/.pc-transactional-mail.env"

          classify_delivery() {
            local path="$1"
            [[ -e "$path" ]] || { printf '%s' 'MISSING'; return; }
            [[ ! -L "$path" ]] || { printf '%s' 'SYMLINK'; return; }
            [[ -f "$path" ]] || { printf '%s' 'NONFILE'; return; }
            [[ "$(stat -c '%a:%u:%g' "$path")" == '600:0:0' ]] || { printf '%s' 'PERMISSIONS_INVALID'; return; }
            if python3 - "$path" <<'PY' >/dev/null 2>&1
          import re
          import sys
          raw = open(sys.argv[1], encoding='utf-8').read()
          if not raw.endswith('\n') or '\r' in raw or '\0' in raw:
              raise SystemExit(1)
          lines = raw.rstrip('\n').split('\n')
          if len(lines) != 2:
              raise SystemExit(1)
          values = {}
          for line in lines:
              name, sep, value = line.partition('=')
              if not sep or name in values or not re.fullmatch(r'[A-Fa-f0-9]{96}', value):
                  raise SystemExit(1)
              values[name] = value
          if set(values) != {'PASSWORD_RESET_DELIVERY_KEY', 'REGISTRATION_DELIVERY_KEY'}:
              raise SystemExit(1)
          if values['PASSWORD_RESET_DELIVERY_KEY'] == values['REGISTRATION_DELIVERY_KEY']:
              raise SystemExit(1)
          PY
            then
              printf '%s' 'VALID'
            else
              printf '%s' 'CONTENT_INVALID'
            fi
          }

          classify_mail() {
            local path="$1" channel
            [[ -e "$path" ]] || { printf '%s' 'MISSING'; return; }
            [[ ! -L "$path" ]] || { printf '%s' 'SYMLINK'; return; }
            [[ -f "$path" ]] || { printf '%s' 'NONFILE'; return; }
            [[ "$(stat -c '%a:%u:%g' "$path")" == '600:0:0' ]] || { printf '%s' 'PERMISSIONS_INVALID'; return; }
            if channel="$(python3 - "$path" <<'PY'
          import re
          import sys
          raw = open(sys.argv[1], encoding='utf-8').read()
          if not raw.endswith('\n') or '\r' in raw or '\0' in raw:
              raise SystemExit(1)
          lines = raw.rstrip('\n').split('\n')
          if not 2 <= len(lines) <= 5:
              raise SystemExit(1)
          values = {}
          for line in lines:
              name, sep, value = line.partition('=')
              if not sep or name in values or not value or value != value.strip():
                  raise SystemExit(1)
              values[name] = value
          email = re.compile(r'^[^@\s]{1,64}@[^@\s]{1,189}$')
          if set(values) == {'RESEND_API_KEY', 'RESEND_FROM_EMAIL'}:
              if len(values['RESEND_API_KEY']) < 20 or len(values['RESEND_API_KEY']) > 512 or not email.fullmatch(values['RESEND_FROM_EMAIL']):
                  raise SystemExit(1)
              print('VALID_RESEND')
              raise SystemExit(0)
          required = {'PC_SMTP_HOST', 'PC_SMTP_USER', 'PC_SMTP_PASS'}
          allowed = required | {'PC_SMTP_PORT', 'PC_MAIL_FROM'}
          if not required.issubset(values) or not set(values).issubset(allowed):
              raise SystemExit(1)
          if not re.fullmatch(r'[A-Za-z0-9.-]{1,253}', values['PC_SMTP_HOST']):
              raise SystemExit(1)
          if len(values['PC_SMTP_USER']) > 254 or len(values['PC_SMTP_PASS']) > 512:
              raise SystemExit(1)
          port = values.get('PC_SMTP_PORT', '465')
          sender = values.get('PC_MAIL_FROM', values['PC_SMTP_USER'])
          if not port.isdigit() or not 1 <= int(port) <= 65535 or not email.fullmatch(sender):
              raise SystemExit(1)
          print('VALID_SMTP')
          PY
          )"; then
              [[ "$channel" =~ ^VALID_(RESEND|SMTP)$ ]] && printf '%s' "$channel" || printf '%s' 'CONTENT_INVALID'
            else
              printf '%s' 'CONTENT_INVALID'
            fi
          }

          delivery_state="$(classify_delivery "$delivery")"
          mail_state="$(classify_mail "$mail")"
          [[ "$delivery_state" =~ ^(MISSING|SYMLINK|NONFILE|PERMISSIONS_INVALID|CONTENT_INVALID|VALID)$ ]]
          [[ "$mail_state" =~ ^(MISSING|SYMLINK|NONFILE|PERMISSIONS_INVALID|CONTENT_INVALID|VALID_RESEND|VALID_SMTP)$ ]]

          printf 'AUTH_RUNTIME_STATE|COMPOSE=OK|DELIVERY=%s|MAIL=%s\n' "$delivery_state" "$mail_state"
          printf '%s\n' 'PRODUCTION_MUTATION=NONE'
          REMOTE

          state_marker="$(grep '^AUTH_RUNTIME_STATE|' "$EVIDENCE_DIR/state.txt" | tail -n1)"
          mutation_marker="$(grep '^PRODUCTION_MUTATION=' "$EVIDENCE_DIR/state.txt" | tail -n1)"
          [[ "$state_marker" =~ ^AUTH_RUNTIME_STATE\|COMPOSE=(OK|WEB_ZERO|WEB_MULTIPLE|WORKING_DIR_INVALID)\|DELIVERY=(UNKNOWN|MISSING|SYMLINK|NONFILE|PERMISSIONS_INVALID|CONTENT_INVALID|VALID)\|MAIL=(UNKNOWN|MISSING|SYMLINK|NONFILE|PERMISSIONS_INVALID|CONTENT_INVALID|VALID_RESEND|VALID_SMTP)$ ]]
          [[ "$mutation_marker" == 'PRODUCTION_MUTATION=NONE' ]]
          echo "state=$state_marker" >> "$GITHUB_OUTPUT"

      - name: Publish bounded state
        env:
          STATE: ${{ steps.state.outputs.state }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          IFS='|' read -r tag compose_part delivery_part mail_part <<< "$STATE"
          [[ "$tag" == AUTH_RUNTIME_STATE ]]
          compose="${compose_part#COMPOSE=}"
          delivery="${delivery_part#DELIVERY=}"
          mail="${mail_part#MAIL=}"

          next='AUTH_RUNTIME_REPAIR_REQUIRED'
          if [[ "$compose" != OK ]]; then
            next='COMPOSE_AUTHORITY_REPAIR_REQUIRED'
          elif [[ "$mail" =~ ^VALID_(RESEND|SMTP)$ && "$delivery" == MISSING ]]; then
            next='AUTODISCOVERY_BOOTSTRAP_ELIGIBLE'
          elif [[ "$mail" =~ ^VALID_(RESEND|SMTP)$ && "$delivery" == VALID ]]; then
            next='AUTH_RUNTIME_PAIR_READY'
          elif [[ "$mail" == MISSING ]]; then
            next='TRANSACTIONAL_MAIL_RUNTIME_MISSING'
          fi

          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production P0 auth-runtime state inspect

          - exact main: \`$TARGET_SHA\`
          - result: \`PASS_READ_ONLY\`
          - Compose authority: \`$compose\`
          - password-reset delivery runtime: \`$delivery\`
          - transactional-mail runtime: \`$mail\`
          - production mutation: \`NONE\`
          - next: \`$next\`
          - raw paths, environment values, credentials and logs: \`NOT_PUBLISHED\`" >/dev/null

      - name: Remove local SSH credential
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Upload bounded state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-auth-runtime-state-inspect-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 90
