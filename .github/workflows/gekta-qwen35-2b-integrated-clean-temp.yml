name: Gekta Qwen3.5 2B Clean Integrated TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gekta-qwen35-2b-integrated-clean-temp.yml"
      - "apps/api/src/modules/ai-insights/qwen35-2b-integrated-temp.ts"

permissions:
  contents: read

concurrency:
  group: gekta-qwen35-2b-integrated-clean-temp
  cancel-in-progress: true

jobs:
  integrated:
    name: Qwen3.5-2B through real Gekta guards
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify exact accepted production main
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='06f686d52247ebe7805f1b75d937b2ca8daf8f6f'
          actual="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          echo "QWEN35_2B_MAIN_EXACT=$actual"

      - name: Install API dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --filter @pc/api...

      - name: Build exact production llama.cpp
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          git checkout --detach aedb2a5e9ca3d4064148bbb919e0ddc0c1b70ab3
          grep -Fq 'LLM_ARCH_QWEN35' src/llama-arch.h
          cmake -S . -B build -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --target llama-server -j"$(nproc)"
          build/bin/llama-server --version 2>&1 | grep -qi aedb2a5

      - name: Download pinned Qwen3.5-2B
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 1800             -o /tmp/qwen35-2b.gguf             'https://huggingface.co/bartowski/Qwen_Qwen3.5-2B-GGUF/resolve/7d26695454df6de5fbcce2e58681e62dae06ce43/Qwen_Qwen3.5-2B-Q4_K_M.gguf'
          [[ "$(stat -c %s /tmp/qwen35-2b.gguf)" == "1396198496" ]]
          echo '57a1085840f497d764a7fc5d346922dbde961efb54cc792ea81d694fd846a1d8  /tmp/qwen35-2b.gguf' | sha256sum -c -

      - name: Start isolated Qwen3.5-2B
        shell: bash
        run: |
          set -Eeuo pipefail
          /tmp/llama.cpp/build/bin/llama-server             --model /tmp/qwen35-2b.gguf             --alias tai-qwen35-2b-q4km             --host 127.0.0.1 --port 18084             --ctx-size 8192 --parallel 1             --threads "$(nproc)" --threads-batch "$(nproc)"             --batch-size 512 --ubatch-size 128             --api-key 'qwen35-2b-integrated-readonly-key-1234567890abcdef'             --metrics > /tmp/qwen35-2b.log 2>&1 &
          echo "$!" > /tmp/qwen35-2b.pid
          for _ in $(seq 1 180); do
            if curl -fsS -H 'Authorization: Bearer qwen35-2b-integrated-readonly-key-1234567890abcdef'               --max-time 2 http://127.0.0.1:18084/health | grep -q '"status":"ok"\|"status":"no slot available"'; then
              echo 'QWEN35_2B_CANDIDATE_READY=1'
              exit 0
            fi
            kill -0 "$(cat /tmp/qwen35-2b.pid)" 2>/dev/null || { tail -100 /tmp/qwen35-2b.log; exit 30; }
            sleep 1
          done
          exit 31

      - name: Run real Gekta guard acceptance
        shell: bash
        env:
          TAI_RESTRICTED_QWEN_PUBLIC_ENABLED: "true"
          AI_ASSISTANT_PROVIDER: openai-compatible
          AI_ASSISTANT_BASE_URL: http://127.0.0.1:18084/v1/
          AI_ASSISTANT_ALLOWED_HOSTS: 127.0.0.1
          AI_ASSISTANT_MODEL: tai-qwen35-2b-q4km
          AI_ASSISTANT_API_KEY: qwen35-2b-integrated-readonly-key-1234567890abcdef
          AI_ASSISTANT_TIMEOUT_MS: "120000"
          AI_ASSISTANT_MAX_TOKENS: "500"
        run: |
          set -Eeuo pipefail
          pnpm --filter @pc/api exec ts-node --transpile-only src/modules/ai-insights/qwen35-2b-integrated-temp.ts

      - name: Publish candidate metrics
        if: always()
        shell: bash
        run: |
          curl -fsS -H 'Authorization: Bearer qwen35-2b-integrated-readonly-key-1234567890abcdef'             http://127.0.0.1:18084/metrics             | grep -E 'llamacpp:(prompt_tokens_seconds|predicted_tokens_seconds)'             | tail -10 || true
          echo 'QWEN35_2B_PRODUCTION_MUTATION=NONE'

      - name: Stop candidate
        if: always()
        shell: bash
        run: |
          if [[ -s /tmp/qwen35-2b.pid ]]; then
            kill "$(cat /tmp/qwen35-2b.pid)" 2>/dev/null || true
            wait "$(cat /tmp/qwen35-2b.pid)" 2>/dev/null || true
          fi
