name: PC-CROP-07B Integration Control Tower Acceptance

on:
  pull_request:
    paths:
      - 'apps/api/src/modules/regulatory-integration/dto/regulatory-integration-control-tower.dto.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.command.service.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.controller.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.policy.spec.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.policy.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.postgresql.spec.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.redrive.repository.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.repository.spec.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.repository.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.reconciliation.repository.ts'
      - 'apps/web/app/api/platform-v7/integrations/**'
      - 'apps/web/app/api/staff/integration-control-tower/**'
      - 'apps/web/app/api/staff/integrations/**'
      - 'apps/web/app/platform-v7/integrations/**'
      - 'apps/web/components/crop-platform/IntegrationControlTowerClient.module.css'
      - 'apps/web/components/crop-platform/IntegrationControlTowerClient.tsx'
      - 'apps/web/components/crop-platform/integration-control-tower-live-adapter.ts'
      - 'apps/web/lib/platform-v7/cabinet-access-policy.ts'
      - 'apps/web/lib/platform-v7/design-system-v8-route-policy.ts'
      - 'apps/web/lib/platform-v7/route-canonicalization.ts'
      - 'apps/web/lib/platform-v7/routes.ts'
      - 'apps/web/tests/unit/integrationControlTowerLiveAdapter.test.ts'
      - 'apps/web/tests/unit/platformV7IntegrationControlTower.test.ts'
      - 'apps/web/tests/unit/platformV7RouteCanonicalization.test.ts'
      - 'apps/web/tsconfig.pc-crop.json'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-07b-private-integration-control-tower.json'
      - 'scripts/verify-pc-crop-07b.mjs'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/modules/regulatory-integration/dto/regulatory-integration-control-tower.dto.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.command.service.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.controller.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.policy.spec.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.policy.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.postgresql.spec.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.redrive.repository.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.repository.spec.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.control-tower.repository.ts'
      - 'apps/api/src/modules/regulatory-integration/regulatory-integration.reconciliation.repository.ts'
      - 'apps/web/app/api/platform-v7/integrations/**'
      - 'apps/web/app/api/staff/integration-control-tower/**'
      - 'apps/web/app/api/staff/integrations/**'
      - 'apps/web/app/platform-v7/integrations/**'
      - 'apps/web/components/crop-platform/IntegrationControlTowerClient.module.css'
      - 'apps/web/components/crop-platform/IntegrationControlTowerClient.tsx'
      - 'apps/web/components/crop-platform/integration-control-tower-live-adapter.ts'
      - 'apps/web/lib/platform-v7/cabinet-access-policy.ts'
      - 'apps/web/lib/platform-v7/design-system-v8-route-policy.ts'
      - 'apps/web/lib/platform-v7/route-canonicalization.ts'
      - 'apps/web/lib/platform-v7/routes.ts'
      - 'apps/web/tests/unit/integrationControlTowerLiveAdapter.test.ts'
      - 'apps/web/tests/unit/platformV7IntegrationControlTower.test.ts'
      - 'apps/web/tests/unit/platformV7RouteCanonicalization.test.ts'
      - 'apps/web/tsconfig.pc-crop.json'
      - 'docs/platform-v7/autopilot/scopes/pc-crop-07b-private-integration-control-tower.json'
      - 'scripts/verify-pc-crop-07b.mjs'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: pc-crop-07b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grainflow?schema=public
  EVIDENCE_DIR: artifacts/pc-crop-07b

jobs:
  integration-control-tower:
    name: PostgreSQL 16 · private BFF · honest statuses · governed commands
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grainflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d grainflow"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - name: Enforce exact PC-CROP-07B scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXACT_HEAD" > "$EVIDENCE_DIR/exact-head.txt"
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            printf '%s\n' 'workflow_dispatch' > "$EVIDENCE_DIR/base-ref.txt"
            printf '%s\n' 'MANUAL_DISPATCH' > "$EVIDENCE_DIR/scope-mode.txt"
            echo 'Manual dispatch: full acceptance runs without a diff ownership decision.'
            exit 0
          fi
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            git fetch --no-tags origin "$BASE_BRANCH"
            base_ref="origin/$BASE_BRANCH"
          elif [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != '0000000000000000000000000000000000000000' ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base_ref="$PUSH_BEFORE"
          else
            base_ref='HEAD^'
          fi
          printf '%s\n' "$base_ref" > "$EVIDENCE_DIR/base-ref.txt"
          # Keep both sides of renames and raw UTF-8 names for ownership.
          # Reject control delimiters rather than interpreting quoted paths.
          git diff --no-renames --name-only -z "$base_ref...$EXACT_HEAD" > "$EVIDENCE_DIR/changed-files.nul"
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              *$'\n'*|*$'\r'*|*$'\t'*)
                echo 'Unsupported control delimiter in changed path' >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$changed_path"
          done < "$EVIDENCE_DIR/changed-files.nul" | LC_ALL=C sort > "$EVIDENCE_DIR/changed-files.txt"

          # Shared route/auth dependencies trigger the complete compatibility
          # suite; they do not make another feature part of this owned slice.
          # Actual regulatory source keeps the unchanged bounded allowlist.
          grep -E '^(\.github/workflows/pc-crop-07b\.yml$|apps/api/src/modules/regulatory-integration/|apps/web/app/api/platform-v7/integrations/|apps/web/app/api/staff/integration-control-tower/|apps/web/app/api/staff/integrations/|apps/web/app/platform-v7/integrations/|apps/web/components/crop-platform/(IntegrationControlTowerClient\.tsx|IntegrationControlTowerClient\.module\.css|integration-control-tower-live-adapter\.ts)$|apps/web/tests/unit/(integrationControlTowerLiveAdapter|platformV7IntegrationControlTower)\.test\.ts$|docs/platform-v7/autopilot/scopes/pc-crop-07b-private-integration-control-tower\.json$|scripts/verify-pc-crop-07b\.mjs$)' "$EVIDENCE_DIR/changed-files.txt" > "$EVIDENCE_DIR/slice-files.txt" || true
          if [ -s "$EVIDENCE_DIR/slice-files.txt" ]; then
            printf '%s\n' 'SLICE_REMEDIATION' > "$EVIDENCE_DIR/scope-mode.txt"
            if grep -Ev '^(\.github/workflows/pc-crop-07b\.yml|apps/api/src/app\.module\.ts|apps/api/src/modules/regulatory-integration/.*|apps/web/app/api/platform-v7/integrations/.*|apps/web/app/api/staff/integration-control-tower/.*|apps/web/app/api/staff/integrations/.*|apps/web/app/platform-v7/integrations/.*|apps/web/components/crop-platform/(IntegrationControlTowerClient\.tsx|IntegrationControlTowerClient\.module\.css|integration-control-tower-live-adapter\.ts)|apps/web/lib/platform-v7/(cabinet-access-policy|design-system-v8-route-policy|route-canonicalization|routes)\.ts|apps/web/tests/unit/(integrationControlTowerLiveAdapter|platformV7IntegrationControlTower|platformV7RouteCanonicalization)\.test\.ts|apps/web/tsconfig\.pc-crop\.json|docs/platform-v7/autopilot/scopes/pc-crop-07b-private-integration-control-tower\.json|scripts/(p7-autopilot-guard\.sh|verify-pc-crop-07b\.mjs))$' "$EVIDENCE_DIR/changed-files.txt" > "$EVIDENCE_DIR/out-of-scope.txt"; then
              # One immutable-base-admitted source quartet may include its exact test config.
              # Keep the existing allowlist; every other out-of-scope path still fails.
              if ! PINNED_SCOPE_BASE="$base_ref" python3 - <<'PY_PINNED_TEST_CONFIG'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path

          def require(ok):
              if not ok:
                  raise ValueError('PINNED_TEST_CONFIG_REJECTED')

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL, timeout=30)

          try:
              branch = 'fgis/regulatory-truth-ux-20260921'
              config = 'apps/web/vitest.config.ts'
              paths = ['apps/web/components/crop-platform/IntegrationControlTowerClient.tsx',
                       'apps/web/components/crop-platform/IntegrationControlTowerClient.module.css',
                       'apps/web/tests/unit/platformV7IntegrationControlTower.test.ts', config]
              evidence = Path(os.environ['EVIDENCE_DIR'])
              require((evidence / 'out-of-scope.txt').read_text().splitlines() == [config])
              require((evidence / 'changed-files.txt').read_text().splitlines() == sorted(paths))
              event = os.environ['EVENT_NAME']
              require((event == 'pull_request' and os.environ.get('GITHUB_HEAD_REF') == branch)
                      or (event == 'push' and os.environ.get('GITHUB_REF') == 'refs/heads/main'))
              base = git('rev-parse', os.environ['PINNED_SCOPE_BASE'] + '^{commit}').decode().strip()
              head = os.environ['EXACT_HEAD']
              require(bool(re.fullmatch('[0-9a-f]{40}', base)) and bool(re.fullmatch('[0-9a-f]{40}', head)))
              # A stale head must not omit any newly accepted non-quartet leaf.
              require(git('diff', '--no-renames', '--name-only', '-z', base, head)
                      == b''.join(path.encode('utf-8') + b'\0' for path in sorted(paths)))
              state_path = 'docs/platform-v7/autopilot/autopilot-state.json'
              base_bytes = git('show', base + ':' + state_path)
              require(len(base_bytes) <= 3 * 1024 * 1024 and git('show', head + ':' + state_path) == base_bytes)
              state = json.loads(base_bytes.decode('utf-8'))
              old = state['coordinationAdmissions']['product-fgis-confirmation-focus-20261009']
              record = state['coordinationAdmissions']['product-fgis-vitest-source-resolution-correction-20261009']
              require(old['owner'] == record['owner'] == 'ACCOUNT_2_PRODUCT')
              require(old['implementationBranch'] == record['implementationBranch'] == branch)
              require(old['allowedPaths'] == paths[:3] and record['allowedPaths'] == paths)
              require(state['approvedConcurrentScopes'][branch] == paths)
              pins = record['sourcePins']
              require(len(pins) == 4 and pins[:3] == old['sourcePins'])
              require([pin['path'] for pin in pins] == paths)
              for pin in pins:
                  require(pin['mode'] == '100644')
                  for ref, key in [(base, 'beforeBlob'), (head, 'afterBlob')]:
                      entry = git('ls-tree', ref, '--', pin['path']).decode().strip().split()
                      require(entry == ['100644', 'blob', pin[key], pin['path']])
              payload = record['correctiveConfigPayload']
              require(all(payload[key] == pins[3][key] for key in ('path', 'mode', 'beforeBlob', 'afterBlob')))
              content = git('show', head + ':' + config)
              require(content == payload['afterContentUTF8'].encode('utf-8'))
              require(hashlib.sha256(content).hexdigest() == payload['sha256'])
              print('PC_CROP_07B_PINNED_TEST_CONFIG_PASS head=' + head + ' base=' + base)
          except Exception:
              print('PC_CROP_07B_PINNED_TEST_CONFIG_REJECTED', file=sys.stderr)
              sys.exit(1)
          PY_PINNED_TEST_CONFIG
              then
                echo 'PC-CROP-07B contains out-of-scope files:' >&2
                cat "$EVIDENCE_DIR/out-of-scope.txt" >&2
                exit 1
              fi
            fi
          else
            printf '%s\n' 'SHARED_INFRASTRUCTURE_ONLY' > "$EVIDENCE_DIR/scope-mode.txt"
            echo 'Shared dependency change: full acceptance continues.'
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: '10.2.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply complete migration chain
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/api exec prisma migrate deploy 2>&1 | tee "$EVIDENCE_DIR/migrate-deploy.log"
          pnpm --filter @pc/api exec prisma migrate status 2>&1 | tee "$EVIDENCE_DIR/migrate-status.log"
          pnpm --filter @pc/api exec prisma generate 2>&1 | tee "$EVIDENCE_DIR/prisma-generate.log"

      - name: Typecheck API authority
        run: pnpm --filter @pc/api typecheck 2>&1 | tee "$EVIDENCE_DIR/api-typecheck.log"

      - name: Run policy and read-model unit contracts
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/api exec jest --runInBand --runTestsByPath \
            src/modules/regulatory-integration/regulatory-integration.control-tower.policy.spec.ts \
            src/modules/regulatory-integration/regulatory-integration.control-tower.repository.spec.ts \
            2>&1 | tee "$EVIDENCE_DIR/api-unit.log"

      - name: Run PostgreSQL tenant and command acceptance
        env:
          PC_CROP_07B_POSTGRESQL: '1'
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/api exec jest --runInBand --runTestsByPath \
            src/modules/regulatory-integration/regulatory-integration.control-tower.postgresql.spec.ts \
            2>&1 | tee "$EVIDENCE_DIR/postgresql-acceptance.log"

      - name: Typecheck protected Integration Control Tower
        run: pnpm --filter @pc/web exec tsc -p tsconfig.pc-crop.json --noEmit 2>&1 | tee "$EVIDENCE_DIR/web-typecheck.log"

      - name: Run private BFF and UX contracts
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @pc/web exec vitest run \
            tests/unit/integrationControlTowerLiveAdapter.test.ts \
            tests/unit/platformV7IntegrationControlTower.test.ts \
            tests/unit/platformV7RouteCanonicalization.test.ts \
            2>&1 | tee "$EVIDENCE_DIR/web-contracts.log"

      - name: Build fail-closed machine-readable acceptance
        run: node scripts/verify-pc-crop-07b.mjs

      - name: Enforce exact-head acceptance evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/pc-crop-07b-acceptance.json`, 'utf8'));
          if (report.schemaVersion !== 'pc-crop.integration-control-tower-acceptance.v1') process.exit(1);
          if (report.slice !== 'PC-CROP-07B' || report.issue !== 3040) process.exit(1);
          if (report.status !== 'PASS' || report.operationalStatus !== 'NOT_ATTESTED') process.exit(1);
          if (report.exactHead !== process.env.EXACT_HEAD || report.postgresql !== '16') process.exit(1);
          const i = report.invariants || {};
          for (const value of Object.values(i)) if (value !== true) process.exit(1);
          const b = report.boundaries || {};
          if (b.publicUnauthenticatedIntegrationRoute !== false) process.exit(1);
          if (b.rawPayloadOrSecretDisplay !== false) process.exit(1);
          if (b.liveExternalProviderCall !== false) process.exit(1);
          if (b.secondInboxOutboxOrRelay !== false) process.exit(1);
          if (b.productionDeployment !== false || b.productionHosting !== 'REG_RU_VPS_ONLY') process.exit(1);
          NODE

      - name: Upload exact-head PC-CROP-07B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-crop-07b-${{ env.EXACT_HEAD }}
          path: artifacts/pc-crop-07b
          if-no-files-found: error
          retention-days: 90
