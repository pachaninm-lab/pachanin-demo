name: Production P0 Hardened Legacy Auth-Alias Diagnostic v4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-auth-legacy-alias-diagnostic-v4-3785.yml'
      - 'scripts/production-p0-auth-legacy-alias-diagnostic-v4-3785.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  DIAGNOSTIC_V4_COMMAND: /production p0-auth-legacy-alias-diagnostic-v4 280c

jobs:
  contract:
    name: Validate one-factor legacy auth-alias probe
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-auth-legacy-alias-diagnostic-v4 280c'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable one-factor read-only classifier
        env:
          PC_P0_AUTH_ALIAS_V4_VALIDATE_ONLY: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          wrapper='scripts/production-p0-auth-legacy-alias-diagnostic-v4-3785.sh'
          core='scripts/production-p0-first-customer-preflight-diagnostic-3785.sh'
          bash -n "$wrapper"
          python3 - "$wrapper" "$core" <<'PY'
          from pathlib import Path
          import sys
          wrapper = Path(sys.argv[1]).read_text(encoding='utf-8')
          core = Path(sys.argv[2]).read_text(encoding='utf-8')
          required = [
              "EXPECTED_CORE_BLOB='3e6e1b2cc5eb2f79c331f027d01e196df956154d'",
              'LEGACY_ALIAS_ALLOWLIST', 'LEGACY_ALIAS_OUTPUT_GUARD',
              "'pc_auth_runtime','one_deal_auth','app_auth','app_service'",
              'AUTH_PRINCIPAL_GRANULAR_CLASSIFIER',
              'AUTH_ERR_TRAP_SUSPEND', 'AUTH_ERR_TRAP_RESTORE',
              'ADMIN_ERR_TRAP_SUSPEND', 'ADMIN_ERR_TRAP_RESTORE',
              'PC_P0_AUTH_ALIAS_V4_VALIDATE_ONLY',
          ]
          missing = [value for value in required if value not in wrapper]
          if missing:
              raise SystemExit('missing v4 invariant: ' + ' | '.join(missing))
          for value in ['SET TRANSACTION READ ONLY', 'PRODUCTION_MUTATION', 'NONE']:
              if value not in core:
                  raise SystemExit('core read-only invariant missing: ' + value)
          combined = wrapper + '\n' + core
          forbidden = [
              'docker compose up', 'docker compose down', 'docker restart', 'docker rm',
              'docker run', '--force-recreate', 'prisma migrate', 'prisma db execute',
              'curl -X POST', 'curl --request POST', 'INSERT INTO', 'UPDATE auth.',
              'DELETE FROM', 'TRUNCATE TABLE', 'ALTER ROLE', 'CREATE ROLE', 'DROP ROLE',
              'GRANT ', 'REVOKE ', 'gh secret set', 'gh variable set', 'set -x',
          ]
          bad = [value for value in forbidden if value in combined]
          if bad:
              raise SystemExit('mutation surface forbidden: ' + ' | '.join(bad))
          authority = Path('.github/workflows/production-p0-auth-legacy-alias-diagnostic-v4-3785.yml').read_text(encoding='utf-8')
          for value in [
              "github.event.comment.user.login == github.repository_owner",
              "github.event.comment.author_association == 'OWNER'",
              'github.event.comment.performed_via_github_app.id == 1144995',
              "github.event.comment.body == '/production p0-auth-legacy-alias-diagnostic-v4 280c'",
          ]:
              if authority.count(value) != 3:
                  raise SystemExit('owner command authority invariant missing: ' + value)
          PY
          bash "$wrapper"

  diagnostic:
    name: Test hardened legacy alias against full read-only preflight
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (
        (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
        github.event.comment.performed_via_github_app.id == 1144995
      ) &&
      github.event.comment.body == '/production p0-auth-legacy-alias-diagnostic-v4 280c'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Execute bounded read-only differential probe
        shell: bash
        run: bash scripts/production-p0-auth-legacy-alias-diagnostic-v4-3785.sh
