name: Identity RLS robust source fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: identity-rls-robust-source-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'identity-rls-3670'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: identity-rls-3670
          fetch-depth: 0

      - name: Apply source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub(path: str, pattern: str, replacement: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=expected, flags=re.S)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacement(s), got {count}")
              p.write_text(updated)

          harness = "apps/api/test/industrial/harness.ts"
          sub(
              harness,
              r"await tx\.userOrg\.create\(\{\s*data:\s*\{\s*userId,\s*organizationId:\s*orgId,\s*role,\s*isDefault:\s*true\s*\},\s*\}\);",
              """await tx.userOrg.create({
        data: {
          id: `membership-e2e-${slug}-${key}`,
          userId,
          organizationId: orgId,
          role,
          isDefault: true,
        },
      });""",
          )
          sub(
              harness,
              r"tenantId:\s*INDUSTRIAL_TENANT,\s*sessionId:\s*`session-e2e-\$\{slug\}-\$\{key\}`",
              """tenantId: INDUSTRIAL_TENANT,
      membershipId: `membership-e2e-${slug}-${key}`,
      sessionId: `session-e2e-${slug}-${key}`""",
          )

          repository = "apps/api/src/modules/staff-access/staff-access.repository.ts"
          sub(
              repository,
              r"export type StaffAccessRequestRow = \{",
              """export type StaffTargetScopeRow = {
  tenant_id: string | null;
  organization_id: string | null;
  user_id: string | null;
};

export type StaffAccessRequestRow = {""",
          )
          sub(
              repository,
              r"(\n  async listActiveAssignments\()",
              """
  async resolveTargetScope(
    client: StaffSqlClient,
    input: {
      actorUserId: string;
      assignmentId: string;
      targetTenantId?: string | null;
      targetOrganizationId?: string | null;
      targetUserId?: string | null;
    },
  ): Promise<StaffTargetScopeRow | null> {
    const rows = await client.$queryRaw<StaffTargetScopeRow[]>(Prisma.sql`
      SELECT tenant_id, organization_id, user_id
      FROM auth.resolve_staff_target_scope(
        ${input.actorUserId},
        ${input.assignmentId},
        ${input.targetTenantId ?? null},
        ${input.targetOrganizationId ?? null},
        ${input.targetUserId ?? null}
      )
    `);
    return rows[0] ?? null;
  }

  async listActiveAssignments(""",
          )

          service = "apps/api/src/modules/staff-access/staff-access.service.ts"
          sub(
              service,
              r"const target = await this\.validateTargetScope\(input\);",
              "const target = await this.validateTargetScope(user, assignment.id, input);",
          )
          sub(
              service,
              r"  private async validateTargetScope\(input: RequestStaffAccessInput\) \{.*?\n  \}\n\n  private canAutoApprove",
              """  private async validateTargetScope(
    user: RequestUser,
    assignmentId: string,
    input: RequestStaffAccessInput,
  ) {
    const customerMode = input.accessMode !== StaffAccessMode.CONTROL_PLANE;
    if (customerMode && !input.targetOrganizationId && !input.targetTenantId && !input.targetDealId) {
      throw new BadRequestException('Customer-context access must be scoped to a tenant, organization or deal');
    }
    if (input.targetUserId && !input.targetOrganizationId) {
      throw new BadRequestException('Target user requires target organization');
    }

    const target = await this.repository.resolveTargetScope(this.repository.prisma, {
      actorUserId: user.id,
      assignmentId,
      targetTenantId: input.targetTenantId ?? null,
      targetOrganizationId: input.targetOrganizationId ?? null,
      targetUserId: input.targetUserId ?? null,
    });
    if (!target) {
      throw new ForbiddenException('Target staff access scope could not be verified');
    }

    return {
      tenantId: target.tenant_id,
      organizationId: target.organization_id,
      userId: target.user_id,
    };
  }

  private canAutoApprove""",
          )

          one_deal = "scripts/platform-v7-one-deal-e2e.sh"
          sub(
              one_deal,
              r"GRANT EXECUTE ON FUNCTION auth\.staff_resolve_deal_scope\(TEXT, TEXT\) TO one_deal_auth;",
              """GRANT EXECUTE ON FUNCTION auth.staff_resolve_deal_scope(TEXT, TEXT) TO one_deal_auth;
GRANT EXECUTE ON FUNCTION auth.resolve_staff_target_scope(TEXT, TEXT, TEXT, TEXT, TEXT) TO one_deal_auth;""",
          )

          dr = "scripts/platform-v7-database-dr-rehearsal.sh"
          sub(
              dr,
              r"'auth\.resolve_session_identity\(text,text,text,text\)',\s*'auth\.validate_deal_creation_actors",
              """'auth.resolve_session_identity(text,text,text,text)',
    'auth.resolve_staff_target_scope(text,text,text,text,text)',
    'auth.validate_deal_creation_actors""",
          )
          sub(
              dr,
              r"GRANT EXECUTE ON FUNCTION auth\.resolve_session_identity\(text,text,text,text\) TO one_deal_auth;",
              """GRANT EXECUTE ON FUNCTION auth.resolve_session_identity(text,text,text,text) TO one_deal_auth;
    GRANT EXECUTE ON FUNCTION auth.resolve_staff_target_scope(text,text,text,text,text) TO one_deal_auth;""",
          )
          sub(
              dr,
              r"'resolve_session_identity',\s*'validate_deal_creation_actors'",
              """'resolve_session_identity', 'resolve_staff_target_scope',
         'validate_deal_creation_actors'""",
          )
          sub(
              dr,
              r'"3:9:0:1:1:0:1:0"',
              '"3:10:0:1:1:0:1:0"',
          )

          Path(".github/workflows/identity-rls-source-fix-dispatch.yml").unlink()
          PY

          git diff --check
          grep -q 'membershipId: `membership-e2e-' apps/api/test/industrial/harness.ts
          grep -q 'resolve_staff_target_scope' apps/api/src/modules/staff-access/staff-access.repository.ts
          grep -q 'validateTargetScope(user, assignment.id, input)' apps/api/src/modules/staff-access/staff-access.service.ts

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(identity-rls): bind staff targets and industrial memberships"
          git push origin HEAD:identity-rls-3670
