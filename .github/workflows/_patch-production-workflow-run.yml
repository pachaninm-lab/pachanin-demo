name: Patch Production Workflow-Run Authority

on:
  push:
    branches:
      - fix/full-stack-workflow-run-authority-20260806
    paths:
      - '.github/workflows/_patch-production-workflow-run.yml'

permissions:
  contents: write

concurrency:
  group: patch-production-workflow-run-authority
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Add fail-closed workflow-run production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/production-full-stack-exact-sha.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "      - 'scripts/check-production-full-stack-release.mjs'\n  workflow_dispatch:\n",
                  "      - 'scripts/check-production-full-stack-release.mjs'\n  workflow_run:\n    workflows: ['Build & Publish Canonical Docker Images']\n    types: [completed]\n    branches: [main]\n  workflow_dispatch:\n",
              ),
              (
                  "    if: >-\n      github.event_name == 'push' ||\n      (github.event_name == 'workflow_dispatch' &&\n",
                  "    if: >-\n      (github.event_name == 'workflow_run' &&\n       github.event.workflow_run.conclusion == 'success' &&\n       github.event.workflow_run.event == 'push' &&\n       github.event.workflow_run.head_branch == 'main') ||\n      (github.event_name == 'workflow_dispatch' &&\n",
              ),
              (
                  "          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.ref_name }}\n",
                  "          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref_name }}\n",
              ),
              (
                  "          target='${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}'\n",
                  "          target='${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}'\n",
              ),
          ]
          for old, new in replacements:
              count = workflow.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one workflow fragment, found {count}: {old!r}')
              workflow = workflow.replace(old, new, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          checker_path = Path('scripts/check-production-full-stack-release.mjs')
          checker = checker_path.read_text(encoding='utf-8')
          anchor = "  'issue_comment:',\n"
          required = (
              "  'workflow_run:',\n"
              "  \"workflows: ['Build & Publish Canonical Docker Images']\",\n"
              "  \"github.event_name == 'workflow_run'\",\n"
              "  \"github.event.workflow_run.conclusion == 'success'\",\n"
              "  \"github.event.workflow_run.event == 'push'\",\n"
              "  \"github.event.workflow_run.head_branch == 'main'\",\n"
              "  'github.event.workflow_run.head_sha',\n"
          )
          if required not in checker:
              count = checker.count(anchor)
              if count != 1:
                  raise SystemExit(f'expected exactly one checker anchor, found {count}')
              checker = checker.replace(anchor, anchor + required, 1)
          checker_path.write_text(checker, encoding='utf-8')

          Path('.github/workflows/_patch-production-workflow-run.yml').unlink()
          PY

          node scripts/check-production-full-stack-release.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P0: release exact main after canonical image publication'
          git push origin "HEAD:${GITHUB_REF_NAME}"
