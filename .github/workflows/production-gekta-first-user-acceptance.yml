name: Production Gekta First-User Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-gekta-first-user-acceptance.yml'
      - 'scripts/production-gekta-first-user-acceptance.mjs'
      - 'scripts/check-production-gekta-first-user-acceptance.mjs'
      - 'docs/ops/production-gekta-first-user-acceptance.md'
      - 'docs/platform-v7/autopilot/scopes/production-gekta-runtime-20260813.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-gekta-first-user-acceptance.yml'
      - 'scripts/production-gekta-first-user-acceptance.mjs'
      - 'scripts/check-production-gekta-first-user-acceptance.mjs'
      - 'docs/ops/production-gekta-first-user-acceptance.md'
      - 'docs/platform-v7/autopilot/scopes/production-gekta-runtime-20260813.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-gekta-first-user-acceptance
  cancel-in-progress: false

env:
  LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
  RELEASE_ISSUE_NUMBER: 3072
  EVIDENCE_DIR: artifacts/production-gekta-first-user

jobs:
  contract:
    name: Validate protected Gekta first-user contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production gekta-first-user current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-production-gekta-first-user-acceptance.mjs

  accept-first-user:
    name: Real mail · mandatory MFA · trial · owner grants · fresh login
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production gekta-first-user current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_P0_EMAIL_TEMPLATE: ${{ secrets.PC_PROD_P0_MAILBOX_EMAIL_TEMPLATE || secrets.PC_PROD_P0_EMAIL_TEMPLATE }}
      PC_P0_IMAP_HOST: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_HOST || secrets.PC_PROD_P0_IMAP_HOST }}
      PC_P0_IMAP_PORT: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PORT || secrets.PC_PROD_P0_IMAP_PORT }}
      PC_P0_IMAP_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
      PC_P0_IMAP_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
      PC_P0_IMAP_FOLDER: ${{ secrets.PC_PROD_P0_IMAP_FOLDER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact current main
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          target_sha="$(git rev-parse origin/main)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_sha" == "$(git rev-parse HEAD)" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$target_sha" ]]
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Verify exact deployed revision before journey
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          accepted=0
          for attempt in $(seq 1 12); do
            cache_bust="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt-$(date +%s)"
            manifest="$(mktemp)"
            status="$(curl --silent --show-error --location --compressed \
              --connect-timeout 10 --max-time 30 --output "$manifest" --write-out '%{http_code}' \
              "$LIVE_BASE/manifest-pc-deploy.json?gekta-first-user=$cache_bust")"
            deployed="$(jq -r '.commitSha // empty' "$manifest" 2>/dev/null || true)"
            rm -f "$manifest"
            if [[ "$status" == 200 && "$deployed" == "$TARGET_SHA" ]]; then
              accepted=1
              break
            fi
            [[ "$attempt" == 12 ]] || sleep 5
          done
          (( accepted == 1 )) || { echo GEKTA_EXACT_DEPLOYED_REVISION_MISMATCH >&2; exit 20; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium runtime
        run: pnpm --filter @pc/web exec playwright install --with-deps chromium

      - name: Reconfirm exact main immediately before journey
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]] \
            || { echo GEKTA_MAIN_ADVANCED_BEFORE_ACCEPTANCE >&2; exit 21; }

      - name: Execute first-user journey and wait for owner ceremony
        id: acceptance
        continue-on-error: true
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          GEKTA_ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GEKTA_LIVE_BASE: ${{ env.LIVE_BASE }}
          GEKTA_EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          GEKTA_OWNER_TIMEOUT_SECONDS: 1800
          GEKTA_OWNER_LOCATOR_FILE: ${{ runner.temp }}/gekta-owner-locator
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_log="$RUNNER_TEMP/gekta-first-user-run.log"
          locator="$GEKTA_OWNER_LOCATOR_FILE"
          mkdir -p "$EVIDENCE_DIR"
          : > "$raw_log"
          chmod 0600 "$raw_log"

          node scripts/production-gekta-first-user-acceptance.mjs "$TARGET_SHA" \
            > >(tee "$raw_log") 2>&1 &
          acceptance_pid=$!

          locator_ready=0
          for _ in $(seq 1 300); do
            if [[ -s "$locator" ]] && grep -Fxq GEKTA_OWNER_CEREMONY=WAITING "$raw_log"; then
              locator_ready=1
              break
            fi
            if ! kill -0 "$acceptance_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if (( locator_ready == 1 )); then
            [[ "$(stat -c '%a' "$locator")" == 600 ]]
            synthetic_phone="$(tr -d '\r\n' < "$locator")"
            [[ "$synthetic_phone" =~ ^\+999[0-9]{12}$ ]]
            record="$(mktemp)"
            {
              echo '## Gekta production owner ceremony'
              echo
              echo "- exact main: \`$TARGET_SHA\`"
              echo "- synthetic test phone: \`$synthetic_phone\`"
              echo '- open: `https://процент-агро.рф/gekta/console`'
              echo '- use the existing PLATFORM_OWNER session with fresh MFA'
              echo '- search by **phone**, then issue **7 days**, wait for the PASS marker; issue **30 days**, wait; then issue **lifetime** access'
              echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo '- no owner password or TOTP enters GitHub Actions'
            } > "$record"
            gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
            rm -f "$record"
          fi

          set +e
          wait "$acceptance_pid"
          acceptance_rc=$?
          set -e
          wait || true
          cp "$raw_log" "$EVIDENCE_DIR/run.log"
          chmod 0600 "$EVIDENCE_DIR/run.log"
          exit "$acceptance_rc"

      - name: Enforce bounded evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_DIR/result.json"
          test -f "$EVIDENCE_DIR/run.log"
          set +e
          grep -PRiq \
            'verify=|token=|statusToken|setupSecret|mfaSecret|totpSecret|backupCodes|otpAuthUri|otpauth://|postgres(?:ql)?://|DATABASE_URL=|BEGIN (OPENSSH |RSA |EC )?PRIVATE KEY|pc_(access|refresh)_token|bearer[[:space:]]+[A-Za-z0-9._~-]{20,}|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}|"password"[[:space:]]*:' \
            "$EVIDENCE_DIR"
          scan_status=$?
          set -e
          case "$scan_status" in
            0) echo GEKTA_EVIDENCE_CONTAINS_PROTECTED_MATERIAL >&2; exit 30 ;;
            1) ;;
            *) echo GEKTA_EVIDENCE_SCAN_FAILED >&2; exit 31 ;;
          esac
          find "$EVIDENCE_DIR" -type f ! -name sha256.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/sha256.txt"

      - name: Guard exact main before artifact publication
        id: artifact_guard
        if: always()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]

      - name: Upload bounded Gekta acceptance evidence
        id: upload
        if: >-
          always() &&
          steps.evidence.outcome == 'success' &&
          steps.artifact_guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: production-gekta-first-user-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Remove protected acceptance material
        id: cleanup
        if: always()
        env:
          GEKTA_OWNER_LOCATOR_FILE: ${{ runner.temp }}/gekta-owner-locator
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$GEKTA_OWNER_LOCATOR_FILE" "$RUNNER_TEMP/gekta-first-user-run.log"

      - name: Publish bounded terminal result
        id: publication
        if: always()
        continue-on-error: true
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          GUARD_OUTCOME: ${{ steps.artifact_guard.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          result=FAIL
          if [[ "$ACCEPTANCE_OUTCOME" == success \
            && "$EVIDENCE_OUTCOME" == success \
            && "$GUARD_OUTCOME" == success \
            && "$UPLOAD_OUTCOME" == success \
            && "$CLEANUP_OUTCOME" == success ]] \
            && grep -Fxq GEKTA_FIRST_USER_ACCEPTANCE=PASS "$EVIDENCE_DIR/run.log"; then
            result=PASS
          fi
          blocker="$(sed -n 's/^GEKTA_BLOCKER=//p' "$EVIDENCE_DIR/run.log" 2>/dev/null | tail -1)"
          [[ "$blocker" =~ ^[A-Z0-9_]{0,100}$ ]] || blocker=GEKTA_ACCEPTANCE_FAILED
          record="$(mktemp)"
          {
            echo '## Production Gekta first-user acceptance'
            echo
            echo "- exact main: \`$TARGET_SHA\`"
            echo "- result: \`$result\`"
            echo "- blocker: \`${blocker:-none}\`"
            echo '- 10-answer gate, real email, mandatory MFA, 30-day trial: bounded evidence'
            echo '- server history/search/projects and DECLARED phone: bounded evidence'
            echo '- owner phone search with 7-day, 30-day and lifetime grants: bounded evidence'
            echo '- logout and fresh password + MFA login: bounded evidence'
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$record"
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Enforce production Gekta result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.acceptance.outcome }}' == success ]]
          [[ '${{ steps.evidence.outcome }}' == success ]]
          [[ '${{ steps.artifact_guard.outcome }}' == success ]]
          [[ '${{ steps.upload.outcome }}' == success ]]
          [[ '${{ steps.cleanup.outcome }}' == success ]]
          [[ '${{ steps.publication.outcome }}' == success ]]
          grep -Fxq GEKTA_FIRST_USER_ACCEPTANCE=PASS "$EVIDENCE_DIR/run.log"
