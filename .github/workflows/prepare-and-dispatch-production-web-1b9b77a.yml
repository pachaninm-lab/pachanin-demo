name: Prepare and dispatch production web 1b9b77a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write
  issues: write

concurrency:
  group: prepare-and-dispatch-production-web-1b9b77a
  cancel-in-progress: true

env:
  TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92
  EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a
  RELEASE_ISSUE_NUMBER: 3187
  CONTROL_DIR: control
  SOURCE_DIR: source

jobs:
  prepare:
    name: Build authority and dispatch bounded deploy
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact application source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: ${{ env.SOURCE_DIR }}
          fetch-depth: 0

      - name: Checkout current main control plane
        uses: actions/checkout@v4
        with:
          ref: main
          path: ${{ env.CONTROL_DIR }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable target lineage
        shell: bash
        run: |
          set -euo pipefail
          git -C "$CONTROL_DIR" fetch --no-tags origin main
          git -C "$CONTROL_DIR" cat-file -e "${TARGET_SHA}^{commit}"
          git -C "$CONTROL_DIR" merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or verify exact linux-amd64 image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          build_required=1
          if docker pull --platform linux/amd64 "$EXACT_IMAGE" >/dev/null 2>&1; then
            current_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$EXACT_IMAGE" 2>/dev/null || true)"
            current_arch="$(docker image inspect --format '{{ .Architecture }}' "$EXACT_IMAGE" 2>/dev/null || true)"
            if [[ "$current_revision" == "$TARGET_SHA" && "$current_arch" == amd64 ]]; then
              build_required=0
            fi
          fi

          if (( build_required == 1 )); then
            build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            docker buildx build \
              --platform linux/amd64 \
              --file "$SOURCE_DIR/infra/docker/Dockerfile.web" \
              --tag "$EXACT_IMAGE" \
              --label "org.opencontainers.image.revision=$TARGET_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --build-arg "BUILD_DATE=$build_date" \
              --build-arg "GIT_COMMIT=$TARGET_SHA" \
              --cache-from type=gha,scope=web-amd64 \
              --cache-to type=gha,mode=max,scope=web-amd64 \
              --push \
              "$SOURCE_DIR"
          fi

          docker pull --platform linux/amd64 "$EXACT_IMAGE"
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$EXACT_IMAGE")"
          architecture="$(docker image inspect --format '{{ .Architecture }}' "$EXACT_IMAGE")"
          image_id="$(docker image inspect --format '{{ .Id }}' "$EXACT_IMAGE")"
          [[ "$actual_revision" == "$TARGET_SHA" ]]
          [[ "$architecture" == amd64 ]]
          echo "revision=$actual_revision" >> "$GITHUB_OUTPUT"
          echo "architecture=$architecture" >> "$GITHUB_OUTPUT"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"

      - name: Bind bounded deploy workflow to exact target
        shell: bash
        working-directory: ${{ env.CONTROL_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/production-web-key-normalization-retry.yml')
          text = path.read_text()
          replacements = (
              ('name: Retry Exact Web Release 58b4624', 'name: Retry Exact Web Release 1b9b77a'),
              ('RETRY-58B4624', 'RETRY-1B9B77A'),
              ('TARGET_SHA: 58b46246ac67eb31a913a8da0de74a78ed1fd095', 'TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92'),
              ('EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-58b4624', 'EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a'),
              ('EVIDENCE_DIR: artifacts/production-web-key-normalization-retry', 'EVIDENCE_DIR: artifacts/production-web-1b9b77a'),
              ('RELEASE_ISSUE_NUMBER: 3048', 'RELEASE_ISSUE_NUMBER: 3187'),
          )
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'missing release binding marker: {old}')
              text = text.replace(old, new)
          required = (
              'name: Retry Exact Web Release 1b9b77a',
              "description: 'Enter RETRY-1B9B77A'",
              "inputs.confirmation == 'RETRY-1B9B77A'",
              'TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92',
              'EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a',
              'EVIDENCE_DIR: artifacts/production-web-1b9b77a',
              'RELEASE_ISSUE_NUMBER: 3187',
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'incomplete release binding: {marker}')
          path.write_text(text)
          PY

      - name: Remove temporary release preparation files
        shell: bash
        working-directory: ${{ env.CONTROL_DIR }}
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml \
            .github/workflows/production-web-build-1b9b77a.yml \
            .github/release-triggers/production-web-1b9b77a.md

      - name: Commit exact deploy binding to main
        id: commit
        shell: bash
        working-directory: ${{ env.CONTROL_DIR }}
        run: |
          set -euo pipefail
          git add -A \
            .github/workflows/production-web-key-normalization-retry.yml \
            .github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml \
            .github/workflows/production-web-build-1b9b77a.yml \
            .github/release-triggers/production-web-1b9b77a.md
          changed="$(git diff --cached --name-only | sort)"
          printf 'Governed release-control diff:\n%s\n' "$changed"
          grep -Fxq '.github/workflows/production-web-key-normalization-retry.yml' <<< "$changed"
          grep -Fxq '.github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml' <<< "$changed"
          if grep -Ev '^\.github/(workflows/(production-web-key-normalization-retry|prepare-and-dispatch-production-web-1b9b77a|production-web-build-1b9b77a)\.yml|release-triggers/production-web-1b9b77a\.md)$' <<< "$changed" | grep -q .; then
            echo 'Unexpected file in release-control commit.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ops(release): bind bounded web deploy to 1b9b77a'
          release_commit="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Wait for main workflow authority to update
        shell: bash
        working-directory: ${{ env.CONTROL_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.release_commit }}
        run: |
          set -euo pipefail
          expected_blob="$(git rev-parse "${RELEASE_COMMIT}:.github/workflows/production-web-key-normalization-retry.yml")"
          for attempt in $(seq 1 30); do
            remote_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            remote_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/production-web-key-normalization-retry.yml?ref=main" --jq '.sha')"
            echo "Authority attempt $attempt: head=$remote_head blob=$remote_blob expected=$expected_blob"
            if [[ "$remote_head" == "$RELEASE_COMMIT" && "$remote_blob" == "$expected_blob" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo 'Main release workflow authority did not converge.' >&2
          exit 1

      - name: Dispatch bounded production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-web-key-normalization-retry.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirmation=RETRY-1B9B77A

      - name: Record successful preparation
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.release_commit }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_ARCH: ${{ steps.image.outputs.architecture }}
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
          IMAGE_BUILT: ${{ steps.image.outputs.build_required }}
        run: |
          set -euo pipefail
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Exact image verified and bounded deploy dispatched\n\n- target SHA: \`$TARGET_SHA\`\n- exact image: \`$EXACT_IMAGE\`\n- OCI revision: \`$IMAGE_REVISION\`\n- architecture: \`$IMAGE_ARCH\`\n- image ID: \`$IMAGE_ID\`\n- image built in this run: \`$IMAGE_BUILT\`\n- release-control commit: \`$RELEASE_COMMIT\`\n- preparation workflow run: \`$GITHUB_RUN_ID\`"

      - name: Record preparation failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production preparation failed closed\n\n- target SHA: \`$TARGET_SHA\`\n- exact image: \`$EXACT_IMAGE\`\n- preparation workflow run: \`$GITHUB_RUN_ID\`\n- VPS deployment was not accepted by this preparation job."
