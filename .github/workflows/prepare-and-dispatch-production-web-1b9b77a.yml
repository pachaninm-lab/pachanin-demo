name: Prepare release-control PR for web 1b9b77a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  pull-requests: write
  issues: write

concurrency:
  group: prepare-release-control-web-1b9b77a
  cancel-in-progress: true

env:
  TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92
  EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a
  RELEASE_ISSUE_NUMBER: 3187
  RELEASE_BRANCH: ops/release-control-1b9b77a

jobs:
  prepare:
    name: Verify image and open governed release-control PR
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable target lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact image authority
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$EXACT_IMAGE"
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$EXACT_IMAGE")"
          architecture="$(docker image inspect --format '{{ .Architecture }}' "$EXACT_IMAGE")"
          image_id="$(docker image inspect --format '{{ .Id }}' "$EXACT_IMAGE")"
          [[ "$actual_revision" == "$TARGET_SHA" ]]
          [[ "$architecture" == amd64 ]]
          echo "revision=$actual_revision" >> "$GITHUB_OUTPUT"
          echo "architecture=$architecture" >> "$GITHUB_OUTPUT"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Bind bounded deploy workflow to exact target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/production-web-key-normalization-retry.yml')
          text = path.read_text()
          replacements = (
              ('name: Retry Exact Web Release 58b4624', 'name: Retry Exact Web Release 1b9b77a'),
              ('RETRY-58B4624', 'RETRY-1B9B77A'),
              ('TARGET_SHA: 58b46246ac67eb31a913a8da0de74a78ed1fd095', 'TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92'),
              ('EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-58b4624', 'EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a'),
              ('EVIDENCE_DIR: artifacts/production-web-key-normalization-retry', 'EVIDENCE_DIR: artifacts/production-web-1b9b77a'),
              ('RELEASE_ISSUE_NUMBER: 3048', 'RELEASE_ISSUE_NUMBER: 3187'),
          )
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'missing release binding marker: {old}')
              text = text.replace(old, new)
          required = (
              'name: Retry Exact Web Release 1b9b77a',
              "description: 'Enter RETRY-1B9B77A'",
              "inputs.confirmation == 'RETRY-1B9B77A'",
              'TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92',
              'EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a',
              'EVIDENCE_DIR: artifacts/production-web-1b9b77a',
              'RELEASE_ISSUE_NUMBER: 3187',
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'incomplete release binding: {marker}')
          path.write_text(text)
          PY

      - name: Remove temporary release preparation files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml \
            .github/workflows/production-web-build-1b9b77a.yml \
            .github/release-triggers/production-web-1b9b77a.md

      - name: Commit governed release-control branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A \
            .github/workflows/production-web-key-normalization-retry.yml \
            .github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml \
            .github/workflows/production-web-build-1b9b77a.yml \
            .github/release-triggers/production-web-1b9b77a.md
          changed="$(git diff --cached --name-only | sort)"
          printf 'Governed release-control diff:\n%s\n' "$changed"
          grep -Fxq '.github/workflows/production-web-key-normalization-retry.yml' <<< "$changed"
          grep -Fxq '.github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml' <<< "$changed"
          if grep -Ev '^\.github/(workflows/(production-web-key-normalization-retry|prepare-and-dispatch-production-web-1b9b77a|production-web-build-1b9b77a)\.yml|release-triggers/production-web-1b9b77a\.md)$' <<< "$changed" | grep -q .; then
            echo 'Unexpected file in release-control commit.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ops(release): bind bounded web deploy to 1b9b77a'
          release_commit="$(git rev-parse HEAD)"
          git push --force origin "HEAD:$RELEASE_BRANCH"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Open or update release-control PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            pr_number="$existing"
          else
            body_file="$(mktemp)"
            cat > "$body_file" <<EOF
          Binds the existing bounded REG.RU web-only release workflow to exact target \`$TARGET_SHA\`.

          Exact image authority: \`$EXACT_IMAGE\` with matching OCI revision and linux/amd64 architecture.

          On merge, the existing push trigger performs the bounded deployment and publishes evidence to issue #3187. No application, API, database, migration, Caddy or unrelated service changes.
          EOF
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$RELEASE_BRANCH" --title 'ops(release): bind bounded web deploy to 1b9b77a' --body-file "$body_file")"
            pr_number="${pr_url##*/}"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=https://github.com/$GITHUB_REPOSITORY/pull/$pr_number" >> "$GITHUB_OUTPUT"

      - name: Record successful preparation
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.release_commit }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_ARCH: ${{ steps.image.outputs.architecture }}
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          set -euo pipefail
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Exact image verified and release-control PR opened\n\n- target SHA: \`$TARGET_SHA\`\n- exact image: \`$EXACT_IMAGE\`\n- OCI revision: \`$IMAGE_REVISION\`\n- architecture: \`$IMAGE_ARCH\`\n- image ID: \`$IMAGE_ID\`\n- release-control commit: \`$RELEASE_COMMIT\`\n- release-control PR: #$PR_NUMBER\n- preparation workflow run: \`$GITHUB_RUN_ID\`"

      - name: Record preparation failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Release-control preparation failed closed\n\n- target SHA: \`$TARGET_SHA\`\n- exact image: \`$EXACT_IMAGE\`\n- preparation workflow run: \`$GITHUB_RUN_ID\`\n- production deployment was not dispatched."
