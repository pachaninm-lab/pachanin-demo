name: Materialize release-control artifact for web 1b9b77a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-and-dispatch-production-web-1b9b77a.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

concurrency:
  group: materialize-release-control-web-1b9b77a
  cancel-in-progress: true

env:
  TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92
  EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a
  RELEASE_ISSUE_NUMBER: 3187
  EVIDENCE_DIR: artifacts/release-control-1b9b77a

jobs:
  materialize:
    name: Verify image and materialize governed deploy workflow
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable target lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact image authority
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$EXACT_IMAGE"
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$EXACT_IMAGE")"
          architecture="$(docker image inspect --format '{{ .Architecture }}' "$EXACT_IMAGE")"
          image_id="$(docker image inspect --format '{{ .Id }}' "$EXACT_IMAGE")"
          [[ "$actual_revision" == "$TARGET_SHA" ]]
          [[ "$architecture" == amd64 ]]
          echo "revision=$actual_revision" >> "$GITHUB_OUTPUT"
          echo "architecture=$architecture" >> "$GITHUB_OUTPUT"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Materialize exact release binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/production-web-key-normalization-retry.yml')
          text = source.read_text()
          replacements = (
              ('name: Retry Exact Web Release 58b4624', 'name: Retry Exact Web Release 1b9b77a'),
              ('RETRY-58B4624', 'RETRY-1B9B77A'),
              ('TARGET_SHA: 58b46246ac67eb31a913a8da0de74a78ed1fd095', 'TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92'),
              ('EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-58b4624', 'EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a'),
              ('EVIDENCE_DIR: artifacts/production-web-key-normalization-retry', 'EVIDENCE_DIR: artifacts/production-web-1b9b77a'),
              ('RELEASE_ISSUE_NUMBER: 3048', 'RELEASE_ISSUE_NUMBER: 3187'),
          )
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'missing release binding marker: {old}')
              text = text.replace(old, new)
          required = (
              'name: Retry Exact Web Release 1b9b77a',
              "description: 'Enter RETRY-1B9B77A'",
              "inputs.confirmation == 'RETRY-1B9B77A'",
              'TARGET_SHA: 1b9b77acf17b8a74f90b0822dee429602e789c92',
              'EXACT_IMAGE: ghcr.io/pachaninm-lab/grainflow-web:sha-1b9b77a',
              'EVIDENCE_DIR: artifacts/production-web-1b9b77a',
              'RELEASE_ISSUE_NUMBER: 3187',
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'incomplete release binding: {marker}')
          destination = Path('artifacts/release-control-1b9b77a/production-web-key-normalization-retry.yml')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(text)
          PY

      - name: Build machine-readable evidence
        shell: bash
        env:
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_ARCH: ${{ steps.image.outputs.architecture }}
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/manifest.env" <<EOF
          STATUS=PASS
          TARGET_SHA=$TARGET_SHA
          EXACT_IMAGE=$EXACT_IMAGE
          OCI_REVISION=$IMAGE_REVISION
          ARCHITECTURE=$IMAGE_ARCH
          IMAGE_ID=$IMAGE_ID
          SOURCE_MAIN_SHA=$GITHUB_SHA
          WORKFLOW_RUN_ID=$GITHUB_RUN_ID
          EOF
          sha256sum \
            "$EVIDENCE_DIR/production-web-key-normalization-retry.yml" \
            "$EVIDENCE_DIR/manifest.env" \
            > "$EVIDENCE_DIR/sha256.txt"

      - name: Upload governed release-control artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-control-1b9b77a-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record successful materialization
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_ARCH: ${{ steps.image.outputs.architecture }}
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          set -euo pipefail
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Governed release-control artifact ready\n\n- target SHA: \`$TARGET_SHA\`\n- exact image: \`$EXACT_IMAGE\`\n- OCI revision: \`$IMAGE_REVISION\`\n- architecture: \`$IMAGE_ARCH\`\n- image ID: \`$IMAGE_ID\`\n- artifact: \`release-control-1b9b77a-$GITHUB_RUN_ID\`\n- materialization workflow run: \`$GITHUB_RUN_ID\`"

      - name: Record materialization failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Release-control artifact materialization failed closed\n\n- target SHA: \`$TARGET_SHA\`\n- exact image: \`$EXACT_IMAGE\`\n- workflow run: \`$GITHUB_RUN_ID\`\n- production deployment was not dispatched."
