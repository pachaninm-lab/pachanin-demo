name: P0 Reviewer Reason Classifier Sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-reviewer-reason-code-sync.yml'

permissions:
  contents: write

concurrency:
  group: p0-reviewer-reason-code-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-reviewer-repair-reason-code-3802'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-reviewer-repair-reason-code-3802
          fetch-depth: 0
          persist-credentials: true

      - name: Merge exact current main and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pachaninm-lab'
          git config user.email '263435807+pachaninm-lab@users.noreply.github.com'
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          git merge --no-commit --no-ff "$current_main"
          rm -f .github/workflows/p0-reviewer-reason-code-sync.yml
          git diff --check
          git add -A
          git commit -m "SYNC: current main into reviewer repair reason classifier"
          git push origin HEAD:fix/p0-reviewer-repair-reason-code-3802
