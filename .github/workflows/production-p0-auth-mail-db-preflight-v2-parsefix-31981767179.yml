name: Production P0 Auth Mail DB Preflight V2 Parsefix 31981767179

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/production-p0-auth-mail-db-preflight-v2-parsefix-31981767179.yml'
      - 'scripts/production-p0-auth-mail-db-preflight-v2-parsefix-31981767179.sh'
      - 'scripts/check-production-p0-auth-mail-db-preflight-v2-parsefix-31981767179.mjs'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-auth-mail-db-preflight-v2-parsefix-31981767179
  cancel-in-progress: false

jobs:
  contract:
    name: Validate bounded DB preflight parsefix contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        (
          (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
          github.event.comment.performed_via_github_app.id == 1144995
        ) &&
        github.event.comment.body == '/production p0-auth-mail-db-preflight-v2-parsefix 31981767179 current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate DB preflight parsefix
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/check-production-p0-auth-mail-db-preflight-v2-parsefix-31981767179.mjs
          bash -n scripts/production-p0-auth-mail-db-preflight-v2-parsefix-31981767179.sh

      - name: Verify exact owner-issued provenance
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EXPECTED_BODY: /production p0-auth-mail-db-preflight-v2-parsefix 31981767179 current-main
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          TRUSTED_CONNECTOR_APP_ID: '1144995'
        run: |
          set -Eeuo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          user="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.user.login')"
          assoc="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.author_association')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body')"
          app="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.performed_via_github_app.id // 0')"
          [[ "$user" == "$owner" && "$assoc" == 'OWNER' && "$body" == "$EXPECTED_BODY" ]]
          if [[ "$GITHUB_ACTOR" == "$owner" && "$TRIGGERING_ACTOR" == "$owner" ]]; then
            echo OWNER_DIRECT_PROVENANCE_OK=1
          else
            [[ "$app" == "$TRUSTED_CONNECTOR_APP_ID" ]]
            echo OWNER_CONNECTOR_PROVENANCE_OK=1
          fi

  preflight:
    name: Read-only production auth-mail DB parsefix preflight
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_AUTH_MAIL_DB_PREFLIGHT_V2_COMMAND: ${{ github.event.comment.body }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
      PRODUCTION_MUTATION_ALLOWED: 'false'
      PC_IS_PRODUCTION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Execute DB preflight parsefix
        shell: bash
        run: bash scripts/production-p0-auth-mail-db-preflight-v2-parsefix-31981767179.sh
