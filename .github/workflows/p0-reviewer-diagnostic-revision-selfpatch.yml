name: P0 Reviewer Diagnostic Revision Self-Patch

on:
  push:
    branches:
      - fix/p0-reviewer-diagnostic-deployed-revision-3802
    paths:
      - '.github/workflows/p0-reviewer-diagnostic-revision-selfpatch.yml'

permissions:
  contents: write

concurrency:
  group: p0-reviewer-diagnostic-revision-selfpatch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-reviewer-diagnostic-deployed-revision-3802
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply exact bounded correction and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          old_deployed = '159b597c512aa88f24ffe9a9f37863fe5892c02f'
          new_deployed = '7677678dbd629a0938bd47ce421a66e80555fec3'
          old_branch = 'fix/p0-reviewer-repair-rollback-diagnostic-3802-v2'
          new_branch = 'fix/p0-reviewer-diagnostic-deployed-revision-3802'

          runner_path = Path('scripts/production-p0-reviewer-repair-diagnose.sh')
          checker_path = Path('scripts/check-production-p0-reviewer-repair-diagnose.mjs')
          scope_path = Path('docs/platform-v7/autopilot/scopes/production-p0-reviewer-repair-diagnose-3802.json')
          self_path = Path('.github/workflows/p0-reviewer-diagnostic-revision-selfpatch.yml')

          runner = runner_path.read_text(encoding='utf-8')
          old_runner = f"DEPLOYED_SHA='{old_deployed}'"
          new_runner = f"DEPLOYED_SHA='{new_deployed}'"
          if runner.count(old_runner) != 1 or new_runner in runner:
              raise SystemExit('runner deployed-revision anchor mismatch')
          runner_path.write_text(runner.replace(old_runner, new_runner), encoding='utf-8')

          checker = checker_path.read_text(encoding='utf-8')
          if checker.count(old_branch) != 1:
              raise SystemExit('checker branch anchor mismatch')
          if checker.count(old_deployed) != 1:
              raise SystemExit('checker deployed-revision anchor mismatch')
          checker = checker.replace(old_branch, new_branch).replace(old_deployed, new_deployed)
          scope_assertion = "    || scope.deployedRevision !== '7677678dbd629a0938bd47ce421a66e80555fec3'\n"
          anchor = "    || scope.productionHosting !== 'REG_RU_EXISTING_INFRASTRUCTURE_ONLY'\n"
          if checker.count(anchor) != 1 or 'scope.deployedRevision' in checker:
              raise SystemExit('checker scope binding anchor mismatch')
          checker = checker.replace(anchor, scope_assertion + anchor)
          checker_path.write_text(checker, encoding='utf-8')

          scope = json.loads(scope_path.read_text(encoding='utf-8'))
          if scope.get('branch') != old_branch or 'deployedRevision' in scope:
              raise SystemExit('scope binding precondition mismatch')
          scope['branch'] = new_branch
          scope['deployedRevision'] = new_deployed
          scope_path.write_text(json.dumps(scope, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          if not self_path.is_file():
              raise SystemExit('one-shot workflow missing')
          self_path.unlink()
          PY

          bash -n scripts/production-p0-reviewer-repair-diagnose.sh
          node --check scripts/check-production-p0-reviewer-repair-diagnose.mjs
          node scripts/check-production-p0-reviewer-repair-diagnose.mjs
          python -m json.tool docs/platform-v7/autopilot/scopes/production-p0-reviewer-repair-diagnose-3802.json >/dev/null
          git diff --check

          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            '.github/workflows/p0-reviewer-diagnostic-revision-selfpatch.yml'
            'docs/platform-v7/autopilot/scopes/production-p0-reviewer-repair-diagnose-3802.json'
            'scripts/check-production-p0-reviewer-repair-diagnose.mjs'
            'scripts/production-p0-reviewer-repair-diagnose.sh'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "$(printf '%s\n' "${changed[@]}")" == "$(printf '%s\n' "${expected[@]}")" ]]

      - name: Commit exact three-file net diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pachaninm-lab'
          git config user.email '263435807+pachaninm-lab@users.noreply.github.com'
          git add -A
          git commit -m 'P0: pin reviewer diagnostic to deployed exact revision'
          git push origin HEAD:fix/p0-reviewer-diagnostic-deployed-revision-3802
