name: TAI one-shot autopilot guard remediation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/tai-one-shot-autopilot-guard-remediation.yml
      - docs/platform-v7/autopilot/scopes/tai-general-agro-completeness-20260803.json
      - scripts/p7-autopilot-guard.sh

permissions:
  contents: write

concurrency:
  group: tai-one-shot-autopilot-guard-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remediate:
    name: Admit exact governed lockfile remediation branch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/tai-general-agro-completeness-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/tai-general-agro-completeness-20260803
          fetch-depth: 0

      - name: Apply exact admission and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/p7-autopilot-guard.sh')
          text = path.read_text(encoding='utf-8')
          old = 'if [ "${GITHUB_HEAD_REF:-}" = "agent/ir-sec-transitive-runtime-remediation" ] || [ "${GITHUB_HEAD_REF:-}" = "agent/ir-sec-opentelemetry-220" ] || [ "${GITHUB_HEAD_REF:-}" = "agent/ir-sec-next-15-5-16-final" ] || [ "${GITHUB_HEAD_REF:-}" = "claude/tai-production-attestation-gizgzh" ]; then\n'
          new = 'if [ "${GITHUB_HEAD_REF:-}" = "agent/ir-sec-transitive-runtime-remediation" ] || [ "${GITHUB_HEAD_REF:-}" = "agent/ir-sec-opentelemetry-220" ] || [ "${GITHUB_HEAD_REF:-}" = "agent/ir-sec-next-15-5-16-final" ] || [ "${GITHUB_HEAD_REF:-}" = "claude/tai-production-attestation-gizgzh" ] || [ "${GITHUB_HEAD_REF:-}" = "fix/tai-general-agro-completeness-20260803" ]; then\n'

          if new in text:
              print('Exact branch admission is already present')
          else:
              occurrences = text.count(old)
              if occurrences != 1:
                  raise SystemExit(f'Expected one current guard anchor, found {occurrences}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          test "$(grep -Fc '[ "${GITHUB_HEAD_REF:-}" = "fix/tai-general-agro-completeness-20260803" ]' scripts/p7-autopilot-guard.sh)" -eq 1
          git rm -- .github/workflows/tai-one-shot-autopilot-guard-remediation.yml

          changed=$(
            {
              git diff --name-only
              git diff --cached --name-only
            } | sort -u
          )
          expected=$(printf '%s\n' \
            '.github/workflows/tai-one-shot-autopilot-guard-remediation.yml' \
            'scripts/p7-autopilot-guard.sh' \
            | sort)
          test "$changed" = "$expected"

      - name: Commit exact admission and workflow retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p7-autopilot-guard.sh
          git diff --cached --check
          git commit -m "governance: admit exact TAI lockfile branch and retire one-shot"
          git push origin HEAD:fix/tai-general-agro-completeness-20260803
