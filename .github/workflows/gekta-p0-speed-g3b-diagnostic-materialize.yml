name: Gekta P0 SPEED G3B Diagnostic Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-p0-speed-g3b-diagnostic-materialize.yml'
      - 'scripts/materialize-gekta-g3b-diagnostic.mjs'
      - 'docs/platform-v7/autopilot/scopes/gekta-p0-speed-g3b-diagnostic-3896.json'

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.head_ref == 'fix/gekta-p0-speed-g3b-diagnostic-3896' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gekta-p0-speed-g3b-diagnostic-3896
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Materialize bounded diagnostic contract
        run: node scripts/materialize-gekta-g3b-diagnostic.mjs
      - name: Prove scope and self-delete
        run: |
          set -euo pipefail
          grep -Fq "const remote = text.slice(begin, end);" .github/workflows/gekta-p0-speed-model-host-diagnostic.yml
          git rm .github/workflows/gekta-p0-speed-g3b-diagnostic-materialize.yml scripts/materialize-gekta-g3b-diagnostic.mjs
          GITHUB_HEAD_REF=fix/gekta-p0-speed-g3b-diagnostic-3896 BASE_REF=origin/main bash scripts/p7-autopilot-guard.sh
          git diff --check
      - name: Commit exact diagnostic candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/gekta-p0-speed-model-host-diagnostic.yml
          git commit -m 'Gekta P0 SPEED G3B: harden read-only diagnostic contract'
          git push origin HEAD:fix/gekta-p0-speed-g3b-diagnostic-3896
