name: Recover exact presentation transport

on:
  push:
    branches:
      - ops/regenerate-presentation-approved-source-20260829

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/presentation-regenerate-approved-source-20260829
          fetch-depth: 1

      - name: Recover one displaced Base64 symbol against exact digest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');

          const targetBrotliSha = 'e99c503bb653bfc1f4c2fd800a5bc230404a6d22d02f3d1362cb66e1172b0612';
          const targetPdfSha = '1f99bd881404624ef8fe8bec9a10caf10a021f8cacff3ed5a6633101255178a5';
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          const read = i => {
            const s = String(i).padStart(2, '0');
            const src = fs.readFileSync(`apps/web/lib/presentation-pdf/part-${s}.ts`, 'utf8');
            const literals = [...src.matchAll(/"([A-Za-z0-9+/=]+)"/g)].map(m => m[1]);
            if (!literals.length) throw new Error(`missing part ${s}`);
            return literals.join('');
          };
          const parts = Array.from({length:14}, (_,i)=>read(i));
          console.log('PART_LENGTHS=' + parts.map(x=>x.length).join(','));
          if (parts[1].length !== 18899 || parts[5].length !== 18901) throw new Error('unexpected drift shape');
          if (parts.reduce((n,x)=>n+x.length,0) !== 264564) throw new Error('unexpected aggregate length');

          const prefixBefore1 = parts[0];
          const middle2to4 = parts.slice(2,5).join('');
          const suffixAfter5 = parts.slice(6).join('');
          const p1 = parts[1];
          const p5 = parts[5];

          function verify(c1, c5, label) {
            const b64 = prefixBefore1 + c1 + middle2to4 + c5 + suffixAfter5;
            const compressed = Buffer.from(b64, 'base64');
            if (compressed.length !== 198423) return false;
            if (hash(compressed) !== targetBrotliSha) return false;
            const pdf = zlib.brotliDecompressSync(compressed);
            const pdfSha = hash(pdf);
            const pages = (pdf.toString('latin1').match(/\/Type\s*\/Page\b/g) || []).length;
            if (pdf.length !== 312533 || pdfSha !== targetPdfSha || pages !== 14) throw new Error(`matched digest but bad PDF ${label}`);
            fs.writeFileSync('/tmp/found.json', JSON.stringify({c1,c5,label}));
            console.log(`FOUND=${label}`);
            return true;
          }

          let found = false;
          for (let remove = 0; remove < p5.length && !found; remove++) {
            const ch = p5[remove];
            const c5 = p5.slice(0, remove) + p5.slice(remove + 1);
            found = verify(p1 + ch, c5, `p5[${remove}] -> end(p1)`);
            if (!found) found = verify(ch + p1, c5, `p5[${remove}] -> start(p1)`);
          }
          const edgeRemovals = [0, p5.length - 1];
          for (const remove of edgeRemovals) {
            if (found) break;
            const ch = p5[remove];
            const c5 = p5.slice(0, remove) + p5.slice(remove + 1);
            for (let ins = 1; ins < p1.length && !found; ins++) {
              const c1 = p1.slice(0, ins) + ch + p1.slice(ins);
              found = verify(c1, c5, `p5[${remove}] -> p1[${ins}]`);
            }
          }
          if (!found) throw new Error('bounded single-symbol recovery did not match target digest');

          const {c1,c5,label} = JSON.parse(fs.readFileSync('/tmp/found.json','utf8'));
          fs.writeFileSync('apps/web/lib/presentation-pdf/part-01.ts', `export const PRESENTATION_PDF_BROTLI_BASE64_PART_01 =\n  ${JSON.stringify(c1)};\n`);
          fs.writeFileSync('apps/web/lib/presentation-pdf/part-05.ts', `export const PRESENTATION_PDF_BROTLI_BASE64_PART_05 =\n  ${JSON.stringify(c5)};\n`);
          console.log(`RECOVERY_LABEL=${label}`);
          NODE

      - name: Verify route-level exact contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          let b64='';
          for (let i=0;i<14;i++) {
            const s=String(i).padStart(2,'0');
            const src=fs.readFileSync(`apps/web/lib/presentation-pdf/part-${s}.ts`,'utf8');
            const literals=[...src.matchAll(/"([A-Za-z0-9+/=]+)"/g)].map(m=>m[1]);
            if(!literals.length) throw new Error(s);
            b64+=literals.join('');
          }
          const br=Buffer.from(b64,'base64');
          const pdf=zlib.brotliDecompressSync(br);
          const pages=(pdf.toString('latin1').match(/\/Type\s*\/Page\b/g)||[]).length;
          console.log(`B64=${b64.length}`);
          console.log(`BR_BYTES=${br.length}`);
          console.log(`BR_SHA=${hash(br)}`);
          console.log(`PDF_BYTES=${pdf.length}`);
          console.log(`PDF_SHA=${hash(pdf)}`);
          console.log(`PAGES=${pages}`);
          if (b64.length!==264564) process.exit(1);
          if (br.length!==198423 || hash(br)!=='e99c503bb653bfc1f4c2fd800a5bc230404a6d22d02f3d1362cb66e1172b0612') process.exit(1);
          if (pdf.length!==312533 || hash(pdf)!=='1f99bd881404624ef8fe8bec9a10caf10a021f8cacff3ed5a6633101255178a5' || pages!==14) process.exit(1);
          NODE

      - name: Commit exact correction to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pachaninm-lab'
          git config user.email 'pachaninm@gmail.com'
          git add apps/web/lib/presentation-pdf/part-01.ts apps/web/lib/presentation-pdf/part-05.ts
          git diff --cached --check
          git commit -m 'fix(web): restore exact presentation transport bytes'
          git push origin HEAD:fix/presentation-regenerate-approved-source-20260829
