name: Company OS F2C Merge Controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-os-f2c-merge-controller.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: company-os-f2c-merge-controller
  cancel-in-progress: false

jobs:
  merge-controller:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted review gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Validate, synchronize and merge exact F2C branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedHead = `${owner}:company-os/f2c-control-host-cutover-4159`;
            const expectedPath = '.github/workflows/company-os-control-host-cutover.yml';

            let pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: expectedHead,
              base: 'main',
              per_page: 100,
            });
            if (pulls.length !== 1) {
              core.setFailed(`Expected exactly one open F2C PR, found ${pulls.length}`);
              return;
            }

            let pr = pulls[0];
            if (pr.draft) {
              core.setFailed('F2C PR is still draft');
              return;
            }
            if (pr.user?.login !== owner) {
              core.setFailed(`Unexpected PR author: ${pr.user?.login}`);
              return;
            }
            if (!/^Company OS F2C: guarded production cutover/.test(pr.title || '')) {
              core.setFailed(`Unexpected PR title: ${pr.title}`);
              return;
            }

            const validateFiles = async () => {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const names = files.map((file) => file.filename).sort();
              if (names.length !== 1 || names[0] !== expectedPath) {
                throw new Error(`F2C allowlist violation: ${names.join(', ')}`);
              }
              const file = files[0];
              if (file.status !== 'added' || file.changes < 200 || file.changes > 1200) {
                throw new Error(`Unexpected F2C file shape: status=${file.status}, changes=${file.changes}`);
              }
            };
            await validateFiles();

            try {
              await github.rest.pulls.updateBranch({
                owner,
                repo,
                pull_number: pr.number,
              });
              await new Promise((resolve) => setTimeout(resolve, 15000));
            } catch (error) {
              const status = error?.status;
              if (![202, 422].includes(status)) throw error;
            }

            pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
            let stableHead = pr.head.sha;
            if (!/^[0-9a-f]{40}$/.test(stableHead)) {
              throw new Error(`Invalid PR head SHA: ${stableHead}`);
            }
            await validateFiles();

            const terminalSuccess = new Set(['success', 'neutral', 'skipped']);
            const terminalFailure = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale']);
            let accepted = false;

            for (let attempt = 1; attempt <= 90; attempt += 1) {
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
              if (pr.state !== 'open') {
                core.setFailed(`F2C PR left open state before controlled merge: ${pr.state}`);
                return;
              }
              if (pr.head.sha !== stableHead) {
                stableHead = pr.head.sha;
                await validateFiles();
              }

              const [checkRuns, combined, reviews] = await Promise.all([
                github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: stableHead,
                  per_page: 100,
                }),
                github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: stableHead }),
                github.paginate(github.rest.pulls.listReviews, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                }),
              ]);

              const latestReviews = new Map();
              for (const review of reviews) {
                if (review.user?.login) latestReviews.set(review.user.login, review.state);
              }
              const blockers = [...latestReviews.entries()].filter(([, state]) => state === 'CHANGES_REQUESTED');
              if (blockers.length) {
                core.setFailed(`Changes requested by: ${blockers.map(([login]) => login).join(', ')}`);
                return;
              }

              const relevantChecks = checkRuns.filter((run) => run.name !== 'Validate, synchronize and merge exact F2C branch');
              const failingChecks = relevantChecks.filter((run) => terminalFailure.has(run.conclusion));
              const pendingChecks = relevantChecks.filter((run) => run.status !== 'completed');
              const failingStatuses = combined.data.statuses.filter((status) => status.state === 'failure' || status.state === 'error');
              const pendingStatuses = combined.data.statuses.filter((status) => status.state === 'pending');

              if (failingChecks.length || failingStatuses.length) {
                core.setFailed(`F2C checks failed: ${[
                  ...failingChecks.map((run) => run.name),
                  ...failingStatuses.map((status) => status.context),
                ].join(', ')}`);
                return;
              }

              const completedChecks = relevantChecks.filter((run) => run.status === 'completed' && terminalSuccess.has(run.conclusion));
              if (pendingChecks.length === 0 && pendingStatuses.length === 0 && completedChecks.length >= 5 && combined.data.state !== 'failure' && combined.data.state !== 'error') {
                accepted = true;
                break;
              }

              if (attempt === 90) break;
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            if (!accepted) {
              core.setFailed('F2C exact-head checks did not reach a stable accepted state within 22.5 minutes');
              return;
            }

            await validateFiles();
            pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
            if (pr.head.sha !== stableHead || pr.mergeable === false || pr.mergeable_state === 'dirty') {
              core.setFailed(`F2C PR not mergeable at accepted head: ${pr.mergeable_state}`);
              return;
            }

            execFileSync('node', ['docs/platform-v7/autopilot/verify-pr-review-gate.mjs'], {
              stdio: 'inherit',
              env: {
                ...process.env,
                GH_TOKEN: process.env.GH_TOKEN,
                REPO: `${owner}/${repo}`,
                PR_NUMBER: String(pr.number),
                HEAD_SHA: stableHead,
                REQUIRE_GREEN_CI: '1',
              },
            });

            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              sha: stableHead,
              commit_title: 'Company OS F2C: guarded production control-host cutover',
              commit_message: 'Merge exact-head owner-only cutover controller after CI/security acceptance. Production execution remains separately issue-authorized.',
            });
            if (!result.data.merged) {
              core.setFailed(`GitHub did not merge F2C PR: ${result.data.message}`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 4159,
              body: [
                '## Company OS F2C controller merged',
                '',
                `- PR: #${pr.number}`,
                `- Accepted head: \`${stableHead}\``,
                `- Merge commit: \`${result.data.sha}\``,
                '- Production mutation: **NONE**',
                '- Next authorized command: `/company-os control-host-cutover`',
              ].join('\n'),
            });
