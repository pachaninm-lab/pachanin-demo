name: Role Eligibility Enforcement Readiness

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/role-eligibility-enforcement-readiness.yml'
      - 'scripts/production-role-eligibility-readiness.sh'
      - 'scripts/check-role-eligibility-readiness-contract.mjs'

permissions:
  contents: read
  issues: write

env:
  DEFAULT_HOST: 195.19.12.120
  ISSUE_NUMBER: 4922
  COMMAND: /role-eligibility readiness current-main
  EVIDENCE_DIR: artifacts/role-eligibility-enforcement-readiness
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

concurrency:
  group: role-eligibility-enforcement-readiness
  cancel-in-progress: false

jobs:
  contract:
    name: Validate readiness authority
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.number == 4922 &&
       github.event.comment.body == '/role-eligibility readiness current-main' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate observational reporter contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-role-eligibility-readiness.sh
          node scripts/check-role-eligibility-readiness-contract.mjs

  report:
    name: Measure exact-main production shadow corpus
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4922 &&
      github.event.comment.body == '/role-eligibility readiness current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve immutable current-main target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          api_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$api_main" ]]
          [[ "$target" == "$GITHUB_SHA" ]] || { echo ROLE_ELIGIBILITY_RELEASE_MAIN_DRIFT >&2; exit 14; }
          printf '%s\n' "$target" > "$EVIDENCE_DIR/target-sha.txt"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo ROLE_ELIGIBILITY_CANONICAL_VPS_MISMATCH >&2; exit 20; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo ROLE_ELIGIBILITY_PRODUCTION_PRINCIPAL_INVALID >&2; exit 21; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 22
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo ROLE_ELIGIBILITY_PINNED_HOST_FINGERPRINT_REQUIRED >&2; exit 23; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo ROLE_ELIGIBILITY_NO_VALID_PROTECTED_PRIVATE_KEY >&2
            exit 24
          }

          scan="$(mktemp)"; match="$(mktemp)"; pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo ROLE_ELIGIBILITY_PINNED_HOST_KEY_MISMATCH >&2; exit 25; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo ROLE_ELIGIBILITY_READINESS_SSH_AUTH=PASS' \
            | tee "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROLE_ELIGIBILITY_READINESS_SSH_AUTH=PASS "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Recheck current-main immediately before observation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$current_main" == "$TARGET_SHA" ]] || { echo ROLE_ELIGIBILITY_RELEASE_MAIN_DRIFT >&2; exit 30; }

      - name: Run read-only production shadow corpus report
        id: corpus
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$TARGET_SHA'" \
            < scripts/production-role-eligibility-readiness.sh \
            > "$EVIDENCE_DIR/shadow-corpus.json" \
            2> "$EVIDENCE_DIR/runtime.log"
          remote_status=$?
          set -e
          cat "$EVIDENCE_DIR/runtime.log"
          (( remote_status == 0 )) || exit "$remote_status"
          grep -Fxq ROLE_ELIGIBILITY_READINESS_REPORT=PASS "$EVIDENCE_DIR/runtime.log"
          grep -Fxq ROLE_ELIGIBILITY_SHADOW_MODE=true "$EVIDENCE_DIR/runtime.log"
          grep -Fxq ROLE_ELIGIBILITY_ENFORCEMENT=false "$EVIDENCE_DIR/runtime.log"
          grep -Fxq PRODUCTION_DATABASE_MUTATION=0 "$EVIDENCE_DIR/runtime.log"
          grep -Fxq REGISTRATION_RUNTIME_UNCHANGED=PASS "$EVIDENCE_DIR/runtime.log"

          node - "$EVIDENCE_DIR/shadow-corpus.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [reportPath, outputPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          if (report?.schemaVersion !== 'role-eligibility-shadow-corpus.v1') throw new Error('REPORT_SCHEMA_INVALID');
          if (report?.transactionMode !== 'READ_ONLY' || report?.shadowMode !== true || report?.enforcement !== false) throw new Error('REPORT_MODE_INVALID');
          const allowed = new Set(['BLOCKED_INTEGRITY','INSUFFICIENT_CORPUS','MEASURED_NOT_AUTHORIZED']);
          if (!allowed.has(report?.readinessDecision)) throw new Error('REPORT_DECISION_INVALID');
          const forbidden = /(?:^|_)(?:inn|ogrn|kpp|legal_name|tenant_id|organization_id|application_id|email|phone|password|secret|token)(?:$|_)/i;
          const walk = (value) => {
            if (Array.isArray(value)) return value.forEach(walk);
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (forbidden.test(key)) throw new Error('REPORT_PII_KEY_FORBIDDEN');
              walk(child);
            }
          };
          walk(report);
          const lines = [
            `decision=${report.readinessDecision}`,
            `current_verdicts=${report.totals.currentVerdicts}`,
            `evidence_records=${report.totals.evidenceRecords}`,
            `current_status_mismatch=${report.integrity.currentStatusMismatch}`,
            `source_check_mismatch=${report.integrity.sourceCheckMismatch}`,
          ];
          fs.appendFileSync(outputPath, `${lines.join('\n')}\n`);
          NODE

      - name: Publish bounded readiness evidence
        if: always() && steps.corpus.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DECISION: ${{ steps.corpus.outputs.decision }}
          CURRENT_VERDICTS: ${{ steps.corpus.outputs.current_verdicts }}
          EVIDENCE_RECORDS: ${{ steps.corpus.outputs.evidence_records }}
          CURRENT_STATUS_MISMATCH: ${{ steps.corpus.outputs.current_status_mismatch }}
          SOURCE_CHECK_MISMATCH: ${{ steps.corpus.outputs.source_check_mismatch }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/result.md" <<EOF
          ## Role Eligibility enforcement-readiness observation \`$GITHUB_RUN_ID\`

          - target SHA: \`$TARGET_SHA\`
          - production DB transaction: \`READ ONLY\`
          - shadow mode: \`true\`
          - enforcement: \`false\`
          - production DB mutation: \`0\`
          - registration runtime unchanged: \`PASS\`
          - current verdicts: \`$CURRENT_VERDICTS\`
          - evidence records: \`$EVIDENCE_RECORDS\`
          - current-status mismatches: \`$CURRENT_STATUS_MISMATCH\`
          - source/check mismatches: \`$SOURCE_CHECK_MISMATCH\`
          - corpus decision: \`$DECISION\`

          \`ROLE_ELIGIBILITY_ENFORCEMENT_READINESS=PENDING\`
          \`REGISTRATION_CODE_CHANGED=0\`
          \`REGISTRATION_BEHAVIOR_CHANGED=0\`
          \`ROLE_ELIGIBILITY_ENFORCEMENT=false\`
          \`PRODUCTION_DATABASE_MUTATION=0\`
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/result.md"

      - name: Upload immutable observation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-eligibility-enforcement-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Fail closed on integrity contradiction
        if: always() && steps.corpus.outcome == 'success'
        env:
          DECISION: ${{ steps.corpus.outputs.decision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DECISION" != BLOCKED_INTEGRITY ]] || {
            echo ROLE_ELIGIBILITY_ENFORCEMENT_READINESS=BLOCKED_INTEGRITY >&2
            exit 40
          }
          echo ROLE_ELIGIBILITY_ENFORCEMENT_READINESS=PENDING
          echo ROLE_ELIGIBILITY_ENFORCEMENT=false

      - name: Cleanup bounded credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
