name: One-shot provider anchor repair

on:
  push:
    branches:
      - fix/local-qwen-evidence-binding-20260913
    paths:
      - .github/workflows/one-shot-provider-anchor-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'pachaninm-lab/pachanin-demo' && github.ref_name == 'fix/local-qwen-evidence-binding-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/local-qwen-evidence-binding-20260913
          fetch-depth: 2

      - name: Apply bounded speculative-anchor repair and self-delete
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_parent='fbb7a52cb2188357242acd240614533d12e96c8f'
          expected_blob='8a13960d5a6db5f74075505d1cc99391f25e777f'
          [[ "$(git rev-parse HEAD^)" == "$expected_parent" ]]
          [[ "$(git hash-object .github/workflows/local-qwen-independent-review.yml)" == "$expected_blob" ]]

          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/local-qwen-independent-review.yml')
          text = path.read_text(encoding='utf-8')

          start = text.index('          def candidate_anchor(item, content):\n')
          end = text.index('          def anchored_repair_schema(base_schema, item, anchor):\n', start)
          candidate_anchor = '''          def candidate_anchor(item, content):
              try:
                  value = json.loads(content)
              except json.JSONDecodeError:
                  return None
              if not isinstance(value, dict) or set(value) != {'findings'}:
                  return None
              findings = value.get('findings')
              if not isinstance(findings, list) or len(findings) != 1 or not isinstance(findings[0], dict):
                  return None
              finding = findings[0]
              path = finding.get('path')
              line = finding.get('line')
              evidence = finding.get('evidence')
              if path != item.get('path'):
                  return None
              if isinstance(line, bool) or not isinstance(line, int) or line < 1:
                  return None
              if not isinstance(evidence, str) or not evidence:
                  return None
              added = {
                  int(entry['line']): str(entry['text'])
                  for entry in item.get('added_lines', [])
                  if type(entry.get('line')) is int and isinstance(entry.get('text'), str)
              }
              exact_line = added.get(line)
              if exact_line is None:
                  return (line, evidence)
              return (line, evidence if evidence in exact_line else exact_line)

'''
          text = text[:start] + candidate_anchor + text[end:]

          start = text.index('          def repair_user(item, violation, rejected_content):\n')
          end = text.index('          def save_rejected(item, initial, final, initial_violation, final_violation, repair_sha):\n', start)
          repair_user = '''          def repair_user(item, violation, rejected_content):
              violation_guidance = ''
              anchor = candidate_anchor(item, rejected_content)
              if violation == 'SPECULATIVE_CLAIM':
                  violation_guidance = (
                      'For SPECULATIVE_CLAIM, do not repeat the rejected inference with different certainty wording. '
                      'A label, category, constant, enum member, or stored historical value does not by itself prove downstream retry, authorization, security, or control-flow behavior. '
                      'A non-empty finding requires the exact changed bytes in this same chunk to directly implement the claimed behavior or concrete failure mechanism; otherwise author findings=[]. '
                      'Do not use any of these policy-inadmissible words in a non-empty finding title or reason: could, may, might, likely, potential, potentially, possible, possibility, perhaps, maybe, speculate, speculative, speculatively. '
                  )
                  if anchor is not None:
                      line, evidence = anchor
                      violation_guidance += (
                          f'The rejected candidate is mechanically pinned to its original cited NEW_LINE_{line}. '
                          'This repair is not a new search for a replacement issue: any non-empty finding must stay on that same cited line and use the mechanically pinned evidence value. '
                          f'The pinned repair evidence is {json.dumps(evidence, ensure_ascii=True)}. '
                          'The repair response schema mechanically restricts any non-empty finding to that preserved path, line, and evidence. Neighboring lines are context only and cannot become a replacement evidence anchor. '
                          'If the pinned tuple is not itself an admissible added-line/verbatim-evidence tuple, or if it does not directly establish a concrete reproducible defect under the unchanged policy, author findings=[]. '
                          'When the original evidence was already valid, this preserves the same verbatim evidence substring; otherwise the deterministic anchor uses only the original cited trusted line and never permits a replacement line. '
                      )
              return (
                  item['user']
                  + '\\nTRUSTED_POLICY_REPAIR_NOTICE\\n'
                  + f'The prior candidate was rejected as policy-inadmissible: {violation}. '
                  + 'The rejected candidate title and reason are intentionally omitted so the fresh deterministic repair is anchored only to trusted evidence and the exact diff. '
                  + 'Re-review the exact same chunk under the unchanged trusted system policy. '
                  + violation_guidance
                  + 'Do not rephrase a hypothetical claim into definite wording. '
                  + 'A non-empty finding must cite one exact added line from BEGIN_TRUSTED_ADDED_LINE_INDEX and evidence must be a verbatim substring of that line. '
                  + 'Do not rely on any deployment, topology, data flow, or runtime assumption absent from the exact chunk. '
                  + 'Return findings=[] only when the changed bytes do not directly demonstrate a concrete reproducible defect.\\n'
              )

'''
          text = text[:start] + repair_user + text[end:]

          old = """          speculative_candidate = json.dumps({'findings': [speculative_probe]}, separators=(',', ':'))
          if candidate_anchor(probe_item, speculative_candidate) != (7, 'sanitize(input)'):
              fail('VALIDATOR_SELFTEST_REPAIR_ANCHOR_MISSING')
          schema_probe = {
"""
          new = """          speculative_candidate = json.dumps({'findings': [speculative_probe]}, separators=(',', ':'))
          if candidate_anchor(probe_item, speculative_candidate) != (7, 'sanitize(input)'):
              fail('VALIDATOR_SELFTEST_REPAIR_ANCHOR_MISSING')
          speculative_bad_evidence_probe = dict(speculative_probe, evidence='sanitize(input)\\nreplacement')
          speculative_bad_evidence_candidate = json.dumps({'findings': [speculative_bad_evidence_probe]}, separators=(',', ':'))
          if finding_violation(probe_item, speculative_bad_evidence_probe) != 'SPECULATIVE_CLAIM':
              fail('VALIDATOR_SELFTEST_SPECULATION_BAD_EVIDENCE_PRECEDENCE_FAILED')
          if candidate_anchor(probe_item, speculative_bad_evidence_candidate) != (7, 'const value = sanitize(input);'):
              fail('VALIDATOR_SELFTEST_REPAIR_BAD_EVIDENCE_NOT_PINNED_TO_CITED_LINE')
          speculative_wrong_line_candidate = json.dumps({'findings': [speculative_wrong_line_probe]}, separators=(',', ':'))
          if candidate_anchor(probe_item, speculative_wrong_line_candidate) != (8, 'sanitize(input)'):
              fail('VALIDATOR_SELFTEST_REPAIR_WRONG_LINE_NOT_PINNED')
          schema_probe = {
"""
          if text.count(old) != 1:
              raise SystemExit('expected speculative anchor selftest insertion point exactly once')
          text = text.replace(old, new, 1)

          old = """          if anchored_properties['evidence'] != {'type': 'string', 'enum': ['sanitize(input)']}:
              fail('VALIDATOR_SELFTEST_REPAIR_SCHEMA_EVIDENCE_NOT_PINNED')
          repair_probe = repair_user(probe_item, 'EVIDENCE_NOT_ON_CITED_ADDED_LINE', speculative_candidate)
"""
          new = """          if anchored_properties['evidence'] != {'type': 'string', 'enum': ['sanitize(input)']}:
              fail('VALIDATOR_SELFTEST_REPAIR_SCHEMA_EVIDENCE_NOT_PINNED')
          bad_evidence_anchor = candidate_anchor(probe_item, speculative_bad_evidence_candidate)
          bad_evidence_scoped = anchored_repair_schema(schema_probe, probe_item, bad_evidence_anchor)
          bad_evidence_properties = bad_evidence_scoped['properties']['findings']['items']['properties']
          if bad_evidence_properties['line'] != {'type': 'integer', 'enum': [7]}:
              fail('VALIDATOR_SELFTEST_REPAIR_BAD_EVIDENCE_SCHEMA_LINE_NOT_PINNED')
          if bad_evidence_properties['evidence'] != {'type': 'string', 'enum': ['const value = sanitize(input);']}:
              fail('VALIDATOR_SELFTEST_REPAIR_BAD_EVIDENCE_SCHEMA_NOT_PINNED_TO_CITED_LINE')
          repair_probe = repair_user(probe_item, 'EVIDENCE_NOT_ON_CITED_ADDED_LINE', speculative_candidate)
"""
          if text.count(old) != 1:
              raise SystemExit('expected schema selftest insertion point exactly once')
          text = text.replace(old, new, 1)

          old = """          if 'could, may, might, likely, potential' not in speculative_repair_probe:
              fail('VALIDATOR_SELFTEST_SPECULATION_REPAIR_FORBIDDEN_WORDS_MISSING')

          service = 'tai-qwen3-8b.service'
"""
          new = """          if 'could, may, might, likely, potential' not in speculative_repair_probe:
              fail('VALIDATOR_SELFTEST_SPECULATION_REPAIR_FORBIDDEN_WORDS_MISSING')
          bad_evidence_repair_probe = repair_user(probe_item, 'SPECULATIVE_CLAIM', speculative_bad_evidence_candidate)
          if 'trusted NEW_LINE_7' not in bad_evidence_repair_probe:
              fail('VALIDATOR_SELFTEST_SPECULATION_BAD_EVIDENCE_REPAIR_LINE_MISSING')
          if json.dumps('const value = sanitize(input);', ensure_ascii=True) not in bad_evidence_repair_probe:
              fail('VALIDATOR_SELFTEST_SPECULATION_BAD_EVIDENCE_REPAIR_PIN_MISSING')
          wrong_line_repair_probe = repair_user(probe_item, 'SPECULATIVE_CLAIM', speculative_wrong_line_candidate)
          if 'NEW_LINE_8' not in wrong_line_repair_probe or json.dumps('sanitize(input)', ensure_ascii=True) not in wrong_line_repair_probe:
              fail('VALIDATOR_SELFTEST_SPECULATION_WRONG_LINE_REPAIR_NOT_PINNED')

          service = 'tai-qwen3-8b.service'
"""
          if text.count(old) != 1:
              raise SystemExit('expected repair prompt selftest insertion point exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='')
          PY

          node --test docs/platform-v7/autopilot/verify-pr-review-gate.test.mjs
          git diff --check

          git rm .github/workflows/one-shot-provider-anchor-repair.yml
          git config user.name 'pachaninm-lab'
          git config user.email 'pachaninm@gmail.com'
          git add .github/workflows/local-qwen-independent-review.yml
          git diff --cached --check
          git commit -m 'fix(review): pin untrusted speculative evidence to cited line'
          git push origin HEAD:fix/local-qwen-evidence-binding-20260913
