name: Temporary auth-mail exact-SHA release wiring

on:
  push:
    branches:
      - p0/industrial-auth-mail-outbox-3785
    paths:
      - .github/workflows/tmp-auth-mail-release-wiring.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/industrial-auth-mail-outbox-3785
          fetch-depth: 0

      - name: Materialize bounded patch
        id: materialize
        shell: bash
        run: |
          set -uo pipefail
          REPORT="/tmp/auth-mail-materializer-${GITHUB_RUN_ID}.txt"
          BUNDLE="/tmp/auth-mail-materialized.tar.gz"
          STAGE="/tmp/auth-mail-materialized"
          status=0

          (
            set -euo pipefail
            echo "SOURCE_HEAD=$(git rev-parse HEAD)"
            echo "SOURCE_PATCH=c4f07f9ad5184b1bd055902c11b1e72a185e4c40"
            git show c4f07f9ad5184b1bd055902c11b1e72a185e4c40:.github/workflows/tmp-auth-mail-release-wiring.yml > /tmp/original-auth-mail-wiring.yml

            python3 - <<'PY'
            from pathlib import Path

            source = Path('/tmp/original-auth-mail-wiring.yml').read_text(encoding='utf-8')
            marker = "          python3 - <<'PATCHPY'\n"
            start = source.index(marker) + len(marker)
            end = source.index("\n          PATCHPY", start)
            raw_lines = source[start:end].splitlines()
            lines = [line[10:] if line.startswith('          ') else line for line in raw_lines]
            out = []
            repaired = 0
            i = 0
            while i < len(lines):
                line = lines[i]
                if "forbid('executor'" in line and 'build|commit|tag' in line and line.rstrip().endswith('/,'):
                    if i + 1 >= len(lines) or lines[i + 1].strip() != '",':
                        raise SystemExit('unexpected split-string continuation')
                    out.append(line + r'\n",')
                    i += 2
                    repaired += 1
                    continue
                out.append(line)
                i += 1
            if repaired != 1:
                raise SystemExit(f'expected one repair, got {repaired}')
            Path('/tmp/auth-mail-release-patch.py').write_text('\n'.join(out) + '\n', encoding='utf-8')
            print(f'EXTRACTION=PASS lines={len(out)} repaired={repaired}')
            PY

            python3 /tmp/auth-mail-release-patch.py
            echo 'PATCH=PASS'
            bash -n scripts/provision-production-auth-mail-runtime.sh
            bash -n scripts/production-full-stack-exact-sha.sh
            node scripts/check-production-full-stack-release.mjs
            git diff --check
            echo 'VALIDATION=PASS'

            mkdir -p \
              "$STAGE/scripts" \
              "$STAGE/.github/workflows" \
              "$STAGE/docs/platform-v7/autopilot/scopes"
            cp scripts/provision-production-auth-mail-runtime.sh "$STAGE/scripts/"
            cp scripts/production-full-stack-exact-sha.sh "$STAGE/scripts/"
            cp scripts/check-production-full-stack-release.mjs "$STAGE/scripts/"
            cp .github/workflows/production-full-stack-exact-sha.yml "$STAGE/.github/workflows/"
            cp .github/workflows/docker-publish.yml "$STAGE/.github/workflows/"
            cp docs/platform-v7/autopilot/scopes/industrial-auth-mail-outbox-3785.json "$STAGE/docs/platform-v7/autopilot/scopes/"
            tar -C /tmp -czf "$BUNDLE" auth-mail-materialized
            echo 'MATERIALIZE=PASS'
          ) >"$REPORT" 2>&1 || status=$?

          echo "MATERIALIZE_EXIT=$status" >> "$REPORT"
          cat "$REPORT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload materializer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-mail-materializer-evidence
          path: |
            /tmp/auth-mail-materializer-*.txt
            /tmp/auth-mail-materialized.tar.gz
          if-no-files-found: warn
          retention-days: 1

      - name: Propagate materializer failure
        if: steps.materialize.outputs.status != '0'
        shell: bash
        run: exit 1
