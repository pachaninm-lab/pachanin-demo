name: Production DB Principal Observation

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-db-principal-observer.yml'
      - 'scripts/production-db-principal-observer.sh'
      - 'scripts/check-production-db-principal-observer-contract.mjs'

permissions:
  contents: read
  issues: write

env:
  DEFAULT_HOST: 195.19.12.120
  ISSUE_NUMBER: 4890
  COMMAND: /security rls observe production-principal
  EVIDENCE_DIR: artifacts/production-db-principal-observation
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

concurrency:
  group: production-db-principal-observation
  cancel-in-progress: false

jobs:
  contract:
    name: Validate read-only observer authority
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.number == 4890 &&
       github.event.comment.body == '/security rls observe production-principal' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate observer contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-db-principal-observer.sh
          node scripts/check-production-db-principal-observer-contract.mjs

  observe:
    name: Observe production API database principal
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4890 &&
      github.event.comment.body == '/security rls observe production-principal' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind observation to immutable current main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          api_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$api_main" ]]
          [[ "$target" == "$GITHUB_SHA" ]] || { echo PRODUCTION_DB_PRINCIPAL_MAIN_DRIFT >&2; exit 14; }
          printf '%s\n' "$target" > "$EVIDENCE_DIR/observer-main-sha.txt"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo PRODUCTION_DB_PRINCIPAL_CANONICAL_VPS_MISMATCH >&2; exit 20; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo PRODUCTION_DB_PRINCIPAL_PRODUCTION_PRINCIPAL_INVALID >&2; exit 21; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 22
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo PRODUCTION_DB_PRINCIPAL_PINNED_HOST_FINGERPRINT_REQUIRED >&2; exit 23; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo PRODUCTION_DB_PRINCIPAL_NO_VALID_PROTECTED_PRIVATE_KEY >&2
            exit 24
          }

          scan="$(mktemp)"; match="$(mktemp)"; pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo PRODUCTION_DB_PRINCIPAL_PINNED_HOST_KEY_MISMATCH >&2; exit 25; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo PRODUCTION_DB_PRINCIPAL_SSH_AUTH=PASS' \
            | tee "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq PRODUCTION_DB_PRINCIPAL_SSH_AUTH=PASS "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Recheck current main immediately before observation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$current_main" == "$TARGET_SHA" ]] || { echo PRODUCTION_DB_PRINCIPAL_MAIN_DRIFT >&2; exit 30; }

      - name: Run read-only production principal observation
        id: observe
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "bash -s -- '$TARGET_SHA'" \
            < scripts/production-db-principal-observer.sh \
            > "$EVIDENCE_DIR/principal.json" \
            2> "$EVIDENCE_DIR/runtime.log"
          cat "$EVIDENCE_DIR/runtime.log"
          grep -Fxq PRODUCTION_DB_PRINCIPAL_OBSERVATION=PASS "$EVIDENCE_DIR/runtime.log"
          grep -Fxq PRODUCTION_DATABASE_MUTATION=0 "$EVIDENCE_DIR/runtime.log"

          node - "$EVIDENCE_DIR/principal.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [reportPath, outputPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          if (report?.schemaVersion !== 'pc-crop.production-db-principal-observation.v1') throw new Error('REPORT_SCHEMA_INVALID');
          if (report?.transactionMode !== 'READ_ONLY' || report?.productionDatabaseMutation !== 0) throw new Error('REPORT_MODE_INVALID');
          if (!/^[A-Za-z_][A-Za-z0-9_$-]{0,62}$/.test(report?.principal || '')) throw new Error('PRINCIPAL_NAME_INVALID');
          const f = report.flags || {};
          const lines = [
            `principal=${report.principal}`,
            `api_revision=${report.apiRevision}`,
            `superuser=${Boolean(f.superuser)}`,
            `bypass_rls=${Boolean(f.bypassRls)}`,
            `create_db=${Boolean(f.createDb)}`,
            `create_role=${Boolean(f.createRole)}`,
            `replication=${Boolean(f.replication)}`,
            `dangerous_memberships=${report.dangerousMembershipCount}`,
            `unforced_rls_owned_tables=${report.unforcedRlsOwnedTableCount}`,
            `deploy_gate_confined=${Boolean(report.deployGateConfined)}`,
            `issue_4890_acceptance_ready=${Boolean(report.issue4890AcceptanceReady)}`,
          ];
          fs.appendFileSync(outputPath, `${lines.join('\n')}\n`);
          NODE

      - name: Publish bounded observation to issue 4890
        if: always() && steps.observe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PRINCIPAL: ${{ steps.observe.outputs.principal }}
          API_REVISION: ${{ steps.observe.outputs.api_revision }}
          SUPERUSER: ${{ steps.observe.outputs.superuser }}
          BYPASS_RLS: ${{ steps.observe.outputs.bypass_rls }}
          CREATE_DB: ${{ steps.observe.outputs.create_db }}
          CREATE_ROLE: ${{ steps.observe.outputs.create_role }}
          REPLICATION: ${{ steps.observe.outputs.replication }}
          DANGEROUS_MEMBERSHIPS: ${{ steps.observe.outputs.dangerous_memberships }}
          UNFORCED_RLS_OWNED_TABLES: ${{ steps.observe.outputs.unforced_rls_owned_tables }}
          DEPLOY_GATE_CONFINED: ${{ steps.observe.outputs.deploy_gate_confined }}
          ISSUE_4890_ACCEPTANCE_READY: ${{ steps.observe.outputs.issue_4890_acceptance_ready }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/result.md" <<EOF
          ## Production API database principal observation \`$GITHUB_RUN_ID\`

          - observer main SHA: \`$TARGET_SHA\`
          - production API revision: \`$API_REVISION\`
          - current database principal: \`$PRINCIPAL\`
          - superuser: \`$SUPERUSER\`
          - BYPASSRLS: \`$BYPASS_RLS\`
          - CREATEDB: \`$CREATE_DB\`
          - CREATEROLE: \`$CREATE_ROLE\`
          - REPLICATION: \`$REPLICATION\`
          - privileged-role memberships: \`$DANGEROUS_MEMBERSHIPS\`
          - owned RLS tables without FORCE: \`$UNFORCED_RLS_OWNED_TABLES\`
          - deploy confinement gate: \`$DEPLOY_GATE_CONFINED\`
          - issue #4890 acceptance-ready: \`$ISSUE_4890_ACCEPTANCE_READY\`
          - transaction: \`REPEATABLE READ / READ ONLY\`
          - production DB mutation: \`0\`

          \`PRODUCTION_DB_PRINCIPAL_OBSERVATION=PASS\`
          \`PRODUCTION_DATABASE_MUTATION=0\`
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/result.md"

      - name: Upload immutable observation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-db-principal-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Cleanup bounded credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
