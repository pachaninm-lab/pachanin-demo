name: TAI AP-14F1B Source Admission Registry

on:
  pull_request:
    paths:
      - '.github/workflows/tai-ap-14f1b.yml'
      - 'apps/tai/knowledge-sources/AP-14F1B-SOURCE-ADMISSION.schema.v1.json'
      - 'apps/tai/knowledge-sources/AP-14F1B-SOURCE-ADMISSION.v1.json'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1b-3355.json'
      - 'scripts/tai-ap-14f1b/verify.mjs'
  push:
    branches:
      - main
      - agent/tai-ap-14f1b-source-admission-3355
    paths:
      - '.github/workflows/tai-ap-14f1b.yml'
      - 'apps/tai/knowledge-sources/AP-14F1B-SOURCE-ADMISSION.schema.v1.json'
      - 'apps/tai/knowledge-sources/AP-14F1B-SOURCE-ADMISSION.v1.json'
      - 'docs/platform-v7/autopilot/scopes/tai-ap-14f1b-3355.json'
      - 'scripts/tai-ap-14f1b/verify.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tai-ap-14f1b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: artifacts/tai-ap-14f1b

jobs:
  source-admission:
    name: Authority bindings · rights · parser · quarantine
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - name: Resolve governed comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            base_ref="HEAD^"
          else
            base_ref="fcd0a372fb3a94ba36408479bd1b18f33b16c4e8"
          fi
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify source-controlled scope
        if: github.ref_name != 'main'
        shell: bash
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: |
          set -euo pipefail
          export GITHUB_HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          bash scripts/p7-autopilot-guard.sh

      - name: Verify fail-closed source admission registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXACT_HEAD" > "$EVIDENCE_DIR/exact-head.txt"
          printf '%s\n' "${{ steps.base.outputs.base_ref }}" > "$EVIDENCE_DIR/base-ref.txt"
          set +e
          node scripts/tai-ap-14f1b/verify.mjs \
            --scope-guard "${{ steps.base.outputs.base_ref }}" \
            > "$EVIDENCE_DIR/acceptance.json" \
            2> "$EVIDENCE_DIR/verifier-error.txt"
          verifier_status=$?
          set -e
          cat "$EVIDENCE_DIR/acceptance.json"
          cat "$EVIDENCE_DIR/verifier-error.txt" >&2
          test "$verifier_status" -eq 0
          test ! -s "$EVIDENCE_DIR/verifier-error.txt"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/acceptance.json`, 'utf8'));
          if (report.status !== 'PASS') process.exit(1);
          if (report.operationalStatus !== 'NOT_ATTESTED') process.exit(1);
          if (report.productionHosting !== 'REG_RU_VPS_ONLY') process.exit(1);
          if (report.counts.changedPaths !== 5) process.exit(1);
          if (report.counts.authorityBindings !== 4) process.exit(1);
          if (report.counts.parserProfiles !== 5) process.exit(1);
          if (report.counts.candidateSources !== 10) process.exit(1);
          if (report.counts.metadataOnly !== 6) process.exit(1);
          if (report.counts.rightsUnresolved !== 4) process.exit(1);
          if (report.counts.allowedSharedRag !== 0) process.exit(1);
          if (report.counts.quarantineReasons !== 12) process.exit(1);
          if (report.counts.negativeMutationProbes !== 10) process.exit(1);
          if (Object.values(report.boundaries).some(Boolean)) process.exit(1);
          NODE

      - name: Upload AP-14F1B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-ap-14f1b-${{ env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
