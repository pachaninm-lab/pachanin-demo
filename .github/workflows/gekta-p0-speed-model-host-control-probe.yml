                      bad = copy.deepcopy(good); bad[field] = value; cases.append(bad)
                  bad = copy.deepcopy(good); del bad['state_stability']; cases.append(bad)
                  for key, value in (('ipv4_listeners', True), ('target_ipv4_listeners', 1), ('local_address', 'NOT_REQUIRED'), ('scope', 'UNIT_NAMESPACE')):
                      bad = copy.deepcopy(good); bad['network'][key] = value; cases.append(bad)
                  bad = copy.deepcopy(good); bad['failed_target']['readable_entries'] = 0; cases.append(bad)
                  bad = copy.deepcopy(good); bad['start_authority']['service_action'] = 'START'; cases.append(bad)
                  bad = copy.deepcopy(good); bad['start_authority']['reason'] = 'UNCLASSIFIED'; cases.append(bad)
                  for bad in cases:
                      with self.assertRaises(ValueError): bind_reporter['checked_bind_report'](json.dumps(bad).encode(), 0)
                  raw = json.dumps(good).encode()
                  for data, rc in ((raw, 1), (raw + b' ' * 8193, 0), (raw.replace(b'{', b'{"schema":"x",', 1), 0)):
                      with self.assertRaises(ValueError): bind_reporter['checked_bind_report'](data, rc)
                  current = {'status': 'LITERAL', 'mode': 'OTHER_IPV4', 'port': 'OTHER'}
                  failed = {'status': 'MATCHED', 'mode': 'OTHER_IPV4', 'port': 'OTHER'}
                  self.assertEqual(bind_reader['bind_relation'](current, failed), 'UNPROVEN')

              def test_main_emits_only_closed_error_for_drift_or_unexpected_exception(self):
                  for error, code in ((bind_reader['BindError']('NETWORK_CHANGED'), 'NETWORK_CHANGED'), (RuntimeError('short private detail'), 'READ_ERROR')):
                      output = io.StringIO()
                      with patch.dict(bind_reader, {'observe_failed_bind': lambda: (_ for _ in ()).throw(error)}), \
                              patch.object(bind_reader['signal'], 'signal'), patch.object(bind_reader['signal'], 'setitimer'), contextlib.redirect_stdout(output):
                          with self.assertRaises(SystemExit) as stopped: bind_reader['bind_main']()
                      self.assertEqual(stopped.exception.code, 1)
                      report, rc = bind_reporter['checked_bind_report'](output.getvalue().encode(), 1)
                      self.assertEqual(report, {'schema': 'gekta.fixed-unit-bind-evidence.v1', 'observation': 'ERROR', 'error': code})
                      self.assertEqual(rc, 1)

              def test_existing_diagnostic_and_new_query_are_separate_and_no_service_action_exists(self):
                  self.assertLess(workflow.index('\n      - name: Read bounded failed-unit startup evidence'), workflow.index('\n      - name: Read bounded failed-unit HTTP bind facts'))
                  self.assertLess(workflow.index('\n      - name: Read bounded failed-unit HTTP bind facts'), workflow.index('\n      - name: Read bounded control-plane facts'))
                  self.assertNotIn('systemctl start', bind_reader_source)
                  for forbidden in ('sudo ', 'pkexec', 'shell=True', 'socket.socket', 'os.kill', '/proc/*', 'os.environ', 'setns'):
                      # A comment may mention setns only to describe the prohibition.
                      tree_text = ast.dump(ast.parse(bind_reader_source), include_attributes=False)
                      self.assertNotIn(forbidden, tree_text)
                  self.assertEqual(bind_reader['BIND_PORT'], 18080)
                  self.assertEqual(len(bind_reader['BIND_PROPERTIES']), 18)
                  schema = bind_reader_source.split('\nimport fcntl\n', 1)[0]
                  self.assertEqual(schema, bind_reporter_source.split('\nimport pathlib\n', 1)[0])


          if __name__ == '__main__':
