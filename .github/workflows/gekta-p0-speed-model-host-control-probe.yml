                      raise ValueError
                  for key in spec:
                      bind_shape(value[key], spec[key])
              elif isinstance(spec, tuple):
                  if type(value) is not str or value not in spec:
                      raise ValueError
              elif type(spec) is int:
                  if type(value) is not int or not 0 <= value <= spec:
                      raise ValueError
              else:
                  raise ValueError


          def checked_bind_report(raw, remote_rc):
              if not isinstance(raw, bytes) or not 0 < len(raw) <= 8192 or b'\x00' in raw:
                  raise ValueError
              report = json.loads(raw.decode('ascii'), object_pairs_hook=bind_unique_object)
              if not isinstance(report, dict) or report.get('schema') != BIND_SCHEMA:
                  raise ValueError
              if report.get('observation') == 'ERROR':
                  bind_shape(report, {'schema': (BIND_SCHEMA,), 'observation': ('ERROR',), 'error': BIND_ERRORS})
                  if remote_rc != 1:
                      raise ValueError
                  return report, 1
              if report.get('observation') == 'NOT_APPLICABLE':
                  bind_shape(report, {'schema': (BIND_SCHEMA,), 'observation': ('NOT_APPLICABLE',), 'state': BIND_STATE_SPEC})
                  if remote_rc != 0 or all(report['state'][key] == value for key, value in (('load', 'LOADED'), ('active', 'FAILED'), ('sub', 'FAILED'))):
                      raise ValueError
                  return report, 0
              bind_shape(report, {'schema': (BIND_SCHEMA,), 'observation': ('COMPLETE',), 'state': BIND_STATE_SPEC,
                                 'state_stability': ('UNCHANGED',), 'current_target': BIND_LITERAL_SPEC,
                                 'failed_target': BIND_FAILURE_SPEC, 'target_relation': ('MATCH', 'DIFFERENT', 'UNPROVEN'),
                                 'network': BIND_NETWORK_SPEC, 'start_authority': BIND_AUTH_SPEC})
              if remote_rc != 0 or any(report['state'][key] != value for key, value in (('load', 'LOADED'), ('active', 'FAILED'), ('sub', 'FAILED'))):
                  raise ValueError
              current, failed, net, auth = (report[key] for key in ('current_target', 'failed_target', 'network', 'start_authority'))
              if current['status'] == 'UNPROVEN' and (current['mode'], current['port']) != ('UNPROVEN', 'UNPROVEN'):
                  raise ValueError
              if current['status'] == 'LITERAL' and ('UNPROVEN' in (current['mode'], current['port'])):
                  raise ValueError
              if failed['readable_entries'] + failed['unsupported_messages'] > 200 or failed['matches'] > failed['readable_entries']:
                  raise ValueError
              if failed['status'] == 'MATCHED':
                  if not failed['matches'] or failed['mode'] == 'UNPROVEN' or failed['port'] == 'UNPROVEN' or failed['coverage'] != 'CURRENT_INVOCATION_PARTIAL':
                      raise ValueError
              elif failed['mode'] != 'UNPROVEN' or failed['port'] != 'UNPROVEN':
                  raise ValueError
              if failed['status'] == 'NO_MATCH' and (failed['matches'] or not failed['readable_entries'] + failed['unsupported_messages']):
                  raise ValueError
              if failed['status'] == 'AMBIGUOUS' and failed['matches'] < 2:
                  raise ValueError
              if failed['status'] == 'UNAVAILABLE' and (failed['readable_entries'] or failed['unsupported_messages'] or failed['matches'] or failed['coverage'] != 'UNAVAILABLE'):
                  raise ValueError
              if failed['status'] != 'UNAVAILABLE' and failed['coverage'] != 'CURRENT_INVOCATION_PARTIAL':
                  raise ValueError
              usable = ('PRIVATE_BASELINE_IPV4', 'LOOPBACK_IPV4', 'WILDCARD_IPV4')
              relation = 'UNPROVEN'
              if current['status'] == 'LITERAL' and failed['status'] == 'MATCHED':
                  if current['port'] != failed['port'] or (current['mode'] in usable and failed['mode'] in usable and current['mode'] != failed['mode']):
                      relation = 'DIFFERENT'
                  elif current['port'] == failed['port'] == 'FIXED_18080' and current['mode'] == failed['mode'] and current['mode'] in usable:
                      relation = 'MATCH'
              if report['target_relation'] != relation:
                  raise ValueError
              selected = current if current['status'] == 'LITERAL' and current['port'] == 'FIXED_18080' and current['mode'] in usable else failed if failed['status'] == 'MATCHED' and failed['port'] == 'FIXED_18080' and failed['mode'] in usable else None
              expected_basis = 'CURRENT_EXECSTART_LITERAL' if selected is current else 'LAST_FAILED_INVOCATION' if selected is failed else 'UNPROVEN'
              if net['target_basis'] != expected_basis or net['target_mode'] != (selected['mode'] if selected else 'UNPROVEN'):
                  raise ValueError
              if net['target_mode'] == 'WILDCARD_IPV4':
                  if net['local_address'] != 'NOT_REQUIRED':
                      raise ValueError
              elif net['target_mode'] == 'UNPROVEN' and net['local_address'] != 'UNPROVEN':
                  raise ValueError
              elif net['local_address'] == 'NOT_REQUIRED':
                  raise ValueError
              total = net['ipv4_listeners'] + net['ipv6_listeners']
              readable_families = sum(net[key] == 'OBSERVED' for key in ('ipv4_status', 'ipv6_status'))
              if net['status'] != ('OBSERVED' if readable_families == 2 else 'PARTIAL' if readable_families else 'UNAVAILABLE'):
                  raise ValueError
              if (net['ipv4_status'] == 'UNAVAILABLE' and net['ipv4_listeners']) or (net['ipv6_status'] == 'UNAVAILABLE' and net['ipv6_listeners']):
                  raise ValueError
              if net['target_mode'] in ('WILDCARD_IPV4', 'UNPROVEN') and net['target_ipv4_listeners']:
                  raise ValueError
              if total > 200 or net['target_ipv4_listeners'] + net['wildcard_ipv4_listeners'] > net['ipv4_listeners'] or net['wildcard_ipv6_listeners'] > net['ipv6_listeners']:
                  raise ValueError
              if net['other_address_listeners'] != total - net['target_ipv4_listeners'] - net['wildcard_ipv4_listeners'] - net['wildcard_ipv6_listeners']:
                  raise ValueError
              if net['status'] == 'UNAVAILABLE':
                  if total or net['ownership'] != 'UNPROVEN' or net['stability'] != 'UNPROVEN':
                      raise ValueError
              elif net['stability'] != 'UNCHANGED' or (total == 0) != (net['ownership'] == 'NONE') or (total and net['ownership'] == 'UNPROVEN'):
                  raise ValueError
              if auth['polkit'] != 'CHECK_ERROR' and auth['reason'] != 'NONE':
                  raise ValueError
              return report, 0

          import fcntl
          import ipaddress
          import os
          import pwd
          import shlex
          import shutil
          import signal
          import subprocess
          import sys
          import time

          BIND_UNIT = 'tai-qwen3-8b.service'
          BIND_PORT = 18080
          BIND_PRIVATE = '192.168.0.206'
          BIND_TARGETS = {'PRIVATE_BASELINE_IPV4': BIND_PRIVATE, 'LOOPBACK_IPV4': '127.0.0.1', 'WILDCARD_IPV4': '0.0.0.0'}
          BIND_TIMES = ('InactiveExitTimestampMonotonic', 'ExecMainStartTimestampMonotonic', 'ExecMainExitTimestampMonotonic')
          BIND_PROPERTIES = ('LoadState', 'ActiveState', 'SubState', 'Result', 'ExecMainCode', 'ExecMainStatus', 'NRestarts', 'InvocationID') + BIND_TIMES + ('User', 'ExecStart', 'CanStart', 'RefuseManualStart', 'PrivateNetwork', 'NetworkNamespacePath', 'JoinsNamespaceOf')
          BIND_SHOW = ['/usr/bin/systemctl', 'show', BIND_UNIT, '--no-pager', '--all', '--property=' + ','.join(BIND_PROPERTIES)]
          BIND_DEADLINE = None


          class BindError(Exception):
              pass


          def bind_subject():
              pair = (os.getuid(), os.geteuid())
              if pair[0] <= 0 or pair[0] != pair[1]:
                  raise BindError('IDENTITY_REJECTED')
              return pair


          def bind_remaining():
              remaining = 5.0 if BIND_DEADLINE is None else min(5.0, BIND_DEADLINE - time.monotonic())
              if remaining <= 0:
                  raise BindError('DEADLINE')
              return remaining


          def bind_command(argv, limit, discard_stdout=False):
              subject = bind_subject()
              captures = []
              try:
                  for size in (limit, 4096):
                      try:
                          fd = os.memfd_create('gekta-bind-observation', os.MFD_CLOEXEC | os.MFD_ALLOW_SEALING)
                          captures.append(fd)
                          os.ftruncate(fd, size)
                          fcntl.fcntl(fd, getattr(fcntl, 'F_ADD_SEALS', 1033), getattr(fcntl, 'F_SEAL_GROW', 4) | getattr(fcntl, 'F_SEAL_SHRINK', 2) | getattr(fcntl, 'F_SEAL_SEAL', 1))
                      except (AttributeError, OSError):
                          raise BindError('CAPTURE_UNAVAILABLE') from None
                  try:
                      result = subprocess.run(argv, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL if discard_stdout else captures[0], stderr=captures[1],
                                              timeout=bind_remaining(), check=False, env={'PATH': '/usr/bin:/bin', 'LC_ALL': 'C'})
                      status, rc = 'OK', result.returncode
                  except subprocess.TimeoutExpired:
                      status, rc = 'TIMEOUT', None
                  except OSError:
                      status, rc = 'UNAVAILABLE', None
                  if bind_subject() != subject:
                      raise BindError('IDENTITY_REJECTED')
                  data = []
                  for fd, cap in zip(captures, (limit, 4096)):
                      count = os.lseek(fd, 0, os.SEEK_CUR)
                      if not 0 <= count < cap:
                          raise BindError('CAP_EXCEEDED')
                      raw = os.pread(fd, count, 0)
                      if len(raw) != count:
                          raise BindError('READ_ERROR')
                      data.append(raw)
                  return status, rc, data[0], data[1]
              finally:
                  for fd in captures:
                      os.close(fd)


          def bind_read(path, limit):
              bind_remaining()
              fd = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
              try:
                  data = bytearray()
                  while True:
                      bind_remaining()
                      chunk = os.read(fd, min(8192, limit + 1 - len(data)))
                      if not chunk:
                          return bytes(data)
                      data.extend(chunk)
                      if len(data) > limit:
                          raise BindError('CAP_EXCEEDED')
              finally:
                  os.close(fd)


          def bind_uint(text, limit=18446744073709551615):
              if not isinstance(text, str) or not re.fullmatch(r'0|[1-9][0-9]{0,19}', text) or int(text) > limit:
                  raise ValueError
              return int(text)


          def bind_snapshot():
              status, rc, raw, _ = bind_command(BIND_SHOW, 16384)
              if status != 'OK' or rc != 0:
                  raise BindError('SNAPSHOT_READ_ERROR')
              try:
                  if not raw or b'\x00' in raw or b'\r' in raw:
                      raise ValueError
                  pairs = []
                  for line in raw.decode('ascii').splitlines():
                      key, sep, value = line.partition('=')
                      if not sep:
                          raise ValueError
                      pairs.append((key, value))
                  values = bind_unique_object(pairs)
                  if set(values) != set(BIND_PROPERTIES):
                      raise ValueError
                  for key in ('CanStart', 'RefuseManualStart', 'PrivateNetwork'):
                      if values[key] not in ('yes', 'no'):
                          raise ValueError
                  for key in ('LoadState', 'ActiveState', 'SubState', 'Result'):
                      if values[key] and not re.fullmatch(r'[a-z][a-z0-9-]{0,47}', values[key]):
                          raise ValueError
                  state = {key: desired if values[prop] == raw_value else 'OTHER' for key, prop, raw_value, desired in (
                      ('load', 'LoadState', 'loaded', 'LOADED'), ('active', 'ActiveState', 'failed', 'FAILED'),
                      ('sub', 'SubState', 'failed', 'FAILED'), ('result', 'Result', 'exit-code', 'EXIT_CODE'))}
                  for key, prop in (('exec_code', 'ExecMainCode'), ('exec_status', 'ExecMainStatus'), ('restarts', 'NRestarts')):
                      state[key] = bind_uint(values[prop], 2147483647)
                  times = {key: bind_uint(values[key]) for key in BIND_TIMES}
                  invocation = values['InvocationID']
                  if invocation and not re.fullmatch(r'[0-9a-f]{32}', invocation):
                      raise ValueError
                  boot = bind_read('/proc/sys/kernel/random/boot_id', 64).decode('ascii').strip()
                  if not re.fullmatch(r'[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}', boot):
                      raise ValueError
                  return {'values': values, 'state': state, 'times': times, 'invocation': invocation if invocation.strip('0') else None, 'boot': boot.replace('-', '')}
              except (ValueError, UnicodeError, OSError):
                  raise BindError('SNAPSHOT_INVALID') from None


          def bind_mode(host):
              for mode, value in BIND_TARGETS.items():
                  if host == value:
                      return mode
              try:
                  address = ipaddress.ip_address(host)
                  return 'OTHER_IPV4' if address.version == 4 else 'OTHER_IPV6'
              except ValueError:
                  return 'OTHER_LITERAL'


          def bind_current_target(execstart):
              missing = {'status': 'UNPROVEN', 'mode': 'UNPROVEN', 'port': 'UNPROVEN'}
              # Only the literal direct-server argv representation is interpreted. Shell,
              # wrappers, environment expansion, duplicate flags and ambiguous escapes are not guessed.
              if not isinstance(execstart, str) or any(c in execstart for c in ('\\', '$', '`', '\n', '\r', '\x00')):
                  return missing
              match = re.fullmatch(r'\{\s*path=([^;{}]+?)\s*;\s*argv\[\]=([^;{}]+?)\s*;\s*ignore_errors=(?:yes|no)\s*;[^{}]*\}', execstart)
              if not match:
                  return missing
              path, raw = match.groups()
              path = path.strip()
              if path.rsplit('/', 1)[-1] not in ('llama-server', 'server'):
                  return missing
              try:
                  args = shlex.split(raw, posix=True)
              except ValueError:
                  return missing
              if not 1 <= len(args) <= 256 or args[0] != path:
                  return missing
              # A finite complete argv grammar avoids mistaking an option's opaque value
              # for --host/--port. Unknown options or expansion make the target unproven.
              grammar = {'--host': 'host', '--port': 'port', '--model': 'text', '-m': 'text',
                         '--alias': 'text', '-a': 'text'}
              grammar.update({flag: 'number' for flag in ('--ctx-size', '-c', '--threads', '-t', '--threads-batch', '-tb',
                              '--parallel', '-np', '--batch-size', '-b', '--ubatch-size', '-ub',
                              '--n-gpu-layers', '--gpu-layers', '-ngl')})
              hits, index = {'host': [], 'port': []}, 1
              while index < len(args):
                  name = args[index]
                  if name not in grammar:
                      return missing
                  if index + 1 >= len(args):
                      return missing
                  value, index = args[index + 1], index + 2
                  if not value or value.startswith('-'):
                      return missing
                  kind = grammar[name]
                  if kind in ('number', 'port'):
                      try:
                          bind_uint(value, 65535 if kind == 'port' else 2147483647)
                      except ValueError:
                          return missing
                  if kind in hits:
                      hits[kind].append(value)
              if any(len(v) != 1 or not v[0] for v in hits.values()):
                  return missing
              try:
                  port = bind_uint(hits['port'][0], 65535)
              except ValueError:
                  return missing
              return {'status': 'LITERAL', 'mode': bind_mode(hits['host'][0]), 'port': 'FIXED_18080' if port == BIND_PORT else 'OTHER'}


          def bind_empty_failure():
              return {'status': 'UNAVAILABLE', 'mode': 'UNPROVEN', 'port': 'UNPROVEN', 'readable_entries': 0,
                      'unsupported_messages': 0, 'matches': 0, 'coverage': 'UNAVAILABLE'}


          def bind_failed_target(before):
              now_us = time.monotonic_ns() // 1000
              times = before['times']
              start, end, unit = (times[k] for k in ('ExecMainStartTimestampMonotonic', 'ExecMainExitTimestampMonotonic', 'InactiveExitTimestampMonotonic'))
              if not before['invocation'] or not (0 < start <= end <= now_us and 0 < unit <= now_us):
                  return bind_empty_failure()
              lower = start if unit > end else unit
              uid = bind_subject()[0]
              argv = ['/usr/bin/journalctl', '--no-pager', '--boot', '--lines=200', '--output=json',
                      '--output-fields=MESSAGE,_SYSTEMD_INVOCATION_ID,_SYSTEMD_UNIT,_BOOT_ID,_UID,__MONOTONIC_TIMESTAMP',
                      '_SYSTEMD_UNIT=' + BIND_UNIT, '_SYSTEMD_INVOCATION_ID=' + before['invocation'], '_UID=' + str(uid)]
              status, rc, raw, _ = bind_command(argv, 65536)
              if status != 'OK' or rc != 0 or not raw.strip() or raw.strip() == b'-- No entries --':
                  return bind_empty_failure()
              try:
                  lines = raw.decode('utf-8').splitlines()
                  if not 1 <= len(lines) <= 200:
                      raise ValueError
                  readable = unsupported = matches = 0
                  targets = set()
                  for line in lines:
                      row = json.loads(line, object_pairs_hook=bind_unique_object)
                      if not isinstance(row, dict) or any(row.get(key) != wanted for key, wanted in (
                              ('_SYSTEMD_UNIT', BIND_UNIT), ('_SYSTEMD_INVOCATION_ID', before['invocation']),
                              ('_BOOT_ID', before['boot']), ('_UID', str(uid)))):
                          raise ValueError
                      stamp = bind_uint(row.get('__MONOTONIC_TIMESTAMP'))
                      if stamp <= 0 or stamp > time.monotonic_ns() // 1000:
                          raise ValueError
                      if stamp < lower:
                          continue
                      message = row.get('MESSAGE')
                      if not isinstance(message, str) or len(message.encode('utf-8')) > 4096 or '\x00' in message:
                          unsupported += 1
                          continue
                      readable += 1
                      if message.endswith('\n'):
                          message = message[:-1]
                      message = re.sub(r'(?:\x1b\[[0-9;]{0,20}m)+$', '', message)
                      prefix, separator, body = message.partition('srv         start: ')
                      if not separator or '\x1b' in body:
                          continue
                      # Logger colors occur in the prefix and final reset, never in a
                      # hostname value. Do not normalize control bytes inside that value.
                      message = re.sub(r'\x1b\[[0-9;]{0,20}m', '', prefix) + separator + body
                      # Pinned SRV_ERR expands to srv + two spaces + %12.*s(__func__);
                      # this call site is start(). Only its complete logger grammar matches.
                      match = re.fullmatch(r"(?:(?:[0-9]{1,10}\.[0-9]{2}\.[0-9]{3}\.[0-9]{3} )?E )?srv {9}start: couldn't bind HTTP server socket, hostname: ([^,\r\n]{1,255}), port: (0|[1-9][0-9]{0,4})", message)
                      if match:
                          host, port_text = match.groups()
                          port = bind_uint(port_text, 65535)
                          matches += 1
                          targets.add((host, port))
                  if not readable and not unsupported:
                      return bind_empty_failure()
                  result = {'status': 'NO_MATCH', 'mode': 'UNPROVEN', 'port': 'UNPROVEN', 'readable_entries': readable,
                            'unsupported_messages': unsupported, 'matches': matches, 'coverage': 'CURRENT_INVOCATION_PARTIAL'}
                  if len(targets) > 1:
                      result['status'] = 'AMBIGUOUS'
                  elif targets:
                      host, port = next(iter(targets))
                      result.update(status='MATCHED', mode=bind_mode(host), port='FIXED_18080' if port == BIND_PORT else 'OTHER')
                  return result
              except (ValueError, UnicodeError, TypeError):
                  raise BindError('JOURNAL_INVALID') from None


          def bind_tcp(raw, family):
              try:
                  if not raw or b'\x00' in raw or len(raw) > 65536:
                      raise ValueError
                  lines = raw.decode('ascii').splitlines()
                  if not lines or not re.match(r'\s*sl\s+local_address\s+(?:rem_address|remote_address)\s+st\s+', lines[0]):
                      raise ValueError
                  result = []
                  for line in lines[1:]:
                      columns = line.split()
                      if not 10 <= len(columns) <= 32 or not re.fullmatch(r'[0-9]+:', columns[0]):
                          raise ValueError
                      size = 8 if family == 4 else 32
                      local = re.fullmatch(r'([0-9A-Fa-f]{' + str(size) + r'}):([0-9A-Fa-f]{4})', columns[1])
                      if not local or not re.fullmatch(r'[0-9A-Fa-f]{2}', columns[3]):
                          raise ValueError
                      uid, inode = bind_uint(columns[7], 4294967295), bind_uint(columns[9])
                      if int(local[2], 16) != BIND_PORT or columns[3].upper() != '0A':
                          continue
                      if inode == 0:
                          raise ValueError
                      address_raw = bytes.fromhex(local[1])
                      if sys.byteorder == 'little':
                          address_raw = b''.join(address_raw[i:i + 4][::-1] for i in range(0, len(address_raw), 4))
                      address = str(ipaddress.ip_address(address_raw))
                      result.append((family, address, uid, inode))
                      if len(result) > 200:
                          raise BindError('CAP_EXCEEDED')
                  if len(set(result)) != len(result) or len({x[3] for x in result}) != len(result):
                      raise ValueError
                  return tuple(sorted(result))
              except (ValueError, UnicodeError, IndexError):
                  raise BindError('READ_ERROR') from None


          def bind_namespace():
              # Only fixed kernel namespace links. No process enumeration or setns call.
              own = os.readlink('/proc/self/ns/net')
              if not re.fullmatch(r'net:\[[1-9][0-9]{0,19}\]', own):
                  raise BindError('IDENTITY_REJECTED')
              try:
                  manager = os.readlink('/proc/1/ns/net')
              except OSError:
                  return own, 'UNPROVEN'
              if not re.fullmatch(r'net:\[[1-9][0-9]{0,19}\]', manager):
                  return own, 'UNPROVEN'
              return own, 'MATCH' if own == manager else 'DIFFERENT'


          def bind_address(mode):
              if mode == 'WILDCARD_IPV4':
                  return 'NOT_REQUIRED'
              if mode not in ('PRIVATE_BASELINE_IPV4', 'LOOPBACK_IPV4'):
                  return 'UNPROVEN'
              ip = shutil.which('ip', path='/usr/sbin:/usr/bin:/sbin:/bin')
              if not ip:
                  return 'UNPROVEN'
              wanted = BIND_TARGETS[mode]
              status, rc, raw, _ = bind_command([ip, '-j', '-4', 'address', 'show', 'to', wanted + '/32'], 16384)
              if status != 'OK' or rc != 0:
                  return 'UNPROVEN'
              try:
                  rows = json.loads(raw.decode('ascii'), object_pairs_hook=bind_unique_object)
                  if not isinstance(rows, list) or len(rows) > 32:
                      raise ValueError
                  present, count = False, 0
                  for row in rows:
                      if not isinstance(row, dict) or not isinstance(row.get('addr_info'), list):
                          raise ValueError
                      for address in row['addr_info']:
                          count += 1
                          if count > 64 or not isinstance(address, dict) or address.get('family') != 'inet':
                              raise ValueError
                          value = str(ipaddress.IPv4Address(address.get('local')))
                          if value != wanted:
                              raise ValueError
                          present = True
                  return 'PRESENT' if present else 'ABSENT'
              except (ValueError, UnicodeError, TypeError):
                  return 'UNPROVEN'


          def bind_network_snapshot(mode):
              own_ns, manager = bind_namespace()
              families = {}
              for family, path in ((4, '/proc/net/tcp'), (6, '/proc/net/tcp6')):
                  try:
                      families[family] = bind_tcp(bind_read(path, 65536), family)
                  except OSError:
                      families[family] = None
              rows = None if all(value is None for value in families.values()) else tuple(row for value in families.values() if value is not None for row in value)
              if rows is not None and (len(rows) > 200 or len({x[3] for x in rows}) != len(rows)):
                  raise BindError('CAP_EXCEEDED')
              try:
                  raw = bind_read('/proc/sys/net/ipv4/ip_nonlocal_bind', 8).strip()
                  nonlocal_bind = 'ENABLED' if raw == b'1' else 'DISABLED' if raw == b'0' else 'UNPROVEN'
              except OSError:
                  nonlocal_bind = 'UNPROVEN'
              return {'namespace_identity': own_ns, 'manager_namespace': manager, 'rows': rows,
                      'ipv4_status': 'UNAVAILABLE' if families[4] is None else 'OBSERVED',
                      'ipv6_status': 'UNAVAILABLE' if families[6] is None else 'OBSERVED',
                      'local_address': bind_address(mode), 'nonlocal_bind': nonlocal_bind}


          def bind_polkit():
              result = {'polkit': 'UNAVAILABLE', 'reason': 'NONE'}
              command = shutil.which('pkcheck', path='/usr/bin:/bin')
              if not command:
                  return result
              try:
                  raw = bind_read('/proc/self/stat', 4096).decode('ascii')
                  pid = os.getpid()
                  start = bind_uint(raw.rsplit(')', 1)[1].split()[19])
                  if int(raw.split(' ', 1)[0]) != pid or not start:
                      raise ValueError
                  subject = str(pid) + ',' + str(start) + ',' + str(bind_subject()[0])
              except (ValueError, OSError, UnicodeError, IndexError):
                  return {'polkit': 'SUBJECT_UNVERIFIED', 'reason': 'NONE'}
              status, rc, _, stderr = bind_command([command, '--action-id', 'org.freedesktop.systemd1.manage-units',
                  '--process', subject, '--detail', 'unit', BIND_UNIT, '--detail', 'verb', 'start'], 64, discard_stdout=True)
              if status == 'TIMEOUT':
                  return {'polkit': 'CHECK_TIMEOUT', 'reason': 'NONE'}
              if status != 'OK':
                  return {'polkit': 'CHECK_ERROR', 'reason': 'UNCLASSIFIED'}
