              if ('UNSUPPORTED_MESSAGES' in coverage) != (selected['unsupported_messages'] + pre['unsupported_messages'] > 0):
                  raise ValueError
              partial = late or 'ACCESS_LIMITED' in coverage or selected['unsupported_messages'] > 0 or skipped > 0
              if journal['status'] in ('CURRENT', 'CURRENT_PARTIAL') and (journal['status'] == 'CURRENT_PARTIAL') != partial:
