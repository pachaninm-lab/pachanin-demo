                                 '12': 'ALLOCATION_FAILED', '13': 'PERMISSION_DENIED',
                                 '22': 'ARGUMENT_VALUE_INVALID', '24': 'FILE_DESCRIPTOR_LIMIT',
                                 '98': 'ADDRESS_IN_USE', '99': 'LOCAL_ADDRESS_UNAVAILABLE'}[match.group(1)])
