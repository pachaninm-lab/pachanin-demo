          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError
                  result[key] = value
              return result


          def checked_details(report):
              details = report['startup_details']
              if not isinstance(details, dict) or set(details) != {'status', 'skipped_before_window', 'coverage', 'selected', 'pre_main'} or details['status'] not in ('UNAVAILABLE', 'COLLECTED'):
                  raise ValueError
              skipped = details['skipped_before_window']
              if type(skipped) is not int or not 0 <= skipped <= 200:
                  raise ValueError
              def ordered(value, allowed):
                  if not isinstance(value, list) or any(type(item) is not str or item not in allowed for item in value) or value != [item for item in allowed if item in value]:
                      raise ValueError
              ordered(details['coverage'], DETAIL_COVERAGE)
              def bucket(value, pre=False):
                  keys = {'entries', 'unsupported_messages', 'errorlike_messages', 'unmapped_error_messages', 'codes', 'options', 'exceptions', 'markers'}
                  if not isinstance(value, dict) or set(value) != keys | ({'scope'} if pre else set()):
                      raise ValueError
                  for key in ('entries', 'unsupported_messages', 'errorlike_messages', 'unmapped_error_messages'):
                      if type(value[key]) is not int or not 0 <= value[key] <= 200:
                          raise ValueError
                  if not 0 <= value['unmapped_error_messages'] <= value['errorlike_messages'] <= value['entries'] - value['unsupported_messages']:
                      raise ValueError
                  for key, allowed in (('codes', DETAIL_CODES), ('options', DETAIL_OPTIONS), ('exceptions', DETAIL_EXCEPTIONS), ('markers', DETAIL_MARKERS)):
                      ordered(value[key], allowed)
                      if value[key] and not value['errorlike_messages']:
                          raise ValueError
                  if value['options'] and not set(value['codes']) & {'INVALID_ARGUMENT', 'ARGUMENT_PARSE_FAILED', 'ARGUMENT_VALUE_INVALID', 'ARGUMENT_VALUE_MISSING', 'ENVIRONMENT_PARSE_FAILED', 'WRAPPER_FLAG_INVALID'}:
                      raise ValueError
                  if value['exceptions'] and not set(value['codes']) & {'PYTHON_EXCEPTION', 'UNCAUGHT_EXCEPTION'}:
                      raise ValueError
                  if pre and value['scope'] not in ('NOT_SELECTED', 'PRE_MAIN_CURRENT_INVOCATION'):
                      raise ValueError
                  return not any(value[key] for key in keys)
              selected, pre = details['selected'], details['pre_main']
              selected_empty, pre_empty = bucket(selected), bucket(pre, True)
              if details['status'] == 'UNAVAILABLE':
