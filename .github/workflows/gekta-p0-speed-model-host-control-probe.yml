          except Exception:
              report, rc = {'schema': SCHEMA, 'observation': 'ERROR', 'error': 'RECEIPT_INVALID'}, 1
          print('CONTROL_STARTUP_DIAG=' + json.dumps(report, separators=(',', ':'), sort_keys=True, ensure_ascii=True))
          raise SystemExit(rc)
          FAILED_UNIT_REPORT

      - name: Read bounded control-plane facts
