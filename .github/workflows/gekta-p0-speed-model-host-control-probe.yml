                  combined = set(bucket[key]) | values
                  bucket[key] = [value for value in allowed if value in combined]

          class ProbeError(Exception):
              pass


          def nonroot_subject():
              subject = (os.getuid(), os.geteuid())
              if subject[0] <= 0 or subject[0] != subject[1]:
                  raise ProbeError('IDENTITY_REJECTED')
              return subject


          def bounded_command(argv, stdout_limit):
              subject = nonroot_subject()
              captures = []
              try:
                  for size in (stdout_limit, 4096):
                      try:
                          fd = os.memfd_create('gekta-startup-evidence', os.MFD_CLOEXEC | os.MFD_ALLOW_SEALING)
                          captures.append(fd)
                          os.ftruncate(fd, size)
                          fcntl.fcntl(fd, getattr(fcntl, 'F_ADD_SEALS', 1033), getattr(fcntl, 'F_SEAL_GROW', 4) | getattr(fcntl, 'F_SEAL_SHRINK', 2) | getattr(fcntl, 'F_SEAL_SEAL', 1))
                      except (AttributeError, OSError):
                          raise ProbeError('CAPTURE_UNAVAILABLE') from None
                  try:
                      result = subprocess.run(argv, stdin=subprocess.DEVNULL, stdout=captures[0], stderr=captures[1], timeout=5, check=False, env={'PATH': '/usr/bin:/bin', 'LC_ALL': 'C'})
                      outcome, rc = 'OK', result.returncode
                  except subprocess.TimeoutExpired:
                      outcome, rc = 'TIMEOUT', None
                  except OSError:
                      outcome, rc = 'READ_ERROR', None
                  if nonroot_subject() != subject:
                      raise ProbeError('IDENTITY_REJECTED')
                  buffers = []
                  for fd, limit in zip(captures, (stdout_limit, 4096)):
                      length = os.lseek(fd, 0, os.SEEK_CUR)
                      if not 0 <= length < limit:
                          return 'OVERSIZE', rc, b'', b''
                      raw = os.pread(fd, length, 0)
                      if len(raw) != length:
                          return 'READ_ERROR', rc, b'', b''
                      buffers.append(raw)
                  return outcome, rc, buffers[0], buffers[1]
              finally:
                  for fd in captures:
                      os.close(fd)


          def unsigned(value, upper):
              if not re.fullmatch(r'0|[1-9][0-9]{0,19}', value) or int(value) > upper:
                  raise ProbeError('SNAPSHOT_INVALID')
              return int(value)


          def snapshot():
              outcome, rc, raw, _ = bounded_command(SHOW_ARGV, 4096)
              if outcome == 'TIMEOUT':
                  raise ProbeError('SNAPSHOT_TIMEOUT')
              if outcome != 'OK' or rc != 0:
                  raise ProbeError('SNAPSHOT_READ_ERROR')
              try:
                  if not raw or b'\x00' in raw or b'\r' in raw:
                      raise ValueError
                  pairs = []
                  for line in raw.decode('ascii').splitlines():
                      key, separator, value = line.partition('=')
                      if not separator:
                          raise ValueError
                      pairs.append((key, value))
                  values = unique_object(pairs)
                  if set(values) != set(PROPERTIES):
                      raise ValueError
                  state = {}
                  for key, allowed in ENUMS.items():
                      value = values[key]
                      if key == 'Result' and value == '':
                          state[key] = 'NOT_SET'
                          continue
                      if not re.fullmatch(r'[a-z][a-z0-9-]{0,47}', value):
                          raise ValueError
                      normalized = value.upper().replace('-', '_')
                      state[key] = normalized if normalized in allowed else 'OTHER'
                  for key, upper in LIMITS.items():
                      state[key] = unsigned(values[key], upper)
                  invocation = values['InvocationID']
                  if invocation and not re.fullmatch(r'[0-9a-f]{32}', invocation):
                      raise ValueError
                  times = {key: unsigned(values[key], 18446744073709551615) for key in TIME_FIELDS}
                  return {'values': values, 'state': state, 'invocation': invocation if invocation.strip('0') else None, 'times': times}
              except (ValueError, UnicodeError, KeyError):
                  raise ProbeError('SNAPSHOT_INVALID') from None


          def journal_result(status, entries=0, unsupported=0, classes=(), hints=()):
              return {'status': status, 'entries': entries, 'unsupported_messages': unsupported, 'error_classes': list(classes), 'argument_hints': list(hints)}


          def select_journal_window(before, now_us):
              begin = before['times']['InactiveExitTimestampMonotonic']
              start, end = (before['times'][key] for key in ('ExecMainStartTimestampMonotonic', 'ExecMainExitTimestampMonotonic'))
              if not 0 < begin <= now_us:
                  return 'UNIT_BOUNDARY_UNAVAILABLE', None
              if not 0 < start <= end <= now_us:
                  return 'MAIN_WINDOW_UNAVAILABLE', begin
              # systemd may advance InactiveExit when scheduling auto-restart after main exit.
              # In that proven relation, retain only evidence at/after the validated main start.
              if begin > end:
                  return 'UNIT_AFTER_MAIN_EXIT', start
              return 'UNIT_BEFORE_OR_AT_MAIN_EXIT', begin


          def read_journal(before, lower_bound, main_start_only=False):
              def unavailable(status):
                  return journal_result(status), empty_details()
              invocation = before['invocation']
              if not invocation:
                  return unavailable('NO_INVOCATION')
              if lower_bound is None:
                  return unavailable('INVALID')
              argv = ['/usr/bin/journalctl', '--no-pager', '--boot', '--lines=200', '--output=json', '--output-fields=MESSAGE,_SYSTEMD_INVOCATION_ID,_SYSTEMD_UNIT,__MONOTONIC_TIMESTAMP', '_SYSTEMD_UNIT=' + SERVICE, '_SYSTEMD_INVOCATION_ID=' + invocation]
              outcome, rc, raw, stderr = bounded_command(argv, 65536)
              if outcome != 'OK':
                  return unavailable(outcome if outcome in JOURNAL_STATES else 'READ_ERROR')
              access_limited = re.search(br'permission denied|access denied|insufficient permissions|not seeing messages from other users|no journal files were opened', stderr, re.I) is not None
              if rc != 0:
                  return unavailable('UNREADABLE' if access_limited else 'READ_ERROR')
              if not raw.strip() or raw.strip() == b'-- No entries --':
                  return unavailable('UNREADABLE' if access_limited else 'NO_EVIDENCE')
              try:
                  lines = raw.decode('utf-8').splitlines()
                  if not 1 <= len(lines) <= 200:
                      raise ValueError
                  now_us = time.monotonic_ns() // 1000
                  observations, unsupported, older, classes, hints = 0, 0, 0, set(), set()
                  details = empty_details()
                  details['status'] = 'COLLECTED'
                  if main_start_only:
                      # This separate bucket binds current boot/unit/invocation, not MainPID.
                      # It does not change the v2 selected window or claim complete startup coverage.
                      details['pre_main']['scope'] = 'PRE_MAIN_CURRENT_INVOCATION'
                  for line in lines:
                      row = json.loads(line, object_pairs_hook=unique_object)
                      if not isinstance(row, dict) or row.get('_SYSTEMD_UNIT') != SERVICE or row.get('_SYSTEMD_INVOCATION_ID') != invocation:
                          return unavailable('NOT_CURRENT')
                      timestamp = row.get('__MONOTONIC_TIMESTAMP')
                      if not isinstance(timestamp, str) or not re.fullmatch(r'[1-9][0-9]{0,19}', timestamp):
                          raise ValueError
                      stamp = int(timestamp)
                      if stamp > now_us:
                          return unavailable('NOT_CURRENT')
                      if stamp < lower_bound:
                          older += 1
                          if main_start_only:
                              add_detail_message(details['pre_main'], row.get('MESSAGE'))
                          continue
                      observations += 1
                      message = row.get('MESSAGE')
                      add_detail_message(details['selected'], message)
                      if not isinstance(message, str) or len(message.encode('utf-8')) > 4096:
                          unsupported += 1
                          continue
                      for category, patterns in PATTERNS.items():
                          if any(re.search(pattern, message, re.I) for pattern in patterns):
                              classes.add(category)
                      for match in re.finditer(r'\b(?:unknown|unrecognized|invalid) (?:command[- ]line )?(?:argument|option|flag)\s*[:=]?\s*[\x22\x27\x60]?(--[a-z][a-z0-9-]{0,63})\b', message, re.I):
                          label = match.group(1)[2:].upper().replace('-', '_')
                          hints.add(label if label in ARGUMENT_HINTS else 'OTHER')
                  details['skipped_before_window'] = older
                  conditions = {'MAIN_START_ONLY': main_start_only, 'ACCESS_LIMITED': access_limited,
                                'ROW_LIMIT_REACHED': len(lines) == 200,
                                'UNSUPPORTED_MESSAGES': unsupported + details['pre_main']['unsupported_messages'] > 0}
                  details['coverage'] = [value for value in DETAIL_COVERAGE if conditions[value]]
                  if not observations:
                      return journal_result('OLD' if older else 'NO_EVIDENCE'), details
                  if unsupported == observations:
                      return journal_result('UNREADABLE', observations, unsupported), details
                  journal = journal_result('CURRENT_PARTIAL' if access_limited or unsupported or older or main_start_only else 'CURRENT', observations, unsupported, [value for value in CLASSES if value in classes], [value for value in ARGUMENT_HINTS if value in hints])
                  return journal, details
              except (ValueError, UnicodeError, KeyError, OverflowError):
                  return unavailable('INVALID')


          def observe_failure():
              subject = nonroot_subject()
              before = snapshot()
              state = before['state']
              if state['LoadState'] != 'LOADED' or state['ActiveState'] != 'FAILED' or state['SubState'] != 'FAILED':
                  if nonroot_subject() != subject:
                      raise ProbeError('IDENTITY_REJECTED')
                  return {'schema': SCHEMA, 'observation': 'NOT_FAILED'}
              now_us = time.monotonic_ns() // 1000
              relation, lower_bound = select_journal_window(before, now_us)
              journal, details = read_journal(before, lower_bound, relation == 'UNIT_AFTER_MAIN_EXIT')
              after = snapshot()
              if nonroot_subject() != subject:
                  raise ProbeError('IDENTITY_REJECTED')
              if before != after:
                  journal = journal_result('NOT_CURRENT')
                  details = empty_details()
              start, end = (before['times'][key] for key in ('ExecMainStartTimestampMonotonic', 'ExecMainExitTimestampMonotonic'))
              age = (now_us - end) // 1000000 if 0 < start <= end <= now_us else None
              if age is not None and age > 4294967295:
                  age = None
              return {'schema': SCHEMA, 'observation': 'COMPLETE', 'state': state, 'main_exit_age_seconds': age, 'timing_relation': relation, 'journal': journal, 'startup_details': details}


          def main():
              try:
                  report = observe_failure()
                  rc = 0
              except ProbeError as error:
                  code = error.args[0] if error.args and error.args[0] in ERRORS else 'READ_ERROR'
                  report, rc = {'schema': SCHEMA, 'observation': 'ERROR', 'error': code}, 1
              except Exception:
                  report, rc = {'schema': SCHEMA, 'observation': 'ERROR', 'error': 'READ_ERROR'}, 1
              print(json.dumps(report, separators=(',', ':'), sort_keys=True, ensure_ascii=True))
              return rc


          if __name__ == '__main__':
              raise SystemExit(main())
          FAILED_UNIT_PROBE
          failed_unit_rc=$?
          set -e
          python3 -I -B - "$RUNNER_TEMP/failed-unit-raw" "$failed_unit_rc" <<'FAILED_UNIT_REPORT'
          import json
          import re

          SCHEMA = 'gekta.fixed-unit-startup-evidence.v3'
          ENUMS = {
              'LoadState': ('STUB', 'LOADED', 'NOT_FOUND', 'BAD_SETTING', 'ERROR', 'MERGED', 'MASKED', 'OTHER'),
              'ActiveState': ('ACTIVE', 'RELOADING', 'INACTIVE', 'FAILED', 'ACTIVATING', 'DEACTIVATING', 'MAINTENANCE', 'REFRESHING', 'OTHER'),
              'SubState': ('DEAD', 'CONDITION', 'START_PRE', 'START', 'START_POST', 'RUNNING', 'EXITED', 'RELOAD', 'RELOAD_SIGNAL', 'RELOAD_NOTIFY', 'STOP', 'STOP_WATCHDOG', 'STOP_SIGTERM', 'STOP_SIGKILL', 'STOP_POST', 'FINAL_WATCHDOG', 'FINAL_SIGTERM', 'FINAL_SIGKILL', 'FAILED', 'AUTO_RESTART', 'AUTO_RESTART_QUEUED', 'CLEANING', 'DEAD_BEFORE_AUTO_RESTART', 'FAILED_BEFORE_AUTO_RESTART', 'DEAD_RESOURCES_PINNED', 'OTHER'),
              'Result': ('SUCCESS', 'RESOURCES', 'PROTOCOL', 'TIMEOUT', 'EXIT_CODE', 'SIGNAL', 'CORE_DUMP', 'WATCHDOG', 'START_LIMIT_HIT', 'OOM_KILL', 'EXEC_CONDITION', 'SKIP_CONDITION', 'NOT_SET', 'OTHER'),
              'Type': ('SIMPLE', 'EXEC', 'FORKING', 'ONESHOT', 'DBUS', 'NOTIFY', 'NOTIFY_RELOAD', 'IDLE', 'OTHER'),
              'Restart': ('NO', 'ON_SUCCESS', 'ON_FAILURE', 'ON_ABNORMAL', 'ON_WATCHDOG', 'ON_ABORT', 'ALWAYS', 'OTHER'),
          }
          LIMITS = {'ExecMainCode': 6, 'ExecMainStatus': 255, 'NRestarts': 4294967295}
          ERRORS = ('IDENTITY_REJECTED', 'CAPTURE_UNAVAILABLE', 'SNAPSHOT_TIMEOUT', 'SNAPSHOT_READ_ERROR', 'SNAPSHOT_INVALID', 'READ_ERROR')
          JOURNAL_STATES = ('CURRENT', 'CURRENT_PARTIAL', 'NO_EVIDENCE', 'UNREADABLE', 'OLD', 'NOT_CURRENT', 'NO_INVOCATION', 'TIMEOUT', 'READ_ERROR', 'OVERSIZE', 'INVALID')
          TIMING_RELATIONS = ('UNIT_BEFORE_OR_AT_MAIN_EXIT', 'UNIT_AFTER_MAIN_EXIT', 'MAIN_WINDOW_UNAVAILABLE', 'UNIT_BOUNDARY_UNAVAILABLE')
          CLASSES = ('INVALID_ARGUMENT', 'MODEL_OPEN_FAILED', 'MODEL_LOAD_FAILED', 'MODEL_FORMAT_ERROR', 'UNSUPPORTED_ARCHITECTURE', 'ADDRESS_IN_USE', 'BIND_FAILED', 'ALLOCATION_FAILED', 'PERMISSION_DENIED', 'REQUIRED_FILE_UNAVAILABLE')
          ARGUMENT_HINTS = ('THREADS', 'THREADS_BATCH', 'PARALLEL', 'CTX_SIZE', 'BATCH_SIZE', 'UBATCH_SIZE', 'CACHE_RAM', 'CACHE_REUSE', 'CACHE_PROMPT', 'KV_UNIFIED', 'FLASH_ATTN', 'MODEL', 'HOST', 'PORT', 'API_KEY', 'API_KEY_FILE', 'OTHER')


          DETAIL_CODES = CLASSES + (
              'ARGUMENT_PARSE_FAILED', 'ARGUMENT_VALUE_INVALID', 'ARGUMENT_VALUE_MISSING',
              'ENVIRONMENT_PARSE_FAILED', 'CPU_MASK_INVALID', 'CPU_RANGE_INVALID',
              'CPU_AFFINITY_FAILED', 'CACHE_TYPE_UNSUPPORTED', 'FILE_OPEN_FAILED',
              'FILE_READ_FAILED', 'CONFIG_PARSE_FAILED', 'AUTH_CONFIG_FAILED',
