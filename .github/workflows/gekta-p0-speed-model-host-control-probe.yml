              current = bind_current_target(before['values']['ExecStart'])
              failed = bind_failed_target(before)
              usable = tuple(BIND_TARGETS)
              selected = current if current['status'] == 'LITERAL' and current['port'] == 'FIXED_18080' and current['mode'] in usable else failed if failed['status'] == 'MATCHED' and failed['port'] == 'FIXED_18080' and failed['mode'] in usable else None
              basis = 'CURRENT_EXECSTART_LITERAL' if selected is current else 'LAST_FAILED_INVOCATION' if selected is failed else 'UNPROVEN'
              mode = selected['mode'] if selected else 'UNPROVEN'
              first = bind_network_snapshot(mode)
              authority = bind_polkit()
              last = bind_network_snapshot(mode)
              after = bind_snapshot()
              if bind_subject() != identity or before != after:
                  raise BindError('STATE_CHANGED')
              if first != last:
