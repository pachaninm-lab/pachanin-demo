          def bind_shape(value, spec):
              if isinstance(spec, dict):
                  if not isinstance(value, dict) or set(value) != set(spec):
                      raise ValueError
                  for key in spec:
                      bind_shape(value[key], spec[key])
              elif isinstance(spec, tuple):
                  if type(value) is not str or value not in spec:
                      raise ValueError
              elif type(spec) is int:
                  if type(value) is not int or not 0 <= value <= spec:
                      raise ValueError
              else:
