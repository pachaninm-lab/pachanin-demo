          )
          DETAIL_COVERAGE = ('MAIN_START_ONLY', 'ACCESS_LIMITED', 'ROW_LIMIT_REACHED', 'UNSUPPORTED_MESSAGES')


          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError
                  result[key] = value
              return result


          def checked_details(report):
              details = report['startup_details']
              if not isinstance(details, dict) or set(details) != {'status', 'skipped_before_window', 'coverage', 'selected', 'pre_main'} or details['status'] not in ('UNAVAILABLE', 'COLLECTED'):
                  raise ValueError
              skipped = details['skipped_before_window']
              if type(skipped) is not int or not 0 <= skipped <= 200:
                  raise ValueError
              def ordered(value, allowed):
                  if not isinstance(value, list) or any(type(item) is not str or item not in allowed for item in value) or value != [item for item in allowed if item in value]:
                      raise ValueError
              ordered(details['coverage'], DETAIL_COVERAGE)
              def bucket(value, pre=False):
                  keys = {'entries', 'unsupported_messages', 'errorlike_messages', 'unmapped_error_messages', 'codes', 'options', 'exceptions', 'markers'}
                  if not isinstance(value, dict) or set(value) != keys | ({'scope'} if pre else set()):
                      raise ValueError
                  for key in ('entries', 'unsupported_messages', 'errorlike_messages', 'unmapped_error_messages'):
                      if type(value[key]) is not int or not 0 <= value[key] <= 200:
                          raise ValueError
                  if not 0 <= value['unmapped_error_messages'] <= value['errorlike_messages'] <= value['entries'] - value['unsupported_messages']:
                      raise ValueError
                  for key, allowed in (('codes', DETAIL_CODES), ('options', DETAIL_OPTIONS), ('exceptions', DETAIL_EXCEPTIONS), ('markers', DETAIL_MARKERS)):
                      ordered(value[key], allowed)
                      if value[key] and not value['errorlike_messages']:
                          raise ValueError
                  if value['options'] and not set(value['codes']) & {'INVALID_ARGUMENT', 'ARGUMENT_PARSE_FAILED', 'ARGUMENT_VALUE_INVALID', 'ARGUMENT_VALUE_MISSING', 'ENVIRONMENT_PARSE_FAILED', 'WRAPPER_FLAG_INVALID'}:
                      raise ValueError
                  if value['exceptions'] and not set(value['codes']) & {'PYTHON_EXCEPTION', 'UNCAUGHT_EXCEPTION'}:
                      raise ValueError
                  if pre and value['scope'] not in ('NOT_SELECTED', 'PRE_MAIN_CURRENT_INVOCATION'):
                      raise ValueError
                  return not any(value[key] for key in keys)
              selected, pre = details['selected'], details['pre_main']
              selected_empty, pre_empty = bucket(selected), bucket(pre, True)
              if details['status'] == 'UNAVAILABLE':
                  if skipped or details['coverage'] or not selected_empty or not pre_empty or pre['scope'] != 'NOT_SELECTED':
                      raise ValueError
                  if report['journal']['status'] in ('CURRENT', 'CURRENT_PARTIAL', 'OLD'):
                      raise ValueError
                  return
              journal = report['journal']
              if journal['status'] not in ('CURRENT', 'CURRENT_PARTIAL', 'OLD', 'UNREADABLE'):
                  raise ValueError
              if selected['entries'] != journal['entries'] or selected['unsupported_messages'] != journal['unsupported_messages'] or selected['entries'] + skipped > 200:
                  raise ValueError
              if not set(journal['error_classes']) <= set(selected['codes']):
                  raise ValueError
              if journal['status'] == 'OLD' and (selected['entries'] or not skipped):
                  raise ValueError
              if journal['status'] == 'UNREADABLE' and (not selected['entries'] or selected['unsupported_messages'] != selected['entries']):
                  raise ValueError
              late = report['timing_relation'] == 'UNIT_AFTER_MAIN_EXIT'
              if late:
                  if pre['scope'] != 'PRE_MAIN_CURRENT_INVOCATION' or pre['entries'] != skipped:
                      raise ValueError
              elif pre['scope'] != 'NOT_SELECTED' or not pre_empty:
                  raise ValueError
              coverage = details['coverage']
              if ('MAIN_START_ONLY' in coverage) != late or ('ROW_LIMIT_REACHED' in coverage) != (selected['entries'] + skipped == 200):
                  raise ValueError
              if ('UNSUPPORTED_MESSAGES' in coverage) != (selected['unsupported_messages'] + pre['unsupported_messages'] > 0):
                  raise ValueError
              partial = late or 'ACCESS_LIMITED' in coverage or selected['unsupported_messages'] > 0 or skipped > 0
              if journal['status'] in ('CURRENT', 'CURRENT_PARTIAL') and (journal['status'] == 'CURRENT_PARTIAL') != partial:
                  raise ValueError

          def checked_report(raw, remote_rc):
              if not isinstance(raw, bytes) or not 0 < len(raw) <= 8192 or b'\x00' in raw:
                  raise ValueError
              report = json.loads(raw.decode('ascii'), object_pairs_hook=unique_object)
              if not isinstance(report, dict) or report.get('schema') != SCHEMA:
                  raise ValueError
              if report.get('observation') == 'ERROR':
                  if set(report) != {'schema', 'observation', 'error'} or report['error'] not in ERRORS or remote_rc != 1:
                      raise ValueError
                  return report, 1
              if report.get('observation') == 'NOT_FAILED':
                  if set(report) != {'schema', 'observation'} or remote_rc != 0:
                      raise ValueError
                  return report, 0
              if remote_rc != 0 or report.get('observation') != 'COMPLETE' or set(report) != {'schema', 'observation', 'state', 'main_exit_age_seconds', 'timing_relation', 'journal', 'startup_details'}:
                  raise ValueError
              state = report['state']
              if not isinstance(state, dict) or set(state) != set(ENUMS) | set(LIMITS):
                  raise ValueError
              for key, allowed in ENUMS.items():
                  if not isinstance(state[key], str) or state[key] not in allowed:
                      raise ValueError
              for key, upper in LIMITS.items():
                  if type(state[key]) is not int or not 0 <= state[key] <= upper:
                      raise ValueError
              if (state['LoadState'], state['ActiveState'], state['SubState']) != ('LOADED', 'FAILED', 'FAILED'):
                  raise ValueError
              age = report['main_exit_age_seconds']
              if age is not None and (type(age) is not int or not 0 <= age <= 4294967295):
                  raise ValueError
              relation = report['timing_relation']
              if type(relation) is not str or relation not in TIMING_RELATIONS:
                  raise ValueError
              if relation in ('UNIT_BEFORE_OR_AT_MAIN_EXIT', 'UNIT_AFTER_MAIN_EXIT') and age is None:
                  raise ValueError
              if relation == 'MAIN_WINDOW_UNAVAILABLE' and age is not None:
                  raise ValueError
              journal = report['journal']
              if not isinstance(journal, dict) or set(journal) != {'status', 'entries', 'unsupported_messages', 'error_classes', 'argument_hints'} or journal['status'] not in JOURNAL_STATES:
                  raise ValueError
              if relation == 'UNIT_AFTER_MAIN_EXIT' and journal['status'] == 'CURRENT':
                  raise ValueError
              if relation == 'UNIT_BOUNDARY_UNAVAILABLE' and journal['status'] not in ('INVALID', 'NO_INVOCATION', 'NOT_CURRENT'):
                  raise ValueError
              for key in ('entries', 'unsupported_messages'):
                  if type(journal[key]) is not int or not 0 <= journal[key] <= 200:
                      raise ValueError
              if journal['unsupported_messages'] > journal['entries']:
                  raise ValueError
              if journal['status'] in ('CURRENT', 'CURRENT_PARTIAL'):
                  if journal['entries'] <= journal['unsupported_messages']:
                      raise ValueError
                  if journal['status'] == 'CURRENT' and journal['unsupported_messages']:
                      raise ValueError
              classes = journal['error_classes']
              if not isinstance(classes, list) or any(type(value) is not str or value not in CLASSES for value in classes) or classes != [value for value in CLASSES if value in classes]:
                  raise ValueError
              if journal['status'] not in ('CURRENT', 'CURRENT_PARTIAL') and classes:
                  raise ValueError
              hints = journal['argument_hints']
              if not isinstance(hints, list) or any(type(value) is not str or value not in ARGUMENT_HINTS for value in hints) or hints != [value for value in ARGUMENT_HINTS if value in hints]:
                  raise ValueError
              if hints and ('INVALID_ARGUMENT' not in classes or journal['status'] not in ('CURRENT', 'CURRENT_PARTIAL')):
                  raise ValueError
              checked_details(report)
              return report, 0

          import pathlib
          import sys

          try:
              with pathlib.Path(sys.argv[1]).open('rb') as handle:
