          def checked_report(raw, remote_rc):
              if not isinstance(raw, bytes) or not 0 < len(raw) <= 8192 or b'\x00' in raw:
                  raise ValueError
              report = json.loads(raw.decode('ascii'), object_pairs_hook=unique_object)
              if not isinstance(report, dict) or report.get('schema') != SCHEMA:
                  raise ValueError
              if report.get('observation') == 'ERROR':
                  if set(report) != {'schema', 'observation', 'error'} or report['error'] not in ERRORS or remote_rc != 1:
                      raise ValueError
                  return report, 1
              if report.get('observation') == 'NOT_FAILED':
                  if set(report) != {'schema', 'observation'} or remote_rc != 0:
                      raise ValueError
                  return report, 0
              if remote_rc != 0 or report.get('observation') != 'COMPLETE' or set(report) != {'schema', 'observation', 'state', 'main_exit_age_seconds', 'timing_relation', 'journal', 'startup_details'}:
                  raise ValueError
              state = report['state']
              if not isinstance(state, dict) or set(state) != set(ENUMS) | set(LIMITS):
                  raise ValueError
              for key, allowed in ENUMS.items():
                  if not isinstance(state[key], str) or state[key] not in allowed:
                      raise ValueError
              for key, upper in LIMITS.items():
                  if type(state[key]) is not int or not 0 <= state[key] <= upper:
                      raise ValueError
              if (state['LoadState'], state['ActiveState'], state['SubState']) != ('LOADED', 'FAILED', 'FAILED'):
                  raise ValueError
              age = report['main_exit_age_seconds']
              if age is not None and (type(age) is not int or not 0 <= age <= 4294967295):
                  raise ValueError
              relation = report['timing_relation']
              if type(relation) is not str or relation not in TIMING_RELATIONS:
                  raise ValueError
              if relation in ('UNIT_BEFORE_OR_AT_MAIN_EXIT', 'UNIT_AFTER_MAIN_EXIT') and age is None:
                  raise ValueError
              if relation == 'MAIN_WINDOW_UNAVAILABLE' and age is not None:
                  raise ValueError
              journal = report['journal']
              if not isinstance(journal, dict) or set(journal) != {'status', 'entries', 'unsupported_messages', 'error_classes', 'argument_hints'} or journal['status'] not in JOURNAL_STATES:
                  raise ValueError
              if relation == 'UNIT_AFTER_MAIN_EXIT' and journal['status'] == 'CURRENT':
                  raise ValueError
              if relation == 'UNIT_BOUNDARY_UNAVAILABLE' and journal['status'] not in ('INVALID', 'NO_INVOCATION', 'NOT_CURRENT'):
                  raise ValueError
              for key in ('entries', 'unsupported_messages'):
                  if type(journal[key]) is not int or not 0 <= journal[key] <= 200:
                      raise ValueError
              if journal['unsupported_messages'] > journal['entries']:
