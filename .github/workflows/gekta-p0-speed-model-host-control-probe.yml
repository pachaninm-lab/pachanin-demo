              'HTTP_STATIC_ASSETS_MISSING', 'HTTP_SSL_UNAVAILABLE', 'ROUTER_INIT_FAILED',
              'TOOLS_SETUP_FAILED', 'MODEL_LOADING_EXIT', 'CONTEXT_INIT_FAILED',
              'THREADPOOL_INIT_FAILED', 'BACKEND_LOAD_FAILED', 'CUDA_INIT_FAILED',
              'WRAPPER_IDENTITY_REJECTED', 'WRAPPER_BINARY_MISMATCH', 'WRAPPER_STATE_INVALID',
              'WRAPPER_ENV_INVALID', 'WRAPPER_CMDLINE_MISMATCH', 'WRAPPER_FLAG_INVALID',
              'WRAPPER_ERROR_UNMAPPED', 'PYTHON_TRACEBACK', 'PYTHON_EXCEPTION',
              'DYNAMIC_LINK_FAILED', 'SHELL_COMMAND_NOT_FOUND', 'EXEC_FORMAT_FAILED',
              'UNCAUGHT_EXCEPTION', 'LOCAL_ADDRESS_UNAVAILABLE', 'FILE_DESCRIPTOR_LIMIT',
