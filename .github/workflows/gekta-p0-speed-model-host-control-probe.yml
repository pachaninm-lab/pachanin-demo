          def classify_detail(message):
              codes, options, exceptions, markers = set(), set(), set(), set()
              for category, patterns in PATTERNS.items():
                  if any(re.search(pattern, message, re.I) for pattern in patterns):
                      codes.add(category)
              for category, patterns in DETAIL_PATTERNS.items():
                  if any(re.search(pattern, message, re.I) for pattern in patterns):
                      codes.add(category)
              for label, pattern in DETAIL_EXCEPTION_PATTERNS.items():
                  if re.search(pattern, message):
                      exceptions.add(label)
              if exceptions:
                  codes.add('PYTHON_EXCEPTION' if any(x not in ('BAD_ALLOC', 'INVALID_ARGUMENT', 'OUT_OF_RANGE') for x in exceptions) else 'UNCAUGHT_EXCEPTION')
              wrapper = re.match(r'^GEKTA_G3[BCDE]_ERROR=([^\r\n]*)$', message)
              if wrapper:
                  payload = wrapper.group(1)
                  hits = {label for label, pattern in WRAPPER_CODE_PATTERNS.items() if re.fullmatch(pattern, payload)}
                  codes.update(hits or {'WRAPPER_ERROR_UNMAPPED'})
                  if 'WRAPPER_FLAG_INVALID' in hits and ':' in payload:
                      name = payload.rsplit(':', 1)[1].upper()
                      options.add(name if name in DETAIL_OPTIONS else 'OTHER')
              for match in re.finditer(OPTION_ERROR_CONTEXT, message, re.I):
                  name = match.group(1)[2:].upper().replace('-', '_')
                  options.add(name if name in DETAIL_OPTIONS else 'OTHER')
              errorlike = bool(codes or exceptions or wrapper or re.search(ERRORLIKE, message, re.I))
              if errorlike:
                  for label, pattern in DETAIL_MARKER_PATTERNS.items():
                      if re.search(pattern, message, re.I):
                          markers.add(label)
                  # OSError and wrapper-normalized OSError retain only finite errno categories.
                  for match in re.finditer(r'(?:^|[^A-Za-z0-9])Errno[ _]+(2|8|12|13|22|24|98|99)(?=[^0-9]|$)', message, re.I):
                      codes.add({'2': 'REQUIRED_FILE_UNAVAILABLE', '8': 'EXEC_FORMAT_FAILED',
                                 '12': 'ALLOCATION_FAILED', '13': 'PERMISSION_DENIED',
                                 '22': 'ARGUMENT_VALUE_INVALID', '24': 'FILE_DESCRIPTOR_LIMIT',
                                 '98': 'ADDRESS_IN_USE', '99': 'LOCAL_ADDRESS_UNAVAILABLE'}[match.group(1)])
              specific = codes - {'WRAPPER_ERROR_UNMAPPED', 'PYTHON_TRACEBACK', 'UNCAUGHT_EXCEPTION'}
              return codes, options, exceptions, markers, errorlike, bool(errorlike and not specific)


          def add_detail_message(bucket, message):
