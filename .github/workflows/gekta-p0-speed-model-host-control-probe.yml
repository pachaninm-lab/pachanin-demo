          def bind_relation(current, failed):
              if current['status'] != 'LITERAL' or failed['status'] != 'MATCHED':
                  return 'UNPROVEN'
              known = tuple(BIND_TARGETS)
              if current['port'] != failed['port'] or (current['mode'] in known and failed['mode'] in known and current['mode'] != failed['mode']):
                  return 'DIFFERENT'
              if current['port'] == failed['port'] == 'FIXED_18080' and current['mode'] == failed['mode'] and current['mode'] in known:
                  return 'MATCH'
              return 'UNPROVEN'


