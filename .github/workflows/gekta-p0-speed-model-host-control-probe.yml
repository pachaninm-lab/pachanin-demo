                               can_start=values['CanStart'].upper(), refuse_manual_start=values['RefuseManualStart'].upper(), service_action='NONE')
              rows = first['rows']
              readable_families = sum(first[key] == 'OBSERVED' for key in ('ipv4_status', 'ipv6_status'))
              net = {'scope': 'CALLER_NETWORK_NAMESPACE',
                     'unit_network': 'DEFAULT_CONFIGURATION' if values['PrivateNetwork'] == 'no' and not values['NetworkNamespacePath'] and not values['JoinsNamespaceOf'] else 'PRIVATE_OR_JOINED',
                     'manager_namespace': first['manager_namespace'], 'target_basis': basis, 'target_mode': mode,
                     'local_address': first['local_address'], 'nonlocal_bind': first['nonlocal_bind'],
                     'status': 'OBSERVED' if readable_families == 2 else 'PARTIAL' if readable_families else 'UNAVAILABLE',
                     'ipv4_status': first['ipv4_status'], 'ipv6_status': first['ipv6_status'],
                     'stability': 'UNPROVEN' if rows is None else 'UNCHANGED',
                     'ipv4_listeners': 0, 'ipv6_listeners': 0, 'target_ipv4_listeners': 0, 'wildcard_ipv4_listeners': 0,
                     'wildcard_ipv6_listeners': 0, 'other_address_listeners': 0, 'ownership': 'UNPROVEN'}
              if rows is not None:
                  target = BIND_TARGETS.get(mode)
                  for family, address, uid, inode in rows:
                      net['ipv4_listeners' if family == 4 else 'ipv6_listeners'] += 1
                      if family == 4 and address == '0.0.0.0':
                          net['wildcard_ipv4_listeners'] += 1
                      elif family == 6 and address == '::':
                          net['wildcard_ipv6_listeners'] += 1
                      elif family == 4 and target is not None and address == target:
                          net['target_ipv4_listeners'] += 1
                      else:
                          net['other_address_listeners'] += 1
                  owners = {row[2] == identity[0] for row in rows}
                  net['ownership'] = 'NONE' if not owners else 'CALLER_UID' if owners == {True} else 'OTHER_UID' if owners == {False} else 'MIXED'
              return {'schema': BIND_SCHEMA, 'observation': 'COMPLETE', 'state': before['state'], 'state_stability': 'UNCHANGED',
                      'current_target': current, 'failed_target': failed, 'target_relation': bind_relation(current, failed),
                      'network': net, 'start_authority': authority}


