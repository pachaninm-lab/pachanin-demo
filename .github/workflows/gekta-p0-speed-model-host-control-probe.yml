          def classify_detail(message):
              codes, options, exceptions, markers = set(), set(), set(), set()
              for category, patterns in PATTERNS.items():
                  if any(re.search(pattern, message, re.I) for pattern in patterns):
                      codes.add(category)
              for category, patterns in DETAIL_PATTERNS.items():
                  if any(re.search(pattern, message, re.I) for pattern in patterns):
                      codes.add(category)
              for label, pattern in DETAIL_EXCEPTION_PATTERNS.items():
                  if re.search(pattern, message):
                      exceptions.add(label)
              if exceptions:
                  codes.add('PYTHON_EXCEPTION' if any(x not in ('BAD_ALLOC', 'INVALID_ARGUMENT', 'OUT_OF_RANGE') for x in exceptions) else 'UNCAUGHT_EXCEPTION')
              wrapper = re.match(r'^GEKTA_G3[BCDE]_ERROR=([^\r\n]*)$', message)
              if wrapper:
                  payload = wrapper.group(1)
                  hits = {label for label, pattern in WRAPPER_CODE_PATTERNS.items() if re.fullmatch(pattern, payload)}
                  codes.update(hits or {'WRAPPER_ERROR_UNMAPPED'})
                  if 'WRAPPER_FLAG_INVALID' in hits and ':' in payload:
