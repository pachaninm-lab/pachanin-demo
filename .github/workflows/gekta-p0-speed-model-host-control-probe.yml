              if journal['status'] in ('CURRENT', 'CURRENT_PARTIAL'):
                  if journal['entries'] <= journal['unsupported_messages']:
                      raise ValueError
                  if journal['status'] == 'CURRENT' and journal['unsupported_messages']:
                      raise ValueError
              classes = journal['error_classes']
              if not isinstance(classes, list) or any(type(value) is not str or value not in CLASSES for value in classes) or classes != [value for value in CLASSES if value in classes]:
                  raise ValueError
              if journal['status'] not in ('CURRENT', 'CURRENT_PARTIAL') and classes:
                  raise ValueError
              hints = journal['argument_hints']
              if not isinstance(hints, list) or any(type(value) is not str or value not in ARGUMENT_HINTS for value in hints) or hints != [value for value in ARGUMENT_HINTS if value in hints]:
                  raise ValueError
              if hints and ('INVALID_ARGUMENT' not in classes or journal['status'] not in ('CURRENT', 'CURRENT_PARTIAL')):
                  raise ValueError
              checked_details(report)
              return report, 0

