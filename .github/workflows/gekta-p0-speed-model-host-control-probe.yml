name: Gekta P0 SPEED Model Host Control Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-p0-speed-model-host-control-probe.yml'
      - 'docs/platform-v7/autopilot/scopes/gekta-p0-speed-g3b-control-probe-3896.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gekta-p0-speed-model-host-control-probe
  cancel-in-progress: false

env:
  MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
  MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
  MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
  MODEL_HOST_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_HOST_KEY }}

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove read-only control-plane contract
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/gekta-p0-speed-model-host-control-probe.yml
          node - "$file" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const begin = text.indexOf("<<'REMOTE_PROBE'\n");
          const end = begin < 0 ? -1 : text.indexOf('\n          REMOTE_PROBE', begin);
          if (begin < 0 || end < 0) throw new Error('remote control probe heredoc not found');
          const remote = text.slice(begin, end);
          for (const forbidden of [
            'systemctl restart', 'systemctl start', 'systemctl stop',
            'systemctl enable', 'systemctl disable', 'systemctl daemon-reload',
            'systemctl set-property', 'systemctl edit',
            'sudo ', 'su ', 'doas ', 'kill ', 'pkill ', 'rm ', 'mv ', 'cp ',
            'chmod ', 'chown ', 'tee ', 'apt ', 'apt-get ', 'dnf ', 'yum '
          ]) {
            if (remote.includes(forbidden)) throw new Error(`forbidden remote mutation token: ${forbidden.trim()}`);
          }
          for (const credential of ['PC_PROD_SSH_KEY', 'PC_PROD_SSH_PRIVATE_KEY', 'VPS_SSH_KEY']) {
            if (text.includes(`secrets.${credential}`)) throw new Error(`production credential in model-host chain: ${credential}`);
          }
          for (const required of [
            'secrets.TAI_MODEL_SSH_KEY',
            'secrets.TAI_MODEL_SSH_HOST_KEY',
            'TAI_MODEL_SSH_KEY is required',
            'TAI_MODEL_SSH_HOST_KEY is required',
            'does not match the pinned TAI_MODEL_SSH_HOST_KEY',
            'StrictHostKeyChecking=yes'
          ]) {
            if (!text.includes(required)) throw new Error(`missing model-host identity control: ${required}`);
          }
          if (/ssh-keyscan[^\n]*>\s*"?\$HOME\/\.ssh\/model_known_hosts/u.test(text)) {
            throw new Error('trust-on-first-use model known_hosts wiring');
          }
          NODE
          python3 -I -B - "$file" <<'UNIT_POLICY_FIXTURES'
          """Pure fixtures for the actual proposed unit/verb query. Never executes pkcheck."""
          import ast, os, pathlib, re, subprocess, sys, textwrap, types, unittest

          workflow=pathlib.Path(sys.argv[1]).read_text()
          start=workflow.index("          polkit = 'UNAVAILABLE'\n")
          end=workflow.index("          print('CONTROL_PROBE_SERVICE_USER_MATCH",start)
          source=textwrap.dedent(workflow[start:end])
          tree=ast.parse(source)
          compiled=compile(tree,'<actual-proposed-unit-policy-query>','exec')

          def measure(code=0, error=None, missing=False, pid=123, start_ticks='900', observed_pid=123, bad_stat=None, stderr_data=b'', capture_unavailable=False):
              calls=[]
              stat=str(observed_pid)+' (fixture with spaces) S '+' '.join(['0']*18+[start_ticks])
              class FakePath:
                  def __init__(self,path):
                      assert path=='/proc/self/stat'
                  def read_text(self):
                      if bad_stat is not None:raise bad_stat
                      return stat
              def create_capture(name, flags):
                  if capture_unavailable:
                      raise OSError('synthetic memfd unavailable')
                  return os.memfd_create(name, flags)
              def run(argv,**kwargs):
                  calls.append((argv,kwargs))
                  if error is not None:raise error
                  fd=kwargs['stderr']
                  if fd != subprocess.DEVNULL:
                      assert os.fstat(fd).st_size==4096
                      try:
                          os.pwrite(fd,b'x',4096)
                      except OSError:
                          pass
                      else:
                          raise AssertionError('stderr capture can grow')
                      if stderr_data:
                          os.write(fd,stderr_data)
                  return types.SimpleNamespace(returncode=code)
              namespace={'os':types.SimpleNamespace(
                  getpid=lambda:pid,getuid=lambda:1001,memfd_create=create_capture,
                  MFD_CLOEXEC=os.MFD_CLOEXEC,MFD_ALLOW_SEALING=os.MFD_ALLOW_SEALING,
                  ftruncate=os.ftruncate,pread=os.pread,close=os.close),
                  'pathlib':types.SimpleNamespace(Path=FakePath),
                  'shutil':types.SimpleNamespace(which=lambda name:None if missing else '/usr/bin/pkcheck'),
                  'subprocess':types.SimpleNamespace(run=run,DEVNULL=subprocess.DEVNULL,TimeoutExpired=subprocess.TimeoutExpired)}
              exec(compiled,namespace)
              return namespace['polkit'],calls,namespace['polkit_error_kind'],namespace['polkit_error_reason']

          class FixedUnitPolicy(unittest.TestCase):
              def test_fixed_unit_verb_and_complete_live_subject(self):
                  state,calls,error_kind,error_reason=measure()
                  self.assertEqual(state,'AUTHORIZED');self.assertEqual(len(calls),1)
                  self.assertEqual(error_kind,'NONE')
                  self.assertEqual(error_reason,'NONE')
                  self.assertEqual(calls[0][0],['/usr/bin/pkcheck','--action-id','org.freedesktop.systemd1.manage-units',
                      '--process','123,900,1001','--detail','unit','tai-qwen3-8b.service','--detail','verb','restart'])
              def test_no_interactive_agent_or_raw_output_or_stdin(self):
                  _,calls,_,_=measure();argv,kw=calls[0]
                  fd=kw['stderr']
                  self.assertGreaterEqual(fd,0)
                  with self.assertRaises(OSError):os.fstat(fd)
                  self.assertNotIn('--allow-user-interaction',argv);self.assertNotIn('--enable-internal-agent',argv)
                  self.assertEqual(kw,{'stdin':subprocess.DEVNULL,'stdout':subprocess.DEVNULL,'stderr':fd,
                      'timeout':5,'check':False,'env':{'PATH':'/usr/bin:/bin','LC_ALL':'C'}})
              def test_documented_exit_codes_remain_distinct(self):
                  for code,state in ((0,'AUTHORIZED'),(1,'DENIED'),(2,'INTERACTION_REQUIRED'),(3,'DISMISSED'),
                                     (126,'INVALID_INVOCATION'),(127,'CHECK_ERROR')):
                      with self.subTest(code=code):self.assertEqual(measure(code=code)[0],state)
              def test_checker_error_is_not_unit_denial(self):
                  self.assertNotEqual(measure(code=127)[0],'DENIED')
                  self.assertNotEqual(measure(error=OSError('unavailable'))[0],'DENIED')
              def test_check_error_reason_is_closed_and_distinct(self):
                  cases=(
                      ({'error':FileNotFoundError('synthetic path')},'EXEC_NOT_FOUND'),
                      ({'error':PermissionError('synthetic permission')},'EXEC_PERMISSION_DENIED'),
                      ({'error':OSError('synthetic failure')},'EXEC_ERROR'),
                      ({'code':127},'POLICY_CHECK_ERROR'),
                  )
                  for kwargs,expected in cases:
                      with self.subTest(expected=expected):
                          status,calls,kind,_=measure(**kwargs)
                          self.assertEqual(status,'CHECK_ERROR')
                          self.assertEqual(kind,expected)
                          self.assertEqual(len(calls),1)
              def test_policy_error_reasons_and_fallback(self):
                  for data,expected in (
                      (b'Only trusted callers (e.g. uid 0 or an action owner) can use CheckAuthorization() and pass details', 'DETAILS_CALLER_NOT_TRUSTED'),
                      (b'GDBus.Error:org.freedesktop.DBus.Error.ServiceUnknown: synthetic', 'DBUS_SERVICE_UNKNOWN'),
                      (b'GDBus.Error:org.freedesktop.DBus.Error.NameHasNoOwner: synthetic', 'DBUS_NAME_HAS_NO_OWNER'),
                      (b'GDBus.Error:org.freedesktop.DBus.Error.NoReply: synthetic', 'DBUS_NO_REPLY'),
                      (b'GDBus.Error:org.freedesktop.DBus.Error.AccessDenied: synthetic', 'DBUS_ACCESS_DENIED'),
                      (b'synthetic unrecognized data', 'UNKNOWN'),
                  ):
                      with self.subTest(expected=expected):
                          status,calls,kind,reason=measure(code=127,stderr_data=data)
                          self.assertEqual((status,kind,reason),('CHECK_ERROR','POLICY_CHECK_ERROR',expected))
                          self.assertEqual(len(calls),1)
                  status,calls,kind,reason=measure(code=127,capture_unavailable=True)
                  self.assertEqual((status,kind,reason),('CHECK_ERROR','POLICY_CHECK_ERROR','CAPTURE_UNAVAILABLE'))
                  self.assertEqual(calls[0][1]['stderr'],subprocess.DEVNULL)
              def test_unknown_exit_and_signal_stay_unknown(self):
                  for code in (7,-9,255):self.assertEqual(measure(code=code)[0],'ERROR')
              def test_timeout_has_no_retry(self):
                  result,calls,error_kind,error_reason=measure(error=subprocess.TimeoutExpired('synthetic query',5))
                  self.assertEqual(error_kind,'NONE')
                  self.assertEqual(error_reason,'NONE')
                  self.assertEqual(result,'CHECK_TIMEOUT');self.assertEqual(len(calls),1)
              def test_unavailable_checker_has_no_fallback(self):
                  result,calls,kind,_=measure(missing=True);self.assertEqual(result,'UNAVAILABLE');self.assertEqual(calls,[]);self.assertEqual(kind,'NONE')
              def test_subject_pid_mismatch_prevents_query(self):
                  result,calls,kind,_=measure(observed_pid=321);self.assertEqual(result,'SUBJECT_UNVERIFIED');self.assertEqual(calls,[]);self.assertEqual(kind,'NONE')
              def test_invalid_start_time_prevents_query(self):
                  for start in ('0','-1','bad'):
                      result,calls,kind,_=measure(start_ticks=start);self.assertEqual(result,'SUBJECT_UNVERIFIED');self.assertEqual(calls,[]);self.assertEqual(kind,'NONE')
              def test_unreadable_subject_prevents_query(self):
                  result,calls,kind,_=measure(bad_stat=OSError('synthetic missing proc'))
                  self.assertEqual(result,'SUBJECT_UNVERIFIED');self.assertEqual(calls,[]);self.assertEqual(kind,'NONE')
              def test_scope_is_explicit_in_closed_output(self):
                  self.assertIn("print('CONTROL_PROBE_POLKIT_QUERY_SCOPE=FIXED_UNIT_RESTART')",workflow)
                  self.assertIn('|POLKIT_QUERY_SCOPE|POLKIT_MANAGE_UNITS|POLKIT_ERROR_KIND|POLKIT_ERROR_REASON|',workflow)
                  self.assertIn('"$(wc -l < "$RUNNER_TEMP/control-probe")" -eq 29',workflow)
              def test_actual_query_has_no_shell_or_service_action(self):
                  calls=[n for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=='run']
                  self.assertEqual(len(calls),1)
                  self.assertNotIn('shell',set(k.arg for k in calls[0].keywords))
                  for token in ('systemctl','sudo','pkexec','--allow-user-interaction','--enable-internal-agent','--revoke-temp'):
                      self.assertNotIn(token,source)

          suite=unittest.defaultTestLoader.loadTestsFromTestCase(FixedUnitPolicy)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          UNIT_POLICY_FIXTURES
          GITHUB_HEAD_REF=fix/gekta-p0-speed-g3b-control-probe-3896 BASE_REF=origin/main bash scripts/p7-autopilot-guard.sh

  probe:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3896 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/gekta speed-model-control-probe current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact current main
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse origin/main)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$(git rev-parse HEAD)" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve protected model-host transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"
                rm -f "$a" "$b" "$c"
                return 0
              fi
            done
            rm -f "$a" "$b" "$c"
            return 1
          }
          host="$(trim "${MODEL_HOST_SECRET:-}")"
          user="$(trim "${MODEL_USER_SECRET:-}")"
          port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ && "$user" != root ]]
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535))
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          key="$(trim "${MODEL_KEY_SECRET:-}")"
          if [[ -z "$key" ]]; then
            echo "TAI_MODEL_SSH_KEY is required for the model host control probe." >&2
            exit 20
          fi
          write_key "$key" "$HOME/.ssh/id_tai_model"
          pin="$(trim "${MODEL_HOST_KEY_SECRET:-}")"
          if [[ -z "$pin" ]]; then
            echo "TAI_MODEL_SSH_HOST_KEY is required: the model host identity must be pinned." >&2
            exit 21
          fi
          pin_type="$(printf '%s' "$pin" | awk '{ print $(NF-1) }')"
          pin_material="$(printf '%s' "$pin" | awk '{ print $NF }')"
          [[ -n "$pin_type" && -n "$pin_material" ]] || exit 21
          scanned="$(ssh-keyscan -T 30 -p "$port" -t "$pin_type" "$host" 2>/dev/null || true)"
          if ! printf '%s\n' "$scanned" | awk -v pinned="$pin_material" '$3 == pinned { matched = 1 } END { exit matched ? 0 : 1 }'; then
            echo "model host key does not match the pinned TAI_MODEL_SSH_HOST_KEY" >&2
            exit 21
          fi
          printf '%s %s %s\n' "$host" "$pin_type" "$pin_material" > "$HOME/.ssh/model_known_hosts"
          chmod 600 "$HOME/.ssh/model_known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Read bounded control-plane facts
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$MODEL_USER@$MODEL_HOST" /bin/bash -s > "$RUNNER_TEMP/raw-control-probe" <<'REMOTE_PROBE'
          set -Eeuo pipefail
          real_uid="$(/usr/bin/id -ru)"
          effective_uid="$(/usr/bin/id -u)"
          [[ "$real_uid" =~ ^[1-9][0-9]*$ && "$effective_uid" =~ ^[1-9][0-9]*$ ]]
          service=tai-qwen3-8b.service
          systemctl is-active --quiet "$service"
          pid="$(systemctl show "$service" --property=MainPID --value)"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          python3 - "$pid" "$service" <<'PY'
          import hashlib
          import os
          import pathlib
          import pwd
          import re
          import shutil
          import subprocess
          import sys

          pid = int(sys.argv[1])
          service = sys.argv[2]

          def show(prop: str) -> str:
              result = subprocess.run(
                  ['systemctl', 'show', service, '--property', prop, '--value'],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  text=True,
                  timeout=5,
                  check=False,
                  env={'PATH':'/usr/bin:/bin','LC_ALL':'C'},
              )
              if result.returncode != 0:
                  raise SystemExit(f'systemctl_show_failed_{prop}')
              return result.stdout.strip()

          execstart = show('ExecStart')
          environment_files_raw = show('EnvironmentFiles')
          fragment_raw = show('FragmentPath')
          dropins_raw = show('DropInPaths')
          service_user = show('User')
          restart_policy = show('Restart')

          if not execstart or not fragment_raw or not service_user:
              raise SystemExit('required_systemd_property_missing')

          fragment = pathlib.Path(fragment_raw)
          fragment_present = int(fragment.is_file())
          fragment_writable = int(os.access(fragment, os.W_OK)) if fragment_present else 0
          fragment_parent_writable = int(os.access(fragment.parent, os.W_OK))

          env_paths = []
          env_parse_ok = 1
          if environment_files_raw:
              matches = re.findall(r'(?:^|\s)(-?\S+)\s+\(ignore_errors=(?:yes|no)\)', environment_files_raw)
              if not matches:
                  env_parse_ok = 0
              for raw in matches:
                  raw = raw[1:] if raw.startswith('-') else raw
                  env_paths.append(pathlib.Path(raw))
          env_present = sum(1 for path in env_paths if path.is_file())
          env_writable = sum(1 for path in env_paths if path.is_file() and os.access(path, os.W_OK))

          dropin_paths = []
          if dropins_raw:
              for token in re.findall(r'\S+', dropins_raw):
                  candidate = pathlib.Path(token)
                  if candidate.is_file():
                      dropin_paths.append(candidate)
          dropin_writable = sum(1 for path in dropin_paths if os.access(path, os.W_OK))

          exec_path_match = re.search(r'(?:^|[ {;])path=([^ ;}]+)', execstart)
          exec_path_present = 0
          exec_path_writable = 0
          exec_path_matches_process = 0
          if exec_path_match:
              exec_path = pathlib.Path(exec_path_match.group(1))
              exec_path_present = int(exec_path.is_file())
              exec_path_writable = int(exec_path_present and os.access(exec_path, os.W_OK))
              if exec_path_present:
                  try:
                      exec_path_matches_process = int(exec_path.resolve(strict=True) == pathlib.Path(f'/proc/{pid}/exe').resolve(strict=True))
                  except OSError:
                      exec_path_matches_process = 0

          def has_flag(long_name: str, short_name: str | None = None) -> int:
              names = [re.escape(long_name)]
              if short_name:
                  names.append(re.escape(short_name))
              pattern = r'(?:^|\s)(?:' + '|'.join(names) + r')(?:=|\s)'
              return int(bool(re.search(pattern, execstart)))

          proc_env = pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0')
          env_names = {part.split(b'=', 1)[0].decode('ascii', 'ignore') for part in proc_env if b'=' in part}
          current_user = pwd.getpwuid(os.getuid()).pw_name

          polkit = 'UNAVAILABLE'
          polkit_error_kind = 'NONE'
          polkit_error_reason = 'NONE'
          pkcheck = shutil.which('pkcheck')
          if pkcheck:
              try:
                  subject_pid = os.getpid()
                  subject_stat = pathlib.Path('/proc/self/stat').read_text()
                  subject_start = int(subject_stat.rsplit(')', 1)[1].split()[19])
                  if int(subject_stat.split(' ', 1)[0]) != subject_pid or subject_start <= 0:
                      raise ValueError('process subject mismatch')
                  subject = f'{subject_pid},{subject_start},{os.getuid()}'
              except (OSError, ValueError, IndexError):
                  polkit = 'SUBJECT_UNVERIFIED'
              else:
                  capture_fd = None
                  try:
                      import fcntl
                      capture_fd = os.memfd_create('gekta-polkit-error', os.MFD_CLOEXEC | os.MFD_ALLOW_SEALING)
                      os.ftruncate(capture_fd, 4096)
                      # Linux UAPI constants cover Python builds without the seal names.
                      add_seals = getattr(fcntl, 'F_ADD_SEALS', 1033)
                      seals = (getattr(fcntl, 'F_SEAL_GROW', 0x0004)
                               | getattr(fcntl, 'F_SEAL_SHRINK', 0x0002)
                               | getattr(fcntl, 'F_SEAL_SEAL', 0x0001))
                      fcntl.fcntl(capture_fd, add_seals, seals)
                  except (ImportError, AttributeError, OSError):
                      if capture_fd is not None:
                          os.close(capture_fd)
                      capture_fd = None
                  try:
                      try:
                          result = subprocess.run(
                              [pkcheck, '--action-id', 'org.freedesktop.systemd1.manage-units', '--process', subject,
                              '--detail', 'unit', 'tai-qwen3-8b.service', '--detail', 'verb', 'restart'],
                              stdin=subprocess.DEVNULL,
                              stdout=subprocess.DEVNULL,
                              stderr=capture_fd if capture_fd is not None else subprocess.DEVNULL,
                              timeout=5,
                              check=False,
                              env={'PATH':'/usr/bin:/bin','LC_ALL':'C'},
                          )
                      except subprocess.TimeoutExpired:
                          polkit = 'CHECK_TIMEOUT'
                      except OSError as error:
                          polkit = 'CHECK_ERROR'
                          if isinstance(error, FileNotFoundError):
                              polkit_error_kind = 'EXEC_NOT_FOUND'
                          elif isinstance(error, PermissionError):
                              polkit_error_kind = 'EXEC_PERMISSION_DENIED'
                          else:
                              polkit_error_kind = 'EXEC_ERROR'
                      else:
                          if result.returncode == 0:
                              polkit = 'AUTHORIZED'
                          elif result.returncode == 1:
                              polkit = 'DENIED'
                          elif result.returncode == 2:
                              polkit = 'INTERACTION_REQUIRED'
                          elif result.returncode == 3:
                              polkit = 'DISMISSED'
                          elif result.returncode == 126:
                              polkit = 'INVALID_INVOCATION'
                          elif result.returncode == 127:
                              polkit = 'CHECK_ERROR'
                              polkit_error_kind = 'POLICY_CHECK_ERROR'
                              polkit_error_reason = 'CAPTURE_UNAVAILABLE'
                              if capture_fd is not None:
                                  try:
                                      detail = os.pread(capture_fd, 4096, 0)
                                  except OSError:
                                      pass
                                  else:
                                      polkit_error_reason = 'UNKNOWN'
                                      for marker, reason in (
                                          (b'Only trusted callers (e.g. uid 0 or an action owner) can use CheckAuthorization() and pass details',
                                           'DETAILS_CALLER_NOT_TRUSTED'),
                                          (b'GDBus.Error:org.freedesktop.DBus.Error.ServiceUnknown:', 'DBUS_SERVICE_UNKNOWN'),
                                          (b'GDBus.Error:org.freedesktop.DBus.Error.NameHasNoOwner:', 'DBUS_NAME_HAS_NO_OWNER'),
                                          (b'GDBus.Error:org.freedesktop.DBus.Error.NoReply:', 'DBUS_NO_REPLY'),
                                          (b'GDBus.Error:org.freedesktop.DBus.Error.AccessDenied:', 'DBUS_ACCESS_DENIED'),
                                      ):
                                          if marker in detail:
                                              polkit_error_reason = reason
                                              break
                          else:
                              polkit = 'ERROR'
                  finally:
                      if capture_fd is not None:
                          os.close(capture_fd)

          print('CONTROL_PROBE_SERVICE_USER_MATCH=' + str(int(service_user == current_user)))
          print('CONTROL_PROBE_RESTART_POLICY=' + (restart_policy if re.fullmatch(r'[A-Za-z0-9_.:-]+', restart_policy) else 'INVALID'))
          print('CONTROL_PROBE_FRAGMENT_PRESENT=' + str(fragment_present))
          print('CONTROL_PROBE_FRAGMENT_WRITABLE=' + str(fragment_writable))
          print('CONTROL_PROBE_FRAGMENT_PARENT_WRITABLE=' + str(fragment_parent_writable))
          print('CONTROL_PROBE_ENV_PARSE_OK=' + str(env_parse_ok))
          print('CONTROL_PROBE_ENV_FILES_COUNT=' + str(len(env_paths)))
          print('CONTROL_PROBE_ENV_FILES_PRESENT=' + str(env_present))
          print('CONTROL_PROBE_ENV_FILES_WRITABLE=' + str(env_writable))
          print('CONTROL_PROBE_DROPINS_COUNT=' + str(len(dropin_paths)))
          print('CONTROL_PROBE_DROPINS_WRITABLE=' + str(dropin_writable))
          print('CONTROL_PROBE_EXEC_PATH_PRESENT=' + str(exec_path_present))
          print('CONTROL_PROBE_EXEC_PATH_WRITABLE=' + str(exec_path_writable))
          print('CONTROL_PROBE_EXEC_PATH_MATCHES_PROCESS=' + str(exec_path_matches_process))
          print('CONTROL_PROBE_EXEC_HAS_THREADS=' + str(has_flag('--threads', '-t')))
          print('CONTROL_PROBE_EXEC_HAS_THREADS_BATCH=' + str(has_flag('--threads-batch', '-tb')))
          print('CONTROL_PROBE_EXEC_HAS_PARALLEL=' + str(has_flag('--parallel', '-np')))
          print('CONTROL_PROBE_EXEC_HAS_CTX=' + str(has_flag('--ctx-size', '-c')))
          print('CONTROL_PROBE_EXEC_HAS_KV_UNIFIED=' + str(has_flag('--kv-unified')))
          print('CONTROL_PROBE_ENV_LLAMA_THREADS_PRESENT=' + str(int('LLAMA_ARG_THREADS' in env_names)))
          print('CONTROL_PROBE_ENV_LLAMA_THREADS_BATCH_PRESENT=' + str(int('LLAMA_ARG_THREADS_BATCH' in env_names)))
          print('CONTROL_PROBE_ENV_LLAMA_PARALLEL_PRESENT=' + str(int('LLAMA_ARG_N_PARALLEL' in env_names or 'LLAMA_ARG_PARALLEL' in env_names)))
          print('CONTROL_PROBE_ENV_LLAMA_KV_UNIFIED_PRESENT=' + str(int('LLAMA_ARG_KV_UNIFIED' in env_names)))
          print('CONTROL_PROBE_POLKIT_QUERY_SCOPE=FIXED_UNIT_RESTART')
          print('CONTROL_PROBE_POLKIT_MANAGE_UNITS=' + polkit)
          print('CONTROL_PROBE_POLKIT_ERROR_KIND=' + polkit_error_kind)
          print('CONTROL_PROBE_POLKIT_ERROR_REASON=' + polkit_error_reason)
          print('CONTROL_PROBE_EXECSTART_SHA256=' + hashlib.sha256(execstart.encode()).hexdigest())
          print('CONTROL_PROBE_ENVFILES_SHA256=' + hashlib.sha256(environment_files_raw.encode()).hexdigest())
          PY
          REMOTE_PROBE
          grep -E '^CONTROL_PROBE_(SERVICE_USER_MATCH|RESTART_POLICY|FRAGMENT_PRESENT|FRAGMENT_WRITABLE|FRAGMENT_PARENT_WRITABLE|ENV_PARSE_OK|ENV_FILES_COUNT|ENV_FILES_PRESENT|ENV_FILES_WRITABLE|DROPINS_COUNT|DROPINS_WRITABLE|EXEC_PATH_PRESENT|EXEC_PATH_WRITABLE|EXEC_PATH_MATCHES_PROCESS|EXEC_HAS_THREADS|EXEC_HAS_THREADS_BATCH|EXEC_HAS_PARALLEL|EXEC_HAS_CTX|EXEC_HAS_KV_UNIFIED|ENV_LLAMA_THREADS_PRESENT|ENV_LLAMA_THREADS_BATCH_PRESENT|ENV_LLAMA_PARALLEL_PRESENT|ENV_LLAMA_KV_UNIFIED_PRESENT|POLKIT_QUERY_SCOPE|POLKIT_MANAGE_UNITS|POLKIT_ERROR_KIND|POLKIT_ERROR_REASON|EXECSTART_SHA256|ENVFILES_SHA256)=' "$RUNNER_TEMP/raw-control-probe" > "$RUNNER_TEMP/control-probe"
          [[ "$(wc -l < "$RUNNER_TEMP/control-probe")" -eq 29 ]]
          if grep -Ev '^CONTROL_PROBE_[A-Z0-9_]+=([0-9]+|[a-f0-9]{64}|[A-Z_]+|[a-z0-9_.:-]+)$' "$RUNNER_TEMP/control-probe"; then
            echo 'Control probe emitted a value outside the bounded grammar.' >&2
            exit 40
          fi
          cat "$RUNNER_TEMP/control-probe"

      - name: Publish redacted control-plane evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"
          {
            echo '## Gekta P0 SPEED model-host control-plane probe'
            echo
            echo "- exact repository main: \`$TARGET_SHA\`"
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo '- mode: `READ_ONLY`'
            echo '- production mutation: `NONE`'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/control-probe"
            echo '```'
          } > "$body"
          gh issue comment 3896 --repo "$GITHUB_REPOSITORY" --body-file "$body"
