name: Production P0 Web Container SMTP Delivery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-web-container-smtp-delivery-proof.yml'
      - 'scripts/check-production-p0-web-container-smtp-delivery-proof.mjs'
      - 'docs/platform-v7/autopilot/scopes/production-p0-web-container-smtp-delivery-proof-3785.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-web-container-smtp-delivery-proof
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  ACCEPTANCE_MAIL_DOMAIN: acceptance.xn----8sbjf4befbjgs9b.xn--p1ai
  SMTP_HOST: mail.hosting.reg.ru
  SMTP_PORT: '465'
  IMAP_PORT: '993'
  RELEASE_ISSUE_NUMBER: '3072'

jobs:
  contract:
    name: Validate Web-container SMTP delivery proof contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-web-container-smtp-delivery-proof current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-production-p0-web-container-smtp-delivery-proof.mjs
      - name: Resolve exact current main
        id: target
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main >/dev/null
          target="$(git rev-parse origin/main)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$(git rev-parse HEAD)" ]]
          [[ "$target" == "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          printf 'sha=%s\n' "$target" >> "$GITHUB_OUTPUT"

  prove:
    name: Send one acceptance mail from active Web container and prove IMAP receipt
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.target_sha != '' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-web-container-smtp-delivery-proof current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.contract.outputs.target_sha }}
      MAILBOX_USER: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_USER || secrets.PC_PROD_P0_IMAP_USER }}
      MAILBOX_PASSWORD: ${{ secrets.PC_PROD_P0_MAILBOX_IMAP_PASSWORD || secrets.PC_PROD_P0_IMAP_PASSWORD }}
      EMAIL_TEMPLATE: ${{ secrets.PC_PROD_P0_MAILBOX_EMAIL_TEMPLATE || secrets.PC_PROD_P0_EMAIL_TEMPLATE }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact main and build protected acceptance inputs
        id: input
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main >/dev/null
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          safe_scalar(){ [[ -n "$1" && "$1" != *$'\n'* && "$1" != *$'\r'* && "$1" != *$'\0'* ]]; }
          safe_scalar "$MAILBOX_USER"
          safe_scalar "$MAILBOX_PASSWORD"
          safe_scalar "$EMAIL_TEMPLATE"
          send_cfg="$RUNNER_TEMP/pc-web-delivery-send-${GITHUB_RUN_ID}.json"
          receipt_cfg="$RUNNER_TEMP/pc-web-delivery-receipt-${GITHUB_RUN_ID}.json"
          umask 077
          SEND_CFG="$send_cfg" RECEIPT_CFG="$receipt_cfg" python3 - <<'PY'
          import json, os, re, secrets

          domain = os.environ['ACCEPTANCE_MAIL_DOMAIN']
          user = str(os.environ['MAILBOX_USER']).strip().lower()
          password = str(os.environ['MAILBOX_PASSWORD'])
          template = str(os.environ['EMAIL_TEMPLATE']).strip().lower()
          run_id = str(os.environ['GITHUB_RUN_ID'])
          target_sha = str(os.environ['TARGET_SHA'])

          def ascii_email(value):
              if value.count('@') != 1:
                  raise SystemExit(21)
              local, host = value.rsplit('@', 1)
              local.encode('ascii')
              host = host.encode('idna').decode('ascii').lower()
              result = f'{local}@{host}'
              if not re.fullmatch(r'[A-Za-z0-9._+-]{1,64}@[A-Za-z0-9.-]{1,189}', result):
                  raise SystemExit(21)
              return result

          mailbox = ascii_email(user)
          if not mailbox.endswith('@' + domain):
              raise SystemExit(21)
          if template.count('{identity}') == 1 and '{run}' not in template and '{slot}' not in template:
              recipient = template.replace('{identity}', f'webdelivery-{run_id}')
          elif template.count('{identity}') == 0 and template.count('{run}') == 1 and template.count('{slot}') == 1:
              recipient = template.replace('{run}', run_id).replace('{slot}', 'webdelivery')
          else:
              raise SystemExit(22)
          recipient = ascii_email(recipient)
          if not recipient.endswith('@' + domain):
              raise SystemExit(22)
          marker = f'PC-CROP-WEB-DELIVERY-{target_sha[:12]}-{run_id}-{secrets.token_hex(8)}'
          if not re.fullmatch(r'[A-Z0-9-]{20,128}', marker):
              raise SystemExit(23)

          with open(os.environ['SEND_CFG'], 'w', encoding='utf-8') as handle:
              json.dump({'recipient': recipient, 'marker': marker}, handle, ensure_ascii=True, separators=(',', ':'))
          with open(os.environ['RECEIPT_CFG'], 'w', encoding='utf-8') as handle:
              json.dump({'user': mailbox, 'password': password, 'recipient': recipient, 'marker': marker}, handle, ensure_ascii=True, separators=(',', ':'))
          PY
          chmod 0600 "$send_cfg" "$receipt_cfg"
          printf 'send_cfg=%s\nreceipt_cfg=%s\n' "$send_cfg" "$receipt_cfg" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned REG.RU SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"
          key="$HOME/.ssh/id_pc_prod"
          known="$HOME/.ssh/known_hosts"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${PC_PROD_HOST:-}")"
          user="$(trim "${PC_PROD_SSH_USER:-}")"
          port="$(trim "${PC_PROD_SSH_PORT:-22}")"
          expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"

          validate_key(){
            local source="$1" pub
            tr -d '\r' < "$source" > "$key"
            chmod 0600 "$key"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$key" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"
            return 1
          }
          try_slot "${PC_PROD_SSH_KEY:-}" || try_slot "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_slot "${VPS_SSH_KEY:-}"

          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            got="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$got" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          rm -f "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$known"
          chmod 0600 "$known"
          ssh -i "$key" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$user@$host" \
            'set -Eeuo pipefail; [[ "$(id -u)" -eq 0 ]]; command -v docker >/dev/null; command -v python3 >/dev/null; echo ROOT_WEB_DELIVERY_PROOF_OK' >/dev/null
          printf 'host=%s\nuser=%s\nport=%s\n' "$host" "$user" "$port" >> "$GITHUB_OUTPUT"

      - name: Send one acceptance message from active Web container
        id: send
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          SEND_CFG: ${{ steps.input.outputs.send_cfg }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_cfg="/tmp/pc-web-delivery-send-${GITHUB_RUN_ID}.json"
          scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SEND_CFG" "$USER@$HOST:$remote_cfg"
          result="$RUNNER_TEMP/pc-web-delivery-result.txt"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$USER@$HOST" "bash -s -- '$remote_cfg'" > "$result" <<'REMOTE'
          set -Eeuo pipefail
          cfg="$1"
          [[ "$(id -u)" -eq 0 ]]
          chmod 0600 "$cfg"
          tmp="$(mktemp -d /root/pc-web-delivery.XXXXXX)"
          chmod 0700 "$tmp"
          cleanup(){ rm -rf -- "$tmp" "$cfg"; }
          trap cleanup EXIT
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          if (( ${#web_ids[@]} != 1 )); then
            printf 'WEB_CONTAINER_CARDINALITY=%s\nWEB_SMTP_DELIVERY_RESULT=FAIL\nWEB_SMTP_LAST_STAGE=DISCOVERY\nWEB_SMTP_TOTAL_BUCKET=UNKNOWN\nWEB_SMTP_RESPONSE_5000_BUDGET=UNKNOWN\nWEB_SMTP_APP_7500_BUDGET=UNKNOWN\nWEB_SMTP_MAIL_SENT=NO\nPRODUCTION_MUTATION=NONE\n' "$([[ ${#web_ids[@]} == 0 ]] && echo ZERO || echo MULTIPLE)"
            exit 0
          fi
          web_id="${web_ids[0]}"
          payload="$tmp/send.js"
          cat > "$payload" <<'NODE'
          const tls = require('node:tls');
          const MAIL_TIMEOUT_MS = 5_000;
          const recipient = __RECIPIENT__;
          const marker = __MARKER__;
          const started = Date.now();
          let lastStage = 'CONFIG';
          let responseBudget = 'PASS';
          let done = false;

          function clean(value) {
            const v = String(value || '').trim();
            return v && !/[\r\n\0]/.test(v) ? v : '';
          }
          function bucket(ms) {
            if (!Number.isFinite(ms)) return 'UNKNOWN';
            if (ms <= 2500) return 'LE_2500';
            if (ms <= 5000) return 'LE_5000';
            if (ms <= 7500) return 'LE_7500';
            return 'GT_7500';
          }
          function emit(result, sent) {
            if (done) return;
            done = true;
            const elapsed = Date.now() - started;
            console.log('WEB_CONTAINER_CARDINALITY=ONE');
            console.log(`WEB_SMTP_DELIVERY_RESULT=${result}`);
            console.log(`WEB_SMTP_LAST_STAGE=${lastStage}`);
            console.log(`WEB_SMTP_TOTAL_BUCKET=${bucket(elapsed)}`);
            console.log(`WEB_SMTP_RESPONSE_5000_BUDGET=${responseBudget}`);
            console.log(`WEB_SMTP_APP_7500_BUDGET=${elapsed <= 7500 ? 'PASS' : 'FAIL'}`);
            console.log(`WEB_SMTP_MAIL_SENT=${sent ? 'YES' : 'NO'}`);
            console.log(`PRODUCTION_MUTATION=${sent ? 'ACCEPTANCE_MAIL_ONLY' : 'NONE'}`);
          }

          const host = clean(process.env.PC_SMTP_HOST);
          const port = Number(clean(process.env.PC_SMTP_PORT) || '465');
          const user = clean(process.env.PC_SMTP_USER);
          const pass = clean(process.env.PC_SMTP_PASS);
          const from = clean(process.env.PC_MAIL_FROM) || user;
          if (host !== 'mail.hosting.reg.ru' || port !== 465 || !user || !pass || !from) {
            lastStage = 'CONFIG';
            emit('FAIL', false);
            process.exit(0);
          }

          const mime = [
            `From: <${from}>`,
            `To: ${recipient}`,
            'Subject: PC-CROP Web SMTP delivery acceptance',
            'MIME-Version: 1.0',
            'Content-Type: text/plain; charset=UTF-8',
            'Content-Transfer-Encoding: 8bit',
            '',
            'Production Web-container SMTP delivery verification.',
            `Verification marker: ${marker}`,
          ].join('\r\n');

          let buffer = '';
          let waiter = null;
          const socket = tls.connect({ host, port, servername: host, rejectUnauthorized: true });
          const totalTimeout = setTimeout(() => {
            lastStage = 'TOTAL_TIMEOUT';
            try { socket.destroy(); } catch {}
            emit('FAIL', false);
          }, MAIL_TIMEOUT_MS + 2_500);

          function readResponse(stage) {
            lastStage = stage;
            return new Promise((resolve, reject) => {
              const timeout = setTimeout(() => {
                responseBudget = 'FAIL';
                waiter = null;
                reject(new Error('smtp_timeout'));
              }, MAIL_TIMEOUT_MS);
              waiter = (response) => {
                clearTimeout(timeout);
                resolve(response);
              };
              drain();
            });
          }
          function drain() {
            if (!waiter) return;
            const lines = buffer.split(/\r?\n/);
            const complete = lines.findIndex((line) => /^\d{3} /.test(line));
            if (complete < 0) return;
            const response = lines.slice(0, complete + 1).join('\n');
            buffer = lines.slice(complete + 1).join('\n');
            const resolve = waiter;
            waiter = null;
            resolve(response);
          }
          function code(response) { return Number(String(response).slice(0, 3)); }
          async function command(value, allowed, stage) {
            socket.write(`${value}\r\n`);
            const response = await readResponse(stage);
            if (!allowed.includes(code(response))) throw new Error('smtp_rejected');
          }

          socket.on('data', (chunk) => { buffer += chunk.toString('utf8'); drain(); });
          socket.once('error', () => { clearTimeout(totalTimeout); emit('FAIL', false); });
          socket.once('secureConnect', async () => {
            try {
              const greeting = await readResponse('GREETING');
              if (code(greeting) !== 220) throw new Error('smtp_rejected');
              await command('EHLO transparent-price.local', [250], 'EHLO');
              const auth = Buffer.from(`\u0000${user}\u0000${pass}`, 'utf8').toString('base64');
              await command(`AUTH PLAIN ${auth}`, [235], 'AUTH_PLAIN');
              await command(`MAIL FROM:<${from}>`, [250], 'MAIL_FROM');
              await command(`RCPT TO:<${recipient}>`, [250, 251], 'RCPT_TO');
              await command('DATA', [354], 'DATA');
              lastStage = 'DATA_BODY';
              socket.write(`${mime}\r\n.\r\n`);
              const accepted = await readResponse('DATA_ACCEPT');
              if (code(accepted) !== 250) throw new Error('smtp_rejected');
              lastStage = 'COMPLETE';
              socket.write('QUIT\r\n');
              clearTimeout(totalTimeout);
              socket.end();
              emit('PASS', true);
            } catch {
              clearTimeout(totalTimeout);
              try { socket.destroy(); } catch {}
              emit('FAIL', false);
            }
          });
          NODE
          PAYLOAD="$payload" CFG="$cfg" python3 - <<'PY'
          import json, os, re
          cfg = json.load(open(os.environ['CFG'], encoding='utf-8'))
          recipient = str(cfg.get('recipient', ''))
          marker = str(cfg.get('marker', ''))
          if not re.fullmatch(r'[A-Za-z0-9._+-]{1,64}@acceptance\.xn----8sbjf4befbjgs9b\.xn--p1ai', recipient):
              raise SystemExit(31)
          if not re.fullmatch(r'[A-Z0-9-]{20,128}', marker):
              raise SystemExit(32)
          path = os.environ['PAYLOAD']
          text = open(path, encoding='utf-8').read()
          text = text.replace('__RECIPIENT__', json.dumps(recipient)).replace('__MARKER__', json.dumps(marker))
          open(path, 'w', encoding='utf-8').write(text)
          PY
          chmod 0600 "$payload"
          send_result="$(docker exec -i "$web_id" /nodejs/bin/node --input-type=commonjs - < "$payload" 2>/dev/null)"
          for key in WEB_CONTAINER_CARDINALITY WEB_SMTP_DELIVERY_RESULT WEB_SMTP_LAST_STAGE WEB_SMTP_TOTAL_BUCKET WEB_SMTP_RESPONSE_5000_BUDGET WEB_SMTP_APP_7500_BUDGET WEB_SMTP_MAIL_SENT PRODUCTION_MUTATION; do
            line="$(grep -E "^${key}=[A-Z0-9_-]+$" <<< "$send_result" | tail -1)"
            [[ -n "$line" ]]
            printf '%s\n' "$line"
          done
          REMOTE
          cat "$result"
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^[A-Z0-9_]+$ && "$value" =~ ^[A-Z0-9_-]+$ ]]
            printf '%s=%s\n' "${key,,}" "$value" >> "$GITHUB_OUTPUT"
          done < "$result"

      - name: Recheck exact main immediately after acceptance SMTP transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$TARGET_SHA" ]]
          git fetch --no-tags origin main >/dev/null
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "${{ steps.send.outputs.web_smtp_delivery_result }}" == PASS ]]
          [[ "${{ steps.send.outputs.web_smtp_mail_sent }}" == YES ]]
          [[ "${{ steps.send.outputs.production_mutation }}" == ACCEPTANCE_MAIL_ONLY ]]

      - name: Prove read-only IMAP receipt of the unique acceptance marker
        id: receipt
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          RECEIPT_CFG: ${{ steps.input.outputs.receipt_cfg }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_cfg="/tmp/pc-web-delivery-receipt-${GITHUB_RUN_ID}.json"
          scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$RECEIPT_CFG" "$USER@$HOST:$remote_cfg"
          result="$(ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$USER@$HOST" "python3 - '$remote_cfg' '$SMTP_HOST' '$IMAP_PORT'" <<'PY'
          import email, imaplib, json, os, re, ssl, sys, time
          cfg_path, host, port_raw = sys.argv[1:4]
          try:
              os.chmod(cfg_path, 0o600)
              cfg = json.load(open(cfg_path, encoding='utf-8'))
              user = str(cfg.get('user', ''))
              password = str(cfg.get('password', ''))
              recipient = str(cfg.get('recipient', ''))
              marker = str(cfg.get('marker', ''))
              if not re.fullmatch(r'[A-Za-z0-9._+-]{1,64}@acceptance\.xn----8sbjf4befbjgs9b\.xn--p1ai', user): raise ValueError()
              if not re.fullmatch(r'[A-Za-z0-9._+-]{1,64}@acceptance\.xn----8sbjf4befbjgs9b\.xn--p1ai', recipient): raise ValueError()
              if not password or any(c in password for c in ('\n','\r','\x00')): raise ValueError()
              if not re.fullmatch(r'[A-Z0-9-]{20,128}', marker): raise ValueError()
              context = ssl.create_default_context()
              deadline = time.time() + 120
              while time.time() < deadline:
                  box = None
                  try:
                      box = imaplib.IMAP4_SSL(host, int(port_raw), ssl_context=context, timeout=15)
                      box.login(user, password)
                      status, _ = box.select('INBOX', readonly=True)
                      if status != 'OK': raise RuntimeError()
                      status, data = box.search(None, 'ALL')
                      if status != 'OK': raise RuntimeError()
                      identifiers = (data[0] or b'').split()[-250:]
                      for identifier in reversed(identifiers):
                          status, rows = box.fetch(identifier, '(BODY.PEEK[])')
                          if status != 'OK': continue
                          raw = next((item[1] for item in rows if isinstance(item, tuple) and len(item) > 1), None)
                          if not raw: continue
                          message = email.message_from_bytes(raw)
                          payload = raw.decode('utf-8', errors='replace')
                          if marker not in payload: continue
                          headers = '\n'.join(str(message.get(h, '')) for h in ('To','Delivered-To','X-Original-To','Envelope-To'))
                          if recipient not in headers and recipient not in payload: continue
                          print('IMAP_RECEIPT_RESULT=PASS')
                          print('IMAP_RECEIPT_READ_ONLY=YES')
                          box.logout()
                          raise SystemExit(0)
                      box.logout()
                  except imaplib.IMAP4.error:
                      if box:
                          try: box.logout()
                          except Exception: pass
                      print('IMAP_RECEIPT_RESULT=AUTH_OR_PROTOCOL_FAIL')
                      print('IMAP_RECEIPT_READ_ONLY=YES')
                      raise SystemExit(0)
                  except Exception:
                      if box:
                          try: box.logout()
                          except Exception: pass
                  time.sleep(5)
              print('IMAP_RECEIPT_RESULT=NOT_FOUND')
              print('IMAP_RECEIPT_READ_ONLY=YES')
          finally:
              try: os.remove(cfg_path)
              except Exception: pass
          PY
          )"
          printf '%s\n' "$result"
          grep -Fxq 'IMAP_RECEIPT_RESULT=PASS' <<< "$result"
          grep -Fxq 'IMAP_RECEIPT_READ_ONLY=YES' <<< "$result"
          printf 'imap_receipt_result=PASS\nimap_receipt_read_only=YES\n' >> "$GITHUB_OUTPUT"

      - name: Publish bounded acceptance delivery evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment "$RELEASE_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Production P0 Web-container SMTP acceptance delivery proof

          - exact main at SMTP transaction: \`$TARGET_SHA\`
          - Web container cardinality: \`${{ steps.send.outputs.web_container_cardinality }}\`
          - SMTP delivery result: \`${{ steps.send.outputs.web_smtp_delivery_result }}\`
          - last SMTP stage: \`${{ steps.send.outputs.web_smtp_last_stage }}\`
          - total latency bucket: \`${{ steps.send.outputs.web_smtp_total_bucket }}\`
          - current 5s response budget: \`${{ steps.send.outputs.web_smtp_response_5000_budget }}\`
          - current 7.5s total budget: \`${{ steps.send.outputs.web_smtp_app_7500_budget }}\`
          - acceptance mail sent: \`${{ steps.send.outputs.web_smtp_mail_sent }}\`
          - isolated acceptance IMAP receipt: \`${{ steps.receipt.outputs.imap_receipt_result }}\`
          - IMAP mode: \`READ_ONLY\`
          - reviewer identity / reset / password / TOTP / session access: \`NONE\`
          - production mutation: \`ACCEPTANCE_MAIL_ONLY\`
          - database/runtime/deployment mutation: \`NONE\`
          - recipient / sender / marker / credentials / raw SMTP / raw IMAP: \`NOT_PUBLISHED\`
          - new recurring cost: \`0 RUB\`" >/dev/null

      - name: Cleanup local protected material
        if: always()
        shell: bash
        run: |
          rm -f -- "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts" "${{ steps.input.outputs.send_cfg }}" "${{ steps.input.outputs.receipt_cfg }}"
