name: Role Eligibility Production API Exact-SHA

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/role-eligibility-production-api-release.yml'
      - 'scripts/production-role-eligibility-api-release.sh'
      - 'scripts/check-role-eligibility-api-release.mjs'

permissions:
  contents: read
  packages: write
  issues: write

env:
  DEFAULT_HOST: 195.19.12.120
  READINESS_ISSUE_NUMBER: 4922
  COMMAND: /role-eligibility api deploy current-main
  EVIDENCE_DIR: artifacts/role-eligibility-production-api-release
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
  PROD_DIR_SECRET: ${{ secrets.PC_PROD_DIR }}
  PROD_COMPOSE_SECRET: ${{ secrets.PC_PROD_COMPOSE }}
  PROD_PROJECT_SECRET: ${{ secrets.PC_PROD_PROJECT }}

concurrency:
  group: role-eligibility-production-api-release
  cancel-in-progress: false

jobs:
  contract:
    name: Validate bounded Role Eligibility API release authority
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.number == 4922 &&
       github.event.comment.body == '/role-eligibility api deploy current-main' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Shell and blast-radius contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-role-eligibility-api-release.sh
          node scripts/check-role-eligibility-api-release.mjs
      - name: Registration protected manifest
        run: node scripts/check-role-eligibility-registration-guard.mjs

  build:
    name: Build exact Role Eligibility API image
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4922 &&
      github.event.comment.body == '/role-eligibility api deploy current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      api_image: ${{ steps.target.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve immutable current-main target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          api_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$target" =~ ^[0-9a-f]{40}$ && "$target" == "$api_main" ]]
          [[ "$target" == "$GITHUB_SHA" ]] || { echo ROLE_ELIGIBILITY_API_RELEASE_MAIN_DRIFT >&2; exit 14; }
          short="${target:0:7}"
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/grainflow-api:sha-$short"
          created="$(git show -s --format=%cI "$target")"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$target" > "$EVIDENCE_DIR/target-sha.txt"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.target.outputs.image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api,ignore-error=true
          build-args: |
            BUILD_DATE=${{ steps.target.outputs.created }}
            GIT_COMMIT=${{ steps.target.outputs.sha }}

      - name: Verify immutable API image provenance
        env:
          API_IMAGE: ${{ steps.target.outputs.image }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$API_IMAGE" >/dev/null
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$API_IMAGE")"
          [[ "$revision" == "$TARGET_SHA" ]]
          docker image inspect "$API_IMAGE" > "$EVIDENCE_DIR/api-image.json"
          printf 'ROLE_ELIGIBILITY_API_IMAGE=PASS\nROLE_ELIGIBILITY_TARGET_SHA=%s\n' "$TARGET_SHA" | tee "$EVIDENCE_DIR/image-result.txt"

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-eligibility-api-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  deploy:
    name: Deploy only exact Role Eligibility API image
    needs: build
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4922 &&
      github.event.comment.body == '/role-eligibility api deploy current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.target_sha }}
          fetch-depth: 0

      - name: Recheck current-main immediately before production mutation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.build.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$current_main" == "$TARGET_SHA" ]] || { echo ROLE_ELIGIBILITY_API_RELEASE_MAIN_DRIFT >&2; exit 30; }
          node scripts/check-role-eligibility-registration-guard.mjs | tee /tmp/registration-guard.txt
          grep -Fxq REGISTRATION_CODE_CHANGED=0 /tmp/registration-guard.txt

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo ROLE_ELIGIBILITY_CANONICAL_VPS_MISMATCH >&2; exit 31; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo ROLE_ELIGIBILITY_PRODUCTION_PRINCIPAL_INVALID >&2; exit 32; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 33
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo ROLE_ELIGIBILITY_PINNED_HOST_FINGERPRINT_REQUIRED >&2; exit 34; }
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            ssh-keygen -lf "$pub" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo ROLE_ELIGIBILITY_NO_VALID_PROTECTED_PRIVATE_KEY >&2
            exit 35
          }

          scan="$(mktemp)"; match="$(mktemp)"; pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo ROLE_ELIGIBILITY_PINNED_HOST_KEY_MISMATCH >&2; exit 36; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; docker compose version >/dev/null; echo ROLE_ELIGIBILITY_SSH_AUTH=PASS' \
            | tee "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROLE_ELIGIBILITY_SSH_AUTH=PASS "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Copy bounded API release authority
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/production-role-eligibility-api-release.sh \
            "$SSH_USER_SECRET@$HOST:/tmp/pc-role-eligibility-api-${GITHUB_RUN_ID}.sh"

      - name: Authenticate production host to exact private registry
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          registry_config="/tmp/pc-role-eligibility-registry-${GITHUB_RUN_ID}"
          printf '%s' "$GH_TOKEN" | ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "set -euo pipefail; rm -rf '$registry_config'; install -d -m 0700 '$registry_config'; DOCKER_CONFIG='$registry_config' docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null"
          printf 'ROLE_ELIGIBILITY_REGISTRY_LOGIN=PASS\n' > "$EVIDENCE_DIR/registry-login.txt"

      - name: Deploy and audit bounded exact API image
        id: release
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ needs.build.outputs.target_sha }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
        shell: bash
        run: |
          set -euo pipefail
          enc(){ printf '%s' "$1" | base64 -w0; }
          raw="$(mktemp)"
          registry_config="/tmp/pc-role-eligibility-registry-${GITHUB_RUN_ID}"
          remote_script="/tmp/pc-role-eligibility-api-${GITHUB_RUN_ID}.sh"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "set -euo pipefail; chmod 0700 '$remote_script'; DOCKER_CONFIG='$registry_config' PC_ROLE_ELIGIBILITY_API_IMAGE='$API_IMAGE' PC_PROD_DIR_B64='$(enc "${PROD_DIR_SECRET:-}")' PC_PROD_COMPOSE_B64='$(enc "${PROD_COMPOSE_SECRET:-}")' PC_PROD_PROJECT_B64='$(enc "${PROD_PROJECT_SECRET:-}")' '$remote_script' deploy '$TARGET_SHA'; DOCKER_CONFIG='$registry_config' PC_PROD_DIR_B64='$(enc "${PROD_DIR_SECRET:-}")' PC_PROD_COMPOSE_B64='$(enc "${PROD_COMPOSE_SECRET:-}")' PC_PROD_PROJECT_B64='$(enc "${PROD_PROJECT_SECRET:-}")' '$remote_script' audit '$TARGET_SHA'" \
            > "$raw" 2>&1
          remote_status=$?
          set -e
          sed -E 's#(postgres(ql)?://)[^/@ ]+@#\1[REDACTED]@#g' "$raw" | tee "$EVIDENCE_DIR/api-release.log"
          rm -f "$raw"
          if (( remote_status != 0 )); then
            printf 'ROLE_ELIGIBILITY_API_REMOTE_EXIT=%s\n' "$remote_status" | tee -a "$EVIDENCE_DIR/api-release.log" >&2
            exit "$remote_status"
          fi
          grep -Fxq ROLE_ELIGIBILITY_API_RELEASE=PASS "$EVIDENCE_DIR/api-release.log"
          grep -Fxq "ROLE_ELIGIBILITY_TARGET_SHA=$TARGET_SHA" "$EVIDENCE_DIR/api-release.log"
          grep -Fxq "ROLE_ELIGIBILITY_API_REVISION=$TARGET_SHA" "$EVIDENCE_DIR/api-release.log"
          grep -Fxq ROLE_ELIGIBILITY_API_READY=PASS "$EVIDENCE_DIR/api-release.log"
          grep -Fxq ROLE_ELIGIBILITY_ENFORCEMENT_UNCHANGED=PASS "$EVIDENCE_DIR/api-release.log"
          grep -Fxq REGISTRATION_CONFIGURATION_UNCHANGED=PASS "$EVIDENCE_DIR/api-release.log"
          grep -Fxq PROTECTED_CONTAINERS_UNCHANGED=PASS "$EVIDENCE_DIR/api-release.log"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Publish bounded production evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.build.outputs.target_sha }}
          RELEASE_STATUS: ${{ steps.release.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_STATUS:-}" == PASS ]] || exit 1
          cat > "$EVIDENCE_DIR/result.md" <<EOF
          ## Role Eligibility API exact-SHA production release \`$GITHUB_RUN_ID\`

          - target SHA: \`$TARGET_SHA\`
          - API release: \`PASS\`
          - API readiness: \`PASS\`
          - protected containers unchanged: \`PASS\`
          - registration code changed: \`0\`
          - registration runtime configuration unchanged: \`PASS\`
          - Role Eligibility enforcement changed: \`0\`
          EOF
          gh issue comment "$READINESS_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/result.md"

      - name: Cleanup bounded credentials and remote assets
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOST:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
              "rm -f '/tmp/pc-role-eligibility-api-${GITHUB_RUN_ID}.sh'; rm -rf '/tmp/pc-role-eligibility-registry-${GITHUB_RUN_ID}'" || true
          fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Enforce bounded production result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.release.outputs.status }}' == PASS ]]

      - name: Upload API release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-eligibility-production-api-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
