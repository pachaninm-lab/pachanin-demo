name: One-time materialize Qwen live UI acceptance v3

on:
  push:
    branches:
      - fix/qwen-live-ui-acceptance-v2
    paths:
      - .github/workflows/materialize-qwen-live-ui-acceptance-v3-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qwen-live-ui-acceptance-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Build clean governed repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml')
          text = workflow.read_text(encoding='utf-8')
          nl = chr(10)

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          dock = "    const dockTrigger = page.locator('.pc-public-contact-dock-assistant');"
          hydration = nl.join([
              "    const hiddenTrigger = page.locator('.pc-public-assistant-shortcut');",
              "    await hiddenTrigger.waitFor({ state: 'attached', timeout: 30000 });",
              "    await page.waitForFunction(() => document.querySelector('.pc-public-assistant-shortcut')?.getAttribute('aria-hidden') === 'true', null, { timeout: 30000 });",
              '',
              dock,
          ])
          replace_once(dock, hydration, 'dock hydration anchor')

          old_dialog = nl.join([
              "    const dialog = page.locator('#pc-public-assistant-panel');",
              "    await dialog.waitFor({ state: 'visible', timeout: 30000 });",
          ])
          new_dialog = nl.join([
              "    const dialog = page.locator('#pc-public-assistant-panel');",
              '    try {',
              "      await dialog.waitFor({ state: 'visible', timeout: 5000 });",
              '    } catch {',
              '      await hiddenTrigger.evaluate((node) => node.click());',
              '    }',
              "    await dialog.waitFor({ state: 'visible', timeout: 30000 });",
          ])
          replace_once(old_dialog, new_dialog, 'dialog hydration fallback')

          replace_once("!== 'Что нужно узнать?'", "!== 'Чем помочь?'", 'current empty state')
          replace_once("throw new Error('compact_empty_state_missing');", "throw new Error('agro_empty_state_missing');" + nl + "    if (!((await dialog.locator('.pc-public-assistant-identity span').textContent()) || '').includes('агробизнесу')) throw new Error('agro_subtitle_missing');", 'agro subtitle assertion')
          replace_once("{ name: 'Задай вопрос о платформе' }", "{ name: 'Задай вопрос об агробизнесе или платформе' }", 'composer accessible name')
          replace_once("    const answered = dialog.locator('.pc-public-assistant-message[data-role=\"assistant\"][data-stream-status=\"answered\"]');", "    let answered = dialog.locator('.pc-public-assistant-message[data-role=\"assistant\"][data-stream-status=\"answered\"]').last();", 'mutable answer locator')
          replace_once("    const answerText = ((await answered.locator('.pc-public-assistant-bubble').textContent()) || '').trim();", "    let answerText = ((await answered.locator('.pc-public-assistant-bubble').textContent()) || '').trim();", 'mutable answer text')
          replace_once("throw new Error('ui_answer_too_short');", "throw new Error('ui_platform_answer_too_short');", 'platform answer assertion')

          alert = "    if (await dialog.locator('[role=\"alert\"]').count()) throw new Error('ui_alert_present');"
          additional = nl.join([
              alert,
              '',
              "    await dialog.getByRole('button', { name: 'Новый диалог' }).click();",
              "    await composer.fill('Привет');",
              "    await dialog.getByRole('button', { name: 'Отправить' }).click();",
              "    answered = dialog.locator('.pc-public-assistant-message[data-role=\"assistant\"][data-stream-status=\"answered\"]').last();",
              "    await answered.waitFor({ state: 'visible', timeout: 240000 });",
              "    answerText = ((await answered.locator('.pc-public-assistant-bubble').textContent()) || '').trim();",
              "    if (answerText.length < 10) throw new Error('ui_greeting_answer_too_short');",
              "    if (answerText.includes('нет подтверждённого основания')) throw new Error('legacy_greeting_refusal_present');",
              '',
              "    await dialog.getByRole('button', { name: 'Новый диалог' }).click();",
              "    await composer.fill('Что влияет на цену зерна?');",
              "    await dialog.getByRole('button', { name: 'Отправить' }).click();",
              "    answered = dialog.locator('.pc-public-assistant-message[data-role=\"assistant\"][data-stream-status=\"answered\"]').last();",
              "    await answered.waitFor({ state: 'visible', timeout: 240000 });",
              "    answerText = ((await answered.locator('.pc-public-assistant-bubble').textContent()) || '').trim();",
              "    if (answerText.length < 20) throw new Error('ui_general_agro_answer_too_short');",
              "    if (await answered.locator('.pc-public-assistant-source-list a').count()) throw new Error('general_agro_fake_platform_citation');",
          ])
          replace_once(alert, additional, 'greeting and agro live checks')
          text = text.replace("emptyState: 'Что нужно узнать?'", "emptyState: 'Чем помочь?'", 1)
          workflow.write_text(text, encoding='utf-8')

          next_config = Path('apps/web/next.config.js')
          config = next_config.read_text(encoding='utf-8')
          marker = '// Exact-main Qwen live UI acceptance v2 trigger: hydrated agro assistant.' + nl
          header = "/** @type {import('next').NextConfig} */" + nl
          if marker not in config:
              if header not in config:
                  raise SystemExit('next.config.js header missing')
              next_config.write_text(config.replace(header, header + marker, 1), encoding='utf-8')

          scope = Path('docs/platform-v7/autopilot/scopes/fix-qwen-live-ui-acceptance-v2.json')
          scope.write_text(json.dumps({
              'schemaVersion': 'platform-v7.concurrent-scope.v1',
              'branch': 'fix/qwen-live-ui-acceptance-v2',
              'status': 'active',
              'purpose': 'Repair exact-main REG.RU Chromium acceptance for the released agro AI copy and prove live platform, greeting and broad agro answers after server and RU/EN/ZH inference already passed.',
              'approvedBy': 'owner-direct-urgent-remediation-2026-07-30',
              'authorityBaseExactMain': '86a2472a7c6f206222199b1e9846952aa0b54758',
              'allowedPaths': [
                  'docs/platform-v7/autopilot/scopes/fix-qwen-live-ui-acceptance-v2.json',
                  '.github/workflows/tai-restricted-qwen-reg-ru-activation.yml',
                  'apps/web/next.config.js',
              ],
              'forbiddenCapabilities': [
                  'runtime AI behavior changes',
                  'private data access',
                  'write authority',
                  'external model calls',
                  'Netlify or Vercel deployment',
              ],
          }, ensure_ascii=False, indent=2) + nl, encoding='utf-8')
          PY
          git rm .github/workflows/materialize-qwen-live-ui-acceptance-v3-once.yml .github/qwen-live-ui-v2.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tai-restricted-qwen-reg-ru-activation.yml apps/web/next.config.js docs/platform-v7/autopilot/scopes/fix-qwen-live-ui-acceptance-v2.json
          git commit -m 'QWEN: repair live agro AI Chromium acceptance'
          git push origin HEAD:fix/qwen-live-ui-acceptance-v2
