name: One-time materialize Qwen live UI acceptance v3

on:
  push:
    branches:
      - fix/qwen-live-ui-acceptance-v2
    paths:
      - .github/workflows/materialize-qwen-live-ui-acceptance-v3-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qwen-live-ui-acceptance-v2
          fetch-depth: 0
      - name: Materialize governed final files
        env:
          PATCH_SCRIPT_B64: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > "$RUNNER_TEMP/materialize.py"
          python3 "$RUNNER_TEMP/materialize.py"
          git rm .github/workflows/materialize-qwen-live-ui-acceptance-v3-once.yml
          python3 -m pip install --disable-pip-version-check 'pyyaml>=6,<7'
          python3 scripts/check-workflow-syntax.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tai-restricted-qwen-reg-ru-activation.yml apps/web/next.config.js docs/platform-v7/autopilot/scopes/fix-qwen-live-ui-acceptance-v2.json
          git commit -m 'QWEN: repair live agro AI Chromium acceptance'
          git push origin HEAD:fix/qwen-live-ui-acceptance-v2
