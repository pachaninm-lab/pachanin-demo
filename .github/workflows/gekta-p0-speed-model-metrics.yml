name: Gekta P0 SPEED Model Metrics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gekta-p0-speed-model-metrics.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gekta-p0-speed-model-metrics
  cancel-in-progress: false

env:
  MODEL_HOST_SECRET: ${{ secrets.TAI_MODEL_HOST }}
  MODEL_USER_SECRET: ${{ secrets.TAI_MODEL_SSH_USER }}
  MODEL_PORT_SECRET: ${{ secrets.TAI_MODEL_SSH_PORT }}
  MODEL_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_KEY }}
  MODEL_HOST_KEY_SECRET: ${{ secrets.TAI_MODEL_SSH_HOST_KEY }}

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove read-only bounded contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const s = fs.readFileSync('.github/workflows/gekta-p0-speed-model-metrics.yml', 'utf8');
          const forbidden = [
            'sudo' + ' ',
            'systemctl' + ' restart',
            'systemctl' + ' stop',
            'systemctl' + ' start',
            'kill' + ' ',
            'pkill' + ' ',
            'docker' + ' ',
            'curl -X' + ' POST',
          ];
          for (const x of forbidden) {
            if (s.includes(x)) throw new Error(`mutation primitive forbidden: ${x}`);
          }
          for (const x of ['TAI_MODEL_SSH_KEY', 'TAI_MODEL_SSH_HOST_KEY', 'StrictHostKeyChecking=yes', '/metrics']) {
            if (!s.includes(x)) throw new Error(`missing protected control: ${x}`);
          }
          NODE

  metrics:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3896 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/gekta speed-model-metrics current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact main
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse origin/main)"
          [[ "$sha" == "$(git rev-parse HEAD)" ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned model-host transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          write_key(){
            local raw="$1" target="$2" a b c
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null || true
            for candidate in "$a" "$b" "$c"; do
              if [[ -s "$candidate" ]] && ssh-keygen -y -P '' -f "$candidate" >/dev/null 2>&1; then
                install -m 0600 "$candidate" "$target"; rm -f "$a" "$b" "$c"; return 0
              fi
            done
            rm -f "$a" "$b" "$c"; return 1
          }
          host="$(trim "${MODEL_HOST_SECRET:-}")"
          user="$(trim "${MODEL_USER_SECRET:-}")"
          port="$(trim "${MODEL_PORT_SECRET:-22}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535))
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          write_key "$(trim "${MODEL_KEY_SECRET:-}")" "$HOME/.ssh/id_tai_model"
          pin="$(trim "${MODEL_HOST_KEY_SECRET:-}")"
          [[ -n "$pin" ]]
          pin_type="$(printf '%s' "$pin" | awk '{print $(NF-1)}')"
          pin_material="$(printf '%s' "$pin" | awk '{print $NF}')"
          scanned="$(ssh-keyscan -T 30 -p "$port" -t "$pin_type" "$host" 2>/dev/null || true)"
          printf '%s\n' "$scanned" | awk -v pinned="$pin_material" '$3 == pinned {ok=1} END {exit ok?0:1}'
          printf '%s %s %s\n' "$host" "$pin_type" "$pin_material" > "$HOME/.ssh/model_known_hosts"
          chmod 600 "$HOME/.ssh/model_known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "user=$user" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Read whitelisted llama metrics
        env:
          MODEL_HOST: ${{ steps.ssh.outputs.host }}
          MODEL_USER: ${{ steps.ssh.outputs.user }}
          MODEL_SSH_PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_tai_model" -p "$MODEL_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/model_known_hosts" \
            -o StrictHostKeyChecking=yes "$MODEL_USER@$MODEL_HOST" \
            python3 - > "$RUNNER_TEMP/metrics" <<'PY'
          import pathlib,re,urllib.request
          service='tai-qwen3-8b.service'
          import subprocess
          pid=subprocess.check_output(['systemctl','show',service,'--property=MainPID','--value'],text=True).strip()
          if not pid.isdigit() or int(pid)<=0: raise SystemExit('invalid model pid')
          argv=[x.decode('utf-8','replace') for x in pathlib.Path(f'/proc/{pid}/cmdline').read_bytes().split(b'\0') if x]
          if '--metrics' not in argv: raise SystemExit('metrics flag absent')
          port=8080
          for i,x in enumerate(argv[:-1]):
              if x in ('--port','--listen-port') and argv[i+1].isdigit(): port=int(argv[i+1])
          if not 1 <= port <= 65535: raise SystemExit('invalid listen port')
          with urllib.request.urlopen(f'http://127.0.0.1:{port}/metrics',timeout=4) as r:
              body=r.read(512_000).decode('utf-8','replace')
          wanted=(
            'llamacpp:prompt_tokens_total','llamacpp:prompt_seconds_total','llamacpp:prompt_tokens_seconds',
            'llamacpp:tokens_predicted_total','llamacpp:tokens_predicted_seconds_total','llamacpp:predicted_tokens_seconds',
            'llamacpp:requests_processing','llamacpp:requests_deferred','llamacpp:n_tokens_max',
            'llamacpp:kv_cache_usage_ratio','llamacpp:kv_cache_tokens')
          found={}
          for line in body.splitlines():
              if not line or line.startswith('#'): continue
              m=re.match(r'^([^\s{]+)(?:\{[^}]*\})?\s+([-+0-9.eE]+)$',line)
              if m and m.group(1) in wanted:
                  try: found.setdefault(m.group(1),[]).append(float(m.group(2)))
                  except ValueError: pass
          print('MODEL_METRICS_READ_ONLY=1')
          print(f'MODEL_METRICS_HTTP_PORT={port}')
          for name in wanted:
              vals=found.get(name,[])
              key=name.split(':',1)[1].upper().replace(':','_')
              if vals: print(f'MODEL_METRIC_{key}={sum(vals):.9g}')
              else: print(f'MODEL_METRIC_{key}=MISSING')
          PY
          cat "$RUNNER_TEMP/metrics"

      - name: Publish bounded metrics evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"
          {
            echo '## Gekta P0 SPEED llama metrics'
            echo
            echo "- exact repository main: \`$TARGET_SHA\`"
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo '- mode: `READ_ONLY`'
            echo '- production mutation: `NONE`'
            echo
            echo '```text'
            if [[ -s "$RUNNER_TEMP/metrics" ]]; then cat "$RUNNER_TEMP/metrics"; else echo 'MODEL_METRICS_ERROR=probe_not_completed'; fi
            echo '```'
          } > "$body"
          gh issue comment 3896 --repo "$GITHUB_REPOSITORY" --body-file "$body"
