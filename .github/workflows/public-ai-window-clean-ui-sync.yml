name: Public AI window exact-main synchronizer

on:
  push:
    branches:
      - agent/public-ai-window-clean-ui
    paths:
      - .github/workflows/public-ai-window-clean-ui-sync.yml

permissions:
  contents: write

concurrency:
  group: public-ai-window-clean-ui-exact-main-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-ai-window-clean-ui
          fetch-depth: 0

      - name: Merge current main and retire synchronizer
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/public-ai-window-clean-ui'
          self='.github/workflows/public-ai-window-clean-ui-sync.yml'
          scope='docs/platform-v7/autopilot/scopes/public-ai-window-clean-ui-3368.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main "$branch"
          expected_head="$(git rev-parse "origin/$branch")"
          test "$(git rev-parse HEAD)" = "$expected_head"
          main_sha="$(git rev-parse origin/main)"
          git merge --no-ff --no-commit "$main_sha"
          MAIN_SHA="$main_sha" SELF_PATH="$self" SCOPE_PATH="$scope" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['SCOPE_PATH'])
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['baseCommit'] = os.environ['MAIN_SHA']
          payload['allowedPaths'] = [item for item in payload['allowedPaths'] if item != os.environ['SELF_PATH']]
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git rm "$self"
          git diff --check
          git commit -m "chore(ui): synchronize public AI window with exact main"
          git fetch --no-tags origin main "$branch"
          test "$(git rev-parse origin/main)" = "$main_sha"
          test "$(git rev-parse "origin/$branch")" = "$expected_head"
          git push origin "HEAD:refs/heads/$branch"
