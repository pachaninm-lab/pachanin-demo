name: Temporary auth-mail release materializer v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-auth-mail-release-materializer-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/industrial-auth-mail-outbox-3785
          fetch-depth: 0

      - name: Materialize validated release files and Git blobs
        id: materialize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REPORT="/tmp/auth-mail-materializer-v2-${GITHUB_RUN_ID}.txt"
          status=0

          set +e
          (
            set -euo pipefail
            echo "SOURCE_HEAD=$(git rev-parse HEAD)"
            echo "SOURCE_PATCH=c4f07f9ad5184b1bd055902c11b1e72a185e4c40"

            git show c4f07f9ad5184b1bd055902c11b1e72a185e4c40:.github/workflows/tmp-auth-mail-release-wiring.yml > /tmp/original-auth-mail-wiring.yml

            python3 -c 'import base64,re; from pathlib import Path; s=Path(".github/workflows/tmp-auth-mail-release-wiring.yml").read_text(); m=re.search(r"printf .%s. .([A-Za-z0-9+/=]+). \| base64 -d > /tmp/auth-mail-extract.py", s); assert m, "extractor payload missing"; Path("/tmp/auth-mail-extract.py").write_bytes(base64.b64decode(m.group(1)))'
            python3 /tmp/auth-mail-extract.py
            python3 /tmp/auth-mail-release-patch.py

            sed -i "/AUTH_MAIL_WORKER_ARTIFACT=PASS/s/[[:space:]]\+$//" scripts/production-full-stack-exact-sha.sh
            [[ "$(grep -c 'AUTH_MAIL_WORKER_ARTIFACT=PASS' scripts/production-full-stack-exact-sha.sh)" == 1 ]]
            ! grep -nE 'AUTH_MAIL_WORKER_ARTIFACT=PASS.*[[:space:]]+$' scripts/production-full-stack-exact-sha.sh

            bash -n scripts/provision-production-auth-mail-runtime.sh
            bash -n scripts/production-full-stack-exact-sha.sh
            node scripts/check-production-full-stack-release.mjs
            git diff --check
            echo 'VALIDATION=PASS'

            emit_blob() {
              local key="$1" path="$2" payload sha
              payload="$(jq -n --arg content "$(base64 -w0 "$path")" '{content:$content,encoding:"base64"}')"
              sha="$(curl --fail-with-body -sS \
                -X POST \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
                -d "$payload" | jq -r '.sha')"
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
              echo "BLOB_${key}=$sha"
            }

            emit_blob PROVISION scripts/provision-production-auth-mail-runtime.sh
            emit_blob EXECUTOR scripts/production-full-stack-exact-sha.sh
            emit_blob CHECK scripts/check-production-full-stack-release.mjs
            emit_blob RELEASE_WORKFLOW .github/workflows/production-full-stack-exact-sha.yml
            emit_blob PUBLISH_WORKFLOW .github/workflows/docker-publish.yml
            emit_blob SCOPE docs/platform-v7/autopilot/scopes/industrial-auth-mail-outbox-3785.json
            echo 'MATERIALIZE=PASS'
          ) >"$REPORT" 2>&1
          status=$?
          set -e

          echo "MATERIALIZE_EXIT=$status" >> "$REPORT"
          cat "$REPORT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload materializer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-mail-materializer-v2-evidence
          path: /tmp/auth-mail-materializer-v2-*.txt
          if-no-files-found: error
          retention-days: 1

      - name: Propagate materializer failure
        if: always() && steps.materialize.outputs.status != '0'
        shell: bash
        run: exit 1
