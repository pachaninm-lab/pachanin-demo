name: Production Auth-Mail Worker Current State v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-auth-mail-worker-current-state-v2.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-auth-mail-worker-current-state-v2
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  SUBJECT_PRODUCTION_SHA: f166f50e8526cf43f3193e771be05ebc66888494
  DIAGNOSTIC_COMMAND: /production p0-auth-mail-worker-current-state-v2 deployed
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate read-only current-worker classifier
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/production-auth-mail-worker-current-state-v2.yml').read_text(encoding='utf-8')
          required=['docker inspect','docker logs','/live','/ready','STARTUP_CODE','RUNTIME_LOG_CLASS','PRODUCTION_MUTATION NONE']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('missing invariant: '+' | '.join(missing))
          diagnostic=text.split('\n  diagnostic:\n',1)[1]
          forbidden=['docker restart','docker rm','docker compose','docker exec -i','curl -X POST','UPDATE auth.','INSERT INTO','DELETE FROM','ALTER ROLE','CREATE ROLE','DROP ROLE','sendAuthMailSmtp','claimBatch','expireStale','redactTerminal']
          bad=[x for x in forbidden if x in diagnostic]
          if bad: raise SystemExit('unsafe diagnostic surface: '+' | '.join(bad))
          PY

  diagnostic:
    name: Inspect retained deployed auth-mail worker without mutation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-worker-current-state-v2 deployed' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind current main and deployed subject
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$(git rev-parse HEAD)" == "$main_sha" ]]
          [[ "$SUBJECT_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SUBJECT_PRODUCTION_SHA}^{commit}"
          git merge-base --is-ancestor "$SUBJECT_PRODUCTION_SHA" "$main_sha"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "subject_sha=$SUBJECT_PRODUCTION_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || exit 10
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"; chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14
          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
              [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
            done < "$scan"
            sort -u -o "$match" "$match"
            [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$ready" == 1 ]] || exit 15
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo SSH_AUTH_OK' | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Classify current persistent worker state
        id: diagnostic
        shell: bash
        env:
          SUBJECT_SHA: ${{ steps.target.outputs.subject_sha }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"; clean="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$SUBJECT_SHA'" > "$raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          subject_sha="$1"
          emit(){ printf '%s=%s\n' "$1" "$2"; }
          finish(){ emit AUTH_MAIL_CURRENT_STATE_V2 "$1"; emit ERROR_CODE "$2"; emit PRODUCTION_MUTATION NONE; exit "${3:-0}"; }
          [[ "$(id -u)" -eq 0 ]] || finish FAIL ROOT_REQUIRED 20
          [[ "$subject_sha" =~ ^[0-9a-f]{40}$ ]] || finish FAIL SUBJECT_SHA_INVALID 21
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || finish FAIL WEB_CARDINALITY 22
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "${web_ids[0]}")"
          [[ -n "$project" ]] || finish FAIL PROJECT_MISSING 23

          mapfile -t all_workers < <(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker')
          emit ALL_WORKER_CARDINALITY "${#all_workers[@]}"
          subject_workers=()
          for candidate in "${all_workers[@]:-}"; do
            [[ -n "$candidate" ]] || continue
            revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$candidate" 2>/dev/null || true)"
            [[ "$revision" == "$subject_sha" ]] && subject_workers+=("$candidate")
          done
          emit SUBJECT_WORKER_CARDINALITY "${#subject_workers[@]}"
          if (( ${#subject_workers[@]} == 0 )); then finish FAIL SUBJECT_WORKER_ABSENT 24; fi
          if (( ${#subject_workers[@]} != 1 )); then finish FAIL SUBJECT_WORKER_MULTIPLE 25; fi
          id="${subject_workers[0]}"
          emit WORKER_REVISION PASS

          state="$(docker inspect --format '{{.State.Status}}' "$id" 2>/dev/null || true)"
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id" 2>/dev/null || true)"
          restart_count="$(docker inspect --format '{{.RestartCount}}' "$id" 2>/dev/null || true)"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$id" 2>/dev/null || true)"
          oom="$(docker inspect --format '{{.State.OOMKilled}}' "$id" 2>/dev/null || true)"
          [[ "$state" =~ ^(created|running|paused|restarting|removing|exited|dead)$ ]] || state=unknown
          [[ "$health" =~ ^(none|starting|healthy|unhealthy)$ ]] || health=unknown
          [[ "$restart_count" =~ ^[0-9]+$ ]] || restart_count=0
          [[ "$exit_code" =~ ^[0-9]+$ ]] || exit_code=999
          [[ "$oom" == true || "$oom" == false ]] || oom=unknown
          emit WORKER_STATE "$state"
          emit WORKER_HEALTH "$health"
          emit WORKER_RESTARTED "$([[ "$restart_count" -gt 0 ]] && echo YES || echo NO)"
          emit WORKER_EXIT_CODE "$exit_code"
          emit WORKER_OOM "$oom"

          cmd_ok=FAIL
          entry="$(docker inspect --format '{{json .Config.Entrypoint}}' "$id" 2>/dev/null || true)"
          cmd="$(docker inspect --format '{{json .Config.Cmd}}' "$id" 2>/dev/null || true)"
          [[ "$entry" == '[]' || "$entry" == 'null' ]] && [[ "$cmd" == '["/nodejs/bin/node","/app/dist/apps/api/src/auth-mail-worker.js"]' ]] && cmd_ok=PASS
          emit COMMAND_BOUNDARY "$cmd_ok"

          env_json="$(mktemp)"; mounts_json="$(mktemp)"; trap 'rm -f "$env_json" "$mounts_json"' EXIT
          docker inspect --format '{{json .Config.Env}}' "$id" > "$env_json"
          docker inspect --format '{{json .Mounts}}' "$id" > "$mounts_json"
          if python3 - "$env_json" <<'PY'
          import json,sys
          vals={}
          for item in json.load(open(sys.argv[1])) or []:
              k,sep,v=str(item).partition('=')
              if sep: vals[k]=v
          expected={'NODE_ENV':'production','RUNTIME_COMPONENT':'auth-mail-worker','AUTH_MAIL_WORKER_ENABLED':'true','AUTH_MAIL_WORKER_HEALTH_PORT':'3003','AUTH_MAIL_OUTBOX_KEYRING_DIR':'/run/pc-auth-mail/keyring','AUTH_MAIL_OUTBOX_CURRENT_KEY_VERSION_FILE':'/run/pc-auth-mail/current-key-version','AUTH_MAIL_DATABASE_URL_FILE':'/run/pc-auth-mail/database-url','AUTH_MAIL_TRANSPORT_FILE':'/run/pc-auth-mail/transport.env','REDIS_URL':'redis://redis:6379/0'}
          if any(vals.get(k)!=v for k,v in expected.items()): raise SystemExit(1)
          if any(k in vals for k in ('PC_SMTP_PASS','AUTH_MAIL_DATABASE_URL','DATABASE_URL','AUTH_DATABASE_URL')): raise SystemExit(1)
          PY
          then emit ENV_BOUNDARY PASS; else emit ENV_BOUNDARY FAIL; fi
          if python3 - "$mounts_json" <<'PY'
          import json,sys
          expected={'/run/pc-auth-mail/keyring':'/var/lib/pc-secret-authority/runtime/keyring','/run/pc-auth-mail/current-key-version':'/var/lib/pc-secret-authority/runtime/current-key-version','/run/pc-auth-mail/database-url':'/var/lib/pc-secret-authority/runtime/database-url','/run/pc-auth-mail/transport.env':'/var/lib/pc-secret-authority/runtime/transport.env'}
          seen={}
          for m in json.load(open(sys.argv[1])) or []:
              d=str(m.get('Destination') or '')
              if d in expected: seen[d]=(str(m.get('Source') or ''),bool(m.get('RW')))
          if any(seen.get(d)!=(s,False) for d,s in expected.items()): raise SystemExit(1)
          PY
          then emit MOUNT_BOUNDARY PASS; else emit MOUNT_BOUNDARY FAIL; fi

          startup_codes="$(docker logs --tail 300 "$id" 2>&1 | sed -nE 's/^Auth-mail worker failed to start: ([A-Z0-9_]{1,120})$/\1/p' | sort -u || true)"
          startup_count="$(grep -c . <<< "$startup_codes" || true)"
          if [[ -z "$startup_codes" ]]; then startup=NONE; elif [[ "$startup_count" == 1 ]]; then startup="$startup_codes"; else startup=MULTIPLE_SAFE_CODES; fi
          [[ "$startup" =~ ^[A-Z0-9_]{1,120}$ ]] || startup=INVALID_SAFE_CODE
          emit STARTUP_CODE "$startup"

          log_class=NONE
          logs="$(docker logs --tail 120 "$id" 2>&1 || true)"
          if grep -Eqi 'cannot find module|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND' <<< "$logs"; then log_class=MODULE_LOAD;
          elif grep -Eqi 'EACCES|permission denied' <<< "$logs"; then log_class=FILE_PERMISSION;
          elif grep -Eqi 'PrismaClientInitializationError|P1000|P1001|P1010' <<< "$logs"; then log_class=PRISMA_INIT;
          elif grep -Eqi 'SyntaxError|ERR_AMBIGUOUS_MODULE_SYNTAX|unexpected token' <<< "$logs"; then log_class=SCRIPT_PARSE;
          elif grep -Eqi 'Auth-mail worker failed to start:' <<< "$logs"; then log_class=SAFE_STARTUP_ERROR;
          elif [[ -n "$logs" ]]; then log_class=OTHER_REDACTED; fi
          emit RUNTIME_LOG_CLASS "$log_class"

          health_exit="$(docker inspect --format '{{if .State.Health}}{{with index .State.Health.Log (sub (len .State.Health.Log) 1)}}{{.ExitCode}}{{end}}{{else}}999{{end}}' "$id" 2>/dev/null || true)"
          [[ "$health_exit" =~ ^[0-9]+$ ]] || health_exit=999
          emit HEALTHCHECK_LAST_EXIT "$health_exit"

          live=NOT_RUNNING; ready=NOT_RUNNING
          if [[ "$state" == running ]]; then
            if docker exec "$id" /nodejs/bin/node -e "fetch('http://127.0.0.1:3003/live',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then live=PASS; else live=FAIL; fi
            if docker exec "$id" /nodejs/bin/node -e "fetch('http://127.0.0.1:3003/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then ready=PASS; else ready=FAIL; fi
          fi
          emit LIVE_PROBE "$live"; emit READY_PROBE "$ready"
          finish PASS NONE 0
          REMOTE
          rc=$?
          set -e
          sed -nE '/^(AUTH_MAIL_CURRENT_STATE_V2|ERROR_CODE|ALL_WORKER_CARDINALITY|SUBJECT_WORKER_CARDINALITY|WORKER_REVISION|WORKER_STATE|WORKER_HEALTH|WORKER_RESTARTED|WORKER_EXIT_CODE|WORKER_OOM|COMMAND_BOUNDARY|ENV_BOUNDARY|MOUNT_BOUNDARY|STARTUP_CODE|RUNTIME_LOG_CLASS|HEALTHCHECK_LAST_EXIT|LIVE_PROBE|READY_PROBE|PRODUCTION_MUTATION)=[A-Za-z0-9_.:-]{1,160}$/p' "$raw" > "$clean"
          rm -f "$raw"
          cat "$clean"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r k v; do
            case "$k" in
              AUTH_MAIL_CURRENT_STATE_V2|ERROR_CODE|ALL_WORKER_CARDINALITY|SUBJECT_WORKER_CARDINALITY|WORKER_REVISION|WORKER_STATE|WORKER_HEALTH|WORKER_RESTARTED|WORKER_EXIT_CODE|WORKER_OOM|COMMAND_BOUNDARY|ENV_BOUNDARY|MOUNT_BOUNDARY|STARTUP_CODE|RUNTIME_LOG_CLASS|HEALTHCHECK_LAST_EXIT|LIVE_PROBE|READY_PROBE|PRODUCTION_MUTATION)
                echo "${k,,}=$v" >> "$GITHUB_OUTPUT";;
            esac
          done < "$clean"
          rm -f "$clean"

      - name: Publish sanitized current-worker evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.diagnostic.outputs.auth_mail_current_state_v2 }}
          ERROR_CODE: ${{ steps.diagnostic.outputs.error_code }}
          ALL_COUNT: ${{ steps.diagnostic.outputs.all_worker_cardinality }}
          SUBJECT_COUNT: ${{ steps.diagnostic.outputs.subject_worker_cardinality }}
          REVISION: ${{ steps.diagnostic.outputs.worker_revision }}
          STATE: ${{ steps.diagnostic.outputs.worker_state }}
          HEALTH: ${{ steps.diagnostic.outputs.worker_health }}
          RESTARTED: ${{ steps.diagnostic.outputs.worker_restarted }}
          EXIT_CODE: ${{ steps.diagnostic.outputs.worker_exit_code }}
          OOM: ${{ steps.diagnostic.outputs.worker_oom }}
          COMMAND: ${{ steps.diagnostic.outputs.command_boundary }}
          ENV_BOUNDARY: ${{ steps.diagnostic.outputs.env_boundary }}
          MOUNT_BOUNDARY: ${{ steps.diagnostic.outputs.mount_boundary }}
          STARTUP_CODE: ${{ steps.diagnostic.outputs.startup_code }}
          LOG_CLASS: ${{ steps.diagnostic.outputs.runtime_log_class }}
          HEALTH_EXIT: ${{ steps.diagnostic.outputs.healthcheck_last_exit }}
          LIVE_PROBE: ${{ steps.diagnostic.outputs.live_probe }}
          READY_PROBE: ${{ steps.diagnostic.outputs.ready_probe }}
          MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP auth-mail current worker state v2'; echo
            echo "- result / safe error: \`${RESULT:-unknown} / ${ERROR_CODE:-unknown}\`"
            echo "- all workers / subject workers / revision: \`${ALL_COUNT:-unknown} / ${SUBJECT_COUNT:-unknown} / ${REVISION:-unknown}\`"
            echo "- state / health / restarted: \`${STATE:-unknown} / ${HEALTH:-unknown} / ${RESTARTED:-unknown}\`"
            echo "- exit / OOM / healthcheck exit: \`${EXIT_CODE:-unknown} / ${OOM:-unknown} / ${HEALTH_EXIT:-unknown}\`"
            echo "- command / env / mounts: \`${COMMAND:-unknown} / ${ENV_BOUNDARY:-unknown} / ${MOUNT_BOUNDARY:-unknown}\`"
            echo "- startup code / runtime log class: \`${STARTUP_CODE:-unknown} / ${LOG_CLASS:-unknown}\`"
            echo "- live / ready probes: \`${LIVE_PROBE:-unknown} / ${READY_PROBE:-unknown}\`"
            echo "- production mutation: \`${MUTATION:-unknown}\`"
            echo '- no raw logs, container IDs, URLs, credentials, recipients, tokens or database values are published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Enforce read-only diagnostic completion
        shell: bash
        env:
          REMOTE_RC: ${{ steps.diagnostic.outputs.rc }}
          MUTATION: ${{ steps.diagnostic.outputs.production_mutation }}
        run: |
          set -euo pipefail
          [[ "${REMOTE_RC:-1}" == 0 ]]
          [[ "$MUTATION" == NONE ]]
