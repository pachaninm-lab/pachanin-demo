name: One-shot Fix Qwen YAML Indent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/one-shot-fix-qwen-yaml-indent.yml'

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/qwen-live-ui-approved-branding-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Publish indentation-corrected ordinary blob
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_BASE: 72d1a6ad7c277615430a58a9d357485ae34f6f5c
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git merge-base HEAD origin/main)" == "$EXPECTED_BASE" ]]
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_BASE" ]]
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tai-restricted-qwen-reg-ru-activation.yml')
          text = source.read_text(encoding='utf-8')
          bad = '\n    if (await dialog.locator(\'[data-pc-public-assistant-ai-mark="true"]:visible\').count() !== 1) throw new Error(\'ai_mark_count_invalid\');'
          good = '\n              if (await dialog.locator(\'[data-pc-public-assistant-ai-mark="true"]:visible\').count() !== 1) throw new Error(\'ai_mark_count_invalid\');'
          if text.count(bad) != 1:
              raise SystemExit(f'unexpected bad-indent count: {text.count(bad)}')
          text = text.replace(bad, good, 1)
          staging = Path('docs/platform-v7/autopilot/artifacts/tai-restricted-qwen-reg-ru-activation-yaml-fixed.yml')
          staging.parent.mkdir(parents=True, exist_ok=True)
          staging.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/platform-v7/autopilot/artifacts/tai-restricted-qwen-reg-ru-activation-yaml-fixed.yml
          git commit -m 'OPS: stage indentation-corrected Qwen workflow blob'
          git push origin "HEAD:$HEAD_BRANCH"
