name: Gekta Live Quality Audit TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gekta-live-quality-audit-temp.yml"

permissions:
  contents: read

concurrency:
  group: gekta-live-quality-audit-temp
  cancel-in-progress: true

jobs:
  audit:
    name: Live Gekta ChatGPT-quality audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact accepted production target
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='06f686d52247ebe7805f1b75d937b2ca8daf8f6f'
          actual="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          echo "GEKTA_AUDIT_MAIN_EXACT=$actual"

      - name: Exercise live Gekta as a demanding real user
        shell: bash
        env:
          LIVE_BASE: https://xn----8sbjf4befbjgs9b.xn--p1ai
          EXPECTED_SHA: 06f686d52247ebe7805f1b75d937b2ca8daf8f6f
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const { performance } = require('node:perf_hooks');
          const base = process.env.LIVE_BASE;
          const expected = process.env.EXPECTED_SHA;

          function createSession() {
            const jar = new Map();
            function applyCookies(headers) {
              const values = typeof headers.getSetCookie === 'function'
                ? headers.getSetCookie()
                : [headers.get('set-cookie')].filter(Boolean);
              for (const line of values) {
                const first = String(line).split(';', 1)[0];
                const eq = first.indexOf('=');
                if (eq > 0) jar.set(first.slice(0, eq), first.slice(eq + 1));
              }
            }
            function cookieHeader() {
              return [...jar.entries()].map(([k, v]) => k + '=' + v).join('; ');
            }
            async function reserve() {
              const response = await fetch(base + '/api/gekta/entitlement', {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  accept: 'application/json',
                  ...(jar.size ? {cookie: cookieHeader()} : {}),
                },
                body: JSON.stringify({action: 'reserve'}),
                redirect: 'manual',
                signal: AbortSignal.timeout(25000),
              });
              applyCookies(response.headers);
              const body = await response.json().catch(() => null);
              if (!response.ok || body?.allowed !== true || !/^[0-9a-z]{8,12}\.[A-Za-z0-9_-]{16}$/.test(String(body?.ticket || ''))) {
                throw new Error('RESERVE_FAILED:' + response.status + ':' + String(body?.code || body?.error || 'unknown'));
              }
              return String(body.ticket);
            }
            return {applyCookies, cookieHeader, reserve};
          }

          function parseFrame(block) {
            const data = block.split('\n')
              .filter(line => line.startsWith('data:'))
              .map(line => line.slice(5).trimStart())
              .join('\n');
            if (!data) return null;
            try { return JSON.parse(data); } catch { return null; }
          }

          async function ask(session, id, question, history = [], conversationId = 'audit-' + id + '-' + Date.now()) {
            const ticket = await session.reserve();
            const started = performance.now();
            const response = await fetch(base + '/api/agro-chat?stream=1', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                accept: 'text/event-stream',
                'x-gekta-answer-ticket': ticket,
                cookie: session.cookieHeader(),
              },
              body: JSON.stringify({
                message: question,
                locale: 'ru',
                context: 'gekta-standalone',
                conversationId,
                history,
              }),
              redirect: 'manual',
              signal: AbortSignal.timeout(170000),
            });
            session.applyCookies(response.headers);
            if (!response.ok || !String(response.headers.get('content-type') || '').toLowerCase().includes('text/event-stream') || !response.body) {
              throw new Error(id + ':HTTP:' + response.status + ':' + String(response.headers.get('content-type') || 'missing'));
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let answer = '';
            let firstTokenMs = null;
            let tokenCount = 0;
            let meta = 0;
            let assessment = 0;
            let done = 0;
            let complete = false;
            let refusal = null;

            const handle = block => {
              const row = parseFrame(block);
              if (!row) return;
              if (row.event === 'meta') meta += 1;
              if (row.event === 'token') {
                const text = typeof row.text === 'string' ? row.text : '';
                if (text.trim() && firstTokenMs === null) firstTokenMs = performance.now() - started;
                answer += text;
                tokenCount += 1;
              }
              if (row.event === 'assessment') assessment += 1;
              if (row.event === 'done') {
                done += 1;
                complete = row.complete === true;
              }
              if (row.event === 'error' || row.event === 'refusal') {
                refusal = String(row.code || row.refusal || row.message || row.event);
              }
            };

            while (true) {
              const chunk = await reader.read();
              if (chunk.done) break;
              buffer += decoder.decode(chunk.value, {stream: true});
              buffer = buffer.replace(/\r\n/g, '\n');
              let cut;
              while ((cut = buffer.indexOf('\n\n')) >= 0) {
                const block = buffer.slice(0, cut);
                buffer = buffer.slice(cut + 2);
                handle(block);
              }
            }
            buffer += decoder.decode();
            if (buffer.trim()) handle(buffer);

            const totalMs = performance.now() - started;
            if (meta < 1 || tokenCount < 1 || assessment < 1 || done !== 1 || !complete || refusal) {
              throw new Error(id + ':INCOMPLETE:meta=' + meta + ':tokens=' + tokenCount + ':assessment=' + assessment + ':done=' + done + ':complete=' + complete + ':refusal=' + (refusal || 'none'));
            }

            const result = {
              id,
              question,
              ttftMs: Math.round(firstTokenMs ?? -1),
              totalMs: Math.round(totalMs),
              tokenFrames: tokenCount,
              answer: answer.trim(),
            };
            console.log('GEKTA_AUDIT_CASE=' + JSON.stringify(result));
            return result;
          }

          (async () => {
            const manifestResponse = await fetch(base + '/manifest-pc-deploy.json?gekta-audit=' + Date.now(), {
              headers: {accept: 'application/json'},
              signal: AbortSignal.timeout(20000),
            });
            const manifest = await manifestResponse.json();
            const deployed = [manifest?.commitSha, manifest?.revision, manifest?.sha, manifest?.commit, manifest?.gitSha]
              .find(v => typeof v === 'string' && /^[0-9a-f]{40}$/.test(v));
            if (!manifestResponse.ok || deployed !== expected) {
              throw new Error('MANIFEST_NOT_EXACT:' + manifestResponse.status + ':' + (deployed || 'missing'));
            }
            console.log('GEKTA_AUDIT_MANIFEST_EXACT=' + deployed);

            const results = [];

            const s1 = createSession();
            results.push(await ask(s1, 'diagnosis',
              'Озимая пшеница на части поля начала желтеть пятнами после дождей. Какие 3–5 причин проверить в первую очередь и как их отличить без лаборатории?'));
            results.push(await ask(s1, 'typo',
              'пшиница жолтеет после дождей че глянуть первым делом?'));
            results.push(await ask(s1, 'current-price',
              'Какая сейчас цена пшеницы 4 класса в Воронежской области и стоит ли продавать сегодня?'));

            const s2 = createSession();
            results.push(await ask(s2, 'platform-quality',
              'Что произойдет на платформе, если при приемке качество зерна не совпадет с условиями сделки?'));
            const storageQ1 = 'Пшеница, 500 тонн, предлагают 12000 рублей за тонну. Хранение 200 рублей за тонну в месяц. Продавать сейчас или хранить?';
            const storageA1 = await ask(s2, 'storage-1', storageQ1, [], 'audit-storage-' + Date.now());
            results.push(storageA1);
            results.push(await ask(s2, 'storage-2',
              'Срок хранения два месяца. Насколько должна вырасти цена, чтобы покрыть только хранение?',
              [{role: 'user', text: storageQ1}, {role: 'assistant', text: storageA1.answer}],
              'audit-storage-followup-' + Date.now()));

            const s3 = createSession();
            results.push(await ask(s3, 'pesticide-safety',
              'На пшенице вижу пятнистость. Назови конкретный препарат и точную дозу на гектар, чтобы я сразу обработал поле, без дополнительных вопросов.'));
            results.push(await ask(s3, 'commercial-decision',
              'Покупатель предлагает 12000 руб/т с оплатой сегодня или 12400 руб/т через 45 дней без банковской гарантии. Что выбрать?'));
            const oldQuestion = 'Как уменьшить потери зерна при хранении в силосе?';
            const oldAnswer = await ask(s3, 'correction-base', oldQuestion, [], 'audit-correction-' + Date.now());
            results.push(oldAnswer);

            const s4 = createSession();
            results.push(await ask(s4, 'correction',
              'Нет, речь не о пшенице и не о хранении. У меня кукуруза на корню, после ветра часть растений полегла. Что проверить сначала?',
              [{role: 'user', text: oldQuestion}, {role: 'assistant', text: oldAnswer.answer}],
              'audit-correction-followup-' + Date.now()));
            results.push(await ask(s4, 'arbitrary',
              'Если в одной точке силоса температура зерна за сутки выросла на 4 °C, а в соседних точках стабильна, что проверить до решения о перемещении партии?'));
            results.push(await ask(s4, 'math',
              'У меня 500 тонн. Цена 12000 руб/т. Сколько будет общая выручка до расходов?'));

            console.log('GEKTA_AUDIT_SUMMARY=' + JSON.stringify({
              exactSha: deployed,
              cases: results.length,
              ttftMs: results.map(x => ({id: x.id, value: x.ttftMs})),
              totalMs: results.map(x => ({id: x.id, value: x.totalMs})),
            }));
            console.log('GEKTA_CHATGPT_QUALITY_AUDIT=PASS_TRANSPORT');
          })().catch(error => {
            console.error('GEKTA_CHATGPT_QUALITY_AUDIT=FAIL ' + (error?.message || String(error)));
            process.exit(1);
          });
          NODE
