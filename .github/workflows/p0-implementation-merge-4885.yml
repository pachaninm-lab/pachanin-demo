name: PC-CROP bounded implementation merge 4885

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/p0-implementation-merge-4885.yml'

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: p0-implementation-merge-4885
  cancel-in-progress: false

jobs:
  validate-and-merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/merge-implementation-4885'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_PR: '4885'
      TARGET_HEAD: 'fix/p0-employee-guest-mfa-4884'
      SCOPE_FILE: 'docs/platform-v7/autopilot/scopes/p0-employee-guest-mfa-4884.json'
      P1: 'apps/api/src/common/types/request-user.ts'
      P2: 'apps/api/src/modules/auth/employee-mfa-policy.spec.ts'
      P3: 'docs/security/SESSION_POLICY.md'
    steps:
      - name: Wait for immutable scope, verify source and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          for attempt in $(seq 1 90); do
            pr="$(gh api "repos/$repo/pulls/$TARGET_PR")"
            if [[ "$(jq -r '.merged' <<<"$pr")" == 'true' ]]; then
              echo 'implementation PR already merged'
              exit 0
            fi
            [[ "$(jq -r '.state' <<<"$pr")" == 'open' ]]
            [[ "$(jq -r '.draft' <<<"$pr")" == 'false' ]]
            [[ "$(jq -r '.head.ref' <<<"$pr")" == "$TARGET_HEAD" ]]
            [[ "$(jq -r '.base.ref' <<<"$pr")" == 'main' ]]

            main_sha="$(gh api "repos/$repo/commits/main" --jq '.sha')"
            if gh api "repos/$repo/contents/$SCOPE_FILE?ref=$main_sha" >/tmp/scope-response.json 2>/dev/null; then
              encoded="$(jq -r '.content' /tmp/scope-response.json)"
              scope="$(printf '%s' "$encoded" | tr -d '\n' | base64 -d)"
              jq -e \
                --arg branch "$TARGET_HEAD" \
                --arg p1 "$P1" --arg p2 "$P2" --arg p3 "$P3" \
                '.branch == $branch
                 and .status == "active"
                 and .issue == 4884
                 and (.allowedPaths | sort) == ([$p1,$p2,$p3] | sort)
                 and .boundaries.productionMutation == false
                 and .boundaries.databaseMutation == false
                 and .boundaries.databaseSchemaChange == false
                 and .boundaries.rlsChange == false
                 and .boundaries.tenantMappingChange == false
                 and .boundaries.roleMappingChange == false
                 and .boundaries.mailChange == false
                 and .boundaries.rateLimitChange == false
                 and .boundaries.tokenContractChange == false
                 and .boundaries.workflowChange == false
                 and .boundaries.acceptanceRunnerChange == false
                 and .boundaries.mfaWeakening == false
                 and .boundaries.guestFirstLoginMfaRequired == true
                 and .boundaries.guestIdleTimeoutTierPreserved == true
                 and .newRecurringCostRub == 0' <<<"$scope" >/dev/null
              break
            fi
            echo "waiting for immutable scope on main: attempt=$attempt main=$main_sha"
            sleep 20
          done

          [[ -s /tmp/scope-response.json ]] || { echo 'P0_IMMUTABLE_SCOPE_MISSING' >&2; exit 1; }

          pr="$(gh api "repos/$repo/pulls/$TARGET_PR")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          mapfile -t files < <(gh api --paginate "repos/$repo/pulls/$TARGET_PR/files?per_page=100" --jq '.[].filename' | sort)
          expected=("$P1" "$P2" "$P3")
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${#files[@]}" -eq 3 ]]
          for i in "${!expected[@]}"; do [[ "${files[$i]}" == "${expected[$i]}" ]]; done

          gh repo clone "$repo" target -- --filter=blob:none
          cd target
          git fetch origin "$head_sha"
          git checkout --detach "$head_sha"
          git diff --check "origin/main...$head_sha"

          grep -q 'GUEST' "$P1"
          grep -q 'GUEST' "$P2"
          grep -Eiq 'MFA|многофактор' "$P3"

          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @pc/api exec prisma generate
          pnpm --filter @pc/api exec jest \
            src/modules/auth/employee-mfa-policy.spec.ts \
            src/modules/auth/session-idle-timeout.spec.ts \
            --runInBand
          pnpm --filter @pc/api exec tsc -p tsconfig.json --noEmit

          printf '%s' "$head_sha" >/tmp/verified-head-sha

      - name: Merge only after the exact verified head has all checks green
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          verified_head="$(cat /tmp/verified-head-sha 2>/dev/null || true)"
          if [[ -z "$verified_head" ]]; then
            pr="$(gh api "repos/$repo/pulls/$TARGET_PR")"
            [[ "$(jq -r '.merged' <<<"$pr")" == 'true' ]]
            exit 0
          fi

          for attempt in $(seq 1 100); do
            pr="$(gh api "repos/$repo/pulls/$TARGET_PR")"
            if [[ "$(jq -r '.merged' <<<"$pr")" == 'true' ]]; then
              echo 'implementation PR already merged'
              exit 0
            fi
            [[ "$(jq -r '.head.sha' <<<"$pr")" == "$verified_head" ]]
            [[ "$(jq -r '.head.ref' <<<"$pr")" == "$TARGET_HEAD" ]]
            [[ "$(jq -r '.base.ref' <<<"$pr")" == 'main' ]]

            checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$repo/commits/$verified_head/check-runs?per_page=100")"
            check_total="$(jq '.total_count' <<<"$checks")"
            pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks")"
            bad="$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$checks")"
            guard_ok="$(jq '[.check_runs[] | select(.name == "Standard platform-v7 guard validations" and .status == "completed" and .conclusion == "success")] | length' <<<"$checks")"

            status="$(gh api "repos/$repo/commits/$verified_head/status")"
            status_total="$(jq '.total_count' <<<"$status")"
            status_state="$(jq -r '.state' <<<"$status")"
            status_ok=0
            if (( status_total == 0 )) || [[ "$status_state" == 'success' ]]; then status_ok=1; fi

            if (( check_total >= 15 && pending == 0 && bad == 0 && guard_ok >= 1 && status_ok == 1 )); then
              mergeable="$(jq -r '.mergeable' <<<"$pr")"
              [[ "$mergeable" == 'true' ]]
              result="$(gh api --method PUT "repos/$repo/pulls/$TARGET_PR/merge" \
                -f merge_method='squash' \
                -f commit_title='fix(auth): require first-login MFA for employee GUEST (#4885)')"
              [[ "$(jq -r '.merged' <<<"$result")" == 'true' ]]
              echo 'implementation PR merged'
              exit 0
            fi

            if (( bad > 0 )); then
              jq -r '.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) | "FAILED_CHECK=" + .name + ":" + (.conclusion // "null")' <<<"$checks"
              exit 1
            fi

            echo "waiting for implementation checks: attempt=$attempt total=$check_total pending=$pending guard_ok=$guard_ok status=$status_state"
            sleep 20
          done

          echo 'P0_IMPLEMENTATION_CHECK_TIMEOUT' >&2
          exit 1
