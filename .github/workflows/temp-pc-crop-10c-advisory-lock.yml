name: TEMP PC-CROP-10C advisory lock patch

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-pc-crop-10c-advisory-lock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
      - name: Use query authority for advisory lock and remove launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts"); s=p.read_text(); old="await tx.$executeRaw(Prisma.sql`SELECT pg_advisory_xact_lock"; new="await tx.$queryRaw(Prisma.sql`SELECT pg_advisory_xact_lock"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new))'
          rm .github/workflows/temp-pc-crop-10c-advisory-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/regulatory-integration/fgis-grain/fgis-grain-tenant-read.repository.ts .github/workflows/temp-pc-crop-10c-advisory-lock.yml
          git commit -m 'PC-CROP-10C: acquire audit chain lock through query path'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
