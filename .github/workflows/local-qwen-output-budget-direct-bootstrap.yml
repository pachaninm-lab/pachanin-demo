name: Local Qwen Output Budget Direct Bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'fix/local-qwen-output-budget-768-20260910' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPAIR_BRANCH: fix/local-qwen-output-budget-768-20260910
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/local-qwen-output-budget-768-20260910
          fetch-depth: 0

      - name: Apply bounded provider repair and remove bootstraps
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          live_main="$(git rev-parse origin/main)"
          base_parent="$(git rev-parse HEAD^)"
          [[ "$base_parent" == "$live_main" ]] || {
            echo "main drifted before provider repair: branch-parent=$base_parent live-main=$live_main" >&2
            exit 10
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/local-qwen-independent-review.yml')
          text = path.read_text(encoding='utf-8')
          had_final_newline = text.endswith('\n')

          if text.count(r'ws ::= [ \t\n\r]?') != 1:
              raise SystemExit('Expected admitted bounded whitespace grammar exactly once.')
          exported_hash = r'''printf 'prompt_bundle_sha256=%s\n' "$prompt_bundle_sha256" >> "$GITHUB_OUTPUT"'''
          if text.count(exported_hash) != 1:
              raise SystemExit('Expected admitted prompt-bundle hash export exactly once.')
          if text.count('--n-predict 128') != 1:
              raise SystemExit('Expected server-side --n-predict 128 exactly once.')

          old_budget = 'n_predict:1536'
          new_budget = 'n_predict:768'
          if text.count(old_budget) != 1:
              raise SystemExit(f'Expected exactly one request budget {old_budget}, found {text.count(old_budget)}')
          if new_budget in text:
              raise SystemExit('Target request budget already present; refusing duplicate repair.')
          text = text.replace(old_budget, new_budget, 1)
          if old_budget in text or text.count(new_budget) != 1:
              raise SystemExit('Qwen request budget replacement is not exact.')

          path.write_text(text if had_final_newline else text.rstrip('\n'), encoding='utf-8')
          PY

          test -f .github/workflows/local-qwen-provider-contract-v2-bootstrap.yml
          git rm .github/workflows/local-qwen-provider-contract-v2-bootstrap.yml
          git rm .github/workflows/local-qwen-output-budget-direct-bootstrap.yml
          git diff --check

          mapfile -t changed < <({ git diff --name-only; git diff --cached --name-only; } | sort -u)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = ".github/workflows/local-qwen-independent-review.yml"
          test "${changed[1]}" = ".github/workflows/local-qwen-output-budget-direct-bootstrap.yml"
          test "${changed[2]}" = ".github/workflows/local-qwen-provider-contract-v2-bootstrap.yml"

          grep -F 'ws ::= [ \t\n\r]?' .github/workflows/local-qwen-independent-review.yml
          grep -F 'n_predict:768' .github/workflows/local-qwen-independent-review.yml
          ! grep -F 'n_predict:1536' .github/workflows/local-qwen-independent-review.yml
          grep -F -- '--n-predict 128' .github/workflows/local-qwen-independent-review.yml
          grep -F 'prompt_bundle_sha256=%s' .github/workflows/local-qwen-independent-review.yml | grep -F 'GITHUB_OUTPUT'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): bound Local Qwen completion budget at 768 tokens'
          git push origin "HEAD:refs/heads/$REPAIR_BRANCH"
