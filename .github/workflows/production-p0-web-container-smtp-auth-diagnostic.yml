name: Production P0 Web Container SMTP Auth Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-web-container-smtp-auth-diagnostic.yml'
      - 'scripts/check-production-p0-web-container-smtp-auth-diagnostic.mjs'
      - 'docs/platform-v7/autopilot/scopes/production-p0-web-container-smtp-auth-diagnostic-3785.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-p0-web-container-smtp-auth-diagnostic
  cancel-in-progress: false

jobs:
  contract:
    name: Validate Web-container SMTP auth diagnostic contract
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 3072 &&
        github.event.comment.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner &&
        github.event.comment.body == '/production p0-web-container-smtp-auth-diagnose current-main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-production-p0-web-container-smtp-auth-diagnostic.mjs

  diagnose:
    name: Probe SMTP from active REG.RU Web container without sending mail
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3072 &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.comment.body == '/production p0-web-container-smtp-auth-diagnose current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
      LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bind to exact current main
        id: main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main >/dev/null
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$main_sha" ]]
          [[ "$(git rev-parse origin/main)" == "$main_sha" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          printf 'sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned REG.RU SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          key="$HOME/.ssh/id_pc_prod"
          known="$HOME/.ssh/known_hosts"
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${PC_PROD_HOST:-}")"
          user="$(trim "${PC_PROD_SSH_USER:-}")"
          port="$(trim "${PC_PROD_SSH_PORT:-22}")"
          expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ -n "$host" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          mapfile -t dns_ipv4 < <(getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u)
          (( ${#dns_ipv4[@]} >= 1 ))
          printf '%s\n' "${dns_ipv4[@]}" | grep -Fxq "$host"

          validate_key(){
            local source="$1" pub
            tr -d '\r' < "$source" > "$key"
            chmod 600 "$key"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$key" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"
            return 1
          }
          try_slot "${PC_PROD_SSH_KEY:-}" || try_slot "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_slot "${VPS_SSH_KEY:-}"

          scan="$(mktemp)"; match="$(mktemp)"
          ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan"
          [[ -s "$scan" ]]
          while IFS= read -r line; do
            got="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
            [[ "$got" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
          done < "$scan"
          rm -f "$scan"
          [[ "$(grep -c . "$match" || true)" == 1 ]]
          mv "$match" "$known"
          chmod 600 "$known"
          printf 'host=%s\nuser=%s\nport=%s\n' "$host" "$user" "$port" >> "$GITHUB_OUTPUT"

      - name: Probe active Web-container SMTP through AUTH and MAIL FROM only
        id: probe
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -Eeuo pipefail
          result="$RUNNER_TEMP/web-container-smtp-result.txt"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$USER@$HOST" 'bash -s' > "$result" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(id -u)" -eq 0 ]]
          command -v docker >/dev/null
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          if (( ${#web_ids[@]} == 0 )); then
            printf 'WEB_CONTAINER_CARDINALITY=ZERO\nWEB_SMTP_CONFIG=UNKNOWN\nWEB_SMTP_RESULT=WEB_CONTAINER_ZERO\nWEB_SMTP_LAST_STAGE=DISCOVERY\nWEB_SMTP_TOTAL_BUCKET=UNKNOWN\nWEB_SMTP_RESPONSE_5000_BUDGET=UNKNOWN\nWEB_SMTP_APP_7500_BUDGET=UNKNOWN\nWEB_SMTP_MAIL_SENT=NO\nWEB_SMTP_RECIPIENT_COMMAND=NO\nWEB_SMTP_DATA_COMMAND=NO\nPRODUCTION_MUTATION=NONE\n'
            exit 0
          fi
          if (( ${#web_ids[@]} != 1 )); then
            printf 'WEB_CONTAINER_CARDINALITY=MULTIPLE\nWEB_SMTP_CONFIG=UNKNOWN\nWEB_SMTP_RESULT=WEB_CONTAINER_MULTIPLE\nWEB_SMTP_LAST_STAGE=DISCOVERY\nWEB_SMTP_TOTAL_BUCKET=UNKNOWN\nWEB_SMTP_RESPONSE_5000_BUDGET=UNKNOWN\nWEB_SMTP_APP_7500_BUDGET=UNKNOWN\nWEB_SMTP_MAIL_SENT=NO\nWEB_SMTP_RECIPIENT_COMMAND=NO\nWEB_SMTP_DATA_COMMAND=NO\nPRODUCTION_MUTATION=NONE\n'
            exit 0
          fi
          web_id="${web_ids[0]}"
          docker exec -i "$web_id" /nodejs/bin/node --input-type=commonjs - 2>/dev/null <<'NODE'
          const tls = require('node:tls');

          const started = Date.now();
          let stageStarted = started;
          let lastStage = 'CONFIG';
          let responseBudgetExceeded = false;
          let appBudgetExceeded = false;
          let completed = false;
          let buffer = '';
          let waiter = null;

          const clean = (value) => {
            const v = String(value || '').trim();
            return v && !/[\r\n\0]/.test(v) ? v : '';
          };
          const host = clean(process.env.PC_SMTP_HOST);
          const user = clean(process.env.PC_SMTP_USER);
          const pass = clean(process.env.PC_SMTP_PASS);
          const from = clean(process.env.PC_MAIL_FROM) || user;
          const port = Number(clean(process.env.PC_SMTP_PORT) || '465');

          function bucket(ms) {
            if (!Number.isFinite(ms)) return 'UNKNOWN';
            if (ms <= 2500) return 'LE_2500';
            if (ms <= 5000) return 'LE_5000';
            if (ms <= 7500) return 'LE_7500';
            if (ms <= 10000) return 'LE_10000';
            return 'GT_10000';
          }
          function emit(config, result) {
            if (completed) return;
            completed = true;
            const elapsed = Date.now() - started;
            if (elapsed > 7500) appBudgetExceeded = true;
            console.log(`WEB_CONTAINER_CARDINALITY=ONE`);
            console.log(`WEB_SMTP_CONFIG=${config}`);
            console.log(`WEB_SMTP_RESULT=${result}`);
            console.log(`WEB_SMTP_LAST_STAGE=${lastStage}`);
            console.log(`WEB_SMTP_TOTAL_BUCKET=${bucket(elapsed)}`);
            console.log(`WEB_SMTP_RESPONSE_5000_BUDGET=${responseBudgetExceeded ? 'FAIL' : 'PASS'}`);
            console.log(`WEB_SMTP_APP_7500_BUDGET=${appBudgetExceeded ? 'FAIL' : 'PASS'}`);
            console.log('WEB_SMTP_MAIL_SENT=NO');
            console.log('WEB_SMTP_RECIPIENT_COMMAND=NO');
            console.log('WEB_SMTP_DATA_COMMAND=NO');
            console.log('PRODUCTION_MUTATION=NONE');
          }

          if (!host || !user || !pass || !from || !Number.isInteger(port)) {
            emit('MISSING', 'CONFIG_MISSING');
            process.exit(0);
          }
          if (host !== 'mail.hosting.reg.ru' || port !== 465) {
            emit('AUTHORITY_MISMATCH', 'CONFIG_AUTHORITY_MISMATCH');
            process.exit(0);
          }

          const socket = tls.connect({ host, port, servername: host, rejectUnauthorized: true });
          const totalTimer = setTimeout(() => {
            try { socket.destroy(); } catch {}
            emit('VALID', 'DIAGNOSTIC_TIMEOUT');
          }, 15000);
          const appTimer = setTimeout(() => { appBudgetExceeded = true; }, 7500);

          function finish(config, result) {
            clearTimeout(totalTimer);
            clearTimeout(appTimer);
            try { socket.destroy(); } catch {}
            emit(config, result);
          }
          function code(response) { return Number(String(response).slice(0, 3)); }
          function drain() {
            if (!waiter) return;
            const lines = buffer.split(/\r?\n/);
            const complete = lines.findIndex((line) => /^\d{3} /.test(line));
            if (complete < 0) return;
            const response = lines.slice(0, complete + 1).join('\n');
            buffer = lines.slice(complete + 1).join('\n');
            const resolve = waiter;
            waiter = null;
            const stageElapsed = Date.now() - stageStarted;
            if (stageElapsed > 5000) responseBudgetExceeded = true;
            resolve(response);
          }
          function nextResponse(stageName) {
            lastStage = stageName;
            stageStarted = Date.now();
            return new Promise((resolve) => { waiter = resolve; drain(); });
          }
          async function command(value, allowed, stageName) {
            socket.write(`${value}\r\n`);
            const response = await nextResponse(stageName);
            const responseCode = code(response);
            if (!allowed.includes(responseCode)) {
              const error = new Error('SMTP_REJECTED');
              error.smtpCode = responseCode;
              throw error;
            }
          }

          socket.on('data', (chunk) => { buffer += chunk.toString('utf8'); drain(); });
          socket.on('timeout', () => finish('VALID', 'SOCKET_TIMEOUT'));
          socket.on('error', () => finish('VALID', lastStage === 'CONNECT' ? 'NETWORK_OR_TLS_ERROR' : 'SOCKET_ERROR'));
          socket.setTimeout(12000);
          socket.once('secureConnect', async () => {
            try {
              const greeting = await nextResponse('GREETING');
              if (code(greeting) !== 220) throw new Error('GREETING_REJECTED');
              await command('EHLO transparent-price.local', [250], 'EHLO');
              const auth = Buffer.from(`\u0000${user}\u0000${pass}`, 'utf8').toString('base64');
              await command(`AUTH PLAIN ${auth}`, [235], 'AUTH_PLAIN');
              await command(`MAIL FROM:<${from}>`, [250], 'MAIL_FROM');
              await command('RSET', [250], 'RSET');
              lastStage = 'COMPLETE';
              socket.write('QUIT\r\n');
              clearTimeout(totalTimer);
              clearTimeout(appTimer);
              socket.end();
              emit('VALID', 'PASS_AUTH_AND_MAIL_FROM');
            } catch (error) {
              const smtpCode = Number(error && error.smtpCode || 0);
              if (lastStage === 'AUTH_PLAIN' && [534, 535].includes(smtpCode)) return finish('VALID', 'AUTH_REJECTED');
              if (lastStage === 'MAIL_FROM' && smtpCode >= 500) return finish('VALID', 'MAIL_FROM_REJECTED');
              return finish('VALID', 'PROTOCOL_REJECTED');
            }
          });
          NODE
          REMOTE

          cat "$result"
          for required in WEB_CONTAINER_CARDINALITY WEB_SMTP_CONFIG WEB_SMTP_RESULT WEB_SMTP_LAST_STAGE WEB_SMTP_TOTAL_BUCKET WEB_SMTP_RESPONSE_5000_BUDGET WEB_SMTP_APP_7500_BUDGET WEB_SMTP_MAIL_SENT WEB_SMTP_RECIPIENT_COMMAND WEB_SMTP_DATA_COMMAND PRODUCTION_MUTATION; do
            count="$(grep -Ec "^${required}=[A-Z0-9_]+$" "$result" || true)"
            [[ "$count" == 1 ]]
            value="$(grep -E "^${required}=[A-Z0-9_]+$" "$result" | cut -d= -f2-)"
            printf '%s=%s\n' "${required,,}" "$value" >> "$GITHUB_OUTPUT"
          done
          grep -Fxq 'WEB_SMTP_MAIL_SENT=NO' "$result"
          grep -Fxq 'WEB_SMTP_RECIPIENT_COMMAND=NO' "$result"
          grep -Fxq 'WEB_SMTP_DATA_COMMAND=NO' "$result"
          grep -Fxq 'PRODUCTION_MUTATION=NONE' "$result"

      - name: Recheck exact main after production read
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main >/dev/null
          [[ "$(git rev-parse origin/main)" == '${{ steps.main.outputs.sha }}' ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == '${{ steps.main.outputs.sha }}' ]]
          [[ -z "$(git status --porcelain=v1)" ]]

      - name: Publish bounded SMTP classification
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment 3072 --repo "$GITHUB_REPOSITORY" --body "## Production P0 Web-container SMTP auth diagnostic

          - exact diagnostic main: \`${{ steps.main.outputs.sha }}\`
          - Web container cardinality: \`${{ steps.probe.outputs.web_container_cardinality }}\`
          - SMTP config class: \`${{ steps.probe.outputs.web_smtp_config }}\`
          - result: \`${{ steps.probe.outputs.web_smtp_result }}\`
          - last protocol stage: \`${{ steps.probe.outputs.web_smtp_last_stage }}\`
          - total latency bucket: \`${{ steps.probe.outputs.web_smtp_total_bucket }}\`
          - current 5s response budget: \`${{ steps.probe.outputs.web_smtp_response_5000_budget }}\`
          - current 7.5s total SMTP budget: \`${{ steps.probe.outputs.web_smtp_app_7500_budget }}\`
          - authenticated SMTP command executed: \`YES / AUTH PLAIN only\`
          - envelope sender probe: \`MAIL FROM then RSET\`
          - recipient command: \`${{ steps.probe.outputs.web_smtp_recipient_command }}\`
          - DATA command: \`${{ steps.probe.outputs.web_smtp_data_command }}\`
          - mail sent: \`${{ steps.probe.outputs.web_smtp_mail_sent }}\`
          - production mutation: \`${{ steps.probe.outputs.production_mutation }}\`
          - credentials / email identity / raw env / raw SMTP response: \`NOT_PUBLISHED\`
          - new recurring cost: \`0 RUB\`" >/dev/null

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"
