name: Temporary P0 registration durable key correction

on:
  push:
    branches:
      - fix/p0-registration-decision-durable-outbox-4858
    paths:
      - '.github/workflows/tmp-p0-registration-durable-key-fix.yml'

permissions:
  contents: write

concurrency:
  group: tmp-p0-registration-durable-key-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository_owner == 'pachaninm-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/p0-registration-decision-durable-outbox-4858
          fetch-depth: 0
          persist-credentials: true

      - name: Replace only the organization-admin decision key implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path('apps/web/app/platform-v7/profile/team/OrganizationTeamAdminClient.tsx')
          source = target.read_text()

          old_helper = """async function stableJoinDecisionKey(
            applicationId: string,
            version: string,
            decision: 'APPROVE' | 'REJECT',
          ) {
            const bytes = new TextEncoder().encode(`${applicationId}\u001f${version}\u001f${decision}`);
            const digest = await globalThis.crypto.subtle.digest('SHA-256', bytes);
            const marker = Array.from(new Uint8Array(digest))
              .slice(0, 16)
              .map((value) => value.toString(16).padStart(2, '0'))
              .join('');
            return `organization-join:${marker}:${decision.toLowerCase()}`;
          }
          """
          new_helper = """function stableJoinDecisionKey(
            applicationId: string,
            version: string,
            decision: 'APPROVE' | 'REJECT',
          ) {
            const key = `organization-join:${applicationId}:${version}:${decision.toLowerCase()}`;
            if (key.length < 16 || key.length > 128 || /[\\r\\n]/u.test(key)) {
              throw new Error('join_request_idempotency_key_invalid');
            }
            return key;
          }
          """
          if source.count(old_helper) != 1:
              raise SystemExit('P0_STABLE_JOIN_DECISION_HELPER_ANCHOR_INVALID')
          source = source.replace(old_helper, new_helper, 1)

          old_call = """      const idempotencyKey = await stableJoinDecisionKey(applicationId, application.version, decision);
                const response = await fetch(`/api/auth/organization-join-requests/${encodeURIComponent(applicationId)}/decision`, {
                  method: 'POST',
                  headers: applyCsrfHeader({ 'Content-Type': 'application/json', 'idempotency-key': idempotencyKey }),
          """
          new_call = """      const idempotencyKey = stableJoinDecisionKey(applicationId, application.version, decision);
                const correlationId = globalThis.crypto.randomUUID();
                const response = await fetch(`/api/auth/organization-join-requests/${encodeURIComponent(applicationId)}/decision`, {
                  method: 'POST',
                  headers: applyCsrfHeader({
                    'Content-Type': 'application/json',
                    'idempotency-key': idempotencyKey,
                    'x-correlation-id': correlationId,
                  }),
          """
          if source.count(old_call) != 1:
              raise SystemExit('P0_STABLE_JOIN_DECISION_CALL_ANCHOR_INVALID')
          source = source.replace(old_call, new_call, 1)

          if "globalThis.crypto.subtle.digest('SHA-256'" in source:
              raise SystemExit('P0_ORGANIZATION_ADMIN_EXTRA_WEBCRYPTO_REMAINS')
          if source.count("const correlationId = globalThis.crypto.randomUUID();") != 1:
              raise SystemExit('P0_ORGANIZATION_ADMIN_CORRELATION_CARDINALITY_INVALID')
          target.write_text(source)
          PY
          git diff --check
          git diff --exit-code -- docs/security/cryptographic-inventory.json

      - name: Commit bounded source correction and remove this temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- .github/workflows/tmp-p0-registration-durable-key-fix.yml
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort -u)
          [[ "${#changed[@]}" == '1' ]]
          [[ "${changed[0]}" == 'apps/web/app/platform-v7/profile/team/OrganizationTeamAdminClient.tsx' ]]
          git config user.name 'pachaninm-lab'
          git config user.email 'pachaninm@gmail.com'
          git add -- apps/web/app/platform-v7/profile/team/OrganizationTeamAdminClient.tsx
          git commit -m 'fix(pc-crop): preserve stable retry key without new crypto surface'
          git push origin HEAD:fix/p0-registration-decision-durable-outbox-4858
