name: Production Auth-Mail DB Principal Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-auth-mail-db-principal-repair.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-auth-mail-db-principal-repair
  cancel-in-progress: false

env:
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  DEFAULT_HOST: 195.19.12.120
  TARGET_ISSUE_NUMBER: '3785'
  SUBJECT_PRODUCTION_SHA: 033964e2e553c595482b774784cf808815eccbc7
  REPAIR_COMMAND: /production p0-auth-mail-db-principal-repair 033964e2e553c595482b774784cf808815eccbc7
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

jobs:
  contract:
    name: Validate bounded DB-principal repair contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate workflow safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-auth-mail-db-principal-repair.yml')
          text = path.read_text(encoding='utf-8')
          required = [
              'SUBJECT_PRODUCTION_SHA: 033964e2e553c595482b774784cf808815eccbc7',
              'REPAIR_COMMAND: /production p0-auth-mail-db-principal-repair 033964e2e553c595482b774784cf808815eccbc7',
              'git diff --quiet "$SUBJECT_PRODUCTION_SHA..$diagnostic_main_sha" --',
              'AUTH_MAIL_PRISMACLIENTINITIALIZATIONERROR',
              'pg_authid',
              '"$provision_script" rotate-db',
              '--force-recreate "$worker_service"',
              'PASSWORD_RESET_REPLAYED NO',
              'API_RESTARTED NO',
              'WEB_RESTARTED NO',
              'ROLLBACK_COMPLETE',
              'NEW_RECURRING_COST_RUB 0',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('missing repair invariant: ' + ' | '.join(missing))
          forbidden = [
              'rotate-smtp',
              'rotate-key',
              'docker rm -f',
              'PASSWORD_RESET_REPLAYED YES',
              'API_RESTARTED YES',
              'WEB_RESTARTED YES',
          ]
          repair_marker = '\n  repair:\n'
          if repair_marker not in text:
              raise SystemExit('repair job missing')
          operational_text = text.split(repair_marker, 1)[1]
          bad = [marker for marker in forbidden if marker in operational_text]
          if bad:
              raise SystemExit('forbidden repair surface: ' + ' | '.join(bad))
          PY

  repair:
    name: Rotate only auth-mail DB credential and recreate only worker
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3785 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/production p0-auth-mail-db-principal-repair 033964e2e553c595482b774784cf808815eccbc7' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind repair authority and immutable production subject
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          diagnostic_main_sha="$(git rev-parse origin/main)"
          [[ "$diagnostic_main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$diagnostic_main_sha" ]]
          [[ "$SUBJECT_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SUBJECT_PRODUCTION_SHA}^{commit}"
          git merge-base --is-ancestor "$SUBJECT_PRODUCTION_SHA" "$diagnostic_main_sha"
          git diff --quiet "$SUBJECT_PRODUCTION_SHA..$diagnostic_main_sha" -- \
            scripts/provision-production-auth-mail-runtime.sh \
            scripts/production-auth-mail-outbox-cutover-core.sh \
            .github/workflows/production-auth-mail-outbox-cutover.yml \
            apps/api/src/auth-mail-worker.ts \
            apps/api/prisma/migrations/20260812010000_p0_industrial_auth_mail_outbox/migration.sql
          echo "diagnostic_main_sha=$diagnostic_main_sha" >> "$GITHUB_OUTPUT"
          echo "subject_sha=$SUBJECT_PRODUCTION_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo 'AUTH_MAIL_DB_REPAIR=FAIL_CANONICAL_VPS'; exit 10; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || exit 11
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 12
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || exit 13
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || exit 14

          scan="$(mktemp)"; match="$(mktemp)"; pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; exit 15; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; docker compose version >/dev/null; python3 --version >/dev/null; echo SSH_AUTH_OK' \
            | grep -Fxq SSH_AUTH_OK
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Copy immutable DB-credential rotation asset
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/provision-production-auth-mail-runtime.sh \
            "$SSH_USER_SECRET@$HOST:/tmp/pc-auth-mail-db-repair-${GITHUB_RUN_ID}.sh"

      - name: Repair DB principal credential with exact rollback
        id: repair
        shell: bash
        env:
          SUBJECT_SHA: ${{ steps.target.outputs.subject_sha }}
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          raw="$(mktemp)"; clean="$(mktemp)"
          set +e
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "bash -s -- '$SUBJECT_SHA' '/tmp/pc-auth-mail-db-repair-${GITHUB_RUN_ID}.sh'" > "$raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          subject_sha="$1"
          provision_script="$2"
          worker_service='auth-mail-worker'
          authority_dir='/var/lib/pc-secret-authority'
          db_authority="$authority_dir/auth-mail-database-url"
          repair_success=0
          mutation_started=0
          error_code='UNKNOWN'
          rollback_attempted=0
          rollback_complete=0
          precondition_startup_code='UNKNOWN'
          worker_ready='FAIL'
          worker_revision='UNKNOWN'
          already_ready=0
          tmp_root="$(mktemp -d /tmp/pc-auth-mail-db-repair.XXXXXX)"
          old_db_file="$tmp_root/database-url.before"
          role_hash_file="$tmp_root/rolpassword.before"
          provision_log="$tmp_root/provision.log"
          restore_sql="$tmp_root/restore.sql"
          compose_cfg="$tmp_root/compose.json"

          emit(){ printf '%s=%s\n' "$1" "$2"; }
          abort(){ error_code="$1"; exit "${2:-1}"; }
          cleanup(){ rm -rf -- "$tmp_root"; }

          restore_previous_state(){
            local rc=0
            rollback_attempted=1
            python3 - "$role_hash_file" > "$restore_sql" <<'PY' || return 1
          import sys
          raw=open(sys.argv[1],encoding='utf-8').read().strip()
          if raw == '__NULL__':
              print('ALTER ROLE pc_auth_mail_runtime PASSWORD NULL;')
          elif raw.startswith('SCRAM-SHA-256$') or (raw.startswith('md5') and len(raw)==35):
              print("ALTER ROLE pc_auth_mail_runtime PASSWORD '%s';" % raw.replace("'", "''"))
          else:
              raise SystemExit(1)
          PY
            docker exec -i "$pg_id" psql -X -q -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$postgres_db" < "$restore_sql" >/dev/null 2>&1 || rc=1
            install -m 0600 -o 0 -g 0 "$old_db_file" "$db_authority" || rc=1
            "$provision_script" bootstrap >/dev/null 2>&1 || rc=1
            "${dc[@]}" up -d --no-deps --pull never --force-recreate "$worker_service" >/dev/null 2>&1 || rc=1
            if (( rc == 0 )); then rollback_complete=1; fi
            return "$rc"
          }

          on_exit(){
            local rc=$?
            trap - EXIT
            if (( repair_success == 1 )); then cleanup; exit 0; fi
            if (( mutation_started == 1 )); then restore_previous_state || true; fi
            emit AUTH_MAIL_DB_PRINCIPAL_REPAIR FAIL
            emit ERROR_CODE "$error_code"
            emit PRECONDITION_STARTUP_CODE "$precondition_startup_code"
            emit WORKER_REVISION "$worker_revision"
            emit DATABASE_CREDENTIAL_ROTATED "$([[ "$mutation_started" == 1 ]] && echo YES || echo NO)"
            emit WORKER_READY "$worker_ready"
            emit ROLLBACK_ATTEMPTED "$rollback_attempted"
            emit ROLLBACK_COMPLETE "$rollback_complete"
            emit API_RESTARTED NO
            emit WEB_RESTARTED NO
            emit PASSWORD_RESET_REPLAYED NO
            if (( mutation_started == 0 )); then emit PRODUCTION_MUTATION NONE; elif (( rollback_complete == 1 )); then emit PRODUCTION_MUTATION ROLLED_BACK; else emit PRODUCTION_MUTATION PARTIAL_REPAIR_REQUIRES_HUMAN; fi
            emit NEW_RECURRING_COST_RUB 0
            cleanup
            exit "$rc"
          }
          trap on_exit EXIT

          [[ "$(id -u)" -eq 0 ]] || abort ROOT_REQUIRED 20
          command -v docker >/dev/null 2>&1 || abort DOCKER_REQUIRED 21
          command -v python3 >/dev/null 2>&1 || abort PYTHON_REQUIRED 22
          [[ "$subject_sha" =~ ^[0-9a-f]{40}$ ]] || abort SUBJECT_SHA_INVALID 23
          [[ -f "$provision_script" && ! -L "$provision_script" ]] || abort PROVISION_SCRIPT_INVALID 24
          chmod 0700 "$provision_script"

          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web')
          (( ${#web_ids[@]} == 1 )) || abort WEB_AUTHORITY_CARDINALITY 25
          web_id="${web_ids[0]}"
          project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"
          [[ -n "$project" ]] || abort COMPOSE_PROJECT_MISSING 26

          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api')
          (( ${#api_ids[@]} == 1 )) || abort API_AUTHORITY_CARDINALITY 27
          api_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${api_ids[0]}")"
          web_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")"
          [[ "$api_revision" == "$subject_sha" && "$web_revision" == "$subject_sha" ]] || abort APP_REVISION_DRIFT 28

          subject_workers=()
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$candidate" 2>/dev/null || true)"
            [[ "$revision" == "$subject_sha" ]] && subject_workers+=("$candidate")
          done < <(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=$worker_service")
          (( ${#subject_workers[@]} == 1 )) || abort SUBJECT_WORKER_CARDINALITY_NOT_ONE 29
          worker_id="${subject_workers[0]}"
          worker_revision=PASS

          working_dir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$worker_id")"
          config_files="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$worker_id")"
          [[ "$working_dir" == /* && "$working_dir" != / && -d "$working_dir" && ! -L "$working_dir" && -n "$config_files" ]] || abort COMPOSE_AUTHORITY_INVALID 30
          working_dir="$(realpath -e -- "$working_dir")"
          dc=(docker compose --project-directory "$working_dir" --project-name "$project")
          IFS=',' read -r -a raw_files <<< "$config_files"
          compose_count=0
          for raw_file in "${raw_files[@]}"; do
            file="${raw_file#"${raw_file%%[![:space:]]*}"}"; file="${file%"${file##*[![:space:]]}"}"
            [[ -n "$file" ]] || continue
            [[ "$file" == /* ]] || file="$working_dir/$file"
            [[ -f "$file" && ! -L "$file" ]] || abort COMPOSE_FILE_INVALID 31
            file="$(realpath -e -- "$file")"
            [[ "$file" == "$working_dir"/* ]] || abort COMPOSE_FILE_OUTSIDE_AUTHORITY 32
            dc+=(-f "$file"); compose_count=$((compose_count+1))
          done
          (( compose_count >= 1 )) || abort COMPOSE_FILE_CARDINALITY 33
          "${dc[@]}" config --format json > "$compose_cfg"
          current_worker_image="$(docker inspect --format '{{.Config.Image}}' "$worker_id")"
          python3 - "$compose_cfg" "$current_worker_image" <<'PY' || abort COMPOSE_WORKER_CONTRACT_FAILED 34
          import json,sys
          cfg=json.load(open(sys.argv[1],encoding='utf-8'))
          service=(cfg.get('services') or {}).get('auth-mail-worker') or {}
          if str(service.get('image') or '') != sys.argv[2]: raise SystemExit(1)
          command=service.get('command') or []
          text=' '.join(command) if isinstance(command,list) else str(command)
          if 'dist/apps/api/src/auth-mail-worker.js' not in text: raise SystemExit(1)
          if not service.get('healthcheck'): raise SystemExit(1)
          PY

          state="$(docker inspect --format '{{.State.Status}}' "$worker_id" 2>/dev/null || true)"
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id" 2>/dev/null || true)"
          if [[ "$state" == running && "$health" == healthy ]] && docker exec "$worker_id" /nodejs/bin/node -e "fetch('http://127.0.0.1:3003/ready',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" >/dev/null 2>&1; then
            already_ready=1
            worker_ready=PASS
            repair_success=1
            trap - EXIT
            emit AUTH_MAIL_DB_PRINCIPAL_REPAIR PASS_ALREADY_READY
            emit ERROR_CODE NONE
            emit PRECONDITION_STARTUP_CODE NONE
            emit WORKER_REVISION PASS
            emit DATABASE_CREDENTIAL_ROTATED NO
            emit WORKER_READY PASS
            emit ROLLBACK_ATTEMPTED 0
            emit ROLLBACK_COMPLETE 0
            emit API_RESTARTED NO
            emit WEB_RESTARTED NO
            emit PASSWORD_RESET_REPLAYED NO
            emit PRODUCTION_MUTATION NONE
            emit NEW_RECURRING_COST_RUB 0
            cleanup
            exit 0
          fi

          startup_codes="$(docker logs --tail 300 "$worker_id" 2>&1 | sed -nE 's/^Auth-mail worker failed to start: ([A-Z0-9_]{1,120})$/\1/p' | sort -u || true)"
          startup_count="$(grep -c . <<< "$startup_codes" || true)"
          [[ "$startup_count" == 1 ]] || abort STARTUP_CODE_CARDINALITY 35
          precondition_startup_code="$startup_codes"
          [[ "$precondition_startup_code" == AUTH_MAIL_PRISMACLIENTINITIALIZATIONERROR ]] || abort STARTUP_CODE_NOT_DB_INITIALIZATION 36

          [[ -f "$db_authority" && ! -L "$db_authority" && "$(stat -c '%a:%u:%g' "$db_authority")" == '600:0:0' ]] || abort DB_AUTHORITY_INVALID 37
          install -m 0600 -o 0 -g 0 "$db_authority" "$old_db_file"

          mapfile -t pg_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" | while read -r id; do
            image="$(docker inspect --format '{{.Config.Image}}' "$id" 2>/dev/null || true)"
            service="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$id" 2>/dev/null || true)"
            if [[ "$image" == postgres:* || "$image" == */postgres:* || "$service" == postgres || "$service" == db || "$service" == database ]]; then printf '%s\n' "$id"; fi
          done)
          (( ${#pg_ids[@]} == 1 )) || abort POSTGRES_AUTHORITY_CARDINALITY 38
          pg_id="${pg_ids[0]}"
          postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$pg_id" | sed -n 's/^POSTGRES_USER=//p' | head -1)"
          postgres_db="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$pg_id" | sed -n 's/^POSTGRES_DB=//p' | head -1)"
          [[ -n "$postgres_user" ]] || postgres_user=postgres
          [[ -n "$postgres_db" ]] || postgres_db="$postgres_user"
          docker exec "$pg_id" psql -X -qAt -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$postgres_db" \
            -c "SELECT COALESCE(rolpassword, '__NULL__') FROM pg_authid WHERE rolname='pc_auth_mail_runtime';" > "$role_hash_file" 2>/dev/null \
            || abort ROLE_PASSWORD_SNAPSHOT_FAILED 39
          python3 - "$role_hash_file" <<'PY' || abort ROLE_PASSWORD_SNAPSHOT_INVALID 40
          import sys
          raw=open(sys.argv[1],encoding='utf-8').read().strip()
          if raw == '__NULL__': raise SystemExit(0)
          if raw.startswith('SCRAM-SHA-256$') and 40 <= len(raw) <= 512: raise SystemExit(0)
          if raw.startswith('md5') and len(raw)==35 and all(c in '0123456789abcdefABCDEF' for c in raw[3:]): raise SystemExit(0)
          raise SystemExit(1)
          PY

          mutation_started=1
          "$provision_script" rotate-db > "$provision_log" 2>&1 || abort DB_CREDENTIAL_ROTATION_FAILED 41
          grep -Fxq 'AUTH_MAIL_PROVISION=PASS' "$provision_log" || abort DB_CREDENTIAL_ROTATION_NOT_PROVEN 42
          grep -Fxq 'AUTH_MAIL_RUNTIME_RESTART_REQUIRED=1' "$provision_log" || abort WORKER_RESTART_REQUIREMENT_MISSING 43

          "${dc[@]}" up -d --no-deps --pull never --force-recreate "$worker_service" >/dev/null 2>&1 || abort WORKER_RECREATE_FAILED 44
          new_worker_id=''
          for attempt in $(seq 1 30); do
            new_worker_id="$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=$worker_service" | head -1)"
            if [[ -n "$new_worker_id" ]]; then
              new_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$new_worker_id" 2>/dev/null || true)"
              new_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$new_worker_id" 2>/dev/null || true)"
              if [[ "$new_revision" == "$subject_sha" && "$new_health" == healthy ]] && docker exec "$new_worker_id" /nodejs/bin/node -e "fetch('http://127.0.0.1:3003/ready',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" >/dev/null 2>&1; then
                worker_ready=PASS
                break
              fi
            fi
            sleep 4
          done
          [[ "$worker_ready" == PASS ]] || abort WORKER_STILL_NOT_READY 45
          [[ -n "$new_worker_id" ]] || abort WORKER_MISSING_AFTER_REPAIR 46
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$new_worker_id")" == "$subject_sha" ]] || abort WORKER_REVISION_DRIFT_AFTER_REPAIR 47

          repair_success=1
          trap - EXIT
          emit AUTH_MAIL_DB_PRINCIPAL_REPAIR PASS
          emit ERROR_CODE NONE
          emit PRECONDITION_STARTUP_CODE "$precondition_startup_code"
          emit WORKER_REVISION PASS
          emit DATABASE_CREDENTIAL_ROTATED YES
          emit WORKER_READY PASS
          emit ROLLBACK_ATTEMPTED 0
          emit ROLLBACK_COMPLETE 0
          emit API_RESTARTED NO
          emit WEB_RESTARTED NO
          emit PASSWORD_RESET_REPLAYED NO
          emit PRODUCTION_MUTATION DB_CREDENTIAL_ROTATION_AND_WORKER_RECREATE
          emit NEW_RECURRING_COST_RUB 0
          cleanup
          REMOTE
          remote_rc=$?
          set -e

          sed -nE '/^(AUTH_MAIL_DB_PRINCIPAL_REPAIR|ERROR_CODE|PRECONDITION_STARTUP_CODE|WORKER_REVISION|DATABASE_CREDENTIAL_ROTATED|WORKER_READY|ROLLBACK_ATTEMPTED|ROLLBACK_COMPLETE|API_RESTARTED|WEB_RESTARTED|PASSWORD_RESET_REPLAYED|PRODUCTION_MUTATION|NEW_RECURRING_COST_RUB)=[A-Za-z0-9_.:-]{1,180}$/p' "$raw" > "$clean"
          rm -f "$raw"
          cat "$clean"
          echo "rc=$remote_rc" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r key value; do
            case "$key" in
              AUTH_MAIL_DB_PRINCIPAL_REPAIR|ERROR_CODE|PRECONDITION_STARTUP_CODE|WORKER_REVISION|DATABASE_CREDENTIAL_ROTATED|WORKER_READY|ROLLBACK_ATTEMPTED|ROLLBACK_COMPLETE|API_RESTARTED|WEB_RESTARTED|PASSWORD_RESET_REPLAYED|PRODUCTION_MUTATION|NEW_RECURRING_COST_RUB) echo "${key,,}=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < "$clean"
          rm -f "$clean"

      - name: Publish bounded repair evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ steps.target.outputs.subject_sha }}
          REMOTE_RC: ${{ steps.repair.outputs.rc }}
          REPAIR: ${{ steps.repair.outputs.auth_mail_db_principal_repair }}
          ERROR_CODE: ${{ steps.repair.outputs.error_code }}
          PRECONDITION_STARTUP_CODE: ${{ steps.repair.outputs.precondition_startup_code }}
          WORKER_REVISION: ${{ steps.repair.outputs.worker_revision }}
          DATABASE_CREDENTIAL_ROTATED: ${{ steps.repair.outputs.database_credential_rotated }}
          WORKER_READY: ${{ steps.repair.outputs.worker_ready }}
          ROLLBACK_ATTEMPTED: ${{ steps.repair.outputs.rollback_attempted }}
          ROLLBACK_COMPLETE: ${{ steps.repair.outputs.rollback_complete }}
          API_RESTARTED: ${{ steps.repair.outputs.api_restarted }}
          WEB_RESTARTED: ${{ steps.repair.outputs.web_restarted }}
          PASSWORD_RESET_REPLAYED: ${{ steps.repair.outputs.password_reset_replayed }}
          PRODUCTION_MUTATION: ${{ steps.repair.outputs.production_mutation }}
          NEW_RECURRING_COST_RUB: ${{ steps.repair.outputs.new_recurring_cost_rub }}
        run: |
          set -euo pipefail
          record="$(mktemp)"
          {
            echo '### PC-CROP auth-mail DB-principal bounded repair'
            echo
            echo "- production subject SHA: \`${SUBJECT_SHA:-unknown}\`"
            echo "- repair: \`${REPAIR:-unknown}\` (rc=\`${REMOTE_RC:-unknown}\`)"
            echo "- safe error code: \`${ERROR_CODE:-unknown}\`"
            echo "- precondition startup code: \`${PRECONDITION_STARTUP_CODE:-unknown}\`"
            echo "- worker revision / ready: \`${WORKER_REVISION:-unknown} / ${WORKER_READY:-unknown}\`"
            echo "- DB credential rotated: \`${DATABASE_CREDENTIAL_ROTATED:-unknown}\`"
            echo "- rollback attempted / complete: \`${ROLLBACK_ATTEMPTED:-unknown} / ${ROLLBACK_COMPLETE:-unknown}\`"
            echo "- API/Web restarted: \`${API_RESTARTED:-unknown} / ${WEB_RESTARTED:-unknown}\`"
            echo "- password reset replayed: \`${PASSWORD_RESET_REPLAYED:-unknown}\`"
            echo "- production mutation: \`${PRODUCTION_MUTATION:-unknown}\`"
            echo "- new recurring cost: \`${NEW_RECURRING_COST_RUB:-unknown} RUB\`"
            echo '- DB URL/password/hash, container IDs, raw logs, mail payloads and reviewer credentials are never published.'
          } > "$record"
          gh issue comment "$TARGET_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$record"
          rm -f "$record"

      - name: Cleanup bounded remote asset
        if: always()
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set +e
          [[ -n "${HOST:-}" && -n "${PORT:-}" ]] || exit 0
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "rm -f '/tmp/pc-auth-mail-db-repair-${GITHUB_RUN_ID}.sh'" >/dev/null 2>&1
          exit 0

      - name: Enforce bounded repair result
        shell: bash
        env:
          REMOTE_RC: ${{ steps.repair.outputs.rc }}
          REPAIR: ${{ steps.repair.outputs.auth_mail_db_principal_repair }}
          WORKER_READY: ${{ steps.repair.outputs.worker_ready }}
          API_RESTARTED: ${{ steps.repair.outputs.api_restarted }}
          WEB_RESTARTED: ${{ steps.repair.outputs.web_restarted }}
          PASSWORD_RESET_REPLAYED: ${{ steps.repair.outputs.password_reset_replayed }}
        run: |
          set -euo pipefail
          [[ "${REMOTE_RC:-1}" == 0 ]]
          [[ "$REPAIR" == PASS || "$REPAIR" == PASS_ALREADY_READY ]]
          [[ "$WORKER_READY" == PASS ]]
          [[ "$API_RESTARTED" == NO ]]
          [[ "$WEB_RESTARTED" == NO ]]
          [[ "$PASSWORD_RESET_REPLAYED" == NO ]]
