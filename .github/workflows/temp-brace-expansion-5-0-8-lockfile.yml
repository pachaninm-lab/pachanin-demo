name: Temporary brace-expansion production lock remediation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: temp-brace-expansion-production-lock
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ir-sec-transitive-runtime-remediation
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply exact production-scoped overrides
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          const overrides = p.pnpm && p.pnpm.overrides;
          if (!overrides) throw new Error('pnpm.overrides is missing');
          const oldSelector = 'brace-expansion@>=5.0.0 <5.0.7';
          if (overrides[oldSelector] !== '5.0.7') {
            throw new Error('unexpected existing brace-expansion 5.x override');
          }
          if (overrides['brace-expansion@<2.1.2'] !== '2.1.2') {
            throw new Error('unexpected dev-only brace-expansion compatibility override');
          }
          const next = {};
          for (const [key, value] of Object.entries(overrides)) {
            if (key === oldSelector) {
              next['brace-expansion@>=5.0.0 <5.0.8'] = '5.0.8';
              next['archiver@5.3.2>readdir-glob'] = '3.0.0';
            } else {
              next[key] = value;
            }
          }
          p.pnpm.overrides = next;
          fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Regenerate governed lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify exact production dependency graph
        run: |
          pnpm --filter @pc/web list --prod --depth 20 --json > /tmp/brace-production-graph.json
          node <<'NODE'
          const fs = require('fs');
          const roots = JSON.parse(fs.readFileSync('/tmp/brace-production-graph.json', 'utf8'));
          const versions = new Map();
          function add(name, version) {
            if (!name || !version) return;
            if (!versions.has(name)) versions.set(name, new Set());
            versions.get(name).add(version);
          }
          function walk(node, fallbackName) {
            if (!node || typeof node !== 'object') return;
            add(node.name || node.from || fallbackName, node.version);
            for (const [name, child] of Object.entries(node.dependencies || {})) {
              walk(child, name);
            }
            for (const [name, child] of Object.entries(node.devDependencies || {})) {
              walk(child, name);
            }
            for (const [name, child] of Object.entries(node.optionalDependencies || {})) {
              walk(child, name);
            }
          }
          for (const root of roots) walk(root);
          const exact = (name, expected) => {
            const actual = [...(versions.get(name) || [])].sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(name + ' versions ' + JSON.stringify(actual) + ' != ' + JSON.stringify(expected));
            }
          };
          console.log(Object.fromEntries([...versions].map(([name, values]) => [name, [...values].sort()]).filter(([name]) => ['brace-expansion', 'readdir-glob', 'minimatch'].includes(name))));
          exact('brace-expansion', ['5.0.8']);
          exact('readdir-glob', ['3.0.0']);
          exact('minimatch', ['10.2.5']);
          console.log('production dependency graph PASS');
          NODE

      - name: Verify production advisory gate
        run: pnpm audit --prod --audit-level high

      - name: Verify XLSX and archiver runtime contracts
        run: |
          pnpm --filter @pc/web exec node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const assert = require('assert');
          const ExcelJS = require('exceljs');
          const archiverEntry = require.resolve('archiver', { paths: [require.resolve('exceljs')] });
          const archiver = require(archiverEntry);
          const jszipEntry = require.resolve('jszip', { paths: [require.resolve('exceljs')] });
          const JSZip = require(jszipEntry);

          async function verifyXlsx() {
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet('probe');
            sheet.addRow(['ok', 42]);
            const buffer = await workbook.xlsx.writeBuffer();
            const loaded = new ExcelJS.Workbook();
            await loaded.xlsx.load(buffer);
            assert.equal(loaded.getWorksheet('probe').getCell('B1').value, 42);
          }

          async function verifyArchiveGlob() {
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), 'brace-archiver-'));
            try {
              fs.writeFileSync(path.join(directory, 'probe.txt'), 'ok');
              const outputPath = path.join(directory, 'probe.zip');
              const output = fs.createWriteStream(outputPath);
              const archive = archiver('zip');
              await new Promise((resolve, reject) => {
                output.on('close', resolve);
                output.on('error', reject);
                archive.on('error', reject);
                archive.pipe(output);
                archive.glob('*.txt', { cwd: directory });
                archive.finalize();
              });
              assert.ok(archive.pointer() > 0);
              const zip = await JSZip.loadAsync(fs.readFileSync(outputPath));
              assert.ok(zip.file('probe.txt'));
            } finally {
              fs.rmSync(directory, { recursive: true, force: true });
            }
          }

          (async () => {
            await verifyXlsx();
            await verifyArchiveGlob();
            console.log('XLSX and archiver runtime contracts PASS');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Remove temporary workflow and publish governed result
        run: |
          rm .github/workflows/temp-brace-expansion-5-0-8-lockfile.yml
          actual=$(git diff --name-only | sort | tr '\n' ' ')
          expected='.github/workflows/temp-brace-expansion-5-0-8-lockfile.yml package.json pnpm-lock.yaml '
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml .github/workflows/temp-brace-expansion-5-0-8-lockfile.yml
          git commit -m "fix(security): remediate brace-expansion production tree"
          git push origin HEAD:agent/ir-sec-transitive-runtime-remediation
