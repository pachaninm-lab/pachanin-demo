name: TEMP PC-CROP-10C schema materializer

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-pc-crop-10c-schema.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
      - name: Update Prisma schema and remove launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/api/prisma/schema.prisma')
          source = path.read_text()
          org_anchor = '  fgisGrainProviderAttestations     FgisGrainProviderAttestation[]\n'
          org_add = org_anchor + '  fgisGrainTenantReadAuthorizations FgisGrainTenantReadAuthorization[]\n  fgisGrainTenantReadAudits         FgisGrainTenantReadAudit[]\n'
          if 'fgisGrainTenantReadAuthorizations' not in source:
              if org_anchor not in source:
                  raise SystemExit('organization relation anchor missing')
              source = source.replace(org_anchor, org_add, 1)
          user_anchor = '  fgisGrainProviderAttestations     FgisGrainProviderAttestation[]\n'
          user_add = user_anchor + '''  fgisGrainTenantReadAuthorizationsCreated  FgisGrainTenantReadAuthorization[] @relation("FgisGrainTenantReadAuthorizationCreatedBy")
  fgisGrainTenantReadAuthorizationsUpdated  FgisGrainTenantReadAuthorization[] @relation("FgisGrainTenantReadAuthorizationUpdatedBy")
  fgisGrainTenantReadAuthorizationsAttested FgisGrainTenantReadAuthorization[] @relation("FgisGrainTenantReadAuthorizationAttestedBy")
  fgisGrainTenantReadAudits                  FgisGrainTenantReadAudit[]         @relation("FgisGrainTenantReadAuditActor")
'''
          user_section = source[source.index('model User {'):source.index('model UserOrg {')]
          if 'fgisGrainTenantReadAuthorizationsCreated' not in user_section:
              pos = source.index(user_anchor, source.index('model User {'))
              source = source[:pos] + user_add + source[pos + len(user_anchor):]
          models = r'''

model FgisGrainTenantReadAuthorization {
  id                           String   @id
  tenantId                     String
  organizationId               String
  configurationId              String
  configurationVersion         BigInt
  allowedOperations            String[]
  authorizationReference       String
  status                       String   @default("ACCESS_REQUIRED")
  validUntil                   DateTime @db.Timestamptz(6)
  reason                       String
  attestationEvidenceReference String?
  attestationValidUntil        DateTime? @db.Timestamptz(6)
  attestationJustification     String?
  attestedByUserId             String?
  version                      BigInt   @default(0)
  createdByUserId              String
  updatedByUserId              String
  createdAt                    DateTime @default(dbgenerated("clock_timestamp()")) @db.Timestamptz(6)
  updatedAt                    DateTime @default(dbgenerated("clock_timestamp()")) @db.Timestamptz(6)

  organization Organization                   @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_auth_org_fk")
  configuration FgisGrainProviderConfiguration @relation(fields: [configurationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_auth_config_fk")
  createdByUser User                           @relation("FgisGrainTenantReadAuthorizationCreatedBy", fields: [createdByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_auth_created_user_fk")
  updatedByUser User                           @relation("FgisGrainTenantReadAuthorizationUpdatedBy", fields: [updatedByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_auth_updated_user_fk")
  attestedByUser User?                         @relation("FgisGrainTenantReadAuthorizationAttestedBy", fields: [attestedByUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_auth_attested_user_fk")
  audits FgisGrainTenantReadAudit[]

  @@unique([tenantId, organizationId, configurationId], map: "fgis_grain_tenant_read_auth_config_key")
  @@index([tenantId, organizationId, status, validUntil], map: "fgis_grain_tenant_read_auth_status_idx")
  @@index([updatedAt(sort: Desc), id], map: "fgis_grain_tenant_read_auth_updated_idx")
  @@map("fgis_grain_tenant_read_authorizations")
}

model FgisGrainTenantReadAudit {
  id                String    @id
  tenantId          String
  organizationId    String
  authorizationId   String
  configurationId   String
  actorUserId       String
  actorRole         String
  operationCode     String
  correlationId     String
  idempotencyKey    String
  requestReference  String
  requestSha256     String    @db.Char(64)
  decision          String
  reasonCode        String
  providerRequestId String?
  responseReference String?
  responseSha256    String?   @db.Char(64)
  receivedAt        DateTime? @db.Timestamptz(6)
  hash              String    @db.Char(64)
  prevHash          String?   @db.Char(64)
  createdAt         DateTime  @default(dbgenerated("clock_timestamp()")) @db.Timestamptz(6)

  organization Organization                    @relation(fields: [organizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_audit_org_fk")
  authorization FgisGrainTenantReadAuthorization @relation(fields: [authorizationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_audit_auth_fk")
  configuration FgisGrainProviderConfiguration @relation(fields: [configurationId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_audit_config_fk")
  actorUser User                               @relation("FgisGrainTenantReadAuditActor", fields: [actorUserId], references: [id], onDelete: Restrict, onUpdate: Restrict, map: "fgis_grain_tenant_read_audit_user_fk")

  @@unique([tenantId, organizationId, idempotencyKey], map: "fgis_grain_tenant_read_audit_idempotency_key")
  @@index([authorizationId, createdAt(sort: Desc), id(sort: Desc)], map: "fgis_grain_tenant_read_audit_auth_idx")
  @@index([correlationId], map: "fgis_grain_tenant_read_audit_correlation_idx")
  @@index([tenantId, organizationId, decision, createdAt(sort: Desc)], map: "fgis_grain_tenant_read_audit_decision_idx")
  @@map("fgis_grain_tenant_read_audits")
}
'''
          if 'model FgisGrainTenantReadAuthorization {' not in source:
              source = source.rstrip() + models + '\n'
          config_anchor = '  attestations  FgisGrainProviderAttestation[]\n'
          config_add = config_anchor + '  tenantReadAuthorizations FgisGrainTenantReadAuthorization[]\n  tenantReadAudits FgisGrainTenantReadAudit[]\n'
          if 'tenantReadAuthorizations FgisGrainTenantReadAuthorization[]' not in source:
              config_pos = source.index(config_anchor, source.index('model FgisGrainProviderConfiguration {'))
              source = source[:config_pos] + config_add + source[config_pos + len(config_anchor):]
          path.write_text(source)
          PY
          rm .github/workflows/temp-pc-crop-10c-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/prisma/schema.prisma .github/workflows/temp-pc-crop-10c-schema.yml
          git commit -m 'PC-CROP-10C: bind Prisma tenant read authority'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
