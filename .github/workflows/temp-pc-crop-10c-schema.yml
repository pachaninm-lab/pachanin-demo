name: TEMP PC-CROP-10C schema materializer

on:
  push:
    branches:
      - agent/pc-crop-10c-tenant-authorized-read-adapter
    paths:
      - .github/workflows/temp-pc-crop-10c-schema.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-pc-crop-10c-schema.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-10c-tenant-authorized-read-adapter
          fetch-depth: 0
      - name: Update Prisma schema and remove launcher
        shell: bash
        env:
          USER_RELATIONS_B64: 
          MODELS_B64: 
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('apps/api/prisma/schema.prisma')
          source = path.read_text()
          org_anchor = '  fgisGrainProviderAttestations     FgisGrainProviderAttestation[]\n'
          org_relations = '  fgisGrainTenantReadAuthorizations FgisGrainTenantReadAuthorization[]\n  fgisGrainTenantReadAudits         FgisGrainTenantReadAudit[]\n'
          if 'fgisGrainTenantReadAuthorizations' not in source:
              source = source.replace(org_anchor, org_anchor + org_relations, 1)
          user_relations = base64.b64decode(os.environ['USER_RELATIONS_B64']).decode()
          user_section_start = source.index('model User {')
          user_section_end = source.index('model UserOrg {')
          if 'fgisGrainTenantReadAuthorizationsCreated' not in source[user_section_start:user_section_end]:
              position = source.index(org_anchor, user_section_start)
              source = source[:position] + org_anchor + user_relations + source[position + len(org_anchor):]
          config_anchor = '  attestations  FgisGrainProviderAttestation[]\n'
          config_relations = '  tenantReadAuthorizations FgisGrainTenantReadAuthorization[]\n  tenantReadAudits FgisGrainTenantReadAudit[]\n'
          if 'tenantReadAuthorizations FgisGrainTenantReadAuthorization[]' not in source:
              position = source.index(config_anchor, source.index('model FgisGrainProviderConfiguration {'))
              source = source[:position] + config_anchor + config_relations + source[position + len(config_anchor):]
          if 'model FgisGrainTenantReadAuthorization {' not in source:
              source = source.rstrip() + '\n' + base64.b64decode(os.environ['MODELS_B64']).decode() + '\n'
          path.write_text(source)
          PY
          rm .github/workflows/temp-pc-crop-10c-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/prisma/schema.prisma .github/workflows/temp-pc-crop-10c-schema.yml
          git commit -m 'PC-CROP-10C: bind Prisma tenant read authority'
          git push origin HEAD:agent/pc-crop-10c-tenant-authorized-read-adapter
