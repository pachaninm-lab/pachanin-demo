name: Workflow Syntax Guard

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-syntax.py'
      - '.github/workflows/workflow-syntax-guard.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check 'pyyaml>=6,<7'

      - name: Validate every workflow parses
        run: python3 scripts/check-workflow-syntax.py

      - name: Apply PR 3373 one-shot activation hardening
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3373
        shell: bash
        run: |
          set -Eeuo pipefail
          branch='ops/release-public-ai-qwen-3372'
          guard='.github/workflows/workflow-syntax-guard.yml'
          scope='docs/platform-v7/autopilot/scopes/release-public-ai-qwen-3372.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main "$branch"
          expected_head="$(git rev-parse "origin/$branch")"
          test "$(git rev-parse HEAD)" = "$expected_head"

          python3 scripts/release-public-ai-qwen-3372-patch.py
          python3 - "$scope" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding='utf-8'))
          data['allowedPaths'] = [
              item for item in data['allowedPaths']
              if item != '.github/workflows/workflow-syntax-guard.yml'
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git checkout origin/main -- "$guard"
          git add -A
          git diff --cached --check
          python3 scripts/check-workflow-syntax.py
          git commit -m 'fix(release): add fail-closed rollback and live UI acceptance'
          git fetch --no-tags origin main "$branch"
          test "$(git rev-parse "origin/$branch")" = "$expected_head"
          git push origin "HEAD:refs/heads/$branch"
