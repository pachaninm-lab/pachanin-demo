name: Workflow Syntax Guard

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-syntax.py'
      - '.github/workflows/workflow-syntax-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check 'pyyaml>=6,<7'

      - name: Validate every workflow parses
        run: python3 scripts/check-workflow-syntax.py

  one-shot-provider-anchor-repair:
    name: One-shot exact provider anchor repair
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 5380 && github.head_ref == 'fix/local-qwen-evidence-binding-20260913'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/local-qwen-evidence-binding-20260913
          fetch-depth: 2

      - name: Apply exact bounded repair and remove executor
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_parent='76d1df346d955e9cbe9cec7b782ed4c7e523fa70'
          expected_main='841c34aac10745924456d3b6ee1f9c5c06db6566'
          expected_target_blob='8a13960d5a6db5f74075505d1cc99391f25e777f'
          [[ "$(git rev-parse HEAD^)" == "$expected_parent" ]]
          [[ "$(git hash-object .github/workflows/local-qwen-independent-review.yml)" == "$expected_target_blob" ]]

          python3 scripts/one-shot-qwen-anchor-repair.py
          git diff --check
          node --test docs/platform-v7/autopilot/verify-pr-review-gate.test.mjs

          git fetch --no-tags --depth=1 origin "$expected_main"
          git checkout "$expected_main" -- .github/workflows/workflow-syntax-guard.yml
          git rm scripts/one-shot-qwen-anchor-repair.py

          git config user.name 'pachaninm-lab'
          git config user.email 'pachaninm@gmail.com'
          git add .github/workflows/local-qwen-independent-review.yml .github/workflows/workflow-syntax-guard.yml
          git diff --cached --check
          git commit -m 'fix(review): pin untrusted speculative evidence to cited line'
          git push origin HEAD:fix/local-qwen-evidence-binding-20260913
