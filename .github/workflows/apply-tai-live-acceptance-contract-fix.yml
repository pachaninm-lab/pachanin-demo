name: Apply TAI live acceptance contract fix

on:
  push:
    branches:
      - feat/tai-live-document-ocr-acceptance-20260802
    paths:
      - scripts/apply-tai-live-acceptance-contract-fix.py
      - .github/workflows/apply-tai-live-acceptance-contract-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tai-live-acceptance-contract-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tai-live-document-ocr-acceptance-20260802
          fetch-depth: 0
      - name: Capture exact authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main feat/tai-live-document-ocr-acceptance-20260802
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Apply and validate contract repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-tai-live-acceptance-contract-fix.py
          python3 -m py_compile scripts/create-live-public-assistant-attachment-fixtures.py
          node --check scripts/check-live-public-assistant-attachments.mjs
          grep -Fq "'AI_ASSISTANT_API_KEY'" scripts/check-live-public-assistant-attachments.mjs
          grep -Fq "'TAI_PUBLIC_GATEWAY_HMAC_SECRET'" scripts/check-live-public-assistant-attachments.mjs
          ! grep -Fq 'AI_ASSISTANT_API_KEY' .github/workflows/tai-live-document-ocr-acceptance.yml
          ! grep -Eq 'continue-on-error:[[:space:]]*true' .github/workflows/tai-live-document-ocr-acceptance.yml
          git diff --check
      - name: Publish clean reviewed branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main feat/tai-live-document-ocr-acceptance-20260802
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/feat/tai-live-document-ocr-acceptance-20260802)" = "$EXPECTED_HEAD"
          rm -f scripts/apply-tai-live-acceptance-contract-fix.py
          rm -f .github/workflows/apply-tai-live-acceptance-contract-fix.yml
          rm -f scripts/apply-tai-live-document-ocr-acceptance.py
          rm -f .github/workflows/apply-tai-live-document-ocr-acceptance.yml
          rm -f .github/workflows/apply-tai-live-document-ocr-acceptance-v2.yml
          git add -A
          git diff --cached --name-only | sort | tee /tmp/changed.txt
          if grep -Ev '^([.]github/workflows/apply-tai-live-(acceptance-contract-fix|document-ocr-acceptance(-v2)?)[.]yml|[.]github/workflows/docker-publish[.]yml|[.]github/workflows/tai-live-document-ocr-acceptance[.]yml|docs/platform-v7/autopilot/scopes/tai-live-document-ocr-acceptance-20260802[.]json|scripts/apply-tai-live-(acceptance-contract-fix|document-ocr-acceptance)[.]py|scripts/check-live-public-assistant-attachments[.]mjs|scripts/create-live-public-assistant-attachment-fixtures[.]py)$' /tmp/changed.txt; then
            echo 'Final diff exceeds registered live acceptance scope.' >&2
            exit 31
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(tai): separate source and live response safety checks'
          git push --force-with-lease="refs/heads/feat/tai-live-document-ocr-acceptance-20260802:${EXPECTED_HEAD}" origin HEAD:refs/heads/feat/tai-live-document-ocr-acceptance-20260802
