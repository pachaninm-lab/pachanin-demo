name: Role Eligibility Production Worker Exact-SHA

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/role-eligibility-production-worker.yml'
      - 'scripts/production-role-eligibility-worker.sh'
      - 'scripts/check-role-eligibility-static-acceptance.mjs'
      - '.github/workflows/role-eligibility-ci.yml'

permissions:
  contents: read
  issues: write

env:
  DEFAULT_HOST: 195.19.12.120
  RELEASE_ISSUE_NUMBER: 3072
  CONTINUATION_ISSUE_NUMBER: 4637
  COMMAND: /role-eligibility worker deploy current-main
  EVIDENCE_DIR: artifacts/role-eligibility-production-worker
  SSH_HOST_SECRET: ${{ secrets.PC_PROD_HOST }}
  SSH_USER_SECRET: ${{ secrets.PC_PROD_SSH_USER }}
  SSH_PORT_SECRET: ${{ secrets.PC_PROD_SSH_PORT }}
  SSH_KEY_PRIMARY: ${{ secrets.PC_PROD_SSH_KEY }}
  SSH_KEY_SECONDARY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
  SSH_KEY_FALLBACK: ${{ secrets.VPS_SSH_KEY }}
  SSH_HOST_FINGERPRINT_SECRET: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}

concurrency:
  group: role-eligibility-production-worker
  cancel-in-progress: false

jobs:
  contract:
    name: Validate production worker authority
    if: >-
      github.event_name == 'pull_request' ||
      ((github.event.issue.number == 3072 || github.event.issue.number == 4637) &&
       github.event.comment.body == '/role-eligibility worker deploy current-main' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.actor == github.repository_owner &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate worker release contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-role-eligibility-worker.sh
          node scripts/check-role-eligibility-static-acceptance.mjs

  deploy:
    name: Deploy and audit exact Role Eligibility shadow worker
    needs: contract
    if: >-
      github.event_name == 'issue_comment' &&
      (github.event.issue.number == 3072 || github.event.issue.number == 4637) &&
      github.event.comment.body == '/role-eligibility worker deploy current-main' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve immutable current-main target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          target="$(git rev-parse origin/main)"
          api_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target" == "$api_main" ]]
          [[ "$target" == "$GITHUB_SHA" ]] || { echo ROLE_ELIGIBILITY_RELEASE_MAIN_DRIFT >&2; exit 14; }
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$target" > "$EVIDENCE_DIR/target-sha.txt"

      - name: Resolve protected key and pinned VPS identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${SSH_HOST_SECRET:-$DEFAULT_HOST}")"
          user="$(trim "${SSH_USER_SECRET:-}")"
          port="$(trim "${SSH_PORT_SECRET:-22}")"
          expected="$(trim "${SSH_HOST_FINGERPRINT_SECRET:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]] || { echo ROLE_ELIGIBILITY_CANONICAL_VPS_MISMATCH >&2; exit 20; }
          [[ -n "$user" && "$user" == "${SSH_USER_SECRET:-}" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo ROLE_ELIGIBILITY_PRODUCTION_PRINCIPAL_INVALID >&2; exit 21; }
          [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)) || exit 22
          [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo ROLE_ELIGIBILITY_PINNED_HOST_FINGERPRINT_REQUIRED >&2; exit 23; }
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"

          validate_key(){
            local source="$1" target="$HOME/.ssh/id_pc_prod" pub
            tr -d '\r' < "$source" > "$target"
            chmod 600 "$target"
            grep -Eq '^(ssh-|ecdsa-|sk-)' "$target" && return 1
            pub="$(mktemp)"
            ssh-keygen -y -P '' -f "$target" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }
            ssh-keygen -lf "$pub" > "$EVIDENCE_DIR/ssh-key-fingerprint.txt"
            rm -f "$pub"
          }
          try_slot(){
            local raw="$1" a b c
            [[ -n "$raw" ]] || return 1
            a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"
            printf '%s\n' "$raw" > "$a"
            validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "${raw//\\n/$'\n'}" > "$b"
            validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }
            printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }
            rm -f "$a" "$b" "$c"; return 1
          }
          try_slot "${SSH_KEY_PRIMARY:-}" || try_slot "${SSH_KEY_SECONDARY:-}" || try_slot "${SSH_KEY_FALLBACK:-}" || {
            echo ROLE_ELIGIBILITY_NO_VALID_PROTECTED_PRIVATE_KEY >&2
            exit 24
          }

          scan="$(mktemp)"; match="$(mktemp)"; pinned_ready=0
          for attempt in 1 2 3; do
            : > "$scan"; : > "$match"
            ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true
            if [[ -s "$scan" ]]; then
              while IFS= read -r line; do
                fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"
                [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"
              done < "$scan"
              sort -u -o "$match" "$match"
              if [[ "$(grep -c . "$match" || true)" == 1 ]]; then pinned_ready=1; break; fi
            fi
            (( attempt == 3 )) || sleep "$attempt"
          done
          [[ "$pinned_ready" == 1 ]] || { rm -f "$scan" "$match"; echo ROLE_ELIGIBILITY_PINNED_HOST_KEY_MISMATCH >&2; exit 25; }
          mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$user@$host" \
            'set -euo pipefail; test "$(id -u)" -eq 0; docker version >/dev/null; echo ROLE_ELIGIBILITY_SSH_AUTH=PASS' \
            | tee "$EVIDENCE_DIR/ssh-auth.txt"
          grep -Fxq ROLE_ELIGIBILITY_SSH_AUTH=PASS "$EVIDENCE_DIR/ssh-auth.txt"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Recheck current-main immediately before production mutation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          [[ "$current_main" == "$TARGET_SHA" ]] || { echo ROLE_ELIGIBILITY_RELEASE_MAIN_DRIFT >&2; exit 30; }

      - name: Copy bounded worker deployment authority
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/id_pc_prod" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/production-role-eligibility-worker.sh \
            "$SSH_USER_SECRET@$HOST:/tmp/pc-role-eligibility-worker-${GITHUB_RUN_ID}.sh"

      - name: Deploy exact shadow worker and prove registration runtime unchanged
        id: worker
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
            "chmod 0700 '/tmp/pc-role-eligibility-worker-${GITHUB_RUN_ID}.sh'; '/tmp/pc-role-eligibility-worker-${GITHUB_RUN_ID}.sh' deploy '$TARGET_SHA'; '/tmp/pc-role-eligibility-worker-${GITHUB_RUN_ID}.sh' audit '$TARGET_SHA'" \
            > "$raw" 2>&1
          sed -E 's#(postgres(?:ql)?://)[^/@ ]+@#\1[REDACTED]@#g' "$raw" | tee "$EVIDENCE_DIR/worker.log"
          rm -f "$raw"
          grep -Fxq ROLE_ELIGIBILITY_WORKER=PASS "$EVIDENCE_DIR/worker.log"
          grep -Fxq "ROLE_ELIGIBILITY_TARGET_SHA=$TARGET_SHA" "$EVIDENCE_DIR/worker.log"
          grep -Fxq ROLE_ELIGIBILITY_SHADOW_MODE=true "$EVIDENCE_DIR/worker.log"
          grep -Fxq ROLE_ELIGIBILITY_ENFORCEMENT=false "$EVIDENCE_DIR/worker.log"
          grep -Fxq REGISTRATION_RUNTIME_UNCHANGED=PASS "$EVIDENCE_DIR/worker.log"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Publish bounded production evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          WORKER_STATUS: ${{ steps.worker.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$CONTINUATION_ISSUE_NUMBER"
          [[ "${{ github.event.issue.number }}" == "$RELEASE_ISSUE_NUMBER" || "${{ github.event.issue.number }}" == "$CONTINUATION_ISSUE_NUMBER" ]]
          [[ "${WORKER_STATUS:-}" == PASS ]] || exit 1
          cat > "$EVIDENCE_DIR/result.md" <<EOF
          ## Role Eligibility production worker run \`$GITHUB_RUN_ID\`

          - target SHA: \`$TARGET_SHA\`
          - worker: \`PASS\`
          - shadow mode: \`true\`
          - enforcement: \`false\`
          - registration runtime unchanged: \`PASS\`
          EOF
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$EVIDENCE_DIR/result.md"

      - name: Cleanup bounded credentials and remote asset
        if: always()
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOST:-}" && -n "${PORT:-}" && -f "$HOME/.ssh/id_pc_prod" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER_SECRET@$HOST" \
              "rm -f '/tmp/pc-role-eligibility-worker-${GITHUB_RUN_ID}.sh'" || true
          fi
          rm -f "$HOME/.ssh/id_pc_prod" "$HOME/.ssh/known_hosts"

      - name: Enforce worker production result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.worker.outputs.status }}' == PASS ]]

      - name: Upload worker release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-eligibility-production-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
