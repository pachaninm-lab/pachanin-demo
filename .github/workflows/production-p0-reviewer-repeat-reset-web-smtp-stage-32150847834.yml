name: Production P0 Reviewer Repeat Reset Web SMTP Stage 32150847834

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-p0-reviewer-repeat-reset-web-smtp-stage-32150847834.yml'

permissions:
  contents: read

concurrency:
  group: production-p0-reviewer-repeat-reset-web-smtp-stage-32150847834
  cancel-in-progress: false

env:
  DEFAULT_HOST: 195.19.12.120
  LIVE_DOMAIN: xn----8sbjf4befbjgs9b.xn--p1ai
  SUBJECT_SHA: d3968b730ff7d5c6f02cfebc5ffa02edfa5bef68

jobs:
  probe:
    name: Web pre-DATA SMTP stage classifier read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PC_PROD_HOST: ${{ secrets.PC_PROD_HOST }}
      PC_PROD_SSH_USER: ${{ secrets.PC_PROD_SSH_USER }}
      PC_PROD_SSH_PORT: ${{ secrets.PC_PROD_SSH_PORT }}
      PC_PROD_SSH_KEY: ${{ secrets.PC_PROD_SSH_KEY }}
      PC_PROD_SSH_PRIVATE_KEY: ${{ secrets.PC_PROD_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PC_PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PC_PROD_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate no-mail diagnostic contract
        shell: bash
        run: |
          set -Eeuo pipefail
          source='.github/workflows/production-p0-reviewer-repeat-reset-web-smtp-stage-32150847834.yml'
          grep -Fq 'MAIL_SENT=NO' "$source"
          grep -Fq "stage='RCPT_TO'" "$source"
          python3 - "$source" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          markers=[i for i,line in enumerate(lines) if line.strip() == '# OPERATIONAL_BEGIN']
          if len(markers)!=1: raise SystemExit(f'OPERATIONAL_MARKER_INVALID:{len(markers)}')
          operational='\n'.join(lines[markers[0]+1:])
          forbidden=['DATA\\r\\n','command(\'DATA\'','command("DATA"','sendAuthMailSmtp(','docker restart','docker compose up','docker rm ','INSERT INTO','UPDATE auth.','DELETE FROM','GRANT ','REVOKE ']
          bad=[x for x in forbidden if x in operational]
          if bad: raise SystemExit('FORBIDDEN_OPERATION:'+'|'.join(bad))
          PY

      # OPERATIONAL_BEGIN
      - name: Resolve pinned production SSH authority
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          trim(){ local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          host="$(trim "${PC_PROD_HOST:-$DEFAULT_HOST}")"; user="$(trim "${PC_PROD_SSH_USER:-}")"; port="$(trim "${PC_PROD_SSH_PORT:-22}")"; expected="$(trim "${PC_PROD_SSH_HOST_FINGERPRINT:-}")"
          [[ "$host" == "$DEFAULT_HOST" ]]; [[ -n "$user" && "$user" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]; [[ "$port" =~ ^[0-9]+$ ]] && ((port>=1 && port<=65535)); [[ "$expected" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          getent ahostsv4 "$LIVE_DOMAIN" | awk '{print $1}' | sort -u | grep -Fxq "$DEFAULT_HOST"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"; key="$HOME/.ssh/id_pc_prod"
          validate_key(){ local src="$1" pub; tr -d '\r' < "$src" > "$key"; chmod 600 "$key"; grep -Eq '^(ssh-|ecdsa-|sk-)' "$key" && return 1; pub="$(mktemp)"; ssh-keygen -y -P '' -f "$key" > "$pub" 2>/dev/null || { rm -f "$pub"; return 1; }; rm -f "$pub"; }
          try_slot(){ local raw="$1" a b c; [[ -n "$raw" ]] || return 1; a="$(mktemp)"; b="$(mktemp)"; c="$(mktemp)"; printf '%s\n' "$raw" > "$a"; validate_key "$a" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "${raw//\\n/$'\n'}" > "$b"; validate_key "$b" && { rm -f "$a" "$b" "$c"; return 0; }; printf '%s' "$raw" | base64 --decode > "$c" 2>/dev/null && validate_key "$c" && { rm -f "$a" "$b" "$c"; return 0; }; rm -f "$a" "$b" "$c"; return 1; }
          try_slot "${PC_PROD_SSH_KEY:-}" || try_slot "${PC_PROD_SSH_PRIVATE_KEY:-}" || try_slot "${VPS_SSH_KEY:-}"
          scan="$(mktemp)"; match="$(mktemp)"; ready=0
          for attempt in 1 2 3; do : > "$scan"; : > "$match"; ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null | sort -u > "$scan" || true; while IFS= read -r line; do [[ -n "$line" ]] || continue; fp="$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)"; [[ "$fp" != "$expected" ]] || printf '%s\n' "$line" >> "$match"; done < "$scan"; sort -u -o "$match" "$match"; [[ "$(grep -c . "$match" || true)" == 1 ]] && { ready=1; break; }; ((attempt==3)) || sleep "$attempt"; done
          [[ "$ready" == 1 ]]; mv "$match" "$HOME/.ssh/known_hosts"; rm -f "$scan"; chmod 600 "$HOME/.ssh/known_hosts"
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "user=$user" >> "$GITHUB_OUTPUT"; echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Classify Web SMTP stage without DATA
        shell: bash
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -Eeuo pipefail
          safe="$(ssh -i "$HOME/.ssh/id_pc_prod" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER@$HOST" "bash -s -- '$SUBJECT_SHA'" 2>/dev/null <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"; [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; [[ "$(id -u)" -eq 0 ]]
          tmp="$(mktemp -d /root/pc-reviewer-web-smtp.XXXXXX)"; chmod 700 "$tmp"; trap 'rm -rf -- "$tmp"' EXIT
          mapfile -t web_ids < <(docker ps -q --filter 'label=com.docker.compose.service=web'); (( ${#web_ids[@]} == 1 )); web_id="${web_ids[0]}"; project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$web_id")"; [[ -n "$project" ]]
          mapfile -t api_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=api'); mapfile -t worker_ids < <(docker ps -q --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=auth-mail-worker'); (( ${#api_ids[@]} == 1 && ${#worker_ids[@]} == 1 )); api_id="${api_ids[0]}"; worker_id="${worker_ids[0]}"
          api_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_id")"; web_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_id")"; worker_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$worker_id")"; [[ "$api_rev" == "$expected_sha" && "$web_rev" == "$expected_sha" && "$worker_rev" == "$expected_sha" ]]
          reviewer="$(docker exec -i "$api_id" /nodejs/bin/node --input-type=commonjs - <<'NODE'
          const {PrismaClient}=require('@prisma/client'); let db;
          (async()=>{const url=String(process.env.STAFF_DATABASE_URL||'').trim(); if(!url) throw new Error('DB_URL'); db=new PrismaClient({datasources:{db:{url}}}); const rows=await db.$queryRawUnsafe("SELECT auth.staff_reviewer_password_reset_subject() AS email"); if(rows.length!==1) throw new Error('CARDINALITY'); const e=String(rows[0].email||''); if(!/^[^\\s@]{1,64}@[^\\s@]{1,189}$/.test(e)) throw new Error('SUBJECT'); process.stdout.write(e);})().catch(()=>process.exitCode=1).finally(async()=>{if(db) await db.$disconnect().catch(()=>{});});
          NODE
          )"; [[ "$reviewer" =~ ^[^[:space:]@]{1,64}@[^[:space:]@]{1,189}$ ]]; printf '%s' "$reviewer" > "$tmp/recipient"; unset reviewer; chmod 600 "$tmp/recipient"
          docker exec -i "$web_id" /nodejs/bin/node --input-type=commonjs - <<'NODE' > "$tmp/config.json"
          const out={host:String(process.env.PC_SMTP_HOST||'').trim(),port:String(process.env.PC_SMTP_PORT||'465').trim(),user:String(process.env.PC_SMTP_USER||''),pass:String(process.env.PC_SMTP_PASS||''),from:String(process.env.PC_MAIL_FROM||process.env.PC_SMTP_USER||'').trim()}; process.stdout.write(JSON.stringify(out));
          NODE
          chmod 600 "$tmp/config.json"
          python3 - "$tmp/config.json" "$tmp/recipient" <<'PY'
          import base64,json,re,socket,ssl,sys
          cfg=json.load(open(sys.argv[1],encoding='utf-8')); recipient=open(sys.argv[2],encoding='utf-8').read().strip(); stage='BOOTSTRAP'; code='NONE'; enhanced='NONE'; reason='NONE'; last=''
          def mailbox(v):
              v=str(v or '').strip()
              if v.count('@')!=1 or re.search(r'[\r\n\x00<> ]',v): raise ValueError('mailbox')
              local,domain=v.rsplit('@',1); local.encode('ascii'); domain=domain.encode('idna').decode('ascii').lower()
              if not local or not re.fullmatch(r'[\x21-\x7e]+',local) or not re.fullmatch(r'[A-Za-z0-9.-]+',domain): raise ValueError('mailbox')
              return f'{local}@{domain}'
          def classify(text,c):
              m=re.search(r'(?<![0-9])([245]\.[0-9]\.[0-9]{1,3})(?![0-9])',str(text or '')[:1024]); e=m.group(1) if m else 'NONE'; low=str(text or '').lower()
              if c!='451': return e,'NONE'
              for label,needles in [('RATE_LIMIT',('rate limit','too many','quota','throttl')),('GREYLIST_TEMPORARY',('greylist','graylist')),('ANTI_ABUSE_POLICY',('spam','policy','blocked','blacklist','reputation','abuse')),('DESTINATION_ROUTING_TEMPFAIL',('dns','mx ','resolve','routing','route','host','network','connect')),('RECIPIENT_TEMPFAIL',('mailbox','recipient','user ','account')),('TEMPORARY_POLICY',('try again','temporar','later','defer'))]:
                  if any(n in low for n in needles): return e,label
              return e,'UNCLASSIFIED_451'
          def readresp(f):
              global last
              first=f.readline(4096)
              if not first or len(first)<4 or not first[:3].isdigit(): raise RuntimeError('RESPONSE_INVALID')
              c=first[:3].decode('ascii'); final=first
              if first[3:4]==b'-':
                  while True:
                      line=f.readline(4096)
                      if not line: raise RuntimeError('RESPONSE_EOF')
                      final=line
                      if line.startswith(c.encode()+b' '): break
              last=final.decode('utf-8','replace').strip()[:1024]; return c
          def cmd(sock,f,text,expected):
              sock.sendall(text.encode('ascii')+b'\r\n'); c=readresp(f)
              if c not in expected: raise ValueError(c)
              return c
          try:
              host=str(cfg.get('host') or '').strip().lower(); port=int(str(cfg.get('port') or '465')); user=mailbox(cfg.get('user')); password=str(cfg.get('pass') or ''); sender=mailbox(cfg.get('from')); rcpt=mailbox(recipient)
              if host!='mail.hosting.reg.ru' or port!=465 or len(password)<8: raise RuntimeError('CONFIG_BOUNDARY')
              stage='TLS_CONNECT'; raw=socket.create_connection((host,port),timeout=15); sock=ssl.create_default_context().wrap_socket(raw,server_hostname=host); sock.settimeout(15); f=sock.makefile('rb')
              stage='GREETING'; code=readresp(f)
              if code!='220': raise ValueError(code)
              stage='EHLO'; code=cmd(sock,f,'EHLO xn----8sbjf4befbjgs9b.xn--p1ai',{'250'})
              stage='AUTH'; auth=base64.b64encode(('\x00'+user+'\x00'+password).encode()).decode(); code=cmd(sock,f,'AUTH PLAIN '+auth,{'235'})
              stage='MAIL_FROM'; code=cmd(sock,f,f'MAIL FROM:<{sender}>',{'250'})
              stage='RCPT_TO'; code=cmd(sock,f,f'RCPT TO:<{rcpt}>',{'250','251'})
              stage='PRE_DATA_COMPLETE'; code='NONE'; enhanced='NONE'; reason='NONE'
              try: cmd(sock,f,'RSET',{'250'}); cmd(sock,f,'QUIT',{'221'})
              except Exception: pass
              sock.close(); print('PROBE_RESULT=PASS')
          except ValueError as exc:
              c=str(exc); code=c if re.fullmatch(r'[2-5][0-9]{2}',c) else code; enhanced,reason=classify(last,code); print('PROBE_RESULT=FAIL')
          except Exception:
              print('PROBE_RESULT=FAIL')
          print(f'LAST_STAGE={stage}'); print(f'SMTP_CODE={code}'); print(f'ENHANCED_STATUS={enhanced}'); print(f'REASON_CLASS={reason}'); print('MAIL_SENT=NO'); print('PRODUCTION_MUTATION=NONE')
          PY
          REMOTE
          )"
          grep -E '^(PROBE_RESULT|LAST_STAGE|SMTP_CODE|ENHANCED_STATUS|REASON_CLASS|MAIL_SENT|PRODUCTION_MUTATION)=' <<< "$safe"
          grep -Fxq 'MAIL_SENT=NO' <<< "$safe"; grep -Fxq 'PRODUCTION_MUTATION=NONE' <<< "$safe"
