name: PC-CROP-08H Schema Synchronization

on:
  push:
    branches:
      - agent/pc-crop-08h-exchange-receipt
    paths:
      - '.github/workflows/pc-crop-08h.yml'
      - 'scripts/pc-crop-08h/sync-prisma-schema.mjs'
      - 'apps/api/prisma/schema.prisma'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-crop-08h-schema-sync
  cancel-in-progress: true

jobs:
  synchronize:
    name: Append exact additive Prisma model once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/pc-crop-08h-exchange-receipt
          fetch-depth: 0

      - name: Synchronize schema
        run: node scripts/pc-crop-08h/sync-prisma-schema.mjs

      - name: Commit synchronized model
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/prisma/schema.prisma; then
            echo 'Schema already synchronized.'
            exit 0
          fi
          git config user.name 'pc-crop-authority[bot]'
          git config user.email 'pc-crop-authority[bot]@users.noreply.github.com'
          git add apps/api/prisma/schema.prisma
          git commit -m 'PC-CROP-08H: synchronize Prisma exchange model'
          git push origin HEAD:agent/pc-crop-08h-exchange-receipt
